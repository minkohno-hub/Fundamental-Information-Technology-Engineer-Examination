name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main, claude/fe-exam-learning-app-nuiom6]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build content (schema, answer verification, duplicates)
        run: npm run content
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Release gate (1,000+ verified questions, coverage, docs)
        run: npm run check:release
      - name: Build app
        run: npx vite build
      - name: E2E tests (mobile and desktop Chromium, Firefox, WebKit, offline)
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
