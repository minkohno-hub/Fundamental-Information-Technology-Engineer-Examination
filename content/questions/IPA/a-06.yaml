questions:
  - id: IPA-R08-A-006
    topic: 6-1-1
    diff: 3
    noShuffle: true
    q: |
      図の回路の A 及び B に信号を入力したときに，Y に出力される信号のタイミングチャートとして，適切なものはどれか。

      （回路図とタイミングチャートを表に置き換えている。回路は NAND 回路 4 個で，丸付きの出力は否定を表す。）

      | 素子 | 種類 | 入力 1 | 入力 2 | 出力 |
      | --- | --- | --- | --- | --- |
      | G1 | NAND | A | A | P |
      | G2 | NAND | B | B | Q |
      | G3 | NAND | P | Q | R |
      | G4 | NAND | R | R | Y |

      各選択肢のタイミングチャートは，時間軸を点線で 7 区間(左から区間 1〜7)に分け，区間ごとの信号値(0 または 1)を A，B，Y の順に並べて示す。
    c:
      - "A：0 0 1 0 1 0 1，B：1 0 1 0 1 0 0，Y：1 1 0 1 0 1 1"
      - "A：0 1 0 0 0 1 0，B：0 0 0 1 0 1 0，Y：1 0 1 0 1 0 1"
      - "A：0 1 0 0 0 1 0，B：0 0 0 1 0 1 0，Y：0 1 0 1 0 0 0"
      - "A：0 0 1 0 1 0 1，B：1 0 1 0 1 0 0，Y：0 0 1 0 1 0 0"
    a: イ
    exp: "G1 と G2 は入力 2 本を同じ信号につないだ NAND なので NOT として働き，P＝¬A，Q＝¬B になる。G3 は P と Q の NAND で R＝¬(¬A・¬B)＝A+B(論理和)。G4 も NOT として働くので Y＝¬(A+B)，すなわち A と B の NOR である。A と B がともに 0 の区間だけ Y が 1，それ以外は 0 になる。"
    why:
      - "区間 1(A＝0，B＝1)で Y＝1 になっているが，NOR では 0 になるはずである。区間 7(A＝1，B＝0)も同様に誤り。"
      - "正解です。7 区間すべてで Y＝¬(A+B) と一致する。A，B がともに 0 の区間 1，3，5，7 だけ Y が 1 である。"
      - "区間 1(A＝B＝0)で Y＝0 になっているが，NOR では 1 になるはずである。A，B の一方だけが 1 の区間で Y が 1 になるのは排他的論理和の動作である。"
      - "区間 2，4，6(A＝B＝0)で Y が 0 になっており誤り。Y が 1 になるのは A，B がともに 1 の区間だけで，論理積(AND)の動作である。"
    know: "NAND の 2 入力を同じ信号につなぐと NOT になり，NAND の入力側に NOT を付けると OR になる。NAND だけで任意の論理回路を構成できる。"
    terms: ["論理回路"]
    verify: { manual: "4 個の NAND を区間ごとに評価して Y を計算し，A，B が各選択肢の入力と同じ区間で Y＝NOR(A,B) と全 7 区間一致するのは 2 番目の選択肢だけであることを確認(選択肢 1 は区間 1 と 7 で不一致(NAND の出力)，選択肢 3 は XOR，選択肢 4 は AND の出力になる。スクリプトで全選択肢を評価済み)" }
