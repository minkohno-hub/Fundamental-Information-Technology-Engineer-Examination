questions:
  - id: IPA-R05-A-018
    topic: 19-2-3
    diff: 2
    noShuffle: true
    q: "イノベータ理論では，消費者を新製品の購入時期によって，イノベータ，アーリーアダプタ，アーリーマジョリティ，レイトマジョリティ，ラガードの五つに分類する。アーリーアダプタの説明として，適切なものはどれか。"
    c:
      - "新しい製品及び新技術の採用には懐疑的で，周囲の大多数が採用している場面を見てから採用する層"
      - "新商品，サービスなどを，リスクを恐れず最も早い段階で受容する層"
      - "新商品，サービスなどを早期に受け入れ，消費者に大きな影響を与える層であり，流行に敏感で，自ら情報収集を行い判断する層"
      - "世の中の動きに関心が薄く，流行が一般化してからそれを採用することが多い層であり，場合によっては不採用を貫く，最も保守的な層"
    a: ウ
    exp: "アーリーアダプタは，イノベータに次いで新商品を早期に受け入れ，他の消費者への影響力が大きいオピニオンリーダー的な層である。"
    why:
      - "これはレイトマジョリティの説明である。"
      - "これはイノベータの説明である。"
      - "正解です。早期に受容し，影響力が大きい層がアーリーアダプタである。"
      - "これはラガードの説明である。"
    know: "普及率 16% 付近にあるキャズム(溝)を越えることがヒット商品の条件とされる。"
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 18 }
  - id: IPA-R06-A-016
    topic: 19-1-2
    diff: 1
    noShuffle: true
    q: "コアコンピタンスを説明したものはどれか。"
    c:
      - "経営活動における基本精神や行動指針"
      - "事業戦略の遂行によって達成すべき到達目標"
      - "自社を取り巻く環境に関するビジネス上の機会と脅威"
      - "他社との競争優位の源泉となる経営資源及び企業能力"
    a: エ
    exp: "コアコンピタンスは，他社に真似されにくい自社独自の中核となる強みで，競争優位の源泉となる経営資源や企業能力のことである。"
    why:
      - "これは経営理念の説明である。"
      - "これは経営目標の説明である。"
      - "これはSWOT分析の外部環境(機会と脅威)の説明である。"
      - "正解です。競争優位の源泉となる自社の強みがコアコンピタンスである。"
    know: "SWOT 分析では，強みと弱みが内部環境，機会と脅威が外部環境である。"
    terms: ["コアコンピタンス", "SWOT分析"]
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 16 }
  - id: IPA-R06-A-017
    topic: 19-1-3-1
    diff: 1
    noShuffle: true
    q: "マーケティング戦略におけるブルーオーシャンの説明として，適切なものはどれか。"
    c:
      - "競争が存在していない未知の市場"
      - "コモディティ化が進んだ既存の市場"
      - "新事業のアイディアを実際のビジネスに育成するまでの期間"
      - "製品開発したものを市場化する過程に横たわっている障壁"
    a: ア
    exp: "ブルーオーシャンは，競合のいない未開拓の市場空間を指す。競争が激しい既存市場はレッドオーシャンと呼ばれる。"
    why:
      - "正解です。競争のない未知の市場がブルーオーシャンである。"
      - "これは競争が激しいレッドオーシャンの説明に近い。"
      - "これは死の谷(デスバレー)の期間に近い説明である。"
      - "これはダーウィンの海に関する説明に近い。"
    know: "ブルーオーシャン戦略では，差別化と低コストを同時に追求し，新しい市場を創る。"
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 17 }
  - id: IPA-R07-A-018
    topic: 19-2-3
    diff: 2
    noShuffle: true
    q: "物販事業において，ロングテールをビジネスとして成功させるために必要な施策はどれか。"
    c:
      - "多くの有名ブランド店が出店するショッピングモールの構築"
      - "交通の利便性が高い地域に対する，生活必需品を広く浅く取りそろえた出店計画"
      - "店舗で購入した商品を近隣地域に無償で配送するサービスの実施"
      - "豊富な品ぞろえと，在庫コストや配送費用を抑えるための大規模な物流センタの構築や活用"
    a: エ
    exp: "ロングテールは，売れ行きの少ない商品も多数そろえ，その売上の合計で大きな収益を得るモデルである。豊富な品ぞろえと，在庫・配送費用を抑える物流の仕組みが必要になる。"
    why:
      - "有名ブランドに絞るのは売れ筋中心で，ロングテールとは異なる。"
      - "生活必需品を広く浅くそろえるのは，ニッチ商品の品ぞろえとは異なる。"
      - "無償配送はコスト増で，ロングテールの成立条件ではない。"
      - "正解です。豊富な品ぞろえと低コストの物流がロングテールの条件である。"
    know: "ロングテールは Web 販売で在庫・陳列のコストが低いことで成立しやすい。"
    terms: ["ロングテール"]
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 18 }
  - id: IPA-R08-A-017
    topic: 19-2-3
    diff: 3
    noShuffle: true
    q: "サービス A～D の中で会員のリテンション率が最も高いものはどれか。なお，リテンションの対象は前月末から当月末まで継続して在籍した会員とし，当月新規会員は月末までの退会はないものとする。\n\n単位 人\n\n| サービス | 前月末会員数 | 当月新規会員数 | 当月末会員数 |\n|---|---|---|---|\n| A | 1,000 | 500 | 800 |\n| B | 1,000 | 200 | 800 |\n| C | 1,500 | 500 | 1,100 |\n| D | 1,500 | 1,000 | 1,800 |"
    c:
      - "サービス A"
      - "サービス B"
      - "サービス C"
      - "サービス D"
    a: イ
    exp: "継続会員数は，当月末会員数から当月新規会員数を引いて求める。リテンション率=継続会員数/前月末会員数で，A は 300/1,000=30％，B は 600/1,000=60％，C は 600/1,500=40％，D は 800/1,500 で約 53％。最も高いのは B。"
    why:
      - "A は(800-500)/1,000=30％で最も高くない。"
      - "正解です。(800-200)/1,000=60％で最も高い。"
      - "C は(1,100-500)/1,500=40％で最も高くない。"
      - "D は(1,800-1,000)/1,500 で約 53％。B の 60％より低い。"
    know: "リテンション率は継続率を表し，顧客の維持の指標になる。"
    terms: ["リテンション"]
    verify: { manual: "A 30%，B 60%，C 40%，D 約 53% を再計算して B が最大を確認" }
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 17, modified: true, modificationNote: "解説を本アプリで作成。表を Markdown の表に文字化。その他の問題文・選択肢は原文のまま" }
