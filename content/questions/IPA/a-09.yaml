questions:
  - id: IPA-R05-A-006
    topic: 9-2-3
    diff: 2
    noShuffle: true
    q: "次の関数従属を満足するとき，成立する推移的関数従属はどれか。ここで，“A → B”は B が A に関数従属していることを表し，“A→{B，C}”は，“A→B”かつ“A→C”が成立することを表す。\n\n〔関数従属〕\n\n{注文コード，商品コード}→{顧客注文数量，注文金額}\n注文コード→{注文日，顧客コード，注文担当者コード}\n商品コード→{商品名，仕入先コード，商品販売価格}\n仕入先コード→{仕入先名，仕入先住所，仕入担当者コード}\n顧客コード→{顧客名，顧客住所}"
    c:
      - "仕入先コード → 仕入担当者コード → 仕入先住所"
      - "商品コード → 仕入先コード → 商品販売価格"
      - "注文コード → 顧客コード → 顧客住所"
      - "注文コード → 商品コード → 顧客注文数量"
    a: ウ
    exp: "推移的関数従属は A→B かつ B→C が成り立つ連鎖である。注文コード→顧客コードと顧客コード→顧客住所がともに成り立つので，注文コード→顧客コード→顧客住所が成立する。"
    why:
      - "仕入担当者コードから仕入先住所への従属は与えられていない。"
      - "商品販売価格は商品コードに直接従属し，仕入先コードからの従属は与えられていない。"
      - "正解です。注文コード→顧客コード，顧客コード→顧客住所の連鎖が成立する。"
      - "注文コードから商品コードへの従属は与えられていない。"
    know: "推移的関数従属を取り除くと第 3 正規形になる。"
    terms: ["第3正規形"]
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 6 }
  - id: IPA-R05-A-007
    topic: 9-4-3
    diff: 1
    noShuffle: true
    q: "トランザクションが，データベースに対する更新処理を完全に行うか，全く処理しなかったかのように取り消すか，のどちらかの結果になることを保証する特性はどれか。"
    c:
      - "一貫性（consistency）"
      - "原子性（atomicity）"
      - "耐久性（durability）"
      - "独立性（isolation）"
    a: イ
    exp: "原子性は，トランザクションの処理が全て実行されるか，全く実行されなかった状態に戻されるかのどちらかになることを保証する ACID 特性である。"
    why:
      - "一貫性は，トランザクションの前後でデータの整合性が保たれることである。"
      - "正解です。全て実行するか全て取り消すかを保証するのが原子性である。"
      - "耐久性は，完了した更新が障害後も失われないことである。"
      - "独立性は，並行実行しても互いに影響しないことである。"
    know: "ACID は原子性，一貫性，独立性，耐久性の頭文字。"
    terms: ["ACID特性", "トランザクション"]
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 7 }
  - id: IPA-R06-A-007
    topic: 9-4-3
    diff: 1
    noShuffle: true
    q: "DBMS に実装すべき原子性（atomicity）を説明したものはどれか。"
    c:
      - "同一データベースに対する同一処理は，何度実行しても結果は同じである。"
      - "トランザクション完了後にハードウェア障害が発生しても，更新されたデータベースの内容は保証される。"
      - "トランザクション内の処理は，全てが実行されるか，全てが取り消されるかのいずれかである。"
      - "一つのトランザクションの処理結果は，他のトランザクション処理の影響を受けない。"
    a: ウ
    exp: "原子性は，トランザクション内の処理が全て実行されるか，全て取り消されるかのいずれかで，中途半端な状態を残さない性質である。"
    why:
      - "これは冪等性に近い説明で，原子性ではない。"
      - "これは耐久性の説明である。"
      - "正解です。全部実行か全部取消しのどちらかとなるのが原子性である。"
      - "これは独立性の説明である。"
    know: "原子性の実現にはロールバックなどを使う。"
    terms: ["ACID特性", "トランザクション"]
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 7 }
  - id: IPA-R06-A-015
    topic: 9-5-1
    diff: 2
    noShuffle: true
    q: "ビッグデータ分析の前段階として，非構造化データを構造化データに加工する処理を記述している事例はどれか。"
    c:
      - "関係データベースに蓄積された大量の財務データから必要な条件に合致するデータを抽出し，利用者が扱いやすい表計算ソフトウェアデータに加工する。"
      - "個人情報を含むビッグデータを更に利活用するために，特定の個人を識別することができないように匿名化加工する。"
      - "住所データ項目の中にある，“ヶ”と“が”の混在や，丁番地の表記不統一を，標準化された表記へ統一するために加工する。"
      - "ソーシャルメディアの口コミを機械学習によって単語ごとに分解し，要約を作り，分析可能なデータに加工し，関係データベースに保管する。"
    a: エ
    exp: "非構造化データ(文章など)を，単語への分解や要約で分析可能な形(構造化データ)に加工して関係データベースに保管するのが，非構造化から構造化への加工である。"
    why:
      - "すでに構造化されたデータを別形式に変換するだけである。"
      - "匿名化は個人を識別できなくする加工で，構造化とは別の目的である。"
      - "表記ゆれの統一はデータクレンジングで，すでに構造化されたデータの整備である。"
      - "正解です。文章の口コミを分析可能な構造化データに加工している。"
    know: "文章，画像，音声などが非構造化データの例である。"
    terms: ["非構造化データ", "データクレンジング", "ビッグデータ"]
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 15 }
  - id: IPA-R07-A-006
    topic: 9-3-2-2
    diff: 2
    noShuffle: true
    q: "“商品”表に対する SQL 文と同じ結果が得られる SELECT 文はどれか。\n\n商品\n\n| 商品 ID | 商品名称 | 仕入先 ID | 単価 |\n|---|---|---|---|\n| S001 | 冷蔵庫 | M001 | 155,000 |\n| S002 | 食器洗い機 | M002 | 85,000 |\n| S003 | 電子レンジ | M003 | 78,000 |\n| S004 | 炊飯器 | M003 | 32,000 |\n| S005 | コーヒーメーカー | M004 | 15,000 |\n| S006 | ホットプレート | M004 | 12,000 |\n\n〔SQL 文〕\n\n```\nSELECT * FROM 商品 WHERE 仕入先 ID IN ('M002', 'M004')\n```"
    c:
      - "SELECT * FROM 商品 WHERE 仕入先 ID = 'M002' AND 仕入先 ID = 'M004'"
      - "SELECT * FROM 商品 WHERE 仕入先 ID = 'M002'\nINTERSECT\nSELECT * FROM 商品 WHERE 仕入先 ID = 'M004'"
      - "SELECT * FROM 商品 WHERE 仕入先 ID = 'M002' OR 仕入先 ID = 'M004'"
      - "SELECT * FROM 商品 WHERE 仕入先 ID BETWEEN 'M002' AND 'M004'"
    a: ウ
    exp: "IN (M002, M004) は仕入先 ID が M002 または M004 に等しい行を選ぶ。これは OR で結んだ条件と同じで，S002，S005，S006 が得られる。"
    why:
      - "AND では一つの行の仕入先 ID が同時に二つの値になる必要があり，0 行になる。"
      - "INTERSECT は共通する行だけを返し，二つの条件に合う行はないので 0 行になる。"
      - "正解です。IN は OR で結んだ等値比較と同じ結果になる。"
      - "BETWEEN は M002 から M004 までの範囲を選ぶので，M003 の行も含まれてしまう。"
    know: "IN は複数の値のいずれかに一致する行を選択する演算子である。"
    terms: ["SQL"]
    verify: { manual: "IN は OR と等価で，S002，S005，S006 の 3 行が得られることを確認" }
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 6, modified: true, modificationNote: "解説を本アプリで作成。表を Markdown の表に文字化。その他の問題文・選択肢は原文のまま" }
  - id: IPA-R07-A-011
    topic: 9-2-2-1
    diff: 2
    noShuffle: true
    q: "E-R モデルにおけるエンティティの特徴はどれか。"
    c:
      - "エンティティとインスタンスとは，1 対 1 の対応関係をとる。"
      - "エンティティとなり得るものは，物的に実現するものである。"
      - "エンティティは，特性を表すための属性（アトリビュート）をもつ。"
      - "異なった種類のエンティティ間の関係は，主として状態遷移として表現される。"
    a: ウ
    exp: "エンティティは管理対象の事物の型で，その特性を表す属性(アトリビュート)をもつ。"
    why:
      - "エンティティ(型)とインスタンスは 1 対多の関係である。"
      - "エンティティは契約や注文などの概念的なものでもなり得る。"
      - "正解です。エンティティは特性を表す属性をもつ。"
      - "エンティティ間の関係はリレーションシップとして表現される。"
    know: "E-R 図ではエンティティを四角形，リレーションシップを線で表す。"
    terms: ["E-R図", "エンティティ"]
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 11 }
  - id: IPA-R08-A-007
    topic: 9-3-2-2
    diff: 3
    noShuffle: true
    q: "次の SQL 文によって定義され，値が格納されている“商品”表に対して，制約違反で実行エラーとなる SQL 文はどれか。\n\n〔SQL 文〕\n\n```\nCREATE TABLE 商品\n(商品コード CHAR(4) PRIMARY KEY, 商品名 VARCHAR(21),\n 仕入先コード CHAR(4), 仕入単価 INT, 在庫数 INT)\n```\n\n商品\n\n| 商品コード | 商品名 | 仕入先コード | 仕入単価 | 在庫数 |\n|---|---|---|---|---|\n| A111 | テレビ | S001 | 75,000 | 0 |\n| A222 | デジタルカメラ | S002 | 50,000 | 50 |\n| A333 | DVDプレーヤ | NULL | NULL | NULL |\n| A444 | 洗濯機 | S004 | 45,000 | 20 |"
    c:
      - "DELETE FROM 商品 WHERE 仕入先コード IS NULL"
      - "INSERT INTO 商品 VALUES ('A555', '空気清浄機', 'S005', 60000, 50)"
      - "UPDATE 商品 SET 商品コード = 'A666' WHERE 商品コード = 'A444'"
      - "UPDATE 商品 SET 商品コード = 'A777' WHERE 在庫数 >= 20"
    a: エ
    exp: "商品コードは主キーなので重複できない。在庫数が 20 以上の行は A222(50)と A444(20)の 2 行あり，両方を A777 にしようとして主キーの重複で制約違反になる。"
    why:
      - "NULL を含む行を 1 行削除するだけで，制約違反にならない。"
      - "A555 は既存の商品コードと重複せず，値の型も適合するので成功する。"
      - "A444 の 1 行だけを A666 に変更するので重複せず成功する。"
      - "正解です。2 行が同じ A777 になるため主キーの重複で実行エラーになる。"
    know: "主キーは一意かつ NULL 不可。UPDATE は WHERE に該当する全行に適用される。"
    terms: ["主キー", "SQL"]
    verify: { manual: "在庫数>=20 は A222 と A444 の 2 行で，同じ商品コードにすると主キー重複になることを確認" }
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 7, modified: true, modificationNote: "解説を本アプリで作成。表を Markdown の表に文字化。その他の問題文・選択肢は原文のまま" }
