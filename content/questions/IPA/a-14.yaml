questions:
  - id: IPA-R05-A-013
    topic: 14-6-3
    diff: 3
    noShuffle: true
    q: |
      図に示すとおりに作業を実施する予定であったが，作業 A で 1 日の遅れが生じた。各作業の費用増加率を表の値とするとき，当初の予定日数で終了するために掛かる増加費用を最も少なくするには，どの作業を短縮すべきか。ここで，費用増加率とは，作業を 1 日短縮するために要する増加費用のことである。

      （アローダイアグラムを表に置き換えている。結合点は 1〜6 の番号で表し，1 が開始，6 が終了である。）

      | 作業名 | 始点の結合点 | 終点の結合点 | 標準日数 | 費用増加率 |
      | --- | --- | --- | --- | --- |
      | A | 1 | 2 | 4 | 4 |
      | B | 2 | 3 | 6 | 6 |
      | C | 2 | 5 | 8 | 3 |
      | D | 2 | 4 | 4 | 2 |
      | E | 3 | 5 | 5 | 2.5 |
      | F | 4 | 5 | 4 | 2.5 |
      | G | 5 | 6 | 5 | 5 |
    c:
      - "B"
      - "C"
      - "D"
      - "E"
    a: エ
    exp: "各経路の日数は A→B→E→G が 4+6+5+5＝20 日，A→C→G が 4+8+5＝17 日，A→D→F→G が 4+4+4+5＝17 日で，クリティカルパスは A→B→E→G の 20 日である。A が 1 日遅れると 21 日になるので，当初の 20 日に戻すにはクリティカルパス上の作業を 1 日短縮する必要がある。候補は B(費用増加率 6)と E(2.5)で，安い E を短縮する。E を 1 日短縮しても A→B→E→G は 20 日になり，他の経路は 17 日のままなので，新たなクリティカルパスは生じない。"
    why:
      - "B はクリティカルパス上の作業で短縮すれば 20 日に戻るが，費用増加率が 6 で E の 2.5 より高い。"
      - "C はクリティカルパス上にないので，短縮しても全体の日数は変わらず，遅れを取り戻せない。"
      - "D はクリティカルパス上にないので，費用増加率が小さくても全体の日数は変わらず，遅れを取り戻せない。"
      - "正解です。クリティカルパス上の B と E のうち費用増加率が小さい E を 1 日短縮すれば，増加費用 2.5 で当初の 20 日に戻る。"
    know: "遅れを取り戻すには，クリティカルパス上の作業のうち費用増加率が最も小さいものから短縮する(クラッシング)。短縮の結果，別の経路が新たなクリティカルパスにならないかも確認する。"
    terms: ["アローダイアグラム", "クリティカルパス", "クラッシング"]
    verify: { manual: "全経路を列挙して最長経路 A-B-E-G＝20 日，A が 1 日遅れで 21 日を確認。短縮後の最長日数は B 短縮 20，C 短縮 21，D 短縮 21，E 短縮 20 日。20 日に戻るのは B と E だけで，費用増加率 6 と 2.5 の小さい E" }
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 13, modified: true, modificationNote: "解説を本アプリで作成。アローダイアグラムと費用増加率の表を，結合点番号付きの作業表に置き換えた。その他の問題文・選択肢は原文のまま" }
  - id: IPA-R06-A-013
    topic: 14-6-3
    diff: 2
    noShuffle: true
    q: |
      アローダイアグラムで表されるプロジェクトは，完了までに最少で何日を要するか。

      （図を表に置き換えている。結合点は 1〜7 の番号で表し，1 が開始，7 が終了である。ダミー作業は所要日数 0 の作業として表し，作業名は付かない。）

      | 作業名 | 始点の結合点 | 終点の結合点 | 所要日数 |
      | --- | --- | --- | --- |
      | A | 1 | 2 | 30 |
      | B | 2 | 3 | 5 |
      | C | 2 | 4 | 30 |
      | D | 2 | 5 | 20 |
      | ダミー | 3 | 4 | 0 |
      | ダミー | 4 | 5 | 0 |
      | E | 3 | 6 | 40 |
      | F | 4 | 6 | 25 |
      | G | 5 | 6 | 30 |
      | H | 6 | 7 | 30 |
    c:
      - "105"
      - "115"
      - "120"
      - "125"
    a: ウ
    exp: "各結合点の最早結合点時刻を前から求める。結合点 2 は 30，結合点 3 は 30+5＝35，結合点 4 は max(30+30，35+0)＝60，結合点 5 は max(30+20，60+0)＝60，結合点 6 は max(35+40，60+25，60+30)＝90，結合点 7 は 90+30＝120 である。最長経路は A→C→(ダミー)→G→H で 30+30+30+30＝120 日である。"
    why:
      - "A→B→E→H の 30+5+40+30＝105 日は最長経路ではない。最長経路は 120 日なので，この日数では完了できない。"
      - "A→C→F→H の 30+30+25+30＝115 日は最長経路ではない。最長経路は 120 日なので，この日数では完了できない。"
      - "正解です。最長経路 A→C→(ダミー)→G→H の 30+30+30+30＝120 日が最短の所要日数になる。"
      - "125 日になる経路はない。ダミー作業の所要日数は 0 なので，加算してはいけない。"
    know: "ダミー作業は作業の順序関係だけを表し，所要日数は 0 である。結合点に入る作業のうち最も遅く終わるものが，その結合点の最早時刻を決める。"
    terms: ["アローダイアグラム", "クリティカルパス"]
    verify: { value: '30+30+30+30' }
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 13, modified: true, modificationNote: "解説を本アプリで作成。アローダイアグラムを，結合点番号付きの作業表に置き換えた。その他の問題文・選択肢は原文のまま" }
  - id: IPA-R07-A-014
    topic: 14-6-3
    diff: 3
    noShuffle: true
    q: |
      図は，あるプロジェクトの作業 A 〜 I とその作業日数を表している。このプロジェクトの最短所要日数は何日か。

      （アローダイアグラムを表に置き換えている。結合点は 1〜8 の番号で表し，1 が開始，8 が終了である。ダミー作業は所要日数 0 の作業として表し，作業名は付かない。）

      | 作業名 | 始点の結合点 | 終点の結合点 | 作業日数 |
      | --- | --- | --- | --- |
      | A | 1 | 2 | 3 |
      | B | 2 | 4 | 6 |
      | E | 2 | 3 | 5 |
      | ダミー | 3 | 4 | 0 |
      | F | 2 | 6 | 14 |
      | G | 4 | 5 | 11 |
      | ダミー | 5 | 6 | 0 |
      | C | 4 | 6 | 8 |
      | H | 4 | 7 | 15 |
      | D | 6 | 7 | 6 |
      | I | 7 | 8 | 5 |
    c:
      - "27"
      - "28"
      - "29"
      - "31"
    a: エ
    exp: "各結合点の最早結合点時刻を前から求める。結合点 2 は 3，結合点 3 は 3+5＝8，結合点 4 は max(3+6，8+0)＝9，結合点 5 は 9+11＝20，結合点 6 は max(3+14，9+8，20+0)＝20，結合点 7 は max(20+6，9+15)＝26，結合点 8 は 26+5＝31 である。最長経路は A→B→G→(ダミー)→D→I で 3+6+11+6+5＝31 日である。"
    why:
      - "A→E→(ダミー)→C→D→I の 3+5+8+6+5＝27 日などは最長経路ではない。最長経路は 31 日である。"
      - "A→F→D→I の 3+14+6+5＝28 日は最長経路ではない。最長経路は 31 日なので，この日数では完了できない。"
      - "A→B→H→I の 3+6+15+5＝29 日は最長経路ではない。最長経路は 31 日なので，この日数では完了できない。"
      - "正解です。最長経路 A→B→G→(ダミー)→D→I の 3+6+11+6+5＝31 日が最短の所要日数になる。"
    know: "複数の作業が合流する結合点では，最も遅く終わる作業で最早結合点時刻が決まる。H の経路(3+6+15+5＝29)や F の経路(3+14+6+5＝28)より，G を通る経路が長い。"
    terms: ["アローダイアグラム", "クリティカルパス"]
    verify: { value: '3+6+11+6+5' }
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 14, modified: true, modificationNote: "解説を本アプリで作成。アローダイアグラムを，結合点番号付きの作業表に置き換えた。その他の問題文・選択肢は原文のまま" }
  - id: IPA-R08-A-012
    topic: 14-6-3
    diff: 2
    noShuffle: true
    q: "バーンダウンチャートの使い方として，適切なものはどれか。"
    c:
      - "縦軸を完成した成果物の総量，横軸を時間とし，プロジェクトが進むに従って完成した成果物の総量が増加する様子を確認する。"
      - "縦軸を残課題の総数，横軸を時間とし，プロジェクトが進むに従って残課題の総量が増減する様子を確認する。"
      - "縦軸を残作業の量，横軸を時間とし，プロジェクトが進むに従って残作業の量が減少する様子を確認する。"
      - "縦軸を延べ工数，横軸を時間とし，プロジェクトが進むに従って延べ工数が増加する様子を確認する。"
    a: ウ
    exp: "バーンダウンチャートは，縦軸に残作業量，横軸に時間をとり，作業が進んで残りが減っていく様子を見て進捗を確認する図である。"
    why:
      - "成果物の総量が増える様子を見る図は，バーアップチャートに近い。"
      - "残課題が増減する様子を見る図は，課題管理に使う図に近い。"
      - "正解です。残作業の量が時間とともに減る様子を確認するのがバーンダウンチャートである。"
      - "延べ工数の増加を見る図はコスト・工数の累積グラフである。"
    know: "スクラムではスプリントやリリースの残作業を見える化するために使う。"
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 12 }
  - id: IPA-R08-A-013
    topic: 14-6-3
    diff: 2
    noShuffle: true
    q: "あるシステム開発プロジェクトの進捗が遅延したので，クリティカルパス上の作業への投入工数を増やすことによって遅延の解消を図った。このとき適用した，所要期間を短縮するための手法を何と呼ぶか。"
    c:
      - "クラッシング"
      - "コーチング"
      - "ファストトラッキング"
      - "メンタリング"
    a: ア
    exp: "クラッシングは，クリティカルパス上の作業に資源(要員など)を追加投入して，コスト増と引換えに所要期間を短縮する手法である。"
    why:
      - "正解です。資源を追加して期間を短縮するのがクラッシングである。"
      - "コーチングは対話によって相手の目標達成を支援する手法である。"
      - "ファストトラッキングは順番に行う作業を並行して実施し期間を短縮する手法である。"
      - "メンタリングは経験者が助言によって人材の成長を支援する手法である。"
    know: "クラッシングはコスト増，ファストトラッキングは手戻りリスク増が代償になる。"
    terms: ["クラッシング", "ファストトラッキング", "クリティカルパス"]
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 13 }
