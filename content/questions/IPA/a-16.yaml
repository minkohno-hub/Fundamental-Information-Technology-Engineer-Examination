questions:
  - id: IPA-R05-A-014
    topic: 16-1-9
    diff: 2
    noShuffle: true
    q: "A 社では，従業員が自宅の PC からインターネット経由で自社のネットワークに接続して仕事を行うテレワーキングの実施を計画している。A 社が定めたテレワーキング運用規程について，情報セキュリティ管理基準（平成 28 年）に従って監査を実施した。判明した事項のうち，監査人が，指摘事項として監査報告書に記載すべきものはどれか。"
    c:
      - "テレワーキング運用規程に従うことを条件に，全ての従業員が利用できる。"
      - "テレワーキングで従業員が使用する PC は，A 社から支給されたものに限定する。"
      - "テレワーキングで使用する PC へのマルウェア対策ソフト導入の要不要は，従業員それぞれが判断する。"
      - "テレワーキングで使用する PC を，従業員の家族に使用させない。"
    a: ウ
    exp: "テレワーキングで使う PC のマルウェア対策は組織として統一して実施すべきで，導入の要否を従業員任せにするのは管理上の不備である。"
    why:
      - "規程に従うことを条件にしており，問題とは言えない。"
      - "会社支給の PC に限定するのは，管理を強める適切な統制である。"
      - "正解です。マルウェア対策を従業員の判断に任せるのは不備で，指摘事項になる。"
      - "家族に使用させないのは，情報漏えいを防ぐ適切な統制である。"
    know: "監査では，統制の不備(リスクに対して手当がない点)を指摘事項とする。"
    terms: ["システム監査"]
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 14 }
  - id: IPA-R07-A-015
    topic: 16-1-9
    diff: 2
    noShuffle: true
    q: "サーバ室の物理的な安全対策の状況について，情報セキュリティ管理基準（平成 28 年）に照らして，情報セキュリティ監査を行って判明した状況のうち，監査人が，指摘事項として監査報告書に記載すべきものはどれか。"
    c:
      - "サーバが設置されている施設の無人領域では，営業時間中でも，警報装置が作動するようになっている。"
      - "サーバ室に非常口，避難器具，誘導灯などを設置している。"
      - "社外からサーバ室へ直接出入りするドアを設置しているが，出入りを考慮して常時施錠していない。"
      - "場所が分からないように，サーバ室の所在を室外に表示していない。"
    a: ウ
    exp: "社外から直接出入りできるドアを常時施錠しないのは，不正侵入を許す物理的な不備であり，指摘事項となる。"
    why:
      - "無人領域で警報装置が作動するのは適切な対策である。"
      - "非常口や避難器具の設置は安全面で適切である。"
      - "正解です。社外から直接出入りできるドアを常時施錠しないのは不備である。"
      - "サーバ室の所在を表示しないのは適切な対策である。"
    know: "物理的対策には入退室管理，施錠，監視，耐震・防火などがある。"
    terms: ["システム監査", "入退室管理"]
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 15 }
  - id: IPA-R08-A-015
    topic: 16-1-1
    diff: 2
    noShuffle: true
    q: "内部監査部門が，情報システム部門に対するシステム監査を経営者から指示されたとき，システム監査人の行為として，適切なものはどれか。"
    c:
      - "監査報告書に記載した改善提案に対して改善計画を策定した上で，実行する。"
      - "基幹システムを開発し，保守を行っている外部事業者に，当該システム監査を委託する。"
      - "経営者がどのようなニーズを有しているかを十分に把握した上で，システム監査の目的と対象範囲を決定する。"
      - "情報システム部門の在籍者を監査メンバとして選定する。"
    a: ウ
    exp: "システム監査人は，経営者のニーズを十分に把握したうえで，監査の目的と対象範囲を決定する。監査人には独立性が求められ，監査対象の改善の実行や関係者による監査は適切でない。"
    why:
      - "改善計画の策定・実行は被監査側の責任で，監査人の独立性を損なう。"
      - "開発・保守を担う事業者に監査を委託すると，独立性が保てない。"
      - "正解です。経営者のニーズを把握して目的と対象範囲を決定する。"
      - "監査対象部門の在籍者を監査メンバにすると，独立性が保てない。"
    know: "システム監査人には，監査対象から独立した立場(独立性)と客観性が求められる。"
    terms: ["システム監査人", "独立性"]
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 15 }
