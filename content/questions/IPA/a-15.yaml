questions:
  - id: IPA-R06-A-014
    topic: 15-2-13-3
    diff: 2
    noShuffle: true
    q: "システムの開発部門と運用部門が別々に組織化されているとき，システム開発を伴う新規サービスの設計及び移行を円滑かつ効果的に進めるための方法のうち，適切なものはどれか。"
    c:
      - "運用テストの完了後に，開発部門がシステム仕様と運用方法を運用部門に説明する。"
      - "運用テストは，開発部門の支援を受けずに，運用部門だけで実施する。"
      - "運用部門からもシステムの運用に関わる要件の抽出に積極的に参加する。"
      - "開発部門は運用テストを実施して，運用マニュアルを作成し，運用部門に引き渡す。"
    a: ウ
    exp: "運用上の要件は設計の早い段階で反映しないと移行時に手戻りが生じる。運用部門が要件抽出から積極的に参加することで，円滑な設計と移行ができる。"
    why:
      - "運用テスト後の説明では遅く，運用上の問題が手戻りになる。"
      - "開発部門の支援なしでは，システムの不明点を解消しにくい。"
      - "正解です。運用の要件を早期に反映できるので移行が円滑になる。"
      - "運用部門が関与せずに引き渡すと，運用の実態に合わないおそれがある。"
    know: "開発と運用が連携する考え方に DevOps がある。"
    terms: ["DevOps"]
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 14 }
