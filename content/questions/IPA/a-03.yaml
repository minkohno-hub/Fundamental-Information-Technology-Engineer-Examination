questions:
  - id: IPA-R05-A-003
    topic: 3-2-4
    diff: 2
    noShuffle: true
    q: "コンピュータの高速化技術の一つであるメモリインタリーブに関する記述として，適切なものはどれか。"
    c:
      - "主記憶と入出力装置，又は主記憶同士のデータの受渡しを CPU 経由でなく直接やり取りする方式"
      - "主記憶にデータを送り出す際に，データをキャッシュに書き込み，キャッシュがあふれたときに主記憶へ書き込む方式"
      - "主記憶のデータの一部をキャッシュにコピーすることによって，レジスタと主記憶とのアクセス速度の差を縮める方式"
      - "主記憶を複数の独立して動作するグループに分けて，各グループに並列にアクセスする方式"
    a: エ
    exp: "メモリインタリーブは，主記憶を複数のバンクに分け，連続するアドレスを別々のバンクに割り当てて並列にアクセスすることで実効的なアクセス速度を上げる方式である。"
    why:
      - "これは DMA(ダイレクトメモリアクセス)の説明である。"
      - "これはライトバック方式のキャッシュの説明である。"
      - "これはキャッシュメモリの目的の説明である。"
      - "正解です。主記憶を複数のバンクに分けて並列アクセスするのがメモリインタリーブである。"
    know: "バンクを交互にアクセスすることで，一つのバンクの回復時間中に別のバンクを読み書きできる。"
    terms: ["メモリインタリーブ", "DMA", "キャッシュメモリ"]
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 3 }
  - id: IPA-R06-A-003
    topic: 3-2-3
    diff: 3
    noShuffle: true
    q: "CPU X と CPU Y は，キャッシュメモリ(256k バイト)と主記憶(256M バイト)を備える同じ構成で，表に示すようにキャッシュメモリと主記憶のアクセス時間だけが異なり，他の条件は同じである。\n\n表 アクセス時間（単位 ナノ秒）\n\n| | CPU X | CPU Y |\n|---|---|---|\n| キャッシュメモリ | 40 | 20 |\n| 主記憶 | 400 | 580 |\n\nあるプログラムを CPU X と Y とでそれぞれ実行したところ，両者の処理時間が等しかった。このとき，キャッシュメモリのヒット率は幾らか。ここで，CPU 以外の処理による影響はないものとする。"
    c:
      - "0.75"
      - "0.90"
      - "0.95"
      - "0.96"
    a: イ
    exp: "ヒット率を h とすると，実効アクセス時間は X が 40h+400(1-h)，Y が 20h+580(1-h)。両者が等しいので 400-360h=580-560h，200h=180 より h=0.9。"
    why:
      - "0.75 を代入すると X と Y の実効アクセス時間が一致しない。"
      - "正解です。400-360h=580-560h を解くと h=0.9 になる。"
      - "0.95 を代入すると X と Y の実効アクセス時間が一致しない。"
      - "0.96 を代入すると X と Y の実効アクセス時間が一致しない。"
    know: "実効アクセス時間=ヒット率×キャッシュ時間+(1-ヒット率)×主記憶時間。"
    terms: ["キャッシュメモリ", "ヒット率", "実効アクセス時間"]
    verify: { value: "(580-400)/(560-360)" }
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 3, modified: true, modificationNote: "解説を本アプリで作成。図を省き，表のみで条件を記載。その他の問題文・選択肢は原文のまま" }
  - id: IPA-R08-A-003
    topic: 3-1-3
    diff: 1
    noShuffle: true
    q: "プロセッサの一つである GPU の特徴として，適切なものはどれか。"
    c:
      - "OS 及び他のハードウェアから独立して機能し，暗号キーなどの情報を安全に管理する。"
      - "並列に動作する多数の浮動小数点演算ユニットによって，高速な 3D 演算ができる。"
      - "目的に応じて半導体デバイス内部の論理回路を再構成できる。"
      - "量子ビットによって 0 と 1 を重ね合わせた状態を計算に使うことができる。"
    a: イ
    exp: "GPU は並列に動作する多数の演算ユニットをもち，3D グラフィックスや機械学習のような大量の浮動小数点演算を高速に処理できる。"
    why:
      - "これは TPM などのセキュリティチップの説明である。"
      - "正解です。多数の演算ユニットで並列処理するのが GPU である。"
      - "これは FPGA の説明である。"
      - "これは量子コンピュータの説明である。"
    know: "GPU は画像処理のほか，深層学習の計算にも使われる。"
    terms: ["GPU", "FPGA"]
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 3 }
