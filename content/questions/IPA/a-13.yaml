questions:
  - id: IPA-R05-A-012
    topic: 13-1-1-2
    diff: 1
    noShuffle: true
    q: "アジャイル開発手法のスクラムにおいて，開発チームの全員が 1 人ずつ“昨日やったこと”，“今日やること”，“障害になっていること”などを話し，全員でプロジェクトの状況を共有するイベントはどれか。"
    c:
      - "スプリントプランニング"
      - "スプリントレビュー"
      - "デイリースクラム"
      - "レトロスペクティブ"
    a: ウ
    exp: "デイリースクラムは，開発チームが毎日短時間で，進捗や今日の計画，障害を共有するスクラムのイベントである。"
    why:
      - "スプリントプランニングはスプリントで行う作業を計画するイベントである。"
      - "スプリントレビューはスプリントの成果物を確認するイベントである。"
      - "正解です。毎日の状況共有がデイリースクラムである。"
      - "レトロスペクティブはスプリントの進め方を振り返り改善するイベントである。"
    know: "デイリースクラムの時間は 15 分以内が目安である。"
    terms: ["スクラム"]
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 12 }
  - id: IPA-R06-A-005
    topic: 13-1-1-7
    diff: 2
    noShuffle: true
    q: "複数の Web サービスの入出力処理を連結させて新たなサービスを提供する，“ロジックマッシュアップ”の例はどれか。"
    c:
      - "利用者が選択した飲食店情報のページを表示する際に，他の Web サービスが提供する地図コンテンツをアクセスマップとして表示する。"
      - "利用者が選択した投資商品の情報を表示する際に，関連する経済指標のデータを複数の Web サービスから取得し，グラフに加工して表示する。"
      - "利用者が入力した予算の範囲で宿泊可能な施設のリストを他の Web サービスから取得し，それらの宿泊施設の空室状況を別の Web サービスから取得して表示する。"
      - "利用者がマウスのドラッグで地図を操作した際に，Web ページ全体ではなく一部を読み直すことによって地図をスクロールして表示する。"
    a: ウ
    exp: "ロジックマッシュアップは，あるサービスの出力を別のサービスの入力に渡すように連結して処理する方式である。宿泊施設リストの出力を空室状況の問合せの入力に使う例が該当する。"
    why:
      - "地図コンテンツを表示に組み込むだけで，コンテンツマッシュアップの例である。"
      - "複数サービスのデータを集めて加工するデータマッシュアップに近く，入出力の連結ではない。"
      - "正解です。一つ目のサービスの出力を二つ目のサービスの入力に連結している。"
      - "Ajax による部分更新の説明で，マッシュアップではない。"
    know: "マッシュアップにはコンテンツ，データ，ロジックなどの種類がある。"
    terms: ["マッシュアップ", "Ajax"]
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 5 }
  - id: IPA-R06-A-012
    topic: 13-1-1-2
    diff: 1
    noShuffle: true
    q: "アジャイル開発手法の一つであるスクラムで定義され，スプリントで実施するイベントのうち，毎日決まった時間に決まった場所で行い，開発チームの全員が前回からの進捗状況や今後の作業計画を共有するものはどれか。"
    c:
      - "スプリントプランニング"
      - "スプリントレトロスペクティブ"
      - "スプリントレビュー"
      - "デイリースクラム"
    a: エ
    exp: "デイリースクラムは，開発チームが毎日同じ時間・場所で短時間行い，進捗と今後の作業計画を共有するイベントである。"
    why:
      - "スプリントプランニングはスプリントの初めに作業を計画するイベントである。"
      - "スプリントレトロスペクティブはスプリントの終わりに進め方を振り返る。"
      - "スプリントレビューは成果物を確認し，フィードバックを得る。"
      - "正解です。毎日行う進捗共有がデイリースクラムである。"
    know: "スプリントレビューでは成果物の確認，レトロスペクティブではプロセスの改善を行う。"
    terms: ["スクラム"]
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 12 }
  - id: IPA-R07-A-005
    topic: 13-1-1-4
    diff: 2
    noShuffle: true
    q: "ローコード開発ツールを用いたソフトウェア開発の説明はどれか。"
    c:
      - "アプリケーションソフトウェアの開発基盤の上で，用意された部品やテンプレートを GUI を用いた操作で組み合わせたり，必要に応じて一部の処理のソースコードを記述したりすることによって，アプリケーションソフトウェアを作成する。"
      - "アプリケーションソフトウェアの開発基盤の上で，用意された部品やテンプレートを GUI を用いた操作で組み合わせるだけで，ソースコードを記述せずに，アプリケーションソフトウェアを作成する。"
      - "アプリケーションソフトウェアの定型的な枠組みを参照して，独自の処理のソースコードを記述することによって，アプリケーションソフトウェアを作成する。"
      - "利用者がシステムを利用して行う作業を自動化ツールに代行させるために，利用者によるシステムの操作手順をツールに登録する。"
    a: ア
    exp: "ローコード開発は，部品やテンプレートを GUI で組み合わせ，必要な部分だけソースコードを書いてアプリケーションを作成する開発手法である。"
    why:
      - "正解です。GUI での組合せに加え，必要に応じて一部コードを書くのがローコードである。"
      - "コードを一切書かないのはノーコード開発の説明である。"
      - "定型的な枠組みを使ってコードを書くのはフレームワーク利用の説明である。"
      - "操作手順を登録して代行させるのは RPA の説明である。"
    know: "ノーコードは非エンジニア向け，ローコードは一部の記述で拡張性を確保できる。"
    terms: ["ローコード開発", "ノーコード開発", "RPA"]
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 5 }
  - id: IPA-R07-A-013
    topic: 13-1-1-2
    diff: 1
    noShuffle: true
    q: "アジャイル開発手法の一つであるスクラムにおいて，プロダクトバックログアイテムの内容や並び順を決定する役割をもつのは誰か。"
    c:
      - "開発者"
      - "顧客"
      - "スクラムマスタ"
      - "プロダクトオーナ"
    a: エ
    exp: "プロダクトオーナは，プロダクトの価値を最大化する責任をもち，プロダクトバックログの内容と優先順位(並び順)を決定する。"
    why:
      - "開発者はスプリントで成果物を作る役割である。"
      - "顧客はステークホルダであり，バックログの内容や順序を決定する役割ではない。"
      - "スクラムマスタはスクラムの実践を支援する役割である。"
      - "正解です。バックログの内容と並び順を決めるのはプロダクトオーナである。"
    know: "スクラムチームはプロダクトオーナ，スクラムマスタ，開発者で構成する。"
    terms: ["スクラム", "プロダクトバックログ"]
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 13 }
