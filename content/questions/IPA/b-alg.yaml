  - id: IPA-R07-B-003
    topic: [B3, 2-1-2-3]
    diff: 2
    q: |
      次のプログラム中の【a】と【b】に入れる正しい答えの組合せを，解答群の中から選べ。ここで，配列の要素番号は 1 から始まる。

      関数 push は，引数で与えられた整数をスタックに格納する。格納できた場合は true を返し，格納できなかった場合は false を返す。

      関数 pop は，スタックから値を取り出して返す。スタックが空のときは未定義の値を返す。

      スタックを，要素数が 4 である大域の整数型の配列 stack，及び次に値を格納する位置を示す大域の変数 stackPos で表現する。スタックの初期状態を図に示す。

      プログラムでは，配列の領域外を参照してはならないものとする。

      | 要素番号 | 1 | 2 | 3 | 4 |
      | --- | --- | --- | --- | --- |
      | stack | 4 | 3 | （未定義） | （未定義） |
      | stackPos | | | ↑ | |

      図　スタックの初期状態（注記：「（未定義）」はその要素が未定義であることを示す。stackPos は要素番号 3 を指す。）
    code: |
      大域: 整数型: stackPos ← 3
      大域: 整数型の配列: stack ← {4, 3, 未定義の値, 未定義の値}

      ○論理型: push(整数型: inputData)
        if (stackPos ≦ stackの要素数)
          stack[【a】] ← inputData
          stackPos ← stackPos ＋ 1
          return true
        else
          return false
        endif

      ○整数型: pop()
        整数型: popData ← 未定義の値
        if (stackPos ＞ 1)
          stackPos ← 【b】
          popData ← stack[stackPos]
          stack[stackPos] ← 未定義の値
        endif
        return popData
    c:
      - "a：stackPos，b：stackPos ＋ 1"
      - "a：stackPos，b：stackPos － 1"
      - "a：stackPos － 1，b：stackPos ＋ 1"
      - "a：stackPos － 1，b：stackPos － 1"
    fills:
      - { a: 'stackPos', b: 'stackPos ＋ 1' }
      - { a: 'stackPos', b: 'stackPos － 1' }
      - { a: 'stackPos － 1', b: 'stackPos ＋ 1' }
      - { a: 'stackPos － 1', b: 'stackPos － 1' }
    a: イ
    exp: |
      stackPos は「次に値を格納する位置」です。初期状態では stack[1]，stack[2] に値があり，stackPos は 3 なので，値は次のように出し入れされます。

      【a】 push は次に値を格納する位置（stackPos）に格納してから，stackPos を 1 増やします。したがって格納先は stack[stackPos] です。

      【b】 pop は，最後に格納した値の位置から取り出します。最後に格納した値は stackPos の 1 つ前にあるので，まず stackPos を 1 減らし（stackPos － 1），その位置の値を取り出して未定義に戻します。

      | 操作 | 実行前の stackPos | stack の内容 | 実行後の stackPos | 実行後の stack |
      | --- | --- | --- | --- | --- |
      | push(7) | 3 | {4, 3, 未定義, 未定義} | 4 | {4, 3, 7, 未定義} |
      | pop() | 3 | {4, 3, 未定義, 未定義} | 2 | {4, 未定義, 未定義, 未定義}（3 を返す） |
    why:
      - push は正しいですが，pop で stackPos を増やすと，値の入っていない位置を指して取り出してしまい，スタックの先頭の値（3）を取り出せません。
      - 正解です。push は stack[stackPos] に格納して stackPos を進め，pop は stackPos を戻してからその位置の値を取り出します。
      - push で stack[stackPos － 1] に格納すると，最後に入れた値（3）を上書きして失います。pop も stackPos を増やしてしまうので取り出せません。
      - pop は正しいですが，push で stack[stackPos － 1] に格納すると，最後に入れた値（3）を上書きしてしまいます。
    know: スタックは，最後に入れたものを最初に取り出す LIFO のデータ構造。この問題のように「次に格納する位置」を管理する方法のほか，「最後に格納した位置」を管理する方法もあり，どちらかによって stackPos の増減の順序が変わる。
    terms: [スタック, LIFO]
    verify:
      cases:
        - { call: push, args: [7], expect: true, expectGlobals: { stackPos: 4, stack: [4, 3, 7, null] } }
        - { call: pop, expect: 3, expectGlobals: { stackPos: 2, stack: [4, null, null, null] } }
    sim: { entry: push, args: [7] }
    source: { examName: "令和7年度 科目B 公開問題", year: 2025, questionNo: 3 }
