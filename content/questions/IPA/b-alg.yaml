  - id: IPA-R06-B-004
    topic: [B3, 2-2-2-1]
    diff: 2
    q: |
      次の記述中の【a】に入れる正しい答えを，解答群の中から選べ。ここで，配列の要素番号は 1 から始まる。

      関数 merge は，昇順に整列された整数型の配列 data1 及び data2 を受け取り，これらを併合してできる昇順に整列された整数型の配列を返す。

      関数 merge を merge({2, 3}, {1, 4}) として呼び出すと，/*** α ***/ の行は【a】。
    code: |
      ○整数型の配列: merge(整数型の配列: data1, 整数型の配列: data2)
        整数型: n1 ← data1の要素数
        整数型: n2 ← data2の要素数
        整数型の配列: work ← {(n1 ＋ n2)個の 未定義の値}
        整数型: i ← 1
        整数型: j ← 1
        整数型: k ← 1

        while ((i ≦ n1) and (j ≦ n2))
          if (data1[i] ≦ data2[j])
            work[k] ← data1[i]
            i ← i ＋ 1
          else
            work[k] ← data2[j]
            j ← j ＋ 1
          endif
          k ← k ＋ 1
        endwhile

        while (i ≦ n1)
          work[k] ← data1[i]
          i ← i ＋ 1
          k ← k ＋ 1
        endwhile

        while (j ≦ n2)
          work[k] ← data2[j]   /*** α ***/
          j ← j ＋ 1
          k ← k ＋ 1
        endwhile

        return work
    c:
      - "実行されない"
      - "1 回実行される"
      - "2 回実行される"
      - "3 回実行される"
    a: イ
    exp: |
      data1 ＝ {2, 3}（n1 ＝ 2），data2 ＝ {1, 4}（n2 ＝ 2）で追跡します。

      | 段階 | i | j | k | 比較・動作 | work |
      | --- | --- | --- | --- | --- | --- |
      | 開始 | 1 | 1 | 1 | | {未定義, 未定義, 未定義, 未定義} |
      | 1 つ目の while（1 回目） | 1 | 1 | 1 | data1[1]＝2 ≦ data2[1]＝1 は偽なので data2[1] を格納 | {1, 未定義, 未定義, 未定義} |
      | 1 つ目の while（2 回目） | 1 | 2 | 2 | 2 ≦ 4 は真なので data1[1] を格納 | {1, 2, 未定義, 未定義} |
      | 1 つ目の while（3 回目） | 2 | 2 | 3 | 3 ≦ 4 は真なので data1[2] を格納 | {1, 2, 3, 未定義} |
      | 1 つ目の while の終了 | 3 | 2 | 4 | i ＞ n1 なので終了 | |

      2 つ目の while は i ＞ n1 のため実行されません。3 つ目の while は j ＝ 2 ≦ n2 ＝ 2 なので 1 回実行され，work[4] に data2[2] ＝ 4 が格納されます。j が 3 になると終了するため，α の行は 1 回だけ実行されます。
    why:
      - 3 つ目の while の条件 j ≦ n2 は，1 つ目の while の終了時に j ＝ 2，n2 ＝ 2 で真になるため，1 回は実行されます。
      - 正解です。1 つ目の while で data2 の 1 だけを使い，data2 の最後の要素 4 が残るため，3 つ目の while が 1 回だけ実行されます。
      - 2 回実行されるのは，data2 の要素が 2 つ以上残る場合です。この呼出しでは data2 の 1 が 1 つ目の while で使われ，残りは 4 の 1 つだけです。
      - 3 回実行されるのは，data2 の要素が 3 つ以上残る場合です。data2 の要素数は 2 なので，この呼出しでは起こりません。
    know: 併合（マージ）は，整列済みの二つの配列の先頭同士を比べて小さい方を取り出す操作を繰り返す。どちらかが先に尽きたら，残った側の要素をそのまま後ろに並べる。
    terms: [マージ, マージソート, 整列]
    verify: { manual: 'インタプリタでトレースし，α の行が 1 回だけ実行されることを確認（work の最終値は {1, 2, 3, 4}）' }
    sim: { entry: merge, args: [[2, 3], [1, 4]] }
    source: { examName: "令和6年度 科目B 公開問題", year: 2024, questionNo: 4 }
