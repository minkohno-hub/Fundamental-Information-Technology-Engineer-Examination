  - id: IPA-R08-B-001
    topic: [B2, 2-1-2-1, 2-3-1-5]
    diff: 1
    q: |
      次のプログラム中の【a】に入れる正しい答えを，解答群の中から選べ。ここで，配列の要素番号は 1 から始まる。

      次のプログラムは，整数型の配列 data の末尾の要素の値を先頭の要素に移動する。この際，末尾以外の各要素の値は，一つずつ後ろの要素に移動する。
    code: |
      整数型の配列: data ← {1, 2, 3, 4, 5, 6, 7, 8, 9}
      整数型: top, i
      整数型: len ← dataの要素数
      top ← data[len]
      for (i を 【a】)
        data[i] ← data[i － 1]
      endfor
      data[1] ← top
    c:
      - "2 から len － 1 まで 1 ずつ増やす"
      - "2 から len まで 1 ずつ増やす"
      - "len － 1 から 2 まで 1 ずつ減らす"
      - "len から 2 まで 1 ずつ減らす"
    a: エ
    exp: |
      末尾の値を top に退避してから，各要素を 1 つ後ろへずらし，最後に先頭へ top を入れる処理です。data[i] ← data[i － 1] は「前の要素の値を後ろの要素へコピーする」ので，後ろから前へ向かって（i を大きい方から小さい方へ）実行しないと，コピー元がすでに上書きされてしまいます。

      i を len（9）から 2 まで 1 ずつ減らすと，data[9] ← data[8]，data[8] ← data[7]，…，data[2] ← data[1] の順に実行されます。

      | i | 実行する代入 | data |
      | --- | --- | --- |
      | （開始） | top ← 9 | {1, 2, 3, 4, 5, 6, 7, 8, 9} |
      | 9 | data[9] ← data[8] | {1, 2, 3, 4, 5, 6, 7, 8, 8} |
      | 8 | data[8] ← data[7] | {1, 2, 3, 4, 5, 6, 7, 7, 8} |
      | 7～2 | 同様に 1 つずつ後ろへ | {1, 1, 2, 3, 4, 5, 6, 7, 8} |
      | 終了後 | data[1] ← top | {9, 1, 2, 3, 4, 5, 6, 7, 8} |
    why:
      - i を増やす向きなので data[2] ← data[1] で 1 を複製し，次も data[3] ← data[2]（すでに 1）となって，先頭の値 1 が全体に広がります。最後の data[len] も更新されません。
      - i を増やす向きなので先頭の値 1 が全体に広がります（data[len] まで 1 になり，結果は {9, 1, 1, 1, 1, 1, 1, 1, 1} になります）。
      - 向きは正しいですが，i を len － 1 から始めるため data[len] ← data[len － 1] が実行されず，末尾の要素が書き換わりません（結果は {9, 1, 2, 3, 4, 5, 6, 7, 9} になります）。
      - 正解です。後ろの要素から順に 1 つ前の値を写すので，上書き前の値を使ってずらせます。
    know: 配列の要素を 1 つずつずらすとき，同じ配列の中でコピーする向きを誤ると，値が上書きされて全体が同じ値になる。後ろへずらすときは後ろから，前へずらすときは前から処理する。
    terms: [配列, 繰返し処理]
    verify:
      cases:
        - { expectVars: { data: [9, 1, 2, 3, 4, 5, 6, 7, 8] } }
    sim: {}
    source: { examName: "令和8年度 科目B 公開問題", year: 2026, questionNo: 1 }
  - id: IPA-R08-B-002
    topic: [B2, 1-1-5, 2-3-1-4]
    diff: 2
    q: |
      次のプログラム中の【a】に入れる正しい答えを，解答群の中から選べ。

      関数 complement は，引数として渡された 8 ビット型の値 x について，x に加算すると 00000000 になる値を返す。8 ビット型の加算は，値を符号なし 2 進数とみなしたときの加算とし，桁あふれが発生したときのあふれた桁は無視する。演算子∧，∨，▽は，それぞれビット単位の論理積，論理和，排他的論理和を表す。
    code: |
      ○8ビット型: complement(8ビット型: x)
        8ビット型: y
        y ← 【a】
        y ← y ＋ 00000001
        return y
    c:
      - "x ∧ 01111111"
      - "x ∧ 11111111"
      - "x ∨ 01111111"
      - "x ∨ 11111111"
      - "x ▽ 01111111"
      - "x ▽ 11111111"
    a: カ
    exp: |
      x に足して（桁あふれを無視して）00000000 になる値は，x の 2 の補数です。2 の補数は「全ビットを反転してから 1 を足す」ことで求められます。この問題では，二行目で 1 を足しているので，一行目では全ビット反転を行います。

      全ビット反転は，x と 11111111 の排他的論理和（▽）で得られます（0 ▽ 1 ＝ 1，1 ▽ 1 ＝ 0 なので，x の各ビットが反転する）。

      x ＝ 00000101（5）のとき

      | 手順 | 値 |
      | --- | --- |
      | x ▽ 11111111 | 11111010 |
      | ＋ 00000001 | 11111011（251） |
      | x ＋ 結果 | 00000101 ＋ 11111011 ＝ 1 00000000（あふれた桁を無視して 00000000） |
    why:
      - x ∧ 01111111 は最上位ビットを 0 にして残りをそのまま残す演算で，反転していません。x に加算しても 0 になりません。
      - x ∧ 11111111 は x そのものです。1 を足した x ＋ 1 を x に加えても 0 にはなりません。
      - x ∨ 01111111 は下位 7 ビットをすべて 1 にする演算で，x の値によらず下位 7 ビットが固定されるため，補数になりません。
      - x ∨ 11111111 は常に 11111111 になるので，1 を足すと 00000000 で，x が 0 以外のときに x に加えても 0 になりません。
      - x ▽ 01111111 は下位 7 ビットだけを反転して最上位ビットはそのままなので，最上位ビットが反転しておらず補数になりません。
      - 正解です。x ▽ 11111111 で全ビットを反転し，1 を足して 2 の補数にします。x に加えると桁あふれして 00000000 になります。
    know: 符号なし 2 進数の加算で「足すと 0 になる値」は 2 の補数で，負の整数を表現するときにも使われる。全ビット反転（1 の補数）に 1 を足して求める。
    terms: [2の補数, 排他的論理和, ビット演算, 論理積]
    verify:
      options: { bitLiterals: true }
      cases:
        - { call: complement, args: [1], expect: 255 }
        - { call: complement, args: [5], expect: 251 }
        - { call: complement, args: [77], expect: 179 }
        - { call: complement, args: [128], expect: 128 }
        - { call: complement, args: [200], expect: 56 }
        - { call: complement, args: [255], expect: 1 }
    sim: { entry: complement, args: [5] }
    source: { examName: "令和8年度 科目B 公開問題", year: 2026, questionNo: 2 }
  - id: IPA-R08-B-003
    topic: [B3, 2-2-2-2]
    diff: 3
    q: |
      次のプログラム中の【a】に入れる正しい答えを，解答群の中から選べ。ここで，配列の要素番号は 1 から始まる。

      関数 func1 に与える引数と，関数 func2 に与える引数とが同じとき，二つの関数は同じ値を返す。プログラムでは，配列の領域外を参照してはならないものとする。
    code: |
      ○整数型: func1(整数型: n)
        if (nが2以下)
          return 1
        endif
        return 2 × func1(n － 2) ＋ func1(n － 1)

      ○整数型: func2(整数型: n)
        整数型の配列: data ← {1, 1, 1}
        整数型: i

        /* nが3より小さいときは繰返し処理を実行しない */
        for (iを3からnまで1ずつ増やす)
          data[1] ← data[2]
          data[2] ← data[3]
          data[3] ← 【a】
        endfor
        return data[3]
    c:
      - "2 × data[1] ＋ data[2]"
      - "2 × data[2] ＋ data[1]"
      - "2 × data[i － 1] ＋ data[i － 2]"
      - "2 × data[i － 2] ＋ data[i － 1]"
      - "data[3] ＋ 2 × data[1] ＋ data[2]"
      - "data[3] ＋ 2 × data[2] ＋ data[1]"
      - "data[3] ＋ 2 × data[i － 1] ＋ data[i － 2]"
      - "data[3] ＋ 2 × data[i － 2] ＋ data[i － 1]"
    a: ア
    exp: |
      func1 は，f(n) ＝ 2 × f(n － 2) ＋ f(n － 1)（n ≧ 3），f(1) ＝ f(2) ＝ 1 という漸化式を再帰で計算しています。func2 は同じ値を，再帰を使わず繰返しで求める版です。

      繰返しの各回で，data[1]，data[2] に直前の 2 項（f(i － 2)，f(i － 1)）を保持し，data[3] に新しい項 f(i) を入れます。繰返しの先頭で data[1] ← data[2]，data[2] ← data[3] とずらすと，data[1] ＝ f(i － 2)，data[2] ＝ f(i － 1) になるので，新しい項は 2 × data[1] ＋ data[2] です。

      | i | ずらした後の data[1] | data[2] | data[3] に入れる値 |
      | --- | --- | --- | --- |
      | 3 | 1 | 1 | 2×1＋1 ＝ 3（f(3)） |
      | 4 | 1 | 3 | 2×1＋3 ＝ 5（f(4)） |
      | 5 | 3 | 5 | 2×3＋5 ＝ 11（f(5)） |
      | 6 | 5 | 11 | 2×5＋11 ＝ 21（f(6)） |
    why:
      - 正解です。ずらした後の data[1]，data[2] がそれぞれ f(i － 2)，f(i － 1) なので，2 × data[1] ＋ data[2] が f(i) になります。
      - 係数の付き方が逆です。2 × f(i － 1) ＋ f(i － 2) になるので，f(4) は 2×3＋1 ＝ 7 となり，func1 の 5 と一致しません。
      - data[i － 1]，data[i － 2] は繰返しの回数 i に応じて要素番号が増えます。配列の要素数は 3 なので，i が 5 以上になると領域外を参照します。
      - data[i － 2]，data[i － 1] は，配列の要素番号に繰返しの回数 i を使っているため，i が 6 以上になると領域外を参照します。
      - 新しい項に古い data[3] の値（f(i － 1)）を余分に足しているので，func1 より大きい値になります（f(3) は 4 になります）。
      - 係数が逆であることに加えて，古い data[3] を余分に足しているので，f(3) から func1 の値と一致しません。
      - 古い data[3] を余分に足しており，data[i － 1]，data[i － 2] は i が大きいと領域外参照にもなります。
      - 古い data[3] を余分に足しており，data[i － 2]，data[i － 1] は i が大きいと領域外参照にもなります。
    know: 再帰で定義された式は，直前の数項を変数や配列に保持して繰り返すことで，再帰を使わずに計算できる。再帰では同じ値を何度も計算するが，繰返しでは各項を 1 回ずつ計算するので効率がよい。
    terms: [再帰, 再帰呼出し, 配列]
    verify:
      cases:
        - { call: func2, args: [1], expect: 1 }
        - { call: func2, args: [2], expect: 1 }
        - { call: func2, args: [3], expect: 3 }
        - { call: func2, args: [4], expect: 5 }
        - { call: func2, args: [5], expect: 11 }
        - { call: func2, args: [6], expect: 21 }
        - { call: func2, args: [7], expect: 43 }
        - { call: func2, args: [8], expect: 85 }
    sim: { entry: func2, args: [5] }
    source: { examName: "令和8年度 科目B 公開問題", year: 2026, questionNo: 3 }
