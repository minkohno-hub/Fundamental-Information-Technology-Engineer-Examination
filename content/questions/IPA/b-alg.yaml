      - 分子は正しいですが，分母を二つの大きさの和にしており，積になっていません。
      - 分子は正しいですが，分母が vector2 の大きさだけになり，先に求めた vector1 の大きさが使われません。
      - 分子を vector1 の各要素の2乗の総和にしており，vector2 が使われず内積になっていません。分母は正しい式です。
      - 分子が内積になっていません。さらに，分母を二つの大きさの和にしており，積になっていません。
      - 分子が内積になっていません。さらに，分母が vector2 の大きさだけになり，先に求めた vector1 の大きさが使われません。
    know: コサイン類似度は 2 つのベクトルのなす角の余弦で，向きが同じなら 1，直交なら 0 になる。文書を単語の出現数のベクトルで表して類似度を測るなど，自然言語処理や推薦で使われる。
