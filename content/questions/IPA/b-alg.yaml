  - id: IPA-R06-B-001
    topic: [B2, 2-3-1-5]
    diff: 1
    q: |
      次のプログラム中の【a】に入れる正しい答えを，解答群の中から選べ。

      関数 maximum は，異なる三つの整数を引数で受け取り，そのうちの最大値を返す。
    code: |
      ○整数型: maximum(整数型: x, 整数型: y, 整数型: z)
        if (【a】)
          return x
        elseif (y ＞ z)
          return y
        else
          return z
        endif
    c:
      - "x ＞ y"
      - "x ＞ y and x ＞ z"
      - "x ＞ y and y ＞ z"
      - "x ＞ z"
      - "x ＞ z and z ＞ y"
      - "z ＞ y"
    a: イ
    exp: |
      最初の if で「x が最大」であることを判定できれば，残りは y と z の比較だけで済みます。x が最大であるのは，x が y より大きく，かつ z よりも大きいときなので，条件は x ＞ y and x ＞ z です。

      x ＝ 3，y ＝ 1，z ＝ 2 のとき，x ＞ y（真）and x ＞ z（真）で x を返します。x ＝ 2，y ＝ 3，z ＝ 1 のときは偽になり，elseif の y ＞ z（真）で y を返します。x ＝ 1，y ＝ 2，z ＝ 3 のときは偽になり，y ＞ z（偽）なので else で z を返します。
    why:
      - x ＞ y だけでは z との比較がなく，x ＝ 2，y ＝ 1，z ＝ 3 のとき x（2）を返してしまいます。
      - 正解です。x が y と z の両方より大きいときだけ x を返し，そうでなければ y と z の大小で残りを決められます。
      - x ＞ y and y ＞ z は x ＞ y ＞ z の並びのときだけ真で，x ＝ 3，y ＝ 1，z ＝ 2 のように x が最大でも偽になり，z を返してしまいます。
      - x ＞ z だけでは y との比較がなく，x ＝ 2，y ＝ 3，z ＝ 1 のとき x（2）を返してしまいます。
      - x ＞ z and z ＞ y は x ＞ z ＞ y の並びのときだけ真で，x ＝ 3，y ＝ 2，z ＝ 1 のように x が最大でも偽になり，y を返してしまいます。
      - z ＞ y は x を含まない条件なので，x ＝ 1，y ＝ 2，z ＝ 3 のときに x（1）を返してしまいます。
    know: 条件式に「最大であること」を直接書くと，残りの分岐の前提が単純になる。三つの値のどの並びでも正しく動くかは，6 通りの大小関係で確かめられる。
    terms: [選択処理]
    verify:
      cases:
        - { call: maximum, args: [3, 2, 1], expect: 3 }
        - { call: maximum, args: [3, 1, 2], expect: 3 }
        - { call: maximum, args: [2, 3, 1], expect: 3 }
        - { call: maximum, args: [1, 3, 2], expect: 3 }
        - { call: maximum, args: [2, 1, 3], expect: 3 }
