questions:
  - id: IPA-R08-A-005
    topic: 5-1-7-2
    diff: 2
    noShuffle: true
    q: "仮想記憶方式のコンピュータシステムにおいて，処理の多重度を増やしたところ，ページイン，ページアウトが多発して，システムの応答速度が急激に遅くなった。このような現象を何というか。"
    c:
      - "オーバレイ"
      - "スラッシング"
      - "メモリコンパクション"
      - "ロールアウト"
    a: イ
    exp: "スラッシングは，主記憶が不足してページイン・ページアウトが頻発し，本来の処理が進まずシステムの性能が急激に低下する現象である。"
    why:
      - "オーバレイは必要な部分だけを主記憶に置いて同じ領域を使い回す手法である。"
      - "正解です。ページングの多発による性能低下がスラッシングである。"
      - "メモリコンパクションは主記憶の空き領域を集約する処理である。"
      - "ロールアウトはプログラムを主記憶から補助記憶へ退避させることである。"
    know: "対策は多重度を下げる，主記憶を増設するなどである。"
    terms: ["スラッシング", "ページング", "仮想記憶"]
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 5 }
