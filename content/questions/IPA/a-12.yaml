questions:
  - id: IPA-R06-A-011
    topic: 12-4-4
    diff: 1
    noShuffle: true
    q: "階層構造のモジュール群から成るソフトウェアの結合テストを，上位のモジュールから行う。この場合に使用する，下位のモジュールの代替となるテスト用のモジュールはどれか。"
    c:
      - "エミュレータ"
      - "シミュレータ"
      - "スタブ"
      - "ドライバ"
    a: ウ
    exp: "上位から行うトップダウンテストでは，まだ完成していない下位モジュールの代わりにスタブ(代替の呼出され側)を使う。"
    why:
      - "エミュレータは別の機種の動作を模倣する装置・ソフトウェアである。"
      - "シミュレータは実環境の動作を模擬する仕組みである。"
      - "正解です。下位モジュールの代替として使うのがスタブである。"
      - "ドライバは上位モジュールの代替(呼出し側)で，ボトムアップテストで使う。"
    know: "トップダウンテストはスタブ，ボトムアップテストはドライバを使う。"
    terms: ["スタブ", "結合テスト"]
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 11 }
  - id: IPA-R08-A-011
    topic: 12-3-4
    diff: 1
    noShuffle: true
    q: "あるシステムにおいて，“プログラムの記述方法が統一されていないので保守がしづらい”という問題が発生している。今後の新規開発プロジェクトにおけるこの問題の低減策として，最も適切なものはどれか。"
    c:
      - "コーディング規約を見直し，教育する。"
      - "セキュアプログラミングを採用する。"
      - "単体テストでの命令網羅度を上げる。"
      - "プロジェクト管理レビューに全プログラマーが参加する。"
    a: ア
    exp: "記述方法が統一されていない問題には，コーディング規約を整備して見直し，開発者に教育して徹底することが最も直接的な対策になる。"
    why:
      - "正解です。規約の見直しと教育で記述方法を統一できる。"
      - "セキュアプログラミングは脆弱性を作り込まないための手法で，記述の統一とは目的が異なる。"
      - "命令網羅度の向上はテストの品質向上であり，記述方法の統一とは関係がない。"
      - "管理レビューへの参加は進捗や課題の確認で，記述方法の統一とは関係がない。"
    know: "コーディング規約には命名規則，字下げ，コメントの書き方などを定める。"
    terms: ["コーディング規約", "セキュアプログラミング"]
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 11 }
  - id: IPA-R08-A-019
    topic: 12-1-7-8
    diff: 1
    noShuffle: true
    q: "ブレーンストーミングの説明はどれか。"
    c:
      - "あるテーマの検討において，複数のメンバーで，各自が思いつくままに自由奔放にできるだけ多くのアイディアを出し合うことによって，創造的思考を喚起し，アイディアを開発しようとする会議方法"
      - "研修を始める前に行う簡単なゲームや，商談や面接の本題に入る前に行う雑談など，参加者の緊張をほぐすためのコミュニケーション方法"
      - "情報を，決められた枠組みに従って整理・分析するスキルや方法を利用し，複雑なものごとを明快に把握したり，問題に対する解決策を導き出したりするような思考方法"
      - "ポイントを繰り返したり，言い換えたりすることによって，お互いの理解する意味合いが一致していることを確認したり，意見・評価を伝えたりする方法"
    a: ア
    exp: "ブレーンストーミングは，複数のメンバーが自由にできるだけ多くのアイディアを出し合い，創造的な発想を引き出す会議手法である。他人の意見を批判しない，質より量，などのルールがある。"
    why:
      - "正解です。自由奔放に多数のアイディアを出し合う会議方法である。"
      - "これはアイスブレイクの説明である。"
      - "これはロジカルシンキングやフレームワーク思考の説明である。"
      - "これはバックトラッキング(復唱・言い換え)など確認のためのコミュニケーション技法である。"
    know: "ブレーンストーミングのルールは，批判禁止，自由奔放，質より量，結合と改善である。"
    terms: ["ブレーンストーミング"]
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 19 }
