questions:
  - id: IPA-R05-A-009
    topic: 11-1-7
    diff: 2
    noShuffle: true
    q: "ドライブバイダウンロード攻撃に該当するものはどれか。"
    c:
      - "PC から物理的にハードディスクドライブを盗み出し，その中のデータを Web サイトで公開し，ダウンロードさせる。"
      - "電子メールの添付ファイルを開かせて，マルウェアに感染した PC のハードディスクドライブ内のファイルを暗号化し，元に戻すための鍵を攻撃者のサーバからダウンロードさせることと引換えに金銭を要求する。"
      - "利用者が悪意のある Web サイトにアクセスしたときに，Web ブラウザの脆弱性を悪用して利用者の PC をマルウェアに感染させる。"
      - "利用者に気付かれないように無償配布のソフトウェアに不正プログラムを混在させておき，利用者の操作によって PC にダウンロードさせ，インストールさせることでハードディスクドライブから個人情報を収集して攻撃者のサーバに送信する。"
    a: ウ
    exp: "ドライブバイダウンロードは，悪意ある Web サイトを閲覧しただけで，ブラウザなどの脆弱性を突かれ，利用者が意図しないうちにマルウェアをダウンロード・感染させられる攻撃である。"
    why:
      - "これは物理的な盗難と情報公開であり，ドライブバイダウンロードではない。"
      - "これはランサムウェアの説明である。"
      - "正解です。閲覧だけで脆弱性を突かれ感染させられるのが該当する。"
      - "これはトロイの木馬型の不正プログラムの説明で，利用者の操作で導入される点が異なる。"
    know: "対策はブラウザや OS の更新と，不審なサイトを閲覧しないことである。"
    terms: ["ドライブバイダウンロード", "ランサムウェア", "トロイの木馬"]
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 9 }
  - id: IPA-R05-A-010
    topic: 11-5-3
    diff: 2
    noShuffle: true
    q: "次の構成と通信サービスのシステムにおいて，Web アプリケーションの脆弱性対策のための WAF の設置場所として，最も適切な箇所はどこか。ここで，WAF には通信を暗号化したり，復号したりする機能はないものとする。\n\n通信の流れ（インターネット側から順に）\n\n1. PC（複数）\n2. インターネット\n3. （a）HTTPS\n4. ファイアウォール\n5. （b）HTTPS\n6. SSL アクセラレータ\n7. （c）HTTP\n8. Web サーバ\n9. （d）データベースアクセス用サービス\n10. データベースサーバ"
    c:
      - "a"
      - "b"
      - "c"
      - "d"
    a: ウ
    exp: "WAF は HTTP の内容を検査して攻撃を防ぐ。暗号化や復号の機能がないので，通信が復号された後の HTTP 区間，すなわち SSL アクセラレータと Web サーバの間に置く。"
    why:
      - "a は HTTPS の暗号化通信なので，WAF は内容を検査できない。"
      - "b も HTTPS 区間で暗号化されたままなので検査できない。"
      - "正解です。SSL アクセラレータで復号された HTTP の区間なので検査できる。"
      - "d はデータベースアクセス用のサービスで，WAF が対象とする HTTP の通信ではない。"
    know: "WAF の設置位置は，通信が復号されている区間であることを確認する。"
    terms: ["WAF", "ファイアウォール"]
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 10, modified: true, modificationNote: "解説を本アプリで作成。図を通信の流れの箇条書きに文章化。その他の問題文・選択肢は原文のまま" }
  - id: IPA-R06-A-009
    topic: 11-4-1-2
    diff: 2
    noShuffle: true
    q: "ペネトレーションテストに該当するものはどれか。"
    c:
      - "検査対象の実行プログラムの設計書，ソースコードに着目し，開発プロセスの各工程にセキュリティ上の問題がないかどうかをツールや目視で確認する。"
      - "公開 Web サーバの各コンテンツファイルのハッシュ値を管理し，定期的に各ファイルから生成したハッシュ値と一致するかどうかを確認する。"
      - "公開 Web サーバや組織のネットワークの脆弱性を探索し，サーバに実際に侵入できるかどうかを確認する。"
      - "内部ネットワークのサーバやネットワーク機器の IPFIX 情報から，各 PC の通信に異常な振る舞いがないかどうかを確認する。"
    a: ウ
    exp: "ペネトレーションテスト(侵入テスト)は，実際の攻撃手法を用いてシステムの脆弱性を探索し，侵入できるかどうかを確認するテストである。"
    why:
      - "これはソースコードレビューや静的解析の説明である。"
      - "これは改ざん検知(完全性チェック)の説明である。"
      - "正解です。実際に侵入できるかを確認するのがペネトレーションテストである。"
      - "これはネットワークの振る舞い検知(フロー監視)の説明である。"
    know: "脆弱性診断は脆弱性の洗い出しが中心で，侵入テストは実際に侵入を試みる点が異なる。"
    terms: ["ペネトレーションテスト", "脆弱性"]
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 9 }
  - id: IPA-R06-A-010
    topic: 11-5-5
    diff: 1
    noShuffle: true
    q: "SQL インジェクションの対策として，有効なものはどれか。"
    c:
      - "URL を Web ページに出力するときは，“http://”や“https://”で始まる URL だけを許可する。"
      - "外部からのパラメータで Web サーバ内のファイル名を直接指定しない。"
      - "スタイルシートを任意の Web サイトから取り込めるようにしない。"
      - "プレースホルダを使って命令文を組み立てる。"
    a: エ
    exp: "SQL インジェクションは入力値が SQL 文の構文として解釈されて起きる。プレースホルダ(バインド機構)を使うと入力値が値として扱われ，対策になる。"
    why:
      - "これはクロスサイトスクリプティング対策(不正な URL スキームの排除)である。"
      - "これはディレクトリトラバーサル対策である。"
      - "これはスタイルシートを悪用した攻撃への対策である。"
      - "正解です。プレースホルダを使うのが SQL インジェクションの有効な対策である。"
    know: "プレースホルダにはバインド機構を使う静的プレースホルダが望ましい。"
    terms: ["SQLインジェクション", "プレースホルダ"]
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 10 }
  - id: IPA-R07-A-008
    topic: 11-5-1
    diff: 2
    noShuffle: true
    q: "HTTP と HTTPS を比較した場合において，HTTPS だけがもつ特徴を示したものはどれか。"
    c:
      - "cookie に保存されている情報を用いたセッション管理が可能である。"
      - "ID とパスワードによって利用者の認証を行うことが可能である。"
      - "Web ブラウザでキャッシュさせることによって通信量を減らすことが可能である。"
      - "通信相手先サーバをサーバ証明書によって確認することが可能である。"
    a: エ
    exp: "HTTPS は TLS を使い，サーバ証明書でサーバの正当性を確認でき，通信も暗号化される。cookie や ID・パスワード認証，キャッシュは HTTP でも可能である。"
    why:
      - "cookie によるセッション管理は HTTP でも可能である。"
      - "ID とパスワードによる認証は HTTP でも可能である(ただし平文で流れる)。"
      - "キャッシュによる通信量削減は HTTP でも可能である。"
      - "正解です。サーバ証明書によるサーバの確認は HTTPS だけの特徴である。"
    know: "HTTPS では暗号化，改ざん検知，サーバ認証が行える。"
    terms: ["HTTPS", "TLS", "サーバ証明書"]
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 8 }
  - id: IPA-R07-A-009
    topic: 11-1-8-1
    diff: 2
    noShuffle: true
    q: "暗号の危殆化に該当するものはどれか。"
    c:
      - "ある CA でデジタル証明書の署名に使っている公開鍵のデジタル証明書の有効期限が切れた。"
      - "ある暗号アルゴリズムの秘密鍵が不正アクセスによって漏えいした。"
      - "あるハッシュ関数においてハッシュ値が同じになるデータの組みを現実的な時間内で発見する方法が見つかった。"
      - "あるランサムウェアの一種で暗号化されたファイルの復号鍵が公開された。"
    a: ウ
    exp: "暗号の危殆化は，計算機の進歩や解読手法の発見で，暗号アルゴリズムの安全性が低下することである。ハッシュ値の衝突を現実的な時間で見つける方法の発見が該当する。"
    why:
      - "証明書の有効期限切れは危殆化ではなく，更新で対処できる。"
      - "秘密鍵の漏えいは鍵の危殆化に近いが，アルゴリズム自体の安全性低下ではない。"
      - "正解です。衝突を見つける方法が見つかり，ハッシュ関数の安全性が低下した。"
      - "ランサムウェアの復号鍵の公開は，暗号アルゴリズムの安全性低下ではない。"
    know: "MD5 や SHA-1 は衝突が見つかり，危殆化したとされる。"
    terms: ["ハッシュ関数"]
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 9 }
  - id: IPA-R07-A-010
    topic: 11-5-3
    diff: 1
    noShuffle: true
    q: "WAF の説明はどれか。"
    c:
      - "Web サイトに対するアクセス内容を監視し，攻撃とみなされるパターンを検知したときに当該アクセスを遮断する。"
      - "Wi-Fi アライアンスが認定した無線 LAN の暗号化方式の規格であり，AES 暗号に対応している。"
      - "様々なシステムの動作ログを一元的に蓄積，管理し，セキュリティ上の脅威となる事象をいち早く検知，分析する。"
      - "ファイアウォール機能を有し，マルウェア対策機能，侵入検知機能などの複数のセキュリティ機能を連携させ，統合的に管理する。"
    a: ア
    exp: "WAF(Web Application Firewall)は，Web アプリケーションへのアクセス内容を検査し，攻撃パターンを検知したら遮断する。"
    why:
      - "正解です。アクセス内容を検査して攻撃を遮断するのが WAF である。"
      - "これは WPA2 や WPA3 の説明である。"
      - "これは SIEM の説明である。"
      - "これは UTM の説明である。"
    know: "WAF は SQL インジェクションやクロスサイトスクリプティングなどの対策に使う。"
    terms: ["WAF", "SIEM", "UTM"]
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 10 }
  - id: IPA-R08-A-009
    topic: 11-1-8-3
    diff: 2
    noShuffle: true
    q: "2 要素認証に該当する組みはどれか。"
    c:
      - "クライアント証明書，ハードウェアトークン"
      - "静脈認証，指紋認証"
      - "パスワード認証，静脈認証"
      - "パスワード認証，秘密の質問の答え"
    a: ウ
    exp: "2 要素認証は，知識(パスワードなど)，所持(トークンなど)，生体(静脈など)の三つの種類のうち，異なる 2 種類を組み合わせる認証である。パスワード(知識)と静脈(生体)が該当する。"
    why:
      - "どちらも所持情報で，同じ種類の要素である。"
      - "どちらも生体情報で，同じ種類の要素である。"
      - "正解です。知識と生体という異なる 2 種類の要素の組合せである。"
      - "どちらも知識情報で，同じ種類の要素である。"
    know: "同じ種類を 2 回使う場合は 2 段階認証と呼ばれ，2 要素認証には当たらない。"
    terms: ["多要素認証", "生体認証"]
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 9 }
  - id: IPA-R08-A-010
    topic: 11-2-6
    diff: 2
    noShuffle: true
    q: "情報セキュリティに関する専門組織の説明のうち，CSIRT の説明として，最も適切なものはどれか。"
    c:
      - "自社が顧客に提供する製品又はサービスの脆弱性に起因するリスクに対応する組織"
      - "セキュリティインシデント検知のために，システム監視，ログ分析などのセキュリティ運用を担う組織"
      - "発生したセキュリティインシデントに対し，インシデント対応を行う組織"
      - "標的型サイバー攻撃特別相談窓口をもち，相談をもち込んだ組織の被害の低減と攻撃の連鎖の遮断を支援する組織"
    a: ウ
    exp: "CSIRT(Computer Security Incident Response Team)は，セキュリティインシデントが発生したときに，その対応を行う組織である。"
    why:
      - "これは PSIRT の説明である。"
      - "これは SOC の説明である。"
      - "正解です。インシデント対応を行う組織が CSIRT である。"
      - "これは J-CRAT(サイバーレスキュー隊)の説明である。"
    know: "SOC は検知，CSIRT は対応，PSIRT は製品の脆弱性対応を担う。"
    terms: ["CSIRT", "SOC"]
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 10 }
