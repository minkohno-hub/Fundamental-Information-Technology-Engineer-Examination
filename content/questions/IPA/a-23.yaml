questions:
  - id: IPA-R05-A-020
    topic: 23-3-3-3
    diff: 1
    noShuffle: true
    q: "ボリュームライセンス契約の説明はどれか。"
    c:
      - "企業などソフトウェアの大量購入者向けに，インストールできる台数をあらかじめ取り決め，ソフトウェアの使用を認める契約"
      - "使用場所を限定した契約であり，特定の施設の中であれば台数や人数に制限なく使用が許される契約"
      - "ソフトウェアをインターネットからダウンロードしたとき画面に表示される契約内容に同意するを選択することによって，使用が許される契約"
      - "標準の使用許諾条件を定め，その範囲で一定量のパッケージの包装を解いたときに，権利者と購入者との間に使用許諾契約が自動的に成立したとみなす契約"
    a: ア
    exp: "ボリュームライセンス契約は，企業など大量にソフトウェアを購入する利用者向けに，使用できる台数をあらかじめ取り決めて使用を認める契約である。"
    why:
      - "正解です。台数を取り決めて大量購入者に使用を認める契約である。"
      - "これはサイトライセンス契約の説明である。"
      - "これはクリックラップ(クリックオン)契約の説明である。"
      - "これはシュリンクラップ契約の説明である。"
    know: "ライセンス形態にはほかに，ユーザ数で数えるコンカレントライセンスなどがある。"
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 20 }
  - id: IPA-R06-A-020
    topic: 23-1-3
    diff: 1
    noShuffle: true
    q: "日本において，産業財産権と総称される四つの権利はどれか。"
    c:
      - "意匠権，実用新案権，商標権，特許権"
      - "意匠権，実用新案権，著作権，特許権"
      - "意匠権，商標権，著作権，特許権"
      - "実用新案権，商標権，著作権，特許権"
    a: ア
    exp: "産業財産権は，特許権，実用新案権，意匠権，商標権の四つの総称である。著作権は含まれない。"
    why:
      - "正解です。特許権，実用新案権，意匠権，商標権が産業財産権である。"
      - "著作権は産業財産権に含まれない。"
      - "著作権は産業財産権に含まれない。"
      - "著作権は産業財産権に含まれず，意匠権が欠けている。"
    know: "著作権は創作と同時に発生し，登録は不要である。産業財産権は特許庁への出願・登録が必要。"
    terms: ["産業財産権", "著作権"]
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 20 }
  - id: IPA-R08-A-020
    topic: 23-1-2
    diff: 3
    noShuffle: true
    q: "A 社は，自社の業務可視化を B 社に委託しその成果物として納品された業務フロー図を C 社に提示することによって，業務システムの開発を C 社に委託することを検討している。A 社がこの業務フロー図を使用する上で生じる制約として，適切なものはどれか。なお，B 社への委託に当たって締結された契約には，著作権は全て A 社に譲渡する旨の記述があり，著作者人格権については特段の記述はない。"
    c:
      - "C 社と守秘義務契約を締結したとしても，C 社に対して，納品された業務フロー図の電子データを提供することはできない。"
      - "納品された業務フロー図の各ページに作成者名として記されている B 社の企業名を A 社の企業名に変更し，C 社に提示することはできない。"
      - "納品された業務フロー図を印刷し，社内資料として A 社の社員に配布することはできない。"
      - "バックアップの目的で，納品された業務フロー図の電子データを複製し，A 社だけがアクセス可能なクラウドストレージに保管することはできない。"
    a: イ
    exp: "著作権は A 社に譲渡されているので，複製，配布，第三者への提供は可能である。一方，著作者人格権は譲渡できず B 社(著作者)に残るため，氏名表示権や同一性保持権の制約により，作成者名を無断で変更することはできない。"
    why:
      - "著作権は A 社に譲渡されているので，守秘義務契約のもとで電子データを提供できる。"
      - "正解です。著作者人格権(氏名表示権)は B 社に残るので，作成者名の無断変更はできない。"
      - "著作権は A 社にあるので，印刷して社内で配布することはできる。"
      - "著作権は A 社にあるので，バックアップとしての複製と保管はできる。"
    know: "著作者人格権には公表権，氏名表示権，同一性保持権があり，譲渡できない。"
    terms: ["著作者人格権", "氏名表示権", "同一性保持権"]
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 20 }
