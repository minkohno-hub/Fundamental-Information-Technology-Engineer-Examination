questions:
  - id: IPA-R05-A-002
    topic: 2-1-2-2
    diff: 2
    noShuffle: true
    q: "双方向のポインタをもつリスト構造のデータを表に示す。この表において新たな社員 G を社員 A と社員 K の間に追加する。追加後の表のポインタ a ～ f の中で追加前と比べて値が変わるポインタだけを全て列記したものはどれか。\n\n表\n\n| アドレス | 社員名 | 次ポインタ | 前ポインタ |\n|---|---|---|---|\n| 100 | 社員 A | 300 | 0 |\n| 200 | 社員 T | 0 | 300 |\n| 300 | 社員 K | 200 | 100 |\n\n追加後の表\n\n| アドレス | 社員名 | 次ポインタ | 前ポインタ |\n|---|---|---|---|\n| 100 | 社員 A | a | b |\n| 200 | 社員 T | c | d |\n| 300 | 社員 K | e | f |\n| 400 | 社員 G | x | y |"
    c:
      - "a，b，e，f"
      - "a，e，f"
      - "a，f"
      - "b，e"
    a: ウ
    exp: "A の次ポインタを G(400) に，K の前ポインタを G(400) に書き換える。G の x は 300，y は 100 に設定する。T は変わらず，A の前ポインタ b と K の次ポインタ e も変わらない。変わるのは a と f だけ。"
    why:
      - "b(A の前ポインタ)と e(K の次ポインタ)は追加前と同じ値のままで変わらない。"
      - "e は K の次ポインタで，K の次は T(200) のままなので変わらない。"
      - "正解です。A の次ポインタ a が 300 から 400 に，K の前ポインタ f が 100 から 400 に変わる。"
      - "b と e は変わらず，a と f が変わるので組合せが違う。"
    know: "双方向リストの挿入では，前後 2 つの要素のポインタ各 1 個と，新要素の 2 個を設定する。"
    terms: ["双方向リスト"]
    verify: { manual: "a:300→400，f:100→400 の 2 か所のみ変更を確認" }
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 2, modified: true, modificationNote: "解説を本アプリで作成。表を Markdown の表に文字化。その他の問題文・選択肢は原文のまま" }
  - id: IPA-R05-A-011
    topic: 2-2-1
    diff: 2
    noShuffle: true
    q: |
      次の流れ図において，① → ② → ③ → ⑤ → ② → ③ → ④ → ② → ⑥ の順に実行させるために，①において m と n に与えるべき初期値 a と b の関係はどれか。ここで，a，b はともに正の整数とする。

      （流れ図を表に置き換えている。開始の次は①で，各行が流れ図の記号 1 個を表す。）

      | 番号 | 記号 | 内容 | 次に進む番号 |
      | --- | --- | --- | --- |
      | ① | 処理 | m ← a，n ← b | ② |
      | ② | 判定 | m と n を比較 | m ＝ n のとき ⑥，m ≠ n のとき ③ |
      | ③ | 判定 | m と n を比較 | m ＜ n のとき ⑤，m ＞ n のとき ④ |
      | ④ | 処理 | m ← (m － n) | ② |
      | ⑤ | 処理 | n ← (n － m) | ② |
      | ⑥ | 出力 | m の値を印字 | 終了 |
    c:
      - "a ＝ 2b"
      - "2a ＝ b"
      - "2a ＝ 3b"
      - "3a ＝ 2b"
    a: エ
    exp: "指定の順に進むための条件を順に調べる。初回の③で m ＜ n なので⑤で n が b－a になる。2 回目の③で m ＞ n なので④で m が a－(b－a)＝2a－b になる。その後の②で m ＝ n となって⑥に進むので 2a－b ＝ b－a，すなわち 3a ＝ 2b である。"
    why:
      - "a ＝ 2b だと a ＞ b なので最初の③で④に進み，指定の順にならない。"
      - "2a ＝ b だと⑤で n が b－a ＝ a となって m と等しくなるので，⑤の後の②で⑥に進み，2 回目の③を通らない。"
      - "2a ＝ 3b だと a ＞ b なので最初の③で④に進み，指定の順にならない。"
      - "正解です。3a ＝ 2b のとき，m ＜ n で⑤，次に m ＞ n で④，最後に m ＝ n で⑥となり，指定の順に実行される。"
    know: "この流れ図は引き算によるユークリッドの互除法で，終了時に印字される m は a と b の最大公約数である。"
    terms: ["流れ図", "ユークリッドの互除法"]
    verify: { manual: "(a,b)=(2,3)(4,6)(6,9)(8,12)で実行経路 ①②③⑤②③④②⑥ を再現し，a＝2b，2a＝b，2a＝3b を満たす組では再現しないことを全探索(1〜39)で確認" }
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 11, modified: true, modificationNote: "解説を本アプリで作成。流れ図を表に置き換えた。その他の問題文・選択肢は原文のまま" }
  - id: IPA-R06-A-002
    topic: 2-2-2-1
    diff: 2
    noShuffle: true
    q: "キーが小文字のアルファベット 1 文字（a，b，…，z のいずれか）であるデータを，大きさが 10 のハッシュ表に格納する。ハッシュ関数として，アルファベットの ASCII コードを 10 進表記法で表したときの 1 の位の数を用いることにする。衝突が起こるキーの組合せはどれか。ASCII コードでは，昇順に連続した 2 進数が，アルファベット順にコードとして割り当てられている。"
    c:
      - "a と i"
      - "b と r"
      - "c と l"
      - "d と x"
    a: エ
    exp: "小文字 a の ASCII コードは 10 進で 97 で，以降は 1 ずつ増える。d=100 の 1 の位は 0，x=120 の 1 の位も 0 で同じ格納位置になり衝突する。"
    why:
      - "a は 97 で 1 の位は 7，i は 105 で 5 なので衝突しない。"
      - "b は 98 で 8，r は 114 で 4 なので衝突しない。"
      - "c は 99 で 9，l は 108 で 8 なので衝突しない。"
      - "正解です。d=100 と x=120 は 1 の位がどちらも 0 で衝突する。"
    know: "衝突の対策にはチェイン法とオープンアドレス法がある。"
    terms: ["シノニム"]
    verify: { manual: "a=97,i=105,b=98,r=114,c=99,l=108,d=100,x=120 から 1 の位を確認" }
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 2 }
  - id: IPA-R07-A-003
    topic: 2-1-2-4
    diff: 2
    noShuffle: true
    q: "次の木構造は 2 分探索木である。a～g の値の大小関係として，適切なものはどれか。ここで，a～g の値は重複しないものとする。\n\n木の構造\n\n- a は根で，左の子が b，右の子が c\n- b の左の子が d，右の子が e\n- c の左の子が f，右の子が g"
    c:
      - "a＜b＜d＜e＜c＜f＜g"
      - "d＜b＜e＜a＜f＜c＜g"
      - "d＜e＜f＜g＜b＜c＜a"
      - "g＜f＜c＜e＜d＜b＜a"
    a: イ
    exp: "2 分探索木では，左部分木の値<節点の値<右部分木の値になる。したがって中間順(左，節，右)でたどった順序が昇順になり，d, b, e, a, f, c, g の順で d＜b＜e＜a＜f＜c＜g となる。"
    why:
      - "左の子 b が根 a より大きくなっており，2 分探索木の条件に合わない。"
      - "正解です。中間順にたどった d, b, e, a, f, c, g が昇順になる。"
      - "葉の d, e, f, g をまとめて小さくしており，木の構造と合わない。"
      - "全体を降順にしたもので，左が小さい条件と逆になっている。"
    know: "2 分探索木を中間順にたどると，昇順の列になる。"
    terms: ["2分探索木", "2分木"]
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 3 }
  - id: IPA-R07-A-012
    topic: 2-3-1-7
    diff: 1
    noShuffle: true
    q: "オブジェクト指向プログラミングの特徴のうち，異なるクラスのオブジェクトを同一のインタフェースで操作したときに，操作対象クラスに応じた異なる動作を可能にすることを何と呼ぶか。"
    c:
      - "委譲"
      - "継承"
      - "コンポジション"
      - "多相性"
    a: エ
    exp: "多相性(ポリモーフィズム)は，同じメッセージ(インタフェース)に対して，オブジェクトのクラスごとに異なる動作をさせられる性質である。"
    why:
      - "委譲は処理を他のオブジェクトに任せる仕組みである。"
      - "継承は上位クラスの性質を下位クラスが引き継ぐ仕組みである。"
      - "コンポジションは他のオブジェクトを部品として持つ関係である。"
      - "正解です。同一インタフェースでクラスに応じた動作をするのが多相性である。"
    know: "ポリモーフィズムは，オーバーライドなどによって実現される。"
    terms: ["ポリモーフィズム", "継承"]
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 12 }
  - id: IPA-R08-A-002
    topic: 2-2-2-1
    diff: 1
    noShuffle: true
    q: "クイックソートの処理方法を説明したものはどれか。"
    c:
      - "既に整列済みのデータ列の正しい位置に，データを追加する操作を繰り返していく方法である。"
      - "データ中の最小値を求め，次にそれを除いた部分の中から最小値を求める。この操作を繰り返していく方法である。"
      - "適当な基準値を選び，それよりも小さな値のグループと大きな値のグループにデータを分割する。同様にして，グループの中で基準値を選び，それぞれのグループを分割する。この操作を繰り返していく方法である。"
      - "隣り合ったデータの比較と入替えを繰り返すことによって，小さな値のデータを次第に端の方に移していく方法である。"
    a: ウ
    exp: "クイックソートは，基準値(ピボット)を選んで小さい値と大きい値のグループに分割し，各グループに同じ操作を繰り返して整列する。"
    why:
      - "これは挿入ソートの説明である。"
      - "これは選択ソートの説明である。"
      - "正解です。基準値で分割して繰り返すのがクイックソートである。"
      - "これはバブルソートの説明である。"
    know: "平均計算量は O(n log n)，最悪では O(n^2) になる。"
    terms: ["クイックソート", "バブルソート", "選択ソート", "挿入ソート"]
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 2 }
