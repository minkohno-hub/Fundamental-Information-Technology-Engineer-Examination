questions:
  - id: IPA-R05-B-006
    topic:
      - B5
      - 11-1-7
      - 11-4-1
    diff: 2
    q: |
      A 社は，放送会社や運輸会社向けに広告制作ビジネスを展開している。A 社は，人事業務の効率化を図るべく，人事業務の委託を検討することにした。A 社が委託する業務（以下，B 業務という）を図 1 に示す。

      - 採用予定者から郵送されてくる入社時の誓約書，前職の源泉徴収票などの書類を PDF ファイルに変換し，ファイルサーバに格納する。
      - （省略）

      図 1　B 業務

      委託先候補の C 社は，B 業務について，次のように A 社に提案した。

      - B 業務だけに従事する専任の従業員を割り当てる。
      - B 業務では，図 2 の複合機のスキャン機能を使用する。

      - スキャン機能を使用する際は，従業員ごとに付与した利用者 ID とパスワードをパネルに入力する。
      - スキャンしたデータを PDF ファイルに変換する。
      - PDF ファイルを従業員ごとに異なる鍵で暗号化して，電子メールに添付する。
      - スキャンを実行した本人宛てに電子メールを送信する。
      - PDF ファイルが大きい場合は，PDF ファイルを添付する代わりに，自社の社内ネットワーク上に設置したサーバ（以下，B サーバという）（注 1）に自動的に保存し，保存先の URL を電子メールの本文に記載して送信する。

      （注 1）B サーバにアクセスする際は，従業員ごとの利用者 ID とパスワードが必要になる。

      図 2　複合機のスキャン機能（抜粋）

      A 社は，C 社と業務委託契約を締結する前に，秘密保持契約を締結した。その後，C 社に質問表を送付し，回答を受けて，業務委託での情報セキュリティリスクの評価を実施した。その結果，図 3 の発見があった。

      - 複合機のスキャン機能では，電子メールの差出人アドレス，件名，本文及び添付ファイル名を初期設定（注 1）の状態で使用しており，誰がスキャンを実行しても同じである。
      - 複合機のスキャン機能の初期設定情報はベンダーの Web サイトで公開されており，誰でも閲覧できる。

      （注 1）複合機の初期設定は C 社の情報システム部だけが変更可能である。

      図 3　発見事項

      そこで，A 社では，初期設定の状態のままでは A 社にとって情報セキュリティリスクがあり，初期設定から変更するという対策が必要であると評価した。

      設問　対策が必要であると A 社が評価した情報セキュリティリスクはどれか。解答群のうち，最も適切なものを選べ。
    c:
      - B 業務に従事する従業員が，複合機から送信される電子メールをスパムメールと誤認し，電子メールを削除する。その結果，再スキャンが必要となり，B 業務が遅延する。
      - B 業務に従事する従業員が，攻撃者からの電子メールを複合機からのものと信じて本文中にある URL をクリックし，フィッシングサイトに誘導される。その結果，A 社の採用予定者の個人情報が漏えいする。
      - 攻撃者が，複合機から送信される電子メールを盗聴し，本文に記載されている URL を使って B サーバにアクセスする。その結果，A 社の採用予定者の個人情報が漏えいする。
      - 攻撃者が，複合機から送信される電子メールを盗聴し，添付ファイルを暗号化して身代金を要求する。その結果，A 社が復号鍵を受け取るために多額の身代金を支払うことになる。
    a: イ
    exp: |
      図 3 の発見事項は二つです。一つは，複合機が送る電子メールの差出人アドレス・件名・本文・添付ファイル名が初期設定のままで，誰がスキャンしても同じであること。もう一つは，その初期設定の情報がベンダーの Web サイトで誰にでも見られることです。

      この二つがそろうと，攻撃者は「複合機が送る正規のメール」とそっくりの電子メールを自分で作れます。従業員は見慣れた差出人・件名・本文なので本物と信じ，本文の URL をクリックすると，フィッシングサイトに誘導されて個人情報を入力・漏えいするおそれがあります。差出人や件名などを複合機ごとに変更すれば，攻撃者が偽造しにくくなります。

      他の選択肢は，初期設定の内容（差出人・件名・本文・添付ファイル名）が公開されていることとは関係のない脅威，または図 2 の対策（暗号化，認証）で防がれる脅威です。
    why:
      - スパムと誤認して削除されるのは，メールの形式が初期設定のままかどうかではなく，従業員の判断や迷惑メール対策の問題です。初期設定の公開による新たなリスクとは関係がありません。
      - 正解です。初期設定が公開され固定なので，攻撃者が複合機のメールになりすまして偽の URL を送り，フィッシングに誘導できてしまいます。
      - メールを盗聴されても，B サーバにアクセスするには従業員ごとの利用者 ID とパスワードが必要なので，URL だけでは個人情報にアクセスできません。また，盗聴は初期設定の公開とは関係がありません。
      - 添付ファイルは従業員ごとに異なる鍵で暗号化されており，盗聴した第三者が別の鍵で暗号化し直して身代金を要求する手口は成り立ちません。また，初期設定が公開されていることとも関係がありません。
    know: 差出人や件名が固定で外部に知られていると，正規のメールを装った偽メール（なりすましメール）を作りやすくなる。機器の初期設定のまま運用しないことは，情報セキュリティ対策の基本。
    terms:
      - フィッシング
      - なりすまし
    verify:
      manual: 図 3 の発見事項（差出人等が固定，初期設定が公開）から導かれるリスクを事例の記述と照合し，各選択肢が図 2 の対策や発見事項と無関係であることを確認
