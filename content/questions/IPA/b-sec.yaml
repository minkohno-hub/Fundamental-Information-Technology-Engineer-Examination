  - id: IPA-R06-B-006
    topic:
      - B5
      - 11-5-2
      - 11-4-1
    diff: 2
    q: |
      A 社は従業員 450 名の商社であり，昨年から働き方改革の一環として，在宅でのテレワークを推進している。A 社のシステム環境を図 1 に示す。

      - 従業員には，一人に 1 台デスクトップ PC（以下，社内 PC という）を貸与している。
      - 従業員が利用するシステムには，自社で開発し A 社に設置している業務システムのほかに，次の二つの SaaS（以下，二つの SaaS を A 社利用クラウドサービスという）がある。
      - 1. メール機能，チャット機能及びクラウドストレージ機能をもつグループウェア（以下，A 社利用グループウェアという）
      - 2. オンライン会議サービス
      - テレワークでは，従業員の個人所有 PC（以下，私有 PC という）の業務利用（BYOD）を許可している。
      - テレワークでは，社内 PC 及び私有 PC のそれぞれに専用のアプリケーションソフトウェア（以下，専用アプリという）を導入し，社内 PC のデスクトップから私有 PC に画面転送を行うリモートデスクトップ方式を採用している。
      - 専用アプリには，リモートデスクトップから PC へのファイルのダウンロード及びファイル，文字列，画像などのコピー＆ペーストを禁止する機能（以下，保存禁止機能という）があり，A 社では私有 PC に対して当該機能を有効にしている。
      - 業務システムには，社内 PC のデスクトップから利用者 ID 及びパスワードを入力してログインしている。
      - A 社利用クラウドサービスへのログインは，A 社利用クラウドサービス側の設定によって A 社の社内ネットワークからだけ可能になるように制限している。ログインには利用者 ID 及びパスワードを用いている。

      図 1　A 社のシステム環境（抜粋）

      テレワークの定着が進むにつれて，社内 PC からインターネットへの接続が極端に遅くなり，業務に支障をきたしているので改善できないかと，従業員から問合せがあった。A 社の社内ネットワークとインターネットとの間の通信量を調査したところ，テレワーク導入前に比べ，業務時間帯で顕著に増加していることが判明した。そのため，情報システム部では，テレワークで A 社利用クラウドサービスに接続する場合には，A 社の社内ネットワークも社内 PC も介さずに直接接続することを可能にするネットワークの設定変更を実施することにした。

      設定変更に当たり，情報セキュリティ上の問題がないかを A 社の情報セキュリティリーダーである B さんが検討したところ，幾つか問題があることが分かった。その一つは，A 社利用クラウドサービスへの不正アクセスのリスクが増加することである。そこで B さんは，リスクを低減するために，情報システム部に対策を依頼することにした。

      設問　次の対策のうち，情報システム部に依頼することにしたものはどれか。解答群のうち，最も適切なものを選べ。
    c:
      - 専用アプリの保存禁止機能を無効にする。
      - A 社の社内ネットワークから A 社利用クラウドサービスへの通信を監視する。
      - A 社の社内ネットワークと A 社利用クラウドサービスとの間の通信速度を制限する。
      - A 社利用クラウドサービスに A 社外から接続する際の認証に 2 要素認証を導入する。
      - A 社利用クラウドサービスのうち，A 社利用グループウェアだけを直接接続の対象とする。
    a: エ
    exp: |
      これまで A 社利用クラウドサービスには，クラウドサービス側の設定で「A 社の社内ネットワークからだけ」ログインできるようにしていたため，仮に他人に利用者 ID とパスワードを知られても，社外からはログインできませんでした。

      設定変更で社内ネットワークを介さずに直接接続できるようにすると，この「接続元による制限」がなくなり，利用者 ID とパスワードが分かれば誰でもインターネット経由でログインできてしまいます。これが「不正アクセスのリスクが増加する」ということです。

      このリスクを低減するには，ログインに利用者 ID とパスワード以外の要素（ワンタイムパスワードなど）も求める 2 要素認証を，社外から接続する際の認証に導入するのが適切です。
    why:
      - 保存禁止機能は，私有 PC への情報の持ち出しを防ぐ機能です。無効にすると情報漏えいのリスクがかえって増えます。
      - 直接接続では通信が A 社の社内ネットワークを経由しないので，社内ネットワーク側で通信を監視しても，不正アクセスは見つけられません。
      - 通信速度の制限は不正アクセスを防ぐ対策になりません。社内ネットワークを介さずに直接接続するのは通信量を減らすためなので，直接接続の設定変更の目的にも合いません。
      - 正解です。社外から接続できるようになる代わりに認証を強め，利用者 ID とパスワードが漏れても不正にログインされにくくします。
      - 直接接続の対象を絞っても，対象のサービスに社外から接続する際の認証が弱いままで，不正アクセスのリスクは低減されません。
    know: 利用者 ID とパスワードだけの認証は，漏えいやフィッシングで突破されるおそれがある。知識（パスワード），所持（スマートフォンなど），生体の三つのうち二つ以上を組み合わせる多要素認証にすると，不正アクセスのリスクが下がる。
    terms:
      - 多要素認証
      - SaaS
      - BYOD
    verify:
      manual: 設定変更により「社内ネットワークからだけ」のログイン制限が外れることで増える不正アクセスのリスクに対し，認証強化の選択肢だけが対応することを事例の記述と照合
    source:
      examName: 令和6年度 科目B 公開問題
      year: 2024
      questionNo: 6
  - id: IPA-R07-B-006
    topic:
      - B5
      - 11-2-3
      - 5-3-4
    diff: 3
    q: |
      A 社は従業員 200 名の電子機器メーカーである。東京に本社があり，新潟に工場がある。

      A 社では，ファイルサーバを図 1 のように運用している。

      - ファイルサーバは本社と工場のサーバルームに設置している。
      - ファイルサーバは，磁気テープを使用してファイルのバックアップを取得している。
      - 土曜日の午前 2 時からフルバックアップを取得し，翌週の火曜日と木曜日の午前 2 時から増分バックアップを取得している。
      - 情報システム部の担当者は毎週月曜日，火曜日，木曜日の朝 10 時頃，バックアップジョブの実行結果の確認と磁気テープの交換を行い，磁気テープは耐火金庫に保管している。
      - 磁気テープには上書きモードでバックアップを取得し，1 か月分の磁気テープを世代管理している。
      - これまで，フルバックアップからのリストアには平均して 4 時間，1 回の増分バックアップからは平均して 0.25 時間掛かっている。
      - A 社は ICT 継続のための試験を実施しており，ファイルサーバも試験対象である。

      注記　事業影響度分析の結果に基づき，ファイルサーバは，72 時間の目標復旧時点（RPO）と 120 時間の目標復旧時間（RTO）が要求事項として定められている。

      図 1　A 社のファイルサーバの運用

      A 社は ISMS 認証を取得しており，最高情報セキュリティ責任者（CISO）を中心に情報セキュリティに取り組み，定期的に，情報セキュリティリスクアセスメントを行っている。今般，ISMS 認証基準が JIS Q 27001:2023 に改正されたことを受け，情報セキュリティリーダーの B さんは，新基準への移行審査に向けて準備することになった。改正によって新たに追加された情報セキュリティ管理策について，B さんは情報システム部の担当者に取組状況を確認し，その評価結果を表 1 にまとめた。

      表 1　B さんの評価結果（抜粋）

      | 項番 | 情報セキュリティ管理策 | 評価結果 |
      | --- | --- | --- |
      | 1 | （事業継続のための ICT の備え）事業継続の目的及び ICT 継続の要求事項に基づいて，ICT の備えを計画し，実施し，維持し，試験しなければならない。 | 実施している |

      B さんは，移行審査前の内部監査で，内部監査室から表 1 の項番 1 に関するファイルサーバの運用について何点か質問を受け，表 2 のとおり回答した。

      表 2　内部監査室への B さんの回答（抜粋）

      | 項番 | B さんの回答 |
      | --- | --- |
      | 1 | 例えば，金曜日の正午に障害が発生した場合，少なくとも【a1】の時点のデータは復元しなければならない。 |
      | 2 | 例えば，木曜日の正午に障害が発生し，ファイルサーバの全データが消失したとすると，バックアップからのリストアには【a2】時間掛かると予想される。 |
      | 3 | ICT 継続の計画書は，【a3】が承認している。 |

      設問　表 2 中の【a1】～【a3】に入れる字句の適切な組合せを，a に関する解答群の中から選べ。

      a に関する解答群（【a1】，【a2】，【a3】の順）
    c:
      - a1：月曜日の正午，a2：4.25，a3：情報システム部の担当者
      - a1：月曜日の正午，a2：4.50，a3：CISO
      - a1：火曜日の正午，a2：4.50，a3：内部監査室長
      - a1：火曜日の正午，a2：4.25，a3：内部監査室長
      - a1：火曜日の正午，a2：4.25，a3：情報システム部の担当者
      - a1：月曜日の正午，a2：4.50，a3：情報システム部の担当者
      - a1：月曜日の正午，a2：4.25，a3：CISO
      - a1：火曜日の正午，a2：4.50，a3：CISO
      - a1：月曜日の正午，a2：4.25，a3：内部監査室長
      - a1：火曜日の正午，a2：4.50，a3：情報システム部の担当者
    a: ク
    exp: |
      【a1】 目標復旧時点（RPO）は「障害が起きたとき，いつの時点のデータまで戻せればよいか」を示す目標で，72 時間とは，障害発生の 72 時間前までの状態に復旧できればよいという意味です。金曜日の正午の 72 時間前は，金曜日 → 木曜日 → 水曜日 → 火曜日と 24 時間ずつさかのぼって火曜日の正午です。つまり，少なくとも火曜日の正午の時点のデータは復元しなければなりません。

      【a2】 木曜日の正午に障害が発生した場合，それまでに取得済みのバックアップは，土曜日（フルバックアップ），火曜日（増分バックアップ），木曜日の午前 2 時（増分バックアップ）です。復元は，フルバックアップを戻したあとに，増分バックアップを古い順に 2 回適用するので，4 ＋ 0.25 ＋ 0.25 ＝ 4.5 時間掛かります。

      【a3】 ICT 継続の計画書のような ISMS の重要な文書は，情報セキュリティの責任者である CISO が承認します。実務を担当する情報システム部の担当者や，監査をする側である内部監査室長が承認すると，責任や独立性の面で不適切です。

      | 項目 | 答え | 根拠 |
      | --- | --- | --- |
      | a1 | 火曜日の正午 | 金曜日の正午の 72 時間前 |
      | a2 | 4.50 | 4 ＋ 0.25 × 2 |
      | a3 | CISO | 計画の承認は責任者が行う |
    why:
      - a1 が火曜日の正午ではなく，a2 が 4.5 時間でなく，a3 も責任者の承認になっていません。三つとも誤りです。
      - a1 が誤りです。金曜日の正午の 72 時間前は火曜日の正午で，月曜日の正午ではありません。
      - a3 が誤りです。内部監査室長は監査をする側なので，監査の対象である計画書の承認者になるのは不適切です。
      - a2 と a3 が誤りです。リストア時間は 4 ＋ 0.25 × 2 ＝ 4.5 時間で，内部監査室長は監査する側なので計画書の承認者ではありません。
      - a2 と a3 が誤りです。木曜日の正午には火曜日と木曜日の 2 回分の増分バックアップがあるので 4.5 時間掛かり，承認は CISO が行います。
      - a1 と a3 が誤りです。72 時間前は火曜日の正午で，計画書は情報システム部の担当者ではなく責任者の CISO が承認します。
      - 月曜日の正午は 96 時間前で，RPO（72 時間）の定義とずれています。また，増分バックアップは土曜日の後に火曜日と木曜日の 2 回取得されているので，a2 は 4.5 時間になります。
      - 正解です。a1 は金曜日の正午の 72 時間前の火曜日の正午，a2 はフルバックアップ 4 時間と増分バックアップ 2 回の 0.5 時間で 4.5 時間，a3 は CISO です。
      - a1 が火曜日の正午ではなく，a2 が 4.5 時間でなく，a3 の内部監査室長は監査をする側で，監査される計画の承認者としては不適切です。三つとも誤りです。
      - a3 が誤りです。ICT 継続の計画書のような重要な文書は，担当者ではなく責任者である CISO が承認します。
    know: RPO は「どの時点のデータまで戻すか」，RTO は「どれだけの時間で復旧するか」の目標。増分バックアップは前回のバックアップ以降の変更分だけを取得するため，復元には最後のフルバックアップに加えて，それ以降の増分バックアップをすべて順に適用する必要がある（差分バックアップなら最新の 1 回分でよい）。
    terms:
      - RPO
      - RTO
      - フルバックアップ
      - 増分バックアップ
      - CISO
      - ISMS
    verify:
      manual: RPO 72 時間 ＝ 金曜日の正午の 72 時間前 ＝ 火曜日の正午，リストア時間 ＝ 4 ＋ 0.25 × 2 ＝ 4.5 時間を確認。承認者は責任者である CISO
