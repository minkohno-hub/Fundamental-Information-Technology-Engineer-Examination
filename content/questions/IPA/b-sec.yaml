  - id: IPA-R08-B-006
    topic:
      - B5
      - 11-4-1
      - 11-2-4
    diff: 2
    q: |
      A 社は，従業員 1,000 名の広告代理店である。A 社では，各部署が A 社の社内ネットワークに設置したファイルサーバを，設置した部署の運用担当者が管理している。各部署で新たなクラウドサービスを利用する場合，各部署の責任者の承認のもと契約し，各部署の運用担当者が管理している。

      営業部では，営業部が A 社の社内ネットワークに設置したファイルサーバ（以下，Y サーバという）及び顧客管理のためのクラウドサービス（以下，Z サービスという）を利用している。営業部の各従業員には Y サーバの一般利用者アカウントが割り当てられ，Y サーバ上の全てのファイルが編集可能である。また，営業部の各従業員には，Z サービスの一般利用者アカウントが割り当てられ，営業部の運用担当者には，Y サーバと Z サービスの管理者アカウントが割り当てられている。

      情報セキュリティ部門では，クラウドサービスに関連した情報セキュリティインシデントの発生に備えて，各部署で利用しているクラウドサービスのログ管理に関するルールを図 1 のとおりに整備した。

      1. ログの取得

      - 次のログを取得すること
      - ログイン及びログアウトのログ（以下，ログインログという）
      - クラウドサービスでの重要な操作及びその成否に関するログ

      2. ログの項目

      - 少なくとも次が記録されること
      - 対象のアカウント名，日本標準時での日時，操作内容

      3. ログのアクセス管理

      - 運用担当者だけがログにアクセスできるようにすること
      - クラウドサービスからログをエクスポートして保管する場合は，社内ネットワークに設置した自部署のファイルサーバにログを保管し，運用担当者だけがアクセスできるようにすること
      - 運用担当者は複数名にすること
      - クラウドサービスへの運用担当者のログインには，2 要素認証を必要とすること

      4. ログの保存期間

      - 少なくとも過去 1 年間のログが参照できるようにすること

      5. 改ざんへの対策

      - ログは運用担当者でも書込み及び消去ができないようにすること

      図 1　各部署で利用しているクラウドサービスのログ管理に関するルール

      営業部の情報セキュリティリーダーである B 課長は，運用担当者の C 主任及び情報セキュリティ部門の協力を得て，図 1 のルールが順守されているかどうかを調査した。B 課長は，Z サービスでの現在の運用の中で，図 1 のルールに違反しているものを表 1 のとおりまとめた。

      表 1　図 1 のルールに違反している現在の運用

      | 項番 | 現在の運用 |
      | --- | --- |
      | (一) | Z サービスのログは，空き容量が一定値以下になった場合，古いログから上書きされる。 |
      | (二) | Z サービスの運用は，営業部の C 主任と D 主任の 2 名で担当していたが，D 主任が先月退職したので，現在は C 主任だけである。 |
      | (三) | Z サービスのログの日時は，UTC で記録されている。 |
      | (四) | Z サービスのログは，毎月末に全てエクスポートし，Y サーバに保管している。 |

      設問　表 1 中の運用のうち，図 1 のルール 3 に違反しているものの項番だけを全て挙げた組合せを，解答群の中から選べ。
    c:
      - (一)，(四)
      - (一)，(二)
      - (一)，(三)，(四)
      - (三)，(四)
      - (二)，(三)，(四)
      - (一)，(二)，(三)
      - (二)，(三)
      - (一)，(三)
      - (二)，(四)
      - (一)，(二)，(四)
    a: ケ
    exp: |
      設問は「ルール 3（ログのアクセス管理）に違反しているもの」だけを選ぶ問題です。ルール 3 の要求は，「運用担当者だけがアクセスできる」「エクスポートしたログは自部署のファイルサーバに保管し，運用担当者だけがアクセスできる」「運用担当者は複数名」「運用担当者のログインに 2 要素認証」の四つです。表 1 の各運用をこれに照らします。

      | 項番 | 内容 | 違反するルール | ルール 3 に違反するか |
      | --- | --- | --- | --- |
      | (一) | 容量不足でログが上書きされる | ルール 4（1 年間参照できること）やルール 5（改ざん対策）に関わる | しない |
      | (二) | 運用担当者が C 主任だけの 1 名 | ルール 3 の「運用担当者は複数名」 | する |
      | (三) | 日時が UTC で記録される | ルール 2（日本標準時で記録） | しない |
      | (四) | Y サーバへエクスポートして保管 | ルール 3。Y サーバは営業部の全従業員が一般利用者として全ファイルを編集できるので，運用担当者だけがアクセスできる状態ではない | する |

      したがって，ルール 3 に違反しているのは (二) と (四) です。
    why:
      - (一) はルール 3 の違反ではなく，ルール 4，5 に関わる問題です。また (二) も違反なのに含まれていません。
      - (一) はログの保存期間や改ざん対策（ルール 4，5）に関わる問題で，ルール 3 の違反ではありません。また (四) も違反なのに含まれていません。
      - (一) と (三) はルール 3 の違反ではありません。また (二) も違反なのに含まれていません。
      - (三) はルール 3 の違反ではありません。また (二) も違反なのに含まれていません。
      - (三) はルール 2（日本標準時で記録）に関わる問題で，ルール 3 の違反ではありません。
      - (一) はルール 4，5 に，(三) はルール 2 に関わる問題で，どちらもルール 3 の違反ではありません。(四) の違反も含まれていません。
      - (三) はルール 2（日本標準時で記録）に関わる問題で，ルール 3 の違反ではありません。また (四) も違反なのに含まれていません。
      - (一) と (三) はルール 3 ではなくそれぞれルール 4，5 とルール 2 に関わる問題です。ルール 3 に違反する (二) と (四) が含まれていません。
      - 正解です。(二) は運用担当者が複数名という要件に，(四) は運用担当者だけがアクセスできるという要件に反します。
      - (一) はルール 3 の違反ではなく，ルール 4，5 に関わる問題です。
    know: ログは不正や障害の原因を調べる証拠になるため，取得するだけでなく「誰がアクセスできるか」「改ざんされないか」「どれだけ保存するか」も管理する必要がある。ログの保管先が広く編集可能だと，証拠を書き換えられるおそれがある。
    terms:
      - ログ
      - ログ管理
      - アクセス制御
      - 最小権限の原則
    verify:
      manual: 図 1 のルール 3 の 4 要件と表 1 の各運用を照合し，(二)（運用担当者 1 名）と (四)（全従業員が編集できる Y サーバへの保管）のみが違反することを確認
