questions:
  - id: IPA-R05-A-019
    topic: 17-1-1-4
    diff: 1
    noShuffle: true
    q: "CIO の説明はどれか。"
    c:
      - "経営戦略の立案及び業務執行を統括する最高責任者"
      - "資金調達，財務報告などの財務面での戦略策定及び執行を統括する最高責任者"
      - "自社の技術戦略や研究開発計画の立案及び執行を統括する最高責任者"
      - "情報管理，情報システムに関する戦略立案及び執行を統括する最高責任者"
    a: エ
    exp: "CIO(Chief Information Officer)は，情報管理や情報システムに関する戦略の立案と執行を統括する最高責任者である。"
    why:
      - "これは CEO の説明である。"
      - "これは CFO の説明である。"
      - "これは CTO の説明である。"
      - "正解です。情報システムに関する最高責任者が CIO である。"
    know: "CEO，CFO，COO，CTO などと合わせて覚える。"
    terms: ["CIO"]
