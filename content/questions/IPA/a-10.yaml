questions:
  - id: IPA-R05-A-008
    topic: 10-3-1-3
    diff: 1
    noShuffle: true
    q: "IPv4 ネットワークにおいて，ネットワークの疎通確認に使われるものはどれか。"
    c:
      - "BOOTP"
      - "DHCP"
      - "MIB"
      - "ping"
    a: エ
    exp: "ping は ICMP のエコー要求と応答を使い，相手に IP パケットが届くか(疎通)を確認するコマンドである。"
    why:
      - "BOOTP は起動時に IP アドレスなどを割り当てるプロトコルである。"
      - "DHCP は IP アドレスなどを自動的に割り当てるプロトコルである。"
      - "MIB は SNMP で管理対象の情報を表す管理情報ベースである。"
      - "正解です。ping が ICMP を使って疎通を確認する。"
    know: "経路の確認には traceroute を使う。"
    terms: ["ICMP", "ping", "DHCP"]
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 8 }
  - id: IPA-R06-A-008
    topic: 10-2-3
    diff: 2
    noShuffle: true
    q: "LAN 間接続装置に関する記述のうち，適切なものはどれか。"
    c:
      - "ゲートウェイは，OSI 基本参照モデルにおける第 1 ～ 3 層だけのプロトコルを変換する。"
      - "ブリッジは，IP アドレスを基にしてフレームを中継する。"
      - "リピータは，同種のセグメント間で信号を増幅することによって伝送距離を延長する。"
      - "ルータは，MAC アドレスを基にしてフレームを中継する。"
    a: ウ
    exp: "リピータは物理層で動作し，同種のセグメント間で信号を増幅・整形して伝送距離を延ばす装置である。"
    why:
      - "ゲートウェイは主に第 4 層以上を含むプロトコルを変換する。"
      - "ブリッジは第 2 層で，MAC アドレスを基にフレームを中継する。"
      - "正解です。リピータは信号を増幅して伝送距離を延長する。"
      - "ルータは第 3 層で，IP アドレスを基にパケットを中継する。"
    know: "リピータは物理層，ブリッジ(L2 スイッチ)はデータリンク層，ルータはネットワーク層で動作する。"
    terms: ["リピータ", "ブリッジ", "ルータ", "ゲートウェイ"]
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 8 }
  - id: IPA-R07-A-007
    topic: 10-1-5
    diff: 3
    noShuffle: true
    q: "1G バイトの動画データを 40M ビット／秒の回線を使用してダウンロードしたところ，5 分掛かった。このときの回線利用率はおよそ何％か。ここで，ダウンロード時には動画データに 20％の制御情報が付加されるものとする。"
    c:
      - "10"
      - "53"
      - "67"
      - "80"
    a: エ
    exp: "1G バイトは 8,000M ビット。制御情報 20％を加えると 9,600M ビットで，5 分(300 秒)なので実効速度は 32M ビット/秒。回線速度 40M ビット/秒に対する利用率は 80％である。"
    why:
      - "10％は転送量の計算を誤った値で，32/40 とは一致しない。"
      - "制御情報を加算せず 20％差し引いて 6,400÷300÷40 と計算した値（約 53％）で，制御情報の扱いが逆である。"
      - "制御情報の 20％を加えずに 8,000÷300÷40 と計算した値（約 67％）で，32/40 とは一致しない。"
      - "正解です。8,000×1.2÷300=32M ビット/秒，32÷40=0.8 で 80％になる。"
    know: "1 バイト=8 ビット。データ量を時間で割って実効速度を求め，回線速度で割る。"
    verify: { value: "8000*1.2/300/40*100" }
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 7 }
  - id: IPA-R08-A-008
    topic: 10-1-3
    diff: 2
    noShuffle: true
    q: "無線 LAN では，複数の端末から送信された同じ周波数の電波が衝突した場合，電波が干渉するのでそれらを受信すると信号を復調できないことがある。この問題を回避するためのものはどれか。"
    c:
      - "CSMA/CA"
      - "SSID"
      - "キャリアアグリゲーション"
      - "テザリング"
    a: ア
    exp: "CSMA/CA は，送信前に回線が空いていることを確認し，ランダムな待ち時間を置くなどして，電波の衝突を回避する無線 LAN のアクセス制御方式である。"
    why:
      - "正解です。衝突を回避するアクセス制御が CSMA/CA である。"
      - "SSID は無線 LAN のネットワークを識別する名前である。"
      - "キャリアアグリゲーションは複数の周波数帯を束ねて高速化する携帯電話の技術である。"
      - "テザリングはスマートフォンなどを経由して他の機器をインターネットに接続する機能である。"
    know: "有線 LAN の CSMA/CD は衝突を検出する方式で，CSMA/CA は衝突を避ける方式。"
    terms: ["CSMA/CA", "SSID", "テザリング"]
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 8 }
