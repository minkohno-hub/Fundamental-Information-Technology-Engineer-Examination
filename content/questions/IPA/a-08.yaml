questions:
  - id: IPA-R05-A-005
    topic: 8-2-1-3
    diff: 2
    noShuffle: true
    q: "3 次元グラフィックス処理におけるクリッピングの説明はどれか。"
    c:
      - "CG 映像作成における最終段階として，物体のデータをディスプレイに描画できるように映像化する処理である。"
      - "画像表示領域にウィンドウを定義し，ウィンドウの外側を除去し，内側の見える部分だけを取り出す処理である。"
      - "スクリーンの画素数が有限であるために図形の境界近くに生じる，階段状のギザギザを目立たなくする処理である。"
      - "立体感を生じさせるために，物体の表面に陰影を付ける処理である。"
    a: イ
    exp: "クリッピングは，表示領域(ウィンドウ)の外にある図形を取り除き，内側の見える部分だけを描画対象にする処理である。"
    why:
      - "これはレンダリングの説明である。"
      - "正解です。ウィンドウ外を除去して内側だけを取り出すのがクリッピングである。"
      - "これはアンチエイリアシングの説明である。"
      - "これはシェーディング(陰影付け)の説明である。"
    know: "3D 表示の流れはモデリング，クリッピング，レンダリングなどの順に進む。"
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 5 }
  - id: IPA-R06-A-006
    topic: 8-2-1-2
    diff: 1
    noShuffle: true
    q: "液晶ディスプレイなどの表示装置において，傾いた直線の境界を滑らかに表示する手法はどれか。"
    c:
      - "アンチエイリアシング"
      - "シェーディング"
      - "テクスチャマッピング"
      - "バンプマッピング"
    a: ア
    exp: "アンチエイリアシングは，図形の境界に中間の色を補うことで，画素の粗さによる階段状のギザギザを目立たなくして滑らかに見せる手法である。"
    why:
      - "正解です。境界に中間色を補ってギザギザを目立たなくする。"
      - "シェーディングは物体表面の陰影を付ける処理である。"
      - "テクスチャマッピングは物体の表面に模様や画像を貼り付ける処理である。"
      - "バンプマッピングは表面の凹凸を陰影で表現する処理である。"
    know: "ギザギザはジャギーとも呼ばれる。"
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 6 }
