questions:
  - id: IPA-R05-A-004
    topic: 4-1-2
    diff: 1
    noShuffle: true
    q: "エッジコンピューティングの説明として，最も適切なものはどれか。"
    c:
      - "画面生成やデータ処理をクライアント側で実行することによって，Web アプリケーションソフトウェアの操作性や表現力を高めること"
      - "データが送信されてきたときだけ必要なサーバを立ち上げて，処理が終わり次第サーバを停止してリソースを解放すること"
      - "複数のサーバや PC を仮想化して統合することによって一つの高性能なコンピュータを作り上げ，並列処理によって処理能力を高めること"
      - "利用者や機器に取り付けられたセンサなどのデータ発生源に近い場所にあるサーバなどでデータを一次処理し，処理のリアルタイム性を高めること"
    a: エ
    exp: "エッジコンピューティングは，センサなどデータの発生源に近い場所(エッジ)で処理を行い，クラウドまでの通信遅延を減らしてリアルタイム性を高める考え方である。"
    why:
      - "これはリッチクライアント(Ajax など)の説明である。"
      - "これはサーバレス(FaaS)の説明である。"
      - "これは仮想化によるクラスタやグリッドコンピューティングに近い説明である。"
      - "正解です。データ発生源の近くで一次処理するのがエッジコンピューティングである。"
    know: "IoT では大量のデータをすべてクラウドへ送らず，エッジで絞り込んで通信量と遅延を減らす。"
    terms: ["エッジコンピューティング", "IoT"]
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 4 }
  - id: IPA-R05-A-015
    topic: 4-1-2
    diff: 1
    noShuffle: true
    q: "ハイブリッドクラウドの説明はどれか。"
    c:
      - "クラウドサービスが提供している機能の一部を，自社用にカスタマイズして利用すること"
      - "クラウドサービスのサービス内容を，消費者向けと法人向けの両方を対象とするように構成して提供すること"
      - "クラウドサービスのサービス内容を，有償サービスと無償サービスとに区分して提供すること"
      - "自社専用に使用するクラウドサービスと，汎用のクラウドサービスとの間でデータ及びアプリケーションソフトウェアの連携や相互運用が可能となる環境を提供すること"
    a: エ
    exp: "ハイブリッドクラウドは，自社専用のクラウド(プライベート)や自社設備と，汎用のクラウド(パブリック)を連携させて使う形態である。"
    why:
      - "これはカスタマイズ利用の説明で，ハイブリッドクラウドではない。"
      - "提供対象の区分であり，ハイブリッドクラウドの定義ではない。"
      - "有償と無償の区分であり，ハイブリッドクラウドの定義ではない。"
      - "正解です。専用と汎用のクラウドを連携・相互運用する環境である。"
    know: "クラウドの提供形態には，パブリック，プライベート，ハイブリッド，コミュニティがある。"
    terms: ["ハイブリッドクラウド"]
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 15 }
  - id: IPA-R06-A-004
    topic: 4-2-2-2
    diff: 2
    noShuffle: true
    q: "あるシステムの今年度の MTBF は 3,000 時間，MTTR は 1,000 時間である。翌年度は MTBF について今年度の 20％分の改善，MTTR について今年度の 10％分の改善を図ると，翌年度の稼働率は何％になるか。"
    c:
      - "69"
      - "73"
      - "77"
      - "80"
    a: エ
    exp: "翌年度の MTBF は 3,000×1.2=3,600 時間，MTTR は 1,000×0.9=900 時間。稼働率=MTBF/(MTBF+MTTR)=3,600/4,500=0.8 で 80％になる。"
    why:
      - "MTBF を 20％減らし MTTR を 10％増やして 2,400/3,500 と計算した値（約 69％）で，改善の方向が逆である。"
      - "MTBF を 20％減らして 2,400/(2,400+900) と計算した値（約 73％）で，MTBF の改善方向が逆である。"
      - "MTTR だけを改善し MTBF を 3,000 のままにして 3,000/3,900 と計算した値（約 77％）で，MTBF の改善を反映していない。"
      - "正解です。3,600/(3,600+900)=0.8 で 80％になる。"
    know: "稼働率=MTBF/(MTBF+MTTR)。"
    terms: ["MTBF", "MTTR", "稼働率"]
    verify: { value: "3000*1.2/(3000*1.2+1000*0.9)*100" }
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 4 }
  - id: IPA-R07-A-004
    topic: 4-2-2-2
    diff: 2
    noShuffle: true
    q: "MTBF は 4,000 時間，MTTR は 1,000 時間の装置がある。今後の 6 年間は，予防保守によって MTBF を前年に比べて毎年 100 時間ずつ改善し，遠隔保守によって MTTR を前年に比べて毎年 100 時間ずつ改善していく計画である。6 年経過後の稼働率は幾らか。"
    c:
      - "0.88"
      - "0.90"
      - "0.92"
      - "0.94"
    a: ウ
    exp: "6 年後の MTBF は 4,000+100×6=4,600 時間，MTTR は 1,000-100×6=400 時間。稼働率=4,600/(4,600+400)=0.92 になる。"
    why:
      - "0.88 は改善年数や改善量を正しく反映していない値である。"
      - "0.90 は 4,500/(4,500+500)に相当する，5 年後の値である。"
      - "正解です。4,600/5,000=0.92 になる。"
      - "0.94 は改善を過大に見積もった値で，4,600/5,000 とは一致しない。"
    know: "稼働率=MTBF/(MTBF+MTTR)。"
    terms: ["MTBF", "MTTR", "稼働率"]
    verify: { value: "4600/(4600+400)" }
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 4 }
  - id: IPA-R08-A-004
    topic: 4-1-2
    diff: 2
    noShuffle: true
    q: "クラウドコンピューティングのサービスモデルとしての PaaS の説明はどれか。"
    c:
      - "OS やアプリケーションを含む任意のソフトウェアを実行可能にするリソースが，利用者に提供される。OS などのプラットフォームへの限定的な設定や制御を行うことができる。"
      - "アプリケーションの開発や運用に必要となるミドルウェアなどが利用者に提供されるので，これらを利用して，アプリケーションを開発して運用することができる。利用者は，プラットフォームを直接変更することはできない。"
      - "利用者は，ハードウェア，OS などのプラットフォームとアプリケーションを自ら準備して，それらの運用を依頼する。利用者は，プラットフォームの構成を決めることができるなど，環境構築の自由度が高い。"
      - "利用者は，用意されたアプリケーションをそのまま又はカスタマイズして利用するが，OS などのプラットフォームからアプリケーションまで全てを自ら準備する必要はない。利用者は，プラットフォームを直接変更することはできない。"
    a: イ
    exp: "PaaS(Platform as a Service)は，アプリケーションの開発・運用に必要なプラットフォーム(ミドルウェアなど)を提供するサービスで，利用者はアプリケーションを開発して運用するが，プラットフォームは直接変更できない。"
    why:
      - "これは IaaS の説明である。"
      - "正解です。プラットフォームを提供し，利用者がアプリケーションを開発・運用するのが PaaS である。"
      - "これはホスティングやハウジングなど，環境を自ら構成して運用を委託する形態の説明である。"
      - "これは SaaS の説明である。"
    know: "提供範囲は SaaS，PaaS，IaaS の順に利用者の自由度が高くなる。"
    terms: ["PaaS", "IaaS", "SaaS"]
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 4 }
  - id: IPA-R08-A-014
    topic: 4-2-2-2
    diff: 3
    noShuffle: true
    q: "A 社は，自社のデータセンタでアプリケーションシステムを運用し，顧客にサービスを提供している。現在，アプリケーションシステムの実行環境をクラウドサービスに移行して，サービス可用性を向上させることを検討している。次の条件のとき，サービス可用性は移行後に何パーセントポイント向上するか。ここで，サービス可用性（％）は小数第 3 位を切り捨てるものとする。\n\n〔条件〕\n\n- サービス提供時間は，移行前も移行後も同じで，計画された保守の時間を除き，年間 5,000 時間である。\n- 移行前は，サービス提供時間内の停止時間が，年間 100 時間である。\n- 移行後は，サービス提供時間内の停止時間が，年間 30 分となる。"
    c:
      - "0.01"
      - "0.19"
      - "1.40"
      - "1.99"
    a: エ
    exp: "移行前の可用性は(5,000-100)/5,000=98.00％。移行後は(5,000-0.5)/5,000=99.99％(小数第 3 位切捨て)。差は 99.99-98.00=1.99 パーセントポイントになる。"
    why:
      - "0.01 は移行後の停止割合 0.01％だけを取り出した値である。"
      - "0.19 は計算を誤った値で，差の 1.99 とは一致しない。"
      - "1.40 は停止時間を誤って計算した値で，差の 1.99 とは一致しない。"
      - "正解です。99.99％と 98.00％の差で 1.99 パーセントポイントになる。"
    know: "可用性=(サービス提供時間-停止時間)/サービス提供時間。30 分は 0.5 時間に換算する。"
    terms: ["可用性", "稼働率"]
    verify: { value: "99.99-98", tolerance: 0.001 }
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 14 }
