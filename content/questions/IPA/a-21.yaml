questions:
  - id: IPA-R05-A-017
    topic: 21-1-2
    diff: 1
    noShuffle: true
    q: "ERP を説明したものはどれか。"
    c:
      - "営業活動に IT を活用して営業の効率と品質を高め，売上・利益の大幅な増加や，顧客満足度の向上を目指す手法・概念である。"
      - "卸売業・メーカが小売店の経営活動を支援することによって，自社との取引量の拡大につなげる手法・概念である。"
      - "企業全体の経営資源を有効かつ総合的に計画して管理し，経営の効率向上を図るための手法・概念である。"
      - "消費者向けや企業間の商取引を，インターネットなどの電子的なネットワークを活用して行う手法・概念である。"
    a: ウ
    exp: "ERP(Enterprise Resource Planning)は，ヒト，モノ，カネ，情報などの経営資源を企業全体で統合的に計画・管理し，経営の効率化を図る手法・概念である。"
    why:
      - "これは SFA(営業支援システム)の説明である。"
      - "これはリテールサポートの説明である。"
      - "正解です。企業全体の経営資源を統合的に管理するのが ERP である。"
      - "これは EC(電子商取引)の説明である。"
    know: "ERP パッケージは会計，販売，生産，人事などの基幹業務を統合している。"
    terms: ["ERP", "SFA"]
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 17 }
  - id: IPA-R07-A-017
    topic: 21-1-4-3
    diff: 1
    noShuffle: true
    q: "インターネット上の生成 AI サービスを利用する際に，オプトアウトを設定することはどのような場合に有効か。"
    c:
      - "個々の利用者が，自身が生成 AI から得た情報に対して，著作権を主張したい場合"
      - "個々の利用者が入力した情報を，生成 AI の学習に利用させたくない場合"
      - "個々の利用者が入力した情報を，生成 AI を通じて，他の利用者にも知ってほしい場合"
      - "生成 AI から得た情報の信ぴょう性を高めたい場合"
    a: イ
    exp: "オプトアウトは，利用者が自分のデータの利用を拒否する設定である。入力した情報を生成 AI の学習に使わせたくないときに有効である。"
    why:
      - "著作権の主張はオプトアウトとは関係がない。"
      - "正解です。入力情報を学習に使わせない設定がオプトアウトである。"
      - "他の利用者へ知らせたい場合は，オプトアウトでは実現できない。"
      - "信ぴょう性の向上は，オプトアウトとは関係がない。"
    know: "機密情報や個人情報を生成 AI に入力しないことも重要である。"
    terms: ["オプトアウト", "生成AI"]
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 17 }
  - id: IPA-R08-A-016
    topic: 21-3-1-1
    diff: 2
    noShuffle: true
    q: "小売事業者が，オムニチャネル戦略を実現するための IT 活用事例はどれか。"
    c:
      - "実店舗，オンライン店舗，コールセンタなど複数の顧客接点で，顧客情報や在庫情報などを一元的に管理・共有して接客することによって，顧客の利便性を高める。"
      - "複数店舗からネットワークを経由して，受発注，出荷，請求，支払などの取引情報を電子的に交換することによって，卸売業者とメーカとの間の受発注業務の効率を高める。"
      - "複数店舗に設置した監視カメラの画像データを本部に集め，本部が各店舗の状況をリアルタイムに把握することによって，店舗運営業務の効率を高める。"
      - "複数店舗の POS データを本部に集め，本部が日次で売れ筋商品の抽出，複数の商品の併売率の分析を行うことによって，商品計画や棚割計画を最適化する。"
    a: ア
    exp: "オムニチャネルは，実店舗，オンライン店舗，コールセンタなどあらゆる顧客接点を統合し，顧客情報や在庫情報を一元的に管理して一貫した顧客体験を提供する戦略である。"
    why:
      - "正解です。複数の顧客接点の情報を一元管理して接客するのがオムニチャネルである。"
      - "これは EDI の説明で，企業間の取引情報の電子交換である。"
      - "これは店舗の遠隔監視の事例で，顧客接点の統合ではない。"
      - "これは POS データ分析の事例で，顧客接点の統合ではない。"
    know: "マルチチャネルは複数の接点を個別に運営，オムニチャネルは統合して運営する点が異なる。"
    terms: ["オムニチャネル", "EDI", "POS"]
    source: { examName: "令和8年度 科目A 公開問題", year: 2026, questionNo: 16 }
