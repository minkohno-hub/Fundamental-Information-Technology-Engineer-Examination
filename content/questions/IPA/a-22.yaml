  - id: IPA-R05-A-016
    topic: 22-1-2-2
    diff: 1
    noShuffle: true
    q: "ダイバーシティマネジメントの説明はどれか。"
    c:
      - "従業員が仕事と生活の調和を図り，やりがいをもって業務に取り組み，組織の活力を向上させることである。"
      - "性別や年齢，国籍などの面で従業員の多様性を尊重することによって，組織の活力を向上させることである。"
      - "自ら設定した目標の達成を目指して従業員が主体的に業務に取り組み，その達成度に応じて評価が行われることである。"
      - "労使双方が労働条件についての合意を形成し，協調して収益の増大を目指すことである。"
    a: イ
    exp: "ダイバーシティマネジメントは，性別，年齢，国籍などの多様性を尊重し，多様な人材の力を組織の活力と成果につなげる経営手法である。"
    why:
      - "これはワークライフバランスの説明である。"
      - "正解です。多様性を尊重して組織の活力を高めるのがダイバーシティマネジメントである。"
      - "これは目標管理(MBO)の説明である。"
      - "これは労使協調に関する説明で，ダイバーシティとは別の概念である。"
    know: "ダイバーシティ&インクルージョンとして，多様性を受け入れ活かす考え方が広まっている。"
    source: { examName: "令和5年度 科目A 公開問題", year: 2023, questionNo: 16 }
  - id: IPA-R06-A-018
    topic: 22-1-5-2
    diff: 1
    noShuffle: true
    q: "HR テックの説明はどれか。"
    c:
      - "ICT を活用して，住宅内のエネルギー使用状況の監視，機器の遠隔操作や自動制御などを可能にし，家庭におけるエネルギー管理を支援するソリューション"
      - "既存のビジネスモデルによる業界秩序や既得権益を破壊してしまうほど大きな影響を与える新しい ICT やビジネスモデル"
      - "個人の資金に関わる情報を統合的に管理するサービスやマーケットプレイス・レンディングなどの金融サービスを実現するための新しい情報技術"
      - "採用，育成，評価，配属などの人事領域の業務を対象に，ビッグデータ解析や AI などの最新 ICT を活用して，業務改善と社員満足度向上を図るソリューション"
    a: エ
    exp: "HR テックは，Human Resource(人事)と Technology を組み合わせた語で，採用，育成，評価，配属などの人事業務に AI やビッグデータ解析を活用する取組みである。"
    why:
      - "これは HEMS(ホームエネルギー管理システム)の説明である。"
      - "これはデジタルディスラプションの説明である。"
      - "これはフィンテックの説明である。"
      - "正解です。人事業務に最新 ICT を活用するのが HR テックである。"
    know: "同様の X-Tech には，フィンテック，エドテックなどがある。"
    terms: ["HRテック", "フィンテック"]
    source: { examName: "令和6年度 科目A 公開問題", year: 2024, questionNo: 18 }
