  - id: IPA-R07-A-016
    topic: 22-2-2-2
    diff: 1
    noShuffle: true
    q: "データマイニングの手法の一つであって，POS などの蓄積データから“一緒に買われる商品”の組合せを発見する分析手法はどれか。"
    c:
      - "3C 分析"
      - "ABC 分析"
      - "コンジョイント分析"
      - "マーケットバスケット分析"
    a: エ
    exp: "マーケットバスケット分析は，POS の購買データから同時に買われやすい商品の組合せ(アソシエーション)を発見する分析手法である。"
    why:
      - "3C 分析は顧客，競合，自社の観点で環境を分析する手法である。"
      - "ABC 分析は売上などで品目を重要度別に分類する手法である。"
      - "コンジョイント分析は商品の属性ごとの選好を数量的に分析する手法である。"
      - "正解です。一緒に買われる商品の組合せを見つけるのがマーケットバスケット分析である。"
    know: "「ビールと紙おむつ」の例が有名である。"
    terms: ["データマイニング", "ABC分析"]
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 16 }
  - id: IPA-R07-A-019
    topic: 22-3-1-1
    diff: 2
    noShuffle: true
    q: "次の条件で喫茶店を開業したい。月 10 万円の利益を出すためには，1 客席当たり 1 日平均何人の客が必要か。\n\n| 項目 | 値 |\n|---|---|\n| 客 1 人当たりの売上高 | 500 円 |\n| 客 1 人当たりの変動費 | 100 円 |\n| 固定費 | 300,000 円／月 |\n| 1 か月の営業日数 | 20 日 |\n| 客席数 | 10 席 |"
    c:
      - "3.75"
      - "4"
      - "4.2"
      - "5"
    a: エ
    exp: "客 1 人当たりの限界利益は 500-100=400 円。必要な限界利益は固定費 300,000 円と目標利益 100,000 円の合計 400,000 円なので，必要な客数は月 1,000 人。1 日 50 人，1 客席当たり 5 人になる。"
    why:
      - "3.75 は目標利益を含めず，固定費だけを回収する損益分岐点（300,000÷400÷20÷10）の値である。"
      - "限界利益 400 円ではなく売上高 500 円で割って 400,000÷500÷20÷10 と計算した値で，必要客数と一致しない。"
      - "4.2 は計算を誤った値で，1,000 人÷20 日÷10 席とは一致しない。"
      - "正解です。400,000÷400=1,000 人，÷20 日÷10 席=5 人になる。"
    know: "損益分岐点分析では，限界利益=売上-変動費として計算する。"
    terms: ["限界利益", "損益分岐点", "固定費"]
    verify: { value: "(300000+100000)/(500-100)/20/10" }
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 19 }
  - id: IPA-R07-A-020
    topic: 22-1-5-2
    diff: 2
    noShuffle: true
    q: "カーボンフットプリントの説明として，適切なものはどれか。"
    c:
      - "温室効果ガスの排出量から吸収量と除去量を差し引いた合計をゼロにする取組"
      - "原材料調達から廃棄・リサイクルに至るまでのライフサイクル全体を通して排出される温室効果ガスの排出量を，CO2 量に換算して，その値を商品やサービスに表示すること"
      - "自動車のエンジンから排出される一酸化炭素，窒素酸化物や炭化水素類などの大気汚染物質の排出量の定め"
      - "商品がどのような場所で作られて，流通し，販売されているかを把握するための仕組み"
    a: イ
    exp: "カーボンフットプリントは，商品やサービスの原材料調達から廃棄・リサイクルまでの全過程で排出される温室効果ガスを CO2 量に換算して表示する仕組みである。"
    why:
      - "これはカーボンニュートラルの説明である。"
      - "正解です。ライフサイクル全体の排出量を CO2 換算で表示するのがカーボンフットプリントである。"
      - "これは自動車の排出ガス規制の説明である。"
      - "これはトレーサビリティの説明である。"
    know: "カーボンニュートラルは排出量と吸収量・除去量を均衡させる目標である。"
    terms: ["トレーサビリティ"]
    source: { examName: "令和7年度 科目A 公開問題", year: 2025, questionNo: 20 }
