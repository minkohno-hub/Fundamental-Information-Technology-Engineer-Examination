category: '15'
batch: H2
reviewed:
  at: '2026-10-30'
  method: 独立レビュー担当が解答を伏せて解き直し、全問の再計算・概念の照合・誤答の検証と既存問題との重複確認を実施。A15-502 の誤答選択肢を、誤答解説の導出（増加率5％の複利では15か月後）と一致するよう修正済み
questions:
  - id: A15-501
    topic: 15-1-4
    diff: 3
    scope: 15-1-4 サービスレベル管理。月間のサービス時間と停止時間から稼働率を計算し、SLA の目標値と照合して達成可否を判断する問題であり、範囲内。
    prereq: 稼働率 ＝ （サービス時間 − 停止時間） ÷ サービス時間 という計算と、目標 99.9％ が許容する停止時間の大きさの感覚
    hard: 分単位への換算、許容停止時間（43.2 分）と実績（54 分）の比較、四捨五入した稼働率の見かけに惑わされず未達と判定する必要がある。
    q: |
      あるサービスは、24 時間・30 日（サービス時間の合計は 43,200 分）を対象期間として、月間稼働率 99.9％ を SLA で保証している。当月の停止時間の合計は 54 分であった。当月の稼働率と SLA の達成状況について、適切なものはどれか。
    c:
      - 稼働率は約 99.95％ であり、SLA は達成である
      - 稼働率は目標にわずかに届かないが、四捨五入すれば目標値と同じに見えるため、SLA は達成である
      - 稼働率は約 99.88％ であり、目標の 99.9％ に届かず、SLA は未達である
      - 稼働率は約 99.5％ であり、SLA は未達である
    a: ウ
    exp: |
      稼働率は （43,200 − 54） ÷ 43,200 × 100 ＝ 99.875％、約 99.88％ です。目標 99.9％ が許容する停止時間は 43,200 × 0.001 ＝ 43.2 分までであり、実績の 54 分はこれを超えています。したがって、稼働率が目標にわずかに届かず、SLA は未達です。稼働率の表示を四捨五入して 99.9％ と見せることは、達成したことにはなりません。保証値との比較は、丸める前の値で行います。
    why:
      - 99.95％ は、停止時間が約 21.6 分の場合の値です。実績は 54 分なので、この値にはなりません。
      - 四捨五入して目標と同じ数字に見えることは、達成の根拠にはなりません。比較は丸める前の値で行います。
      - 正解です。稼働率 99.875％ は目標 99.9％ を下回り、停止時間も許容 43.2 分を超えています。
      - 99.5％ は、停止率を実際より約 4 倍大きく見積もった値です。54 ÷ 43,200 は約 0.125％ です。
    know: 99.9％ のような高い稼働率目標では、許容できる停止時間は月あたり数十分しかない。達成判定は表示上の丸めではなく実績値で行い、未達の場合は改善や報告の手続に進む。
    terms:
      - SLA
      - 稼働率
    verify:
      value: (43200 - 54) / 43200 * 100
      tolerance: 0.01
  - id: A15-502
    topic: 15-2-11
    diff: 3
    scope: 15-2-11 容量・能力管理。データ量が一定の割合で複利的に増える場合に、容量の上限へ到達する時期を予測する計算問題であり、範囲内。
    prereq: 毎月 r 倍になる量は n か月後に （増加率）^n 倍になるという指数的な増加の計算
    hard: 直線的な増加で見積もる誤りを避け、1.1 の累乗で 2 倍を超える月を特定する必要がある。途中の月ではまだ上限未満であることの確認も要る。
    q: |
      ファイルサーバの現在のデータ量は 500 G バイトで、毎月、前月比で 10％ ずつ増えている。ディスクの容量は 1,000 G バイトである。この増加が続くと、データ量が容量以上になるのは何か月後か。ここで、増加は各月の月末にまとめて起きるものとする。
    c:
      - '7'
      - '15'
      - '10'
      - '8'
    a: エ
    exp: |
      増加は「毎月 50 G バイトずつ」ではなく「前月比 10％」なので、n か月後のデータ量は 500 × 1.1^n です。
      - 7 か月後： 500 × 1.1^7 ≒ 500 × 1.949 ＝ 約 974 G バイト（まだ容量未満）
      - 8 か月後： 500 × 1.1^8 ≒ 500 × 2.144 ＝ 約 1,072 G バイト（容量以上）
      したがって、容量以上になるのは 8 か月後です。対数で解くと n ≧ log（2） ÷ log（1.1） ≒ 7.27 で、その天井が 8 か月と一致します。
    why:
      - 7 か月後のデータ量は約 974 G バイトで、まだ 1,000 G バイト未満です。「ほぼ 2 倍」を到達とみなすことはできません。
      - 増加率を 5％ と読み違えた場合の見積りです。問題文の増加率は 10％ です。
      - 毎月 50 G バイトの直線的な増加と考えた場合の値です。増加量自体がデータ量に比例して増えていくため、実際はもっと早く到達します。
      - 正解です。1.1^8 で初めて 2 倍を超え、容量以上になります。
    know: 割合で増える量は指数関数的に増加するため、現在の増加量で割る直線的な見積りは到達時期を遅く誤る。容量計画では、増加率の前提を置いて累乗で予測する。
    terms:
      - 容量・能力管理
    verify:
      value: Math.ceil(Math.log(2) / Math.log(1.1))
  - id: A15-503
    topic: 15-2-15-1
    diff: 3
    scope: 15-2-15-1 インシデント管理。影響度と緊急度の組合せから、複数のインシデントへの対応の優先順位を判断する事例問題であり、範囲内。
    prereq: インシデントの優先度は、業務への影響の大きさ（影響度）と、対応を急ぐ必要性（緊急度）の組合せで決まること
    hard: 「全社停止だが代替手段がある」「一部機能だが締切が迫る」など、影響度と緊急度がずれる事例を、両軸で評価して順序付ける必要がある。
    q: |
      サービスデスクに次の3件のインシデントがほぼ同時に届いた。対応の優先順位として、最も適切なものはどれか。

      - 甲： 全社のメールシステムが停止した。代替手段はなく、業務連絡が滞っている。
      - 乙： 経理部の給与計算システムでエラーが発生した。給与支払日の前日であり、本日中に処理を終える必要がある。
      - 丙： 営業部員1名のプリンタが故障した。近くの別のプリンタは使える。
    c:
      - 甲、乙、丙の順
      - 乙、甲、丙の順
      - 丙、乙、甲の順
      - 甲、丙、乙の順
    a: ア
    exp: |
      優先度は影響度（どれだけの業務・利用者に影響するか）と緊急度（どれだけ急ぐか）の組合せで決めます。甲は全社の業務連絡が止まっており、影響度・緊急度ともに最も高いため最優先です。乙は対象は経理部に限られますが、給与支払日の前日で締切が迫っており緊急度が高いため2番目です。丙は1名の問題で、代替のプリンタも使えるため、影響度・緊急度ともに最も低く、最後になります。
    why:
      - 正解です。全社停止の甲が最優先、締切の迫る乙が2番目、代替手段のある丙が最後です。
      - 乙の緊急度は高いものの、影響の範囲は経理部に限られます。全社の業務が止まる甲のほうが影響度で上回ります。
      - 届いた順や規模の小さい順ではなく、影響度と緊急度で順序付けるのがインシデント管理の考え方です。
      - 丙には代替手段があり優先度は最低です。乙より先に扱う理由はありません。
    know: 優先度は影響度 × 緊急度のマトリクスで決める。「範囲は狭いが締切が迫る」案件は緊急度で順位が上がり、「範囲は広いが代替手段がある」案件は下がる、といった読み替えができることが要点である。
    terms:
      - インシデント管理
      - 優先度
    verify:
      manual: 3件を影響度と緊急度で評価した。甲は全社影響で代替なし（両軸とも最高）、乙は範囲は限定的だが支払日の前日で緊急度高、丙は1名で代替あり（両軸とも最低）であり、順序は甲、乙、丙で一意に定まることを確認した。
  - id: A15-504
    topic: 15-2-15-1
    diff: 2
    scope: 15-2-15-1 インシデント管理。対応中のインシデントについて、専門技術者への依頼（機能的エスカレーション）と管理者への格上げ（階層的エスカレーション）を区別する問題であり、範囲内。
    prereq: エスカレーションには、専門性の不足を補う機能的なものと、優先度や資源の問題を上に上げる階層的なものがあること
    q: |
      サービスデスクで対応中の重要なインシデントについて、復旧の見通しが立たず、SLA で定めた復旧期限を過ぎることが確実になった。サービスデスクの責任者は、状況を上位の管理者に報告し、追加の要員投入の判断を仰ぐことにした。この行為はどれに当たるか。
    c:
      - 変更要求の提出
      - 問題管理への移行
      - 機能的エスカレーション
      - 階層的エスカレーション
    a: エ
    exp: |
      エスカレーションには2種類あります。解決に必要な専門知識や権限を持つ技術者・部門へ引き継ぐのが機能的エスカレーション、期限超過の見通しや資源不足のような状況を、より上位の管理者へ上げて判断や資源配分を仰ぐのが階層的エスカレーションです。本件は、技術的な引継ぎではなく、SLA 違反の見通しを管理者に報告して要員投入の判断を仰ぐ行為なので、階層的エスカレーションに当たります。
    why:
      - 変更要求は、変更管理へ変更の実施を求める手続です。復旧見通しの報告とは別の行為です。
      - 問題管理は、インシデントの根本原因を扱う別のプロセスです。期限超過への対処として管理者に上げる行為そのものは指しません。
      - 機能的エスカレーションは、専門技術者や専門部門へ対応を引き継ぐことです。本件の引継ぎ先は管理者で、目的も判断と資源配分です。
      - 正解です。復旧期限を過ぎる見通しを上位の管理者に上げ、資源投入の判断を仰ぐのは階層的エスカレーションです。
    know: エスカレーションは「詳しい人へ渡す（機能的）」と「偉い人へ上げる（階層的）」の2方向がある。SLA 違反が見込まれる場合は、期限を過ぎる前に階層的エスカレーションを行うことが、被害の拡大を防ぐ運用になる。
    terms:
      - エスカレーション
      - インシデント管理
    verify:
      manual: 事例の行為（管理者への報告と資源投入の判断仰ぎ）を、2種類のエスカレーションの定義と照合し、専門技術者への引継ぎではないため階層的エスカレーションに当たることを確認した。
  - id: A15-505
    topic: 15-2-12-2
    diff: 3
    scope: 15-2-12-2 変更管理。重大障害の復旧のために緊急の変更が必要な場面で、緊急変更の進め方（迅速な承認と事後の正式手続）を判断する問題であり、範囲内。
    prereq: 緊急変更は、通常の変更より迅速な承認経路（緊急の変更諮問の場など）を使うが、記録とレビューを省略してよいわけではないこと
    hard: 「緊急だから承認なしで実施してよい」という誤りを退け、事前の迅速な承認と、事後の文書化・レビューの両方が必要だと判断する必要がある。
    q: |
      深夜、本番システムで重大な障害が発生し、復旧には本番プログラムの緊急の修正（変更）が必要であることが分かった。変更管理の観点から、この緊急変更の進め方として、最も適切なものはどれか。
    c:
      - 変更ではなく「障害対応」として扱えば、変更管理の対象から外れるので手続は不要である
      - 緊急時は承認を一切省略し、復旧作業者の判断だけで変更を実施する。記録も不要である
      - 通常変更と全く同じ日程で変更諮問委員会の開催を待ち、承認後に実施する
      - 緊急の承認手続で迅速に承認を得て変更を実施し、事後に正式な変更記録の作成とレビューを行う
    a: エ
    exp: |
      緊急変更は、通常の変更諮問委員会（CAB）の開催を待っていては復旧が遅れるため、緊急の変更諮問の場（ECAB など）による迅速な承認経路を用意しておくのが変更管理の考え方です。ただし、承認の経路が速くなるだけで、承認自体や記録が不要になるわけではありません。実施後は、正式な変更記録を整え、変更が適切だったかのレビュー（事後評価）を行います。「障害対応だから変更管理の対象外」という扱いもありません。本番への修正は変更として管理されます。
    why:
      - 本番プログラムの修正は、目的が障害復旧であっても変更です。名称の付け替えで管理の対象から外れることはありません。
      - 緊急時でも承認と記録は必要です。無承認・無記録の本番変更は、別の障害や監査上の問題を招きます。
      - 通常の日程を待てば復旧が大幅に遅れ、緊急変更の制度を用意する意味がなくなります。
      - 正解です。迅速な承認で実施し、事後に記録とレビューを正式化するのが緊急変更の進め方です。
    know: 緊急変更は「手続の省略」ではなく「手続の迅速化と事後正式化」である。承認は緊急経路で事前に得て、文書化とレビューは事後に必ず補う、という二段構えが要点になる。
    terms:
      - 変更管理
      - 緊急変更
    verify:
      manual: 緊急変更の制度（迅速な承認経路、事後の記録とレビュー、承認自体は省略不可）を事例に当てはめ、他の選択肢が承認省略・通常日程・対象外化のいずれかの誤りを含むことを確認した。
  - id: A15-506
    topic: 15-2-17
    diff: 3
    scope: 15-2-17 問題管理。根本原因が判明し恒久対策が先になるインシデントについて、既知の誤りとしての登録と回避策の提供という対応を判断する問題であり、範囲内。
    prereq: 既知の誤り（原因と回避策が判明した問題）と、ワークアラウンド（恒久対策までの回避手順）の役割
    hard: 再度発生し得るインシデントに対して、「恒久対策の実施まで何もしない」のでも「場当たりの再起動を繰り返す」のでもなく、記録と回避策の共有が適切な対応だと判断する必要がある。
    q: |
      ある業務システムで、月末の処理集中時にサービスが停止するインシデントが繰り返し発生している。調査の結果、特定の処理がメモリを使い切り、サービスが異常終了することが根本原因と判明した。恒久対策にはプログラムの改修が必要で、実施は3か月後の次回リリースになる。問題管理としての当面の対応で、最も適切なものはどれか。
    c:
      - この問題を既知の誤りとして記録し、処理の分散や再起動手順などの回避策（ワークアラウンド）を関係者と共有して、再発時の影響を抑える
      - 恒久対策が完了するまでは特に対応せず、停止するたびにサービスデスクが再起動して復旧させる
      - リリースを待たず、変更管理の承認を省略して直ちにプログラムを改修する
      - 原因が判明したので、問題管理の記録は削除し、インシデント管理だけで扱う
    a: ア
    exp: |
      根本原因と回避の見通しが判明した問題は、「既知の誤り」として記録し、恒久対策までの間の回避策（ワークアラウンド）を用意するのが問題管理の役割です。本件では、処理を分散させる、監視を強めて異常終了の前に再起動する、といった回避策を共有しておけば、次に月末が来ても影響を小さくできます。恒久対策の改修は、変更管理の承認を経て次回リリースで実施します。再起動だけを繰り返すのはインシデント管理の対症対応であり、問題管理の対応とはいえません。
    why:
      - 正解です。既知の誤りとして記録し、回避策を共有することが、恒久対策までの期間の問題管理の対応です。
      - 停止のたびに再起動するだけでは、影響は毎月繰り返されます。原因が判明した段階で、問題管理としての記録と回避策が必要です。
      - 恒久対策の改修は必要な変更ですが、本番の改修を変更管理の承認なしに行うことは、別のリスクを生みます。
      - 原因が判明した問題こそ、既知の誤りとして記録に残す対象です。削除は逆の対応です。
    know: 問題管理の成果物が「既知の誤りの記録」と「ワークアラウンド」である。インシデント管理が復旧（対症）を担い、問題管理が再発の防止と影響の軽減を担う、という分担が要点になる。
    terms:
      - 問題管理
      - 既知の誤り
      - ワークアラウンド
    verify:
      manual: 事例の状態（原因判明、恒久対策は3か月後、再発の見込みあり）に対して、既知の誤りの登録とワークアラウンドの共有が問題管理の対応に当たることを、インシデント管理との役割分担から確認した。
  - id: A15-507
    topic: 15-2-5
    diff: 2
    scope: 15-2-5 構成管理。構成監査で CMDB の記録と実機の状態に差異が見つかったときの対応を判断する問題であり、範囲内。
    prereq: 構成管理では CMDB の正確さが前提であり、監査で見つけた差異は、実態に合わせて記録を修正し、無許可の変更でないかを確認すること
    q: |
      構成監査の結果、本番サーバに導入されているソフトウェアの版数が、CMDB（構成管理データベース）に記録された版数と異なっていることが分かった。構成管理としての対応で、最も適切なものはどれか。
    c:
      - 実機には触れず、CMDB の記録が正であるとして、そのまま放置する
      - 差異が見つかった事実を記録せず、次回の監査までに自然に解消するのを待つ
      - CMDB の記録に合わせて、直ちに本番サーバのソフトウェアを記録どおりの版数に戻す
      - 差異の経緯を調査し、無許可の変更でないかを確認したうえで、実態に合わせて CMDB の記録を修正する
    a: エ
    exp: |
      CMDB は、変更管理やインシデント対応の判断の土台になるため、実態と一致していることが求められます。監査で差異が見つかったら、まず経緯を調査します。承認された変更の記録漏れなのか、無許可の変更なのかで、その後の扱い（記録の修正、是正の手続）が変わるためです。実態を確認せずに記録を正として放置したり、逆に記録に合わせて本番を勝手に戻したりするのは、サービスの障害を招く恐れがあります。
    why:
      - 記録と実態のどちらが正しいかを確認せずに放置すると、CMDB を使う後続の判断が誤ります。
      - 差異を記録しないことは、監査の意味を失わせます。自然な解消は期待できません。
      - 記録に合わせて本番を戻す変更は、それ自体が無承認の変更になりかねず、障害の原因にもなります。
      - 正解です。経緯の調査と無許可変更の確認を行い、実態に合わせて記録を修正するのが構成監査後の対応です。
    know: 構成監査は「CMDB と実態の一致」を確かめる活動で、差異の是正までが一連の流れである。差異は記録漏れの場合も無許可変更の場合もあり、経緯の調査が是正の前提になる。
    terms:
      - 構成管理
      - CMDB
    verify:
      manual: 構成監査の目的（記録と実態の一致の確認と是正）を事例に当てはめ、調査を経ずに放置・巻戻し・未記録とする選択肢が不適切であることを確認した。
  - id: A15-508
    topic: 15-2-19
    diff: 4
    scope: 15-2-19 サービス継続管理。RTO と RPO という2つの目標に対して、復旧手順の所要時間とバックアップ間隔の両面から達成可否を判定する問題であり、範囲内。
    prereq: RTO は復旧までの時間の目標、RPO はどの時点のデータまで戻せるかの目標であり、バックアップ間隔が RPO を左右すること
    hard: 時間の見積り（手順の合計 150 分と RTO 120 分）と、間隔の評価（24 時間ごとのバックアップと RPO 4 時間）という、異なる2つの物差しで別々に判定し、両方とも未達であることを結論付ける必要がある。
    q: |
      ある業務システムのサービス継続計画では、目標復旧時間（RTO）を 2 時間、目標復旧時点（RPO）を 4 時間と定めている。現行の対策は次のとおりである。

      - バックアップは 24 時間に 1 回取得している。
      - 障害時の復旧手順は、待機系への切替え 30 分、データの復元 90 分、動作確認 30 分の見込みである。

      この対策についての評価として、適切なものはどれか。
    c:
      - RTO も RPO も満たしている。現在の対策を維持すればよい
      - RPO は満たしているが、RTO は満たしていない。復旧手順の短縮が必要である
      - RTO も RPO も満たしていない。復旧手順の短縮と、バックアップ間隔の短縮の両方が必要である
      - RTO は満たしているが、RPO は満たしていない。バックアップ間隔の短縮が必要である
    a: ウ
    exp: |
      2 つの目標を別々に判定します。RTO については、復旧手順の所要時間が 30 ＋ 90 ＋ 30 ＝ 150 分で、目標の 2 時間（120 分）を超えるため未達です。RPO については、バックアップが 24 時間に 1 回では、最悪の場合 24 時間分のデータが失われ、目標の 4 時間以内に戻せないため未達です。したがって、復旧手順の短縮（並行化や自動化など）と、バックアップ間隔の短縮（4 時間以内）の両方の改善が必要になります。
    why:
      - どちらの目標も現行の対策では届いていません。維持ではなく改善が必要です。
      - RTO の評価は正しいものの、24 時間間隔のバックアップでは RPO の 4 時間を満たせません。
      - 正解です。手順の合計 150 分が RTO の 120 分を超え、バックアップ間隔 24 時間が RPO の 4 時間を超えており、両方とも未達です。
      - RPO の評価は正しいものの、RTO も手順の合計が目標を超えているため未達です。
    know: RTO は「時間」の目標で復旧手順の所要時間と比較し、RPO は「時点」の目標でバックアップや複製の間隔と比較する。2つは独立した物差しであり、片方の達成がもう一方を保証することはない。
    terms:
      - RTO
      - RPO
    verify:
      manual: 復旧手順の合計（30＋90＋30＝150分）と RTO（120分）、バックアップ間隔（24時間）と RPO（4時間）をそれぞれ比較し、両方とも目標を超えることを確認した。
