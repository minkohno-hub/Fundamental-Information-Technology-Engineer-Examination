category: '7'
reviewed:
  at: '2026-10-21'
  method: 作成後の逐問レビュー（定義をシラバスVer.9.2の用語例・JIS Z 8530 等の一般的な定義と照合）
questions:
  - id: A07-001
    topic: 7-1-1
    diff: 2
    q: 情報アーキテクチャにおける「チャンク」の考え方の説明として，適切なものはどれか。
    c:
      - すべての情報を1つの長いページにまとめて表示する。
      - 情報をできるだけ小さな文字で一画面に詰め込む。
      - 情報を意味のあるまとまりに区切って示すことで，利用者が理解・記憶しやすくする。
      - 情報を表示する順序を毎回ランダムに変える。
    a: ウ
    exp: |
      チャンクは、人が一度に扱いやすい情報のまとまりのことです。長い情報を意味のある小さなかたまりに区切って示すと、理解しやすく記憶にも残りやすくなります。例えば電話番号を「03-1234-5678」のように区切るのもチャンク化です。情報アーキテクチャでは、情報を分類し、適切なラベルを付け、ナビゲーションでたどれるように構造化します。
    why:
      - 区切らずにまとめると、目的の情報を探しにくくなります。
      - 詰め込むと読みにくくなり、チャンクの考え方に反します。
      - 正解です。意味のあるまとまりに区切ることがチャンク化です。
      - 表示順を毎回変えると、利用者は情報の位置を覚えられません。
    terms:
      - 情報アーキテクチャ
  - id: A07-002
    topic: 7-1-2
    diff: 1
    q: アクセシビリティの説明として，適切なものはどれか。
    c:
      - 情報に権限のある人だけがアクセスできるようにすること
      - 特定の利用者が，特定の目的を効率よく満足して達成できる度合い
      - 高齢者や障害のある人を含め，できるだけ多くの人が情報やサービスを利用できること
      - システムが障害を起こさずに稼働し続けること
    a: ウ
    exp: |
      アクセシビリティは、年齢や身体的な条件にかかわらず、できるだけ多くの人が情報やサービスにアクセスし利用できることです。Web では、画像に代替テキストを付ける、キーボードだけで操作できるようにする、十分なコントラストを確保する、などの配慮が求められます。日本では JIS X 8341 シリーズが基準を定めています。
    why:
      - これはアクセス制御（機密性）の説明です。
      - これはユーザビリティ（使いやすさ）の説明です。
      - 正解です。多くの人が利用できることがアクセシビリティです。
      - これは信頼性や可用性の説明です。
    terms:
      - アクセシビリティ
      - ユーザビリティ
  - id: A07-003
    topic: 7-1-2
    diff: 2
    q: UI デザインにおける「シグニファイア」の例として，適切なものはどれか。
    c:
      - 画面の背景色を会社のブランドカラーに統一する。
      - 処理の完了後に効果音を鳴らす。
      - 入力欄の文字数の上限を 100 文字に制限する。
      - ボタンに影を付けて立体的に見せ，押せることが分かるようにする。
    a: エ
    exp: |
      シグニファイアは、その対象をどのように操作すればよいかを利用者に伝える手がかりです。ボタンらしい見た目、ドアの取っ手の形、リンクの下線などがあります。適切なシグニファイアがあると、説明がなくても直感的に操作できます。
    why:
      - ブランドカラーの統一は見た目の一貫性で、操作方法を伝える手がかりではありません。
      - 完了時の効果音は操作の結果を知らせるフィードバックです。
      - 入力の制限は制約（エラー防止）の例です。
      - 正解です。押せることを伝える手がかりはシグニファイアです。
    terms:
      - ユーザビリティ
  - id: A07-004
    topic: 7-1-2
    diff: 2
    q: スマートフォンのマルチタッチインタフェースで，2本の指の間隔を広げたり狭めたりして画面を拡大・縮小する操作はどれか。
    c:
      - フリック
      - スワイプ
      - ロングプレス
      - ピンチ
    a: エ
    exp: |
      ピンチは、2本の指で画面をつまむように間隔を狭めたり（ピンチイン）、広げたり（ピンチアウト）する操作で、主に画像や地図の縮小・拡大に使います。
    why:
      - フリックは、指で画面を素早く払う操作です。
      - スワイプは、指を画面に触れたまま滑らせる操作です。
      - ロングプレス（長押し）は、指で画面を押し続ける操作です。
      - 正解です。2本指で拡大・縮小する操作はピンチです。
    terms:
      - ユーザビリティ
  - id: A07-005
    topic: 7-1-3
    diff: 1
    q: GUI の部品のうち，複数の選択肢から1つだけを選ばせるときに適しているものはどれか。
    c:
      - ツールチップ
      - ラジオボタン
      - テキストボックス
      - チェックボックス
    a: イ
    exp: |
      ラジオボタンは、複数の選択肢の中から1つだけを選ぶための部品です。1つを選ぶと、それまで選ばれていたものの選択が解除されます（昔のラジオの選局ボタンが由来です）。性別や支払方法の選択などに使います。
    why:
      - ツールチップは、マウスポインターを重ねたときに説明を表示する部品です。
      - 正解です。1つだけを選ばせるにはラジオボタンを使います。
      - テキストボックスは、文字を自由に入力するための部品です。
      - チェックボックスは、複数の項目を同時に選べる部品です。
    terms:
      - GUI
  - id: A07-006
    topic: 7-2-1
    diff: 2
    q: UX デザインの五段階モデルで，最も抽象的な段階（土台となる段階）はどれか。
    c:
      - 戦略
      - 骨格
      - 表層
      - 構造
    a: ア
    exp: |
      UX デザインの五段階モデルは、抽象的なものから具体的なものへ「戦略 → 要件 → 構造 → 骨格 → 表層」の5つの段階で利用者の体験を設計する考え方です。最下層の「戦略」で、利用者のニーズと事業の目的を明確にし、それを基に上の段階を具体化していきます。
    why:
      - 正解です。戦略が最も抽象的な土台の段階です。
      - 骨格は、画面のレイアウトやナビゲーションの配置を決める段階です。
      - 表層は、色や画像などの見た目を決める最も具体的な段階です。
      - 構造は、情報の構成や操作の流れを決める段階です。
    terms:
      - UXデザイン
  - id: A07-007
    topic: 7-2-2
    diff: 2
    q: デザインの4原則のうち，関連する要素を近くに配置してグループとして認識させる原則はどれか。
    c:
      - 対比
      - 反復
      - 近接
      - 整列
    a: ウ
    exp: |
      デザインの4原則は、近接・整列・反復・対比です。近接は、関連する情報を近くに配置し、関係のない情報を離すことで、情報のまとまりを伝える原則です。
    why:
      - 対比は、大きさや色などの差をはっきりさせて、重要な要素を目立たせる原則です。
      - 反復は、色や形などのスタイルを繰り返して使い、一貫性を出す原則です。
      - 正解です。関連する要素を近づけるのは近接です。
      - 整列は、要素の端や中心をそろえて配置し、秩序と一体感を出す原則です。
    terms:
      - 情報デザイン
  - id: A07-008
    topic: 7-2-3-1
    diff: 2
    q: 入力データのチェック方法のうち，生年月日の「月」の値が 1〜12 の範囲にあるかを調べるものはどれか。
    c:
      - フォーマットチェック
      - リミットチェック（範囲チェック）
      - ニューメリックチェック
      - バランスチェック
    a: イ
    exp: |
      リミットチェック（範囲チェック）は、入力値があらかじめ決めた上限と下限の範囲に収まっているかを調べるチェックです。月が 1〜12 か、年齢が 0〜150 か、などを確認します。
    why:
      - フォーマットチェックは、日付の形式（YYYY-MM-DD など）のように決められた形式に合っているかを調べます。
      - 正解です。範囲内かどうかを調べるのはリミットチェックです。
      - ニューメリックチェックは、数値であるべき項目に数字以外が入っていないかを調べます。
      - バランスチェックは、借方と貸方の合計が一致するかなど、関連する値の釣り合いを調べます。
    know: ほかに、関連する項目の組合せが正しいかを調べる組合せチェック、マスタファイルと照合する照合チェック、計算で求めた検査文字を付けるチェックキャラクター（チェックディジット）などがあります。
    terms:
      - 入力チェック
  - id: A07-013
    topic: 7-2-3-1
    diff: 3
    q: |
      商品コードの末尾に付けるチェックディジットを次の方法で求める。商品コード 4723 のチェックディジットはどれか。
      各桁に左から順に 4，3，2，1 の重みを掛けて合計し，その合計を 10 で割った余りをチェックディジットとする。
    c:
      - '0'
      - '6'
      - '4'
      - '1'
    a: ウ
    exp: |
      各桁に重みを掛けて合計します。
      4×4＋7×3＋2×2＋3×1＝16＋21＋4＋3＝44
      44 を 10 で割った余りは 4 なので、チェックディジットは 4 です。商品コード全体は 47234 となります。
      入力時に同じ計算をして末尾の数字と比べることで、入力ミスを検出できます。
    why:
      - 0 は 10 ではなく 11 で割った場合（44÷11＝4 余り 0）です。
      - 6 は重みを右から 4，3，2，1 の順に掛けた場合（4×1＋7×2＋2×3＋3×4＝36）の余りです。
      - 正解です。合計 44 を 10 で割った余りは 4 です。
      - 1 は最後の桁（3×1）を足し忘れた場合（41）の余りです。
    know: チェックディジット（チェックキャラクター）は、桁の誤入力や隣り合う数字の入替えなどを検出するための検査用の数字です。
    terms:
      - 入力チェック
    verify:
      value: (4*4 + 7*3 + 2*2 + 3*1) % 10
  - id: A07-010
    topic: 7-2-3-2
    diff: 2
    q: 帳票設計におけるフォームオーバーレイの説明として，適切なものはどれか。
    c:
      - 罫線や項目名などの固定的な書式（フォーム）とデータを重ね合わせて印刷する。
      - 帳票のデータをすべて手書きで記入する。
      - 帳票を印刷せずに，画面にだけ表示する。
      - 帳票の項目を，利用者が自由に追加できるようにする。
    a: ア
    exp: |
      フォームオーバーレイは、帳票の罫線・見出し・ロゴなどの固定部分をフォームとして用意しておき、印刷時に可変のデータを重ね合わせて出力する方式です。あらかじめ印刷された用紙（プレプリント用紙）を使わずに、普通紙に帳票を印刷できます。
    why:
      - 正解です。書式とデータを重ねて印刷します。
      - 手書きは帳票の記入方法で、フォームオーバーレイではありません。
      - 画面表示だけでは帳票の印刷方式の説明になりません。
      - 項目の追加は帳票の設計方針で、フォームオーバーレイではありません。
    terms:
      - 帳票設計
  - id: A07-011
    topic: 7-2-4
    diff: 2
    q: コード設計で，「1桁目が部門，2〜3桁目が商品分類，4〜6桁目が連番」のように，各桁や桁の範囲に意味をもたせるコードはどれか。
    c:
      - 区分コード
      - 桁別コード
      - 表意コード
      - 順番コード
    a: イ
    exp: |
      桁別コードは、コードの各桁（または桁の範囲）にそれぞれ意味を割り当てたコードです。コードを見るだけで分類が分かり、集計にも使いやすい一方、桁数が多くなりがちです。
    why:
      - 区分コードは、一連の番号を区間に分けて、区間ごとに分類を割り当てるコード（例：1〜99 は食品、100〜199 は衣料）です。
      - 正解です。桁ごとに意味をもたせるのは桁別コードです。
      - 表意コードは、「JP」（日本）のように、コードを見て対象が連想できる記号を使うコードです。
      - 順番コードは、対象に一連の番号を順に割り当てるコードです。簡単ですが、コードから分類は分かりません。
    terms:
      - コード設計
  - id: A07-012
    topic: 7-2-5
    diff: 2
    q: レスポンシブ Web デザインの説明として，適切なものはどれか。
    c:
      - PC 用とスマートフォン用に，内容の異なる別々の Web サイトを用意する。
      - 画像をできるだけ使わずに，文字だけで Web ページを構成する。
      - 1つの HTML を用い，CSS のメディアクエリなどで画面の幅に応じてレイアウトを変えて，PC やスマートフォンなどさまざまな端末で見やすく表示する。
      - 利用者の操作に対する Web サーバの応答時間を短くする。
    a: ウ
    exp: |
      レスポンシブ Web デザインは、1つの Web ページを、閲覧する端末の画面サイズに応じてレイアウトが自動で切り替わるように作る手法です。CSS のメディアクエリで画面幅ごとのスタイルを指定し、PC では複数列、スマートフォンでは1列にするなどの調整を行います。URL やコンテンツを1つに保てるため、管理しやすくなります。
    why:
      - 端末ごとに別のサイトを用意するのは、レスポンシブ Web デザインとは別の手法です。
      - 画像の使用を避けることではありません。
      - 正解です。画面幅に応じてレイアウトを変える手法です。
      - 応答時間（レスポンスタイム）の短縮とは関係ありません。
    know: 基本的な機能はどの環境でも使えるようにし、高機能なブラウザではより豊かな表現を提供する考え方をプログレッシブエンハンスメントといいます。
    terms:
      - レスポンシブWebデザイン
  - id: A07-014
    topic: 7-2-6
    diff: 2
    q: 人間中心設計（JIS Z 8530（ISO 9241-210））の考え方として，適切なものはどれか。
    c:
      - 利用者と利用状況を理解し，利用者を設計と評価に参加させながら，設計と評価を繰り返して使いやすいシステムを作る。
      - 機能の数をできるだけ多くすることを最優先にする。
      - 開発者の経験に基づいて設計し，完成後に一度だけ利用者に評価してもらう。
      - 利用者の意見は聞かずに，競合製品の機能をそのまま取り入れる。
    a: ア
    exp: |
      人間中心設計は、システムの利用者を中心に考え、①利用状況の把握と明示、②利用者の要求事項の明示、③要求を満たす設計解の作成、④要求に対する設計の評価、という活動を繰り返しながら、使いやすいシステムを作るプロセスです。利用者の参加と反復的な改善が特徴です。
    why:
      - 正解です。利用者の参加と設計・評価の反復が人間中心設計の特徴です。
      - 機能の多さは使いやすさと一致しません。
      - 完成後に一度だけ評価するのでは、改善を反映できません。
      - 利用者の意見を聞かないのは人間中心設計の考え方に反します。
    terms:
      - 人間中心設計
  - id: A07-015
    topic: 7-2-7
    diff: 2
    q: Web コンテンツのアクセシビリティに関する国際的なガイドラインはどれか。
    c:
      - PMBOK
      - ITIL
      - WCAG
      - PDCA
    a: ウ
    exp: |
      WCAG（Web Content Accessibility Guidelines）は、W3C の WAI（Web Accessibility Initiative）が策定した、Web コンテンツのアクセシビリティに関する国際的なガイドラインです。日本の JIS X 8341-3 は WCAG 2.0 と一致した内容になっています。
    why:
      - PMBOK は、プロジェクトマネジメントの知識体系です。
      - ITIL は、IT サービスマネジメントのベストプラクティス集です。
      - 正解です。WCAG は Web のアクセシビリティのガイドラインです。
      - PDCA は、計画・実行・評価・改善を繰り返す管理サイクルです。
    know: ユニバーサルデザインは、年齢・能力などにかかわらず、すべての人が使いやすいように最初から設計する考え方です。ピクトグラム（絵文字による案内表示）や UD フォントもその例です。
    terms:
      - アクセシビリティ
      - ユニバーサルデザイン
  - id: A07-016
    topic: 7-2-8
    diff: 2
    q: ユーザビリティ評価の手法のうち，ヒューリスティック評価の説明として，適切なものはどれか。
    c:
      - 大量の利用者にアンケートを送り，満足度を統計的に集計する。
      - システムの応答時間を自動的に測定する。
      - ユーザビリティの専門家が，経験則に基づく評価基準に照らして画面などを調べ，問題点を見つける。
      - 実際の利用者に課題を実行してもらい，その様子を観察して問題点を見つける。
    a: ウ
    exp: |
      ヒューリスティック評価は、ユーザビリティの専門家が、経験から導かれた評価の原則（ヒューリスティクス）に照らしてインタフェースを点検し、問題点を洗い出す手法です。利用者を集める必要がないため、短期間・低コストで実施できます。
    why:
      - アンケートによる満足度調査は、ヒューリスティック評価ではありません。
      - 応答時間の測定は性能評価です。
      - 正解です。専門家が経験則に基づいて評価します。
      - これはユーザビリティテストの説明です。利用者が実際につまずく箇所を直接確認できます。
    terms:
      - ユーザビリティ
  - id: A07-017
    topic: 7-1-2
    diff: 2
    q: VUI（Voice User Interface）の例として，適切なものはどれか。
    c:
      - スマートスピーカーに話しかけて，天気予報を読み上げてもらう。
      - マウスでアイコンをクリックしてアプリケーションを起動する。
      - タッチパネルを2本の指でつまんで画像を縮小する。
      - キーボードからコマンドを入力してファイルを削除する。
    a: ア
    exp: |
      VUI は、音声による対話で機器を操作するユーザーインタフェースです。音声認識で利用者の発話を理解し、音声合成で応答します。スマートスピーカーや、カーナビ・スマートフォンの音声アシスタントなどが例です。手がふさがっているときや、画面を見られない状況でも操作できます。
    why:
      - 正解です。音声で操作するのが VUI です。
      - マウスによる操作は GUI の例です。
      - 指による操作はマルチタッチインタフェースの例です。
      - コマンドの入力は CUI（文字による操作）の例です。
    terms:
      - ユーザビリティ
