category: '16'
reviewed: { at: '2026-10-21', method: '作成後の逐問レビュー（システム監査基準・システム管理基準の趣旨とシラバスVer.9.2の用語例と照合）' }
questions:
  - id: A16-021
    topic: 16-1-3
    diff: 2
    q: システム監査の対象業務に関する記述として，適切なものはどれか。
    c:
      - 情報システムに係るリスクに対して，コントロールが適切に整備・運用されているかを点検・評価する。
      - 情報システムの開発作業を，監査人が自ら行う。
      - 監査対象部門の業務改善策を，監査人が決定して実施させる。
      - 外部の監査人に委託する場合でも，委託の範囲や責任を契約で定める必要はない。
    a: ア
    exp: |
      システム監査は、情報システムに係るリスクに適切に対処するためのコントロールが整備・運用されているかを、独立かつ専門的な立場から点検・評価し、保証や助言を行うものです。組織内部で行う場合は内部監査規程などで権限と責任を定め、外部に委託する場合はシステム監査委託契約書で監査の目的・範囲・責任などを定めます。
    why:
      - 正解です。リスクに対するコントロールを点検・評価します。
      - 監査人が監査対象の業務を自ら行うと、独立性が損なわれます。
      - 監査人は改善提案を行いますが、改善策の決定と実施は監査対象部門の責任です。
      - 外部委託では、システム監査委託契約書で目的・範囲・責任などを定めます。
    terms: [システム監査, 内部監査, 監査人の独立性]

  - id: A16-022
    topic: 16-1-7
    diff: 2
    q: システム監査を実施するための体制整備として，最も適切なものはどれか。
    c:
      - システム監査部門を監査対象から独立した組織とし，監査に必要な知識・能力をもつ要員を確保して，監査の品質を管理する仕組みを設ける。
      - システム監査部門を情報システム部門の配下に置き，開発担当者が兼務する。
      - 監査の効率を高めるため，監査の手順や品質管理の仕組みは定めない。
      - 監査人の教育は行わず，監査の経験だけで能力を維持する。
    a: ア
    exp: |
      システム監査の体制整備では、監査部門・監査人が監査対象から独立していること、監査を行うのに必要な専門的な知識・技能をもつ要員を確保し、継続的な教育で能力を維持すること、監査の品質を確保するための品質管理の仕組みを整えることなどが求められます。監査部門は経営者（代表取締役など）の直属とするのが一般的です。
    why:
      - 正解です。独立性、専門能力、品質管理の体制を整えます。
      - 監査対象である情報システム部門の配下では、独立性が保てません。
      - 監査の品質を確保するため、品質管理の仕組みが必要です。
      - 監査人は継続的な研さんによって専門能力を維持・向上させる必要があります。
    terms: [監査人の独立性, システム監査基準]
