questions:
  - id: A02-501
    topic: 2-1-2-3
    diff: 3
    scope: 2-1-2-3 スタックとキュー。LIFO の性質（push と pop の順序）から取り出せる順序を判断する力は、スタックの基本動作の理解そのものでありシラバス範囲内。
    prereq: スタックは後入れ先出し（LIFO）で、push と pop を任意の順に混ぜて使えること。
    hard: 入力順 1,2,3,4 に対し、push と pop の交互の組合せを頭の中で追い、取り出せない順序を1つだけ見つける必要がある。
    q: |
      空のスタックに，整数 1，2，3，4 をこの順に入力する。入力の途中でも pop（スタックの先頭から1つ取り出して出力する操作）を何回でも行ってよいものとし，4 つの値がすべて出力されるまで繰り返す。このとき，出力される順序として実現できないものはどれか。
    c:
      - 4，3，1，2
      - 2，4，3，1
      - 3，2，4，1
      - 1，4，3，2
    a: ア
    exp: |
      スタックは最後に積んだ値が最初に出る（LIFO）ので、一度スタックの内側に埋まった値は、上に積まれた値が出てから後でなければ出せません。
      「4，3，1，2」では、先に 4 を出すために 1，2，3，4 をすべて積みます。4，3 を出すとスタックは底から「1，2」の順で残り、次に出せるのは先頭の 2 です。したがって 1 を先に出すことはできず、実現できません。
      他の順序は次のように実現できます。
      | 出力順 | 操作 |
      | --- | --- |
      | 2，4，3，1 | push1，push2，pop(2)，push3，push4，pop(4)，pop(3)，pop(1) |
      | 3，2，4，1 | push1，push2，push3，pop(3)，pop(2)，push4，pop(4)，pop(1) |
      | 1，4，3，2 | push1，pop(1)，push2，push3，push4，pop(4)，pop(3)，pop(2) |
    why:
      - 正解です。4 を最初に出すには 1〜3 がスタックに残り、その状態では 3，2 の順にしか出せず、1 は 2 より先に出せません。
      - 実現できます。push1，push2，pop(2)，push3，push4 の順に操作すれば 2，4，3，1 の順に出せます。入力順のまま出さなくてよい点を見落とすと誤りに見えます。
      - 実現できます。3 まで積んで 3，2 を出し、次に 4 を積んで出し、最後に 1 を出します。
      - 実現できます。1 は積んですぐ出し、残りを 4，3，2 の逆順で出せます。出力が入力の逆順でなければならないと誤解すると誤りに見えます。
    know: スタックだけでは、入力順 1,2,3 のときに「3，1，2」のような並びは作れません。「後ろの値が先に出たなら、その間に飛ばされた値は降順でしか出せない」が判断の手掛かりです。
    terms: [スタック]
    verify:
      manual: 入力 1,2,3,4 に対し push/pop の全操作列をプログラムで列挙・シミュレートし、4,3,1,2 だけが生成不能で、他の3つは生成可能であることを確認した。

  - id: A02-502
    topic: 2-1-2-3
    diff: 4
    scope: 2-1-2-3 スタックとキュー。スタックの LIFO を組み合わせて FIFO のキューを実現する考え方の理解で、データ構造の基本操作の応用としてシラバス範囲内。
    prereq: スタックの push・pop、キューの enqueue・dequeue の性質と、2つのスタックを逆順に積み替えると順序が反転すること。
    hard: 積み替えが「S2 が空のとき」に限られる規則を追いながら、積み替えが発生する時点と要素数を2回分数える必要がある。
    q: |
      2つのスタック S1，S2 を使ってキューを実現する。操作は次のとおりである。
      ・enqueue(x)：S1 に x を push する。
      ・dequeue：S2 が空のときは，S1 のすべての要素を pop して S2 に push する（1要素の積み替えを1回と数える）。その後，S2 から pop した値を返す。S2 が空でないときは，そのまま S2 から pop した値を返す。
      空のキューに対して次の操作を順に行ったとき，積み替えの総回数はどれか。
      enqueue(1)，enqueue(2)，enqueue(3)，dequeue，enqueue(4)，dequeue，enqueue(5)，dequeue，dequeue，enqueue(6)，dequeue
    c:
      - '5'
      - '3'
      - '6'
      - '2'
    a: ア
    exp: |
      積み替えは S2 が空の状態で dequeue したときにだけ起こります。状態を追います（括弧内は底から先頭の順）。
      | 操作 | S1 | S2 | 積み替え |
      | --- | --- | --- | --- |
      | enqueue(1)〜(3) | (1,2,3) | () | 0 |
      | dequeue → 1 | () | (3,2) | 3 |
      | enqueue(4) | (4) | (3,2) | 0 |
      | dequeue → 2 | (4) | (3) | 0 |
      | enqueue(5) | (4,5) | (3) | 0 |
      | dequeue → 3 | (4,5) | () | 0 |
      | dequeue → 4（S2 が空なので積み替え） | () | (5) | 2 |
      | enqueue(6) | (6) | (5) | 0 |
      | dequeue → 5 | (6) | () | 0 |
      積み替えは 3＋2＝5 回です。6 は最後まで S1 に残り、積み替えられません。
    why:
      - 正解です。1回目の dequeue で 3 要素、4回目の dequeue で 2 要素を積み替え、合計 5 回です。
      - 最初の積み替えの 3 回だけを数え、S2 が空になった後の2回目の積み替えを見落とした値です。
      - 6 つの要素すべてが1回ずつ積み替えられると考えた値です。6 は最後まで S1 に残るので積み替えは起こりません。
      - 積み替えが起こった dequeue の回数（2回）を数えた値です。問われているのは積み替えた要素数の合計です。
    know: 2つのスタックによるキューでは、各要素は S1 から S2 へ高々1回しか移らないため、n 回の操作全体の積み替えは高々 n 回で済みます（償却して1操作あたり一定時間）。S2 が空でないうちは積み替えてはいけない点が要点です。
    terms: [スタック, キュー]
    verify:
      value: |
        (() => { let s1 = [], s2 = [], m = 0; const ops = [1,2,3,'d',4,'d',5,'d','d',6,'d']; for (const o of ops) { if (o !== 'd') s1.push(o); else { if (!s2.length) while (s1.length) { s2.push(s1.pop()); m++; } s2.pop(); } } return m; })()

  - id: A02-503
    topic: 2-1-2-3
    diff: 3
    scope: 2-1-2-3 スタックとキュー。配列を環状に使うキュー（リングバッファ）の先頭・末尾位置の更新は、キューの実装方法の基本であり範囲内。
    prereq: キューの FIFO、配列の要素番号の剰余計算（mod）による環状化。
    hard: 15 回の操作で要素番号が一巡する点（8 を超えたら 0 に戻る）を追いながら、front と rear の2つを同時に更新する必要がある。
    q: |
      要素番号 0〜7 の配列（大きさ 8）を環状に使ってキューを実現する。次の規則で管理する。
      ・front：次に dequeue で取り出す要素の番号。rear：次に enqueue で格納する要素の番号。
      ・初期状態は front＝0，rear＝0。
      ・enqueue は rear の位置に格納し，rear を (rear＋1) mod 8 にする。
      ・dequeue は front の位置から取り出し，front を (front＋1) mod 8 にする。
      空のキューに対して，enqueue を5回，dequeue を2回，enqueue を3回，dequeue を1回，enqueue を1回，dequeue を2回，enqueue を1回，の順に行った後の front と rear の組合せはどれか。なお，途中で配列があふれることはない。
    c:
      - front＝5，rear＝2
      - front＝5，rear＝10
      - front＝3，rear＝2
      - front＝5，rear＝1
    a: ア
    exp: |
      enqueue は合計 5＋3＋1＋1＝10 回、dequeue は合計 2＋1＋2＝5 回です。rear は enqueue のたびに1進み、front は dequeue のたびに1進みます。
      | 操作 | front | rear | 格納数 |
      | --- | --- | --- | --- |
      | enqueue×5 | 0 | 5 | 5 |
      | dequeue×2 | 2 | 5 | 3 |
      | enqueue×3 | 2 | 0（8 mod 8） | 6 |
      | dequeue×1 | 3 | 0 | 5 |
      | enqueue×1 | 3 | 1 | 6 |
      | dequeue×2 | 5 | 1 | 4 |
      | enqueue×1 | 5 | 2 | 5 |
      front＝5（dequeue 5回）、rear＝10 mod 8＝2 です。格納数は rear−front＝2−5＝−3 に 8 を足した 5 と一致します。
    why:
      - 正解です。front は dequeue 5 回で 5、rear は enqueue 10 回で 10 mod 8＝2 です。
      - rear の mod 8 を忘れ、enqueue の回数 10 をそのまま使った誤りです。配列の大きさを超えた番号は 0 に戻ります。
      - dequeue の回数を 3 回しか数えていない誤りです。2回・1回・2回の合計 5 回を数える必要があります。
      - rear を「最後に格納した位置」と取り違えた値です。この規則の rear は「次に格納する位置」なので 1 つ先の 2 になります。
    know: 環状キューでは front＝rear が「空」と「満杯」の両方で起こり得るため、格納数を別に持つか、1要素分を空けて満杯と空を区別します。位置の更新は剰余（mod 配列の大きさ）で環状にします。
    terms: [キュー, 配列]
    verify:
      manual: 規則をコードに写して 15 操作をシミュレートし front＝5，rear＝2，格納数 5 を得た。また enqueue 10 回 mod 8 と dequeue 5 回の独立した計算でも一致を確認した。

  - id: A02-504
    topic: 2-1-2-2
    diff: 2
    scope: 2-1-2-2 リスト。双方向リストへの挿入でどのポインタを付け替えるかは、リスト構造の基本操作であり範囲内。
    prereq: 単方向リストと双方向リストの節の構造（次ポインタと前ポインタ）。
    q: |
      双方向リスト（各節が「前の節へのポインタ」と「次の節へのポインタ」をもつ。先頭と末尾は特別な扱いをしない）で，隣り合う節 P と Q（P の次が Q）の間に，新しい節 X を挿入する。X の2つのポインタの設定を含め，書き換えるポインタは全部でいくつか。
    c:
      - '4'
      - '2'
      - '3'
      - '6'
    a: ア
    exp: |
      挿入前は P.次＝Q、Q.前＝P です。X を挿入するには次の4か所を設定します。
      | 書き換えるポインタ | 設定する値 |
      | --- | --- |
      | X.前 | P |
      | X.次 | Q |
      | P.次 | X |
      | Q.前 | X |
      したがって合計 4 つです。単方向リストなら X.次と P.次の2つで済みますが、双方向リストは逆向きの2つ（X.前と Q.前）も更新する必要があります。
    why:
      - 正解です。X の前後の2つと、P の次、Q の前の2つ、合計4つを設定します。
      - 単方向リストの挿入で必要な本数（X.次と P.次）です。双方向リストでは逆向きのポインタが残ってしまい、整合が取れません。
      - X の2つと P.次だけを書き換え、Q.前の更新を忘れた値です。Q から前へたどると P に戻ってしまいます。
      - X の2つと P・Q の書き換え2つに加え、挿入では変わらない P の前ポインタと Q の次ポインタまで数えた値です。その2つは挿入前後で同じ節を指したままです。
    know: 双方向リストは前後どちらにもたどれ、ある節自身の削除（P.次と Q.前の付け替え）を前の節を探さずに行えますが、ポインタの領域が倍になり、更新の手間も増えます。
    terms: [双方向リスト, リスト]
    verify:
      manual: 挿入前の P.次＝Q，Q.前＝P の状態から、X.前，X.次，P.次，Q.前 の4つを設定した後に、前向き・後ろ向きのどちらにたどっても P→X→Q となることを確認した。

  - id: A02-505
    topic: 2-1-2-4
    diff: 4
    scope: 2-1-2-4 木構造（2分探索木）。2分探索木からの削除と先行順の走査は、探索木の操作の基本で範囲内。
    prereq: 2分探索木の挿入規則、先行順（節→左→右）の走査、2つの子をもつ節の削除の考え方。
    hard: 挿入で木を組み立て、2つの子をもつ根を削除したうえで、後継節の子を付け替えた木を先行順にたどる3段階の操作が必要。
    q: |
      空の2分探索木に，キー 50，30，70，20，40，60，80，35，45，65，62 をこの順に挿入した。重複するキーはなく，各節について左部分木のキーはその節より小さく，右部分木のキーはその節より大きい。
      次に，根のキー 50 を削除する。削除する節が2つの子をもつ場合は，右部分木の最小キーをもつ節のキーで置き換え，その最小キーの節を木から取り除く（その節に右の子があれば，その子を取り除いた節の位置に付け替える）。
      削除後の木を先行順（節，左部分木，右部分木の順）でたどったときのキーの並びはどれか。
    c:
      - 60，30，20，40，35，45，70，65，62，80
      - 45，30，20，40，35，70，60，65，62，80
      - 20，35，45，40，30，62，65，80，70，60
      - 30，20，40，35，45，70，60，65，62，80
    a: ア
    exp: |
      挿入後の木は、根 50 の左に 30（子 20，40。40 の子が 35，45）、右に 70（左の子 60，右の子 80。60 の右の子 65、その左の子 62）となります。
      根 50 の右部分木の最小キーは、70→60 とたどった左端の 60 です。60 は左の子をもたず右の子 65 をもつので、60 の位置に 65 を付け替え、根のキーを 60 にします。
      | 節 | 左の子 | 右の子 |
      | --- | --- | --- |
      | 60（新しい根） | 30 | 70 |
      | 30 | 20 | 40 |
      | 40 | 35 | 45 |
      | 70 | 65 | 80 |
      | 65 | 62 | なし |
      先行順は 60，30，20，40，35，45，70，65，62，80 です。
    why:
      - 正解です。後継の 60 を根に移し、60 の右の子 65 を元の位置に付け替えた木の先行順です。
      - 左部分木の最大キー 45 で置き換えた場合の先行順です。問題の規則は右部分木の最小キーで置き換えるものなので誤りです。
      - 削除後の木を後行順（左→右→節）でたどった並びです。問われているのは先行順です。
      - 元の先行順から 50 を取り除いただけの並びです。置き換えが必要なので根は 60 になり、木の形も変わります。
    know: 2分探索木では、2つの子をもつ節の削除は中間順で直前（左部分木の最大）か直後（右部分木の最小）のキーで置き換えます。置き換えに使う節の子の付け替えを忘れやすい点に注意します。
    terms: [2分探索木, 2分木]
    verify:
      manual: 挿入・削除（右部分木の最小による置換）・先行順走査をプログラムで実装して実行し、60,30,20,40,35,45,70,65,62,80 を得た。他の選択肢の生成方法（最大置換・後行順・単純削除）も実行して一致を確認した。

  - id: A02-506
    topic: 2-1-2-4
    diff: 3
    scope: 2-1-2-4 木構造（2分探索木）と 1-3-7 計算量。木の形による探索の比較回数の違いは、探索木の性能の基本であり範囲内。
    prereq: 2分探索木の挿入規則、探索の比較回数が節の深さに対応すること、平衡木の考え方。
    hard: 昇順挿入で木が一直線になることを見抜き、2通りの木で比較回数の合計を式で求めて差をとる多段階の計算が必要。
    q: |
      バランスを調整しない2分探索木に，キー 1，2，3，…，15 を昇順に挿入した。この木で，15 個のキーをそれぞれ1回ずつ探索するときの比較回数の合計は，同じ 15 個のキーをもつ完全に平衡した2分探索木（全ての葉の深さが等しい高さ 4 の木）で同じことを行う場合より何回多いか。ここで，探索のたびに，根から目的の節までに通る節の数だけ比較を行うものとする。
    c:
      - '71'
      - '120'
      - '49'
      - '110'
    a: ア
    exp: |
      昇順に挿入すると、各キーは直前のキーの右の子になり、木は1本の鎖（深さ 1〜15）になります。キー k を探すには k 回の比較が必要なので、合計は 1＋2＋…＋15＝120 回です。
      完全に平衡した高さ 4 の木は、深さ d（根を 1 とする）の節が 2^(d−1) 個あります。
      | 深さ | 節の数 | 比較回数の小計 |
      | --- | --- | --- |
      | 1 | 1 | 1 |
      | 2 | 2 | 4 |
      | 3 | 4 | 12 |
      | 4 | 8 | 32 |
      合計は 1＋4＋12＋32＝49 回です。差は 120−49＝71 回で、平均では 8 回対 約 3.3 回に開きます。
    why:
      - 正解です。昇順挿入の木が 120 回、平衡木が 49 回なので差は 71 回です。
      - 昇順挿入の木の合計そのものです。問われているのは平衡木との差であり、49 回を引く必要があります。
      - 平衡木の合計そのものです。問われているのは昇順挿入の木のほうが何回多いかという差です。
      - 平衡木の合計を各段の数 1＋2＋3＋4＝10 としてしまった誤りです。段ごとの節の数（1,2,4,8）を掛けるのを忘れています。
    know: 2分探索木の探索は最悪 O(n)、平衡していれば O(log n) です。整列済みの入力は最悪の形になるため、AVL 木のように挿入時に平衡を保つ木や、挿入順をランダム化する対策が使われます。
    terms: [2分探索木, 平衡木, 計算量]
    verify:
      value: |
        (() => { let a = 0; for (let d = 1; d <= 15; d++) a += d; let b = 0; for (let d = 1; d <= 4; d++) b += d * 2 ** (d - 1); return a - b; })()

  - id: A02-507
    topic: 2-1-2-4
    diff: 3
    scope: 2-1-2-4 木構造（ヒープ）。最小ヒープへの挿入と最小値の取出しは、完全2分木の配列表現とあわせてヒープの基本操作であり範囲内。
    prereq: ヒープの配列表現（要素番号 i の子は 2i と 2i+1）、上方向・下方向への値の入れ替え。
    hard: 7 回の挿入で上方向の交換を、続く2回の取出しで下方向の交換（小さいほうの子との交換）を、配列の状態を保持しながら追う必要がある。
    q: |
      最小ヒープ（親の値が子の値以下になる完全2分木）を，要素番号 1 から始まる配列で表現する（要素番号 i の子は 2i と 2i＋1）。空のヒープに，値 9，4，7，2，8，3，5 をこの順に挿入した後，最小値を取り出す操作を2回行った。
      挿入は，配列の末尾に追加し，親より小さい間は親と交換して上へ移す。最小値の取出しは，根を取り除き，配列の末尾の値を根に移した後，値の小さいほうの子と交換しながら下へ移す（子のほうが小さい間のみ）。
      操作後の配列（要素番号 1 から順）はどれか。
    c:
      - 4，7，5，9，8
      - 5，7，3，9，8
      - 7，4，3，9，8
      - 3，9，8，7，5
    a: ア
    exp: |
      挿入の過程（要素番号 1 から順）は次のとおりです。
      | 挿入 | 配列 |
      | --- | --- |
      | 9 | 9 |
      | 4 | 4，9 |
      | 7 | 4，9，7 |
      | 2 | 末尾に追加し、9 と交換、さらに 4 と交換して 2，4，7，9 |
      | 8 | 2，4，7，9，8 |
      | 3 | 末尾に追加し、親の 7 と交換して 2，4，3，9，8，7 |
      | 5 | 2，4，3，9，8，7，5 |
      1回目の取出し：2 を取り除き、末尾の 5 を根に移す（5，4，3，9，8，7）。子 4 と 3 のうち小さい 3 と交換して 3，4，5，9，8，7。
      2回目の取出し：3 を取り除き、末尾の 7 を根に移す（7，4，5，9，8）。子 4 と 5 のうち小さい 4 と交換して 4，7，5，9，8。要素番号 2 の子（9，8）は 7 より大きいので終了です。
    why:
      - 正解です。2回の取出しで、末尾の値を根に移し、小さいほうの子と交換した結果です。
      - 根に移した値を、左の子とだけ比べて下げた誤りです。右の子 3 のほうが小さいときに右と交換しないと、親が子より大きい状態が残ります。
      - 根に末尾の値を移すだけで、下方向の交換を省略した誤りです。ヒープの性質（親≦子）が崩れます。
      - 根を取り除いて配列を先頭へ詰めただけの誤りです。完全2分木の形を保つには末尾の値を根に移す必要があります。
    know: ヒープへの挿入と最小値の取出しはどちらも木の高さに比例する O(log n) です。取出しの下方向の交換では、2つの子のうち小さいほう（最大ヒープでは大きいほう）と交換するのを忘れやすい点に注意します。
    terms: [ヒープ, 完全2分木]
    verify:
      manual: 挿入と取出しの手順をプログラムで実装し 4,7,5,9,8 を得た。他の選択肢が、左の子のみとの交換・下方向交換の省略・配列の詰め直しに対応することも実行で確認した。

  - id: A02-508
    topic: 2-1-2-4
    diff: 4
    scope: 2-1-2-4 木構造（ヒープ）と 2-2-2-1 ヒープソート。配列から最大ヒープを構築する手順（下方向の再配置）は、ヒープソートの前処理として範囲内。
    prereq: 最大ヒープの性質、配列表現（子は 2i，2i＋1）、根に向けた下方向の交換の手順。
    hard: 後ろの親から順に下方向の再配置を行い、1つの要素が複数段にわたって下がる連鎖を含めて交換を数える必要がある。
    q: |
      要素番号 1〜9 の配列 [3，9，2，7，5，8，6，1，4] を，最大ヒープ（親の値が子の値以上になる完全2分木，要素番号 i の子は 2i と 2i＋1）にする。次の手順で行う。
      要素番号 4，3，2，1 の順（最後の親から根へ向かう順）に，各要素について「2つの子のうち値の大きいほうが自分より大きい間，その子と交換して下へ移す」を行う。
      この手順で行われる値の交換の回数はどれか。
    c:
      - '4'
      - '3'
      - '5'
      - '6'
    a: ア
    exp: |
      配列を木で見ると、要素番号 4 の子は 8，9、3 の子は 6，7、2 の子は 4，5、1 の子は 2，3 です。手順どおりに追います。
      | 対象 | 配列（要素番号 1 から） | 交換 |
      | --- | --- | --- |
      | 開始 | 3，9，2，7，5，8，6，1，4 | |
      | 4（値 7）：子 1，4 は 7 以下 | 変化なし | 0 |
      | 3（値 2）：子 8，6 のうち 8 と交換 | 3，9，8，7，5，2，6，1，4 | 1 |
      | 2（値 9）：子 7，5 は 9 以下 | 変化なし | 0 |
      | 1（値 3）：子 9，8 のうち 9 と交換 | 9，3，8，7，5，2，6，1，4 | 1 |
      | （3 は要素番号 2 に降りた）子 7，5 のうち 7 と交換 | 9，7，8，3，5，2，6，1，4 | 1 |
      | （3 は要素番号 4 に降りた）子 1，4 のうち 4 と交換 | 9，7，8，4，5，2，6，1，3 | 1 |
      交換は 1＋1＋1＋1＝4 回で、完成した配列は 9，7，8，4，5，2，6，1，3 です。
    why:
      - 正解です。要素番号 3 の再配置で 1 回、根の値 3 が 3 段下がる連鎖で 3 回、合計 4 回です。
      - 根の値 3 が下がる連鎖を2回で止めた値です。要素番号 4 に降りた後も、子 4 のほうが大きいのでさらに交換が必要です。
      - 要素番号 2（値 9）でも交換が起こると考えた値です。9 は子 7，5 より大きいので交換は不要です。
      - 交換の回数ではなく、位置が変わった要素の個数（2と8、3と9と7と4の6個）を数えた値です。1回の交換で2つの要素が動くため、交換回数とは一致しません。
    know: 配列から一括でヒープを構築する方法は、親を後ろから根へ向かって再配置する方法で、全体で O(n) です。1要素ずつ挿入して上へ移す方法（全体 O(n log n)）とは交換の回数や結果の配列が異なる場合があります。
    terms: [ヒープ, ヒープソート]
    verify:
      value: |
        (() => { const a = [3,9,2,7,5,8,6,1,4]; const n = a.length; let c = 0; for (let i = (n >> 1) - 1; i >= 0; i--) { let k = i; for (;;) { const l = 2*k+1, r = l+1; let m = k; if (l < n && a[l] > a[m]) m = l; if (r < n && a[r] > a[m]) m = r; if (m === k) break; [a[m], a[k]] = [a[k], a[m]]; c++; k = m; } } return c; })()
