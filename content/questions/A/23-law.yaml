questions:
  - id: A23-001
    topic: 23-1-2
    diff: 2
    q: 著作権法によって保護の対象となるものはどれか。
    c:
      - プログラムのソースコードによる具体的な表現
      - プログラムの作成に用いたアルゴリズム（解法）
      - プログラムを記述するためのプログラム言語
      - プログラム間のインタフェースに関する規約
    a: ア
    exp: |
      著作権法はプログラムを著作物として保護しますが、その保護は具体的な表現（ソースコードやオブジェクトコード）に及ぶものです。著作権法は、プログラムを作成するために用いるプログラム言語、規約（インタフェースやプロトコルの約束事）、解法（アルゴリズム）には保護が及ばないと定めています。アイデアそのものは保護せず、表現を保護するという考え方です。
    why:
      - 正解です。ソースコードとして具体的に表現されたプログラムは著作物として保護されます。
      - アルゴリズム（解法）はアイデアにあたり、著作権法の保護は及びません。特許の対象になる場合はあります。
      - プログラム言語そのものは、著作権法の保護の対象外と定められています。
      - インタフェースやプロトコルなどの規約は、著作権法の保護の対象外と定められています。
    terms: [著作権, 著作物]

  - id: A23-002
    topic: 23-1-2
    diff: 2
    q: 会社の従業員が，会社の発意に基づき職務上プログラムを作成した。契約や勤務規則に別段の定めがない場合，このプログラムの著作者となるのはどれか。
    c: ['会社', '作成した従業員', '従業員の上司', '会社と従業員の共有']
    a: ア
    exp: |
      法人の発意に基づき、その業務に従事する者が職務上作成する著作物で、契約や勤務規則などに別段の定めがないものは、法人が著作者となります（職務著作）。一般の著作物では法人名義で公表することも要件ですが、プログラムの著作物では公表名義の要件はありません。著作者となった法人は、著作権（財産権）と著作者人格権の両方をもちます。
    why:
      - 正解です。職務著作として会社が著作者になります。
      - 職務著作の要件を満たすため、作成した従業員は著作者になりません。
      - 上司であっても個人が著作者になることはありません。
      - 別段の定めがない限り会社だけが著作者となり、共有にはなりません。
    terms: [職務著作, 著作権]

  - id: A23-003
    topic: 23-1-2
    diff: 2
    q: A 社が B 社にプログラムの開発を請負契約で委託した。契約で著作権の帰属について何も定めていない場合，完成したプログラムの著作権は誰に帰属するか。
    c: ['開発した B 社', '委託した A 社', 'A 社と B 社の共有', 'プログラムを利用する A 社の顧客']
    a: ア
    exp: |
      著作権は、原則として著作物を創作した者（著作者）に帰属します。外部に開発を委託した場合、実際に創作したのは受託者（B 社）なので、契約で譲渡などを定めていなければ著作権は B 社に帰属します。代金を支払ったことだけで委託者に著作権が移ることはありません。そのため、委託契約では著作権の帰属や利用条件を明確に定めておくことが重要です。
    why:
      - 正解です。創作した受託者の B 社に帰属します。
      - 委託して代金を支払っただけでは、著作権は委託者に移りません。譲渡には契約での定めが必要です。
      - 契約で定めない限り、共有にはなりません。
      - プログラムを利用するだけの顧客に著作権が帰属することはありません。
    terms: [著作権, 請負契約]

  - id: A23-004
    topic: 23-1-2
    diff: 1
    q: 著作者人格権に含まれるものはどれか。
    c: ['同一性保持権', '複製権', '公衆送信権', '貸与権']
    a: ア
    exp: |
      著作者人格権は、著作者の人格的な利益を守る権利で、公表権（公表するかどうか・時期・方法を決める）、氏名表示権（氏名を表示するかどうかを決める）、同一性保持権（意に反して内容や題号を改変されない）があります。著作者人格権は著作者だけに属し、譲渡できません。複製権・公衆送信権・頒布権・譲渡権・貸与権などは著作権（財産権）で、譲渡できます。
    why:
      - 正解です。意に反する改変を受けない権利で、著作者人格権の一つです。
      - 複製権は著作権（財産権）の一つです。
      - 公衆送信権は著作権（財産権）の一つです。
      - 貸与権は著作権（財産権）の一つです。
    terms: [著作者人格権, 著作権]

  - id: A23-005
    topic: 23-1-2
    diff: 1
    q: 我が国の著作権の発生についての記述として，適切なものはどれか。
    c:
      - 著作物を創作した時点で自動的に発生し，登録などの手続は必要ない。
      - 文化庁に登録した時点で発生する。
      - 特許庁に出願し，審査を経て登録された時点で発生する。
      - 著作物に著作権表示（© マーク）を付けた時点で発生する。
    a: ア
    exp: |
      我が国の著作権は、著作物を創作した時点で自動的に発生し、登録や表示などの手続を必要としません（無方式主義）。文化庁への登録制度もありますが、これは著作権の発生要件ではなく、権利の移転などを第三者に対抗するためなどのものです。出願・審査・登録によって権利が発生するのは、特許権などの産業財産権です。
    why:
      - 正解です。創作と同時に自動的に発生します（無方式主義）。
      - 文化庁への登録は著作権の発生の要件ではありません。
      - 出願と審査によって権利が発生するのは特許権などの産業財産権です。
      - 著作権表示がなくても著作権は発生します。
    terms: [著作権, 産業財産権]

  - id: A23-006
    topic: 23-1-2
    diff: 2
    q: 他人の著作物を自分の論文に引用する場合の扱いとして，適切なものはどれか。
    c:
      - 自分の文章が主で引用部分が従となる関係にし，引用部分をかぎ括弧などで明確に区別したうえで，出所を明示する。
      - 出所を明示すれば，自分の文章よりも引用部分が大部分を占めてもよい。
      - 引用する著作物の著作者の許諾を得なければ，どのような場合も引用できない。
      - 引用した文章を，自分の論旨に合うように自由に書き換えてよい。
    a: ア
    exp: |
      著作権法では、公表された著作物は、公正な慣行に合致し、報道・批評・研究などの目的上正当な範囲内であれば、許諾を得ずに引用して利用できます。一般に、自分の著作物が主で引用部分が従であること（主従関係）、引用部分が明確に区別されていること（明瞭区別）、出所を明示することなどが求められます。
    why:
      - 正解です。主従関係、明瞭区別、出所の明示を満たした引用です。
      - 引用部分が大部分を占めると主従関係を満たさず、適法な引用になりません。
      - 要件を満たす引用は、著作者の許諾がなくても行えます。
      - 引用部分を改変すると、同一性保持権の侵害になるおそれがあります。
    terms: [引用, 著作権, 著作者人格権]

  - id: A23-007
    topic: 23-1-2
    diff: 2
    q: 購入したソフトウェアについて，著作権法上，許諾なしに行うことが認められる行為はどれか。
    c:
      - 自分のコンピュータで利用するために必要な限度で，バックアップ用の複製を作成する。
      - 複製したものを友人に販売する。
      - 不特定多数の人がダウンロードできるように Web サイトに掲載する。
      - 社内の全部門で利用するために，ライセンス数を超えてインストールする。
    a: ア
    exp: |
      著作権法では、プログラムの著作物の複製物の所有者は、自らコンピュータで利用するために必要と認められる限度で、そのプログラムを複製や翻案（バックアップの作成や、自分の環境で動くようにする改変など）できると定めています。他人への譲渡や販売、公衆送信、ライセンス条件を超えた利用は認められません。
    why:
      - 正解です。自ら利用するために必要な限度での複製は認められています。
      - 複製物の販売は複製権・譲渡権の侵害になります。
      - Web サイトへの掲載は公衆送信権（送信可能化）の侵害になります。
      - ライセンス数を超えるインストールは、使用許諾契約に違反し、複製権の侵害にもなります。
    terms: [著作権, ソフトウェア使用許諾契約]

  - id: A23-008
    topic: 23-1-3
    diff: 1
    q: 産業財産権のうち，物品の形状，模様，色彩など，視覚を通じて美感を起こさせるデザインを保護する権利はどれか。
    c: ['意匠権', '特許権', '実用新案権', '商標権']
    a: ア
    exp: |
      産業財産権には次の 4 つがあり、いずれも特許庁に出願して登録されることで権利が発生します。
      - 特許権：自然法則を利用した技術的思想の創作のうち高度なもの（発明）
      - 実用新案権：物品の形状・構造・組合せに関する考案
      - 意匠権：物品などの形状・模様・色彩などのデザイン（意匠）
      - 商標権：商品やサービスに使用するマーク（文字、図形、記号など）
    why:
      - 正解です。物品のデザインを保護するのは意匠権です。
      - 特許権は、高度な技術的アイデアである発明を保護する権利です。
      - 実用新案権は、物品の形状や構造などに関する考案を保護する権利です。
      - 商標権は、商品やサービスに使用するマークを保護する権利です。
    terms: [意匠権, 特許権, 実用新案権, 商標権, 産業財産権]

  - id: A23-009
    topic: 23-1-3
    diff: 2
    q: 商標権の説明として，適切なものはどれか。
    c:
      - 商品やサービスに使用するマークを登録して保護する権利で，存続期間は更新登録によって繰り返し延長できる。
      - 発明を保護する権利で，存続期間は原則として出願の日から 20 年で終了する。
      - 著作物を創作した時点で発生し，登録の必要はない。
      - 物品の形状や構造に関する考案を，実体審査をせずに登録して保護する。
    a: ア
    exp: |
      商標権は、商品やサービスの名称、ロゴマークなどの商標を、特許庁に出願して登録することで発生する権利です。存続期間は設定登録の日から 10 年ですが、更新登録を申請することで何度でも延長できます。商標は使い続けることで信用が蓄積されるため、更新により継続して保護できるようになっています。
    why:
      - 正解です。マークを保護し、更新により延長できます。
      - これは特許権の説明です。
      - これは著作権の説明です。
      - これは実用新案権の説明です。
    terms: [商標権, 特許権, 実用新案権]

  - id: A23-010
    topic: 23-1-3
    diff: 3
    q: ビジネスモデル特許（ビジネス方法の特許）についての記述として，適切なものはどれか。
    c:
      - ビジネスの方法そのものは特許の対象にならないが，ICT を利用してそのビジネスの方法を実現する具体的な仕組みは，発明として特許を受けられる場合がある。
      - 新しいビジネスの方法であれば，ICT を利用しているかどうかにかかわらず，すべて特許を受けられる。
      - ソフトウェアに関する発明は，特許を受けることができない。
      - ビジネスモデル特許は，出願しなくても事業を開始した時点で自動的に権利が発生する。
    a: ア
    exp: |
      特許の対象となる発明は「自然法則を利用した技術的思想の創作」です。商売の方法などの人為的な取決めそのものは、自然法則を利用していないので発明に該当しません。しかし、そのビジネスの方法をコンピュータやネットワークなどの ICT を使って具体的に実現する仕組みは、ソフトウェア関連発明として特許を受けられる場合があり、これがビジネスモデル特許と呼ばれます。
    why:
      - 正解です。ICT による具体的な実現手段であれば発明に該当し得ます。
      - 人為的な取決めにすぎないビジネスの方法そのものは、発明に該当しません。
      - ソフトウェアを利用した発明も、要件を満たせば特許を受けられます。
      - 特許権は、出願して審査を経て登録されることで発生します。
    terms: [ビジネスモデル特許, 特許権]

  - id: A23-011
    topic: 23-1-4
    diff: 2
    q: 不正競争防止法で保護される営業秘密の要件に該当しないものはどれか。
    c:
      - 特許庁に登録されていること
      - 秘密として管理されていること
      - 事業活動に有用な技術上又は営業上の情報であること
      - 公然と知られていないこと
    a: ア
    exp: |
      不正競争防止法の営業秘密として保護されるには、次の 3 つの要件をすべて満たす必要があります。
      - 秘密管理性：秘密として管理されている（アクセス制限や「社外秘」の表示など）
      - 有用性：生産方法、販売方法など、事業活動に有用な技術上又は営業上の情報である
      - 非公知性：公然と知られていない
      登録などの手続は不要です。営業秘密の不正な取得・使用・開示は不正競争として差止めや損害賠償の対象となり、刑事罰もあります。
    why:
      - 正解です。営業秘密は登録不要で、登録は要件ではありません。
      - 秘密管理性は営業秘密の要件の一つです。
      - 有用性は営業秘密の要件の一つです。
      - 非公知性は営業秘密の要件の一つです。
    terms: [営業秘密, 不正競争防止法]

  - id: A23-012
    topic: 23-1-4
    diff: 2
    q: 有名企業の商品名と同じ文字列のドメイン名を，その企業に高値で買い取らせる目的で取得する行為を規制する法律はどれか。
    c: ['不正競争防止法', '著作権法', '不正アクセス禁止法', '特定電子メール法']
    a: ア
    exp: |
      不正競争防止法では、不正の利益を得る目的又は他人に損害を加える目的で、他人の商品や営業を表示するもの（商品等表示）と同一又は類似のドメイン名を取得・保有・使用する行為を不正競争の一つとしています。被害を受けた企業は、差止めや損害賠償を請求できます。
    why:
      - 正解です。ドメイン名の不正取得は不正競争防止法で規制されています。
      - 著作権法は著作物を保護する法律で、ドメイン名の不正取得を規制するものではありません。
      - 不正アクセス禁止法は、他人の識別符号の無断使用などによる不正アクセス行為を規制する法律です。
      - 特定電子メール法は、広告宣伝メールの送信を規制する法律です。
    terms: [不正競争防止法, 不正アクセス禁止法, 特定電子メール法]

  - id: A23-013
    topic: 23-2-1
    diff: 2
    q: サイバーセキュリティ基本法の説明として，適切なものはどれか。
    c:
      - サイバーセキュリティに関する施策の基本理念を定め，国や地方公共団体などの責務を明らかにするとともに，サイバーセキュリティ戦略の策定などについて定めている。
      - 他人の ID とパスワードを無断で使用してコンピュータを利用する行為を禁止し，罰則を定めている。
      - 正当な理由なく，コンピュータウイルスを作成する行為を処罰の対象としている。
      - 個人情報を取り扱う事業者が守るべき義務を定めている。
    a: ア
    exp: |
      サイバーセキュリティ基本法は、サイバーセキュリティに関する施策を総合的かつ効果的に推進するため、基本理念を定め、国・地方公共団体・重要社会基盤事業者などの責務や国民の努力について定めた法律です。政府がサイバーセキュリティ戦略を定めることや、官民の関係者が情報を共有するサイバーセキュリティ協議会などについても定めています。
    why:
      - 正解です。基本理念と関係者の責務、戦略の策定などを定めています。
      - これは不正アクセス禁止法の説明です。
      - これは刑法の不正指令電磁的記録に関する罪（ウイルス作成罪）の説明です。
      - これは個人情報保護法の説明です。
    terms: [サイバーセキュリティ基本法, 不正アクセス禁止法, ウイルス作成罪, 個人情報保護法]

  - id: A23-014
    topic: 23-2-2
    diff: 1
    q: 不正アクセス禁止法で禁止されている不正アクセス行為に該当するものはどれか。
    c:
      - 他人の ID とパスワードを無断で入力して，ネットワーク経由でアクセス制御されているサーバにログインする。
      - 自分に割り当てられた ID とパスワードを使って，社内のサーバにログインする。
      - アクセス制御されていない公開 Web サイトを閲覧する。
      - 管理者の許可を得て，自社のサーバの脆弱性を検査する。
    a: ア
    exp: |
      不正アクセス禁止法は、ネットワークを通じて、アクセス制御機能をもつコンピュータに、他人の識別符号（ID とパスワードなど）を無断で入力したり、脆弱性を突いてアクセス制御を回避したりして、本来利用する権限のない機能を利用可能にする行為を不正アクセス行為として禁止しています。実際に情報を盗んだり壊したりしなくても、ログインした時点で処罰の対象になります。
    why:
      - 正解です。他人の識別符号を無断で使ってログインしており、不正アクセス行為です。
      - 自分に与えられた権限の範囲で利用しており、不正アクセス行為ではありません。
      - アクセス制御されていないコンピュータの利用は、不正アクセス行為に該当しません。
      - 管理者の承諾を得た検査は、不正アクセス行為に該当しません。
    terms: [不正アクセス禁止法, アクセス制御]

  - id: A23-015
    topic: 23-2-2
    diff: 2
    q: 不正アクセス禁止法で，不正アクセス行為そのものではないが，禁止されている行為はどれか。
    c:
      - 業務その他正当な理由がないのに，他人の ID とパスワードを，その利用者本人やシステムの管理者以外の者に提供する。
      - ソフトウェアの脆弱性を見つけたので，開発元に報告する。
      - 自分のパスワードを，推測されにくい文字列に変更する。
      - ファイアウォールで，外部からの不要な通信を遮断する。
    a: ア
    exp: |
      不正アクセス禁止法は、不正アクセス行為だけでなく、それを助長する行為なども禁止しています。
      - 不正アクセス行為を助長する行為：正当な理由なく他人の識別符号を第三者に提供する
      - 不正アクセス目的で他人の識別符号を取得・保管する行為
      - 識別符号の入力を不正に要求する行為：正規のサイトを装ったフィッシングサイトなどで ID やパスワードを入力させる
    why:
      - 正解です。不正アクセス行為を助長する行為として禁止されています。
      - 脆弱性を開発元に報告することは、禁止されていません。
      - 自分のパスワードの変更は、適切なセキュリティ対策です。
      - ファイアウォールによる通信の遮断は、アクセス管理者が行う防御措置です。
    terms: [不正アクセス禁止法, フィッシング]

  - id: A23-016
    topic: 23-2-3
    diff: 2
    q: 刑法の不正指令電磁的記録に関する罪（いわゆるウイルス作成罪）についての記述として，適切なものはどれか。
    c:
      - 正当な理由がないのに，他人のコンピュータで実行させる目的でウイルスを作成すると，実際に感染の被害が生じていなくても処罰の対象となる。
      - ウイルスを作成しても，他人のコンピュータに感染させなければ処罰されることはない。
      - ウイルス対策ソフトの開発のために，研究目的で検体を保管することも処罰の対象となる。
      - 処罰されるのは，ウイルスによって金銭的な損害が生じた場合に限られる。
    a: ア
    exp: |
      刑法の不正指令電磁的記録に関する罪は、正当な理由がないのに、他人のコンピュータで、その意図に沿う動作をさせず、又は意図に反する動作をさせる不正な指令を与える電磁的記録（ウイルスなど）を、実行の用に供する目的で作成・提供する行為、実際に他人のコンピュータで実行させる行為（供用）、さらに取得・保管する行為を処罰の対象としています。ウイルス対策の研究など正当な理由がある場合は対象になりません。
    why:
      - 正解です。他人のコンピュータで実行させる目的での作成自体が処罰の対象です。
      - 実行の用に供する目的での作成や、取得・保管も処罰の対象です。
      - ウイルス対策の研究など正当な理由がある場合は、処罰の対象になりません。
      - 金銭的な損害の有無にかかわらず、作成や供用などの行為が処罰されます。
    terms: [ウイルス作成罪, コンピュータウイルス]

  - id: A23-017
    topic: 23-2-3
    diff: 3
    q: 電子計算機使用詐欺罪に該当する行為として，最も適切なものはどれか。
    c:
      - 銀行のシステムに虚偽の入金データを入力して自分の口座の残高を増やし，財産上不法の利益を得る。
      - 企業のサーバのデータを消去してシステムを停止させ，業務を妨害する。
      - 他人のクレジットカードの磁気情報を読み取って，偽造カードを作成する。
      - 他人のコンピュータで実行させる目的で，ウイルスを作成する。
    a: ア
    exp: |
      電子計算機使用詐欺罪は、人の事務処理に使用するコンピュータに虚偽の情報や不正な指令を与えて、財産権の得喪・変更に係る不実の電磁的記録を作成するなどして、財産上不法の利益を得る行為を処罰するものです。人をだますのではなく、コンピュータを不正に操作して利益を得る点が通常の詐欺罪と異なります。
    why:
      - 正解です。虚偽の情報を入力して財産上不法の利益を得ています。
      - これは電子計算機損壊等業務妨害罪にあたる行為です。
      - これは支払用カード電磁的記録不正作出等罪にあたる行為です。
      - これは不正指令電磁的記録作成罪（ウイルス作成罪）にあたる行為です。
    terms: [電子計算機使用詐欺罪, 電子計算機損壊等業務妨害罪, ウイルス作成罪]

  - id: A23-018
    topic: 23-2-4-1
    diff: 2
    q: 個人情報保護法における個人情報に該当するものはどれか。
    c:
      - 氏名は含まないが，映っている人物を特定できる防犯カメラの映像
      - 取引先の法人の名称と所在地
      - 個人を特定できないように集計した，年代別の来店者数
      - 架空の人物を用いて作成した，システムのテストデータ
    a: ア
    exp: |
      個人情報保護法の個人情報は、生存する個人に関する情報で、氏名、生年月日などにより特定の個人を識別できるもの（他の情報と容易に照合でき、それにより特定の個人を識別できるものを含む）、又は個人識別符号が含まれるものです。氏名がなくても、顔の映像などで特定の個人を識別できれば個人情報に該当します。
    why:
      - 正解です。映像で特定の個人を識別できるので個人情報です。
      - 法人の情報は個人に関する情報ではないので、個人情報に該当しません。
      - 特定の個人を識別できない統計情報は、個人情報に該当しません。
      - 実在しない人物の情報は、生存する個人に関する情報ではありません。
    terms: [個人情報, 個人情報保護法]

  - id: A23-019
    topic: 23-2-4-1
    diff: 3
    q: 個人情報保護法における個人識別符号に該当するものはどれか。
    c: ['運転免許証の番号', '携帯電話の番号', 'クレジットカードの番号', '電子メールアドレス']
    a: ア
    exp: |
      個人識別符号は、その情報単体で特定の個人を識別できるものとして政令などで定められた符号で、これを含む情報は個人情報になります。
      - 身体の特徴をデータ化したもの：指紋、顔認証のデータ、DNA の塩基配列など
      - 公的に割り当てられる番号：マイナンバー（個人番号）、旅券番号、運転免許証の番号、基礎年金番号など
      携帯電話の番号、クレジットカードの番号、メールアドレスは、契約形態や運用実態が様々で、それだけでは特定の個人を識別できるとは限らないため、個人識別符号には位置付けられていません（他の情報と組み合わせて個人情報になることはあります）。
    why:
      - 正解です。運転免許証の番号は個人識別符号として定められています。
      - 携帯電話の番号は、個人識別符号には位置付けられていません。
      - クレジットカードの番号は、個人識別符号には位置付けられていません。
      - 電子メールアドレスは、個人識別符号には位置付けられていません。
    terms: [個人識別符号, 個人情報, マイナンバー法]

  - id: A23-020
    topic: 23-2-4-1
    diff: 2
    q: 個人情報保護法の要配慮個人情報に該当するものはどれか。
    c: ['病歴', '年収', '商品の購買履歴', '勤務先の電話番号']
    a: ア
    exp: |
      要配慮個人情報は、本人に対する不当な差別や偏見などの不利益が生じないよう、取扱いに特に配慮を要する個人情報です。人種、信条、社会的身分、病歴、犯罪の経歴、犯罪により害を被った事実、心身の障害、健康診断の結果などが該当します。取得には原則として本人の同意が必要で、オプトアウトによる第三者提供は認められていません。
    why:
      - 正解です。病歴は要配慮個人情報に該当します。
      - 年収は個人情報になり得ますが、要配慮個人情報には該当しません。
      - 購買履歴は個人情報になり得ますが、要配慮個人情報には該当しません。
      - 勤務先の電話番号は要配慮個人情報には該当しません。
    terms: [要配慮個人情報, オプトアウト]

  - id: A23-021
    topic: 23-2-4-1
    diff: 3
    q: 個人情報保護法における仮名加工情報の説明として，適切なものはどれか。
    c:
      - 他の情報と照合しない限り特定の個人を識別できないように個人情報を加工したもので，主に事業者内部での分析などに利用され，原則として第三者への提供は禁止されている。
      - 特定の個人を識別できず，元の個人情報を復元できないように加工したもので，一定のルールの下で本人の同意なく第三者に提供できる。
      - 本人の同意を得たうえで預かった個人情報を，本人に代わって第三者に提供する。
      - 本人の求めがあれば第三者への提供を停止することにして，本人の同意なく第三者に提供する。
    a: ア
    exp: |
      仮名加工情報は、氏名を削除したり ID に置き換えたりして、他の情報と照合しない限り特定の個人を識別できないように加工した情報です。利用目的の変更の制限が緩和されるなど事業者内部でのデータ分析に利用しやすくなっていますが、原則として第三者への提供は禁止されています。これに対し、匿名加工情報は、特定の個人を識別できず復元もできないように加工したもので、作成時の公表などのルールの下で、本人の同意なく第三者に提供できます。
    why:
      - 正解です。内部での分析に使い、原則として第三者提供が禁止されます。
      - これは匿名加工情報の説明です。
      - これは情報銀行の説明です。
      - これはオプトアウトによる第三者提供の説明です。
    terms: [仮名加工情報, 匿名加工情報, 情報銀行, オプトアウト]

  - id: A23-022
    topic: 23-2-4-1
    diff: 2
    q: 個人情報保護法における匿名加工情報の説明として，適切なものはどれか。
    c:
      - 特定の個人を識別することができず，かつ元の個人情報を復元することができないように加工した個人に関する情報
      - 氏名だけを削除し，他の情報と照合すれば特定の個人を識別できる状態の情報
      - 暗号化して，鍵をもつ者だけが読めるようにした個人情報
      - 本人が自らの意思で公開している個人情報
    a: ア
    exp: |
      匿名加工情報は、個人情報を、特定の個人を識別できないように、かつ復元できないように加工した情報です。作成した事業者は、作成時に含まれる情報の項目を公表し、第三者に提供する場合は提供する情報の項目と方法を公表して匿名加工情報であることを明示するなどのルールに従えば、本人の同意なく提供できます。ビッグデータの利活用を促進することが目的です。
    why:
      - 正解です。識別も復元もできないように加工した情報です。
      - 他の情報との照合で識別できる状態のものは、仮名加工情報にあたり得るもので、匿名加工情報ではありません。
      - 暗号化しても、鍵で復号すれば元の個人情報に戻せるので、匿名加工情報ではありません。
      - 本人が公開している情報であっても、特定の個人を識別できれば個人情報です。
    terms: [匿名加工情報, 仮名加工情報]

  - id: A23-023
    topic: 23-2-4-2
    diff: 2
    q: 個人情報保護法におけるオプトアウトによる個人データの第三者提供の説明として，適切なものはどれか。
    c:
      - 本人の求めに応じて提供を停止することとし，所定の事項を本人に通知するか容易に知り得る状態に置き，個人情報保護委員会に届け出たうえで，本人の同意なく第三者に提供する。
      - 第三者に提供する前に，必ず本人から書面で同意を得る。
      - 個人データの取扱いを外部に委託する際に，委託先に個人データを渡す。
      - 本人が亡くなった後に，遺族の同意を得て個人データを提供する。
    a: ア
    exp: |
      個人データを第三者に提供するには、原則として事前に本人の同意が必要です（オプトイン）。オプトアウトは、本人の求めがあれば提供を停止することを前提に、提供する項目や方法などをあらかじめ本人に通知するか容易に知り得る状態に置き、個人情報保護委員会に届け出ることで、本人の同意を得ずに第三者に提供できる仕組みです。要配慮個人情報などは、オプトアウトによる提供ができません。
    why:
      - 正解です。停止の求めに応じることを前提に、届出などをして同意なく提供します。
      - 事前に本人の同意を得るのはオプトインの考え方です。
      - 取扱いの委託に伴う提供は、そもそも第三者提供に該当しません。
      - 個人情報保護法の対象は生存する個人の情報で、オプトアウトの説明ではありません。
    terms: [オプトアウト, オプトイン, 第三者提供, 個人情報保護委員会]

  - id: A23-024
    topic: 23-2-4-2
    diff: 3
    q: 個人情報保護法において，本人の同意を得ずに個人データを提供しても，第三者への提供に該当しないとされるものはどれか。
    c:
      - 利用目的の達成に必要な範囲内で，個人データの取扱いを委託した委託先に提供する場合
      - 新商品の宣伝のために，提携先の企業に顧客名簿を提供する場合
      - 顧客名簿を名簿業者に販売する場合
      - 社員の個人データを，本人の知らないうちに取引先に提供する場合
    a: ア
    exp: |
      個人情報保護法では、利用目的の達成に必要な範囲内での取扱いの委託に伴う提供、合併などの事業の承継に伴う提供、一定の事項を本人が知り得る状態に置いたうえでの共同利用は、提供先が「第三者」に該当しないとされています。ただし、委託の場合、委託元は委託先に対する必要かつ適切な監督を行わなければなりません。
    why:
      - 正解です。委託に伴う提供は第三者提供に該当しません。
      - 提携先の企業の宣伝目的の提供は第三者提供にあたり、原則として本人の同意が必要です。
      - 名簿業者への販売は第三者提供にあたり、原則として本人の同意が必要です。
      - 取引先への提供は第三者提供にあたり、本人の同意なく行うことは原則としてできません。
    terms: [第三者提供, 個人情報保護法]

  - id: A23-025
    topic: 23-2-4-1
    diff: 2
    q: プライバシーマーク制度の説明として，適切なものはどれか。
    c:
      - JIS Q 15001 に基づいて，個人情報を適切に取り扱う体制を整備している事業者を評価・認定し，マークの使用を認める制度
      - 情報セキュリティマネジメントシステムが ISO/IEC 27001 に適合していることを認証する制度
      - IT 製品のセキュリティ機能が，ISO/IEC 15408 に基づいて評価されたことを認証する制度
      - 個人情報の漏えいが発生した事業者を公表する制度
    a: ア
    exp: |
      プライバシーマーク制度は、JIS Q 15001（個人情報保護マネジメントシステム－要求事項）に基づいて、個人情報について適切な保護措置を講ずる体制を整備している事業者を評価し、その証としてプライバシーマークの使用を認める制度です。一般財団法人日本情報経済社会推進協会（JIPDEC）が運営しています。
    why:
      - 正解です。JIS Q 15001 に基づき個人情報の取扱い体制を認定します。
      - これは ISMS 適合性評価制度の説明です。
      - これは IT セキュリティ評価及び認証制度（JISEC）の説明です。
      - プライバシーマーク制度は、漏えい事業者を公表する制度ではありません。
    terms: [プライバシーマーク, JIS Q 15001, ISMS, ISO/IEC 15408]

  - id: A23-026
    topic: 23-2-4-1
    diff: 2
    q: EU の一般データ保護規則（GDPR）についての記述として，適切なものはどれか。
    c:
      - EU 域内の個人データの保護を目的とし，EU 域内に拠点がない事業者でも，EU 域内の個人に商品やサービスを提供する場合などには適用される。
      - EU 域内に拠点をもつ事業者だけに適用され，EU 域外の事業者には一切適用されない。
      - 個人データを EU 域外に移転することについて，制限を設けていない。
      - 法人の情報だけを保護の対象としている。
    a: ア
    exp: |
      GDPR（General Data Protection Regulation：一般データ保護規則）は、EU（及び EEA）域内の個人データの保護を目的とした規則です。EU 域内に拠点がなくても、EU 域内の個人に商品やサービスを提供したり、行動を監視したりする事業者には適用されます。個人データを域外に移転することは、十分な保護の水準が確保されているなどの条件を満たす場合に限られます。違反には高額な制裁金が科されることがあります。
    why:
      - 正解です。域外の事業者にも適用される場合があります。
      - 域外の事業者にも適用される場合があります。
      - 域外への個人データの移転は、一定の条件を満たす場合に限られています。
      - GDPR は個人（自然人）のデータを保護する規則です。
    terms: [GDPR]

  - id: A23-027
    topic: 23-2-5
    diff: 2
    q: 電子署名法（電子署名及び認証業務に関する法律）の説明として，適切なものはどれか。
    c:
      - 本人による一定の要件を満たす電子署名が行われた電磁的記録は，真正に成立したものと推定されることなどを定めている。
      - 電子メールの送信者に，受信者の事前の同意を得ることを義務付けている。
      - 国の行政機関が保有する文書の開示請求の手続を定めている。
      - 法令で保存が義務付けられた書面を，電磁的記録で保存することを認めている。
    a: ア
    exp: |
      電子署名法は、電子署名が手書きの署名や押印と同等に通用する法的基盤を整備するための法律です。本人だけが行うことができる電子署名が行われた電磁的記録は、真正に成立した（本人の意思に基づいて作成された）ものと推定されます。また、電子証明書を発行する認証業務のうち、一定の基準を満たすものを国が認定する制度（認定認証事業者）も定めています。
    why:
      - 正解です。電子署名が行われた電磁的記録の真正な成立の推定などを定めています。
      - これは特定電子メール法の説明です。
      - これは情報公開法の説明です。
      - これは e-文書法の説明です。
    terms: [電子署名法, 電子署名, 電子証明書, 特定電子メール法, 情報公開法, e-文書法]

  - id: A23-028
    topic: 23-2-6
    diff: 2
    q: インターネットの掲示板に名誉を毀損する書込みをされた被害者が，投稿者を特定するために，サイトの運営者などに発信者情報の開示を請求できることなどを定めた法律はどれか。
    c:
      - 情報流通プラットフォーム対処法（旧プロバイダ責任制限法）
      - 不正アクセス禁止法
      - 特定電子メール法
      - 電子消費者契約法
    a: ア
    exp: |
      情報流通プラットフォーム対処法（旧称はプロバイダ責任制限法）は、インターネット上で他人の権利を侵害する情報が流通した場合について、プロバイダやサイトの運営者などが損害賠償責任を負う範囲の制限や、被害者が発信者情報の開示を請求できることなどを定めています。法改正によって名称が変わり、大規模なプラットフォーム事業者に対する、削除の申出への対応の迅速化や運用状況の透明化に関する規定も加えられました。
    why:
      - 正解です。発信者情報の開示請求などを定めた法律です。
      - 不正アクセス禁止法は、他人の識別符号の無断使用などによる不正アクセス行為を規制する法律です。
      - 特定電子メール法は、広告宣伝メールの送信を規制する法律です。
      - 電子消費者契約法は、インターネット取引での消費者の操作ミスによる契約などについて定めた法律です。
    terms: [情報流通プラットフォーム対処法, 不正アクセス禁止法, 特定電子メール法, 電子消費者契約法]

  - id: A23-029
    topic: 23-2-7
    diff: 2
    q: 特定電子メール法で，広告や宣伝のための電子メールを送信する際の規制として，適切なものはどれか。
    c:
      - 原則として，あらかじめ送信に同意した者などに限って送信でき，送信者の氏名又は名称や，受信拒否の連絡先などを表示しなければならない。
      - 受信者から拒否の連絡があるまでは，誰にでも自由に送信できる。
      - 送信者の名称を表示すれば，受信を拒否した者に送信を続けてもよい。
      - 企業間の取引に関する電子メールには，一切適用されない。
    a: ア
    exp: |
      特定電子メール法（特定電子メールの送信の適正化等に関する法律）は、いわゆる迷惑メールを規制する法律です。広告宣伝メールは、原則として、あらかじめ送信に同意した者などに対してのみ送信できる「オプトイン方式」をとり、送信者の氏名・名称や受信拒否の通知先などの表示を義務付け、受信を拒否した者への送信を禁止しています。
    why:
      - 正解です。事前の同意（オプトイン）と表示義務が定められています。
      - 拒否の連絡があるまで自由に送れるのはオプトアウト方式で、現行法はオプトイン方式です。
      - 受信を拒否した者への送信は禁止されています。
      - 営業目的で送られる広告宣伝メールであれば、送信先が企業かどうかにかかわらず規制の対象になり得ます。
    terms: [特定電子メール法, オプトイン, オプトアウト]

  - id: A23-030
    topic: 23-3-1-2
    diff: 2
    q: 労働者派遣における指揮命令関係の説明として，適切なものはどれか。
    c:
      - 派遣労働者は派遣元と雇用契約を結び，派遣先の指揮命令を受けて働く。
      - 派遣労働者は派遣先と雇用契約を結び，派遣元の指揮命令を受けて働く。
      - 派遣労働者は派遣先と雇用契約を結び，派遣先の指揮命令を受けて働く。
      - 派遣労働者は派遣元と雇用契約を結び，派遣元の指揮命令だけを受けて働く。
    a: ア
    exp: |
      労働者派遣では、派遣元事業主と派遣先が労働者派遣契約を結び、派遣労働者は派遣元と雇用契約を結んだうえで、派遣先の指揮命令を受けて派遣先の業務に従事します。これに対して請負では、受注者（請負事業者）が雇用する労働者に自ら指揮命令し、発注者は受注者の労働者に直接指揮命令できません。
    why:
      - 正解です。雇用は派遣元、指揮命令は派遣先です。
      - 雇用契約は派遣元と、指揮命令は派遣先から受けるので、関係が逆です。
      - 雇用契約を結ぶ相手は派遣元です。派遣先と雇用関係があるのは直接雇用です。
      - 派遣元の指揮命令だけを受けて働くのは請負などの形態で、労働者派遣ではありません。
    terms: [労働者派遣法, 指揮命令, 雇用契約]

  - id: A23-031
    topic: 23-3-1-2
    diff: 2
    q: 請負契約でシステム開発を受注した企業の作業者が発注者の事務所で作業している。偽装請負とみなされるおそれがある状況はどれか。
    c:
      - 発注者の社員が，受注者の作業者に対して直接，作業の手順や作業時間を指示している。
      - 受注者の責任者が，自社の作業者に作業の指示を出している。
      - 発注者が，受注者の責任者に対して仕様の変更を依頼している。
      - 受注者が，作業者の勤怠を管理している。
    a: ア
    exp: |
      請負では、受注者が自らの労働者に指揮命令して仕事を完成させます。契約が請負であっても、発注者が受注者の労働者に直接指揮命令している場合は、実態は労働者派遣と判断され、偽装請負として労働者派遣法や職業安定法に違反するおそれがあります。発注者からの依頼は、受注者の責任者を通じて行う必要があります。
    why:
      - 正解です。発注者が受注者の作業者に直接指揮命令しており、偽装請負のおそれがあります。
      - 受注者が自社の作業者に指示するのは、請負の正しい形です。
      - 受注者の責任者を通じた依頼であり、直接の指揮命令にはあたりません。
      - 作業者の労務管理を受注者が行うのは、請負の正しい形です。
    terms: [偽装請負, 請負契約, 指揮命令]

  - id: A23-032
    topic: 23-3-1-2
    diff: 2
    q: 二重派遣に該当し，禁止されているものはどれか。
    c:
      - A 社が派遣元から受け入れた派遣労働者を，さらに B 社に派遣して，B 社の指揮命令の下で働かせる。
      - A 社が，派遣元から派遣労働者を受け入れて，自社の指揮命令の下で働かせる。
      - 派遣元が，自社で雇用する労働者を複数の派遣先に順番に派遣する。
      - A 社が派遣労働者を受け入れた後，その労働者を A 社が直接雇用する。
    a: ア
    exp: |
      二重派遣は、派遣先が受け入れた派遣労働者を、さらに別の企業に派遣して、その企業の指揮命令の下で働かせることです。派遣先は派遣労働者を雇用していないので、他社に派遣することはできず、責任の所在も不明確になるため禁止されています（職業安定法が禁止する労働者供給にあたります）。
    why:
      - 正解です。受け入れた派遣労働者をさらに他社に派遣しており、二重派遣です。
      - 派遣先が自社で指揮命令するのは、通常の労働者派遣です。
      - 雇用する派遣元が派遣先を変えるのは、通常の労働者派遣です。
      - 派遣労働者を直接雇用することは、禁止されていません。
    terms: [二重派遣, 労働者派遣法]

  - id: A23-033
    topic: 23-3-1-1
    diff: 2
    q: 労働基準法で，36 協定（サブロク協定）を締結して労働基準監督署に届け出る必要があるのはどれか。
    c:
      - 労働者に法定労働時間を超えて時間外労働をさせたり，法定休日に労働させたりする場合
      - 労働者を新たに採用する場合
      - 労働者に年次有給休暇を与える場合
      - 労働者を派遣先に派遣する場合
    a: ア
    exp: |
      労働基準法では、法定労働時間（原則 1 日 8 時間、1 週 40 時間）を超えて労働させたり、法定休日に労働させたりすることは原則としてできません。これらを行う場合は、労働者の過半数で組織する労働組合（ない場合は労働者の過半数を代表する者）と書面で協定を結び、労働基準監督署に届け出る必要があります。労働基準法第 36 条に定められていることから 36 協定と呼ばれます。
    why:
      - 正解です。時間外労働・休日労働をさせる場合に必要です。
      - 労働者の採用には、36 協定の締結は必要ありません。
      - 年次有給休暇の付与には、36 協定の締結は必要ありません。
      - 労働者派遣は労働者派遣法の規定に従って行うもので、36 協定とは関係しません。
    terms: [36協定, 労働基準法]

  - id: A23-034
    topic: 23-3-1-1
    diff: 2
    q: 労働基準法で定められた裁量労働制の説明として，適切なものはどれか。
    c:
      - 業務の遂行方法を大幅に労働者の裁量に委ね，実際の労働時間にかかわらず，労使であらかじめ定めた時間を労働したものとみなす。
      - 一定期間の総労働時間を定めたうえで，日々の始業・終業の時刻を労働者が自ら決める。
      - 1 つの仕事を複数の労働者で分け合い，労働時間を短くして雇用を維持する。
      - 自宅など，会社以外の場所で情報通信技術を利用して働く。
    a: ア
    exp: |
      裁量労働制は、研究開発やシステムの設計など、業務の性質上、遂行の方法を労働者の裁量に大幅に委ねる必要がある業務について、実際に働いた時間にかかわらず、労使協定などで定めた時間を働いたものとみなす制度です（みなし労働時間制の一つ）。フレックスタイム制は、始業・終業の時刻を労働者が決められるもので、労働時間は実際の時間で管理されます。
    why:
      - 正解です。実際の労働時間にかかわらず、定めた時間を労働したとみなします。
      - これはフレックスタイム制の説明です。
      - これはワークシェアリングの説明です。
      - これはテレワークの説明です。
    terms: [裁量労働制, フレックスタイム制, ワークシェアリング, テレワーク]

  - id: A23-035
    topic: 23-3-2-1
    diff: 3
    q: 中小受託取引適正化法（旧下請法）で，委託事業者に課されている義務や禁止事項についての記述として，適切なものはどれか。
    c:
      - 給付を受領した日から起算して 60 日以内のできる限り短い期間内で支払期日を定め，その期日までに代金を支払わなければならない。
      - 中小受託事業者の責めに帰すべき理由がなくても，発注後に代金を減額できる。
      - 発注の内容は口頭で伝えればよく，書面や電子メールなどで明示する必要はない。
      - 中小受託事業者の責めに帰すべき理由がなくても，納入された物品の受領を拒否できる。
    a: ア
    exp: |
      中小受託取引適正化法（取適法）は、下請法（下請代金支払遅延等防止法）が改正・改称された法律で、委託事業者（旧称は親事業者）と中小受託事業者（旧称は下請事業者）の取引の公正化を図るものです。ソフトウェアなどの情報成果物の作成委託も対象です。委託事業者には、発注内容の明示、給付の受領日から 60 日以内のできる限り短い期間内での支払期日の設定などが義務付けられ、受領拒否、代金の支払遅延、代金の減額、不当な返品などが禁止されています。
    why:
      - 正解です。受領日から 60 日以内で支払期日を定めて支払う義務があります。
      - 中小受託事業者に責任がないのに代金を減額することは禁止されています。
      - 発注内容は、書面又は電子メールなどの電磁的方法で明示する必要があります。
      - 中小受託事業者に責任がないのに受領を拒否することは禁止されています。
    terms: [中小受託取引適正化法, 情報成果物]

  - id: A23-036
    topic: 23-3-2-2
    diff: 2
    q: 民法における準委任契約の説明として，適切なものはどれか。
    c:
      - 受任者は，善良な管理者の注意をもって委任された事務を処理する義務を負うが，原則として仕事を完成させる義務は負わない。
      - 請負人は仕事を完成させる義務を負い，成果物が契約の内容に適合しない場合には責任を負う。
      - 派遣元が雇用する労働者を，派遣先の指揮命令の下で働かせる。
      - 労働者が使用者の指揮命令の下で労働し，使用者がその対価として賃金を支払う。
    a: ア
    exp: |
      準委任契約は、法律行為以外の事務（システムの運用支援、要件定義の支援など）の処理を委託する契約で、受任者は善良な管理者の注意（善管注意義務）をもって事務を処理する義務を負います。請負契約と違って仕事の完成義務は原則として負いません。ただし、成果物の完成に対して報酬を支払う形態（成果完成型）の準委任もあります。
    why:
      - 正解です。善管注意義務を負い、完成義務は負わないのが原則です。
      - これは請負契約の説明です。
      - これは労働者派遣契約に基づく働き方の説明です。
      - これは雇用契約の説明です。
    terms: [準委任契約, 請負契約, 雇用契約]

  - id: A23-037
    topic: 23-3-2-2
    diff: 2
    q: 請負契約で開発したシステムを納品した後に，契約で定めた仕様を満たさない不具合が見つかった。民法上の扱いとして，適切なものはどれか。
    c:
      - 発注者は，請負人に対して契約不適合責任に基づき，修補などの履行の追完や代金の減額などを請求できる場合がある。
      - 請負契約では納品した時点ですべての責任が終了するので，発注者は何も請求できない。
      - 請負人は善管注意義務を果たしていれば，成果物に不具合があっても責任を負わない。
      - 不具合の修補は，必ず発注者が自らの費用で行わなければならない。
    a: ア
    exp: |
      請負契約では、請負人は仕事を完成させる義務を負います。納品した成果物が種類・品質などについて契約の内容に適合しない場合、発注者は請負人に対して、履行の追完（修補など）の請求、報酬の減額の請求、損害賠償の請求、契約の解除などができます（契約不適合責任）。発注者は、原則として不適合を知った時から 1 年以内にその旨を請負人に通知する必要があります。
    why:
      - 正解です。契約不適合責任に基づいて追完などを請求できる場合があります。
      - 納品後も、契約内容に適合しない場合には請負人の責任が生じます。
      - 善管注意義務を果たせばよいのは準委任契約の考え方で、請負人は仕事の完成義務を負います。
      - 契約不適合がある場合、発注者は請負人に修補などを請求できます。
    terms: [請負契約, 契約不適合責任, 準委任契約]

  - id: A23-038
    topic: 23-4-5-8
    diff: 2
    q: PL 法（製造物責任法）の説明として，適切なものはどれか。
    c:
      - 製造物の欠陥によって人の生命，身体又は財産に損害が生じた場合，被害者は製造業者などの過失を証明しなくても損害賠償を請求できる。
      - 製造物の欠陥によって損害が生じた場合，被害者は製造業者の過失を証明しなければ損害賠償を請求できない。
      - 機器に組み込まれていないソフトウェア単体も，製造物として対象になる。
      - 製造物の欠陥によって，その製造物自体だけが壊れた場合に限って適用される。
    a: ア
    exp: |
      PL 法（製造物責任法）は、製造物の欠陥によって人の生命・身体・財産に被害が生じた場合に、製造業者などが過失の有無にかかわらず損害賠償の責任を負うこと（無過失責任）を定めた法律です。被害者は、製造業者の過失ではなく製造物の欠陥を証明すればよくなりました。対象の製造物は「製造又は加工された動産」で、ソフトウェア単体は無体物なので対象外ですが、ソフトウェアを組み込んだ機器はその欠陥が原因で損害が生じれば対象になり得ます。
    why:
      - 正解です。過失を証明しなくても損害賠償を請求できます。
      - PL 法では、過失ではなく製造物の欠陥を証明すればよくなりました。
      - ソフトウェア単体は動産ではないので、製造物に含まれません。
      - 損害がその製造物自体だけにとどまる場合は、PL 法の対象外です。
    terms: [PL法]

  - id: A23-039
    topic: 23-4-5-6
    diff: 2
    q: 電子帳簿保存法の説明として，適切なものはどれか。
    c:
      - 国税関係の帳簿や書類を電磁的記録で保存することを認め，電子取引で授受した取引情報の電磁的記録による保存について定めている。
      - 民間事業者などが法令で保存を義務付けられた書面について，電磁的記録による保存を横断的に認めている。
      - 国の行政機関が保有する行政文書について，誰でも開示を請求できることを定めている。
      - 電子署名が行われた電磁的記録の法的な効力を定めている。
    a: ア
    exp: |
      電子帳簿保存法は、法人税法などで保存が義務付けられている国税関係の帳簿や書類について、一定の要件の下で電磁的記録（電子データ）による保存を認める法律です。また、電子メールや EDI などの電子取引で授受した請求書などの取引情報は、電磁的記録のまま保存することが定められています。
    why:
      - 正解です。国税関係の帳簿書類の電子保存などを定めています。
      - これは e-文書法の説明です。
      - これは情報公開法の説明です。
      - これは電子署名法の説明です。
    terms: [電子帳簿保存法, e-文書法, 情報公開法, 電子署名法]

  - id: A23-040
    topic: 23-4-5-5
    diff: 2
    q: e-文書法の説明として，適切なものはどれか。
    c:
      - 法令で保存が義務付けられている書面について，原則として電磁的記録による保存を認めることを，個々の法律を改正せずに横断的に定めた法律
      - 紙の書類をスキャンして保存することを一切認めず，原本の保存を義務付けた法律
      - 電子メールによる広告の送信を規制する法律
      - 行政手続のオンライン化を原則とすることなどを定めた法律
    a: ア
    exp: |
      e-文書法は、多くの法令で民間事業者などに保存が義務付けられている書面について、電磁的記録による保存などを認めることを、個別の法律を改正することなく横断的に定めた法律です。紙の書類をスキャナで読み取った画像データによる保存も、一定の要件の下で認められます。
    why:
      - 正解です。書面の電磁的記録による保存を横断的に認める法律です。
      - e-文書法は、スキャンによる電子保存を一定の要件の下で認めています。
      - これは特定電子メール法の説明です。
      - これは官民データ活用推進基本法の説明です。
    terms: [e-文書法, 特定電子メール法, 官民データ活用推進基本法]

  - id: A23-041
    topic: 23-4-5-9
    diff: 2
    q: 情報公開法（行政機関の保有する情報の公開に関する法律）の説明として，適切なものはどれか。
    c:
      - 何人も，国の行政機関の長に対して，その行政機関が保有する行政文書の開示を請求できる。
      - 開示を請求できるのは，日本国籍をもつ者に限られる。
      - 開示を請求された行政文書は，個人情報が含まれていてもすべて開示しなければならない。
      - 民間企業が保有する文書の開示を請求できる。
    a: ア
    exp: |
      情報公開法は、国民主権の理念に基づき、行政機関の保有する情報の一層の公開を図り、政府の諸活動を国民に説明する責務が全うされるようにすることを目的とした法律です。何人も（国籍や年齢などを問わず）行政文書の開示を請求できます。ただし、特定の個人を識別できる情報や、公にすると国の安全が害されるおそれがある情報など、不開示情報として定められたものは開示されません。
    why:
      - 正解です。何人も行政文書の開示を請求できます。
      - 請求できるのは「何人も」とされており、国籍の制限はありません。
      - 個人情報など不開示情報に該当する部分は開示されません。
      - 情報公開法の対象は国の行政機関が保有する行政文書で、民間企業の文書は対象外です。
    terms: [情報公開法]

  - id: A23-042
    topic: 23-3-3-3
    diff: 2
    q: GPL が適用されたソフトウェアを改変して，その改変物を第三者に頒布するときの扱いとして，適切なものはどれか。
    c:
      - 改変物にも GPL を適用し，入手した者がソースコードを入手できるようにしなければならない。
      - 改変した部分のソースコードは非公開にして，実行形式だけを頒布してよい。
      - 改変物には GPL を適用せず，独自の商用ライセンスで頒布しなければならない。
      - 改変物を有償で頒布することは禁止されている。
    a: ア
    exp: |
      GPL（GNU General Public License）は、ソフトウェアを利用・改変・再頒布する自由を保障し、その自由が派生物にも引き継がれるように、改変物を頒布するときは同じ GPL を適用してソースコードを入手できるようにすることを求めるライセンスです。このように派生物にも同じ条件を課す考え方をコピーレフトといいます。有償で頒布することは禁止されていません。
    why:
      - 正解です。改変物にも GPL を適用してソースコードを入手できるようにします。
      - ソースコードを非公開にして頒布することは、GPL の条件に反します。
      - GPL のソフトウェアの改変物は、同じ GPL で頒布する必要があります。
      - GPL は有償での頒布を禁止していません。
    terms: [GPL, コピーレフト, OSS]

  - id: A23-043
    topic: 23-3-3-3
    diff: 2
    q: MIT ライセンスが適用された OSS を自社製品に組み込んで販売する場合の扱いとして，適切なものはどれか。
    c:
      - 著作権表示と許諾表示を製品に含めれば，自社製品のソースコードを公開せずに販売できる。
      - 自社製品のソースコードをすべて公開しなければならない。
      - OSS を商用製品に組み込むことは禁止されている。
      - OSS の作者に，売上に応じた使用料を支払わなければならない。
    a: ア
    exp: |
      MIT ライセンスや BSD ライセンスは、制約の少ない（寛容型の）OSS ライセンスで、著作権表示と許諾表示（ライセンス文）を複製物に含めることなどを条件に、改変や商用利用、ソースコードを公開しない形での再頒布を認めています。Apache ライセンスも同様に寛容型で、特許の許諾に関する条項などを含みます。派生物のソースコード公開を求めるコピーレフト型の GPL とは異なります。
    why:
      - 正解です。著作権表示と許諾表示を含めればソースコードを公開せずに販売できます。
      - 自社製品のソースコードの公開を求めるのは、GPL などのコピーレフト型のライセンスです。
      - MIT ライセンスは商用製品への組込みを認めています。
      - MIT ライセンスでは、作者への使用料の支払は求められていません。
    terms: [MITライセンス, BSDライセンス, Apacheライセンス, GPL]

  - id: A23-044
    topic: 23-3-3-3
    diff: 1
    q: ソフトウェアのパッケージの包装を開封した時点で，使用許諾契約に同意したものとみなす契約形態はどれか。
    c: ['シュリンクラップ契約', 'サイトライセンス契約', 'ボリュームライセンス契約', 'CAL']
    a: ア
    exp: |
      シュリンクラップ契約は、ソフトウェアの媒体を包むフィルム（シュリンクラップ）を破って開封した時点で、利用者が使用許諾契約の内容に同意したとみなす契約形態です。ダウンロード版などで、画面に表示された使用許諾条件に「同意する」をクリックさせる方式はクリックオン契約と呼ばれます。
    why:
      - 正解です。包装の開封によって契約に同意したとみなします。
      - サイトライセンス契約は、特定の事業所などの範囲内で、台数を限らずに使用することを認める契約です。
      - ボリュームライセンス契約は、多数のライセンスをまとめて購入する際に割引などを受けられる契約です。
      - CAL（Client Access License）は、サーバにアクセスするクライアントの数に応じて購入するライセンスです。
    terms: [シュリンクラップ契約, サイトライセンス契約, ボリュームライセンス契約, CAL]

  - id: A23-045
    topic: 23-3-1-3
    diff: 2
    q: 公益通報者保護法の説明として，適切なものはどれか。
    c:
      - 労働者などが，勤務先などの法令違反行為を一定の要件の下で通報した場合に，通報を理由とする解雇などの不利益な取扱いから保護する。
      - 企業の機密情報を外部に漏えいした従業員を処罰する。
      - 消費者が企業の不当な勧誘によって結んだ契約を取り消せるようにする。
      - 職場での優越的な関係を背景とした言動で労働者の就業環境が害されることを防止する措置を，事業主に義務付ける。
    a: ア
    exp: |
      公益通報者保護法は、労働者などが、勤務先などの事業者の法令違反行為（対象となる法律に違反する犯罪行為など）を、事業者内部、行政機関、報道機関などに一定の要件の下で通報した場合に、通報を理由とする解雇の無効や降格・減給などの不利益な取扱いの禁止を定め、通報者を保護する法律です。一定規模以上の事業者には、内部通報に対応する体制の整備も義務付けられています。
    why:
      - 正解です。法令違反を通報した労働者などを不利益な取扱いから保護します。
      - 公益通報者保護法は通報者を保護する法律で、営業秘密の漏えいは不正競争防止法で規制されます。
      - これは消費者契約法の説明です。
      - これは労働施策総合推進法（パワハラ防止法）の説明です。
    terms: [公益通報者保護法, 内部告発, 不正競争防止法]

  - id: A23-046
    topic: 23-4-3
    diff: 1
    q: 企業におけるコンプライアンスの考え方として，最も適切なものはどれか。
    c:
      - 法令を守ることに加えて，社内規程や企業倫理，社会規範に沿って公正に行動する。
      - 法令に違反しない範囲であれば，社会から批判を受ける行為であっても積極的に行う。
      - 利益を最大化するためであれば，社内規程に違反してもよい。
      - 法令を守る責任は経営者だけにあり，従業員には関係しない。
    a: ア
    exp: |
      コンプライアンスは「法令遵守」と訳されますが、企業においては、法令を守ることだけでなく、社内規程や業界のルール、企業倫理、社会規範などを守って公正・誠実に行動することまで含めて考えられています。違反は罰則だけでなく、社会的な信用の失墜（レピュテーションリスク）にもつながります。経営者から従業員まで全員が取り組むべきものです。
    why:
      - 正解です。法令に加え、企業倫理や社会規範に沿って行動することです。
      - 社会規範に反する行為は、法令に違反しなくてもコンプライアンスに反し、信用を失うおそれがあります。
      - 社内規程を守ることもコンプライアンスに含まれます。
      - コンプライアンスは経営者から従業員まで組織の全員が取り組むものです。
    terms: [コンプライアンス, 企業倫理, レピュテーションリスク]

  - id: A23-047
    topic: 23-4-4
    diff: 2
    q: フィルターバブルの説明として，適切なものはどれか。
    c:
      - 利用者の閲覧履歴などから，アルゴリズムがその人の好みに合う情報を優先して表示することで，利用者が自分の見たい情報だけに囲まれ，異なる意見から隔離される状態
      - 価値観の似た者どうしが SNS などで交流し，同じ意見が反響し合うことで，その意見が正しいと確信を強めていく現象
      - 一度インターネット上に公開された情報が，完全には削除できずに残り続けること
      - 不正確な情報や偽情報について，事実関係を調べて正確性を検証すること
    a: ア
    exp: |
      フィルターバブルは、検索エンジンや SNS などのアルゴリズムが、利用者の閲覧・検索の履歴などを基にその人が好みそうな情報を選んで表示することで、利用者が泡（バブル）の中にいるように自分の興味や考えに合う情報ばかりに囲まれ、異なる情報や意見に触れにくくなる状態です。
    why:
      - 正解です。アルゴリズムによって好みに合う情報だけに囲まれる状態です。
      - これはエコーチェンバーの説明です。
      - これはデジタルタトゥーの説明です。
      - これはファクトチェックの説明です。
    terms: [フィルターバブル, エコーチェンバー, デジタルタトゥー, ファクトチェック]

  - id: A23-048
    topic: 23-4-5-2
    diff: 3
    q: 金融商品取引法で，上場企業などに提出が求められる内部統制報告書の説明として，適切なものはどれか。
    c:
      - 経営者が，財務報告に係る内部統制の有効性を評価した結果を記載した報告書で，公認会計士や監査法人の監査を受ける。
      - 企業の環境保護活動や社会貢献活動の成果をまとめて，任意で公表する報告書
      - システム監査人が，情報システムの信頼性や安全性を点検・評価した結果を記載した報告書
      - 個人情報の漏えいが発生した際に，個人情報保護委員会に提出する報告書
    a: ア
    exp: |
      金融商品取引法では、上場企業などに対して、財務報告の信頼性を確保するための内部統制の有効性を経営者が評価した内部統制報告書を、有価証券報告書とあわせて提出することを求めています。内部統制報告書は、公認会計士又は監査法人による監査を受けます。この制度は、米国の SOX 法にならったことから J-SOX とも呼ばれます。
    why:
      - 正解です。経営者による財務報告に係る内部統制の評価を記載し、監査を受けます。
      - これは CSR 報告書（サステナビリティ報告書）の説明で、金融商品取引法で提出が求められるものではありません。
      - これはシステム監査報告書の説明です。
      - これは個人情報保護法に基づく漏えい等の報告の説明です。
    terms: [内部統制報告書, 金融商品取引法, 内部統制]

  - id: A23-049
    topic: 23-4-1
    diff: 2
    q: デジタル庁の設置などについて定め，デジタル社会の形成に関する基本理念や施策の基本方針を示した法律はどれか。
    c: ['デジタル社会形成基本法', '官民データ活用推進基本法', 'サイバーセキュリティ基本法', '情報公開法']
    a: ア
    exp: |
      デジタル社会形成基本法は、デジタル社会の形成に関する基本理念、国・地方公共団体・事業者の責務、施策の基本方針などを定めた法律で、デジタル庁の設置、重点計画の作成、ベースレジストリ（公的基礎情報データベース）の整備などについても規定しています。
    why:
      - 正解です。デジタル庁の設置などを定めた法律です。
      - 官民データ活用推進基本法は、官民データの活用の推進や、行政手続のオンライン利用の原則化などを定めた法律です。
      - サイバーセキュリティ基本法は、サイバーセキュリティに関する施策の基本理念や関係者の責務などを定めた法律です。
      - 情報公開法は、国の行政機関が保有する行政文書の開示請求について定めた法律です。
    terms: [デジタル社会形成基本法, 官民データ活用推進基本法, サイバーセキュリティ基本法, 情報公開法]

  - id: A23-050
    topic: 23-5-1-3
    diff: 1
    q: LAN の規格である IEEE 802.3 や無線 LAN の IEEE 802.11 などの標準化を行っている団体はどれか。
    c: ['IEEE', 'W3C', 'IETF', 'ITU']
    a: ア
    exp: |
      IEEE（Institute of Electrical and Electronics Engineers：電気電子学会）は、米国に本部を置く電気・電子分野の学会で、LAN の規格（IEEE 802 シリーズ）などの標準化を行っています。主な標準化団体には、ISO（国際標準化機構）、IEC（国際電気標準会議）、ITU（国際電気通信連合）、IETF（インターネット技術の標準化、RFC の発行）、W3C（Web 技術の標準化）などがあります。
    why:
      - 正解です。IEEE 802 シリーズは IEEE が策定しています。
      - W3C は、HTML や CSS などの Web 技術の標準化を行う団体です。
      - IETF は、TCP/IP などインターネット技術の標準化を行い、RFC を発行する団体です。
      - ITU は、電気通信分野の国際標準化などを行う国連の専門機関です。
    terms: [IEEE, W3C, IETF, ITU]

  - id: A23-051
    topic: 23-5-2
    diff: 1
    q: デファクトスタンダードの説明として，適切なものはどれか。
    c:
      - 公的な標準化機関の手続を経ずに，市場での競争の結果，多くの人に使われて事実上の標準となったもの
      - ISO や JIS など，公的な標準化機関が定めた標準
      - 関心をもつ複数の企業が集まってフォーラムを作り，そこで合意して定めた標準
      - 法律によって使用が義務付けられた標準
    a: ア
    exp: |
      デファクトスタンダード（事実上の標準）は、公的な標準化の手続によらず、市場での競争を勝ち抜いて広く普及した結果、事実上の標準として扱われるようになったものです。これに対し、ISO や JIS などの公的な標準化機関が定めた標準をデジュレスタンダード（公的標準）といいます。また、複数の企業などがフォーラム（コンソーシアム）を作って策定する標準をフォーラム標準といいます。
    why:
      - 正解です。市場で広く使われて事実上の標準となったものです。
      - これはデジュレスタンダードの説明です。
      - これはフォーラム標準の説明です。
      - 法律による義務付けは、デファクトスタンダードの要件ではありません。
    terms: [デファクトスタンダード, デジュレスタンダード, フォーラム標準]

  - id: A23-052
    topic: 23-5-1-1
    diff: 1
    q: JIS（日本産業規格）の説明として，適切なものはどれか。
    c:
      - 産業標準化法に基づいて定められる我が国の国家規格で，情報処理の分野は X 部門，管理システムの分野は Q 部門に分類される。
      - 国際標準化機構が定める国際規格である。
      - 米国の国家規格である。
      - 企業が自社製品のために独自に定める社内規格である。
    a: ア
    exp: |
      JIS（Japanese Industrial Standards：日本産業規格）は、産業標準化法に基づいて制定される我が国の国家規格です。分野ごとに部門記号が付けられ、情報処理は JIS X、管理システム（品質マネジメントシステムや情報セキュリティマネジメントシステムなど）は JIS Q です。JIS の制定などの審議は日本産業標準調査会（JISC）が行います。
    why:
      - 正解です。我が国の国家規格です。
      - 国際規格を定めるのは ISO（国際標準化機構）などです。
      - 米国の規格を定めるのは ANSI（米国規格協会）です。
      - 社内規格は企業が独自に定めるもので、JIS ではありません。
    terms: [JIS, ISO, ANSI]

  - id: A23-053
    topic: 23-5-5
    diff: 2
    q: QR コードの特徴として，適切なものはどれか。
    c:
      - 縦横の 2 方向に情報をもつ 2 次元コードで，3 つの隅にある切り出しシンボルによってどの方向からでも読み取ることができ，誤り訂正機能ももつ。
      - 横方向だけに情報をもつ 1 次元のバーコードで，主に商品の識別に用いられる 13 桁又は 8 桁のコードである。
      - 書籍を識別するために，国際的に割り当てられる番号である。
      - 電波を用いて，非接触で情報を読み書きする IC タグである。
    a: ア
    exp: |
      QR コードは、縦横の 2 方向に情報を記録する 2 次元コードで、1 次元のバーコードより多くの情報（数字や英字だけでなく漢字なども）を記録できます。3 つの隅にある切り出しシンボル（位置検出パターン）により、360 度どの方向からでも高速に読み取れます。誤り訂正機能をもつため、一部が汚れたり欠けたりしていても読み取れる場合があります。
    why:
      - 正解です。2 次元コードで、切り出しシンボルと誤り訂正機能をもちます。
      - これは JAN コードの説明です。
      - これは ISBN コードの説明です。
      - これは RFID の説明です。
    terms: [QRコード, JANコード, ISBNコード, RFID]

  - id: A23-054
    topic: 23-5-3-2
    diff: 2
    q: ISO/IEC 15408 の説明として，適切なものはどれか。
    c:
      - IT 製品やシステムのセキュリティ機能を評価するための国際規格で，評価の基準を定めている。
      - 組織の情報セキュリティマネジメントシステムの要求事項を定めた国際規格である。
      - 環境マネジメントシステムの要求事項を定めた国際規格である。
      - 品質マネジメントシステムの要求事項を定めた国際規格である。
    a: ア
    exp: |
      ISO/IEC 15408 は、IT 製品やシステムのセキュリティ機能やその品質について、セキュリティ評価を行うための国際規格（コモンクライテリア）です。我が国では JIS X 5070 として規格化され、この規格に基づいて製品を評価・認証する制度として JISEC（IT セキュリティ評価及び認証制度）があります。
    why:
      - 正解です。IT 製品のセキュリティ評価の基準です。
      - これは ISO/IEC 27001（JIS Q 27001）の説明です。
      - これは ISO 14001（JIS Q 14001）の説明です。
      - これは ISO 9001（JIS Q 9001）の説明です。
    terms: [ISO/IEC 15408, ISO/IEC 27001, ISO 14001, JISEC]
