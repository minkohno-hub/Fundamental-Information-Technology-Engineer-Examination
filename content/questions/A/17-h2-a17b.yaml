category: '17'
batch: H2
reviewed:
  at: '2026-10-30'
  method: 独立レビュアーが盲検で再解答し、正答・解説・重複を確認
questions:
  - id: A17-513
    topic: 17-1-3
    diff: 3
    scope: 17-1-3 プログラムマネジメント。相互に関連する複数のプロジェクトを束ね、組織の戦略目標の達成につなげる管理の適用判断
    prereq: プログラムマネジメントは、関連する複数のプロジェクトをまとめて管理し、個々のプロジェクトの成果を組み合わせて、戦略上の利益を実現すること
    hard: 個別プロジェクトの管理（納期や品質）との違いを、事例の管理対象（プロジェクト間の依存と戦略目標）から読み取る必要がある。
    q: |
      ある企業では、基幹システムの刷新、営業支援の導入、データ分析基盤の構築という 3 つのプロジェクトが並行して進んでおり、相互に依存関係がある。これらを束ねて、全社的な戦略目標（データに基づく経営）の達成につなげる管理の進め方はどれか。
    c:
      - プロジェクト間の依存は、各担当者の話し合いに任せる
      - 3 つのプロジェクトを 1 つに統合し、単一のプロジェクトとして管理する
      - 'プログラムマネジメント: 関連するプロジェクト群を束ね、プロジェクト間の依存や資源の配分を調整しながら、戦略目標の達成を管理する'
      - 各プロジェクトマネージャに、個別の納期と予算の達成だけを管理させる
    a: ウ
    exp: |
      プログラムマネジメントは、相互に関連する複数のプロジェクトを「プログラム」として束ねて管理する考え方です。個別のプロジェクトの成功（納期や品質の達成）だけでなく、プロジェクト間の依存関係や資源の配分の調整を通じて、それらを組み合わせた先にある戦略上の利益（本件では、データに基づく経営の実現）を達成することが目的です。束ねることと、1 つに統合することは異なります。各プロジェクトの管理は残したまま、その上位で全体を調整するのが、プログラムマネジメントです。
    why:
      - 依存の調整を担当者任せにすることは、管理の仕組みとして不十分です。
      - 統合して単一化することは、束ねて管理することとは異なり、規模と複雑さが増して管理が難しくなります。
      - 正解です。束ねて調整し、戦略目標につなげるのがプログラムマネジメントです。
      - 個別の達成だけでは、プロジェクト間の依存による全体の遅れや、戦略目標とのずれに対応できません。
    know: プログラムマネジメントの要点は、「個々のプロジェクトの上にもう一段の管理を置き、戦略目標に結び付ける」ことである。統合とは別の概念である点が鍵である。
    terms:
      - プログラムマネジメント
    verify:
      manual: 相互に依存する3つのプロジェクトを束ね、依存と資源配分を調整して戦略目標の達成を管理する進め方がプログラムマネジメントに当たることを、個別管理・統合・担当者任せとの対比で確認した。
  - id: A17-514
    topic: 17-4-1-5
    diff: 3
    scope: 17-4-1-5 情報システムの更改と廃棄。旧システムのデータについて、利用状況に応じて移行する範囲と保管の方法を計画する判断
    prereq: システム更改では、蓄積されたデータの全てが同じ必要性を持つわけではなく、参照の実態と保存の必要性に応じて、移行・保管・廃棄を切り分けること
    hard: 「全て移行する」「古いものは捨てる」という単純な方針ではなく、データごとの利用状況と保存義務を踏まえて、移行の範囲を決める必要がある。
    q: |
      基幹システムを更改することになった。旧システムには過去 10 年分の取引データが蓄積されているが、日常業務で参照されるのは最近 3 年分が中心であり、それより古いデータは、監査など限られた機会にしか参照されない。全データを新システムへ移行すると、費用と期間が大きく膨らむ見込みである。データ移行の計画として、適切なものはどれか。
    c:
      - 古いデータは参照頻度が低いので、保管はせず、全て削除してから移行する
      - 利用状況を確認し、業務に必要な期間のデータを移行対象とする。それ以外のデータは、必要になったときに参照できる形で保管するなど、データごとに移行の要否と方法を計画する
      - 履歴は全て業務に必要なものなので、期間を区切らず、全データを新システムへ移行する
      - データは移行せず、参照のためだけに、旧システムを今後も稼働させ続ける
    a: イ
    exp: |
      データ移行の計画では、データの利用状況と、保存の必要性を確認し、移行するもの、保管するもの、廃棄するものを切り分けます。本件では、日常業務で使う最近のデータを移行対象とし、参照頻度の低い古いデータは、監査などで必要になったときに参照できる形で保管することで、移行の費用と期間を抑えながら、必要なデータの引継ぎができます。全データを無条件に移行すると、更改の費用と期間が膨らみます。逆に、保存すべきデータを削除すると、後から参照できなくなります。
    why:
      - 監査などで必要になるデータもあり、保存すべきデータを削除すると、後から参照できなくなります。
      - 正解です。参照の実態に合わせて移行の範囲を決めることで、費用と期間を抑えながら、必要なデータの引継ぎができます。
      - 参照されないデータまで移行すると、費用と期間が膨らみ、更改そのものの妨げになります。必要性はデータごとに異なります。
      - 旧システムを動かし続けると、保守の費用と障害の危険が残り、更改の目的が果たせません。
    know: 移行計画の要点は、データを「移行するもの」「保管するもの」「廃棄するもの」に切り分けることである。その判断は、参照の実態と保存の必要性に基づいて行う。
    terms:
      - システム廃棄
      - データ移行
    verify:
      manual: データ移行の範囲の計画として、利用状況を確認して必要な期間のデータを移行対象とし、それ以外は参照できる形で保管する方針が、全量移行・削除・旧システムの延命との対比で適切であることを確認した。
  - id: A17-515
    topic: 17-4-1-3
    diff: 3
    scope: 17-4-1-3 普及啓発。新システムの利用が広がらない状況に対して、研修や支援体制によって利用を促す取組の判断
    prereq: システムの活用促進では、利用者の理解と技能を高める研修や、困ったときに頼れる支援の窓口（ヘルプデスクなど）を用意することが有効であること
    hard: 利用が広がらない原因を、システムの機能ではなく、利用者の理解と支援の不足として捉える必要がある。
    q: |
      新しい業務システムを導入したが、現場の利用が一部の担当者に限られ、多くの社員は従来の手作業を続けている。調査すると、操作方法が分からない、困ったときに聞ける相手がいない、という声が多い。活用促進の取組として、適切なものはどれか。
    c:
      - システムの機能をさらに追加し、高機能化する
      - 手作業を全面的に禁止し、問答無用で移行させる
      - 操作の研修を実施し、質問や相談を受け付ける支援の窓口を用意して、利用の不安を取り除く
      - 利用しない社員に対して、ペナルティを設ける
    a: ウ
    exp: |
      システムの活用が広がらない原因が、利用者の理解と支援の不足にある場合は、普及啓発の取組が効きます。研修で操作方法を学ぶ機会を作り、支援の窓口（ヘルプデスク）で、困ったときに聞ける環境を用意することで、利用の心理的な障壁が下がります。機能の追加は、本件の原因（分からない、聞けない）には効きません。罰則や強制は、反発を招き、かえって活用を妨げることがあります。
    why:
      - 高機能化は、分からないという原因の解決にはなりません。
      - 強制だけでは、困ったときに行き詰まり、業務に支障を生じます。
      - 正解です。理解を促す研修と、支援の窓口が、原因に合った取組です。
      - ペナルティは、利用者の抵抗を強め、活用の促進にはつながりません。
    know: 活用促進の要点は、「使われない理由を取り除く」という視点である。システムの側の改善と、人の側の支援を区別して判断することが鍵である。
    terms:
      - 普及啓発
      - ヘルプデスク
    verify:
      manual: 利用が広がらない原因が操作方法の理解と相談相手の不足である状況に対して、研修の実施と支援窓口の用意が活用促進として適切であることを確認した。
  - id: A17-516
    topic: 17-4-1-2
    diff: 3
    scope: 17-4-1-2 デジタルリテラシー。全社員が、デジタル技術を業務に活用し、情報の扱いの注意点を理解するための、底上げの取組の判断
    prereq: デジタルリテラシーは、デジタル技術やデータを理解して活用する能力と、セキュリティや情報倫理を含む、情報を適切に扱う能力であること
    hard: 専門家向けの高度な教育ではなく、全社員を対象とした底上げである点と、技術の使い方だけでなく情報の扱いの注意点を含む点を読み取る必要がある。
    q: |
      全社的にデジタル化を進める中で、社員によって、ツールの活用度や、情報の扱いへの理解に大きな差があることが課題になっている。デジタルリテラシーの向上の取組として、適切なものはどれか。
    c:
      - 新しいツールを導入するたびに、その操作方法のマニュアルを配布するだけにする
      - 全社員を対象に、ツールの活用方法に加えて、情報セキュリティや個人情報の扱いの注意点を含む教育を、継続的に実施する
      - 情報システム部門の社員だけを対象に、高度な技術の教育を実施する
      - リテラシーの差は個人の適性によるものとして、取組は行わない
    a: イ
    exp: |
      デジタルリテラシーは、デジタル技術を理解して活用する能力と、情報を適切に扱う能力（セキュリティ、個人情報、情報倫理を含む）を指します。全社的なデジタル化では、一部の専門家だけでなく、全社員の底上げが必要です。そのため、ツールの使い方に、情報の扱いの注意点を含めた教育を、全社員に継続的に行うことが、取組として適切です。マニュアルの配布だけでは、理解の確認や、注意点の浸透が不十分です。
    why:
      - マニュアルの配布だけでは、理解したかどうかの確認も、注意点の浸透も図れません。
      - 正解です。対象を全社員とし、内容に情報の扱いを含めることが、底上げの取組です。
      - 一部の部門だけでは、全社的な差の解消にはなりません。
      - 差を放置すると、活用の格差と、情報の扱いの事故の危険が残ります。
    know: デジタルリテラシーの要点は、「全員の底上げ」と「使い方＋情報の扱い」という 2 つの広さである。専門家の育成との違いが鍵である。
    terms:
      - デジタルリテラシー
    verify:
      manual: 社員間の活用度と理解の差が課題である状況に対して、全社員を対象に、ツールの活用と情報の扱いの注意点を含む教育を継続することが、デジタルリテラシーの向上として適切であることを確認した。
  - id: A17-517
    topic: 17-1-2-5
    diff: 3
    scope: 17-1-2-5 テクノロジアーキテクチャ。EA において、システムの基盤となる技術の標準（ハードウェア、OS、ミドルウェアなど）を定める領域の判断
    prereq: エンタープライズアーキテクチャ（EA）の 4 つの体系のうち、テクノロジアーキテクチャは、情報システムを構築・運用するための技術基盤の標準化を扱うこと
    hard: EA の 4 つのアーキテクチャ（ビジネス、データ、アプリケーション、テクノロジ）のうち、どの領域の話かを切り分ける必要がある。
    q: |
      エンタープライズアーキテクチャ（EA）の策定で、部門ごとに異なる OS やデータベースが乱立している状態を改め、全社の技術基盤の標準を定めることにした。これは、EA のどのアーキテクチャの取組か。
    c:
      - 'アプリケーションアーキテクチャ: 業務機能と、それを実現するシステムの対応を定める'
      - 'テクノロジアーキテクチャ: システムを支える技術基盤（ハードウェア、OS、ミドルウェアなど）の標準を定める'
      - 'ビジネスアーキテクチャ: 業務の内容や組織、業務の流れを体系化する'
      - 'データアーキテクチャ: 組織で扱うデータの構造と管理の標準を定める'
    a: イ
    exp: |
      EA は、ビジネス、データ、アプリケーション、テクノロジの 4 つのアーキテクチャから構成されます。このうち、OS やデータベース、ハードウェアといった技術基盤の標準化を扱うのは、テクノロジアーキテクチャです。技術の標準をそろえることで、運用や保守の効率、システム間の連携のしやすさが高まります。本件は、まさに技術基盤の乱立を改める取組であり、テクノロジアーキテクチャに当たります。
    why:
      - 業務機能とシステムの対応の話であり、技術基盤そのものの標準化とは異なります。
      - 正解です。技術基盤の標準は、テクノロジアーキテクチャの領域です。
      - 業務の内容や組織の体系化であり、技術基盤の話ではありません。
      - データの構造と管理の標準であり、OS や基盤の話ではありません。
    know: EA の 4 領域の区別は、「何をそろえる話か」で判断することが要点である。技術基盤ならテクノロジ、という対応が鍵である。
    terms:
      - テクノロジアーキテクチャ
      - エンタープライズアーキテクチャ
    verify:
      manual: OSやデータベースなどの技術基盤の標準を定める取組が、EAのテクノロジアーキテクチャに当たることを、他の3つのアーキテクチャ（ビジネス・データ・アプリケーション）との対象の区別から確認した。
  - id: A17-518
    topic: 17-1-2-4
    diff: 3
    scope: 17-1-2-4 アプリケーションアーキテクチャ。業務に必要な機能と、それを実現する情報システムの対応を整理し、重複や不足を明らかにする取組の判断
    prereq: アプリケーションアーキテクチャは、業務機能の一覧と、それを支援する情報システムの対応関係を体系化したものであり、機能の重複や、支援のない業務の発見に使うこと
    hard: 技術基盤（テクノロジアーキテクチャ）ではなく、業務機能とシステムの対応の整理であることを読み取る必要がある。
    q: |
      複数の部門が、それぞれ似たような顧客管理のシステムを別々に持っており、機能の重複と、二重の保守費用が問題になっている。EA のアプリケーションアーキテクチャの観点からの取組として、適切なものはどれか。
    c:
      - 各システムのサーバを、より高性能なものに入れ替える
      - 部門ごとに、システムの利用マニュアルを整備する
      - 業務に必要な機能の一覧と、各システムがどの機能を担っているかの対応を整理し、重複する機能の統合や、共通化の方向を明らかにする
      - 重複はそのままにし、保守契約の単価の交渉だけを行う
    a: ウ
    exp: |
      アプリケーションアーキテクチャは、業務機能と情報システムの対応を体系化したものです。機能の一覧と、システムとの対応を整理すると、複数のシステムが同じ機能を重複して持っていることや、逆にどのシステムも担っていない機能があることが見えるようになります。本件の重複と二重の費用の問題には、この整理をもとに、機能の統合や共通化の方向を定める取組が対応します。サーバの性能やマニュアル、契約の話ではありません。
    why:
      - サーバの性能の話は、機能の重複の問題とは関係しません。
      - マニュアルの整備は利用の支援であり、重複の解消にはつながりません。
      - 正解です。機能とシステムの対応の整理が、重複の発見と統合の出発点です。
      - 単価の交渉だけでは、重複する保守そのものはなくなりません。
    know: アプリケーションアーキテクチャの要点は、「業務機能を軸に、システムの持ち方を整理する」ことである。重複の問題は、この対応表の視点で判断することが鍵である。
    terms:
      - アプリケーションアーキテクチャ
    verify:
      manual: 似た顧客管理システムが部門ごとに重複している問題に対して、業務機能と各システムの対応を整理して統合や共通化の方向を明らかにする取組が、アプリケーションアーキテクチャの観点に沿うことを確認した。
  - id: A17-519
    topic: 17-1-1-3
    diff: 3
    scope: 17-1-1-3 情報システム化基本計画。経営計画と整合させて、情報システム化の基本方針や対象範囲、進め方を定める計画の策定の判断
    prereq: 情報システム化基本計画は、経営戦略や事業計画を受けて、情報システム化の基本方針、対象とする業務の範囲、全体の進め方などを定める計画であること
    hard: 個別のシステムの開発計画や、技術の選定といった下位の計画と区別し、経営との整合を定める上位の計画であることを読み取る必要がある。
    q: |
      経営計画で「3 年以内に、データに基づく意思決定を全社に広げる」ことが掲げられた。これを受けた情報システム化基本計画の策定として、適切なものはどれか。
    c:
      - 導入するデータ分析ツールの製品名と、購入の台数を直ちに決定する
      - 各部門が個別に進めているシステム化の要望を、そのまま全て承認する
      - 過去の情報システム化基本計画を、内容を変えずにそのまま使う
      - 経営計画の目標に沿って、情報システム化の基本方針、対象とする業務の範囲、全体のスケジュールと体制を定める
    a: エ
    exp: |
      情報システム化基本計画は、経営計画や事業の目標を受けて、情報システム化全体の方向を定める計画です。基本方針、対象範囲、全体の進め方（スケジュールや体制）を定め、その下で個別の開発計画が作られます。製品の選定のような具体的な決定は、計画の後の段階の話です。各部門の要望をそのまま全て受けることは、経営目標に沿った優先順位付けにはならず、過去の計画の流用は、新しい経営計画との整合を欠きます。
    why:
      - 製品の決定は下位の具体的な計画の話であり、基本計画の段階の内容ではありません。
      - 要望の全面的な承認は、方針に基づく取捨選択にはなりません。
      - 新しい経営計画を受けた計画であるため、過去の計画の流用では整合しません。
      - 正解です。経営計画と整合させ、全体の方向を定めるのが基本計画です。
    know: 情報システム化基本計画の要点は、「経営の目標を、システム化全体の方針に翻訳する」ことである。個別計画との上下関係が鍵である。
    terms:
      - 情報システム化基本計画
    verify:
      manual: 経営計画の目標を受けた情報システム化基本計画として、基本方針・対象範囲・全体のスケジュールと体制を定めることが適切であることを、製品決定・要望の全面承認・過去計画の流用との対比で確認した。
  - id: A17-520
    topic: 17-1-1-5
    diff: 3
    scope: 17-1-1-5 情報システム投資計画。投資額と年間効果から回収期間を計算し、案件同士を定量的に比べて優先順位を付ける判断
    prereq: 回収期間は、投資額を年間の効果で割って求めること、投資額の絶対額の小さいことと、回収の早さとは別のことであること
    hard: 3 案件について回収期間を実際に計算して比べる必要があり、投資額が最小の案件が回収も最速だという思い込みを避ける必要がある。
    q: |
      情報システム投資の 3 案件について、投資額と、導入後に見込まれる年間の効果（費用削減額）が、次のとおり見積もられている。回収期間（投資額を年間効果で割った年数）が最も短い案件を優先するという考え方に基づく判断として、適切なものはどれか。

      案件 X：投資額 600 万円、年間効果 200 万円
      案件 Y：投資額 900 万円、年間効果 360 万円
      案件 Z：投資額 400 万円、年間効果 100 万円
    c:
      - 案件 X を優先する。回収期間は 3 年である
      - 案件 X を優先する。回収期間は 0.33 年である
      - 案件 Y を優先する。回収期間は 2.5 年で、3 案件の中で最も短い
      - 案件 Z を優先する。投資額が最も小さいので、回収期間も最も短い
    a: ウ
    exp: |
      回収期間は、投資額を年間効果で割って求めます。案件 X は 600 ÷ 200 ＝ 3 年、案件 Y は 900 ÷ 360 ＝ 2.5 年、案件 Z は 400 ÷ 100 ＝ 4 年です。最も短いのは、案件 Y の 2.5 年です。投資額の絶対額が小さいことと、回収が早いことは別の話であり、案件 Z は投資額こそ最小ですが、年間効果も小さいため、回収期間は 3 案件の中で最長です。回収期間は定量的な物差しの一つであり、実際の計画では、経営戦略との整合など他の評価軸と併せて判断します。
    why:
      - 案件 X の回収期間が 3 年という計算自体は正しいが、案件 Y の 2.5 年の方が短く、最短ではありません。
      - 年間効果を投資額で割る向きの取り違えで生まれた値です（200 ÷ 600）。回収期間は、投資額を年間効果で割って求めます。
      - 正解です。900 ÷ 360 ＝ 2.5 年であり、3 案件の中で最も短い回収期間です。
      - 投資額の小ささと回収期間の短さを取り違えています。案件 Z の回収期間は 400 ÷ 100 ＝ 4 年で、最長です。
    know: 回収期間は「投資額 ÷ 年間効果」という比で比べる定量的な物差しである。投資額の絶対額ではなく、効果との比で見る点が要点であり、戦略との整合など他の評価軸と併せて使う。
    terms:
      - 投資計画
      - 回収期間
    verify:
      manual: 回収期間を X が 600 ÷ 200 ＝ 3 年、Y が 900 ÷ 360 ＝ 2.5 年、Z が 400 ÷ 100 ＝ 4 年と計算し、最も短い Y を優先する判断が正しいこと、各誤答の値が誤った計算や取り違えから生まれることを確認した。
