questions:
  - id: A09-609
    topic: 9-2-3
    diff: 3
    scope: 9-2-3 正規化（第1正規形）。繰返し列（同じ種類の値を複数の列に並べる形）を取り除き、1行に1値を収める分解の判断
    prereq: 第1正規形では、各列の値がそれ以上分割できない単一の値（原子値）であり、同じ種類の値の繰返し列を持たないこと
    hard: 主キーや関数従属の問題ではなく、列の構造そのもの（繰返し列）が正規形に反していることを見分ける必要がある。
    q: |
      表「顧客」は、列（顧客 ID、顧客名、電話番号 1、電話番号 2、電話番号 3）からなり、主キーは顧客 ID である。顧客が持つ電話番号の数が 3 本に満たない場合は、残りの列が NULL になる。この表の問題点と対処の組合せとして、適切なものはどれか。
    c:
      - 繰返し列があるため第 1 正規形に反する。電話番号を、表「顧客電話」（顧客 ID、電話番号）に切り出し、1 行に 1 本の電話番号を収める
      - 部分関数従属があるため第 2 正規形に反する。電話番号 2 と電話番号 3 を削除する
      - 推移的関数従属があるため第 3 正規形に反する。顧客名を別の表に切り出す
      - 問題はない。列の数が固定されているため、表の構造は安定している
    a: ア
    exp: |
      電話番号 1〜3 のような繰返し列は、値の種類が同じ列を横に並べた構造であり、第 1 正規形（各列に単一の値を収め、繰返しを持たない）に反します。また、4 本目の電話番号を登録できない、NULL が混ざる、検索の条件が列ごとに必要になる、といった実務上の問題も生じます。対処は、電話番号を別の表に切り出し、顧客 ID と電話番号の組を 1 行とする形にすることです。
    why:
      - 正解です。繰返し列の除去が、第 1 正規形への対処です。
      - 主キーは単一列であり、部分関数従属は生じていません。列を削除すると、登録できる電話番号の情報自体が失われます。
      - 顧客名は顧客 ID から直接決まる値であり、推移的関数従属の対象ではありません。問題は繰返し列です。
      - 列数が固定されていること自体が問題であり、電話番号の本数の変化に対応できません。
    know: 第 1 正規形の要点は、繰返し列の除去と値の原子性である。「同じ種類の列が横に並んでいたら、行に変換する」という定形が切り分けの鍵である。
    terms: [第1正規形, 正規化]
    verify:
      manual: 電話番号1〜3の繰返し列が第1正規形に反すること、電話番号を顧客IDと組にした別表へ切り出す分解が対処になることを、部分関数従属・推移的関数従属ではない点も含めて確認した。
  - id: A09-610
    topic: 9-2-3
    diff: 4
    scope: 9-2-3 関数従属と候補キー。属性の閉包（従属の連鎖でたどれる属性の集合）を計算し、候補キーを判定する問題
    prereq: 属性集合の閉包は、その集合から関数従属を繰り返し適用して得られる属性の集合であり、閉包が全属性になるとき、その集合はスーパーキーであること、候補キーは極小なスーパーキーであること
    hard: 従属の連鎖をたどる計算（閉包の計算）を正確に行い、極小性（余分な属性がないか）まで判定する必要がある。
    q: |
      関係 R（A、B、C、D）に、関数従属 A → B、B → C、C → D がある。R の候補キーはどれか。
    c:
      - A
      - A と B
      - B
      - A と C の組
    a: ア
    exp: |
      A の閉包を計算します。A → B により B が得られ、B → C、C → D と連鎖するため、A からは B、C、D の全てがたどれます。したがって A は全属性を決定でき、スーパーキーです。A は単一の属性であり、これ以上小さくできないため、候補キーです。

      B の閉包は B、C、D であり A を含まないため、B はキーにはなりません。A と B の組、A と C の組は、どちらも A だけで十分であるため、極小ではなく候補キーにはなりません（スーパーキーではあります）。
    why:
      - 正解です。A の閉包は全属性となり、単一属性で極小です。
      - B は A から決まる属性であり、キーには含まれません。B の閉包には A が入りません。
      - B からは A がたどれないため、全属性を決定できません。
      - A と C の組はスーパーキーですが、C は A から決まる余分な属性であり、極小ではありません。
    know: 候補キーの判定は、閉包の計算と極小性の確認の 2 段階である。「全てを決められるか」と「余分な属性がないか」を分けて考えることが要点である。
    terms: [候補キー, 関数従属]
    verify:
      manual: Aの閉包がA→B→C→Dの連鎖で全属性になること、Bの閉包にAが含まれないこと、Aを含む組は極小でないことから、候補キーがAのみであることを確認した。
  - id: A09-611
    topic: 9-2-2-1
    diff: 3
    scope: 9-2-2-1 概念設計における多値属性の扱い。1つの実体が複数持つ値（多値属性）を、関係への変換で別表に切り出す判断
    prereq: 多値属性は、1つの実体に対して複数の値を取る属性であり、関係では 1 つの列に複数の値を詰め込めないため、実体のキーと値の組を 1 行とする別の表に変換すること
    hard: 関連（実体どうしの関係）ではなく、属性そのものが複数値を持つ場合の変換であることを読み分ける必要がある。区切り文字で 1 列に詰め込む案との違いも問われる。
    q: |
      概念設計で、実体「社員」は属性「保有資格」を持ち、1 人の社員が複数の資格を持つことができる（多値属性）。関係データベースへの変換として、適切なものはどれか。
    c:
      - 保有資格を別の表に切り出し、（社員番号、資格）の組を 1 行として、社員が持つ資格の数だけ行を持たせる
      - 社員表の「保有資格」列に、資格名をカンマで区切って複数書き込む
      - 社員表に「資格 1」「資格 2」「資格 3」の繰返し列を用意する
      - 保有資格は、社員表の主キーに組み入れる
    a: ア
    exp: |
      多値属性は、そのままでは関係の列に収まりません。1 つの列に 1 つの値を収める原則（第 1 正規形の原子性）のため、資格の数だけ行を持つ別の表に切り出します。カンマ区切りで詰め込む方法は、値が原子でなくなり、資格による検索や集計ができません。繰返し列は、持てる資格の数に上限ができ、空き列（NULL）の問題も生じます。主キーに組み入れるのは、この属性が社員を識別するためのものではないため不適切です。
    why:
      - 正解です。多値属性は、キーと値の組を行とする別の表に変換します。
      - 1 列に複数の値を詰め込むと値が原子でなくなり、その資格を持つ社員の検索が文字列の照合に頼ることになります。
      - 繰返し列では列数を超える資格を登録できず、NULL の混在も生じます。
      - 保有資格は社員を識別する属性ではありません。主キーは識別のための属性の組です。
    know: 多値属性の変換は、「複数持つ値は、行に展開する」という定形である。関連を表にする変換と似ているが、対象が属性である点が違いであり、値の原子性が理由であることが要点である。
    terms: [多値属性, E-Rモデル]
    verify:
      manual: 保有資格が多値属性であり、関係では社員番号と資格の組を行とする別表に変換すること、カンマ区切りの詰め込み・繰返し列・主キーへの組入れが不適切な理由を、値の原子性の観点から確認した。
  - id: A09-612
    topic: 9-4-4
    diff: 3
    scope: 9-4-4 インデックスの効果と代償。検索の高速化と、更新処理への影響のトレードオフの判断
    prereq: インデックスは、検索の際の読取りを減らす代わりに、登録・更新・削除の際にインデックス自体の保守が要ること
    hard: 索引を付ける列の選択は、その列での検索の頻度と、更新の頻度のバランスで決まることを読み取る必要がある。
    q: |
      ある表は、日次バッチで大量の行が一括登録され、日中は主キーによる検索しか行われない。主キー以外の列へのインデックスの追加について、判断として適切なものはどれか。
    c:
      - 主キー以外の列は検索に使われていないため、インデックスを追加しても検索は速くならず、一括登録のたびにインデックスの保守コストだけが増える。追加は見送るのが適切である
      - インデックスは多ければ多いほど検索が速くなるため、全ての列に追加すべきである
      - インデックスを追加すると、一括登録の処理も高速化されるため、追加すべきである
      - インデックスは主キーにしか付けることができないため、検討自体が不要である
    a: ア
    exp: |
      インデックスが効くのは、その列を条件にした検索や結合が行われる場合です。本件では主キー以外の列は検索に使われていないため、インデックスを追加しても読み取りの改善はありません。一方、行の登録のたびにインデックスも更新されるため、大量の一括登録では保守コストがそのまま処理時間の増加になります。索引の追加は、検索の頻度と更新の頻度のバランスで判断します。
    why:
      - 正解です。使われないインデックスは、保守コストだけが残ります。
      - 使われない列のインデックスは検索に寄与せず、更新コストだけが増えます。
      - インデックスの保守は、登録・更新の際の追加の書込みであり、登録を遅くする方向に働きます。
      - インデックスは、任意の列に付けることができます。必要なのは、付けるかどうかという判断です。
    know: インデックスは「検索の高速化」と「更新の保守コスト」の取引である。付ける列の選択は、実際の検索のパターンに基づく、という設計の考え方が要点である。
    terms: [インデックス]
    verify:
      manual: 主キー以外の列が検索に使われていない状況では、インデックスの追加が検索を改善せず、一括登録の保守コストだけを増やすことを、他の選択肢（全列追加、登録の高速化、主キー限定）との対比で確認した。

  - id: A09-613
    topic: 9-5-2
    diff: 3
    scope: 9-5-2 分散データベースの透明性。データの格納場所や分割のされ方を利用者に意識させない仕組み（位置透明性・分割透明性・複製透明性）の識別
    prereq: 分散データベースの透明性には、格納場所を意識しない位置透明性、分割のされ方を意識しない分割透明性、複製の存在を意識しない複製透明性があること
    hard: 似た名前の透明性を、シナリオのどの点（場所か、分割か、複製か）に対応するかで読み分ける必要がある。
    q: |
      分散データベースで、本社のプログラムが、支店のサーバに格納されている表を、その場所を指定することなく、あたかも自拠点の表と同じ SQL で検索できる。この性質はどれか。
    c:
      - '位置透明性: データがどの拠点に格納されているかを利用者が意識しなくてよい性質'
      - '分割透明性: 表が拠点ごとに分割されて格納されていることを利用者が意識しなくてよい性質'
      - '複製透明性: データの複製が複数の拠点に存在することを利用者が意識しなくてよい性質'
      - '障害透明性: 一部の拠点に障害が起きても、処理を継続できる性質'
    a: ア
    exp: |
      本問のシナリオで意識していないのは、データの「格納場所（位置）」です。場所を指定せずに、同じ SQL で検索できるのは、位置透明性によるものです。分割透明性は、表がどのように分割されているかを意識しない性質であり、シナリオでは分割のされ方は問われていません。複製透明性は、複製の存在を意識しない性質です。障害時の継続は、透明性の分類とは別の、可用性の観点です。
    why:
      - 正解です。格納場所を意識しない、という点が位置透明性です。
      - 分割のされ方を意識しない性質であり、本問が問う「場所を指定しない」点とは対象が異なります。
      - 複製の存在を意識しない性質であり、シナリオには複製の話は出てきません。
      - 障害への対処は可用性の観点であり、場所・分割・複製を意識しないという透明性の分類には入りません。
    know: 分散データベースの透明性は、「何を意識しなくてよいか」で切り分ける。場所なら位置、分割のされ方なら分割、複製の有無なら複製、という対応が識別の鍵である。
    terms: [位置透明性, 分散データベース]
    verify:
      manual: シナリオが意識していない対象がデータの格納場所であることから位置透明性が該当すること、分割透明性・複製透明性は意識しない対象が異なること、障害時の継続は透明性の分類外であることを確認した。
  - id: A09-614
    topic: 9-3-1
    diff: 3
    scope: 9-3-1 関係演算の射影。指定した列だけを取り出す操作で、結果の重複行が取り除かれることによる行数の計算
    prereq: 関係演算の射影では、結果に重複する行は現れないこと（関係は行の集合であるため）
    hard: 元の表の行数ではなく、取り出した列の値の組合せの種類の数が、結果の行数になることを読み取る必要がある。
    q: |
      表「社員」は（社員番号、氏名、部署、役職）の 6 行からなる。部署と役職の組合せの内訳は、営業が（一般 2 行、主任 1 行）、開発が（一般 1 行、主任 1 行）、総務が（主任 1 行）である。この表を部署と役職の列で射影した結果の行数は何行か。
    c: ['3', '5', '6', '4']
    a: イ
    exp: |
      射影は、指定した列だけを取り出す演算であり、結果は行の集合であるため、重複する行は取り除かれます。

      内訳から、現れる組合せは、営業が（一般、主任）の 2 種類、開発が（一般、主任）の 2 種類、総務が（主任）の 1 種類です。営業の一般は 2 行ありますが、射影の結果では重複する行が取り除かれ、1 行になります。

      したがって、結果の行数は 2 ＋ 2 ＋ 1 ＝ 5 行です。
    why:
      - 部署の種類の数だけを答えた値です。射影は、部署と役職の組合せの行を返します。
      - 正解です。現れる組合せは 5 種類であり、結果は 5 行です。
      - 元の表の行数そのものです。射影では、重複する行が取り除かれます。
      - 総務の組合せを数え落とした場合の値です。営業 2 種類と開発 2 種類だけを合計すると 4 になりますが、総務の（主任）の組合せも 1 行として現れます。
    know: 射影の結果の行数は、「列の値の組合せのうち、実際に現れる種類の数」である。定義上、関係は重複行を持たない、という点が計算の要点である。
    terms: [射影, 関係演算]
    verify: { type: value, value: 5 }

  - id: A09-615
    topic: 9-3-2-2
    diff: 3
    scope: 9-3-2-2 SQL の自己結合。同じ表を 2 回結合し、行と行の関係（社員とその上司）をたどる問合せの判断
    prereq: 自己結合では、同じ表に別の別名を付けて結合し、外部キー（上司の社員番号）と主キーを対応付けること
    hard: 2つの別名が、同じ表の異なる行を指すことを読み取る必要がある。上司のいない行（社長）の扱いも含まれる。
    q: |
      表「社員」は（社員番号、氏名、上司番号）からなり、上司番号には、その社員の上司の社員番号が入る（社長は NULL）。各社員について「社員名と、その上司の氏名」の一覧を得るための SQL として、適切なものはどれか。
    c:
      - 社員表に別名を 2 つ付けて、上司番号と社員番号を結合条件として結合する（SELECT E.氏名, M.氏名 FROM 社員 E JOIN 社員 M ON E.上司番号 ＝ M.社員番号）
      - 社員表を氏名でグループ化し、上司番号の最大値を取る
      - 社員表と、部署表を部署コードで結合する
      - 社員表を社員番号の降順に並べ替える
    a: ア
    exp: |
      同じ表の中の行どうしの関係をたどるには、表に 2 つの別名（ここでは E と M）を付けて結合する、自己結合を使います。E を社員の行、M を上司の行とみなし、E の上司番号と M の社員番号を対応付けると、上司の氏名を取り出せます。なお、この書き方は内部結合であるため、上司番号が NULL の行（社長）は結果に現れません。全員を出す場合は、外部結合が必要です。
    why:
      - 正解です。別名を使った自己結合で、社員と上司の行を対応付けます。
      - グループ化と集約では、行どうしの対応付けはできません。
      - 部署表との結合では、上司の氏名は得られません。必要なのは同じ表の中の対応付けです。
      - 並べ替えだけでは、上司の氏名を取り出すことはできません。
    know: 自己結合は、階層や参照の関係を 1 つの表の中でたどる定形である。別名の使い分けと、内部結合では NULL の行が落ちる点が要点である。
    terms: [自己結合, 外部キー]
    verify:
      manual: 社員表に2つの別名を付けて、上司番号と社員番号で結合する自己結合が、社員と上司の氏名の対応を得る方法であること、内部結合では社長の行が結果に現れないことも含めて確認した。

  - id: A09-616
    topic: 9-1-1-2
    diff: 3
    scope: 9-1-1-2 3層スキーマとデータ独立性。概念スキーマの変更が、外部スキーマ（利用者の見方）に影響しないようにする仕組みの判断
    prereq: 3層スキーマ（外部・概念・内部）では、概念スキーマがデータの論理構造を定め、外部スキーマはその部分的な見方を定めること、層の間の対応付けにより独立性が保たれること
    hard: 変更の種類（列の追加のような論理構造の変更）に対して、どの層の独立性（論理的独立性）が働くかを読み分ける必要がある。物理的独立性との区別も問われる。
    q: |
      データベースに新しい列を追加する変更を行ったが、既存のアプリケーションプログラムは、変更前と同じ見方（列の構成）でデータを使い続けられている。このような独立性を保つ仕組みとして、適切なものはどれか。
    c:
      - 3 層スキーマにおける論理的データ独立性であり、概念スキーマを変更しても、外部スキーマ（プログラムから見た表の見方）を変えずに済むことによる
      - 物理的データ独立性であり、格納装置を変更してもプログラムに影響しないことによる
      - トランザクションの独立性（ACID の I）であり、他の処理と干渉しないことによる
      - インデックスの存在であり、検索の経路が変わっても結果が同じであることによる
    a: ア
    exp: |
      3 層スキーマは、外部スキーマ（利用者やプログラムごとのデータの見方）、概念スキーマ（全体の論理構造）、内部スキーマ（物理的な格納の形）の 3 層からなります。概念スキーマに列を追加しても、外部スキーマとの対応付け（ビューなどの定義）によって、プログラムから見た見方を変えずに済むのが、論理的データ独立性です。内部スキーマの変更（格納方法や装置の変更）に対してプログラムを守るのは、物理的データ独立性であり、別の独立性です。
    why:
      - 正解です。論理構造の変更を、外部スキーマに波及させない仕組みです。
      - 物理的独立性は、格納の変更に関するものであり、列の追加のような論理構造の変更の話ではありません。
      - ACID の独立性は、トランザクションの同時実行に関する性質であり、スキーマの層の話とは別です。
      - インデックスは検索の性能のための構造であり、プログラムから見た表の見方を保つ仕組みではありません。
    know: 3 層スキーマの要点は、2 種類の独立性（論理的・物理的）を層の対応付けで実現することである。変更の種類と、対応する独立性を結び付けて理解する。
    terms: [3層スキーマ, データ独立性]
    verify:
      manual: 列の追加という論理構造の変更が、外部スキーマを変えずに済むのは論理的データ独立性によること、物理的独立性やACIDの独立性、インデックスとは別の概念であることを確認した。
