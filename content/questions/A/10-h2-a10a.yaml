questions:
  - id: A10-501
    topic: 10-3-1-3
    diff: 3
    q: |
      192.168.10.0/24 のアドレス空間を分割し，部署ごとに独立したサブネットを作る。必要な端末数は部署 A が 60 台，部署 B が 28 台，部署 C が 10 台である。各サブネットを，端末数を収容できる最小のサイズ（アドレス数が 2 のべき乗）で作るとき，三つのサブネットが消費するアドレス数（ネットワークアドレスとブロードキャストアドレスを含む）の合計は幾つか。
    c: ['98 個', '104 個', '112 個', '128 個']
    a: ウ
    scope: 'シラバス「ネットワーク層のプロトコル」のサブネットマスク・CIDR。ホスト部のビット数から割当可能なホスト数（2 のべき乗－2）を求める計算は FE 範囲内。'
    prereq: サブネットのホスト数＝2 のホスト部ビット数乗－2 であること。サブネットは 2 のべき乗サイズでしか作れないこと。
    hard: ホスト数に 2 を加えてから 2 のべき乗に切り上げる手順を 3 回繰り返す。端末数の合計や 2 を足しただけの合計に引きずられやすい。
    exp: |
      各部署に必要なアドレス数は「端末数＋2（ネットワークアドレスとブロードキャストアドレス）」で、これを 2 のべき乗に切り上げます。

      | 部署 | 端末数 | ＋2 | 切り上げ | 接頭辞長 |
      | --- | --- | --- | --- | --- |
      | A | 60 | 62 | 64 | /26 |
      | B | 28 | 30 | 32 | /27 |
      | C | 10 | 12 | 16 | /28 |

      合計は 64＋32＋16＝112 個です。サブネットのサイズは 2 のべき乗に限られるので、62 や 30 のような中途半端な値では確保できません。
    why:
      - 端末数の単純合計（60＋28＋10）です。ネットワークアドレスとブロードキャストアドレスの分と、2 のべき乗への切上げを考慮していないので誤りです。
      - （60＋2）＋（28＋2）＋（10＋2）の合計です。2 を足すところまでは合っていますが、サブネットは 2 のべき乗サイズでしか作れないので切上げが必要です。
      - 正解です。64＋32＋16＝112 個です。
      - 3 部署の合計 112 個を、さらに 2 のべき乗へ切り上げてしまった値です。切り上げは部署ごとのサイズにだけ適用し、合計には再度適用しません。
    know: サブネットの最小サイズは「ホスト数＋2 を 2 のべき乗に切り上げ」で求める。VLSM（可変長サブネットマスク）では部署ごとに接頭辞長が異なってよい。端末数の合計をそのまま使う誤りに注意する。
    terms: [サブネットマスク, VLSM]
    verify: { value: '2**ceil(log2(60+2)) + 2**ceil(log2(28+2)) + 2**ceil(log2(10+2))' }

  - id: A10-502
    topic: 10-3-1-3
    diff: 2
    q: IP アドレス 172.16.35.77，サブネットマスク 255.255.240.0 のホストが属するネットワークで，ホストに割り当てることができる最大のアドレスはどれか。
    c: ['172.16.35.254', '172.16.47.255', '172.16.47.254', '172.16.39.254']
    a: ウ
    scope: 'シラバス「ネットワーク層のプロトコル」のサブネットアドレス・サブネットマスク。マスクとアドレスの 2 進数計算でブロードキャストアドレスを求めるのは FE 範囲内。'
    prereq: マスクが 1 の部分がネットワーク部で，ホスト部が全部 1 のアドレスがブロードキャストアドレスであること。
    hard: 第 3 オクテットの途中でネットワーク部とホスト部が分かれるので 10 進数のまま考えられない。
    exp: |
      255.255.240.0 は /20 で、第 3 オクテットの上位 4 ビットまでがネットワーク部です。

      - 第 3 オクテット 35 ＝ 0010 0011。上位 4 ビット（0010）を残し、下位 4 ビットを 0 にすると 0010 0000 ＝ 32。
      - ネットワークアドレスは 172.16.32.0。
      - 下位 4 ビットを全部 1 にすると 0010 1111 ＝ 47 なので、ブロードキャストアドレスは 172.16.47.255。
      - 割り当てられる最大のホストアドレスは、その一つ手前の 172.16.47.254 です。
    why:
      - /24 のつもりで計算した値です。マスクは 255.255.240.0 なので第 3 オクテットの下位 4 ビットもホスト部に含まれます。
      - これはブロードキャストアドレスです。ホストには割り当てられず、最大のホストアドレスはその一つ手前です。
      - 正解です。ネットワークは 172.16.32.0〜172.16.47.255 で、最大のホストアドレスは 172.16.47.254 です。
      - /21（255.255.248.0）のときのブロードキャストアドレスの一つ手前です。マスクのビット数の数え違いによる誤りです。
    know: ホストに割り当てられる範囲は「ネットワークアドレス＋1」から「ブロードキャストアドレス－1」まで。マスクが 8 の倍数でないときは該当オクテットだけ 2 進数で計算する。
    terms: [サブネットマスク, ブロードキャストアドレス]
    verify: { manual: '35=00100011。マスク240=11110000。35 AND 240=32（ネットワーク 172.16.32.0）。35 OR (255-240=15)=47。ブロードキャスト 172.16.47.255。最大ホスト 172.16.47.254。/24 なら .35.254、/21 なら 35 OR 7=39 で .39.254 となり他の選択肢は一致しない。' }

  - id: A10-503
    topic: 10-3-1-3
    diff: 3
    q: |
      ルータの経路表が次のとおりである。宛先 IP アドレスが 10.1.2.100，10.1.3.9，10.2.0.1 のパケットを受信したとき，それぞれの転送先（次ホップ）の組合せはどれか。

      | 宛先ネットワーク | 次ホップ |
      | --- | --- |
      | 10.0.0.0/8 | R1 |
      | 10.1.0.0/16 | R2 |
      | 10.1.2.0/24 | R3 |
      | 10.1.2.128/25 | R4 |
      | 0.0.0.0/0 | R5 |
    c:
      - 'R4，R2，R1'
      - 'R1，R1，R1'
      - 'R3，R2，R5'
      - 'R3，R2，R1'
    a: エ
    scope: 'シラバス「ネットワーク層のプロトコル」のルーティング・CIDR。経路表から最長一致で転送先を決める手順は FE 範囲内。'
    prereq: ルータは宛先アドレスに合致する経路のうち接頭辞長が最も長いものを選ぶこと（最長一致）。
    hard: 10.1.2.128/25 の範囲（128〜255）を正しく見積もり，宛先ごとに合致する複数の経路から最長のものを選ぶ。
    exp: |
      ルータは、宛先アドレスが含まれる経路のうち接頭辞長が最も長いもの（最長一致）を選びます。表の記載順は関係ありません。

      | 宛先 | 合致する経路 | 最長一致 | 次ホップ |
      | --- | --- | --- | --- |
      | 10.1.2.100 | /8，/16，/24，0.0.0.0/0（/25 は 128〜255 なので 100 は含まれない） | /24 | R3 |
      | 10.1.3.9 | /8，/16，0.0.0.0/0 | /16 | R2 |
      | 10.2.0.1 | /8，0.0.0.0/0 | /8 | R1 |

      したがって R3，R2，R1 です。
    why:
      - 10.1.2.128/25 を 0〜127 の範囲と取り違えた結果です。/25 の 2 番目のブロックは 128〜255 なので、100 は含まれません。
      - 表の先頭から最初に合致した経路を選ぶ（先頭一致）と考えた結果です。ルータは記載順ではなく最長一致で選びます。
      - 3 番目で 0.0.0.0/0（デフォルト経路）を選んでいます。10.2.0.1 は 10.0.0.0/8 に合致するので、より長い接頭辞のその経路が優先されます。
      - 正解です。それぞれ /24，/16，/8 の最長一致で R3，R2，R1 になります。
    know: 最長一致が優先され、デフォルト経路（0.0.0.0/0）はどこにも合致しないときの最後の手段。/25 は 128 アドレスずつ 2 分割（0〜127，128〜255）される点を間違えやすい。
    terms: [最長一致法, ルータ]
    verify: { manual: '10.1.2.100: 100<128 なので 10.1.2.128/25 に含まれず，最長一致は 10.1.2.0/24 で R3。10.1.3.9: 10.1.2.0/24 外，10.1.0.0/16 内で R2。10.2.0.1: 10.1.0.0/16 外，10.0.0.0/8 内で R1。' }

  - id: A10-504
    topic: 10-3-1-3
    diff: 2
    q: 経路表に 192.168.4.0/24，192.168.5.0/24，192.168.6.0/24，192.168.7.0/24 の 4 経路があり，いずれも同じ次ホップへ転送する。これらを，この 4 経路のアドレス範囲だけを含む 1 本の経路に集約したものはどれか。
    c: ['192.168.4.0/23', '192.168.0.0/21', '192.168.4.0/22', '192.168.4.0/21']
    a: ウ
    scope: 'シラバス「ネットワーク層のプロトコル」の CIDR。上位ビットの共通部分から集約した接頭辞を求める計算は FE 範囲内。'
    prereq: 連続した 2 のべき乗個のブロックが，切りのよい境界から始まるときに 1 本の経路にまとめられること。
    hard: 第 3 オクテットを 2 進数で見て共通ビットを数える。境界に合わないアドレスや広すぎる経路を選びやすい。
    exp: |
      第 3 オクテットを 2 進数にすると次のとおりです。

      | 経路 | 第 3 オクテット |
      | --- | --- |
      | 192.168.4.0/24 | 0000 0100 |
      | 192.168.5.0/24 | 0000 0101 |
      | 192.168.6.0/24 | 0000 0110 |
      | 192.168.7.0/24 | 0000 0111 |

      上位 6 ビットが共通（000001）なので、共通部分は 16＋6＝22 ビットです。したがって 192.168.4.0/22（192.168.4.0〜192.168.7.255）に集約でき、ちょうど 4 経路だけを含みます。
    why:
      - /23 では 192.168.4.0〜192.168.5.255 しか含みません。6.0 と 7.0 のネットワークが漏れます。
      - 192.168.0.0/21 は 192.168.0.0〜192.168.7.255 で、0〜3 のネットワークも含んでしまいます。「4 経路だけ」の条件に反します。
      - 正解です。192.168.4.0〜192.168.7.255 のちょうど 4 ブロックです。
      - /21 の境界は 0，8，16 と 8 刻みなので 192.168.4.0/21 は正しいネットワークアドレスではありません（実際は 192.168.0.0/21）。
    know: 経路集約（ルート集約）は共通の上位ビットまでを接頭辞にする。集約できるのは境界が揃った 2 のべき乗個の連続ブロックだけで、広すぎる集約は到達性の誤りを招く。
    terms: [ルート集約, CIDR]
    verify: { manual: '4,5,6,7 の 2 進数 00000100〜00000111 は上位 6 ビット共通。16+6=22。192.168.4.0/22 は 4.0〜7.255。/23 は 4.0〜5.255，/21 は 0.0〜7.255 で一致しない。' }

  - id: A10-505
    topic: 10-1-5
    diff: 4
    q: |
      送信側が 12,500 バイトのウィンドウ分のデータを回線速度 10M ビット/秒で連続して送り終えると，ACK が届くまで（往復伝搬遅延 40 ミリ秒）待ち，ACK を受け取ってから次のウィンドウ分を送り始める。この動作を繰り返すとき，平均のデータ転送速度は何 M ビット/秒か。ここで，ACK の送信時間と処理時間は無視でき，1M ビット＝10⁶ ビットとする。
    c: ['2.5', '3.3', '10', '2']
    a: エ
    scope: 'シラバス「回線に関する計算」の転送速度と，「伝送制御」のフロー制御（ウィンドウ制御）。送信時間と待ち時間から実効速度を求める計算は FE 範囲内。'
    prereq: 送信時間＝データ量÷回線速度。ウィンドウ制御では ACK を待つ間は送信が止まること。
    hard: 1 サイクルは「送信時間＋往復遅延」であることを見抜き，単位（バイト→ビット，ミリ秒→秒）を揃えて 2 段階で計算する。
    exp: |
      1 サイクルの時間と、そのサイクルで送るデータ量から求めます。

      - ウィンドウ分のデータ量：12,500 バイト×8＝100,000 ビット
      - 送信時間：100,000 ビット÷（10×10⁶ ビット/秒）＝10 ミリ秒
      - 1 サイクル：送信 10 ミリ秒＋ACK 待ち 40 ミリ秒＝50 ミリ秒
      - 平均速度：100,000 ビット÷0.05 秒＝2,000,000 ビット/秒＝2 M ビット/秒

      送信中は ACK を待てないので、送信時間も 1 サイクルに含める点が重要です。
    why:
      - 100,000 ビット÷40 ミリ秒の値です。送信に要する 10 ミリ秒をサイクルに含めておらず、実際より速く見積もっています。
      - 往復遅延を半分（20 ミリ秒）に誤解し，送信 10＋20＝30 ミリ秒で割った値です。40 ミリ秒は往復分なので半分にしてはいけません。
      - 回線速度そのものです。ACK 待ちで送信が止まる時間があるので，回線速度いっぱいにはなりません。
      - 正解です。100,000 ビット÷50 ミリ秒＝2 M ビット/秒です。
    know: ウィンドウ制御の最大速度は「ウィンドウサイズ÷（送信時間＋往復遅延）」。ウィンドウが小さいと回線速度に届かず，回線が空く時間ができる。送信時間を含めるか否かは問題文の条件を確認する。
    terms: [ウィンドウ制御, 伝送速度, ラウンドトリップタイム]
    verify: { value: '12500*8/(12500*8/10e6 + 0.040)/1e6' }

  - id: A10-506
    topic: 10-1-5
    diff: 3
    q: |
      回線速度 1G ビット/秒，往復の遅延時間（ウィンドウ分の送信開始から ACK 受信まで）が 50 ミリ秒の通信で，受信ウィンドウが 125,000 バイトに固定されているとき，ウィンドウ制御による最大のデータ転送速度は回線速度の何％か。ここで，1G ビット＝10⁹ ビットとする。
    c: ['0.25 ％', '4 ％', '20 ％', '2 ％']
    a: エ
    scope: 'シラバス「回線に関する計算」と「伝送制御」のフロー制御。ウィンドウサイズと遅延から転送速度を求める計算は FE 範囲内。'
    prereq: ウィンドウ制御では 1 往復の間に送れるデータ量はウィンドウサイズが上限であること。
    hard: バイト→ビット，ミリ秒→秒の換算，転送速度から回線利用率への割り算と，三つの換算を誤りなく連ねる必要がある。
    exp: |
      1 往復（50 ミリ秒）に送れるデータ量はウィンドウサイズの 125,000 バイトが上限です。

      - 125,000 バイト×8＝1,000,000 ビット
      - 転送速度：1,000,000 ビット÷0.05 秒＝20,000,000 ビット/秒＝20M ビット/秒
      - 回線利用率：20M÷1,000M＝0.02＝2 ％

      回線が高速でも、遅延が大きくウィンドウが小さいと帯域をほとんど使えません。帯域を使い切るには、帯域×往復遅延（帯域遅延積）以上のウィンドウが必要です。
    why:
      - バイトをビットに換算せず（125,000÷0.05＝2.5M）に計算した結果です。ビットで考える必要があります。
      - 遅延を 25 ミリ秒（片道）として計算した値です。問題の 50 ミリ秒は往復の遅延で，そのまま使います。
      - 20M ビット/秒という速度の数値をそのまま ％ にした誤りです。回線速度 1G ビット/秒に対する比率にする必要があります。
      - 正解です。20M ビット/秒÷1G ビット/秒＝2 ％です。
    know: 帯域遅延積（帯域×往復遅延）より小さいウィンドウでは回線を使い切れない。長距離・広帯域の回線ほどウィンドウサイズが性能を左右する。
    terms: [帯域遅延積, ウィンドウ制御]
    verify: { value: '125000*8/0.05/1e9*100' }

  - id: A10-507
    topic: 10-1-5
    diff: 3
    q: |
      1,000,000 バイトのデータを，回線速度 8M ビット/秒の専用線で送る。データは 1 パケット当たり 1,000 バイトのデータ部に分割し，各パケットに 40 バイトのヘッダーを付ける。片道の伝搬遅延が 50 ミリ秒のとき，送信開始から最後のビットが受信側に届くまでの時間は何秒か。ここで，1M ビット＝10⁶ ビットとし，途中の機器による遅延は無視する。
    c: ['1.00 秒', '1.04 秒', '1.14 秒', '1.09 秒']
    a: エ
    scope: 'シラバス「回線に関する計算」の転送速度とパケット交換方式のヘッダー。ヘッダーを含めた伝送量から伝送時間を求める計算は FE 範囲内。'
    prereq: パケットにはヘッダーが付き，回線上を流れるのは「データ部＋ヘッダー」であること。伝送時間と伝搬遅延が別物であること。
    hard: パケット数の算出，ヘッダーを含む総ビット数，伝送時間と伝搬遅延の合算という三つの段階を踏む。
    exp: |
      - パケット数：1,000,000÷1,000＝1,000 個
      - 1 パケットの長さ：1,000＋40＝1,040 バイト
      - 総送信量：1,040×1,000＝1,040,000 バイト＝8,320,000 ビット
      - 送信時間：8,320,000÷8,000,000＝1.04 秒
      - 最後のビットが届く時刻：送信時間 1.04 秒＋片道の伝搬遅延 0.05 秒＝1.09 秒

      伝送時間は「送り出すのにかかる時間」，伝搬遅延は「信号が届くまでの時間」で、両方が加算されます。
    why:
      - ヘッダーも伝搬遅延も考えず，データ部だけを 8M ビット/秒で送る時間（8,000,000÷8,000,000）です。
      - ヘッダーは考慮していますが，伝搬遅延を加えていません。最後のビットが届くまでには伝搬遅延が加わります。
      - 伝搬遅延として往復分（100 ミリ秒）を足した値です。最後のビットが届くまでは片道なので 50 ミリ秒です。
      - 正解です。1.04 秒＋0.05 秒＝1.09 秒です。
    know: 伝送時間＝総ビット数÷回線速度，到達時間＝伝送時間＋伝搬遅延。ヘッダー分は実効速度を下げる要因で，パケットが小さいほど割合が大きくなる。
    terms: [伝送速度, パケット, 伝送効率]
    verify: { value: '1000000/1000*(1000+40)*8/8e6 + 0.05' }

  - id: A10-508
    topic: 10-1-4
    diff: 4
    q: |
      送信ホストと受信ホストの間に 2 台のルータがあり，3 本のリンク（それぞれ 10M ビット/秒）で接続されている。ルータはパケットを全部受信してから次のリンクへ送信する（ストアアンドフォワード）。4,500 バイトのデータを 1,500 バイトずつ 3 個のパケットに分けて連続して送るとき，最初のビットを送り始めてから 3 個目のパケットの受信が完了するまでの時間は何ミリ秒か。ここで，伝搬遅延とルータの処理時間は無視する。1M ビット＝10⁶ ビットとする。
    c: ['3.6 ミリ秒', '4.8 ミリ秒', '10.8 ミリ秒', '6.0 ミリ秒']
    a: エ
    scope: 'シラバス「交換方式」のパケット交換方式と「回線に関する計算」の転送速度。ストアアンドフォワードでの伝送時間の積み上げは，パケット交換の仕組みの理解として FE 範囲内。'
    prereq: パケット交換のルータはパケットを受信し終えてから転送すること。1 リンクの伝送時間＝パケット長÷回線速度。
    hard: パケットが各リンクで時間的に重なって流れること（パイプライン）を踏まえ，段数とパケット数から全体の時間を組み立てる。
    exp: |
      1 パケットの 1 リンクでの送信時間：1,500×8÷（10×10⁶）＝ 1.2 ミリ秒。

      パケットは 3 個、リンクは 3 本です。ルータは受信完了後に転送しますが、先行パケットが次のリンクを送っている間に後続パケットが前のリンクを送れるので、重なって進みます。

      | 時間（ミリ秒） | リンク 1 | リンク 2 | リンク 3 |
      | --- | --- | --- | --- |
      | 0〜1.2 | P1 | | |
      | 1.2〜2.4 | P2 | P1 | |
      | 2.4〜3.6 | P3 | P2 | P1 |
      | 3.6〜4.8 | | P3 | P2 |
      | 4.8〜6.0 | | | P3 |

      3 個目の受信完了は 6.0 ミリ秒で、(パケット数＋リンク数－1)×1.2＝(3＋3－1)×1.2＝6.0 とも表せます。
    why:
      - 1 個のパケットが 3 本のリンクを通る時間（3×1.2）です。パケットは 3 個あり，後続パケットの分を考えていません。
      - （3＋1）×1.2 と数えた値です。パケット数とリンク数の数え方が合わず，正しくは (3＋3－1) 段になります。
      - 3 個のパケットがそれぞれ 3 リンクを順に（重なりなしで）通ると考えた値（9×1.2）です。後続パケットは先行パケットが次のリンクにいる間に前のリンクを送れます。
      - 正解です。(3＋3－1)×1.2＝6.0 ミリ秒です。
    know: ストアアンドフォワードでは，全体の時間は「（リンク数＋パケット数－1）×1 パケットの送信時間」（同一長・同一速度のとき）。パケットに分割するとパイプライン化され，分割しない場合（3×3.6＝10.8 ミリ秒）より短くなる。
    terms: [ストアアンドフォワード方式, パケット交換]
    verify: { value: '(3+3-1)*(1500*8/10e6)*1000' }

  - id: A10-509
    topic: 10-1-5
    diff: 2
    q: 回線速度 1.5M ビット/秒の専用線で，ピーク時の 1 分間に 9M バイトのデータが流れた。この間の回線利用率は何％か。ここで，1M ビット＝10⁶ ビット，1M バイト＝10⁶ バイトとする。
    c: ['10 ％', '80 ％', '125 ％', '8 ％']
    a: イ
    scope: 'シラバス「回線に関する計算」の転送速度・回線容量。流れたデータ量から使用速度を求め，回線速度に対する割合を計算するのは FE 範囲内。'
    prereq: 利用率＝使用した速度÷回線速度。バイトとビットの換算（×8）。
    hard: バイト→ビット，分→秒の換算を経て速度を求め，さらに回線速度で割る 3 段の計算。
    exp: |
      - 1 分間のデータ量：9M バイト×8＝72M ビット
      - 平均使用速度：72M ビット÷60 秒＝1.2M ビット/秒
      - 回線利用率：1.2÷1.5＝0.8＝80 ％

      バイトをビットに換算し忘れると 9M÷60÷1.5M＝10 ％ となります。
    why:
      - バイトをビットに換算せず（9M÷60 秒＝0.15M）に比べた値です。回線速度は ビット/秒 なので ×8 が必要です。
      - 正解です。72M ビット÷60 秒＝1.2M ビット/秒で，1.2÷1.5＝80 ％です。
      - 回線速度を分子，使用速度を分母にして逆に割った値（1.5÷1.2）です。利用率は使用量を容量で割ります。
      - 桁を誤った値です。1.2÷1.5＝0.8 を 100 倍すると 80 ％で，8 ％にはなりません。
    know: 回線利用率＝使用速度÷回線速度。回線の計算ではバイト（B）とビット（bit）を取り違えやすい。通信速度は ビット/秒 で表す。
    terms: [伝送速度, 回線容量]
    verify: { value: '9e6*8/60/1.5e6*100' }

  - id: A10-510
    topic: 10-1-5
    diff: 4
    q: |
      夜間 8 時間のバックアップ時間帯に，432G バイトのデータを圧縮（データ量が半分になる）してから専用線で拠点間転送する。バックアップ中は，他の業務に影響しないよう回線利用率を 60 ％以下に抑える。この条件で転送を 8 時間以内に終えるために必要な，回線速度の最小値は何 M ビット/秒か。ここで，1G バイト＝10⁹ バイト，1M ビット＝10⁶ ビットとし，伝送効率は 100 ％とする。
    c: ['60', '120', '200', '100']
    a: エ
    scope: 'シラバス「回線に関する計算」の転送速度・回線容量と「性能管理」。データ量・時間・利用率から必要な回線速度を逆算する計算は FE 範囲内。'
    prereq: 速度＝データ量÷時間。回線利用率の上限があるとき，必要な回線速度＝必要な通信速度÷利用率上限であること。
    hard: 圧縮・単位換算・時間換算・利用率の上限という四つの条件を順に適用し，最後に回線速度へ逆算する。
    exp: |
      - 圧縮後のデータ量：432G バイト×0.5＝216G バイト
      - ビットに換算：216×10⁹×8＝1.728×10¹² ビット
      - 8 時間＝28,800 秒なので、必要な通信速度＝1.728×10¹²÷28,800＝60M ビット/秒
      - 利用率を 60 ％以下にするので、回線速度＝60÷0.6＝100M ビット/秒

      通信速度（実際に流す速度）と回線速度（容量）を区別し、利用率の上限で割って容量を求めるのがポイントです。
    why:
      - 利用率の上限 60 ％を考慮していない値です。60M ビット/秒で流すと利用率が 100 ％になってしまいます。
      - 圧縮を考慮せず 432G バイトのまま計算し，利用率も考慮しなかった値（432×8÷28,800＝120）です。
      - 圧縮を考慮せず，利用率の上限だけを適用した値（120÷0.6＝200）です。データ量が半分になる条件を使っていません。
      - 正解です。圧縮後 60M ビット/秒の通信速度が必要で，利用率 60 ％以下にするので 60÷0.6＝100M ビット/秒です。
    know: 必要な回線速度＝（データ量÷許容時間）÷利用率上限。圧縮でデータ量を減らす，利用率の上限を掛け合わせるなど条件が複数あるときは，順に適用して途中の単位を揃える。
    terms: [伝送速度, 回線容量, 回線利用率]
    verify: { value: '432e9*0.5*8/(8*3600)/0.6/1e6' }

  - id: A10-511
    topic: 11-5-3
    diff: 3
    q: |
      NAPT（IP マスカレード）機能をもつルータが，2 個のグローバル IP アドレスを使って内部の多数の端末を外部へ接続させる。変換後の送信元ポート番号には 1024〜65535 を使う。全端末が同じ外部サーバ（同一の IP アドレスとポート番号）にだけ接続するとき，同時に確立できる最大の通信（セッション）数は幾つか。ここで，1 個のグローバル IP アドレスと 1 個の変換後ポート番号の組は，同じ宛先に対して同時に 1 通信にしか使えないものとする。
    c: ['64,512', '129,024', '131,070', '131,072']
    a: イ
    scope: 'シラバス「ネットワークセキュリティ」の NAT・IP マスカレード（NAPT）と「トランスポート層のプロトコル」のポート番号。アドレスとポート番号の組で通信を識別する仕組みから数を求めるのは FE 範囲内。'
    prereq: NAPT が（グローバルアドレス，変換後ポート番号）の組で内部端末の通信を識別すること。ポート番号は 16 ビットで 0〜65535 であること。
    hard: 使えるポート番号の個数を 1024〜65535 の範囲で数え，グローバルアドレス数を掛ける。両端の数え方（＋1）と範囲の条件を誤りやすい。
    exp: |
      変換後の送信元ポート番号は 1024〜65535 で，使える個数は 65535－1024＋1＝64,512 個です。

      同一宛先に対しては、（グローバル IP アドレス，変換後ポート番号）の組ごとに 1 通信しか割り当てられません。したがって

      - 1 個のアドレスあたり 64,512 通信
      - 2 個のアドレスで 64,512×2＝129,024 通信

      が上限です。
    why:
      - グローバルアドレスが 1 個の場合の値です。2 個あるので組の数は 2 倍になります。
      - 正解です。（65,535－1,024＋1）×2＝129,024 です。
      - 2×65,535 の値です。1024 未満のポート番号を使わない条件を考慮していません。
      - 2×65,536（2¹⁶×2）の値です。ポート番号の総数を使っており，使用範囲の条件も無視しています。
    know: NAPT の同時接続数はポート番号の個数で制限される。ウェルノウンポート（0〜1023）は変換後には通常使わない。宛先が異なれば同じポート番号を再利用できるので，実際の上限は宛先の分散にも依存する。
    terms: [NAPT, ポート番号]
    verify: { value: '2*(65535-1024+1)' }

  - id: A10-512
    topic: 11-5-3
    diff: 3
    q: |
      NAPT ルータ（グローバル IP アドレス 203.0.113.5）の変換表が次のとおりである。外部のサーバ 198.51.100.7 からルータ宛てに，宛先 203.0.113.5，宛先ポート番号 40003 のパケットが届いた。ルータが内部へ転送するときの宛先はどれか。

      | 内部のアドレスとポート番号 | 変換後のポート番号 |
      | --- | --- |
      | 192.168.1.10:50000 | 40001 |
      | 192.168.1.11:50000 | 40002 |
      | 192.168.1.12:50000 | 40003 |
      | 192.168.1.10:50001 | 40004 |
    c:
      - '192.168.1.10:50000'
      - '192.168.1.12:40003'
      - '192.168.1.12:50000'
      - '破棄する。外部から届いたパケットは NAPT ルータで常に遮断される。'
    a: ウ
    scope: 'シラバス「ネットワークセキュリティ」の NAT・IP マスカレード（NAPT）。変換表で外部からの返信を内部へ戻す仕組みは FE 範囲内。'
    prereq: NAPT が内部のアドレスとポート番号を，ルータのグローバルアドレスと別のポート番号に変換して通信し，返信を変換表で戻すこと。
    hard: 内部ポート番号が同じ行が複数あるため，変換後ポート番号（外部から見えるポート）で引く必要がある。
    exp: |
      外部から見える宛先は「203.0.113.5:40003」です。NAPT ルータは変換後のポート番号 40003 で変換表を引き、対応する内部のアドレスとポート番号に宛先を書き換えて転送します。

      | 受信した宛先 | 変換表の該当行 | 転送時の宛先 |
      | --- | --- | --- |
      | 203.0.113.5:40003 | 192.168.1.12:50000 ↔ 40003 | 192.168.1.12:50000 |

      内部ポート番号 50000 は 3 台の端末が使っているので、これだけでは端末を区別できません。外部から見えるポート番号（変換後）が端末を一意に決めます。
    why:
      - 内部ポート番号 50000 だけを見て先頭の行を選んだ誤りです。50000 は複数の端末で使われており，引くべきキーは変換後のポート番号です。
      - 端末は正しいが，ポート番号が変換後の値（40003）のままです。内部に転送するときはポート番号も内部側の 50000 に戻します。
      - 正解です。変換後ポート番号 40003 の行から，内部の 192.168.1.12:50000 に宛先を書き換えます。
      - 外部からのパケットが常に遮断されるわけではありません。内部から開始した通信の返信は，変換表に対応があれば内部へ転送されます（対応がないパケットは破棄されます）。
    know: NAPT の変換表は（内部アドレス，内部ポート）と（グローバルアドレス，変換後ポート）の対応で，返信の宛先は変換後ポートで引く。変換表にない外部からの接続は，ポート転送などを設定しない限り内部へ届かない。
    terms: [NAPT, ポート番号]
    verify: { manual: '宛先ポート 40003 は変換表の第 3 行（192.168.1.12:50000）に対応する。他の行の変換後ポートは 40001，40002，40004 で一致しない。' }

  - id: A10-513
    topic: 10-3-1-3
    diff: 2
    q: IPv6 アドレス 2001:0db8:0000:0000:0000:0a00:0000:0001 と同じアドレスを表す，正しい省略表記はどれか。
    c:
      - '2001:db8::a:0:1'
      - '2001:db8::a00::1'
      - '2001:db8::a00:1'
      - '2001:db8::a00:0:1'
    a: エ
    scope: 'シラバス「ネットワーク層のプロトコル」の IPv6。128 ビットを 16 ビットずつ 8 組に区切る表記と，連続する 0 の組を 1 回だけ「::」に省略できる規則は FE 範囲内。'
    prereq: IPv6 アドレスが 16 ビットの 8 組で，各組の先頭の 0 を省略でき，連続する 0 の組は 1 回だけ「::」にできること。
    hard: 省略表記を元の 8 組に展開して一致を確かめる。0 の組の数を数え違えやすく，「0a00」の先頭の 0 だけを省略できる点も落とし穴になる。
    exp: |
      元のアドレスを 8 組に分けると次のとおりです。

      | 組 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | 値 | 2001 | 0db8 | 0000 | 0000 | 0000 | 0a00 | 0000 | 0001 |

      各組の先頭の 0 を省略すると 2001:db8:0:0:0:a00:0:1 です。連続する 0 の組（第 3〜5 組）を「::」にすると 2001:db8::a00:0:1 になります。展開すると 2＋3＋3＝8 組になり元に一致します。
    why:
      - 0a00 を「a」と省略しています。省略できるのは先頭の 0 だけなので，「a00」の末尾の 0 は消せず別の値になります。
      - 「::」を 2 回使っています。「::」は何組を省略したのか決まらなくなるので，1 つのアドレスに 1 回しか使えません。
      - 展開すると 2001:db8:0:0:0:0:a00:1 になり（0 の組が 4 個），元のアドレスと異なります。第 7 組の 0 を落としています。
      - 正解です。展開すると 2001:db8:0:0:0:a00:0:1 になり，元のアドレスと一致します。
    know: IPv6 の「::」はアドレス内に 1 回だけ使える。展開して 8 組になるか数えて確認する。省略できるのは各組の先頭の 0 で，組の途中や末尾の 0 は省略できない。
    terms: [IPv6]
    verify: { manual: '2001:db8::a00:0:1 を展開すると 2001,db8,[0,0,0],a00,0,1 の 8 組で元と一致。2001:db8::a:0:1 は a が a00 と別値。a00::1 は :: が 2 回。2001:db8::a00:1 は 2001,db8,[0 が 4 組],a00,1 となり第 7 組が 0 でなく a00 の位置もずれて不一致。' }
