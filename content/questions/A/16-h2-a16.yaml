category: '16'
batch: H2
reviewed:
  at: '2026-10-30'
  method: 独立レビュー担当が解答を伏せて解き直し、監査概念の正確さと誤答の検証、既存問題との重複確認を実施。A16-505 の解説の表現を正確な言い回しに調整済み
questions:
  - id: A16-501
    topic: 16-1-5
    diff: 3
    scope: 16-1-5 システム監査の実施。具体的な監査手続の組合せから、監査証拠としての信頼性が高いものを判断する問題であり、範囲内。
    prereq: 監査証拠は、監査人自身が入手したものや自動的に記録されたもののほうが、被監査部門の説明よりも信頼性が高いこと
    hard: 口頭の説明、被監査側が用意した資料、監査人自身の再実施という3種類の証拠を、入手経路の観点から信頼性の順に評価する必要がある。
    q: |
      システム監査人が、「本番データへの更新は、承認された場合だけ行われる」という統制の運用状況を確かめようとしている。次の手続のうち、監査証拠として最も信頼性が高いものはどれか。
    c:
      - 監査人自身が、更新ログの全件を承認記録と突合し、承認のない更新がないことを再実施によって確かめる
      - 承認の手続を定めた規程文書を閲覧し、手続が整備されていることを確認する
      - 運用担当者に、承認のない更新は行っていないことを口頭で確認する
      - 被監査部門が作成した「承認済み一覧」と銘打った集計表を受け取り、内容をそのまま採用する
    a: ア
    exp: |
      監査証拠の信頼性は、入手の経路で大きく変わります。一般に、監査人が自ら実施して得た証拠は、被監査側から提供された説明や資料より信頼性が高く、また、人の手を介さず自動的に記録されたログは、後から作成された集計資料より改変の余地が小さいとされます。本問では、更新ログの全件と承認記録を監査人自身が突合する再実施が最も信頼性が高くなります。口頭確認は裏付けがなく、規程の閲覧は「手続の整備」は分かっても「実際の運用」は確かめられません。
    why:
      - 正解です。監査人自身が全件のログと承認記録を突合する再実施は、運用状況を直接確かめる、最も信頼性の高い証拠です。
      - 規程の閲覧で分かるのは統制の設計（整備状況）までで、実際にそのとおり運用されたかは確かめられません。
      - 口頭の説明は、裏付けのない言明であり、証拠としての信頼性は最も低い部類です。
      - 被監査部門が作成した資料は、作成過程に被監査側の取捨選択が入り得るため、元のログそのものより信頼性が落ちます。
    know: 監査証拠の信頼性は「監査人自身が入手 ＞ 外部の情報源 ＞ 被監査側の資料 ＞ 口頭の説明」のように、入手経路と改変の余地で評価する。設計の確認と運用の確認は別の手続である。
    terms:
      - 監査証拠
      - システム監査
    verify:
      manual: 4つの手続を証拠の入手経路（監査人自身の再実施、自動記録の原資料、被監査側作成資料、口頭説明、規程）で比較し、再実施が最も信頼性が高いことを確認した。
  - id: A16-502
    topic: 16-1-6
    diff: 3
    scope: 16-1-6 システム監査のフォローアップ。改善の実施を被監査部門の申告だけで完了とせず、証拠によって確認すべきことを判断する問題であり、範囲内。
    prereq: フォローアップは、監査で指摘した事項の改善が実際に行われたかを、監査人が確認する活動であること
    hard: 「実施した」という回答をもって完了とする運用の誤りを指摘し、改善の証跡の確認と、未実施の場合の再勧告や報告までが監査側の役割であることを判断する必要がある。
    q: |
      システム監査で「特権IDの使用記録が定期的にレビューされていない」と指摘し、被監査部門は改善計画を提出した。半年後のフォローアップにおける監査人の対応として、最も適切なものはどれか。
    c:
      - 改善計画が提出された時点で指摘事項は完了したものとして扱い、フォローアップは行わない
      - 改善の実施は被監査部門の責任であり、監査人は実施状況を確認しない
      - 被監査部門の責任者から「改善を実施した」との回答を得たので、それをもって指摘事項を完了とする
      - 被監査部門から提出されたレビューの実施記録を確認し、指摘どおりに定期レビューが行われるようになったかを検証する
    a: エ
    exp: |
      フォローアップは、指摘事項に対する改善が計画どおり実施され、問題が解消したかを監査人が確認する活動です。確認は、実施したという申告ではなく、レビューの実施記録のような証跡によって行います。改善が不十分であれば、その旨を報告し、再び改善を求めます。「改善を実施する責任」は被監査部門にありますが、「改善されたことを確かめる責任」は監査人側にあります。この2つを取り違えると、指摘が形骸化します。
    why:
      - 計画の提出は改善の開始点であり、実施の完了ではありません。フォローアップは実施後に行います。
      - 実施状況の確認はフォローアップそのものであり、監査人の役割です。確認しないことは職務の放棄になります。
      - 申告だけでは、実際にレビューが行われたかどうかは分かりません。証拠による確認が必要です。
      - 正解です。実施記録という証跡で改善の実施を検証するのが、フォローアップにおける監査人の対応です。
    know: 監査の流れは「指摘 → 改善計画 → 実施 → フォローアップ（証跡で確認）」であり、最後の確認を欠くと監査の実効性が失われる。改善の実施責任と確認責任の所在の区別が要点である。
    terms:
      - フォローアップ
      - システム監査
    verify:
      manual: フォローアップの定義（改善実施を証跡で確認する活動）を事例に当てはめ、申告のみで完了とする、確認しない、計画提出で完了とする各選択肢が定義に反することを確認した。
  - id: A16-503
    topic: 16-2-1
    diff: 4
    scope: 16-2-1 内部統制の評価。価格マスタの変更に関する統制の不備を事例から読み取り、補完する統制の有無まで含めて重大性を判断する問題であり、範囲内。
    prereq: 業務処理統制における承認と記録（証跡）の役割、不備があっても他の統制で補完されれば影響が抑えられる場合があること
    hard: 「承認なしに変更できる」という設定の不備と、「変更ログが残らない」という証跡の欠落が重なり、事後の検証による補完も利かない状態であることを読み取る必要がある。
    q: |
      販売システムの価格マスタについて、次の状況が確認された。

      - 営業部の担当者は、上長の承認なしに価格を変更でき、そのまま受注処理に反映される。
      - 価格の変更履歴（いつ、誰が、いくらに変更したか）はシステムに記録されない。
      - 売上データと価格マスタを後日突合するような、他の確認手続も設けられていない。

      内部統制の評価として、最も適切なものはどれか。
    c:
      - 承認手続がないことは問題だが、変更履歴さえ残れば、統制は十分に機能しているといえる
      - 変更履歴は残らないが、担当者を信頼して運用しているので、統制上の問題はない
      - 価格マスタの変更は日常的で件数が多いため、統制の対象から外してよい
      - 不正や誤りによる価格の改変が、事前に防げず、事後にも発見できない状態であり、重要な不備として指摘すべきである
    a: エ
    exp: |
      統制は、誤りや不正を「事前に防ぐ」ものと「事後に発見する」ものの組合せで評価します。本件では、承認がないため事前の歯止めがなく、変更履歴も残らず、他の突合手続もないため、事後の発見もできません。改変された価格はそのまま受注と売上に反映されるため、影響も直接的です。予防と発見の両方が欠けた状態は、重要な不備として指摘すべきものです。「担当者への信頼」は統制にはならず、件数が多いことは対象外の理由にはなりません（むしろ統制の必要性が高まります）。
    why:
      - 変更履歴が残っても、不正な変更そのものは防げません。発見型の統制だけでは、承認による予防が欠けたままです。
      - 特定の担当者への信頼は、統制の代替にはなりません。担当者が変わっても機能する仕組みが必要です。
      - 件数が多い業務ほど、1件あたりの影響は小さくても全体のリスクは大きくなります。対象外にする理由にはなりません。
      - 正解です。予防（承認）と発見（履歴・突合）の両方が欠けており、重要な不備に当たります。
    know: 統制の不備の重大性は、「予防的統制と発見的統制のどちらが残っているか」で判断する。両方が欠け、他の統制による補完もない場合に、重要な不備となりやすい。
    terms:
      - 内部統制
      - 業務処理統制
    verify:
      manual: 事例の3条件（承認なし、変更履歴なし、代替の確認手続なし）を予防的統制と発見的統制の枠組みに当てはめ、両方が欠落していることを確認した。
  - id: A16-504
    topic: 16-1-9
    diff: 3
    scope: 16-1-9 システム監査人の独立性。監査人自身が関与したシステムの監査を担当する自己レビューの問題を、事例から判断する問題であり、範囲内。
    prereq: 監査人は、監査対象から精神的にも外観上も独立していなければならず、自分が設計・開発したシステムの監査は独立性を損なうこと
    hard: 利害関係の有無だけでなく、「自分の仕事を自分で評価する」構造そのものが独立性を損なうことを、他の属性（経験の豊富さなど）と切り分けて判断する必要がある。
    q: |
      A社の情報システム部門に所属する監査人Bは、2年前まで販売システムの開発チームに所属し、その設計を担当していた。今回、この販売システムのシステム監査が計画され、Bが監査チームのリーダーに任命されようとしている。この任命について、最も適切なものはどれか。
    c:
      - Bはシステムの内容をよく知っているため、監査の効率の観点から、リーダーに適任である
      - Bは自分が設計したシステムを自ら評価することになり、独立性が損なわれるため、監査チームから外すべきである
      - Bが監査報告書に「元開発担当者である」と明記すれば、独立性の問題は解消される
      - 開発部門を離れて2年が経過しているため、独立性の問題は生じない
    a: イ
    exp: |
      システム監査人には、監査対象に対する独立性（精神的独立性と外観的独立性）が求められます。自分が設計したシステムを自分で監査するのは「自己レビュー」に当たり、不備があっても見逃したり、評価が甘くなったりするおそれがあり、外から見ても公正さに疑いが生じます。システムに詳しいことは、監査を助ける理由にはなっても、独立性の欠落を補う理由にはなりません。時間の経過や経歴の明記でも、自己レビューという構造自体は変わりません。Bには、助言的な立場で関わるか、別のシステムの監査を担当させるのが適切です。
    why:
      - 知識や効率は任命の利点ですが、独立性は監査の前提条件であり、効率と引き換えにはできません。
      - 正解です。自分が設計したシステムの監査は自己レビューとなり、独立性を損なうため、担当から外すべきです。
      - 経歴の開示は透明性の確保にはなりますが、自己レビューの構造を解消するものではありません。
      - 離れてからの期間ではなく、「自分が作ったものを自分で評価する」という関係自体が問題です。
    know: 独立性には、実際に公正であること（精神的独立性）と、第三者から見て公正に見えること（外観的独立性）の両面がある。自己レビューは、利害関係と並ぶ独立性の典型的な阻害要因である。
    terms:
      - 独立性
      - システム監査
    verify:
      manual: 事例の関係（元設計者が自システムの監査リーダー）を自己レビューの定義に当てはめ、知識・期間・開示では解消しないことを確認した。
  - id: A16-505
    topic: 16-1-2-2
    diff: 3
    scope: 16-1-2-2 システム監査のリスクアプローチ。取扱金額、障害の履歴、統制の成熟度といった情報から、監査資源を優先的に配分すべき対象を選ぶ問題であり、範囲内。
    prereq: リスクアプローチでは、問題が起きる可能性と、起きた場合の影響の大きさから、監査の重点を決めること
    hard: 金額の大きさだけでなく、統制が未整備で障害も繰り返しているという「起きやすさ」の情報と組み合わせて、総合的なリスクを判断する必要がある。
    q: |
      システム監査の年間計画で、次の3つのシステムから、今年度に優先して監査すべき対象を1つ選ぶことになった。リスクアプローチの考え方から、最も優先すべきものはどれか。

      - 甲： 基幹会計システム。取扱金額は最大だが、統制は整備され運用も安定し、過去の監査で指摘はない。
      - 乙： 新しく導入した販売システム。取扱金額は中程度だが、権限管理のルールが未整備で、導入後にアクセス権の誤りによる障害が複数回発生している。
      - 丙： 社内ポータル。取扱う情報の重要性は低く、障害の影響も限定的である。
    c:
      - 甲
      - 3つとも同程度のリスクであり、順序は付けられない
      - 丙
      - 乙
    a: エ
    exp: |
      リスクアプローチでは、「影響の大きさ」だけでなく「問題が起きる可能性」も含めてリスクを評価し、高い対象から監査資源を配分します。甲は金額の影響は大きいものの、統制が整備され安定しており、問題が起きる可能性は低いと評価できます。乙は金額は中程度ですが、権限管理が未整備で、実際にアクセス権の誤りによる障害が繰り返されており、発生の可能性が高く影響も無視できないため、総合的なリスクが最も高い状態です。丙は影響自体が小さいため優先度は下がります。したがって、優先すべきは乙です。
    why:
      - 甲は取扱金額こそ最大ですが、統制が機能し安定しているため、現時点のリスクは乙より低いと評価できます。
      - 与えられた情報（統制の整備状況や障害履歴）から、リスクには明確な差が付けられます。
      - 丙は影響の範囲も重要性も小さく、優先順位は最も低くなります。
      - 正解です。統制の未整備と障害の繰り返しにより、問題発生の可能性が高く、リスクが最も大きいのは乙です。
    know: リスクは「影響の大きさ × 起きる可能性」で評価する。金額が大きいだけの対象より、統制が弱く実際に問題が起きている対象のほうを優先するのが、リスクアプローチに基づく計画である。
    terms:
      - リスクアプローチ
      - システム監査
    verify:
      manual: 3つのシステムを影響の大きさと発生可能性（統制の整備状況、障害履歴）で評価し、乙が両面で最もリスクが高いことを確認した。
  - id: A16-506
    topic: 16-1-5
    diff: 2
    scope: 16-1-5 システム監査技法。大量の取引データから条件に合うものを全件抽出する場面で、CAAT（コンピュータ支援監査技法）の活用が適切だと判断する問題であり、範囲内。
    prereq: CAAT は、監査ソフトウェアなどを用いて、被監査側のデータを監査人自身が分析・抽出する技法であること
    q: |
      システム監査人が、1年間で約100万件ある支払取引の中から、「同一請求先への同額の支払が同日に複数回行われている取引（二重支払の疑い）」を全て洗い出したいと考えている。監査技法として、最も適切なものはどれか。
    c:
      - 支払手続の規程を閲覧し、二重支払を禁止する定めがあることを確認する
      - 経理担当者に、二重支払がないことを口頭で確認する
      - 取引の中から任意の30件をサンプルとして抽出し、目視で確認する
      - 監査ソフトウェアを用いて全件のデータを条件で抽出・分析する（CAAT を活用する）
    a: エ
    exp: |
      100万件ものデータから特定の条件に合う取引を「全て」洗い出す作業は、人の目では現実的に不可能であり、監査ソフトウェアでデータを抽出・分析する CAAT（コンピュータ支援監査技法）が適しています。全件を対象に条件抽出ができるため、見落としのリスクも下げられます。サンプリングは一部の確認には有効ですが、「疑いのある取引を全て洗い出す」という目的には合いません。口頭確認や規程の閲覧は、実際に行われた取引の検証にはなりません。
    why:
      - 規程の確認は手続の整備状況を見るもので、実際の運用結果（二重支払の有無）は分かりません。
      - 口頭の確認は証拠としての信頼性が低く、100万件の実在の取引を確かめたことにはなりません。
      - サンプリングでは、サンプル外の二重支払を見落とします。全件の洗い出しという目的に合いません。
      - 正解です。大量データの全件条件抽出は、CAAT の代表的な活用場面です。
    know: CAAT は、監査人自身が監査ソフトウェアで被監査側のデータを読み取り、抽出・集計・突合を行う技法である。データ量が大きい監査では、全件分析によってサンプリングの限界を補える。
    terms:
      - CAAT
      - システム監査
    verify:
      manual: 目的（100万件からの条件該当の全件抽出）に対して、各技法の能力を照合し、全件分析が可能な CAAT だけが目的に合致することを確認した。
