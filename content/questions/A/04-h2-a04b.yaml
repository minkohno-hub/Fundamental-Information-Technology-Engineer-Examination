questions:
  - id: A04-509
    topic: 4-2-2-2
    diff: 3
    scope: 4-2-2-2 システムの信頼性評価。MTBF と MTTR の改善が稼働率に与える影響を比較し、どちらの改善が効くかを計算で判断する問題であり、範囲内。
    prereq: 稼働率 ＝ MTBF ÷ （MTBF ＋ MTTR）という関係と、故障間隔と復旧時間の意味
    hard: MTBF を 2 倍にする案と MTTR を 4 分の 1 にする案の両方を計算し、直感に反して復旧時間の短縮のほうが効くことを確かめる必要がある。
    q: |
      あるシステムの MTBF は 400 時間、MTTR は 4 時間である。稼働率を改善するため、案1「MTBF を 2 倍の 800 時間にする」と、案2「MTTR を 4 分の 1 の 1 時間にする」を比較した。改善後の稼働率が高い案と、その稼働率の組合せはどれか。
    c:
      - 案1が約 99.50％
      - 案2が約 99.75％
      - 案2が約 99.50％
      - 案1が約 99.75％
    a: イ
    exp: |
      稼働率 ＝ MTBF ÷（MTBF ＋ MTTR）で計算します。現行は 400 ÷ 404 ≒ 99.01％ です。
      - 案1（MTBF 800 時間）： 800 ÷ 804 ≒ 99.50％
      - 案2（MTTR 1 時間）： 400 ÷ 401 ≒ 99.75％
      したがって案2のほうが高い稼働率になります。稼働率の式で効くのは MTBF と MTTR の比であり、もともと小さい MTTR をさらに縮めるほうが、比の改善幅が大きくなります。
    why:
      - 案1の値としては正しい計算ですが、案2のほうが高いため、組合せとして正しくありません。
      - 正解です。案2では 400 ÷ 401 ≒ 99.75％ となり、案1を上回ります。
      - 99.50％ は案1の値です。案2（400 ÷ 401）は約 99.75％ です。
      - 99.75％ は案2の値です。案1（800 ÷ 804）は約 99.50％ です。
    know: 稼働率は MTBF と MTTR の比で決まるため、改善の効果は「何時間を何倍・何分の1にするか」ではなく、比がどう変わるかで評価する。復旧時間を短縮する運用改善（手順の整備、予備部品の確保など）が大きく効く場合がある。
    terms:
      - MTBF
      - MTTR
      - 稼働率
    verify:
      manual: 現行 400 ÷ 404 ≒ 99.01％、案1（MTBF 800 時間）は 800 ÷ 804 ≒ 99.50％、案2（MTTR 1 時間）は 400 ÷ 401 ≒ 99.75％ と再計算し、案2が最も高くなることを確認した。
  - id: A04-510
    topic: 4-2-2-1
    diff: 2
    scope: 4-2-2-1 信頼性の基礎。故障率の時間変化（バスタブ曲線）のうち、摩耗故障期の特徴と、それに合った保守方式を判断する問題であり、範囲内。
    prereq: バスタブ曲線の3つの期間（初期故障期、偶発故障期、摩耗故障期）で故障率の傾向が異なること
    q: |
      長年稼働している装置で、経年劣化による故障が年々増えている。この装置の保守方式として、最も適切なものはどれか。
    c:
      - 故障が起きてから修理する事後保全に徹し、事前の交換は行わない
      - 劣化の兆候を監視し、故障が起きる前に部品を交換する予防保全を行う
      - 装置の使用を止めて新品に交換するまで、保全は行わない
      - 故障率が下がる初期故障期に入っていると考え、監視を緩める
    a: イ
    exp: |
      故障率の時間変化を描いたバスタブ曲線では、使用開始直後の初期故障期、故障率がほぼ一定の偶発故障期を経て、最後は経年劣化で故障率が上昇する摩耗故障期に入ります。経年劣化による故障が増えている本件は摩耗故障期に当たり、故障してから直す事後保全では停止が繰り返されるため、劣化の兆候を捉えて故障前に交換・整備する予防保全（状態監視保全や定期保全）が適切です。
    why:
      - 事後保全は、故障の影響が小さい機器には使えますが、劣化で故障が増える装置では停止が頻発します。
      - 正解です。摩耗故障期では、故障前の交換や整備によって故障率の上昇を抑える予防保全が適切です。
      - 交換までの間も保全は必要です。何もしないことは選択肢になりません。
      - 故障が増えている状況は、故障率が低下する初期故障期とは逆の傾向です。監視を緩める根拠にはなりません。
    know: バスタブ曲線の期間ごとに適した保全は異なる。初期故障期は burn-in や初期不良の除去、偶発故障期は事後保全でも成り立つ場合があり、摩耗故障期は予防保全で故障前の手当てを行う。
    terms:
      - バスタブ曲線
      - 予防保全
    verify:
      manual: 装置の状態（経年劣化で故障が増加）をバスタブ曲線の摩耗故障期に位置付け、期間ごとの適切な保全方式（予防保全）と照合した。
  - id: A04-511
    topic: 4-1-6
    diff: 3
    scope: 4-1-6 RAID の構成。RAID10 について、実効容量と、データを失わずに耐えられるディスク故障の組合せを判断する問題であり、範囲内。
    prereq: RAID10 はミラー（RAID1）の組をストライピング（RAID0）する構成であり、容量は全体の半分になること
    hard: 容量の計算に加えて、故障に耐えられるかどうかが「同じミラー組の 2 台目かどうか」で決まる点まで含めて判断する必要がある。
    q: |
      2 T バイトのディスク 8 台で RAID10 を構成する。この構成の実効容量と、データを失わないディスク故障の組合せとして、適切なものはどれか。ここで、ミラー組は （1,2）、（3,4）、（5,6）、（7,8） の 4 組とする。
    c:
      - 実効容量は 8 T バイト。ディスク 1 と 3 の同時故障には耐えられるが、ディスク 1 と 2 の同時故障ではデータを失う
      - 実効容量は 8 T バイト。どの 2 台の同時故障にも耐えられる
      - 実効容量は 14 T バイト。ディスク 1 と 2 の同時故障には耐えられる
      - 実効容量は 16 T バイト。どの 2 台の同時故障にも耐えられる
    a: ア
    exp: |
      RAID10 は、2 台をミラーにした組を 4 組作り、その組同士をストライピングします。データは常に 2 台に複製されるため、実効容量は全体 16 T バイトの半分の 8 T バイトです。故障への耐性は「ミラー組の片方まで」であり、別の組同士（1 と 3）の故障なら、各組にもう片方が残るためデータを失いません。しかし同じ組（1 と 2）の両方が故障すると、その組のデータは失われます。
    why:
      - 正解です。容量は半分の 8 T バイトで、耐えられるのは別のミラー組同士の故障までです。
      - 容量の計算は合っていますが、同じミラー組の両方の故障には耐えられないため、後段が誤りです。
      - 14 T バイトは RAID5 のような計算（全体から 1 台分を引く）であり、RAID10 の容量ではありません。
      - 容量はミラーの分だけ半分になります。また、同じミラー組の 2 台の故障には耐えられません。
    know: RAID10 の耐障害性は「各ミラー組につき 1 台まで」。組をまたぐ複数台の故障には耐えられる場合があるが、同じ組の 2 台目でデータを失う。容量効率は常に 50％ である。
    terms:
      - RAID10
      - RAID
    verify:
      manual: 容量（2 T バイト × 8 台 ÷ 2 ＝ 8 T バイト）と、ミラー組の内外による故障耐性（組をまたぐ 1 と 3 は可、同じ組の 1 と 2 は不可）を構成の定義から確認した。
  - id: A04-512
    topic: 4-2-1-1
    diff: 4
    scope: 4-2-1-1 システムの負荷設計。処理能力と目標使用率から必要台数を求め、さらに障害時の冗長分（N＋1）を加える台数設計の計算であり、範囲内。
    prereq: 必要台数は、ピークの処理量を 1 台当たりの有効な処理能力（上限 × 目標使用率）で割って切り上げること
    hard: 定格の処理能力ではなく目標使用率で割った有効能力を使う段階と、求めた台数に冗長分を 1 台加える段階の、2 段階の判断が必要になる。
    q: |
      Web サーバ 1 台の処理能力は 200 リクエスト/秒である。ピーク時の処理量は 900 リクエスト/秒で、各サーバの使用率は 75％ 以下に抑えるものとする。さらに、1 台が故障しても処理を継続できるよう冗長構成にするとき、必要なサーバ台数は何台か。
    c:
      - '7'
      - '5'
      - '9'
      - '6'
    a: ア
    exp: |
      まず通常時に必要な台数を求めます。使用率 75％ 以下という条件から、1 台が担えるのは 200 × 0.75 ＝ 150 リクエスト/秒までです。
      - 必要台数 ＝ 900 ÷ 150 ＝ 6 台（ちょうど割り切れます）
      - 冗長分として、1 台の故障に備えて 1 台を加えます。
      したがって 6 ＋ 1 ＝ 7 台です。故障時には残り 6 台で 900 リクエスト/秒を処理し、使用率はちょうど 75％ になります。
    why:
      - 正解です。有効能力 150 リクエスト/秒で 6 台が必要であり、冗長分 1 台を加えた 7 台です。
      - 定格能力だけで割った値（900 ÷ 200 ＝ 4.5 を切り上げて 5）です。使用率の上限を考慮していません。
      - 使用率を 50％ として計算した場合の値（200 × 0.5 ＝ 100 リクエスト/秒、900 ÷ 100 ＝ 9）です。条件は 75％ です。
      - 使用率の上限までは考慮していますが、故障時の冗長分が入っていません。この台数では 1 台の故障で処理量をさばけなくなります。
    know: 台数設計は「ピーク処理量 ÷（1 台の能力 × 目標使用率）」で必要台数を求め、可用性の要件に応じて冗長分（N＋1）を加える。使用率に上限を設けるのは、待ち行列の応答時間が使用率の上昇で急激に悪化するためである。
    terms:
      - 負荷分散
      - スループット
    verify:
      value: Math.ceil(900 / (200 * 0.75)) + 1
  - id: A04-513
    topic: 1-2-6
    diff: 3
    scope: 1-2-6 待ち行列モデル。M/M/1 について、使用率から平均系内（システム内）件数を求める問題であり、範囲内。
    prereq: 使用率 ρ ＝ 平均到着率 ÷ 平均サービス率、M/M/1 の平均系内件数 ＝ ρ ÷ （1 − ρ）という関係
    hard: 平均サービス時間からサービス率への換算（単位の統一）を行い、使用率を経由して系内件数を求める、2 段階の計算が必要になる。
    q: |
      ある窓口では、客は 1 時間に平均 45 人到着し、1 人の処理には平均 1 分かかる。到着と処理が M/M/1 モデルに従うとき、窓口にいる客の平均人数（処理中の客も含む）は何人か。
    c:
      - '3'
      - '1.33'
      - '4'
      - '0.75'
    a: ア
    exp: |
      まず単位をそろえます。到着率は 45 人/時、サービス率は 1 人 1 分なので 60 人/時です。
      - 使用率 ρ ＝ 45 ÷ 60 ＝ 0.75
      - M/M/1 の平均系内件数 ＝ ρ ÷ （1 − ρ） ＝ 0.75 ÷ 0.25 ＝ 3 人
      使用率が 1 に近づくと分母が小さくなり、系内件数は急激に増えます。この窓口は使用率 0.75 で、平均 3 人が滞留する状態です。
    why:
      - 正解です。ρ ＝ 0.75 を ρ ÷（1 − ρ）に当てはめて 3 人です。
      - 1 ÷ ρ の値です。平均サービス時間と到着間隔の比にすぎず、系内件数ではありません。
      - 1 ÷ （1 − ρ） ＝ 4 と、分子の ρ を掛け忘れた値です。正しくは ρ ÷ （1 − ρ） で 3 人です。
      - 使用率 ρ そのものの値です。系内件数は ρ からさらに計算します。
    know: M/M/1 の平均系内件数は ρ ÷（1 − ρ)、平均待ち件数は ρ の 2 乗 ÷（1 − ρ)。使用率が 0.9 を超えると件数が跳ね上がるため、窓口やサーバの設計では使用率に余裕を持たせる。
    terms:
      - 待ち行列理論
      - リトルの法則
    verify:
      value: (45 / 60) / (1 - 45 / 60)
  - id: A04-514
    topic: 4-2-3
    diff: 3
    scope: 4-2-3 バックアップと復旧。データ量とリストアの転送速度から復旧所要時間を見積もる計算であり、範囲内。
    prereq: 所要時間 ＝ データ量 ÷ 転送速度 という見積りと、単位（T バイト、M バイト、秒、時間）の換算
    hard: T バイトから M バイトへの換算と、秒から時間への換算を正しく行う必要がある。
    q: |
      障害に備え、データセンタに保管したバックアップから本番環境へデータをリストアする。データ量は 4 T バイト、リストアの転送速度は 200 M バイト/秒である。リストアに要する時間はおよそ何時間か。ここで、1 T バイト ＝ 1,000,000 M バイトとし、転送以外の作業時間は含めないものとする。
    c:
      - 約 0.56 時間
      - 約 20 時間
      - 約 5.6 時間
      - 約 2.8 時間
    a: ウ
    exp: |
      所要時間 ＝ データ量 ÷ 転送速度 で見積もります。データ量は 4 T バイト ＝ 4,000,000 M バイトです。
      - 4,000,000 ÷ 200 ＝ 20,000 秒
      - 20,000 秒 ÷ 3,600 ＝ 約 5.6 時間
      したがってリストアには約 5.6 時間かかります。目標復旧時間が 4 時間のシステムでは、この方式のままでは目標を満たせないことになります。
    why:
      - 桁を 1 つ落とした値です。4 T バイトは 4,000,000 M バイトであり、400,000 M バイトではありません。
      - 20,000 秒を 3,600 ではなく 1,000 で割るなど、秒から時間への換算を誤った値です。時間にするには 3,600 で割ります。
      - 正解です。4,000,000 M バイト ÷ 200 M バイト/秒 ＝ 20,000 秒 ≒ 5.6 時間です。
      - 転送速度を 400 M バイト/秒と読み違えた場合の値です。問題文の速度は 200 M バイト/秒です。
    know: 復旧時間の見積りでは、バックアップの取得時間だけでなく、リストアの転送時間が目標復旧時間（RTO）に収まるかが重要になる。データ量の増加に対して転送速度が追いつかないと、RTO を満たせなくなる。
    terms:
      - バックアップ
      - RTO
    verify:
      value: 4 * 1000000 / 200 / 3600
      tolerance: 0.1
  - id: A04-515
    topic: 4-2-2-2
    diff: 4
    scope: 4-2-2-2 直列システムの信頼性改善。最も弱い要素を二重化（並列化）したときの全体の稼働率の変化を計算する問題であり、範囲内。
    prereq: 直列システムの稼働率は各要素の積、並列化した要素の稼働率は 1 − （1 − 稼働率）の 2 乗で求めること
    hard: 改善対象の要素だけを並列の式で置き換えてから直列の積を取る必要があり、単に要素の値を置き換える誤りや、全体を二重化する誤りと区別する。
    q: |
      稼働率 0.99、0.98、0.995 の 3 つの要素を直列に接続したシステムがある。最も弱い稼働率 0.98 の要素を二重化（同じ要素を並列に 2 つ用意し、どちらか一方が動けばよい構成）したとき、システム全体の稼働率はおよそ何％になるか。
    c:
      - 97.52％
      - 99.95％
      - 98.47％
      - 96.53％
    a: ウ
    exp: |
      まず現行の全体は 0.99 × 0.98 × 0.995 ≒ 0.9653、つまり 96.53％ です。二重化した要素の稼働率は、並列の式 1 − （1 − 0.98）の 2 乗 ＝ 1 − 0.0004 ＝ 0.9996 になります。これを直列に戻すと、全体 ＝ 0.99 × 0.9996 × 0.995 ≒ 0.9847、つまり約 98.47％ です。最も弱い要素を狙って改善すると、全体の底上げに最も効くことが分かります。
    why:
      - 0.98 の要素を 0.99 に置き換えただけの計算（0.99 × 0.99 × 0.995）です。二重化の効果は 1 − （1 − 0.98）の 2 乗 で、0.9996 まで上がります。
      - 全ての要素を二重化した場合の値です。二重化したのは最も弱い要素だけです。
      - 正解です。二重化した要素は 0.9996 になり、全体は 0.99 × 0.9996 × 0.995 ≒ 98.47％ です。
      - 二重化する前の、現行の全体の稼働率です。改善後の値ではありません。
    know: 直列システムでは最も弱い要素が全体をほぼ決める。改善は弱い要素の並列化から行うのが効率的で、並列化した要素の稼働率は 1 − （1 − A）の n 乗 で求める。
    terms:
      - 稼働率
      - 並列システム
    verify:
      value: 0.99 * (1 - (1 - 0.98) ** 2) * 0.995 * 100
      tolerance: 0.01
  - id: A04-516
    topic: 4-2-3
    diff: 2
    scope: 4-2-3 電源設備の容量設計。負荷の有効電力と力率から皮相電力を求め、余裕を見込んで無停電電源装置（UPS）の容量を選定する計算であり、範囲内。
    prereq: 皮相電力（kVA）＝ 有効電力（kW）÷ 力率 という関係
    q: |
      サーバ室の機器の消費電力の合計は 12 kW、力率は 0.8 である。UPS には、必要容量に対して 25％ の余裕を持たせるものとする。必要な UPS の容量は何 kVA か。
    c:
      - '15'
      - '12'
      - '18.75'
      - '9.6'
    a: ウ
    exp: |
      UPS の容量は皮相電力（kVA）で表します。まず、必要な皮相電力 ＝ 12 ÷ 0.8 ＝ 15 kVA です。これに 25％ の余裕を加えると、15 × 1.25 ＝ 18.75 kVA になります。したがって、18.75 kVA 以上の容量の UPS が必要です。力率が 1 未満だと、有効電力（kW）よりも大きな皮相電力（kVA）が必要になる点が要点です。
    why:
      - 余裕を加える前の皮相電力です。25％ の余裕を見込む条件が入っていません。
      - 消費電力の kW の値をそのまま kVA とみなした値です。力率 0.8 の換算が必要です。
      - 正解です。12 ÷ 0.8 ＝ 15 kVA に、25％ の余裕を加えて 18.75 kVA です。
      - 力率を掛けてしまった値（12 × 0.8）です。皮相電力は力率で割って求めます。
