questions:
  - id: A19-501
    topic: 19-1-3-2
    diff: 4
    q: |
      ある企業は，PPM（プロダクトポートフォリオマネジメント）で四つの事業を評価している。市場成長率が 10％以上で，かつ相対市場シェアが 1.0 以上の事業を“花形”と定義する。相対市場シェアは“自社の売上÷市場で最大の競合企業の売上”，市場成長率は“前年から今年への市場規模の伸び率”であり，売上は今年の値である。次の表で，“花形”に分類される事業の数はどれか。

      | 事業 | 前年の市場規模（億円） | 今年の市場規模（億円） | 自社の売上（億円） | 最大の競合企業の売上（億円） |
      |---|---|---|---|---|
      | 甲 | 500 | 560 | 168 | 140 |
      | 乙 | 800 | 880 | 300 | 200 |
      | 丙 | 200 | 230 | 46 | 69 |
      | 丁 | 1000 | 1120 | 250 | 250 |
    c:
      - 1 つ
      - 2 つ
      - 3 つ
      - 4 つ
    a: ウ
    scope: 経営戦略手法の事業戦略手法（PPM）。市場成長率と相対市場シェアの2軸で事業を四つに分類する考え方は、シラバスの経営戦略手法に含まれ、分類基準と定義式が問題文で与えられている。
    prereq: PPM の2軸（市場成長率，相対市場シェア）と四つの区分の意味。伸び率と比の計算。
    hard: 伸び率と相対市場シェアを事業ごとに計算し、境界値（ちょうど 10％，ちょうど 1.0）を“以上”の条件で判定する。自社シェアと相対市場シェアの混同も起きやすい。
    exp: |
      PPM の“花形”は、市場成長率が高く、相対市場シェアも高い事業です。各事業について二つの基準を順に計算します。

      | 事業 | 市場成長率 | 相対市場シェア | 判定 |
      |---|---|---|---|
      | 甲 | 560÷500−1＝12％ | 168÷140＝1.2 | 花形 |
      | 乙 | 880÷800−1＝10％ | 300÷200＝1.5 | 花形（10％ちょうどは“以上”に含む） |
      | 丙 | 230÷200−1＝15％ | 46÷69≒0.67 | 問題児 |
      | 丁 | 1120÷1000−1＝12％ | 250÷250＝1.0 | 花形（1.0 ちょうどは“以上”に含む） |

      よって花形は甲，乙，丁の 3 つです。丙は成長率は高いが、最大の競合の 3 分の 2 の売上しかなく、相対市場シェアが 1.0 未満なので問題児になります。
    why:
      - 境界値を“超える”と読み、乙（10％ちょうど）と丁（1.0 ちょうど）をどちらも外した場合の数です。定義は“以上”なので、どちらも花形に含まれます。
      - 乙と丁のうち片方だけを境界値の扱いで外した場合の数です。乙は成長率がちょうど 10％、丁は相対シェアがちょうど 1.0 で、どちらも“以上”の条件を満たします。
      - 正解です。甲，乙，丁が成長率 10％以上かつ相対市場シェア 1.0 以上で、花形に分類されます。
      - 丙を含めた誤りです。丙の自社シェアは 20％と低くはありませんが、相対市場シェアは約 0.67 で、最大の競合に劣るため花形ではなく問題児です。
    know: |
      PPM の縦軸は市場成長率、横軸は相対市場シェア（自社シェア÷最大の競合のシェア）です。花形は成長率・相対シェアとも高く、金のなる木は成長率が低く相対シェアが高い事業、問題児は成長率が高く相対シェアが低い事業、負け犬は両方低い事業です。相対市場シェアは“自社シェア”ではなく最大の競合との比である点、基準値の“以上”と“超える”の違いに注意します。
    terms: [PPM, 花形, 問題児]
    verify:
      value: "[[500,560,168,140],[800,880,300,200],[200,230,46,69],[1000,1120,250,250]].filter(([p,n,s,c]) => n/p-1 >= 0.1-1e-9 && s/c >= 1-1e-9).length"
      tolerance: 0.001

  - id: A19-502
    topic: 19-1-3-2
    diff: 3
    q: |
      産業用ロボット向けの部品を製造する中堅メーカ X 社が SWOT 分析を行い，次の結果を得た。

      - 強み：微細加工の独自技術と，熟練した技能者の蓄積がある。
      - 弱み：海外の営業拠点が少なく，海外での知名度が低い。
      - 機会：国内外で工場の自動化への投資が拡大している。
      - 脅威：海外の大手が，低価格の類似部品で市場に参入している。

      この結果を組み合わせて戦略を検討する（クロス SWOT）。“強みを活用して脅威の影響を回避又は軽減する”戦略として，最も適切なものはどれか。
    c:
      - 微細加工の技術を活かして，低価格の類似部品では実現しにくい高精度・高信頼の部品に特化し，差別化を図る。
      - 微細加工の技術を活かして，工場の自動化投資が拡大している国内外の市場に向けて，高精度部品の販売を拡大する。
      - 海外の販売代理店と提携して，海外での知名度の低さを補いながら，自動化需要を取り込む。
      - 海外での知名度の低さと低価格品の参入が重なる海外市場からは撤退し，国内市場に経営資源を集中する。
    a: ア
    scope: 経営戦略手法の事業戦略手法（SWOT 分析）。強み・弱み・機会・脅威を組み合わせて戦略を導くクロス SWOT の考え方で、組合せの意味は問題文で示されている。
    prereq: SWOT 分析の四つの要素と、内部環境・外部環境の区別。
    hard: 四つの施策のうち三つが“強み”又は“機会”を使っており、どの組合せ（強み×脅威）の施策かを要素の使い方から見極める必要がある。
    exp: |
      クロス SWOT は、内部環境（強み・弱み）と外部環境（機会・脅威）を組み合わせて、次の四つの方向性を導きます。

      | 組合せ | 方向性 |
      |---|---|
      | 強み×機会 | 強みを活かして機会を取り込む（積極化） |
      | 弱み×機会 | 弱みを補って機会を取り込む（段階的施策） |
      | 強み×脅威 | 強みで脅威を回避・軽減する（差別化） |
      | 弱み×脅威 | 弱みと脅威による最悪の事態を避ける（防衛・撤退） |

      本問は“強み（微細加工技術）で脅威（低価格品の参入）を回避・軽減する”ので、低価格品では代替しにくい高精度部品に特化する差別化戦略が該当します。
    why:
      - 正解です。独自技術という強みを使い、低価格品との価格競争という脅威を避ける差別化で、強み×脅威の戦略です。
      - 強みと機会（自動化投資の拡大）を組み合わせた積極化の戦略です。脅威への対応が含まれていないので、強み×脅威ではありません。
      - 弱み（知名度の低さ）を補って機会を取り込む戦略で、弱み×機会に当たります。強みは使われていません。
      - 弱みと脅威が重なる領域から撤退する防衛的な戦略で、弱み×脅威に当たります。強みを活用していません。
    know: |
      SWOT 分析は、強み・弱みを内部環境、機会・脅威を外部環境として整理します。自社でコントロールできるのは内部環境で、外部環境は変えられない前提で対応を考えます。“競合の参入”は外部要因なので脅威、“自社の技術力”は内部要因なので強みです。クロス SWOT では、使う要素の組合せ（何を活かし、何を避けるか）から戦略の種類を判定します。
    terms: [SWOT分析]

  - id: A19-503
    topic: 19-1-3-2
    diff: 3
    q: |
      ポーターのバリューチェーンでは，企業の活動を主活動と支援活動に分けて分析する。製造業の A 社の次の活動のうち，支援活動だけの組合せはどれか。

      - 活動 1：納入された部品や原材料の受入れ，検品，倉庫での保管と在庫管理
      - 活動 2：部品や原材料の購入先の選定，価格交渉，購買契約の締結
      - 活動 3：新製品や生産技術の研究開発
      - 活動 4：完成品を倉庫から顧客に向けて出荷，配送
      - 活動 5：製品の取扱説明や修理など，購入後の顧客支援
      - 活動 6：従業員の採用と教育
    c:
      - 活動 2，3，6
      - 活動 1，2，6
      - 活動 2，3，5
      - 活動 3，4，6
    a: ア
    scope: 経営戦略手法の事業戦略手法（バリューチェーン分析）。主活動（購買物流・製造・出荷物流・販売とマーケティング・サービス）と支援活動（調達・技術開発・人事労務管理・全般管理）の区分は範囲内の知識である。
    prereq: バリューチェーンの主活動と支援活動の構成。購買物流と調達活動の違い。
    hard: 活動 1 と 2 はどちらも“購買”に関わるが、前者は物の流れ（主活動の購買物流）、後者は購入先の選定・交渉（支援活動の調達）であり、区別できないと誤る。
    exp: |
      バリューチェーンの区分は次のとおりです。

      | 区分 | 活動 |
      |---|---|
      | 主活動 | 購買物流，製造，出荷物流，販売とマーケティング，サービス |
      | 支援活動 | 全般管理（インフラストラクチャ），人事・労務管理，技術開発，調達活動 |

      活動 1 は物の受入れ・保管なので購買物流（主活動）、活動 2 は購入先の選定・交渉・契約なので調達活動（支援活動）です。活動 3 は技術開発、活動 6 は人事・労務管理でどちらも支援活動です。活動 4 は出荷物流、活動 5 はサービスで主活動です。よって支援活動だけの組合せは活動 2，3，6 です。
    why:
      - 正解です。調達活動（活動 2），技術開発（活動 3），人事・労務管理（活動 6）はいずれも支援活動です。
      - 活動 1（部品の受入れ・保管）を“購買に関する活動”と見て支援の調達活動と混同した誤りです。物の受入れ・保管は購買物流で主活動です。
      - 活動 5（購入後の顧客支援）を“間接的な活動”と捉えて支援活動に含めた誤りです。顧客への直接的なサービスは主活動に入ります。
      - 活動 4（完成品の出荷・配送）を“業務を支える活動”と見た誤りです。製品を顧客に届ける出荷物流は主活動です。
    know: |
      主活動は製品が顧客に届くまでの直接の流れ（購買物流→製造→出荷物流→販売・マーケティング→サービス）で、支援活動はそれを支える機能です。“調達活動”は購入の意思決定・交渉・契約（支援活動）、“購買物流”は受入れ・保管・在庫管理（主活動）という違いが頻出の落とし穴です。付加価値と各活動のコストを分析して、強みや改善点を見つけます。
    terms: [バリューチェーン]

  - id: A19-504
    topic: 19-1-3-2
    diff: 2
    q: |
      家庭向けの掃除ロボットを国内で販売する A 社が検討している施策のうち，アンゾフの成長マトリクスにおける“多角化戦略”に該当するものはどれか。
    c:
      - 掃除ロボットの技術を応用して，これまで扱っていない農業用の自動草刈り機を開発し，農業法人向けに販売する。
      - 既存の掃除ロボットを，オフィスの清掃を請け負う事業者にも販売する。
      - 既存の家庭向け顧客に，機能を強化した掃除ロボットの新型モデルを販売する。
      - 既存の家庭向け顧客に対して販売促進キャンペーンを強化し，既存の掃除ロボットの購入を増やす。
    a: ア
    scope: 経営戦略手法の事業戦略手法（成長マトリクス）。製品と市場を“既存”“新規”で分ける四つの戦略の区別は、シラバスの経営戦略手法の範囲内である。
    prereq: アンゾフの成長マトリクスの2軸（製品，市場）と四つの戦略名。
    hard: 新型モデルの販売（製品開発）や新しい顧客層への販売（市場開拓）のように、製品と市場のどちらか一方だけが新しい施策と、両方が新しい多角化を区別する必要がある。
    exp: |
      アンゾフの成長マトリクスは、製品と市場をそれぞれ“既存”と“新規”に分けて、成長戦略を四つに分類します。

      | | 既存製品 | 新規製品 |
      |---|---|---|
      | 既存市場 | 市場浸透 | 製品開発 |
      | 新規市場 | 市場開拓 | 多角化 |

      農業用の自動草刈り機を農業法人向けに販売する施策は、製品も市場も新規なので多角化です。オフィス清掃事業者への販売は既存製品×新規市場の市場開拓、新型モデルは新規製品×既存市場の製品開発、キャンペーン強化は既存製品×既存市場の市場浸透です。
    why:
      - 正解です。製品（草刈り機）も市場（農業法人）も新規なので多角化戦略です。
      - 製品は既存のままで、販売先だけが新しくなる市場開拓戦略です。製品が新規ではないので多角化ではありません。
      - 市場は既存の家庭向けのままで、製品だけが新しくなる製品開発戦略です。市場が新規ではないので多角化ではありません。
      - 既存の製品を既存の顧客に売り増す市場浸透戦略です。製品も市場も新しくないので多角化ではありません。
    know: |
      成長マトリクスでは、製品と市場の“どちらが新しいか”で戦略が決まります。両方が既存なら市場浸透、市場だけ新規なら市場開拓、製品だけ新規なら製品開発、両方新規なら多角化です。多角化はリスクが最も高い一方、既存の技術や販路との間にシナジー効果が期待できると成功しやすいとされます。
    terms: [成長マトリクス, 多角化戦略, 市場開拓戦略]

  - id: A19-505
    topic: 19-3-1
    diff: 4
    q: |
      EC サイトを運営する B 社は，KGI（重要目標達成指標）である月間売上を 1,800 万円から 2,700 万円に引き上げる目標を立てた。売上は“訪問者数×コンバージョン率（訪問者のうち購入に至る割合）×客単価”に分解でき，現状は訪問者数が月 200,000 人，コンバージョン率が 1.5％，客単価が 6,000 円である。施策の結果，コンバージョン率が 1.8％，客単価が 7,500 円に改善した場合，目標の月間売上を達成するために必要な月間訪問者数は何人か。
    c:
      - 200,000 人
      - 240,000 人
      - 250,000 人
      - 300,000 人
    a: ア
    scope: ビジネス戦略と目標の設定・評価（KGI，KPI）。KGI を KPI に分解して施策の目標を設定する考え方であり、売上の分解式は問題文で与えられ、必要な計算は四則演算のみである。
    prereq: KGI と KPI の関係、コンバージョン率の意味、割合の計算。
    hard: 3 つの KPI（訪問者数，コンバージョン率，客単価）が積で結ばれているため、改善した 2 つの KPI を反映した上で残りの KPI を逆算する多段階の計算になる。売上 1.5 倍に合わせて訪問者数も 1.5 倍と誤りやすい。
    exp: |
      まず現状を確認します。200,000×0.015×6,000＝18,000,000（円）で、現状の月間売上 1,800 万円と一致します。

      次に、改善後の 1 訪問者当たりの売上を求めます。0.018×7,500＝135（円）です（現状は 0.015×6,000＝90 円）。

      目標 27,000,000 円を 1 訪問者当たり 135 円で割ると、27,000,000÷135＝200,000（人）となります。つまり、1 訪問者当たりの売上が 1.5 倍（90→135 円）になったので、訪問者数を増やさなくても目標を達成できます。
    why:
      - 正解です。27,000,000÷(0.018×7,500)＝200,000 人で、現状の訪問者数のまま達成できます。
      - コンバージョン率の改善（1.5％→1.8％）を反映せず、客単価の改善だけを考慮した場合の数です。27,000,000÷(0.015×7,500)＝240,000 人です。
      - 客単価の改善（6,000→7,500 円）を反映せず、コンバージョン率の改善だけを考慮した場合の数です。27,000,000÷(0.018×6,000)＝250,000 人です。
      - 売上が 1.5 倍なので訪問者数も 1.5 倍とした誤りです。他の 2 つの KPI が改善しているので、訪問者数を増やす必要はありません。
    know: |
      KGI は最終的な目標（ここでは売上）、KPI は KGI の達成に向けたプロセスを測る中間指標（訪問者数，コンバージョン率，客単価など）です。KGI を要素に分解して KPI を設定し、各 KPI の目標値を定めます。CSF（重要成功要因）は目標達成のために特に重要な要因です。KPI が積の関係のとき、一部が改善した分は他の KPI の必要水準を下げる点に注意します。
    terms: [KGI, KPI, CVR]
    verify:
      value: "27000000 / (0.018 * 7500)"
      tolerance: 0.5

  - id: A19-506
    topic: 19-2-2-5
    diff: 4
    q: |
      ネットショップ運営会社が，リスティング広告に月 300 万円を投じた。クリック単価は 60 円，広告をクリックしたユーザのうち購入に至る割合（コンバージョン率）は 2％，購入 1 件当たりの粗利は 4,500 円である。広告経由の粗利から広告費を差し引いた額を広告費で割った投資利益率（ROI）は何％か。ここで，クリック単価は 1 クリック当たりの広告費を表す。
    c:
      - -85％
      - 33％
      - 50％
      - 150％
    a: ウ
    scope: Web マーケティング戦略（リスティング広告）とビジネス戦略の評価（コンバージョン率，ROI）。広告のクリックから購入までの流れで成果を測る指標の計算であり、必要な定義は問題文で与えられている。
    prereq: リスティング広告のクリック課金、コンバージョン率、ROI（投資利益率）の考え方と割合の計算。
    hard: 広告費→クリック数→購入件数→粗利→ROI と 4 段階で計算し、しかも ROI は粗利そのものではなく“粗利−広告費”を分子にする。割合の桁や分母の取り違えが起きやすい。
    exp: |
      次の順に計算します。

      | 項目 | 計算 | 値 |
      |---|---|---|
      | クリック数 | 3,000,000÷60 | 50,000 回 |
      | 購入件数 | 50,000×0.02 | 1,000 件 |
      | 粗利 | 1,000×4,500 | 4,500,000 円 |
      | 利益（粗利−広告費） | 4,500,000−3,000,000 | 1,500,000 円 |
      | ROI | 1,500,000÷3,000,000 | 50％ |

      ROI は投資に対して得られた利益の割合なので、分子は粗利から広告費を差し引いた利益、分母は投資額（広告費）です。
    why:
      - コンバージョン率 2％を 0.002 と誤って計算し、購入件数が 100 件になった場合の値です（(450,000−3,000,000)÷3,000,000）。2％は 0.02 です。
      - 分母を広告費ではなく粗利にした誤りです（1,500,000÷4,500,000）。ROI の分母は投資額である広告費です。
      - 正解です。購入 1,000 件の粗利 450 万円から広告費 300 万円を引いた 150 万円を、広告費 300 万円で割ると 50％になります。
      - 分子を粗利そのものにした誤りです（4,500,000÷3,000,000）。投資に対する利益を求めるので、広告費を差し引く必要があります。
    know: |
      リスティング広告（検索連動型広告）は、検索キーワードに連動して表示され、一般にクリックされた回数に応じて費用が発生します。コンバージョン率は目標達成（購入など）に至った割合で、広告の効果測定に用います。ROI＝（利益−投資額）÷投資額で、売上や粗利を投資額で割った値（比率）と混同しないようにします。
    terms: [リスティング広告, CVR, ROI]
    verify:
      value: "((3000000 / 60) * 0.02 * 4500 - 3000000) / 3000000 * 100"
      tolerance: 0.001

  - id: A19-507
    topic: 19-2-2-2
    diff: 4
    q: |
      ある製品の販売価格を，原価に目標の粗利を上乗せして決める（コストプラス法）。変動費は 1 個当たり 2,800 円，固定費は年間 6,000,000 円，年間の販売見込数量は 4,000 個で，固定費は販売見込数量で按分して 1 個当たりの原価に含める。販売価格に対する粗利率を 20％確保するには，販売価格を何円にすればよいか。ここで，粗利率は“粗利÷販売価格”とする。
    c:
      - 3,360 円
      - 3,500 円
      - 5,160 円
      - 5,375 円
    a: エ
    scope: マーケティング戦略の価格戦略（コストプラス法などの価格設定方法）。原価を基準に価格を決める方法の計算で、粗利率の定義は問題文で与えられており、必要なのは四則演算である。
    prereq: コストプラス法の考え方、固定費の按分、粗利率（売価基準）の計算。
    hard: 固定費の按分で 1 個当たり原価を出し、さらに“売価に対する粗利率”から価格を逆算する 2 段階の計算になる。原価に 20％を上乗せする（値入率）と混同しやすい。
    exp: |
      1 個当たりの固定費は 6,000,000÷4,000＝1,500（円）なので、1 個当たりの原価は 2,800＋1,500＝4,300（円）です。

      粗利率は“粗利÷販売価格”なので、原価が販売価格の 80％（＝1−0.2）に当たります。したがって販売価格＝4,300÷(1−0.2)＝4,300÷0.8＝5,375（円）です。確認すると、粗利は 5,375−4,300＝1,075 円で、1,075÷5,375＝0.2（20％）になります。

      4,300×1.2＝5,160 円は、原価に対する 20％の上乗せ（原価基準の値入率）なので、その場合の粗利は 860 円で目標の 1,075 円には届かず、粗利率は約 16.7％にしかなりません。
    why:
      - 固定費を原価に含めず（変動費のみ）、原価に 20％を上乗せした誤りです（2,800×1.2）。固定費も回収する必要があります。
      - 固定費を原価に含めず、売価に対する粗利率で逆算した誤りです（2,800÷0.8）。固定費の按分分 1,500 円が原価に含まれていません。
      - 売価ではなく原価に対して 20％を上乗せした誤りです（4,300×1.2）。この価格の粗利率は 860÷5,160 で約 16.7％にとどまります。
      - 正解です。原価 4,300 円を 80％として 4,300÷0.8＝5,375 円となり、粗利率はちょうど 20％です。
    know: |
      コストプラス法は、原価に一定の利益を上乗せして価格を決める方法で、競合や顧客の価値を直接見ない点が弱みです。価格に対する粗利率（売価基準）と、原価に対する上乗せ率（原価基準）は別の概念で、売価基準では 売価＝原価÷(1−粗利率) になります。固定費は販売数量が見込みより少ないと回収できなくなる点にも注意します。
    terms: [コストプラス法]
    verify:
      value: "(2800 + 6000000/4000) / (1 - 0.2)"
      tolerance: 0.001

  - id: A19-508
    topic: 19-2-1-3
    diff: 3
    q: |
      ある定額制サービスの運営会社が，顧客維持の指標として“リテンション率（期初の顧客のうち，期末まで継続している顧客の割合）”を算出する。期初の顧客数は 2,000 人，期中に新規に獲得して期末まで継続した顧客は 500 人，期末の顧客数は 2,150 人である。このサービスのリテンション率は何％か。
    c:
      - 75％
      - 82.5％
      - 86％
      - 107.5％
    a: イ
    scope: CX デザインの指標（リテンション率，顧客ロイヤルティ）。リテンション率の定義は問題文で与えられており、新規獲得分を除いて継続顧客を求める計算は範囲内の知識で解ける。
    prereq: リテンション率（継続率）と解約の考え方。人数の増減の整理。
    hard: 期末の顧客数に新規獲得分が含まれるため、まず新規分を引いて“期初から継続した人数”を求めてから期初で割る。期末÷期初などの単純な比と混同しやすい。
    exp: |
      期末の顧客 2,150 人には、期中に獲得した新規顧客 500 人が含まれています。したがって、期初の顧客のうち期末まで継続した人数は 2,150−500＝1,650（人）です。

      リテンション率＝1,650÷2,000＝0.825＝82.5％です。解約した顧客は 2,000−1,650＝350 人で、解約率は 17.5％となり、リテンション率との合計は 100％になります。

      期末÷期初（2,150÷2,000＝107.5％）は顧客数の増減率であり、新規獲得による増加を含むため、継続率を表しません。
    why:
      - 新規顧客と解約顧客を取り違えて、継続者を 2,000−500＝1,500 人とした誤りです。500 人は解約ではなく新規獲得です。
      - 正解です。期末の 2,150 人から新規の 500 人を除いた 1,650 人が期初から継続した顧客で、1,650÷2,000＝82.5％です。
      - 期末の顧客数を（期初＋新規）で割った誤りです（2,150÷2,500）。この値は“期初と新規を合わせた顧客のうち期末に残った割合”で、期初の顧客の継続率ではありません。
      - 期末の顧客数を期初の顧客数で割った顧客数の増減率で、新規獲得分を含んでいます。継続率が 100％を超えることはありません。
    know: |
      リテンション率は、顧客が離脱せず継続している割合を示し、顧客ロイヤルティ（愛着や信頼）の結果として表れる指標です。新規獲得よりも既存顧客の維持の方が低コストとされ、サブスクリプション型ビジネスで重視されます。顧客数の純増減（期末÷期初）と、継続率（期初顧客のうち残った割合）、解約率（1−継続率）を区別することが重要です。
    terms: [リテンション率, 顧客ロイヤルティ]
    verify:
      value: "(2150 - 500) / 2000 * 100"
      tolerance: 0.0001

  - id: A19-509
    topic: 19-1-2
    diff: 3
    q: |
      ある産業機器メーカでは，累積生産量が 2 倍になるごとに，1 台当たりの単位コストが 20％低下する（経験曲線効果）ことが確認されている。累積生産台数が 1,000 台の時点での単位コストは 100 万円であった。累積生産台数が 8,000 台に達した時点での単位コストは何万円か。ここで，効果は累積生産量の倍増ごとに一定の割合で働くものとする。
    c:
      - 16.8 万円
      - 40 万円
      - 51.2 万円
      - 80 万円
    a: ウ
    scope: 全社戦略の経験曲線（経験効果）。累積生産量の増加に伴い単位コストが低下するという考え方であり、低下率は問題文で与えられ、必要な計算は累乗の計算のみである。
    prereq: 経験曲線の考え方（累積生産量と単位コスト）。倍増の回数の数え方。
    hard: 8,000 台は 1,000 台の 8 倍なので、倍増は 3 回（2^3＝8）と数え、低下率を 3 回“掛ける”必要がある。20％ずつ引く、8 回掛けるなど、回数と掛け方を誤りやすい。
    exp: |
      累積生産量は 1,000 台→2,000 台→4,000 台→8,000 台と、3 回倍増します（2^3＝8）。倍増のたびに単位コストは 0.8 倍（20％低下）になるので、

      100×0.8×0.8×0.8＝100×0.512＝51.2（万円）です。

      | 累積生産台数 | 倍増の回数 | 単位コスト |
      |---|---|---|
      | 1,000 | 0 | 100 万円 |
      | 2,000 | 1 | 80 万円 |
      | 4,000 | 2 | 64 万円 |
      | 8,000 | 3 | 51.2 万円 |

      低下は“元の値から 20 万円ずつ引く”のではなく“直前の値の 80％になる”ので、毎回の下げ幅は小さくなります。
    why:
      - 倍増ではなく“8 倍”を 8 回の低下と数えて 0.8 を 8 回掛けた誤りです（100×0.8^8）。倍増の回数は 2^3＝8 より 3 回です。
      - 低下を 20 万円ずつ 3 回引いた誤りです（100−20×3）。低下率は直前の単位コストに対する割合なので、引き算ではなく掛け算です。
      - 正解です。倍増 3 回で 100×0.8^3＝51.2 万円になります。
      - 倍増 1 回分（2,000 台時点）の値で止めた誤りです。8,000 台までに 3 回倍増するので、さらに低下します。
    know: |
      経験曲線は、累積生産量が増えるほど作業の習熟や工程改善などによって単位コストが低下するという経験則で、倍増ごとに一定割合で低下するのが基本形です。これを根拠に、シェア拡大によるコスト優位（コストリーダーシップ戦略）や PPM の考え方が説明されます。規模の経済が“生産規模の大きさ”によるコスト低減であるのに対し、経験曲線は“累積生産量”による低減である点が違いです。
    terms: [経験曲線, 規模の経済]
    verify:
      value: "100 * Math.pow(0.8, Math.log2(8000/1000))"
      tolerance: 0.0001
