questions:
  - id: A13-501
    topic: 13-1-1-2
    diff: 3
    scope: 13-1-1-2 スクラムのスプリントの運営。スプリントの途中で持ち込まれた要求への対処（スプリントゴールの保護とバックログへの追加）の判断
    prereq: スクラムでは、スプリントの期間中はスプリントゴールを危うくする変更を行わず、新しい要求はプロダクトバックログに追加して優先順位付けすること
    hard: 要求を持ち込んだのがプロダクトオーナーであっても、進行中のスプリントは保護される、という原則の適用が問われる。
    q: |
      スクラムで開発を行っている。スプリントの 3 日目に、プロダクトオーナーから「緊急の要望なので、今のスプリントにこの機能を追加してほしい」と依頼があった。この機能を入れると、スプリントゴールが達成できなくなる見込みである。チームの対応として、適切なものはどれか。
    c:
      - 機能をプロダクトバックログに追加し、次のスプリント以降に回す。今のスプリントは、ゴールを変更せずに進める
      - プロダクトオーナーの依頼であるため、直ちにスプリントに機能を追加する
      - 進行中の作業を全て破棄し、スプリントをやり直す
      - スプリントの期間を延長し、両方の機能を収める
    a: ア
    exp: |
      スクラムでは、スプリントの期間中、スプリントゴールを危うくするような変更は行わないことが原則です。新しい要求は、プロダクトバックログの項目として追加し、プロダクトオーナーが優先順位を付け直した上で、次のスプリント計画で取り込みます。スプリントの期間（タイムボックス）を延長することもありません。なお、ゴール自体が不要になったような例外的な場合に、プロダクトオーナーがスプリントを中止することはありますが、本件はその場合には当たりません。
    why:
      - 正解です。スプリントを保護し、要求はバックログで扱います。
      - 依頼者がプロダクトオーナーであっても、スプリントゴールを危うくする変更は途中では加えません。
      - スプリントの中止は、ゴールが不要になった場合の例外的な措置であり、本件には当たりません。
      - スプリントの期間は固定（タイムボックス）であり、延長して詰め込むことはしません。
    know: スクラムの運営は、「スプリントは保護し、変化はバックログで受ける」という原則で判断することが要点である。
    terms:
      - スクラム
      - スプリント
      - プロダクトバックログ
    verify:
      manual: スプリントの途中でスプリントゴールを危うくする変更を行わず、新しい要求はプロダクトバックログに追加して次のスプリントで扱うことが、スクラムの原則に沿うことを確認した。
  - id: A13-502
    topic: 13-1-1-3
    diff: 3
    scope: 13-1-1-3 DevOps における継続的インテグレーション。こまめな統合と自動ビルド・自動テストで、統合時の問題を早期に見つける仕組みの適用判断
    prereq: 継続的インテグレーション（CI）では、開発者がコードを頻繁に共有リポジトリへ統合し、そのたびに自動でビルドとテストを実行すること
    hard: 問題の原因（統合がまれで手作業であること）と、仕組みの効果（問題の早期発見）を結び付ける必要がある。
    q: |
      ある開発チームでは、各担当者が数週間にわたって自分の作業環境で開発を進め、完了後にまとめて結合している。そのため、結合のたびに大量の不整合や手作業による手順のミスが発生し、修正に多くの工数を費やしている。改善として、継続的インテグレーションの導入が適切と判断される理由はどれか。
    c:
      - 担当者ごとに開発環境を分け続けることで、互いの変更の影響を受けなくなるから
      - テストを結合の後にまとめて手作業で行うことで、確認の漏れをなくせるから
      - 統合を頻繁に行い、そのたびに自動でビルドとテストを実行することで、不整合を小さいうちに見つけ、手作業のミスも減らせるから
      - 統合の回数を減らすことで、不整合に触れる機会自体をなくせるから
    a: ウ
    exp: |
      継続的インテグレーション（CI）は、統合を「まれな大きな作業」から「頻繁な小さい作業」に変える実践です。コードを頻繁に統合し、そのたびに自動ビルドと自動テストが実行されるため、変更どうしの不整合は、原因となった変更が小さいうちに見つかります。手作業の手順は自動化されるため、ミスも減ります。本件の問題（まれな統合、手作業のミス）に、直接効く改善です。
    why:
      - 環境を分けたままでは、統合の時点での不整合は解消されません。
      - 手作業のテストは、現状のミスの一因であり、自動化の方向とは逆です。
      - 正解です。頻繁な統合と自動化が、問題の早期発見につながります。
      - 統合の回数を減らすのは現状の進め方そのものであり、不整合が大きくなる原因です。
    know: CI の要点は、「統合を頻繁に、確認を自動で」という転換である。問題の症状（結合時の大量の不整合）と仕組みを結び付けて判断することが鍵である。
    terms:
      - 継続的インテグレーション
      - DevOps
    verify:
      manual: まれな統合と手作業が不整合とミスの原因である状況に対して、頻繁な統合と自動ビルド・自動テストによる早期発見が効くことが、CI導入の理由になることを確認した。
  - id: A13-503
    topic: 13-4-1
    diff: 3
    scope: 13-4-1 構成管理。ベースライン（正式に確定した構成の基準）を管理し、障害時に本番の構成を正確に特定できるようにする仕組みの適用判断
    prereq: 構成管理では、構成品目（ソースコード、設計書、実行モジュールなど）と、その確定した状態であるベースラインを管理し、変更はベースラインを基準に行うこと
    hard: 障害の切り分けができない原因が、「どの版が本番で動いているか分からない」という構成の特定の問題であることを読み取る必要がある。
    q: |
      本番環境で障害が発生し、修正のために本番で動いているプログラムのソースコードを特定しようとしたが、開発者の手元には複数の版が混在しており、どれが本番のものか特定できなかった。この再発防止として、構成管理の観点から適切なものはどれか。
    c:
      - ソースコードのバックアップの頻度を上げる
      - 開発者ごとに、自分の手元で版を管理するルールを徹底する
      - リリースの時点で構成品目とその版をベースラインとして確定し、本番の構成をいつでも特定できるように管理する
      - 障害の発生に備えて、本番環境へのアクセス権を持つ開発者を増やす
    a: ウ
    exp: |
      本件の問題は、バックアップの有無ではなく、「本番で動いている構成が何か」を誰も正確に言えないことです。構成管理では、リリースの時点で、ソースコードや設計書などの構成品目とその版の組合せを、ベースラインとして正式に確定します。これにより、障害時には本番の構成を特定して再現でき、変更もその基準に対して管理できます。手元での個別管理や、バックアップの頻度では、構成の特定はできません。
    why:
      - バックアップは消失への備えであり、版の組合せの特定とは別の話です。
      - 個別の管理では、全体としてどの版が本番かは依然として特定できません。
      - 正解です。ベースラインの確定が、本番構成の特定を可能にします。
      - アクセス権の問題ではなく、構成の特定の問題です。権限を増やしても解決しません。
    know: 構成管理の要点は、「どの版の組合せが、正式な状態か」を確定し続けることである。障害時の再現可能性という観点が、適用の判断の鍵である。
    terms:
      - 構成管理
      - ベースライン
      - 構成品目
    verify:
      manual: 本番の構成を特定できないという問題に対して、リリース時点で構成品目と版をベースラインとして確定する管理が再発防止になることを、個別管理・権限・バックアップとの対比で確認した。
  - id: A13-504
    topic: 13-4-2
    diff: 3
    scope: 13-4-2 変更管理。緊急の変更であっても、影響の評価と記録、承認の手続を経ることで、変更に起因する障害を防ぐ仕組みの適用判断
    prereq: 変更管理では、変更要求を受け付け、影響を評価し、承認を得てから実施し、その結果を記録すること、緊急時でも簡略化した手続と事後の確認を要すること
    hard: 「緊急だから手続を省く」のではなく「緊急時用の手続を踏む」という、統制と速さの両立の考え方を読み取る必要がある。
    q: |
      本番システムに重大な不具合が見つかり、緊急の修正が必要になった。開発担当者は、手続を省いて直ちに本番へ修正を適用しようとしている。変更管理の観点から、適切な対応はどれか。
    c:
      - 修正は適用せず、不具合の影響を受けた業務を停止し続ける
      - 通常時と同じだけの時間をかけた評価と承認を終えるまで、適用を保留する
      - 緊急時用の簡略な手続に沿って、影響の確認と承認を経て適用し、実施の内容と結果を記録する。事後に通常の確認も行う
      - 緊急時には手続は不要であり、担当者の判断で直ちに適用してよい
    a: ウ
    exp: |
      変更管理の目的は、変更の内容と影響を把握し、変更起因の障害を防ぐことです。緊急の変更では、手続を省くのではなく、あらかじめ定めた緊急時用の手続（簡略な影響確認と承認、記録、事後の通常確認）を使い、速さと統制を両立させます。無手続の適用は、修正自体が新たな障害を生む危険や、後から変更内容を追えない問題を生みます。一方、一律に通常の時間をかけることも、緊急時には適しません。
    why:
      - 不具合を放置する対応は、変更管理の観点からも業務の観点からも適切ではありません。
      - 緊急時には、通常と同じ時間をかけることは想定されておらず、緊急時用の手続が用意されます。
      - 正解です。緊急時用の手続で、統制を保ちながら速く適用します。
      - 手続を全く省くと、変更内容の追跡や、変更起因の障害の切り分けができなくなります。
    know: 変更管理は、「手続は常にある。ただし緊急時用は別に用意する」という考え方である。統制を外すのではなく、手続の形を使い分ける点が要点である。
    terms:
      - 変更管理
      - 変更要求
    verify:
      manual: 緊急の変更においても、緊急時用の手続による影響確認・承認・記録と事後確認が必要であり、手続の省略や通常手続の硬直的な適用ではないことを確認した。
  - id: A13-505
    topic: 13-1-3
    diff: 3
    scope: 13-1-3 形式手法。数学的な記述で仕様の曖昧さを排し、正しさを厳密に示す手法の、適用場面と代償の判断
    prereq: 形式手法は、仕様を数学的に厳密な記法で記述し、検証も数学的に行う手法であり、高い信頼性が求められる場合に有効な一方、記述と検証に高度な技能とコストを要すること
    hard: 手法の強み（厳密さ）と代償（コスト）を、対象の性質（人命や安全に関わるかどうか）と結び付けて判断する必要がある。
    q: |
      医療機器の制御ソフトウェアについて、仕様の解釈の曖昧さが重大な事故につながり得るため、仕様の正しさを厳密に示すことが求められている。形式手法の適用判断として、適切なものはどれか。
    c:
      - 適用が適切であり、形式手法を使えば、テストは一切不要になる
      - 適用は不適切である。形式手法は、画面のデザインを決めるための手法だから
      - 適用が適切である。仕様を数学的に記述し、曖昧さを排して正しさを厳密に検証できる。ただし、記述と検証には高度な技能とコストがかかることを前提に計画する
      - 適用は不適切である。形式手法は、テストの回数を増やすための手法に過ぎないから
    a: ウ
    exp: |
      形式手法は、自然言語の仕様に付きまとう曖昧さを避けるため、仕様を数学的（形式的）な記法で記述し、その正しさを数学的に検証する手法です。人命や安全に関わるような、高い信頼性が要求される対象に向きます。一方で、記述と検証には専門的な技能と大きなコストがかかるため、適用範囲の見極めが前提になります。なお、形式的な検証を行っても、実装の確認としてのテストが不要になるわけではありません。
    why:
      - 形式的検証は仕様の正しさを示すものであり、実装のテストを置き換えるものではありません。
      - 形式手法は、画面の見た目やデザインを決めるための手法ではありません。仕様を数学的に記述し、その正しさを検証するための手法です。
      - 正解です。厳密さの利点と、コストの前提の両方を踏まえた判断です。
      - 形式手法は、テストの回数の話ではなく、仕様の記述と検証の厳密さの手法です。
    know: 形式手法の判断は、「対象に要求される信頼性の高さ」と「技能・コストの代償」の釣り合いで決まる、という観点が要点である。
    terms:
      - 形式手法
    verify:
      manual: 安全に関わる制御ソフトウェアの仕様の曖昧さを排し正しさを厳密に示す目的には形式手法が適すること、技能とコストの前提、およびテストが不要になるわけではないことを確認した。
  - id: A13-506
    topic: 13-3-2-3
    diff: 3
    scope: 13-3-2-3 開発環境のツール管理。コンパイラやビルドツールなどの版をそろえて管理し、ビルドの再現性を保つ仕組みの適用判断
    prereq: 開発環境の管理対象にはツールも含まれ、ツールの種類と版を管理し、開発者間でそろえることで、同じ成果物を再現して作れるようにすること
    hard: ビルド結果が開発者ごとに違う原因が、ソースコードではなくツールの版の違いにあることを読み取る必要がある。
    q: |
      同じソースコードからビルドしているのに、開発者によって生成される実行モジュールの内容が異なり、問題の再現ができないことが分かった。調査すると、開発者ごとにコンパイラの版が異なっていた。開発環境管理の観点から、適切な対処はどれか。
    c:
      - ソースコードの版管理を厳密化し、古い版の使用を禁止する
      - ビルドは 1 人の担当者だけが行うようにし、他の開発者はビルドしない
      - 使用するツールの種類と版を定めて管理し、開発者全員が同じ版のツールを使うようにそろえる
      - 実行モジュールの内容の違いは問題視せず、各自の環境での結果を正とする
    a: ウ
    exp: |
      ビルドの結果は、ソースコードだけでなく、コンパイラなどのツールの版にも左右されます。開発環境管理では、ツールも管理対象とし、使用する種類と版を定めて、開発者間でそろえます。これにより、誰がビルドしても同じ成果物が再現でき、問題の調査も進められます。本件の原因はツールの版の不ぞろいであり、ソースコードの管理の厳密化では解決しません。
    why:
      - 原因はツールの版の違いであり、ソースコードの管理では解決しません。
      - 1 人だけがビルドする体制は、属人化と作業の停滞を招く対処であり、根本の解決ではありません。
      - 正解です。ツールの種類と版をそろえることが、再現性の対処です。
      - 結果の違いを放置すると、問題の再現や切り分けができなくなります。
    know: 開発環境管理の要点は、「成果物はコードとツールの両方で決まる」という視点である。再現性の問題は、管理対象の範囲から判断することが鍵である。
    terms:
      - ツール管理
      - 開発環境
    verify:
      manual: ビルド結果の違いの原因がコンパイラの版の不ぞろいである状況に対して、ツールの種類と版を定めて開発者間でそろえる管理が対処になることを確認した。
  - id: A13-507
    topic: 13-4-2-3
    diff: 3
    scope: 13-4-2-3 リリース管理及び出荷。出荷の可否の基準と、問題発生時に元に戻す備えを含めた、リリースの進め方の判断
    prereq: リリース管理では、出荷対象の構成を確定し、出荷の基準（テストの完了など）を満たすことを確認し、切替えの手順と、問題時に元に戻す手順を用意すること
    hard: 納期の圧力の下でも、出荷の基準と、戻す備えを外さないという判断が問われる。テスト未完了のままの出荷の可否も含まれる。
    q: |
      システムのリリース日が迫っているが、一部のテストが未完了であり、出荷の基準を満たしていない。営業部門からは、予定どおり出荷するよう強い要請がある。リリース管理の観点から、適切な対応はどれか。
    c:
      - リリース自体を無期限に延期し、関係者への説明は行わない
      - 営業部門の要請を優先し、テスト未完了のまま出荷する
      - テストの記録を完了したことにして、出荷の手続を進める
      - 出荷の基準を満たさない状態での出荷は行わず、未完了のテストの影響範囲を評価し、出荷範囲の見直しや時期の調整を、関係者で判断する。出す場合も、元に戻す手順を用意する
    a: エ
    exp: |
      リリース管理では、出荷は基準（テストの完了などの条件）を満たした構成について行います。基準を満たさない場合の進め方は、影響範囲を評価した上で、出荷する範囲を絞る、時期を調整する、といった判断を関係者で行うことです。出荷する場合には、問題が起きた際に元の状態に戻す手順（ロールバック）を用意しておくことも、リリースの備えに含まれます。記録の改ざんは論外であり、無期限の延期と説明の省略も、管理の進め方として適切ではありません。
    why:
      - 関係者との調整と説明を欠いた延期は、管理の進め方として不適切です。
      - 基準を満たさない出荷は、障害の危険を利用者に転嫁する進め方です。
      - 記録を偽ることは、リリース管理以前の問題であり、許されません。
      - 正解です。基準、影響の評価、戻す備えをそろえた判断です。
    know: リリース管理の要点は、「基準を満たした構成だけを出し、戻す備えを持って出す」という考え方である。圧力の下での判断の軸が問われる。
    terms:
      - リリース管理
      - ロールバック
    verify:
      manual: 出荷の基準を満たさない状態では出荷せず、影響範囲の評価と範囲・時期の調整を関係者で判断し、出荷時にはロールバックの手順を用意することが、リリース管理に沿うことを確認した。
  - id: A13-508
    topic: 13-1-1-8
    diff: 3
    scope: 13-1-1-8 モバイルアプリケーションの開発方式。ネイティブアプリと Web アプリ（ブラウザで動作）の、端末機能の利用と開発・配布の観点からの選択判断
    prereq: ネイティブアプリは端末の機能（通知、カメラ、センサーなど）を直接使える一方、OS ごとに開発が要り、ストアの審査を経て配布されること、Web アプリはブラウザで動作し OS を問わないが、端末機能の利用に制限があること
    hard: 要求の内容（端末機能をどれだけ使うか、対象 OS がいくつあるか）から、開発方式の長所・短所を結び付ける必要がある。
    q: |
      スマートフォン向けに、プッシュ通知と端末のカメラを本格的に使う業務アプリを開発する。対象 OS は iOS と Android の両方である。開発方式の選択として、最も適切なものはどれか。
    c:
      - ネイティブアプリとして開発する。端末の機能を直接使え、通知やカメラの要件に応えられる。OS ごとに開発と審査が要る点は、計画に織り込む
      - どちらの方式でも、端末機能の利用の度合いは変わらないため、開発者の好みで決めてよい
      - ブラウザで動作する Web アプリとして開発する。OS を問わないため、端末の機能の要件にも常に応えられる
      - 対象 OS が 2 つあるため、モバイルアプリとしての開発は不可能である
    a: ア
    exp: |
      プッシュ通知やカメラの本格的な利用は、端末の機能を直接使えるネイティブアプリが適しています。代償として、OS ごとに開発が必要であり、配布にはアプリストアの審査を経ます。Web アプリは、ブラウザ上で動作するため OS を問わずに配布・更新できる利点がありますが、端末機能の利用には制限があり、本件の要件（通知とカメラの本格利用）には応えにくい面があります。方式の選択は、要件と代償の釣り合いで判断します。
    why:
      - 正解です。要件（端末機能の本格利用）に合う方式と、その代償を踏まえた選択です。
      - 端末機能の利用の度合いは方式によって異なり、要件に関わるため、好みで決める問題ではありません。
      - Web アプリは端末機能の利用に制限があり、本件の要件には応えにくくなります。
      - 対象 OS が複数でも、方式を選んで開発することは可能です。
    know: モバイルの開発方式の選択は、「端末機能をどれだけ使うか」と「OS ごとの開発・審査の代償」の釣り合いで判断することが要点である。
    terms:
      - ネイティブアプリ
      - Webアプリ
    verify:
      manual: プッシュ通知とカメラの本格利用という要件には、端末機能を直接使えるネイティブアプリが適すること、OSごとの開発と審査が代償になること、Webアプリでは端末機能に制限があることを確認した。
