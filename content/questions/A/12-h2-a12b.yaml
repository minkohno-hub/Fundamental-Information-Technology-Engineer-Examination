  method: 作成後に独立した検算・実行検証と、解答を伏せた再解答による確認
questions:
  - id: A12-801
    topic:
      - 14-7-3
      - 12-1-5
    diff: 3
    scope: ファンクションポイント法による規模見積り（14-7-3）。機能の種類と複雑さごとの重みを与えられた表から合計し、調整係数を掛けて工数に換算する手順はシラバスの見積り手法の範囲内で、必要な重み表は問題文に示している。
    prereq: ファンクションポイント法の5種類の機能と、未調整FPに調整係数を掛ける流れ、生産性による工数換算
    hard: 5種類×複雑さ別の重み付き合計、調整係数の算出、生産性による工数換算の3段階を、数え漏れや係数の取り違えなく進める必要がある。
    q: |
      ファンクションポイント法で開発規模を見積もり，開発工数を求める。機能の種類ごとの重みは次の表のとおりである。

      | 機能の種類 | 単純 | 普通 | 複雑 |
      | --- | --- | --- | --- |
      | 外部入力 | 3 | 4 | 6 |
      | 外部出力 | 4 | 5 | 7 |
      | 外部照会 | 3 | 4 | 6 |
      | 内部論理ファイル | 7 | 10 | 15 |
      | 外部インタフェースファイル | 5 | 7 | 10 |

      対象システムの機能の数は次のとおりである。

      | 機能の種類 | 単純 | 普通 | 複雑 |
      | --- | --- | --- | --- |
      | 外部入力 | 4 | 3 | 1 |
      | 外部出力 | 2 | 3 | 0 |
      | 外部照会 | 5 | 2 | 0 |
      | 内部論理ファイル | 0 | 2 | 1 |
      | 外部インタフェースファイル | 2 | 1 | 0 |

      調整係数は 0.65 + 0.01 × 総合評価点で求め，総合評価点は 40 とする。生産性を 12 FP/人月とするとき，開発工数は何人月か。
    c:
      - 11.2 人月
      - 6.9 人月
      - 10.7 人月
      - 14.9 人月
    a: ア
    exp: |
      機能ごとに「個数×重み」を求めて合計します。
      | 機能 | 計算 | 小計 |
      | --- | --- | --- |
      | 外部入力 | 4×3 + 3×4 + 1×6 | 30 |
      | 外部出力 | 2×4 + 3×5 | 23 |
      | 外部照会 | 5×3 + 2×4 | 23 |
      | 内部論理ファイル | 2×10 + 1×15 | 35 |
      | 外部インタフェースファイル | 2×5 + 1×7 | 17 |
      未調整FPは 30+23+23+35+17 = 128 です。調整係数は 0.65 + 0.01×40 = 1.05 なので、FP は 128×1.05 = 134.4 です。工数は 134.4 ÷ 12 = 11.2 人月になります。
    why:
      - 正解です。未調整FP 128 に調整係数 1.05 を掛けた 134.4 FP を、生産性 12 FP/人月で割った値です。
      - 総合評価点を使わずに調整係数を 0.65 のまま（128×0.65÷12）計算した結果です。評価点 40 を 0.01 倍して加える必要があります。
      - 調整係数を掛け忘れて 128÷12 を計算した結果です。調整係数は未調整FPに掛けて初めて FP になるため誤りです。
      - 調整係数を 0.65+0.01×40 ではなく 1+0.40=1.40 と取り違えた結果（128×1.4÷12）です。係数は 0.65 を基準に加算するため 1.05 です。
    know: ファンクションポイント法は、外部入力・外部出力・外部照会・内部論理ファイル・外部インタフェースファイルの5種類を、複雑さ別の重みで合計して未調整FPを求め、システム特性の調整係数を掛けて規模とする。係数の式（0.65 + 0.01×評価点）と掛ける対象を取り違えやすい。
    terms:
      - ファンクションポイント法
    verify:
      value: (4*3+3*4+1*6 + 2*4+3*5 + 5*3+2*4 + 2*10+1*15 + 2*5+1*7) * (0.65 + 0.01*40) / 12
      tolerance: 0.05
  - id: A12-802
    topic:
      - 14-7-3
      - 12-6-4-3
    diff: 4
    scope: ファンクションポイント法（14-7-3）による見積りと、機能追加・修正を伴う保守（12-6-4-3）の規模把握。改修対象の機能の重みを合計する考え方と、生産性・テスト工数率による換算は、見積り手法の応用として範囲内で、条件は問題文に与えている。
    prereq: ファンクションポイント法の機能の重み、改修規模の数え方、工数の換算
    hard: 追加・変更・削除を区別して集計し、改修時の生産性低下と別枠のテスト工数という2種類の補正を順に適用する多段階の計算である。
    q: |
      稼働中のシステムに機能改修を行う。改修規模は，追加した機能，変更した機能，削除した機能の FP を合計して求める（調整係数は 1.0 とする）。改修内容は次のとおりである。

      | 区分 | 内容 | 件数 | 1件当たりの FP |
      | --- | --- | --- | --- |
      | 追加 | 外部入力 | 3 | 4 |
      | 追加 | 内部論理ファイル | 1 | 10 |
      | 変更 | 外部出力 | 4 | 5 |
      | 変更 | 外部照会 | 2 | 4 |
      | 削除 | 外部入力 | 2 | 4 |

      新規開発の生産性は 10 FP/人月であり，改修では新規開発の 0.8 倍に低下する。この生産性による工数にはテストを含まず，テスト工数として開発工数の 40 % を別に加えるとき，改修の総工数は何人月か。
    c:
      - 8.12 人月
      - 8.75 人月
      - 7.25 人月
      - 10.15 人月
    a: エ
    exp: |
      改修規模を集計します。
      | 区分 | 計算 | FP |
      | --- | --- | --- |
      | 追加 | 3×4 + 1×10 | 22 |
      | 変更 | 4×5 + 2×4 | 28 |
      | 削除 | 2×4 | 8 |
      追加・変更・削除をすべて合計するので 22+28+8 = 58 FP です。改修の生産性は 10×0.8 = 8 FP/人月なので、開発工数は 58÷8 = 7.25 人月です。これにテスト工数 40 % を加えて 7.25×1.4 = 10.15 人月になります。
    why:
      - 改修でも生産性を 10 FP/人月のままにした値（58÷10×1.4）です。改修では 0.8 倍の 8 FP/人月になる条件を見落としています。
      - 削除した機能を規模に含めず 50 FP で計算した値（50÷8×1.4）です。削除も改修作業なので規模に含める条件です。
      - テスト工数 40 % を加え忘れた値（58÷8）です。問題文では生産性による工数にテストを含まないため、別に加える必要があります。
      - 正解です。58 FP を生産性 8 FP/人月で割った 7.25 人月に、テスト工数 40 % を加えた値です。
    know: 改修の規模見積りでは、追加・変更・削除のいずれも作業が発生するため集計の対象とする。生産性は新規開発と改修で異なることがあり、問題文の条件に従って補正する。テスト工数は生産性に含まれるか別枠かを読み分ける。
    terms:
      - ファンクションポイント法
    verify:
      value: ((3*4+1*10) + (4*5+2*4) + 2*4) / (10*0.8) * 1.4
      tolerance: 0.005
  - id: A12-803
    topic: 12-3-6
    diff: 3
    scope: コードレビューのメトリクス計測としてのサイクロマティック複雑度（12-3-6）。判定の個数に1を加えて求める計算と、複合条件を個々の条件として数える前提を問題文に明示しているため範囲内である。
    prereq: サイクロマティック複雑度の求め方（判定数+1）、繰返しと選択が判定に当たること
    hard: 選択・繰返し・複合条件の判定を漏れなく数え、複合条件を1個と数える誤りや+1の忘れを避ける必要がある。
    q: |
      次のプログラム断片のサイクロマティック複雑度を，「選択や繰返しの条件を構成する個々の条件（and や or で結んだ各条件を含む）を1個の判定として数え，判定数に 1 を加える」方法で求めるといくつか。

      ```
      if (a > 0 and b > 0)
        for (i を 1 から n まで 1 ずつ増やす)
          if (d[i] < 0 or d[i] > 100)
            err を 1 増やす
          elseif (d[i] = 50)
            mid を 1 増やす
          endif
        endfor
      else
        while (c < 10)
          c を 1 増やす
        endwhile
      endif
      ```
    c:
      - 8
      - 7
      - 9
      - 6
    a: ア
    exp: |
      判定を数えます。
      | 構造 | 判定の数 |
      | --- | --- |
      | if (a > 0 and b > 0) | 2 |
      | for の繰返し条件 | 1 |
      | if (d[i] < 0 or d[i] > 100) | 2 |
      | elseif (d[i] = 50) | 1 |
      | while (c < 10) | 1 |
      判定は合計 7 個なので、サイクロマティック複雑度は 7+1 = 8 です。else は条件を持たないので判定に数えません。
    why:
      - 正解です。個々の条件 7 個に 1 を加えた 8 です。
      - 判定の合計 7 をそのまま答え、1 を加え忘れた値です。複雑度は判定数に 1 を加えます。
      - else も分岐として判定に数えた値です。else は条件を持たず、直前の if の判定の裏側にあたるため別に数えません。
      - and と or で結んだ条件をそれぞれ1個の判定（if, for, if, elseif, while の5個）と数えて 5+1 とした値です。問題文では個々の条件を数える前提です。
    know: サイクロマティック複雑度は、制御フローグラフの独立経路数に等しく、判定数+1 で求められる。複合条件の数え方には流儀があるため、問題文の前提に従う。値が大きいほどテスト経路が増え、保守が難しい。
    terms:
      - サイクロマティック複雑度
    verify:
      value: (2 + 1 + 2 + 1 + 1) + 1
  - id: A12-804
    topic: 12-2-11-2
    diff: 3
    scope: 設計のモジュール分割基準におけるモジュール結合度（12-2-11-2、12-2-9-3）。データ結合・スタンプ結合・制御結合・外部結合・共通結合・内容結合の識別は、シラバスのモジュール設計の範囲である。
    prereq: モジュール結合度の種類と強さの順序、各結合の定義
    hard: 3組のモジュール間の関係を、それぞれ異なる結合に正しく分類する必要があり、データ結合とスタンプ結合、共通結合と外部結合の取り違えを誘う。
    q: |
      モジュール間の関係について，次の（1）〜（3）の結合度の組合せとして，適切なものはどれか。

      （1）モジュール A は，顧客の全項目（顧客番号，氏名，住所，電話番号など）をまとめた構造体をモジュール B に引数で渡す。B が実際に参照するのは顧客番号だけである。
      （2）モジュール C は，処理区分（1 または 2）を引数でモジュール D に渡す。D は処理区分の値によって実行する処理を切り替える。
      （3）モジュール E と F は，グローバル領域に定義した共通のデータ領域を，どちらも直接読み書きする。
    c:
      - （1）スタンプ結合　（2）制御結合　（3）共通結合
      - （1）データ結合　（2）制御結合　（3）共通結合
      - （1）スタンプ結合　（2）データ結合　（3）共通結合
      - （1）スタンプ結合　（2）制御結合　（3）外部結合
    a: ア
    exp: |
      （1）は、必要な項目が構造体の一部なのに構造体全体を渡しており、B が不要な項目の構成にも依存するのでスタンプ結合です。
      （2）は、渡した値が D の動作の選択（制御）を決めているので制御結合です。
      （3）は、グローバル領域のデータを複数モジュールが直接参照するので共通結合です。外部結合は、外部で宣言されたデータ形式や装置などを共有する結合を指します。
      結合の強さは、データ結合 < スタンプ結合 < 制御結合 < 外部結合 < 共通結合 < 内容結合の順です。
    why:
      - 正解です。構造体全体の受渡しはスタンプ結合、区分による動作の切替えは制御結合、グローバル領域の共有は共通結合です。
      - 構造体を渡す関係をデータ結合としていますが、データ結合は必要な単純データだけを渡す結合です。構造体全体を渡すとスタンプ結合になります。
      - 処理区分の受渡しをデータ結合としていますが、その値が動作の選択を決めるため、受け渡すデータの内容による制御結合です。
      - グローバルな共通領域の共有を外部結合としています。外部結合は外部で宣言されたデータ形式や装置の共有で、共通領域の共有は共通結合です。
    know: 結合度は弱いほど良く、データ結合を目指す。構造体や配列全体を渡すとスタンプ結合、フラグで動作を切り替えると制御結合になる。共通結合はグローバル変数の共有であり、変更の影響範囲が広がる。
    terms:
      - モジュール結合度
      - スタンプ結合
      - 制御結合
      - 共通結合
      - 外部結合（モジュール結合度）
      - データ結合
  - id: A12-805
    topic: 12-2-9-3
    diff: 2
    scope: 構造化設計におけるモジュール強度（12-2-9-3）。機能的、逐次的、時間的、論理的などの強度の順位を、モジュールの記述から識別して並べる問題で、シラバスの構造化設計・品質特性の範囲である。
    prereq: モジュール強度の種類と強い順の並び
    q: |
      次の3つのモジュールの記述について，モジュール強度（凝集度）が強い順に並べたものはどれか。

      X：経理，在庫，人事の各集計処理を1つのモジュールにまとめ，引数の区分によってどの集計を行うかを切り替える。
      Y：システム起動時に必要な，ファイルのオープン，作業領域の初期化，初期メッセージの表示を実行する。
      Z：入力データの検査，検査済みデータの整形，整形結果のファイル出力を行う。各処理の出力が次の処理の入力になっている。
    c:
      - Z，X，Y
      - Y，Z，X
      - X，Y，Z
      - Z，Y，X
    a: エ
    exp: |
      X は、関係の薄い複数の機能を引数の区分で切り替えるので論理的強度です。Y は、起動時という同じ時期に実行するだけの処理を集めたので時間的強度です。Z は、前の処理の出力が次の処理の入力になる関係でまとめているので逐次的強度です。
      強度は、機能的 > 逐次的 > 通信的 > 手順的 > 時間的 > 論理的 > 偶発的の順に強いので、強い順は Z（逐次的）、Y（時間的）、X（論理的）になります。
    why:
      - 論理的強度の X を時間的強度の Y より強いとした並びです。時間的強度は実行時期という共通点があり、論理的強度より強いとされます。
      - 時間的強度の Y を逐次的強度の Z より強いとした並びです。同じ時期に実行するだけの関係は、データの流れでつながる関係より弱いため誤りです。
      - 論理的強度の X を最も強いとした並びです。区分で動作を切り替える構成は関係が弱く、強度は低い側に位置します。
      - 正解です。逐次的強度の Z、時間的強度の Y、論理的強度の X の順に強い並びです。
    know: 強度は、機能的が最も強く、偶発的が最も弱い。引数の区分で処理を切り替えるモジュールは論理的強度、初期処理など実行時期でまとめたモジュールは時間的強度になる。時間的と論理的の順序を取り違えやすい。
    terms:
      - モジュール強度
  - id: A12-806
    topic:
      - 12-2-11-2
      - 12-2-9-3
    diff: 4
    scope: モジュール結合度（12-2-11-2）を弱めるモジュール設計の見直し。共通結合・制御結合を、データ結合に近づける設計変更を選ぶ問題で、結合の定義と強さの順序を適用する範囲内の内容である。
    prereq: モジュール結合度の種類と強さの順序、機能分割によるモジュール再分割
    hard: 共通結合と制御結合という2種類の強い結合を同時に解消する変更を選ぶため、一方だけ弱める案や名前だけ変える案との区別が必要である。
    q: |
      在庫管理プログラムでは，モジュール A，B，C がグローバル領域の在庫テーブルを直接読み書きしている（共通結合）。さらに A は，処理区分（1：入庫，2：出庫）を引数でモジュール B に渡し，B は処理区分によって入庫処理と出庫処理を切り替えている（制御結合）。結合度を最も弱くするために行う変更として，適切なものはどれか。
    c:
      - 処理区分を引数で渡す代わりに，別のグローバル変数に格納して A と B が共有する。在庫テーブルはグローバル領域に残す。
      - B を入庫処理と出庫処理の2つのモジュールに分割し，各モジュールが必要とする商品コードと数量だけを引数で受け渡す。在庫テーブルの更新は在庫テーブル管理モジュールを通して行う。
      - 在庫テーブルの全項目を1つの構造体にまとめ，構造体ごとに B に引数で渡す。処理区分による切替えは B に残す。
      - 処理区分に 1 や 2 の代わりに名前付き定数を使い，B の処理切替えの記述を分かりやすくする。在庫テーブルはグローバル領域に残す。
    a: イ
    exp: |
      共通結合（グローバル領域の共有）と制御結合（区分による動作の切替え）の両方を解消する必要があります。
      | 現状 | 変更後 |
      | --- | --- |
      | 共通結合 | 必要な項目だけを引数で渡す（データ結合）。更新は管理モジュール経由 |
      | 制御結合 | 区分ごとにモジュールを分割し、区分を渡さない |
      B を入庫・出庫に分割すれば処理区分を渡す必要がなくなり、必要な単純データだけを渡せば、結合度は最も弱いデータ結合になります。
    why:
      - 区分の渡し方をグローバル変数に変えただけで、共通結合がかえって増えます。制御の仕組みも残るため、結合度は弱まりません。
      - 正解です。区分によるモジュール分割で制御結合を、必要項目だけの引数渡しと管理モジュール経由の更新で共通結合を解消でき、データ結合になります。
      - 構造体渡しによって共通結合はスタンプ結合まで弱まりますが、処理区分による切替えが残るため制御結合が解消されず、最も弱い結合ではありません。
      - 名前付き定数は読みやすさの改善にすぎず、区分で動作を切り替える構造も共通結合も変わりません。結合度は弱まりません。
    know: 結合度を弱める基本は、グローバル変数をやめて必要なデータだけを引数で渡すことと、制御フラグで動作を切り替えるモジュールを機能ごとに分割することである。構造体を渡すだけではスタンプ結合までしか弱まらない。
    terms:
      - モジュール結合度
      - 共通結合
      - 制御結合
      - データ結合
      - スタンプ結合
  - id: A12-807
    topic: 12-1-7-6
    diff: 3
    scope: UMLのクラス図の関連と多重度（12-1-7-6）の読み取り。多重度の下限・上限から存在しうるオブジェクト数の範囲を導く問題で、クラス図の読み取りはシラバスの範囲内である。
    prereq: クラス図の関連と多重度の読み方、一意性制約の意味
    hard: 複数の関連の多重度と一意性制約を組み合わせて、オブジェクト数の最小値と最大値を別々に導く必要がある。
    q: |
      次のクラス図の関連と多重度を考える。

      | 関連 | 一方の端の多重度 | もう一方の端の多重度 |
      | --- | --- | --- |
      | 注文 と 注文明細 | 注文側 1 | 注文明細側 1..* |
      | 注文明細 と 商品 | 注文明細側 0..* | 商品側 1 |

      さらに，「1つの注文に，同じ商品の注文明細を2つ以上作ってはならない」という制約が付いている。注文が 12 件，商品が 3 件存在するとき，存在しうる注文明細のオブジェクト数の最小値と最大値の組として，適切なものはどれか。
    c:
      - 最小 0，最大 36
      - 最小 3，最大 36
      - 最小 12，最大 36
      - 最小 12，最大 制限なし
    a: ウ
    exp: |
      注文と注文明細の多重度は、注文側が 1、注文明細側が 1..* です。したがって各注文には明細が少なくとも 1 つ必要で、注文 12 件に対して最小は 12×1 = 12 です。注文明細は必ずちょうど 1 つの商品に結び付くので、商品が何件でも下限は変わりません。
      最大は、1 つの注文に同じ商品の明細を 2 つ以上作れない制約から、1 注文当たり商品の種類数の 3 件までです。12×3 = 36 が最大になります。
    why:
      - 商品側の 0..* を明細数の下限と取り違えた組合せです。0..* は商品から見た明細数であり、注文が存在すれば明細は 1 件以上必要です。
      - 商品数 3 を最小値にした組合せです。明細の下限は注文側の多重度 1..* で決まり、商品数は下限を決めません。
      - 正解です。各注文に最低 1 明細（12×1）、制約により 1 注文当たり最大 3 明細（12×3）です。
      - 上限が無制限としていますが、同一商品の明細を重複して作れない制約があるため、1 注文の明細数は商品数 3 を超えません。
    know: 多重度は、反対側のクラスの1つのオブジェクトに対応する、こちら側のオブジェクトの数を表す。1..* は1以上、0..* は0以上である。数を求める問題では、どの端の多重度が下限・上限を決めているかを確認する。
    terms:
      - クラス図
    verify:
      manual: 最小=注文12件×明細下限1=12。最大=注文12件×(商品3種×同一商品は1明細まで)=36。商品側の0..*は商品から見た明細数であり、明細の下限には影響しないことを確認。
  - id: A12-808
    topic: 12-1-7-6
    diff: 3
    scope: UMLのシーケンス図（12-1-7-6）の読み取り。同期メッセージ、戻りメッセージ、選択（alt）フラグメントの意味を理解して処理の流れを判断する内容で、シラバスのUMLの範囲内である。
    prereq: シーケンス図のメッセージ、戻りメッセージ、altフラグメントの意味
    hard: altの分岐条件と同期メッセージの待ち合わせを組み合わせて、どのメッセージがいつ送信されるかを順序立てて読み取る必要がある。
    q: |
      次のシーケンス図（テキスト表記）を読み取った説明として，適切なものはどれか。メッセージは上から下の順に発生し，実線矢印は同期メッセージ，破線矢印は戻りメッセージを表す。

      ```
      利用者   -> 画面   : 注文確定()
      画面     -> 注文   : 登録(明細)
      注文     -> 在庫   : 引当(商品, 数量)
      在庫     --> 注文  : 引当結果
      alt [引当結果 = 不足]
        注文   -> 通知   : 欠品通知()
      else [それ以外]
        注文   -> 出荷   : 出荷指示()
      end
      注文     --> 画面  : 登録結果
      ```
    c:
      - 画面は注文を経由せず，在庫に対して直接引当を依頼する。
      - 注文は在庫の引当結果を待たずに，出荷指示を先に送信できる。
      - 欠品通知と出荷指示は，どちらも引当の後に必ず1回ずつ送信される。
      - 出荷指示は，在庫からの引当結果を注文が受け取り，その結果が不足でなかった場合にだけ送信される。
    a: エ
    exp: |
      在庫への引当は実線矢印の同期メッセージなので、注文は在庫からの戻りメッセージ（引当結果）を受け取るまで先へ進みません。その後の alt フラグメントは、条件に応じてどちらか一方の枠だけが実行される選択です。引当結果が不足なら欠品通知、それ以外なら出荷指示が送信されます。
      したがって、出荷指示は引当結果が不足でないときにだけ送信されます。画面が呼び出すのは注文だけで、在庫を呼び出しているのは注文です。
    why:
      - メッセージの送信元と宛先の読み違いです。引当を在庫に依頼しているのは画面ではなく注文で、画面は注文に登録を依頼しています。
      - 同期メッセージの待ち合わせを無視した説明です。引当結果を受け取るまで注文は次のメッセージを送らず、alt の判定にも結果が必要です。
      - alt を、両方を実行する並行処理と取り違えた説明です。alt はどちらか一方だけが実行される選択で、並行処理を表すのは par です。
      - 正解です。同期メッセージで引当結果を待った後、alt の else 側（不足でない場合）で出荷指示が送信されます。
    know: シーケンス図は、オブジェクト間のメッセージのやり取りを時間順に表す。実線矢印は呼出し（同期メッセージ）、破線矢印は戻りを表す。alt は選択、loop は繰返し、par は並行処理を表すフラグメントである。
    terms:
      - シーケンス図
  - id: A12-809
    topic: 12-1-7-6
    diff: 4
    scope: UMLのステートマシン図（12-1-7-6）の読み取り。状態、イベント、ガード条件、アクションを追って状態の遷移を判断する内容で、シラバスのUMLの範囲内である。ガードと更新式は問題文に明示している。
    prereq: ステートマシン図の状態・イベント・ガード条件・アクションの意味
    hard: ガード条件と変数の更新を伴う遷移を、イベント列に沿って追跡し、カウンタの初期化や受け付けないイベントを正確に判断する必要がある。
    q: |
      ATM の認証を表す次のステートマシン図（遷移表）がある。状態は「待機」「認証中」「利用中」「ロック」であり，初期状態は「待機」，変数「失敗回数」は「カード挿入」の遷移で 0 になる。遷移表にないイベントは無視される。

      | 現在の状態 | イベント [ガード] / アクション | 遷移先 |
      | --- | --- | --- |
      | 待機 | カード挿入 / 失敗回数 = 0 | 認証中 |
      | 認証中 | 一致 | 利用中 |
      | 認証中 | 不一致 [失敗回数 < 2] / 失敗回数 = 失敗回数 + 1 | 認証中 |
      | 認証中 | 不一致 [失敗回数 = 2] | ロック |
      | 利用中 | 終了 | 待機 |
      | ロック | 管理者解除 | 待機 |

      初期状態から次のイベントが順に発生した。

      カード挿入，不一致，不一致，一致，終了，カード挿入，不一致，不一致，不一致，カード挿入

      状態が「ロック」になったのは，何番目の「不一致」イベントを受け付けたときか。
    c:
      - 4 番目
      - 3 番目
      - ロックにはならない
      - 5 番目
    a: エ
    exp: |
      イベント列に沿って状態と失敗回数を追跡します。
      | イベント | 状態 | 失敗回数 | 不一致の通算 |
      | --- | --- | --- | --- |
      | カード挿入 | 認証中 | 0 | 0 |
      | 不一致 | 認証中 | 1 | 1 |
      | 不一致 | 認証中 | 2 | 2 |
      | 一致 | 利用中 | 2 | 2 |
      | 終了 | 待機 | 2 | 2 |
      | カード挿入 | 認証中 | 0 | 2 |
      | 不一致 | 認証中 | 1 | 3 |
      | 不一致 | 認証中 | 2 | 4 |
      | 不一致 | ロック | 2 | 5 |
      2 回目のカード挿入で失敗回数が 0 に戻るため、ロックされるのは通算 5 番目の不一致です。最後のカード挿入はロック状態では無視されます。
    why:
      - ガード「失敗回数 = 2」を、不一致が2回起きた時点でロックになる意味と読み違えた誤りです。実際は失敗回数が 2 の状態で3回目の不一致が起きたときです。
      - 失敗回数がカード挿入で 0 に戻ることを見落とし、失敗回数 2 のまま次の不一致を受けてロックになるとした誤りです。
      - ロックにならないとする誤りです。2回目のカード挿入後に3回連続で不一致が起き、ガード「失敗回数 = 2」を満たす遷移が実行されるため、ロックになります。
      - 正解です。2回目のカード挿入で失敗回数が 0 に戻り、その後の3回目の不一致（通算5番目）でロックになります。
    know: ステートマシン図では、イベントが発生したとき、現在の状態からガード条件が真になる遷移だけが実行される。遷移のアクションで変数が更新され、遷移表にないイベントは無視される。カウンタの初期化のタイミングを見落とさない。
    terms:
      - ステートマシン図
    verify:
      manual: JSでイベント列をシミュレーション。カード挿入で失敗回数=0とした場合、ロックは通算5番目の不一致。リセットしない場合は3番目、ガードを不一致2回でのロックと読むと4番目となる。
  - id: A12-810
    topic: 12-1-7-6
    diff: 3
    scope: UMLのアクティビティ図（12-1-7-6）の読み取り。フォーク（並行）とジョイン（合流）の意味から、全体の所要時間を求める内容で、シラバスのUMLの範囲内である。
    prereq: アクティビティ図のフォークとジョインの意味
    hard: 並行する3つの枝の所要時間を比較し、ジョインでは最も長い枝を待つことを前提に、前後のアクションと合算する必要がある。
    q: |
      次のアクティビティ図（テキスト表記）の処理を，各アクションの所要時間（分）で実行するとき，開始から終了までに最短で何分かかるか。フォークで分岐した各枝は並行して実行でき，ジョインは全ての枝が終了してから先へ進む。

      ```
      開始 → 要件確認(2)
      要件確認 → フォーク
      枝1：画面設計(3) → 画面実装(4)
      枝2：データ設計(6)
      枝3：テスト設計(2) → テスト準備(3)
      枝1，枝2，枝3 → ジョイン → 結合確認(1) → 終了
      ```
    c:
      - 9 分
      - 10 分
      - 21 分
      - 8 分
    a: イ
    exp: |
      フォーク後の各枝の所要時間は次のとおりです。
      | 枝 | 計算 | 時間 |
      | --- | --- | --- |
      | 枝1 | 3 + 4 | 7 |
      | 枝2 | 6 | 6 |
      | 枝3 | 2 + 3 | 5 |
      ジョインは全ての枝の終了を待つので、並行部分は最も長い枝1の 7 分で決まります。全体は 2 + 7 + 1 = 10 分です。
    why:
      - 1つの枝だけで時間を求め、枝2（6 分）を最長と誤った値（2+6+1）です。枝1は2アクションで 7 分あり、これが最長です。
      - 正解です。要件確認 2 分、最長の枝1の 7 分、結合確認 1 分の合計です。
      - 全アクションを順番に実行した場合の合計（2+3+4+6+2+3+1）です。フォークの枝は並行して実行できるため、合計にはなりません。
      - 最短の枝3（5 分）で計算した値（2+5+1）です。ジョインは全ての枝の終了を待つので、最長の枝が全体を決めます。
    know: フォークは処理を並行に分岐し、ジョインは全ての枝の完了を待って合流する。並行部分の所要時間は最も長い枝で決まる。条件分岐に使う判断ノードとマージノードは、待合せをしない点で異なる。
    terms:
      - アクティビティ図
    verify:
      value: 2 + Math.max(3+4, 6, 2+3) + 1
  - id: A12-811
    topic:
      - 12-1-7-2
      - 12-1-7-6
    diff: 2
    scope: ユースケース図（12-1-7-6）とユースケース（12-1-7-2）の関係。包含（include）と拡張（extend）の意味と矢印の向きを識別する内容で、シラバスのUMLの範囲内である。
    prereq: ユースケース図の include と extend の意味と矢印の向き
    q: |
      ECサイトのユースケース図で，次の関係を表したい。

      ・「注文する」の実行中には，必ず「本人確認」が行われる。
      ・「注文する」の実行中に，利用者が希望した場合にだけ「クーポンを適用する」が行われる。

      関係の記述として，適切なものはどれか。
    c:
      - 「注文する」から「本人確認」への <<include>> と，「クーポンを適用する」から「注文する」への <<extend>> を引く。
      - 「注文する」から「本人確認」と「クーポンを適用する」の両方へ <<include>> を引く。
      - 「本人確認」から「注文する」への <<include>> と，「注文する」から「クーポンを適用する」への <<extend>> を引く。
      - 「注文する」から「本人確認」への <<extend>> と，「クーポンを適用する」から「注文する」への <<include>> を引く。
    a: ア
    exp: |
      必ず実行される部分は、基となるユースケースが別のユースケースを含む関係で、基となる側から含まれる側へ <<include>> の矢印を引きます。したがって「注文する」から「本人確認」へ <<include>> です。
      条件に応じて追加で実行される部分は拡張の関係で、拡張する側（追加の機能）から基となる側へ <<extend>> の矢印を引きます。したがって「クーポンを適用する」から「注文する」へ <<extend>> です。矢印の向きが include と extend で逆になる点がポイントです。
    why:
      - 正解です。必須の本人確認は基となる側から include、任意のクーポン適用は拡張する側から extend の向きです。
      - 任意の処理であるクーポン適用まで include にした記述です。include は必ず実行される部分を表し、任意の処理は extend で表します。
      - include と extend の矢印の向きを逆にした記述です。include は基の側から含まれる側へ、extend は拡張する側から基の側へ引きます。
      - include と extend の意味を取り違えた記述です。必須の処理は include、条件付きで追加する処理は extend で表します。
    know: include は必ず実行される共通の部分を切り出す関係、extend は条件付きの追加機能を表す関係である。矢印の向きは include が基から含まれる側、extend が拡張する側から基の側へ向かう。
    terms:
      - ユースケース図
      - ユースケース
  - id: A12-812
    topic: 12-2-9-4
    diff: 3
    scope: オブジェクト指向設計のソフトウェア設計原則（SOLID）のうち、リスコフの置換原則（12-2-9-4）。継承関係で派生クラスが基底クラスの代わりに使えるための条件を適用する内容で、シラバスの範囲内である。
    prereq: リスコフの置換原則と、継承での事前条件・事後条件の考え方
    hard: 事前条件の緩和は許されるが強化は許されないといった、直感に反する方向性を区別して、違反となる変更を選ぶ必要がある。
    q: |
      Account クラスの withdraw(amount) は，「amount が 1 以上かつ残高以下であれば引き出しに成功し，引出し後の残高を返す」という仕様である。クライアントは Account 型の変数に対して acc.withdraw(500) を呼び出して利用している。Account のサブクラスを作る際の変更のうち，リスコフの置換原則に反し，クライアントのコードを修正しないと正しく動作しなくなるおそれがあるものはどれか。
    c:
      - 引出し額の範囲を，0 以上かつ残高と当座貸越枠の合計以下に広げる。
      - 引出し額に「1,000 円以上」という下限を加え，1,000 円未満の引出しを拒否する。
      - 引出しの成功時に，従来の仕様どおり残高を返すことに加えて，引出し履歴を記録する。
      - 振込を行う transfer メソッドを新たに追加する。
    a: イ
    exp: |
      リスコフの置換原則は、基底クラスの変数にサブクラスのオブジェクトを代入しても、クライアントが変更なしに正しく動作できることを求めます。
      | 変更 | 事前条件の変化 | 判定 |
      | --- | --- | --- |
      | 下限 1,000 円を加える | 強化（受付範囲が狭まる） | 違反 |
      | 受付範囲を広げる | 緩和 | 可 |
      | 履歴の記録を加える | 事後条件の仕様を保ったまま追加 | 可 |
      | 新メソッドの追加 | 既存の契約は不変 | 可 |
      withdraw(500) は基底では成功する呼出しですが、下限を加えたサブクラスでは拒否され、クライアントが想定する動作が崩れます。
    why:
      - 受け付ける範囲を広げる変更は事前条件の緩和で、基底クラスで成功する呼出しはすべて成功するため、置換原則に反しません。
      - 正解です。基底クラスで受け付けた 500 円の引出しを拒否するため、事前条件の強化にあたり、置換原則に反します。
      - 成功時の戻り値の仕様を保ったまま副作用を加える変更で、クライアントの期待する結果は変わらないため、置換原則に反しません。
      - 既存のメソッドの契約を変えずに新しいメソッドを足すだけで、基底型として使うクライアントには影響しないため、違反ではありません。
    know: リスコフの置換原則では、サブクラスは基底クラスの事前条件を強めてはならず（受付範囲を狭めない）、事後条件を弱めてはならない。受付範囲を広げる緩和は許される。直感と逆に感じやすいので、基底型で成功する呼出しが失敗しないかで判断する。
    terms:
      - リスコフの置換原則
      - SOLID
