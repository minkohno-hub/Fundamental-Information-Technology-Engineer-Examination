    diff: 3
    q: |
      次の作業からなるプロジェクトを，最短の日数で完了させたい。プロジェクトの開始時点を0日目とするとき，作業 C は遅くとも何日目までに開始しなければならないか。ここで，作業 E と作業 F の両方が終わった時点でプロジェクトは完了する。

      | 作業 | 先行作業 | 所要日数 |
      | --- | --- | --- |
      | A | なし | 2 |
      | B | なし | 4 |
      | C | A | 3 |
      | D | B | 2 |
      | E | C，D | 5 |
      | F | D | 1 |
    c: ['3日目', '2日目', '5日目', '6日目']
    a: ア
    exp: |
      各経路の日数は、A→C→E が 2 + 3 + 5 = 10 日、B→D→E が 4 + 2 + 5 = 11 日、B→D→F が 4 + 2 + 1 = 7 日です。最短の所要日数は 11 日（クリティカルパスは B→D→E）です。
      作業 E は遅くとも 11 − 5 = 6 日目に開始する必要があり、C はその前に終わっていなければならないため、C の最遅開始日は 6 − 3 = 3 日目です。
    why:
      - 正解です。E の最遅開始日6から C の所要日数3を引いて3日目です。
      - 2日目は C の最早開始日です。C には1日の余裕があります。
      - 5日目に開始すると C の終了が8日目となり、E の開始が遅れて全体が完了日の11日を超えます。
      - 6日目は E の最遅開始日で、C をこの時点で開始すると間に合いません。
    verify: { value: '(max(2 + 3, 4 + 2) + 5) - 5 - 3' }
    terms: [アローダイアグラム, クリティカルパス]

  - id: A14-023
    topic: 14-6-3
    diff: 2
    q: クリティカルパスについての説明として，適切なものはどれか。
    c:
      - クリティカルパス上の作業が遅れると，その遅れはプロジェクト全体の完了の遅れにつながる。
      - クリティカルパスは，1つのプロジェクトに必ず1本だけ存在する。
      - クリティカルパス以外の作業の所要日数を短縮すれば，プロジェクト全体の期間を必ず短縮できる。
      - クリティカルパスは，開始から終了までの経路のうち，所要日数が最も短い経路である。
    a: ア
    exp: |
      クリティカルパスは、プロジェクトの開始から終了までの経路のうち、所要日数が最も長い経路です。クリティカルパス上の作業には余裕日数がないため、どれか1つでも遅れるとプロジェクト全体の完了が遅れます。逆に、プロジェクトの期間を短縮するには、クリティカルパス上の作業を短縮する必要があります。所要日数が同じ最長の経路が複数あれば、クリティカルパスも複数存在します。
    why:
      - 正解です。クリティカルパス上の作業には余裕がないため、遅れが全体に影響します。
      - 最長の経路が複数あれば、クリティカルパスは複数存在します。
      - クリティカルパス以外の作業を短縮しても、最長の経路の日数は変わらず、全体の期間は短縮されません。
      - クリティカルパスは所要日数が最も長い経路です。
    terms: [クリティカルパス]

  - id: A14-024
    topic: 14-6-3
