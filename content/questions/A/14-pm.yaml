  - id: A14-029
    topic: 14-6-3
    diff: 2
    q: ある作業の所要日数を三点見積りで求める。楽観値が6日，最可能値が9日，悲観値が18日のとき，PERT の式による見積り値は何日か。
    c: ['10日', '9日', '11日', '12日']
    a: ア
    exp: |
      PERT の三点見積りでは、楽観値・最可能値・悲観値に 1 : 4 : 1 の重みを付けて平均します。
      見積り値 = (楽観値 + 4 × 最可能値 + 悲観値) ÷ 6
      = (6 + 4 × 9 + 18) ÷ 6 = 60 ÷ 6 = 10 日
    why:
      - 正解です。(6 + 36 + 18) ÷ 6 = 10日です。
      - 9日は最可能値そのもので、楽観値と悲観値を考慮していません。
      - 11日は3つの値を単純に平均した値 (6 + 9 + 18) ÷ 3 です。
      - 12日は楽観値と悲観値の中間 (6 + 18) ÷ 2 です。
    verify: { value: '(6 + 4 * 9 + 18) / 6' }
    terms: [三点見積り, PERT]

  - id: A14-030
    topic: 14-7-3
    diff: 2
    q: EVM（Earned Value Management）における EV（アーンドバリュー）の説明として，適切なものはどれか。
    c:
      - ある時点までに実際に完了した作業に対して，計画時に割り当てられていた予算の額
      - ある時点までに完了する計画であった作業に割り当てられた予算の額
      - ある時点までに完了した作業のために，実際に費やしたコスト
      - プロジェクト全体の完了までに必要な総コストの見積り
    a: ア
    exp: |
      EVM は、作業の進捗を金額に換算して、スケジュールとコストを同時に管理する手法です。
      - PV（計画価値）：その時点までに完了する予定だった作業の予算
      - EV（アーンドバリュー、出来高）：その時点までに実際に完了した作業の予算
      - AC（実コスト）：その時点までに完了した作業に実際にかかったコスト
      スケジュール差異 SV = EV − PV、コスト差異 CV = EV − AC で、負の値ならそれぞれ遅れ、コスト超過を表します。
    why:
      - 正解です。完了した作業の予算額が EV です。
      - これは PV（計画価値）の説明です。
      - これは AC（実コスト）の説明です。
      - これは EAC（完成時総コスト見積り）の説明です。
    terms: [EVM]

  - id: A14-031
    topic: 14-7-3
    diff: 2
    q: EVM で管理しているプロジェクトのある時点の値が，PV（計画価値）500万円，EV（アーンドバリュー）450万円，AC（実コスト）600万円であった。CPI（コスト効率指数）はいくらか。
    c: ['0.75', '0.9', '1.2', '1.33']
    a: ア
    exp: |
      CPI（コスト効率指数）= EV ÷ AC = 450 ÷ 600 = 0.75
      CPI が1未満なので、完了した作業の価値に対して実際のコストが多くかかっている（コスト超過）ことを表します。なお、SPI（スケジュール効率指数）= EV ÷ PV = 450 ÷ 500 = 0.9 で、スケジュールも遅れています。
    why:
      - 正解です。EV ÷ AC = 450 ÷ 600 = 0.75 です。
      - 0.9 は EV ÷ PV で求める SPI です。
      - 1.2 は AC ÷ PV で、CPI の式ではありません。
      - 1.33 は AC ÷ EV で、分子と分母が逆です。
    verify: { value: '450 / 600' }
    terms: [EVM]

  - id: A14-032
    topic: 14-7-3
    diff: 3
    q: 完成時総予算（BAC）が 2,000 万円のプロジェクトで，現時点の EV（アーンドバリュー）が 800 万円，AC（実コスト）が 1,000 万円である。残りの作業も現在までと同じコスト効率で進むと仮定したとき，完成時総コスト見積り（EAC）は何万円か。
    c: ['2,500万円', '2,200万円', '2,000万円', '1,600万円']
    a: ア
    exp: |
      現在までのコスト効率指数 CPI = EV ÷ AC = 800 ÷ 1,000 = 0.8 です。
      残作業の予算は BAC − EV = 2,000 − 800 = 1,200 万円で、これを CPI 0.8 で進めると、残りのコストは 1,200 ÷ 0.8 = 1,500 万円となります。
      EAC = AC + (BAC − EV) ÷ CPI = 1,000 + 1,500 = 2,500 万円
    why:
      - 正解です。1,000 + 1,200 ÷ 0.8 = 2,500万円です。
      - 2,200万円は、残りの作業が予算どおりに進む（CPI = 1）と仮定した AC + (BAC − EV) の値です。
      - 2,000万円は当初の予算（BAC）のままで、現在のコスト超過を反映していません。
      - 1,600万円は BAC × CPI で、コスト効率の使い方が逆です。
    verify: { value: '1000 + (2000 - 800) / (800 / 1000)' }
    terms: [EVM]

  - id: A14-033
