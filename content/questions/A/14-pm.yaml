    q: プロジェクトのリスク分析で用いる手法のうち，定量的分析に当たるものはどれか。
    c:
      - モンテカルロシミュレーションによって，プロジェクトの完了日やコストがとり得る値の確率分布を求める。
      - 発生確率と影響度をそれぞれ「高・中・低」で評価し，マトリックスに配置して優先順位を付ける。
      - 関係者がブレーンストーミングで，起こり得るリスクを洗い出す。
      - リスクの原因を分類した表を使って，リスクを漏れなく特定する。
    a: ア
    exp: |
      リスクの分析には、定性的分析と定量的分析があります。
      - 定性的分析：発生確率と影響度を「高・中・低」などの段階で評価し、発生確率・影響度マトリックスなどで優先順位を付ける
      - 定量的分析：リスクの影響を数値で分析する。モンテカルロシミュレーション、感度分析、期待金額価値（EMV）を用いたデシジョンツリー分析などがある
      なお、ブレーンストーミングやチェックリストはリスクの特定に用いる手法です。
    why:
      - 正解です。シミュレーションで確率分布を数値で求めるのは定量的分析です。
      - 段階評価とマトリックスによる優先順位付けは定性的分析です。
      - ブレーンストーミングはリスクの特定に用いる手法で、分析ではありません。
      - 原因の分類表を使うのはリスクの特定の手法です。
    terms: [定量的リスク分析, 定性的リスク分析, EMV]

  - id: A14-041
