category: '14'
reviewed: { at: '2026-10-21', method: '作成後の逐問レビュー（プロセス群・対象群・ツールと技法をシラバスVer.9.2の用語例と JIS Q 21500 の構成、PMBOK の定義と照合。日程・EVM・見積り・期待金額価値などの計算は検算式で独立に再計算）' }
questions:
  - id: A14-001
    topic: 14-1-1-1
    diff: 1
    q: プロジェクトの特徴として，適切なものはどれか。
    c:
      - 開始と終了の時期が定められた有期性の活動であり，独自の成果物やサービスを作り出す。
      - 同じ手順で同じ製品を繰り返し生産する，終わりのない定常的な業務である。
      - 終了の時期は定めず，成果が出るまで期限なく続ける。
      - 組織の中の1つの部署だけで完結する業務に限られる。
    a: ア
    exp: |
      プロジェクトは、独自のプロダクト、サービス、所産を創造するために実施する有期性の活動です。開始と終了が明確であること（有期性）と、過去に同じものがない成果を作ること（独自性）が特徴で、毎日同じ作業を繰り返す定常業務とは区別されます。目標が達成されたとき、又は目標を達成できないことが明らかになったときなどにプロジェクトは終了します。
    why:
      - 正解です。有期性と独自性がプロジェクトの特徴です。
      - 同じ作業を繰り返す業務は定常業務であり、プロジェクトではありません。
      - プロジェクトには終了の時期があり、期限なく続く活動ではありません。
      - プロジェクトは複数の部署や外部の組織にまたがって行われることも多くあります。
    terms: [プロジェクト]

  - id: A14-002
    topic: 14-1-1-1
    diff: 2
    q: プロジェクトマネジメントにおけるテーラリングの説明として，適切なものはどれか。
    c:
      - 標準的なプロセスや手法を，プロジェクトの規模や特性に合わせて取捨選択し，調整して適用する。
      - プロジェクトの作業を階層的に分解して，管理しやすい大きさにする。
      - プロジェクトの途中で，承認を得ずに作業範囲を広げていく。
      - プロジェクトの作業の一部を外部の事業者に委託する。
    a: ア
    exp: |
      テーラリングは、組織の標準プロセスや PMBOK などの標準に示されたプロセス・手法・成果物を、そのまま全部使うのではなく、プロジェクトの規模・複雑さ・リスクなどの特性に合わせて取捨選択し、調整して適用することです。洋服の仕立て（テーラー）が語源です。
    why:
      - 正解です。標準をプロジェクトの特性に合わせて調整します。
      - これは WBS の作成の説明です。
      - これはスコープクリープの説明です。
      - これは調達（外部委託）の説明です。
    terms: [テーラリング, WBS, スコープクリープ]

  - id: A14-003
    topic: 14-1-1-1
    diff: 3
    q: PMBOK ガイド第7版についての説明として，適切なものはどれか。
    c:
      - プロジェクトマネジメントの12の原理・原則と，8つのプロジェクト・パフォーマンス領域を中心に構成されている。
      - 10の知識エリアと49のプロセスで構成され，各プロセスのインプット，ツールと技法，アウトプットを規定している。
      - 日本産業規格として制定された，プロジェクトマネジメントの国内規格である。
      - ソフトウェア開発プロジェクトだけを対象としたガイドである。
    a: ア
    exp: |
      PMBOK（Project Management Body of Knowledge）は、米国の PMI がまとめたプロジェクトマネジメントの知識体系です。第6版までは知識エリアとプロセスを中心とする構成（第6版は10の知識エリア、49のプロセス）でしたが、第7版ではプロセスの記述をやめ、スチュワードシップや価値などの12の原理・原則と、ステークホルダーやチームなどの8つのパフォーマンス領域を中心とする構成に変わりました。
    why:
      - 正解です。第7版は原理・原則とパフォーマンス領域で構成されています。
      - これは第6版の構成です。
      - PMBOK は米国の PMI の知識体系です。日本産業規格は JIS Q 21500 です。
      - PMBOK は業種を問わず、さまざまなプロジェクトに適用できます。
    terms: [PMBOK, JIS Q 21500]

  - id: A14-004
    topic: 14-1-1-2
    diff: 2
    q: JIS Q 21500 で，プロジェクトで使用するプロセスの三つの主な種類として示されているものに含まれないものはどれか。
    c: ['監査のプロセス', 'プロジェクトマネジメントのプロセス', '引渡しのプロセス', '支援のプロセス']
    a: ア
    exp: |
      JIS Q 21500（プロジェクトマネジメントの手引）では、プロジェクトで使用するプロセスを次の三つの主な種類に分けています。
      - プロジェクトマネジメントのプロセス：プロジェクトを管理するためのプロセス
      - 引渡しのプロセス：プロジェクトの成果物（製品やサービス）を特定し、作成して引き渡すプロセス
      - 支援のプロセス：プロジェクトマネジメントや引渡しのプロセスを支援するプロセス
    why:
      - 正解です。監査のプロセスは三つの主な種類に含まれません。
      - プロジェクトマネジメントのプロセスは、三つの種類の一つです。
      - 引渡しのプロセスは、成果物を作成して引き渡す三つの種類の一つです。
      - 支援のプロセスは、他のプロセスを支援する三つの種類の一つです。
    terms: [JIS Q 21500]

  - id: A14-005
    topic: 14-1-1-3
    diff: 2
    q: JIS Q 21500 のプロジェクトマネジメントのプロセス群のうち，プロジェクト憲章の作成が属するものはどれか。
    c: ['立上げ', '計画', '実行', '管理']
    a: ア
    exp: |
      JIS Q 21500 では、プロジェクトマネジメントのプロセスを、立上げ、計画、実行、管理、終結 の五つのプロセス群に分類しています。プロジェクト憲章の作成は、プロジェクトを正式に開始させるためのプロセスであり、ステークホルダの特定やプロジェクトチームの編成とともに、立上げのプロセス群に属します。
    why:
      - 正解です。プロジェクト憲章の作成は立上げのプロセス群に属します。
      - 計画のプロセス群には、プロジェクト全体計画の作成や WBS の作成などが属します。
      - 実行のプロセス群には、プロジェクト作業の指揮や品質保証の実施などが属します。
      - 管理のプロセス群には、変更の管理やスケジュールの管理などが属します。
    terms: [プロジェクトマネジメントのプロセス群, プロジェクト憲章]

  - id: A14-006
    topic: 14-1-1-4
    diff: 1
    q: JIS Q 21500 のプロジェクトマネジメントの十の対象群に含まれないものはどれか。
    c: ['セキュリティ', 'ステークホルダ', '資源', '調達']
    a: ア
    exp: |
      JIS Q 21500 では、プロジェクトマネジメントのプロセスを、統合、ステークホルダ、スコープ、資源、時間、コスト、リスク、品質、調達、コミュニケーション の十の対象群（PMBOK の知識エリアに相当）に分類しています。セキュリティは対象群に含まれません。
    why:
      - 正解です。セキュリティは十の対象群に含まれません。
      - ステークホルダは、ステークホルダの特定などを含む対象群の一つです。
      - 資源は、プロジェクトチームの編成などを含む対象群の一つです。
      - 調達は、供給者の選定などを含む対象群の一つです。
    terms: [プロジェクトマネジメントの対象群, JIS Q 21500]

  - id: A14-007
    topic: 14-1-2-1
    diff: 2
    q: PMO（Project Management Office）の役割として，適切なものはどれか。
    c:
      - 組織内の複数のプロジェクトを横断的に支援し，プロジェクトマネジメントの標準化や教育，要員の調整などを行う。
      - 個々のプロジェクトの作業を担当し，成果物を作成する。
      - プロジェクトに資金を提供し，プロジェクトの開始を承認する。
      - プロジェクトの成果物を受け取って，業務で利用する。
    a: ア
    exp: |
      PMO は、組織内のプロジェクトマネジメントを横断的に支援する部門です。プロジェクトマネジメントの方法論や様式の標準化、プロジェクトマネージャへの支援や教育、複数のプロジェクト間の資源の調整、進捗やリスクの監視などを行います。
    why:
      - 正解です。複数のプロジェクトを横断的に支援・標準化します。
      - 成果物を作成するのはプロジェクトチームのメンバーです。
      - 資金の提供やプロジェクトの承認を行うのはプロジェクトスポンサーです。
      - 成果物を業務で利用するのは利用者（ユーザー部門）です。
    terms: [PMO, プロジェクトスポンサー]

  - id: A14-008
    topic: 14-2-2
    diff: 2
    q: プロジェクト憲章の説明として，適切なものはどれか。
    c:
      - プロジェクトを正式に認可し，プロジェクトマネージャを任命して資源を使用する権限を与える文書であり，目的や概要，主要なマイルストーンなどを記載する。
      - プロジェクトで作成する成果物と作業を階層的に分解した図である。
      - プロジェクトの完了時に，成功や失敗の要因を将来のプロジェクトのためにまとめた文書である。
      - プロジェクトのメンバーごとに，各作業に対する責任の種類を表にまとめたものである。
    a: ア
    exp: |
      プロジェクト憲章は、プロジェクトの立上げ時に作成し、スポンサーなどがプロジェクトの存在を正式に認可する文書です。プロジェクトの目的、目標、概要、主要なマイルストーン、予算の概要、主要なステークホルダ、プロジェクトマネージャとその権限などを記載します。プロジェクト全体計画を作成するときの基になります。
    why:
      - 正解です。プロジェクトを正式に認可し、PM に権限を与える文書です。
      - これは WBS の説明です。
      - これは得た教訓（教訓文書）の説明です。
      - これは責任分担マトリックス（RAM）の説明です。
    terms: [プロジェクト憲章, WBS, 得た教訓, 責任分担マトリックス]

  - id: A14-009
    topic: 14-2-3
    diff: 2
    q: プロジェクトの変更管理の進め方として，適切なものはどれか。
    c:
      - 承認済みのベースラインに対する変更要求は，影響を分析した後，変更管理委員会（CCB）などで承認された場合にだけ実施し，計画を更新する。
      - 顧客からの変更要求は，影響を分析せずにすべてそのまま受け入れる。
      - 変更要求は口頭で受け付け，記録を残さずに作業担当者の判断で実施する。
      - 一度承認したベースラインは，プロジェクトが終わるまでどのような理由があっても変更しない。
    a: ア
    exp: |
      変更管理では、承認されたベースライン（スコープ、スケジュール、コストなどの基準となる計画）に対する変更要求を記録し、スケジュールやコスト、品質への影響を分析したうえで、変更管理委員会（CCB：Change Control Board）などの権限をもつ者が承認するか却下するかを決めます。承認された変更だけを実施し、変更登録簿に記録して計画やベースラインを更新します。
    why:
      - 正解です。影響を分析し、承認された変更だけを実施します。
      - 影響を分析せずに受け入れると、スケジュールやコストが管理できなくなります。
      - 記録のない変更は、管理されないスコープの拡大（スコープクリープ）の原因になります。
      - 必要な変更は正式な手続を経て承認し、ベースラインを更新します。
    terms: [CCB, ベースライン, スコープクリープ]

  - id: A14-010
    topic: 14-2-2
    diff: 1
    q: プロジェクトやフェーズの終結時に，得た教訓を文書にまとめる主な目的として，適切なものはどれか。
    c:
      - プロジェクトでうまくいったことや問題点とその原因を記録し，組織の知識として将来のプロジェクトに活用する。
      - プロジェクトのメンバーの個人的な評価を決め，人事考課に反映する。
      - 顧客に対して，プロジェクトの責任を負わないことを確認する。
      - プロジェクトの開始を正式に認可する。
    a: ア
    exp: |
      得た教訓（教訓文書）は、プロジェクトの実施中や終結時に、うまくいったこと、うまくいかなかったこととその原因、改善策などをまとめたものです。組織のプロセス資産として蓄積し、将来の類似プロジェクトの計画や見積り、リスクの特定などに活用します。JIS Q 21500 では、得た教訓の収集は終結のプロセス群に含まれます。
    why:
      - 正解です。組織の知識として将来のプロジェクトに活かします。
      - 教訓文書は個人の評価を決めるためのものではありません。
      - 教訓文書は責任の免除を確認するためのものではありません。
      - プロジェクトの開始を正式に認可するのはプロジェクト憲章です。
    terms: [得た教訓, プロジェクト憲章]

  - id: A14-011
    topic: 14-3-2
    diff: 1
    q: プロジェクトのステークホルダの説明として，適切なものはどれか。
    c:
      - プロジェクトに影響を与える，又はプロジェクトの実施や結果から影響を受ける個人や組織であり，顧客やプロジェクトチームのほか，利用部門や供給者なども含む。
      - プロジェクトに出資している株主だけを指す。
      - プロジェクトマネージャとプロジェクトチームのメンバーだけを指す。
      - プロジェクトの成果物を利用する利用者だけを指す。
    a: ア
    exp: |
      ステークホルダ（利害関係者）は、プロジェクトに影響を及ぼす、又はプロジェクトから影響を受ける個人、グループ、組織です。スポンサー、顧客、利用者、プロジェクトマネージャ、プロジェクトチーム、供給者、関係部門などが含まれます。立上げの段階でステークホルダを特定し、ステークホルダ登録簿に名前や役割、期待、影響度などを記録します。
    why:
      - 正解です。プロジェクトに影響を与える、又は受ける個人や組織の全体を指します。
      - 株主はステークホルダの一部にすぎません。
      - プロジェクトマネージャやチームもステークホルダですが、それだけではありません。
      - 利用者もステークホルダですが、それだけではありません。
    terms: [ステークホルダ]

  - id: A14-012
    topic: 14-3-3
    diff: 2
    q: ステークホルダ分析で，ステークホルダをプロジェクトに対する権力（影響力）と関心度の高低で分類した。権力が大きく関心度も高いステークホルダへの対応として，最も適切なものはどれか。
    c:
      - 重点的に関与してもらい，緊密にコミュニケーションをとって管理する。
      - 権力が大きいので，プロジェクトの情報は一切伝えないようにする。
      - 関心が高いので，満足させる必要はなく，最低限の情報だけを伝える。
      - 対応の優先度は最も低いため，状況を監視するだけにとどめる。
    a: ア
    exp: |
      ステークホルダ分析では、権力（影響力）と関心度の2軸でステークホルダを分類し、対応方針を決める方法がよく使われます。
      - 権力が大きく関心も高い：重点的に管理する（緊密に連携する）
      - 権力が大きく関心は低い：満足した状態を保つ
      - 権力が小さく関心は高い：常に情報を提供する
      - 権力が小さく関心も低い：監視する
    why:
      - 正解です。最も重要なステークホルダとして緊密に関与してもらいます。
      - 影響力の大きいステークホルダに情報を伝えないと、後で大きな反対や手戻りが生じるおそれがあります。
      - 最低限の情報提供にとどめるのは、権力が小さく関心も低いステークホルダへの対応に近い考え方です。
      - 監視するだけにとどめるのは、権力が小さく関心も低いステークホルダへの対応です。
    terms: [ステークホルダ]

  - id: A14-013
    topic: 14-4-2
    diff: 1
    q: WBS（Work Breakdown Structure）の説明として，適切なものはどれか。
    c:
      - プロジェクトの成果物と作業を，管理しやすい大きさになるまで階層的に分解したもの
      - 作業の順序関係と所要日数を矢線と結合点で表した図
      - 横軸に時間をとり，作業ごとの開始と終了を横棒で表した図
      - 作業ごとに，担当者の責任の種類を表にまとめたもの
    a: ア
    exp: |
      WBS は、プロジェクトの成果物とそれを作るための作業を、上位から下位へ段階的に詳細化し、階層構造で表したものです。最下位の要素をワークパッケージといい、コストやスケジュールの見積り、担当者の割当ての単位になります。WBS に含まれない作業はプロジェクトのスコープに含まれないことになるため、スコープを明確にする役割もあります。
    why:
      - 正解です。成果物と作業を階層的に分解したものです。
      - これはアローダイアグラムの説明です。
      - これはガントチャートの説明です。
      - これは責任分担マトリックス（RAM）の説明です。
    terms: [WBS, ワークパッケージ, アローダイアグラム, ガントチャート, 責任分担マトリックス]

  - id: A14-014
    topic: 14-4-2
    diff: 2
    q: WBS 辞書の説明として，適切なものはどれか。
    c:
      - WBS の各要素について，作業の内容，成果物，担当組織，完了の基準などの詳細を記述した文書
      - プロジェクトで使う専門用語の意味をまとめた用語集
      - WBS の要素を作業の実施順に並べ替えた一覧
      - プロジェクトのメンバーの連絡先をまとめた名簿
    a: ア
    exp: |
      WBS 辞書は、WBS の各要素（特にワークパッケージ）について、作業の内容、成果物、担当する組織や人、スケジュールのマイルストーン、必要な資源、コストの見積り、完了の基準（受入れ基準）などの詳細を記述した文書です。WBS の図だけでは分からない作業の範囲を明確にし、関係者の認識の違いを防ぎます。
    why:
      - 正解です。WBS の各要素の詳細を記述した文書です。
      - 「辞書」という名前ですが、用語集ではありません。
      - 作業の実施順序は活動の順序付けで決め、スケジュールネットワーク図などで表します。
      - 名簿は WBS 辞書とは関係のない資料です。
    terms: [WBS辞書, WBS, ワークパッケージ]

  - id: A14-015
    topic: 14-4-3
    diff: 2
    q: ワークパッケージの説明として，適切なものはどれか。
    c:
      - WBS の最下位の要素であり，コストやスケジュールの見積りと管理，担当者の割当てを行う単位である。
      - WBS の最上位にある，プロジェクト全体を表す要素である。
      - プロジェクトに必要な機材やソフトウェアを1つにまとめた購入品の一覧である。
      - プロジェクトで作成したすべての文書を1つのファイルにまとめたものである。
    a: ア
    exp: |
      ワークパッケージは、WBS の最下位のレベルにある作業の単位です。これ以上分解しなくても、所要期間やコストを見積もって担当者を割り当て、進捗を管理できる大きさになっています。ワークパッケージは、さらにスケジュール作成のためのアクティビティ（活動）に分解されます。
    why:
      - 正解です。見積りや管理、担当の割当ての単位となる最下位の要素です。
      - WBS の最上位はプロジェクト全体（又は最終成果物）を表し、ワークパッケージではありません。
      - 購入品の一覧は調達の資料であり、ワークパッケージではありません。
      - 文書をまとめたものはワークパッケージではありません。
    terms: [ワークパッケージ, WBS]

  - id: A14-016
    topic: 14-4-3
    diff: 2
    q: プロジェクトスコープのクリープの説明として，適切なものはどれか。
    c:
      - 変更管理の手続を経ないまま，作業範囲や成果物が少しずつ拡大していくこと
      - 承認された変更要求に基づいて，正式にスコープを拡大すること
      - プロジェクトの作業範囲を明確にするために，WBS を作成すること
      - クリティカルパス上の作業に資源を追加して，期間を短縮すること
    a: ア
    exp: |
      スコープクリープは、顧客からの小さな追加要望などを正式な変更管理の手続を経ずに受け入れることが積み重なり、作業範囲（スコープ）が管理されないまま徐々に広がっていくことです。スケジュールの遅れやコストの超過の原因になるため、スコープを明確に定義し、変更は変更管理の手続で扱うことが重要です。
    why:
      - 正解です。管理されないままスコープが拡大していくことです。
      - 正式な手続を経たスコープの変更は、管理された変更であり、クリープではありません。
      - WBS の作成はスコープを明確にする作業で、クリープを防ぐ手段の一つです。
      - これはクラッシングの説明です。
    terms: [スコープクリープ, クラッシング]

  - id: A14-017
    topic: 14-5-3
    diff: 2
    q: 責任分担マトリックスの一種である RACI チャートで，A（Accountable）が表す役割として，適切なものはどれか。
    c:
      - 作業の結果について最終的な説明責任を負い，承認を行う者
      - 実際に作業を実行する責任を負う者
      - 作業を進めるうえで相談を受け，助言をする者
      - 作業の進捗や結果について報告を受ける者
    a: ア
    exp: |
      責任分担マトリックス（RAM：Responsibility Assignment Matrix）は、縦に作業（ワークパッケージなど）、横に要員や組織をとり、各作業に対する役割を表にしたものです。RACI チャートでは次の4種類の役割を割り当てます。
      - R（Responsible）：実行責任者。実際に作業を行う
      - A（Accountable）：説明責任者。作業の結果に最終的な責任を負い、承認する。1つの作業に1人だけ割り当てる
      - C（Consulted）：相談先。作業について助言する
      - I（Informed）：報告先。進捗や結果の報告を受ける
    why:
      - 正解です。A は最終的な説明責任を負う者です。
      - 作業を実行する者は R（Responsible）です。
      - 相談を受けて助言する者は C（Consulted）です。
      - 報告を受ける者は I（Informed）です。
    terms: [責任分担マトリックス]

  - id: A14-018
    topic: 14-5-2
    diff: 3
    q: 見積り工数が 120 人月のプロジェクトを，10人で12か月かけて完了する計画で開始した。4か月が経過した時点で完了した作業は 30 人月分であり，残りの作業量は計画どおり 90 人月である。残りの作業を当初の期限までに完了させるために，5か月目以降に必要な要員数は最低何人か。ここで，5か月目以降は1人が1か月に1人月分の作業を行い，追加要員の教育などによる生産性の低下は考えないものとする。
    c: ['12人', '10人', '11人', '14人']
    a: ア
    exp: |
      残りの期間は 12 − 4 = 8 か月、残りの作業量は 120 − 30 = 90 人月です。
      必要な要員数 = 90 人月 ÷ 8 か月 = 11.25 人
      要員数は整数なので、切り上げて 12 人が必要です。11 人では 11 × 8 = 88 人月しか作業できず、期限までに終わりません。
    why:
      - 正解です。90 ÷ 8 = 11.25 を切り上げて12人です。
      - 10人のままでは 10 × 8 = 80 人月しか作業できず、10人月分足りません。
      - 11人では 11 × 8 = 88 人月となり、2人月分足りません。
      - 14人は、遅れの分を当初の計画工数に単純に上乗せするなどの誤った計算です。必要最低限の人数ではありません。
    know: 実際のプロジェクトでは、遅れているプロジェクトに要員を追加すると、教育やコミュニケーションの負担が増えてかえって遅れることがあります（ブルックスの法則）。
    verify: { value: 'ceil((120 - 30) / (12 - 4))' }
    terms: [人月]

  - id: A14-019
    topic: 14-5-2
    diff: 1
    q: 開発規模が 36,000 ステップのプログラムを作成する。生産性が1人月当たり 600 ステップの要員を6人投入するとき，開発に必要な期間は何か月か。
    c: ['10か月', '6か月', '12か月', '60か月']
    a: ア
    exp: |
      必要な工数 = 開発規模 ÷ 生産性 = 36,000 ÷ 600 = 60 人月
      開発期間 = 工数 ÷ 要員数 = 60 人月 ÷ 6 人 = 10 か月
    why:
      - 正解です。60 人月 ÷ 6人 = 10か月です。
      - 6か月は要員数をそのまま期間とした誤りです。
      - 12か月は 36,000 ÷ 600 ÷ 5 のように、要員数を誤って計算した値です。
      - 60か月は工数（人月）を1人で作業した場合の期間で、6人で割っていません。
    verify: { value: '36000 / 600 / 6' }
    terms: [人月]

  - id: A14-020
    topic: 14-6-3
    diff: 2
    q: |
      次の作業からなるプロジェクトの最短の所要日数は何日か。

      | 作業 | 先行作業 | 所要日数 |
      | --- | --- | --- |
      | A | なし | 3 |
      | B | なし | 5 |
      | C | A | 4 |
      | D | A | 7 |
      | E | B，C | 2 |
      | F | D，E | 3 |
    c: ['13日（A→D→F）', '12日（A→C→E→F）', '10日（B→E→F）', '24日（全作業の合計）']
    a: ア
    exp: |
      開始から終了までの各経路の所要日数を求めます。
      - A → D → F：3 + 7 + 3 = 13 日
      - A → C → E → F：3 + 4 + 2 + 3 = 12 日
      - B → E → F：5 + 2 + 3 = 10 日
      プロジェクトは最も長い経路の作業がすべて終わるまで完了しないため、最短の所要日数は 13 日で、A → D → F がクリティカルパスです。
    why:
      - 正解です。最も長い経路 A→D→F の13日が最短の所要日数です。
      - 12日の経路 A→C→E→F は最長ではないため、この日数では D と F が終わりません。
      - 10日は最も短い経路の日数で、プロジェクト全体の所要日数ではありません。
      - 並行して実施できる作業があるため、全作業の合計日数にはなりません。
    verify: { value: 'max(3 + 7, max(5, 3 + 4) + 2) + 3' }
    terms: [アローダイアグラム, クリティカルパス]

  - id: A14-021
    topic: 14-6-3
    diff: 3
    q: |
      次の作業からなるプロジェクトで，作業 C の余裕日数（作業 C の開始を遅らせても，プロジェクト全体の完了が遅れない最大の日数）は何日か。

      | 作業 | 先行作業 | 所要日数 |
      | --- | --- | --- |
      | A | なし | 4 |
      | B | なし | 1 |
      | C | B | 3 |
      | D | A | 5 |
      | E | A，C | 3 |
      | F | D，E | 2 |
    c: ['2日', '0日', '1日', '3日']
    a: ア
    exp: |
      最早開始日（開始時点を0日とする）を前から求めます。
      - A：0、B：0、C：1（B の後）、D：4、E：max(4, 1 + 3) = 4、F：max(4 + 5, 4 + 3) = 9
      全体の所要日数は 9 + 2 = 11 日です。
      最遅開始日を後ろから求めます。
      - F：11 − 2 = 9、E：9 − 3 = 6、C：6 − 3 = 3
      作業 C の余裕日数 = 最遅開始日 − 最早開始日 = 3 − 1 = 2 日 です。
    why:
      - 正解です。最遅開始日3から最早開始日1を引いて2日です。
      - 余裕日数が0日になるのはクリティカルパス（A→D→F）上の作業です。C はクリティカルパス上にありません。
      - 1日は C の最早開始日であり、余裕日数ではありません。
      - 3日は C の最遅開始日であり、余裕日数は最早開始日との差です。
    verify: { value: '(() => { const esC = 1; const esE = max(4, esC + 3); const T = max(4 + 5, esE + 3) + 2; const lsE = (T - 2) - 3; const lsC = lsE - 3; return lsC - esC; })()' }
    terms: [アローダイアグラム, クリティカルパス]

  - id: A14-022
