      - ボトムアップ見積り：WBS のワークパッケージごとに見積もり、積み上げて全体を求める。精度は高いが手間がかかる
      - パラメトリック見積り：過去のデータから得た統計的な関係（単価 × 数量、規模と工数の関係式など）を使って算出する
      - 三点見積り：楽観値・最可能値・悲観値の3つの値から求める
