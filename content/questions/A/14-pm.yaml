    q: EVM で管理しているプロジェクトのある時点の値が，PV（計画価値）300万円，EV（アーンドバリュー）240万円，AC（実コスト）270万円であった。この時点のプロジェクトの状況として，適切なものはどれか。
    c:
      - スケジュールが遅れており，コストも超過している。
      - スケジュールは遅れているが，コストは予算内に収まっている。
      - スケジュールは計画より進んでいるが，コストは超過している。
      - スケジュールは計画より進んでおり，コストも予算内に収まっている。
    a: ア
    exp: |
      スケジュール差異 SV = EV − PV = 240 − 300 = −60 万円（負なので遅れ）
      コスト差異 CV = EV − AC = 240 − 270 = −30 万円（負なのでコスト超過）
      指数で見ても、SPI = 240 ÷ 300 = 0.8、CPI = 240 ÷ 270 ≒ 0.89 と、どちらも1未満です。
    why:
      - 正解です。SV、CV ともに負なので、遅れとコスト超過が生じています。
      - CV = 240 − 270 = −30 万円と負なので、コストは超過しています。
      - SV = 240 − 300 = −60 万円と負なので、スケジュールは遅れています。
      - SV と CV がともに負なので、遅れとコスト超過の両方が生じています。
    verify: { manual: 'SV=240-300=-60, CV=240-270=-30（ともに負）, SPI=0.8, CPI≒0.89 を確認' }
    terms: [EVM]

  - id: A14-034
    topic: 14-7-3
    diff: 2
    q: ファンクションポイント法の説明として，適切なものはどれか。
    c:
      - 外部入力や外部出力，内部論理ファイルなど，利用者から見たシステムの機能の数を複雑さで重み付けして数え，機能量からソフトウェアの規模を見積もる。
      - 完成したプログラムのソースコードの行数を数えて，規模を見積もる。
      - 過去の類似プロジェクトの実績を基に，担当者の経験から規模を見積もる。
      - 作業を細かく分解して，作業ごとの工数を積み上げて全体を見積もる。
    a: ア
    exp: |
      ファンクションポイント法（FP法）は、外部入力、外部出力、外部照会、内部論理ファイル、外部インタフェースファイルの5種類の機能について、それぞれの数を複雑さに応じた重みで点数化して合計し、システムの特性に基づく調整を行ってソフトウェアの規模（ファンクションポイント）を求める見積り手法です。利用者から見た機能を基に数えるため、プログラム言語に依存せず、要件定義などの早い段階から見積もることができます。
    why:
      - 正解です。利用者から見た機能を数えて重み付けし、規模を見積もります。
      - これは LOC 法（プログラムステップ法）の説明です。
      - これは類推見積りの説明です。
      - これはボトムアップ見積りの説明です。
    terms: [ファンクションポイント法, LOC法, 類推見積り, ボトムアップ見積り]

  - id: A14-035
    topic: 14-7-3
    diff: 3
    q: |
      ファンクションポイント法で，システムの機能を数えた結果と重み付け係数が次のとおりであった。補正係数を 1.2 とするとき，このシステムのファンクションポイントはいくらか。

      | 機能の種類 | 個数 | 重み付け係数 |
      | --- | --- | --- |
      | 外部入力 | 5 | 4 |
      | 外部出力 | 4 | 5 |
      | 外部照会 | 2 | 4 |
      | 内部論理ファイル | 2 | 10 |
      | 外部インタフェースファイル | 1 | 7 |
    c: ['90', '75', '62.5', '16.8']
    a: ア
    exp: |
      未調整のファンクションポイント = Σ（個数 × 重み付け係数）
      = 5 × 4 + 4 × 5 + 2 × 4 + 2 × 10 + 1 × 7 = 20 + 20 + 8 + 20 + 7 = 75
      ファンクションポイント = 75 × 補正係数 1.2 = 90
    why:
      - 正解です。75 × 1.2 = 90 です。
      - 75 は補正係数を掛ける前の未調整の値です。
      - 62.5 は 75 を補正係数で割った値で、掛け算と割り算が逆です。
      - 16.8 は個数の合計 14 に補正係数を掛けただけの値で、重み付け係数を考慮していません。
    verify: { value: '(5 * 4 + 4 * 5 + 2 * 4 + 2 * 10 + 1 * 7) * 1.2', tolerance: 0.001 }
    terms: [ファンクションポイント法]

