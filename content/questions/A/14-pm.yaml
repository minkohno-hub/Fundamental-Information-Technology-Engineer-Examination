  - id: A14-027
    topic: 14-6-3
    diff: 3
    q: プレシデンスダイアグラム法（PDM）で，「作業 A が終了してから3日後に作業 B を開始する」という関係の表し方として，適切なものはどれか。
    c:
      - 終了－開始関係（FS）で，3日のラグを設定する。
      - 開始－開始関係（SS）で，3日のリードを設定する。
      - 終了－終了関係（FF）で，3日のラグを設定する。
      - 終了－開始関係（FS）で，3日のリードを設定する。
    a: ア
    exp: |
      PDM は、作業を四角形（ノード）で表し、作業間の依存関係を矢印で表す図法です。依存関係には、終了－開始（FS）、開始－開始（SS）、終了－終了（FF）、開始－終了（SF）の4種類があります。
      - ラグ：先行作業に対して後続作業の開始（又は終了）を遅らせる待ち時間
      - リード：先行作業に対して後続作業を前倒しして開始できる期間
      「A の終了後3日たってから B を開始」は、FS 関係に3日のラグを設定して表します。
    why:
      - 正解です。A の終了から B の開始までの待ち時間は FS 関係のラグです。
      - SS は2つの作業の開始どうしの関係で、リードは前倒しを表すため、この関係を表せません。
      - FF は2つの作業の終了どうしの関係であり、B の開始の条件を表していません。
      - リードは後続作業を前倒しする期間で、A の終了の3日前に B を開始することになります。
    terms: [PDM]

  - id: A14-028
    topic: 14-6-3
    diff: 1
    q: プロジェクトのスケジュール管理で用いるマイルストーンの説明として，適切なものはどれか。
    c:
      - 要件定義の完了や顧客の承認など，プロジェクトの重要な節目となる時点
      - 1日単位で作成した，担当者ごとの詳細な作業予定
      - プロジェクトの作業を階層的に分解した最下位の要素
      - 作業の遅れによって発生した追加の費用
    a: ア
    exp: |
      マイルストーンは、工程の完了や成果物の承認、顧客への納品などの、プロジェクトの重要な節目となる時点（イベント）です。それ自体は所要期間をもたず、進捗を確認するための目印として、大日程計画（マスタスケジュール）などに設定します。
    why:
      - 正解です。重要な節目となる時点がマイルストーンです。
