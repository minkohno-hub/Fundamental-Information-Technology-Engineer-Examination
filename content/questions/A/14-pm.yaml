    q: プロジェクトの品質管理で管理図を用いる場合の読み方として，適切なものはどれか。
    c:
      - すべての点が管理限界線の内側にあっても，中心線の片側に連続して点が並ぶなどの癖がある場合は，工程に異常が生じている可能性を疑う。
      - 管理限界線は，顧客が要求する仕様の上限と下限をそのまま記入したものである。
      - 点が管理限界線の内側にあれば，点の並び方にかかわらず工程は常に安定していると判断する。
      - 不良の件数を原因別に多い順に並べ，重点的に対策すべき原因を見つける。
    a: ア
    exp: |
      管理図は、品質のデータを時系列に打点し、中心線と上方・下方の管理限界線（一般に平均 ± 3σ）を引いた図です。工程が統計的に安定しているかを判断するために用います。点が管理限界線を超えた場合だけでなく、中心線の片側に連続して点が並ぶ（連）や、上昇・下降が続く（傾向）などの癖がある場合も、工程に異常がある可能性があると判断します。管理限界線は工程のデータのばらつきから求めるもので、規格（仕様）の限界とは異なります。
    why:
      - 正解です。管理限界内でも、点の並びの癖から異常を疑います。
      - 管理限界線は工程のデータのばらつきから統計的に求めるもので、仕様の上限・下限とは異なります。
      - 管理限界内でも、連や傾向などの癖があれば異常の可能性があります。
      - これはパレート図の使い方です。
    terms: [管理図, パレート図]

  - id: A14-042
    topic: 14-9-3
    diff: 1
    q: プロジェクトで発生した不具合を原因別に集計し，件数の多い順に棒グラフで並べ，累積比率を折れ線グラフで重ねて表した。この図の名称と主な目的の組合せとして，適切なものはどれか。
    c:
      - パレート図であり，件数の多い重要な原因を見つけて重点的に対策する。
      - 管理図であり，工程が統計的に安定しているかを判断する。
      - 散布図であり，2つの変数の相関関係を調べる。
      - 特性要因図であり，結果と原因の関係を魚の骨の形で整理する。
    a: ア
    exp: |
      パレート図は、項目（不具合の原因など）を件数や金額の多い順に棒グラフで並べ、その累積比率を折れ線グラフで表した図です。全体に占める割合の大きい少数の重要な項目が一目で分かるため、優先的に対策すべき項目を決めるのに用います。ABC 分析にも使われます。
    why:
      - 正解です。重点的に対策すべき項目を見つけるパレート図です。
      - 管理図は、時系列のデータと管理限界線で工程の安定を判断する図です。
      - 散布図は、2つの変数の値を点で打って相関を見る図です。
      - 特性要因図は、結果と原因の関係を魚の骨のような形で整理する図です。
    terms: [パレート図, 管理図]

  - id: A14-043
    topic: 14-11-3
    diff: 2
    q: プロジェクトのメンバーが6人から10人に増えた。メンバー間の1対1のコミュニケーションチャネル（伝達経路）の数は，いくつ増えるか。
    c: ['30', '4', '15', '45']
    a: ア
    exp: |
      n 人のメンバー間の1対1のコミュニケーションチャネルの数は、n(n − 1) ÷ 2 で求めます。
      - 6人のとき：6 × 5 ÷ 2 = 15
      - 10人のとき：10 × 9 ÷ 2 = 45
      増える数は 45 − 15 = 30 です。メンバーが増えると、チャネルの数は人数の2乗に近い割合で増え、調整の負担が大きくなります。
    why:
      - 正解です。45 − 15 = 30 増えます。
      - 4 は増えたメンバーの人数で、チャネルの増加数ではありません。
      - 15 は6人のときのチャネルの数です。
      - 45 は10人のときのチャネルの数で、増加数ではありません。
    verify: { value: '10 * 9 / 2 - 6 * 5 / 2' }
    terms: [コミュニケーションチャネル]

  - id: A14-044
    topic: 14-11-3
    diff: 2
    q: プロジェクトのコミュニケーションの方法のうち，プル型コミュニケーションに当たるものはどれか。
    c:
      - プロジェクトの文書をイントラネットの共有サイトに掲載し，必要な人が自分でアクセスして入手する。
      - 進捗報告書を，関係者に電子メールで一斉に送信する。
      - 関係者がテレビ会議に参加し，その場で質疑応答を行う。
      - 担当者のボイスメールに，連絡事項を録音して送る。
    a: ア
    exp: |
      コミュニケーションの方法は、主に次の3つに分類されます。
      - 双方向コミュニケーション：会議、電話、テレビ会議など、複数の人がリアルタイムで情報を交換する
      - プッシュ型コミュニケーション：電子メール、ボイスメール、文書の送付など、特定の受け手に情報を送る。相手が読んだかどうかは確認しにくい
      - プル型コミュニケーション：イントラネットや掲示板、データベースなどに情報を置き、受け手が必要なときに自分で取りに行く。多数の受け手に大量の情報を提供するのに向く
    why:
      - 正解です。受け手が自分で情報を取りに行くのはプル型です。
      - 電子メールで特定の相手に送るのはプッシュ型です。
      - テレビ会議でリアルタイムにやり取りするのは双方向コミュニケーションです。
      - ボイスメールを送るのはプッシュ型です。
    terms: [プル型コミュニケーション, プッシュ型コミュニケーション]

  - id: A14-045
    topic: 14-10-3
    diff: 2
    q: 発注者が，受注者の要員に対して直接作業の指示（指揮命令）を行うことができる契約形態はどれか。
    c: ['労働者派遣契約', '請負契約', '準委任契約', 'ソフトウェア使用許諾契約']
    a: ア
    exp: |
      労働者派遣契約では、派遣元が雇用する労働者を派遣先に派遣し、派遣先が労働者に直接作業の指示（指揮命令）を行います。一方、請負契約や準委任契約では、受注者が自社の要員に指示を行い、発注者が受注者の要員に直接指揮命令することはできません。請負契約や準委任契約で発注者が直接指揮命令を行うと、偽装請負として違法になるおそれがあります。
    why:
      - 正解です。派遣先（発注者）が派遣労働者に指揮命令を行います。
      - 請負契約では受注者が要員に指示を行い、発注者は直接指揮命令できません。
      - 準委任契約でも受注者が要員に指示を行い、発注者は直接指揮命令できません。
      - ソフトウェア使用許諾契約はソフトウェアの使用条件を定める契約で、作業の指示とは関係がありません。
    terms: [労働者派遣契約, 請負契約, 準委任契約]

  - id: A14-046
    topic: 14-10-3
    diff: 2
    q: システム開発を外部に委託する際の請負契約と準委任契約の違いの説明として，適切なものはどれか。
    c:
      - 請負契約では受注者が仕事の完成を約束し，成果物に不具合があれば契約不適合責任を負うが，準委任契約では受注者は善良な管理者の注意をもって業務を遂行する義務を負い，原則として仕事の完成義務は負わない。
      - 請負契約では受注者は仕事の完成義務を負わないが，準委任契約では必ず成果物を完成させる義務を負う。
      - 請負契約でも準委任契約でも，発注者が受注者の要員に直接作業を指示する。
      - 請負契約は要件定義などの上流工程にだけ，準委任契約はプログラミングにだけ用いることが法律で決められている。
    a: ア
    exp: |
      請負契約は、受注者が仕事の完成を約束し、発注者がその結果に対して報酬を支払う契約です。成果物が契約の内容に適合しない場合、受注者は契約不適合責任を負います。準委任契約は、受注者が事務処理（業務の遂行）を引き受ける契約で、受注者は善良な管理者の注意義務（善管注意義務）を負いますが、原則として仕事の完成義務は負いません。要件定義のように成果を確定しにくい工程では準委任契約、設計・プログラミングのように成果物を定めやすい工程では請負契約がよく用いられますが、法律で決められているわけではありません。
    why:
      - 正解です。請負は完成義務、準委任は善管注意義務が中心です。
      - 完成義務を負うのは請負契約であり、説明が逆です。
      - どちらの契約でも、受注者が自社の要員に指示を行います。
      - 工程ごとの契約形態の使い分けは慣行であり、法律で決められているものではありません。
    terms: [請負契約, 準委任契約]

  - id: A14-047
    topic: 14-10-3
    diff: 2
    q: システムの調達で用いる RFI と RFP の説明として，適切なものはどれか。
    c:
      - RFI はベンダーに技術や製品などの情報の提供を依頼するもので，RFP はシステムの要件などを示してベンダーに具体的な提案書の提出を依頼するものである。一般に RFI を先に行う。
      - RFI は提案書の提出を依頼するもので，RFP は情報の提供を依頼するものである。一般に RFP を先に行う。
      - RFI も RFP も，ベンダーとの間で締結する契約書である。
      - RFP は，ベンダーが発注者に提出する見積書のことである。
    a: ア
    exp: |
      システムを外部から調達するときは、一般に次の順で進めます。
      1. RFI（Request For Information：情報提供依頼）で、ベンダーに技術動向や製品・サービスの情報の提供を依頼する
      2. 集めた情報を基にシステムの要件をまとめ、RFP（Request For Proposal：提案依頼書）を作成してベンダーに提示し、提案書の提出を依頼する
      3. 提案書や見積書を評価してベンダーを選定し、契約を締結する
    why:
      - 正解です。RFI で情報を集めた後、RFP で提案を依頼します。
      - RFI と RFP の説明と順序が逆です。
      - RFI も RFP も依頼のための文書であり、契約書ではありません。
      - RFP は発注者が作成してベンダーに提示する文書です。見積書はベンダーが提出します。
    terms: [RFI, RFP]

  - id: A14-048
    topic: 14-10-3
    diff: 3
    q: プロジェクトの調達における契約のタイプのうち，発注者にとってコスト超過のリスクが最も小さいものはどれか。
    c:
      - 定額契約（あらかじめ決めた固定の金額を支払う契約）
      - 実費償還契約（実際にかかったコストに一定の報酬を加えて支払う契約）
      - タイムアンドマテリアル契約（作業時間に単価を掛けた額と材料費を支払う契約）
      - コストに一定の割合の報酬を上乗せして支払う契約
    a: ア
    exp: |
      契約のタイプによって、コスト超過のリスクを誰が負うかが異なります。
      - 定額契約（固定価格契約）：金額があらかじめ固定されているため、コストが超過しても受注者の負担となり、発注者のリスクは小さい。スコープが明確な場合に向く
      - 実費償還契約（コストプラス契約）：実際にかかったコストに報酬を加えて支払うため、コスト超過のリスクは発注者が負う
      - タイムアンドマテリアル契約：作業時間と材料費に応じて支払うため、作業が長引くと発注者の支払いが増える
    why:
      - 正解です。金額が固定されるため、発注者のコスト超過リスクは最も小さくなります。
      - 実費償還契約では、コストが増えるとその分を発注者が支払うため、発注者のリスクが大きくなります。
      - タイムアンドマテリアル契約では、作業時間が増えると発注者の支払いが増えます。
      - コストに一定の割合を上乗せする契約は実費償還契約の一種で、コストが増えるほど発注者の支払いも増えます。
    terms: [定額契約]
