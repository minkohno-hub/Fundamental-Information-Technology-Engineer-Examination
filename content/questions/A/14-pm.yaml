    q: プロジェクトのマイナスのリスクへの対応戦略のうち，転嫁に当たるものはどれか。
    c:
      - 開発が遅れたときの損害に備えて保険に加入し，損失の影響を第三者に移す。
      - リスクの原因となる新技術の採用をやめ，実績のある技術に変更する。
      - 不具合の発生確率を下げるために，レビューの回数を増やす。
      - リスクが発生したときの対応をあらかじめ決めておき，予備費を確保して受け入れる。
    a: ア
    exp: |
      PMBOK では、マイナスのリスク（脅威）への対応戦略として次のものを挙げています。
      - 回避：計画を変更するなどして、リスクの原因そのものを取り除く
      - 転嫁：保険や契約などによって、リスクの影響と対応の責任を第三者に移す
      - 軽減：発生確率や影響度を許容できる程度まで下げる
      - 受容：特に対策をとらずに受け入れる。予備費や対応計画を用意する能動的な受容もある
    why:
      - 正解です。保険によって損失の影響を第三者に移すのは転嫁です。
      - リスクの原因となる技術の採用をやめるのは回避です。
      - 発生確率を下げる対策は軽減です。
      - 予備費などを用意してリスクを受け入れるのは受容です。
    terms: [プロジェクトのリスク対応戦略, リスク対応]

  - id: A14-039
    topic: 14-8-3
    diff: 2
    q: |
      プロジェクトで次の3つのリスクを特定した。これらのリスクによる損失額の期待値（期待金額価値）の合計は何万円か。

      | リスク | 発生確率 | 発生したときの損失額 |
      | --- | --- | --- |
      | R1 | 30％ | 200万円 |
      | R2 | 10％ | 500万円 |
      | R3 | 5％ | 1,000万円 |
    c: ['160万円', '1,700万円', '約567万円', '45万円']
    a: ア
    exp: |
      期待金額価値（EMV）は、発生確率 × 影響額 で求めます。
      - R1：0.3 × 200 = 60 万円
      - R2：0.1 × 500 = 50 万円
      - R3：0.05 × 1,000 = 50 万円
      合計は 60 + 50 + 50 = 160 万円です。リスクの定量的分析で、予備費の設定や対策の優先度を判断する際に用います。
    why:
      - 正解です。各リスクの発生確率 × 損失額の合計は160万円です。
      - 1,700万円は損失額を単純に合計した値で、発生確率を考慮していません。
      - 約567万円は損失額の単純平均で、期待値ではありません。
      - 45万円は発生確率の合計（45％）を数値にしただけで、損失額を考慮していません。
    verify: { value: '0.3 * 200 + 0.1 * 500 + 0.05 * 1000', tolerance: 0.001 }
    terms: [EMV]

  - id: A14-040
    topic: 14-8-3
