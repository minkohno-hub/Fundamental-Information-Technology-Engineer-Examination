    q: スケジュール短縮の技法であるファストトラッキングの説明として，適切なものはどれか。
    c:
      - 本来は順番に行う予定だった作業の一部を並行して行うことで，期間を短縮する。
      - クリティカルパス上の作業に要員などの資源を追加投入して，期間を短縮する。
      - 資源の使用量が一定になるように，余裕のある作業の開始時期をずらす。
      - プロジェクトの作業範囲を縮小して，作業量そのものを減らす。
    a: ア
    exp: |
      スケジュールを短縮する主な技法には、ファストトラッキングとクラッシングがあります。
      - ファストトラッキング：順番に実施する予定だった作業を並行して実施する。コストはあまり増えないが、前の作業の結果が変わると手戻りが発生するリスクが高まる
      - クラッシング：クリティカルパス上の作業に資源（要員、残業など）を追加して所要期間を短縮する。コストが増える
    why:
      - 正解です。作業を並行して行うのがファストトラッキングです。
      - これはクラッシングの説明です。
      - これは資源平準化の説明です。期間はかえって延びることがあります。
      - スコープの縮小はスケジュール短縮の技法ではなく、スコープの変更です。
    terms: [ファストトラッキング, クラッシング]

  - id: A14-025
    topic: 14-6-3
    diff: 3
    q: |
      作業 A，B，C を順番に行い，それと並行して作業 D を行うプロジェクトがある。プロジェクトの期間を現在の12日から2日短縮して10日にしたい。各作業の所要日数，短縮できる最大日数，1日短縮するのに必要な追加費用は次のとおりである。追加費用の合計を最小にするとき，その額は何万円か。

      | 作業 | 所要日数 | 短縮できる最大日数 | 1日短縮当たりの追加費用 |
      | --- | --- | --- | --- |
      | A | 5 | 2 | 30万円 |
      | B | 4 | 1 | 20万円 |
      | C | 3 | 2 | 25万円 |
      | D | 10 | 3 | 10万円 |
    c: ['45万円', '50万円', '40万円', '20万円']
    a: ア
    exp: |
      A → B → C の経路が 5 + 4 + 3 = 12 日でクリティカルパス、D は 10 日です。10 日にするには A → B → C を2日短縮すればよく、D は短縮する必要がありません。
      費用の安い順に短縮します。B を1日（20万円、最大1日）、次に安い C を1日（25万円）短縮すると、合計 20 + 25 = 45 万円で2日短縮できます。C を2日短縮する場合は50万円、A と B を1日ずつ短縮する場合も50万円となり、45万円が最小です。
    why:
      - 正解です。B を1日、C を1日短縮して45万円が最小です。
      - 50万円は C を2日短縮した場合などで、最小ではありません。
      - 40万円は B を2日短縮した場合の額ですが、B は1日しか短縮できません。
      - 20万円は D を2日短縮した場合の額ですが、D はクリティカルパス上にないため、短縮しても全体の期間は短くなりません。
    verify: { value: 'min(20 + 25, 25 * 2, 30 * 2, 30 + 20, 30 + 25)' }
    terms: [クラッシング, クリティカルパス]

