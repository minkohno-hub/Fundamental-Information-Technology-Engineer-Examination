questions:
  - id: A14-501
    topic: 14-7-3
    diff: 3
    q: |
      EVM で管理しているプロジェクトの現時点の値は，完成時総予算（BAC）が 3,000 万円，EV（アーンドバリュー）が 900 万円，AC（実コスト）が 1,200 万円である。今後も，現時点までと同じコスト効率で作業が進むと仮定する。完了までに必要となる残りの作業のコスト（完了時総コスト見積りから AC を引いた ETC）は何万円か。
    c:
      - 2,800 万円
      - 2,100 万円
      - 1,800 万円
      - 4,000 万円
    a: ア
    scope: 14-7-3 コストの対象群のツールと技法 EVM。EV・AC・BAC から CPI と予測値を求める計算は、シラバスの EVM の用語例（EV、AC、BAC、EAC）の範囲内で、追加知識は不要。
    prereq: EV・AC・BAC の意味、CPI = EV ÷ AC、EAC と ETC の関係
    hard: 残作業を「現在のコスト効率で進める」という条件を読み取り、CPI を使った補正と、予算どおりに進む場合・EAC との取り違えを避ける必要がある。
    exp: |
      現時点までのコスト効率 CPI（コスト効率指数）を求め、残りの作業の予算を CPI で割ります。

      - CPI = EV ÷ AC = 900 ÷ 1,200 = 0.75
      - 残りの作業の予算 = BAC − EV = 3,000 − 900 = 2,100 万円
      - ETC = 2,100 ÷ 0.75 = 2,800 万円

      つまり、これまでは 1 万円分の価値を生むのに約 1.33 万円かかっており、そのペースが続くと残りの 2,100 万円分の作業に 2,800 万円かかります。
      なお、このときの EAC（完了時総コスト）は AC + ETC = 1,200 + 2,800 = 4,000 万円です。
    why:
      - 正解です。（3,000 − 900）÷ 0.75 = 2,800 万円です。
      - 残作業が予算どおり（CPI = 1）に進むと仮定した場合の BAC − EV です。問題は現在の効率が続く前提なので誤りです。
      - BAC − AC は「予算の残額」であり、残りの作業量の価値（BAC − EV）ではないので ETC になりません。
      - BAC ÷ CPI で求めた完了時総コスト（EAC）です。問われているのは AC を含まない残りのコスト（ETC）なので誤りです。
    know: ETC は残りのコスト、EAC は完了時の総コストで EAC = AC + ETC。残りが予算どおりなら ETC = BAC − EV、現在の効率が続くなら ETC = (BAC − EV) ÷ CPI。前提の言い回しで式が変わる点と、EAC と ETC の取り違えに注意する。
    terms: [EVM, ETC, EAC, BAC, コスト効率指数]
    verify: { value: '(3000 - 900) / (900 / 1200)' }

  - id: A14-502
    topic: 14-6-3
    diff: 4
    q: |
      あるプロジェクトは，完成時総予算（BAC）が 1,200 万円，計画期間が 12 か月で，毎月 100 万円分ずつ均等に作業が進む計画である。6 か月経過した時点の EV（アーンドバリュー）は 450 万円，AC（実コスト）は 480 万円であった。今後も，現時点までと同じスケジュール効率（SPI）で作業が進むと仮定すると，プロジェクトの完了は開始から何か月後と予測されるか。
    c:
      - 16 か月後
      - 13.5 か月後
      - 14 か月後
      - 15 か月後
    a: ア
    scope: 14-6-3 時間の対象群のツールと技法 EVM。SPI = EV ÷ PV を作業の進み方の比と見なして完了時期を予測する計算で、EVM の用語例（PV、EV、SPI）の範囲内の考え方である。
    prereq: PV・EV・SPI の定義、SPI がスケジュール効率（進み方の比）であること
    hard: AC は使わないことを見抜き、PV と EV から SPI を求め、残りの作業量を実際のペースで割る多段階の推論が必要。遅れ分を単純加算する誤りが紛れやすい。
    exp: |
      スケジュールの予測には、SPI（スケジュール効率指数）を使います。AC はコストの指標なので使いません。

      - 6 か月時点の PV = 100 万円 × 6 = 600 万円
      - SPI = EV ÷ PV = 450 ÷ 600 = 0.75
      - 実際の進み方は計画の 0.75 倍なので、1 か月当たり 100 × 0.75 = 75 万円分
      - 残りの作業の価値 = BAC − EV = 1,200 − 450 = 750 万円
      - 残りの期間 = 750 ÷ 75 = 10 か月
      - 完了時期 = 6 + 10 = 16 か月後（計画期間 12 ÷ 0.75 = 16 とも一致）
    why:
      - 正解です。残り 750 万円分を月 75 万円で進めると 10 か月かかり、6 + 10 = 16 か月後です。
      - 12 + （600 − 450）÷ 100 = 13.5 の考え方です。今後は計画どおりのペース（月 100 万円）に戻る前提になり、SPI が続く前提と合いません。
      - 6 + 6 ÷ 0.75 = 14 の計算です。残りの作業量を「残りの計画期間 6 か月分」と見なしていますが、実際に残っている作業は 6 か月分より多い（750 万円分）ので誤りです。
      - 12 × （1 + 0.25）= 15 の計算です。SPI = 0.75 の逆数ではなく「遅れ率 25％ を足す」と誤っています。正しくは 12 ÷ 0.75 です。
    know: 完了時期の予測は「計画期間 ÷ SPI」で求められる（前提は現在のスケジュール効率が続くこと）。AC はコスト予測にのみ使い、時間の予測には使わない。遅れの割合を足す計算と、割る計算を取り違えやすい。
    terms: [EVM, SPI, 計画価値, アーンドバリュー]
    verify: { value: '6 + (1200 - 450) / (100 * (450 / 600))' }

  - id: A14-503
    topic: 14-6-3
    diff: 3
    q: |
      EVM で管理しているプロジェクトのある時点の値が，PV（計画価値）400 万円，EV（アーンドバリュー）440 万円，AC（実コスト）520 万円であった。この時点の状況の説明として，適切なものはどれか。
    c:
      - スケジュール差異は +40 万円で計画より進んでいるが，コスト差異は −80 万円でコスト超過である。
      - AC が PV を上回っているので，計画より遅れており，コストも超過している。
      - スケジュール差異は EV − AC = −80 万円で遅れており，コスト差異は EV − PV = +40 万円でコストは予算内である。
      - SPI は PV ÷ EV = 0.91 で 1 未満なので遅れており，CPI は AC ÷ EV = 1.18 で 1 を超えているのでコストは予算内である。
    a: ア
    scope: 14-6-3 時間の対象群のツールと技法 EVM。SV = EV − PV、CV = EV − AC、SPI = EV ÷ PV、CPI = EV ÷ AC の正しい適用はシラバスの EVM の範囲内。
    prereq: SV・CV・SPI・CPI の定義と、正負・1 との大小が表す意味
    hard: 三つの値のうち、どの差・どの比が進捗とコストを表すかを正しく選ぶ必要がある。式の取り違えや、値の大小の直感的な読み違いが誤答になる。
    exp: |
      EVM の指標は、EV を基準にして求めます。

      | 指標 | 式 | 値 | 意味 |
      | --- | --- | --- | --- |
      | SV | EV − PV | 440 − 400 = +40 | 計画より進んでいる |
      | CV | EV − AC | 440 − 520 = −80 | コスト超過 |
      | SPI | EV ÷ PV | 440 ÷ 400 = 1.10 | 1 以上で進んでいる |
      | CPI | EV ÷ AC | 440 ÷ 520 ≒ 0.85 | 1 未満でコスト効率が悪い |

      進捗は EV と PV の比較、コストは EV と AC の比較で判断します。AC と PV を直接比べても意味のある指標にはなりません。
    why:
      - 正解です。SV = +40 で進んでおり、CV = −80 でコスト超過です。
      - AC と PV の比較は進捗の指標になりません。進捗は EV と PV で見るため、実際には計画より進んでいます。
      - SV と CV の式を入れ替えた誤りです。SV は EV − PV、CV は EV − AC で求めます。
      - SPI と CPI の分子・分母を逆にした誤りです。SPI = EV ÷ PV = 1.10、CPI = EV ÷ AC ≒ 0.85 で、結論も逆になります。
    know: すべての指標は EV が基準（SV = EV − PV、CV = EV − AC、SPI = EV ÷ PV、CPI = EV ÷ AC）。差異は 0 未満、効率指数は 1 未満が悪い状態。PV と AC を直接比べて進捗やコストを判断しないこと。
    terms: [EVM, スケジュール差異, コスト差異, SPI, コスト効率指数]
    verify: { manual: 'SV = 440-400 = +40、CV = 440-520 = -80、SPI = 440/400 = 1.1、CPI = 440/520 = 0.846 を独立に再計算し、これらに合致するのは正解の記述のみであることを確認した。' }

  - id: A14-504
    topic: 14-6-3
    diff: 2
    q: |
      次の 3 つの作業からなるプロジェクトを EVM で管理している。現時点の AC（実コスト）の合計は 800 万円である。現時点の SPI（スケジュール効率指数）はいくつか。ただし，EV は各作業の予算に実績進捗率を掛けて求め，PV は各作業の予算に計画進捗率を掛けて求める。

      | 作業 | 予算 | 現時点の計画進捗率 | 現時点の実績進捗率 |
      | --- | --- | --- | --- |
      | A | 400 万円 | 100％ | 100％ |
      | B | 600 万円 | 80％ | 50％ |
      | C | 500 万円 | 20％ | 0％ |
    c:
      - 0.71
      - 0.82
      - 0.88
      - 1.40
    a: ア
    scope: 14-6-3 時間の対象群のツールと技法 EVM。作業ごとの進捗率から PV と EV を集計して SPI を求める手順は、EVM の基本計算の範囲内。
    prereq: PV・EV の求め方（予算 × 進捗率）、SPI = EV ÷ PV
    exp: |
      作業ごとに PV と EV を求めて合計し、SPI = EV ÷ PV を計算します。

      | 作業 | PV | EV |
      | --- | --- | --- |
      | A | 400 × 1.0 = 400 | 400 × 1.0 = 400 |
      | B | 600 × 0.8 = 480 | 600 × 0.5 = 300 |
      | C | 500 × 0.2 = 100 | 500 × 0 = 0 |
      | 合計 | 980 | 700 |

      SPI = 700 ÷ 980 ≒ 0.71 です。AC（800 万円）は SPI の計算には使いません。
    why:
      - 正解です。EV 700 ÷ PV 980 ≒ 0.71 です。
      - AC ÷ PV = 800 ÷ 980 ≒ 0.82 の計算です。AC はコストの指標で、スケジュール効率には使いません。
      - EV ÷ AC = 700 ÷ 800 = 0.875 で、これは CPI（コスト効率指数）です。SPI ではありません。
      - PV ÷ EV = 980 ÷ 700 = 1.40 で、分子と分母が逆です。1 を超えるので進んでいると誤解します。
    know: PV は「計画上ここまで終わっているはずの価値」、EV は「実際に終わった作業の価値」。SPI は EV ÷ PV、CPI は EV ÷ AC。問題文に AC があっても SPI には使わない（余分な数値に惑わされない）。
    terms: [EVM, SPI, 計画価値, アーンドバリュー]
    verify: { value: '(400 * 1 + 600 * 0.5 + 500 * 0) / (400 * 1 + 600 * 0.8 + 500 * 0.2)', tolerance: 0.01 }

  - id: A14-505
    topic: 14-6-3
    diff: 3
    q: |
      次の作業からなるプロジェクトのクリティカルパスはどれか。

      | 作業 | 先行作業 | 所要日数 |
      | --- | --- | --- |
      | A | なし | 3 |
      | B | なし | 4 |
      | C | A | 5 |
      | D | A | 2 |
      | E | B | 6 |
      | F | C，D | 4 |
      | G | E，F | 3 |
    c:
      - A → C → F → G
      - A → D → F → G
      - B → E → G
      - A → C → F → G と B → E → G の 2 本
    a: ア
    scope: 14-6-3 スケジュールネットワーク分析、アローダイアグラム、CPM。表形式のネットワークから最長経路を求めることは、シラバスの用語例の範囲内。
    prereq: クリティカルパスの定義（最長の経路）と、複数の先行作業をもつ作業の扱い
    hard: 先行作業が複数ある作業（F、G）を含む複数経路の長さを正しく比べる必要がある。作業の数が多い経路や、始点の違う経路を直感で選ぶと誤る。
    exp: |
      開始から終了までの経路ごとに所要日数を合計し、最長のものがクリティカルパスです。

      | 経路 | 計算 | 日数 |
      | --- | --- | --- |
      | A → C → F → G | 3 + 5 + 4 + 3 | 15 |
      | A → D → F → G | 3 + 2 + 4 + 3 | 12 |
      | B → E → G | 4 + 6 + 3 | 13 |

      最長は 15 日の A → C → F → G で、これがクリティカルパスです。B → E → G は 13 日なので 2 日の余裕があります。
    why:
      - 正解です。合計 3 + 5 + 4 + 3 = 15 日で、全経路のうち最長です。
      - この経路は 12 日で、C（5 日）より短い D（2 日）を通るため最長ではありません。
      - 13 日の経路です。個々の作業の所要日数が最大の E（6 日）を含むため選びやすいですが、全体の最長ではありません。
      - 2 本が同じ長さ（クリティカルパスが 2 本）になるのは、B → E → G が 15 日のときです。実際は 13 日なので誤りです。
    know: クリティカルパスは「開始から終了までの最長経路」で、その上の作業は余裕が 0 日。所要日数が最大の作業を含む経路や、作業数の多い経路が最長とは限らない。余裕のない経路は複数存在することもある。
    terms: [クリティカルパス, アローダイアグラム, クリティカルパス法]
    verify: { manual: '全経路を列挙して計算した。A-C-F-G = 3+5+4+3 = 15、A-D-F-G = 12、B-E-G = 13。最長は 15 日の A-C-F-G のみ。' }

  - id: A14-506
    topic: 14-6-3
    diff: 3
    q: |
      次の作業からなるプロジェクトを最短の日数で完了させる。プロジェクトの開始時点を 0 日目とするとき，作業 E の最遅開始日（プロジェクト全体の完了を遅らせない範囲で，作業 E を開始できる最も遅い日）は何日目か。

      | 作業 | 先行作業 | 所要日数 |
      | --- | --- | --- |
      | A | なし | 4 |
      | B | なし | 3 |
      | C | A | 6 |
      | D | A，B | 5 |
      | E | B | 2 |
      | F | C，D | 4 |
      | G | D，E | 5 |
      | H | F，G | 3 |
    c:
      - 7 日目
      - 3 日目
      - 9 日目
      - 12 日目
    a: ア
    scope: 14-6-3 スケジュールネットワーク分析（最早・最遅の考え方、余裕）。後続作業から逆算して最遅開始日を求める手順は、シラバスのスケジュール管理の範囲内。
    prereq: 前進計算（最早）と後退計算（最遅）、最遅開始日 = 最遅完了日 − 所要日数
    hard: プロジェクト全体の所要日数を前進計算で求めた後、後退計算で複数の後続（E は G のみ）をたどる 2 段階の推論が必要。最早開始日や終了日との取り違えが起こりやすい。
    exp: |
      まず前進計算で全体の所要日数を求め、次に終了から逆算します。

      - 前進計算：A 4、B 3、C 10、D 9、F 14、G は D の完了 9 日目から開始して 14 日目に完了、H は 14 日目から 17 日目
      - 全体の所要日数は 17 日
      - 後退計算：H の最遅開始は 17 − 3 = 14、G の最遅完了は 14 なので最遅開始は 14 − 5 = 9
      - E の最遅完了は G の最遅開始 9 日目なので、最遅開始は 9 − 2 = 7 日目

      E の最早開始は 3 日目なので、4 日の余裕があります。
    why:
      - 正解です。G の最遅開始 9 日目から E の所要日数 2 日を引いた 7 日目です。
      - 3 日目は E の最早開始日（先行の B の完了時点）です。最遅ではなく最早を答えています。
      - 9 日目は E の最遅完了日（G の最遅開始日）です。所要日数 2 日を引き忘れています。
      - 14 − 2 = 12 の計算です。G の最遅開始（9 日目）ではなく、G の完了日 14 日を基準にしており誤りです。
    know: 最遅開始日 = 最遅完了日 − 所要日数、最遅完了日 = 後続作業の最遅開始日の最小値。余裕日数 = 最遅開始日 − 最早開始日。最早と最遅、開始と完了を混同しないこと。
    terms: [最遅開始日, 最早開始日, 余裕日数, アローダイアグラム]
    verify: { value: '(4 + 5 + 3 + 5) - 3 - 5 - 2', tolerance: 0 }

  - id: A14-507
    topic: 14-6-3
    diff: 4
    q: |
      次の作業からなるプロジェクトは，当初計画では 16 日で完了する予定であった。実際には，作業 B の所要日数が計画より 2 日短くなり，作業 C の所要日数が計画より 3 日長くなった。他の作業は計画どおりであったとき，プロジェクト全体の所要日数は何日か。

      | 作業 | 先行作業 | 計画の所要日数 |
      | --- | --- | --- |
      | A | なし | 3 |
      | B | A | 5 |
      | C | A | 4 |
      | D | B | 6 |
      | E | C | 5 |
      | F | D，E | 2 |
    c:
      - 17 日
      - 14 日
      - 16 日
      - 19 日
    a: ア
    scope: 14-6-3 スケジュールネットワーク分析（クリティカルパスと余裕）。作業の変動後に最長経路を再計算することは、スケジュール管理の標準的な考え方。
    prereq: クリティカルパスと余裕日数の意味、複数経路の最長を比べること
    hard: 短縮した作業がクリティカルパス上にあっても全体の短縮には直結せず、余裕を使い切った別経路が新たな最長経路になる。短縮と遅延の両方を同時に評価しなければならない。
    exp: |
      計画では、経路 A → B → D → F が 3 + 5 + 6 + 2 = 16 日（クリティカルパス）、経路 A → C → E → F が 3 + 4 + 5 + 2 = 14 日（余裕 2 日）です。変更後の長さを再計算します。

      | 経路 | 変更後の計算 | 日数 |
      | --- | --- | --- |
      | A → B → D → F | 3 + 3 + 6 + 2 | 14 |
      | A → C → E → F | 3 + 7 + 5 + 2 | 17 |

      全体の所要日数は長い方の 17 日です。クリティカルパス上の B を 2 日短縮しても、C の側が 2 日の余裕を超えて 3 日延びたため、C を通る経路が新たなクリティカルパスになります。
    why:
      - 正解です。変更後は A → C → E → F の 17 日が最長になります。
      - 14 日は B を短縮した経路（A → B → D → F）の長さです。C の側の遅れを考慮しておらず、最長の経路になっていません。
      - 16 日は「C の遅れは余裕 2 日で吸収される」と考えて計画のままとした値です。C の遅れは 3 日で余裕を 1 日超えます。
      - 19 日は計画の 16 日に C の遅れ 3 日をそのまま足した値です。C の経路の余裕 2 日と B の短縮を無視しており、実際の最長経路の長さとは一致しません。
    know: 余裕のある経路の作業が遅れても、余裕の範囲内なら全体は遅れない。超えた分だけ全体が遅れ、別の経路が新たなクリティカルパスになり得る。クリティカルパス上の作業の短縮は、次に長い経路の長さまでしか全体の短縮につながらない。
    terms: [クリティカルパス, 余裕日数, アローダイアグラム]
    verify: { value: 'Math.max(3 + (5 - 2) + 6 + 2, 3 + (4 + 3) + 5 + 2)' }

  - id: A14-508
    topic: 14-6-3
    diff: 4
    q: |
      次の作業からなるプロジェクトを，現在の 15 日から 13 日に短縮したい。各作業は，表の範囲で 1 日単位で短縮でき，短縮に要する追加費用は 1 日短縮当たり表のとおりである。プロジェクトを 13 日で完了させるための追加費用の最小額は何万円か。

      | 作業 | 先行作業 | 所要日数 | 最大短縮日数 | 1 日短縮当たりの追加費用 |
      | --- | --- | --- | --- | --- |
      | A | なし | 4 | 1 | 40 万円 |
      | B | A | 6 | 2 | 15 万円 |
      | C | A | 6 | 2 | 20 万円 |
      | D | B，C | 5 | 2 | 50 万円 |
    c:
      - 70 万円
      - 30 万円
      - 75 万円
      - 90 万円
    a: ア
    scope: 14-6-3 クラッシング（スケジュール短縮の技法）。費用と日数のトレードオフを考え、クリティカルパスを短縮する計算は、シラバスのスケジュール管理（クラッシング）の範囲内。
    prereq: クラッシングの意味、クリティカルパスが複数あるときの短縮の考え方
    hard: B と C の経路の長さが等しい（クリティカルパスが 2 本）ことに気づき、片方だけ短縮しても全体が短縮しない点と、共通作業の A・D の単価との比較を行う必要がある。
    exp: |
      経路 A → B → D と A → C → D はどちらも 4 + 6 + 5 = 15 日で、クリティカルパスが 2 本あります。どちらか片方だけを短縮しても全体は短縮されません。

      2 日短縮する方法を比べます。

      | 方法 | 計算 | 追加費用 |
      | --- | --- | --- |
      | B と C をそれぞれ 2 日短縮 | （15 + 20）× 2 | 70 万円 |
      | A を 1 日、B と C を 1 日ずつ短縮 | 40 + （15 + 20） | 75 万円 |
      | A を 1 日、D を 1 日短縮 | 40 + 50 | 90 万円 |

      最小は 70 万円です。B だけを 2 日短縮する 30 万円では、C の経路が 15 日のまま残り全体は 13 日になりません。
    why:
      - 正解です。B と C を各 2 日短縮して（15 + 20）× 2 = 70 万円で、これが最小です。
      - 最も安い B だけを 2 日短縮した 15 × 2 = 30 万円です。C の経路が 15 日のまま残るので、全体は短縮されません。
      - A を 1 日（40 万円）短縮し、残り 1 日を B と C の両方（35 万円）で短縮した場合です。実現可能ですが 70 万円より高く、最小ではありません。
      - A を 1 日と D を 1 日短縮した場合です。実現可能ですが、1 日当たりの単価が高い作業を選んでおり最小ではありません。
    know: クリティカルパスが複数あるときは、すべてのクリティカルパスを同時に短縮しなければ全体は短縮されない。共通作業の単価と、並行作業の単価の合計を比べる。クラッシングは追加の費用や資源を投入して短縮する技法で、ファストトラッキング（並行化）とは異なる。
    terms: [クラッシング, クリティカルパス, アローダイアグラム]
    verify: { value: '(() => { let best = 1e9; for (let a = 0; a <= 1; a++) for (let b = 0; b <= 2; b++) for (let c = 0; c <= 2; c++) for (let d = 0; d <= 2; d++) { const t = (4 - a) + Math.max(6 - b, 6 - c) + (5 - d); if (t <= 13) best = Math.min(best, 40 * a + 15 * b + 20 * c + 50 * d); } return best; })()' }

  - id: A14-509
    topic: 14-5-3
    diff: 2
    q: |
      あるシステム開発に必要な作業量は 720 人日である。要員 1 人は 1 日のうち 75％ だけを実際の作業に充てられ，残りは会議や調整に使われる。1 か月の稼働日数を 20 日として，6 か月で完了させるために必要な要員は最少で何人か。
    c:
      - 8 人
      - 6 人
      - 9 人
      - 11 人
    a: ア
    scope: 14-5-3 資源の対象群のツールと技法、14-7-3 見積り。作業量（人日）、期間、要員数、稼働率の関係式による要員計画は、人月・人日による工数計算の基本的な範囲内。
    prereq: 工数（人日）、稼働日数、稼働率から必要な要員数を求める計算
    exp: |
      要員 1 人が 6 か月間に実際に作業に充てられる量を求め、作業量を割ります。

      - 6 か月の稼働日数 = 20 × 6 = 120 日
      - 1 人が実際に作業できる量 = 120 × 0.75 = 90 人日
      - 必要な要員数 = 720 ÷ 90 = 8 人

      稼働率を考慮しない 720 ÷ 120 = 6 人では、会議や調整の時間が不足し、期限に間に合いません。
    why:
      - 正解です。720 ÷（20 × 6 × 0.75）= 8 人です。
      - 稼働率 75％ を考慮せず 720 ÷ 120 = 6 人としています。作業に充てられる時間が足りません。
      - 余裕を見て 8 人にもう 1 人加えた値です。8 人でちょうど作業量を満たせるため、最少の人数ではありません。
      - 稼働率を二重に反映した 6 ÷ 0.75 ÷ 0.75 ≒ 10.7 → 11 人の考え方です。稼働率は一度だけ反映します。
    know: 必要要員数 = 総工数 ÷（稼働日数 × 稼働率）。人月や人日は「1 人が通常に作業した場合の量」で、会議や調整の時間は稼働率で調整する。稼働率を掛けるか割るか、二重に反映していないかを確認する。
    terms: [人日, 人月]
    verify: { value: '720 / (20 * 6 * 0.75)' }
