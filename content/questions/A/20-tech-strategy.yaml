  method: 作成後の逐問レビュー（技術開発戦略・価値創出の三要素・技術ロードマップなどの定義をシラバスVer.9.2の用語例と照合）
questions:
  - id: A20-001
    topic: 20-1-1-1
    diff: 1
    q: MOT（技術経営）の説明として，最も適切なものはどれか。
    c:
      - 技術を経営の中核に据え，研究開発の成果を事業化して経済的価値に結び付けるための経営の考え方
      - 製品の品質を全社員の参加によって継続的に改善する管理手法
      - 企業の経営資源を一元管理して基幹業務を統合するシステム
      - 業務プロセスを根本から見直して抜本的に再設計する手法
    a: ア
    exp: |
      MOT（Management of Technology：技術経営）は、技術に立脚する企業が、技術の可能性を見極めて研究開発を行い、その成果を製品やサービスとして事業化し、持続的に経済的価値を創出するための経営の考え方です。
    why:
      - 正解です。技術を事業の価値に結び付ける経営が MOT です。
      - 全社員参加の継続的な品質改善は TQM です。
      - 経営資源を一元管理して基幹業務を統合するのは ERP です。
      - 業務プロセスの抜本的な再設計は BPR です。
    terms:
      - MOT
      - TQM
      - BPR
      - ERP
  - id: A20-002
    topic: 20-1-1-1
    diff: 2
    q: イノベーションのジレンマの説明として，最も適切なものはどれか。
    c:
      - 新製品が初期採用者には受け入れられても，多数派の顧客に普及する段階で大きな溝に阻まれる。
      - 優良な大企業が既存顧客の要求に応えて製品の改良を続けた結果，当初は性能が低く小さな市場向けの破壊的な技術を軽視し，新興企業に市場を奪われてしまう。
      - 新しい技術への期待が過剰に高まった後，成果が出ないことで急速に関心が失われる。
      - 研究開発の成果を製品化する段階で，資金や人材の不足によって開発が止まってしまう。
    a: イ
    exp: |
      イノベーションのジレンマは、C.クリステンセンが提唱した考え方です。優良企業は既存顧客の要求に合わせた持続的イノベーションに経営資源を集中するため、当初は低性能で利益の小さい破壊的イノベーションを合理的に軽視してしまい、その技術が進歩して主要市場を侵食したときに対応できず、地位を失うというものです。
    why:
      - 初期市場から多数派の市場へ移る際の溝は、キャズムです。
      - 正解です。優良企業が合理的な判断の結果として破壊的イノベーションに敗れるのがイノベーションのジレンマです。
      - 過剰な期待の後に関心が失われる段階は、ハイプサイクルの幻滅期です。
      - 研究開発の成果を製品化する段階の障壁は、死の谷です。
    terms:
      - イノベーションのジレンマ
      - キャズム
      - 死の谷
      - ハイプサイクル
  - id: A20-003
    topic: 20-1-1-2
    diff: 2
    q: 技術開発から事業化までの過程にある障壁のうち，“死の谷”の説明として，最も適切なものはどれか。
    c:
      - 事業化した製品が市場で競合他社や顧客の評価にさらされ，事業として生き残るまでの障壁
      - 研究開発で得られた技術を製品化（事業化）する段階で，資金や人材の不足などにより開発が先に進まなくなる障壁
      - 基礎研究の成果を，製品化を目指す応用研究や開発の段階に移す際の障壁
      - 新製品が，初期採用者の市場から多数派の顧客の市場へ普及する際の障壁
    a: イ
    exp: |
      技術開発から事業の成功までには3つの障壁があるとされます。研究から開発（製品化を目指す段階）へ進む際の“魔の川”、開発から事業化へ進む際の“死の谷”、事業化から産業化（市場での成功）へ進む際の“ダーウィンの海”です。死の谷では、製品化のための資金や体制の確保が課題になります。
    why:
      - 事業化した製品が市場競争で生き残るまでの障壁はダーウィンの海です。
      - 正解です。開発した技術を事業化する段階の障壁が死の谷です。
      - 基礎研究から開発段階へ移る際の障壁は魔の川です。
      - 初期採用者から多数派への普及の障壁はキャズムです。
    terms:
      - 死の谷
      - 魔の川
      - ダーウィンの海
      - キャズム
  - id: A20-004
    topic: 20-1-1-2
    diff: 2
    q: G.A.ムーアが提唱したキャズムの説明として，最も適切なものはどれか。
    c:
      - ハイテク製品の普及過程で，イノベータやアーリーアダプタからなる初期市場と，アーリーマジョリティ以降のメインストリーム市場との間にある大きな溝
      - 自社の新製品が既存製品の売上を奪ってしまう現象
      - 自社の技術を外部に提供し，外部の技術も取り入れて価値を創出する考え方
      - 技術の成熟度と社会の期待度の推移を，時間軸に沿って曲線で示したもの
    a: ア
    exp: |
      キャズムは、新技術を好むイノベータやアーリーアダプタと、実用性や安心感を重視するアーリーマジョリティとの間で、求めるものが大きく異なるために生じる普及の溝です。この溝を越えなければ、製品は大きな市場に普及しません。
    why:
      - 正解です。初期市場とメインストリーム市場の間の溝がキャズムです。
      - 自社製品同士で売上を奪い合うのはカニバリゼーションです。
      - 外部の技術を取り入れ自社技術も提供するのはオープンイノベーションです。
      - 技術への期待度の推移を曲線で示したものはハイプサイクルです。
    terms:
      - キャズム
      - ハイプサイクル
      - カニバリゼーション
      - オープンイノベーション
  - id: A20-005
    topic: 20-1-1-1
    diff: 1
    q: オープンイノベーションの説明として，最も適切なものはどれか。
    c:
      - 研究開発から製品化までのすべてを自社内で行い，技術を外部に出さないことで競争優位を保つ。
      - 既存の製品を，既存の顧客の要求に合わせて少しずつ改良し続ける。
      - 開発したソフトウェアのソースコードを公開し，誰でも自由に改変・再配布できるようにする。
      - 自社内の研究開発だけに頼らず，大学や他企業などの外部の技術やアイデアを積極的に取り入れ，自社の技術も外部に提供して，新たな価値を創出する。
    a: エ
    exp: |
      オープンイノベーションは、H.チェスブロウが提唱した考え方で、企業の内部と外部の技術やアイデアを組み合わせて革新的な価値を創出するものです。外部の知見を取り込むだけでなく、自社で使わない技術をライセンス供与などで外部に提供することも含みます。
    why:
      - すべてを自社内で完結させるのは、クローズドイノベーション（自前主義）です。
      - 既存顧客の要求に合わせて改良を続けるのは、持続的イノベーションです。
      - ソースコードを公開して自由な改変・再配布を認めるのは、オープンソースソフトウェアの考え方です。
      - 正解です。内外の技術やアイデアを組み合わせて価値を創出するのがオープンイノベーションです。
    terms:
      - オープンイノベーション
  - id: A20-006
    topic: 20-1-1-1
    diff: 2
    q: リーンスタートアップの説明として，最も適切なものはどれか。
    c:
      - 企業が自社の戦略に沿って，社外のベンチャー企業に投資する。
      - 市場調査と事業計画を時間をかけて綿密に作成し，計画どおりに完成度の高い製品を一度に市場に投入する。
      - 成長が見込まれる未上場企業に出資し，株式公開などによって利益を得る。
      - 必要最小限の機能をもつ製品を短期間で作って顧客に提供し，その反応から学んで改良や方向転換を繰り返しながら事業を育てる。
    a: エ
    exp: |
      リーンスタートアップは、E.リースが提唱した新規事業の開発手法で、仮説に基づいて MVP（Minimum Viable Product：実用最小限の製品）を素早く作り、顧客の反応を計測して学習する「構築－計測－学習」のサイクルを繰り返します。仮説が誤っていれば方向転換（ピボット）し、無駄な投資を抑えます。
    why:
      - 事業会社が戦略的にベンチャー企業へ投資するのは、CVC（コーポレートベンチャーキャピタル）です。
      - 綿密な計画に基づき完成品を一度に投入するのは、従来型の開発の進め方で、リーンスタートアップとは逆の考え方です。
      - 未上場企業に出資して株式公開などで利益を得るのは、VC（ベンチャーキャピタル）です。
      - 正解です。MVP で検証と学習を繰り返すのがリーンスタートアップです。
    terms:
      - リーンスタートアップ
      - VC
      - CVC
  - id: A20-007
    topic:
      - 20-1-1-3
      - 19-2-1-1
    diff: 2
    q: デザイン思考の説明として，最も適切なものはどれか。
    c:
      - 利用者の観察や共感を出発点として本質的な課題を定義し，アイデアの創出，プロトタイプの作成，テストを繰り返して解決策を導く。
      - 製品の見た目の美しさを最優先し，デザイナーが単独で製品の外観を決める。
      - 要件をすべて確定させてから，設計・製造・テストを順番に一度だけ行う。
      - 過去の売上データを統計的に分析し，最も売上が見込める製品の仕様を決める。
    a: ア
    exp: |
      デザイン思考は、デザイナーの思考プロセスをビジネスの課題解決に応用した手法で、一般に「共感」「問題定義」「創造（アイデア創出）」「プロトタイプ」「テスト」の段階を行き来しながら進めます。利用者中心で、素早い試作と検証を繰り返す点が特徴です。
    why:
      - 正解です。共感から始め、試作と検証を繰り返すのがデザイン思考です。
      - デザイン思考は外観の美しさだけを扱うものではなく、利用者の課題解決のための思考法です。
      - 要件を確定させて工程を一度だけ順に行うのはウォータフォール型の進め方であり、反復を重視するデザイン思考とは異なります。
      - 過去のデータ分析だけで仕様を決めるのは、利用者への共感を出発点とするデザイン思考とは異なります。
    terms:
      - デザイン思考
      - ペルソナ
  - id: A20-008
    topic:
      - 20-1-1-3
      - 20-2-1
    diff: 2
    q: PoC（Proof of Concept）の説明として，最も適切なものはどれか。
    c:
      - 開発者やデザイナーなどが短期間に集中してチームで開発に取り組み，成果を競い合うイベント
      - 新しい技術やアイデアが実現可能か，期待する効果が得られるかを，本格的な開発の前に試作などによって検証する。
      - 製品の設計や生産準備などの工程を同時並行で進め，開発期間を短縮する。
      - 本格的な量産を始める前に，生産設備や工程の問題点を確認するために少量を試験的に生産する。
    a: イ
    exp: |
      PoC（概念実証）は、新しい技術やアイデアについて、本格的な投資や開発を行う前に、小規模な試作や実証実験によって実現可能性や効果を検証することです。さらに、ビジネスとしての価値が得られるかを検証することを PoV（Proof of Value：価値実証）と呼ぶことがあります。
    why:
      - 短期間に集中して開発し成果を競い合うイベントは、ハッカソンです。
      - 正解です。本格開発の前に実現可能性や効果を検証するのが PoC です。
      - 工程を同時並行で進めて期間を短縮するのは、コンカレントエンジニアリングです。
      - 量産前に少量を試験的に生産するのは、パイロット生産です。
    terms:
      - PoC
      - ハッカソン
      - コンカレントエンジニアリング
  - id: A20-009
    topic: 20-2-2
    diff: 1
    q: 技術ロードマップの説明として，最も適切なものはどれか。
    c:
      - 製品の売上や利益の推移を，導入期・成長期・成熟期・衰退期の段階で示したもの
      - プロジェクトの作業を階層的に分解し，成果物を体系的に整理したもの
      - 市場ニーズや技術の将来の進展を予測し，研究開発の目標や実現の道筋を時間軸に沿って示したもの
      - 自社の事業を市場成長率と市場占有率の2つの軸で分類したもの
    a: ウ
    exp: |
      技術ロードマップは、市場ニーズや技術動向を踏まえ、将来どのような技術をいつまでに実現するかという研究開発の目標と道筋を、時間軸に沿って示したものです。経営層や関係部門で共有し、技術開発投資や人材計画などの判断に用います。
    why:
      - 製品の売上や利益の推移を4段階で示すのは、プロダクトライフサイクルです。
      - 作業を階層的に分解して成果物を整理するのは、プロジェクトマネジメントで用いる WBS です。
      - 正解です。技術開発の目標と道筋を時間軸で示したものが技術ロードマップです。
      - 事業を市場成長率と市場占有率で分類するのは、PPM です。
    terms:
      - 技術ロードマップ
      - プロダクトライフサイクル
      - PPM
  - id: A20-010
    topic: 20-1-1-1
    diff: 2
    q: ガートナーが提唱するハイプサイクルにおいて，“幻滅期”の説明として，最も適切なものはどれか。
    c:
      - 技術が登場して注目を集め，成功事例などの報道によって期待が過度に高まる段階
      - 技術が広く普及し，主流の市場で安定して利用されるようになる段階
      - 技術の利点や適用方法が理解されはじめ，実用化に向けた取組みが広がる段階
      - 過度に高まった期待に反して，実験や導入の成果が期待どおりに出ず，関心が急速に薄れる段階
    a: エ
    exp: |
      ハイプサイクルは、新しい技術に対する期待度の推移を、黎明期、「過度な期待」のピーク期、幻滅期、啓発期、生産性の安定期の5段階で示したものです。幻滅期には、期待どおりの成果が得られないことで関心が失われますが、その後、技術の正しい理解が進んで啓発期へ移ります。
    why:
      - 注目を集めて期待が過度に高まるのは、「過度な期待」のピーク期です。
      - 広く普及して安定して利用されるのは、生産性の安定期です。
      - 利点や適用方法が理解され実用化の取組みが広がるのは、啓発期です。
      - 正解です。過度な期待が裏切られ関心が薄れるのが幻滅期です。
    terms:
      - ハイプサイクル
