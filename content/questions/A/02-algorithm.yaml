  - id: A02-017
    topic: 2-2-2-1
    diff: 2
    q: マージソートの特徴として，適切なものはどれか。
    c:
      - データの並び方にかかわらず計算量は O(n log n) だが，併合のために作業用の記憶領域が必要になる。
      - 作業用の記憶領域をほとんど使わず，最悪の場合の計算量は O(n²) になる。
      - ほぼ整列済みのデータに対して特に高速で，O(n) に近い時間で整列できる。
      - 比較を行わずに，キーの値を添字として使って整列する。
    a: ア
    exp: |
      マージソートは、データを半分ずつに分割して1件になるまで分け、整列済みの列どうしを併合（マージ）しながら整列する方法です。分割の段数が log n、各段の併合に n に比例する手間がかかるため、データの並び方にかかわらず O(n log n) です。併合のときに一時的な記憶領域が必要です。
    why:
      - 正解です。計算量は安定して O(n log n) で、作業領域が必要です。
      - 最悪 O(n²) で作業領域をほとんど使わないのは、クイックソートなどの特徴です。
      - ほぼ整列済みのデータで速いのは挿入ソートの特徴です。
      - キーの値を添字に使うのは分布数え上げソート（計数ソート）などです。
    terms:
      - 整列アルゴリズム
      - 分割統治法
  - id: A02-018
    topic: 2-2-2-2
    diff: 2
    q: |
      関数 f(n) を次のように定義する。f(4) の値はどれか。
      f(n)：n が 1 以下なら 1 を返す。そうでなければ n × f(n − 1) を返す。
    c:
      - '4'
      - '120'
      - '24'
      - '10'
    a: ウ
    exp: |
      f は階乗を計算する再帰関数です。呼出しを展開すると次のようになります。
      f(4)＝4×f(3)＝4×3×f(2)＝4×3×2×f(1)＝4×3×2×1＝24
      f(1) が終了条件（基底部）となって再帰が止まり、戻りながら掛け算が行われます。
    why:
      - 4 は再帰の展開をせずに n をそのまま返した値です。
      - 120 は f(5)＝5! の値です。
      - 正解です。4!＝24 です。
      - 10 は掛け算ではなく足し算（4＋3＋2＋1）をした値です。
    know: 再帰呼出しでは、呼び出すたびに引数や戻り先がスタックに積まれます。終了条件がないと無限に呼出しが続き、スタックがあふれます。
    terms:
      - 再帰
    verify:
      value: 4*3*2*1
  - id: A02-019
    topic: 2-2-2-3
    diff: 2
    q: ダイクストラ法の説明として，適切なものはどれか。
    c:
      - 出発点から近い頂点を順に訪れ，すべての頂点を訪れる順序を求める。
      - 負の重みの辺を含むグラフでも，出発点からの最短経路を求められる方法で，全辺の緩和を繰り返す。
      - グラフのすべての頂点を一度ずつ通って出発点に戻る最短の巡回路を求める。
      - 辺の重みが負でないグラフで，出発点から各頂点への最短経路を，確定した頂点を一つずつ増やしながら求める。
    a: エ
    exp: |
      ダイクストラ法は、出発点からの暫定的な距離が最も小さい未確定の頂点を選んで距離を確定し、その頂点から出る辺を使って隣の頂点の距離を更新する、という操作を繰り返して最短経路を求めます。辺の重み（距離）が負でないことが前提です。カーナビの経路探索やネットワークのルーティング（OSPF）に使われます。
    why:
      - 近い頂点から順に訪れて順序を求めるのは幅優先探索の説明です（最短経路の重みは考慮しない）。
      - 負の重みにも対応し、全辺の緩和を繰り返すのはベルマンフォード法です。
      - すべての頂点を巡る最短の巡回路を求めるのは巡回セールスマン問題で、ダイクストラ法では解けません。
      - 正解です。重みが非負のグラフで最短経路を求めます。
    terms:
      - ダイクストラ法
      - グラフ理論
  - id: A02-020
    topic: 2-2-2-3
    diff: 2
    q: グラフの探索で，幅優先探索を実現するために一般的に用いるデータ構造はどれか。
    c:
      - キュー
      - スタック
      - ヒープ
      - 双方向リスト
    a: ア
    exp: |
      幅優先探索は、出発点に近い頂点から順に（深さの浅い順に）訪れる探索です。訪れた頂点の隣をキューの末尾に追加し、キューの先頭から取り出して次に訪れることで、近い順の探索ができます。
    why:
      - 正解です。先に見つけた頂点から順に処理するためキュー（FIFO）を使います。
      - スタック（または再帰）を使うと、深く進んでから戻る深さ優先探索になります。
      - ヒープは優先度付きキューの実装に使われ、ダイクストラ法の高速化などに使われます。
      - 双方向リストは探索順を決めるための構造ではありません。
    terms:
      - キュー
      - スタック
      - 幅優先探索
  - id: A02-021
    topic: 2-2-2-4
    diff: 2
    q: 長さ n の文字列の中から長さ m の文字列（パターン）を探すとき，先頭から1文字ずつずらしながらパターンと照合する単純な方法の最悪の比較回数のオーダはどれか。
    c:
      - O(m)
      - O(n × m)
      - O(log n)
      - O(n ＋ m)
    a: イ
    exp: |
      単純な文字列照合（力まかせ法）では、照合を始める位置が約 n か所あり、それぞれの位置で最大 m 文字を比較します。そのため最悪の比較回数は n×m に比例し、O(n×m) となります。
    why:
      - O(m) ではパターンを一度照合する手間にしかなりません。
      - 正解です。開始位置の数×パターン長の比較が必要になりえます。
      - O(log n) では文字列全体を調べることもできません。
      - O(n＋m) は、KMP 法など照合位置をうまくずらす工夫をした方法の計算量です。
    know: BM 法（Boyer-Moore 法）はパターンの末尾から照合し、不一致のときに大きくずらすことで、実用上高速な照合を実現します。
    terms:
      - 文字列照合
      - 計算量
  - id: A02-022
    topic: 2-2-2-5
    diff: 2
    q: 同じキーで昇順に整列された2つのファイル（マスタファイルとトランザクションファイル）を，先頭から順に読み進めて照合し，マスタファイルを更新する処理を何というか。
    c:
      - ソート処理
      - インデックス作成処理
      - マッチング処理（突合せ処理）
      - ハッシュ処理
    a: ウ
    exp: |
      キー順に整列された複数のファイルを、キーを比較しながら先頭から順に読み進め、キーが一致するもの・一方にしかないものを判別して処理する方法をマッチング処理（突合せ処理）といいます。マスタファイルの更新や、2つのファイルの差分の抽出などに使われます。各ファイルを1回ずつ読むだけで済むため効率的です。
    why:
      - ソート処理はデータを整列する処理で、マッチング処理の前処理として行われます。
      - インデックス作成は検索を速くするための索引を作る処理です。
      - 正解です。整列済みファイルのキーを照合するのがマッチング処理です。
      - ハッシュ処理はキーからハッシュ値を計算して格納位置を決める処理です。
    terms:
      - ファイル処理
  - id: A02-023
    topic: 2-2-2-6
    diff: 2
    q: 自然言語処理における形態素解析の説明として，適切なものはどれか。
    c:
      - 文章中に連続して現れる n 個の文字や単語の組の出現頻度を数える。
      - 文を意味をもつ最小の単位に分割し，それぞれの品詞などを判別する。
      - 文全体の意味を，文脈や前後の文との関係から解釈する。
      - 単語どうしの修飾・被修飾の関係を解析する。
    a: イ
    exp: |
      形態素解析は、自然言語処理の最初の段階で、文を形態素（意味をもつ最小の単位）に区切り、それぞれの品詞や原形を判別する処理です。日本語は英語と違って単語の間に空白がないため、特に重要な処理です。
      例：「私は本を読む」→ 私（名詞）／は（助詞）／本（名詞）／を（助詞）／読む（動詞）
    why:
      - 連続する n 個の組の出現頻度を扱うのは n-gram です。
      - 正解です。最小単位への分割と品詞の判別が形態素解析です。
      - 文脈から意味を解釈するのは文脈解析です。
      - 修飾・被修飾の関係を解析するのは構文解析（係り受け解析）です。
    know: 自然言語処理は一般に「形態素解析 → 構文解析 → 意味解析 → 文脈解析」の順に進みます。
    terms:
      - 形態素解析
      - n-gram
  - id: A02-024
    topic: 2-2-3
    diff: 2
    q: 分割統治法の説明として，適切なものはどれか。
    c:
      - 解の候補をすべて列挙して，条件を満たすものを探す。
      - 問題を同じ種類の小さな部分問題に分割して解き，部分問題の解を組み合わせて元の問題の解を得る。
      - 解の候補を少しずつ変化させ，評価値が改善する方向へ移動を繰り返す。
      - 各段階でその時点で最も良い選択をして，全体の解を組み立てる。
    a: イ
    exp: |
      分割統治法は「分割 → 個別に解く → 統合」という手順で問題を解く設計手法です。大きな問題を同じ形の小さな問題に分け、再帰的に解いた結果を組み合わせます。マージソート、クイックソート、2分探索などが分割統治法の考え方に基づいています。
    why:
      - すべての候補を列挙するのは全探索（しらみつぶし法）です。
      - 正解です。分割して解き、結果を組み合わせるのが分割統治法です。
      - 候補を少しずつ変えて改善するのは山登り法などの局所探索です。
      - その時点の最善を選ぶのは貪欲法（グリーディ法）です。
    terms:
      - 分割統治法
      - 再帰
  - id: A02-025
    topic: 2-3-1-1
    diff: 1
    q: プログラムのコーディング標準（コーディング規約）を定める目的として，最も適切なものはどれか。
    c:
      - プログラムのテストを不要にする。
      - コンパイラが検出できない文法の誤りをなくす。
      - プログラムの読みやすさをそろえ，誤りを防ぎ，保守性を高める。
      - プログラムの処理速度を必ず向上させる。
    a: ウ
    exp: |
      コーディング標準は、字下げ（インデンテーション）、命名規則、ネストの深さの上限、使用してはいけない命令などを定めたルールです。開発者ごとの書き方のばらつきをなくし、プログラムを読みやすく、誤りを起こしにくく、保守しやすくすることが目的です。
    why:
      - コーディング標準を守ってもテストは必要です。
      - 文法の誤りはコンパイラが検出します。コーディング標準は文法上は正しいが分かりにくい書き方などを防ぐものです。
      - 正解です。可読性・品質・保守性の向上が主な目的です。
      - 書き方をそろえることは、必ずしも処理速度の向上にはつながりません。
    terms:
      - コーディング標準
  - id: A02-026
    topic: 2-3-1-2
    diff: 2
    q: モジュール分割の考え方として，適切なものはどれか。
    c:
      - モジュール内・モジュール間の結び付きをどちらも強くする。
      - モジュール内の要素の結び付き（強度）を強くし，モジュール間の結び付き（結合度）を弱くする。
      - モジュール内の要素の結び付きを弱くし，モジュール間の結び付きを強くする。
      - モジュールの数をできるだけ少なくし，一つのモジュールに多くの機能をまとめる。
    a: イ
    exp: |
      良いモジュール分割とは、一つのモジュールが一つのまとまった機能を担い（モジュール強度が強い）、他のモジュールとのやり取りは必要最小限の引数などに限る（モジュール結合度が弱い）ことです。こうすると各モジュールの独立性が高まり、修正の影響が他に広がりにくく、再利用もしやすくなります。
    why:
      - モジュール間の結び付きが強いと、修正の影響が広がりやすくなります。
      - 正解です。強度を強く、結合度を弱くするのが原則です。
      - 逆の状態で、独立性が低く保守しにくくなります。
      - 一つのモジュールに多くの機能を詰め込むと強度が弱くなり、分かりにくくなります。
    know: 結合度はデータ結合（最も弱く望ましい）→ スタンプ結合 → 制御結合 → 外部結合 → 共通結合 → 内容結合（最も強い）の順です。
    terms:
      - モジュール分割
      - モジュール結合度
  - id: A02-027
    topic: 2-3-1-3
    diff: 1
    q: 次のうち，論理型（真理値型）の変数が保持する値として，適切なものはどれか。
    c:
      - true または false
      - 整数の値
      - 小数を含む数値
      - 文字の並び
    a: ア
    exp: |
      論理型（ブール型）は、真（true）か偽（false）のどちらかの値だけをとるデータ型です。条件式の結果や、状態を表すフラグなどに使われます。
    why:
      - 正解です。論理型は true か false をとります。
      - 整数の値は整数型が保持します。
      - 小数を含む数値は実数型（浮動小数点型）が保持します。
      - 文字の並びは文字列型が保持します。
    know: データ型は、値の種類と、その値に使える演算（足し算、比較、連結など）を決めます。
    terms:
      - データ型
  - id: A02-028
    topic: 2-3-1-4
    diff: 2
    q: 整数 x を 2 で割った余りが 1 である（x が奇数である）ことを判定するビット演算として，適切なものはどれか。ここで，x は 0 以上の整数とし，2進数で表現されているものとする。
    c:
      - x を1ビット左へ論理シフトした値が 1
      - x と 1 の排他的論理和が 0
      - x と 1 の論理積が 1
      - x と 1 の論理和が 1
    a: ウ
    exp: |
      2進数の最下位ビットは 2⁰＝1 の位なので、奇数なら 1、偶数なら 0 です。x と 1（…0001）の論理積をとると最下位ビットだけが残るため、結果が 1 なら奇数と判定できます。
    why:
      - 左へシフトすると最下位ビットは 0 になり、判定に使えません。
      - 1 との排他的論理和が 0 になるのは x＝1 のときだけです。
      - 正解です。最下位ビットを取り出して判定します。
      - 1 との論理和は最下位ビットを必ず 1 にするので、x がどんな値でも最下位ビットは 1 になり判定できません。
    terms:
      - ビットマスク
      - 論理積
  - id: A02-029
    topic: 2-3-1-5
    diff: 1
    q: 前判定の繰返し（while）と後判定の繰返し（do〜while）の違いとして，正しいものはどれか。
    c:
      - 後判定の繰返しは，条件を一度だけ評価する。
      - 前判定の繰返しは，条件が偽の間だけ処理を繰り返す。
      - 後判定の繰返しは，条件にかかわらず処理を少なくとも1回は実行する。
      - 前判定の繰返しは，条件にかかわらず処理を少なくとも1回は実行する。
    a: ウ
    exp: |
      前判定の繰返し（while）は、繰返しの前に条件を評価し、最初から条件が偽なら処理を1回も実行しません。後判定の繰返し（do〜while）は、まず処理を実行してから条件を評価するので、条件が最初から偽でも少なくとも1回は処理を実行します。
    why:
      - 後判定の繰返しも、処理を実行するたびに条件を評価します。
      - IPA の擬似言語の while は、条件が真の間だけ繰り返します。
      - 正解です。後判定の繰返しは少なくとも1回実行します。
      - 前判定の繰返しは、最初の条件が偽なら1回も実行しません。
    terms:
      - 制御構造
  - id: A02-030
    topic: 2-3-1-6
    diff: 2
    q: 手続の呼出しで，引数を参照渡しにした場合の説明として，適切なものはどれか。
    c:
      - 呼び出された手続には値の複製が渡されるので，手続の中で変更しても呼出し元の変数は変わらない。
      - 手続の戻り値は，必ず呼出し元の変数に代入される。
      - 呼び出された手続の局所変数は，呼出し元からも参照できる。
      - 呼び出された手続の中で引数の値を変更すると，呼出し元の変数の値も変更される。
    a: エ
    exp: |
      参照渡しでは、変数の値ではなく、変数の格納場所（参照）が手続に渡されます。手続の中でその引数に代入すると、呼出し元の変数そのものが書き換わります。
      値渡しでは値の複製が渡されるので、手続の中で変更しても呼出し元の変数は変わりません。
    why:
      - これは値渡しの説明です。
      - 戻り値をどう使うかは呼出し元の記述によります。必ず代入されるわけではありません。
      - 局所変数は、それを宣言した手続の中だけで有効で、呼出し元からは参照できません。
      - 正解です。参照渡しでは呼出し元の変数が変更されます。
    terms:
      - 引数
      - 局所変数
  - id: A02-031
    topic: 2-3-1-7
    diff: 2
    q: オブジェクト指向プログラミングにおけるオーバーライドの説明として，適切なものはどれか。
    c:
      - オブジェクトを生成するときに，メンバ変数を初期化するために呼び出される特別なメソッドを定義する。
      - スーパークラスで定義されたメソッドを，サブクラスで同じ名前・同じ引数で再定義して，振る舞いを変える。
      - 同じクラスの中で，名前が同じで引数の型や個数が異なるメソッドを複数定義する。
      - クラスの内部のデータを隠し，メソッドを通してだけアクセスできるようにする。
    a: イ
    exp: |
      オーバーライドは、継承関係にあるクラスで、親クラス（スーパークラス）のメソッドを子クラス（サブクラス）が同じ名前・同じ引数の形で定義し直し、子クラス独自の動作に置き換えることです。例えば「図形」クラスの面積計算を、「円」クラスや「長方形」クラスでそれぞれの計算方法に置き換えます。
    why:
      - 生成時に初期化のために呼び出されるのはコンストラクタです。
      - 正解です。継承したメソッドを再定義するのがオーバーライドです。
      - 同じ名前で引数が異なるメソッドを複数定義するのはオーバーロードです。
      - 内部のデータを隠すのはカプセル化（情報隠蔽）です。
    know: オーバーライドにより、同じメソッド呼出しでもオブジェクトのクラスに応じて異なる処理が行われる（ポリモーフィズム）ことが実現されます。
    terms:
      - オーバーライド
      - オーバーロード
      - コンストラクタ
  - id: A02-032
    topic: 2-3-1-8
    diff: 2
    q: Ajax の説明として，適切なものはどれか。
    c:
      - 複数の Web ページの見た目を統一するために，スタイルの指定を別のファイルにまとめる技術
      - Web ページの内容を検索エンジンに正しく理解させるための記述方法
      - Web サーバ上で動作し，データベースの内容から HTML を生成する技術
      - Web ブラウザ上のスクリプトがサーバと非同期に通信し，ページ全体を再読み込みせずに表示の一部を更新する技術
    a: エ
    exp: |
      Ajax（Asynchronous JavaScript and XML）は、ブラウザ上の JavaScript がサーバと非同期に通信してデータを受け取り、ページ全体を読み込み直さずに一部分だけを書き換える技術です。地図をドラッグすると周辺の地図が次々に表示される Web アプリなどに使われています。名前に XML とありますが、現在は JSON でデータをやり取りすることが一般的です。
    why:
      - スタイルの指定を別ファイルにまとめるのは CSS です。
      - 検索エンジン向けの記述は SEO の工夫で、Ajax ではありません。
      - サーバ上で HTML を生成するのはサーバサイドプログラミングです。
      - 正解です。非同期通信でページの一部を更新する技術です。
    terms:
      - Ajax
  - id: A02-033
    topic: 2-3-2
    diff: 2
    q: プログラム言語の文法を定義するための記法の一つで，構文規則を図形と矢印で図示したものはどれか。
    c:
      - データフロー図
      - 状態遷移図
      - 構文図式（構文図）
      - E-R 図
    a: ウ
    exp: |
      構文図式（構文図）は、BNF と同じくプログラム言語の文法（構文規則）を表す記法で、終端記号・非終端記号を図形で表し、それらを矢印でつないで、正しい記述の並び方を図示します。矢印をたどれる並びが文法的に正しい記述です。
    why:
      - データフロー図（DFD）は、データの流れと処理を表す図です。
      - 状態遷移図は、システムの状態と状態が変わるきっかけを表す図です。
      - 正解です。構文規則を図示したものが構文図式です。
      - E-R 図は、データベース設計で実体と関連を表す図です。
    terms:
      - BNF
  - id: A02-034
    topic: 2-4-1-1
    diff: 1
    q: スクリプト言語の一般的な特徴として，適切なものはどれか。
    c:
      - ハードウェアの命令と1対1に対応した記号で記述する。
      - 実行前に必ず機械語に翻訳する必要があり，翻訳しないと実行できない。
      - 数値計算専用の言語で，文字列は扱えない。
      - インタプリタで実行されることが多く，簡単に記述して手軽に実行できる。
    a: エ
    exp: |
      スクリプト言語は、比較的簡単な文法で記述でき、事前のコンパイルを必要とせずインタプリタなどで手軽に実行できる言語の総称です。Python、Ruby、Perl、PHP、JavaScript（ECMAScript）などがあり、Web アプリケーションや作業の自動化に広く使われます。
    why:
      - 命令と1対1に対応した記号で書くのはアセンブラ言語です。
      - 事前にコンパイルが必要なのは C などのコンパイル型言語の特徴です。
      - スクリプト言語は文字列処理を得意とするものも多く、数値計算専用ではありません。
      - 正解です。手軽に記述・実行できるのが特徴です。
    terms:
      - スクリプト言語
  - id: A02-035
    topic: 2-4-1-2
    diff: 2
    q: プログラム言語とその主な用途の組合せとして，適切なものはどれか。
    c:
      - COBOL ― 事務処理
      - R ― OS の開発
      - Fortran ― Web ページの動的な制御
      - C ― 統計解析専用
    a: ア
    exp: |
      COBOL は事務処理用に開発された言語で、10進数の正確な計算や帳票処理を得意とし、金融機関の基幹システムなどで長く使われています。
      Fortran は科学技術計算、R は統計解析、C は OS や組込みシステムの開発などに使われる代表的な言語です。
    why:
      - 正解です。COBOL は事務処理向けの言語です。
      - R は統計解析やデータ分析向けの言語です。
      - Fortran は科学技術計算向けの言語です。Web ページの動的な制御には JavaScript などが使われます。
      - C は OS や組込みソフトウェアの開発などに広く使われる汎用の言語です。
    terms:
      - 手続型言語
  - id: A02-036
    topic: 2-4-1-3
    diff: 2
    q: Java の特徴として，適切なものはどれか。
    c:
      - Web ブラウザの中でだけ動作する言語である。
      - プログラムを直接機械語に翻訳するため，実行環境ごとに必ずソースコードの書き換えが必要になる。
      - コンパイルしたバイトコードを仮想マシン（JVM）上で実行するため，異なる OS でも同じプログラムを実行できる。
      - クラスやオブジェクトの概念をもたない手続型言語である。
    a: ウ
    exp: |
      Java はオブジェクト指向言語で、ソースコードをバイトコードと呼ばれる中間コードにコンパイルし、それを Java 仮想マシン（JVM）が実行します。JVM が OS ごとの違いを吸収するため、同じバイトコードをさまざまな環境で実行できます（Write Once, Run Anywhere）。
    why:
      - Java はサーバ上のアプリケーションや Android アプリなど、幅広い環境で動作します。ブラウザ上で動作する言語は JavaScript です。
      - Java は中間コードを使うため、環境ごとにソースコードを書き換える必要はありません。
      - 正解です。JVM 上でバイトコードを実行します。
      - Java はクラスを中心としたオブジェクト指向言語です。
    terms:
      - Java
      - オブジェクト指向
  - id: A02-037
    topic: 2-4-1-4
    diff: 1
    q: Python の特徴として，最も適切なものはどれか。
    c:
      - 字下げ（インデント）によってブロックを表す文法をもち，データ分析や機械学習のライブラリが豊富である。
      - ハードウェアの命令と1対1に対応した記号で記述する。
      - 事務処理用に開発され，10進数の計算と帳票作成に特化している。
      - Web ページのレイアウトを指定するための言語である。
    a: ア
    exp: |
      Python は読みやすさを重視した汎用のスクリプト言語で、if 文や繰返しのブロックを括弧ではなく字下げで表すのが特徴です。数値計算・データ分析・機械学習の豊富なライブラリがあり、AI 分野で特に広く使われています。
    why:
      - 正解です。字下げによるブロックと豊富なライブラリが特徴です。
      - 命令と1対1に対応するのはアセンブラ言語です。
      - 事務処理用の言語は COBOL です。
      - Web ページのレイアウト（見た目）を指定するのは CSS です。
    terms:
      - スクリプト言語
  - id: A02-038
    topic: 2-4-1-5
    diff: 3
    q: 共通言語基盤（CLI）の説明として，適切なものはどれか。
    c:
      - 異なるプログラム言語で書かれたプログラムを，共通の中間言語と実行環境で動作させるための仕様
      - OS のコマンドを文字で入力して操作する利用者インタフェース
      - 異なるデータベース管理システムを同じ SQL で操作するための仕様
      - 複数のプログラム言語の文法を一つに統一した新しいプログラム言語
    a: ア
    exp: |
      共通言語基盤（CLI：Common Language Infrastructure）は JIS X 3016（ISO/IEC 23271）で標準化された仕様で、さまざまなプログラム言語で書かれたプログラムを共通の中間言語に変換し、共通の実行環境上で動作させるための仕組みを定めています。言語の違いを超えて部品（クラスなど）を相互に利用できます。.NET の実行環境がこの仕様の代表的な実装です。
    why:
      - 正解です。言語に依存しない共通の中間言語と実行環境の仕様です。
      - コマンドを文字で入力するインタフェースはコマンドラインインタフェース（CLI）で、略称が同じでも別物です。
      - データベースの共通操作の仕様は、ODBC や JDBC などです。
      - 新しい言語を作るものではなく、複数の言語が共存するための基盤です。
    terms:
      - 共通言語基盤
  - id: A02-039
    topic: 2-5-1-1
    diff: 1
    q: HTML の説明として，適切なものはどれか。
    c:
      - Web サーバとブラウザの間で情報をやり取りするための通信規約
      - 利用者が独自のタグを定義でき，データの交換に使われるマークアップ言語
      - Web ページの文字の色や配置などの見た目を指定するための言語
      - タグを使って文書の構造（見出し・段落・リンクなど）を記述する，Web ページ用のマークアップ言語
    a: エ
    exp: |
      HTML（HyperText Markup Language）は、見出し（h1）、段落（p）、リンク（a）などのタグで文書の構造を記述する、Web ページのためのマークアップ言語です。開始タグと終了タグで内容を囲んで意味を与えます。
    why:
      - ブラウザとサーバの通信規約は HTTP です。
      - 独自のタグを定義できるのは XML です。
      - 見た目を指定するのは CSS（スタイルシート）です。
      - 正解です。文書の構造を記述する言語です。
    terms:
      - HTML
      - CSS
      - XML
  - id: A02-040
    topic: 2-5-1-2
    diff: 2
    q: XML 文書を扱うプログラミングインタフェースのうち，文書全体を木構造としてメモリ上に展開し，任意の要素にアクセスしたり変更したりできるものはどれか。
    c:
      - SAX
      - SOAP
      - DOM
      - XSL
    a: ウ
    exp: |
      DOM（Document Object Model）は、XML や HTML の文書全体をメモリ上に木構造（ツリー）として読み込み、プログラムから要素の参照・追加・変更・削除を自由に行えるようにするインタフェースです。ブラウザの JavaScript が Web ページを書き換えるときにも DOM を使います。
    why:
      - SAX は文書を先頭から順に読みながら、要素の出現などのイベントごとに処理する方式で、文書全体をメモリに展開しません。大きな文書の読込みに向いています。
      - SOAP は XML を使ってサービス間でメッセージを交換するための通信プロトコルです。
      - 正解です。木構造として展開して操作するのが DOM です。
      - XSL は XML 文書の表示形式の指定や変換を行うためのスタイルシート言語です。
    terms:
      - XML
      - DOM
  - id: A02-041
    topic: 2-5-1-3
    diff: 3
    q: XHTML の説明として，適切なものはどれか。
    c:
      - HTML に動画再生の機能を追加した最新の HTML の版である。
      - Web ページを携帯電話向けに自動変換するための通信規約である。
      - XML 文書の見た目を指定するためのスタイルシート言語である。
      - HTML を XML の文法規則に従って定義し直したマークアップ言語で，終了タグの省略などが認められない。
    a: エ
    exp: |
      XHTML は、HTML を XML の文法に従うように再定義したマークアップ言語です。XML の規則に従うため、要素名は小文字で書く、終了タグを省略しない、空要素は <br /> のように閉じるなど、HTML より厳格な書き方が求められます。XML のツールで処理できる利点があります。
    why:
      - 動画再生などの機能を追加したのは HTML5 です。
      - 通信規約ではありません。携帯端末向けのサブセットとして XHTML Basic はありますが、変換規約ではありません。
      - XML 文書の見た目を指定するのは XSL や CSS です。
      - 正解です。XML の規則に従う HTML です。
    terms:
      - HTML
      - XML
  - id: A02-042
    topic: 2-5-1-4
    diff: 1
    q: CSS（Cascading Style Sheets）を利用する利点として，適切なものはどれか。
    c:
      - 文書の構造と見た目（デザイン）を分離でき，複数のページの見た目を一括して変更しやすくなる。
      - Web ページの表示に必要なデータを圧縮し，通信量を減らせる。
      - Web ページの内容をデータベースに保存できる。
      - Web サーバとの通信を暗号化できる。
    a: ア
    exp: |
      CSS は、HTML で記述した文書の見た目（文字の大きさ・色・配置など）を指定するスタイルシート言語です。構造（HTML）と見た目（CSS）を分けて管理できるため、CSS ファイルを1つ修正するだけで、それを参照するすべてのページのデザインを変更できます。
    why:
      - 正解です。構造と見た目の分離が CSS の利点です。
      - データの圧縮は CSS の役割ではありません（HTTP の圧縮機能などで行います）。
      - データベースへの保存は CSS の役割ではありません。
      - 通信の暗号化は TLS（HTTPS）の役割です。
    terms:
      - CSS
      - HTML
  - id: A02-043
    topic: 2-5-2
    diff: 2
    q: JSON の説明として，適切なものはどれか。
    c:
      - 文書の構造をタグで記述し，独自のタグを定義できるマークアップ言語
      - JavaScript のオブジェクトの表記法を基にした，名前と値の組などでデータを表すテキスト形式のデータ記述言語
      - Web ページの見た目を指定するための言語
      - 表形式のデータを，カンマで区切って記述する形式
    a: イ
    exp: |
      JSON（JavaScript Object Notation）は、{"name": "佐藤", "age": 20} のように、名前と値の組（オブジェクト）や配列を使ってデータを表すテキスト形式です。軽量で読み書きしやすく、多くのプログラム言語で扱えるため、Web API のデータ交換形式として広く使われています。
    why:
      - タグで構造を記述し独自タグを定義できるのは XML です。
      - 正解です。名前と値の組でデータを表す形式です。
      - Web ページの見た目を指定するのは CSS です。
      - カンマで区切った表形式は CSV です。
    know: YAML も人が読み書きしやすいデータ記述言語で、字下げで階層を表します。設定ファイルなどに使われます。
    terms:
      - JSON
      - XML
  - id: A02-044
    topic: 2-5-2
    diff: 2
    q: UML のダイアグラムのうち，オブジェクト間でやり取りされるメッセージを時間の経過に沿って表すものはどれか。
    c:
      - シーケンス図
      - クラス図
      - ステートマシン図
      - ユースケース図
    a: ア
    exp: |
      シーケンス図は、オブジェクトを横に並べ、上から下へ時間が流れるようにして、オブジェクト間で送受信されるメッセージを順番に矢印で表す図です。処理の流れや、どのオブジェクトがどの順で協調するかを表すのに使います。
    why:
      - 正解です。メッセージのやり取りを時系列で表すのがシーケンス図です。
      - クラス図は、クラスの属性・操作と、クラス間の関係（関連・継承など）を表す静的な図です。
      - ステートマシン図は、一つのオブジェクトの状態と、状態が変わるきっかけ（イベント）を表す図です。
      - ユースケース図は、利用者（アクター）とシステムが提供する機能の関係を表す図です。
    know: アクティビティ図は処理の流れ（業務の手順など）を表し、コミュニケーション図はオブジェクト間のつながりとメッセージを表します。
    terms:
      - UML
  - id: A02-045
    topic: 2-5-2
    diff: 2
    q: UML のクラス図で，クラス間の「汎化（継承）」の関係を表す記号はどれか。
    c:
      - 矢じりのない実線
      - 黒く塗りつぶしたひし形が付いた実線
      - 矢じりの付いた破線
      - 白抜きの三角形の矢じりが付いた実線（サブクラスからスーパークラスへ向ける）
    a: エ
    exp: |
      汎化（継承）は、サブクラス（子）からスーパークラス（親）に向けて、白抜きの三角形の矢じりが付いた実線で表します。「犬」は「動物」の一種、というような is-a の関係です。
    why:
      - 矢じりのない実線は、クラス間の一般的な「関連」を表します。
      - 黒く塗りつぶしたひし形は「コンポジション（強い集約）」を表します。全体が削除されると部分も削除される関係です。
      - 矢じりの付いた破線は「依存」を表します（白抜き三角の破線は実現）。
      - 正解です。白抜き三角の矢印が汎化（継承）を表します。
    know: 白抜きのひし形は「集約」（部分が全体から独立して存在しうる関係）を表します。
    terms:
      - UML
  - id: A02-046
    topic: 2-1-2-4
    diff: 2
    q: 深さ優先探索で木を探索するときに，探索中の節を記憶しておくために一般的に用いるデータ構造はどれか。
    c:
      - キュー
      - 配列による2分探索
      - ハッシュ表
      - スタック
    a: エ
    exp: |
      深さ優先探索は、行けるところまで深く進み、行き止まりになったら一つ前に戻って別の道を探す探索です。「最後に通った節から戻る」ため、後入れ先出しのスタック（または再帰呼出し）を使って、たどってきた節を記憶します。
    why:
      - キューを使うと、浅い節から順に調べる幅優先探索になります。
      - 2分探索は整列済みの配列から値を探す方法で、木の探索順の管理とは無関係です。
      - ハッシュ表は訪問済みの判定などに使うことはありますが、探索順を決める構造ではありません。
      - 正解です。戻るためにスタック（LIFO）を使います。
    terms:
      - スタック
      - 幅優先探索
  - id: A02-047
    topic: 2-2-2-6
    diff: 2
    q: n-gram の説明として，適切なものはどれか。
    c:
      - 文章を n 個のグループに分類する手法
      - 文字列中で連続する n 個の文字（または単語）の組を単位として，出現頻度などを扱う手法
      - 文を品詞に分解し，単語の原形を求める手法
      - 単語どうしの修飾関係を木構造で表す手法
    a: イ
    exp: |
      n-gram は、文字列を連続する n 個の文字や単語の組に区切って扱う手法です。例えば「情報処理」を2文字ずつ（2-gram）に区切ると「情報」「報処」「処理」になります。単語の区切りを判別しなくても全文検索の索引を作れるほか、文章の類似度の計算や、言語モデルでの次の単語の予測にも使われます。
    why:
      - 文章を分類する手法は文書分類で、n-gram そのものではありません。
      - 正解です。連続する n 個の組を単位とする手法です。
      - 品詞への分解と原形の判別は形態素解析です。
      - 修飾関係を解析するのは構文解析（係り受け解析）です。
    terms:
      - n-gram
      - 形態素解析
  - id: A02-048
    topic: 2-2-2-1
    diff: 3
    q: 次の整列アルゴリズムのうち，最悪の場合の計算量が O(n log n) であるものはどれか。
    c:
      - バブルソート
      - クイックソート
      - ヒープソート
      - 挿入ソート
    a: ウ
    exp: |
      ヒープソートは、データをヒープ（親が子より常に大きい完全2分木）に組み立て、根の最大値を取り出してヒープを再構成する操作を繰り返す整列法です。1回の再構成は木の高さ（log n）に比例する手間なので、データの並び方にかかわらず最悪でも O(n log n) です。
    why:
      - バブルソートの計算量は O(n²) です。
      - クイックソートの平均は O(n log n) ですが、基準値の選び方によっては最悪 O(n²) になります。
      - 正解です。ヒープソートは最悪の場合も O(n log n) です。
      - 挿入ソートの最悪は O(n²) です（逆順のデータなど）。
    know: マージソートも最悪 O(n log n) ですが、作業用の記憶領域が必要です。ヒープソートは作業領域をほとんど使いません。
    terms:
      - 整列アルゴリズム
      - ヒープ
      - 計算量
  - id: A02-049
    topic: 2-2-2-2
    diff: 3
    q: |
      関数 g(n) を次のように定義する。g(5) を呼び出したとき，関数 g が呼び出される回数は，最初の呼出しを含めて何回か。
      g(n)：n が 1 以下なら 1 を返す。そうでなければ g(n − 1) ＋ g(n − 2) を返す。
    c:
      - '5'
      - '9'
      - '8'
      - '15'
    a: エ
    exp: |
      g(n) の呼出し回数を C(n) とすると、n≦1 では C(n)＝1、それ以外では C(n)＝1＋C(n−1)＋C(n−2) です。
      C(0)＝1、C(1)＝1、C(2)＝1＋1＋1＝3、C(3)＝1＋3＋1＝5、C(4)＝1＋5＋3＝9、C(5)＝1＋9＋5＝15 回です。
      同じ引数の呼出し（例えば g(3) は2回、g(2) は3回）を何度も繰り返すため、呼出し回数が急増します。
    why:
      - 5 は引数の値で、呼出し回数ではありません。
      - 9 は g(4) を呼び出したときの回数です。
      - 8 は g(5) の戻り値（1,1,2,3,5,8 と増える値）で、呼出し回数ではありません。
      - 正解です。C(5)＝15 回です。
    know: このような単純な再帰は呼出し回数が指数的に増えます。計算済みの結果を記録して再利用する（メモ化・動的計画法）と、各引数につき1回の計算で済みます。
    terms:
      - 再帰
      - 動的計画法
    verify:
      value: '(() => { const C = (n) => (n <= 1 ? 1 : 1 + C(n - 1) + C(n - 2)); return C(5); })()'
  - id: A02-050
    topic: 2-3-1-7
    diff: 2
    q: オブジェクト指向プログラミングにおけるコンストラクタの説明として，適切なものはどれか。
    c:
      - スーパークラスのメソッドを，サブクラスで再定義したメソッド
      - オブジェクトが不要になったときに，使用していた資源を解放するメソッド
      - 同じ名前で引数の型や個数が異なる複数のメソッド
      - クラスからオブジェクト（インスタンス）を生成するときに呼び出され，メンバ変数の初期化などを行うメソッド
    a: エ
    exp: |
      コンストラクタは、クラスからインスタンスを生成するときに自動的に呼び出される特別なメソッドで、メンバ変数に初期値を設定するなどの準備を行います。IPA の擬似言語でも、クラス名(引数) の形でインスタンスを生成し、コンストラクタでメンバ変数を初期化する問題が出題されます。
    why:
      - これはオーバーライドの説明です。
      - これはデストラクタ（終了処理）の説明です。
      - これはオーバーロードの説明です。
      - 正解です。生成時の初期化を行うメソッドです。
    terms:
      - コンストラクタ
      - オブジェクト指向
