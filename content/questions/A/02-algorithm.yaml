  method: 作成後の逐問レビュー（アルゴリズムの動作は手計算でトレースし直して照合、用語はシラバスVer.9.2の用語例と照合）
questions:
  - id: A02-001
    topic: 2-1-1
    diff: 1
    q: 配列と単方向リストを比較したとき，配列の特徴として，適切なものはどれか。
    c:
      - 各要素が次の要素の位置を保持している。
      - 途中への要素の挿入を，後続の要素を移動せずにポインタの付け替えだけで行える。
      - 要素番号を指定して，任意の要素に直接アクセスできる。
      - 要素数をいくらでも増やせ，あらかじめ領域の大きさを決める必要がない。
    a: ウ
    exp: |
      配列は同じ型の要素を連続した領域に並べたデータ構造です。先頭位置と要素の大きさから任意の要素の位置を計算できるため、要素番号を指定して直接（一定時間で）アクセスできます。
      一方、途中に挿入・削除するには後ろの要素をずらす必要があり、手間がかかります。
    why:
      - 各要素が次の要素の位置（ポインタ）をもつのはリストの特徴です。
      - ポインタの付け替えだけで挿入できるのはリストの特徴です。
      - 正解です。要素番号による直接アクセス（ランダムアクセス）が配列の長所です。
      - 静的な配列は大きさを先に決める必要があります。大きさを自由に変えられるのはリストや動的配列です。
    know: リストは途中の挿入・削除が速い代わりに、i 番目の要素にたどり着くには先頭から順にたどる必要があります。用途に応じて使い分けます。
    terms:
      - 配列
      - リスト
  - id: A02-002
    topic: 2-1-2-1
    diff: 2
    q: 2次元配列 A[1..3, 1..4]（3行4列）の要素を，行の順に（1行目の全要素，2行目の全要素，…の順に）連続した領域に格納する。A[1, 1] を先頭から1番目としたとき，A[2, 3] は先頭から何番目に格納されるか。
    c:
      - '10'
      - '6'
      - '8'
      - '7'
    a: エ
    exp: |
      行の順に格納すると、1行目の4要素の後に2行目が続きます。A[2, 3] の前には1行目の4要素と、2行目の A[2, 1]・A[2, 2] の2要素があるので、4＋2＝6 個の後、つまり 7 番目です。
      一般に、列数が n のとき A[i, j] は (i−1)×n＋j 番目です。(2−1)×4＋3＝7 になります。
    why:
      - 10 は格納位置の計算を誤った値です（行の前にある要素数を 2×4 としてしまうなど）。
      - 6 は前にある要素の数で、何番目かを答えるには1を足す必要があります。
      - 8 は列の順（1列目の全要素から）に格納した場合の位置 (3−1)×3＋2＝8 です。
      - 正解です。(2−1)×4＋3＝7 です。
    know: 行の順に格納する方式を行優先（C 言語など）、列の順に格納する方式を列優先（Fortran など）といいます。
    terms:
      - 配列
    verify:
      value: (2-1)*4 + 3
  - id: A02-003
    topic: 2-1-2-2
    diff: 2
    q: 双方向リストの特徴として，適切なものはどれか。
    c:
      - 各要素が次の要素へのポインタと前の要素へのポインタをもつため，どちらの方向にもたどれる。
      - 各要素が次の要素へのポインタだけをもち，末尾の要素は先頭の要素を指す。
      - 最後に追加した要素から順に取り出す。
      - 要素を連続した領域に格納し，要素番号でアクセスする。
    a: ア
    exp: |
      双方向リストは、各要素が「次の要素へのポインタ」と「前の要素へのポインタ」の2つをもつリストです。前後どちらにもたどれるため、ある要素の直前への挿入や、自分自身の削除を効率よく行えます。その代わり、ポインタの分だけ記憶領域を多く使います。
    why:
      - 正解です。前後のポインタをもつのが双方向リストです。
      - 末尾が先頭を指すのは環状リスト（循環リスト）の特徴です。
      - 最後に追加したものから取り出すのはスタックの性質です。
      - 連続した領域に格納するのは配列です。
    terms:
      - リスト
  - id: A02-004
    topic: 2-1-2-3
    diff: 1
    q: 空のスタックに対して，次の操作を順に行った。最後の pop で取り出される値はどれか。ここで，push(x) はスタックに x を積み，pop はスタックから値を1つ取り出す操作である。 push(1)，push(2)，pop，push(3)，push(4)，pop，pop
    c:
      - '1'
      - '4'
      - '3'
      - '2'
    a: ウ
    exp: |
      スタックは後入れ先出し（LIFO）です。状態の変化を追います（左が底）。
      - push(1) → [1]、push(2) → [1, 2]、pop → 2 を取り出し [1]
      - push(3) → [1, 3]、push(4) → [1, 3, 4]
      - pop → 4 を取り出し [1, 3]、pop → 3 を取り出し [1]
      最後の pop で取り出されるのは 3 です。
    why:
      - 1 は最後までスタックに残る値です。
      - 4 は2回目の pop で取り出される値です。
      - 正解です。最後の pop の時点で一番上にあるのは 3 です。
      - 2 は最初の pop で取り出される値です。
    know: スタックは関数呼出しの戻り先の管理、式の評価、深さ優先探索などに使われます。
    terms:
      - スタック
  - id: A02-005
    topic: 2-1-2-3
    diff: 1
    q: 空のキューに対して，次の操作を順に行った。最後の dequeue で取り出される値はどれか。ここで，enqueue(x) はキューに x を追加し，dequeue はキューから値を1つ取り出す操作である。 enqueue(1)，enqueue(2)，dequeue，enqueue(3)，enqueue(4)，dequeue，dequeue
    c:
      - '1'
      - '4'
      - '3'
      - '2'
    a: ウ
    exp: |
      キューは先入れ先出し（FIFO）です。状態の変化を追います（左が先頭）。
      - enqueue(1) → [1]、enqueue(2) → [1, 2]、dequeue → 1 を取り出し [2]
      - enqueue(3) → [2, 3]、enqueue(4) → [2, 3, 4]
      - dequeue → 2 を取り出し [3, 4]、dequeue → 3 を取り出し [4]
      最後に取り出されるのは 3 です。
    why:
      - 1 は最初の dequeue で取り出される値です。
      - 4 はキューに残る値です。
      - 正解です。先に入った順に 1, 2, 3 と取り出されます。
      - 2 は2回目の dequeue で取り出される値です。
    know: キューは印刷の待ち行列、幅優先探索、プロセスのスケジューリングなどに使われます。
    terms:
      - キュー
  - id: A02-006
    topic: 2-1-2-4
    diff: 2
    q: |
      次の2分木を先行順（前順，行きがけ順）でたどったときに，節を訪れる順序はどれか。
      根は A，A の左の子は B，右の子は C。B の左の子は D，右の子は E。C の右の子は F（C に左の子はない）。
    c:
      - A, B, D, E, C, F
      - D, E, B, F, C, A
      - D, B, E, A, C, F
      - A, B, C, D, E, F
    a: ア
    exp: |
      先行順は「節自身 → 左部分木 → 右部分木」の順に訪れます。
      A を訪れ、次に左部分木（B → D → E）、最後に右部分木（C → F）を訪れるので A, B, D, E, C, F です。
    why:
      - 正解です。節を先に訪れてから左右の部分木をたどります。
      - D, E, B, F, C, A は後行順（後順，帰りがけ順：左 → 右 → 節）です。
      - D, B, E, A, C, F は中間順（間順，通りがけ順：左 → 節 → 右）です。
      - A, B, C, D, E, F は深さの浅い順に横に並べた幅優先探索の順です。
    know: 2分探索木を中間順でたどると、キーの小さい順に取り出せます。
    terms:
      - 2分木
      - 木構造
  - id: A02-007
    topic: 2-1-2-4
    diff: 2
    q: 空の2分探索木に，50，30，70，20，40，60，80 の順にキーを挿入した。この木を中間順（左部分木 → 節 → 右部分木）でたどったときのキーの並びはどれか。
    c:
      - 50, 30, 70, 20, 40, 60, 80
      - 50, 30, 20, 40, 70, 60, 80
      - 20, 40, 30, 60, 80, 70, 50
      - 20, 30, 40, 50, 60, 70, 80
    a: エ
    exp: |
      2分探索木では、各節について「左部分木のキーはすべて小さく、右部分木のキーはすべて大きい」ように配置されます。50 が根、30 と 70 がその子、20・40 が 30 の子、60・80 が 70 の子になります。
      中間順でたどると、小さいキーから順に訪れるため 20, 30, 40, 50, 60, 70, 80 となります。
    why:
      - 50, 30, 70, 20, 40, 60, 80 は挿入した順（この木では幅優先の順でもある）です。
      - 50, 30, 20, 40, 70, 60, 80 は先行順でたどった並びです。
      - 20, 40, 30, 60, 80, 70, 50 は後行順でたどった並びです。
      - 正解です。2分探索木の中間順は昇順になります。
    know: 2分探索木の探索の手間は木の高さに比例します。キーが昇順に挿入されると木が一直線に偏り、探索が遅くなるため、AVL 木や B 木などの平衡木が使われます。
    terms:
      - 2分探索木
      - 木構造
  - id: A02-008
    topic: 2-1-2-4
    diff: 2
    q: 完全2分木を配列で表現し，根を要素番号 1 に格納する。要素番号 i の節の左の子を 2i，右の子を 2i＋1 に格納するとき，要素番号 7 の節の親の要素番号はどれか。
    c:
      - '3'
      - '6'
      - '4'
      - '14'
    a: ア
    exp: |
      子の要素番号が 2i または 2i＋1 なので、親の要素番号は子の番号を2で割った商（小数点以下切捨て）です。7÷2＝3.5 → 3 なので、親は要素番号 3 です（3 の右の子が 2×3＋1＝7）。
    why:
      - 正解です。7÷2 の商は 3 です。
      - 6 は 7 の直前の要素で、親子関係はありません（6 は 3 の左の子）。
      - 4 は計算を誤った値です。
      - 14 は 7 の左の子の要素番号です。
    know: ヒープ（親が子より常に大きい／小さい完全2分木）はこの配列表現で実装され、ヒープソートや優先度付きキューに使われます。
    terms:
      - ヒープ
      - 2分木
    verify:
      value: Math.floor(7 / 2)
  - id: A02-009
    topic: 2-1-2-4
    diff: 2
    q: B木の特徴として，適切なものはどれか。
    c:
      - 各節の左右の部分木の高さの差が1以下に保たれる2分木である。
      - 一つの節に複数のキーをもつ多分木で，根から葉までの深さがすべて等しくなるように保たれる。
      - 各節が最大2つの子をもち，左の子のキーは親より大きい。
      - 親の値が子の値より常に大きい完全2分木である。
    a: イ
    exp: |
      B木は、一つの節（ページ）に複数のキーと複数の子をもつ多分木で、すべての葉が同じ深さになるように挿入・削除時に節の分割・併合を行います。木の高さが低く保たれ、ディスクの読み込み回数を少なくできるため、データベースの索引に広く使われています。
    why:
      - 左右の部分木の高さの差を1以下に保つのは AVL 木です。
      - 正解です。多分木で深さが均一に保たれる平衡木です。
      - 2分探索木では左の子のキーは親より小さいので、説明が誤っています。
      - 親が子より常に大きい完全2分木はヒープ（最大ヒープ）です。
    terms:
      - B木
      - 木構造
  - id: A02-010
    topic: 2-2-1
    diff: 1
    q: JIS X 0121 の流れ図記号のうち，条件によって処理の流れを分岐させる「判断」を表す記号の形はどれか。
    c:
      - 長方形
      - 平行四辺形
      - 角を丸めた長方形（端子）
      - ひし形
    a: エ
    exp: |
      流れ図では、判断（条件分岐）をひし形で表し、条件の結果に応じて複数の出口から流れが分かれます。
      主な記号：端子（開始・終了）は角の丸い長方形、処理は長方形、データ（入出力）は平行四辺形、ループ端は角を切り落とした長方形の上下の組、定義済み処理（サブルーチン）は両側に縦線のある長方形です。
    why:
      - 長方形は一般的な「処理」を表します。
      - 平行四辺形は「データ」で、入力や出力を表します。
      - 角を丸めた長方形は「端子」で、流れ図の開始と終了を表します。
      - 正解です。判断はひし形です。
    terms:
      - 流れ図
  - id: A02-011
    topic: 2-2-2-1
    diff: 1
    q: 整列済みの 1,000 件のデータから，2分探索法で目的のデータを探す。最大の比較回数はおよそ何回か。
    c:
      - 100回
      - 1,000回
      - 10回
      - 500回
    a: ウ
    exp: |
      2分探索法は、探索範囲の中央の値と比較して、範囲を毎回半分に絞り込む方法です。1,000 件の範囲は、1回の比較ごとに 500 → 250 → 125 … と半分になり、約10回で1件まで絞り込めます（2¹⁰＝1,024≧1,000）。
      最大比較回数は ⌊log₂ n⌋＋1 で、n＝1,000 なら 9＋1＝10 回です。
    why:
      - 100回は根拠のない値です。
      - 1,000回は線形探索の最大比較回数です。
      - 正解です。約 log₂ 1000≒10 回です。
      - 500回は線形探索の平均比較回数に近い値です。
    know: 2分探索法はデータが整列済みであることが前提です。計算量は O(log n) で、データが2倍になっても比較回数は1回増えるだけです。
    terms:
      - 2分探索法
      - 計算量
    verify:
      value: Math.floor(log2(1000)) + 1
  - id: A02-012
    topic: 2-2-2-1
    diff: 2
    q: 線形探索法で，探索するデータの末尾に探したい値（番兵）を置く目的として，適切なものはどれか。
    c:
      - 探索の計算量を O(log n) にする。
      - 探したい値が複数あった場合に，すべての位置を見つけられるようにする。
      - ループの中で「データの終わりに達したか」を毎回判定する必要をなくし，比較回数を減らす。
      - 探索の前にデータを整列する必要をなくす。
    a: ウ
    exp: |
      通常の線形探索では、ループのたびに「値が一致したか」と「データの終わりに達したか」の2つを判定します。末尾に探したい値（番兵）を置くと、必ずどこかで一致するのでループが止まり、「終わりに達したか」の判定が不要になります。一致した位置が番兵の位置なら「見つからなかった」と判断します。
    why:
      - 番兵を使っても計算量は O(n) のままです。比較の回数が少し減るだけです。
      - 番兵は最初に見つかった位置で探索を止めるための工夫で、すべての位置を見つけるためのものではありません。
      - 正解です。終端判定を省いて処理を効率化するのが番兵の目的です。
      - 線形探索はもともと整列を必要としません。
    terms:
      - 線形探索法
  - id: A02-013
    topic: 2-2-2-1
    diff: 2
    q: 整列アルゴリズムのうち，同じキーをもつデータの元の並び順が整列後も保たれる（安定な）ものはどれか。
    c:
      - クイックソート
      - 選択ソート
      - 挿入ソート
      - ヒープソート
    a: ウ
    exp: |
      挿入ソートは、整列済みの部分の適切な位置にデータを1つずつ挿入する方法です。挿入位置を探すとき、同じキーのデータを追い越さないように挿入すれば、元の順序が保たれます。このように同じキーのデータの順序が保たれる整列を「安定な整列」といいます。
    why:
      - クイックソートは基準値との交換で離れた位置のデータが入れ替わるため、安定ではありません。
      - 選択ソートは最小値と先頭を交換するときに順序が崩れることがあるため、安定ではありません。
      - 正解です。挿入ソートは安定な整列です（バブルソートやマージソートも安定）。
      - ヒープソートはヒープの構築・取出しで順序が崩れるため、安定ではありません。
    know: 「名前順に並べた名簿を、さらに学年で並べ替えたい」ときのように、前の並び順を活かしたい場合は安定な整列を使います。
    terms:
      - 整列アルゴリズム
  - id: A02-014
    topic: 2-2-2-1
    diff: 2
    q: クイックソートの説明として，適切なものはどれか。
    c:
      - 隣り合うデータを比較し，順序が逆であれば交換する操作を繰り返す。
      - データを半分ずつに分割していき，分割したものを整列しながら併合していく。
      - 基準値を選び，基準値より小さいグループと大きいグループに分割する操作を，各グループに対して再帰的に繰り返す。
      - 一定の間隔だけ離れたデータの組ごとに挿入ソートを行い，間隔を徐々に狭めていく。
    a: ウ
    exp: |
      クイックソートは、基準値（ピボット）を選び、それより小さい値を前、大きい値を後ろに集めてデータを2つに分割し、それぞれに同じ処理を繰り返す（分割統治法）整列方法です。平均の計算量は O(n log n) で高速ですが、基準値の選び方が悪いと最悪 O(n²) になります。
    why:
      - 隣り合うデータの比較・交換を繰り返すのはバブルソートです。
      - 分割して併合しながら整列するのはマージソートです。
      - 正解です。基準値による分割を繰り返すのがクイックソートです。
      - 間隔をあけて挿入ソートを繰り返すのはシェルソートです。
    terms:
      - 整列アルゴリズム
      - 分割統治法
  - id: A02-015
    topic: 2-2-2-1
    diff: 2
    q: |
      データ列 5，3，8，1，4 を，バブルソートで昇順に整列する。先頭から隣り合う要素を順に比較し，左の方が大きければ交換する操作を，列の末尾まで1回行った（1パス目）。1パス目終了後のデータ列はどれか。
    c:
      - 3, 1, 4, 5, 8
      - 3, 5, 1, 4, 8
      - 1, 3, 4, 5, 8
      - 3, 5, 8, 1, 4
    a: イ
    exp: |
      隣り合う要素を左から順に比べます。
      - 5 と 3 → 交換 → 3, 5, 8, 1, 4
      - 5 と 8 → そのまま
      - 8 と 1 → 交換 → 3, 5, 1, 8, 4
      - 8 と 4 → 交換 → 3, 5, 1, 4, 8
      1パス目で最大値 8 が末尾に確定します。
    why:
      - 3, 1, 4, 5, 8 は2パス目の終了後の状態です。
      - 正解です。最大値 8 が末尾に移動した状態です。
      - 1, 3, 4, 5, 8 は整列が完了した状態です。
      - 3, 5, 8, 1, 4 は最初の交換だけを行った状態です。
    know: バブルソートは1パスごとに未整列部分の最大値が末尾に確定します。比較回数は n(n−1)/2 で、計算量は O(n²) です。
    terms:
      - 整列アルゴリズム
    verify:
      manual: 1パス目の比較・交換を逐一トレースし 3,5,1,4,8 を確認。2パス目 3,1,4,5,8 も確認
