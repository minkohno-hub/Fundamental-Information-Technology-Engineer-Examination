      - 15 → 15 mod 7＝1 → 位置 1 に格納
      - 22 → 22 mod 7＝1 → 位置 1 は使用中（衝突）→ 位置 2 に格納
      - 8 → 8 mod 7＝1 → 位置 1, 2 が使用中 → 位置 3 に格納
      - 29 → 29 mod 7＝1 → 位置 1, 2, 3 が使用中 → 位置 4 に格納
