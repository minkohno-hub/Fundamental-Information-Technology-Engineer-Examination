questions:
  - id: A14-518
    topic: 14-7-3
    diff: 3
    scope: 14-7-3 EVM による完成時まで推定（ETC）。残りの作業の出来高分を、現在のコスト効率で割り戻して見積もる問題
    prereq: コスト効率 CPI は EV ÷ AC であり、残作業の出来高は BAC － EV、ETC は残作業を現在の効率で進めた場合の追加コストであること
    hard: 完成時総額（EAC）ではなく、残作業分だけの見積り（ETC）を問うている点と、効率で割り戻す対象が「残りの出来高」である点の、2つを正しく押さえる必要がある。
    q: |
      あるプロジェクトで、総予算（BAC）は 3,600 万円、現時点の計画値（PV）は 1,000 万円、出来高（EV）は 900 万円、実コスト（AC）は 1,200 万円である。残りの作業も、現在までのコスト効率と同じ効率で進むと仮定したとき、完成時まで推定（ETC）、すなわち残りの作業に必要となる追加のコストはおよそ何万円か。
    c:
      - 3,900
      - 3,000
      - 2,700
      - 3,600
    a: エ
    exp: |
      まず、コスト効率 CPI を求めます。

      CPI ＝ EV ÷ AC ＝ 900 ÷ 1,200 ＝ 0.75

      残りの作業の出来高は、BAC － EV ＝ 3,600 － 900 ＝ 2,700 万円分です。この作業を効率 0.75 で進めるため、必要なコストは、

      ETC ＝ 2,700 ÷ 0.75 ＝ 3,600 万円

      となります。なお、完成時総額の見積り（EAC）は、既に使った実コストに ETC を加えた 1,200 ＋ 3,600 ＝ 4,800 万円です。ETC は、そのうち残りの分だけを指します。
    why:
      - 残りの出来高を効率で割り戻さず、実コストにそのまま加えた値です。現在の効率（CPI 0.75）が続く前提では、残作業には出来高以上のコストがかかります。
      - スケジュール効率 SPI（EV ÷ PV ＝ 0.9）で残りの出来高を割り戻した場合の値です。コストの見積りには CPI を使います。
      - 残りの出来高（BAC － EV）そのものです。効率の割り戻しが必要です。
      - 正解です。残りの出来高 2,700 万円分を、CPI 0.75 で割り戻した値です。
    know: EVM の見積りは、対象を区別することが要点である。ETC は残作業の追加コスト、EAC は実コストを含む完成時総額であり、どちらも「出来高 ÷ 効率」という割り戻しの形で求める。
    terms:
      - EVM
      - EAC
      - CPI
    verify:
      type: value
      value: 3600
  - id: A14-519
    topic: 14-6-3
    diff: 2
    scope: 14-6-3 クリティカルパス。作業のネットワークから、最長となる経路の所要期間を求める問題
    prereq: プロジェクトの所要期間は、最長の経路（クリティカルパス）の長さで決まること
    hard: 複数の経路の長さを全て計算し、最大のものを選ぶ必要がある。作業時間の単純な合計（全作業の総和）との区別も問われる。
    q: |
      作業 A（3 日）の後に、作業 B（4 日）と作業 C（5 日）が並行して行える。B と C の両方が終わると、作業 D（2 日）が行える。プロジェクト全体の最短の所要期間は何日か。
    c:
      - '11'
      - '14'
      - '9'
      - '10'
    a: エ
    exp: |
      経路ごとに所要期間を計算します。

      - A → B → D: 3 ＋ 4 ＋ 2 ＝ 9 日
      - A → C → D: 3 ＋ 5 ＋ 2 ＝ 10 日

      最長の経路は A → C → D であり、プロジェクトの所要期間は 10 日です。この経路がクリティカルパスであり、C の遅れはそのまま全体の遅れになります。
    why:
      - 並行する B と C の期間の差（5 － 4 ＝ 1 日）を、最長経路の 10 日に加えてしまった場合の値です。短い方の経路との差は、全体の期間には加わりません。
      - 全作業の所要時間の合計（3 ＋ 4 ＋ 5 ＋ 2）です。B と C は並行して行えるため、合計にはなりません。
      - 短い方の経路（A → B → D）の長さです。所要期間は最長の経路で決まります。
      - 正解です。最長の経路 A → C → D は 10 日であり、これがプロジェクトの所要期間です。
    know: クリティカルパスは「最長の経路」であり、その経路上の作業には余裕（フロート）がない。並行作業がある場合、全体の期間は合計ではなく最長経路で決まる点が要点である。
    terms:
      - クリティカルパス
    verify:
      type: value
      value: 10
  - id: A14-520
    topic: 14-6-3
    diff: 3
    scope: 14-6-3 3点見積もりにおける見積もりの幅（ばらつき）。悲観値と楽観値の差から、PERT の標準偏差に当たる量を求める問題
    prereq: 3点見積もりでは、楽観値・最可能値・悲観値から期待値を求める式のほかに、（悲観値 － 楽観値）÷ 6 が見積りのばらつき（標準偏差）の目安になること
    hard: 期待値の式（最可能値を 4 倍に重み付けする式）と混同せず、幅そのものから不確実さの大きさを取り出す必要がある。
    q: |
      ある作業の所要期間について、楽観値は 10 日、最可能値は 16 日、悲観値は 28 日と見積もられた。3点見積もり（PERT）において、この見積もりのばらつきの大きさ（標準偏差に当たる量）は何日か。
    c:
      - '18'
      - '3'
      - '17'
      - '9'
    a: イ
    exp: |
      PERT では、見積もりのばらつきは、悲観値と楽観値の差を 6 で割って表します。

      （28 － 10）÷ 6 ＝ 18 ÷ 6 ＝ 3 日

      この値が大きいほど、見積もりの不確実さが大きいことを意味します。なお、期待値のほうは （10 ＋ 4 × 16 ＋ 28）÷ 6 ＝ 17 日であり、ばらつきとは別の量です。最可能値が期待値の計算にだけ現れ、ばらつきの計算には現れない点も、この2つの式の違いです。
    why:
      - 悲観値と楽観値の差そのものです。ばらつきは、この差を 6 で割って表します。
      - 正解です。（悲観値 － 楽観値）÷ 6 ＝ 3 日です。
      - 期待値の計算結果（17 日）です。問われているのは、見積もりのばらつきのほうです。
      - 差を 2 で割った値です。PERT のばらつきは、差を 6 で割ります。
    know: 3点見積もりは、期待値（中心）とばらつき（幅）の2つの量を与える。幅は悲観値と楽観値の差から求め、見積もりの不確実さを表す点が要点である。
    terms:
      - 3点見積もり
      - PERT
    verify:
      type: value
      value: 3
  - id: A14-521
    topic: 14-8-3
    diff: 3
    scope: 14-8-3 リスクの期待値（EMV）と対策の費用対効果。発生確率と影響額から期待損失を求め、対策による期待損失の減少額と対策費を比較する問題
    prereq: 期待損失は発生確率 × 影響額、対策の判断は期待損失の減少額と対策費の比較で行うこと
    hard: 対策の前後で期待損失を2回計算し、その差と対策費を比べる、という多段の判断が必要である。
    q: |
      あるリスクは、発生確率が 20 ％、発生時の損失が 500 万円である。対策費 60 万円をかければ、発生確率を 5 ％まで下げられる。対策によって期待損失が減少する額は何万円か。
    c:
      - '25'
      - '75'
      - '400'
      - '100'
    a: イ
    exp: |
      対策の前後で、期待損失を計算します。

      - 対策なし: 0.2 × 500 ＝ 100 万円
      - 対策あり: 0.05 × 500 ＝ 25 万円
      - 減少額 ＝ 100 － 25 ＝ 75 万円

      期待損失は 75 万円減少します。対策費は 60 万円であり、減少額を下回るため、この対策には費用対効果の面で実施する価値があると判断できます。
    why:
      - 対策後の期待損失そのものです。問われているのは、対策による減少額です。
      - 正解です。期待損失は 100 万円から 25 万円へ、75 万円減少します。
      - 発生確率ではなく、発生しない確率（1 － 0.20）を損失に掛けた場合の値（0.8 × 500 ＝ 400）です。期待損失は、発生確率を掛けて求めます。
      - 対策前の期待損失そのものです。減少額は、対策後の値との差です。
    know: リスク対策の判断は、期待損失の減少額と対策費の比較で行う。確率と影響額の両方を見る EMV の考え方が要点である。
    terms:
      - EMV
      - リスク対応
    verify:
      type: value
      value: 75
  - id: A14-522
    topic: 14-6-3
    diff: 3
    scope: 14-6-3 スケジュールの短縮技法（クラッシング）。遅れを取り戻すために、クリティカルパス上の作業へ資源を追加投入する判断
    prereq: 期間の短縮には、クリティカルパス上の作業を短縮する必要があること、クラッシングは資源の追加投入により作業期間を詰める方法であること
    hard: 遅れの挽回策として、効果のある対象（クリティカルパス上の作業）と方法（資源の追加）の組合せを選ぶ必要がある。ファストトラッキング（重ねての実施）との区別も問われる。
    q: |
      プロジェクトがクリティカルパス上の作業の遅れで、全体に 5 日の遅延が見込まれている。品質への影響を抑えながら、期間を短縮するための対応として、適切なものはどれか。
    c:
      - クリティカルパス上にない、余裕のある作業の担当者を増やす
      - 遅延の報告を月末まで遅らせ、その間に自然に遅れが解消するのを待つ
      - クリティカルパス上の作業に担当者を追加投入し、作業期間そのものを詰める（クラッシング）
      - 後続の作業の開始を早めるため、テストが終わる前に本番移行を始める
    a: ウ
    exp: |
      全体の期間を決めているのはクリティカルパスであり、短縮の対象はその上の作業です。クラッシングは、担当者の追加投入などで作業期間そのものを詰める方法であり、コストは増えますが、作業の順序や品質の前提を変えずに期間を短縮できます。余裕のある作業を速くしても、全体の期間は縮みません。テスト完了前の本番移行は、順序を変えるファストトラッキングの乱暴な適用であり、品質と手戻りのリスクが高まります。
    why:
      - 余裕（フロート）のある作業の短縮は、全体の期間には影響しません。
      - 報告を遅らせることは対策ではなく、対応の機会を失わせます。
      - 正解です。クリティカルパス上の作業への資源の追加投入が、全体の短縮に効きます。
      - 品質を損なう進め方であり、適切な短縮策ではありません。順序の変更は、リスクを伴う別種の技法です。
    know: 期間短縮の第一原則は、対象がクリティカルパス上にあることである。クラッシング（資源の追加）とファストトラッキング（順序の変更）は、仕組みとリスクが異なる点が要点である。
    terms:
      - クラッシング
      - クリティカルパス
    verify:
      manual: 遅延がクリティカルパス上の作業に起因することから、短縮の対象はその作業であり、資源の追加投入（クラッシング）が適切であることを、他の選択肢（余裕のある作業の強化、順序の強引な変更、報告の先送り）との対比で確認した。
  - id: A14-523
    topic: 14-4-3
    diff: 3
    scope: 14-4-3 緊急変更の事後の手続。承認を経ずに先行実施した変更について、事後に影響評価と承認の追跡を行い、記録と計画への反映を残す対応を選ぶ問題
    prereq: 障害対応などの緊急時には変更の先行実施が認められることがあるが、その場合も事後に正式な変更管理の手続を追う必要があること
    hard: 「緊急だったので手続は不要」という誤りと、「未承認だったので元に戻す」という誤りの、両方を退ける必要がある。緊急対応の例外は「手続の省略」ではなく「手続の後回し」である点が問われる。
    q: |
      重大な障害への対応として、プロジェクトマネージャは、変更管理委員会の承認を待たずに、緊急の修正を先行して実施させた。障害が収まった後に行うべきこととして、適切なものはどれか。
    c:
      - 緊急対応であったため、変更の記録や事後の手続は不要であり、そのまま次の作業に移る
      - 承認を経ていないことを理由に、実施した修正を直ちに元の状態に戻す
      - 今後の障害対応でも常に承認なしで実施できるよう、変更管理の手続そのものを廃止する
      - 実施した変更について、影響の評価と事後の承認手続を行い、変更の記録を残して、計画と成果物に反映する
    a: エ
    exp: |
      緊急時には、承認を待たずに変更を先行実施することが認められる場合がありますが、それは手続の省略ではなく、順序の入れ替えです。事態が収まった後は、実施した変更について影響を評価し、正式な承認手続を追って、変更の記録と、計画・関連成果物への反映を残します。記録が残らなければ、現在のシステムが「なぜこの状態なのか」が分からなくなり、後の保守や検証が困難になります。一方、障害対応として必要な修正を、未承認という理由だけで元に戻すことも適切ではありません。
    why:
      - 緊急対応でも、事後の記録と手続は必要です。記録のない変更は、後の検証や引継ぎを困難にします。
      - 元に戻すことが目的ではなく、実施した変更を正規の手続にのせて管理下に置くことが必要です。障害対応の修正自体は必要なものでした。
      - 例外的な先行実施を常態化させることは、変更管理そのものを崩すことになります。緊急時の扱いは、あくまで例外です。
      - 正解です。先行実施した変更は、事後に評価と承認を追い、記録と計画への反映を残すのが変更管理の扱いです。
    know: 統合変更管理の要点は、「変更を止めること」ではなく「評価と承認を経て、計画に正式に反映すること」である。緊急変更では、この順序が前後するだけで、手続そのものが免除されるわけではない。
    terms:
      - 変更管理
    verify:
      manual: 緊急変更の扱い（先行実施は認められても、事後の影響評価・承認の追跡・記録と計画への反映が必要であること）と各選択肢を照合し、イだけが適切な対応であることを確認した。
  - id: A14-524
    topic: 14-10-3
    diff: 3
    scope: 14-10-3 購入か自社開発かの判断（メイク・オア・バイ）。固定費と変動費の構造が異なる2案について、数量の損益分岐点を求める問題
    prereq: 2案の総費用が等しくなる数量は、固定費の差 ÷ 変動費の差で求めること
    hard: 固定費と変動費の組み合わせから分岐の式を立て、割り算の向きを取り違えない必要がある。
    q: |
      ある部品について、自社で作る場合は固定費 800 万円と 1 個当たり 2 万円の変動費がかかり、外部から買う場合は 1 個当たり 5 万円がかかる。両案の総費用が等しくなる数量（損益分岐点）は何個か。
    c:
      - '400'
      - '114'
      - '160'
      - '267'
    a: エ
    exp: |
      数量を x 個とし、両案の総費用を等しく置きます。

      自社: 800 ＋ 2x（万円）
      購入: 5x（万円）
      800 ＋ 2x ＝ 5x
      800 ＝ 3x
      x ＝ 266.7

      損益分岐点は約 267 個です。これより多く作る場合は、固定費を薄められる自社案が安くなり、少ない場合は購入案が安くなります。
    why:
      - 固定費を自社案の変動費で割った場合（800 ÷ 2）の値です。比較すべきは、変動費どうしの差です。
      - 変動費の差ではなく、変動費の合計（2 ＋ 5 ＝ 7 万円）で固定費を割った場合の値（800 ÷ 7 ≒ 114）です。分岐点は、変動費の差（5 － 2）で割ります。
      - 固定費を変動費の差ではなく、購入単価そのもので割った場合（800 ÷ 5）の値です。差し引きの相手は、自社案の変動費との差です。
      - 正解です。800 ÷ 3 ＝ 約 267 個です。
    know: メイク・オア・バイの判断は、数量の分岐点の計算に帰着する。固定費の差を変動費の差で割る、という損益分岐の構造が要点である。
    terms:
      - 損益分岐点
    verify:
      type: value
      value: 267
  - id: A14-525
    topic: 14-9-3
    diff: 3
    scope: 14-9-3 品質コストの分類。予防コスト・評価コスト・失敗コストへの、品質に関する費用の振り分けの判断
    prereq: 品質コストは、予防（不具合を出さない活動）、評価（検査・試験）、失敗（不具合の手直しや賠償）の3つに分類されること
    hard: 費用の名目ではなく、その活動の目的（予防か、評価か、失敗の処理か）で分類する必要がある。
    q: |
      品質コストの分類として、適切な組合せはどれか。
    c:
      - 設計レビューの費用は評価コスト、受入検査の費用は失敗コスト、顧客への賠償の費用は予防コストである
      - 設計レビューの費用は失敗コスト、受入検査の費用は予防コスト、顧客への賠償の費用は評価コストである
      - 設計レビュー、受入検査、賠償の費用は、いずれも評価コストである
      - 設計レビューの費用は予防コスト、受入検査の費用は評価コスト、顧客への賠償の費用は失敗コストである
    a: エ
    exp: |
      品質コストは、活動の目的で分類します。設計レビューのように、不具合を未然に防ぐ活動の費用は予防コストです。受入検査のように、適合しているかを確かめる活動の費用は評価コストです。不具合が実際に起きた後の賠償のような費用は失敗コスト（外部失敗コスト）です。予防に投資すると、失敗コストが下がる、という関係で全体を読みます。
    why:
      - 3つの費用の分類が、それぞれずらして対応付けられています。
      - レビューは不具合の発生前の活動であり、失敗コストではありません。
      - 賠償は、適合の確認ではなく不具合の発生後の費用であり、評価コストには含まれません。
      - 正解です。予防（レビュー）、評価（検査）、失敗（賠償）の対応が正しくなっています。
    know: 品質コストの分類は、費用の発生時点と目的（防ぐ・確かめる・処理する）で決まる。予防コストを増やすと失敗コストが減る、という配分の考え方が要点である。
    terms:
      - 品質コスト
      - 予防コスト
    verify:
      manual: 設計レビュー（予防）、受入検査（評価）、顧客への賠償（失敗）という3費用の分類が、活動の目的に基づいて正しく対応付けられることを確認した。
