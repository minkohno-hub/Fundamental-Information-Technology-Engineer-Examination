questions:
  - id: A13-046
    topic: 13-1-2
    diff: 2
    q: 構造化手法で用いられる HIPO の説明として，適切なものはどれか。
    c:
      - 機能を階層的に表した図式目次と，各機能の入力・処理・出力を表した IPO 図などで，プログラムの機能を記述する。
      - システムの状態と，イベントによる状態間の遷移を図式化する。
      - データの流れと処理の関係を，プロセス，データストア，外部実体，データフローで表す。
      - データベースに格納するデータの構造を，エンティティとリレーションシップで表す。
    a: ア
    exp: |
      HIPO（Hierarchy plus Input Process Output）は、システムの機能を階層的に表す図式目次と、それぞれの機能について入力（Input）・処理（Process）・出力（Output）を対応付けて表す IPO 図（総括図式・詳細図式）で構成される構造化手法の表記法です。機能を段階的に詳細化しながら記述できます。
    why:
      - 正解です。図式目次と IPO 図で機能を記述します。
      - これは状態遷移図の説明です。
      - これは DFD の説明です。
      - これは E-R 図の説明で、データ構造の表記法です。
    terms: [HIPO, 状態遷移図, DFD, 構造化設計]

  - id: A13-047
    topic: 13-1-2
    diff: 1
    q: 構造化手法における段階的詳細化の説明として，適切なものはどれか。
    c:
      - システムの機能を上位から下位へ順に分割し，詳細なレベルまで少しずつ具体化していく。
      - 動作するプログラムを早期に作成して利用者に評価してもらい，改良を繰り返す。
      - データとそれを操作する手続を一つにまとめて部品化する。
      - 完成したプログラムからソースコードを解析して設計情報を取り出す。
    a: ア
    exp: |
      段階的詳細化は、トップダウンの考え方に基づき、システム全体の機能を大きな単位から順に分割し、各階層で少しずつ詳細にしていく手法です。結果として機能が階層構造化され、構造化チャートなどで表現できます。
    why:
      - 正解です。上位から下位へ機能を分割して具体化します。
      - これはプロトタイピングの説明です。
      - これはオブジェクト指向におけるカプセル化の説明です。
      - これはリバースエンジニアリングの説明です。
    terms: [構造化設計]

  - id: A13-048
    topic: 13-3-2-1
    diff: 2
    q: 開発環境の稼働状況管理のうち，資源管理として行う活動の例として，最も適切なものはどれか。
    c:
      - 開発用サーバの CPU 使用率やディスク使用量，ソフトウェアライセンスの使用数を把握し，不足する前に増強や再配分を行う。
      - 開発する製品の機能要件を利用者と合意し，要件定義書を作成する。
      - 本番環境で発生したインシデントの根本原因を調査する。
      - 開発者の作業時間を基に，プロジェクトの出来高を算出する。
    a: ア
    exp: |
      開発環境の稼働状況管理では、開発用のハードウェア、ソフトウェア、ネットワーク、ライセンスなどの資源の使用状況を把握し、不足や無駄がないよう計画的に割り当てる資源管理と、開発環境の運用時間、バックアップ、利用者権限、障害対応などを管理する運用管理を行います。
    why:
      - 正解です。開発用資源の使用状況を把握して適切に配分します。
      - これは要件定義の活動で、開発環境の管理ではありません。
      - これはサービスマネジメントの問題管理の活動です。
      - これはプロジェクトマネジメントの EVM による進捗管理の活動です。
    terms: [EVM, 問題管理]
