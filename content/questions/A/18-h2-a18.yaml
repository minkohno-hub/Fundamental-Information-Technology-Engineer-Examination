questions:
  - id: A18-501
    topic: 18-1-2
    diff: 3
    scope: 18-1-2 投資の評価（回収期間法）。効果が年ごとに異なる場合に、累積の効果が投資額に達する時点を求める計算
    prereq: 回収期間法では、年ごとの効果を累積し、投資額に達するまでの期間を求めること、達した年の途中の分はその年の効果で按分すること
    hard: 効果が一定でないため、単純な割り算では求められず、累積の計算と端数の按分が必要になる。
    q: |
      2,000 万円を投資して業務システムを導入する。得られる効果は、1 年目が 500 万円、2 年目が 800 万円、3 年目が 1,000 万円の見込みである。回収期間法で評価すると、投資額を回収するのに要する期間はおよそ何年か。
    c:
      - '2.5'
      - '2'
      - '3'
      - '2.7'
    a: エ
    exp: |
      効果を累積します。1 年目で 500 万円、2 年目で 500 ＋ 800 ＝ 1,300 万円、3 年目で 1,300 ＋ 1,000 ＝ 2,300 万円です。投資額の 2,000 万円に達するのは 3 年目の途中です。

      不足分は 2,000 － 1,300 ＝ 700 万円であり、3 年目の効果 1,000 万円で按分すると 700 ÷ 1,000 ＝ 0.7 年です。したがって、回収期間は 2 ＋ 0.7 ＝ 2.7 年です。
    why:
      - 投資額を 2 年目の効果 800 万円で割った値（2,000 ÷ 800）です。効果は年ごとに異なるため、この計算は成り立ちません。
      - 効果を毎年 1,000 万円と読み違えて割った値（2,000 ÷ 1,000）です。1 年目と 2 年目の効果は、これより小さい値です。
      - 累積が投資額を超える年（3 年目）を、そのまま期間として答えた値です。3 年目の途中で達する分を按分する必要があります。
      - 正解です。累積と按分により、2.7 年です。
    know: 回収期間法は、効果が年ごとに異なる場合は「累積して、達した年は按分する」という手順が要点である。一定の効果で割る近道は、効果が変動する場合には使えない。
    terms:
      - 回収期間法
      - 投資評価
    verify:
      type: value
      value: 2.7
  - id: A18-502
    topic: 18-2-1
    diff: 3
    scope: 18-2-1 要求分析。利用者が口にする要望（手段）の背後にある、本来の要求（目的）を掘り起こす進め方の判断
    prereq: 要求分析では、利用者の要望をそのまま仕様にするのではなく、その要望で何を解決したいのかという本来の要求を確認すること
    hard: 要望の文面（「帳票が欲しい」）と、その背後の目的（「情報を早く確認したい」）を区別し、代替案の検討につなげる読み取りが問われる。
    q: |
      要求分析のインタビューで、利用者から「毎朝、前日の売上を集計した帳票を印刷して配ってほしい」という要望が出た。この要望への対応として、要求分析の進め方として適切なものはどれか。
    c:
      - 帳票の要望は古い方法であるとして、理由を聞かずに却下する
      - 帳票が何のために必要かを確認する。目的が朝の会議での数値確認であれば、画面での即時表示など、目的に合った別の実現方法も含めて検討する
      - 帳票の様式の細部（文字の大きさ、罫線）を先に決めてから、目的を確認する
      - 要望どおり、帳票の印刷と配布の仕様をそのまま要件として確定する
    a: イ
    exp: |
      利用者の要望は、しばしば「手段」の形で語られます。要求分析では、その手段で解決したいこと（目的）を確認することが重要です。本件では、目的が「朝の会議で前日の売上を確認すること」であれば、印刷物の配布よりも、画面で即時に最新値を表示する方が目的に合う場合があります。目的を確認してから実現方法を検討することで、より良い要件になります。要望をそのまま確定すること、理由なく却下することのいずれも、分析の進め方として不適切です。
    why:
      - 理由を聞かずに却下すると、本来の要求自体を見失います。
      - 正解です。手段の背後の目的を確認し、実現方法の選択肢を広げます。
      - 様式の細部は、実現方法が決まった後の話であり、目的の確認が先です。
      - 要望をそのまま仕様にすると、目的に合わない手段が固定されてしまうことがあります。
    know: 要求分析の要点は、「要望（手段）と要求（目的）を区別する」ことである。目的が分かれば、実現方法の選択肢が広がる、という進め方が鍵である。
    terms:
      - 要求分析
      - インタビュー
    verify:
      manual: 帳票という手段の形で語られた要望について、その目的（朝の会議での数値確認）を確認し、目的に合った実現方法を含めて検討する進め方が、要求分析として適切であることを確認した。
  - id: A18-503
    topic: 18-3-2-2
    diff: 3
    scope: 18-3-2-2 情報提供依頼書（RFI）と提案依頼書（RFP）の使い分け。調達の段階に応じて、出す文書を選ぶ判断
    prereq: RFI は、調達の検討の初期に、実現方法や製品の情報を集めるための文書であり、RFP は、要件を示して具体的な提案と見積りを求める文書であること
    hard: 調達の段階（情報収集か、提案の依頼か）から、文書の種類を逆算する必要がある。RFP の前に RFI があるという順序も含まれる。
    q: |
      新しい業務分野のシステム化を検討しているが、どのような製品や実現方法があるのか、社内に知見がない。調達の進め方として、この段階で適切なものはどれか。
    c:
      - 情報を集めずに、知名度が最も高いベンダに発注する
      - ベンダ各社に RFI（情報提供依頼書）を出し、製品や実現方法の情報を集めてから、要件と調達の方針を固める
      - ベンダ各社に、価格だけを問い合わせる
      - 直ちに RFP（提案依頼書）を出し、具体的な提案と見積りを求める
    a: イ
    exp: |
      RFI（情報提供依頼書）は、調達の検討の初期段階で、市場にある製品やサービス、実現方法の情報を集めるための文書です。本件のように、実現方法自体が固まっていない段階では、まず RFI で情報を集め、それを基に要件と調達の方針を固めてから、RFP（提案依頼書）で具体的な提案と見積りを求めるのが、順序として適切です。要件が固まらないまま RFP を出すと、比較可能な提案は集まりません。
    why:
      - 情報収集をせずに発注先を決める進め方は、調達の手続として不適切です。
      - 正解です。情報収集の段階では、RFI が適切です。
      - 価格だけでは、実現方法の適否が判断できません。本件で必要なのは、まず情報です。
      - RFP は、要件が固まった後に提案と見積りを求める文書であり、本件の段階では早すぎます。
    know: 調達の文書は、段階で使い分ける。知見がない初期は RFI で情報を集め、要件が固まったら RFP で提案を求める、という順序が要点である。
    terms:
      - RFI
      - RFP
      - 情報提供依頼書
    verify:
      manual: 実現方法の知見がない検討初期の段階では、RFIで製品や実現方法の情報を集めてから要件と方針を固める進め方が適切であり、RFPはその後の段階の文書であることを確認した。
  - id: A18-504
    topic: 18-3-2-5
    diff: 3
    scope: 18-3-2-5 調達選定。提案の評価基準を事前に定め、価格だけでなく技術や体制を含めて総合的に評価する進め方の判断
    prereq: 調達選定では、評価の基準と重み付けを提案の募集前に定め、価格、技術、実績、サポート体制などを総合的に評価して選定すること
    hard: 最低価格への飛びつきを避け、評価の公平さ（基準の事前決定）まで含めた進め方を読み取る必要がある。
    q: |
      複数のベンダから提案書と見積書を受け取った。調達選定の進め方として、適切なものはどれか。
    c:
      - 付き合いの長いベンダを、評価を行わずに選定する
      - 募集前に定めた評価基準に沿って、価格、提案の技術的な内容、実績、サポート体制を総合的に評価し、選定の理由を記録する
      - 見積価格が最も安いベンダを、他の項目を評価せずに選定する
      - 提案を受け取った後に、その都度都合の良い評価基準を作って選定する
    a: イ
    exp: |
      調達選定では、評価基準を事前に（提案の募集前に）定めておくことが、公平さの前提です。その基準に沿って、価格だけでなく、技術的な内容、導入の実績、サポート体制などを総合的に評価します。選定の理由を記録しておくことも、後からの説明のために必要です。価格だけで選ぶと、技術や体制の不足による失敗の危険があります。評価基準を後から作る進め方は、公平さを損ないます。
    why:
      - 評価を行わない選定は、調達の手続として不適切です。
      - 正解です。事前の基準による総合評価と、理由の記録が選定の進め方です。
      - 価格は評価の一項目であり、それだけで選定すると、技術や体制の評価が抜け落ちます。
      - 基準を後から作ると、特定のベンダに有利な選定になりかねず、公平さを損ないます。
    know: 調達選定の要点は、「基準は先に定める」「価格だけでなく総合的に評価する」という 2 点である。公平さの担保が、手続の中心にある。
    terms:
      - 調達選定
      - 評価基準
    verify:
      manual: 募集前に定めた評価基準に沿って価格・技術・実績・体制を総合的に評価し、選定理由を記録する進め方が調達選定として適切であることを、価格のみ・基準の後付け・無評価の選定との対比で確認した。
  - id: A18-505
    topic: 18-1-1
    diff: 3
    scope: 18-1-1 システム化構想における全体最適。部門ごとの個別の最適化ではなく、全社的な視点でシステム化を構想する判断
    prereq: システム化構想の立案では、経営の目標に沿って、部門を横断する全体最適の視点で、システム化の対象と方向性を定めること
    hard: 部門の要望に個別に応えること（部分最適）と、全社のデータの流れや重複の解消（全体最適）の対立を読み取る必要がある。
    q: |
      ある会社では、営業、製造、在庫の各部門が、それぞれ独自のシステムを導入し、同じ顧客情報や製品情報を二重に入力している。システム化構想の立案における判断として、適切なものはどれか。
    c:
      - 最も発言力の強い部門のシステムに、全てを合わせる
      - 部門を横断する全体最適の視点で、情報の重複をなくし、データの連携を図る方向で構想を立てる
      - 現状のシステム構成は変えず、部門間の連携は手作業で補う
      - 各部門の要望に個別に応え、部門ごとに最適なシステムを導入する
    a: イ
    exp: |
      システム化構想は、経営の目標に沿って、全社の視点でシステム化の方向性を定める段階です。部門ごとに最適化されたシステムが乱立すると、本件のような情報の二重入力や、データの不整合が生じます。全体最適の視点では、共通の情報を一元化し、部門間のデータ連携を図る方向で構想を立てます。部門の要望は、その後の計画で調整していきます。
    why:
      - 特定の部門に合わせることは、全体の最適化にはならず、他の部門との不整合を生みます。
      - 正解です。全体最適の視点で、情報の重複の解消と連携を図ります。
      - 手作業で補うことは、システム化の構想としての対処にはなりません。
      - 部門ごとの最適化（部分最適）は、現状の問題そのものであり、重複は解消されません。
    know: システム化構想の要点は、「部分最適ではなく全体最適」という視点である。部門の要望と全社の整合の対立は、この視点で判断することが鍵である。
    terms:
      - 全体最適
      - システム化構想
    verify:
      manual: 部門ごとにシステムが乱立し情報が二重入力されている状況に対して、全体最適の視点で情報の一元化と部門間の連携を図る構想が適切であることを確認した。
  - id: A18-506
    topic: 18-2-2-4
    diff: 3
    scope: 18-2-2-4 利害関係者要件の確認。要件定義で、関係する立場の人（利用者だけでなく、承認者や運用者など）を漏れなく洗い出し、要件を確認する判断
    prereq: 利害関係者（ステークホルダ）には、直接の利用者のほか、業務の責任者、運用や保守の担当者、関係する他部門などが含まれ、その要件を確認すること
    hard: 「使う人」だけが関係者ではないことを読み取り、漏れた立場の要件が後から問題になる構造を理解する必要がある。
    q: |
      新しい受注システムの要件定義で、営業部門の担当者だけから要件を聞き取って進めたところ、稼働直前になって、経理部門の請求処理の都合や、運用部門の夜間処理の制約と合わないことが判明した。要件定義における問題点はどれか。
    c:
      - システムの画面のデザインを先に決めていなかったこと
      - 営業部門の担当者への聞き取りの回数が少なかったこと
      - 要件定義書のページ数が不足していたこと
      - 利害関係者の洗い出しが不十分であり、利用部門以外の関係者（経理、運用など）の要件を確認していなかったこと
    a: エ
    exp: |
      受注という業務は、営業だけで完結せず、請求を扱う経理や、夜間処理を行う運用ともつながっています。要件定義では、直接の利用者だけでなく、業務の責任者、関係する他部門、運用・保守の担当者といった利害関係者を洗い出し、それぞれの要件を確認することが必要です。本件は、その洗い出しと確認が不足したために、後工程で制約との不一致が判明した事例です。聞き取りの回数や文書の量の問題ではありません。
    why:
      - 画面のデザインの順序の問題ではなく、要件の確認範囲の問題です。
      - 同じ相手への聞き取りを増やしても、漏れた立場の要件は出てきません。
      - 文書の量ではなく、確認すべき相手の範囲の問題です。
      - 正解です。利害関係者の範囲の不足が、後からの不一致の原因です。
    know: 要件定義の要点は、「関係者は使う人だけではない」という視点である。業務のつながりから関係者を洗い出すことが、後工程の手戻りを防ぐ鍵である。
    terms:
      - 利害関係者
      - ステークホルダ
    verify:
      manual: 営業部門だけから要件を聞き取ったために経理と運用の制約と合わなくなった事例の問題点が、利害関係者の洗い出しの不足であることを確認した。
  - id: A18-507
    topic: 18-3-2-6
    diff: 3
    scope: 18-3-2-6 調達リスク分析。ベンダの経営の安定性や実績など、調達に伴うリスクを事前に評価する判断
    prereq: 調達リスク分析では、ベンダの経営状態、技術力、同種の導入実績、契約後のサポートの継続性などを評価し、リスクへの備えを検討すること
    hard: 提案の内容の良し悪しだけでなく、相手先の継続性という、契約の期間全体にわたるリスクを読み取る必要がある。
    q: |
      基幹システムの開発を、提案内容が優れた新興ベンダに発注しようとしている。調達リスク分析として、確認すべき事項はどれか。
    c:
      - ベンダの経営の安定性や財務の状態、同種システムの導入実績、稼働後にサポートを継続できる体制があるかを確認する
      - ベンダの担当者の年齢構成を確認する
      - ベンダの本社が自社から近いかどうかを確認する
      - 提案書のデザインが見栄えの良いものであるかを確認する
    a: ア
    exp: |
      調達リスク分析は、調達に伴って生じ得る問題を事前に洗い出し、備えを検討する活動です。基幹システムのように長期間の関係になる調達では、ベンダの経営の安定性（倒産や事業撤退の危険）、同種の導入実績（やり遂げる力）、サポートの継続性が重要な確認事項です。これらに不安があれば、契約の条件や代替策の検討につなげます。提案書の見栄えや所在地、年齢構成は、リスクの評価の中心にはなりません。
    why:
      - 正解です。継続性と実績の確認が、調達リスクの評価の中心です。
      - 年齢構成は、経営の安定性や実績の評価にはつながりません。
      - 所在地の近さは、リスクの大きさを決める要素ではありません。
      - 提案書の見栄えは、実行の確実性や継続性を示すものではありません。
    know: 調達リスク分析の要点は、「相手が約束を果たし続けられるか」という継続性の視点である。提案の内容と、相手先の評価は別の確認であることが鍵である。
    terms:
      - 調達リスク
      - リスク分析
    verify:
      manual: 新興ベンダへの発注における調達リスク分析として、経営の安定性、導入実績、サポートの継続性を確認すべきであることを確認した。
  - id: A18-508
    topic: 18-3-2-7
    diff: 3
    scope: 18-3-2-7 契約締結における請負契約と準委任契約の使い分け。成果物の完成責任の有無による、委託内容への適用の判断
    prereq: 請負契約は、仕事の完成（成果物の納入）を目的とし、受注側が完成の責任を負うこと、準委任契約は、業務の遂行そのものを目的とし、完成の責任は負わないこと
    hard: 委託する内容が「完成物を求める仕事」か「業務の遂行そのもの」かを読み分け、契約の種類を対応付ける必要がある。
    q: |
      仕様が確定している業務システムの開発を外部に委託し、完成したシステムの納入を受けたい。契約の種類として、適切なものはどれか。
    c:
      - '準委任契約: 受注側は業務の遂行に努めるが、システムの完成の責任は負わない'
      - '売買契約: 既製品のソフトウェアを購入する'
      - '請負契約: 受注側がシステムを完成させて納入する責任を負う'
      - '雇用契約: 受注側の技術者を、自社の従業員として雇用する'
    a: ウ
    exp: |
      契約の種類は、委託の目的で選びます。完成したシステムの納入を受けたい本件では、仕事の完成を目的とし、受注側が完成の責任を負う請負契約が適切です。準委任契約は、調査やコンサルティングのように、業務の遂行そのものを委託する場合の契約であり、完成の責任は生じません。仕様が確定していることも、請負を選ぶ判断を後押しします。
    why:
      - 準委任契約では、システムの完成を約束させることはできません。本件の目的に合いません。
      - 売買契約は既製品の購入の契約であり、本件は開発の委託です。
      - 正解です。完成物の納入には、完成責任のある請負契約が対応します。
      - 雇用契約は、外部への委託の契約ではありません。
    know: 契約の使い分けは、「完成を求めるか（請負）、遂行を求めるか（準委任）」という軸で判断することが要点である。
    terms:
      - 請負契約
      - 準委任契約
    verify:
      manual: 仕様が確定したシステムの開発を委託し完成品の納入を受けたい場合には、完成責任を負う請負契約が適切であることを、準委任（完成責任なし）との対比で確認した。
