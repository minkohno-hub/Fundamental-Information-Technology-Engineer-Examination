questions:
  - id: A16-513
    topic: 16-1-5
    diff: 3
    scope: 16-1-5 監査証拠の十分性と適切性。書面の確認だけでは不十分な場面で、証拠の確からしさを高める手続の判断
    prereq: 監査証拠は、関連性と信頼性（適切性）と、量の十分さの両面で評価すること、担当者の説明だけでは証拠として弱いこと
    hard: 「量を増やす」ことと「質（信頼性）を高める」ことを区別し、事例の弱点（口頭の説明への依存）に合う手続を選ぶ必要がある。
    q: |
      在庫の数量の正確性を確認する監査で、担当者への質問と、システムの画面の確認だけで監査を終えようとしている。監査証拠の観点から、追加すべき手続として、適切なものはどれか。
    c: ['実地棚卸しへの立会いや、入出庫の記録と実数の照合など、実物に基づく確認を行う', '担当者への質問の回数を増やす', '画面の確認の記録を、詳細に残す', '昨年度の監査調書の結論を、そのまま今年度の証拠とする']
    a: ア
    exp: |
      監査証拠には、量の十分さと、質としての適切さ（関連性と信頼性）が求められます。担当者の説明や画面の表示は、いずれも被監査側の内部の情報であり、証拠としての信頼性には限界があります。実地棚卸しへの立会いや、記録と実物の照合のような、実物に基づく手続を加えることで、証拠の確からしさが高まります。質問の回数を増やしても、証拠の質は変わりません。
    why:
      - 正解です。実物に基づく確認が、証拠の信頼性を高めます。
      - 同じ種類の弱い証拠を増やしても、信頼性の不足は解消されません。
      - 記録の残し方は手続の文書化の話であり、証拠の確からしさ自体は高まりません。
      - 昨年度の結論は、今年度の事実の証拠にはなりません。
    know: 監査証拠の評価は「どれだけあるか」と「どれだけ確かか」の両面で行う。内部の説明だけに依存する監査は、実物や外部の情報による裏付けが要る。
    terms: [監査証拠, 実地棚卸し]
    verify:
      manual: 在庫数量の確認で担当者への質問と画面確認だけに依存する監査に対し、実地棚卸しへの立会いや記録と実数の照合を追加する選択肢が適切であることを、証拠の質と量の区別から確認した。
  - id: A16-514
    topic: 16-1-2-2
    diff: 3
    scope: 16-1-2-2 監査計画における重要性の設定。金額の基準と、性質による判断の使い分け
    prereq: 重要性は、誤りの金額が意思決定に影響する水準として設定すること、金額が小さくても性質によって重要になる場合があること
    hard: 「全ての誤りを同じに扱う」考えと、金額の基準に加えて性質（不正や規制違反）も考慮する判断を切り分ける必要がある。
    q: |
      システム監査の計画で、発見した誤りをどこまで深く調べるかの基準を決めている。重要性の考え方として、適切なものはどれか。
    c: ['金額の大きさを基準としつつ、不正や規制違反に関わるものは、金額が小さくても重要と判断する', '金額の大小にかかわらず、全ての誤りを同じ深さで調べる', '金額が基準未満の誤りは、その性質にかかわらず調べない', '重要性は設定せず、監査の実施の中でその都度判断する']
    a: ア
    exp: |
      重要性は、限られた監査の資源を、影響の大きい部分に集中させるための基準です。金額を主な基準としながらも、不正や規制違反のように、金額が小さくても組織への影響が大きい性質のものは、重要と判断します。全件を同じ深さで調べることは現実的でなく、性質を問わずに切り捨てることも、リスクを見逃します。
    why:
      - 正解です。金額の基準と、性質による判断を組み合わせます。
      - 全件を同じ深さで調べることは、資源の制約から現実的ではありません。
      - 不正や規制違反は、金額が小さくても影響が大きく、切り捨てることはできません。
      - 基準を定めないと、調べる深さが担当者の判断でばらつき、監査の一貫性が保てません。
    know: 重要性は「金額の物差し」が基本だが、それだけでは決まらない。不正・規制違反のような性質の重いものは、小額でも拾うのが監査の考え方である。
    terms: [重要性, システム監査]
    verify:
      manual: 重要性の設定について、金額を基準としつつ不正や規制違反は小額でも重要と判断する選択肢が適切であることを、全件同一の深さ・性質を問わない切捨て・基準なしとの比較から確認した。
  - id: A16-515
    topic: 16-2-1
    diff: 3
    scope: 16-2-1 内部統制の整備・運用状況のモニタリング。日常の業務の中で行う継続的な評価と、独立した評価の使い分け
    prereq: 内部統制のモニタリングには、業務に組み込まれた継続的な評価と、独立した立場からの評価があり、両方を組み合わせること
    hard: 「監査のときだけ評価する」考えと、日常のモニタリングの不備を補う仕組みを切り分ける必要がある。
    q: |
      ある部門では、承認の記録の確認が、上長の日常業務の中で行われている。しかし、確認が実際に機能しているかを、独立した立場で確かめる仕組みがない。内部統制のモニタリングの改善として、適切なものはどれか。
    c: ['日常の確認に加えて、内部監査部門などによる独立した評価を定期的に行う', '日常の確認の回数を増やす', '確認の記録の書式を統一する', 'モニタリングは年次の監査に任せ、日常の確認はやめる']
    a: ア
    exp: |
      内部統制のモニタリングには、業務の中に組み込まれた日常的な評価と、独立した立場からの評価があります。日常の確認が機能しているかどうか自体は、確認する本人たちには確かめにくいため、内部監査部門などによる独立した評価を組み合わせることが必要です。回数や書式の改善だけでは、この弱点は埋まりません。
    why:
      - 正解です。日常の評価と独立した評価の組合せが、モニタリングの形です。
      - 日常の確認を増やしても、その確認が機能しているかの検証にはなりません。
      - 書式の統一は記録の見かけの改善であり、統制の実効性の検証にはなりません。
      - 日常の確認をやめると、問題の発見が年次まで遅れ、統制が弱くなります。
    know: モニタリングの要点は、「日常の自己確認」と「独立した評価」の二層構造である。自己確認の実効性は、独立した目で確かめる。
    terms: [内部統制, モニタリング]
    verify:
      manual: 日常の確認が機能しているかを独立した立場で確かめる仕組みがない事例に対し、内部監査部門などによる独立した評価を加える選択肢が適切であることを、回数の増加・書式の統一・年次監査への一本化との比較から確認した。
  - id: A16-516
    topic: 16-1-6
    diff: 3
    scope: 16-1-6 監査報告書への改善勧告の書き方。事実と影響、原因に基づいた、実行可能な勧告の判断
    prereq: 改善の勧告は、発見した事実とその影響、原因を示し、被監査側が実行できる内容にすること
    hard: 「厳しく命じる」「曖昧に促す」勧告と、事実・影響・原因に基づく実行可能な勧告を切り分ける必要がある。
    q: |
      システム監査で、アクセス権の棚卸しが行われていないことを発見した。監査報告書の改善勧告の書き方として、適切なものはどれか。
    c: ['棚卸しが行われていない事実と、不要な権限が残る影響、行われていない原因を示し、定期的な棚卸しの実施を求める', '担当者の責任を厳しく追及する文面にする', '「運用の改善が望まれる」という表現だけにとどめる', '棚卸しの手順の詳細を、監査側が全て指定して従わせる']
    a: ア
    exp: |
      改善の勧告は、被監査側が納得して実行に移せるように、発見した事実、それがもたらす影響、そうなっている原因を示すことが基本です。そのうえで、求める改善の内容（この場合は、定期的な棚卸しの実施）を示します。責任の追及だけでは改善は進まず、曖昧な表現では何をすべきか伝わらず、手順の全ての指定は、被監査側の実情に合わない場合があります。
    why:
      - 正解です。事実・影響・原因に基づく、実行可能な勧告です。
      - 責任の追及は、改善の実行につながりにくく、勧告の目的から外れます。
      - 曖昧な表現では、求める改善の内容が伝わりません。
      - 手順の詳細の決定は、実情を知る被監査側の役割であり、監査側が全て指定するのは行き過ぎです。
    know: 勧告の型は「事実→影響→原因→求める改善」である。監査は改善を求める立場であり、実行の設計は被監査側が担う。
    terms: [改善勧告, 棚卸し]
    verify:
      manual: アクセス権の棚卸し未実施という発見への勧告として、事実・影響・原因を示して定期的な棚卸しの実施を求める選択肢が適切であることを、責任追及・曖昧な表現・手順の全面指定との比較から確認した。
  - id: A16-517
    topic: 16-1-9
    diff: 3
    scope: 16-1-9 外部監査と内部監査の役割の違い。保証の対象と立場の区別の判断
    prereq: 外部監査は組織の外部の立場から、主に財務諸表などの信頼性について意見を表明すること、内部監査は組織の内部の立場から、統制や業務の改善に役立てること
    hard: 名称の似た二つの監査について、誰が・何のために行うのかという役割の切り分けが必要である。
    q: |
      次の記述のうち、外部監査と内部監査の役割の区別として、適切なものはどれか。
    c: ['外部監査は、外部の独立した立場から、財務諸表などが適正かについて意見を表明する', '内部監査は、株主総会で選ばれた外部の専門家が行う', '外部監査の結果は、組織の内部だけに報告され、公表されることはない', '内部監査は、法令で全ての組織に義務付けられている']
    a: ア
    exp: |
      外部監査は、組織の外部の独立した立場（公認会計士など）が、財務諸表などが適正に表示されているかについて意見を表明するものです。内部監査は、組織の内部の部門が、統制の整備・運用状況や業務の進め方を評価し、改善に役立てる活動であり、外部の専門家が行うものではありません。内部監査は法令で一律に義務付けられたものではなく、組織の判断で設置されます。
    why:
      - 正解です。外部の独立した立場からの、適正性への意見表明が外部監査です。
      - 内部監査は、組織の内部の部門が行う活動です。株主総会で選ばれるのは、外部の立場の監査役や監査法人であり、内部監査部門の設置は法令で一律に義務付けられてはいません。
      - 外部監査の意見は、財務諸表とともに公表され、投資家などが利用します。
      - 内部監査部門の設置は、組織の規模や判断によるもので、一律の義務ではありません。
    know: 監査の区別は「立場（外部か内部か）」と「目的（意見表明か改善か）」の二つの軸で押さえる。名称の混同を避けるのが要点である。
    terms: [外部監査, 内部監査]
    verify:
      manual: 外部監査が外部の独立した立場から財務諸表の適正性に意見を表明するものである記述が正しいことを、内部監査の実施主体・外部監査の公表・内部監査の義務付けに関する誤った記述との比較から確認した。
  - id: A16-518
    topic: 16-2-1
    diff: 4
    scope: 16-2-1 内部統制の不備の評価。統制の不備が重なった場合に、財務報告への影響の大きさで重大な不備に当たるかを判断する問題
    prereq: 個々の不備が小さくても、組み合わさると重要な誤りを見逃す可能性が高まる場合は、重大な不備として評価すること
    hard: 個々の不備を別々に評価して終わる考えと、組合せの影響で評価する考えを切り分ける必要がある。
    q: |
      財務報告に関わる業務で、照合の手続の省略、承認の形骸化、記録の遅れという 3 つの不備が見つかった。どれも単独では、重要な誤りにつながる可能性は低いと見込まれる。しかし、この業務では照合と承認が、誤りを防ぐ主な仕組みであった。内部統制の不備の評価として、適切なものはどれか。
    c: ['3 つの不備が組み合わさることで、重要な誤りを見逃す可能性が高まるため、重大な不備として評価する', '単独では可能性が低いので、3 つとも軽微な不備として評価する', '不備の数は評価に影響しないので、最も大きい 1 つだけで評価する', '不備は発見した順に、1 つずつ直せばよく、評価は不要である']
    a: ア
    exp: |
      内部統制の不備は、個々だけでなく、組み合わさった場合の影響で評価します。本件では、照合と承認という、誤りを防ぐ主な仕組みが重なって弱くなっており、組み合わされば、重要な誤りが発生しても見つからない可能性が高まります。そのため、単独の評価にかかわらず、重大な不備として評価し、経営者への報告と改善の対象にします。
    why:
      - 正解です。不備の組合せによる影響の大きさで評価します。
      - 単独の可能性の低さだけで判断すると、主な仕組みが重なって弱くなっている事態を見逃します。
      - 不備の組合せは評価の対象であり、最大の 1 つだけでは影響を捉えられません。
      - 評価を行わなければ、経営者への報告や改善の優先順位の判断ができません。
    know: 統制の不備の評価は、「単独の大きさ」ではなく「組み合わさったときの影響」で行う。主な防御の仕組みが複数同時に弱っている場合は、特に注意が要る。
    terms: [内部統制, 重大な不備]
    verify:
      manual: 照合の省略・承認の形骸化・記録の遅れという 3 つの不備が、誤りを防ぐ主な仕組みに重なっている事例では、組合せの影響から重大な不備として評価する選択肢が適切であることを、単独評価のみとの比較から確認した。
