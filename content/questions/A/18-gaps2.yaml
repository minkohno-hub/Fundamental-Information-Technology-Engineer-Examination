category: '18'
reviewed: { at: '2026-10-21', method: '作成後の逐問レビュー（要件定義におけるステークホルダの要件確認、調達におけるリスク分析の考え方をシラバスVer.9.2の用語例と照合）' }
questions:
  - id: A18-020
    topic: 18-2-2-4
    diff: 2
    q: 要件定義で，利害関係者（ステークホルダ）の要件を確認する方法として，最も適切なものはどれか。
    c:
      - 利用部門，運用部門，経営層など立場の異なる関係者から要件を集め，相反する要件は優先順位を付けて調整し，合意内容を文書で確認する。
      - 発注元の担当者1人から聞いた要件だけを正式な要件とし，他の関係者への確認は省略する。
      - 要件が相反した場合は，開発側が独自に判断して採用する要件を決め，結果は関係者に伝えない。
      - 要件の確認は開発の最終段階で一括して行い，それまでは各自の解釈で進める。
    a: ア
    exp: |
      システムには利用者，運用者，経営層，顧客など立場の異なる利害関係者がおり，要件が相反することも珍しくありません。要件定義では関係者を洗い出して要件を引き出し，ファシリテーションなどで調整し，優先順位を付けて合意内容を文書にし，関係者に確認して承認を得ます。確認が遅れるほど手戻りが大きくなるため，早い段階で行います。
    why:
      - 正解です。関係者を網羅して要件を調整し，合意を文書で確認します。
      - 一部の担当者だけでは他の関係者の要件が漏れ，後から手戻りが生じます。
      - 開発側の独断で決め，関係者に伝えないのでは合意になりません。調整過程を共有し承認を得る必要があります。
      - 確認が遅いほど手戻りが大きくなります。要件は早い段階で確認します。
    terms: [ステークホルダ, ファシリテーション, 要件定義]

  - id: A18-021
    topic: 18-3-2-6
    diff: 2
    q: システム開発の調達において，調達リスク分析の目的として，最も適切なものはどれか。
    c:
      - 供給者の選定や契約の前に，納期遅延や品質不良，供給者の経営悪化などのリスクを洗い出して評価し，対応策を検討する。
      - 調達先から提出された提案書の文書様式の誤りを見つけて修正する。
      - 調達した製品の検収が済んだ後に，支払の手続を速やかに進める。
      - 複数の供給者から得た見積金額を平均して，予算額を決定する。
    a: ア
    exp: |
      調達リスク分析は，調達の実施に伴って起こり得るリスクを事前に洗い出し，発生可能性と影響を評価して，回避，軽減，転嫁，受容などの対応策を決めるための活動です。供給者の納期遅延，品質の問題，経営悪化，仕様の認識違い，特定供給者への依存などが典型で，その結果を供給者の選定基準や契約条件に反映します。
    why:
      - 正解です。調達に伴うリスクを事前に評価し，選定や契約に反映させます。
      - 文書様式の確認は提案書の形式審査であり，リスク分析の目的ではありません。
      - 検収後の支払手続は調達の終結段階の事務であり，リスク分析ではありません。
      - 見積金額の平均で予算を決めることはリスク分析ではありません。
    terms: [調達リスク分析, リスク分析]
