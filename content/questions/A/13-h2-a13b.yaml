category: '13'
batch: H2
reviewed: { at: '2026-10-30', method: '独立レビュアーが盲検で再解答し、正答・解説・重複を確認' }
questions:
  - id: A13-509
    topic: 13-1-1-4
    diff: 3
    scope: 13-1-1-4 ローコード／ノーコード開発。定型的な業務アプリケーションを、専門の開発者でなく業務部門が作る場面への適用の判断
    prereq: ローコード／ノーコード開発では、用意された部品や設定の組合せでアプリケーションを作るため、定型的な業務には速く対応できる一方、複雑な処理や大規模な処理には向かないこと
    hard: 「何でも速く作れる」という過大な期待と、向き不向きの判断を切り分ける必要がある。基幹の大規模処理への適用の適否も含まれる。
    q: |
      営業部門から、顧客訪問の記録を入力・集計する簡単なアプリケーションがほしいという要望が出ている。処理は定型的で複雑な計算はなく、早く使い始めたいという。開発方式の選択として、最も適切なものはどれか。
    c: ['ローコード／ノーコード開発ツールを業務部門が使い、部品と設定の組合せで短期間に作る', '基幹システムと同じ手順で、要件定義から本格的に開発する', '複雑な計算処理を高速に行うプログラムを、一から作る', '既存の表計算ファイルのまま運用を続ける']
    a: ア
    exp: |
      入力と集計だけの定型的なアプリケーションは、ローコード／ノーコード開発の得意な領域です。用意された部品や設定を組み合わせるため、専門の開発者を介さずに、業務部門が短期間で作って使い始められます。一方で、複雑な処理や大規模で高速な処理が必要な場合は、これらのツールでは対応しにくく、本格的な開発が必要になります。要望の内容に合った方式の選択が要点です。
    why:
      - 正解です。定型的で複雑な計算のない用途は、ローコード／ノーコード開発に向いています。
      - 本格的な開発手順は、基幹のような大規模で重要なシステムには必要ですが、本件のような小さな用途には過剰で、時間もかかります。
      - 複雑な計算を高速に行う処理は、本件の要望には含まれていません。
      - 表計算のままでは、入力の形式や集計の手間が残り、要望に応えたことになりません。
    know: ローコード／ノーコードは「定型・小規模・速さ」の領域。複雑・大規模・高速が求められる用途は、本格的な開発の領域である。
    terms: [ローコード開発, ノーコード開発]
    verify:
      manual: 顧客訪問の記録の入力・集計という定型的で複雑な計算のない用途には、ローコード／ノーコード開発ツールを業務部門が使う選択肢が最も適切であることを、本格的な開発手順や一からの高速処理の開発との比較から確認した。
  - id: A13-510
    topic: 13-1-1-5
    diff: 3
    scope: 13-1-1-5 ソフトウェア再利用。検証済みの部品を再利用する利点と、再利用の前に必要な確認の判断
    prereq: 既存の部品を再利用すると、開発の手間と不具合の混入を抑えられること、ただし目的に合うかどうかの確認と、権利の条件の確認が必要なこと
    hard: 「再利用すれば常に安全」という考えと、適合性と権利の確認が前提であることを切り分ける必要がある。
    q: |
      新しいシステムの開発で、過去のシステムで実績のある共通部品（日付処理や認証の部品）を再利用することにした。再利用の進め方として、適切なものはどれか。
    c: ['部品の機能とインタフェースが今回の目的に合うかを確認し、権利の条件を確かめてから使う', '実績がある部品なので、中身を確認せずにそのまま使う', '部品を全て作り直してから使う', '再利用する部品は、修正を加えてから使うことを前提にする']
    a: ア
    exp: |
      検証済みの部品の再利用は、開発の効率と品質の両面で有効ですが、前提として、今回の目的に機能とインタフェースが合うことの確認と、利用の権利の条件の確認が必要です。実績は過去の用途でのものであり、今回の用途に合うとは限りません。全て作り直しては再利用の利点が失われ、安易な修正は、検証済みの品質を損なうおそれがあります。
    why:
      - 正解です。適合性と権利の確認が、再利用の前提です。
      - 過去の実績は今回の用途への適合を保証せず、無確認の流用は不具合のもとになります。
      - 全て作り直すのでは、再利用による効率と品質の利点が得られません。
      - 検証済みの部品への修正は、その品質を損なうおそれがあり、前提にすべきではありません。
    know: 再利用の鉄則は「確認してから使う」。実績は信頼の材料だが、用途への適合と権利の条件は、今回の開発について改めて確かめる。
    terms: [ソフトウェア再利用, 部品]
    verify:
      manual: 実績のある共通部品の再利用では、機能とインタフェースが目的に合うかの確認と権利の条件の確認を行ってから使う選択肢が適切であることを、無確認の流用・全ての作り直し・修正の前提化との比較から確認した。
  - id: A13-511
    topic: 13-1-1-6
    diff: 3
    scope: 13-1-1-6 リバースエンジニアリング。仕様書の残っていない既存システムの保守で、プログラムから仕様を復元する活動の判断
    prereq: リバースエンジニアリングは、既存のプログラムやデータの解析から、仕様や設計の情報を復元することであり、保守や移行の前提になること
    hard: 似た言葉の活動（新規の設計、コードの複製、テスト）と、復元という方向の違いを切り分ける必要がある。
    q: |
      長年使われてきたシステムの仕様書が残っておらず、保守のたびに担当者がプログラムを読んで影響を調べている。この状況への対策として、リバースエンジニアリングに当たるものはどれか。
    c: ['既存のプログラムとデータを解析し、処理の仕様やデータの構造を復元して文書化する', '新しいシステムの仕様を、利用者への聞き取りから新規に作成する', '既存のプログラムを、そのまま新しい言語に書き換える', '既存のプログラムの動作を、テストで確認する']
    a: ア
    exp: |
      リバースエンジニアリングは、既存のプログラムやデータという「成果物の側」から解析を進め、仕様や設計の情報を復元する活動です。仕様書のないシステムの保守や移行では、この復元が前提になります。新規の聞き取りによる仕様作成は通常の要求分析であり、言語の書き換えは変換、動作の確認はテストであり、いずれも復元とは方向が異なります。
    why:
      - 正解です。成果物から仕様を復元する活動が、リバースエンジニアリングです。
      - 聞き取りから新規に仕様を作る活動は、通常の要求の分析であり、既存のプログラムの解析ではありません。
      - 言語の書き換え（変換）は、既存のプログラムを出発点にする点でリバースエンジニアリングと関わる場合がありますが、本問で問われている、仕様や構造を復元して文書化する活動そのものではありません。
      - テストは動作の確認であり、仕様や構造の復元そのものではありません。
    know: リバースエンジニアリングの要点は「方向」である。設計→プログラムという通常の流れと逆に、プログラム→仕様へさかのぼる。
    terms: [リバースエンジニアリング]
    verify:
      manual: 仕様書の残っていないシステムについて、既存のプログラムとデータを解析して処理の仕様やデータ構造を復元し文書化する活動がリバースエンジニアリングに当たることを、新規の仕様作成・言語の変換・テストとの区別から確認した。
  - id: A13-512
    topic: 13-1-1-7
    diff: 3
    scope: 13-1-1-7 マッシュアップ。公開された複数のサービスを組み合わせて、新しいサービスを作る考え方の判断
    prereq: マッシュアップは、公開された API などを通じて、既存の複数のサービスやデータを組み合わせ、新しいサービスを作ることであること
    hard: 自前で全て作る開発や、単一サービスの単なる利用と、組合せによる新しい価値の創出を切り分ける必要がある。
    q: |
      地図のサービス、公共交通の経路検索のサービス、店舗の口コミのデータを、それぞれ公開された API で利用し、組み合わせて「最寄り駅から評判のよい店までの案内」という新しいサービスを作った。この作り方は何と呼ばれるか。
    c: ['マッシュアップ', 'リバースエンジニアリング', 'プロトタイピング', 'ベンチマーキング']
    a: ア
    exp: |
      公開された複数のサービスやデータを、API を通じて組み合わせて新しいサービスを作る作り方は、マッシュアップと呼ばれます。自前で全てを開発する代わりに、既存のサービスの機能を部品のように使うことで、短期間に新しい価値を作り出せます。なお、組み合わせるサービスの提供条件や、継続して利用できるかどうかには注意が必要です。
    why:
      - 正解です。複数の既存のサービスを組み合わせる作り方が、マッシュアップです。
      - リバースエンジニアリングは、既存のプログラムから仕様を復元する活動です。
      - プロトタイピングは、試作品を作って要件を確認する進め方です。
      - ベンチマーキングは、優れた取組と比較して自らを評価する活動です。
    know: マッシュアップの要点は「既存のサービスの組合せによる新しいサービス」である。API の公開が、この作り方の前提になっている。
    terms: [マッシュアップ, API]
    verify:
      manual: 地図・経路検索・口コミというデータの公開されたサービスを API で組み合わせて新しい案内サービスを作る作り方がマッシュアップに当たることを、他の三つの用語との区別から確認した。
  - id: A13-513
    topic: 13-1-4-2
    diff: 4
    scope: 13-1-4-2 プロセス成熟度。開発の進め方が属人的な状態から、組織の標準として定着していく段階の判断
    prereq: プロセス成熟度は、進め方が個人の力量に依存する状態から、組織の標準の手順として定義され、さらに測定と改善が回る状態へと段階的に高まること
    hard: 「できる人がいる」状態と「組織の標準として定義されている」状態の違いを、事例の記述から読み分ける必要がある。
    q: |
      ある組織の開発では、プロジェクトの成否が、担当するリーダの力量に大きく左右されている。手順は文書化されておらず、成功した進め方も、次のプロジェクトに引き継がれていない。この組織のプロセス成熟度の状態として、適切なものはどれか。
    c: ['進め方が標準化されておらず、個人の力量に依存する、成熟度の低い状態である', '標準の手順が組織に定着し、測定によって改善が回っている状態である', '手順は文書化されていないが、力量のある人がいるので成熟度は高い状態である', '成熟度は、導入している開発ツールの新しさで決まる']
    a: ア
    exp: |
      プロセス成熟度は、開発の進め方がどれだけ組織の仕組みとして定着しているかを表します。本件では、手順が文書化されず、成功の要因が個人の力量にあり、知見も引き継がれていないため、成熟度は低い状態です。成熟度を高めるには、進め方を標準の手順として定義し、組織に定着させ、やがて測定と改善が回る状態を目指します。力量のある個人の存在や、ツールの新しさは、組織の成熟度そのものではありません。
    why:
      - 正解です。標準化されず個人に依存する状態は、成熟度が低い状態です。
      - 標準の定着と測定による改善は、成熟度の高い状態の姿であり、本件とは逆です。
      - 力量のある担当者がいること自体は強みですが、成否がその人に依存し、手順が組織に残らない状態は、成熟度の物差し（仕組みの定着）では低い状態のままです。
      - ツールの新しさは、進め方の組織への定着とは別の話です。
    know: 成熟度の物差しは「人」ではなく「仕組み」である。標準化→定着→測定と改善、という階段のどこにいるかで判断する。
    terms: [プロセス成熟度]
    verify:
      manual: 手順が文書化されず成否がリーダの力量に左右され成功の進め方も引き継がれていない状態が、標準化されず個人に依存する成熟度の低い状態に当たることを、高い状態の姿・個人の力量・ツールの新しさとの区別から確認した。
  - id: A13-514
    topic: 13-2-1
    diff: 3
    scope: 13-2-1 著作権管理。私的使用のための複製が認められる範囲（個人的・家庭内その他これに準ずる限られた範囲内の使用）の判断で、業務での複製は対象外であることを見分ける問題
    prereq: 私的使用のための複製は、個人的に又は家庭内その他これに準ずる限られた範囲内で使用することを目的として、その使用する者が複製する場合に認められること、業務での使用を目的とする複製はこの範囲に含まれないこと
    hard: 個人がコピーするという表面的な形だけでは判断できず、使う場面が家庭内か業務かで結論が分かれる点が難しい。資料作成など、開発現場の日常の行為にも関わる判断である。
    q: |
      著作権法では、個人的に又は家庭内その他これに準ずる限られた範囲内で使用することを目的とする場合、その使用する者が著作物を複製することができる（私的使用のための複製）。この定めの解釈として、適切なものはどれか。
    c: ['会社の業務で使う資料を作るために、従業員が市販の書籍の一部をコピーして配る行為は、個人がコピーする行為なので、私的使用のための複製に当たる', '家庭で楽しむために、自分が購入した音楽 CD を自分のパソコンに取り込む行為は、私的使用のための複製に当たる', '私的使用のためであれば、違法にアップロードされたものと知りながらダウンロードして複製しても、常に対象になる', '私的使用のための複製は、著作権者本人が複製する場合にだけ認められる']
    a: イ
    exp: |
      私的使用のための複製は、「個人的に又は家庭内その他これに準ずる限られた範囲内」で使用することを目的に、その使用する者自身が複製する場合に認められます。自分が購入した音楽 CD を、家庭で楽しむために自分のパソコンに取り込む行為は、この範囲に当たります。

      一方、会社の業務で使う資料のコピーは、使用の場面が業務であり、「限られた範囲内」の使用には当たらないため、私的使用にはなりません。開発や資料作成の現場でも、他人の著作物を業務で複製する場合は、許諾の確認が前提になります。
    why:
      - 業務で使うための複製は、個人の楽しみのための使用とは場面が異なり、「家庭内その他これに準ずる限られた範囲内」の使用には当たらないため、私的使用のための複製には当たりません。
      - 正解です。購入した CD を、家庭内で自分が楽しむ目的で自分の機器に取り込む行為は、私的使用のための複製に当たります。
      - 違法にアップロードされたものと知りながら行うダウンロードによる複製は、私的使用の対象から除かれる場合があり、「常に」認められるわけではありません。
      - 私的使用のための複製は、著作権者ではなく、その著作物を使用する者が行う複製を対象とする定めです。
    know: 私的使用のための複製の要点は、「個人的・家庭内その他これに準ずる限られた範囲内の使用」と「使用する者自身による複製」の二点である。業務での使用を目的とする複製はこの範囲に当たらず、著作権管理の場面では許諾の確認が必要になる。
    terms: [著作権, 私的使用]
    verify:
      manual: 私的使用のための複製の定め（個人的・家庭内その他これに準ずる限られた範囲内の使用を目的とし、その使用する者が複製する場合に認められること）と各選択肢を照合し、業務で使う資料のコピーは範囲外であり、購入した CD を家庭で楽しむために取り込む行為だけが該当することを確認した。
  - id: A13-515
    topic: 13-2-3
    diff: 3
    scope: 13-2-3 ライセンス管理。OSS を組み込む際のライセンス条件（ソースコードの開示の条件など）の確認の判断
    prereq: OSS にはライセンスごとに条件があり、配布の形態によってはソースコードの開示などが求められる種類があること、利用の前に条件を確認すること
    hard: 「無償だから自由に使える」という誤解と、条件の確認と遵守が必要であることを切り分ける必要がある。
    q: |
      開発中の製品に、無償で公開されている OSS のライブラリを組み込んで、製品として顧客に配布する計画がある。ライセンス管理として、適切なものはどれか。
    c: ['その OSS のライセンスを確認し、配布の際に求められる条件（表示や、ソースコードの開示など）を満たす', '無償の OSS は、条件を確認しなくても自由に配布できる', 'OSS を組み込んだ事実を伏せれば、条件は問題にならない', 'ライセンスの条件は、製品を配布した後に確認すればよい']
    a: ア
    exp: |
      OSS は無償で利用できますが、ライセンスごとに条件が定められており、自由に何をしてもよいわけではありません。種類によっては、著作権の表示や、配布する際にソースコードの開示（または開示の案内）が条件になるものがあります。製品に組み込んで配布する場合は、事前にライセンスを確認し、その条件を満たすことが必要です。組み込んだ事実を伏せることは、条件違反を隠すことになり、不適切です。
    why:
      - 正解です。ライセンスの確認と、条件の遵守が前提です。
      - 無償であることと、条件がないことは別であり、確認なしの配布は条件違反のおそれがあります。
      - 事実を伏せることは、違反の隠蔽であり、発覚した場合の影響が大きくなります。
      - 条件によっては製品の作り方自体に影響するため、配布の後の確認では手戻りが大きくなります。
    know: OSS の利用の鉄則は「使う前に、ライセンスを読む」。無償と無条件は違う、という点が要点である。
    terms: [OSS, ライセンス]
    verify:
      manual: OSS のライブラリを組み込んで製品として配布する場合は、その OSS のライセンスを事前に確認し、表示やソースコードの開示などの条件を満たすことが適切であることを、無償ゆえに無条件という誤解との区別から確認した。
  - id: A13-516
    topic: 13-3-2-1
    diff: 3
    scope: 13-3-2-1 開発環境稼働状況管理。開発環境の資源の使用状況を把握し、ひっ迫に先回りして対処する活動の判断
    prereq: 開発環境の管理では、サーバやストレージの使用状況を継続的に把握し、容量のひっ迫が開発の停滞を招く前に対処すること
    hard: 問題が起きてから増強する対応と、使用状況の傾向から先回りする管理を切り分ける必要がある。
    q: |
      開発環境のディスク使用量が増え続け、満杯になるとビルドが止まって開発全体が停滞する事態が、過去に起きている。開発環境の稼働状況の管理として、適切なものはどれか。
    c: ['使用量を継続的に監視し、増加の傾向から満杯になる時期を見積もって、先回りして増強や整理を行う', '満杯になってビルドが止まったら、その都度増強する', '使用量の監視は運用部門の仕事として、開発側では把握しない', '開発者ごとに、使える容量の上限を厳しく割り当てて終わりにする']
    a: ア
    exp: |
      開発環境の稼働状況の管理では、資源の使用状況を継続的に把握し、傾向から将来を見積もって対処します。ディスクであれば、使用量の増え方から満杯になる時期を予測し、増強や不要なデータの整理を先回りに行うことで、開発の停滞を防げます。止まってからの対処では、そのたびに開発が止まります。
    why:
      - 正解です。監視と傾向の見積もりによる、先回りの対処です。
      - 満杯になってからの対処では、対処のたびに開発が停滞します。
      - 開発環境の状態は開発の進み方に直結するため、開発側でも把握が必要です。
      - 上限の割当てだけでは、全体の増加への対処にならず、作業の妨げにもなります。
    know: 環境管理の要点は「起きてから」ではなく「傾向から先回り」。容量の問題は、予測できる種類の障害である。
    terms: [開発環境]
    verify:
      manual: 開発環境のディスク使用量が増え続け満杯でビルドが止まる事態が起きている場合、使用量を継続的に監視し増加の傾向から満杯の時期を見積もって先回りに増強や整理を行う選択肢が適切であることを、事後の対処との比較から確認した。
