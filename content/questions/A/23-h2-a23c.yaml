questions:
  - id: A23-515
    topic: 23-1-3
    diff: 2
    scope: 23-1-3 商標登録の要件。商品の品質や普通名称を表すだけの標章は識別力がないため登録を受けられないことなど、登録の可否の判断
    prereq: 商標は自己の商品と他人の商品を識別する標章であり、識別力のない標章は登録できないこと、商標権は登録によって発生する登録主義であること
    q: |
      商標登録に関する記述として、正しいものはどれか。
    c:
      - 商品の品質や産地などを普通に表示するだけの標章は、識別力がないため、そのままでは商標登録を受けることができない
      - 他人が既に使用している未登録の商標と同一の商標であっても、出願さえすれば必ず商標登録を受けることができる
      - 商標権は、出願や登録の手続きをしなくても、商標を使い始めた時点で自動的に発生する
      - 登録商標と類似する商標を他人が使用する行為は、商品の分野が全く異なる場合でも、常に商標権の侵害になる
    a: ア
    exp: |
      商標は、自分の商品と他人の商品を識別するための標章です。商品の品質・産地・普通名称などを普通に表示するだけの標章（記述的な標章）は、誰もが使う必要のある表示であり、特定の出所を識別する力がないため、そのままでは登録を受けることができません（使い続けて識別力を獲得した場合の例外はあります）。商標権は、出願し、登録を受けることで発生する登録主義の権利であり、使用を始めただけでは発生しません。また、商標権の効力は、指定した商品（サービス）と同一または類似の範囲に及び、全く異なる分野の使用が常に侵害になるわけではありません。
    why:
      - 正解です。識別力のない記述的な標章は登録できず、特定の出所を示す力を持つ標章が保護の対象です。
      - 他人の周知な商標と同一・類似の商標など、登録を受けることができない商標は法律で定められており、出願すれば必ず登録されるわけではありません。
      - 商標権は登録によって発生する権利です。使用の開始だけでは発生せず、出願と登録の手続きが必要です。
      - 商標権の効力が及ぶのは、指定商品と同一または類似の範囲であり、全く異なる分野の使用まで常に侵害になるわけではありません。
    know: 商標制度の要点は登録主義と識別力である。誰もが使う必要のある表示（普通名称・品質表示）は独占に適さず、識別力のある標章だけが登録によって保護される。
    terms: [商標権]
    verify:
      manual: 商標法の登録要件（識別力のない標章は登録できないこと、登録できない商標の定めがあること）と登録主義（登録により権利が発生すること）、権利の効力の範囲（指定商品と同一・類似の範囲）と各記述を照合し、アだけが正しいことを確認した。
  - id: A23-516
    topic: 23-4-5-8
    diff: 3
    scope: 23-4-5-8 不正アクセス禁止法の禁止行為。他人の識別符号を不正アクセス行為に使う目的で取得・保管・入力する行為も禁止されることの判断
    prereq: 不正アクセス禁止法は、実際の侵入行為だけでなく、識別符号の不正な取得・保管・提供や、フィッシングによる入力の誘引も禁止していること
    hard: 「まだ侵入していないから違法ではない」という誤解を避け、準備段階の行為（取得・保管）が独立して禁止される構造を見抜く必要がある。
    q: |
      A社の元従業員 B は、在職中に知った他の従業員の ID とパスワードのリストを、不正にアクセスする目的で自分の機器に保存していた。B はまだその ID を使ってログインはしていない。この行為に関する判断として、正しいものはどれか。
    c:
      - ログインしていなくても、他人の識別符号を不正アクセス行為の用に供する目的で保管した時点で、不正アクセス禁止法に違反しうる
      - 実際にログインして初めて、不正アクセス禁止法の対象になる
      - 識別符号の保管は、社内の規程違反にはなっても、法律上の問題にはならない
      - 元従業員であれば、在職中に知った識別符号の保管は許される
    a: ア
    exp: |
      不正アクセス禁止法は、他人の識別符号（ID とパスワードの組合せなど）を、不正アクセス行為の用に供する目的で取得する行為や、不正に取得した識別符号を同じ目的で保管する行為自体を禁止しています。侵入の実行に至らなくても、目的を持った取得・保管の段階で違法となり得ます。これは、侵入の準備行為を早期に抑止するための規定です。B の行為は、在職中に知ったかどうかによらず、目的のある保管として問題になります。
    why:
      - 正解です。識別符号の不正な取得・保管も、独立した禁止行為です。
      - 実行行為だけが対象という理解は誤りであり、準備段階の行為も禁止されています。
      - 社内規程の問題にとどまらず、法律が直接禁止する行為です。
      - 在職中に知った情報であることは、保管を正当化する理由にはなりません。むしろ退職後の悪用の危険が高い行為です。
    know: 不正アクセス禁止法は、侵入行為そのものに加え、識別符号の不正取得・保管・提供、フィッシング行為を幅広く禁止する。セキュリティ法務では「実行前でも違法」という準備行為の処罰範囲が要点になる。
    terms: [不正アクセス禁止法, 識別符号]
    verify:
      manual: 不正アクセス禁止法の禁止行為の範囲（識別符号の不正取得・保管・提供の禁止）と本件を照合し、未ログインでも目的のある保管が違反になり得ること、他の選択肢が法の範囲を取り違えていることを確認した。

  - id: A23-517
    topic: 23-3-1
    diff: 3
    scope: 23-3-1 独占禁止法の不当な取引制限。競合事業者同士が価格などの取引条件を共同で取り決める行為（カルテル）の該当性の判断
    prereq: 不当な取引制限は、事業者が共同して対価や数量などを取り決め、競争を実質的に制限することであり、書面の契約がなくても該当しうること
    hard: 業界団体の会合での情報交換という外形でも、実質が価格の取決めであれば該当することを見抜く必要がある。意見の一致があれば「合意」と評価される点も問われる。
    q: |
      同業の 4 社の営業責任者が会合を開き、各社の主力製品について「来月から販売価格を一律に引き上げ、値引きはしない」という内容で意見を一致させ、各社ともそのとおりに価格を改定した。この行為に関する判断として、正しいものはどれか。
    c:
      - 販売価格に関する共同の取決めであり、独占禁止法の不当な取引制限（カルテル）に該当しうる
      - 正式な契約書を作っていないので、独占禁止法の問題にはならない
      - 価格の引上げ幅が各社で同じでも、実施が任意であれば問題にならない
      - 業界団体の会合での話し合いは、独占禁止法の適用対象外である
    a: ア
    exp: |
      独占禁止法の不当な取引制限（カルテル）は、事業者が共同して、対価（価格）などの取引条件を取り決め、その実施を相互に拘束することで競争を実質的に制限する行為です。取決めは、契約書のような形式を備えていなくても、意思の連絡（意見の一致）があれば成立します。本件は、競合 4 社が販売価格と値引きの禁止を取り決めて実施したものであり、典型的な価格カルテルに該当しうる行為です。課徴金や排除措置命令の対象にもなります。
    why:
      - 正解です。価格に関する共同の取決めと実施が、不当な取引制限の要件に当てはまります。
      - 合意は書面でなくても成立します。形式の有無は該当性を左右しません。
      - 「任意」といいながら実際に全社が取り決めどおり実施しており、相互の拘束が認められます。
      - 業界団体の場であることは免責の理由にならず、団体の活動として行えば団体自体も対象になり得ます。
    know: カルテルの判断は、形式ではなく「競合者同士の意思の連絡」と「相互拘束」の実質で決まる。会合での価格の意見一致がそのまま違法になり得る点が、独占禁止法の要点である。
    terms: [独占禁止法, 不当な取引制限]
    verify:
      manual: 不当な取引制限の要件（共同性、対価の取決め、相互拘束、競争の実質的制限）と本件の事実を照合し、書面の有無や会合の場が該当性を左右しないことを確認した。

  - id: A23-518
    topic: 23-2-5
    diff: 3
    scope: 23-2-5 個人情報保護法における第三者提供の記録。本人以外の者へ個人データを提供したときに、提供年月日や提供先などを記録し保存する義務の判断
    prereq: 個人データの第三者提供では、提供した側に記録の作成・保存義務があり、提供を受けた側にも確認・記録の義務があること
    hard: 記録義務は「提供を受けた側だけ」でも「委託先への提供」でもなく、第三者提供に当たる提供の提供側に生じることを、委託との区別とともに判断する必要がある。
    q: |
      A社は、マーケティング会社 B 社に、顧客の購買履歴の個人データを提供した。A社の対応として、個人情報保護法に照らして必要となるものはどれか。ここで、この提供は、利用目的の達成に必要な範囲で個人データの取扱いを委託するものではなく、第三者への提供に当たるものとする。
    c:
      - 提供した年月日、提供先の名称、提供した個人データの項目などを記録し、定められた期間保存する
      - 提供の事実を、自社の Web サイトで公表すれば、記録の作成は不要になる
      - 提供を受けた B 社だけが記録を作成すれば、A社に記録の義務はない
      - 提供先との間で秘密保持契約を結んでいれば、記録の作成は不要になる
    a: ア
    exp: |
      個人データの第三者提供を行った事業者には、提供の年月日、提供先の氏名・名称、提供した個人データの項目などについて、記録を作成し、保存する義務があります（第三者提供の記録）。これは、後から提供の経緯を追跡できるようにするための仕組みであり、本人の求めに応じて開示の対象にもなります。提供を受けた側にも、提供元の確認と記録の義務が別途あります。公表や秘密保持契約は、この記録義務に代わるものではありません。
    why:
      - 正解です。提供側には、第三者提供の記録の作成と保存の義務があります。
      - 公表は透明性の手段の一つですが、法律上の記録義務を免除するものではありません。
      - 記録の義務は提供側と提供を受けた側の双方にあり、B 社が作ればよいという関係ではありません。
      - 秘密保持契約は情報の管理に関する取決めであり、記録義務とは別の制度です。
    know: 第三者提供の記録は「誰に、いつ、何を渡したか」を後から検証できるようにする仕組み。委託への提供は第三者提供には当たらないため、提供の性質（委託か第三者提供か）の切り分けが義務の有無を決める要点になる。
    terms: [個人情報保護法, 第三者提供]
    verify:
      manual: 個人情報保護法の第三者提供の記録の規定（提供側と受領側の双方の記録・確認義務）と本件を照合し、提供側 A社に記録の作成・保存が必要であること、公表や秘密保持契約が代替にならないことを確認した。

  - id: A23-519
    topic: 23-4-5
    diff: 4
    scope: 23-4-5 労働者派遣の期間制限。事業所単位と個人単位の2つの期間制限（原則 3 年）の仕組みと、延長のための手続を組み合わせて判断する問題
    prereq: 派遣の受入れには、同一の事業所で 3 年までという事業所単位の制限と、同一の派遣労働者を同一の組織単位で 3 年までという個人単位の制限があり、事業所単位の制限の延長には労働組合等への意見聴取が必要なこと
    hard: 2種類の期間制限が別々に働くため、片方を延長しても、もう片方（個人単位）は延長できないことを見抜く必要がある。意見聴取で延長できるのは事業所単位の制限だけという点が要点になる。
    q: |
      A社は、派遣労働者 B を、同じ課で 2 年 10 か月受け入れている。A社の事業所としての派遣受入れ期間は、労働組合の意見を聴取する手続を経て、既に延長されている。B をこのまま同じ課で更に 1 年受け入れることについて、正しいものはどれか。
    c:
      - 事業所単位の期間が延長されていても、個人単位の制限により、B を同じ課で受け入れられるのは通算 3 年までであり、更に 1 年の受入れはできない
      - 事業所単位の期間が延長されているので、B も同じ課でこのまま延長できる
      - B 本人が希望すれば、個人単位の制限を超えて受け入れることができる
      - 派遣元との契約を更新すれば、期間制限は再び最初から数え直される
    a: ア
    exp: |
      労働者派遣の期間制限には2つの仕組みがあります。事業所単位の制限は、同一事業所での受入れが原則 3 年までで、労働組合等への意見聴取を経れば延長できます。一方、個人単位の制限は、同一の派遣労働者を同一の組織単位（課など）で受け入れられるのが通算 3 年までであり、こちらは延長できません。本件の B は 2 年 10 か月が経過しているため、同じ課で受け入れられるのは残り 2 か月までです。継続するには、課を移す（組織単位の変更）などの形を取る必要があります。本人の希望や派遣元の契約更新で、制限が消えたり数え直されたりすることはありません。
    why:
      - 正解です。個人単位の 3 年の制限は延長できず、同じ課での受入れは通算 3 年が上限です。
      - 延長されたのは事業所単位の制限だけであり、個人単位の制限は別に働きます。
      - 期間制限は本人の同意で外れるものではありません。雇用安定のための強行的な制限です。
      - 契約の更新によって期間がリセットされることはありません。通算で数えます。
    know: 派遣の期間制限は「事業所単位（延長可）」と「個人単位（延長不可）」の二重構造。両者を区別しないと、延長手続をしたのに個人の上限で違法になる、という実務上の落とし穴にはまる。
    terms: [労働者派遣法, 派遣期間の制限]
    verify:
      manual: 労働者派遣法の期間制限の2類型（事業所単位は意見聴取で延長可、個人単位は同一組織単位で通算 3 年まで延長不可）と本件の経過期間（2 年 10 か月）を照合し、同じ課での継続が残り期間を超えることを確認した。

  - id: A23-520
    topic: 23-1-3
    diff: 3
    scope: 23-1-3 特許権の実施権。通常実施権と専用実施権の、許諾できる相手の数と特許権者自身の実施可否の違いを判断する問題
    prereq: 専用実施権を設定すると、その範囲では特許権者自身も実施できなくなり、設定を受けた者だけが独占的に実施できること、通常実施権は複数の者に許諾でき、特許権者も実施できること
    hard: 「実施権を与えたら、自分は使えなくなる」という効果は専用実施権に限られることを、2つの実施権の性質の違いとして切り分ける必要がある。
    q: |
      特許権者 A は、自社の特許発明について、B社に実施を許す契約を検討している。契約の後も A 自身がその発明を実施し、将来は他の会社にも実施を許せるようにしたい。この目的に合う実施権はどれか。
    c:
      - 通常実施権を B社に許諾する
      - 専用実施権を B社に設定する
      - 特許権を B社に譲渡し、A は B社から実施の許諾を受ける
      - B社との間で、特許権の共有の持分を設定する
    a: ア
    exp: |
      通常実施権は、特許権者の許諾によって発生する実施の権利であり、複数の者に重ねて許諾でき、特許権者自身の実施も妨げられません。A の目的（自分も実施し、他社にも許せるようにする）に合うのは通常実施権です。一方、専用実施権を設定すると、その範囲では設定を受けた者だけが独占的に実施でき、特許権者であっても実施できなくなります。独占を与えたい場合に選ぶ権利であり、本件の目的とは逆の効果を持ちます。
    why:
      - 正解です。通常実施権なら、A の実施も、将来の他社への許諾も妨げられません。
      - 専用実施権を設定すると、B社が独占し、A 自身が実施できなくなるため、目的に反します。
      - 譲渡してしまうと、A は権利者ではなくなり、実施は B社の許諾次第になります。過剰な手段です。
      - 共有にすると、他社への実施の許諾などに他の共有者の同意が必要になり、A が単独で自由に許諾できなくなるため、目的に合いません。
    know: 実施権の選択は、独占を与えるかどうかで決まる。専用実施権は「権利者自身も実施できなくなる」強い独占であり、通常実施権は重ねて許諾できる柔軟な権利である、という対比が要点である。
    terms: [通常実施権, 専用実施権, 特許権]
    verify:
      manual: 特許法の実施権の規定（専用実施権の設定範囲では権利者も実施できないこと、通常実施権は重ねて許諾できること）と A の目的を照合し、通常実施権だけが目的の両方（自己実施と将来の他社許諾）を満たすことを確認した。
