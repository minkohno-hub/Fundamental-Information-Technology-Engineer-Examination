category: '14'
reviewed:
  at: '2026-10-21'
  method: 作成後の逐問レビュー（JIS Q 21500 の10の対象群と39のプロセス、各プロセスの主要なインプット・アウトプットの構成、シラバスVer.9.2の用語例と照合）
questions:
  - id: A14-049
    topic: 14-1-2-2
    diff: 1
    q: プロジェクトのメンバが行う自己管理として，最も適切なものはどれか。
    c:
      - 担当作業の遅れは，取り戻せる見込みがあれば報告せずに残業で対応する。
      - 作業の手順を変更したときは，効率を優先して記録を残さない。
      - 担当作業で問題を発見したら，自分で抱え込まず速やかに報告し，対策案も合わせて検討する。
      - 進捗の報告は，作業がすべて完了してからまとめて1回だけ行う。
    a: ウ
    exp: |
      プロジェクトのメンバには、自分の作業計画を立て、進捗・品質・コスト・リスクを自ら管理する自己管理が求められます。問題を早期に発見して速やかに報告し、対策を立案すること、作業や変更の内容を文書化すること、関係者と適切にコミュニケーションをとることが自己管理の要素です。
    why:
      - 遅れを報告しないと、プロジェクト全体の計画やリスクの判断を誤らせます。
      - 変更内容は文書化して関係者と共有する必要があります。
      - 正解です。問題の発見・報告・対策立案は自己管理の基本です。
      - 進捗は定期的に報告し、遅れや問題を早く共有する必要があります。
    terms:
      - プロジェクト
  - id: A14-050
    topic: 14-2-1
    diff: 2
    q: JIS Q 21500 の統合の対象群に含まれるプロセスの組合せとして，適切なものはどれか。
    c:
      - リスクの特定，リスクの評価，リスクへの対応，リスクの管理
      - プロジェクト憲章の作成，プロジェクト全体計画の作成，変更の管理，得た教訓の収集
      - ステークホルダの特定，ステークホルダのマネジメント，情報の配布
      - スコープの定義，WBSの作成，活動の定義，スコープの管理
    a: イ
    exp: |
      JIS Q 21500 の統合の対象群には、プロジェクト憲章の作成（立上げ）、プロジェクト全体計画の作成（計画）、プロジェクト作業の指揮（実行）、プロジェクト作業の管理（管理）、変更の管理（管理）、プロジェクトフェーズ又はプロジェクトの終結（終結）、得た教訓の収集（終結）の7プロセスが含まれます。プロジェクト全体を一つにまとめ、調整する役割をもちます。
    why:
      - リスクの対象群のプロセスです。
      - 正解です。いずれも統合の対象群のプロセスです。
      - ステークホルダの対象群とコミュニケーションの対象群のプロセスの組合せです。
      - スコープの対象群のプロセスです。
    terms:
      - JIS Q 21500
      - プロジェクトマネジメントの対象群
      - プロジェクト憲章
      - 得た教訓
  - id: A14-051
    topic: 14-2-1
    diff: 2
    q: JIS Q 21500 の統合の対象群のプロセスのうち，終結のプロセス群に属するものはどれか。
    c:
      - 変更の管理
      - 得た教訓の収集
      - プロジェクト作業の指揮
      - プロジェクト全体計画の作成
    a: イ
    exp: |
      統合の対象群のうち、終結のプロセス群に属するのは「プロジェクトフェーズ又はプロジェクトの終結」と「得た教訓の収集」です。得た教訓の収集では、プロジェクトでうまくいったこと・いかなかったことを評価・文書化し、将来のプロジェクトに役立てます。
    why:
      - 変更の管理は管理のプロセス群に属します。
      - 正解です。得た教訓の収集は終結のプロセス群に属します。
      - プロジェクト作業の指揮は実行のプロセス群に属します。
      - プロジェクト全体計画の作成は計画のプロセス群に属します。
    terms:
      - プロジェクトマネジメントのプロセス群
      - 得た教訓
  - id: A14-052
    topic: 14-3-1
    diff: 2
    q: JIS Q 21500 のステークホルダの対象群に含まれる二つのプロセスと，それが属するプロセス群の組合せとして，適切なものはどれか。
    c:
      - ステークホルダの特定は立上げ，ステークホルダのマネジメントは実行
      - ステークホルダの特定は実行，ステークホルダのマネジメントは立上げ
      - ステークホルダの特定は計画，ステークホルダのマネジメントは終結
      - ステークホルダの特定は管理，ステークホルダのマネジメントは計画
    a: ア
    exp: |
      ステークホルダの対象群には、立上げのプロセス群の「ステークホルダの特定」と、実行のプロセス群の「ステークホルダのマネジメント」の二つのプロセスがあります。プロジェクトの初期に利害関係者を特定してステークホルダ登録簿に記録し、実行中は彼らの要求や期待に適切に対応します。
    why:
      - 正解です。特定は立上げ、マネジメントは実行のプロセス群に属します。
      - 特定とマネジメントの属するプロセス群が逆になっています。
      - ステークホルダの特定はプロジェクトの初期（立上げ）に行い、終結に属するプロセスはありません。
      - ステークホルダの対象群に計画や管理のプロセス群のプロセスはありません。
    terms:
      - ステークホルダ
      - JIS Q 21500
  - id: A14-053
    topic: 14-4-1
    diff: 2
    q: JIS Q 21500 のスコープの対象群に含まれるプロセスはどれか。
    c:
      - 活動の順序付け
      - 活動の定義
      - 資源の見積り
      - 予算の作成
    a: イ
    exp: |
      スコープの対象群には、スコープの定義、WBS の作成、活動の定義（いずれも計画のプロセス群）と、スコープの管理（管理のプロセス群）の4プロセスがあります。活動の定義では WBS の最下位の要素（ワークパッケージ）を実施するための活動を洗い出し、活動リストを作成します。
    why:
      - 活動の順序付けは時間の対象群のプロセスです。
      - 正解です。活動の定義はスコープの対象群のプロセスです。
      - 資源の見積りは資源の対象群のプロセスです。
      - 予算の作成はコストの対象群のプロセスです。
    terms:
      - WBS
      - スコープクリープ
