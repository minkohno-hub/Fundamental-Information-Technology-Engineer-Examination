  - id: A14-056
    topic: 14-6-2
    diff: 2
    q: JIS Q 21500 の時間の対象群の「スケジュールの作成」の主要なインプットとアウトプットの組合せとして，適切なものはどれか。
    c:
      - インプットは活動順序と活動所要期間見積りなどで，アウトプットはスケジュール
      - インプットはリスク登録簿で，アウトプットは活動順序
      - インプットは予算で，アウトプットは活動所要期間見積り
      - インプットはスケジュールで，アウトプットは活動リスト
    a: ア
    exp: |
      時間の対象群では、活動リストを基に「活動の順序付け」で活動順序を、「活動期間の見積り」で活動所要期間見積りを作成します。「スケジュールの作成」はこれらなどをインプットとしてスケジュールを作成し、「スケジュールの管理」では進捗データを基にスケジュールを監視します。
    why:
      - 正解です。順序と期間見積りと制約からスケジュールを作成します。
      - リスク登録簿はリスクの対象群のアウトプットで、活動順序は「活動の順序付け」で作成します。
      - 予算はコストの対象群のアウトプットで、活動所要期間見積りは「活動期間の見積り」で作成します。
      - 活動リストはスコープの対象群の「活動の定義」のアウトプットで、スケジュールより前に作られます。
    terms:
      - リスク登録簿
      - ガントチャート
  - id: A14-057
    topic: 14-6-2
    diff: 1
    q: JIS Q 21500 で，活動リストを主要なインプットとして活動順序をアウトプットするプロセスはどれか。
    c:
      - スケジュールの管理
      - 活動の定義
      - 活動の順序付け
      - 予算の作成
    a: ウ
    exp: |
      活動の順序付けは、活動リストに挙げた活動の間の論理的な依存関係（先行・後続の関係）を明らかにし、活動順序として文書化する時間の対象群のプロセスです。活動順序はプレシデンスダイアグラムなどで表され、スケジュールの作成のインプットになります。
    why:
      - スケジュールの管理は進捗データを基にスケジュールを監視・管理するプロセスです。
      - 活動の定義は活動リストを作成するプロセスで、活動順序は作りません。
      - 正解です。活動リストから活動の依存関係を定めます。
      - 予算の作成はコスト見積りから予算を作成するプロセスです。
    terms:
      - PDM
  - id: A14-058
    topic: 14-7-1
    diff: 2
    q: JIS Q 21500 のコストの対象群に含まれるプロセスの組合せとして，適切なものはどれか。
    c:
      - 調達の計画，供給者の選定，予算の作成
      - 品質の計画，コストの見積り，リスクの評価
      - コストの見積り，予算の作成，コストの管理
      - 資源の見積り，資源の管理，プロジェクト組織の定義
    a: ウ
    exp: |
      コストの対象群には、コストの見積り、予算の作成（いずれも計画のプロセス群）と、コストの管理（管理のプロセス群）の3プロセスがあります。各活動のコストを見積もり、それを積み上げて時間軸に配分した予算を作り、実コストと比較して差異を管理します。
    why:
      - 調達の計画と供給者の選定は調達の対象群のプロセスです。
      - 品質の計画は品質の対象群、リスクの評価はリスクの対象群のプロセスです。
      - 正解です。いずれもコストの対象群のプロセスです。
      - 資源の対象群のプロセスです。
    terms:
      - JIS Q 21500
      - EVM
  - id: A14-059
    topic: 14-7-2
    diff: 2
    q: JIS Q 21500 のコストの対象群の「コストの管理」に関する記述として，適切なものはどれか。
    c:
      - 予算，進捗データ，実コストを主要なインプットとして，実コストや予想コストを把握し，必要に応じて変更要求や是正処置をアウトプットする。
      - WBS と活動リストを主要なインプットとして，活動ごとのコスト見積りをアウトプットする。
      - コスト見積りを主要なインプットとして，予算をアウトプットする。
      - 契約書又は注文書を主要なアウトプットとし，供給者を選定する。
    a: ア
    exp: |
      コストの管理は、予算と実コストの差異を監視して、完了までに必要な予想コストを算出し、予算超過のおそれがあれば変更要求や是正処置を行う管理のプロセス群のプロセスです。EVM はこのプロセスで用いられる代表的な技法です。
    why:
      - 正解です。予算と実績を比べて予想コストを把握します。
      - これは「コストの見積り」の説明です。
      - これは「予算の作成」の説明です。
      - これは調達の対象群の「供給者の選定」の説明です。
    terms:
      - EVM
      - CCB
  - id: A14-060
    topic: 14-8-1
    diff: 2
    q: JIS Q 21500 のリスクの対象群に含まれるプロセスとその内容の組合せとして，適切なものはどれか。
    c:
      - リスクへの対応は，計画のプロセス群に属し，リスクを洗い出すことである。
      - リスクの特定は，プロジェクトの終結時に一度だけ行う。
      - リスクの評価では，特定したリスクの発生確率や影響を分析して優先順位を付ける。
      - リスクの管理は，立上げのプロセス群に属し，プロジェクト憲章を作成することである。
    a: ウ
    exp: |
      リスクの対象群には、リスクの特定、リスクの評価（いずれも計画のプロセス群）、リスクへの対応（実行のプロセス群）、リスクの管理（管理のプロセス群）の4プロセスがあります。リスクの評価では、発生確率と影響度を基にリスクを分析し、優先順位を付けます。
    why:
      - リスクへの対応は実行のプロセス群に属し、リスクを洗い出すのはリスクの特定です。
      - リスクの特定は計画のプロセス群に属し、プロジェクトを通じて繰り返し行います。
      - 正解です。リスクの評価で優先順位付けを行います。
      - リスクの管理は管理のプロセス群に属し、プロジェクト憲章の作成は統合の対象群のプロセスです。
    terms:
      - リスク分析
      - プロジェクトのリスク対応戦略
  - id: A14-061
    topic: 14-8-2
    diff: 2
    q: JIS Q 21500 のリスクの対象群において，「リスクの特定」の主要なアウトプットであり，「リスクの評価」の主要なインプットとなるものはどれか。
    c:
      - 優先順位付けされたリスク
      - 変更登録簿
      - ステークホルダ登録簿
      - リスク登録簿
    a: エ
    exp: |
      リスクの特定では、プロジェクトに影響を与える可能性のあるリスクを洗い出してリスク登録簿に記録します。リスクの評価はリスク登録簿をインプットとして発生確率や影響を分析し、優先順位付けされたリスクをアウトプットします。優先順位付けされたリスクはリスクへの対応のインプットになります。
    why:
      - 優先順位付けされたリスクはリスクの評価のアウトプットです。
      - 変更登録簿は統合の対象群の変更の管理のアウトプットです。
      - ステークホルダ登録簿はステークホルダの特定のアウトプットです。
      - 正解です。リスク登録簿はリスクの特定で作成されます。
    terms:
      - リスク登録簿
      - ステークホルダ
      - CCB
  - id: A14-062
    topic: 14-9-1
    diff: 2
    q: JIS Q 21500 の品質の対象群に含まれるプロセスとプロセス群の組合せとして，適切なものはどれか。
    c:
      - 品質の計画は計画，品質保証の遂行は実行，品質管理の遂行は管理
      - 品質の計画は管理，品質保証の遂行は終結，品質管理の遂行は実行
      - 品質の計画は立上げ，品質保証の遂行は計画，品質管理の遂行は終結
      - 品質の計画は実行，品質保証の遂行は管理，品質管理の遂行は計画
    a: ア
    exp: |
      品質の対象群には、計画のプロセス群の「品質の計画」、実行のプロセス群の「品質保証の遂行」、管理のプロセス群の「品質管理の遂行」の3プロセスがあります。品質の基準と手段を計画し、計画どおりのプロセスで作業が行われていることを保証し、成果物が要求を満たすかを検査・管理します。
    why:
      - 正解です。計画・実行・管理の各プロセス群に一つずつ属します。
      - 品質管理の遂行は管理のプロセス群に属し、終結のプロセス群のプロセスはありません。
      - 品質の対象群に立上げや終結のプロセス群のプロセスはありません。
      - 品質の計画は計画のプロセス群に属します。
    terms:
      - 品質保証（プロジェクト）
  - id: A14-063
    topic: 14-9-2
    diff: 2
    q: JIS Q 21500 の品質の対象群において，品質計画と進捗データなどをインプットとし，検査報告書や是正処置などをアウトプットするプロセスはどれか。
    c:
      - 品質保証の遂行
      - プロジェクト作業の指揮
      - 品質の計画
      - 品質管理の遂行
    a: エ
    exp: |
      品質の計画は品質要求事項などから品質計画を作成し、品質保証の遂行は品質計画に従ってプロセスが実施されていることを確認します。品質管理の遂行は品質計画と進捗データなどを基に成果物を検査・測定し、検査報告書を作成するとともに、不適合に対する是正処置や再発防止のための予防処置を決めます。
    why:
      - 品質保証の遂行は計画どおりのプロセスで実施しているかを確認するプロセスで、検査報告書は作成しません。
      - プロジェクト作業の指揮は統合の対象群の実行のプロセスです。
      - 品質の計画のアウトプットは品質計画です。
      - 正解です。検査と是正処置は品質管理の遂行で行います。
    terms:
      - 品質保証（プロジェクト）
  - id: A14-064
    topic: 14-10-1
    diff: 2
    q: JIS Q 21500 の調達の対象群に含まれるプロセスの組合せとして，適切なものはどれか。
    c:
      - 調達の計画，予算の作成，コストの管理
      - 調達の計画，供給者の選定，調達の運営管理
      - 調達の運営管理，情報の配布，リスクへの対応
      - 供給者の選定，プロジェクトチームの編成，資源の管理
    a: イ
    exp: |
      調達の対象群には、調達の計画（計画のプロセス群）、供給者の選定（実行のプロセス群）、調達の運営管理（管理のプロセス群）の3プロセスがあります。外部から調達する製品・サービスと調達方法を計画し、提案などを評価して供給者を選定・契約し、契約に基づいて供給者の実績を管理します。
    why:
      - 予算の作成とコストの管理はコストの対象群のプロセスです。
      - 正解です。いずれも調達の対象群のプロセスです。
      - 情報の配布はコミュニケーション、リスクへの対応はリスクの対象群のプロセスです。
      - プロジェクトチームの編成と資源の管理は資源の対象群のプロセスです。
    terms:
      - RFP
      - 提案書
  - id: A14-065
    topic: 14-10-2
    diff: 2
    q: JIS Q 21500 の調達の対象群において，「供給者の選定」の主要なアウトプットはどれか。
    c:
      - リスク登録簿
      - 配布情報
      - 契約書又は注文書
      - 活動順序
    a: ウ
    exp: |
      供給者の選定は、調達の計画で作成した調達計画などに基づいて、供給者から提案や見積りを受けて評価し、供給者を選定して契約を結ぶ実行のプロセス群のプロセスです。主要なアウトプットは契約書又は注文書で、これが調達の運営管理のインプットになります。
    why:
      - リスク登録簿はリスクの特定のアウトプットです。
      - 配布情報はコミュニケーションの対象群の情報の配布のアウトプットです。
      - 正解です。供給者を選定して契約書又は注文書を取り交わします。
      - 活動順序は時間の対象群の活動の順序付けのアウトプットです。
    terms:
      - 請負契約
      - 提案書
  - id: A14-066
    topic: 14-11-1
    diff: 2
    q: JIS Q 21500 のコミュニケーションの対象群に含まれるプロセスの組合せとして，適切なものはどれか。
    c:
      - プロジェクト憲章の作成，情報の配布，変更の管理
      - コミュニケーションの計画，情報の配布，コミュニケーションのマネジメント
      - ステークホルダの特定，ステークホルダのマネジメント，得た教訓の収集
      - 品質の計画，コミュニケーションの計画，スケジュールの作成
    a: イ
    exp: |
      コミュニケーションの対象群には、コミュニケーションの計画（計画のプロセス群）、情報の配布（実行のプロセス群）、コミュニケーションのマネジメント（管理のプロセス群）の3プロセスがあります。誰にどの情報をいつどのように伝えるかを計画し、必要な情報を配布し、コミュニケーションが計画どおりに行われ効果を上げているかを管理します。
    why:
      - プロジェクト憲章の作成と変更の管理は統合の対象群のプロセスです。
      - 正解です。いずれもコミュニケーションの対象群のプロセスです。
      - ステークホルダの対象群と統合の対象群のプロセスの組合せです。
      - 品質の計画は品質、スケジュールの作成は時間の対象群のプロセスです。
    terms:
      - JIS Q 21500
      - ステークホルダ
  - id: A14-067
    topic: 14-11-2
    diff: 2
    q: JIS Q 21500 のコミュニケーションの対象群の「情報の配布」に関する記述として，適切なものはどれか。
    c:
      - 品質要求事項を主要なインプットとし，品質計画をアウトプットする。
      - 活動リストを主要なインプットとし，活動順序をアウトプットする。
      - コミュニケーション計画や進捗報告書などを主要なインプットとし，ステークホルダに必要な情報を届けて配布情報をアウトプットする。
      - 予算と実コストを主要なインプットとし，予想コストをアウトプットする。
    a: ウ
    exp: |
      情報の配布は、コミュニケーション計画に従って、プロジェクト作業の管理で作成された進捗報告書などの情報を、必要とするステークホルダに適切な時期と手段で提供する実行のプロセス群のプロセスです。主要なアウトプットは配布情報です。
    why:
      - これは品質の対象群の品質の計画の説明です。
      - これは時間の対象群の活動の順序付けの説明です。
      - 正解です。進捗報告書などを配布情報として届けます。
      - これはコストの対象群のコストの管理の説明です。
    terms:
      - ステークホルダ
