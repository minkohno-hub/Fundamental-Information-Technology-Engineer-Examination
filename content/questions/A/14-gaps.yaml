    q: JIS Q 21500 の時間の対象群に含まれるプロセスの組合せとして，適切なものはどれか。
    c:
      - コミュニケーションの計画，情報の配布，コミュニケーションのマネジメント
      - 活動の順序付け，活動期間の見積り，スケジュールの作成，スケジュールの管理
      - 資源の見積り，資源の管理，プロジェクトチームのマネジメント
      - 活動の定義，WBSの作成，スコープの定義，スコープの管理
    a: イ
    exp: |
      時間の対象群には、活動の順序付け、活動期間の見積り、スケジュールの作成（いずれも計画のプロセス群）と、スケジュールの管理（管理のプロセス群）の4プロセスがあります。活動そのものの洗い出し（活動の定義）はスコープの対象群に含まれる点に注意します。
    why:
      - コミュニケーションの対象群のプロセスです。
      - 正解です。いずれも時間の対象群のプロセスです。
