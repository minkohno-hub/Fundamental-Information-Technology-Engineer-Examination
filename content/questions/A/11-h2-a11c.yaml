questions:
  - id: A11-523
    topic: 11-1-8-1
    diff: 3
    scope: 11-1-8-1 ハッシュ関数の誕生日攻撃。出力のビット長に対して、衝突が現実的な試行回数で見つかる理由と、必要なハッシュ長の判断
    prereq: 衝突が見つかる試行回数は、出力のパターン数そのものではなく、その平方根のオーダーになること（誕生日パラドックス）
    hard: 総当たりで特定の値に一致させる攻撃（第2原像）と、任意の衝突を探す攻撃（誕生日攻撃）で、困難さのオーダーが異なることを切り分ける必要がある。
    q: |
      文書の改ざん検知に、出力が 32 ビットのハッシュ関数を使っている。攻撃者は、同じハッシュ値を持つ2つの文書の組（衝突）を探そうとしている。この攻撃の困難さの目安として、適切なものはどれか。
    c:
      - 衝突は、出力のパターン数（約 43 億）の平方根のオーダー、すなわち数万件程度の文書を用意すれば、高い確率で見つかる
      - 衝突を見つけるには、出力のパターン数（約 43 億）と同程度の文書が必要であり、現実には困難である
      - ハッシュ値から元の文書を復元できるため、衝突の探索は不要である
      - 衝突は数学的に存在しないため、攻撃は成立しない
    a: ア
    exp: |
      誕生日攻撃では、文書の組の数が文書数の 2 乗のオーダーで増えるため、衝突が現れるのは出力パターン数の平方根程度の試行で済みます。32 ビットの場合、パターン数は約 43 億ですが、その平方根は約 6.5 万であり、確率を考慮しても数万件のオーダーで衝突が見つかります。特定のハッシュ値に一致する文書を探す攻撃（第2原像攻撃）とは困難さが異なるため、衝突への耐性が求められる用途では、十分に長い出力（例えば 256 ビット）が選ばれます。
    why:
      - 正解です。衝突の探索は、パターン数の平方根のオーダーで済みます。
      - 特定の値への一致を探す場合の困難さであり、任意の衝突を探す誕生日攻撃では、はるかに少ない試行で見つかります。
      - ハッシュ関数は一方向性を持ち、ハッシュ値から元の文書は復元できません。攻撃は衝突の探索として行われます。
      - 出力の範囲が有限である以上、入力が多ければ衝突は必ず存在します（鳩の巣原理）。
    know: 誕生日攻撃への耐性は、出力ビット数の半分程度の強さしかない。衝突耐性が必要な用途で、ハッシュ長をどう選ぶかの根拠になる点が要点である。
    terms: [誕生日攻撃, ハッシュ関数, 衝突]
    verify:
      manual: 誕生日パラドックスにより衝突の探索がパターン数の平方根のオーダー（32ビットで約6.5万）になること、第2原像攻撃との困難さの違い、衝突の存在（一方向性・鳩の巣原理）を、各選択肢と照合して確認した。

  - id: A11-524
    topic: 11-1-8-2
    diff: 3
    scope: 11-1-8-2 TLS の証明書チェーン検証。サーバ証明書からルート認証局までの信頼の連鎖が途切れる場合に、接続が失敗する理由の判断
    prereq: 証明書の検証では、サーバ証明書に署名した中間認証局の証明書をたどり、信頼するルート認証局まで連鎖が届くこと
    hard: 証明書そのものの期限や名前ではなく、連鎖の欠落が原因であることを、状況から切り分ける必要がある。
    q: |
      ある Web サイトにブラウザで接続すると、「証明書を検証できない」という警告が出るようになった。サーバ証明書の有効期限は切れておらず、ドメイン名も一致している。調査すると、サーバの設定で、中間認証局の証明書を送る設定が漏れていることが分かった。この状況の説明として、適切なものはどれか。
    c:
      - ブラウザが、サーバ証明書から信頼するルート認証局までの署名の連鎖をたどれず、証明書の正当性を確認できないためである
      - サーバ証明書の秘密鍵が漏えいしたため、ブラウザが自動的に接続を拒否しているためである
      - 証明書の有効期限が、ブラウザの時刻とずれているためである
      - TLS のバージョンが古いため、暗号化そのものができなくなっているためである
    a: ア
    exp: |
      証明書の検証は、サーバ証明書への署名を、中間認証局の証明書、さらにルート認証局へとたどることで行われます。中間認証局の証明書がサーバから送られないと、連鎖が途中で切れ、ブラウザはサーバ証明書が信頼できる認証局の系統にあることを確認できません。期限やドメイン名が正しくても、連鎖が成立しなければ警告になります。対策は、中間証明書を含む証明書チェーンをサーバに正しく設定することです。
    why:
      - 正解です。連鎖の欠落が、検証の失敗の原因です。
      - 秘密鍵の漏えいを、ブラウザが自動的に検知する仕組みはありません。漏えいの場合は、失効の手続が別途必要です。
      - 期限切れではなく、時刻のずれでもありません。有効期限は切れていないことが確認されています。
      - バージョンの古さは、安全性の警告の対象にはなりますが、本件の原因は中間証明書の送付漏れです。
    know: 証明書の信頼は、単体の証明書ではなく「連鎖」で成立する。中間証明書の設定漏れは、実務で頻出の検証失敗の原因であり、要点である。
    terms: [証明書チェーン, 中間認証局, TLS]
    verify:
      manual: 検証の失敗原因が、期限切れやドメイン名の不一致ではなく、中間証明書の欠落による連鎖の断절であることを、状況の各要素と照合して確認した。

  - id: A11-525
    topic: 11-5-1
    diff: 3
    scope: 11-5-1 パスワードの総当たりへの耐性。文字種と桁数から組合せの総数を求め、攻撃の試行速度で割って、解読にかかる時間を見積もる問題
    prereq: 組合せの総数は文字種の数 ^ 桁数、解読時間は総数を試行速度で割ったものであること
    hard: 指数の計算（62 の 10 乗）と、秒から年への換算に加え、当たりが組合せ全体の中で平均的な位置にあるため、全探索の時間の半分で見積もることの読み取りが必要である。
    q: |
      英大文字、英小文字と数字の 62 種類の文字から作る 10 文字のパスワードを、1 秒間に 10^10 回試行できる装置で総当たりする。当たりのパスワードが、組合せ全体の中で平均的な位置にあるとして、見つけるまでにかかる時間は、およそどれか。
    c: ['約1.3年', '約2.7年', '約13年', '約8日']
    a: ア
    exp: |
      組合せの総数は、62 の 10 乗です。

      62^10 ＝ 約 8.4 × 10^17 通り

      全てを試し終える時間 ＝ 8.4 × 10^17 ÷ 10^10 ＝ 約 8.4 × 10^7 秒 ＝ 約 2.7 年

      当たりが平均的な位置にあれば、見つけるまでの時間はその半分程度で、約 4.2 × 10^7 秒 ＝ 約 1.3 年です。文字種や桁数を増やすと、この時間は指数的に伸びます。パスワードの強さは、この見積もりの考え方（総数 ÷ 速度、平均ではその半分）で評価されます。
    why:
      - 正解です。約 8.4 × 10^17 通りを毎秒 10^10 回で試すと、全探索で約 2.7 年、平均ではその半分の約 1.3 年です。
      - 全ての組合せを試し終えるまでの時間（最悪の場合）です。本問は、平均的な位置にある当たりを見つけるまでの時間を問うており、その半分程度になります。
      - 試行速度を 10 分の 1（毎秒 10^9 回）に見積もった場合の平均時間です。速度は毎秒 10^10 回です。
      - 桁数を 9 文字として計算した場合の平均時間です（全探索で約 16 日、その半分で約 8 日）。本問は 10 文字であり、1 文字違うと総数は 62 倍変わります。
    know: パスワードの強さは、組合せの総数（指数）と試行速度の比で見積もる。桁数を 1 つ増やすと、総数が文字種の数だけ倍になる点が要点である。
    terms: [総当たり攻撃, パスワード]
    verify: { type: value, value: 1.3 }

  - id: A11-526
    topic: 11-5-5
    diff: 3
    scope: 11-5-5 サンドボックスによるマルウェア解析。隔離した環境で不審なプログラムを実行し、振る舞いを観察する手法の目的と限界の判断
    prereq: サンドボックスは、本番環境から隔離した実行環境であり、マルウェアの動作（通信先・変更するファイルなど）を安全に観察できること
    hard: 静的な解析（コードの検査）との違いと、サンドボックスを検知して動作を止めるマルウェアがいるという限界の両方を読み取る必要がある。
    q: |
      不審なプログラムの解析にサンドボックスを使う目的と、その限界の組合せとして、適切なものはどれか。
    c:
      - '目的: 隔離した環境で実際に動作させ、通信先やファイルへの変更などの振る舞いを観察すること。限界: 隔離環境であることを検知して、本来の動作を止めるマルウェアがいること'
      - '目的: プログラムのコードを書き換えて、無害化すること。限界: 書き換えたプログラムは元の動作をしなくなること'
      - '目的: マルウェアの通信を遮断して、感染を防ぐこと。限界: 遮断した通信の内容が記録できないこと'
      - '目的: 署名（シグネチャ）との照合で既知のマルウェアを検出すること。限界: 未知のマルウェアは検出できないこと'
    a: ア
    exp: |
      サンドボックスは、本番から隔離した環境で検体を実際に動作させ、その振る舞い（外部への通信、ファイルやレジストリへの変更など）を観察する、動的な解析の手法です。実環境への被害なしに動作を確認できる利点があります。一方で、仮想環境や解析環境であることを検知すると、悪意のある動作を止めてしまうマルウェアもあり、観察結果が「無害」と出ても、それだけで安全とは判断できません。
    why:
      - 正解です。動的な観察という目的と、環境検知による回避という限界の組合せです。
      - コードの無害化は、サンドボックスの目的ではありません。解析は、通常、検体そのままの動作を観察します。
      - 通信の遮断は、ファイアウォールなどの防御の役割です。サンドボックスでは、むしろ通信の試みを観察します。
      - シグネチャ照合は、ウイルス対策ソフトの検出の仕組みであり、サンドボックスによる振る舞いの観察とは別の手法です。
    know: サンドボックスは「実行して観察する」動的解析であり、静的解析やシグネチャ照合とは役割が異なる。環境検知による回避という限界も含めて理解するのが要点である。
    terms: [サンドボックス, マルウェア]
    verify:
      manual: サンドボックスの目的（隔離環境での振る舞いの観察）と限界（環境検知による動作回避）が、他の選択肢の手法（無害化・通信遮断・シグネチャ照合）と混同されていないことを確認した。

  - id: A11-527
    topic: 11-1-7
    diff: 3
    scope: 11-1-7 ハッシュチェーンによる改ざんの検知。各データに前のデータのハッシュ値を含めることで、途中の改ざんが後続の検証で発覚する仕組みの判断
    prereq: データに前のデータのハッシュ値を含めると、1か所の改ざんが、その後の全てのハッシュ値の不一致を引き起こすこと
    hard: 暗号化による秘匿ではなく、ハッシュの連鎖による完全性の担保であることを切り分ける必要がある。
    q: |
      取引の記録を改ざんしにくくするために、各記録に「直前の記録のハッシュ値」を含めて保存する仕組み（ハッシュチェーン）を使っている。過去のある記録を改ざんした場合に起こることとして、適切なものはどれか。
    c:
      - 改ざんした記録のハッシュ値が変わるため、それを参照している次の記録とのつながりが崩れ、さらに後続の記録全てで不一致が連鎖し、検証で検知できる
      - ハッシュ値は改ざんしても変わらないため、検知はできない
      - 改ざんした記録だけが無効になり、他の記録への影響はない
      - ハッシュ値が暗号化の鍵として働くため、記録の内容が自動的に復元される
    a: ア
    exp: |
      各記録は、直前の記録のハッシュ値を含んでいます。過去の記録を 1 件改ざんすると、その記録のハッシュ値が変わり、次の記録が保持している「直前のハッシュ値」と一致しなくなります。不一致は後続の記録全てに及ぶため、検証では改ざんの位置まで特定できます。この連鎖の構造が、ブロックチェーンの改ざん困難性の基礎にもなっています。なお、ハッシュは秘匿のための仕組みではなく、完全性（改ざんの検知）のための仕組みです。
    why:
      - 正解です。ハッシュ値の変化が、後続の記録との不一致として連鎖します。
      - ハッシュ値は、入力が少しでも変われば大きく変わる性質（雪崩効果）を持つため、改ざんで変化します。
      - 連鎖の構造上、影響は改ざんした位置より後の全記録に及びます。
      - ハッシュ値に、内容を復元する機能はありません。復元ではなく検知のための仕組みです。
    know: ハッシュチェーンは、「前のハッシュを含む」という単純な構造で、改ざんの影響を後方全体に伝える。秘匿ではなく完全性の仕組みである点が要点である。
    terms: [ハッシュチェーン, ブロックチェーン]
    verify:
      manual: 改ざんした記録のハッシュ値の変化が、後続の全記録の不一致として伝わることを、連鎖の構造から確認した。他の選択肢（不変・局所的影響・復元）はいずれもハッシュの性質に反する。

  - id: A11-528
    topic: 11-1-7
    diff: 3
    scope: 11-1-7 共通鍵の鍵長と総当たりの時間。鍵のビット数から鍵の総数を求め、試行速度で割って解読時間を見積もる問題
    prereq: 鍵の総数は 2 ^ ビット数であり、ビット数が 1 増えると総数が 2 倍になること
    hard: 2 の累乗の見積もり（2^56 ≒ 7.2 × 10^16）と、秒から時間への換算をつなげる必要がある。
    q: |
      鍵長が 56 ビットの共通鍵暗号を、1 秒間に 10^12 本の鍵を試せる装置で総当たりする。全ての鍵を試し終えるのにかかる時間は、およそどれか。ここで、2^56 は約 7.2 × 10^16 とする。
    c: ['約20時間', '約200時間', '約83日', '約23年']
    a: ア
    exp: |
      鍵の総数は、2^56 ＝ 約 7.2 × 10^16 本です。

      かかる時間 ＝ 7.2 × 10^16 ÷ 10^12 ＝ 7.2 × 10^4 秒

      7.2 × 10^4 秒 ＝ 72,000 秒 ＝ 約 20 時間です。かつて標準だった 56 ビットの鍵長が、計算能力の向上で現実的な時間に解読されるようになったことが、より長い鍵長への移行の理由です。
    why:
      - 正解です。7.2 × 10^16 本を毎秒 10^12 本で試すと、約 20 時間です。
      - 試行速度を 10 分の 1 に見積もった場合に当たる値です。速度は毎秒 10^12 本です。
      - 試行速度を毎秒 10^10 本と見積もった場合の値（7.2 × 10^6 秒 ＝ 約 83 日）です。速度は毎秒 10^12 本です。
      - 試行速度を毎秒 10^8 本と見積もった場合の値（7.2 × 10^8 秒 ＝ 約 23 年）です。速度は毎秒 10^12 本です。
    know: 鍵の総当たりの時間は、鍵空間（2 の累乗）と試行速度の比で決まる。鍵長を 1 ビット延ばすと時間が 2 倍になる、という指数の感覚が要点である。
    terms: [鍵長, 総当たり攻撃]
    verify: { type: value, value: 20 }

  - id: A11-529
    topic: 11-1-8-5
    diff: 3
    scope: 11-1-8-5 セキュアブート。起動時にソフトウェアの署名を検証し、改ざんされたコードの実行を防ぐ仕組みの判断
    prereq: セキュアブートは、起動の各段階で次の段階のソフトウェアのデジタル署名を検証し、検証に失敗すると起動を止めること
    hard: 検証の対象が「起動時に読み込まれるソフトウェア」であり、実行中のウイルスの検出（ウイルス対策ソフト）とは役割が異なることを切り分ける必要がある。
    q: |
      コンピュータの起動時に、改ざんされたブートローダや OS が実行されることを防ぐ仕組みとして、適切なものはどれか。
    c:
      - 'セキュアブート: 起動の各段階で、次に読み込むソフトウェアの署名を検証し、正当なものだけを実行する'
      - 'ディスクの暗号化: 保存されているデータを暗号化し、盗まれても内容を読めなくする'
      - 'ウイルス対策ソフトの常駐監視: 実行中のプログラムの振る舞いを監視し、不審な動作を止める'
      - 'BIOS パスワード: 起動時の設定変更にパスワードを要求し、設定の改ざんを防ぐ'
    a: ア
    exp: |
      セキュアブートは、起動の連鎖の中で、各段階が次のソフトウェア（ブートローダ、OS カーネルなど）のデジタル署名を検証し、署名が正当な場合だけ実行を進める仕組みです。改ざんされたコードは署名の検証に失敗するため、起動の時点で実行を防げます。ディスクの暗号化は秘匿のための仕組みであり、実行そのものの正当性は検証しません。
    why:
      - 正解です。署名の検証により、改ざんされたソフトウェアの実行を起動時に防ぎます。
      - データの秘匿が目的であり、正当なソフトウェアかどうかの検証は行いません。
      - 実行開始後の監視であり、起動の段階で読み込まれるソフトウェアの正当性の検証とは役割が異なります。
      - 設定変更の防止は一部の防御ですが、読み込まれるソフトウェアの署名の検証とは仕組みが異なります。
    know: セキュアブートは「信頼の連鎖」を起動過程に適用したもので、完全性の検証が目的である。暗号化（秘匿）や常駐監視との役割の違いが要点である。
    terms: [セキュアブート, デジタル署名]
    verify:
      manual: セキュアブートが起動の各段階での署名検証により改ざんされたコードの実行を防ぐこと、他の選択肢（暗号化・常駐監視・設定パスワード）が異なる目的の仕組みであることを確認した。

  - id: A11-530
    topic: 11-1-8-3
    diff: 3
    scope: 11-1-8-3 暗号の危殆化への対応。使用中の暗号アルゴリズムの安全性が低下した場合に、計画的に移行するための考え方の判断。本問は、暗号技術そのものではなく、危殆化への組織的な対応（経営・運用の判断）を問う位置付けである
    prereq: 暗号アルゴリズムは、計算能力の向上や解読手法の進展で安全性が低下（危殆化）するため、利用中の暗号の棚卸しと移行計画が要ること
    hard: 「今すぐ全てを止める」でも「問題が起きるまで使い続ける」でもない、リスクに応じた計画的移行という判断が問われる。暗号アジリティ（切替のしやすさ）の考え方も含まれる。
    q: |
      社内で広く使われている暗号アルゴリズムについて、解読手法の進展により、数年以内に安全性が不十分になる見通しが公表された。情報セキュリティ部門の対応として、適切なものはどれか。
    c:
      - 利用箇所を棚卸しし、データの重要度と保持期間に応じて優先順位を付け、より安全なアルゴリズムへの移行を計画的に進める
      - 現時点で解読されたわけではないため、具体的な被害が確認されるまで、対応を行わない
      - 直ちに、そのアルゴリズムを使う全システムを停止する
      - 鍵の変更だけを行い、アルゴリズムは使い続ける
    a: ア
    exp: |
      暗号の危殆化への対応は、計画性が要ります。まず、どのシステムの、どのデータにそのアルゴリズムが使われているかを棚卸しし、長期に秘匿が必要なデータや重要なシステムから優先して、安全なアルゴリズムへ移行します。被害が出てからでは、既に暗号化されていたデータの漏えいに間に合いません。一方、全システムの即時停止は業務への影響が過大です。鍵の変更は、アルゴリズム自体の弱さへの対策にはなりません。移行しやすい設計（暗号アジリティ）を平時から備えることも重要です。
    why:
      - 正解です。棚卸しと優先順位付けによる、計画的な移行が適切です。
      - 危殆化は進行する問題であり、被害の確認を待つと、保持されている暗号化データが危険にさらされます。
      - 業務への影響が過大であり、リスクに応じた優先順位付けを欠いています。
      - 弱くなったのはアルゴリズム自体であり、鍵を変えても強度は回復しません。
    know: 暗号の危殆化への対応は、棚卸し・優先順位・移行計画という管理の流れで行う。技術の寿命を見越した暗号アジリティの考え方が要点である。
    terms: [暗号の危殆化, 暗号アジリティ]
    verify:
      manual: 危殆化への対応が、利用箇所の棚卸しと、重要度・保持期間に応じた優先順位付けによる計画的移行であること、他の選択肢（放置・全面停止・鍵の変更のみ）が不適切である理由を確認した。
