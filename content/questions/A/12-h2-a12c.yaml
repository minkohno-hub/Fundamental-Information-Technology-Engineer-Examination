questions:
  - id: A12-819
    topic: 12-1-7-2
    diff: 3
    scope: 12-1-7-2 ユースケース図の汎化。一般的なユースケースと、その具体的な実現方法であるユースケースとの関係の表し方を選ぶ問題
    prereq: 汎化は、一般的な要素と具体的な要素の間の「種類」の関係であり、白抜き三角の矢印を具体側から一般側へ引くこと、include（常時含まれる振る舞い）・extend（条件付きの挿入）とは別の関係であること
    hard: 「支払い方法の種類分け」という分類の関係を、振る舞いの包含（include）や条件付き挿入（extend）と取り違えないことが問われる。
    q: |
      ユースケース図で、「支払い」というユースケースを、クレジットカードによる支払いと、コンビニでの現金支払いという、2 つの具体的な方法に分けて表したい。この関係の表し方として、適切なものはどれか。
    c:
      - 「支払い」を一般的なユースケースとし、2 つの具体的な支払いのユースケースから「支払い」へ、汎化の関係を引く
      - 「支払い」から 2 つの具体的な支払いへ、include の関係を引く
      - 「支払い」から 2 つの具体的な支払いへ、extend の関係を引く
      - 2 つの具体的な支払いを、アクターとして表す
    a: ア
    exp: |
      2 つの支払い方法は、「支払い」という一般的な振る舞いの具体的な実現方法です。このような「一般と具体（種類）」の関係は、汎化で表し、具体側から一般側へ向けて矢印を引きます。include は、基本の振る舞いに常に含まれる別の振る舞いを切り出す関係であり、「毎回両方の支払い方法を実行する」ことになってしまいます。extend は、条件を満たすときだけ挿入される拡張の関係であり、種類の分類ではありません。アクターは、システムの外部にある人や他のシステムを表すものです。
    why:
      - 正解です。一般的な振る舞いとその具体的な方法という関係は、汎化で表します。
      - include では、「支払い」の実行のたびに両方の方法が常に行われる意味になり、種類分けにはなりません。
      - extend は条件付きで挿入される拡張の関係です。支払い方法の分類（常にどちらか一方を選ぶ関係）とは異なります。
      - 支払い方法はシステム内部の振る舞い（ユースケース）であり、システムの外部の存在であるアクターではありません。
    know: ユースケース図の関係は、汎化（種類）、include（常時含まれる振る舞い）、extend（条件付きの拡張）で意味が異なる。表したい関係が「分類」なのか「実行のたびの包含」なのかを見分けることが要点である。
    terms: [ユースケース, 汎化]
    verify:
      manual: 2 つの支払い方法が「支払い」の具体化である（種類の関係）ことを確認し、汎化だけがその関係を表すこと、include は常時包含、extend は条件付き挿入で、いずれも分類ではないことと照合した。
  - id: A12-820
    topic: 12-1-7-4
    diff: 3
    scope: 12-1-7-4 DFD のバランス（階層間の整合）。親の DFD と子（詳細化された DFD）の間で、入出力のデータフローが一致しなければならないという規則の判断
    prereq: DFD を階層化して詳細化する際、詳細化された側の入出力は、元のプロセスへの入出力と一致しなければならないこと（バランスの原則）
    hard: 内部の処理の詳細が増えることと、外部との入出力が変わることの違いを読み分ける必要がある。新しいデータストアの追加が許されるかどうかも含まれる。
    q: |
      DFD で、プロセス「請求処理」を詳細化した下位の DFD を作成した。上位の DFD では、請求処理への入力は「出荷データ」、出力は「請求書」であった。下位の DFD の作り方として、適切なものはどれか。
    c:
      - 下位の DFD の入力は「出荷データ」、出力は「請求書」のままとし、内部の処理の流れと、内部で使うデータストアを詳細に描く
      - 下位の DFD では、出力に「請求書」に加えて「催促状」を追加してよい
      - 下位の DFD では、入力の「出荷データ」を「注文データ」に置き換えてよい
      - 下位の DFD では、上位との整合は不要であり、処理の実態に合わせて自由に描く
    a: ア
    exp: |
      DFD の階層化では、バランス（整合）の原則により、詳細化された DFD の入出力は、元のプロセスの入出力と一致しなければなりません。詳細化で増やしてよいのは、内部のプロセスの分解と、その内部で使うデータストアです。外部から入るデータや外部へ出るデータを変えてしまうと、上位の図と矛盾し、全体のデータの流れが追えなくなります。
    why:
      - 正解です。入出力は変えず、内部を詳細化するのが原則です。
      - 催促状という新しい出力を加えると、上位の DFD と入出力が一致しなくなります。
      - 入力の置き換えは、上位の DFD との不整合を生みます。
      - 上位との整合は、バランスの原則として必要です。自由に変えることはできません。
    know: DFD の詳細化は、「外との出入りは同じ、内側だけを詳しく」というバランスの原則で判断する。図の階層的な整合が要点である。
    terms: [DFD, データフロー]
    verify:
      manual: 詳細化したDFDの入出力は元のプロセスの入出力（出荷データ→請求書）と一致しなければならないというバランスの原則から、内部の詳細化だけを行う作り方が適切であることを確認した。

  - id: A12-821
    topic: 12-6-3
    diff: 3
    scope: 12-6-3 保守のタイプと変更内容の組合せの正誤判断。4 つの組合せをそれぞれ、変更のきっかけから検証する問題
    prereq: 保守のタイプは変更のきっかけで分類すること（障害の修正は是正、環境の変化への対応は適応、改善の要望への対応は完全化、障害の未然防止は予防）
    hard: 正しい組合せが 3 つ並ぶ中で、1 つだけ紛れた誤った組合せ（操作性の改善を予防保守とするもの）を見分ける必要がある。タイプの名前の印象ではなく、きっかけで判断することが問われる。
    q: |
      保守のタイプと変更内容の組合せとして、誤っているものはどれか。
    c:
      - 障害で停止した機能を、元の状態に戻す修正を行う — 是正保守
      - 法令の改正に合わせて、税額の計算式を変更する — 適応保守
      - 利用者の要望を受けて、画面の操作性を改善する — 予防保守
      - 将来の障害を未然に防ぐため、内部の構造を見直す — 予防保守
    a: ウ
    exp: |
      保守のタイプは、変更のきっかけで分類します。障害の修正は是正保守、法令改正という環境の変化への対応は適応保守、将来の障害の未然防止は予防保守であり、この 3 つは正しい組合せです。一方、利用者の要望による操作性の改善は、機能や使い勝手を良くする変更であり、完全化保守に当たります。予防保守は「将来の障害を防ぐ」変更に限られるため、ウの組合せが誤りです。
    why:
      - 障害や誤りを直す変更は、是正保守であり、正しい組合せです。
      - 外部環境（法令）の変化に合わせる変更は、適応保守であり、正しい組合せです。
      - 正解です。要望による改善は完全化保守であり、予防保守ではありません。予防保守は、障害の未然防止を目的とする変更です。
      - 将来の障害を防ぐための構造の見直しは、予防保守であり、正しい組合せです。
    know: 保守のタイプは、「きっかけ」で分類する。不具合なら是正、環境の変化なら適応、改善の要望なら完全化、未然防止なら予防、という対応が識別の鍵であり、組合せの正誤はこの対応表で検証できる。
    terms: [適応保守, 是正保守, 完全化保守, 予防保守]
    verify:
      manual: 4 つの組合せを、変更のきっかけ（障害、法令改正、改善の要望、未然防止）からそれぞれ分類し、ウ（要望による改善を予防保守とする）だけが分類と合わないことを確認した。
  - id: A12-822
    topic: 12-2-8-2
    diff: 3
    scope: 12-2-8-2 製品品質モデル。応答時間や資源の使われ方に関する品質特性（性能効率性）を、他の品質特性と区別して識別する判断
    prereq: 製品品質モデルでは、性能効率性は、決められた条件下での応答時間や処理量、資源の使用量に関する特性であること
    hard: 利用者の不満の内容が、どの品質特性の領域なのかを読み分ける必要がある。機能の正しさ（機能適合性）や、使いやすさ（使用性）との区別が問われる。
    q: |
      業務システムの利用者から、「入力した内容は正しく処理されるが、ピーク時には画面の応答が著しく遅くなり、業務が滞る」という苦情が寄せられた。製品品質モデルの観点から、主に改善すべき品質特性はどれか。
    c:
      - 性能効率性
      - 機能適合性
      - 使用性
      - 移植性
    a: ア
    exp: |
      苦情の内容は、処理の結果の正しさではなく、応答の速さ（時間）と、負荷が高い状況での振る舞いです。製品品質モデルで、応答時間・処理量・資源の使用量を扱うのは、性能効率性です。機能適合性は、機能が要求を満たし、正しく動作することに関する特性であり、本件では処理結果は正しいとされています。使用性は操作のしやすさ、移植性は環境への移しやすさであり、いずれも本件の対象ではありません。
    why:
      - 正解です。応答時間や処理量に関する特性は、性能効率性です。
      - 機能適合性は、機能の有無や結果の正しさの特性です。本件では、正しく処理されていることが前提です。
      - 使用性は、操作の分かりやすさや学びやすさの特性であり、応答速度の話ではありません。
      - 移植性は、別の環境へ移す際の特性であり、本件とは関係しません。
    know: 品質特性の識別は、不満や要求の内容を「何についての話か」に置き換えることである。時間や量の話は性能効率性、という対応が要点である。
    terms: [性能効率性, 製品品質モデル]
    verify:
      manual: 苦情の内容が応答時間とピーク時の振る舞いであり、処理結果の正しさではないことから、改善対象が性能効率性であることを、機能適合性・使用性・移植性との区別から確認した。

  - id: A12-823
    topic: 12-2-15
    diff: 3
    scope: 12-2-15 レビューの参加者構成。テスト工程の担当者を設計レビューに参加させる目的を、テストのしやすさの観点から設計の欠陥や曖昧さを早期に指摘してもらうこととして判断する問題
    prereq: レビューは成果物の欠陥を早期に見つけるための点検であり、作成者とは異なる立場の参加者が、それぞれの工程の観点から確認することで、後になって見つかる欠陥を上流で減らせること
    hard: 参加の目的を、責任の分担や会議の形式ではなく「観点の追加」として捉える必要がある。テスト工程そのものを前倒しする話と混同しやすい点も見分けの対象になる。
    q: |
      基本設計のレビューに、後工程であるテスト工程の担当者を参加させることにした。その目的として、最も適切なものはどれか。
    c: ['テストのしやすさの観点から、設計の欠陥や曖昧な記述を早期に指摘してもらうため', 'テスト担当者にも設計の承認責任を分担してもらうため', 'レビューの参加人数を増やし、会議を公式な手続として成立させるため', 'レビューへの参加をもって、テスト工程の開始を早めるため']
    a: ア
    exp: |
      レビューは、成果物の欠陥をできるだけ早い段階で見つける活動であり、作成者とは異なる立場の参加者が、それぞれの観点から点検することで効果が高まります。

      テスト担当者は、「この仕様ではテストケースを作れるか」「解釈が分かれる記述はないか」という、テストのしやすさの観点を持ちます。基本設計の段階でこの観点からの指摘を受けると、テスト工程に入ってから見つかるはずの欠陥や曖昧さを、上流で直すことができます。レビューへの参加は、承認責任の分担や、後工程の開始時期を変えるためのものではありません。
    why:
      - 正解です。テストの観点からの指摘により、テストしにくい設計や曖昧な記述を、テスト工程に入る前に直せます。
      - レビューは欠陥を見つける活動であり、参加したことで設計の承認責任が移ったり分担されたりするものではありません。
      - 会議の公式さは参加人数で決まるものではありません。意味があるのは人数ではなく、観点の異なる参加者が加わることです。
      - レビューへの参加は、テスト工程の開始を早める手続ではありません。欠陥を早期に直すことで、結果として後の手戻りは減らせます。
    know: レビューの効果は、参加者の観点の多様さによって高まる。テストや運用など後工程の担当者が参加すると、その工程で問題になる欠陥を上流のうちに指摘できる点が要点である。
    terms: [テスト容易性]
    verify:
      manual: レビューの目的（欠陥の早期発見）と参加者の観点の関係を、各選択肢と照合した。テスト担当者の参加の目的は、テストのしやすさの観点から曖昧さや欠陥を早期に指摘することであり、承認責任の分担、会議の形式、工程の前倒しのいずれでもないことを確認した。
  - id: A12-824
    topic: 12-5-5-1
    diff: 3
    scope: 12-5-5-1 受入れテストで見つかった軽微な問題への対応。影響と修正時期を合意し、記録に残した上で条件付きで受け入れる判断を選ぶ問題
    prereq: 受入れ（検収）の判断は、問題の影響の大きさに応じて行うこと、条件付きで受け入れる場合は、問題の内容と修正の約束を記録に残すことが必要であること
    hard: 「軽微でも一切認めない」という硬直した判断と、「記録なしで受け入れる」という曖昧な判断の、両方を退ける必要がある。影響の評価と記録という、判断の手続きが問われる。
    q: |
      受入れテストで、業務の処理結果には影響しない、画面表示の軽微なずれが見つかった。納期が迫っている中での対応として、適切なものはどれか。
    c:
      - 問題の影響の範囲と修正する時期を発注側と開発側で合意し、その内容を記録に残した上で、条件付きで受け入れる
      - 軽微であっても問題が残る以上、修正が完了するまで一切の受入れを認めない
      - 軽微な問題であるため、記録には残さず、口頭の約束だけで受け入れる
      - 受入れテストの全項目を最初から実施し直し、他の問題がないか改めて確認する
    a: ア
    exp: |
      受入れの判断は、見つかった問題の影響の大きさに応じて行います。業務に影響しない軽微な問題であれば、影響の範囲と修正時期を取り決め、記録に残した上で、条件付きで受け入れることが、現実的で適切な対応です。記録に残すことで、修正の約束が後から検証できます。一方、軽微な問題でも一切の受入れを認めない進め方は、影響に見合わず、納期への影響が過大です。記録を残さない口頭の約束は、後で言った言わないの争いになり、修正が実行されないおそれがあります。
    why:
      - 正解です。影響と修正時期を合意し、記録に残す条件付きの受入れが、影響に見合った対応です。
      - 業務に影響しない軽微な問題に、一切の受入れを認めない対応は、影響の大きさに見合いません。判断は影響に応じて行います。
      - 記録を残さなければ、修正の約束の存在も内容も後から確認できず、条件付き受入れの前提が崩れます。
      - 全項目の再実施は、軽微な表示の問題への対応としては過大であり、見つかった問題の扱い（受入れの判断）そのものにも答えていません。
    know: 受入れ（検収）の判断は、問題の影響に応じた比例的な対応が原則である。条件付きで受け入れる場合は、「合意を記録に残すこと」が、約束を実効あるものにする要点になる。
    terms: [受入れテスト, 検収]
    verify:
      manual: 問題の影響（業務の処理結果に影響しない軽微な表示のずれ）と各対応を照合し、影響と修正時期を合意して記録に残す条件付き受入れだけが、影響に見合った手続きであることを確認した。
  - id: A12-825
    topic: 12-1-7-3
    diff: 3
    scope: 12-1-7-3 プロトタイピングの型。確認のためだけに試作品を作り、確認後に破棄して本体を改めて開発する進め方の分類を選ぶ問題
    prereq: プロトタイピングには、確認後に試作品を破棄する使い捨て型と、試作品を育てて完成品にする育成型（進化型）があること
    hard: 試作品の「作り方」ではなく「確認後の扱い（破棄するか、育てるか）」が分類の軸であることを見抜く必要がある。
    q: |
      要件の確認のために、画面の試作品を作成した。この試作品は、確認が済めば破棄し、本体の開発は改めて行う計画である。このような試作品の扱いに当たるものはどれか。
    c:
      - 使い捨て型のプロトタイピング
      - 育成型（進化型）のプロトタイピング
      - ウォーターフォールモデル
      - アジャイル開発
    a: ア
    exp: |
      プロトタイピングは、試作品の扱いによって 2 つに分かれます。確認のためだけに作り、確認が済めば破棄して、本体を改めて開発する進め方は、使い捨て型（スローアウェイ型）です。試作品が使い捨てであるため、本体の品質要件（性能や保守性）を試作品に求める必要がなく、確認に集中できます。育成型（進化型）は、試作品を段階的に育てて、そのまま完成品にする進め方であり、本問の「破棄する」計画とは逆です。
    why:
      - 正解です。確認後に破棄し、本体を改めて開発する扱いが、使い捨て型です。
      - 育成型は、試作品を育てて完成品にする進め方であり、破棄する本問の計画とは異なります。
      - ウォーターフォールモデルは、工程を順に進める開発の進め方であり、試作品を作って確認する手法は含みません。
      - アジャイル開発は、短い反復で動くソフトウェアを届ける開発の進め方であり、試作品の扱い（破棄するか）の分類ではありません。
    know: プロトタイピングの分類は、試作品の行方で決まる。使い捨て型は「確認に集中できる代わりに、作り直しのコストがかかる」、育成型は「作り直しがない代わりに、試作品の品質がそのまま残る」という特徴の対比が要点である。
    terms: [プロトタイピング, プロトタイプ]
    verify:
      manual: 試作品の扱い（確認後に破棄し、本体を改めて開発する）とプロトタイピングの型の分類を照合し、使い捨て型だけが一致すること、育成型は完成品に育てる進め方であることを確認した。
  - id: A12-826
    topic: 12-1-7-7
    diff: 3
    scope: 12-1-7-7 ユーザーストーリー。「誰として、何をしたい、なぜなら」という形式で、利用者の価値の観点から要求を表す書き方の識別
    prereq: ユーザーストーリーは、利用者の立場（役割）、望むこと、その理由（得られる価値）の 3 要素で構成されること
    hard: システム側の機能の列挙（仕様の書き方）と、利用者の価値の観点の書き方を読み分ける必要がある。
    q: |
      アジャイル開発で要求をユーザーストーリーとして記述する際の、書き方として適切なものはどれか。
    c:
      - 「通販サイトの会員として、注文履歴から再注文したい。買い物かごを作り直す手間を省きたいから」という、役割・望むこと・理由をそろえた書き方
      - 「再注文機能は、注文履歴テーブルの検索処理と、買い物かごへの登録処理で構成する」という、処理の構成を列挙した書き方
      - 「再注文の画面は、ボタンを青色にし、一覧は 20 件ずつ表示する」という、画面の仕様を定めた書き方
      - 「再注文機能の開発には 5 人日を要する」という、見積りを記した書き方
    a: ア
    exp: |
      ユーザーストーリーは、「（役割）として、（望むこと）をしたい。（理由・得られる価値）」という形式で、利用者の観点から要求を表す書き方です。チームが、誰のための、何のための要求かを共有し、対話の出発点にすることが目的です。処理の構成や画面の詳細な仕様、見積りは、いずれも別の文書や作業で扱うものであり、ストーリー自体の書き方ではありません。
    why:
      - 正解です。役割・望むこと・理由の 3 要素がそろっています。
      - 処理の構成は設計の内容であり、利用者の観点の記述ではありません。
      - 画面の詳細な仕様は、ストーリーを受けて詰める内容であり、ストーリーそのものの書き方ではありません。
      - 見積りは、ストーリーの規模を測る別の作業の結果です。
    know: ユーザーストーリーの要点は、利用者の価値の観点で要求を短く表すことである。仕様の詳細は対話で詰める、という位置付けが書き方の判断の鍵である。
    terms: [ユーザーストーリー]
    verify:
      manual: 役割・望むこと・理由の3要素をそろえた書き方がユーザーストーリーであることを、処理構成の列挙・画面仕様・見積りという、別の文書や作業の内容との対比で確認した。
