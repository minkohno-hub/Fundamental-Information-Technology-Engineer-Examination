  - id: A22-032
    topic: 22-3-1-4
    diff: 2
    q: |
      損益計算書の項目の金額が次のとおりであるとき，経常利益は何百万円か。

      | 項目 | 金額（百万円） |
      | --- | --- |
      | 売上高 | 1,000 |
      | 売上原価 | 600 |
      | 販売費及び一般管理費 | 250 |
      | 営業外収益 | 20 |
      | 営業外費用 | 30 |
      | 特別利益 | 10 |
      | 特別損失 | 40 |
    c: ['140', '150', '110', '400']
    a: ア
    exp: |
      損益計算書では、利益を段階的に計算します。
      - 売上総利益 = 売上高 − 売上原価 = 1,000 − 600 = 400
      - 営業利益 = 売上総利益 − 販売費及び一般管理費 = 400 − 250 = 150
      - 経常利益 = 営業利益 + 営業外収益 − 営業外費用 = 150 + 20 − 30 = 140
      - 税引前当期純利益 = 経常利益 + 特別利益 − 特別損失 = 140 + 10 − 40 = 110
      特別利益・特別損失は、経常利益の計算には含めません。
    why:
      - 正解です。営業利益 150 に営業外損益を加減して 140 百万円です。
      - 150 百万円は営業利益で、営業外収益・営業外費用を反映していません。
      - 110 百万円は特別損益まで加減した税引前当期純利益です。
      - 400 百万円は売上総利益です。
    terms: [損益計算書, 経常利益, 営業利益, 売上総利益, 販売費及び一般管理費]
    verify: { value: '1000 - 600 - 250 + 20 - 30' }

  - id: A22-033
    topic: 22-3-1-1
    diff: 2
    q: ある企業の売上高は 2,000 万円，変動費は 1,200 万円，固定費は 600 万円である。この企業の損益分岐点売上高は何万円か。
    c:
      - '1,500'
      - '1,000'
      - '1,800'
      - '1,200'
    a: ア
    exp: |
      損益分岐点売上高は、利益がちょうど 0 になる売上高で、次の式で求めます。
      - 変動費率 = 変動費 ÷ 売上高 = 1,200 ÷ 2,000 = 0.6
      - 損益分岐点売上高 = 固定費 ÷（1 − 変動費率）= 600 ÷ 0.4 = 1,500 万円
      検算：売上高 1,500 万円のとき、変動費 900 万円＋固定費 600 万円＝費用 1,500 万円となり、利益は 0 です。
    why:
      - 正解です。固定費を限界利益率（1 − 変動費率）0.4 で割ります。
      - 固定費を変動費率 0.6 で割った誤りです。
      - 固定費と変動費を合計した総費用で、損益分岐点ではありません。
      - 1,200 万円は変動費の額で、損益分岐点売上高ではありません。
    terms: [損益分岐点, 変動費率, 固定費]
    verify: { value: '600 / (1 - 1200 / 2000)' }

  - id: A22-034
    topic: 22-3-1-1
    diff: 3
    q: 製品の販売単価が 1,000 円，1 個当たりの変動費が 600 円，固定費が 300 万円である。利益 180 万円を達成するために必要な売上高は何万円か。
    c:
      - '1,200'
      - '800'
      - '750'
      - '480'
    a: ア
    exp: |
      目標利益を達成する売上高は、「固定費 + 目標利益」を限界利益率で割って求めます。
      - 変動費率 = 600 ÷ 1,000 = 0.6、限界利益率 = 1 − 0.6 = 0.4
      - 必要な売上高 = （300 + 180）÷ 0.4 = 1,200 万円
      検算：売上高 1,200 万円のとき、変動費 720 万円、固定費 300 万円で、利益は 1,200 − 720 − 300 = 180 万円です。
    why:
      - 正解です。（固定費＋目標利益）を限界利益率 0.4 で割ります。
      - （固定費＋目標利益）を変動費率 0.6 で割った誤りです。
      - 固定費だけを限界利益率で割った値で、これは損益分岐点売上高です。
      - 固定費と目標利益の合計で、必要な限界利益の額にあたります。
    terms: [損益分岐点, 変動費率, 限界利益]
    verify: { value: '(300 + 180) / (1 - 600 / 1000)' }

  - id: A22-035
    topic: 22-3-1-4
    diff: 1
    q: 貸借対照表において，流動負債に分類されるものはどれか。
    c: ['買掛金', '売掛金', '長期借入金', '資本金']
    a: ア
    exp: |
      貸借対照表は、一定時点の財政状態を、資産（左側）と負債・純資産（右側）に分けて表したものです。
      - 流動資産：現金預金、売掛金、商品など（1 年以内に現金化される資産）
      - 固定資産：建物、機械、ソフトウェアなど
      - 流動負債：買掛金、短期借入金など（1 年以内に支払う負債）
      - 固定負債：長期借入金、社債など
      - 純資産：資本金、利益剰余金など
      買掛金は、商品などを掛けで仕入れた代金の未払い分で、通常 1 年以内に支払うので流動負債です。
    why:
      - 正解です。仕入代金の未払い分で流動負債です。
      - 売掛金は、販売代金の未回収分で流動資産です。
      - 長期借入金は、返済期限が 1 年を超える借入金で固定負債です。
      - 資本金は、株主が出資した金額で純資産です。
    terms: [貸借対照表, 流動負債, 流動資産, 固定負債, 純資産]

  - id: A22-036
    topic: 22-3-2
    diff: 2
    q: |
      ある企業の貸借対照表の要約は次のとおりである。この企業の流動比率は何 % か。

      | 項目 | 金額（百万円） |
      | --- | --- |
      | 流動資産 | 300 |
      | 固定資産 | 500 |
      | 流動負債 | 200 |
      | 固定負債 | 250 |
      | 純資産 | 350 |
    c: ['150', '67', '120', '60']
    a: ア
    exp: |
      流動比率は、短期的な支払能力（安全性）を表す指標で、1 年以内に支払う流動負債に対して、1 年以内に現金化できる流動資産がどれだけあるかを示します。
      流動比率 = 流動資産 ÷ 流動負債 × 100 = 300 ÷ 200 × 100 = 150 %
      一般に、高いほど短期的な安全性が高いとされます。
    why:
      - 正解です。流動資産 300 を流動負債 200 で割ります。
      - 流動負債を流動資産で割った、分子と分母が逆の値（約 67 %）です。
      - 流動資産を固定負債で割った値で、流動比率ではありません。
      - 流動資産を固定資産で割った値で、流動比率ではありません。
    terms: [流動比率, 流動資産, 流動負債]
    verify: { value: '300 / 200 * 100' }

  - id: A22-037
    topic: 22-3-2
    diff: 2
    q: ある企業の当期純利益は 60 億円，自己資本は 400 億円，総資産は 1,200 億円である。この企業の ROE（自己資本利益率）は何 % か。
    c: ['15', '5', '7.5', '33']
    a: ア
    exp: |
      ROE（Return On Equity：自己資本利益率）は、株主が出資した自己資本を使ってどれだけ利益を上げたかを示す収益性の指標です。
      ROE = 当期純利益 ÷ 自己資本 × 100 = 60 ÷ 400 × 100 = 15 %
      一方、ROA（Return On Assets：総資産利益率）は総資産に対する利益の割合で、60 ÷ 1,200 × 100 = 5 % です。
    why:
      - 正解です。当期純利益 60 を自己資本 400 で割ります。
      - 5 % は、総資産を分母とした ROA（総資産利益率）です。
      - 当期純利益を負債（総資産 − 自己資本 = 800）で割った値で、分母を誤っています。
      - 自己資本を総資産で割った自己資本比率（約 33 %）で、利益率ではありません。
    terms: [ROE, ROA, 自己資本比率]
    verify: { value: '60 / 400 * 100' }

