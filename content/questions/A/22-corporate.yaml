    q: 2 つの変数の相関係数についての記述として，適切なものはどれか。
    c:
      - 相関係数は −1 以上 1 以下の値をとり，−1 に近いほど，一方が増えると他方が減る直線的な関係が強い。
      - 相関係数が 0 であれば，2 つの変数の間には，どのような関係も存在しない。
      - 相関係数が 1 に近ければ，一方の変数が他方の変数の原因であるといえる。
      - 相関係数の値は，データの単位を変えると大きく変化する。
    a: ア
    exp: |
      相関係数は、2 つの変数の直線的な関係の強さを −1 から 1 までの値で表す指標です。1 に近いほど正の相関（一方が増えると他方も増える）、−1 に近いほど負の相関（一方が増えると他方が減る）が強く、0 に近いほど直線的な関係は弱くなります。単位を変えても値は変わりません。また、相関があっても因果関係があるとは限りません。
    why:
      - 正解です。−1 に近いほど負の相関が強くなります。
      - 相関係数が 0 でも、直線的でない（曲線的な）関係が存在することがあります。
      - 相関関係は因果関係を意味しません。第 3 の要因による見せかけの相関の場合もあります。
      - 相関係数は単位に依存しない指標で、単位を変えても値は変わりません。
    terms: [相関係数, 見せかけの相関]

