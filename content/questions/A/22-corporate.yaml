  - id: A22-020
    topic: 22-2-1-4
    diff: 2
    q: |
      表は，ある企業が検討している 4 つの戦略について，将来の市場の状況ごとに予想される利益（億円）を示したものである。マクシミン原理に従って戦略を選ぶとき，選ばれる戦略はどれか。

      | 戦略 | 好況 | 普通 | 不況 |
      | --- | --- | --- | --- |
      | A | 50 | 30 | -10 |
      | B | 40 | 25 | 10 |
      | C | 70 | 20 | -20 |
      | D | 25 | 15 | 5 |
    c: ['B', 'A', 'C', 'D']
    a: ア
    exp: |
      マクシミン原理は、各戦略で最も悪い場合（最小の利益）を比べ、その中で最も良い（最大の）戦略を選ぶ、悲観的な（安全を重視した）意思決定の基準です。
      - 各戦略の最小利益：A は −10、B は 10、C は −20、D は 5
      - その最大は B の 10
      よって戦略 B が選ばれます。なお、各戦略の最大利益の中で最大のものを選ぶマクシマックス原理では、最大利益が 70 の C が選ばれます。
    why:
      - 正解です。最小利益が最も大きいのは B（10 億円）です。
      - A の最小利益は −10 億円で、B の 10 億円より小さくなります。
      - C はマクシマックス原理（最大利益が最大）で選ばれる戦略です。最小利益は −20 億円です。
      - D の最小利益は 5 億円で、B の 10 億円より小さくなります。
    terms: [マクシミン原理, ゲーム理論]
    verify: { manual: '各戦略の最小値 A=-10, B=10, C=-20, D=5 を確認し、最大は B。マクシマックスは C(70)' }

  - id: A22-021
    topic: 22-2-1-4
