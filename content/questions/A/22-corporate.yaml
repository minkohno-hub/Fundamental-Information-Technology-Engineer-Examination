      - 営業活動の区分は、販売や仕入など本業の取引による資金の増減です。
      - 財務活動の区分は、借入れや株式の発行など資金調達に関する増減です。
      - フリーキャッシュフローは、営業活動と投資活動のキャッシュフローを合計した指標で、計算書の区分ではありません。
    terms: [キャッシュフロー計算書, フリーキャッシュフロー]

