  - id: A22-016
    topic: 22-2-1-1
    diff: 3
    q: |
      ある工場では製品 P と製品 Q を生産している。それぞれ 1 個当たりの利益，原料の使用量，機械の使用時間は表のとおりであり，1 日に使える原料は 100 kg，機械の使用時間は 80 時間までである。1 日の利益を最大にしたときの利益は何万円か。ここで，生産量は 0 以上の整数とする。

      | 製品 | 利益（万円/個） | 原料（kg/個） | 機械時間（時間/個） |
      | --- | --- | --- | --- |
      | P | 3 | 2 | 1 |
      | Q | 2 | 1 | 1 |
    c: ['180', '150', '160', '240']
    a: ア
    exp: |
      生産量を P が x 個、Q が y 個とすると、線形計画法の問題として次のように表せます。
      - 制約条件：2x + y ≦ 100（原料）、x + y ≦ 80（機械時間）、x ≧ 0、y ≧ 0
      - 目的関数：3x + 2y を最大化
      最適解は、実行可能領域の頂点のどれかにあります。
      - (x, y) = (0, 80)：利益 160 万円
      - (x, y) = (20, 60)：2 つの制約式の交点。利益 3×20 + 2×60 = 180 万円
      - (x, y) = (50, 0)：利益 150 万円
      よって、最大の利益は 180 万円です。
    why:
      - 正解です。2 つの制約の交点 (20, 60) で利益が最大になります。
      - 原料の制約だけを考えて P だけを 50 個生産した場合の利益です。
      - 機械時間の制約だけを考えて Q だけを 80 個生産した場合の利益です。
      - 機械時間の上限 80 個をすべて利益の大きい P にあてた場合の値ですが、原料が 160 kg 必要になり制約を満たしません。
    terms: [線形計画法]
    verify: { value: '(() => { let m = 0; for (let x = 0; x <= 100; x++) for (let y = 0; y <= 100; y++) if (2 * x + y <= 100 && x + y <= 80) m = max(m, 3 * x + 2 * y); return m; })()' }

