      - '1,000'
    a: ア
    exp: |
      先入先出法は、先に受け入れたものから先に払い出したとみなして払出単価を決める方法です。
      - 4/15 の払出 15 個：前月繰越の 10 個（@100）と 4/5 仕入分の 5 個（@130）
      - 4/25 の払出 15 個：4/5 仕入分の残り 15 個（@130）
      - 月末在庫：4/20 仕入分の 10 個（@160）= 1,600 円
    why:
      - 正解です。月末に残るのは最後に仕入れた 10 個（@160）です。
      - 1,360 円は移動平均法で評価した値（10 個 × @136）です。
      - 1,300 円は総平均法で評価した値（10 個 × @130）です。
      - 1,000 円は最初の前月繰越分（@100）が残っているとみなした値で、先入先出法とは逆の考え方です。
    terms: [先入先出法, 移動平均法, 総平均法, 棚卸資産評価]
    verify: { value: '(10 * 100 + 20 * 130 + 10 * 160) - (10 * 100 + 5 * 130) - 15 * 130' }

  - id: A22-042
    topic: 22-3-5
    diff: 3
    q: |
      ある材料の 5 月の受払いは次のとおりである。移動平均法で評価した場合，5 月末の在庫の評価額は何円か。
      - 5/1 前月繰越 20 個（単価 200 円）
      - 5/10 仕入 30 個（単価 250 円）
      - 5/12 払出 25 個
      - 5/20 仕入 20 個（単価 266 円）
      - 5/25 払出 15 個
    c:
      - '7,380'
      - '7,820'
      - '7,980'
      - '7,500'
    a: ア
    exp: |
      移動平均法は、仕入のたびに、そのときの在庫と仕入分を合わせた平均単価を計算し直して払出単価とする方法です。
      - 5/10 仕入後：（20 × 200 + 30 × 250）÷ 50 = 11,500 ÷ 50 = 230 円
      - 5/12 払出 25 個（@230）後の在庫：25 個、5,750 円
      - 5/20 仕入後：（5,750 + 20 × 266）÷ 45 = 11,070 ÷ 45 = 246 円
      - 5/25 払出 15 個（@246）後の在庫：30 個 × 246 = 7,380 円
    why:
      - 正解です。最後の平均単価 246 円で 30 個を評価します。
      - 7,820 円は先入先出法で評価した値（10 個 × @250 ＋ 20 個 × @266）です。
      - 7,980 円は在庫 30 個すべてを最後の仕入単価 266 円で評価した値です。
      - 7,500 円は在庫 30 個を 5/10 の仕入単価 250 円で評価した値です。
    terms: [移動平均法, 先入先出法, 棚卸資産評価]
    verify: { value: '((20 * 200 + 30 * 250) / 50 * 25 + 20 * 266) / 45 * 30' }

  - id: A22-043
    topic: 22-3-1-3
    diff: 1
    q: 財務諸表のうち，損益計算書の説明として，適切なものはどれか。
    c:
      - 一定期間の収益と費用を対比させて，その期間の経営成績（利益又は損失）を示す。
      - 一定時点の資産，負債，純資産の状態を示し，企業の財政状態を表す。
      - 一定期間の現金及び現金同等物の増減を，活動の区分ごとに示す。
      - 純資産のうち株主資本などの各項目の，一定期間の変動を示す。
    a: ア
    exp: |
      主な財務諸表は次のとおりです。
      - 損益計算書（P/L）：一定期間の収益と費用から、経営成績（利益）を示す
      - 貸借対照表（B/S）：期末などの一定時点の資産・負債・純資産から、財政状態を示す
      - キャッシュフロー計算書（C/F）：一定期間の資金の増減を、営業・投資・財務の活動別に示す
      - 株主資本等変動計算書：純資産の各項目の一定期間の変動を示す
    why:
      - 正解です。一定期間の経営成績を示すのが損益計算書です。
      - これは貸借対照表の説明です。
      - これはキャッシュフロー計算書の説明です。
      - これは株主資本等変動計算書の説明です。
    terms: [損益計算書, 貸借対照表, キャッシュフロー計算書, 財務諸表]

  - id: A22-044
    topic: 22-2-2-3
    diff: 2
    q: アンケート調査で，母集団を年代などの属性によっていくつかのグループに分け，各グループから無作為に標本を抽出する方法はどれか。
    c: ['層別抽出法', '単純無作為抽出法', '多段抽出法', '全数調査']
    a: ア
    exp: |
      層別抽出法（層化抽出法）は、母集団を性別や年代などの属性によって互いに重ならない層に分け、各層から無作為に標本を抽出する方法です。各層の特徴を反映した標本が得られ、母集団の推定の精度を高めやすくなります。
    why:
      - 正解です。属性ごとの層に分けてから各層で無作為に抽出します。
      - 単純無作為抽出法は、母集団を分けずに全体から無作為に抽出する方法です。
      - 多段抽出法は、まず地域などの集団を抽出し、その中からさらに抽出するというように、段階的に抽出する方法です。
      - 全数調査は、標本を抽出せずに母集団のすべてを調べる方法です（国勢調査など）。
    terms: [標本抽出, 母集団]

  - id: A22-045
    topic: 22-2-2-4
    diff: 2
    q: 箱ひげ図で表される情報として，適切なものはどれか。
    c:
      - データの最小値，第 1 四分位数，中央値，第 3 四分位数，最大値などによる分布のばらつき
      - 複数の評価項目のそれぞれの値を，放射状の軸上に表したもののバランス
      - 2 つの変数の値の組による，変数間の相関関係
      - 2 つのカテゴリ変数の組合せごとの度数
    a: ア
    exp: |
      箱ひげ図は、データを小さい順に並べたときの第 1 四分位数から第 3 四分位数までを箱で、中央値を箱の中の線で表し、箱から最小値・最大値までをひげで表したグラフです。データの散らばりや偏りを一目で把握でき、複数のグループの分布を比較するのに便利です。外れ値を点で区別して表すこともあります。
    why:
      - 正解です。四分位数などでデータの分布を表します。
      - これはレーダーチャートで表される情報です。
      - これは散布図で表される情報です。
      - これはクロス集計表（分割表）で表される情報です。
    terms: [箱ひげ図, レーダーチャート, 散布図, クロス集計表]

  - id: A22-046
    topic: 22-2-2-2
    diff: 2
    q: 小売店の購買履歴データを分析して，「商品 X を購入した顧客は商品 Y も同時に購入することが多い」といった，同時に購入されやすい商品の組合せを見つけ出す手法はどれか。
    c: ['アソシエーション分析', 'クラスタ分析法', '回帰分析', 'テキストマイニング']
    a: ア
    exp: |
      アソシエーション分析（バスケット分析）は、データの中から「X ならば Y」という関連性（相関ルール）を見つけ出すデータマイニングの手法です。購買データから同時に購入されやすい商品の組合せを見つけ、売場の配置やおすすめ商品の提示などに活用します。ルールの有効性は、支持度、信頼度、リフト値などの指標で評価します。
    why:
      - 正解です。同時に購入されやすい組合せのルールを見つけます。
      - クラスタ分析法は、似た性質をもつデータをグループに分ける手法で、商品の組合せのルールを求めるものではありません。
      - 回帰分析は、ある変数（目的変数）を他の変数（説明変数）で説明・予測する式を求める手法です。
      - テキストマイニングは、文章などのテキストデータから有用な情報を取り出す手法です。
    terms: [アソシエーション分析, クラスタ分析法, 回帰分析, テキストマイニング, データマイニング]
