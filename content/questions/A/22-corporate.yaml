    q: |
      新製品の販売計画として 3 つの案を検討している。市場の状況ごとの予想利益（万円）と，各状況になる確率は表のとおりである。期待値が最大となる案を選ぶとき，その案の利益の期待値は何万円か。

      | 案 | 好況（確率 0.3） | 普通（確率 0.5） | 不況（確率 0.2） |
      | --- | --- | --- | --- |
      | P | 100 | 40 | -50 |
      | Q | 60 | 50 | 10 |
      | R | 80 | 30 | 0 |
    c: ['45（案 Q）', '40（案 P）', '39（案 R）', '100（案 P）']
    a: ア
    exp: |
      各案の期待値は、「予想利益 × 確率」の合計です。
      - 案 P：100 × 0.3 + 40 × 0.5 + (−50) × 0.2 = 30 + 20 − 10 = 40 万円
      - 案 Q：60 × 0.3 + 50 × 0.5 + 10 × 0.2 = 18 + 25 + 2 = 45 万円
      - 案 R：80 × 0.3 + 30 × 0.5 + 0 × 0.2 = 24 + 15 + 0 = 39 万円
      期待値が最大となるのは案 Q で、45 万円です。
    why:
      - 正解です。案 Q の期待値 45 万円が最大です。
      - 案 P の期待値は 40 万円で、案 Q より小さくなります。
      - 案 R の期待値は 39 万円で、案 Q より小さくなります。
      - 100 万円は案 P の好況時の利益で、確率を考慮した期待値ではありません。
    terms: [期待値原理, ゲーム理論]
    verify: { value: 'max(100 * 0.3 + 40 * 0.5 - 50 * 0.2, 60 * 0.3 + 50 * 0.5 + 10 * 0.2, 80 * 0.3 + 30 * 0.5 + 0 * 0.2)' }

