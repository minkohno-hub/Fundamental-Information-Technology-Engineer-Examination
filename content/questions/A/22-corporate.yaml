    q: キャッシュフロー計算書で，生産設備を購入したことによる支出が記載される区分はどれか。
    c: ['投資活動によるキャッシュフロー', '営業活動によるキャッシュフロー', '財務活動によるキャッシュフロー', 'フリーキャッシュフロー']
    a: ア
    exp: |
      キャッシュフロー計算書は、一定期間の資金（現金及び現金同等物）の増減を、次の 3 つの活動に分けて示します。
      - 営業活動によるキャッシュフロー：商品の販売による収入、仕入や人件費の支出など、本業による資金の増減
      - 投資活動によるキャッシュフロー：設備などの固定資産や有価証券の取得・売却による資金の増減
      - 財務活動によるキャッシュフロー：借入れや返済、株式の発行、配当金の支払など、資金調達に関する増減
      生産設備の購入は固定資産の取得なので、投資活動によるキャッシュフローに記載されます。
