  - id: A22-018
    topic: 22-2-1-2
    diff: 2
    q: ある商品の年間需要量は 2,000 個，1 回当たりの発注費用は 4,000 円，1 個当たりの年間保管費用は 100 円である。経済的発注量（EOQ）は何個か。
    c: ['400', '283', '800', '200']
    a: ア
    exp: |
      経済的発注量（EOQ）は、発注費用と保管費用の合計（在庫総費用）が最小になる 1 回当たりの発注量で、次の式で求めます。
      EOQ = √（2 × 年間需要量 × 1 回当たりの発注費用 ÷ 1 個当たりの年間保管費用）
      = √（2 × 2,000 × 4,000 ÷ 100）= √160,000 = 400 個
      このとき、年間の発注費用（2,000 ÷ 400 × 4,000 = 20,000 円）と年間の保管費用（平均在庫 200 個 × 100 円 = 20,000 円）が等しくなります。
    why:
      - 正解です。√（2 × 2,000 × 4,000 ÷ 100）= 400 個です。
      - 式の 2 を掛け忘れて √80,000 ≒ 283 とした値です。
      - 経済的発注量の 2 倍の値です。このときは保管費用が発注費用より大きくなり、在庫総費用は最小になりません。
      - 400 個を 2 で割った平均在庫量にあたる値です。
    terms: [EOQ, 発注点]
    verify: { value: 'sqrt(2 * 2000 * 4000 / 100)' }

