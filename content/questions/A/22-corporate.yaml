questions:
  - id: A22-001
    topic: 22-1-3
    diff: 1
    q: 事業部制組織の説明として，適切なものはどれか。
    c:
      - 製品，地域，市場などの単位で事業部を設け，各事業部が生産や販売などの機能をもち，利益責任を負って独立的に運営する。
      - 製造，販売，経理などの業務の機能ごとに部門を編成する。
      - 職能別の部門と製品別の部門を組み合わせ，構成員が2つの部門に所属する。
      - 特定の課題を解決するために各部門から専門家を集めて編成し，課題が解決したら解散する。
    a: ア
    exp: |
      事業部制組織は、製品別・地域別・市場（顧客）別などに事業部を設け、各事業部に生産・販売などの必要な機能と権限を与えて、利益責任を負う独立した単位として運営させる組織形態です。市場の変化に迅速に対応でき、経営者の育成にもつながる一方、事業部間で機能や資源が重複しやすいという面があります。
    why:
      - 正解です。事業単位で編成し、事業部が利益責任を負います。
      - これは職能別組織（機能別組織）の説明です。
      - これはマトリックス組織の説明です。
      - これはプロジェクト組織の説明です。
    terms: [事業部制組織, 職能別組織, マトリックス組織, プロジェクト組織]

  - id: A22-002
    topic: 22-1-3
    diff: 2
    q: マトリックス組織の特徴として，適切なものはどれか。
    c:
      - 職能別の部門と事業別（プロジェクト別）の部門の両方に所属するので，命令系統が二重になり，指示が対立したときの調整が必要になる。
      - 命令系統が一本化されるので，構成員が受ける指示が対立することはない。
      - 社内の事業部門に資本金を配分し，独立した会社のように運営する。
      - 経営者から現場の担当者まで，ピラミッド型の階層で命令が伝わる。
    a: ア
    exp: |
      マトリックス組織は、職能別組織と事業部制組織（又はプロジェクト組織）を縦横に組み合わせた組織形態です。構成員は、例えば技術部門と製品 A 事業の両方に所属し、二人の上司の指示を受けます。専門性と事業への対応力を両立できる一方、命令系統が二重になるため、指示が対立したときの調整が難しく、責任の所在が曖昧になりやすいという課題があります。
    why:
      - 正解です。命令系統が二重になることが特徴です。
      - 命令系統が二重になるのがマトリックス組織の特徴で、一本化されるわけではありません。
      - これはカンパニー制組織の説明です。
      - これは階層型組織（ピラミッド型組織）の説明です。
    terms: [マトリックス組織, カンパニー制組織, 階層型組織]

  - id: A22-003
    topic: 22-1-3
    diff: 2
    q: カンパニー制組織の説明として，適切なものはどれか。
    c:
      - 社内の事業部門を独立した会社のようにみなし，資本金に相当する資産を配分して，投資などの権限と経営成果に対する責任を大きく委ねる。
      - 経営者を補佐する専門スタッフの部門を，業務を直接遂行する部門とは別に設ける。
      - 業務の機能ごとに部門を編成し，部門内の専門性を高める。
      - 複数の企業の株式を保有して支配し，グループ全体の経営戦略を立てることを主な業務とする。
    a: ア
    exp: |
      カンパニー制組織は、事業部制組織をさらに進めて、各事業部門を社内の独立した会社（カンパニー）とみなす組織形態です。事業部門に資本金に相当する資産を配分し、貸借対照表の責任も負わせるなど、事業部制よりも大きな権限と責任を与えて自律的に経営させます。法律上は1つの会社のままである点が、分社化とは異なります。
    why:
      - 正解です。事業部門を社内の独立した会社のように運営します。
      - これはラインアンドスタッフ組織の説明です。
      - これは職能別組織の説明です。
      - これは持株会社（純粋持株会社）の説明です。
    terms: [カンパニー制組織, ラインアンドスタッフ組織, 職能別組織]

  - id: A22-004
    topic: 22-1-3
    diff: 1
    q: CIO の役割として，最も適切なものはどれか。
    c:
      - 経営戦略に沿った情報戦略を立案し，情報システムへの投資や情報資源の活用について責任を負う。
      - 企業の資金調達や財務戦略について責任を負う。
      - 情報セキュリティ対策の統括について責任を負う。
      - 企業の経営全体について最終的な責任を負う。
    a: ア
    exp: |
      CIO（Chief Information Officer：最高情報責任者）は、経営戦略と整合した情報戦略や IT 投資計画を立案し、情報システムや情報資源の活用を全社的に統括する役員です。主な役職には、CEO（最高経営責任者）、CFO（最高財務責任者）、CISO（最高情報セキュリティ責任者）、CDO（最高デジタル責任者）、CPO（最高プライバシー責任者）などもあります。
    why:
      - 正解です。情報戦略の立案と情報資源の活用に責任を負います。
      - これは CFO（最高財務責任者）の役割です。
      - これは CISO（最高情報セキュリティ責任者）の役割です。
      - これは CEO（最高経営責任者）の役割です。
    terms: [CIO, CFO, CISO, CEO]

  - id: A22-005
    topic: 22-1-1-1
    diff: 1
    q: 企業の社会的責任（CSR）の考え方として，最も適切なものはどれか。
    c:
      - 企業は利益の追求だけでなく，環境への配慮，法令遵守，人権の尊重などを通じて，株主，従業員，顧客，地域社会などの利害関係者に対して責任を果たすべきである。
      - 企業の責任は，株主に対する配当を最大化することに限られる。
      - 社会貢献活動は，利益の出ている年度だけ行えばよい。
      - 法令に違反しなければ，社会的な批判を受ける行為であっても問題はない。
    a: ア
    exp: |
      CSR（Corporate Social Responsibility：企業の社会的責任）は、企業が社会の一員として、経済的な利益の追求だけでなく、環境保護、法令遵守、人権への配慮、地域社会への貢献などに取り組み、さまざまなステークホルダー（利害関係者）の期待に応えるべきだという考え方です。取組みは CSR 報告書や統合報告書などで公表されます。
    why:
      - 正解です。幅広い利害関係者に対する責任を果たすという考え方です。
      - CSR は株主だけでなく、従業員や地域社会など幅広い利害関係者への責任を求めます。
      - CSR は一時的な活動ではなく、継続的に経営に組み込むべきものとされています。
      - CSR では、法令遵守に加えて社会規範や倫理に沿った行動も求められます。
    terms: [CSR, ステークホルダー]

  - id: A22-006
    topic: 22-1-1-1
    diff: 1
    q: SDGs（持続可能な開発目標）の説明として，適切なものはどれか。
    c:
      - 2015 年の国連サミットで採択された，2030 年までに達成を目指す 17 のゴールからなる国際目標である。
      - 企業の財務情報だけをまとめて投資家に提供する報告書である。
      - 情報セキュリティマネジメントシステムに関する国際規格である。
      - 企業が災害時に重要な事業を継続するための計画である。
    a: ア
    exp: |
      SDGs（Sustainable Development Goals：持続可能な開発目標）は、2015 年 9 月の国連サミットで採択された「持続可能な開発のための 2030 アジェンダ」に記載された国際目標で、貧困、飢餓、教育、ジェンダー平等、気候変動などに関する 17 のゴールと 169 のターゲットから構成されています。企業も CSR やビジネスの機会として取組みが求められています。
    why:
      - 正解です。国連で採択された 17 のゴールからなる国際目標です。
      - 財務情報の報告書はアニュアルレポートなどで、SDGs ではありません。
      - 情報セキュリティマネジメントシステムの国際規格は ISO/IEC 27001 です。
      - 災害時に事業を継続するための計画は BCP（事業継続計画）です。
    terms: [SDGs, CSR, BCP]

  - id: A22-007
    topic: 22-1-1-3
    diff: 2
    q: コーポレートガバナンスの説明として，適切なものはどれか。
    c:
      - 株主などの利害関係者の立場から，経営者の業務執行が適正に行われているかを監視・規律する企業統治の仕組み
      - 企業が投資家に向けて，経営状況や財務状況などの情報を積極的に発信する活動
      - 企業の理念や特徴を，ロゴやデザインなどで社内外に統一的に示すこと
      - 企業が保有する情報資産を，脅威から守るための管理の仕組み
    a: ア
    exp: |
      コーポレートガバナンス（企業統治）は、企業の経営が株主をはじめとする利害関係者の利益に沿って公正かつ効率的に行われるよう、経営者を監視・規律する仕組みです。社外取締役の選任、監査役や委員会による監査、情報開示などが手段です。上場企業向けには、行動原則をまとめたコーポレートガバナンス・コードが定められています。
    why:
      - 正解です。経営者の業務執行を監視・規律する企業統治の仕組みです。
      - これは IR（Investor Relations）の説明です。
      - これはコーポレートアイデンティティ（CI）の説明です。
      - これは情報セキュリティマネジメントの説明です。
    terms: [コーポレートガバナンス, IR, コーポレートアイデンティティ]

  - id: A22-008
    topic: 22-1-1-3
    diff: 1
    q: 企業の IR（Investor Relations）活動の例として，適切なものはどれか。
    c:
      - 株主や投資家に向けて，決算説明会を開催し，経営戦略や業績の見通しを説明する。
      - 新製品の発売に合わせて，テレビ CM で消費者に宣伝する。
      - 従業員の能力を高めるため，社内で研修を行う。
      - 地域の清掃活動に従業員が参加する。
    a: ア
    exp: |
      IR（Investor Relations）は、企業が株主や投資家に対して、投資の判断に必要な経営方針、財務状況、業績の見通しなどの情報を、適時に公平に、継続して提供する活動です。決算説明会の開催、アニュアルレポートや統合報告書の発行、Web サイトでの情報開示などがあります。
    why:
      - 正解です。投資家に向けた情報提供なので IR 活動です。
      - 消費者に向けた宣伝は、広告・販売促進の活動です。
      - 社内研修は、人材育成（ヒューマンリソースマネジメント）の活動です。
      - 地域の清掃活動は、社会貢献（CSR）の活動です。
    terms: [IR, アニュアルレポート]

  - id: A22-009
    topic: 22-1-2-2
    diff: 1
    q: OJT（On the Job Training）の説明として，適切なものはどれか。
    c:
      - 職場で上司や先輩が，実際の業務を通じて部下に必要な知識や技能を指導する。
      - 職場を離れて，社内外の研修施設などで集合研修を受ける。
      - 学習者がインターネットを介して，自分のペースで教材を学習する。
      - 定期的に部署を異動させて，さまざまな業務を経験させる。
    a: ア
    exp: |
      OJT（On the Job Training）は、職場で実際の仕事をしながら、上司や先輩が部下に業務に必要な知識・技能・態度を計画的に指導する教育訓練の方法です。実務に直結した能力を身につけやすい反面、指導者の能力によって効果にばらつきが出やすい面もあります。職場を離れて行う研修は Off-JT（Off the Job Training）といいます。
    why:
      - 正解です。実際の業務を通じて指導するのが OJT です。
      - 職場を離れて行う集合研修は Off-JT です。
      - インターネットを使って学習するのは e-ラーニングです。
      - 計画的に部署を異動させるのはジョブローテーションです。
    terms: [OJT, e-ラーニング, ジョブローテーション]

  - id: A22-010
    topic: 22-1-2-2
    diff: 2
    q: 目標管理制度（MBO）の説明として，適切なものはどれか。
    c:
      - 組織の目標と関連付けて，従業員が上司と話し合いながら自ら目標を設定し，その達成度に基づいて評価を行う。
      - 従業員の能力や経歴などの情報を一元管理し，戦略的な配置や育成に活用する。
      - 成果を上げている人に共通する行動特性を明らかにし，評価や育成の基準とする。
      - 仕事と生活の調和を図り，両方を充実させる働き方を実現する。
    a: ア
    exp: |
      目標管理制度（MBO：Management By Objectives）は、組織全体の目標を踏まえて、従業員一人一人が上司と面談して自分の目標を設定し、期間終了後に達成度を自己評価・上司評価する人事管理の手法です。自ら目標を決めることで主体性や意欲を引き出すことを狙いとしています。
    why:
      - 正解です。自ら設定した目標の達成度で評価します。
      - これはタレントマネジメントの説明です。
      - これはコンピテンシーの説明です。
      - これはワークライフバランスの説明です。
    terms: [MBO, タレントマネジメント, コンピテンシー, ワークライフバランス]

  - id: A22-011
    topic: 22-1-2-2
    diff: 2
    q: タレントマネジメントの説明として，最も適切なものはどれか。
    c:
      - 従業員のスキル，経験，評価などの情報を一元的に管理・可視化し，経営戦略の実現に向けて，人材の採用，配置，育成などを戦略的に行う。
      - 芸能事務所が，所属タレントのスケジュールを管理する。
      - 優秀な人材が社外に流出しないよう，給与を一律に引き上げる。
      - 従業員の勤怠を記録し，給与を自動計算する。
    a: ア
    exp: |
      タレントマネジメントは、従業員一人一人の能力・スキル・経験・適性・評価などの情報を一元管理し、経営目標の達成のために、最適な人材配置、後継者の育成、採用計画などに活用する人材マネジメントの手法です。IT を活用した HR テックのシステムで実現されることが多くなっています。
    why:
      - 正解です。人材情報を活用して戦略的に人材を配置・育成します。
      - 経営学におけるタレントマネジメントは、従業員の才能（タレント）を活かす人材管理のことです。
      - 人材の流出を防ぐことをリテンションといいますが、一律の昇給はタレントマネジメントの説明ではありません。
      - 勤怠管理や給与計算は、人事・給与システムの機能です。
    terms: [タレントマネジメント, HRテック, リテンション]

  - id: A22-012
    topic: 22-1-2-2
    diff: 2
    q: 人材育成の手法であるコーチングの説明として，適切なものはどれか。
    c:
      - 対話を通じて相手に問いかけ，相手が自ら考えて答えや行動を見いだせるように支援する。
      - 経験豊富な先輩が，業務に限らずキャリアや人間関係なども含めて，後輩を長期的に支援・助言する。
      - 実際の事例を題材として，問題点や解決策をグループで討議する。
      - 学習者の理解度や進捗に応じて，学習内容を個別に変える。
    a: ア
    exp: |
      コーチングは、指導者が答えを教えるのではなく、傾聴や質問によって相手の考えを引き出し、相手が自ら目標を設定し、解決策を見つけて行動できるよう支援する人材育成の手法です。
    why:
      - 正解です。問いかけによって相手の自発的な解決を支援します。
      - これはメンタリングの説明です。
      - これはケーススタディの説明です。
      - これはアダプティブラーニングの説明です。
    terms: [コーチング, メンタリング, ケーススタディ, アダプティブラーニング]

  - id: A22-013
    topic: 22-1-2-4
    diff: 2
    q: BCP（事業継続計画）の策定において，業務が停止した場合の影響の大きさを評価し，優先して継続・復旧すべき重要業務や目標復旧時間を決めるために行う分析はどれか。
    c: ['事業影響度分析（BIA）', 'ABC 分析', 'SWOT 分析', 'ファンクションポイント法']
    a: ア
    exp: |
      事業影響度分析（BIA：Business Impact Analysis）は、災害などで業務が停止した場合に、事業や顧客、財務などにどのような影響がどの程度生じるかを分析・評価するものです。その結果を基に、優先して継続・復旧すべき重要業務を特定し、目標復旧時間（RTO）などを決めて BCP に反映します。BCP を策定・運用・改善していく継続的な管理を BCM（事業継続マネジメント）といいます。
    why:
      - 正解です。業務停止の影響を分析して重要業務と目標復旧時間を決めます。
      - ABC 分析は、売上高などの大きい順に品目を A・B・C に分けて重点管理する手法です。
      - SWOT 分析は、自社の強み・弱みと外部環境の機会・脅威を分析する経営戦略の手法です。
      - ファンクションポイント法は、ソフトウェアの機能の数や複雑さから開発規模を見積もる手法です。
    terms: [BIA, BCP, ABC分析]

  - id: A22-014
    topic: 22-1-2-3
    diff: 3
    q: ハーズバーグの動機付け・衛生理論（二要因理論）の説明として，適切なものはどれか。
    c:
      - 給与や作業条件などの衛生要因は，不足すると不満の原因になるが，満たしても積極的な動機付けにはつながりにくい。仕事の達成感や承認などの動機付け要因が満足感を高める。
      - 人間の欲求は，生理的欲求から自己実現欲求までの5段階の階層をなし，低次の欲求が満たされると高次の欲求が現れる。
