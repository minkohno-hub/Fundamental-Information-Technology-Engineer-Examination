    q: ある商品の月別の販売数は，1 月が 120 個，2 月が 150 個，3 月が 130 個，4 月が 140 個であった。直近 3 か月の単純移動平均法によって 5 月の販売数を予測すると何個か。
    c: ['140', '135', '133', '150']
    a: ア
    exp: |
      直近 3 か月の単純移動平均法では、予測する月の直前 3 か月の実績を平均した値を予測値とします。
      5 月の予測値 = （2 月 + 3 月 + 4 月）÷ 3 = （150 + 130 + 140）÷ 3 = 420 ÷ 3 = 140 個
    why:
      - 正解です。2 月〜4 月の平均は 140 個です。
      - 1 月〜4 月の 4 か月の平均（540 ÷ 4）で、直近 3 か月の平均ではありません。
