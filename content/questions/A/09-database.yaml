    diff: 2
    q: 表に対する権限を他の利用者に与える SQL 文はどれか。
    c:
      - COMMIT
      - GRANT
      - REVOKE
      - ROLLBACK
    a: イ
    exp: |
      GRANT 文は、表やビューに対する参照（SELECT）・挿入（INSERT）・更新（UPDATE）・削除（DELETE）などの権限を利用者に与える SQL 文です。例：GRANT SELECT ON 社員 TO user1
    why:
      - COMMIT はトランザクションの更新を確定する文です。
      - 正解です。権限を与えるのは GRANT です。
      - REVOKE は与えた権限を取り消す文です。
      - ROLLBACK はトランザクションの更新を取り消して元に戻す文です。
    terms:
      - SQL
  - id: A09-032
    topic: 9-4-1
    diff: 2
    q: データベースのロックについての説明として，適切なものはどれか。
    c:
      - ロックの単位（粒度）を大きくするほど，同時に実行できる処理が増える。
      - 専有ロックがかかったデータでも，他のトランザクションは自由に更新できる。
      - あるトランザクションが共有ロックをかけたデータには，他のトランザクションも共有ロックをかけて読み取れるが，専有ロックはかけられない。
      - 共有ロックは，データを更新するときにかける。
    a: ウ
    exp: |
      共有ロック（読取り用）は、複数のトランザクションが同時にかけられ、互いに読取りができますが、その間は更新のための専有ロックをかけられません。専有ロック（更新用）は、かけたトランザクション以外は共有ロックも専有ロックもかけられません。
    why:
      - ロックの粒度を大きくする（例えば表全体）と、ロックの管理は楽になりますが、待ちが増えて同時実行性は下がります。
      - 専有ロックがかかっている間は、他のトランザクションは読み書きできません。
      - 正解です。共有ロックどうしは両立し、専有ロックとは両立しません。
      - 更新するときにかけるのは専有ロックです。
    terms:
      - 排他制御
  - id: A09-033
    topic: 9-4-1
    diff: 2
    q: デッドロックの説明として，適切なものはどれか。
    c:
      - 2つ以上のトランザクションが，互いに相手がロックしている資源の解放を待ち続け，処理が進まなくなる状態
      - トランザクションが更新したデータを，他のトランザクションが上書きして更新内容が失われる状態
      - 障害でデータベースが停止し，再起動できなくなる状態
      - 大量のトランザクションで CPU の使用率が 100％ になる状態
    a: ア
    exp: |
      デッドロックは、例えばトランザクション T1 がデータ X をロックして Y を待ち、T2 が Y をロックして X を待つ、というように、互いに相手の資源の解放を待って永久に進まなくなる状態です。DBMS はデッドロックを検出すると、一方のトランザクションを取り消して（ロールバック）解消します。ロックをかける順序を全トランザクションで統一すると、発生を防げます。
    why:
      - 正解です。互いの資源の解放を待ち続ける状態です。
      - これは更新の消失（ロストアップデート）の説明で、排他制御で防ぎます。
      - 再起動不能な状態はデッドロックではありません。
      - CPU の高負荷はデッドロックとは別の現象です。
    terms:
      - デッドロック
      - 排他制御
  - id: A09-034
    topic: 9-4-2
    diff: 2
    q: データベースの障害回復で，ディスク障害が発生したときに，バックアップファイルを復元した後，更新後ログ（ジャーナル）を使ってバックアップ取得以降の更新を反映させる方法はどれか。
    c:
      - チェックポイント
      - ロールフォワード
      - ウォームスタート
      - ロールバック
    a: イ
    exp: |
      ロールフォワード（前進復帰）は、媒体の障害などでデータベースが失われたとき、バックアップを復元し、その後の更新を更新後ログで再実行して、障害直前のコミット済みの状態まで回復する方法です。
    why:
      - チェックポイントは、メモリ上の更新内容をディスクに書き出す時点のことで、回復処理の起点になります。
      - 正解です。バックアップに更新後ログを適用するのがロールフォワードです。
      - ウォームスタートは、システム障害の後、チェックポイントなどの情報を使ってシステムを再開することです。
      - ロールバック（後退復帰）は、更新前ログを使ってトランザクションの更新を取り消し、開始前の状態に戻す方法です。
    know: コミットされていないトランザクションはロールバックで取り消し、コミット済みでディスクに書き出されていない更新はロールフォワードで反映します。
    terms:
      - 障害回復
  - id: A09-035
    topic: 9-4-3
    diff: 2
    q: トランザクションの ACID 特性のうち，原子性（Atomicity）の説明として，適切なものはどれか。
    c:
      - 完了したトランザクションの結果は，障害が発生しても失われない。
      - 同時に実行される複数のトランザクションが，互いに影響を与えない。
      - トランザクションの処理は，すべて実行されるか，まったく実行されないかのどちらかになる。
      - トランザクションの実行前後で，データベースの内容に矛盾がない。
    a: ウ
    exp: |
      ACID 特性はトランザクションが満たすべき4つの性質です。
      - 原子性（Atomicity）：すべて実行されるか、まったく実行されないか（オールオアナッシング）
      - 一貫性（Consistency）：実行前後でデータに矛盾がない
      - 独立性（Isolation）：同時に実行しても互いに影響しない
      - 耐久性（Durability）：確定した結果は障害があっても失われない
      銀行の振替で「出金だけ行われて入金されない」ことがないのは、原子性によるものです。
    why:
      - これは耐久性（Durability）の説明です。
      - これは独立性（Isolation）の説明です。
      - 正解です。オールオアナッシングが原子性です。
      - これは一貫性（Consistency）の説明です。
    terms:
      - トランザクション
  - id: A09-036
    topic: 9-4-4
    diff: 2
    q: 関係データベースの表にインデックス（索引）を設定する効果と影響として，適切なものはどれか。
    c:
      - インデックスを設定すると，表のデータ量が半分になる。
      - インデックスを設定した列を条件とする検索は速くなるが，行の挿入・更新・削除のたびにインデックスも更新するため，更新処理の負荷は増える。
      - インデックスを設定すると，検索も更新もすべて速くなる。
      - インデックスは主キーの列にしか設定できない。
    a: イ
    exp: |
      インデックスは、本の索引のように、列の値からデータの格納位置をすばやく見つけるための仕組みです（B-tree インデックスなど）。条件に指定する列にインデックスがあると、全件を調べずに済むため検索が速くなります。一方で、データを変更するたびにインデックスも更新する必要があり、更新処理の負荷と記憶領域が増えます。
    why:
      - インデックスは追加の領域を使います。
      - 正解です。検索は速くなるが、更新の負荷が増えます。
      - 更新処理はむしろ遅くなります。
      - 主キー以外の列にもインデックスを設定できます。
    know: 値の種類が少ない列（性別など）にはビットマップインデックスが向いています。全文検索には、単語から文書を引く転置インデックスが使われます。
    terms:
      - インデックス
  - id: A09-037
    topic: 9-4-5
    diff: 2
    q: データベースのアクセス制御で，利用者に業務上必要な最小限の権限だけを与える目的として，最も適切なものはどれか。
    c:
      - データベースの検索速度を速くするため
      - データベースの記憶容量を減らすため
      - バックアップの取得を不要にするため
      - 誤操作や不正アクセス，アカウントの乗っ取りが起きたときの被害の範囲を小さくするため
    a: エ
    exp: |
      最小権限の原則に従い、例えば参照だけが必要な利用者には SELECT 権限だけを与え、更新や削除の権限は与えないようにします。これにより、操作ミスや不正、アカウントが乗っ取られた場合でも、影響の範囲を限定できます。
    why:
      - 権限の設定は検索速度とは関係ありません。
      - 権限の設定は記憶容量とは関係ありません。
      - 権限を絞ってもバックアップは必要です。
      - 正解です。被害の範囲を限定するためです。
    terms:
      - アクセス権
  - id: A09-038
    topic: 9-5-1
    diff: 2
    q: ETL の説明として，適切なものはどれか。
    c:
      - データベースの更新をトランザクション単位で即時に処理する方式
      - 複数のシステムからデータを抽出し，分析しやすい形に変換・加工して，データウェアハウスなどに格納する一連の処理
      - データベースの障害時に，ログを使って更新を取り消す処理
      - データベースの内容を暗号化して，盗難時の情報漏えいを防ぐ処理
    a: イ
    exp: |
      ETL は Extract（抽出）・Transform（変換）・Load（格納）の頭文字で、基幹システムなどからデータを取り出し、形式の統一や誤りの修正（データクレンジング）、集計などの変換を行ってから、データウェアハウスなどの分析用データベースに格納する処理です。先に格納してから変換する方式を ELT といいます。
    why:
      - これは OLTP（オンライントランザクション処理）の説明です。
      - 正解です。抽出・変換・格納の一連の処理です。
      - これはロールバックの説明です。
      - これはデータベースの暗号化の説明です。
    terms:
      - ETL
      - データウェアハウス
  - id: A09-039
    topic: 9-5-1
    diff: 1
    q: データクレンジングの説明として，適切なものはどれか。
    c:
      - 不要になったデータを完全に消去して，復元できないようにする。
      - データを暗号化して，第三者に読めないようにする。
      - データの表記の揺れ，重複，誤り，欠損などを見つけて修正し，データの品質を高める。
      - データを圧縮して，記憶容量を節約する。
    a: ウ
    exp: |
      データクレンジングは、データの中の誤り、重複、表記の揺れ（「株式会社」と「(株)」など）、欠損値などを見つけ出して修正・統一し、分析に使える品質の高いデータにする作業です。データ分析の精度は、元のデータの品質に大きく左右されます。
    why:
      - 復元できないように消去するのはデータの完全消去（データ消去）です。
      - 暗号化は機密性を守る手段です。
      - 正解です。データの品質を高める作業です。
      - 圧縮は記憶容量の節約の手段です。
    terms:
      - ETL
  - id: A09-040
    topic: 9-5-2
    diff: 3
    q: 分散データベースで，複数のサイトにまたがるトランザクションの整合性を保つために用いる2相コミットメントの説明として，適切なものはどれか。
    c:
      - 調整役のサイトが各サイトにコミットの準備ができたかを問い合わせ，すべてのサイトから準備完了の応答を得た場合だけコミットを指示し，1つでも失敗があれば全サイトでロールバックさせる。
      - 各サイトがそれぞれ独自の判断でコミットし，後から結果を照合する。
      - 1つのサイトだけを更新し，他のサイトには後でまとめて反映する。
      - 更新を2回繰り返して実行し，結果が一致すれば確定する。
    a: ア
    exp: |
      2相コミットメントは、第1相で調整役（コーディネーター）が全参加サイトにコミット可能かを問い合わせ（準備）、第2相で、全サイトが可能と答えたらコミット、1つでも不可ならロールバックを指示する方式です。これにより、一部のサイトだけが更新されて矛盾が生じるのを防ぎます。
    why:
      - 正解です。準備と確定の2段階で全サイトの結果をそろえます。
      - 各サイトが独自にコミットすると、一部だけが更新される矛盾が起こりえます。
      - これは非同期のレプリケーションに近い説明で、2相コミットメントではありません。
      - 更新を2回繰り返すことではありません。
    know: 分散データベースでは、データがどのサイトにあるかを利用者が意識しなくてよい「透過性」が求められます。複製を複数のサイトにもつことをレプリケーションといいます。
    terms:
      - 2相コミットメント
      - 分散データベース
  - id: A09-041
    topic: 9-5-3
    diff: 2
    q: データレイクの説明として，適切なものはどれか。
    c:
      - 構造化データだけでなく，画像やログなどの非構造化データも含めて，さまざまなデータを元の形式のまま大量に蓄積する保存場所
      - 分析目的に合わせて整理・統合したデータだけを，表形式で格納するデータベース
      - 業務処理のデータを即時に更新するためのデータベース
      - 特定の部門向けに，データウェアハウスから必要なデータだけを取り出したもの
    a: ア
    exp: |
      データレイクは、さまざまなシステムから集めたデータを、加工せずに元の形式のまま大量に蓄積しておく保存場所です。表形式の構造化データのほか、JSON や XML などの半構造化データ、画像・音声・文書などの非構造化データも扱えます。利用するときに目的に応じて加工します。
    why:
      - 正解です。多様なデータを元の形式のまま蓄積します。
      - これはデータウェアハウスの説明です。分析用に整理したデータを格納します。
      - これは業務系（OLTP 用）のデータベースの説明です。
      - これはデータマートの説明です。
    terms:
      - データレイク
      - データウェアハウス
  - id: A09-042
    topic: 9-5-3
    diff: 2
    q: 半構造化データに該当するものはどれか。
    c:
      - 関係データベースの表に格納された売上データ
      - スマートフォンで撮影した写真
      - 会議を録音した音声データ
      - JSON 形式で記述された Web API の応答データ
    a: エ
    exp: |
      半構造化データは、関係データベースの表のような厳密な構造はもたないものの、タグや名前と値の組などによって、ある程度の構造をもつデータです。JSON や XML、ログファイルなどが該当します。
    why:
      - 表に格納されたデータは、構造が厳密に決まっている構造化データです。
      - 写真は非構造化データです。
      - 音声は非構造化データです。
      - 正解です。JSON は名前と値の組で構造をもつ半構造化データです。
    terms:
      - データレイク
      - JSON
  - id: A09-043
    topic: 9-1-1-1
    diff: 2
    q: インメモリデータベースの特徴として，適切なものはどれか。
    c:
      - データを複数のサイトに分けて格納する。
      - データを主記憶上に保持して処理するため，ディスクへのアクセスが減り，高速に処理できる。
      - データを XML 文書の形式でそのまま格納する。
      - データをすべて磁気テープに格納するため，大容量だが処理は遅い。
    a: イ
    exp: |
      インメモリデータベースは、データを主記憶（メモリ）上に置いて処理するデータベースです。ディスクの読み書きを減らせるため非常に高速ですが、主記憶は電源が切れると内容が消えるため、ログやスナップショットをディスクに保存するなどの仕組みで耐久性を確保します。
    why:
      - これは分散データベースの説明です。
      - 正解です。主記憶上で処理するので高速です。
      - これは XML データベースの説明です。
      - 磁気テープに格納するデータベースではありません。
    terms:
      - 関係データベース
  - id: A09-044
    topic: 9-2-2-2
    diff: 2
    q: 関係データベースで，NULL についての説明として，適切なものはどれか。
    c:
      - 値が存在しない，または不明であることを表す特別な標識で，0 や空文字列とは異なる。
      - 主キーの列にも自由に設定できる。
      - NULL どうしを ＝ で比較すると，結果は必ず真になる。
      - 数値の 0 と同じ意味である。
    a: ア
    exp: |
      NULL は、値が未入力・不明・該当なしであることを表す特別な標識です。数値の 0 や長さ0の文字列とは異なります。NULL を含む比較は真でも偽でもない「不明」になるため、NULL かどうかの判定には「列名 IS NULL」を使います。
    why:
      - 正解です。値が存在しないことを表す標識で、0 とは異なります。
      - 主キーには NULL を設定できません。
      - NULL どうしの ＝ による比較は真になりません（不明になります）。IS NULL を使います。
      - NULL は 0 とは異なります。
    terms:
      - 主キー
  - id: A09-045
    topic: 9-4-2
    diff: 2
    q: データベースの障害回復で用いるチェックポイントの説明として，適切なものはどれか。
    c:
      - 主記憶上のバッファにある更新内容を，定期的にディスクのデータベースに書き出す時点で，障害回復の起点となる。
      - バックアップを取得した磁気テープを保管した時点である。
      - トランザクションが開始された時点である。
      - 利用者がデータベースにログインした時点である。
    a: ア
    exp: |
      DBMS は性能のため、更新内容をいったん主記憶上のバッファに置き、まとめてディスクに書き出します。チェックポイントは、バッファの内容をディスクに書き出して、ディスクとログの整合をとる時点です。システム障害の後は、チェックポイントの時点から回復処理を始めればよいため、回復時間を短縮できます。
    why:
      - 正解です。バッファの内容を書き出す時点で、回復の起点になります。
      - バックアップ媒体の保管はチェックポイントではありません。
      - トランザクションの開始はチェックポイントではありません。
      - ログインはチェックポイントとは関係ありません。
    terms:
      - 障害回復
