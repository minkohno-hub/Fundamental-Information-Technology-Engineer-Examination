  - id: A09-017
    topic: 9-3-2-1
    diff: 3
    q: 埋込み SQL で，SELECT 文の結果が複数行になるときに，結果を1行ずつ取り出して親言語のプログラムで処理するために用いるものはどれか。
    c:
      - ビュー
      - インデックス
      - トリガー
      - カーソル
    a: エ
    exp: |
      埋込み SQL は、C や COBOL などの親言語のプログラムの中に SQL 文を書く方式です。親言語は一般に1行ずつしかデータを扱えないため、複数行の結果を処理するときはカーソルを使います。DECLARE で問合せを定義し、OPEN で実行、FETCH で1行ずつ取り出し、CLOSE で終了します。
    why:
      - ビューは、表から必要な部分を取り出して定義した仮想的な表です。
      - インデックスは、検索を高速化するための索引です。
      - トリガーは、表への挿入・更新などをきっかけに自動で処理を実行する仕組みです。
      - 正解です。複数行の結果を1行ずつ扱うにはカーソルを使います。
    terms:
      - SQL
