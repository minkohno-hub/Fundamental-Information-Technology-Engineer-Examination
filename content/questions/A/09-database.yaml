      - 結合
      - 直積
      - 選択
    a: ア
    exp: |
      射影は、表から特定の列（属性）だけを取り出す演算で、SQL では SELECT 句に列名を指定することに相当します。選択は、条件に合う行だけを取り出す演算で、WHERE 句に相当します。
    why:
      - 正解です。列を取り出すのは射影です。
      - 結合は、共通の列の値をもとに2つの表を組み合わせる演算です。
      - 直積は、2つの表のすべての行の組合せを作る演算です。
      - 選択は、条件に合う行を取り出す演算です。
    terms:
      - 関係代数
