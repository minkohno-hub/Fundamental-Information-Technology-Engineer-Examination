    topic: 9-3-2-2
    diff: 2
    q: 社員表から，部門ごとの平均給与が 300000 以上である部門コードを求める SQL 文はどれか。
    attach: |
      〔社員表〕
      | 社員番号 | 氏名 | 部門コード | 給与 | 上司番号 |
      |---|---|---|---|---|
      | 101 | 佐藤 | D1 | 300000 | NULL |
      | 102 | 鈴木 | D1 | 250000 | 101 |
      | 103 | 高橋 | D2 | 400000 | NULL |
      | 104 | 田中 | D2 | 280000 | 103 |
      | 105 | 伊藤 | D3 | 220000 | NULL |
      | 106 | 渡辺 | D2 | 320000 | 103 |

      〔部門表〕
      | 部門コード | 部門名 |
      |---|---|
      | D1 | 営業 |
      | D2 | 開発 |
      | D3 | 総務 |
      | D4 | 企画 |
    c:
      - SELECT 部門コード FROM 社員 GROUP BY 部門コード HAVING MAX(給与) >= 300000
      - SELECT 部門コード FROM 社員 WHERE AVG(給与) >= 300000 GROUP BY 部門コード
      - SELECT 部門コード FROM 社員 GROUP BY 部門コード HAVING AVG(給与) >= 300000
      - SELECT 部門コード FROM 社員 WHERE 給与 >= 300000 GROUP BY 部門コード
    a: ウ
    exp: |
      グループ化した結果に対する条件は、WHERE 句ではなく HAVING 句に書きます。部門コードでグループ化し、各グループの平均給与 AVG(給与) が 300000 以上のものを HAVING 句で選びます。
      表の例では、D1 の平均は 275000、D2 は約 333333、D3 は 220000 なので、結果は D2 だけになります。
    why:
      - 最高給与が 300000 以上の部門が求まり、平均の条件になっていません（D1 と D2）。
      - WHERE 句は行を絞り込む段階で評価されるため、集約関数の AVG は使えず、エラーになります。
      - 正解です。グループごとの条件を HAVING 句で指定しています。
      - 給与が 300000 以上の行だけでグループ化しているので、平均ではなく「300000 以上の社員がいる部門」が求まります（D1 と D2）。
    know: SQL の評価順序は、FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY と考えると理解しやすくなります。
    terms:
      - SQL
    verify:
      sql:
        setup: |
          CREATE TABLE 部門 (部門コード TEXT PRIMARY KEY, 部門名 TEXT);
          CREATE TABLE 社員 (社員番号 INTEGER PRIMARY KEY, 氏名 TEXT, 部門コード TEXT, 給与 INTEGER, 上司番号 INTEGER);
          INSERT INTO 部門 VALUES ('D1','営業'),('D2','開発'),('D3','総務'),('D4','企画');
