    q: 部門表から，所属する社員が1人以上いる部門の部門名を，重複なく求める SQL 文はどれか。
    attach: |
      〔社員表〕
      | 社員番号 | 氏名 | 部門コード | 給与 | 上司番号 |
      |---|---|---|---|---|
      | 101 | 佐藤 | D1 | 300000 | NULL |
      | 102 | 鈴木 | D1 | 250000 | 101 |
      | 103 | 高橋 | D2 | 400000 | NULL |
      | 104 | 田中 | D2 | 280000 | 103 |
      | 105 | 伊藤 | D3 | 220000 | NULL |
      | 106 | 渡辺 | D2 | 320000 | 103 |

      〔部門表〕
      | 部門コード | 部門名 |
      |---|---|
      | D1 | 営業 |
      | D2 | 開発 |
      | D3 | 総務 |
      | D4 | 企画 |
    c:
      - SELECT 部門名 FROM 部門 WHERE EXISTS (SELECT * FROM 社員 WHERE 社員.部門コード = 部門.部門コード)
      - SELECT 部門名 FROM 部門, 社員 WHERE 部門.部門コード = 社員.部門コード
      - SELECT 部門名 FROM 部門 WHERE EXISTS (SELECT * FROM 社員)
      - SELECT 部門名 FROM 部門 WHERE NOT EXISTS (SELECT * FROM 社員 WHERE 社員.部門コード = 部門.部門コード)
    a: ア
    exp: |
      EXISTS は、副問合せの結果が1行以上あるときに真になります。副問合せの中で外側の表（部門）の列を参照する相関副問合せにすると、部門の各行について「その部門コードをもつ社員がいるか」を調べられます。結果は営業・開発・総務で、各部門名は1回ずつ現れます。
    why:
      - 正解です。相関副問合せで社員がいる部門を求めています。
      - 結合すると、社員の人数分だけ部門名が重複して現れます（開発が3回など）。
      - 副問合せが外側の部門と関係しないため、社員表が空でない限りすべての部門（企画を含む）が求まります。
      - NOT EXISTS なので、社員がいない部門（企画）が求まります。
    terms:
      - SQL
      - 副問合せ
    verify:
      sql:
        setup: |
          CREATE TABLE 部門 (部門コード TEXT PRIMARY KEY, 部門名 TEXT);
          CREATE TABLE 社員 (社員番号 INTEGER PRIMARY KEY, 氏名 TEXT, 部門コード TEXT, 給与 INTEGER, 上司番号 INTEGER);
          INSERT INTO 部門 VALUES ('D1','営業'),('D2','開発'),('D3','総務'),('D4','企画');
          INSERT INTO 社員 VALUES (101,'佐藤','D1',300000,NULL),(102,'鈴木','D1',250000,101),(103,'高橋','D2',400000,NULL),(104,'田中','D2',280000,103),(105,'伊藤','D3',220000,NULL),(106,'渡辺','D2',320000,103);
