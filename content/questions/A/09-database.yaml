    q: ビュー（VIEW）の説明として，適切なものはどれか。
    c:
      - 表に行が挿入されたときに，自動的に実行される処理である。
      - 表の検索を高速化するための索引である。
      - データを物理的に複製して，別の記憶装置に格納した表である。
      - 1つ以上の表から，SELECT 文で必要な列や行を取り出して定義した仮想的な表で，利用者に見せる範囲を限定するのにも使われる。
    a: エ
    exp: |
      ビューは、CREATE VIEW 文で SELECT 文を基に定義する仮想的な表です。ビュー自体はデータをもたず、参照するたびに元の表から結果を求めます。複雑な問合せを簡単に使えるようにしたり、特定の列だけを見せて機密性の高い列を隠したりするのに使います。
    why:
      - 挿入時に自動実行される処理はトリガーです。
      - 検索を高速化するのはインデックスです。
      - データを物理的に複製するのはレプリケーションなどです（実体化ビューは別の概念です）。
      - 正解です。SELECT 文で定義した仮想的な表です。
    terms:
      - SQL
  - id: A09-030
    topic: 9-3-2-2
    diff: 2
    q: 表に参照制約（外部キー制約）を設定したときの動作として，適切なものはどれか。
    c:
      - 参照先の表に存在しない値を，外部キーの列に挿入しようとするとエラーになる。
      - 外部キーの列は，自動的に主キーになる。
      - 外部キーの列に，負の値を格納できなくなる。
      - 外部キーの列には，同じ値を2回以上格納できない。
    a: ア
    exp: |
      参照制約は、外部キーの値が、参照先の表の主キー（または一意キー）に存在する値か NULL であることを保証する制約です。存在しない部門コードをもつ社員を登録しようとするとエラーになるため、データの整合性が保たれます。
    why:
      - 正解です。存在しない値の挿入を防ぎます。
      - 外部キーが主キーになるわけではありません。
      - 値の範囲を制限するのは検査制約（CHECK 制約）です。
      - 重複を禁止するのは一意性制約です。外部キーの値は重複できます（同じ部門に複数の社員）。
    terms:
      - 外部キー
      - 主キー
  - id: A09-031
