questions:
  - id: A09-001
    topic: 9-1-1-1
    diff: 2
    q: キーバリュー型データベース（キーバリューストア）の特徴として，適切なものはどれか。
    c:
      - データを親子関係の木構造で管理する。
      - 頂点と辺でデータ間の関係を表し，つながりをたどる検索を得意とする。
      - データを一意なキーと値の組で格納する単純な構造で，大量のデータの高速な読み書きや，サーバの追加による拡張に向く。
      - データを表形式で管理し，SQL による複雑な結合や問合せを得意とする。
    a: ウ
    exp: |
      キーバリュー型データベースは、キー（識別子）と値の組だけでデータを管理する NoSQL の一種です。構造が単純なため、キーを指定した読み書きが高速で、複数のサーバに分散して容量や処理能力を拡張しやすいのが特徴です。一方、複雑な条件での検索や結合は苦手です。
    why:
      - これは階層型データベースの特徴です。
      - これはグラフデータベースの特徴です。
      - 正解です。キーと値の組による単純な構造が特徴です。
      - これは関係データベース（RDB）の特徴です。
    know: NoSQL には、キーバリュー型のほか、JSON などの文書をそのまま格納するドキュメント指向型、列単位でデータを格納する列指向型、グラフ型などがあります。
    terms:
      - NoSQL
      - 関係データベース
  - id: A09-002
    topic: 9-1-1-1
    diff: 2
    q: グラフデータベースが特に適している用途はどれか。
    c:
      - 会計伝票を表形式で管理して，月次の集計を行う。
      - 1つの文書の内容を JSON 形式のまま保存する。
      - SNS の利用者どうしのつながりをたどって，「友達の友達」を探す。
      - 大量のログを時刻をキーとして格納し，順に読み出す。
    a: ウ
    exp: |
      グラフデータベースは、データを頂点（ノード）と、頂点どうしの関係を表す辺（エッジ）で管理します。関係をたどる検索が得意なため、SNS の人間関係、推薦システム（この商品を買った人はこれも買った）、経路探索などに適しています。
    why:
      - 表形式の集計は関係データベースが得意です。
      - JSON 文書の保存はドキュメント指向データベースが得意です。
      - 正解です。つながりをたどる検索はグラフデータベースが得意とします。
      - キーで格納・読出しするのはキーバリュー型が得意です。
    terms:
      - NoSQL
  - id: A09-003
    topic: 9-1-1-2
    diff: 2
    q: データベースの3層スキーマアーキテクチャにおいて，利用者やアプリケーションプログラムから見たデータの構造を定義するものはどれか。
    c:
      - 外部スキーマ
      - 概念スキーマ
      - 内部スキーマ
      - 関係スキーマ
    a: ア
    exp: |
      3層スキーマアーキテクチャは、データベースの構造を3つの層に分けて定義する考え方です。
      - 外部スキーマ：利用者やプログラムから見たデータの構造（ビューなど）
      - 概念スキーマ：データベース全体の論理的な構造（表の定義など）
      - 内部スキーマ：記憶装置上の物理的な格納方法（索引、ファイル構成など）
      層を分けることで、物理的な格納方法を変えても利用者側のプログラムを変えずに済む（データの独立性）などの利点があります。
    why:
      - 正解です。利用者から見た構造は外部スキーマです。
      - 概念スキーマはデータベース全体の論理構造です。
      - 内部スキーマは物理的な格納構造です。
      - 関係スキーマは、関係（表）の名前と属性の並びのことで、3層スキーマの層の名称ではありません。
    terms:
      - 3層スキーマ
  - id: A09-004
    topic: 9-1-1-3
    diff: 2
    q: データモデルのうち，データを親子関係の木構造で表し，子のデータは1つの親だけをもつものはどれか。
    c:
      - 関係モデル
      - オブジェクト指向モデル
      - ネットワークモデル（網モデル）
      - 階層モデル
    a: エ
    exp: |
      階層モデルは、データを親子関係の木構造で表すデータモデルで、1つの親が複数の子をもてますが、子は1つの親しかもてません。組織図のような構造を表すのに向いています。
    why:
      - 関係モデルは、データを表（関係）の形で表します。
      - オブジェクト指向モデルは、データとその操作をオブジェクトとして表します。
      - ネットワークモデルは、子が複数の親をもてる網目状の構造です。
      - 正解です。木構造で子が親を1つだけもつのは階層モデルです。
    terms:
      - データモデル
  - id: A09-005
    topic: 9-1-1-4
    diff: 1
    q: 関係モデルの用語と，関係データベースの表における一般的な呼び方の組合せとして，適切なものはどれか。
    c:
      - 関係は行，タプルは列，属性は表
      - 関係は表，タプルは行，属性は列
      - 関係は列，タプルは表，属性は行
      - 関係は表，タプルは列，属性は行
    a: イ
    exp: |
      関係モデルでは、表を関係（リレーション）、表の1行を組（タプル）、表の列を属性（アトリビュート）と呼びます。属性がとりうる値の集合を定義域（ドメイン）といいます。
    why:
      - 対応が誤っています。
      - 正解です。関係＝表、タプル＝行、属性＝列です。
      - 対応が誤っています。
      - タプルは行、属性は列です。
    terms:
      - 関係データベース
  - id: A09-006
    topic: 9-1-2
    diff: 2
    q: DBMS の機能のうち，複数の利用者が同時に同じデータを更新しても，データの矛盾が生じないように制御する機能はどれか。
    c:
      - 同時実行制御（排他制御）
      - データ機密保護機能
      - データベース定義機能
      - 障害回復機能
    a: ア
    exp: |
      同時実行制御（排他制御）は、複数のトランザクションが同じデータに同時にアクセスするときに、ロックなどを使って処理の順序を制御し、更新の消失などの矛盾を防ぐ機能です。
    why:
      - 正解です。同時更新による矛盾を防ぐのは同時実行制御です。
      - データ機密保護機能は、権限のない利用者がデータにアクセスできないようにする機能です。
      - データベース定義機能は、表などの構造（スキーマ）を定義する機能です。
      - 障害回復機能は、障害が発生したときにデータベースを正しい状態に戻す機能です。
    terms:
      - DBMS
      - 排他制御
  - id: A09-007
    topic: 9-2-1
    diff: 2
    q: データディクショナリの説明として，適切なものはどれか。
    c:
      - 利用者が SQL を入力するための画面
      - データベースで扱うデータの名称・意味・型・桁数などの定義情報（メタデータ）を一元的に管理するもの
      - データベースの内容を別の媒体に複製したもの
      - データベースの更新の履歴を時系列に記録したファイル
    a: イ
    exp: |
      データディクショナリ（データ辞書）は、データベースに格納されるデータそのものではなく、データの名称、意味、型、長さ、関連する表などの「データに関するデータ（メタデータ）」を管理するものです。開発者の間でデータの定義を統一し、重複や不整合を防ぐのに役立ちます。
    why:
      - SQL を入力する画面はデータディクショナリではありません。
      - 正解です。メタデータを一元管理するものです。
      - 複製したものはバックアップです。
      - 更新の履歴を記録したものはログファイル（ジャーナルファイル）です。
    terms:
      - データディクショナリ
  - id: A09-008
    topic: 9-2-2-1
    diff: 2
    q: E-R 図で，「1人の顧客は複数の注文を行い，1件の注文は必ず1人の顧客が行う」という関係を表すとき，顧客と注文の間のリレーションシップ（多重度）はどれか。
    c:
      - 1対多
      - 1対1
      - 多対多
      - 多対1（顧客が多）
    a: ア
    exp: |
      1人の顧客に複数の注文が対応し、1件の注文には1人の顧客が対応するので、顧客と注文は「1対多」の関係です。関係データベースでは、多の側（注文）の表に、1の側（顧客）の主キーを外部キーとしてもたせて表します。
    why:
      - 正解です。顧客1に対して注文が多です。
      - 1対1になるのは、1人の顧客が1件しか注文できない場合です。
      - 多対多になるのは、1件の注文を複数の顧客が行えるような場合です。
      - 向きが逆です。1件の注文に対応する顧客は1人です。
    know: 多対多の関係は、関係データベースではそのままでは表せないため、両方の主キーを組み合わせた連関エンティティ（中間の表）を作って、2つの1対多の関係に分解します。
    terms:
      - E-R図
  - id: A09-009
    topic: 9-2-2-1
    diff: 2
    q: 「1人の学生は複数の科目を履修でき，1つの科目は複数の学生が履修する」という多対多の関係を関係データベースで表現する方法として，適切なものはどれか。
    c:
      - 学生表と科目表を1つの表にまとめ，すべての組合せを行として格納する。
      - 学生番号と科目番号を組み合わせた主キーをもつ「履修」表を作り，学生表・科目表とそれぞれ1対多の関係にする。
      - 科目表に，履修する学生の番号をカンマで区切って1つの列に格納する。
      - 学生表に，履修する科目番号を入れる列を科目の数だけ用意する。
    a: イ
    exp: |
      多対多の関係は、両方の主キーを組み合わせた主キーをもつ連関エンティティ（ここでは「履修」表）を作り、「学生 1対多 履修」「科目 1対多 履修」の2つの1対多の関係に分解して表します。履修表には、成績など履修そのものの属性ももたせられます。
    why:
      - 1つにまとめると、学生や科目の情報が重複し、更新時の矛盾が起きやすくなります。
      - 正解です。連関エンティティで2つの1対多に分解します。
      - 1つの列に複数の値を入れると、第1正規形を満たさず、検索や更新が困難になります。
      - 列を科目数だけ用意すると、繰返し項目になり第1正規形を満たさず、科目数の変化にも対応できません。
    terms:
      - E-R図
      - 正規化
  - id: A09-010
    topic: 9-2-2-2
    diff: 1
    q: 関係データベースの主キーの性質として，適切なものはどれか。
    c:
      - 主キーは必ず1つの列で構成しなければならない。
      - 主キーには NULL を設定できるが，重複は許されない。
      - 主キーの値は表の中で重複してもよい。
      - 主キーの値で表の行を一意に識別でき，主キーを構成する列には NULL を設定できない。
    a: エ
    exp: |
      主キーは、表の行を一意に識別するための列（または列の組合せ）です。主キーには一意性制約（値が重複しない）と非 NULL 制約（値が空でない）が課されます。複数の列を組み合わせた主キー（複合キー）も使えます。
    why:
      - 複数の列で構成する複合キーも主キーにできます。
      - 主キーには NULL を設定できません。
      - 重複を許すと行を識別できません。
      - 正解です。一意で、NULL を許さないのが主キーです。
    know: 他の表の主キーを参照する列を外部キーといい、参照先に存在しない値を入れられないようにする制約を参照制約といいます。
    terms:
      - 主キー
      - 外部キー
  - id: A09-011
    topic: 9-2-3
    diff: 2
    q: 第1正規形の条件として，適切なものはどれか。
    c:
      - 主キー以外の属性が，主キー以外の属性に関数従属していない。
      - すべての属性の値が単一の値（それ以上分解できない値）であり，繰返し項目を含まない。
      - 主キー以外の属性が，主キーの一部に関数従属していない。
      - すべての表が1つの列だけで構成されている。
    a: イ
    exp: |
      第1正規形は、表のすべての属性の値が単一の値（原子値）で、1つの行の中に同じ種類の項目が繰り返されていない状態です。例えば「電話番号」の欄に複数の番号を並べて入れている場合は、第1正規形ではありません。
    why:
      - これは第3正規形の条件（推移関数従属の排除）です。
      - 正解です。繰返し項目を排除した状態が第1正規形です。
      - これは第2正規形の条件（部分関数従属の排除）です。
      - 列の数は正規形の条件ではありません。
    terms:
      - 正規化
  - id: A09-012
    topic: 9-2-3
    diff: 3
    q: |
      次の表は第1正規形である。主キーは｛受注番号，商品番号｝である。この表を第2正規形にするときの分解として，適切なものはどれか。
      受注明細（受注番号，商品番号，受注日，商品名，数量）
      ここで，受注日は受注番号だけで決まり，商品名は商品番号だけで決まり，数量は受注番号と商品番号の組で決まる。
    c:
      - 受注（受注番号，受注日），商品（商品番号，商品名），受注明細（受注番号，商品番号，数量）
      - 受注（受注番号，商品番号，受注日，商品名，数量）のまま分解しない
      - 受注明細（受注番号，商品番号，受注日，数量），商品（商品名）
      - 受注（受注番号，受注日，商品名），受注明細（受注番号，商品番号，数量）
    a: ア
    exp: |
      第2正規形は、第1正規形で、かつ主キー以外の属性がすべて主キー全体に完全関数従属している（主キーの一部だけで決まる属性がない）状態です。
      この表では、受注日は受注番号（主キーの一部）だけで決まり、商品名は商品番号（主キーの一部）だけで決まるので、部分関数従属があります。これらを別の表に分けると、
      受注（受注番号，受注日）、商品（商品番号，商品名）、受注明細（受注番号，商品番号，数量）
      となり、すべての非キー属性が主キー全体に従属します。
    why:
      - 正解です。部分関数従属する属性を、それぞれ決定する属性を主キーとする表に分けています。
      - 部分関数従属が残っているので第2正規形ではありません。
      - 受注日が主キーの一部（受注番号）に従属したままで、商品表にも主キーがありません。
      - 商品名は受注番号ではなく商品番号で決まるので、受注表に入れるのは誤りです。
    know: 第3正規形は、さらに非キー属性が他の非キー属性に従属する推移関数従属を取り除いた状態です。正規化により、データの重複と更新時の矛盾（更新時異状）を防げます。
    terms:
      - 正規化
      - 関数従属
  - id: A09-013
    topic: 9-2-3
    diff: 2
    q: |
      第2正規形の表 社員（社員番号，氏名，部門コード，部門名）がある。主キーは社員番号で，部門名は部門コードによって決まる。この表が第3正規形でない理由として，適切なものはどれか。
    c:
      - 主キーが複数の列で構成されていないから
      - 部門名が，主キーではない部門コードを介して社員番号に推移的に関数従属しているから
      - 氏名が主キーの一部に部分関数従属しているから
      - 1つの行に繰返し項目があるから
    a: イ
    exp: |
      社員番号 → 部門コード → 部門名 という関係があり、部門名は主キーではない部門コードを介して主キーに従属しています（推移関数従属）。このままでは、同じ部門の社員の数だけ部門名が重複して記録され、部門名を変更するときに一部の行だけ更新して矛盾が生じるおそれがあります。
      社員（社員番号，氏名，部門コード）と部門（部門コード，部門名）に分けると第3正規形になります。
    why:
      - 主キーが1列であることは正規形の条件とは関係ありません。
      - 正解です。推移関数従属があるため第3正規形ではありません。
      - 主キーは社員番号の1列なので、部分関数従属は起こりえません。
      - 繰返し項目はありません（第1正規形を満たしています）。
    terms:
      - 正規化
      - 関数従属
  - id: A09-014
    topic: 9-2-4
    diff: 2
    q: 1件 200 バイトのレコードを 100,000 件格納する表がある。格納領域の使用率を 80％ にとどめる設計とするとき，必要な領域は何 M バイトか。ここで，1M バイト＝10⁶ バイトとし，管理用の領域などは考えないものとする。
    c:
      - '25'
      - '24'
      - '16'
      - '20'
    a: ア
    exp: |
      データ量は 200 バイト×100,000 件＝20,000,000 バイト＝20M バイトです。
      これが領域の 80％ を占めるようにするので、必要な領域は 20÷0.8＝25M バイトです。
    why:
      - 正解です。20÷0.8＝25M バイトです。
      - 24 は 20 に 20％ 分（4M バイト）を足した値で、計算方法の誤りです。
      - 16 はデータ量に 0.8 を掛けた誤りです。
      - 20 はデータ量そのもので、使用率を考慮していません。
