category: '11'
batch: H2
reviewed:
  at: '2026-10-30'
  method: 独立レビュー担当が解答を伏せて全問を自力解答し、正答の一意性・誤答の検証と既存問題との重複確認を実施
questions:
  - id: A11-515
    topic: 11-1-7
    diff: 3
    scope: 11-1-7 ブロック暗号の利用モード （CBC モード）。暗号文の1ブロックの伝送誤りが、復号結果のどの範囲に影響するかを判断する問題
    prereq: CBC モードでは、各ブロックの暗号化に1つ前の暗号文ブロックを使い、復号では当該ブロックの復号結果と1つ前の暗号文ブロックの排他的論理和を取ること
    hard: 誤りの影響が「そのブロックだけ」でも「以降の全ブロック」でもなく、当該ブロックと次のブロックの2ブロックに及ぶことを、復号の仕組みから導く必要がある。
    q: |
      ブロック暗号を CBC モードで使用して通信を行ったところ、伝送中に暗号文の第 3 ブロックにビット誤りが生じた。受信側で復号したとき、平文に誤りが生じるのはどのブロックか。ここで、暗号文は全部で 6 ブロックから成り、誤りは第 3 ブロックだけに生じたものとする。
    c:
      - 第 3 ブロックから第 6 ブロックまでの全て
      - 第 3 ブロックだけ
      - 第 3 ブロックと第 4 ブロック
      - 第 4 ブロックだけ
    a: ウ
    exp: |
      CBC モードの復号では、平文ブロックは「そのブロックを復号した結果」と「1 つ前の暗号文ブロック」の排他的論理和で得られます。
      - 第 3 ブロック： 暗号文自体に誤りがあるため、復号結果が大きく壊れます
      - 第 4 ブロック： 復号結果は正しいものの、前の暗号文ブロック（誤りのある第 3 ブロック）との排他的論理和を取るため、誤りが伝播します
      - 第 5 ブロック以降： 前の暗号文ブロック（第 4 ブロック）は正しいため、影響は及びません
      したがって、誤りが生じるのは第 3 ブロックと第 4 ブロックです。
    why:
      - 以降全てに広がるのは、誤りが連鎖し続ける場合の性質です。第 5 ブロックは正しい第 4 ブロックを相手にするため、影響は止まります。
      - 誤りが当該ブロックに閉じるのは、ブロックを独立に暗号化する ECB モードの性質です。CBC では次のブロックにも伝わります。
      - 正解です。当該ブロックの復号結果と、次ブロックでの排他的論理和の相手として、2 ブロックに影響します。
      - 第 4 ブロックにも影響はありますが、第 3 ブロック自体の復号結果も壊れます。
    know: CBC モードの誤り伝播は「壊れたブロックの復号結果」と「次のブロックへの排他的論理和の伝播」の2か所に限られる。この性質は、モードごとに異なる誤りの広がり方を理解する手がかりになる。
    terms:
      - CBCモード
      - ブロック暗号
      - 暗号利用モード
    verify:
      manual: CBC の復号式 （平文 ＝ 復号結果 XOR 前の暗号文）を各ブロックに適用し、誤りのある暗号文ブロックが関与するのが第 3 ブロック自身の復号と第 4 ブロックの排他的論理和だけであることを確認した。
  - id: A11-516
    topic: 11-1-7
    diff: 4
    scope: 11-1-7 ストリーム暗号における鍵ストリームの使い回しの危険。同じ鍵ストリームで2つの平文を暗号化したとき、暗号文同士の排他的論理和から平文同士の排他的論理和が得られてしまうことの判断
    prereq: ストリーム暗号は平文と鍵ストリームの排他的論理和で暗号文を作ること、同じ鍵ストリームを引くと打ち消し合うこと
    hard: 式の変形 （暗号文1 XOR 暗号文2 ＝ 平文1 XOR 平文2）を追い、片方の平文が知られると他方も復元できるという結論まで導く必要がある。
    q: |
      ストリーム暗号で、平文 P1 を鍵ストリーム K との排他的論理和によって暗号化し、暗号文 C1 を得た。別の機会に、平文 P2 を同じ鍵ストリーム K で暗号化し、暗号文 C2 を得た。攻撃者が C1 と C2 を入手した場合にいえることとして、正しいものはどれか。
    c:
      - 鍵ストリームそのものが直接復元できるので、その後の通信も全て解読できる
      - 排他的論理和を取っても意味のある情報は得られず、安全性に問題はない
      - C1 と C2 の排他的論理和を取ると、P1 と P2 の排他的論理和が得られ、P1 が知られれば P2 も復元できる
      - C1 と C2 の排他的論理和を取ると、鍵ストリーム K が得られる
    a: ウ
    exp: |
      式で追います。C1 ＝ P1 XOR K、C2 ＝ P2 XOR K なので、

      C1 XOR C2 ＝ (P1 XOR K) XOR (P2 XOR K) ＝ P1 XOR P2

      鍵ストリーム K は打ち消し合って消えます。つまり、暗号文同士の排他的論理和から、平文同士の排他的論理和が得られます。ここで P1 が既知の文（定型文など）であれば、P2 ＝ （P1 XOR P2) XOR P1 として P2 を復元できます。これが、鍵 （鍵ストリーム）を使い回してはならない理由です。なお、この計算で K そのものは得られません。
    why:
      - 得られるのは平文同士の排他的論理和であり、鍵ストリームそのものではありません。
      - 平文の冗長性 （文章のパターン）を利用した解析が可能になるため、安全性に重大な問題があります。
      - 正解です。鍵ストリームは打ち消され、平文同士の排他的論理和が得られます。片方が知られれば他方も復元できます。
      - 排他的論理和で得られるのは P1 XOR P2 であり、K は消えてしまいます。
    know: ストリーム暗号の安全性は、鍵ストリームを二度と使い回さないことに依存する。使い回すと鍵が打ち消し合い、平文同士の関係が直接漏れる。これはワンタイムパッドが「一度きり」を条件とする理由でもある。
    terms:
      - ストリーム暗号
      - 鍵ストリーム
      - 排他的論理和
    verify:
      manual: C1 ＝ P1 XOR K、C2 ＝ P2 XOR K から C1 XOR C2 を計算し、K が打ち消されて P1 XOR P2 が得られること、K 自体は得られないこと、P1 が既知なら P2 が復元できることを式の変形で確認した。
  - id: A11-517
    topic: 11-1-8-1
    diff: 3
    scope: 11-1-8-1 チャレンジレスポンス認証。サーバが毎回異なるランダムな値（チャレンジ）を送ることで、盗聴された応答の再利用（リプレイ攻撃）を防ぐ仕組みの判断
    prereq: 応答はチャレンジと秘密情報から計算されるため、チャレンジが毎回変われば過去の応答は再利用できないこと
    hard: 「暗号化しているから安全」という理解ではなく、応答が毎回変わること自体が再利用を防ぐ仕組みである点を見抜く必要がある。固定のパスワード送信との対比も問われる。
    q: |
      あるシステムでは、ログインの際にサーバがランダムな値（チャレンジ）をクライアントに送り、クライアントは利用者の秘密情報とチャレンジから計算した応答を返す。サーバは、同じ計算で得られる値と応答が一致すれば認証する。この方式が、通信を盗聴した攻撃者による成り済ましを防げる理由として、正しいものはどれか。
    c:
      - チャレンジの値が大きいため、攻撃者が応答を総当たりで探すのに時間がかかる
      - チャレンジがログインのたびに変わるため、盗聴した過去の応答を送っても、別のチャレンジに対する応答にはならず受け付けられない
      - 応答の計算に暗号を使っているため、盗聴しても内容を読み取ることができない
      - ランダムな値を送ることで、通信経路そのものが暗号化される
    a: イ
    exp: |
      この方式はチャレンジレスポンス認証です。応答は、その回のチャレンジと秘密情報の両方から計算されるため、同じ利用者でもログインのたびに応答は異なります。攻撃者が過去の応答を盗聴して再送しても、サーバが今回送ったチャレンジとは対応しないため、認証は成立しません。これが、固定のパスワードをそのまま送る方式（盗聴されたパスワードを再利用できる）との決定的な違いです。
    why:
      - 総当たりへの耐性は主眼ではなく、再利用できないことが本質です。
      - 正解です。チャレンジの一回性が、盗聴した応答の再利用（リプレイ攻撃）を防ぎます。
      - 読み取れないこと自体は秘密の保持に役立ちますが、再送を防ぐ理由は応答が毎回変わることです。固定の暗号文でも、再送できれば成り済ませてしまいます。
      - チャレンジを送ること自体は、経路の暗号化とは別の仕組みです。
    know: チャレンジレスポンス認証の本質は「新鮮さ」の保証であり、応答がその場限りの値になることでリプレイ攻撃を防ぐ。暗号化による秘匿とは別の効果である点を区別することが要点である。
    terms:
      - チャレンジレスポンス認証
      - リプレイ攻撃
    verify:
      manual: 認証の成立条件（今回のチャレンジと秘密情報から計算した値との一致）と盗聴した応答の再送を照合し、チャレンジが変わる以上は過去の応答が一致し得ないこと、秘匿や総当たり耐性は別の性質であることを確認した。
  - id: A11-518
    topic: 11-1-8-3
    diff: 3
    scope: 11-1-8-3 生体認証の本人拒否率の改善。閾値を変えず（他人受入率を上げず）に、登録データの品質改善によって本人拒否を減らす対策の判断
    prereq: 本人拒否の多くは、登録した生体情報の品質や、照合時の指先の状態に左右されること、閾値を下げる対策は他人受入率の上昇と引き換えになること
    hard: 「閾値を下げれば解決する」という対策が他人受入率を上げて安全性を損なうことを見抜き、判定基準ではなく登録データ側を改善する対策を選ぶ必要がある。
    q: |
      指紋認証を導入した職場で、本人であるのに認証が通らない（本人拒否）ケースが多発し、業務に支障が出ている。他人受入率を上げることなく、この問題を改善する対策として、適切なものはどれか。
    c:
      - 登録した指紋の品質が低い利用者に、指先の状態が良いときに指紋を登録し直してもらう
      - 本人拒否が続いた利用者は、指紋の照合を省略して入室できるようにする
      - 認証に失敗した記録を残さないようにし、問題が表面化しないようにする
      - 照合の類似度の閾値を下げ、より低い類似度でも受け入れるようにする
    a: ア
    exp: |
      閾値を下げれば本人は通りやすくなりますが、同時に他人も通りやすくなり、他人受入率が上がって安全性が下がります。本人拒否の多くは、登録時の指紋の品質（かすれや乾燥、傷など）や、照合時の状態に起因します。状態の良いときに品質の高い指紋を登録し直すと、本人の照合の類似度が安定して高くなり、閾値を変えずに本人拒否率を下げることができます。センサの清掃や、複数の指の登録も、同じ方向の対策です。
    why:
      - 正解です。登録データの品質を上げることで、判定基準（閾値）を変えずに、本人の類似度を安定させられます。
      - 照合を省略すれば、本人以外も通れるようになり、認証の意味が失われます。
      - 記録を残さないことは、問題の改善ではなく隠蔽であり、本人拒否は減りません。
      - 閾値を下げると、他人受入率も上がります。「他人受入率を上げない」という条件に反します。
    know: 生体認証の運用では、誤り率の調整は閾値だけではない。登録データの品質は本人拒否率を大きく左右するため、登録のし直しや複数指の登録は、安全性を保ったまま利便性を上げる現実的な対策である。
    terms:
      - 生体認証
      - 本人拒否率
      - 他人受入率
    verify:
      manual: 本人拒否の主因（登録データの品質と照合時の状態）と各対策を照合し、閾値を変えない対策だけが他人受入率に影響しないこと、照合の省略や記録の隠蔽は対策にならないことを確認した。
  - id: A11-519
    topic: 11-1-7
    diff: 3
    scope: 11-1-7 暗号鍵の管理におけるデュアルコントロール。鍵の生成や使用を単独の管理者が完結できないようにする運用の判断
    prereq: 重要な鍵の操作は、複数の管理者の立会いや分割された情報の組合せを必須とすることで、単独の不正や誤操作を防ぐこと
    hard: バックアップや複製といった可用性の施策と、不正防止のための権限の分割という目的の異なる施策を区別し、単独完結を不可能にする仕組みを選ぶ必要がある。
    q: |
      重要な暗号鍵を管理するシステムで、鍵の生成と復旧の操作を、特定の管理者 1 人だけでは決して実行できないようにしたい。運用の仕組みとして、最も適切なものはどれか。
    c:
      - 鍵の控えを、耐火金庫に 1 人の管理者の責任で保管する
      - 管理者のパスワードを長くし、定期的に変更する運用にする
      - 鍵の操作を行った管理者が、作業後に報告書を提出する運用にする
      - 鍵の操作に必要な情報を複数に分割して別の管理者が保有し、操作には定められた人数の管理者の立会いと、各人の分割情報の入力を必須とする
    a: エ
    exp: |
      鍵の生成や復旧のような重大な操作は、単独の人間が完結できない仕組み （デュアルコントロール／多人数統制）にすることが原則です。必要な情報を分割して複数の管理者が持ち寄らなければ操作できない形にすれば、1 人の不正や誤操作では鍵を扱えません。金庫への保管は盗難や災害への備え、報告書は事後の記録、パスワードの強化は認証の強度であり、いずれも「1 人で実行できてしまう」構造そのものは変わりません。
    why:
      - 保管場所の堅牢さは、権限を持つ 1 人が単独で取り出せる構造を変えません。
      - パスワードの強化は成り済ましへの対策であり、正規の管理者 1 人による単独の操作は防げません。
      - 事後の報告は記録にはなりますが、不正な操作そのものを防ぐ仕組みではありません。
      - 正解です。分割した情報と複数人の立会いにより、単独での操作が構造的に不可能になります。
    know: 鍵管理の原則の一つは、重大な操作を単独で完結できないようにする多人数統制である。可用性 （控えの保管）や記録 （報告）とは目的が異なるため、求められているリスクに合った施策を選ぶことが要点である。
    terms:
      - 暗号鍵
      - 鍵管理
    verify:
      manual: 目的（単独での実行の不可能化）と各施策の効果を照合し、情報の分割と複数人の立会いだけが構造的に単独操作を防ぐこと、他は保管・記録・認証の強化で目的が異なることを確認した。
  - id: A11-520
    topic: 11-1-7
    diff: 2
    scope: 11-1-7 IC カードの耐タンパ性。PIN の試行回数制限と、物理的な攻撃を検知した際の秘密情報の消去（ゼロ化）の仕組みの判断
    prereq: IC カードは、秘密鍵を外部から読み出せないようにし、不正な解析の試みを検知した場合は内部の秘密情報を消去すること
    q: |
      秘密鍵を内蔵する IC カードについて、不正な解析への耐性（耐タンパ性）を高める仕組みとして、適切なものはどれか。
    c:
      - カードの表面に、秘密鍵の一部を印字しておく
      - 秘密鍵を、カードとサーバの両方に同じものとして保管する
      - PIN の入力を省略し、かざすだけで認証できるようにする
      - 物理的な分解や解析の試みを検知したときに、内蔵する秘密情報を自動的に消去する（ゼロ化する）
    a: エ
    exp: |
      IC カードの秘密鍵は、カードの内部に閉じ込め、外部から読み出せないことが前提です。耐タンパ性は、チップを分解したり信号を解析したりする物理的な攻撃への耐性であり、攻撃の検知時に秘密情報を消去（ゼロ化）することで、解析されても鍵が取り出せないようにする仕組みが代表的です。あわせて、PIN の試行回数を制限して総当たりを防ぐことも行われます。
    why:
      - 秘密鍵の一部でも表面に印字すれば、秘匿性が損なわれます。
      - 秘密鍵をサーバ側にも同じ形で置くと、漏洩の経路が増えます。秘密鍵はカードから出さないことが原則です。
      - PIN を省略すると、カードを手にした者なら誰でも使えるようになり、安全性は下がります。
      - 正解です。攻撃の検知と秘密情報のゼロ化は、耐タンパ性を高める中心的な仕組みです。
    know: IC カードの安全性は「秘密鍵を外に出さない」構造と、物理攻撃への耐性（耐タンパ性）で成り立つ。ゼロ化は、解析されても鍵を取り出せなくするための仕組みである。
    terms:
      - 耐タンパ性
      - ICカード
      - 秘密鍵
    verify:
      manual: 耐タンパ性の定義（物理的攻撃への耐性と検知時のゼロ化）と各選択肢を照合し、イだけがその仕組みに当たること、他が秘匿性や認証を弱める内容であることを確認した。
  - id: A11-521
    topic: 11-1-7
    diff: 3
    scope: 11-1-7 量子計算が暗号に与える影響。ショアのアルゴリズムによる公開鍵暗号への影響と、グローバーのアルゴリズムによる共通鍵暗号への影響の区別
    prereq: ショアのアルゴリズムは素因数分解や離散対数問題を高速に解くため RSA や楕円曲線暗号が危殆化すること、グローバーのアルゴリズムは総当たりを平方根程度に速くするため共通鍵の実効強度が半減すること
    hard: 2つの量子アルゴリズムの影響の質が異なる（公開鍵は根本的に破られる、共通鍵は鍵長で対抗できる）ことを区別する必要がある。
    q: |
      大規模な量子コンピュータが実用化された場合の、暗号への影響として、正しいものはどれか。
    c:
      - 影響を受けるのは共通鍵暗号だけで、RSA 暗号や楕円曲線暗号は影響を受けない
      - RSA 暗号や楕円曲線暗号は、ショアのアルゴリズムによって短時間で解読される危険があり、共通鍵暗号はグローバーのアルゴリズムによって実効的な鍵の強度が半分程度になる
      - 共通鍵暗号も公開鍵暗号も、同じように短時間で完全に解読され、鍵長を長くしても対抗できない
      - 量子コンピュータは暗号の解読には使えないため、現在の暗号方式を変更する必要はない
    a: イ
    exp: |
      量子アルゴリズムの影響は、暗号の種類で異なります。ショアのアルゴリズムは、素因数分解と離散対数問題を多項式時間で解くため、これらの困難さを根拠とする RSA 暗号や楕円曲線暗号は、十分に大規模な量子コンピュータがあれば解読される危険があります。一方、グローバーのアルゴリズムは総当たり探索を平方根程度に高速化するにとどまるため、共通鍵暗号は実効強度がおよそ半分（例えば 128 ビットの鍵は 64 ビット相当）になりますが、鍵長を倍にすることで対抗できます。このため、公開鍵暗号については耐量子計算暗号（PQC）への移行が進められています。
    why:
      - 影響の向きが逆です。根本的な影響を受けるのは公開鍵暗号のほうです。
      - 正解です。公開鍵暗号への影響 （根本的な危殆化）と、共通鍵暗号への影響（実効強度の半減、鍵長で対抗可能）を正しく区別しています。
      - 共通鍵暗号は鍵長を伸ばすことで強度を回復でき、「対抗できない」は誤りです。
      - ショアやグローバーのアルゴリズムのように、暗号解読に直接関わる量子アルゴリズムが知られています。
    know: 量子計算の影響は一様ではない。公開鍵暗号は数学的根拠そのものが崩れるため方式の移行が必要であり、共通鍵暗号は鍵長の拡大で対応できる、という非対称性が要点である。
    terms:
      - 量子コンピュータ
      - 公開鍵暗号
      - 共通鍵暗号
    verify:
      manual: ショアのアルゴリズム （素因数分解・離散対数の多項式時間解法）とグローバーのアルゴリズム （探索の平方根高速化）の性質を照合し、RSA・楕円曲線への影響と共通鍵の実効強度半減 （鍵長で対抗可能）の区別がアだけ正しいことを確認した。
  - id: A11-522
    topic: 11-1-8-2
    diff: 3
    scope: 11-1-8-2 同期パスキーの仕組み。端末を失っても新しい端末でログインできる理由として、秘密鍵がプラットフォームのアカウントを通じて暗号化同期されることの判断
    prereq: 同期パスキーでは、秘密鍵が利用者のプラットフォームのアカウントにひも付き、暗号化された形で端末間に同期されること、サービス側のサーバに保管されるのは公開鍵だけであること
    hard: 「サーバに秘密鍵があるから」といった誤った説明と区別し、同期の担い手がサービスのサーバではなく利用者のプラットフォームのアカウントであることを見抜く必要がある。生体情報も、端末内の解錠に使うだけで外部に送られない。
    q: |
      同期パスキーを使っている利用者が、スマートフォンを紛失した。新しいスマートフォンでプラットフォームのアカウントにサインインしたところ、以前と同様にパスキーで各サービスにログインできた。この仕組みの説明として、正しいものはどれか。
    c:
      - 各サービスのサーバに秘密鍵のコピーが保管されており、新しい端末に配布される
      - 秘密鍵は、利用者のプラットフォームのアカウントを通じて、暗号化された形で端末間に同期される
      - 利用者のパスワードがクラウドに保管されており、パスワード認証に戻ることでログインできる
      - 利用者の生体情報が各サービスのサーバに登録されており、生体情報から秘密鍵が再生成される
    a: イ
    exp: |
      同期パスキーでは、秘密鍵は利用者のプラットフォーム（OS 提供事業者）のアカウントにひも付いて保管され、エンドツーエンドで暗号化された形で、新しい端末へ同期されます。新しい端末で同じアカウントにサインインすれば、同期された秘密鍵が使えるようになり、各サービスへログインできます。サービス側のサーバに保管されるのは公開鍵だけであり、秘密鍵のコピーはありません。生体情報は、端末の中で秘密鍵の利用を解錠するために使うだけで、サーバに送られることはありません。
    why:
      - サービス側のサーバが保持するのは公開鍵だけです。秘密鍵のコピーがサーバにあれば、漏洩時の危険が大きくなります。
      - 正解です。プラットフォームのアカウントを通じた暗号化同期により、端末を替えても秘密鍵を復元して使えます。
      - パスキーはパスワードレスの仕組みであり、パスワードの保管や、パスワード認証への復帰は関係しません。
      - 生体情報はサーバに登録されず、秘密鍵の再生成にも使われません。生体認証は端末内の解錠の手段です。
    know: 同期パスキーの利便性は、秘密鍵がプラットフォームのアカウントを通じて端末間に同期されることから来る。同期の担い手はサービスのサーバではなく利用者側の基盤であり、サーバ側には公開鍵しか残らない点が要点である。
    terms:
      - パスキー
      - FIDO
      - 公開鍵暗号
    verify:
      manual: 同期パスキーの仕組み（秘密鍵のプラットフォーム経由の暗号化同期、サーバ側は公開鍵のみ保持、生体情報は端末内の解錠専用）と各選択肢を照合し、イだけが仕組みに一致することを確認した。
