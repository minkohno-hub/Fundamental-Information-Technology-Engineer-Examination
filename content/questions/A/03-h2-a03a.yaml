category: '03'
batch: H2
reviewed:
  at: '2026-10-27'
  method: 作成後に独立した検算・実行検証と、解答を伏せた再解答による確認
questions:
  - id: A03-501
    topic: 3-1-7
    diff: 2
    scope: 3-1-7 プロセッサの性能（命令ミックス）。命令の出現割合と所要クロック数から平均CPIを求め、MIPSに換算する計算はシラバスの命令ミックス・MIPSの範囲内。
    prereq: クロック周波数、CPI、MIPSの関係と、加重平均の計算
    hard: 単純平均ではなく出現割合による加重平均が必要で、さらに MIPS への単位換算も行う。
    q: |
      クロック周波数が 1GHz の CPU がある。この CPU が実行する命令の割合と1命令あたりの所要クロック数が次のとおりであるとき，この CPU の性能は約何 MIPS か。

      | 命令の種類 | 出現割合 | 所要クロック数 |
      | --- | --- | --- |
      | 演算 | 50% | 4 |
      | 転送 | 30% | 6 |
      | 分岐 | 20% | 10 |
    c:
      - '172'
      - '150'
      - '100'
      - '250'
    a: ア
    exp: |
      命令ミックスでは、命令の種類ごとの出現割合で重み付けした平均 CPI（1命令あたりの平均クロック数）を求めます。
      平均 CPI ＝ 0.5×4 ＋ 0.3×6 ＋ 0.2×10 ＝ 2.0 ＋ 1.8 ＋ 2.0 ＝ 5.8 クロック。
      1GHz は 1 秒間に 10⁹ クロックなので、1 秒間に実行できる命令数は 10⁹ ÷ 5.8 ≒ 1.724×10⁸ 命令、すなわち約 172 MIPS です。
    why:
      - 正解です。平均 CPI ＝ 5.8、1000 ÷ 5.8 ≒ 172 MIPS です。
      - 150 は3種類のクロック数の単純平均（約6.67）で計算した値（1000÷6.67）で、出現割合による重み付けをしていません。
      - 100 は最も遅い分岐命令（10クロック）だけで計算した値（1000÷10）で、出現割合を無視しています。
      - 250 は最も出現割合の高い演算命令（4クロック）だけで計算した値（1000÷4）で、他の命令の所要時間を無視しています。
    know: |
      MIPS ＝ クロック周波数[MHz] ÷ 平均 CPI で求まります。平均 CPI は「出現割合×クロック数」の総和（加重平均）です。種類の数で割る単純平均は典型的な誤りで、割合が偏っているほど正解からずれます。
    terms:
      - 命令ミックス
      - CPI
      - MIPS
      - クロック周波数
    verify:
      value: 1000/(0.5*4+0.3*6+0.2*10)
      tolerance: 0.5
  - id: A03-502
    topic: 3-1-7
    diff: 4
    scope: 3-1-7 プロセッサの性能（MIPS、CPI、クロック周波数）。実行時間＝命令数×CPI÷クロック周波数と、MIPS だけでは性能比較できない点はシラバス範囲の知識。
    prereq: 実行時間、命令数、CPI、クロック周波数の関係と MIPS の定義
    hard: MIPS 値の大小に引きずられず、命令数の違いまで含めて実行時間を計算して比べる必要がある。
    q: |
      同じ処理を実行する，命令セットの異なる2台のプロセッサ X，Y がある。条件が次のとき，正しい記述はどれか。

      | プロセッサ | 実行命令数 | 平均 CPI | クロック周波数 |
      | --- | --- | --- | --- |
      | X | 4×10⁸ | 2.0 | 2.0GHz |
      | Y | 1×10⁹ | 1.0 | 2.4GHz |
    c:
      - Y は MIPS 値が X より大きいので，Y の方が実行時間が短い。
      - X の実行時間は約0.40秒，Y の実行時間は約0.42秒で，X の方が短い。
      - X の実行時間は約0.80秒，Y の実行時間は約0.42秒で，Y の方が短い。
      - 命令数が Y の4割と少ない X は，実行時間も Y の4割の約0.17秒である。
    a: イ
    exp: |
      実行時間 ＝ 命令数 × CPI ÷ クロック周波数 で求めます。
      X ＝ 4×10⁸ × 2.0 ÷ 2.0×10⁹ ＝ 0.40 秒。
      Y ＝ 1×10⁹ × 1.0 ÷ 2.4×10⁹ ≒ 0.417 秒。
      MIPS は X が 2000÷2.0 ＝ 1000、Y が 2400÷1.0 ＝ 2400 で Y が大きいものの、Y は同じ処理に必要な命令数が 2.5 倍あるため、実行時間は X の方がわずかに短くなります。
    why:
      - MIPS 値は命令数の違いを反映しません。Y の MIPS 値は大きいが、命令数が 2.5 倍あるため実行時間は X より長くなります。
      - 正解です。X は 0.40 秒、Y は約 0.42 秒で X が短くなります。
      - X の時間を 0.80 秒とするのは CPI を二重に掛けるなどの計算ミスです。X の実際の値は 0.40 秒で、結論も逆になります。
      - 命令数の比だけで時間を決めており、CPI とクロック周波数の違いを無視しています。X の実際の時間は 0.40 秒で、Y の 4 割にはなりません。
    know: |
      MIPS は命令セットが異なるプロセッサどうしの性能比較には使えません。同じ処理でも命令数が異なるためです。比較は同一プログラムの実行時間で行います。実行時間 ＝ 命令数 × CPI × サイクルタイム という関係を覚えておくと、CPI やクロックの変更が与える影響も整理できます。
    terms:
      - MIPS
      - CPI
      - クロック周波数
      - CISC
      - RISC
    verify:
      value: 4e8*2.0/2.0e9
      tolerance: 0.001
  - id: A03-503
    topic:
      - 3-1-8
      - 3-1-7
    diff: 4
    scope: 3-1-8 プロセッサの高速化技術（パイプラインと分岐による乱れ）と 3-1-7 の性能計算。分岐命令の割合・成立率・ペナルティから平均 CPI と実行時間を求めるのは範囲内。
    prereq: パイプラインの制御ハザード、CPI とクロック周波数から実行時間を求める計算
    hard: 分岐割合×成立率×ペナルティという多段の確率計算に、CPI から実行時間への換算が続く。
    q: |
      パイプライン方式のプロセッサで，分岐命令が全命令の20%を占め，その70%で分岐が成立する。常に分岐不成立と予測して後続命令を先読みしており，分岐が成立したときは先読みした命令を破棄し，4クロック分の空きが生じる。分岐不成立のときと分岐以外の命令は，いずれも1命令あたり1クロックで完了する。クロック周波数 2.0GHz で 1.0×10⁹ 命令を実行するのに要する時間は何秒か。
    c:
      - '0.28'
      - '0.90'
      - '0.78'
      - '1.90'
    a: ウ
    exp: |
      空きが生じるのは、分岐命令のうち分岐が成立した場合だけです。
      1命令あたりの空きクロック数の平均 ＝ 0.2 × 0.7 × 4 ＝ 0.56 クロック。
      平均 CPI ＝ 1 ＋ 0.56 ＝ 1.56。
      実行時間 ＝ 1.0×10⁹ × 1.56 ÷ 2.0×10⁹ ＝ 0.78 秒です。
    why:
      - 0.28 は空きクロックの 0.56 だけを使い、基本の1クロックを足し忘れた値です（0.56÷2）。
      - 0.90 は分岐成立率 70% を掛けず、分岐命令のすべてで 4 クロック空くとした値（CPI 1.8）です。
      - 正解です。CPI ＝ 1 ＋ 0.2×0.7×4 ＝ 1.56、実行時間 ＝ 1.56÷2.0 ＝ 0.78 秒です。
      - 1.90 は分岐命令の割合 20% を掛けず、全命令のうち 70% で 4 クロック空くとした値（CPI 3.8）です。
    know: |
      パイプラインの制御ハザードによる損失は「分岐命令の割合 × ペナルティが生じる確率 × ペナルティのクロック数」を CPI に加算して表します。分岐予測が当たったときはペナルティがない点に注意してください。
    terms:
      - パイプライン
      - ハザード
      - CPI
      - クロック周波数
    verify:
      value: 1e9*(1+0.2*0.7*4)/2.0e9
      tolerance: 0.001
  - id: A03-504
    topic: 3-1-8
    diff: 3
    scope: 3-1-8 プロセッサの高速化技術（パイプライン）。各ステージの所要時間が異なるとき、クロックサイクルは最も遅いステージで決まることと、実行時間の求め方は範囲内。
    prereq: パイプライン処理の実行時間（段数＋命令数−1）の考え方
    hard: ステージごとの時間が不均一なため、クロック周期の決定から実行時間算出までの2段階で考える必要がある。
    q: |
      命令を 5 つのステージに分けて処理するパイプラインがある。各ステージの所要時間は次のとおりで，パイプラインのクロック周期は最も遅いステージの所要時間に合わせる。分岐やデータの依存などによる乱れがないとき，1,000 個の命令を実行するのに要する時間は何ナノ秒か。

      | ステージ | IF | ID | EX | MEM | WB |
      | --- | --- | --- | --- | --- | --- |
      | 所要時間（ナノ秒） | 2 | 1 | 3 | 2 | 1 |
    c:
      - 3,000
      - 9,000
      - 3,012
      - 15,000
    a: ウ
    exp: |
      パイプラインの1クロックの長さは、最も遅いステージの所要時間 3 ナノ秒に合わせます。
      最初の命令が完了するまでに 5 クロック、以降は 1 クロックごとに 1 命令が完了するので、1,000 命令に必要なクロック数は 5 ＋ (1,000 − 1) ＝ 1,004 クロックです。
      実行時間 ＝ 1,004 × 3 ＝ 3,012 ナノ秒となります。
    why:
      - 3,000 は 1,000 命令 × 3 ナノ秒で、最初の命令がパイプラインを満たすまでの時間（4クロック分）を無視しています。
      - 9,000 はパイプラインを使わず1命令を逐次に処理した場合（各ステージの合計 9 ナノ秒 × 1,000）の値です。
      - 正解です。(5 ＋ 999) クロック × 3 ナノ秒 ＝ 3,012 ナノ秒です。
      - 15,000 は全命令が 5 ステージ × 3 ナノ秒 ＝ 15 ナノ秒を要するとして、1,000 命令を重ねずに処理した値です。
    know: |
      パイプラインの実行クロック数は「段数 ＋ 命令数 − 1」です。ステージの所要時間が不均一なときは、最も遅いステージがクロック周期を決めるため、短いステージには待ちが生じます。このためステージ時間を均等にすると効率が上がります。
    terms:
      - パイプライン
      - クロック周波数
      - サイクルタイム
    verify:
      value: (5+1000-1)*Math.max(2,1,3,2,1)
  - id: A03-505
    topic: 3-2-3
    diff: 4
    scope: 3-2-3 メモリシステムの構成と記憶階層（キャッシュメモリ、実効アクセス時間）。複数段のキャッシュを含む記憶階層の実効アクセス時間は、ヒット率による加重平均の拡張で範囲内。
    prereq: 1段のキャッシュの実効アクセス時間（ヒット率による加重平均）
    hard: 2段のキャッシュで、下位のヒット率が「上位でミスしたものの中での率」であることを読み取り、入れ子の加重平均を作る必要がある。
    q: |
      CPU，1次キャッシュ，2次キャッシュ，主記憶の順に階層化されたシステムがある。アクセス時間とヒット率は次のとおりである。2次キャッシュのヒット率は，1次キャッシュでミスしたアクセスのうち，2次キャッシュにあった割合である。各階層には上位から順に検索し，ヒットした階層のアクセス時間だけを要する（上位でミスした分の検索時間は加算しない）ものとするとき，実効アクセス時間は何ナノ秒か。

      | 階層 | アクセス時間 | ヒット率 |
      | --- | --- | --- |
      | 1次キャッシュ | 2 ナノ秒 | 90% |
      | 2次キャッシュ | 10 ナノ秒 | 80% |
      | 主記憶 | 100 ナノ秒 | 100% |
    c:
      - '5.0'
      - '2.6'
      - '3.8'
      - '4.6'
    a: エ
    exp: |
      アクセスの行き先ごとの割合を求めます。
      1次キャッシュでヒット ＝ 0.9。
      1次でミスして2次でヒット ＝ 0.1 × 0.8 ＝ 0.08。
      どちらでもミスして主記憶 ＝ 0.1 × 0.2 ＝ 0.02。
      実効アクセス時間 ＝ 0.9×2 ＋ 0.08×10 ＋ 0.02×100 ＝ 1.8 ＋ 0.8 ＋ 2.0 ＝ 4.6 ナノ秒です。
    why:
      - 5.0 は 1次ミス時に 1次の検索時間 2 ナノ秒も加算する別のモデル（2＋0.1×(10＋0.2×100)）の値で、問題文の「検索時間は加算しない」という条件に反します。
      - 2.6 は主記憶へ行くアクセス（0.02×100）を考慮しない値（1.8＋0.8）で、2次キャッシュでもミスする場合の時間が抜けています。
      - 3.8 は2次キャッシュでヒットする分（0.08×10）を考えず、1次でミスしたものを 20% だけ主記憶に行くとした値（1.8＋0.02×100）です。
      - 正解です。0.9×2 ＋ 0.08×10 ＋ 0.02×100 ＝ 4.6 ナノ秒です。
    know: |
      階層が増えても実効アクセス時間は「各階層でヒットする割合 × その階層のアクセス時間」の総和です。下位の階層のヒット率が上位でミスした中での割合か、全体に対する割合かを問題文から読み取ることが重要です。
    terms:
      - キャッシュメモリ
      - 実効アクセス時間
      - ヒット率
      - 記憶階層
    verify:
      value: 0.9*2+0.1*(0.8*10+0.2*100)
      tolerance: 0.001
  - id: A03-506
    topic: 3-2-3
    diff: 3
    scope: 3-2-3 キャッシュメモリの実効アクセス時間。式を逆算して必要なヒット率を求める計算は、実効アクセス時間の理解の範囲内。
    prereq: 実効アクセス時間の式（ヒット率の加重平均）と1次方程式
    hard: 通常と逆向きの計算で、式を立てて未知数のヒット率を解く必要がある。ミス率と取り違えやすい。
    q: キャッシュメモリのアクセス時間が 5 ナノ秒，主記憶のアクセス時間が 50 ナノ秒のシステムで，実効アクセス時間を 9.5 ナノ秒にしたい。必要なキャッシュメモリのヒット率は最低何%か。
    c:
      - 81%
      - 95%
      - 10%
      - 90%
    a: エ
    exp: |
      ヒット率を h とすると、実効アクセス時間は h×5 ＋ (1−h)×50 で表せます。
      これが 9.5 以下になる条件は 50 − 45h ≦ 9.5、すなわち h ≧ 40.5 ÷ 45 ＝ 0.9 です。
      したがって必要なヒット率は最低 90% です。
    why:
      - 81% は (50−9.5)÷50 ＝ 0.81 としたもので、ヒット時の時間 5 ナノ秒を考慮せず、ヒットしたときも主記憶の時間を基準に計算しています。
      - 95% は目標の 9.5 を単純にヒット率の数字に読み替えたもので、式から導かれたものではありません。
      - 10% はミス率（1−h）の値です。求めるのはヒット率なので 100% から引く必要があります。
      - 正解です。5h ＋ 50(1−h) ＝ 9.5 を解くと h ＝ 0.9 です。
    know: |
      実効アクセス時間 ＝ ヒット率×キャッシュの時間 ＋ (1−ヒット率)×主記憶の時間 です。ヒット率が 1 ずれるたびに「主記憶−キャッシュの時間差」だけ変わるので、目標値から逆算するには時間差で割ります。
    terms:
      - キャッシュメモリ
      - 実効アクセス時間
      - ヒット率
    verify:
      value: (50-9.5)/(50-5)*100
      tolerance: 0.000001
  - id: A03-507
    topic: 3-2-3
    diff: 3
    scope: 3-2-3 メモリシステムの構成と記憶階層（ライトスルー、ライトバック）。2つの書込み方式で主記憶への書込み量がどう違うかを具体的な参照列で比較するのは範囲内。
    prereq: ライトスルーとライトバックの動作の違い（更新済みブロックの書戻しのタイミング）
    hard: 方式ごとの動作を参照列に当てはめて数える必要があり、読出しだけのブロックは書き戻されないことを見落としやすい。
    q: |
      キャッシュメモリの1ブロックは4語で，ブロック X，Y は最初からキャッシュに存在している。プログラムが X の同じ語に連続して10回書込みを行い，Y からは20回の読出しだけを行ったあと，X，Y ともキャッシュから追い出された。主記憶へ書き込まれる語数の合計は，ライトスルー方式とライトバック方式でそれぞれ何語か。ここで，ライトバック方式では更新されたブロックだけがブロック単位で主記憶に書き戻されるものとする。
    c:
      - ライトスルー方式は30語，ライトバック方式は4語
      - ライトスルー方式は4語，ライトバック方式は10語
      - ライトスルー方式は10語，ライトバック方式は4語
      - ライトスルー方式は10語，ライトバック方式は8語
    a: ウ
    exp: |
      ライトスルー方式では、書込みのたびに主記憶へも書き込むので、書込み10回で 10 語が書かれます。読出しは主記憶を更新しません。
      ライトバック方式では、書込みはキャッシュだけに行い、追い出されるときに更新されたブロックだけを書き戻します。X は更新されているので 1 ブロック（4 語）を書き戻し、読出しだけの Y は書き戻しません。
      合計は、ライトスルーが 10 語、ライトバックが 4 語です。
    why:
      - ライトスルーを 30 語とするのは、読出し 20 回も主記憶への書込みに数えた誤りです。読出しでは主記憶は更新されません。
      - ライトスルーとライトバックの動作を取り違えています。書込みの度に主記憶に書くのがライトスルー、追出し時にまとめて書くのがライトバックです。
      - 正解です。ライトスルーは書込み回数の 10 語、ライトバックは更新済みの X の 1 ブロック（4 語）です。
      - ライトバックを 8 語とするのは、更新されていない Y も書き戻すと考えた誤りです。ライトバックでは更新されたブロックだけを書き戻します。
    know: |
      ライトバックは同じブロックへの書込みが多いほど主記憶への書込み回数を減らせる反面、更新済みかどうかを示す情報が必要で、主記憶の内容が古くなる期間が生じます。ライトスルーは主記憶と常に一致する代わりに書込みごとに主記憶の速度に制約されます。
    terms:
      - ライトスルー
      - ライトバック
      - キャッシュメモリ
      - キャッシュライン
    verify:
      manual: 書込み10回×1語＝10語（ライトスルー）、更新済みブロック X の4語のみ書戻し＝4語（ライトバック）、Y は未更新のため0語、を数え直して確認
  - id: A03-508
    topic: 3-2-3
    diff: 3
    scope: 3-2-3 キャッシュメモリ（マッピング方式）。ブロック番号とセット数からセットアソシアティブ方式の格納先セットを求めるのは、マッピング方式の理解の範囲内。
    prereq: キャッシュのマッピング方式（ダイレクト、セットアソシアティブ、フルアソシアティブ）とアドレスからブロック番号を求める計算
    hard: アドレス→ブロック番号→セット番号の2段階の変換が必要で、ライン数とセット数の違い（ウェイ数での割算）を見落としやすい。
    q: |
      キャッシュメモリが，1ブロック 16 バイト，全部で 64 ラインの2ウェイセットアソシアティブ方式で構成されている。主記憶の 10 進アドレス 10000 番地のバイトを含むブロックは，何番のセットに格納されるか。ここで，主記憶のアドレスは 0 番地から 1 バイトごとに付けられ，ブロックは 0 番地から順に 16 バイトずつ区切られ，ブロック番号をセット数で割った余りが格納先のセット番号になる。セット番号は 0 から始まる。
    c:
      - '16'
      - '17'
      - '49'
      - '625'
    a: イ
    exp: |
      全 64 ラインを2ウェイで使うので、セット数は 64 ÷ 2 ＝ 32 です。
      10000 番地を含むブロックのブロック番号 ＝ 10000 ÷ 16 の商 ＝ 625。
      セット番号 ＝ 625 を 32 で割った余り ＝ 625 − 19×32 ＝ 17 です。
    why:
      - 16 はアドレス 10000 を 32 で割った余り（ブロック番号に直さずに計算）です。バイト単位のアドレスをそのままセット数で割ってはいけません。
      - 正解です。ブロック番号 625 を セット数 32 で割った余りが 17 です。
      - 49 はセット数を 64 とし（ダイレクトマッピングと同じ計算）625 を 64 で割った余りを求めた値です。2ウェイではセット数は 32 になります。
      - 625 はブロック番号そのものです。ブロック番号をセット数で割った余りを求める操作が抜けています。
    know: |
      ライン数が同じなら、ウェイ数が増えるほどセット数は減ります。ダイレクトマッピングは1ウェイ、フルアソシアティブはセットが1つの場合と考えられます。アドレスは「ブロック内の位置」「セット番号」「タグ」に分けて考えます。
    terms:
      - セットアソシアティブ方式
      - キャッシュメモリ
      - キャッシュライン
      - ダイレクトマッピング方式
    verify:
      value: Math.floor(10000/16)%(64/2)
  - id: A03-509
    topic: 3-2-3
    diff: 4
    scope: 3-2-3 メモリシステムの構成と記憶階層（キャッシュメモリ、ダイレクトマッピング）と 3-2-5 メモリの容量。アドレスの内訳（タグ・ライン番号・ブロック内位置）から管理情報の容量を求める計算は範囲内。
    prereq: ダイレクトマッピングでのアドレス分割（タグ、ライン番号、ブロック内位置）、ビットとバイトの換算
    hard: データ容量→ライン数→各ビット幅→総タグ容量と、4段階の計算を連ねる。ビットとバイトの取り違えがしやすい。
    q: |
      アドレスが 32 ビット（1 アドレスに 1 バイト）の主記憶に対して，データ容量 64K バイト，1 ライン 64 バイトのダイレクトマッピング方式のキャッシュメモリを設ける。アドレスの上位ビットをタグとして各ラインに保持するとき，タグを保持するための記憶容量は何 K バイトか。ここで，1K ＝ 1,024 とし，有効ビットなどその他の管理情報は考えない。
    c:
      - 16 K バイト
      - 1 K バイト
      - 2 K バイト
      - 2.75 K バイト
    a: ウ
    exp: |
      ライン数 ＝ 64K ÷ 64 ＝ 1,024（2¹⁰）ライン。
      アドレス 32 ビットは、下位 6 ビット（64 バイト＝2⁶、ブロック内位置）、続く 10 ビット（1,024 ライン＝2¹⁰、ライン番号）、残りの上位 32 − 6 − 10 ＝ 16 ビットがタグになります。
      タグの総量 ＝ 1,024 × 16 ビット ＝ 16,384 ビット ＝ 2,048 バイト ＝ 2K バイトです。
    why:
      - 16K バイトはタグの 16 ビットを 16 バイトと読み違えた値（1,024 × 16 バイト）で、ビットとバイトを取り違えています。
      - 1K バイトは 16 ビットを 1 バイトと数えるなどバイト換算の誤りで、1,024 × 1 バイトとした値です。16 ビットは 2 バイトです。
      - 正解です。タグ 16 ビット × 1,024 ライン ＝ 16,384 ビット ＝ 2K バイトです。
      - 2.75K バイトは、ブロック内位置の 6 ビットを引かずにタグを 22 ビットとした値（1,024×22÷8÷1,024）です。
    know: |
      ダイレクトマッピングでは、アドレスは「タグ｜ライン番号｜ブロック内位置」に分けられ、ライン番号とブロック内位置の幅は容量から決まります。タグはどのブロックの写しかを見分けるために各ラインに付ける情報で、キャッシュ本体のデータ容量とは別に必要です。
    terms:
      - ダイレクトマッピング方式
      - キャッシュメモリ
      - キャッシュライン
      - ビットとバイト
    verify:
      value: 1024*(32-Math.log2(64)-Math.log2(64*1024/64))/8/1024
