category: '10'
reviewed: { at: '2026-10-21', method: '作成後の逐問レビュー（プロトコルの仕様は RFC 等の一般的な記述と照合、アドレス計算・回線計算は検算式で独立に再計算）' }
questions:
  - id: A10-001
    topic: 10-1-1
    diff: 1
    q: パケット交換方式の特徴として，適切なものはどれか。
    c:
      - データを小さなパケットに分割して送り，回線を複数の通信で共有するので，回線を効率よく利用できる。
      - 通信の開始から終了まで，送受信者間に専用の通信路を確保し続ける。
      - 通信中は他の通信が回線を使えないので，通信速度が常に一定に保証される。
      - データを分割せず，一度にまとめて送る。
    a: ア
    exp: |
      パケット交換方式は、データをパケットと呼ばれる小さな単位に分け、宛先などの情報（ヘッダー）を付けて送る方式です。回線を多数の通信で共有するので効率がよく、インターネットで使われています。混雑状況によって遅延が変わることがあります。
    why:
      - 正解です。パケットに分割して回線を共有します。
      - これは回線交換方式の説明です（従来の固定電話など）。
      - 専用の通信路を占有するのは回線交換方式の特徴です。
      - データを分割するのがパケット交換方式です。
    terms: [パケット交換]

  - id: A10-002
    topic: 10-1-2
    diff: 1
    q: 光ファイバケーブルの特徴として，適切なものはどれか。
    c:
      - 光信号で伝送するので，電磁的な雑音の影響を受けにくく，長距離・高速の伝送に適している。
      - 2本の銅線をより合わせたケーブルで，LAN の配線に最も広く使われている。
      - 電波でデータを送るので，配線が不要である。
      - 中心の導体を網状の導体で囲んだ構造の金属ケーブルである。
    a: ア
    exp: |
      光ファイバケーブルは、ガラスやプラスチックの細い繊維の中に光を通して信号を伝えるケーブルです。電磁的な雑音の影響を受けず、減衰も小さいため、長距離・大容量の伝送に使われます。FTTH（光回線）や基幹ネットワークで使われています。
    why:
      - 正解です。雑音に強く長距離・高速の伝送に適しています。
      - これはより対線（ツイストペアケーブル）の説明です。
      - これは無線 LAN の説明です。
      - これは同軸ケーブルの説明です。
    terms: [光ファイバ]

  - id: A10-003
    topic: 10-1-3
    diff: 1
    q: 無線 LAN の SSID の説明として，適切なものはどれか。
    c:
      - 無線 LAN のネットワークを識別するための名前で，端末は接続するアクセスポイントのネットワークを SSID で選ぶ。
      - 無線 LAN の通信を暗号化するための鍵である。
      - 無線 LAN の端末に固有に割り当てられた物理アドレスである。
      - 無線 LAN の電波の周波数帯である。
    a: ア
    exp: |
      SSID（Service Set Identifier）は、無線 LAN のネットワークを識別するための名前です。端末は周囲のアクセスポイントが発信する SSID の一覧から、接続するネットワークを選びます。SSID を知っていても、暗号化の鍵（パスフレーズ）がなければ接続できないように WPA2 や WPA3 で保護します。
    why:
      - 正解です。無線 LAN のネットワーク名です。
      - 暗号化の鍵は WPA2/WPA3 のパスフレーズなどです。
      - 端末固有の物理アドレスは MAC アドレスです。
      - 周波数帯は 2.4GHz 帯・5GHz 帯などで、SSID ではありません。
    terms: [無線LAN]

  - id: A10-004
    topic: 10-1-4
    diff: 1
    q: VoIP の説明として，適切なものはどれか。
    c:
      - 音声をデジタル化してパケットに分割し，IP ネットワークで伝送する技術
      - 映像を圧縮して放送電波で送る技術
      - 電子メールを暗号化する技術
      - 無線 LAN のアクセスポイントを相互に接続する技術
    a: ア
    exp: |
      VoIP（Voice over Internet Protocol）は、音声を符号化してパケットにし、IP ネットワーク上で送受信する技術です。IP 電話やインターネット通話アプリなどで使われ、データ通信と同じネットワークで通話できるため、通信コストを抑えられます。
    why:
      - 正解です。音声を IP ネットワークで伝送する技術です。
      - これはデジタル放送の説明です。
      - メールの暗号化は S/MIME などの技術です。
      - アクセスポイントの相互接続はメッシュ Wi-Fi などです。
    terms: [VoIP]

  - id: A10-005
    topic: 10-1-5
    diff: 2
    q: 伝送速度 100M ビット/秒の回線で，10M バイトのファイルを転送するのにかかる時間は何秒か。ここで，回線の伝送効率は 80％ とし，1M バイト＝10⁶ バイト，1M ビット＝10⁶ ビットとする。
    c: ['1', '0.8', '0.1', '8']
    a: ア
    exp: |
      ファイルの大きさをビットに換算すると、10M バイト×8＝80M ビットです。
      実際に使える速度は 100M ビット/秒×0.8＝80M ビット/秒です。
      転送時間＝80M ビット÷80M ビット/秒＝1 秒です。
    why:
      - 正解です。80M ビット÷80M ビット/秒＝1 秒です。
      - 0.8 は伝送効率を考慮せずに 80÷100 と計算した値です。
      - 0.1 はバイトをビットに換算しなかった値（10÷100）です。
      - 8 は計算の誤りです。
    know: 回線の計算では「バイト→ビット（×8）」の換算と、伝送効率による実効速度の計算が頻出のポイントです。
    terms: [伝送速度]
    verify: { value: '(10 * 8) / (100 * 0.8)' }

  - id: A10-006
    topic: 10-1-5
    diff: 2
    q: ビット誤り率が 10⁻⁶ の回線で，1M バイト（10⁶ バイト）のデータを送るとき，誤りが発生するビット数の期待値はいくつか。
    c: ['8', '1', '0.8', '80']
    a: ア
    exp: |
      ビット誤り率は、送ったビットのうち誤りになるビットの割合です。
      送るビット数は 10⁶ バイト×8＝8×10⁶ ビットなので、誤りビット数の期待値は 8×10⁶×10⁻⁶＝8 ビットです。
    why:
      - 正解です。8×10⁶×10⁻⁶＝8 です。
      - 1 はバイトをビットに換算しなかった値です。
      - 0.8 は計算の誤りです。
      - 80 は桁の誤りです。
    terms: [伝送速度]
    verify: { value: '1e6 * 8 * 1e-6' }

  - id: A10-007
    topic: 10-1-5
    diff: 3
    q: ある回線で，1時間に 30 回の通話があり，1回の平均通話時間が 3 分であった。この回線の呼量は何アーランか。
    c: ['1.5', '90', '10', '0.05']
    a: ア
    exp: |
      呼量（アーラン）は、単位時間あたりの回線の占有時間の合計を、単位時間で割った値で、同時に使われている回線数の平均を表します。
      1時間（60分）あたりの占有時間の合計は 30回×3分＝90分 なので、呼量＝90÷60＝1.5 アーランです。
    why:
      - 正解です。90 分÷60 分＝1.5 アーランです。
      - 90 は占有時間の合計（分）で、単位時間で割っていません。
      - 10 は 30÷3 と計算した誤りです。
      - 0.05 は 3÷60 で、1回の通話だけの値です。
    terms: [伝送速度]
    verify: { value: '30 * 3 / 60' }

  - id: A10-008
    topic: 10-1-6
    diff: 1
    q: IPv4 と IPv6 のアドレスの長さの組合せとして，正しいものはどれか。
    c: ['IPv4 は 32 ビット，IPv6 は 128 ビット', 'IPv4 は 32 ビット，IPv6 は 64 ビット', 'IPv4 は 64 ビット，IPv6 は 128 ビット', 'IPv4 は 48 ビット，IPv6 は 96 ビット']
    a: ア
    exp: |
      IPv4 のアドレスは 32 ビットで、約 43 億（2³²）個のアドレスしか表せず、アドレスの枯渇が問題になりました。IPv6 のアドレスは 128 ビットで、事実上無限ともいえる数のアドレスを扱えます。IPv6 のアドレスは 16 ビットずつ 16 進数で表し、コロンで区切って書きます。
    why:
      - 正解です。IPv4 は 32 ビット、IPv6 は 128 ビットです。
      - IPv6 は 64 ビットではありません。
      - IPv4 は 64 ビットではありません。
      - 48 ビットは MAC アドレスの長さです。
    terms: [IPアドレス, IPv6]

  - id: A10-009
    topic: 10-1-6
    diff: 2
    q: IPv4 のプライベート IP アドレスとして使用できるものはどれか。
    c: ['192.168.10.5', '8.8.8.8', '200.10.10.1', '172.32.0.1']
    a: ア
    exp: |
      プライベート IP アドレスは、組織内の LAN などで自由に使えるアドレスで、インターネット上では使われません。範囲は次の3つです。
      - 10.0.0.0〜10.255.255.255
      - 172.16.0.0〜172.31.255.255
      - 192.168.0.0〜192.168.255.255
      192.168.10.5 はこの範囲に含まれます。
    why:
      - 正解です。192.168.0.0/16 の範囲に含まれます。
      - 8.8.8.8 はグローバル IP アドレス（インターネット上で一意のアドレス）です。
      - 200.10.10.1 はプライベート IP アドレスの範囲に含まれません。
      - 172.32.0.1 は 172.16〜172.31 の範囲外です。
    know: プライベート IP アドレスの端末がインターネットと通信するときは、ルータなどの NAT（NAPT）機能でグローバル IP アドレスに変換します。
    terms: [IPアドレス, NAT]

  - id: A10-010
    topic: 10-1-6
    diff: 2
    q: NAPT（IP マスカレード）の説明として，適切なものはどれか。
    c:
      - 1つのグローバル IP アドレスとポート番号の組合せを使い分けて，複数の端末のプライベート IP アドレスと対応付ける。
      - ドメイン名を IP アドレスに変換する。
      - IP アドレスを MAC アドレスに変換する。
      - 端末に IP アドレスを自動的に割り当てる。
    a: ア
    exp: |
      NAT はプライベート IP アドレスとグローバル IP アドレスを相互に変換する技術で、NAPT（IP マスカレード）はさらにポート番号も変換することで、1つのグローバル IP アドレスを複数の端末で同時に共有できるようにします。家庭用のルータなどで使われています。
    why:
      - 正解です。アドレスとポート番号を変換して1つのグローバルアドレスを共有します。
      - ドメイン名を IP アドレスに変換するのは DNS です。
      - IP アドレスから MAC アドレスを求めるのは ARP です。
      - IP アドレスを自動で割り当てるのは DHCP です。
    terms: [NAT]

  - id: A10-011
    topic: 10-1-6
    diff: 1
    q: DNS の役割として，適切なものはどれか。
    c:
      - ドメイン名と IP アドレスの対応を管理し，問合せに応じて変換する。
      - 端末に IP アドレスなどの設定情報を自動的に割り当てる。
      - 電子メールをメールサーバ間で転送する。
      - ネットワーク上の機器の時刻を合わせる。
    a: ア
    exp: |
      DNS（Domain Name System）は、www.example.jp のようなドメイン名と IP アドレスの対応を管理し、ドメイン名から IP アドレスを調べる（名前解決）仕組みです。世界中の DNS サーバが階層的に分担して情報を管理しています。
    why:
      - 正解です。ドメイン名と IP アドレスを対応付けます。
      - これは DHCP の役割です。
      - これは SMTP の役割です。
      - これは NTP の役割です。
    know: ドメイン名の最も右の部分（.jp、.com など）をトップレベルドメイン（TLD）といいます。DNS の応答を偽装する DNS キャッシュポイズニングへの対策として DNSSEC があります。
    terms: [DNS]

  - id: A10-012
    topic: 10-1-6
    diff: 2
    q: QoS（Quality of Service）の説明として，適切なものはどれか。
    c:
      - 音声通話などの遅延に敏感な通信を優先して扱うなど，通信の種類に応じて帯域や遅延などの品質を制御・保証する仕組み
      - 通信を暗号化して，盗聴を防止する仕組み
      - ネットワークに接続する利用者を認証する仕組み
      - ネットワーク機器の故障を検知して，自動で切り替える仕組み
    a: ア
    exp: |
      QoS は、ネットワーク上の通信に優先度を付け、音声やビデオ会議のように遅延や揺らぎに弱い通信を優先的に転送したり、一定の帯域を確保したりして、通信品質を確保する仕組みです。
    why:
      - 正解です。通信の品質を制御・保証する仕組みです。
      - 通信の暗号化は TLS や IPsec などの役割です。
      - 利用者の認証は RADIUS などの役割です。
      - 故障時の自動切替えは冗長化の仕組みです。
    terms: [QoS]

  - id: A10-013
    topic: 10-2-1-1
    diff: 1
    q: ネットワークトポロジのうち，スター型の説明として，適切なものはどれか。
    c:
      - 中心となる集線装置（ハブやスイッチ）に，各端末を1本ずつケーブルで接続する。
      - 1本の幹線ケーブルに，すべての端末を接続する。
      - 隣り合う端末どうしを順に接続して，輪の形にする。
      - すべての端末どうしを，互いに直接接続する。
    a: ア
    exp: |
      スター型は、ハブやスイッチを中心に、各端末を放射状に接続する形態です。1台の端末やケーブルが故障しても他の端末に影響しにくく、増設も容易なため、現在の LAN で最も一般的です。ただし、中心の装置が故障すると全体が通信できなくなります。
    why:
      - 正解です。中心の集線装置に放射状に接続します。
      - これはバス型の説明です。
      - これはリング型の説明です。
      - これはメッシュ型（フルメッシュ）の説明です。
    terms: [ネットワークトポロジ]

  - id: A10-014
    topic: 10-2-1-2
    diff: 2
    q: OSI 基本参照モデルのトランスポート層の役割として，適切なものはどれか。
    c:
      - 通信の両端のアプリケーション（プロセス）間で，データを確実に，または効率よく届けるための制御を行う。
      - 異なるネットワークを経由して，宛先のコンピュータまでの経路を選択する。
      - 隣接する機器どうしの間で，フレームを誤りなく転送する。
      - 電気信号や光信号の形式など，物理的な伝送の方式を定める。
    a: ア
    exp: |
      OSI 基本参照モデルは通信の機能を7つの層に分けたモデルです。トランスポート層（第4層）は、エンドツーエンドの通信の品質を確保する層で、データの誤りの回復、順序の制御、再送などを行います。TCP や UDP がこの層のプロトコルです。
    why:
      - 正解です。端と端の間の確実な（または効率的な）転送を担います。
      - 経路の選択はネットワーク層（第3層）の役割です（IP、ルータ）。
      - 隣接する機器間の転送はデータリンク層（第2層）の役割です（イーサネット、スイッチ）。
      - 物理的な伝送方式は物理層（第1層）が定めます。
    know: 上から アプリケーション層・プレゼンテーション層・セション層・トランスポート層・ネットワーク層・データリンク層・物理層 の7層です。
    terms: [OSI基本参照モデル, TCP]

  - id: A10-015
    topic: 10-2-2
    diff: 2
    q: WDM（波長分割多重）の説明として，適切なものはどれか。
    c:
      - 1本の光ファイバに，波長の異なる複数の光信号を同時に通して，伝送容量を増やす。
      - 伝送路の使用時間を細かく区切り，複数の通信に順番に割り当てる。
      - 複数の利用者に時間を区切って割り当て，同じ周波数を共有して無線通信する。
      - 通信ごとに異なる符号を使って，同じ周波数で同時に通信する。
    a: ア
    exp: |
      WDM（Wavelength Division Multiplexing）は、光の波長（色）の違いを利用して、1本の光ファイバで複数の信号を同時に送る多重化技術です。光ファイバの伝送容量を大幅に増やせるため、基幹通信網で使われています。
    why:
      - 正解です。波長の異なる光を多重化します。
      - これは時分割多重（TDM）の説明です。
      - これは時分割多元接続（TDMA）の説明です。
      - これは符号分割多元接続（CDMA）の説明です。
    terms: [TDM]

  - id: A10-016
    topic: 10-2-3
    diff: 2
    q: LAN 間接続装置のうち，受信したフレームの宛先 MAC アドレスを見て，そのフレームを転送するポートを決めるものはどれか。
    c: ['レイヤー2スイッチ（スイッチングハブ）', 'リピータ', 'ルータ', 'ゲートウェイ']
    a: ア
    exp: |
      レイヤー2スイッチ（スイッチングハブ）は、データリンク層で動作し、受信したフレームの宛先 MAC アドレスと、各ポートの先にある機器の MAC アドレスの対応表を照らし合わせて、必要なポートにだけフレームを転送します。ブリッジも同様にデータリンク層で動作します。
    why:
      - 正解です。MAC アドレスで転送先を決めるのはレイヤー2スイッチです。
      - リピータは物理層で動作し、信号を増幅・整形して中継するだけで、宛先は見ません。
      - ルータはネットワーク層で動作し、IP アドレスを基に経路を選択します。
      - ゲートウェイは、プロトコルの異なるネットワークを、トランスポート層以上で変換して接続します。
    know: レイヤー3スイッチは、ルータと同じくネットワーク層の機能（IP アドレスによる転送）をハードウェアで高速に処理するスイッチです。
    terms: [LAN間接続装置, MACアドレス]

  - id: A10-017
    topic: 10-2-3
    diff: 2
    q: リバースプロキシの説明として，適切なものはどれか。
    c:
      - Web サーバの手前に置かれ，インターネットからのアクセスを受けて Web サーバに中継することで，負荷分散やセキュリティの向上を図る。
      - 社内の端末の手前に置かれ，社内から外部の Web サイトへのアクセスを代理で行う。
      - ネットワーク上のループを検出して，特定のポートを停止する。
      - 端末に IP アドレスを自動で割り当てる。
    a: ア
    exp: |
      リバースプロキシは、Web サーバの前に置かれ、外部の利用者からの要求をいったん受け取ってから背後の Web サーバに転送するサーバです。Web サーバを直接外部にさらさずに済み、負荷分散、暗号化処理の肩代わり、キャッシュによる高速化などができます。
    why:
      - 正解です。サーバ側に置いて外部からのアクセスを中継します。
      - これは（フォワード）プロキシサーバの説明です。
      - これはスパニングツリープロトコルの説明です。
      - これは DHCP サーバの説明です。
    terms: [プロキシサーバ]

  - id: A10-018
    topic: 10-2-3
    diff: 3
    q: スイッチを複数台使って冗長な経路をもたせた LAN で，スパニングツリープロトコル（STP）を使う目的として，適切なものはどれか。
    c:
      - 経路のループによってフレームが無限に回り続けるのを防ぐため，一部のポートを論理的に遮断して，ループのない構成にする。
      - 通信を暗号化して，盗聴を防ぐ。
      - 複数の回線の帯域を束ねて，通信速度を上げる。
      - IP アドレスを MAC アドレスに変換する。
    a: ア
    exp: |
      スイッチ間を複数の経路で接続すると、ブロードキャストフレームが経路のループを回り続けて、ネットワークが麻痺してしまいます（ブロードキャストストーム）。スパニングツリープロトコルは、スイッチ同士が情報を交換して一部のポートを論理的に遮断し、ループのない木構造の経路を作ります。使用中の経路が故障したときは、遮断していたポートを使って経路を切り替えます。
    why:
      - 正解です。ループを防ぎつつ冗長性を確保します。
      - 暗号化は STP の目的ではありません。
      - 帯域を束ねるのはリンクアグリゲーションです。
      - IP アドレスから MAC アドレスを求めるのは ARP です。
    terms: [LAN間接続装置]

  - id: A10-019
    topic: 10-2-4
    diff: 2
    q: TCP のようなコネクション型の通信の特徴として，適切なものはどれか。
    c:
      - 通信の開始前に相手との間で接続を確立し，データの到達確認や再送によって信頼性の高い通信を行う。
      - 相手との接続を確立せずにデータを送り，到達の確認も行わない。
      - 1対多の同報通信に向いている。
      - データの順序の入替わりを検出しない。
    a: ア
    exp: |
      コネクション型の通信では、データを送る前に相手との間で接続（コネクション）を確立し（TCP では3ウェイハンドシェイク）、送ったデータに対する確認応答を受け取り、届かなかったデータは再送します。順序の入替えも正しく並べ直すため、信頼性が求められる Web やメールの通信に使われます。
    why:
      - 正解です。接続の確立と到達確認・再送が特徴です。
      - これはコネクションレス型（UDP など）の特徴です。
      - 1対多の同報通信には、コネクションレス型の UDP が向いています。
      - TCP は順序番号でデータの順序を管理します。
    terms: [TCP, UDP]

  - id: A10-020
    topic: 10-2-4
    diff: 2
    q: 伝送制御におけるフロー制御の説明として，適切なものはどれか。
    c:
      - 受信側の処理能力を超えないように，送信側がデータを送る量や速さを調整する。
      - データの誤りを検出して訂正する。
      - 宛先までの経路を選択する。
      - データを暗号化して送る。
    a: ア
    exp: |
      フロー制御は、受信側のバッファがあふれないように、送信側が送るデータ量や速度を調整する制御です。TCP ではウィンドウ制御により、受信側が受け入れられる量を通知し、送信側はその範囲でデータを送ります。
    why:
      - 正解です。受信側に合わせて送信量を調整します。
      - 誤りの検出・訂正は誤り制御です。
      - 経路の選択はルーティング制御です。
      - 暗号化はフロー制御ではありません。
    terms: [TCP]

  - id: A10-021
    topic: 10-2-4
    diff: 3
    q: HDLC 手順の特徴として，適切なものはどれか。
    c:
      - フラグと呼ばれる特定のビットパターンでフレームの始まりと終わりを示し，任意のビット列を効率よく伝送できる。
      - 伝送制御文字を使って，文字単位でデータを送る。
      - 1文字ごとにスタートビットとストップビットを付けて送る。
      - データの誤りの検出を一切行わない。
    a: ア
    exp: |
      HDLC（High-level Data Link Control）は、データリンク層の伝送制御手順で、フラグ（01111110）でフレームの開始と終了を示すビット指向の手順です。データの中にフラグと同じパターンが現れないよう、1 が5つ続いたら 0 を挿入する仕組み（ビットスタッフィング）を使い、任意のビット列を送れます。CRC による誤り検出や、連続して送る制御も備えています。
    why:
      - 正解です。フラグでフレームを区切るビット指向の手順です。
      - 伝送制御文字を使うのはベーシック手順です。
      - スタートビット・ストップビットを使うのは調歩同期方式です。
      - HDLC は CRC による誤り検出を行います。
    terms: [HDLC]

  - id: A10-022
    topic: 10-2-5
    diff: 2
    q: 無線 LAN で使われるメディアアクセス制御方式はどれか。
    c: ['CSMA/CA', 'CSMA/CD', 'トークンパッシング', 'ポーリング/セレクティング']
    a: ア
    exp: |
      CSMA/CA（Carrier Sense Multiple Access with Collision Avoidance）は、送信前に電波が使われていないかを確認し、空いていてもランダムな時間待ってから送信することで、衝突をあらかじめ避ける（回避する）方式です。無線では送信中に衝突を検出するのが難しいため、無線 LAN で使われています。
    why:
      - 正解です。無線 LAN は CSMA/CA を使います。
      - CSMA/CD は衝突を検出して再送する方式で、かつての有線のイーサネット（バス型・半二重）で使われました。
      - トークンパッシングは、送信権（トークン）を持つ端末だけが送信できる方式です。
      - ポーリング/セレクティングは、主局が従局に順に問い合わせて送受信を制御する方式です。
    terms: [CSMA/CA]

  - id: A10-023
    topic: 10-3-1-1
    diff: 2
    q: TCP/IP で，アプリケーションのデータが下位の層に渡されるときに行われることとして，適切なものはどれか。
    c:
      - 各層で，その層の制御情報（ヘッダー）がデータの前に付け加えられる（カプセル化）。
      - 各層で，データからヘッダーが取り除かれる。
      - 各層で，データが暗号化される。
      - 各層で，データが圧縮される。
    a: ア
    exp: |
      送信側では、アプリケーションのデータがトランスポート層、インターネット層、ネットワークインタフェース層へと順に渡され、各層でその層の処理に必要な情報（TCP ヘッダー、IP ヘッダー、イーサネットヘッダーなど）が付け加えられます。これをカプセル化といいます。受信側では逆に、各層で対応するヘッダーを取り除いて上の層に渡します。
    why:
      - 正解です。各層でヘッダーを付けるのがカプセル化です。
      - ヘッダーを取り除くのは受信側の処理です。
      - 暗号化は TLS などの特定のプロトコルの機能で、各層で必ず行われるわけではありません。
      - 圧縮も各層で必ず行われる処理ではありません。
    terms: [TCP/IP]

  - id: A10-024
    topic: 10-3-1-2
    diff: 2
    q: VLAN の説明として，適切なものはどれか。
    c:
      - 物理的な接続とは関係なく，スイッチの設定によって論理的に LAN を分割する技術
      - 公衆回線を使って，仮想的な専用線を作る技術
      - 無線 LAN の電波が届く範囲を広げる技術
      - IP アドレスを自動的に割り当てる技術
    a: ア
    exp: |
      VLAN（Virtual LAN）は、スイッチの設定によって、物理的な配線や設置場所に関係なく論理的に LAN を分ける技術です。部署ごとにネットワークを分けてブロードキャストの範囲を限定したり、セキュリティを高めたりできます。
    why:
      - 正解です。LAN を論理的に分割する技術です。
      - これは VPN の説明です。
      - これは中継器やメッシュ Wi-Fi の説明です。
      - これは DHCP の説明です。
    terms: [VLAN]

  - id: A10-025
    topic: 10-3-1-3
    diff: 2
    q: ネットワークアドレスが 192.168.1.0，サブネットマスクが 255.255.255.192（/26）のサブネットで，ホストに割り当てられる IP アドレスの数はいくつか。
    c: ['62', '64', '126', '30']
    a: ア
    exp: |
      /26 は先頭の 26 ビットがネットワーク部であることを表し、残りの 32−26＝6 ビットがホスト部です。ホスト部で表せるアドレスは 2⁶＝64 個ですが、ホスト部がすべて 0（ネットワークアドレス）とすべて 1（ブロードキャストアドレス）は割り当てられないため、64−2＝62 個です。
    why:
      - 正解です。2⁶−2＝62 個です。
      - 64 はネットワークアドレスとブロードキャストアドレスを除いていない値です。
      - 126 は /25（ホスト部 7 ビット）の場合の値です。
      - 30 は /27（ホスト部 5 ビット）の場合の値です。
    terms: [サブネットマスク, IPアドレス]
    verify: { value: '2 ** (32 - 26) - 2' }

  - id: A10-026
    topic: 10-3-1-3
    diff: 2
    q: IP アドレスが 172.16.10.5，サブネットマスクが 255.255.240.0 の端末が属するネットワークのネットワークアドレスはどれか。
    c: ['172.16.0.0', '172.16.10.0', '172.16.8.0', '172.16.16.0']
    a: ア
    exp: |
      ネットワークアドレスは、IP アドレスとサブネットマスクのビットごとの論理積で求めます。第3オクテットだけ計算すれば十分です。
      10 ＝ 00001010、240 ＝ 11110000 の論理積は 00000000 ＝ 0 です。第4オクテットはマスクが 0 なので 0 になります。
      よってネットワークアドレスは 172.16.0.0 です（このネットワークの範囲は 172.16.0.0〜172.16.15.255）。
    why:
      - 正解です。第3オクテットの論理積は 0 です。
      - 172.16.10.0 は、マスクを 255.255.255.0 とした場合のネットワークアドレスです。
      - 172.16.8.0 は、マスクを 255.255.248.0（/21）とした場合のネットワークアドレスです。
      - 172.16.16.0 は、次のネットワーク（172.16.16.0〜172.16.31.255）のアドレスです。
    terms: [サブネットマスク]
    verify: { manual: '10 AND 240 = 0 を2進数で確認。/21 なら 10 AND 248 = 8、/24 なら 10 になることも確認' }

  - id: A10-027
    topic: 10-3-1-3
    diff: 1
    q: サブネットマスク 255.255.255.224 を CIDR 表記の接頭辞長で表したものはどれか。
    c: ['/27', '/24', '/28', '/26']
    a: ア
    exp: |
      255.255.255.224 を2進数で表すと、11111111.11111111.11111111.11100000 です。先頭から 1 が 8＋8＋8＋3＝27 個続くので /27 です。
    why:
      - 正解です。1 のビットが 27 個です。
      - /24 は 255.255.255.0 です。
      - /28 は 255.255.255.240 です。
      - /26 は 255.255.255.192 です。
    know: CIDR は、クラスにとらわれずにネットワーク部の長さを自由に決める方式で、IP アドレスを無駄なく割り当てたり、複数の経路をまとめたりできます。
    terms: [サブネットマスク, CIDR]
    verify: { value: '24 + 3' }

  - id: A10-028
    topic: 10-3-1-3
    diff: 2
    q: ARP の説明として，適切なものはどれか。
    c:
      - 同じネットワーク内で，通信相手の IP アドレスからその MAC アドレスを求める。
      - ドメイン名から IP アドレスを求める。
      - 端末に IP アドレスを自動で割り当てる。
      - 通信の到達性を確認するためのエラーメッセージや制御メッセージを送る。
    a: ア
    exp: |
      ARP（Address Resolution Protocol）は、IP アドレスに対応する MAC アドレスを調べるプロトコルです。「この IP アドレスの機器はだれ？」とネットワーク全体にブロードキャストで問い合わせ、該当する機器が自分の MAC アドレスを答えます。イーサネットでフレームを送るには相手の MAC アドレスが必要なため、この仕組みが使われます。
    why:
      - 正解です。IP アドレスから MAC アドレスを求めます。
      - これは DNS の役割です。
      - これは DHCP の役割です。
      - これは ICMP の役割です（ping などで使用）。
    terms: [ARP, MACアドレス]

  - id: A10-029
    topic: 10-3-1-3
    diff: 2
    q: ping コマンドで相手の機器と通信できるかを確認するときに使われるプロトコルはどれか。
    c: ['ICMP', 'SNMP', 'NTP', 'SMTP']
    a: ア
    exp: |
      ping は、ICMP（Internet Control Message Protocol）のエコー要求を送り、相手からのエコー応答が返ってくるかで、通信できるかどうか（到達性）と往復の時間を確認するコマンドです。ICMP はネットワーク層のプロトコルで、通信の異常の通知などにも使われます。
    why:
      - 正解です。ping は ICMP を使います。
      - SNMP はネットワーク機器の管理に使うプロトコルです。
      - NTP は時刻を合わせるためのプロトコルです。
      - SMTP は電子メールを送信・転送するプロトコルです。
    terms: [ICMP]

  - id: A10-030
    topic: 10-3-1-3
    diff: 2
    q: IP の通信形態のうち，特定の複数の宛先（グループ）に対して同じデータを一度に送るものはどれか。
    c: ['マルチキャスト', 'ユニキャスト', 'ブロードキャスト', 'エニーキャスト']
    a: ア
    exp: |
      マルチキャストは、特定のグループに参加している複数の宛先に、同じデータを1回の送信で届ける通信です。動画のライブ配信などで、宛先ごとに送り直すより効率よく配信できます。
    why:
      - 正解です。特定のグループ宛ての同報通信です。
      - ユニキャストは、1つの宛先に送る1対1の通信です。
      - ブロードキャストは、同じネットワーク内のすべての機器に送る通信です。
      - エニーキャストは、同じアドレスをもつ複数の機器のうち、最も近い1台に届ける通信です。
    terms: [IPアドレス]

  - id: A10-031
    topic: 10-3-1-4
    diff: 1
    q: HTTPS（HTTP over TLS）で一般的に用いられるポート番号はどれか。
    c: ['443', '80', '25', '53']
    a: ア
    exp: |
      ポート番号は、通信相手のコンピュータ上のどのアプリケーション（サービス）宛ての通信かを識別するための番号です。よく使われるサービスには決まった番号（ウェルノウンポート）が割り当てられており、HTTPS は 443 番です。
    why:
      - 正解です。HTTPS は 443 番です。
      - 80 番は HTTP です。
      - 25 番は SMTP（メールの送信・転送）です。
      - 53 番は DNS です。
    know: 主なウェルノウンポート：FTP 20/21、SSH 22、SMTP 25、DNS 53、HTTP 80、POP3 110、IMAP 143、HTTPS 443。
    terms: [ポート番号, HTTPS]

  - id: A10-032
    topic: 10-3-1-4
    diff: 2
    q: UDP の特徴として，適切なものはどれか。
    c:
      - コネクションを確立せず，到達確認や再送を行わないので，処理が軽く，リアルタイム性が求められる音声や動画の通信に向く。
      - 到達確認と再送によって，データを確実に届ける。
      - データの順序を必ず送信した順に並べ直して届ける。
      - ネットワーク層のプロトコルで，経路の選択を行う。
    a: ア
    exp: |
      UDP（User Datagram Protocol）は、トランスポート層のコネクションレス型のプロトコルです。接続の確立、到達確認、再送、順序制御を行わないため信頼性は TCP より低いものの、処理が軽く遅延が小さいため、IP 電話、動画配信、DNS の問合せなどに使われます。
    why:
      - 正解です。軽量でリアルタイム性の高い通信に向きます。
      - これは TCP の特徴です。
      - 順序の並べ直しは TCP が行います。
      - UDP はトランスポート層のプロトコルです。経路の選択は IP（ネットワーク層）の役割です。
    terms: [UDP, TCP]

  - id: A10-033
    topic: 10-3-1-5
    diff: 1
    q: DHCP の説明として，適切なものはどれか。
    c:
      - ネットワークに接続した端末に，IP アドレスやデフォルトゲートウェイなどの設定情報を自動的に割り当てる。
      - ドメイン名と IP アドレスを対応付ける。
      - ネットワーク上の機器の時刻を合わせる。
      - メールサーバに保存されたメールを読み出す。
    a: ア
    exp: |
      DHCP（Dynamic Host Configuration Protocol）は、端末がネットワークに接続したときに、DHCP サーバから IP アドレス、サブネットマスク、デフォルトゲートウェイ、DNS サーバのアドレスなどを自動的に割り当てるプロトコルです。手作業の設定の手間と誤りを減らせます。
    why:
      - 正解です。IP アドレスなどを自動で割り当てます。
      - これは DNS の役割です。
      - これは NTP の役割です。
      - これは POP3 や IMAP の役割です。
    terms: [DHCP]

  - id: A10-034
    topic: 10-3-1-5
    diff: 2
    q: 電子メールの受信に用いるプロトコルのうち，メールをサーバ上に保存したまま管理し，複数の端末から同じメールボックスを参照するのに適したものはどれか。
    c: ['IMAP', 'POP3', 'SMTP', 'MIME']
    a: ア
    exp: |
      IMAP（Internet Message Access Protocol）は、メールをサーバ上に保存したまま、フォルダの管理や既読の状態の管理をサーバ側で行うプロトコルです。パソコンとスマートフォンなど複数の端末から、同じ状態のメールボックスを参照できます。
    why:
      - 正解です。サーバ上でメールを管理するのは IMAP です。
      - POP3 は、メールを端末にダウンロードして読む方式が基本で、複数の端末で同じ状態を共有するのには向きません。
      - SMTP はメールの送信・転送に使うプロトコルです。
      - MIME は、メールで日本語や添付ファイルを扱うための規格で、受信のプロトコルではありません。
    terms: [電子メールのプロトコル]

  - id: A10-035
    topic: 10-3-1-5
    diff: 3
    q: HTTP/3 の特徴として，適切なものはどれか。
    c:
      - トランスポート層に UDP を基にした QUIC を用いることで，接続確立の遅延を減らし，パケット損失の影響を受けにくくしている。
      - テキスト形式で1つの接続につき1つの要求しか送れない。
      - 通信内容の暗号化を一切行わない。
      - 電子メールの送信に用いられるプロトコルである。
    a: ア
    exp: |
      HTTP/3 は、TCP の代わりに UDP 上で動作する QUIC というプロトコルを使う HTTP の版です。QUIC は暗号化（TLS 1.3）を組み込み、接続の確立を短縮し、1つのデータの損失が他のデータの転送を止めにくい仕組みをもつため、特にモバイル環境で高速に通信できます。HTTP/2 は、1つの TCP 接続で複数の要求・応答を並行して扱える（多重化）版です。
    why:
      - 正解です。QUIC（UDP ベース）を使うのが HTTP/3 の特徴です。
      - 1つの接続で1つの要求しか送れないのは古い HTTP/1.0 の特徴です。
      - QUIC は暗号化を前提としています。
      - HTTP は Web の通信に使うプロトコルです。
    terms: [HTTP]

  - id: A10-036
    topic: 10-3-1-5
    diff: 1
    q: NTP の役割として，適切なものはどれか。
    c: ['ネットワーク上の機器の時刻を正確な時刻に同期させる。', 'ネットワーク機器の状態を監視する。', '端末に IP アドレスを割り当てる。', 'ファイルをサーバとの間で転送する。']
    a: ア
    exp: |
      NTP（Network Time Protocol）は、ネットワークを通じて時刻サーバから正確な時刻を取得し、機器の時計を同期させるプロトコルです。ログの時刻がそろっていないと、障害やセキュリティ事故の調査で出来事の順序を正しく追えなくなるため、時刻の同期は重要です。
    why:
      - 正解です。時刻を同期させるプロトコルです。
      - 機器の状態の監視は SNMP の役割です。
      - IP アドレスの割当ては DHCP の役割です。
      - ファイルの転送は FTP などの役割です。
    terms: [NTP]

  - id: A10-037
    topic: 10-3-1-6
    diff: 2
    q: 無線 LAN の規格 IEEE 802.11ax の通称はどれか。
    c: ['Wi-Fi 6', 'Wi-Fi 4', 'Wi-Fi 5', 'Bluetooth 5']
    a: ア
    exp: |
      Wi-Fi Alliance は、無線 LAN の規格に分かりやすい世代名を付けています。IEEE 802.11n が Wi-Fi 4、802.11ac が Wi-Fi 5、802.11ax が Wi-Fi 6 です（6GHz 帯にも対応したものが Wi-Fi 6E）。Wi-Fi 6 は、多数の端末が同時に接続する環境での効率が向上しています。
    why:
      - 正解です。802.11ax は Wi-Fi 6 です。
      - Wi-Fi 4 は IEEE 802.11n です。
      - Wi-Fi 5 は IEEE 802.11ac です。
      - Bluetooth は無線 LAN（IEEE 802.11）とは別の規格です。
    terms: [無線LAN]

  - id: A10-038
    topic: 10-3-1-6
    diff: 1
    q: 有線 LAN の規格 1000BASE-T の説明として，適切なものはどれか。
    c: ['より対線（ツイストペアケーブル）を使って，最大 1G ビット/秒で通信する。', '光ファイバを使って，最大 10G ビット/秒で通信する。', '同軸ケーブルを使って，最大 10M ビット/秒で通信する。', '電波を使って，最大 1G ビット/秒で通信する。']
    a: ア
    exp: |
      イーサネットの規格名は「伝送速度＋BASE（ベースバンド方式）＋媒体」で表します。1000BASE-T は、1000M ビット/秒（1G ビット/秒）で、T（Twisted pair：より対線）を使う規格です。100BASE-TX は 100M ビット/秒、10GBASE-T は 10G ビット/秒です。
    why:
      - 正解です。より対線で 1G ビット/秒です。
      - 10G ビット/秒の光ファイバの規格は 10GBASE-SR などです。
      - 同軸ケーブルで 10M ビット/秒は 10BASE5 や 10BASE2 などの古い規格です。
      - 電波を使うのは無線 LAN（IEEE 802.11）です。
    terms: [イーサネット]

  - id: A10-039
    topic: 10-3-1-7
    diff: 3
    q: CORBA の説明として，適切なものはどれか。
    c:
      - ネットワーク上に分散したオブジェクトどうしが，プログラム言語や OS の違いを超えて連携するための仕様
      - Web ページの見た目を指定するための言語
      - データベースを操作するための標準言語
      - 電子メールで添付ファイルを扱うための規格
    a: ア
    exp: |
      CORBA（Common Object Request Broker Architecture）は、OMG が定めた分散オブジェクト技術の仕様です。ネットワーク上の異なるコンピュータにあるオブジェクトを、ORB（Object Request Broker）が仲介することで、言語や OS の違いを意識せずに呼び出せるようにします。
    why:
      - 正解です。分散オブジェクトの連携の仕様です。
      - これは CSS の説明です。
      - これは SQL の説明です。
      - これは MIME の説明です。
    terms: [コンポーネントウェア]

  - id: A10-040
    topic: 10-4-1-1
    diff: 2
    q: SDN（Software-Defined Networking）の説明として，適切なものはどれか。
    c:
      - ネットワーク機器の制御機能とデータ転送機能を分離し，ソフトウェアで集中的にネットワーク全体の構成や経路を制御する。
      - ネットワーク機器ごとに管理者が手作業で設定を行う。
      - ネットワークを使わずにデータを記録媒体で運ぶ。
      - 無線 LAN の電波の強さを自動的に調整する。
    a: ア
    exp: |
      SDN は、ネットワーク機器のうち経路などを決める制御機能（コントロールプレーン）と、実際にデータを転送する機能（データプレーン）を分け、制御をソフトウェア（コントローラー）で一元的に行う考え方です。ネットワークの構成変更を、プログラムから柔軟かつ迅速に行えます。OpenFlow は、コントローラーと機器の間の代表的なプロトコルです。
    why:
      - 正解です。制御と転送を分離し、ソフトウェアで集中制御します。
      - 機器ごとの手作業の設定は、SDN が解決しようとする従来の方法です。
      - 記録媒体の輸送はネットワークの制御ではありません。
      - 電波の調整は無線 LAN の機能で、SDN の定義ではありません。
    know: NFV（Network Functions Virtualization）は、ファイアウォールやルータなどのネットワーク機能を、専用機器ではなく汎用サーバ上のソフトウェアとして動かす技術です。
    terms: [SDN]

  - id: A10-041
    topic: 10-4-1-2
    diff: 2
    q: ネットワークの障害管理の一環として行う死活監視の説明として，適切なものはどれか。
    c:
      - 監視対象の機器に定期的に ping などで問い合わせ，応答の有無で稼働しているかを確認する。
      - 通信量を測定して，回線の混雑状況を把握する。
      - 機器の設定やソフトウェアのバージョンを記録する。
      - 利用者ごとの通信料金を集計する。
    a: ア
    exp: |
      死活監視は、サーバやネットワーク機器が正常に動いているかを、定期的な応答確認（ping など）によって監視することです。応答がなくなったら管理者に通知し、障害の切分け・原因の特定・復旧を進めます。
    why:
      - 正解です。応答の有無で稼働を確認します。
      - これは性能管理（トラフィック監視）の活動です。
      - これは構成管理の活動です。
      - これは課金管理の活動です。
    terms: [ネットワーク管理]

  - id: A10-042
    topic: 10-4-1-3
    diff: 2
    q: ネットワークの性能管理で行う活動として，最も適切なものはどれか。
    c:
      - 回線や機器のトラフィック量や使用率を継続的に監視し，混雑の発生や将来の増強の必要性を把握する。
      - ネットワーク機器の故障を検知し，代替機に交換する。
      - ネットワークに接続する機器の一覧と配置図を作成する。
      - 不正なアクセスを検知して遮断する。
    a: ア
    exp: |
      性能管理は、ネットワークの通信量（トラフィック）、応答時間、機器の負荷などを継続的に測定・分析し、必要な性能が保たれているかを確認する活動です。測定結果は、回線や機器の増強計画にも利用します。
    why:
      - 正解です。トラフィックの監視は性能管理の活動です。
      - 故障への対応は障害管理の活動です。
      - 機器の一覧や配置図の作成は構成管理の活動です。
      - 不正アクセスへの対応はセキュリティ管理の活動です。
    terms: [ネットワーク管理]

  - id: A10-043
    topic: 10-4-2
    diff: 2
    q: 宛先の機器までにパケットが経由するルータを順に表示し，どこで通信が途切れているかを調べるのに用いるコマンドはどれか。
    c: ['traceroute（tracert）', 'ping', 'netstat', 'arp']
    a: ア
    exp: |
      traceroute（Windows では tracert）は、IP ヘッダーの TTL の値を1から順に増やしてパケットを送り、途中のルータから返る ICMP のメッセージを基に、宛先までの経路上のルータを順に表示するコマンドです。どのルータまで届いているかで、障害の発生箇所を絞り込めます。
    why:
      - 正解です。経路上のルータを順に表示します。
      - ping は相手と通信できるかを確認するだけで、途中の経路は表示しません。
      - netstat は、自分の機器の通信の接続状況やポートの状態を表示します。
      - arp は、IP アドレスと MAC アドレスの対応表（ARP テーブル）を表示・操作します。
    know: dig（または nslookup）は DNS への問合せ結果を表示し、名前解決の問題を調べるのに使います。ip や ifconfig は自分の機器のネットワークインタフェースの設定を表示します。
    terms: [ネットワーク管理, ICMP]

  - id: A10-044
    topic: 10-4-3
    diff: 2
    q: SNMP の説明として，適切なものはどれか。
    c:
      - ネットワーク機器の状態や設定情報（MIB）を，管理ステーションと機器上のエージェントの間でやり取りして監視・管理するプロトコル
      - 電子メールをメールサーバ間で転送するプロトコル
      - 機器の時刻を同期させるプロトコル
      - 端末に IP アドレスを割り当てるプロトコル
    a: ア
    exp: |
      SNMP（Simple Network Management Protocol）は、ルータやスイッチなどのネットワーク機器を監視・管理するためのプロトコルです。各機器の SNMP エージェントが MIB（管理情報ベース）に状態を保持し、SNMP 管理ステーションが定期的に情報を収集します。異常が起きたときにエージェント側から通知する仕組み（トラップ）もあります。
    why:
      - 正解です。機器の監視・管理に使うプロトコルです。
      - これは SMTP の説明です。
      - これは NTP の説明です。
      - これは DHCP の説明です。
    terms: [SNMP]

  - id: A10-045
    topic: 10-4-4
    diff: 2
    q: トンネリングの説明として，適切なものはどれか。
    c:
      - あるプロトコルのパケットを，別のプロトコルのパケットの中に包んで（カプセル化して）送ることで，仮想的な通信路を作る技術
      - データを圧縮して通信量を減らす技術
      - 無線の電波を壁の向こうまで届ける技術
      - 通信を一時的に止めて，ネットワークの負荷を下げる技術
    a: ア
    exp: |
      トンネリングは、通信したいパケットを別のプロトコルのパケットの中に入れて運ぶことで、本来は直接つながっていないネットワークの間に仮想的な通信路（トンネル）を作る技術です。VPN では、トンネリングと暗号化を組み合わせて、インターネット上に安全な専用線のような通信路を作ります。
    why:
      - 正解です。カプセル化で仮想的な通信路を作る技術です。
      - 圧縮はトンネリングの目的ではありません。
      - 電波の到達範囲とは関係ありません。
      - 通信の一時停止とは関係ありません。
    terms: [VPN]

  - id: A10-046
    topic: 10-5-1-1
    diff: 2
    q: 電子メールで，日本語の本文や画像などの添付ファイルを送れるようにするための規格はどれか。
    c: ['MIME', 'SMTP', 'POP3', 'DNS']
    a: ア
    exp: |
      もともとの電子メールは英数字（7ビットの ASCII）のテキストしか送れませんでした。MIME（Multipurpose Internet Mail Extensions）は、メールで日本語や画像・音声などのさまざまなデータを扱えるように、データの種類の指定や符号化の方法を定めた規格です。
    why:
      - 正解です。添付ファイルなどを扱うための規格は MIME です。
      - SMTP はメールを送信・転送するプロトコルです。
      - POP3 はメールを受信するプロトコルです。
      - DNS はドメイン名を IP アドレスに変換する仕組みです。
    know: S/MIME は、MIME に暗号化と電子署名の機能を加えた規格です。
    terms: [電子メールのプロトコル]

  - id: A10-047
    topic: 10-5-1-2
    diff: 2
    q: Web の cookie の説明として，適切なものはどれか。
    c:
      - Web サーバの指示でブラウザに保存される小さなデータで，ログイン状態の維持や利用者の識別などに使われる。
      - Web ページを高速に表示するために，サーバ側に保存する画像データである。
      - Web サーバとブラウザの間の通信を暗号化する仕組みである。
      - Web ページのアドレスを表す文字列である。
    a: ア
    exp: |
      cookie は、Web サーバがブラウザに保存させる小さなテキストデータで、次回以降のアクセス時にブラウザからサーバに送られます。HTTP はもともと要求ごとに独立した通信なので、cookie にセッション ID などを保存して、ログイン状態やカートの中身を維持するのに使います。
    why:
      - 正解です。ブラウザに保存されて状態の維持に使われます。
      - cookie はブラウザ側に保存されます。
      - 通信の暗号化は TLS（HTTPS）の役割です。
      - Web ページのアドレスは URL です。
    know: セッション ID が盗まれるとなりすまし（セッションハイジャック）に悪用されるため、cookie には Secure 属性（HTTPS でだけ送る）や HttpOnly 属性（スクリプトから読めない）を付けます。
    terms: [cookie, HTTP]

  - id: A10-048
    topic: 10-5-1-3
    diff: 3
    q: FTP のパッシブモードの説明として，適切なものはどれか。
    c:
      - データ転送用のコネクションを，クライアントからサーバに向けて確立する。
      - データ転送用のコネクションを，サーバからクライアントに向けて確立する。
      - 制御用とデータ転送用のコネクションを1つにまとめる。
      - ファイルを暗号化して転送する。
    a: ア
    exp: |
      FTP は、制御用とデータ転送用の2つのコネクションを使います。アクティブモードでは、データ転送用のコネクションをサーバからクライアントに向けて確立しますが、クライアント側のファイアウォールや NAT に遮断されやすい問題があります。パッシブモードでは、データ転送用のコネクションもクライアントからサーバに向けて確立するため、この問題を避けられます。
    why:
      - 正解です。パッシブモードではクライアントからデータ用の接続を張ります。
      - これはアクティブモードの説明です。
      - FTP は制御用とデータ用のコネクションを別々に使います。
      - FTP 自体には暗号化の機能はありません。暗号化するには FTPS や SFTP などを使います。
    terms: [FTP]

  - id: A10-049
    topic: 10-5-1-4
    diff: 2
    q: ロボット型（クローラー型）検索エンジンの説明として，適切なものはどれか。
    c:
      - クローラーと呼ばれるプログラムが Web ページを自動的に巡回して収集し，索引を作成して検索に用いる。
      - 人が Web サイトを審査して，分野別のディレクトリに登録する。
      - 利用者の端末の中のファイルだけを検索する。
      - 検索のたびに，すべての Web サイトに同時に問い合わせる。
    a: ア
    exp: |
      ロボット型検索エンジンは、クローラー（ロボット、スパイダー）が Web 上のページのリンクをたどって自動的に巡回し、ページの内容を収集して索引（インデックス）を作っておき、検索のときはその索引から該当するページを探します。人がサイトを分類して登録する方式はディレクトリ型といいます。
    why:
      - 正解です。自動巡回で収集した索引を使います。
      - これはディレクトリ型検索エンジンの説明です。
      - これはデスクトップ検索の説明です。
      - 検索のたびにすべてのサイトに問い合わせることは現実的ではありません。
    terms: [検索エンジン]

  - id: A10-050
    topic: 10-5-2
    diff: 2
    q: インターネット VPN の説明として，適切なものはどれか。
    c:
      - インターネット上に暗号化した仮想的な専用の通信路を作り，拠点間や外出先からの社内ネットワークへの接続を安全に行う。
      - 物理的な専用線を拠点間に敷設して接続する。
      - 社内のネットワークを，物理的な配線に関係なく論理的に分割する。
      - 無線 LAN の通信範囲を広げる。
    a: ア
    exp: |
      インターネット VPN は、インターネットを経由しながら、IPsec や SSL/TLS によるトンネリングと暗号化で、あたかも専用線でつながっているかのような安全な通信路を作る技術です。専用線より安価に、拠点間の接続やテレワークでの社内ネットワークへの接続を実現できます。
    why:
      - 正解です。インターネット上に暗号化した仮想的な通信路を作ります。
      - これは専用線の説明です。
      - これは VLAN の説明です。
      - 無線 LAN の範囲の拡大は VPN の目的ではありません。
    know: 通信事業者の閉じた IP 網を使う IP-VPN は、インターネットを経由しないため、インターネット VPN より品質や安全性が高い一方、費用は高くなります。
    terms: [VPN]

  - id: A10-051
    topic: 10-5-3
    diff: 2
    q: EDI の説明として，適切なものはどれか。
    c:
      - 企業間で，受発注や請求などの取引のデータを，標準化された形式で電子的に交換する。
      - 社内の文書を，紙からスキャンして電子化する。
      - 消費者に向けて，インターネット上の店舗で商品を販売する。
      - 社内の利用者だけがアクセスできる Web サイトを構築する。
    a: ア
    exp: |
      EDI（Electronic Data Interchange：電子データ交換）は、企業間の取引に必要なデータ（注文書、請求書、納品書など）を、あらかじめ取り決めた標準的な形式で、ネットワークを通じて交換する仕組みです。紙の書類の作成・郵送・再入力の手間と誤りを減らせます。EDI のように、取引先など特定の外部の組織にだけ社内ネットワークの一部を開放して情報を共有する形態をエクストラネットといいます。
    why:
      - 正解です。企業間の取引データの電子的な交換です。
      - 文書の電子化は EDI ではありません。
      - 消費者向けのネット販売は B to C の EC です。
      - 社内専用の Web サイトはイントラネットです。
    terms: [EDI]

  - id: A10-052
    topic: 10-5-4
    diff: 2
    q: ネットワーク OS（サーバ OS）が提供する代表的な機能として，適切なものはどれか。
    c:
      - ネットワーク上の複数の利用者に，ファイルやプリンターの共有，利用者の認証などのサービスを提供する。
      - 1台のコンピュータで，1人の利用者が文書作成を行う機能だけを提供する。
      - インターネットへの接続を完全に遮断する。
      - 通信回線を物理的に敷設する。
    a: ア
    exp: |
      ネットワーク OS は、ネットワークでつながった多数の利用者や端末に対して、ファイル共有、プリンター共有、利用者の認証・アクセス権の管理、ディレクトリサービスなどの機能を提供する OS です。サーバ用の OS がこの役割を担います。
    why:
      - 正解です。ネットワーク上の利用者に共有の機能を提供します。
      - 1人の利用者向けの機能だけでは、ネットワーク OS の説明になりません。
      - 接続の遮断はネットワーク OS の役割ではありません。
      - 回線の敷設は OS の機能ではありません。
    terms: [ネットワーク管理]

  - id: A10-053
    topic: 10-5-5
    diff: 2
    q: 広域イーサネットの説明として，適切なものはどれか。
    c:
      - 通信事業者のネットワークを介して，離れた拠点の LAN どうしをイーサネットのまま（レイヤー2で）接続するサービス
      - 家庭まで光ファイバを引き込んで高速なインターネット接続を提供するサービス
      - 通信衛星を中継して通信するサービス
      - 携帯電話の回線を使ってパソコンをインターネットに接続する機能
    a: ア
    exp: |
      広域イーサネットは、通信事業者の網を使って、遠く離れた拠点の LAN を、同じ LAN にあるかのようにイーサネット（データリンク層）で接続するサービスです。IP 以外のプロトコルも使え、ネットワークの構成を自由に設計できます。IP-VPN はネットワーク層（IP）で接続するサービスです。
    why:
      - 正解です。拠点の LAN をレイヤー2で接続するサービスです。
      - これは FTTH の説明です。
      - これは衛星通信サービスの説明です。
      - これはテザリングの説明です。
    terms: [VPN]

  - id: A10-054
    topic: 10-5-6-1
    diff: 2
    q: 第5世代移動通信システム（5G）の特徴として，適切なものはどれか。
    c:
      - 高速・大容量，低遅延，多数の機器の同時接続という特徴をもち，IoT や遠隔操作などへの活用が期待されている。
      - 音声通話専用の通信方式で，データ通信はできない。
      - 通信速度は 4G より遅いが，通信距離が非常に長い。
      - 有線 LAN の規格である。
    a: ア
    exp: |
      5G は、超高速・大容量、超低遅延、多数同時接続の3つを主な特徴とする移動通信システムです。高精細な動画の配信だけでなく、自動運転や遠隔医療、工場の機械の制御、大量のセンサーの接続などへの活用が期待されています。企業などが自社の敷地内で構築するものはローカル 5G といいます。
    why:
      - 正解です。高速・低遅延・多数同時接続が特徴です。
      - 5G はデータ通信を中心とした通信方式です。
      - 5G は 4G より高速です。低速で長距離の通信が特徴なのは LPWA です。
      - 5G は無線の移動通信システムです。
    know: 自社で回線設備をもたず、移動体通信事業者（MNO）の回線を借りてサービスを提供する事業者を MVNO といいます。複数の周波数帯を束ねて高速化する技術をキャリアアグリゲーションといいます。
    terms: [5G, MVNO]

  - id: A10-055
    topic: 10-5-6-2
    diff: 1
    q: テザリングの説明として，適切なものはどれか。
    c:
      - スマートフォンなどのモバイル回線を利用して，パソコンなどの他の機器をインターネットに接続する。
      - 移動中に通信する基地局を，通信を途切れさせずに切り替える。
      - 契約している事業者のサービス区域外で，提携する他の事業者の設備を使って通信する。
      - 複数のアンテナを使って，通信速度を向上させる。
    a: ア
    exp: |
      テザリングは、スマートフォンなどを無線 LAN のアクセスポイントや USB 接続のモデムのように使い、そのモバイル回線を通じてパソコンやタブレットをインターネットに接続する機能です。
    why:
      - 正解です。スマートフォンの回線を他の機器と共有します。
      - これはハンドオーバーの説明です。
      - これはローミングの説明です。
      - これは MIMO の説明です。
    terms: [テザリング]

  - id: A10-056
    topic: 10-5-6-3
    diff: 2
    q: LPWA（Low Power Wide Area）の特徴として，適切なものはどれか。
    c:
      - 消費電力が小さく，数 km 以上の広い範囲で通信できる無線通信技術で，通信速度は低いが，多数のセンサーなどの IoT 機器の接続に向いている。
      - 通信速度は非常に速いが，通信距離は数 cm に限られる。
      - 大容量の動画を配信するために開発された有線の通信技術である。
      - 衛星を使って地球全体をカバーする放送技術である。
    a: ア
    exp: |
      LPWA は、低消費電力で広い範囲（数 km〜数十 km）をカバーする無線通信技術の総称です。通信速度は低いものの、電池で長期間動作でき、少量のデータを送る IoT 機器（水道メーター、環境センサー、物流の追跡など）に適しています。
    why:
      - 正解です。低消費電力・広範囲・低速が特徴です。
      - 数 cm の近距離通信は NFC などです。
      - LPWA は無線の技術で、動画配信用でもありません。
      - 衛星による放送技術ではありません。
    know: ハンドオーバーは移動中に接続する基地局を切り替えること、ローミングは契約外の事業者の設備を使って通信すること、MIMO は複数のアンテナで通信を高速化する技術です。
    terms: [LPWA]

  - id: A10-057
    topic: 10-1-1
    diff: 1
    q: ISP（インターネットサービスプロバイダ）の役割として，適切なものはどれか。
    c:
      - 利用者や企業に，インターネットへの接続サービスを提供する。
      - Web ブラウザなどのソフトウェアを開発して販売する。
      - ドメイン名の国際的な規則を定める。
      - 家庭内の LAN の配線工事だけを行う。
    a: ア
    exp: |
      ISP（Internet Service Provider）は、利用者や企業をインターネットに接続するサービスを提供する事業者です。接続サービスのほか、メールアドレスの提供、Web サイトの公開場所の提供などを行う事業者もあります。料金体系には、使った分だけ払う従量制と、毎月一定額の月額固定料金などがあります。
    why:
      - 正解です。インターネットへの接続サービスを提供します。
      - ソフトウェアの開発・販売は ISP の役割ではありません。
      - ドメイン名などの国際的な管理は ICANN などの組織が行います。
      - 配線工事だけを行うのは ISP の役割ではありません。
    terms: [パケット交換]

  - id: A10-058
    topic: 10-3-1-2
    diff: 3
    q: PPPoE の説明として，適切なものはどれか。
    c:
      - 1対1の接続のためのプロトコルである PPP を，イーサネット上で利用できるようにしたもので，利用者の認証を行ってインターネットに接続する。
      - IP パケットをイーサネットでそのまま送り，PPP の認証の手順を使わない接続方式である。
      - 無線 LAN のアクセスポイントどうしを接続するプロトコルである。
      - 電子メールを暗号化するプロトコルである。
    a: ア
    exp: |
      PPPoE（PPP over Ethernet）は、ダイヤルアップ接続で使われていた PPP（Point to Point Protocol）を、イーサネット上で使えるようにしたプロトコルです。ユーザー名とパスワードで認証してから接続するため、光回線などでの ISP への接続に使われてきました。一方、IPoE（IP over Ethernet）は、PPP を使わずに IP パケットをイーサネットで直接送る方式で、混雑しやすい装置を経由しないため高速な通信が期待できます。
    why:
      - 正解です。PPP をイーサネット上で使えるようにしたものです。
      - これは IPoE の説明です。
      - アクセスポイント間の接続のプロトコルではありません。
      - メールの暗号化は S/MIME などの役割です。
    terms: [PPPoE]
