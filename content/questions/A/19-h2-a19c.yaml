questions:
  - id: A19-518
    topic: 19-1-3-1
    diff: 3
    scope: 19-1-3-1 イノベーションのジレンマ。優位な既存事業を持つ企業が、破壊的技術への対応で遅れる構造の判断
    prereq: 破壊的技術は、当初は性能が劣り既存の顧客には評価されないが、別の市場で育ち、やがて既存製品を置き換えること、既存事業の収益構造が対応を遅らせること
    hard: 技術の優劣ではなく、既存顧客と収益構造が新しい技術への投資判断を歪める、という構造の理解が問われる。
    q: |
      ある大手メーカは、高性能で高価格の主力製品で高いシェアを持つ。新興企業が、性能は劣るが小型で安価な新技術の製品を、従来とは別の顧客層に向けて売り始めた。主力製品の顧客は新技術に興味を示さず、社内では「性能の劣る技術に投資する理由がない」と判断され、対応が進まなかった。数年後、新技術の性能が向上し、主力製品の市場を侵食し始めた。この一連の構造を表す概念として、適切なものはどれか。
    c:
      - イノベーションのジレンマ
      - 経験曲線効果
      - ネットワーク効果
      - コモディティ化
    a: ア
    exp: |
      イノベーションのジレンマは、優良な企業が、既存顧客の声を聞き既存事業に資源を集中するほど、破壊的技術への対応が遅れて市場を失う、という構造を指します。本件では、性能が劣り既存顧客に評価されない新技術が、別の顧客層で育ち、性能向上とともに既存市場を侵食しており、この構造に一致します。既存事業が順調であること自体が、対応を遅らせる要因になっている点が本質です。
    why:
      - 正解です。既存顧客と収益構造が、破壊的技術への対応を遅らせる構造です。
      - 経験によって単位当たりコストが下がる効果の話であり、新技術への対応の遅れの構造とは別の概念です。
      - 利用者が増えるほど価値が高まる効果の話であり、本件の「対応が遅れる構造」とは異なります。
      - 差別化が失われ、価格だけの競争になる現象であり、本件の中心は、侵食してくる新技術への対応の遅れです。
    know: イノベーションのジレンマは、技術の善し悪しではなく、投資判断の構造の問題である。既存顧客に評価されないことと、将来の脅威であることが、両立する点が要点である。
    terms: [イノベーションのジレンマ, 破壊的技術]
    verify:
      manual: 事例の要素（高性能な主力製品、性能が劣るが安価な新技術、別の顧客層、既存顧客の無関心、社内の投資否定、後の侵食）が、イノベーションのジレンマの構造と一致すること、他の選択肢の概念では説明できないことを確認した。

  - id: A19-519
    topic: 19-3-2
    diff: 3
    scope: 19-3-2 フリーミアムの収益計算。無料会員の規模と有料への転換率、月額単価から、月間の売上を計算する問題
    prereq: 有料会員数は無料会員数 × 転換率、売上は有料会員数 × 単価で求めること
    hard: 3つの数値の掛け算の構造であり、転換率を「無料会員に対する割合」として適用する位置を取り違えない必要がある。
    q: |
      無料会員 20 万人のサービスの有料プランは、月額 1,500 円で、無料会員の 3 ％が有料プランに転換している。月間の売上は何万円か。
    c: ['450', '900', '3,000', '9,000']
    a: イ
    exp: |
      有料会員数は、20 万人 × 3 ％ ＝ 6,000 人です。

      月間の売上 ＝ 6,000 人 × 1,500 円 ＝ 900 万円

      フリーミアムでは、無料会員の規模と転換率の積が、そのまま収益の土台になります。間違えやすいのは、転換率を有料会員に対する割合と読み違える点と、百分率の換算（3 ％ ＝ 0.03）を誤る点です。売上の見積もりでは、母数・転換率・単価の3要素を分けて確認します。
    why:
      - 転換率を 1.5 ％として計算した場合の値です。本問の転換率は 3 ％です。
      - 正解です。有料会員 6,000 人 × 1,500 円 ＝ 900 万円です。
      - 転換率を 10 ％として計算した場合の値です。本問の転換率は 3 ％です。
      - 転換率を 30 ％として計算した場合の値です。本問は 3 ％であり、桁が異なります。
    know: フリーミアムの計算は、母数（無料会員）× 転換率 × 単価という3要素の積である。転換率の改善が売上に比例して効く構造も、読み取れる。
    terms: [フリーミアム, 転換率]
    verify: { type: value, value: 900 }

  - id: A19-520
    topic: 19-2-1-1
    diff: 3
    scope: 19-2-1-1 ポジショニング。市場の細分化と標的市場の選定の後に、顧客の認識の中で自社製品の位置を決める活動の判断
    prereq: STP は、セグメンテーション（市場の細分化）、ターゲティング（標的市場の選定）、ポジショニング（位置付け）の順に進むこと
    hard: 3つの段階のうち、事例がどの段階の話をしているかを、活動の内容から切り分ける必要がある。
    q: |
      ある飲料メーカは、市場を年代と嗜好で細分化し、その中から「健康志向の働く世代」を標的市場に選んだ。次に、この層の顧客に対して、競合製品との違いが「低糖質でありながら満足感のある味」であることを認識してもらうための、製品の位置付けを定めた。この最後の活動を表す用語はどれか。
    c:
      - ポジショニング
      - セグメンテーション
      - ターゲティング
      - ブランディング
    a: ア
    exp: |
      STP の流れでは、市場の細分化（セグメンテーション）、標的市場の選定（ターゲティング）の次に、標的市場の顧客の認識の中で、自社製品を競合とどう違って位置付けるか（ポジショニング）を決めます。本件の最後の活動は、違いを認識してもらうための位置付けであり、ポジショニングに当たります。
    why:
      - 正解です。顧客の認識の中での、自社製品の位置付けを決める活動です。
      - 市場を年代と嗜好で細分化した、最初の段階の活動です。本問が問うのは最後の活動です。
      - 標的市場を選んだ、2番目の段階の活動です。本問が問うのは、その次の位置付けです。
      - ブランドの価値全体を育てる活動の総称であり、位置付けを顧客に浸透させる活動を含む広い概念です。STP の3番目の段階は、位置付けそのものを決める活動を指します。
    know: STP は順序のある3段階であり、各段階の「決めること」が異なる。ポジショニングは、物理的な製品の特徴ではなく、顧客の認識の中の位置である点が要点である。
    terms: [ポジショニング, STP]
    verify:
      manual: 事例の3つの活動を STP の段階に対応付け、最後の活動（違いを認識してもらうための位置付け）がポジショニングに当たることを確認した。

  - id: A19-521
    topic: 19-1-3-2
    diff: 3
    scope: 19-1-3-2 事業の選択と集中。不採算で中核とも関係の薄い事業を切り離し、経営資源を中核事業へ寄せる判断の分類
    prereq: 事業の切り離し（売却・分離）は、選択と集中の一環であり、残す事業との関係の薄さと収益性が判断の基準になること
    hard: 成長を目的とする多角化や統合とは逆方向の動きであり、事例の意図（資源の再配分）から分類する必要がある。
    q: |
      ある電機メーカは、赤字が続き、自社の中核である電子部品事業との相乗効果も薄い、家具事業（子会社）を、外部の企業へ売却することにした。売却で得た資金と人材は、電子部品事業の増強に充てる。この意思決定の説明として、適切なものはどれか。
    c:
      - 事業の選択と集中であり、関係の薄い不採算事業を切り離して、経営資源を中核事業に再配分する動きである
      - 多角化であり、事業の幅を広げて、リスクを分散する動きである
      - 垂直統合であり、部品の供給元を取り込んで、供給を安定させる動きである
      - 水平統合であり、同業の企業を取り込んで、市場シェアを高める動きである
    a: ア
    exp: |
      本件は、事業を売却して手放す動きであり、事業の幅は狭まります。不採算で中核事業との相乗効果も薄い事業を切り離し、回収した資金と人材を中核事業へ寄せるのは、事業の選択と集中の典型です。多角化や統合は、いずれも事業を取り込んで広げる方向の動きであり、本件とは逆です。
    why:
      - 正解です。切り離しによる資源の再配分であり、選択と集中に当たります。
      - 事業を広げる方向の動きであり、本件は事業を手放しています。
      - 供給元の取り込みの話であり、本件は子会社の売却です。
      - 同業の取り込みの話であり、本件は関係の薄い事業の切り離しです。
    know: 経営戦略の分類は、動きの方向（広げるか、絞るか）と相手との関係（同業か、前後か、無関係か）で決まる。売却は「絞る」方向の代表例である点が要点である。
    terms: [選択と集中]
    verify:
      manual: 事例が事業の売却（切り離し）であり、目的が中核事業への資源の再配分であることから、選択と集中に分類され、広げる方向の他の選択肢とは逆であることを確認した。

  - id: A19-522
    topic: 22-2-1-8
    diff: 3
    scope: 22-2-1-8 需要予測の指数平滑法。前月の予測値と実績から、平滑化定数を使って今月の予測値を更新する計算
    prereq: 指数平滑法では、今月の予測 ＝ 前月の予測 ＋ α ×（前月の実績 － 前月の予測）で更新すること、α は 0 から 1 の間の定数であること
    hard: 予測と実績の差に α を掛けた分だけ予測を動かす、という更新の形を正しく適用する必要がある。実績そのものや、α の配分を取り違えた値との区別が問われる。
    q: |
      ある商品の需要予測を、指数平滑法で行っている。前月の予測値は 100 個、実際の需要は 120 個であった。平滑化定数 α を 0.3 として、今月の需要予測は何個か。
    c: ['106', '110', '114', '120']
    a: ア
    exp: |
      指数平滑法では、前月の予測に、実績との差の一部を加えて予測を更新します。

      今月の予測 ＝ 100 ＋ 0.3 × （120 － 100）＝ 100 ＋ 6 ＝ 106 個

      α が大きいほど直近の実績に敏感に反応し、小さいほど予測は滑らかになります。実績（120 個）をそのまま予測にするのではなく、過去の予測を土台に少しずつ寄せていく点が、この方法の特徴です。
    why:
      - 正解です。前月の予測 100 個に、実績との差 20 個の 0.3 倍（6 個）を加えた値です。
      - 平滑化定数を 0.5 として計算した場合の値（100 ＋ 0.5 × 20 ＝ 110）です。本問の α は 0.3 です。
      - 平滑化定数を 0.7 として計算した場合の値（100 ＋ 0.7 × 20 ＝ 114）です。予測と実績への重みの配分を取り違えています。
      - 前月の実績をそのまま今月の予測にした値です。指数平滑法では、過去の予測を土台に差の一部だけを反映します。
    know: 指数平滑法は、前月の予測と最新の実績の加重平均で予測を更新する方法である。単純移動平均と違い、古いデータの影が薄れながら残るため、必要なのは直近の予測と実績だけである点が要点である。
    terms: [指数平滑法, 需要予測]
    verify: { type: value, value: 106 }
  - id: A19-523
    topic: 22-1-2-3
    diff: 3
    scope: 22-1-2-3 ABC 分析。品目を金額などの重要度で A・B・C のグループに分け、管理の重点を変える考え方の判断
    prereq: ABC 分析では、少数の品目が金額の大半を占めることに着目し、A ランクの品目を重点的に管理すること
    hard: 品目数の比率と金額の比率の対応を読み、どのグループに手厚い管理を配分すべきかを判断する必要がある。
    q: |
      在庫品目 1,000 種類について、年間の使用金額を調べたところ、上位 100 種類の品目で金額全体の 75 ％を占めていた。ABC 分析に基づく管理方針として、適切なものはどれか。
    c:
      - 金額の大半を占める上位の品目群（A ランク）を重点的に管理し、在庫量や発注の精度を高める
      - 全ての品目を同じ基準・同じ頻度で管理し、品目による差を付けない
      - 品目数の最も多い下位の品目群（C ランク）に、最も手厚い管理を配分する
      - 金額の小さい品目から順に、在庫を全て廃止する
    a: ア
    exp: |
      ABC 分析は、品目を重要度（ここでは年間使用金額）でグループ分けし、管理の重点を配分する考え方です。少数の品目（10 ％の品目数）が金額の 75 ％を占めるという偏りがあるため、その品目群（A ランク）の在庫の過不足は全体の金額への影響が大きく、重点的な管理が合理的です。逆に C ランクは、簡易な管理にとどめることで、全体の管理コストを抑えます。
    why:
      - 正解です。金額の大半を占める A ランクへの重点配分が、ABC 分析の考え方です。
      - 一律の管理は、金額への影響が大きい品目と小さい品目を区別せず、管理の配分の考え方に反します。
      - C ランクは金額への影響が小さいため、手厚い管理を配分するのは重点の置き方が逆です。
      - 在庫の廃止は管理方針ではなく、C ランクでも必要な在庫は簡易な方法で維持します。
    know: ABC 分析の要点は、品目数の比率と金額の比率の偏り（パレート的な偏り）を、管理の重点配分に変えることである。全品目一律の管理は、この偏りを活かしていない。
    terms: [ABC分析]
    verify:
      manual: 品目数の10％で金額の75％を占めるという偏りを前提に、Aランクへの重点管理が ABC 分析の方針に一致すること、他の選択肢（一律管理、Cランクへの重点、在庫の全廃）がその考え方に反することを確認した。

  - id: A19-524
    topic: 19-3-2
    diff: 3
    scope: 19-3-2 メールマーケティングの指標。配信数・開封数・クリック数から、クリック率（配信数に対する割合）を計算する問題
    prereq: クリック率はクリック数 ÷ 配信数、開封率は開封数 ÷ 配信数であり、分母の取り方で指標が変わること
    hard: クリックを開封数で割る指標（開封に対するクリックの割合）と、配信数で割るクリック率を区別する必要がある。
    q: |
      メールマガジンを 50,000 通配信し、開封数は 12,500 件、本文のリンクのクリック数は 1,000 件であった。クリック率（配信数に対するクリック数の割合）は何％か。
    c: ['0.8', '2', '8', '25']
    a: イ
    exp: |
      クリック率は、配信数を分母にします。

      クリック率 ＝ 1,000 ÷ 50,000 × 100 ＝ 2 ％

      参考までに、開封率は 12,500 ÷ 50,000 ＝ 25 ％、開封した人の中でのクリックの割合は 1,000 ÷ 12,500 ＝ 8 ％であり、分母の取り方で指標の意味が変わります。
    why:
      - 開封数 12,500 件を 125,000 件と桁を取り違えて分母にした場合の値（1,000 ÷ 125,000 ＝ 0.8 ％）です。クリック率の分母は配信数（50,000 通）です。
      - 正解です。1,000 ÷ 50,000 で 2 ％です。
      - 開封数を分母にした割合（1,000 ÷ 12,500）です。本問のクリック率は、配信数を分母にします。
      - 開封率（12,500 ÷ 50,000）の値です。問われているのはクリック率です。
    know: デジタルマーケティングの指標は、分母の定義で意味が決まる。似た名前の指標どうしは、分母（配信か開封か）で切り分けるのが要点である。
    terms: [クリック率, 開封率]
    verify: { type: value, value: 2 }

  - id: A19-525
    topic: 19-3-2
    diff: 3
    scope: 19-3-2 IT 投資の投資利益率（ROI)。投資額と累積の効果額から、投資に対する利益の割合を計算する問題
    prereq: ROI は（効果 － 投資）÷ 投資であり、効果そのものの割合（効果 ÷ 投資）とは異なること
    hard: 分子が「効果」ではなく「効果から投資を引いた利益」である点を見分ける必要がある。
    q: |
      あるシステムへの投資額は 2,000 万円で、導入後 5 年間の累積の効果額（コスト削減と売上増の合計）は 3,000 万円と見積もられた。投資利益率（ROI）は何％か。
    c: ['33.3', '50', '66.7', '150']
    a: イ
    exp: |
      ROI（投資利益率）は、投資で得た利益を投資額で割ります。

      利益 ＝ 効果 － 投資 ＝ 3,000 － 2,000 ＝ 1,000 万円
      ROI ＝ 1,000 ÷ 2,000 × 100 ＝ 50 ％

      効果 ÷ 投資は 150 ％となりますが、これは回収の倍率であり、ROI は投資分を差し引いた利益の割合です。式の形で書くと、ROI ＝ （効果 － 投資）÷ 投資 × 100 です。
    why:
      - 利益を効果額で割った場合（1,000 ÷ 3,000）の値です。ROI の分母は投資額です。
      - 正解です。（3,000 － 2,000）÷ 2,000 で 50 ％です。
      - 投資を効果で割るなど、分子と分母の組み立てを取り違えた値です。ROI は（効果 － 投資）÷ 投資です。
      - 効果 ÷ 投資の値（回収の倍率）です。ROI は、投資分を差し引いた利益の割合を表します。
    know: ROI は、効果の大きさではなく「投資に対してどれだけ上回ったか」を測る。効果 ÷ 投資（倍率）との違いが、計算の要点である。
    terms: [ROI, 投資対効果]
