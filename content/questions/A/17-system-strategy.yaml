  method: 作成後の逐問レビュー（情報システム戦略・EA・業務プロセス改善・ソリューションサービスの定義をシラバスVer.9.2の用語例および経済産業省の各種ガイドラインの定義と照合）；一次情報との照合（2026-10-21）：クラウド・バイ・デフォルトの基本方針の正式名称（2018年6月）を政府・総務省・厚生労働省の公表資料で確認し修正
questions:
  - id: A17-001
    topic: 17-1-1-1
    diff: 1
    q: 情報システム戦略の策定に関する記述として，最も適切なものはどれか。
    c:
      - 個々の開発プロジェクトの作業スケジュールと要員の割当てを詳細に定めることが主な目的である。
      - 経営戦略に基づいて策定し，企業全体として情報システムをどのように整備・活用するかの方針と目標を示す。
      - 各業務部門の要望を個別に集め，部門ごとに最適なシステムを独自に決めることを目的とする。
      - 情報システム部門の技術的な関心に基づき，経営戦略とは切り離して策定する。
    a: イ
    exp: |
      情報システム戦略は、経営戦略を実現するために、企業全体として情報システムをどのように整備し活用するかを定めるものです。経営戦略との整合性を確保し、部門ごとの部分最適ではなく全体最適の観点から、情報システムのあるべき姿（To-be モデル）や投資の方針、推進体制などを示します。
    why:
      - 作業スケジュールや要員の割当ては個々のプロジェクト計画（プロジェクトマネジメント）で扱う内容です。
      - 正解です。経営戦略を起点に、全社的な方針と目標を示すのが情報システム戦略です。
      - 部門ごとに個別に決めると部分最適になり、システムの重複やデータの不整合を招きます。情報システム戦略は全体最適を目指します。
      - 経営戦略と切り離すと、IT 投資が事業の成果に結び付きません。情報システム戦略は経営戦略と整合させて策定します。
    terms:
      - 情報システム戦略
      - To-beモデル
  - id: A17-002
    topic: 17-1-1-4
    diff: 1
    q: CIO の役割として，最も適切なものはどれか。
    c:
      - 企業の業務執行の最高責任者として，経営全体を統括する。
      - 経営戦略に沿った情報システム戦略を立案し，全社の IT 投資や情報化の推進に責任をもつ。
      - 財務戦略の立案や資金調達，財務報告に責任をもつ。
      - 研究開発部門を統括し，製品に用いる技術の開発方針に責任をもつ。
    a: イ
    exp: |
      CIO（Chief Information Officer：最高情報責任者）は、経営者の一員として、経営戦略に整合した情報システム戦略を立案し、IT 投資の評価や情報化の推進、情報システム部門の統括などに責任をもつ役職です。
    why:
      - 業務執行の最高責任者は CEO（最高経営責任者）です。
      - 正解です。情報システム戦略の立案と IT 投資・情報化の推進が CIO の役割です。
      - 財務戦略や資金調達に責任をもつのは CFO（最高財務責任者）です。
      - 研究開発や技術の方針に責任をもつのは CTO（最高技術責任者）です。
    terms:
      - CIO
  - id: A17-003
    topic:
      - 17-1-1-4
      - 17-1-1-1
    diff: 2
    q: データとデジタル技術を活用した事業の変革を全社的に推進する役割を担う経営幹部として，最も適切なものはどれか。
    c:
      - CDO
      - COO
      - CFO
      - CISO
    a: ア
    exp: |
      CDO（Chief Digital Officer：最高デジタル責任者）は、デジタル技術を活用した新しい事業やビジネスモデルの創出、業務の変革（DX）を全社的に推進する役職です。データ活用を統括する Chief Data Officer（最高データ責任者）の意味で使われることもあります。
    why:
      - 正解です。デジタル技術による事業変革を推進するのは CDO です。
      - COO（Chief Operating Officer）は日常の業務執行を統括する最高執行責任者です。
      - CFO（Chief Financial Officer）は財務・会計に責任をもつ最高財務責任者です。
      - CISO（Chief Information Security Officer）は情報セキュリティに責任をもつ最高情報セキュリティ責任者です。
    terms:
      - CDO
      - DX
  - id: A17-004
    topic: 17-1-1-1
    diff: 2
    q: DX（デジタルトランスフォーメーション）の説明として，最も適切なものはどれか。
    c:
      - 人がパソコンで行っている定型的な操作を，ソフトウェアロボットで自動化すること
      - 社内で運用しているサーバを，すべてクラウドサービスに移行すること
      - データとデジタル技術を活用して，製品・サービスやビジネスモデルを変革するとともに，業務や組織，企業文化も変革し，競争上の優位性を確立すること
      - 紙の書類をスキャナで読み取り，電子データとして保存すること
    a: ウ
    exp: |
      経済産業省の「デジタルガバナンス・コード」などでは、DX を「企業がビジネス環境の激しい変化に対応し、データとデジタル技術を活用して、顧客や社会のニーズを基に、製品やサービス、ビジネスモデルを変革するとともに、業務そのものや、組織、プロセス、企業文化・風土を変革し、競争上の優位性を確立すること」と説明しています。単なる電子化や自動化ではなく、ビジネスそのものの変革が本質です。
    why:
      - ソフトウェアロボットによる定型操作の自動化は RPA です。DX の手段の一つにはなりますが、DX そのものではありません。
      - クラウドへの移行はシステム基盤の変更であり、ビジネスモデルの変革を伴わなければ DX とはいえません。
      - 正解です。デジタル技術を使ってビジネスモデルや組織まで変革することが DX です。
      - アナログの情報をデジタルデータにするのはデジタイゼーションと呼ばれ、DX の初期段階にすぎません。
    terms:
      - DX
      - RPA
  - id: A17-005
    topic: 17-1-1-5
    diff: 2
    q: 情報システム投資計画の策定における考え方として，最も適切なものはどれか。
    c:
      - 投資額が少ない案件から順に実施し，投資効果の評価は行わない。
      - 経営戦略との整合性を確認したうえで，個々の投資案件の目的・効果・リスクを評価して優先順位を付け，実施後にも効果を評価する。
      - 投資の効果は，システムの稼働後に初めて検討する。
      - 各部門から要求のあった案件に，部門の人数に比例して予算を均等に配分する。
    a: イ
    exp: |
      情報システム投資計画では、経営戦略に基づく全体最適の観点から投資方針を定め、個々の案件の目的・期待効果・リスクを評価して優先順位を付けます。さらに、投資後に計画した効果が得られたかを評価し、次の投資判断に反映する（IT 投資マネジメント）ことが重要です。
    why:
      - 投資額の大小だけで順序を決めると、経営への貢献度が高い案件が後回しになります。投資効果の評価も欠かせません。
      - 正解です。戦略との整合、事前評価による優先順位付け、事後評価を行うのが IT 投資マネジメントの考え方です。
      - 効果は投資判断の前に見積もる必要があります。稼働後に初めて検討するのでは、投資の妥当性を判断できません。
      - 人数に比例した配分は、案件の重要度や効果を考慮していないため、全体最適になりません。
    terms:
      - 情報システム戦略
      - IT投資マネジメント
  - id: A17-006
    topic:
      - 17-1-1-6
      - 19-4-1
    diff: 1
    q: 企業全体の経営資源（人，物，金，情報）を一元的に管理し，販売・生産・会計・人事などの基幹業務を統合して経営の効率化を図るためのシステムはどれか。
    c:
      - CRM
      - ERP
      - SCM
      - SFA
    a: イ
    exp: |
      ERP（Enterprise Resource Planning：企業資源計画）は、企業全体の経営資源を一元管理し、部門ごとに分かれていた基幹業務のシステムとデータを統合することで、業務の効率化と迅速な経営判断を実現する考え方、およびそのためのシステム（ERP パッケージ）です。
    why:
      - CRM は、顧客情報を一元管理して顧客との長期的な関係を築く手法です。
      - 正解です。基幹業務を統合し経営資源を一元管理するのが ERP です。
      - SCM は、調達から生産・物流・販売までの供給の流れを企業の枠を越えて管理する手法です。
      - SFA は、営業担当者の商談・訪問などの営業活動を支援するシステムです。
    terms:
      - ERP
      - SCM
      - CRM
      - SFA
  - id: A17-007
    topic: 17-1-1-6
    diff: 1
    q: 社内のファイルサーバ，文書管理システム，データベースなどに散在する情報を，一つの検索窓から横断的に検索できるようにする仕組みはどれか。
    c:
      - エンタープライズサーチ
      - ワークフローシステム
      - ERP
      - データウェアハウス
    a: ア
    exp: |
      エンタープライズサーチは、企業内のさまざまなシステムに分散して保存されている文書やデータを、横断的にまとめて検索できるようにする仕組みです。必要な情報を探す時間を短縮し、社内の知識の活用（ナレッジマネジメント）を促進します。
    why:
      - 正解です。社内に散在する情報の横断検索を実現するのがエンタープライズサーチです。
      - ワークフローシステムは、申請や承認などの手続を電子化し、決められた経路で回付する仕組みです。
      - ERP は、基幹業務を統合して経営資源を一元管理するシステムです。
      - データウェアハウスは、基幹系システムなどのデータを時系列で統合・蓄積し、意思決定のための分析に使うデータベースです。
    terms:
      - エンタープライズサーチ
      - データウェアハウス
      - ワークフローシステム
      - ERP
  - id: A17-008
    topic: 17-1-2-1
    diff: 1
    q: EA（エンタープライズアーキテクチャ）の説明として，最も適切なものはどれか。
    c:
      - ソフトウェアの開発や取引に関する作業項目と用語を標準化し，共通の物差しとしたもの
      - 組織全体の業務とシステムを統一的な手法でモデル化し，現状とあるべき姿を明らかにして，業務とシステムの全体最適化を図るための手法
      - IT サービスマネジメントの成功事例（ベストプラクティス）を体系的にまとめたもの
      - プロジェクトマネジメントに必要な知識をプロセスや知識エリアに分けて体系化したもの
    a: イ
    exp: |
      EA（Enterprise Architecture）は、組織全体の業務とシステムを、ビジネス・データ・アプリケーション・テクノロジの4つの体系でモデル化し、現状（As-is モデル）とあるべき姿（To-be モデル）を比較して移行計画を立てることで、全体最適化を図る手法です。
    why:
      - 作業項目と用語を標準化した共通の物差しは、共通フレーム（SLCP-JCF）の説明です。
      - 正解です。業務とシステムをモデル化し、As-is と To-be から全体最適化を図るのが EA です。
      - IT サービスマネジメントのベストプラクティス集は ITIL の説明です。
      - プロジェクトマネジメントの知識体系は PMBOK の説明です。
    terms:
      - EA
      - As-isモデル
      - To-beモデル
  - id: A17-009
    topic:
      - 17-1-2-3
      - 17-1-2-2
      - 17-1-2-4
      - 17-1-2-5
    diff: 2
    q: EA を構成する4つのアーキテクチャのうち，データアーキテクチャで作成される成果物の組合せとして，適切なものはどれか。
    c:
      - 情報システム関連図，情報システム機能構成図
      - ハードウェア構成図，ソフトウェア構成図，ネットワーク構成図
      - データ定義表，情報体系整理図，E-R 図
      - 業務説明書，DFD，WFA（業務流れ図）
    a: ウ
    exp: |
      データアーキテクチャは、業務に必要なデータの内容やデータ間の関連を体系的に示すもので、データ定義表、情報体系整理図（UML のクラス図）、E-R 図などを作成します。EA は、ビジネス、データ、アプリケーション、テクノロジの4つのアーキテクチャで構成されます。
    why:
      - 情報システム関連図や機能構成図は、システムの構成や連携を示すアプリケーションアーキテクチャの成果物です。
      - ハードウェア・ソフトウェア・ネットワークの構成図は、テクノロジアーキテクチャの成果物です。
      - 正解です。データの定義と関連を示す成果物がデータアーキテクチャに属します。
      - 業務説明書、DFD、WFA は、業務の内容や流れを示すビジネスアーキテクチャの成果物です。
    terms:
      - EA
      - データアーキテクチャ
      - E-R図
  - id: A17-010
    topic:
      - 17-1-2-4
      - 17-3-2
    diff: 2
    q: SOA の説明として，最も適切なものはどれか。
    c:
      - 事業者が運用するアプリケーションソフトウェアの機能を，インターネット経由で利用者に提供するサービス形態
      - 業務で扱うデータの構造に着目し，データを中心にしてシステムを設計する考え方
      - 業務上の機能をサービスという単位で部品化し，それらをネットワーク上で連携させて組み合わせることでシステムを構築する考え方
      - 1台の物理サーバ上で複数の仮想サーバを動作させ，資源を有効活用する技術
    a: ウ
    exp: |
      SOA（Service Oriented Architecture：サービス指向アーキテクチャ）は、業務機能を「サービス」という再利用可能な部品として実装し、標準的なインタフェースで連携させてシステムを構築する考え方です。業務の変化に応じてサービスの組合せを変えることで、柔軟にシステムを変更できます。
    why:
      - アプリケーションの機能をインターネット経由で提供するのは SaaS（または ASP）の説明です。
      - データを中心に設計する考え方は DOA（データ中心アプローチ）です。
      - 正解です。機能をサービス単位の部品にして連携させるのが SOA です。
      - 1台の物理サーバで複数の仮想サーバを動かすのはサーバの仮想化です。
    terms:
      - SOA
      - SaaS
      - DOA
      - 仮想化
  - id: A17-011
    topic: 17-1-2-2
    diff: 1
    q: EA の4つのアーキテクチャのうち，政策・業務の内容，業務を実施する組織，業務の流れなどを体系化したものはどれか。
    c:
      - データアーキテクチャ
      - テクノロジアーキテクチャ
      - アプリケーションアーキテクチャ
      - ビジネスアーキテクチャ
    a: エ
    exp: |
      ビジネスアーキテクチャ（政策・業務体系）は、業務の内容や組織、業務の流れを体系化したもので、業務説明書、DFD、WFA（業務流れ図）などで表します。EA では、まずビジネスアーキテクチャで業務を整理し、それに基づいてデータ・アプリケーション・テクノロジのアーキテクチャを設計します。
    why:
      - データアーキテクチャは、業務で使うデータの内容やデータ間の関連を体系化したものです。
      - テクノロジアーキテクチャは、システムを実現するハードウェア・ソフトウェア・ネットワークなどの技術基盤を体系化したものです。
      - アプリケーションアーキテクチャは、業務処理に適した情報システムの構成や機能の単位を体系化したものです。
      - 正解です。業務の内容や流れを体系化したものがビジネスアーキテクチャです。
    terms:
      - EA
      - ビジネスアーキテクチャ
  - id: A17-012
    topic: 17-1-3
    diff: 2
    q: PMO の説明として，最も適切なものはどれか。
    c:
      - 組織内の複数のプロジェクトを横断的に支援・管理する部門であり，管理手法の標準化，資源の調整，プロジェクトマネージャの支援などを行う。
      - 業務部門から独立した立場で，情報システムの信頼性・安全性・効率性を点検・評価する部門である。
      - プロジェクトで発生した変更要求について，その影響を評価して承認するかどうかを判断する会議体である。
      - 発注者との契約に基づいて，プロジェクトの成果物の作成を請け負う外部の事業者である。
    a: ア
    exp: |
      PMO（Program Management Office / Project Management Office）は、組織内の複数のプロジェクトを横断的に支援・管理する部門です。プロジェクトマネジメントの手法やテンプレートの標準化、プロジェクト間の資源の調整、進捗の把握、プロジェクトマネージャへの助言や教育などを行います。複数の関連するプロジェクトを統合的に管理するプログラムマネジメントでも中心的な役割を担います。
    why:
      - 正解です。複数のプロジェクトを横断的に支援し、標準化や資源調整を行うのが PMO です。
      - 独立した立場で情報システムを点検・評価するのはシステム監査（内部監査部門）の役割です。
      - 変更要求を評価して承認するかを判断するのは、変更管理委員会（CCB）の役割です。
      - 成果物の作成を請け負う外部事業者は受託者（ベンダ）であり、PMO ではありません。
    terms:
      - PMO
  - id: A17-013
    topic: 17-1-4
    diff: 2
    q: ISACA が提供している，IT ガバナンスと IT マネジメントのためのフレームワークとして，最も適切なものはどれか。
    c:
      - PMBOK
      - COBIT
      - ITIL
      - SLCP-JCF（共通フレーム）
    a: イ
    exp: |
      COBIT（Control Objectives for Information and related Technology）は、ISACA（情報システムコントロール協会）が提供する IT ガバナンスと IT マネジメントのフレームワークです。経営目標と IT の目標を関連付け、管理目標やプロセス、成熟度などを体系化しています。
    why:
      - PMBOK は、米国の PMI が発行するプロジェクトマネジメントの知識体系ガイドです。
      - 正解です。ISACA が提供する IT ガバナンスのフレームワークは COBIT です。
      - ITIL は、英国政府機関が作成した IT サービスマネジメントのベストプラクティス集です。
      - 共通フレーム（SLCP-JCF）は、日本でソフトウェアライフサイクルの作業項目や用語を標準化した枠組みです（IPA が公開）。
    terms:
      - COBIT
      - ITガバナンス
  - id: A17-014
    topic:
      - 17-1-1-3
      - 17-1-4
    diff: 2
    q: IT ガバナンスの説明として，最も適切なものはどれか。
    c:
      - 情報システム部門の担当者が，サーバの障害を記録し，原因を調査して復旧させる活動
      - 開発プロジェクトのスコープ，スケジュール，コストを計画して管理する活動
      - 経営陣が主体となって，IT の利活用に関する戦略や計画を評価し，指示し，その実施状況をモニタして，組織の価値を高める仕組み
      - 情報資産に対する脅威を洗い出し，アクセス制御などの対策を実装する活動
    a: ウ
    exp: |
      IT ガバナンスは、経営陣がステークホルダのニーズに基づき、組織の価値を高めるために、IT の利活用について責任をもって統制する仕組みです。JIS Q 38500 では、経営陣が IT の利用を「評価（Evaluate）」「指示（Direct）」「モニタ（Monitor）」するモデルが示されています。担当者レベルの管理活動ではなく、経営層が主体である点が重要です。
    why:
      - 障害の記録・調査・復旧は、IT サービスマネジメントにおけるインシデント管理や問題管理の活動です。
      - スコープ・スケジュール・コストの管理はプロジェクトマネジメントの活動です。
      - 正解です。経営陣が IT の利活用を評価・指示・モニタするのが IT ガバナンスです。
      - 脅威の洗い出しと対策の実装は、情報セキュリティマネジメントの活動です。
    terms:
      - ITガバナンス
      - インシデント
  - id: A17-015
    topic: 17-1-6
    diff: 2
    q: 情報システム戦略の実行段階におけるマネジメントとして，最も適切なものはどれか。
    c:
      - 実行中に新たなリスクが判明しても，戦略を見直すのは次回の策定時まで待つ。
      - 戦略の策定時に定めた計画は変更せず，実行中の状況は確認しない。
      - 戦略の達成度を測るモニタリング指標を定め，定期的に実績を測定して目標値との差異を分析し，原因に応じて是正策を講じる。
      - 計画との差異が生じた場合は，原因を分析せずに目標値を実績に合わせて引き下げる。
    a: ウ
    exp: |
      情報システム戦略の実行マネジメントでは、KPI などのモニタリング指標を用いて実行状況を定期的に把握し、計画との差異を分析します。差異の原因に応じて、施策の修正や資源の再配分などの是正策をとり、新たなリスクにも適時に対応します。
    why:
      - 新たなリスクには適時に対応する必要があります。次回の策定時まで放置するのは適切ではありません。
      - 実行状況を確認しなければ、計画からのずれに気付けず、戦略の目標を達成できません。
      - 正解です。指標によるモニタリング、差異分析、是正策の実施が実行マネジメントの基本です。
      - 原因を分析しないまま目標を引き下げると、問題が放置されます。まず差異の原因を分析します。
    terms:
      - KPI
  - id: A17-016
    topic: 17-2-1
    diff: 1
    q: BPR の説明として，最も適切なものはどれか。
    c:
      - 自社の業務プロセスの一部を，専門の外部事業者に継続的に委託すること
      - 既存の業務の進め方や組織を根本的に見直して抜本的に再設計し，コスト，品質，サービス，スピードなどを劇的に改善すること
      - 業務プロセスの分析・設計・実行・評価のサイクルを継続的に回し，段階的に改善していくこと
      - パソコン上で人が行っている定型的な操作を，ソフトウェアロボットに代行させること
    a: イ
    exp: |
      BPR（Business Process Reengineering）は、既存の業務プロセスを前提とせず、顧客の視点から業務の流れや組織、情報システムを根本的に見直して再設計し、劇的な改善を目指す手法です。継続的・段階的な改善を行う BPM とは、抜本的な改革である点が異なります。
    why:
      - 業務プロセスの一部を外部の専門事業者に委託するのは BPO（ビジネスプロセスアウトソーシング）です。
      - 正解です。業務を根本から再設計して劇的な改善を図るのが BPR です。
      - 分析・設計・実行・評価を継続的に繰り返して改善するのは BPM（ビジネスプロセスマネジメント）です。
      - ソフトウェアロボットによる定型操作の代行は RPA です。
    terms:
      - BPR
      - BPM
      - BPO
      - RPA
  - id: A17-017
    topic: 17-2-1
    diff: 2
    q: BPO の説明として，最も適切なものはどれか。
    c:
      - 利用者が所有するサーバを事業者のデータセンタに設置し，電源や回線などの設備を利用すること
      - 業務プロセスをモデル化し，その実行状況を監視しながら継続的に改善するための情報システム
      - 人事・経理・コールセンターなどの業務プロセスを，その業務を専門とする外部の事業者に継続的に委託すること
      - ソフトウェアの開発を，人件費の安い海外の事業者や海外子会社に委託すること
    a: ウ
    exp: |
      BPO（Business Process Outsourcing）は、自社の業務プロセスの一部を、企画から運営までまとめて外部の専門事業者に委託することです。自社は経営資源をコア業務に集中でき、委託先の専門性による品質向上やコスト削減も期待できます。
    why:
      - 自社のサーバを事業者の施設に設置して設備を利用するのはハウジングサービスです。
      - 業務プロセスのモデル化・監視・改善を支援する情報システムは BPMS です。
      - 正解です。業務プロセスを専門の外部事業者に継続的に委託するのが BPO です。
      - 海外の事業者に開発などを委託するのはオフショア（オフショア開発）の説明です。
    terms:
      - BPO
      - オフショア
      - ハウジングサービス
      - BPM
  - id: A17-018
    topic: 17-2-1
    diff: 1
    q: RPA の説明として，最も適切なものはどれか。
    c:
      - 過去の販売データを機械学習で分析し，将来の需要を予測する。
      - 人がパソコン上で行っている定型的な事務作業の操作手順を，ソフトウェアのロボットに実行させて自動化する。
      - 工場の生産ラインに産業用ロボットを導入し，部品の組立てを自動化する。
      - 申請書の承認経路を電子化し，決められた順序で承認者に回付する。
    a: イ
    exp: |
      RPA（Robotic Process Automation）は、データの転記や定型的な画面操作など、人がパソコンで行っている繰返しの事務作業を、ソフトウェアのロボットに記録・実行させて自動化する技術です。既存のシステムを改修せずに、画面操作のレベルで自動化できる点が特徴です。
    why:
      - 機械学習による需要予測は AI の活用例です。RPA は決められた手順を実行するもので、判断や予測を行う技術ではありません。
      - 正解です。パソコン上の定型作業をソフトウェアロボットで自動化するのが RPA です。
      - 産業用ロボットによる生産の自動化は FA（ファクトリーオートメーション）の説明です。RPA は物理的なロボットではありません。
      - 承認経路の電子化と回付はワークフローシステムの機能です。
    terms:
      - RPA
      - AI
      - ワークフローシステム
  - id: A17-019
    topic: 17-2-1
    diff: 1
    q: ワークフローシステムの説明として，最も適切なものはどれか。
    c:
      - 稟議や経費精算などの申請・承認の手続を電子化し，あらかじめ定めた経路に従って書類を回付するとともに，処理の進捗状況を確認できるようにする。
      - 原材料の調達から販売までの物の流れを，取引先を含めて統合的に管理する。
      - 営業担当者の顧客訪問の記録や商談の進捗を管理し，営業活動を効率化する。
      - 社内のさまざまなシステムに分散した文書を，一つの検索窓から横断的に検索できるようにする。
    a: ア
    exp: |
      ワークフローシステムは、申請・承認・回覧などの事務手続を電子化し、定められた経路に沿って自動的に回付する仕組みです。書類の紛失や滞留を防ぎ、誰の段階で止まっているかなどの進捗を可視化できるため、業務プロセスの標準化と効率化に役立ちます。
    why:
      - 正解です。申請・承認の手続を電子化して回付するのがワークフローシステムです。
      - 調達から販売までの物の流れを統合管理するのは SCM です。
      - 営業活動の記録や商談管理を行うのは SFA です。
      - 社内に分散した文書の横断検索はエンタープライズサーチです。
    terms:
      - ワークフローシステム
      - SFA
      - エンタープライズサーチ
      - SCM
  - id: A17-020
    topic: 17-3-1
    diff: 1
    q: ソリューションビジネスの説明として，最も適切なものはどれか。
    c:
      - 自社で開発した汎用ソフトウェアを，顧客の課題とは関係なくパッケージ製品として大量に販売する。
      - 顧客にコンピュータなどの機器を一定期間貸し出し，その使用料を得る。
      - 自社の技術者を顧客企業に派遣し，顧客の指揮命令の下で作業させる。
      - 顧客の経営課題や業務上の問題を分析し，その解決に必要な製品やサービス，システムを組み合わせて提供する。
    a: エ
    exp: |
      ソリューションビジネスは、顧客の抱える課題を把握・分析し、その解決策（ソリューション）として、ハードウェア、ソフトウェア、サービス、コンサルティングなどを組み合わせて提案・提供するビジネスです。単に製品を売るのではなく、課題の解決を提供価値とする点が特徴です。
    why:
      - 顧客の課題と関係なく製品を販売するのは、製品販売型のビジネスであり、課題解決を中心とするソリューションビジネスとは異なります。
      - 機器を貸し出して使用料を得るのはリースやレンタルの説明です。
      - 顧客の指揮命令の下で作業させるのは労働者派遣の説明です。
      - 正解です。顧客の課題を分析し、解決策を組み合わせて提供するのがソリューションビジネスです。
    terms:
      - ソリューションビジネス
  - id: A17-021
    topic: 17-3-2
    diff: 1
    q: クラウドサービスの利用形態のうち，ハイブリッドクラウドの説明として，最も適切なものはどれか。
    c:
      - 特定の企業や組織だけが専用で利用するクラウド環境を構築する。
      - データを特定の国や地域の法規制の下で保管・管理し，その国の主権が及ぶようにしたクラウド環境を利用する。
      - 不特定多数の利用者が，事業者の提供するクラウド環境を共有して利用する。
      - パブリッククラウドと，プライベートクラウドやオンプレミスのシステムを組み合わせ，用途に応じて使い分ける。
    a: エ
    exp: |
      ハイブリッドクラウドは、パブリッククラウドとプライベートクラウド（または自社運用のオンプレミス環境）を組み合わせて利用する形態です。機密性の高いデータは自社専用の環境で扱い、負荷の変動が大きい処理はパブリッククラウドで扱う、といった使い分けができます。
    why:
      - 特定の組織専用のクラウド環境はプライベートクラウドです。
      - 特定の国の法規制の下でデータ主権を確保するクラウドはソブリンクラウドです。
      - 不特定多数で共有するクラウド環境はパブリッククラウドです。
      - 正解です。パブリッククラウドと専用環境を組み合わせるのがハイブリッドクラウドです。
    terms:
      - ハイブリッドクラウド
      - パブリッククラウド
      - プライベートクラウド
      - オンプレミス
      - ソブリンクラウド
  - id: A17-022
    topic: 17-3-2
    diff: 2
    q: ハウジングサービスの説明として，最も適切なものはどれか。
    c:
      - 事業者が運用するアプリケーションソフトウェアの機能を，ネットワーク経由で利用者に提供する。
      - 事業者が所有するサーバの全部又は一部を利用者に貸し出し，利用者はその上で自分のシステムを運用する。
      - 利用者が所有するサーバや通信機器を事業者のデータセンタに設置し，電源，空調，回線などの設備を利用する。
      - 利用者が自社の施設内にサーバを設置し，自ら運用・管理する。
    a: ウ
    exp: |
      ハウジングサービスでは、サーバなどの機器は利用者が用意して所有し、事業者は設置場所（データセンタのラックなど）と電源・空調・ネットワーク回線・入退室管理などの設備を提供します。これに対して、サーバ自体も事業者が用意して貸し出すのがホスティングサービスです。
    why:
      - アプリケーションの機能をネットワーク経由で提供するのは ASP や SaaS です。
      - 事業者のサーバを貸し出すのはホスティングサービス（レンタルサーバ）です。
      - 正解です。利用者の機器を事業者の施設に置き、設備を利用するのがハウジングサービスです。
      - 自社の施設内に設置して自ら運用するのはオンプレミスです。
    terms:
      - ハウジングサービス
      - ホスティングサービス
      - ASP
      - SaaS
      - オンプレミス
  - id: A17-023
    topic: 17-3-2
    diff: 2
    q: 政府情報システムの整備方針などで用いられる“クラウド・バイ・デフォルト”の考え方として，最も適切なものはどれか。
    c:
      - 複数のクラウド事業者のサービスを組み合わせて，特定の事業者への依存を避ける。
      - 情報システムを整備する際に，クラウドサービスの利用を第一候補として検討する。
      - クラウドの特性を最大限に生かすことを前提として，コンテナやマイクロサービスなどを用いてシステムを設計する。
      - 情報資産を外部に置かないように，すべてのシステムを自組織の施設内で構築・運用する。
    a: イ
    exp: |
      クラウド・バイ・デフォルト原則は、情報システムを整備する際に、クラウドサービスの利用を第一候補（デフォルト）として検討するという考え方です。日本政府の「政府情報システムにおけるクラウドサービスの利用に係る基本方針」（2018年6月、各府省情報化統括責任者（CIO）連絡会議決定）で示されました。効率性・柔軟性・セキュリティの向上などを目的としています。
    why:
      - 複数のクラウド事業者のサービスを組み合わせるのはマルチクラウドの説明です。
      - 正解です。クラウドサービスの利用を最初の選択肢として検討するのがクラウド・バイ・デフォルトです。
      - クラウドの特性を最大限に生かす設計を前提とするのはクラウドネイティブの考え方です。
      - すべてを自組織の施設内で構築・運用するのはオンプレミスであり、クラウド・バイ・デフォルトとは逆の方針です。
    terms:
      - クラウドバイデフォルト
      - クラウドネイティブ
      - オンプレミス
      - コンテナ
  - id: A17-024
    topic: 17-4-1-1
    diff: 2
    q: BYOD の説明として，最も適切なものはどれか。
    c:
      - 端末にはデータを保存せず，サーバ側で処理を行って画面だけを端末に転送すること
      - 企業が定めたルールの下で，従業員が個人所有のスマートフォンやパソコンを業務に利用すること
      - 従業員が企業の許可を得ずに，個人で契約したクラウドサービスや私物の端末を業務に利用すること
      - 企業が従業員に端末を貸与し，私物の端末を業務に利用することを禁止すること
    a: イ
    exp: |
      BYOD（Bring Your Own Device）は、従業員が私物の情報端末を、企業が認めたルールの下で業務に利用することです。端末の購入費用を抑えられ、使い慣れた端末で業務ができる一方、紛失時の情報漏えいや私的利用との区別などのリスクがあるため、MDM（モバイルデバイス管理）などによる管理が必要です。
    why:
      - 端末にデータを残さずサーバ側で処理するのはシンクライアントの説明です。
      - 正解です。企業が認めたルールの下で私物端末を業務に使うのが BYOD です。
      - 企業の許可を得ずに私物の端末やサービスを業務に使うのはシャドー IT であり、セキュリティ上の問題とされます。
      - 企業が端末を貸与し私物の利用を禁止するのは、BYOD を認めない運用です。
    terms:
      - BYOD
      - シャドーIT
      - シンクライアント
  - id: A17-025
    topic: 17-4-1-3
    diff: 1
    q: 情報システムの普及啓発の手法のうち，ゲーミフィケーションの説明として，最も適切なものはどれか。
    c:
      - 情報通信技術を利用できる人とできない人との間に生じる，得られる情報や機会の格差のこと
      - ポイント，ランキング，バッジなどのゲームの要素をゲーム以外の分野に取り入れて，利用者の意欲や継続的な利用を促す。
      - 利用者からの問合せに，人間に代わってプログラムが会話形式で自動的に応答する。
      - インターネットなどのネットワークを利用して，時間や場所を選ばずに学習できるようにする。
    a: イ
    exp: |
      ゲーミフィケーションは、ポイントの付与、ランキング、達成バッジ、レベルアップなど、ゲームで用いられる要素や考え方をゲーム以外の分野に応用し、利用者のやる気や継続的な参加を引き出す手法です。社内システムの活用促進や教育、健康管理などに使われます。
    why:
      - 情報通信技術の利用の可否による格差はデジタルディバイドです。
      - 正解です。ゲームの要素を取り入れて意欲を高めるのがゲーミフィケーションです。
      - プログラムが会話形式で自動応答するのはチャットボットです。
      - ネットワークを利用して時間や場所を選ばずに学習するのは e-ラーニングです。
    terms:
      - ゲーミフィケーション
      - デジタルディバイド
      - e-ラーニング
      - チャットボット
  - id: A17-026
    topic: 17-4-1-5
    diff: 1
    q: 情報システムを廃棄する際の対応として，最も適切なものはどれか。
    c:
      - ファイルを削除してごみ箱を空にすれば，データは復元できないので，そのまま廃棄業者に引き渡す。
      - 将来の調査に備えて，個人情報を含むすべてのデータを廃棄後も期限を定めずに保管し続ける。
      - 廃棄はシステムライフサイクルの最終段階なので，利用部門への周知や業務の移行計画は不要である。
      - 記憶媒体に保存されたデータを，情報セキュリティポリシーに従って復元できない方法で消去又は物理的に破壊し，その実施を記録する。
    a: エ
    exp: |
      情報システムの廃棄では、記憶媒体からの情報漏えいを防ぐため、情報セキュリティポリシーに従って、データ消去ソフトウェアによる上書き消去や磁気消去、物理的な破壊などで復元できないようにし、その実施を記録します。あわせて、利用者への周知や、必要なデータの新システムへの移行、保存期間の定められたデータの扱いを計画的に行います。
    why:
      - ファイルの削除やごみ箱を空にする操作では、管理情報が消えるだけでデータ本体は残るため、ツールで復元される可能性があります。
      - 不要なデータを期限なく保管し続けると漏えいのリスクが高まります。保存期間を定め、不要になれば確実に消去します。
      - 廃棄に当たっても、利用部門への周知や業務・データの移行を計画的に行う必要があります。
      - 正解です。ポリシーに従った確実な消去や破壊と、その記録が必要です。
    terms:
      - システムライフサイクル
      - 情報セキュリティポリシー
  - id: A17-027
    topic:
      - 17-4-1-4
      - 17-4-1-3
    diff: 2
    q: 社内に導入した e-ラーニングの利用実態を評価・検証する方法として，最も適切なものはどれか。
    c:
      - 導入時に配布した利用者マニュアルの部数を数え，利用実態とみなす。
      - 学習マネジメントシステム（LMS）に記録された受講履歴やテストの成績，アクセスログを分析し，受講率や理解度を把握する。
      - 利用者の評価は主観的なので，評価・検証は一切行わない。
      - システムの導入費用が予算内に収まったことをもって，活用されていると判断する。
    a: イ
    exp: |
      情報システムの利用実態は、ログ分析などによって客観的に評価・検証します。e-ラーニングでは、LMS（Learning Management System：学習管理システム）に記録された受講状況、修了状況、テスト結果、アクセスログなどを分析し、受講率や理解度、利用の偏りを把握して、普及啓発策の改善につなげます。
    why:
      - マニュアルの配布部数は、実際にシステムが使われているかどうかを示しません。
      - 正解です。LMS の記録やアクセスログを分析して、利用状況を客観的に把握します。
      - 利用実態を評価しなければ、活用促進の施策が有効か判断できません。ログなどの客観的なデータに基づいて評価します。
      - 費用が予算内に収まったかは導入プロジェクトの評価であり、システムの利用実態を示すものではありません。
    terms:
      - e-ラーニング
