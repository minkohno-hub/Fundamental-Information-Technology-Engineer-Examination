questions:
  - id: A04-501
    topic: 4-2-2-2
    diff: 3
    q: |
      あるシステムは，稼働率 0.98 の入口装置，稼働率 0.90 の処理サーバ 2 台の並列部分（少なくとも 1 台が稼働すればよい），稼働率 0.95 のデータベース装置を，この順に直列に接続した構成である。システム全体の稼働率に最も近いものはどれか。
    c:
      - '0.754'
      - '0.922'
      - '0.990'
      - '0.838'
    a: イ
    scope: 4-2-2-2 信頼性指標と信頼性計算。直列部分は稼働率の積，並列部分は少なくとも 1 台が稼働する確率として計算する範囲内の信頼性計算である。
    prereq: 直列システムと並列システムの稼働率の計算方法，余事象（全て故障する確率）の考え方
    hard: 並列部分を先に 1 台分へ換算してから直列の積に入れる 2 段階の計算であり，並列を単純な積や平均で処理すると誤る。
    exp: |
      まず処理サーバの並列部分の稼働率を求めます。2 台とも故障する確率は（1−0.90）×（1−0.90）＝0.01 なので，並列部分の稼働率は 1−0.01＝0.99 です。
      次に直列部分の積を取ります。全体の稼働率＝0.98×0.99×0.95＝0.92169，すなわち約 0.922 です。
      | 部分 | 稼働率 |
      | --- | --- |
      | 入口装置 | 0.98 |
      | 処理サーバ並列部分 | 1−（0.10×0.10）＝0.99 |
      | データベース装置 | 0.95 |
      | 全体（直列の積） | 0.98×0.99×0.95≒0.922 |
    why:
      - 処理サーバ 2 台も直列として 0.98×0.90×0.90×0.95 と計算した誤りです。片方だけでも稼働すればよい部分を積に入れてはいけません。
      - 正解です。並列部分を 0.99 と換算し，0.98×0.99×0.95＝約 0.922 と計算した結果です。
      - 並列部分だけの稼働率 0.99 を全体の稼働率と取り違えた誤りです。前後の直列装置の稼働率も掛ける必要があります。
      - 並列部分を 2 台の平均である 0.90 のまま直列の積に入れた誤りです。並列は少なくとも 1 台が稼働すればよいので 0.99 になります。
    know: 直列システムの稼働率は各部分の稼働率の積で，どれか 1 つが止まると全体が止まります。並列システムは「全てが故障する確率」を 1 から引いて求めます。混在する構成では，並列部分を先に 1 つの部分へ換算してから直列の積を取るのが基本です。
    terms:
      - 稼働率
    verify:
      value: 0.98*(1-(1-0.9)**2)*0.95
      tolerance: 0.001
  - id: A04-502
    topic: 4-2-2-2
    diff: 3
    q: |
      あるシステムを 4,000 時間観測したところ，故障が 5 回発生し，修理のために停止していた時間の合計は 80 時間であった。この観測結果から求めた MTBF，MTTR，稼働率の組合せとして，適切なものはどれか。
    c:
      - MTBF 784 時間，MTTR 80 時間，稼働率 0.91
      - MTBF 800 時間，MTTR 16 時間，稼働率 0.98
      - MTBF 784 時間，MTTR 16 時間，稼働率 0.98
      - MTBF 16 時間，MTTR 784 時間，稼働率 0.02
    a: ウ
    scope: 4-2-2-2 信頼性指標と信頼性計算。観測期間と故障回数と停止時間から MTBF と MTTR を定義どおりに求め，稼働率へ結び付ける範囲内の計算である。
    prereq: MTBF は稼働時間の平均，MTTR は修理時間の平均であること，稼働率＝MTBF÷（MTBF＋MTTR）
    hard: 観測期間 4,000 時間には停止時間も含まれるため，MTBF の分子から停止時間を差し引く点と，3 つの指標を相互に検算できる点が鍵になる。
    exp: |
      稼働していた時間は 4,000−80＝3,920 時間です。故障は 5 回なので，MTBF＝3,920÷5＝784 時間，MTTR＝80÷5＝16 時間です。
      稼働率は MTBF÷（MTBF＋MTTR）＝784÷（784＋16）＝784÷800＝0.98 です。稼働時間の割合 3,920÷4,000＝0.98 とも一致します。
      | 指標 | 計算 | 値 |
      | --- | --- | --- |
      | MTBF | （4,000−80）÷5 | 784 時間 |
      | MTTR | 80÷5 | 16 時間 |
      | 稼働率 | 784÷（784＋16） | 0.98 |
    why:
      - MTTR に停止時間の合計 80 時間をそのまま入れた誤りです。MTTR は 1 回あたりの平均修理時間なので故障回数で割ります。
      - MTBF の分子に停止時間を含む観測期間 4,000 時間をそのまま使った誤りです。MTBF は稼働していた時間の平均であり，停止時間は除きます。
      - 正解です。MTBF は稼働時間 3,920 時間を故障回数で割り 784 時間，MTTR は 16 時間，稼働率は 0.98 です。
      - MTBF と MTTR を取り違えた誤りです。784 時間が平均の稼働間隔，16 時間が平均の修理時間です。
    know: MTBF は「平均してどれだけの時間，故障せずに動くか」，MTTR は「故障したとき平均してどれだけの時間で直るか」を表します。稼働率は MTBF÷（MTBF＋MTTR）で，観測期間に対する稼働時間の割合と一致するはずなので，両方で検算できます。
    terms:
      - MTBF
      - MTTR
      - 稼働率
    verify:
      manual: 稼働時間 4000-80=3920。MTBF=3920/5=784，MTTR=80/5=16，稼働率=784/(784+16)=0.98。別法 3920/4000=0.98 と一致することを確認
  - id: A04-503
    topic: 4-2-2-2
    diff: 4
    q: |
      稼働率 0.90 の装置を並列に接続し，少なくとも 1 台が稼働していれば動作する部分を作る。この部分の稼働率を 0.999 以上にするために必要な装置の最小台数と，そのときの稼働率の組合せとして，適切なものはどれか。
    c:
      - 3 台，稼働率 0.970
      - 4 台，稼働率 0.9999
      - 3 台，稼働率 0.999
      - 2 台，稼働率 0.990
    a: ウ
    scope: 4-2-2-2 信頼性指標と信頼性計算。並列冗長化で目標稼働率を満たす台数を，全て故障する確率から逆算する範囲内の設計計算である。
    prereq: 並列システムの稼働率は 1−（各装置の故障率の積），目標値との比較による台数の決定
    hard: 台数を増やすごとに全て故障する確率が 0.1 の冪乗で減ることを利用し，目標を満たす最小台数を逆算する必要がある。
    exp: |
      装置が n 台並列のとき，全て故障する確率は 0.10 の n 乗なので，稼働率は 1−0.10^n です。
      | 台数 | 全て故障する確率 | 稼働率 | 判定 |
      | --- | --- | --- | --- |
      | 1 | 0.1 | 0.90 | 不足 |
      | 2 | 0.01 | 0.99 | 不足 |
      | 3 | 0.001 | 0.999 | 目標を満たす最小 |
      | 4 | 0.0001 | 0.9999 | 目標は満たすが最小ではない |
      目標 0.999 以上を満たす最小台数は 3 台で，その稼働率はちょうど 0.999 です。
    why:
      - 3 台という台数は正しいが，稼働率を 0.970 とした計算が誤りです。全て故障する確率は 0.001 であり，稼働率は 0.999 です。
      - 4 台でも稼働率 0.9999 で目標は満たしますが，3 台で既に満たせるため，最小台数を問う設問の答えにはなりません。
      - 正解です。3 台並列の稼働率は 1−0.10^3＝0.999 で，目標を満たす最小の台数です。
      - 2 台では稼働率は 1−0.01＝0.99 であり，目標の 0.999 に届かないため不適切です。あと 1 台必要です。
    know: 並列冗長化では，台数を 1 台増やすごとに「全て故障する確率」が各装置の故障率の分だけ掛け算で小さくなります。目標稼働率から必要な台数を逆算するときは，稼働率そのものではなく故障率（1−稼働率）の冪乗で考えるのが近道です。
    terms:
      - 稼働率
      - フォールトトレランス
    verify:
      manual: n台並列の稼働率=1-0.1^n。n=1で0.9，n=2で0.99，n=3で0.999，n=4で0.9999。0.999以上を満たす最小は n=3 で稼働率0.999
  - id: A04-504
    topic: 4-1-6
    diff: 3
    q: |
      1 台 2T バイトのディスクを 8 台用意し，うち 1 台をホットスペアとして確保した。残りの 7 台で RAID6 を構成するとき，データを格納できる実効容量と，同時に故障してもデータを失わないディスク台数の組合せとして，適切なものはどれか。
    c:
      - 10T バイト，2 台
      - 14T バイト，3 台
      - 10T バイト，1 台
      - 12T バイト，2 台
    a: ア
    scope: 4-1-6 ストレージ（RAID6，パリティ）。RAID6 は 2 台分のパリティを使うことと，ホットスペアは構成台数に含めないことの組合せ判断であり範囲内である。
    prereq: RAID6 の実効容量は（台数−2）×1 台の容量であること，ホットスペアは故障時の自動切替え用待機ディスクであること
    hard: ホットスペアを除いた台数で容量を計算することと，RAID6 の耐故障台数（2 台）を，パリティ台数と混同せずに結び付ける必要がある。
    exp: |
      RAID を構成するのはホットスペアを除く 7 台です。RAID6 では，そのうち 2 台分が二重のパリティに使われます。
      実効容量＝（7−2）×2T バイト＝10T バイトです。二重パリティにより，構成ディスクのうち同時に 2 台まで故障してもデータを復元できます。ホットスペアは故障発生後に自動で組み込まれる待機用であり，容量にも構成台数にも入りません。
      | 項目 | 値 |
      | --- | --- |
      | RAID6 を構成する台数 | 8−1（ホットスペア）＝7 台 |
      | パリティに使う容量 | 2 台分 |
      | 実効容量 | （7−2）×2＝10T バイト |
      | 同時故障の許容 | 2 台まで |
    why:
      - 正解です。ホットスペアを除く 7 台で（7−2）×2＝10T バイト，同時 2 台までの故障に耐えます。
      - パリティを 1 台分とし，ホットスペアも容量に含めた誤りです。実効容量も耐故障台数も RAID6 の前提と一致しません。
      - 実効容量は正しいが，耐えられる台数を 1 台としたのは RAID5 との混同です。RAID6 は二重パリティなので 2 台まで耐えます。
      - ホットスペアの 1 台も RAID6 の構成台数に含めて（8−2）×2＝12T バイトとした誤りです。ホットスペアは待機用で，データを格納しません。
    know: RAID6 は 2 台分のパリティで同時 2 台の故障に耐え，実効容量は（構成台数−2）×1 台分です。ホットスペアは故障時に自動で組み込まれて再構築を始めるための待機ディスクで，平常時の実効容量には数えません。
    terms:
      - RAID6
      - RAID
      - ホットスペア
    verify:
      manual: 構成台数=8-1=7。RAID6 実効容量=(7-2)*2=10TB。二重パリティにより同時2台故障まで復元可能。ホットスペアは容量計算に含めない
  - id: A04-505
    topic: 4-1-2
    diff: 2
    q: |
      金融機関の勘定系システムで，同一の入力に対して 2 系のシステムが全く同じ処理を並行して実行し，処理結果を相互に照合する方式を採用した。結果が一致しない場合は処理を停止して原因を調べる。この方式の名称として，適切なものはどれか。
    c:
      - デュプレックスシステム
      - ロードシェアリングシステム
      - デュアルシステム
      - クラスタシステム
    a: ウ
    scope: 4-1-2 システム構成（デュアルシステム）。現用と待機ではなく，両系が同一処理を実行して結果を照合する点が名称判定の根拠であり範囲内である。
    prereq: デュアルシステムとデュプレックスシステムの違い（両系で同一処理を実行し照合するか，現用系と待機系に分かれるか）
    exp: |
      両系が同じ入力に対して同じ処理を並行実行し，結果を相互に照合する方式はデュアルシステムです。照合で不一致があれば，どちらかの系の誤りを検出でき，処理を止めて安全側に倒せます。
      一方，デュプレックスシステムは現用系が処理し，待機系は故障時に切り替わる構成で，平常時に両系が同一処理を実行して照合することはしません。設問の「同一処理を並行実行し結果を照合する」が決め手です。
    why:
      - デュプレックスシステムは現用系と待機系に分かれ，待機系は平常時には処理を実行しません。結果の照合を行う方式ではありません。
      - ロードシェアリングシステムは負荷を複数系に分散してそれぞれが異なる要求を処理する方式で，同一入力を二重に処理して照合するものではありません。
      - 正解です。両系が同一処理を並行して実行し，処理結果を相互に照合する方式はデュアルシステムです。
      - クラスタシステムは複数のコンピュータを連携させて 1 つのシステムとして使う総称であり，同一処理の結果を照合する方式の名称ではありません。
    know: デュアルシステムは「同じ仕事を 2 系で同時に行い答え合わせをする」方式で，誤りの検出能力が高い代わりに処理コストも二重にかかります。デュプレックスは「現用と待機」で，待機系は故障時に引き継ぎます。両者の区別は平常時に待機側が処理をしているかどうかです。
    terms:
      - デュアルシステム
      - デュプレックスシステム
  - id: A04-506
    topic: 1-2-6
    diff: 4
    q: |
      窓口が 1 つの窓口業務を M/M/1 の待ち行列モデルで表す。平均到着率が 1 時間あたり 36 人，平均サービス率が 1 時間あたり 45 人であるとき，平均待ち時間（サービスを受けるまで）と平均応答時間（待ち時間とサービス時間の合計）の組合せとして，最も近いものはどれか。
    c:
      - 平均待ち時間 約 6.7 分，平均応答時間 約 8.0 分
      - 平均待ち時間 約 5.3 分，平均応答時間 約 6.7 分
      - 平均待ち時間 約 5.3 分，平均応答時間 約 5.3 分
      - 平均待ち時間 約 1.3 分，平均応答時間 約 6.7 分
    a: イ
    scope: 1-2-6 待ち行列理論（M/M/1 モデル）。平均待ち時間の公式に到着率とサービス率を当てはめ，サービス時間を加えて応答時間を求める範囲内の計算である。
    prereq: M/M/1 の平均待ち時間は到着率÷（サービス率×（サービス率−到着率）），サービス時間はサービス率の逆数であること
    hard: 到着率とサービス率から待ち時間を求める公式の適用と，単位を時間から分へ換算し，応答時間ではサービス時間を加える 3 段階の処理が必要である。
    exp: |
      利用率は 36÷45＝0.8 です。M/M/1 の平均待ち時間は，到着率÷（サービス率×（サービス率−到着率））＝36÷（45×9）＝36÷405≒0.0889 時間です。分に直すと約 5.3 分です。
      1 人あたりのサービス時間は 1÷45 時間＝約 1.3 分なので，平均応答時間は 5.3＋1.3＝約 6.7 分です。
      | 量 | 計算 | 値 |
      | --- | --- | --- |
      | 利用率 | 36÷45 | 0.8 |
      | 平均待ち時間 | 36÷（45×（45−36））時間×60 | 約 5.3 分 |
      | サービス時間 | （1÷45）時間×60 | 約 1.3 分 |
      | 平均応答時間 | 5.3＋1.3 | 約 6.7 分 |
    why:
      - 平均待ち時間に 1÷（サービス率−到着率）を使ってしまった誤りです。その値は応答時間に相当し，待ち時間そのものではありません。
      - 正解です。平均待ち時間は 36÷（45×9）時間で約 5.3 分，サービス時間約 1.3 分を加えた応答時間は約 6.7 分です。
      - 応答時間にサービス時間を加えていない誤りです。応答時間は待ち時間とサービス時間の合計なので，待ち時間より必ず長くなります。
      - 約 1.3 分はサービス時間であり，待ち時間ではありません。利用率 0.8 では待ち時間はサービス時間より長くなります。
    know: M/M/1 では平均待ち時間＝到着率÷（サービス率×（サービス率−到着率））であり，平均応答時間はこれに平均サービス時間を加えたもの（＝1÷（サービス率−到着率））です。到着率がサービス率に近づくと待ち時間は急激に伸びるため，窓口の能力には余裕が必要です。
    terms:
      - 待ち行列理論
    verify:
      manual: Wq=36/(45*(45-36))=0.08889時間=5.33分。サービス時間=60/45=1.33分。W=5.33+1.33=6.67分。別法 W=1/(45-36)時間=6.67分と一致
  - id: A04-507
    topic: 4-2-1-1
    diff: 3
    q: |
      ある Web システムでは，スループットが 1 秒あたり 50 リクエスト，平均レスポンスタイムが 0.4 秒で安定している。各リクエストが 1 台の CPU に対して必要とする処理時間（サービス要求時間）は平均 0.008 秒である。リトルの法則による平均同時処理リクエスト数と，この CPU の利用率の組合せとして，適切なものはどれか。
    c:
      - 平均同時処理数 8，CPU 利用率 20％
      - 平均同時処理数 20，CPU 利用率 8％
      - 平均同時処理数 20，CPU 利用率 40％
      - 平均同時処理数 125，CPU 利用率 40％
    a: ウ
    scope: 4-2-1-1 システムの性能指標。リトルの法則（同時処理数＝スループット×レスポンスタイム）と利用率の法則（利用率＝スループット×サービス要求時間）を性能評価へ適用する範囲内である。
    prereq: リトルの法則と，利用率は単位時間あたりの要求数に 1 件あたりの処理時間を掛けたものであること
    hard: 同じスループットに対して，レスポンスタイムを使う法則とサービス要求時間を使う法則を混同せずに使い分ける必要がある。
    exp: |
      リトルの法則では，系内に滞留する平均同時処理数は，スループット×平均レスポンスタイム＝50×0.4＝20 です。
      CPU 利用率は，スループット×サービス要求時間＝50×0.008＝0.4，すなわち 40％ です。レスポンスタイムには待ち時間も含まれるため，利用率の計算にはサービス要求時間（実際に CPU を使う時間）を使います。
      | 量 | 式 | 値 |
      | --- | --- | --- |
      | 平均同時処理数 | 50×0.4 | 20 |
      | CPU 利用率 | 50×0.008 | 0.4（40％） |
    why:
      - レスポンスタイムとサービス要求時間の組合せを取り違えた誤りです。同時処理数にはレスポンスタイム，利用率にはサービス要求時間を使います。
      - CPU 利用率にサービス要求時間 0.008 秒をパーセント表示のまま読んだ誤りです。50×0.008＝0.4 は割合であり，40％ を表します。
      - 正解です。平均同時処理数はリトルの法則で 50×0.4＝20，CPU 利用率は 50×0.008＝0.4 で 40％ です。
      - 平均同時処理数をスループット÷レスポンスタイム＝125 と割り算した誤りです。リトルの法則は掛け算であり，単位も（件/秒）×秒＝件で一致します。
    know: リトルの法則（平均滞留数＝到着率×平均滞留時間）は待ち行列の分布によらず成り立つ基本法則です。利用率の法則（利用率＝スループット×サービス要求時間）と並べて覚えると，性能測定値どうしの整合を検算できます。
    terms:
      - スループット
      - レスポンスタイム
      - リトルの法則
    verify:
      manual: リトルの法則 L=50*0.4=20。利用率 U=50*0.008=0.4=40%。単位検算 （件/秒）*秒=件，（件/秒）*（秒/件）=無次元とも一致
  - id: A04-508
    topic: 4-2-3
    diff: 3
    q: |
      5 年間利用するシステムの候補が 2 つある。システム A は初期費用 800 万円，年間運用費用 100 万円，3 年目に更新費用 200 万円がかかる。システム B は初期費用 500 万円，年間運用費用 160 万円，4 年目に更新費用 100 万円がかかる。5 年間の TCO（総所有費用）で比べたときの，システム B の TCO と両者の関係の組合せとして，適切なものはどれか。
    c:
      - B の TCO 1,400 万円，B の方が 100 万円安い
      - B の TCO 1,500 万円，両者は等しい
      - B の TCO 1,400 万円，B の方が 100 万円高い
      - B の TCO 1,300 万円，B の方が 200 万円安い
    a: ア
    scope: 4-2-3 システムの経済性の評価（TCO）。初期費用と各年の運用費用と途中の更新費用を同一期間で合計して比較する範囲内の評価計算である。
    prereq: TCO は初期費用だけでなく，利用期間全体の運用費用や更新費用も含めた総額であること
    hard: 年間費用を 5 年分に換算することに加え，発生年が異なる更新費用を漏らさず合計し，最後に差額の向きまで判定する必要がある。
    exp: |
      5 年間の合計をそれぞれ計算します。
      | 候補 | 初期 | 運用（年額×5 年） | 更新 | TCO |
      | --- | --- | --- | --- | --- |
      | A | 800 | 100×5＝500 | 200 | 1,500 万円 |
      | B | 500 | 160×5＝800 | 100 | 1,400 万円 |
      B の TCO は 1,400 万円で，A の 1,500 万円より 100 万円安くなります。初期費用が安い B は運用費用が高いものの，5 年間では逆転しません。
    why:
      - 正解です。B の TCO は 500＋800＋100＝1,400 万円で，A の 1,500 万円より 100 万円安いです。
      - 1,500 万円はシステム A の TCO であり，B の値ではありません。両者の TCO は等しくありません。
      - B の TCO は正しいが，差額の向きが逆です。1,400 万円は 1,500 万円より小さいので，B の方が安くなります。
      - B の更新費用 100 万円を合計から漏らした誤りです。TCO には途中で発生する更新費用も含めます。
    know: TCO（総所有費用）は，初期費用の安さだけで判断せず，運用・保守・更新・教育など利用期間全体で発生する費用を同じ期間にそろえて合計します。初期費用が安い候補でも，年間費用が高ければ長期では逆転する場合があります。
    terms:
      - TCO
    verify:
      manual: A=800+100*5+200=1500。B=500+160*5+100=1400。差=1500-1400=100 で B が安い。更新費用を除いた B=1300 が誤答の根拠であることも確認
