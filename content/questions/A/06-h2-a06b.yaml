questions:
  - id: A06-509
    topic: 6-1-1
    diff: 3
    scope: 6-1-1 D/A 変換の出力電圧。基準電圧を 2 のビット数乗で割って最小の刻みを求め、入力の値に掛ける計算
    prereq: D/A 変換の最小の刻み（分解能）は基準電圧 ÷ 2^ビット数であり、出力は入力のディジタル値にその刻みを掛けた電圧になること
    hard: 分母に 2^ビット数を使うか、最大値（2^ビット数 － 1）を使うかで結果が変わる。本問は 2^ビット数で割る方式であり、刻みから丁寧に計算する必要がある。
    q: |
      4 ビットの D/A 変換器がある。基準電圧は 8 V であり、出力電圧は、入力のディジタル値に、基準電圧を 2 の 4 乗で割った刻みの電圧を掛けたものになる。入力が 2 進数で 1010 のとき、出力電圧は何 V か。
    c: ['5.0 V', '5.33 V', '4.0 V', '6.0 V']
    a: ア
    exp: |
      刻みの電圧は、8 V ÷ 2^4 ＝ 8 ÷ 16 ＝ 0.5 V です。入力 1010 は、桁の重み 8、4、2、1 のうち、8 と 2 が立っているため、10 進数で 10 です。出力電圧は、0.5 V × 10 ＝ 5.0 V となります。最大値の 15 で割る方式と混同しないよう、問題文の「2 の 4 乗で割る」という指定に従うことが要点です。
    why:
      - 正解です。刻み 0.5 V に、入力の値 10 を掛けた値です。
      - 刻みを、基準電圧を最大値の 15 で割って求めた場合の値です。本問の方式は、2 の 4 乗（16）で割ります。
      - 入力の値を、下位のビットだけで 8 と読み違えた場合の値です。1010 は 10 です。
      - 入力 1010 を、12 と読み違えた場合の値です。各桁の重みは 8、4、2、1 です。
    know: D/A 変換の計算は、「刻み ＝ 基準電圧 ÷ 2^ビット数」を先に求めることが要点である。入力の 2 進数の読み違いにも注意する。
    terms: [D/A変換, 分解能]
    verify:
      value: 5
  - id: A06-510
    topic: 6-1-4
    diff: 3
    scope: 6-1-4 論理関数の最小項。出力が 1 になる入力の組合せの数を、真理値表の観点で数える問題
    prereq: 3 変数の入力の組合せは 8 通りであり、最小項は出力が 1 になる組合せを表すこと
    hard: 与えられた最小項の番号から、組合せの総数と取り違えずに、個数を数える必要がある。番号の最大値と個数の混同も起きやすい。
    q: |
      3 変数 A、B、C の論理関数 f が、最小項の和として f ＝ Σ(1, 3, 5) と表されている。入力の組合せのうち、f の値が 1 になるのは何通りか。ここで、最小項の番号は、A を最上位ビットとする入力の 2 進数の値である。
    c: ['3 通り', '5 通り', '8 通り', '4 通り']
    a: ア
    exp: |
      最小項の和 Σ(1, 3, 5) は、入力が 001、011、101 のときに f が 1 になることを表します。列挙されている最小項は 3 つであり、f が 1 になる組合せは 3 通りです。入力の組合せの総数は 2^3 ＝ 8 通りですが、その全てで 1 になるわけではありません。
    why:
      - 正解です。列挙された最小項の個数が、そのまま答えになります。
      - 最小項の番号の最大値を、個数と取り違えた値です。
      - 入力の組合せの総数であり、f が 1 になる組合せの数ではありません。
      - 変数 A が 1 になる入力の組合せの数（8 通りの後半分）です。f が 1 になる組合せは、最小項として列挙された 3 通りだけです。
    know: 最小項の和の表記は、「列挙された番号の組合せで出力が 1」という意味である。個数を聞かれたら、列挙の個数を数える。
    terms: [最小項, 真理値表]
    verify:
      value: 3
  - id: A06-511
    topic: 6-1-5
    diff: 3
    scope: 6-1-5 電池の駆動時間。電池の容量（電流×時間）を平均の消費電流で割って、動作できる時間を求める計算
    prereq: 電池の容量は、流せる電流と時間の積（mAh）で表され、駆動時間は容量 ÷ 消費電流で求まること
    hard: 容量の単位（mAh）が「電流×時間」であることを理解し、割り算の向きを取り違えない必要がある。
    q: |
      電池の容量が 2,000 mAh の機器がある。動作中の平均の消費電流が 50 mA であるとき、この電池で連続して動作できる時間は何時間か。
    c: ['40 時間', '20 時間', '4 時間', '400 時間']
    a: ア
    exp: |
      駆動時間は、電池の容量を消費電流で割って求めます。2,000 mAh ÷ 50 mA ＝ 40 時間です。容量の単位 mAh は「mA の電流を何時間流せるか」を表しており、電流が大きいほど、時間は短くなります。割り算の向きを逆にすると単位も合わなくなるため、「容量 ÷ 電流 ＝ 時間」という関係を、単位と合わせて確認するとよいでしょう。
    why:
      - 正解です。容量 2,000 mAh を消費電流 50 mA で割った値です。
      - 消費電流を 2 倍の 100 mA と取り違えた場合の値です（2,000 ÷ 100）。電流が 2 倍なら、時間は半分になります。
      - 電池の容量を 200 mAh と、桁を 1 つ落として読み違えた場合の値です（200 ÷ 50）。
      - 電池の容量を 20,000 mAh と、桁を 1 つ増やして読み違えた場合の値です（20,000 ÷ 50）。
    know: 駆動時間 ＝ 容量 ÷ 消費電流。mAh という単位の意味（電流×時間）から式を立てることが要点である。
    terms: [電池容量, 消費電流]
    verify:
      value: 40
  - id: A06-512
    topic: 6-1-2
    diff: 3
    scope: 6-1-2 サーミスタの負の温度特性と直列回路の分圧。温度が上がってサーミスタの抵抗が下がるとき、その両端の電圧がどう変化するかを判断する問題
    prereq: 負の温度特性を持つサーミスタは、温度が上がると抵抗値が下がること、直列につないだ素子の電圧は、抵抗の値の比に応じて分かれること
    hard: 「温度が上がる、抵抗が下がる、分圧が下がる」という 2 段の因果をたどる必要がある。固定抵抗の側の電圧（上がる）と取り違えないことが問われる。
    q: |
      負の温度特性を持つサーミスタ（温度が上がると抵抗値が下がる素子）を、固定抵抗と直列につなぎ、両端に一定の電圧を加えている。周囲の温度が上がったとき、サーミスタの両端の電圧はどうなるか。
    c: ['下がる', '上がる', '変わらない', 'ゼロになる']
    a: ア
    exp: |
      直列回路では、全体の電圧が、各素子の抵抗の大きさの比に応じて分かれます（分圧）。温度が上がると、負特性のサーミスタの抵抗値は下がります。すると、全体の中でサーミスタの抵抗が占める割合が小さくなり、サーミスタの両端の電圧も下がります。反対に、固定抵抗の両端の電圧は上がります。このように、温度の変化を電圧の変化として取り出すことが、サーミスタによる温度測定の仕組みです。
    why:
      - 正解です。抵抗が下がれば、その素子が受け持つ電圧の割合も下がります。
      - 上がるのは、固定抵抗の両端の電圧です。サーミスタの抵抗が下がった分、固定抵抗の側の割合が増えます。
      - サーミスタは温度によって抵抗が変化する素子であるため、その分圧も変化します。変わらないのは、両端に加える全体の電圧です。
      - 温度が上がっても、抵抗値がゼロになるわけではありません。小さくなるだけであり、電圧も小さい値になるだけです。
    know: サーミスタの応用は、「温度、抵抗、分圧（または電流）」という因果の連鎖で読み解くことが要点である。負特性では、温度の上昇で抵抗が下がる。
    terms: [サーミスタ]
    verify:
      manual: 負の温度特性（温度の上昇で抵抗が下がる）と、直列回路の分圧（電圧は抵抗の比で分かれる）から、サーミスタの両端の電圧が下がること、固定抵抗側の電圧が上がることを確認した。
  - id: A06-513
    topic: 6-1-3
    diff: 3
    scope: 6-1-3 構成部品としてのメモリの選択。電源を切ってもプログラムを保持しなければならない組込み機器に使う、書換え可能な不揮発性のメモリの判断
    prereq: フラッシュメモリは、電源を切っても内容が消えず、電気的に書き換えられる不揮発性のメモリであり、組込み機器のプログラムの格納に使われること、SRAM や DRAM は電源を切ると内容が消えること
    hard: 「書き換えられる」ことと「電源を切っても消えない」ことの両方を満たす素子を、似た名称のメモリの中から選ぶ必要がある。
    q: |
      組込み機器の制御プログラムを格納するメモリとして、電源を切っても内容が消えず、開発や保守の際にプログラムを書き換えられるものを使いたい。適切なものはどれか。
    c: ['フラッシュメモリ', 'SRAM', 'DRAM', 'レジスタ']
    a: ア
    exp: |
      フラッシュメモリは、電源を切っても内容が消えない不揮発性であり、電気的に書き換えもできるため、組込み機器のプログラムの格納に広く使われます。SRAM と DRAM は、電源を切ると内容が消える揮発性であり、作業用の領域には向きますが、プログラムの保持には向きません。レジスタは、演算のためのごく小さい一時的な記憶です。
    why:
      - 正解です。不揮発性で、書き換えもできるメモリです。
      - SRAM は揮発性であり、電源を切ると内容が消えます。
      - DRAM も揮発性であり、プログラムの保持には向きません。
      - レジスタは一時的な記憶であり、容量も小さく、プログラムの格納用ではありません。
    know: メモリの選択は、「電源を切ると消えるか」と「書き換えられるか」の二つの軸で見分ける。プログラムの格納は、不揮発性で書換え可能なものが担う。
    terms: [フラッシュメモリ, 不揮発性]
    verify:
      manual: 電源を切っても内容が消えず書き換えもできるメモリとしてはフラッシュメモリが適切であることを、揮発性の SRAM・DRAM と一時的なレジスタとの区別から確認した。
  - id: A06-514
    topic: 6-1-1
    diff: 3
    scope: 6-1-1 抵抗の消費電力。オームの法則で電流を求め、電力 ＝ 電圧 × 電流で消費電力を計算する問題
    prereq: オームの法則（電流 ＝ 電圧 ÷ 抵抗）と、消費電力 ＝ 電圧 × 電流の関係を使うこと
    hard: 2 段階の計算（電流を求めてから電力に掛ける）が必要であり、電圧の 2 乗を抵抗で割る形に変形できることの確認も含まれる。
    q: |
      24 Ω の抵抗に、直流の 12 V の電圧を加えた。この抵抗で消費される電力は何 W か。
    c: ['6 W', '12 W', '24 W', '3 W']
    a: ア
    exp: |
      オームの法則から、流れる電流は 12 V ÷ 24 Ω ＝ 0.5 A です。消費電力は、電圧 × 電流 ＝ 12 V × 0.5 A ＝ 6 W となります。電圧の 2 乗を抵抗で割る形（12 × 12 ÷ 24）で計算しても、同じ 6 W が得られます。
    why:
      - 正解です。電流 0.5 A に電圧 12 V を掛けた値です。
      - 電流を 1 A と取り違えた場合の値です。電流は 12 ÷ 24 ＝ 0.5 A です。
      - 抵抗の値そのものを、電力と取り違えた値です。
      - 抵抗を 48 Ω と取り違えた場合の値です。電流が 12 ÷ 48 ＝ 0.25 A となり、電力は 12 × 0.25 ＝ 3 W になります。抵抗は 24 Ω です。
    know: 消費電力の計算は、「まず電流を求める」手順が基本である。電力 ＝ 電圧 × 電流 ＝ 電圧の 2 乗 ÷ 抵抗、の変形も同じ答えになる。
    terms: [消費電力, オームの法則]
    verify:
      value: 6
  - id: A06-515
    topic: 6-1-4
    diff: 3
    scope: 6-1-4 フリップフロップの動作。クロックの立ち上がりの瞬間に入力を取り込む、D フリップフロップのタイミングの判断
    prereq: D フリップフロップは、クロックの立ち上がり（0 から 1 への変化）の瞬間に、入力 D の値を取り込んで出力 Q に保持すること、それ以外の時刻では入力が変わっても出力は変わらないこと
    hard: 入力の変化にそのまま追随するという誤解と、立ち上がりの瞬間だけ取り込むという動作を、時刻の流れの中で切り分ける必要がある。
    q: |
      D フリップフロップがある。時刻 t1 でクロックが 0 から 1 に立ち上がったとき、入力 D は 1 であった。その後、クロックが 1 のままで、入力 D が 0 に変わり、さらに時刻 t2 でクロックが 1 から 0 に立ち下がった。時刻 t2 の直後における、出力 Q の値として、適切なものはどれか。
    c: ['1 のまま', '0 に変わる', '入力 D の変化にそのまま追随する', '0 と 1 を繰り返す']
    a: ア
    exp: |
      D フリップフロップは、クロックの立ち上がりの瞬間に、入力 D の値を取り込んで保持します。本問では、t1 の立ち上がりで D の 1 を取り込むため、Q は 1 になります。その後、D が 0 に変わっても、クロックが立ち上がらなければ Q は変わりません。t2 はクロックの立下りであり、取り込みは起きないため、Q は 1 のままです。
    why:
      - 正解です。取り込みは立ち上がりの瞬間だけであり、その間は値が保持されます。
      - D の変化だけでは Q は変わりません。変わるのは、次の立ち上がりで取り込まれたときです。
      - 入力にそのまま追随するのは、組合せ回路の振る舞いであり、フリップフロップの保持の動作ではありません。
      - 出力が繰り返し変わるのは、発振のような動作であり、本問の条件では起きません。
    know: フリップフロップの読み取りは、「立ち上がりの瞬間の入力値」が全てである。その間の入力の変化は、次の立ち上がりまで無視される。
    terms: [フリップフロップ, クロック]
    verify:
      manual: D フリップフロップはクロックの立ち上がりの瞬間に入力 D を取り込んで保持するため、t1 の立ち上がりで 1 を取り込み、その後の D の変化と t2 の立下りでは出力 Q が 1 のままであることを、タイミングの規則から確認した。
  - id: A06-516
    topic: 6-1-5
    diff: 4
    scope: 6-1-5 熱抵抗と温度上昇。消費電力に熱抵抗を掛けて温度の上昇を求め、許容の上昇から必要な熱抵抗を逆算する計算
    prereq: 素子の温度の上昇は、消費電力 × 熱抵抗で求まること、許容できる上昇が決まれば、必要な熱抵抗はその逆算で求まること
    hard: 掛け算と割り算の向き（上昇 ＝ 電力 × 熱抵抗）を、逆算の場面で取り違えない必要がある。
    q: |
      電子部品が 20 W の電力を消費する。この部品の温度上昇を 40 ℃ 以内に抑えたい。放熱の設計として、熱抵抗が何 ℃/W 以下の放熱器を選ぶ必要があるか。ここで、温度上昇は、消費電力に熱抵抗を掛けた値になる。
    c: ['2 ℃/W', '0.5 ℃/W', '8 ℃/W', '40 ℃/W']
    a: ア
    exp: |
      温度上昇 ＝ 消費電力 × 熱抵抗 という関係から、熱抵抗 ＝ 温度上昇 ÷ 消費電力 ＝ 40 ℃ ÷ 20 W ＝ 2 ℃/W です。温度上昇を 40 ℃ 以内に抑えるには、熱抵抗が 2 ℃/W 以下の放熱器を選ぶ必要があります。熱抵抗が小さいほど、熱が逃げやすく、温度は上がりにくくなります。
    why:
      - 正解です。許容の上昇 40 ℃ を、消費電力 20 W で割った値です。
      - 割り算の向きを逆にし、消費電力を温度上昇で割った場合の値です（20 ÷ 40）。正しくは、温度上昇 ÷ 消費電力です。
      - 40 を 5 で割るなど、消費電力の読み違いで生じる値です。本問の消費電力は 20 W です。
      - 温度上昇の許容値を、そのまま熱抵抗と取り違えた値です。
    know: 熱の計算は、電気のオームの法則と似た形（上昇 ＝ 電力 × 熱抵抗）をしている。逆算では、割り算の向きを確認する。
    terms: [熱抵抗, 放熱]
    verify:
      value: 2
