questions:
  - id: A11-001
    topic: 11-1-1
    diff: 1
    q: 情報セキュリティの三要素のうち，完全性（Integrity）を確保するための対策として，最も適切なものはどれか。
    c:
      - データの改ざんを検知できるように，ハッシュ値やデジタル署名を利用する。
      - データを暗号化して，権限のない人が内容を読めないようにする。
      - サーバを二重化して，障害時にもサービスを継続できるようにする。
      - 入退室管理を行い，権限のない人がサーバ室に入れないようにする。
    a: ア
    exp: |
      情報セキュリティの三要素（CIA）は、機密性（Confidentiality：許可された人だけが利用できる）、完全性（Integrity：正確で改ざんされていない）、可用性（Availability：必要なときに利用できる）です。改ざんを防止・検知する対策は完全性の確保にあたります。
    why:
      - 正解です。改ざんの検知は完全性を確保する対策です。
      - 暗号化による盗み見の防止は、機密性を確保する対策です。
      - 二重化による継続稼働は、可用性を確保する対策です。
      - 入退室管理は、主に機密性（と可用性）を物理的に守る対策です。
    know: 三要素に加えて、真正性（本物であること）、責任追跡性（誰が行ったか追跡できること）、否認防止（後から否定できないこと）、信頼性も情報セキュリティの特性として挙げられます。
    terms: [機密性, 完全性, 可用性]

  - id: A11-002
    topic: 11-1-1
    diff: 2
    q: 情報セキュリティの特性のうち，否認防止の説明として，適切なものはどれか。
    c:
      - ある活動や事象が起きたことを，後になって当事者が否定できないようにすること
      - 情報が改ざんされていないこと
      - 利用者や情報が，主張どおりの本物であること
      - システムが意図したとおりに一貫して動作すること
    a: ア
    exp: |
      否認防止は、例えば「その注文はしていない」「そのメールは送っていない」と後から否定されないように、行為の事実を証明できるようにする特性です。デジタル署名やログ、タイムスタンプなどで実現します。
    why:
      - 正解です。後から否定できないようにするのが否認防止です。
      - これは完全性の説明です。
      - これは真正性の説明です。
      - これは信頼性の説明です。
    terms: [否認防止, デジタル署名]

  - id: A11-003
    topic: 11-1-1
    diff: 2
    q: 多層防御の考え方として，適切なものはどれか。
    c:
      - 入口対策・内部対策・出口対策など複数の異なる対策を重ねて，一つの対策が突破されても被害を防いだり小さくしたりする。
      - 最も強力な一つの対策に予算を集中させ，他の対策は行わない。
      - 外部との境界にファイアウォールを置けば，内部の対策は不要とする。
      - 攻撃を受けてから対策を考える。
    a: ア
    exp: |
      多層防御は、侵入を防ぐ入口対策（ファイアウォールなど）、侵入された後の拡大を防ぐ内部対策（アクセス制御、ログ監視など）、情報の持出しを防ぐ出口対策（通信の監視など）のように、性質の異なる対策を何重にも組み合わせる考え方です。完璧な対策は存在しないことを前提にしています。
    why:
      - 正解です。複数の対策を重ねるのが多層防御です。
      - 一つの対策に頼ると、それが破られたときに防御がなくなります。
      - 境界の対策だけでは、内部不正や侵入後の攻撃に対応できません。
      - 事前に対策を講じておくことが重要です。
    know: セキュリティバイデザインは、システムの企画・設計の段階からセキュリティを組み込む考え方です。プライバシーバイデザインは同様にプライバシー保護を設計段階から組み込む考え方です。
    terms: [多層防御]

  - id: A11-004
    topic: 11-1-2
    diff: 2
    q: 情報セキュリティにおける「脆弱性」の説明として，適切なものはどれか。
    c:
      - 脅威につけ込まれるおそれのある，情報資産や管理策の弱点
      - 情報資産に損害を与える可能性のある，望ましくない事象の潜在的な原因
      - 組織にとって価値のある情報やシステム
      - 脅威によって実際に発生した損害の金額
    a: ア
    exp: |
      脆弱性は、ソフトウェアのバグや設定の不備、規程の未整備、従業員の知識不足など、脅威に悪用されうる弱点のことです。情報資産に脅威が脆弱性を突いて作用したときに、リスクが現実のものになります。
    why:
      - 正解です。脅威に悪用されうる弱点が脆弱性です。
      - これは脅威の説明です。
      - これは情報資産の説明です。
      - これは損失（被害額）の説明です。
    terms: [脆弱性, 脅威, 情報資産]

  - id: A11-005
    topic: 11-1-3-1
    diff: 1
    q: ソーシャルエンジニアリングに該当するものはどれか。
    c:
      - システム管理者を装って電話をかけ，利用者からパスワードを聞き出す。
      - 大量のパスワードの候補を自動で試して，ログインを試みる。
      - Web アプリケーションの入力欄に不正な SQL 文を入力する。
      - 大量の通信をサーバに送りつけて，サービスを停止させる。
    a: ア
    exp: |
      ソーシャルエンジニアリングは、技術的な手段ではなく、人の心理的な隙や行動のミスにつけ込んで情報を盗む手口です。なりすましの電話、肩越しにのぞき見るショルダーハッキング、ごみ箱をあさるスキャベンジングなどがあります。
    why:
      - 正解です。人をだまして情報を聞き出すのはソーシャルエンジニアリングです。
      - これは総当たり攻撃などの技術的な攻撃です。
      - これは SQL インジェクションです。
      - これは DoS 攻撃です。
    terms: [ソーシャルエンジニアリング]

  - id: A11-006
    topic: 11-1-3-1
    diff: 2
    q: ビジネスメール詐欺（BEC）の手口として，適切なものはどれか。
    c:
      - 取引先や自社の経営者になりすました電子メールを送り，偽の口座に送金させる。
      - 無差別に大量の広告メールを送りつける。
      - メールの添付ファイルに仕込んだマルウェアで，ファイルを暗号化して身代金を要求する。
      - 偽の Web サイトに誘導して，クレジットカード番号を入力させる。
    a: ア
    exp: |
      ビジネスメール詐欺（BEC：Business Email Compromise）は、取引先や経営者などになりすました巧妙なメールで、企業の担当者をだまして偽の口座に送金させる詐欺です。実際のメールのやり取りを盗み見たうえで、請求書の振込先の変更を装うなどの手口があります。振込先の変更は、メール以外の手段で相手に確認することが有効な対策です。
    why:
      - 正解です。なりすましメールで送金させるのが BEC です。
      - これは迷惑メール（スパム）の説明です。
      - これはランサムウェアの説明です。
      - これはフィッシングの説明です。
    terms: [ビジネスメール詐欺]

  - id: A11-007
    topic: 11-1-3-2
    diff: 1
    q: ワームの特徴として，適切なものはどれか。
    c:
      - 他のプログラムに寄生せず，単独で動作して，ネットワークなどを通じて自ら複製を広げる。
      - 他のプログラムのファイルに寄生し，そのプログラムの実行によって感染を広げる。
      - 有用なソフトウェアを装って利用者に実行させ，裏で不正な動作をする。
      - 利用者の入力したキーの内容を記録して，外部に送信する。
    a: ア
    exp: |
      ワームは、他のファイルに寄生せず単独のプログラムとして動作し、ネットワークの脆弱性などを利用して自分自身の複製を次々に他のコンピュータへ送り込んで感染を広げるマルウェアです。短時間で大規模に広がることがあります。
    why:
      - 正解です。単独で動作し自己増殖するのがワームです。
      - これはコンピュータウイルス（狭義）の説明です。
      - これはトロイの木馬の説明です。
      - これはキーロガーの説明です。
    terms: [マルウェア]

  - id: A11-008
    topic: 11-1-3-2
    diff: 1
    q: ランサムウェアの説明として，適切なものはどれか。
    c:
      - コンピュータ内のファイルを暗号化するなどして利用できなくし，元に戻すことと引換えに金銭を要求する。
      - 利用者に気付かれないように個人情報を収集して，外部に送信する。
      - 攻撃者が外部から遠隔操作できるようにする。
      - 侵入の痕跡を隠すための道具一式をシステムに組み込む。
    a: ア
    exp: |
      ランサムウェア（ransom＝身代金）は、ファイルを暗号化したり画面をロックしたりしてコンピュータを使えなくし、元に戻すための代金を要求するマルウェアです。近年は、暗号化に加えて盗んだデータを公開すると脅す「二重脅迫」の手口も多く見られます。被害に備えて、ネットワークから切り離したバックアップを取っておくことが重要です。
    why:
      - 正解です。暗号化などで使えなくして身代金を要求します。
      - これはスパイウェアの説明です。
      - これはボットや RAT（遠隔操作型ウイルス）の説明です。
      - これはルートキットの説明です。
    terms: [ランサムウェア, マルウェア]

  - id: A11-009
    topic: 11-1-3-2
    diff: 2
    q: ボットネットにおける C&C サーバの役割として，適切なものはどれか。
    c:
      - ボットに感染した多数のコンピュータに指令を送り，DDoS 攻撃や迷惑メールの送信などを一斉に行わせる。
      - 感染したコンピュータのファイルを暗号化する鍵を生成する。
      - ボットの感染を検知して駆除する。
      - 正規の Web サイトの証明書を発行する。
    a: ア
    exp: |
      ボットは、感染したコンピュータを外部から遠隔操作できるようにするマルウェアです。攻撃者は C&C サーバ（Command and Control サーバ）から、ボットに感染した多数のコンピュータ（ボットネット）に指令を出し、DDoS 攻撃、迷惑メールの送信、情報の窃取などを一斉に行わせます。
    why:
      - 正解です。ボットに指令を送るのが C&C サーバです。
      - 暗号化の鍵はランサムウェアの攻撃に関わるもので、C&C サーバの定義ではありません。
      - 駆除はマルウェア対策ソフトの役割です。
      - 証明書の発行は認証局（CA）の役割です。
    know: 社内のコンピュータから C&C サーバへの通信を検知・遮断すること（出口対策）は、感染後の被害拡大を防ぐのに有効です。
    terms: [ボット, マルウェア]

  - id: A11-010
    topic: 11-1-3-2
    diff: 2
    q: ファイルレスマルウェアの特徴として，適切なものはどれか。
    c:
      - 実行ファイルをディスクに保存せず，OS に標準で備わるツールやメモリ上で不正な処理を行うため，ファイルを検査する対策では検知しにくい。
      - ファイルを一切暗号化しないので，被害は発生しない。
      - 必ず USB メモリを経由して感染する。
      - 正規のソフトウェアの開発元が配布する。
    a: ア
    exp: |
      ファイルレスマルウェアは、不正なプログラムのファイルをディスクに置かず、PowerShell などの OS に正規に備わる機能を悪用したり、メモリ上だけで動作したりするマルウェアです。ファイルを検査して検知するパターンマッチング型の対策をすり抜けやすいため、振る舞いの監視などの対策が必要です。
    why:
      - 正解です。ファイルを残さず正規の機能を悪用するため検知しにくいのが特徴です。
      - ファイルを暗号化するかどうかは定義と関係なく、情報窃取などの被害が発生します。
      - 感染経路は USB メモリに限りません。メールや Web などからも感染します。
      - 正規の開発元が配布するものではありません。
    terms: [マルウェア]

  - id: A11-011
    topic: 11-1-4
    diff: 2
    q: シャドー IT の説明として，適切なものはどれか。
    c:
      - 従業員が，組織の許可を得ずに，業務に個人のクラウドサービスや端末などを利用すること
      - 組織が公式に導入し，情報システム部門が管理している IT 資産
      - 攻撃者が組織のシステムに仕掛けた隠れた侵入口
      - 停電に備えて設置した予備の IT 設備
    a: ア
    exp: |
      シャドー IT は、組織の管理外で、従業員が個人的に契約したクラウドストレージやチャットサービス、私物の端末などを業務に使うことです。組織が把握できないため、情報漏えいの原因や、事故発生時の対応の遅れにつながるおそれがあります。人的な脆弱性や管理上の不備の一種です。
    why:
      - 正解です。許可のない IT の業務利用がシャドー IT です。
      - 公式に管理されている IT 資産はシャドー IT ではありません。
      - 隠れた侵入口はバックドアです。
      - 予備設備はシャドー IT ではありません。
    terms: [シャドーIT, 脆弱性]

  - id: A11-012
    topic: 11-1-5
    diff: 2
    q: 不正のトライアングル理論で，不正が発生する3つの要因の組合せとして，適切なものはどれか。
    c: ['機会，動機，正当化', '脅威，脆弱性，資産', '計画，実行，評価', '機密性，完全性，可用性']
    a: ア
    exp: |
      不正のトライアングルは、不正行為は「機会」（不正ができる環境）、「動機」（不正をする理由、例えば金銭的な困窮やノルマ）、「正当化」（自分の行為を正当だと思い込む心理）の3つがそろったときに発生するという理論です。内部不正の対策では、これらの要因を減らすこと、特に機会をなくす（アクセス権の最小化、監視の強化など）ことが重要です。
    why:
      - 正解です。機会・動機・正当化の3要因です。
      - これはリスクを構成する要素です。
      - これは PDCA サイクルなどの管理活動の要素です。
      - これは情報セキュリティの三要素です。
    know: 状況的犯罪予防や割れ窓理論（小さな乱れを放置すると大きな犯罪を招く）も、犯罪が起きにくい環境作りの考え方です。
    terms: [不正のトライアングル]

  - id: A11-013
    topic: 11-1-6
    diff: 2
    q: サイバーキルチェーンの説明として，適切なものはどれか。
    c:
      - 標的型攻撃などの攻撃の過程を，偵察から目的の実行までの段階に分けてモデル化したもの
      - 複数の暗号方式を組み合わせて安全性を高める方法
      - 攻撃者どうしが盗んだ情報を売買する，匿名性の高い Web 上の場
      - 組織の情報セキュリティ対策を段階的に評価する認証制度
    a: ア
    exp: |
      サイバーキルチェーンは、サイバー攻撃を「偵察 → 武器化 → 配送 → 攻撃 → インストール → 遠隔操作（C&C）→ 目的の実行」といった段階に分けて捉えるモデルです。各段階で攻撃を断ち切る対策を考えるのに役立ちます。
    why:
      - 正解です。攻撃の過程を段階に分けたモデルです。
      - 暗号方式の組合せはハイブリッド暗号などです。
      - これはダークウェブの説明です。
      - これは認証制度の説明ではありません。
    terms: [サイバーキルチェーン]

  - id: A11-014
    topic: 11-1-7
    diff: 2
    q: パスワードリスト攻撃の説明として，適切なものはどれか。
    c:
      - 他のサービスから流出した利用者 ID とパスワードの組を使って，別のサービスへのログインを試みる。
      - 辞書に載っている単語をパスワードの候補として順に試す。
      - 1つのパスワードを固定し，利用者 ID を次々に変えてログインを試みる。
      - 考えられるすべての文字の組合せを順に試す。
    a: ア
    exp: |
      パスワードリスト攻撃（クレデンシャルスタッフィング）は、どこかのサービスから流出した ID とパスワードの組を、別のサービスに対して試す攻撃です。同じパスワードを複数のサービスで使い回していると被害を受けます。対策として、パスワードの使い回しをしないことや多要素認証の利用が有効です。
    why:
      - 正解です。流出した ID とパスワードの組を他のサービスで試します。
      - これは辞書攻撃の説明です。
      - これはリバースブルートフォース攻撃の説明です。よく使われる弱いパスワードを固定して試します。
      - これは総当たり（ブルートフォース）攻撃の説明です。
    terms: [パスワード攻撃]

  - id: A11-015
    topic: 11-1-7
    diff: 2
    q: クロスサイトスクリプティング（XSS）の説明として，適切なものはどれか。
    c:
      - Web アプリケーションが利用者の入力をそのまま画面に出力する脆弱性を悪用し，閲覧者のブラウザ上で不正なスクリプトを実行させる。
      - Web アプリケーションに不正な SQL 文を入力して，データベースを不正に操作する。
      - ログイン中の利用者に罠のリンクを踏ませ，利用者の意図しない処理（送金や投稿など）をサーバに要求させる。
      - パス名に「../」などを含めて，公開を意図していないファイルにアクセスする。
    a: ア
    exp: |
      クロスサイトスクリプティングは、入力された値を適切に処理せずに Web ページに出力する脆弱性を突き、攻撃者が仕込んだスクリプトを閲覧者のブラウザで実行させる攻撃です。cookie の盗難（セッションハイジャック）や偽の入力画面の表示などの被害につながります。出力時に「<」「>」などの特別な意味をもつ文字を無害な文字に置き換える（エスケープ処理）ことが基本的な対策です。
    why:
      - 正解です。閲覧者のブラウザで不正なスクリプトを実行させる攻撃です。
      - これは SQL インジェクションの説明です。
      - これはクロスサイトリクエストフォージェリ（CSRF）の説明です。
      - これはディレクトリトラバーサルの説明です。
    terms: [クロスサイトスクリプティング, Webアプリケーションの脆弱性]

  - id: A11-016
    topic: 11-1-7
    diff: 2
    q: SQL インジェクションへの対策として，最も適切なものはどれか。
    c:
      - SQL 文の組立てにプレースホルダ（バインド機構）を使い，入力値が SQL 文の構造として解釈されないようにする。
      - Web ページの出力時に，HTML の特別な意味をもつ文字をエスケープする。
      - 通信を TLS で暗号化する。
      - パスワードにソルトを付けてハッシュ化する。
    a: ア
    exp: |
      SQL インジェクションは、入力欄に SQL 文の一部となる文字列を入力して、本来の意図と異なる SQL 文を実行させ、データベースの情報を盗んだり改ざんしたりする攻撃です。プレースホルダを使うと、入力値はあくまで「値」として扱われ、SQL 文の構造を変えられなくなるため、根本的な対策になります。
    why:
      - 正解です。プレースホルダが SQL インジェクションの根本的な対策です。
      - これはクロスサイトスクリプティングへの対策です。
      - 通信の暗号化は盗聴への対策で、SQL インジェクションは防げません。
      - これは流出したパスワードを解読されにくくする対策です。
    terms: [SQLインジェクション, Webアプリケーションの脆弱性]

  - id: A11-017
    topic: 11-1-7
    diff: 2
    q: クロスサイトリクエストフォージェリ（CSRF）への対策として，適切なものはどれか。
    c:
      - 重要な処理を行うページで，正規の画面から送られたことを確認するための推測困難なトークンを埋め込み，送信時に検証する。
      - 入力された文字列から SQL 文で特別な意味をもつ文字を取り除く。
      - Web サーバのファイルのパス名に「../」が含まれていないかを確認する。
      - 大量の通信を送ってくる IP アドレスからの通信を遮断する。
    a: ア
    exp: |
      CSRF は、ログイン中の利用者を罠のサイトに誘導し、利用者のブラウザから正規のサイトへ、利用者の意図しない要求（送金、パスワード変更、投稿など）を送らせる攻撃です。正規の画面にだけ推測困難なトークンを埋め込み、送られてきた要求にそのトークンが含まれているかを確認すると、罠のサイトからの要求を見分けられます。重要な処理の前にパスワードを再入力させる方法もあります。
    why:
      - 正解です。推測困難なトークンの検証が CSRF の代表的な対策です。
      - これは SQL インジェクションへの対策（不十分な方法）です。
      - これはディレクトリトラバーサルへの対策です。
      - これは DoS 攻撃への対策です。
    terms: [Webアプリケーションの脆弱性]

  - id: A11-018
    topic: 11-1-7
    diff: 2
    q: DNS キャッシュポイズニングの説明として，適切なものはどれか。
    c:
      - DNS サーバに偽の応答を記憶させ，利用者を本物とは異なる偽のサーバに誘導する。
      - DNS サーバに大量の問合せを送り，サービスを停止させる。
      - 電子メールの送信者のアドレスを偽装する。
      - 利用者の通信経路に割り込んで，通信内容を盗聴・改ざんする。
    a: ア
    exp: |
      DNS キャッシュポイズニングは、DNS サーバのキャッシュ（一時的に記憶した問合せ結果）に偽の情報を送り込み、正しいドメイン名で接続しようとした利用者を偽のサイトに誘導する攻撃です。対策として、DNS の応答に電子署名を付けて正当性を検証する DNSSEC があります。
    why:
      - 正解です。偽の応答をキャッシュさせる攻撃です。
      - これは DNS サーバに対する DoS 攻撃です。
      - これはメールの送信元の偽装（スプーフィング）です。
      - これは中間者攻撃です。
    terms: [DNSキャッシュポイズニング, DNS]

  - id: A11-019
    topic: 11-1-7
    diff: 2
    q: MITB（Man-in-the-browser）攻撃の説明として，適切なものはどれか。
    c:
      - 利用者の PC に感染したマルウェアがブラウザの通信を乗っ取り，正規のインターネットバンキングの画面上で送金先などを改ざんする。
      - 攻撃者が無線 LAN のアクセスポイントになりすまし，通信を盗聴する。
      - 大量の端末から一斉に Web サーバに通信を送る。
      - 正規の Web サイトに似た偽サイトに利用者を誘導する。
    a: ア
    exp: |
      MITB 攻撃は、利用者のブラウザにマルウェアを入り込ませ、ブラウザと Web サイトの間の情報を書き換える攻撃です。利用者は正規のサイトに正しく接続しているため気付きにくく、TLS で通信を暗号化していても防げません。送金内容を別の経路で確認するトランザクション認証などが対策として使われます。
    why:
      - 正解です。ブラウザ内部で通信を乗っ取る攻撃です。
      - これは偽アクセスポイント（悪魔の双子）による中間者攻撃です。
      - これは DDoS 攻撃です。
      - これはフィッシングです。
    terms: [中間者攻撃]

  - id: A11-020
    topic: 11-1-7
    diff: 2
    q: 水飲み場型攻撃の説明として，適切なものはどれか。
    c:
      - 攻撃対象の組織の従業員がよく閲覧する Web サイトを改ざんし，閲覧した人にマルウェアを感染させる。
      - 不特定多数の人に，マルウェアを添付したメールを大量に送る。
      - 検索結果の上位に悪意のあるサイトが表示されるように細工する。
      - ソフトウェアの脆弱性が公表される前に，その脆弱性を悪用する。
    a: ア
    exp: |
      水飲み場型攻撃は、肉食動物が水飲み場で獲物を待ち伏せするように、標的の組織の人がよく訪れる Web サイトを改ざんして待ち伏せし、閲覧した人をマルウェアに感染させる標的型攻撃の一種です。特定の組織の IP アドレスからのアクセスにだけ攻撃するなど、発見されにくくする工夫がされることもあります。
    why:
      - 正解です。標的がよく訪れるサイトで待ち伏せする攻撃です。
      - これはばらまき型のメール攻撃です。
      - これは SEO ポイズニングです。
      - これはゼロデイ攻撃です。
    terms: [標的型攻撃]

  - id: A11-021
    topic: 11-1-7
    diff: 2
    q: ゼロデイ攻撃の説明として，適切なものはどれか。
    c:
      - ソフトウェアの脆弱性が発見されてから，修正プログラムが提供される前に，その脆弱性を悪用する攻撃
      - システムの導入初日に行われる攻撃
      - 攻撃の準備に時間をかけずに行う攻撃
      - 修正プログラムが提供されてから何年も経過した脆弱性を悪用する攻撃
    a: ア
    exp: |
      ゼロデイ攻撃は、脆弱性が発見されても、修正プログラム（パッチ）が提供される前、または脆弱性が公表される前の、対策がない期間に行われる攻撃です。修正プログラムの適用だけでは防げないため、多層防御や振る舞い検知などの対策が重要です。
    why:
      - 正解です。修正プログラムの提供前に脆弱性を悪用する攻撃です。
      - 導入初日の攻撃という意味ではありません。
      - 準備時間の長さとは関係ありません。
      - 修正済みの古い脆弱性を悪用する攻撃は、パッチ未適用のシステムを狙うものでゼロデイ攻撃ではありません。
    terms: [ゼロデイ攻撃]

  - id: A11-022
    topic: 11-1-7
    diff: 2
    q: 生成 AI に対するプロンプトインジェクションの説明として，適切なものはどれか。
    c:
      - 悪意のある指示を入力やデータに紛れ込ませて，AI に開発者の意図しない動作や情報の出力をさせる。
      - AI の学習データに誤ったデータを大量に混ぜて，判断の精度を下げる。
      - 画像に人には分からない細工をして，AI に誤認識させる。
      - AI の利用料金の支払いを不正に免れる。
    a: ア
    exp: |
      プロンプトインジェクションは、生成 AI への入力（プロンプト）や、AI が読み込む Web ページ・文書などに、悪意のある指示を紛れ込ませ、本来の制約を無視させたり、機密情報を出力させたりする攻撃です。
    why:
      - 正解です。悪意のある指示を紛れ込ませて意図しない動作をさせる攻撃です。
      - これはデータポイズニング（学習データの汚染）です。
      - これは敵対的サンプル（Adversarial Examples）です。
      - これは利用料金の不正であり、プロンプトインジェクションではありません。
    terms: [プロンプトインジェクション]

  - id: A11-023
    topic: 11-1-7
    diff: 2
    q: DDoS 攻撃の説明として，適切なものはどれか。
    c:
      - 多数のコンピュータから標的のサーバやネットワークに大量の通信を送り，サービスを提供できない状態にする。
      - 1台のコンピュータから，パスワードを総当たりで試す。
      - 利用者のブラウザで不正なスクリプトを実行させる。
      - 通信の内容を盗聴する。
    a: ア
    exp: |
      DoS 攻撃（サービス妨害攻撃）は、大量の通信や処理要求を送りつけて、サーバやネットワークを過負荷にし、サービスを提供できなくする攻撃です。DDoS（Distributed DoS）攻撃は、ボットに感染させた多数のコンピュータなどを使って、分散した多数の送信元から一斉に攻撃するもので、送信元を遮断するだけでは防ぎにくいのが特徴です。主に可用性を損なう攻撃です。
    why:
      - 正解です。多数の送信元から大量の通信を送る攻撃です。
      - これは総当たり攻撃です。
      - これはクロスサイトスクリプティングです。
      - これは盗聴です。
    terms: [DoS攻撃, ボット]

  - id: A11-024
    topic: 11-1-7
    diff: 2
    q: ディレクトリトラバーサル攻撃の説明として，適切なものはどれか。
    c:
      - ファイル名を指定する入力に「../」などを含めて上位のディレクトリをたどり，公開を意図していないファイルにアクセスする。
      - 入力欄に OS のコマンドを含めて，サーバ上で不正なコマンドを実行させる。
      - 確保された領域を超える長いデータを入力して，プログラムの戻り先を書き換える。
      - 透明にした正規のページを罠のページに重ね，利用者に意図しない操作をさせる。
    a: ア
    exp: |
      ディレクトリトラバーサルは、Web アプリケーションがファイル名を受け取ってファイルを開く処理で、「../」（親ディレクトリ）を使ったパス名を指定し、本来アクセスできない設定ファイルやパスワードファイルを読み出す攻撃です。対策として、ファイル名にディレクトリを含む文字を受け付けない、ファイル名を直接指定させない設計にする、などがあります。
    why:
      - 正解です。「../」で上位ディレクトリをたどる攻撃です。
      - これは OS コマンドインジェクションです。
      - これはバッファオーバーフロー攻撃です。
      - これはクリックジャッキングです。
    terms: [Webアプリケーションの脆弱性]

  - id: A11-025
    topic: 11-1-7
    diff: 2
    q: 攻撃の準備段階として行われるポートスキャンの目的として，適切なものはどれか。
    c:
      - 標的のコンピュータでどのポートが開いているか（どのサービスが動作しているか）を調べ，攻撃に利用できる脆弱性を探す。
      - 標的のコンピュータのファイルを暗号化する。
      - 標的のコンピュータの時刻を狂わせる。
      - 標的の組織の従業員の電話番号を収集する。
    a: ア
    exp: |
      ポートスキャンは、標的のコンピュータの各ポートに接続を試み、応答から開いているポートや動作しているサービス・ソフトウェアの種類を調べる行為です。攻撃者はこれを足がかりに、脆弱性のあるサービスを探します。組織では、不要なポートを閉じ、不審なスキャンを検知する対策をとります。
    why:
      - 正解です。開いているポートやサービスを調べて脆弱性を探します。
      - ファイルの暗号化はランサムウェアの被害です。
      - 時刻を狂わせる目的ではありません。
      - 従業員の情報の収集は、フットプリンティング（情報収集）の一部ですが、ポートスキャンの目的ではありません。
    terms: [ポートスキャン]

  - id: A11-026
    topic: 11-1-8-1
    diff: 2
    q: 10人の利用者が，互いに秘密に通信するための鍵を用意する。共通鍵暗号方式の場合に必要な鍵の総数と，公開鍵暗号方式の場合に必要な鍵の総数の組合せとして，正しいものはどれか。
    c: ['共通鍵 45個，公開鍵 20個', '共通鍵 20個，公開鍵 45個', '共通鍵 10個，公開鍵 10個', '共通鍵 90個，公開鍵 20個']
    a: ア
    exp: |
      共通鍵暗号方式では、通信する2人の組ごとに別の鍵が必要です。10人から2人を選ぶ組合せは ₁₀C₂＝10×9÷2＝45 通りなので、45個です。
      公開鍵暗号方式では、各人が公開鍵と秘密鍵の組を1つずつ持てばよいので、10×2＝20個です。
    why:
      - 正解です。共通鍵は 45個、公開鍵は 20個です。
      - 共通鍵と公開鍵の数が逆です。
      - 共通鍵方式では2人の組ごとに鍵が必要で、公開鍵方式では1人につき2つの鍵が必要です。
      - 90個は組合せではなく順列（10×9）で数えた誤りです。同じ鍵を2回数えています。
    know: 利用者が n 人のとき、共通鍵は n(n−1)/2 個、公開鍵（鍵の組）は 2n 個です。人数が多いほど公開鍵方式の方が鍵の管理が容易になります。
    terms: [共通鍵暗号方式, 公開鍵暗号方式]
    verify: { value: '10 * 9 / 2' }

  - id: A11-027
    topic: 11-1-8-1
    diff: 2
    q: 公開鍵暗号方式で，A さんが B さんに，B さん以外には読めないように暗号文を送るときに用いる鍵の組合せはどれか。
    c:
      - B さんの公開鍵で暗号化し，B さんの秘密鍵で復号する。
      - A さんの秘密鍵で暗号化し，A さんの公開鍵で復号する。
      - A さんの公開鍵で暗号化し，B さんの秘密鍵で復号する。
      - B さんの秘密鍵で暗号化し，B さんの公開鍵で復号する。
    a: ア
    exp: |
      公開鍵暗号方式では、ある人の公開鍵で暗号化したデータは、その人の秘密鍵でしか復号できません。B さんの公開鍵は誰でも入手できますが、それで暗号化した暗号文を復号できるのは秘密鍵を持つ B さんだけなので、機密性を確保できます。
    why:
      - 正解です。受信者の公開鍵で暗号化し、受信者の秘密鍵で復号します。
      - A さんの公開鍵は誰でも入手できるので、誰でも復号できてしまいます。これはデジタル署名で使う鍵の組合せです。
      - 対になっていない鍵では復号できません。
      - B さんの秘密鍵は B さん本人しか持っていないので、A さんは暗号化に使えません。
    terms: [公開鍵暗号方式]

  - id: A11-028
    topic: 11-1-8-1
    diff: 2
    q: ハイブリッド暗号方式の説明として，適切なものはどれか。
    c:
      - データの暗号化には処理の速い共通鍵暗号方式を使い，その共通鍵を相手に安全に渡すために公開鍵暗号方式を使う。
      - 同じデータを共通鍵暗号方式と公開鍵暗号方式で二重に暗号化する。
      - 暗号化とハッシュ化を交互に繰り返す。
      - 暗号化の鍵を毎回ランダムに変えて，鍵を相手に渡さずに通信する。
    a: ア
    exp: |
      共通鍵暗号方式は処理が速い反面、鍵を相手に安全に渡す方法が課題です。公開鍵暗号方式は鍵の配送の問題を解決できますが、処理に時間がかかります。ハイブリッド暗号方式は両方の長所を組み合わせ、データ本体は共通鍵で暗号化し、その共通鍵を相手の公開鍵で暗号化して送ります。TLS などで使われています。
    why:
      - 正解です。データは共通鍵、鍵の受渡しは公開鍵で暗号化します。
      - 二重に暗号化する方式ではありません。
      - 暗号化とハッシュ化を交互に繰り返す方式ではありません。
      - 鍵を相手と共有しなければ、相手は復号できません。
    terms: [共通鍵暗号方式, 公開鍵暗号方式]

  - id: A11-029
    topic: 11-1-8-1
    diff: 2
    q: 暗号学的ハッシュ関数（SHA-256 など）の性質として，適切なものはどれか。
    c:
      - 任意の長さのデータから固定長の値を生成し，その値から元のデータを求めることは事実上できない。
      - 生成した値を，鍵を使って元のデータに戻すことができる。
      - 入力データの長さに比例して，生成される値の長さが長くなる。
      - 異なるデータからは，必ず同じ値が生成される。
    a: ア
    exp: |
      ハッシュ関数は、任意の長さのデータから固定長の値（ハッシュ値、メッセージダイジェスト）を生成する関数です。暗号学的ハッシュ関数には、ハッシュ値から元のデータを求められない（一方向性）、同じハッシュ値になる別のデータを見つけられない（衝突困難性）という性質があります。データが1ビットでも変わるとハッシュ値が大きく変わるため、改ざんの検知に使われます。
    why:
      - 正解です。固定長で、元のデータを求められない一方向性があります。
      - ハッシュ関数は暗号化とは異なり、元に戻すことはできません。
      - ハッシュ値の長さは入力の長さにかかわらず一定です（SHA-256 なら 256 ビット）。
      - 異なるデータからは、事実上異なる値が生成されます。
    terms: [ハッシュ関数]

  - id: A11-030
    topic: 11-1-8-1
    diff: 2
    q: 暗号の「危殆化」の説明として，適切なものはどれか。
    c:
      - 計算機の性能向上や解読技術の進歩などによって，暗号アルゴリズムの安全性が低下すること
      - 暗号化したデータが通信中に失われること
      - 暗号化の鍵の長さを長くすること
      - 暗号文を正規の鍵で復号すること
    a: ア
    exp: |
      危殆化は、コンピュータの性能向上や新しい解読方法の発見、鍵の漏えいなどによって、それまで安全とされていた暗号アルゴリズムや鍵の安全性が損なわれることです。CRYPTREC 暗号リストなどを参考に、安全性が確認された暗号を選び、危殆化に備えて暗号を移行できるようにしておく必要があります。
    why:
      - 正解です。暗号の安全性が低下することを危殆化といいます。
      - 通信中のデータの消失は危殆化ではありません。
      - 鍵長を長くすることは、危殆化への対策の一つです。
      - 正規の復号は通常の処理です。
    terms: [暗号技術]

  - id: A11-031
    topic: 11-1-8-2
    diff: 2
    q: デジタル署名で確認できることの組合せとして，適切なものはどれか。
    c: ['送信者の真正性とメッセージの完全性', 'メッセージの機密性と可用性', '送信者の可用性と受信者の機密性', 'メッセージの機密性だけ']
    a: ア
    exp: |
      デジタル署名では、送信者が自分の秘密鍵で（メッセージのハッシュ値に）署名し、受信者は送信者の公開鍵で検証します。署名を検証できれば、その秘密鍵を持つ本人が署名したこと（真正性、否認防止）と、メッセージが改ざんされていないこと（完全性）を確認できます。メッセージ自体は暗号化されないので、機密性は確保されません。
    why:
      - 正解です。送信者の真正性と完全性を確認できます。
      - デジタル署名はメッセージを暗号化しないので、機密性は確保されません。可用性とも関係ありません。
      - 可用性・機密性は確認できません。
      - 機密性は確保されません。
    terms: [デジタル署名]

  - id: A11-032
    topic: 11-1-8-2
    diff: 3
    q: デジタル署名の生成と検証に用いる鍵の組合せとして，正しいものはどれか。
    c:
      - 送信者の秘密鍵で署名を生成し，送信者の公開鍵で検証する。
      - 送信者の公開鍵で署名を生成し，送信者の秘密鍵で検証する。
      - 受信者の公開鍵で署名を生成し，受信者の秘密鍵で検証する。
      - 送信者と受信者が共有する共通鍵で署名を生成し，同じ鍵で検証する。
    a: ア
    exp: |
      署名は本人しかできないものでなければならないため、本人だけが持つ送信者の秘密鍵で生成します。検証は誰でもできるように、送信者の公開鍵で行います。
    why:
      - 正解です。秘密鍵で署名し、公開鍵で検証します。
      - 公開鍵は誰でも入手できるため、誰でも署名を偽造できてしまいます。
      - これは受信者宛ての暗号化で使う鍵の組合せで、送信者の本人確認にはなりません。
      - 共通鍵を使う方式はメッセージ認証符号（MAC）で、受信者も同じ値を作れるため、第三者に対する否認防止にはなりません。
    terms: [デジタル署名, 公開鍵暗号方式]

  - id: A11-033
    topic: 11-1-8-2
    diff: 3
    q: 電子文書にタイムスタンプ（時刻認証）を付与することで証明できることとして，適切なものはどれか。
    c:
      - その時刻に文書が存在し，その時刻以降に改ざんされていないこと
      - 文書の作成者が誰であるか
      - 文書の内容が正しいこと
      - 文書が暗号化されていること
    a: ア
    exp: |
      タイムスタンプは、信頼できる時刻認証局が、文書のハッシュ値と時刻を結び付けて証明する仕組みです。「その時刻にその文書が存在したこと（存在証明）」と、「その時刻以降に改ざんされていないこと（完全性）」を証明できます。デジタル署名と組み合わせると、署名の時刻も証明できます。
    why:
      - 正解です。存在した時刻と、それ以降の非改ざんを証明します。
      - 作成者の証明はデジタル署名の役割です。
      - 内容の正しさまでは証明できません。
      - 暗号化とは関係ありません。
    terms: [タイムスタンプ, デジタル署名]

  - id: A11-034
    topic: 11-1-8-3
    diff: 1
    q: 多要素認証に該当するものはどれか。
    c:
      - パスワードを入力した後，スマートフォンに届いた確認コードを入力する。
      - パスワードを入力した後，秘密の質問の答えを入力する。
      - 2種類の異なるパスワードを順に入力する。
      - 利用者 ID とパスワードを入力する。
    a: ア
    exp: |
      多要素認証は、記憶（パスワードなど知っているもの）、所持（スマートフォンや IC カードなど持っているもの）、生体（指紋や顔など本人の身体的特徴）の異なる要素を2つ以上組み合わせる認証です。パスワード（記憶）とスマートフォン（所持）の組合せは多要素認証です。
    why:
      - 正解です。記憶と所持の2つの要素を組み合わせています。
      - パスワードも秘密の質問も「記憶」の要素で、要素は1種類です（多段階認証ではあります）。
      - 2つとも「記憶」の要素です。
      - 利用者 ID は秘密の情報ではなく、パスワードの1要素だけです。
    terms: [多要素認証]

  - id: A11-035
    topic: 11-1-8-3
    diff: 2
    q: シングルサインオン（SSO）の説明として，適切なものはどれか。
    c:
      - 一度の認証で，連携している複数のシステムやサービスを，再度ログインせずに利用できるようにする。
      - 1台の端末を，1人の利用者だけが使えるようにする。
      - ログインのたびに異なるパスワードを使う。
      - パスワードを使わずに，指紋だけで認証する。
    a: ア
    exp: |
      シングルサインオンは、利用者が一度認証を受ければ、連携する複数のシステムやサービスに、個別にログインし直さなくても利用できる仕組みです。利用者の利便性が高まり、パスワードの使い回しやメモ書きを減らせます。一方で、認証情報が漏れると複数のシステムに不正にアクセスされるため、多要素認証と組み合わせるなどの対策が重要です。
    why:
      - 正解です。一度の認証で複数のサービスを利用できます。
      - 端末の専用化はシングルサインオンではありません。
      - これはワンタイムパスワードの説明です。
      - これは生体認証の説明です。
    terms: [シングルサインオン]

  - id: A11-036
    topic: 11-1-8-3
    diff: 2
    q: FIDO（ファイド）によるパスワードレス認証の特徴として，適切なものはどれか。
    c:
      - 端末側で生体認証などによって本人確認を行い，公開鍵暗号を使ってサーバに認証結果を伝えるので，サーバにパスワードや生体情報を送らない。
      - サーバに利用者の指紋の画像を送信して照合する。
      - パスワードを短くして入力の手間を減らす。
      - 認証を一切行わずにサービスを利用できる。
    a: ア
    exp: |
      FIDO は、パスワードに頼らない認証の標準規格です。利用者は手元の端末で指紋や顔などによる本人確認を行い、端末内に保管した秘密鍵で署名した結果をサーバに送ります。サーバは事前に登録した公開鍵で検証します。サーバ側にパスワードや生体情報を保管しないため、サーバからの漏えいやフィッシングに強い方式です。
    why:
      - 正解です。端末で本人確認し、公開鍵暗号で認証します。
      - 生体情報はサーバに送りません。
      - パスワードを短くする方式ではありません。
      - 認証は行います。
    terms: [多要素認証, 公開鍵暗号方式]

  - id: A11-037
    topic: 11-1-8-3
    diff: 2
    q: CAPTCHA の目的として，適切なものはどれか。
    c:
      - ゆがんだ文字の読取りや画像の選択などを求め，操作しているのが人間かプログラムかを判別して，自動化された不正なアクセスを防ぐ。
      - 利用者のパスワードを暗号化して保存する。
      - 通信経路を暗号化する。
      - 利用者の端末にマルウェアが感染していないかを検査する。
    a: ア
    exp: |
      CAPTCHA は、人間には容易だがプログラムには難しい課題（ゆがんだ文字の読取り、特定の画像の選択など）を解かせることで、操作者が人間かどうかを判定する仕組みです。プログラムによるアカウントの大量登録やパスワードの自動試行などを防ぐのに使われます。
    why:
      - 正解です。人間かプログラムかを判別する仕組みです。
      - パスワードの保存方法とは関係ありません。
      - 通信の暗号化とは関係ありません。
      - マルウェアの検査とは関係ありません。
    terms: [CAPTCHA]

  - id: A11-038
    topic: 11-1-8-4
    diff: 3
    q: 生体認証で，認証の判定基準を厳しくして他人受入率（FAR）を下げたときに，一般に起こることとして，適切なものはどれか。
    c: ['本人拒否率（FRR）が上がる。', '本人拒否率（FRR）も下がる。', '本人拒否率（FRR）は変化しない。', '他人受入率と本人拒否率がともに 0 になる。']
    a: ア
    exp: |
      他人受入率（FAR）は他人を誤って本人と受け入れてしまう割合、本人拒否率（FRR）は本人を誤って拒否してしまう割合です。判定を厳しくすると他人を受け入れにくくなる（FAR が下がる）一方で、本人まで拒否されやすくなります（FRR が上がる）。この2つはトレードオフの関係にあり、用途に応じて基準を調整します。
    why:
      - 正解です。FAR を下げると FRR は上がります。
      - トレードオフの関係なので、両方を同時に下げることは一般にできません。
      - 判定基準の変更は FRR にも影響します。
      - 両方を 0 にすることは現実にはできません。
    terms: [生体認証]

  - id: A11-039
    topic: 11-1-8-5
    diff: 2
    q: PKI における認証局（CA）の役割として，適切なものはどれか。
    c:
      - 公開鍵とその所有者の対応を証明するデジタル証明書を発行し，必要に応じて失効させる。
      - 利用者の秘密鍵を預かって管理し，要求に応じて利用者に渡す。
      - 通信の内容を暗号化して中継する。
      - 利用者のパスワードを一元的に管理する。
    a: ア
    exp: |
      PKI（公開鍵基盤）では、「この公開鍵は確かにこの人（このサーバ）のものである」ことを、信頼できる第三者である認証局がデジタル証明書を発行して証明します。認証局は、秘密鍵の漏えいなどで無効になった証明書を失効させ、失効した証明書の一覧（CRL）を公開したり、OCSP で有効性の問合せに応じたりします。
    why:
      - 正解です。デジタル証明書の発行と失効が認証局の役割です。
      - 秘密鍵は本人だけが管理するものです。
      - 通信の中継は認証局の役割ではありません。
      - パスワードの管理は認証局の役割ではありません。
    know: ブラウザなどにあらかじめ組み込まれているルート認証局の証明書（ルート証明書）が、信頼の起点（トラストアンカー）になります。
    terms: [PKI, デジタル証明書]

  - id: A11-040
    topic: 11-1-8-5
    diff: 2
    q: デジタル証明書が失効していないかを，オンラインで認証局などに問い合わせて確認するためのプロトコルはどれか。
    c: ['OCSP', 'SMTP', 'SNMP', 'DHCP']
    a: ア
    exp: |
      OCSP（Online Certificate Status Protocol）は、デジタル証明書が有効か失効しているかを、OCSP レスポンダにリアルタイムで問い合わせるプロトコルです。CRL（証明書失効リスト）を丸ごと取得するより、必要な証明書だけを素早く確認できます。
    why:
      - 正解です。証明書の失効状態の確認には OCSP を使います。
      - SMTP はメールの送信に使うプロトコルです。
      - SNMP はネットワーク機器の管理に使うプロトコルです。
      - DHCP は IP アドレスの割当てに使うプロトコルです。
    terms: [PKI]

  - id: A11-041
    topic: 11-2-1
    diff: 2
    q: クラウドサービスの責任共有モデルの説明として，適切なものはどれか。
    c:
      - クラウド事業者と利用者がセキュリティ対策の責任を分担するという考え方で，サービスの形態（IaaS，PaaS，SaaS）によって利用者の責任範囲が異なる。
      - クラウドサービスのセキュリティはすべてクラウド事業者が責任を負う。
      - クラウドサービスのセキュリティはすべて利用者が責任を負う。
      - 複数のクラウド事業者で，障害時の費用を均等に負担する。
    a: ア
    exp: |
      責任共有モデルは、クラウドのセキュリティを事業者と利用者で分担して守るという考え方です。例えば IaaS では、物理的な設備や仮想化基盤は事業者が守り、OS 以上（OS の更新、アプリケーション、データ、アクセス権の設定など）は利用者が守ります。SaaS でも、利用者のアカウント管理やデータの扱いは利用者の責任です。
    why:
      - 正解です。事業者と利用者で責任を分担し、範囲は形態で変わります。
      - 利用者側にも責任があり、設定の誤りによる情報漏えいなどは利用者の責任です。
      - 物理的な設備などは事業者の責任です。
      - 費用の負担の取決めではありません。
    terms: [責任共有モデル, クラウドコンピューティング]

  - id: A11-042
    topic: 11-2-1
    diff: 2
    q: 情報セキュリティ事象と情報セキュリティインシデントの関係についての説明として，適切なものはどれか。
    c:
      - 情報セキュリティ事象のうち，事業運営を危うくする確率や情報セキュリティを脅かす確率が高いものを情報セキュリティインシデントという。
      - 情報セキュリティインシデントのうち，影響が小さいものを情報セキュリティ事象という。
      - 両者は同じ意味である。
      - 情報セキュリティ事象は外部からの攻撃だけを指し，内部の誤操作は含まない。
    a: ア
    exp: |
      JIS Q 27000 では、情報セキュリティ事象は「情報セキュリティ方針への違反や管理策の不具合の可能性など、情報セキュリティに関連する可能性のある事象」、情報セキュリティインシデントは「望まない（予期しない）情報セキュリティ事象のうち、事業運営を危うくする確率や情報セキュリティを脅かす確率が高いもの」とされています。事象の中で重大なものがインシデントです。
    why:
      - 正解です。事象のうち影響が大きい可能性が高いものがインシデントです。
      - 関係が逆です。インシデントは事象の中に含まれる、より重大なものです。
      - 両者は区別されます。
      - 誤操作なども情報セキュリティ事象に含まれます。
    terms: [情報セキュリティインシデント]

  - id: A11-043
    topic: 11-2-2-1
    diff: 2
    q: リスクアセスメントの前に行う情報資産の調査の説明として，適切なものはどれか。
    c:
      - 組織が保有する情報資産を洗い出し，所在・管理者・利用者・重要度などを整理して，情報資産台帳にまとめる。
      - 攻撃者の氏名や所属を調査する。
      - 競合他社の情報資産の価値を調査する。
      - 情報資産のうち，紙の書類だけを調査する。
    a: ア
    exp: |
      リスクを評価するには、まず守るべき情報資産を把握する必要があります。情報資産の調査では、データ、ソフトウェア、ハードウェア、紙の書類、人やサービスなども含めて洗い出し、所在、管理者、重要度（機密性・完全性・可用性の観点）などを情報資産台帳に整理します。
    why:
      - 正解です。情報資産を洗い出して台帳に整理します。
      - 攻撃者の調査は情報資産の調査ではありません。
      - 自組織の情報資産を対象にします。
      - 紙だけでなく電子データや機器なども対象です。
    terms: [情報資産, リスクアセスメント]

  - id: A11-044
    topic: 11-2-2-2
    diff: 2
    q: 情報資産を重要度で分類する際の観点として，適切なものはどれか。
    c: ['機密性・完全性・可用性のそれぞれが損なわれた場合の影響の大きさ', '情報資産を作成した日付の新しさ', '情報資産のファイルの大きさ', '情報資産を保存している機器の購入価格だけ']
    a: ア
    exp: |
      情報資産の重要度は、その情報資産の機密性・完全性・可用性が損なわれたときに、組織が受ける影響（損害、信用の失墜、法令違反など）の大きさで評価します。例えば、顧客の個人情報は機密性の重要度が高く、受注システムのデータは可用性の重要度も高いといった評価をします。
    why:
      - 正解です。CIA が損なわれた場合の影響で評価します。
      - 作成日は重要度の観点ではありません。
      - ファイルの大きさは重要度とは関係ありません。
      - 機器の価格だけでは、情報そのものの価値を評価できません。
    terms: [情報資産, 機密性]

  - id: A11-045
    topic: 11-2-2-3
    diff: 2
    q: ある情報システムで障害が発生した場合の損失額が 1 回あたり 500 万円，発生頻度が 5 年に 1 回と見積もられた。年間予想損失額はいくらか。
    c: ['100万円', '2,500万円', '500万円', '50万円']
    a: ア
    exp: |
      年間予想損失額（ALE）＝1回あたりの損失額×年間の発生頻度 です。
      5年に1回の頻度は、年間 1/5＝0.2 回です。500万円×0.2＝100万円です。
      対策の費用が年間予想損失額の削減分より小さければ、その対策は費用対効果がある、と判断する材料になります。
    why:
      - 正解です。500万円×(1/5)＝100万円です。
      - 2,500万円は頻度を5倍してしまった誤りです（500×5）。
      - 500万円は1回あたりの損失額で、頻度を考慮していません。
      - 50万円は計算の誤りです。
    terms: [リスク分析]
    verify: { value: '500 / 5' }

  - id: A11-046
    topic: 11-2-2-4
    diff: 2
    q: JIS Q 31000 などで示されるリスクアセスメントのプロセスを，実施する順に並べたものはどれか。
    c: ['リスク特定 → リスク分析 → リスク評価', 'リスク分析 → リスク評価 → リスク特定', 'リスク評価 → リスク特定 → リスク分析', 'リスク対応 → リスク特定 → リスク評価']
    a: ア
    exp: |
      リスクアセスメントは次の順に行います。
      1. リスク特定：どのようなリスクがあるかを洗い出す
      2. リスク分析：リスクの起こりやすさと影響の大きさから、リスクのレベルを求める
      3. リスク評価：リスクのレベルをリスク基準と比べ、対応が必要か、優先順位はどうかを決める
      その後、リスク対応（回避・低減・移転・保有など）を選びます。
    why:
      - 正解です。特定 → 分析 → 評価の順です。
      - 何のリスクかを特定する前に分析はできません。
      - 評価は分析の結果を基に行います。
      - リスク対応はリスクアセスメントの後に行います。
    know: リスクの起こりやすさと影響の大きさを縦横の軸にとった表をリスクマトリックスといい、リスクのレベルを判断するのに使います。
    terms: [リスクアセスメント]

  - id: A11-047
    topic: 11-2-2-5
    diff: 2
    q: 情報セキュリティリスクへの対応のうち，リスクの移転（リスク共有）に該当するものはどれか。
    c:
      - 情報漏えいによる損害賠償に備えて，サイバー保険に加入する。
      - リスクの高い業務そのものを中止する。
      - ファイアウォールを導入して，不正アクセスの発生確率を下げる。
      - 影響が小さいリスクなので，特に対策をとらずに受け入れる。
    a: ア
    exp: |
      リスク対応には主に次の方法があります。
      - リスク回避：リスクの原因となる活動そのものをやめる
      - リスク低減：対策をとって、発生確率や影響を小さくする
      - リスク移転（共有）：保険や外部委託などで、損失の負担を他者と分け合う
      - リスク保有（受容）：リスクを認識したうえで、そのまま受け入れる
      保険への加入は、損失を保険会社に移転するリスク移転です。
    why:
      - 正解です。保険への加入はリスクの移転です。
      - 業務の中止はリスク回避です。
      - 対策による発生確率の低下はリスク低減です。
      - 対策をとらずに受け入れるのはリスク保有です。
    know: 対策を講じた後に残るリスクを残留リスクといい、経営者などリスク所有者の承認を得て管理します。
    terms: [リスク対応]

  - id: A11-048
    topic: 11-2-3
    diff: 2
    q: コンティンジェンシー計画（緊急時対応計画）の説明として，適切なものはどれか。
    c:
      - 災害やシステム障害などの緊急事態が発生したときに，被害を最小限に抑え，業務を継続・復旧させるための手順をあらかじめ定めた計画
      - 新しいシステムを開発するための日程の計画
      - 情報システムの利用者を教育するための計画
      - 毎年の IT 予算の配分を決める計画
    a: ア
    exp: |
      コンティンジェンシー計画は、災害、サイバー攻撃、大規模な障害などの不測の事態に備えて、発生時の初動対応、代替手段、連絡体制、復旧の手順などを事前に定めておく計画です。計画は定期的に訓練して実効性を確かめ、見直します。
    why:
      - 正解です。緊急事態への対応と復旧の手順を定めた計画です。
      - これはプロジェクトのスケジュール計画です。
      - これは教育計画です。
      - これは予算計画です。
    terms: [コンティンジェンシー計画, BCP]

  - id: A11-049
    topic: 11-2-4
    diff: 2
    q: 情報セキュリティポリシーの一般的な構成についての説明として，適切なものはどれか。
    c:
      - 経営者が組織の方針を示す基本方針，基本方針を実現するための具体的な規則を定めた対策基準，対策基準に基づく具体的な手順を示した実施手順などで構成される。
      - 技術的な設定の手順だけで構成され，経営者の方針は含めない。
      - 一度作成したら，見直す必要はない。
      - 外部に公開することを前提に，組織内の詳細な手順もすべて公開する。
    a: ア
    exp: |
      情報セキュリティポリシーは、一般に、組織の情報セキュリティに対する考え方や取組み姿勢を経営者が示す「基本方針」と、それを実現するために守るべき規則を定めた「対策基準」（ここまでを狭義のポリシーと呼ぶことが多い）、さらに具体的な作業の手順を示す「実施手順」から構成されます。環境の変化に合わせて定期的に見直します。
    why:
      - 正解です。基本方針・対策基準・実施手順の階層で構成されます。
      - 経営者による基本方針が最上位に位置します。
      - 状況の変化に応じて定期的に見直す必要があります。
      - 詳細な手順まで公開すると、攻撃者に手がかりを与えるおそれがあります。
    terms: [情報セキュリティポリシー]

  - id: A11-050
    topic: 11-2-5
    diff: 2
    q: ISMS（情報セキュリティマネジメントシステム）の説明として，適切なものはどれか。
    c:
      - 組織が情報セキュリティのリスクを管理するための仕組みで，PDCA サイクルによって継続的に改善する。JIS Q 27001 がその要求事項を定めている。
      - 情報セキュリティの製品の性能を評価する国際基準である。
      - 不正アクセスを自動的に遮断する装置である。
      - 個人情報を適切に取り扱う事業者に与えられるマークである。
    a: ア
    exp: |
      ISMS は、組織が情報資産を守るために、リスクアセスメントに基づいて管理策を選び、運用し、評価し、改善する（PDCA の考え方）仕組みです。現行の JIS Q 27001 本文に「PDCA モデル」という表現は明記されていませんが、継続的改善の枠組みとして PDCA の考え方が用いられています。要求事項は JIS Q 27001（ISO/IEC 27001）で、管理策の詳細な指針は JIS Q 27002 で示されています。第三者の審査を受けて ISMS 認証を取得できます。
    why:
      - 正解です。PDCA で継続的に改善するリスク管理の仕組みです。
      - IT 製品のセキュリティ評価の基準は ISO/IEC 15408（コモンクライテリア）です。
      - 不正アクセスを遮断する装置はファイアウォールや IPS です。
      - 個人情報を適切に取り扱う事業者に与えられるのはプライバシーマークです。
    know: JIS Q 27002:2024（2022年版の ISO/IEC 27002 に対応した版）の管理策は、組織的（37）・人的（8）・物理的（14）・技術的（34）の4つのテーマに分類された計 93 個です。
    terms: [ISMS]

  - id: A11-051
    topic: 11-2-6
    diff: 2
    q: CSIRT の説明として，適切なものはどれか。
    c:
      - 組織内で発生した情報セキュリティインシデントに対応し，原因の分析や被害の拡大防止，外部の組織との連携などを行うチーム
      - 情報システムの開発の進捗を管理するチーム
      - 情報システムの監査を行う独立した部署
      - 製品の品質を検査する部署
    a: ア
    exp: |
      CSIRT（Computer Security Incident Response Team）は、組織内のセキュリティインシデントの受付、分析、対応の指揮、関係者や外部組織（JPCERT/CC など）との連携を行うチームです。インシデントの早期発見と迅速な対応で、被害を最小限に抑えます。セキュリティ機器のログなどを常時監視・分析する組織は SOC（Security Operation Center）といいます。
    why:
      - 正解です。インシデントに対応するチームです。
      - これはプロジェクト管理の役割です。
      - これは内部監査部門などの役割です。
      - これは品質保証部門の役割です。
    know: JPCERT コーディネーションセンターは国内のインシデント対応の調整を行う組織、JVN は脆弱性対策情報を公開するポータルサイト、NISC（内閣サイバーセキュリティセンター）は政府のサイバーセキュリティ政策の中核組織でしたが、2025年7月に改組され、国家サイバー統括室（NCO）が司令塔の役割を担っています。
    terms: [CSIRT]

  - id: A11-052
    topic: 11-2-7
    diff: 2
    q: クレジットカード情報を取り扱う事業者に求められる，カード会員データを保護するための国際的なセキュリティ基準はどれか。
    c: ['PCI DSS', 'JIS Q 15001', 'ITIL', 'CVSS']
    a: ア
    exp: |
      PCI DSS（Payment Card Industry Data Security Standard）は、国際的なカードブランドが共同で策定した、クレジットカード情報を安全に扱うためのセキュリティ基準です。ネットワークの保護、カード会員データの保護、アクセス制御、定期的な監視とテストなどの要件を定めています。
    why:
      - 正解です。カード会員データの保護の基準は PCI DSS です。
      - JIS Q 15001 は個人情報保護マネジメントシステムの規格です。
      - ITIL は IT サービスマネジメントのベストプラクティス集です。
      - CVSS は脆弱性の深刻度を評価する仕組みです。
    know: 経済産業省と IPA の「サイバーセキュリティ経営ガイドライン」は、経営者がリーダーシップをとってセキュリティ対策を推進するための指針です。
    terms: [PCI DSS]

  - id: A11-053
    topic: 11-3-1
    diff: 2
    q: CVSS の説明として，適切なものはどれか。
    c:
      - 脆弱性の深刻度を，ベンダーに依存しない共通の基準で数値化して評価する仕組み
      - 暗号モジュールの安全性を試験して認証する制度
      - 組織の情報セキュリティマネジメントシステムを認証する制度
      - 情報漏えいの損害額を算出する計算式
    a: ア
    exp: |
      CVSS（Common Vulnerability Scoring System：共通脆弱性評価システム）は、ソフトウェアの脆弱性の深刻度を、攻撃のしやすさや影響の大きさなどの観点から 0.0〜10.0 の数値で評価する仕組みです。共通の尺度で比較できるため、対応の優先順位を判断するのに使われます。
    why:
      - 正解です。脆弱性の深刻度を共通の基準で評価します。
      - これは JCMVP（暗号モジュール試験及び認証制度）の説明です。
      - これは ISMS 適合性評価制度の説明です。
      - CVSS は損害額の計算式ではありません。
    terms: [CVSS]

  - id: A11-054
    topic: 11-3-1
    diff: 2
    q: ペネトレーションテストの説明として，適切なものはどれか。
    c:
      - 実際の攻撃者と同じような手法でシステムへの侵入を試み，セキュリティ上の弱点を発見する。
      - ソースコードを読んで，文法上の誤りを探す。
      - 利用者にアンケートを行って，システムの使いやすさを評価する。
      - システムに大量のデータを入力して，処理能力の限界を調べる。
    a: ア
    exp: |
      ペネトレーションテスト（侵入テスト）は、許可を得たうえで、攻撃者の視点から実際に侵入を試み、システムやネットワークの脆弱性や対策の有効性を検証するテストです。発見した弱点は報告書にまとめ、対策に役立てます。
    why:
      - 正解です。実際の攻撃手法で侵入を試みるテストです。
      - 文法の誤りを探すのはコードレビューやコンパイラの役割です。
      - 使いやすさの評価はユーザビリティ評価です。
      - 処理能力の限界を調べるのは負荷テストです。
    know: 耐タンパ性は、IC カードなどの内部の情報を、分解や不正な解析によって読み取られにくくする性質です。
    terms: [ペネトレーションテスト]

  - id: A11-055
    topic: 11-4-1-1
    diff: 2
    q: 人的セキュリティ対策として，適切なものはどれか。
    c:
      - 従業員に標的型メールの見分け方を教育し，訓練メールを使った訓練を定期的に行う。
      - ファイアウォールを設置して，外部からの不正な通信を遮断する。
      - サーバ室に入退室管理システムを導入する。
      - データベースを暗号化する。
    a: ア
    exp: |
      人的セキュリティ対策は、人の誤りや不正による事故を防ぐための対策で、教育・訓練、秘密保持契約や誓約書、職務の分離、退職時のアカウント削除などがあります。標的型メールの訓練は、従業員の対応力を高める代表的な人的対策です。
    why:
      - 正解です。教育と訓練は人的セキュリティ対策です。
      - ファイアウォールは技術的セキュリティ対策です。
      - 入退室管理は物理的セキュリティ対策です。
      - データベースの暗号化は技術的セキュリティ対策です。
    terms: [情報セキュリティ対策]

  - id: A11-056
    topic: 11-4-1-2
    diff: 2
    q: IDS と IPS の違いの説明として，適切なものはどれか。
    c:
      - IDS は不正な通信を検知して管理者に通知し，IPS は検知した不正な通信を自動的に遮断する。
      - IDS は不正な通信を遮断し，IPS は検知するだけである。
      - IDS はメールの不正を，IPS は Web の不正だけを検知する。
      - IDS と IPS はまったく同じ機能である。
    a: ア
    exp: |
      IDS（Intrusion Detection System：侵入検知システム）は、ネットワークやサーバ上の通信・ログを監視して不正な侵入の兆候を検知し、管理者に知らせます。IPS（Intrusion Prevention System：侵入防止システム）は、検知に加えて、不正な通信を自動的に遮断します。
    why:
      - 正解です。IDS は検知・通知、IPS は検知・遮断です。
      - 役割が逆です。遮断までするのが IPS です。
      - 対象をメールや Web に限定するものではありません。
      - IPS は遮断の機能をもつ点が異なります。
    know: 正常な通信を誤って不正と判定することをフォールスポジティブ（誤検知）、不正な通信を見逃すことをフォールスネガティブといいます。
    terms: [IDS, IPS]

  - id: A11-057
    topic: 11-4-1-2
    diff: 2
    q: WAF（Web Application Firewall）の説明として，適切なものはどれか。
    c:
      - Web アプリケーションへの通信の内容を検査し，SQL インジェクションやクロスサイトスクリプティングなどの攻撃を検知・遮断する。
      - IP アドレスとポート番号だけを見て，通信を許可または遮断する。
      - 社内の端末から外部の Web サイトへのアクセスを代理で行う。
      - 無線 LAN の通信を暗号化する。
    a: ア
    exp: |
      WAF は、Web アプリケーションとの間でやり取りされる HTTP の通信の内容（パラメータなど）を検査し、Web アプリケーションの脆弱性を突く攻撃のパターンを検知・遮断する装置やソフトウェアです。アプリケーションの脆弱性をすぐに修正できない場合の防御策としても有効です。
    why:
      - 正解です。Web アプリケーションへの攻撃を通信の内容から検知・遮断します。
      - これはパケットフィルタリング型のファイアウォールの説明です。
      - これはプロキシサーバの説明です。
      - これは WPA2/WPA3 などの役割です。
    terms: [WAF, ファイアウォール]

  - id: A11-058
    topic: 11-4-1-2
    diff: 2
    q: DMZ（非武装地帯）の説明として，適切なものはどれか。
    c:
      - インターネットと社内ネットワークの間に設けるネットワーク区画で，Web サーバなど外部に公開するサーバを置き，社内ネットワークへの不正アクセスを防ぐ。
      - 社内ネットワークの中で，最も重要なデータを保管する区画である。
      - ネットワークに接続していない，独立したコンピュータのことである。
      - 無線 LAN の電波が届かない区域のことである。
    a: ア
    exp: |
      DMZ は、ファイアウォールによってインターネットとも社内ネットワークとも分離されたネットワーク区画です。外部に公開する Web サーバやメールサーバを DMZ に置くことで、公開サーバが乗っ取られても、社内ネットワークに直接侵入されにくくなります。
    why:
      - 正解です。公開サーバを置く緩衝地帯です。
      - 重要なデータは社内ネットワークの奥で保護します。DMZ には置きません。
      - 独立したコンピュータは DMZ ではありません。
      - 無線 LAN の電波の届く範囲とは関係ありません。
    terms: [DMZ, ファイアウォール]

  - id: A11-059
    topic: 11-4-1-2
    diff: 2
    q: マルウェアの検出手法のうち，ビヘイビア法（振る舞い検知）の特徴として，適切なものはどれか。
    c:
      - プログラムを実行したときの動作（ファイルの大量の書換えや不審な通信など）を監視して検出するので，未知のマルウェアも検出できる可能性がある。
      - 既知のマルウェアの特徴的なコード（シグネチャ）と照合するので，未知のマルウェアは検出できない。
      - ファイルの大きさだけを比較して検出する。
      - 利用者からの報告だけを基に検出する。
    a: ア
    exp: |
      ビヘイビア法は、プログラムを実際に動かしたとき（またはサンドボックスで動かしたとき）の振る舞いを監視し、不審な動作からマルウェアを検出する方法です。シグネチャに登録されていない未知のマルウェアも検出できる可能性があります。一方で、正常なプログラムを誤って検知することもあります。
    why:
      - 正解です。動作を監視するので未知のマルウェアにも対応できる可能性があります。
      - これはパターンマッチング法の特徴です。
      - ファイルの大きさだけでは判断できません。
      - 利用者の報告だけに頼る手法ではありません。
    know: ヒューリスティック法は、プログラムのコードを解析して、マルウェアに特有の命令の組合せなどから検出する方法です。
    terms: [マルウェア対策]

  - id: A11-060
    topic: 11-4-1-2
    diff: 2
    q: ランサムウェアへの備えとして推奨されるバックアップの「3-2-1 ルール」の内容として，適切なものはどれか。
    c:
      - 元のデータを含めて3つのコピーをもち，2種類以上の異なる媒体に保存し，そのうち1つは別の場所（オフサイト）に保管する。
      - バックアップを3日ごとに2回取得し，1年間保管する。
      - 3人の担当者のうち2人の承認を得て，1回だけバックアップを取得する。
      - データを3分割して2台のサーバに保存し，1台は常に停止させる。
    a: ア
    exp: |
      3-2-1 ルールは、元のデータを含めて3つのコピーをもち、2種類以上の媒体に保存し、1つは別の場所に保管するというバックアップの考え方です。ランサムウェアはネットワークでつながったバックアップも暗号化することがあるため、ネットワークから切り離した保管や、書換えができない（WORM・イミュータブル）バックアップも有効です。
    why:
      - 正解です。3つのコピー・2種類の媒体・1つは別の場所、です。
      - 取得間隔や保管期間を定めたルールではありません。
      - 承認の手続を定めたルールではありません。
      - データの分割保存を定めたルールではありません。
    terms: [バックアップ, ランサムウェア]

  - id: A11-061
    topic: 11-4-1-2
    diff: 2
    q: SIEM（Security Information and Event Management）の説明として，適切なものはどれか。
    c:
      - サーバやネットワーク機器，セキュリティ機器などのログを集約して相関分析し，セキュリティ上の脅威を検知して通知する。
      - 社員の PC にマルウェア対策ソフトを自動でインストールする。
      - 無線 LAN の電波を監視して，不正なアクセスポイントを探す。
      - 利用者の ID とパスワードを一元的に管理する。
    a: ア
    exp: |
      SIEM は、さまざまな機器のログを一か所に集め、それらを突き合わせて分析（相関分析）することで、単独のログからは気付きにくい攻撃の兆候を検知し、管理者に通知する仕組みです。SOC での監視などに利用されます。
    why:
      - 正解です。ログを集約・相関分析して脅威を検知します。
      - ソフトウェアの配布は資産管理ツールなどの役割です。
      - 不正なアクセスポイントの検出は無線 IDS などの役割です。
      - ID とパスワードの一元管理はディレクトリサービスなどの役割です。
    terms: [SIEM, ログ管理]

  - id: A11-062
    topic: 11-4-1-2
    diff: 2
    q: 検疫ネットワークの説明として，適切なものはどれか。
    c:
      - 社内ネットワークに接続しようとする端末のセキュリティ状態（修正プログラムの適用やマルウェア対策ソフトの更新など）を検査し，問題がなければ接続を許可する。
      - 外部に公開するサーバだけを置くネットワーク区画である。
      - 通信を暗号化して，インターネット上に仮想的な専用線を作る。
      - 攻撃者をおびき寄せるために，わざと脆弱なシステムを置く。
    a: ア
    exp: |
      検疫ネットワークは、持ち込まれた端末や長期間使っていなかった端末などを、いったん隔離されたネットワークに接続させてセキュリティ状態を検査し、基準を満たしていない場合は修正プログラムの適用などを行わせてから、社内ネットワークへの接続を許可する仕組みです。マルウェアの持込みを防ぎます。
    why:
      - 正解です。端末を検査してから接続を許可します。
      - これは DMZ の説明です。
      - これは VPN の説明です。
      - これはハニーポットの説明です。
    terms: [検疫ネットワーク]

  - id: A11-063
    topic: 11-4-1-2
    diff: 2
    q: デジタルフォレンジックスの説明として，適切なものはどれか。
    c:
      - 不正アクセスなどの事件が起きたときに，コンピュータに残された記録を証拠として保全・収集・分析し，法的な証拠能力を確保する。
      - データを暗号化して，第三者に読まれないようにする。
      - システムを定期的にバックアップする。
      - 社員にセキュリティ教育を行う。
    a: ア
    exp: |
      デジタルフォレンジックスは、事件や事故が起きたときに、コンピュータや記録媒体に残されたログやファイルなどの電子的な証拠を、改変しないように保全し、収集・分析して、原因の究明や法的な証拠として使えるようにする技術・手続です。証拠を壊さないよう、調査は原本ではなく複製に対して行うのが原則です。
    why:
      - 正解です。電子的な証拠を保全・分析する取組みです。
      - これは暗号化の説明です。
      - これはバックアップの説明です。
      - これはセキュリティ教育の説明です。
    terms: [デジタルフォレンジックス]

  - id: A11-064
    topic: 11-4-1-3
    diff: 1
    q: クリアデスク・クリアスクリーンの説明として，適切なものはどれか。
    c:
      - 離席時に机の上に書類や記録媒体を放置せず，PC の画面をロックして，第三者に情報を見られないようにする。
      - 机の上をきれいにして，作業の効率を上げる。
      - PC の画面の明るさを上げて，見やすくする。
      - 不要なファイルを削除して，ディスクの空き容量を増やす。
    a: ア
    exp: |
      クリアデスクは、離席時や退社時に、重要な書類や USB メモリなどを机の上に放置せず、鍵のかかる場所に保管することです。クリアスクリーンは、離席時に PC の画面をロックし、第三者に画面を見られたり操作されたりしないようにすることです。情報の盗み見や持出しを防ぐ物理的な対策です。
    why:
      - 正解です。書類の放置防止と画面のロックです。
      - 作業効率のための整理整頓が目的ではありません。
      - 画面の明るさとは関係ありません。
      - ディスクの空き容量とは関係ありません。
    terms: [情報セキュリティ対策]

  - id: A11-065
    topic: 11-5-1
    diff: 2
    q: TLS の説明として，適切なものはどれか。
    c:
      - 通信相手の認証，通信内容の暗号化，改ざんの検知を行い，HTTPS などで Web の通信を保護するプロトコル
      - ネットワーク層で IP パケットを暗号化し，VPN の構築に使われるプロトコル
      - 遠隔のコンピュータに安全にログインして操作するためのプロトコル
      - 無線 LAN の通信を暗号化するための規格
    a: ア
    exp: |
      TLS（Transport Layer Security）は、トランスポート層の上で動作し、サーバ証明書による通信相手の認証、通信内容の暗号化、メッセージ認証による改ざんの検知を行うプロトコルです。HTTPS のほか、メールの送受信などでも使われています。SSL は TLS の前身のプロトコルです。
    why:
      - 正解です。認証・暗号化・改ざん検知で通信を保護します。
      - これは IPsec の説明です。
      - これは SSH の説明です。
      - これは WPA2・WPA3 の説明です。
    terms: [TLS, HTTPS]

  - id: A11-066
    topic: 11-5-1
    diff: 2
    q: IPsec の説明として，適切なものはどれか。
    c:
      - ネットワーク層で IP パケットの暗号化や認証を行い，拠点間を結ぶ VPN などに利用される。
      - アプリケーション層で電子メールに電子署名を付ける。
      - データリンク層で無線 LAN のフレームを暗号化する。
      - Web ブラウザとサーバの間の通信だけを暗号化する。
    a: ア
    exp: |
      IPsec は、IP のレベル（ネットワーク層）で通信を暗号化・認証するプロトコル群です。上位のアプリケーションに依存せずに通信全体を保護できるため、拠点間を結ぶインターネット VPN などに使われます。
    why:
      - 正解です。ネットワーク層で IP パケットを保護します。
      - これは S/MIME などの説明です。
      - これは WPA2/WPA3 の説明です。
      - これは TLS（HTTPS）の説明です。
    terms: [IPsec, VPN]

  - id: A11-067
    topic: 11-5-1
    diff: 1
    q: 無線 LAN の通信を保護するためのセキュリティ規格として，現在推奨されているものはどれか。
    c: ['WPA3', 'WEP', 'SSID ステルス', 'MAC アドレスフィルタリング']
    a: ア
    exp: |
      WPA3 は、Wi-Fi Alliance が定めた無線 LAN のセキュリティ規格で、WPA2 をさらに強化したものです。パスワードを推測する攻撃に強い認証方式（SAE）などを採用しています。古い WEP は暗号に重大な欠陥があり、使うべきではありません。
    why:
      - 正解です。WPA3 が推奨されています。
      - WEP は短時間で解読できる欠陥があり、使用は推奨されません。
      - SSID を隠しても、通信を傍受すれば SSID は分かるため、十分な対策にはなりません。
      - MAC アドレスは偽装できるため、それだけでは十分な対策になりません。
    terms: [WPA3, 無線LAN]

  - id: A11-068
    topic: 11-5-2
    diff: 2
    q: 電子メールの送信元ドメイン認証技術である SPF の説明として，適切なものはどれか。
    c:
      - 送信元ドメインの DNS に，そのドメインのメールを送信してよいサーバの IP アドレスを登録しておき，受信側がメールの送信元サーバと照合する。
      - メールの本文と添付ファイルを暗号化する。
      - 送信側がメールに電子署名を付け，受信側が DNS で公開された公開鍵で検証する。
      - メールの受信者のパスワードを使って，メールボックスへのアクセスを認証する。
    a: ア
    exp: |
      SPF（Sender Policy Framework）は、ドメインの管理者が、そのドメインのメールを送信する正規のサーバの IP アドレスを DNS に公開し、受信側が、メールを送ってきたサーバの IP アドレスと照合して、送信元のなりすましを検知する技術です。
    why:
      - 正解です。正規の送信サーバの IP アドレスと照合します。
      - これは S/MIME や PGP の説明です。
      - これは DKIM の説明です。
      - これはメールの受信時の認証（POP3/IMAP の認証）の説明です。
    know: DMARC は、SPF や DKIM の認証に失敗したメールをどう扱うか（受信拒否・隔離など）を送信側が宣言する仕組みです。OP25B は、ISP の内部から外部の 25 番ポートへの直接の通信を遮断して迷惑メールの送信を防ぐ対策です。
    terms: [送信元ドメイン認証]

  - id: A11-069
    topic: 11-5-2
    diff: 2
    q: OAuth の説明として，適切なものはどれか。
    c:
      - 利用者のパスワードを渡すことなく，利用者が許可した範囲で，あるサービスが別のサービス上の利用者の資源にアクセスすることを認可する仕組み
      - 電子メールを暗号化する仕組み
      - Web サーバの証明書を発行する仕組み
      - 社内ネットワークに接続する端末を検査する仕組み
    a: ア
    exp: |
      OAuth は、例えば写真の印刷サービスに、別の写真保存サービス上の自分の写真へのアクセスを許可するときに、写真保存サービスのパスワードを印刷サービスに教えることなく、許可した範囲のアクセス権（アクセストークン）だけを渡す「認可」の仕組みです。
    why:
      - 正解です。パスワードを渡さずにアクセスを認可する仕組みです。
      - メールの暗号化は S/MIME などです。
      - 証明書の発行は認証局の役割です。
      - 端末の検査は検疫ネットワークの機能です。
    know: RADIUS は、ネットワークへの接続などの際の利用者の認証を一元的に行うためのプロトコルです。
    terms: [OAuth]

  - id: A11-070
    topic: 11-5-3
    diff: 2
    q: ハニーポットの説明として，適切なものはどれか。
    c:
      - 攻撃者をおびき寄せるためにわざと脆弱に見せたシステムを用意し，攻撃の手口を観察・分析する。
      - 外部からの不正な通信を，IP アドレスやポート番号に基づいて遮断する。
      - 社内ネットワークに接続する端末のセキュリティ状態を検査する。
      - Web サーバの手前で通信を中継し，負荷を分散する。
    a: ア
    exp: |
      ハニーポット（蜜の壺）は、攻撃者を引き寄せるおとりのシステムです。本物の資産は置かず、攻撃者の侵入や行動を記録・分析して、攻撃の手口の把握や対策の検討に役立てます。
    why:
      - 正解です。おとりのシステムで攻撃を観察します。
      - これはパケットフィルタリングの説明です。
      - これは検疫ネットワークの説明です。
      - これはリバースプロキシの説明です。
    terms: [ハニーポット]

  - id: A11-071
    topic: 11-5-3
    diff: 2
    q: パケットフィルタリング型のファイアウォールが，通信を許可するか遮断するかを判断するために主に用いる情報はどれか。
    c:
      - 送信元・宛先の IP アドレス，ポート番号，プロトコルの種類
      - 電子メールの本文に含まれる単語
      - Web ページに含まれる画像の内容
      - 利用者の氏名と所属部署
    a: ア
    exp: |
      パケットフィルタリングは、パケットのヘッダーにある送信元・宛先の IP アドレス、ポート番号、プロトコル（TCP、UDP など）を、あらかじめ設定したルールと照合して、通過させるか遮断するかを決める方式です。通信の中身（アプリケーションのデータ）までは検査しません。
    why:
      - 正解です。ヘッダーの IP アドレス・ポート番号などで判断します。
      - メールの本文の検査はスパムフィルタなどの機能です。
      - 画像の内容の検査はコンテンツフィルタリングの機能です。
      - 利用者の氏名は通信のヘッダーには含まれません。
    terms: [ファイアウォール]

  - id: A11-072
    topic: 11-5-4
    diff: 2
    q: データベースのセキュリティ対策として，データベースの格納データを暗号化する主な目的はどれか。
    c:
      - 記憶媒体の盗難やバックアップ媒体の紛失などによって，データファイルが第三者の手に渡っても，内容を読み取られないようにする。
      - SQL の実行速度を向上させる。
      - 誤って削除したデータを復元できるようにする。
      - データベースの利用者の操作を記録する。
    a: ア
    exp: |
      データベースの暗号化は、ディスクやバックアップ媒体の盗難・紛失、不正なファイルの持出しなどがあっても、鍵がなければ内容を読めないようにして、機密性を守る対策です。鍵の管理を適切に行うことが重要です。あわせて、アクセス制御、バックアップ、ログの取得なども行います。
    why:
      - 正解です。媒体などが盗まれても読み取られないようにするためです。
      - 暗号化は処理の負荷を増やすことはあっても、速度の向上が目的ではありません。
      - データの復元はバックアップの役割です。
      - 操作の記録はログの取得（監査ログ）の役割です。
    terms: [暗号技術]

  - id: A11-073
    topic: 11-5-5
    diff: 2
    q: パスワードをハッシュ値にして保存する際に，ソルトを付加する目的として，適切なものはどれか。
    c:
      - 同じパスワードでも利用者ごとに異なるハッシュ値になるようにして，事前に計算したハッシュ値の表を使った解読（レインボーテーブル攻撃など）を難しくする。
      - ハッシュ値から元のパスワードを復元できるようにする。
      - パスワードの文字数を短くして，入力を簡単にする。
      - 通信中のパスワードを暗号化する。
    a: ア
    exp: |
      ソルトは、パスワードに付け加える利用者ごとに異なるランダムな値です。パスワードにソルトを付けてからハッシュ化すると、同じパスワードを使う利用者がいても保存されるハッシュ値が異なり、あらかじめ作成したハッシュ値の対応表による解読が難しくなります。さらに、計算に時間のかかるハッシュ関数を使う（ストレッチング）ことも有効です。
    why:
      - 正解です。事前計算による解読を難しくするのが目的です。
      - ハッシュ値から元のパスワードを復元することはできず、それが目的でもありません。
      - パスワードの文字数とは関係ありません。
      - 通信中の保護は TLS などで行います。
    terms: [ソルト, ハッシュ関数]

  - id: A11-074
    topic: 11-5-5
    diff: 2
    q: ファジングの説明として，適切なものはどれか。
    c:
      - ソフトウェアに予測できないデータや異常なデータを大量に入力し，その挙動を観察して脆弱性や不具合を見つける検査手法
      - ソースコードを実行せずに読んで，誤りを見つける検査手法
      - 利用者に実際にシステムを操作してもらい，使いにくい点を見つける評価手法
      - プログラムの処理時間を測定して，性能の問題を見つける手法
    a: ア
    exp: |
      ファジングは、ファズと呼ばれる不正な形式のデータ、極端な値、ランダムなデータなどを自動生成してソフトウェアに大量に入力し、異常終了や想定外の動作が起きないかを観察する検査手法です。開発者が想定していない入力による脆弱性を発見するのに有効です。
    why:
      - 正解です。異常なデータを大量に入力して脆弱性を探す手法です。
      - これはソースコードの静的検査（静的解析）の説明です。
      - これはユーザビリティテストの説明です。
      - これは性能測定（プロファイリング）の説明です。
    terms: [ファジング]

  - id: A11-075
    topic: 11-2-2-3
    diff: 2
    q: サプライチェーンリスクの例として，適切なものはどれか。
    c:
      - 業務を委託している取引先や，使用しているソフトウェアの開発元がサイバー攻撃を受け，自社にも被害が及ぶ。
      - 自社の従業員が，社内の機密情報を誤って削除する。
      - 自社のサーバ室の空調が故障する。
      - 自社の Web サイトの表示が遅くなる。
    a: ア
    exp: |
      サプライチェーンリスクは、取引先、委託先、部品やソフトウェアの供給元など、自社と関係する他の組織を経由して被害を受けるリスクです。セキュリティ対策が手薄な取引先を踏み台にして本来の標的を攻撃する手口や、ソフトウェアの更新プログラムにマルウェアを混入させる手口などがあります。
    why:
      - 正解です。取引先や供給元を経由した被害はサプライチェーンリスクです。
      - 従業員の誤操作は自社内部の人的リスクです。
      - 設備の故障は自社の物理的なリスクです。
      - Web サイトの性能の問題はサプライチェーンリスクではありません。
    terms: [サプライチェーンリスク]

  - id: A11-076
    topic: 11-1-7
    diff: 2
    q: バッファオーバーフロー攻撃への対策として，適切なものはどれか。
    c:
      - プログラムで入力データの長さを検査し，確保した領域を超えるデータを書き込まないようにする。
      - Web ページの出力時に特別な意味をもつ文字をエスケープする。
      - パスワードの使い回しを禁止する。
      - メールの送信元のドメインを認証する。
    a: ア
    exp: |
      バッファオーバーフロー攻撃は、プログラムが確保したメモリ領域（バッファ）の大きさを超えるデータを送り込み、隣接するメモリ（関数の戻り先アドレスなど）を書き換えて、不正なコードを実行させる攻撃です。入力データの長さを検査する、領域外に書き込まない安全な関数を使う、といったセキュアプログラミングが基本的な対策です。
    why:
      - 正解です。入力の長さを検査して領域を超えないようにします。
