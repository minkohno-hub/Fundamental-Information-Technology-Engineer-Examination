reviewed: { at: '2026-10-21', method: '作成後の逐問レビュー（経営戦略手法・マーケティング・目標設定と評価・経営管理システムの定義をシラバスVer.9.2の用語例と照合、CVR の計算は検算式で独立に再計算）' }
questions:
  - id: A19-001
    topic: 19-1-3-2
    diff: 1
    q: SWOT 分析において，企業を取り巻く外部環境の要因として分析するものの組合せはどれか。
    c:
      - 機会（Opportunity）と脅威（Threat）
      - 強み（Strength）と弱み（Weakness）
      - 強み（Strength）と機会（Opportunity）
      - 弱み（Weakness）と脅威（Threat）
    a: ア
    exp: |
      SWOT 分析は、自社の内部環境を強み（Strength）と弱み（Weakness）、外部環境を機会（Opportunity）と脅威（Threat）に分けて整理し、経営戦略の立案に役立てる手法です。外部環境には、市場の動向、競合、法規制、技術の変化などが含まれます。
    why:
      - 正解です。機会と脅威が外部環境の要因です。
      - 強みと弱みは、自社の経営資源や能力に関する内部環境の要因です。
      - 強みは内部環境、機会は外部環境の要因であり、外部環境だけの組合せではありません。
      - 弱みは内部環境、脅威は外部環境の要因であり、外部環境だけの組合せではありません。
    terms: [SWOT分析]

  - id: A19-002
    topic: 19-1-3-2
    diff: 1
    q: 国内の家電メーカが SWOT 分析を行った。“脅威”に分類されるものはどれか。
    c:
      - 低価格を武器にした海外メーカが，国内市場に相次いで参入している。
      - 自社は，業界でも高い水準の省エネルギー技術を保有している。
      - 自社は，若年層向けの販売チャネルが競合他社に比べて弱い。
      - 高齢者の増加に伴い，操作が簡単な家電製品の需要が伸びている。
    a: ア
    exp: |
      脅威（Threat）は、自社にとって不利に働く外部環境の要因です。低価格の海外メーカの参入は、市場での競争を激化させる外部の要因なので脅威に分類されます。自社の技術や販売チャネルは内部環境の要因、市場の需要の伸びは有利な外部環境の要因（機会）です。
    why:
      - 正解です。競合の参入は自社に不利な外部環境の変化なので脅威です。
      - 自社が保有する技術は、内部環境のうち強み（Strength）に分類されます。
      - 自社の販売チャネルの弱さは、内部環境のうち弱み（Weakness）に分類されます。
      - 需要の伸びは自社に有利な外部環境の変化であり、機会（Opportunity）に分類されます。
    terms: [SWOT分析]

  - id: A19-003
    topic: 19-1-2
    diff: 1
    q: PPM（プロダクトポートフォリオマネジメント）において，“金のなる木”に位置付けられる事業の特徴はどれか。
    c:
      - 市場成長率は低いが，市場占有率は高い。
      - 市場成長率も市場占有率も高い。
      - 市場成長率は高いが，市場占有率は低い。
      - 市場成長率も市場占有率も低い。
    a: ア
    exp: |
      PPM は、市場成長率と市場占有率（相対的マーケットシェア）を軸に事業を4つに分類し、経営資源の配分を検討する手法です。“金のなる木”は、成長率が低い成熟市場で高いシェアをもつ事業で、大きな投資を必要とせずに多くの資金を生み出します。その資金を“問題児”や“花形”に投資します。
    why:
      - 正解です。低成長・高シェアの事業が“金のなる木”です。
      - 成長率もシェアも高い事業は“花形”です。資金を生むが、成長に合わせた投資も必要です。
      - 成長率が高くシェアが低い事業は“問題児”です。シェア拡大のために多くの投資が必要です。
      - 成長率もシェアも低い事業は“負け犬”です。撤退や縮小が検討されます。
    terms: [PPM]

  - id: A19-004
    topic: 19-1-2
    diff: 2
    q: PPM において“問題児”に位置付けられた事業に対する一般的な戦略として，最も適切なものはどれか。
    c:
      - 将来性を見極めたうえで，積極的に投資して市場占有率を高め“花形”に育てるか，見込みがなければ撤退する。
      - 新たな投資は最小限に抑え，得られた資金を他の事業に回す。
      - 市場からの撤退や事業の売却を，ただちに実施する。
      - 現状の高い市場占有率を維持するため，成長に見合った投資を継続する。
    a: ア
    exp: |
      “問題児”は、市場成長率は高いが市場占有率が低い事業です。シェアを高めるには多額の投資が必要で、資金を消費します。将来性があれば積極的に投資して“花形”に育成し、見込みがなければ撤退を検討するという選択が求められます。
    why:
      - 正解です。投資して“花形”に育てるか、撤退するかを判断するのが“問題児”への戦略です。
      - 投資を抑えて資金を他の事業に回すのは、“金のなる木”に対する戦略です。
      - ただちに撤退や売却を検討するのは、成長率もシェアも低い“負け犬”に対する戦略です。
      - 高いシェアを維持するために投資を続けるのは、“花形”に対する戦略です。
    terms: [PPM]

  - id: A19-005
    topic: [19-1-3-2, 19-1-3-1]
    diff: 2
    q: M.E.ポーターが提唱したファイブフォース分析で，業界の競争状態を決める要因として挙げられていないものはどれか。
    c:
      - 自社が保有する経営資源の強みと弱み
      - 新規参入者の脅威
      - 代替品の脅威
      - 買い手の交渉力
    a: ア
    exp: |
      ファイブフォース分析は、業界の収益性を決める競争要因として、既存企業間の敵対関係（競争）、新規参入者の脅威、代替品の脅威、買い手の交渉力、売り手（供給業者）の交渉力の5つを分析する手法です。業界という外部環境の構造を分析するもので、自社の内部の強み・弱みは対象としません。
    why:
      - 正解です。自社の強みと弱みは内部環境の要因であり、ファイブフォースには含まれません（SWOT 分析などで扱います）。
      - 新規参入者の脅威は5つの競争要因の一つです。参入障壁が低いと競争が激しくなります。
      - 代替品の脅威は5つの競争要因の一つです。別の製品で同じニーズが満たされると価格が抑えられます。
      - 買い手の交渉力は5つの競争要因の一つです。買い手の力が強いと値下げ圧力が高まります。
    terms: [ファイブフォース分析, SWOT分析]

  - id: A19-006
    topic: 19-1-3-2
    diff: 1
    q: 企業の活動を，購買物流・製造・出荷物流・販売とマーケティング・サービスの主活動と，それを支える支援活動に分け，どの活動で価値が生み出されているかを分析する手法はどれか。
    c:
      - バリューチェーン分析
      - PPM
      - 3C 分析
      - ファイブフォース分析
    a: ア
    exp: |
      バリューチェーン分析は、M.E.ポーターが提唱した手法で、企業の活動を主活動と支援活動（全般管理、人事・労務管理、技術開発、調達活動）に分けて、各活動のコストと付加価値を分析し、競争優位の源泉を明らかにします。
    why:
      - 正解です。活動を主活動と支援活動に分けて価値の源泉を分析するのがバリューチェーン分析です。
      - PPM は、市場成長率と市場占有率で事業を分類して資源配分を検討する手法です。
      - 3C 分析は、顧客・市場、競合、自社の3つの観点から事業環境を分析する手法です。
      - ファイブフォース分析は、業界の競争状態を5つの競争要因から分析する手法です。
    terms: [バリューチェーン, PPM, 3C分析, ファイブフォース分析]

  - id: A19-007
    topic: 19-1-3-2
    diff: 2
    q: VRIO 分析の説明として，最も適切なものはどれか。
    c:
      - 自社の経営資源を，経済的価値，希少性，模倣困難性，組織の4つの観点から評価し，持続的な競争優位の源泉となるかを分析する。
      - 業界の競争状態を，新規参入者や代替品の脅威，買い手と売り手の交渉力，既存企業間の競争から分析する。
      - 製品と市場をそれぞれ既存と新規に分け，成長の方向性を検討する。
      - 自社の内部環境と外部環境を，強み・弱み・機会・脅威に分けて整理する。
    a: ア
    exp: |
      VRIO 分析は、J.B.バーニーが提唱した手法で、経営資源を Value（経済的価値）、Rarity（希少性）、Imitability（模倣困難性）、Organization（組織）の4つの観点で評価します。すべてを満たす経営資源は、持続的な競争優位をもたらすと考えます。
    why:
      - 正解です。価値・希少性・模倣困難性・組織の4つの観点で経営資源を評価するのが VRIO 分析です。
      - 業界の競争状態を5つの要因から分析するのはファイブフォース分析です。
      - 製品と市場を既存・新規に分けて成長の方向を検討するのは、アンゾフの成長マトリクスです。
      - 強み・弱み・機会・脅威に分けて整理するのは SWOT 分析です。
    terms: [VRIO分析, ファイブフォース分析, 成長マトリクス, SWOT分析]

  - id: A19-008
    topic: 19-1-3-2
    diff: 1
    q: アンゾフの成長マトリクスにおいて，既存の製品を新しい市場（新たな顧客層や地域）に投入して成長を図る戦略はどれか。
    c:
      - 市場開拓戦略
      - 市場浸透戦略
      - 製品開発戦略
      - 多角化戦略
    a: ア
    exp: |
      アンゾフの成長マトリクスは、製品と市場をそれぞれ「既存」と「新規」に分けた4つの組合せで成長戦略を整理します。既存製品×既存市場は市場浸透、既存製品×新市場は市場開拓、新製品×既存市場は製品開発、新製品×新市場は多角化です。
    why:
      - 正解です。既存製品で新しい市場を開拓するのが市場開拓戦略です。
      - 市場浸透戦略は、既存製品を既存市場でさらに販売し、シェアを高める戦略です。
      - 製品開発戦略は、既存市場に新しい製品を投入する戦略です。
      - 多角化戦略は、新しい製品で新しい市場に進出する戦略です。
    terms: [成長マトリクス]

  - id: A19-009
    topic: 19-1-2
    diff: 1
    q: コアコンピタンスの説明として，最も適切なものはどれか。
    c:
      - 競合他社がまねできない，自社独自の技術やノウハウなどの中核的な能力
      - 他社と資本関係を結ばずに，技術開発や販売などで協力関係を築くこと
      - 優れた業績を上げている他社の手法を指標として，自社の業務を比較・改善すること
      - 生産量が増えるほど，製品 1 単位当たりのコストが低下すること
    a: ア
    exp: |
      コアコンピタンスは、顧客に価値を提供する源泉となり、競合他社が容易に模倣できない、自社の中核的な能力（技術、ノウハウ、仕組みなど）です。経営資源をコアコンピタンスに集中し、それ以外の業務はアウトソーシングするといった戦略がとられます。
    why:
      - 正解です。他社がまねできない中核的な能力がコアコンピタンスです。
      - 他社との協力関係を築くのはアライアンス（戦略的提携）です。
      - 優れた他社の手法と比較して改善するのはベンチマーキングです。
      - 生産量の増加で単位当たりのコストが下がるのは規模の経済です。
    terms: [コアコンピタンス, アライアンス, ベンチマーキング, 規模の経済]

  - id: A19-010
    topic: 19-1-2
    diff: 2
    q: 企業の全社戦略に関する用語のうち，アライアンスの説明として，最も適切なものはどれか。
    c:
      - 複数の企業が，それぞれの独立性を保ちながら，技術開発・生産・販売などの分野で協力関係を結ぶ。
      - 他の企業を合併したり買収したりして，その企業の経営資源を自社に取り込む。
      - グループ企業の経理や人事などの間接業務を一つの組織に集約し，グループ全体に提供する。
      - インターネットを通じて不特定多数の人から，事業やプロジェクトのための資金を集める。
    a: ア
    exp: |
      アライアンスは、複数の企業が独立性を保ったまま、共同開発、生産委託、販売提携、資本提携などの形で協力する戦略的提携です。M&A に比べて少ない投資で短期間に他社の経営資源を活用でき、提携の解消も比較的容易です。
    why:
      - 正解です。独立性を保ちながら協力関係を結ぶのがアライアンスです。
      - 合併や買収によって他社を取り込むのは M&A です。
      - 間接業務を一つの組織に集約してグループに提供するのはシェアードサービスです。
      - インターネットで不特定多数から資金を集めるのはクラウドファンディングです。
    terms: [アライアンス, M&A, シェアードサービス, クラウドファンディング]

  - id: A19-011
    topic: [19-1-1, 19-1-2]
    diff: 2
    q: 範囲の経済の説明として，最も適切なものはどれか。
    c:
      - 複数の事業を同時に営み，設備・技術・ブランドなどの経営資源を共有することで，事業を別々に営むよりもコストが低くなる。
      - 生産規模を拡大すると，固定費が分散され，製品 1 単位当たりのコストが低くなる。
      - 製品の累積生産量が増えるにつれて，習熟や改善によって単位当たりのコストが一定の割合で低下する。
      - 製品やサービスの利用者が増えるほど，利用者一人一人にとっての価値が高まる。
    a: ア
    exp: |
      範囲の経済は、複数の事業や製品を一つの企業で手掛けることで、共通の経営資源（設備、技術、販売網、ブランドなど）を共有でき、それぞれを別の企業が行う場合よりも総コストが低くなる効果です。多角化を進める根拠の一つになります。
    why:
      - 正解です。経営資源の共有によるコストの低下が範囲の経済です。
      - 生産規模の拡大による単位コストの低下は規模の経済です。
      - 累積生産量の増加による単位コストの低下は経験曲線（経験効果）です。
      - 利用者が増えるほど価値が高まるのは、ネットワーク外部性（ネットワーク効果）の説明です。
    terms: [範囲の経済, 規模の経済, 経験曲線]

  - id: A19-012
    topic: 19-1-3-1
    diff: 2
    q: M.E.ポーターの競争の基本戦略のうち，集中戦略の説明として，最も適切なものはどれか。
    c:
      - 特定の顧客層，地域，製品分野などに経営資源を集中し，その限られた市場でコスト面か差別化面での優位を築く。
      - 業界全体を対象に，他社よりも低いコストで製品を提供して優位を築く。
      - 業界全体を対象に，品質・機能・ブランドなどで他社と異なる特徴を打ち出して優位を築く。
      - 市場のリーダ企業が，下位企業の差別化策と同様の製品を投入して，その効果を打ち消す。
    a: ア
    exp: |
      ポーターの競争の基本戦略は、コストリーダーシップ戦略、差別化戦略、集中戦略の3つです。集中戦略は、特定の市場セグメント（顧客層、地域、製品分野など）に経営資源を集中し、そのセグメントでコスト集中または差別化集中によって優位を築く戦略です。
    why:
      - 正解です。特定の市場に資源を集中して優位を築くのが集中戦略です。
      - 業界全体で低コストを武器にするのはコストリーダーシップ戦略です。
      - 業界全体で他社と異なる特徴を打ち出すのは差別化戦略です。
      - リーダ企業が下位企業の差別化策を模倣して無力化するのは同質化戦略です。
    terms: [競争の基本戦略, 同質化戦略]

  - id: A19-013
    topic: 19-1-3-1
    diff: 1
    q: ブルーオーシャン戦略の説明として，最も適切なものはどれか。
    c:
      - 競合他社がひしめく既存の市場で争うのではなく，競争のない新しい市場空間を創造して，新たな需要を獲得する。
      - 既存の市場で，競合他社よりも大幅に低い価格を設定してシェアを奪う。
      - 競合他社の成功した製品をいち早く模倣し，同じ市場に投入する。
      - 市場を細分化し，大企業が参入しない小さな市場に特化して高い収益を得る。
    a: ア
    exp: |
      ブルーオーシャン戦略は、W.チャン・キムと R.モボルニュが提唱した戦略で、血みどろの競争が行われている既存市場（レッドオーシャン）を避け、新しい価値を提供して競争のない未開拓の市場（ブルーオーシャン）を創造する戦略です。価値の向上とコストの低下を同時に追求する点が特徴です。
    why:
      - 正解です。競争のない新しい市場空間を創造するのがブルーオーシャン戦略です。
      - 既存市場での低価格による競争は、レッドオーシャンでの戦い方です。
      - 成功した製品の模倣で同じ市場に参入するのは、既存市場での競争であり、新しい市場の創造ではありません。
      - 小さな市場に特化するのは、ニッチ戦略（集中戦略）の考え方です。
    terms: [ブルーオーシャン戦略, 競争の基本戦略]

  - id: A19-014
    topic: 19-2-1-1
    diff: 1
    q: 3C 分析で分析の対象とする3つの要素の組合せとして，適切なものはどれか。
    c:
      - 顧客・市場（Customer），競合（Competitor），自社（Company）
      - 顧客価値（Customer Value），顧客コスト（Cost），利便性（Convenience）
      - 製品（Product），価格（Price），流通（Place）
      - 強み（Strength），弱み（Weakness），機会（Opportunity）
    a: ア
    exp: |
      3C 分析は、Customer（市場・顧客）、Competitor（競合）、Company（自社）の3つの観点から事業環境を分析し、成功要因（KSF）を見いだしてマーケティング戦略や事業戦略の立案に役立てる手法です。
    why:
      - 正解です。顧客・市場、競合、自社の3つが 3C です。
      - 顧客価値・顧客コスト・利便性は、顧客の視点から見たマーケティングミックスである 4C の要素の一部です。
      - 製品・価格・流通は、売り手の視点から見たマーケティングミックスである 4P の要素の一部です。
      - 強み・弱み・機会は、SWOT 分析の要素の一部です。
    terms: [3C分析, マーケティングミックス, SWOT分析]

  - id: A19-015
    topic: 19-2-1-1
    diff: 1
    q: STP 分析のうち，ターゲティングで行うこととして，最も適切なものはどれか。
    c:
      - 細分化した市場の中から，自社が重点的に狙う市場を選定する。
      - 年齢，地域，ライフスタイルなどの基準で，市場を同質のニーズをもつグループに細分化する。
      - 狙う市場において，自社の製品を競合製品と比べてどのような位置付けにするかを明確にする。
      - 製品，価格，流通，販売促進の施策を組み合わせて実行計画を立てる。
    a: ア
    exp: |
      STP 分析は、Segmentation（市場の細分化）、Targeting（狙う市場の選定）、Positioning（競合に対する自社の位置付けの明確化）の順に行うマーケティングの手法です。ターゲティングでは、各セグメントの規模や成長性、自社の強みなどを考慮して、狙う市場を決めます。
    why:
      - 正解です。細分化した市場から狙う市場を選ぶのがターゲティングです。
      - 市場を同質のニーズをもつグループに分けるのはセグメンテーションです。
      - 競合製品と比べた自社の位置付けを明確にするのはポジショニングです。
      - 4つの施策を組み合わせて計画を立てるのは、マーケティングミックス（4P）の策定です。
    terms: [STP分析, マーケティングミックス]

  - id: A19-016
    topic: 19-2-1-2
    diff: 2
    q: マーケティングミックスの 4P を顧客の視点からとらえ直したものが 4C である。4P の Place（流通）に対応する 4C の要素はどれか。
    c:
      - Convenience（利便性）
      - Customer Value（顧客価値）
      - Cost（顧客の負担するコスト）
      - Communication（コミュニケーション）
    a: ア
    exp: |
      4P は売り手の視点の Product（製品）、Price（価格）、Place（流通）、Promotion（販売促進）であり、4C は買い手の視点から、それぞれ Customer Value（顧客価値）、Cost（顧客の負担するコスト）、Convenience（利便性）、Communication（コミュニケーション）に対応させたものです。流通（どこで買えるか）は、顧客にとっての入手のしやすさ（利便性）に対応します。
    why:
      - 正解です。Place（流通）は Convenience（利便性）に対応します。
      - Customer Value（顧客価値）は Product（製品）に対応します。
      - Cost（顧客の負担するコスト）は Price（価格）に対応します。
      - Communication（コミュニケーション）は Promotion（販売促進）に対応します。
    terms: [マーケティングミックス]

  - id: A19-017
    topic: 19-2-2-1
    diff: 1
    q: プロダクトライフサイクルにおける成熟期の特徴として，最も適切なものはどれか。
    c:
      - 売上の伸びが鈍化して市場が飽和し，競争が激しくなるため，差別化やコスト削減，既存顧客の維持が重要になる。
      - 製品の認知度が低く，広告や販売促進に多くの費用がかかるため，利益が出にくい。
      - 製品が市場に受け入れられて売上が急速に伸び，競合他社の参入が増える。
      - 需要が減少して売上と利益が低下し，撤退や製品の絞込みが検討される。
    a: ア
    exp: |
      プロダクトライフサイクルは、製品が市場に投入されてから姿を消すまでを、導入期、成長期、成熟期、衰退期の4段階で表したものです。成熟期は売上が最大に近づく一方で伸びは鈍り、競合との競争が激化するため、差別化、コスト削減、ブランドの維持、新たな用途の開拓（ライフサイクルエクステンション）などが重要になります。
    why:
      - 正解です。売上の伸びが鈍化し、差別化や顧客維持が重要になるのが成熟期です。
      - 認知度が低く、販売促進の費用がかさんで利益が出にくいのは導入期です。
      - 売上が急速に伸び、競合の参入が増えるのは成長期です。
      - 需要が減少して撤退などが検討されるのは衰退期です。
    terms: [プロダクトライフサイクル]

  - id: A19-018
    topic: 19-2-2-2
    diff: 1
    q: 新製品の価格戦略のうち，ペネトレーションプライシングの説明として，最も適切なものはどれか。
    c:
      - 発売当初から低い価格を設定し，短期間で市場に浸透させて大きな市場シェアを獲得する。
      - 発売当初に高い価格を設定し，価格に敏感でない初期の購入者から早期に開発費を回収する。
      - 需要や在庫の状況，時期などに応じて，価格をきめ細かく変動させる。
      - 製品の原価に一定の利益を上乗せして価格を決める。
    a: ア
    exp: |
      ペネトレーションプライシング（浸透価格戦略）は、新製品の発売時に低価格を設定して急速に普及させ、市場シェアを獲得する価格戦略です。シェア拡大によって規模の経済や経験曲線の効果が得られ、競合の参入も抑えやすくなります。
    why:
      - 正解です。低価格で一気に市場に浸透させるのがペネトレーションプライシングです。
      - 当初に高価格を設定して早期に投資を回収するのは、スキミングプライシング（上澄み吸収価格戦略）です。
      - 需要などに応じて価格を変動させるのは、ダイナミックプライシングです。
      - 原価に利益を上乗せして価格を決めるのは、コストプラス法です。
    terms: [ペネトレーションプライシング, スキミングプライシング, ダイナミックプライシング, コストプラス法]

  - id: A19-019
    topic: 19-2-2-1
    diff: 1
    q: 製品戦略に関する用語のうち，カニバリゼーションの説明として，最も適切なものはどれか。
    c:
      - 自社が投入した新製品が，自社の既存製品の顧客や売上を奪ってしまうこと
      - 製品の機能や品質の差がなくなり，価格だけで比較されるようになること
      - 成熟期を迎えた製品に新たな用途や顧客を見いだし，製品の寿命を延ばすこと
      - 異なる顧客層向けに，価格や機能の異なる複数の製品を系列として品ぞろえすること
    a: ア
    exp: |
      カニバリゼーション（共食い）は、自社の新製品や新しい販売チャネルが、自社の既存製品や既存チャネルの売上を奪ってしまう現象です。新製品の投入やチャネル戦略の検討では、会社全体として売上が増えるかどうかを考慮する必要があります。
    why:
      - 正解です。自社製品同士で顧客を奪い合うのがカニバリゼーションです。
      - 製品の差がなくなり価格競争になるのは、コモディティ化です。
      - 製品に新たな用途を見いだして寿命を延ばすのは、ライフサイクルエクステンションです。
      - 複数の製品を系列として品ぞろえするのは、製品ラインの説明です。
    terms: [カニバリゼーション, コモディティ化, プロダクトライフサイクル]

  - id: A19-020
    topic: 19-2-2-5
    diff: 1
    q: ある EC サイトの1か月の訪問者数は 20,000 人であり，そのうち商品を購入した訪問者は 300 人であった。この月の CVR（コンバージョン率）は何 % か。
    c:
      - 1.5
      - 0.15
      - 15
      - 6.7
    a: ア
    exp: |
      CVR（Conversion Rate：顧客転換率）は、Web サイトの訪問者のうち、購入や会員登録などの成果（コンバージョン）に至った割合です。CVR ＝ 300 ÷ 20,000 × 100 ＝ 1.5（%）となります。CVR を高めるために、LPO（ランディングページ最適化）や A/B テストなどが行われます。
    why:
      - 正解です。300 ÷ 20,000 × 100 ＝ 1.5 % です。
      - 300 ÷ 20,000 ＝ 0.015 を百分率に換算する際に、桁を一つ誤った値です。
      - 300 ÷ 20,000 を百分率に換算する際に、桁を一つ多く誤った値です。
      - 20,000 ÷ 300 ÷ 10 のように、割る数と割られる数を逆にして求めた値です。
    terms: [CVR]
    verify: { value: '300 / 20000 * 100' }

  - id: A19-021
    topic: 19-2-2-5
    diff: 1
    q: インターネット広告のうち，リスティング広告の説明として，最も適切なものはどれか。
    c:
      - 検索エンジンで利用者が入力したキーワードに連動して，検索結果のページに表示される広告
      - 提携先の Web サイトに掲載した広告を経由して商品が購入されると，提携先に成果に応じた報酬が支払われる広告
      - Web ページの一部に，画像やアニメーションで作成した広告を表示し，クリックすると広告主のサイトに移動する広告
      - スマートフォンなどの位置情報を利用して，利用者がいる地域に応じた内容を配信する広告
    a: ア
    exp: |
      リスティング広告（検索連動型広告）は、検索エンジンの検索キーワードに関連した広告を検索結果ページに表示する広告です。利用者の関心が明確な時点で広告を表示できるため、効果が高いとされ、クリックされた回数に応じて費用を支払う方式が一般的です。
    why:
      - 正解です。検索キーワードに連動して表示されるのがリスティング広告です。
      - 提携先サイト経由の成果に応じて報酬を支払うのは、アフィリエイト（成功報酬型広告）です。
      - 画像やアニメーションでページの一部に表示する広告は、バナー広告です。
      - 位置情報に応じた内容を配信するのは、ジオターゲティング広告（位置連動型広告）です。
    terms: [リスティング広告, アフィリエイト]

  - id: A19-022
    topic: 19-2-3
    diff: 2
    q: マーケティング手法のうち，プル戦略の説明として，最も適切なものはどれか。
    c:
      - 広告やパブリシティによって消費者に直接働きかけて需要を喚起し，消費者が自ら製品を指名して購入するように仕向ける。
      - 販売奨励金や営業担当者の働きかけによって流通業者に製品を積極的に扱わせ，消費者への販売を推し進める。
      - 顧客一人一人の購買履歴や嗜好に合わせて，個別に異なる商品やサービスを提案する。
      - すべての消費者を同一の対象とみなし，単一の製品を大量生産・大量販売する。
    a: ア
    exp: |
      プル戦略は、テレビ CM などの広告やパブリシティによって消費者の購買意欲を高め、消費者が店頭で製品を指名して購入することで、流通業者が製品を仕入れざるを得ない状況を作る戦略です。これに対して、メーカから流通業者・小売店へ製品を押し込むように働きかけるのがプッシュ戦略です。
    why:
      - 正解です。消費者に直接働きかけて需要を引き出すのがプル戦略です。
      - 流通業者に働きかけて製品を押し込むのはプッシュ戦略です。
      - 顧客一人一人に合わせて個別に提案するのは、ワントゥワンマーケティングです。
      - すべての消費者を対象に大量生産・大量販売するのは、マスマーケティングです。
    terms: [プッシュ戦略, ワントゥワンマーケティング]

  - id: A19-023
    topic: 19-2-2-3
    diff: 1
    q: 流通戦略に関する用語のうち，オムニチャネルの説明として，最も適切なものはどれか。
    c:
      - 実店舗，EC サイト，スマートフォンのアプリ，SNS などのあらゆる顧客接点を統合し，どの経路からでも一貫した購買体験を提供する。
      - 本部が加盟店に商標や経営ノウハウを提供し，その対価として加盟店から使用料を受け取る。
      - 製造業者が流通業者を通さずに，消費者に直接製品を販売する。
      - 自社の新しい販売経路が，既存の販売経路の売上を奪ってしまう。
    a: ア
    exp: |
      オムニチャネルは、実店舗、EC サイト、カタログ、アプリ、SNS などの販売・コミュニケーションのチャネルを統合し、在庫情報や顧客情報を共有して、顧客がどのチャネルを使っても同じように商品を探し、購入し、受け取れるようにする流通戦略です。
    why:
      - 正解です。あらゆるチャネルを統合して一貫した購買体験を提供するのがオムニチャネルです。
      - 本部が加盟店に商標やノウハウを提供し対価を得るのは、フランチャイズチェーンです。
      - 流通業者を通さず消費者に直接販売するのは、直販（ダイレクトマーケティング）の考え方です。
      - 新しい販売経路が既存の経路の売上を奪うのは、カニバリゼーションです。
    terms: [オムニチャネル, フランチャイズチェーン, カニバリゼーション]

  - id: A19-024
    topic: 19-2-1-4
    diff: 2
    q: サービスデザインの手法のうち，カスタマージャーニーマップの説明として，最も適切なものはどれか。
    c:
      - 顧客が製品やサービスを認知してから購入・利用に至るまでの行動，接点，感情の変化を時系列に沿って可視化したもの
      - 製品やサービスの典型的な利用者像を，年齢，職業，価値観などを具体的に設定した架空の人物として描いたもの
      - サービスの提供過程を，顧客から見える活動と従業員やシステムが裏側で行う活動に分けて図示したもの
      - 製品の属性の組合せを変えた複数の案を顧客に評価させ，各属性が購買の意思決定に与える影響を分析するもの
    a: ア
    exp: |
      カスタマージャーニーマップは、ペルソナとして設定した顧客が、製品やサービスを知り、比較・検討し、購入し、利用するまでの一連の体験（旅）を、行動、タッチポイント（顧客接点）、思考や感情の変化とともに時系列で可視化する手法です。顧客体験（CX）の課題や改善点を発見するのに使われます。
    why:
      - 正解です。顧客の行動・接点・感情の変化を時系列で可視化するのがカスタマージャーニーマップです。
      - 典型的な利用者像を架空の人物として描くのはペルソナです。
      - 顧客から見える活動と裏側の活動に分けて提供過程を図示するのは、サービスブループリントです。
      - 属性の組合せを変えた案を評価させて影響を分析するのは、コンジョイント分析です。
    terms: [カスタマージャーニーマップ, ペルソナ, サービスブループリント, コンジョイント分析]

  - id: A19-025
    topic: 19-3-2
    diff: 1
    q: BSC（バランススコアカード）で，戦略を具体的な目標や施策に落とし込む際に用いる4つの視点の組合せとして，適切なものはどれか。
    c:
      - 財務，顧客，業務プロセス，学習と成長
      - 製品，価格，流通，販売促進
      - 強み，弱み，機会，脅威
      - 顧客・市場，競合，自社，協力者
    a: ア
    exp: |
      BSC は、R.S.キャプランと D.P.ノートンが提唱した業績評価の手法で、財務の視点だけでなく、顧客、業務プロセス（社内ビジネスプロセス）、学習と成長の4つの視点から戦略目標を設定し、それぞれの KPI や施策をバランスよく管理します。
    why:
      - 正解です。財務・顧客・業務プロセス・学習と成長が BSC の4つの視点です。
      - 製品・価格・流通・販売促進は、マーケティングミックスの 4P です。
      - 強み・弱み・機会・脅威は、SWOT 分析の要素です。
      - 顧客・市場、競合、自社は 3C 分析の要素であり、それに協力者（Co-operator）を加えたものは 4C 分析と呼ばれることがあります。BSC の視点ではありません。
    terms: [BSC, マーケティングミックス, SWOT分析, 3C分析]

  - id: A19-026
    topic: [19-3-1, 17-1-4]
    diff: 2
    q: 目標の設定と評価に用いる KPI の説明として，最も適切なものはどれか。
    c:
      - 最終的な目標の達成に向けたプロセスが適切に実行されているかを，定量的に計測するための中間的な指標
      - 企業が最終的に達成すべき目標を，定量的に示した指標
      - 目標を達成するために，特に重点的に取り組むべき決定的に重要な要因
      - 企業が社会に対して果たすべき使命や存在意義を示したもの
    a: ア
    exp: |
      KGI（Key Goal Indicator：重要目標達成指標）は、売上高や利益率など最終的な目標の達成度を測る指標です。CSF（Critical Success Factor：重要成功要因）は、その目標を達成するために決定的に重要な要因です。KPI（Key Performance Indicator：重要業績評価指標）は、CSF に基づく活動の実施状況を測る中間的な指標で、KGI の達成に向けてプロセスが順調かを定期的にモニタリングするために使います。
    why:
      - 正解です。目標達成に向けたプロセスの実施状況を測る中間指標が KPI です。
      - 最終的な目標の達成度を定量的に示す指標は KGI です。
      - 目標達成のために決定的に重要な要因は CSF です。
      - 企業の使命や存在意義を示すのは、ミッション（経営理念、MVV）です。
    terms: [KPI, KGI, CSF, MVV]

  - id: A19-027
    topic: 19-3-1
    diff: 2
    q: ビジネスモデルキャンバスを構成する9つの要素（ブロック）に含まれないものはどれか。
    c:
      - 競合他社
      - 顧客セグメント
      - 価値提案
      - 収益の流れ
    a: ア
    exp: |
      ビジネスモデルキャンバスは、A.オスターワルダーらが提唱したビジネスモデルを1枚の図で可視化する手法で、顧客セグメント、価値提案、チャネル、顧客との関係、収益の流れ、主要リソース、主要活動、キーパートナー、コスト構造の9つのブロックで構成されます。競合他社は9つのブロックには含まれません。
    why:
      - 正解です。競合他社はビジネスモデルキャンバスのブロックに含まれません（3C 分析などで扱います）。
      - 顧客セグメントは、誰に価値を提供するかを示すブロックです。
      - 価値提案は、顧客にどのような価値を提供するかを示すブロックです。
      - 収益の流れは、顧客からどのように収益を得るかを示すブロックです。
    terms: [ビジネスモデルキャンバス, 3C分析]

  - id: A19-028
    topic: 19-3-2
    diff: 2
    q: バリューエンジニアリング（VE）の説明として，最も適切なものはどれか。
    c:
      - 製品やサービスの価値を，果たすべき機能とそのためのコストの比でとらえ，必要な機能を最低のコストで実現するように改善する。
      - 統計的な手法を用いてプロセスのばらつきを抑え，欠陥の発生率を 100 万回当たり 3.4 回以下に抑えることを目指す。
      - 経営者から現場の従業員までの全員が参加して，製品やサービスの品質を組織全体で継続的に改善する。
      - 製品の設計や生産の工程を同時並行で進めて，開発期間を短縮する。
    a: ア
    exp: |
      バリューエンジニアリング（VE）は、価値（Value）を機能（Function）÷ コスト（Cost）で表し、製品やサービスに求められる機能を分析して、その機能を最も低いコストで実現する方法を組織的に追求する手法です。機能を下げずにコストを下げる、またはコストを上げずに機能を高めることで価値を向上させます。
    why:
      - 正解です。価値を機能とコストの比でとらえて改善するのがバリューエンジニアリングです。
      - 統計的手法で欠陥を 100 万回当たり 3.4 回以下に抑えることを目指すのは、シックスシグマです。
      - 全員参加で品質を組織全体で継続的に改善するのは、TQM（総合的品質管理）です。
      - 設計や生産の工程を並行して進めて期間を短縮するのは、コンカレントエンジニアリングです。
    terms: [バリューエンジニアリング, シックスシグマ, TQM, コンカレントエンジニアリング]

  - id: A19-029
    topic: [19-4-1, 17-1-1-6]
    diff: 1
    q: SCM の導入によって期待される効果として，最も適切なものはどれか。
    c:
      - 取引先を含めた調達・生産・物流・販売の情報を共有して全体の流れを最適化し，在庫の削減やリードタイムの短縮を図れる。
      - 顧客ごとの購買履歴や問合せの記録を一元管理し，顧客との長期的な関係を強化できる。
      - 営業担当者の訪問計画や商談の状況を共有し，営業活動の効率を高められる。
      - 社員の知識やノウハウを共有・活用し，組織全体の問題解決力を高められる。
    a: ア
    exp: |
      SCM（Supply Chain Management：供給連鎖管理）は、原材料の調達から生産、物流、販売を経て顧客に届くまでの一連の流れ（サプライチェーン）を、企業や組織の枠を越えて統合的に管理する手法です。需要や在庫の情報を共有することで、過剰在庫や欠品を減らし、リードタイムを短縮できます。
    why:
      - 正解です。サプライチェーン全体の最適化による在庫削減やリードタイム短縮が SCM の効果です。
      - 顧客情報を一元管理して長期的な関係を強化するのは CRM の効果です。
      - 営業活動の計画や商談の状況を共有して効率化するのは SFA の効果です。
      - 社員の知識やノウハウを共有・活用するのは、ナレッジマネジメント（KM）の効果です。
    terms: [SCM, CRM, SFA, ナレッジマネジメント]
