batch: H2
reviewed: { at: '2026-10-30', method: '独立レビュー担当が解答を伏せて解き直し、法令の要件・数値区分（資本金区分、支払期日の60日ルール、漏洩時の報告対象の類型など）を照合し、誤答の検証と既存問題との重複確認を実施' }
questions:
  - id: A23-501
    topic: 23-1-2
    diff: 3
    scope: 23-1-2 著作権法の職務著作。具体的な作成状況（場所、時間、使用機材、業務との関係）から、法人著作の要件を満たすかどうかを判断する事例問題であり、範囲内。
    prereq: 職務著作の要件（法人の発意、職務上の作成、別段の定めがないこと）と、プログラムの著作物の特例
    hard: 雇用関係があるだけでは法人著作にならない点を見抜き、発意と職務性の有無を事例の事実から一つずつ当てはめる必要がある。
    q: |
      A社の従業員Bは、自宅で休日に、自分のパソコンを使い、A社の業務とは関係のない趣味のアプリケーションを開発し、B個人の名義で公開した。A社との契約や勤務規則に、著作権の帰属に関する別段の定めはない。このプログラムの著作者は誰か。
    c:
      - 従業員B本人
      - A社（従業員が作成したものは、常に法人が著作者になる）
      - 従業員BとA社の共同
      - A社（ただし著作者人格権は従業員Bに帰属する）
    a: ア
    exp: |
      職務著作（法人著作）が成立するには、法人の発意に基づき、法人の業務に従事する者が職務上作成し、法人の著作名義で公表される（プログラムの著作物では公表名義の要件は不要）ことに加え、契約や勤務規則に別段の定めがないことが必要です。本件は、休日に自宅で、業務とは関係のない趣味の開発であり、「法人の発意」と「職務上作成」という要件を欠きます。雇用関係があるというだけで、従業員が作った全ての著作物が法人著作になるわけではありません。したがって著作者は従業員B本人です。
    why:
      - 正解です。法人の発意と職務上の作成という職務著作の要件を満たさないため、著作者は作成した従業員本人です。
      - 雇用関係だけで法人著作になるわけではありません。要件を欠く私的な開発まで会社に帰属するわけではない点が誤りです。
      - 共同著作物は、複数人が共同して創作し、寄与を分離して個別に利用できない場合の概念です。本件はBが単独で作成しています。
      - 法人が著作者になる場合は、著作者人格権も法人に帰属します。人格権だけが従業員に残るという組合せにはなりません。
    know: プログラムの著作物は、法人名義で公表されなくても職務著作が成立する点が他の著作物と異なる。ただし発意・職務性の要件は必要で、業務外の私的開発は従業員本人の著作物になる。
    terms: [職務著作]
    verify:
      manual: 事例の事実（休日・自宅・自前の機材・業務と無関係・個人名義）を職務著作の要件に当てはめ、発意と職務性を欠くことを確認した。要件を満たさない以上、著作者は作成者本人になる。

  - id: A23-502
    topic: 23-2-4-2
    diff: 4
    scope: 23-2-4-2 個人情報保護法の第三者提供。具体的な委託の事例について、同意が不要な理由と、事業者側に残る監督義務を判断する問題であり、範囲内。
    prereq: 利用目的の達成に必要な範囲内で取扱いを委託する場合の提供は、第三者提供に該当しないという例外
    hard: 「同意が不要」と「何もしなくてよい」を切り分け、委託先の監督義務（安全管理措置の確認）が別途課されることまで含めて判断する必要がある。
    q: |
      A社は、顧客管理システムの運用をクラウド事業者Cに委託し、利用目的の達成に必要な範囲内で、顧客の個人データをCに取り扱わせている。この取扱いについて、個人情報保護法上の扱いとして、最も適切なものはどれか。
    c:
      - 委託に伴う取扱いのため第三者提供には当たらず、本人の同意は不要である。ただしA社にはCへの監督義務がある
      - 第三者提供に当たるため、顧客全員から事前に同意を得なければならない
      - 委託に伴う取扱いのため、第三者提供に当たらず、A社に監督などの義務も生じない
      - Cが個人データを国外のサーバに保存する場合は、委託であっても常に違法になる
    a: ア
    exp: |
      個人情報保護法では、利用目的の達成に必要な範囲内で個人データの取扱いを委託することに伴って提供される場合は、その提供先は「第三者」に該当しないとされます。したがって、本人の同意は不要です。ただし、例外になるのは提供の位置付けだけであり、A社には委託先であるCを監督する義務（必要かつ適切な監督）があります。契約での安全管理の取り決めや、実施状況の確認を怠ると、A社の義務違反になります。なお、外国にある第三者への提供には別の規制がありますが、「委託先が国外のサーバを使う」こと自体が常に違法になるわけではありません。
    why:
      - 正解です。委託に伴う提供は第三者提供に当たらず同意は不要ですが、委託先の監督義務は残ります。
      - 委託の範囲内の提供は、法律上、第三者への提供から除外されており、全員分の同意は不要です。
      - 同意が不要なことと、監督義務がないことは別です。委託先の監督は委託元の義務として定められています。
      - 国外サーバの利用そのものが直ちに違法になるわけではありません。要件は提供の形態や手続によって判断されます。
    know: 第三者提供に当たらない場合として、委託、事業の承継、共同利用がある。委託の例外は「同意が不要」になるだけで、安全管理や委託先監督の義務まで免除されるわけではない。
    terms: [第三者提供, 個人データ]
    verify:
      manual: 事例（利用目的の範囲内での運用委託）に対して、委託に伴う提供が第三者に当たらないという例外と、委託先の監督義務が併存することを条文の構造から確認した。

  - id: A23-503
    topic: 23-2-4-1
    diff: 3
    scope: 23-2-4-1 個人情報保護法の漏洩時の対応。要配慮個人情報を含む漏洩が、件数にかかわらず個人情報保護委員会への報告と本人への通知の対象になることを判断する問題であり、範囲内。
    prereq: 漏洩等の報告対象となる事態（要配慮個人情報の漏洩、不正アクセスによる漏洩、件数の基準など）の区別
    hard: 「50件と少ないから報告不要」という件数だけの判断を退け、情報の種類（要配慮個人情報）が報告対象の決め手になることを判断する必要がある。
    q: |
      医療機関Aの職員が、患者50名分の氏名と診療内容を含むファイルを誤って外部の宛先にメール送信し、漏洩したことが判明した。診療内容は要配慮個人情報に当たる。この事態について、個人情報保護法上の対応として、適切なものはどれか。
    c:
      - 要配慮個人情報の漏洩であるため、件数にかかわらず、個人情報保護委員会への報告と本人への通知が必要である
      - 漏洩した件数が1,000件以下であるため、報告も通知も不要である
      - 本人への通知は必要だが、個人情報保護委員会への報告は不要である
      - 誤送信先が削除に応じたことが確認できれば、報告も通知も不要になる
    a: ア
    exp: |
      個人情報取扱事業者には、一定の漏洩等の事態が発生した場合に、個人情報保護委員会へ報告し、本人へ通知する義務があります。報告の対象は、要配慮個人情報の漏洩、財産的被害のおそれがある漏洩、不正アクセスなどによる漏洩、そして1,000件を超える漏洩などです。診療内容は要配慮個人情報であり、その漏洩は件数が50件と少なくても対象になります。また、誤送信先で削除が確認できたかどうかは、報告義務の有無を左右しません（被害の程度の判断材料にはなります）。
    why:
      - 正解です。要配慮個人情報の漏洩は、件数の基準とは独立に、報告と通知の対象になります。
      - 1,000件という基準は件数による類型のもので、要配慮個人情報の漏洩には適用されません。
      - 報告と通知はセットの義務であり、通知だけを行えば足りるわけではありません。
      - 削除の確認は事態の深刻さの評価に関わりますが、発生した漏洩の報告義務自体を消すものではありません。
    know: 漏洩時の報告・通知義務は2022年施行の改正で義務化された。対象は「情報の種類（要配慮）」「漏洩の態様（不正アクセス等）」「件数（1,000件超）」のいずれかで判断され、件数が少なくても対象になる場合がある。
    terms: [個人情報取扱事業者, 個人データ]
    verify:
      manual: 事例の情報が診療内容（要配慮個人情報）であることを確認し、件数基準とは独立の類型として報告・通知の対象になることを、報告対象の類型区分から確認した。

  - id: A23-504
    topic: 23-3-2-1
    diff: 4
    scope: 23-3-2-1 中小受託取引適正化法（旧下請法）。資本金の区分から法律の適用対象になるかを判定し、支払期日の60日ルールへの適合も判断する複合問題であり、範囲内。
    prereq: 情報成果物作成委託における資本金の区分と、給付受領日から60日以内に支払期日を定める義務
    hard: 資本金2億円の委託事業者と800万円の受託事業者がどの区分に当たるかを判定したうえで、90日後の支払期日が60日ルールに反することまで、2段階で判断する必要がある。
    q: |
      資本金2億円のA社は、資本金800万円のB社に、業務用ソフトウェアの開発（情報成果物の作成）を委託した。A社は、成果物を受領した日から90日後を支払期日とする条件を提示している。中小受託取引適正化法（旧下請法）上の扱いとして、適切なものはどれか。
    c:
      - この委託は法律の適用対象であり、90日後の支払期日の設定は、60日以内に定めるべき義務に反する
      - この委託は法律の適用対象ではなく、支払期日の設定は自由である
      - この委託は法律の適用対象だが、支払期日は受領日から90日以内であれば認められる
      - 資本金800万円のB社が委託事業者側の立場になるため、A社に義務は生じない
    a: ア
    exp: |
      情報成果物作成委託では、委託事業者の資本金が1,000万円を超え3億円以下で、受託事業者の資本金が1,000万円以下の場合に、この法律の適用対象になります。資本金2億円のA社から資本金800万円のB社への開発委託は、この区分に該当します。適用対象の場合、委託事業者は、給付を受領した日から60日以内で、できる限り短い期間内に支払期日を定めなければなりません。90日後の設定は、この義務に反します。
    why:
      - 正解です。資本金の区分から適用対象になり、支払期日は受領日から60日以内に定める必要があります。
      - 資本金の組合せが法律の区分に該当するため、適用対象外にはなりません。
      - 支払期日の上限は90日ではなく60日です。90日後の設定は認められません。
      - 委託事業者は発注側のA社であり、義務を負うのはA社です。立場の取り違えです。
    know: 中小受託取引適正化法の適用は、取引の内容（製造委託、情報成果物作成委託など）と、双方の資本金の区分の組合せで決まる。支払期日は受領日から60日以内という期限が、代金の遅延を防ぐ中心的なルールである。
    terms: [中小受託取引適正化法]
    verify:
      manual: 資本金の区分表（情報成果物作成委託で、委託側1,000万円超3億円以下 × 受託側1,000万円以下）に事例を当てはめて適用対象と判定し、支払期日の90日が60日の上限を超えることを確認した。

  - id: A23-505
    topic: 23-1-4
    diff: 3
    scope: 23-1-4 不正競争防止法の営業秘密。保管状況の事実から、営業秘密の3要件のうち秘密管理性を満たすかどうかを判断する事例問題であり、範囲内。
    prereq: 営業秘密の3要件（秘密管理性、非公知性、有用性）と、それぞれの意味
    hard: 情報の内容自体は価値があっても、アクセス制限も「秘密」の表示もない保管では秘密として管理したことにならない、という要件の当てはめが必要になる。
    q: |
      A社の顧客リストは、全社員が制限なくアクセスできる共有フォルダに保存され、「秘密」である旨の表示もされていない。退職した従業員Bがこのリストを持ち出し、転職先で営業に利用した。A社が、このリストは営業秘密であると主張して不正競争防止法による保護を求める場合の見通しとして、最も適切なものはどれか。
    c:
      - 秘密として管理されていたとはいえず、営業秘密の要件を満たさないため、保護を受けることは難しい
      - 顧客リストは有用な情報であるため、保管方法にかかわらず営業秘密として保護される
      - 退職時に返却を求めていれば、保管方法にかかわらず営業秘密として保護される
      - 共有フォルダの保存先が社内であるため、秘密管理性は満たされる
    a: ア
    exp: |
      営業秘密として保護されるには、秘密として管理されていること（秘密管理性）、公然と知られていないこと（非公知性）、事業活動に有用な情報であること（有用性）の3要件を全て満たす必要があります。本件の顧客リストは有用性はあり得ますが、全社員が制限なくアクセスでき、秘密である旨の表示もない状態では、従業員が「これは秘密だ」と認識できる管理がされていたとはいえず、秘密管理性を欠きます。要件を1つでも欠けば営業秘密には当たらず、不正競争防止法の保護は難しくなります。
    why:
      - 正解です。アクセス制限も秘密の表示もない保管では秘密管理性が認められず、3要件を満たしません。
      - 有用性は要件の1つにすぎません。秘密管理性と非公知性も併せて必要です。
      - 返却の要否は持ち出し後の手続の問題で、保管時の管理状態を遡って満たすことにはなりません。
      - 保存先が社内であっても、誰でも見られる状態なら秘密として管理したことにはなりません。
    know: 秘密管理性の判断では、アクセス制限、秘密である旨の表示、持出しルールの整備など、「従業員が秘密だと認識できる措置」があったかが見られる。情報の価値だけでは営業秘密にならない。
    terms: [営業秘密, 秘密管理性]
    verify:
      manual: 事例の保管状況（無制限の共有フォルダ、表示なし）を営業秘密の3要件に当てはめ、秘密管理性を欠くことを確認した。他の要件の成否にかかわらず、1つ欠ければ営業秘密に当たらない。

  - id: A23-506
    topic: 23-3-3-3
    diff: 3
    scope: 23-3-3-3 OSSライセンス。Apache License 2.0 のコードを改変して製品に組み込み頒布する場合の義務を、GPL系の義務と区別して判断する問題であり、範囲内。
    prereq: Apache License 2.0 の条件（ライセンス文と著作権表示、NOTICE の保持、変更点の明示）と、ソースコード開示を求めない点
    hard: 利用が自由な代わりに表示類の保持義務があることと、改変した自社製品のソースコード開示までは求められないことの両方を、GPL の義務と混同せずに判断する必要がある。
    q: |
      A社は、Apache License 2.0 が適用されたOSSライブラリを改変し、自社の製品に組み込んで販売することにした。この場合の取扱いとして、適切なものはどれか。
    c:
      - ライセンスの文面と著作権表示、NOTICE ファイルを保持し、改変したファイルには変更した旨を明示する。自社製品のソースコードの開示義務はない
      - 改変したライブラリと、それを組み込んだ自社製品全体のソースコードを公開しなければならない
      - 商用製品への組込みは認められていないため、販売を中止しなければならない
      - 無償で配布されているOSSであるため、表示や通知の義務は何もない
    a: ア
    exp: |
      Apache License 2.0 は、商用利用や改変、再頒布を認める寛容なライセンスです。頒布時の条件として、ライセンスの文面と著作権表示を含めること、そのOSSに NOTICE ファイルがあればその内容を保持すること、改変したファイルには変更した旨を明示することが求められます。一方で、改変物や、それを組み込んだ製品全体のソースコードの公開は求められません。この「ソースコード開示（コピーレフト）」を求めるかどうかが、GPL との大きな違いです。
    why:
      - 正解です。表示類の保持と変更点の明示が条件であり、ソースコードの開示義務はありません。
      - ソースコードの公開を求めるのは GPL 系ライセンスの条件です。Apache License 2.0 にはそのような義務はありません。
      - Apache License 2.0 は商用利用を認めています。販売自体は問題になりません。
      - 無償でもライセンス条件は有効であり、著作権表示や NOTICE の保持などの義務は生じます。
    know: Apache License 2.0 は特許権の許諾条項も含む寛容型ライセンス。義務は表示の保持と変更の明示が中心で、コピーレフト（ソースコード開示）は課されない点が GPL と異なる。
    terms: [Apache License]
    verify:
      manual: Apache License 2.0 の頒布条件（ライセンス文・著作権表示・NOTICE の保持、変更点の明示、ソースコード開示義務なし、商用利用可）を事例に当てはめて確認した。

  - id: A23-507
    topic: 23-2-5
    diff: 3
    scope: 23-2-5 電子署名法と電子契約。クラウド型の電子署名サービスで締結した契約について、契約の成立と、電子署名法第3条の推定効の及ぶ範囲を区別して判断する問題であり、範囲内。
    prereq: 契約は原則として書面がなくても合意で成立すること（不要式）、電子署名法第3条は本人の電子署名について真正な成立を推定すること
    hard: 「契約が有効に成立するか」と「第3条の推定効が及ぶか」という2つの問いを混同せず、署名方式（サービス事業者の名義で署名が付けられる方式）によって結論が分かれる点を判断する必要がある。
    q: |
      A社とB社は、クラウド型の電子契約サービスを使い、インターネット上で契約を締結した。このサービスは、利用者の指示に基づいて、サービス事業者の名義の電子署名を文書に付ける方式である。この契約についての記述として、最も適切なものはどれか。
    c:
      - 契約は当事者の合意によって有効に成立し得る。ただし、電子署名法第3条の推定効が及ぶかは、署名が本人のものであることを確認できる方式かどうかによる
      - 電子署名法第3条の推定効が及ばなければ、その契約は無効である
      - 書面に手書きの署名や押印がない契約は、原則として全て無効である
      - クラウド型のサービスを使えば、方式にかかわらず常に電子署名法第3条の推定効が及ぶ
    a: ア
    exp: |
      まず、我が国の契約は、原則として書面の作成を効力の条件とせず、当事者の合意によって成立します（不要式の原則）。そのため、電子的に締結した契約も有効に成立し得ます。これとは別に、電子署名法第3条は、「本人による電子署名」が行われた電子文書について、真正に成立したものと推定する規定です。クラウド型のうち、サービス事業者の名義で署名が付けられる方式では、この「本人による電子署名」に当たるかが方式によって判断されます。推定効の有無は、万が一の際の立証の問題であり、契約の有効性そのものを決めるものではありません。
    why:
      - 正解です。契約の成立（合意で足りる）と、第3条の推定効（署名方式による）は、別の問題として区別されています。
      - 推定効は立証を助ける規定であり、推定が及ばないことは契約の無効を意味しません。
      - 契約は原則として書面がなくても成立します。書面や押印が効力の条件になるのは、法律で特に定められた場合だけです。
      - 推定効が及ぶかは、署名が本人のものであることを確認できるかで判断され、クラウド型であれば常に及ぶわけではありません。
    know: 電子契約の論点は「契約の成立」と「署名の証拠力（電子署名法第3条の推定）」の2層に分けて考える。第3条の推定は、本人の電子署名であることが確認できる方式に及ぶ。
    terms: [電子署名]
    verify:
      manual: 契約の不要式の原則と、電子署名法第3条が「本人による電子署名」を対象とすることを確認し、成立の可否と推定効の範囲が事例の方式で分かれることを照合した。

  - id: A23-508
    topic: 23-4-5
    diff: 2
    scope: 23-4-5 景品表示法。販売実績の乏しい「通常価格」との二重価格表示が、消費者に有利だと誤認させる表示に当たるかを判断する事例問題であり、範囲内。
    prereq: 景品表示法の不当表示のうち、取引条件について実際のものより有利であると誤認させる有利誤認表示の考え方
    q: |
      家電量販店Aは、ある商品について「通常価格 10,000 円のところ、本日限り半額の 5,000 円」と表示して販売した。しかし、この商品が 10,000 円で販売されていた期間はほとんどなく、普段から 5,000 円前後で販売されていた。この表示について、景品表示法上の問題として、最も適切なものはどれか。
    c:
      - 実際よりも有利な取引条件であると消費者に誤認させる表示（有利誤認）に当たるおそれがある
      - 商品の品質や内容について誤認させる表示（優良誤認）に当たる
      - 価格を表示する行為自体が景品表示法で禁止されている
      - 販売当日に実際に 5,000 円で売っているため、表示に問題はない
    a: ア
    exp: |
      景品表示法は、消費者の判断を誤らせる不当な表示を禁止しています。その一つが、取引条件について、実際のものよりも著しく有利であると消費者に誤認させる有利誤認表示です。「通常価格」との二重価格表示は、比較の基準となる通常価格に、相当期間の販売実績がある場合に意味をもちます。本件のように通常価格での販売実績がほとんどない場合、「半額」という表示は実態以上に得であるかのような印象を与え、有利誤認に当たるおそれがあります。問われているのは品質ではなく価格の有利さなので、優良誤認ではありません。
    why:
      - 正解です。販売実績の乏しい通常価格を基準にした二重価格表示は、取引条件を有利に見せる有利誤認のおそれがあります。
      - 優良誤認は、品質や規格などの「内容」について実際より著しく優れていると見せる表示です。本件は価格の表示です。
      - 価格表示自体は禁止されていません。禁止されるのは、消費者を誤認させる不当な表示です。
      - 当日の販売価格が正しくても、比較対象の通常価格に実態がなければ、割引の印象そのものが誤認を生みます。
    know: 二重価格表示では、比較対照価格（通常価格など）に最近相当期間の販売実績があることが前提になる。有利誤認は価格などの取引条件、優良誤認は品質などの内容に関する誤認という区別が基本である。
    terms: [景品表示法, 有利誤認]
    verify:
      manual: 事例（通常価格での販売実績がほとんどない二重価格表示）を、有利誤認表示の判断（比較対照価格の販売実績の要否）に当てはめ、内容に関する優良誤認と区別できることを確認した。
