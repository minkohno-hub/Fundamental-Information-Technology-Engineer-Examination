category: '12'
reviewed:
  at: '2026-10-21'
  method: 作成後の逐問レビュー（シラバスVer.9.2の用語例、共通フレーム2013・JIS X 0160 のプロセス・アクティビティの記述と照合）
questions:
  - id: A12-103
    topic: 12-1-2-1
    diff: 2
    q: システム要件定義において，システムが利用される状況や，利用者がシステムをどのような流れで操作・運用するかを具体的に記述したものはどれか。
    c:
      - 構造化チャート
      - 運用シナリオ
      - テスト結果報告書
      - ソースコード
    a: イ
    exp: |
      システム要件定義では、システムの利用の状況や運用シナリオを明らかにし、利用者や他システムとのインタフェース（GUI、API、インタフェースファイルなど）を含めてシステムに求められる要件を定義します。運用シナリオは、誰がどのような状況でどのような手順でシステムを使うのかを具体的に記述したものです。
    why:
      - 構造化チャートは、モジュールの階層構造を表す設計用の図です。
      - 正解です。利用の状況や操作・運用の流れを具体的に記述したものが運用シナリオです。
      - テスト結果報告書は、テストを実施した後に結果をまとめる文書です。
      - ソースコードは、実装工程でプログラム言語を用いて作成する成果物です。
    terms:
      - 要件定義
  - id: A12-104
    topic: 12-1-2-2
    diff: 1
    q: システム要件定義の初めに「システム化の目標と対象範囲」を明確にする主な理由として，適切なものはどれか。
    c:
      - システム化によって達成すべき効果と，システムで扱う業務の範囲を関係者で共有し，要件の過不足や範囲の拡大を防ぐため
      - プログラムのモジュール分割の基準を決めるため
      - テストで使用するテストデータを作成するため
      - 使用するプログラム言語のコーディング標準を決めるため
    a: ア
    exp: |
      システム化の目標（何を達成するためにシステム化するか）と対象範囲（どの業務・機能をシステムで扱うか）を最初に明確にしておくことで、関係者の認識をそろえ、要件の抜けや不要な要件の追加、範囲の際限ない拡大を防ぐことができます。後続の要件定義や設計の判断基準にもなります。
    why:
      - 正解です。目標と範囲を共有することで、要件の過不足や範囲の拡大を防ぎます。
      - モジュール分割の基準は、ソフトウェア設計の段階で決めるものです。
      - テストデータの作成は、テストの設計・準備で行う作業です。
      - コーディング標準は、実装の作業標準として定めるものです。
    terms:
      - 要件定義
  - id: A12-105
    topic: 12-1-2-3
    diff: 2
    q: システムの機能及び能力の定義において，能力（性能）に関する要件の記述として，適切なものはどれか。
    c:
      - ピーク時に1時間当たり 6,000 件の注文を処理できること
      - 注文の入力画面で，商品コードから商品名を表示すること
      - 注文データを基に，出荷指示書を作成すること
      - 注文の取消しを受け付けること
    a: ア
    exp: |
      システムの機能及び能力の定義では、システムが提供する機能（システム機能仕様）と、その機能をどの程度の能力で実現するか（レスポンスタイム、スループットなど）を定義します。単位時間当たりの処理件数は、スループットに関する能力の要件です。
    why:
      - 正解です。単位時間当たりの処理件数はスループットという能力の要件です。
      - 商品名の表示は、システムが提供する機能の内容です。
      - 出荷指示書の作成は、システムが提供する機能の内容です。
      - 注文の取消しの受付は、システムが提供する機能の内容です。
    terms:
      - スループット
      - レスポンスタイム
      - 機能要件
  - id: A12-106
    topic: 12-1-2-4
    diff: 2
    q: システム要件定義で明確にする「業務・組織及び利用者の要件」のうち，移行要件の例として，適切なものはどれか。
    c:
      - 現行システムの顧客データを，新システムの稼働開始日の前日までに全件変換して登録すること
      - 障害が発生した場合は，30分以内に業務を再開できること
      - 利用者のパスワードは8文字以上とし，90日ごとに変更させること
      - 新システムの操作について，利用者向けの研修を2回実施すること
    a: ア
    exp: |
      業務・組織及び利用者の要件には、データベース要件、セキュリティ要件、移行要件、テスト要件、運用要件、保守要件、障害対応、教育・訓練、費用などがあります。移行要件は、現行システムから新システムへデータや業務を切り替えるための要件で、移行対象データ、移行時期、方法などを定めます。
    why:
      - 正解です。現行データの変換・登録の時期と範囲を定めるのは移行要件です。
      - 障害発生時の業務再開時間は、障害対応（運用）に関する要件です。
      - パスワードの長さや変更周期は、セキュリティ要件です。
      - 利用者向けの研修は、教育・訓練に関する要件です。
    terms:
      - 要件定義
      - システム移行
  - id: A12-107
    topic: 12-1-4
    diff: 2
    q: 共通フレーム（JIS X 0160 を基にした開発のプロセス）のソフトウェア要件定義のタスクとして，適切なものはどれか。
    c:
      - ソフトウェアユニットごとにソースコードを作成し，テストする。
      - 業務の目的を踏まえて，システム化の目標と対象範囲を決める。
      - システム設計でソフトウェアに割り当てられた要件を基に，ソフトウェア構成品目ごとの機能，性能，インタフェースなどの要件を定義する。
      - 完成したソフトウェアを利用者の環境に設置する。
    a: ウ
    exp: |
      ソフトウェア要件定義では、システム設計でソフトウェアに割り当てられた要件を基に、ソフトウェア構成品目ごとに、機能・能力、インタフェース、セキュリティ、データ定義などのソフトウェア要件を確立し、文書化して評価・レビューします。
    why:
      - ソースコードの作成とテストは、ソフトウェア構築（実装）のタスクです。
      - システム化の目標と対象範囲の決定は、システム要件定義で行うタスクです。
      - 正解です。ソフトウェア構成品目ごとの要件を定義するのがソフトウェア要件定義です。
      - 利用者の環境への設置は、導入のタスクです。
    terms:
      - 共通フレーム
      - 要件定義
      - 構成管理（ソフトウェア）
  - id: A12-108
    topic: 12-1-5
    diff: 2
    q: ソフトウェア要件の定義で用いるユースケースの説明として，適切なものはどれか。
    c:
      - プログラムの処理手順を，順次・選択・繰返しで記述したもの
      - 利用者（アクター）とシステムとの相互作用を，利用者の目的を達成する一連の流れとして記述したもの
      - モジュール間の呼出し関係を階層的に記述したもの
      - データの実体とその関連を記述したもの
    a: イ
    exp: |
      ユースケースは、アクター（利用者や外部システム）がシステムを使って目的を達成するまでの、アクターとシステムとのやり取りを記述したものです。ソフトウェア要件の定義では、ユースケースやユーザーストーリー、シナリオなどを用いて、システムが外部に提供すべき振る舞いを明確にします。
    why:
      - 順次・選択・繰返しで処理手順を記述するのは、流れ図や NS 図などです。
      - 正解です。アクターとシステムの相互作用を目的単位で記述します。
      - モジュールの呼出し関係を階層的に表すのは構造化チャートです。
      - データの実体と関連を記述するのは E-R 図です。
    terms:
      - ユースケース
      - E-R図
  - id: A12-109
    topic: 12-1-5
    diff: 2
    q: ソフトウェア要件の定義で明確にする「実装制約条件」の例として，適切なものはどれか。
    c:
      - 受注・出荷・請求のデータの関連
      - 顧客が会員登録を行うときの画面の流れ
      - 既に社内で導入している DBMS の特定のバージョンを使用すること
      - 商品の在庫数が発注点を下回ったら，発注データを作成すること
    a: ウ
    exp: |
      実装制約条件は、ソフトウェアを実現する際に守らなければならない制約で、使用する OS・DBMS・プログラム言語・フレームワークの指定、既存システムとの互換性、標準への準拠などが該当します。機能そのものではなく、実現手段を制限する条件です。
    why:
      - データの関連は、データモデリング（E-R 図など）で扱う内容です。
      - 画面の流れは、ユースケースやシナリオ、画面設計で扱う内容です。
      - 正解です。使用する DBMS の指定は、実現手段を制限する実装制約条件です。
      - 発注データの作成は、ソフトウェアが提供する機能の要件です。
    terms:
      - 要件定義
  - id: A12-110
    topic: 12-2-2-1
    diff: 2
    q: システム設計（システム方式設計）の目的の説明として，適切なものはどれか。
    c:
      - 利害関係者の要求を引き出し，システム要件として合意する。
      - システム要件を，ハードウェア構成品目，ソフトウェア構成品目，サービス及び手作業のいずれで実現するかを決め，システムの構成を明確にする。
      - 個々のソフトウェアユニットの内部の処理手順を詳細に決める。
      - 完成したシステムが利用者の意図した使い方に合っているかを確認する。
    a: イ
    exp: |
      システム設計（システム方式設計）では、システム要件定義で定めた機能要件・非機能要件を実現するために、システムの最上位レベルの構成を決めます。要件をハードウェア構成品目、ソフトウェア構成品目、サービス、手作業に割り当て、それらの構成やインタフェースを明確にします。
    why:
      - 要求を引き出して合意するのは、要件定義の作業です。
      - 正解です。要件を構成品目や手作業に割り当て、システム構成を明確にします。
      - ユニット内部の処理手順を決めるのは、ソフトウェア詳細設計の作業です。
      - 利用者の意図に合っているかの確認は、妥当性確認テストの目的です。
    terms:
      - 構成品目
      - 機能要件
      - 非機能要件
  - id: A12-111
    topic: 12-2-2-4
    diff: 2
    q: ソフトウェア構成の決定（ソフトウェア方式設計）で行う作業として，適切なものはどれか。
    c:
      - ソフトウェアユニットのソースコードを作成する。
      - ソフトウェアのアーキテクチャを決め，ソフトウェアを機能のまとまりであるソフトウェア要素（コンポーネント）に分割して，その間のインタフェースを定める。
      - 利用者の業務手順を見直して，手作業の範囲を決める。
      - サーバの台数や CPU，メモリの容量を決める。
    a: イ
    exp: |
      ソフトウェア構成の決定では、ソフトウェア要件を基にソフトウェアの全体構造（アーキテクチャ）を決め、ソフトウェアをソフトウェア要素（コンポーネント）に分割し、要素間のインタフェースや各要素に割り当てる機能を定めます。最上位の構造を決める作業であり、ユニット内部の詳細までは決めません。
    why:
      - ソースコードの作成は、ソフトウェア構築（実装）の作業です。
      - 正解です。アーキテクチャとソフトウェア要素への分割、インタフェースを決めます。
      - 手作業の範囲は、ハードウェア・ソフトウェア・手作業の機能分割で扱います。
      - サーバの台数や容量は、ハードウェア構成の決定で扱います。
    terms:
      - コンポーネントウェア
  - id: A12-112
    topic: 12-2-3
    diff: 2
    q: システム統合テストの設計で行う作業として，適切なものはどれか。
    c:
      - 不要になった旧システムのデータの消去方法を決める。
      - ソフトウェアユニットの内部の分岐を網羅するテストケースを作成する。
      - システム要件を基に，統合したシステムが要件を満たしているかを確認するためのテスト要求事項を定める。
      - 利用者が本番の業務の中でシステムを試行利用する計画を立てる。
    a: ウ
    exp: |
      システム設計の段階では、システム統合テスト（システム要素を組み合わせたシステムのテスト）の設計として、システム要件ごとにどのような観点で確認するかというテスト要求事項を定めます。上流の設計段階でテストを設計しておくことで、要件とテストの対応を確保できます。
    why:
      - 旧システムのデータ消去は、廃棄の計画で決める内容です。
      - ユニット内部の分岐を網羅するテストは、ソフトウェアユニットのテストの設計です。
      - 正解です。システム要件に対応するテスト要求事項を定めます。
      - 本番業務での試行利用は、妥当性確認テストの手法です。
    terms:
      - システムテスト
  - id: A12-113
    topic: 12-2-5
    diff: 2
    q: 共通フレームにおけるソフトウェア設計（ソフトウェア詳細設計）のタスクとして，適切なものはどれか。
    c:
      - システムの利用者を集めて，新システムの操作研修を行う。
      - 本番環境に移行したプログラムの稼働状況を監視する。
      - システム要件をハードウェアとソフトウェアに割り当てる。
      - ソフトウェア要素をソフトウェアユニットに分割し，各ユニットの機能，インタフェース，データ構造などを詳細に決める。
    a: エ
    exp: |
      ソフトウェア詳細設計では、ソフトウェア構成の決定で定めたソフトウェア要素を、コーディングやテストの単位となるソフトウェアユニットにまで分割し、ユニットごとの機能仕様、インタフェース、データ構造などをコーディング可能なレベルまで詳細化します。あわせてユニットのテストの設計も行います。
    why:
      - 操作研修は、導入・受入れ支援の教育訓練の作業です。
      - 稼働状況の監視は、運用の作業です。
      - 要件をハードウェアとソフトウェアに割り当てるのは、システム設計の作業です。
      - 正解です。ユニットへの分割とユニットの詳細な仕様決定を行います。
    terms:
      - 共通フレーム
  - id: A12-114
    topic: 12-2-6-1
    diff: 2
    q: ソフトウェア設計において，既に作成・検証されているソフトウェア部品を再利用することの効果として，最も適切なものはどれか。
    c:
      - 開発工数を削減でき，実績のある部品を使うことで品質の向上も期待できる。
      - 部品の作成者にライセンスや保守の責任が生じなくなる。
      - 部品の仕様を確認する必要がなくなる。
      - 再利用した部分についてはテストを一切行わなくてよい。
    a: ア
    exp: |
      ソフトウェアの部品化・再利用では、汎用的な機能を部品として作成し、複数のシステムで利用します。新たに作成する量が減るため開発の生産性が向上し、他のシステムで使われて品質が確認された部品を使うことで品質の向上も期待できます。ただし、部品の仕様の確認や、組み込んだ状態でのテストは必要です。
    why:
      - 正解です。工数削減と、実績ある部品による品質向上が期待できます。
      - 再利用しても、ライセンスの条件や部品の保守の扱いは管理する必要があります。
      - 部品を正しく使うために、インタフェースなどの仕様の確認は必要です。
      - 部品単体は検証済みでも、組み込んだ状態での統合テストなどは必要です。
    terms:
      - ソフトウェア再利用
  - id: A12-115
    topic: 12-2-6-2
    diff: 2
    q: 入力画面のインタフェース設計の方針として，最も適切なものはどれか。
    c:
      - 複数の画面でボタンの配置や操作方法をそろえるため，インタフェース設計基準を定めて適用する。
      - 入力可能な値の範囲は画面に表示せず，登録後にまとめて検査する。
      - 入力項目の並び順は，画面ごとに担当者が自由に決める。
      - 入力誤りがあった場合は，原因を示さずに入力内容をすべて消去する。
    a: ア
    exp: |
      インタフェース設計では、利用者が迷わずに操作できるよう、画面構成やボタンの配置、色、メッセージの表現などを統一するインタフェース設計基準を定めます。入力値の上限・下限を検査するリミットチェックなどで誤りをその場で知らせ、誤りの箇所と原因を示すことも重要です。
    why:
      - 正解です。設計基準により画面間の操作性を統一します。
      - 入力時に範囲を示して検査する方が、誤りをすぐに訂正できます。
      - 画面ごとに並び順がばらばらだと、利用者が操作に迷いやすくなります。
      - 原因を示さずに全消去すると、利用者は何を直せばよいか分からず使いにくくなります。
    terms:
      - インタフェース設計
      - リミットチェック
  - id: A12-116
    topic: 12-2-6-2
    diff: 2
    q: 帳票の設計において，罫線や見出しなどの固定部分をあらかじめ用意しておき，データだけを重ねて印刷する方式はどれか。
    c:
      - ターンアラウンド
      - フォームオーバーレイ
      - リミットチェック
      - チェックディジット
    a: イ
    exp: |
      フォームオーバーレイは、帳票の罫線・見出し・ロゴなどの固定的な様式（フォーム）を用意しておき、出力時に可変のデータと重ね合わせて印刷・表示する方式です。帳票設計や画面設計で、様式とデータを分けて扱うことができます。
    why:
      - ターンアラウンドは、出力した帳票を記入後に再び入力に用いる方式などを指し、様式の重ね合わせではありません。
      - 正解です。固定の様式にデータを重ねて出力する方式です。
      - リミットチェックは、入力値が上限・下限の範囲内かを検査する方法です。
      - チェックディジットは、コードの末尾などに検査用の数字を付けて誤りを検出する方法です。
    terms:
      - 帳票設計
      - フォームオーバーレイ
  - id: A12-117
    topic: 12-2-7
    diff: 2
    q: ソフトウェア詳細設計の成果物をレビューする際の評価の観点として，最も適切なものはどれか。
    c:
      - 設計の各要素がソフトウェア要件に対応しており，要件から設計へ，設計から要件へと双方向に追跡できること
      - プログラムの実行速度が測定済みであること
      - 設計書の文書量が前回のプロジェクトより多いこと
      - 設計者本人だけがレビューを行っていること
    a: ア
    exp: |
      ソフトウェア要素の評価及びレビューでは、設計がソフトウェア要件と双方向に追跡可能であること、要件との一貫性、設計方法の適切性、テストや運用・保守の実現可能性などを評価します。レビューには作成者以外の適切な参加者を加え、目的に合ったレビュー方式で行います。
    why:
      - 正解です。要件と設計の双方向の追跡可能性を確認します。
      - 設計段階ではプログラムは完成しておらず、実行速度の測定はレビューの観点になりません。
      - 文書量の多さは品質の評価基準ではありません。
      - 作成者だけでは誤りに気付きにくいため、作成者以外の参加者を加えるのが適切です。
    terms:
      - トレーサビリティ
      - インスペクション
  - id: A12-118
    topic: 12-2-10-1
    diff: 3
    q: バッチ処理のソフトウェア要素を分割する際の考え方として，適切なものはどれか。
    c:
      - 同じファイルを同じ順序で読む処理は，必ず別々のプログラムに分ける。
      - プログラムの数が多くなるほど保守しやすくなるので，できる限り細かく分ける。
      - 日次処理と月次処理のように処理の周期が異なる処理は，別のプログラムに分ける。
      - 処理の周期にかかわらず，すべての処理を一つのプログラムにまとめる。
    a: ウ
    exp: |
      ソフトウェア要素の分割では、処理の周期（日次・月次・随時など）、ファイルの統合・分割、レコード単位の処理の流れなどを考慮します。実行のタイミングが異なる処理は別の要素に分けると運用しやすくなります。一方、同じファイルを同じキー順で処理するものは、まとめることでファイルの読込み回数を減らせる場合があります。
    why:
      - 同じファイルを同じ順序で処理するものは、まとめた方が効率的な場合があります。
      - 細かく分けすぎると、プログラム間の受渡しや管理が増え、かえって保守しにくくなります。
      - 正解です。処理の周期が異なる処理は分けるのが基本です。
      - 周期の異なる処理をまとめると、不要な処理まで実行されたり運用が複雑になったりします。
    terms:
      - バッチ処理
  - id: A12-119
    topic: 12-2-10-2
    diff: 2
    q: プログラムの分割基準のうち，保守性の観点から重視すべきこととして，最も適切なものはどれか。
    c:
      - 処理の順序が同じであれば，無関係な機能も一つのプログラムにまとめる。
      - 変更が予想される機能を独立したプログラムにして，変更の影響が他に及びにくくする。
      - プログラム間で多くのデータを大域変数で共有する。
      - 一つのプログラムにできるだけ多くの機能を詰め込む。
    a: イ
    exp: |
      プログラム分割基準には、分かりやすさ、安全性、開発の生産性、運用性、処理能力、保守性、再利用性などがあります。保守性を高めるには、変更が予想される部分を独立させ、プログラム間の結び付きを弱くして、修正の影響範囲を限定することが重要です。
    why:
      - 無関係な機能をまとめると独立性が低くなり、保守性が下がります。
      - 正解です。変更が予想される部分を独立させると、影響範囲が限定されます。
      - 大域変数での共有はプログラム間の結合を強め、変更の影響が広がります。
      - 多くの機能を詰め込むと、修正時の影響範囲が広くなり保守しにくくなります。
    terms:
      - モジュール結合度
  - id: A12-120
    topic: 12-2-12
    diff: 2
    q: 部品化と再利用を進めるための開発の考え方として，適切なものはどれか。
    c:
      - システムごとにすべての機能を毎回新規に作成する。
      - 部品の内部構造を利用者が理解しなければ使えないようにする。
      - 部品のインタフェースを利用者ごとに変えられるようにする。
      - 機能ごとに独立したソフトウェア部品（コンポーネント）を組み合わせてシステムを構築する。
    a: エ
    exp: |
      コンポーネントウェアは、独立性の高いソフトウェア部品（コンポーネント）を組み合わせてシステムを構築する考え方です。部品はインタフェースを明確に定め、内部の実装を意識せずに使えるようにしておくことで、複数のシステムで再利用しやすくなります。
    why:
      - 毎回新規に作成すると、再利用による生産性・品質向上の効果が得られません。
      - 内部構造を知らなくても使えるようにする（カプセル化する）方が再利用しやすくなります。
      - インタフェースが利用者ごとに異なると、部品として再利用しにくくなります。
      - 正解です。独立した部品を組み合わせて構築するのが部品化・再利用の考え方です。
    terms:
      - コンポーネントウェア
      - ソフトウェア再利用
  - id: A12-121
    topic: 12-3-1
    diff: 1
    q: 共通フレームにおけるソフトウェア構築（実装）のタスクとして，適切なものはどれか。
    c:
      - システム化の目標と対象範囲を決める。
      - ソフトウェアユニットごとに，プログラム言語を用いてコーディングし，テストを行い，結果を文書化する。
      - システムを利用者に納入し，受入れを支援する。
      - システム要件をハードウェアとソフトウェアに割り当てる。
    a: イ
    exp: |
      ソフトウェア構築では、ソフトウェア詳細設計に基づいて、各ソフトウェアユニットをプログラム言語でコーディングし、ユニットのテストを行い、ソースコードとテスト結果を評価・文書化します。
    why:
      - 目標と対象範囲の決定は、システム要件定義のタスクです。
      - 正解です。ユニットのコーディングとテストを行い、文書化します。
      - 納入と受入れの支援は、導入・受入れ支援のタスクです。
      - ハードウェアとソフトウェアへの割当ては、システム設計のタスクです。
    terms:
      - 共通フレーム
      - 単体テスト
  - id: A12-122
    topic: 12-3-2
    diff: 2
    q: 構造化プログラミングの説明として，適切なものはどれか。
    c:
      - 関数の呼出しのたびに，自分自身を再び呼び出すようにプログラムを記述する。
      - プログラムを実行せずに，ソースコードを解析して誤りを検出する。
      - データと手続を一体化したオブジェクトの集まりとしてプログラムを記述する。
      - プログラムの制御構造を，順次・選択・繰返しの3つの基本構造の組合せで記述する。
    a: エ
    exp: |
      構造化プログラミングは、プログラムの制御構造を順次・選択・繰返しの3つの基本構造だけで組み立て、goto 文などによる無秩序な分岐を避ける手法です。処理の流れが上から下へ読めるようになり、理解しやすく、誤りの少ない、保守しやすいプログラムになります。
    why:
      - 自分自身を呼び出すのは、再帰の説明です。
      - 実行せずにソースコードを解析するのは、静的解析です。
      - データと手続を一体化するのは、オブジェクト指向の考え方です。
      - 正解です。順次・選択・繰返しの3構造で記述します。
    terms:
      - 構造化プログラミング
      - オブジェクト指向
      - 再帰
  - id: A12-123
    topic: 12-3-2
    diff: 2
    q: ソフトウェアユニットの作成において，モジュール仕様に基づいてコーディングする際の考え方として，最も適切なものはどれか。
    c:
      - 処理を速くするためであれば，モジュール仕様のインタフェースを独自に変更してよい。
      - コメントは保守の妨げになるので一切記述しない。
      - モジュール仕様にない機能でも，便利だと考えたものは自由に追加する。
      - モジュール仕様で定められた入出力やインタフェースを守り，仕様と異なる点に気付いたら仕様の確認・修正を依頼する。
    a: エ
    exp: |
      ソフトウェアユニットは、ソフトウェア詳細設計で定めたモジュール仕様（機能、入出力、インタフェース、アルゴリズム、データ処理など）に従って作成します。インタフェースを勝手に変更すると、他のユニットとの統合時に不整合が起きます。仕様に問題があれば、設計者に確認して仕様を修正してから実装します。
    why:
      - インタフェースを独自に変えると、呼出し側との不整合が起き統合で問題になります。
      - 適切なコメントは、プログラムの理解や保守を助けます。
      - 仕様にない機能の追加は、要件との追跡可能性を失わせ、テストされない機能を生みます。
      - 正解です。仕様どおりに作成し、問題があれば仕様の側を確認・修正します。
    terms:
      - モジュール分割
  - id: A12-124
    topic: 12-3-3
    diff: 3
    q: ソフトウェアコードの評価基準のうち，「内部一貫性」の確認内容として，適切なものはどれか。
    c:
      - ソフトウェアを運用・保守する体制が整っていること
      - ソースコード内で，同じデータ項目の名前や型，処理の約束事が矛盾なく統一されていること
      - テストケースが要件や設計の内容を網羅していること
      - ソースコードがソフトウェア要件や設計と矛盾していないこと
    a: イ
    exp: |
      ソフトウェアコードの評価基準には、追跡可能性、外部一貫性、内部一貫性、テスト網羅性、コーディング方法及び作業標準の適切性、統合・テストの実現可能性、運用・保守の実現可能性があります。内部一貫性はその成果物の中で矛盾がないこと、外部一貫性は要件や設計など他の成果物との間で矛盾がないことです。
    why:
      - 運用・保守の体制は、運用及び保守の実現可能性に関する観点です。
      - 正解です。成果物の内部で矛盾がないことが内部一貫性です。
      - テストケースが内容を網羅していることは、テスト網羅性です。
      - 要件や設計など他の成果物と矛盾しないことは、外部一貫性です。
    terms:
      - トレーサビリティ
  - id: A12-125
    topic: 12-3-8-1
    diff: 2
    q: ソフトウェアユニットのテストの目的として，最も適切なものはどれか。
    c:
      - 複数のユニットを組み合わせたときのインタフェースの整合性を確認する。
      - 利用者が実際の業務でシステムを使えるかを確認する。
      - システム全体が性能要件を満たしているかを確認する。
      - ユニットがモジュール仕様どおりに動作するかを確認し，欠陥を見つけて取り除く。
    a: エ
    exp: |
      ソフトウェアユニットのテスト（単体テスト）は、個々のユニットがモジュール仕様で定められたとおりに動作するかを確認し、欠陥（バグ）を検出することが目的です。誤動作（障害）が見つかったら障害分析を行って原因となる欠陥を特定し、修正します。
    why:
      - ユニット間のインタフェースの確認は、ソフトウェア統合テストの目的です。
      - 実業務で使えるかの確認は、妥当性確認テストや運用テストで行います。
      - システム全体の性能の確認は、システム統合テストやシステム検証テストで行います。
      - 正解です。ユニットが仕様どおりに動くかを確認し、欠陥を除去します。
    terms:
      - 単体テスト
  - id: A12-126
    topic: 12-3-8-2
    diff: 2
    q: ソフトウェアユニットのテストの手順として，適切なものはどれか。
    c:
      - テスト方法やテスト範囲を決め，テストケースとテストデータ，テスト環境を準備してからテストを実施し，結果を記録する。
      - テストの結果は，不具合が見つかった場合だけ記録する。
      - テストデータは，テストを実施しながらその場で考えて入力する。
      - テスト対象のユニットが完成する前に，すべてのユニットを結合してテストする。
    a: ア
    exp: |
      ユニットテストは、テスト方法論（ホワイトボックス・ブラックボックスなど）とテスト範囲を決め、テストケース、テストデータ、テスト環境（ドライバやスタブを含む）、テスト実施者を準備してから実施します。テストの結果は、合否にかかわらず記録し、評価します。
    why:
      - 正解です。計画・準備をしてから実施し、結果を記録します。
      - 合格した結果も記録しておかないと、テストの実施状況や網羅性を評価できません。
      - その場で考えたデータでは、網羅性が確保できず結果の再現もできません。
      - ユニットのテストは個々のユニットを対象とし、結合してのテストは統合テストで行います。
    terms:
      - 単体テスト
      - テストドライバ
      - スタブ
  - id: A12-127
    topic: 12-4-1
    diff: 2
    q: ソフトウェア統合のタスクとして，適切なものはどれか。
    c:
      - 業務の担当者が本番環境でシステムを試行利用する。
      - 個々のソフトウェアユニットをコーディングする。
      - システム要件を利害関係者と合意して文書化する。
      - ソフトウェアユニットを結合するための統合計画を作成し，テスト要件，テスト手順，テストデータを準備して，統合したソフトウェアをテストする。
    a: エ
    exp: |
      ソフトウェア統合では、ソフトウェアユニットやソフトウェア要素を順に結合してソフトウェアを組み立てる計画を立て、テスト要件・テスト手順・テストデータを準備し、統合した単位ごとにテストを行って結果を評価・文書化します。
    why:
      - 本番環境での試行利用は、妥当性確認テストの手法です。
      - ユニットのコーディングは、ソフトウェア構築のタスクです。
      - システム要件の合意と文書化は、システム要件定義のタスクです。
      - 正解です。統合計画とテストの準備を行い、統合したソフトウェアをテストします。
    terms:
      - 統合テスト
      - テストデータ法
  - id: A12-128
    topic: 12-4-2
    diff: 2
    q: ソフトウェア検証テスト（ソフトウェア適格性確認テスト）の説明として，適切なものはどれか。
    c:
      - ハードウェアとソフトウェアを組み合わせて，システム要件を満たすかを確認する。
      - 個々のソフトウェアユニットの内部の論理を確認する。
      - 統合されたソフトウェアが，ソフトウェア要件を満たしているかどうかを確認する。
      - 利用者の業務の流れに沿って，システムが実際の使用に適しているかを確認する。
    a: ウ
    exp: |
      ソフトウェア検証テストは、統合が完了したソフトウェアについて、ソフトウェア要件で定めた機能・性能などを満たしているかを確認するテストです。テスト結果は監査やレビューの対象となり、ソフトウェア要件との対応を確認できるように記録します。
    why:
      - ハードウェアと組み合わせてシステム要件を確認するのは、システム検証テストです。
      - ユニット内部の論理の確認は、ソフトウェアユニットのテストです。
      - 正解です。統合したソフトウェアがソフトウェア要件を満たすかを確認します。
      - 実際の使用に適しているかの確認は、妥当性確認テストです。
    terms:
      - 妥当性確認テスト
      - システムテスト
  - id: A12-129
    topic: 12-4-6
    diff: 2
    q: ソフトウェア統合及びソフトウェア検証テストの結果を評価する際に，双方向の追跡可能性を確認する目的として，最も適切なものはどれか。
    c:
      - テストで用いたコンピュータの性能を評価するため
      - すべてのソフトウェア要件がテストで確認されており，また，各テストがどの要件に対応するかが明確であることを確かめるため
      - テストの実施にかかった工数を算出するため
      - テスト担当者の作業の速さを比較するため
    a: イ
    exp: |
      テスト結果の評価では、ソフトウェア要件とテストケース・テスト結果の対応を双方向にたどれることを確認します。要件からテストをたどれば確認されていない要件（テスト漏れ）が分かり、テストから要件をたどればそのテストの根拠が分かります。
    why:
      - コンピュータの性能評価は、追跡可能性とは関係がありません。
      - 正解です。要件とテストの対応の漏れや根拠を確認します。
      - 工数の算出はプロジェクト管理の作業で、追跡可能性の目的ではありません。
      - 担当者の作業速度の比較は、テスト結果の評価の目的ではありません。
    terms:
      - トレーサビリティ
      - 統合テスト
  - id: A12-130
    topic: 12-4-7
    diff: 2
    q: システム統合のタスクの説明として，適切なものはどれか。
    c:
      - ハードウェア構成品目，ソフトウェア構成品目及び手作業を組み合わせてシステムを構成し，システム要件を満たすかをテストする。
      - ソフトウェアユニットの内部の処理手順を設計する。
      - プログラムのソースコードを作成する。
      - 稼働を終えたシステムを停止し，データを消去する。
    a: ア
    exp: |
      システム統合では、個別に開発・調達したハードウェア構成品目、ソフトウェア構成品目、及び手作業（人が行う業務手順）を統合してシステムを組み上げ、システム統合テストによって、統合されたシステムがシステム要件を満たしているかを確認します。
    why:
      - 正解です。ハードウェア・ソフトウェア・手作業を統合してテストします。
      - ユニット内部の処理手順の設計は、ソフトウェア詳細設計の作業です。
      - ソースコードの作成は、ソフトウェア構築の作業です。
      - システムの停止とデータ消去は、廃棄の作業です。
    terms:
      - 構成品目
      - 統合テスト
  - id: A12-131
    topic: 12-4-9
    diff: 1
    q: システム統合において，構成品目を段階的に統合するたびに，以前に確認した機能が引き続き正しく動作するかを再確認するテストを何というか。
    c:
      - 並行運用
      - ビッグバンテスト
      - 回帰テスト
      - 段階的詳細化
    a: ウ
    exp: |
      システム統合では、構成品目を統合する順序を決め、段階的に統合していきます。新たな構成品目を統合するたびに、既に確認した機能に悪影響がないかを再テストすることを回帰テスト（リグレッションテスト）といいます。回帰テストを繰り返すことで、統合による不具合を早期に検出できます。
    why:
      - 並行運用は、新旧システムを同時に稼働させる移行方式です。
      - ビッグバンテストは、すべての構成品目を一度に統合してテストする方法で、段階的な再確認とは異なります。
      - 正解です。統合のたびに既存の機能を再確認するテストです。
      - 段階的詳細化は、設計で機能を上位から下位へ詳細化していく考え方です。
    terms:
      - 回帰テスト
      - 統合テスト
  - id: A12-132
    topic: 12-4-10
    diff: 2
    q: システム統合テストを行う際の準備として，最も適切なものはどれか。
    c:
      - テスト計画に基づき，本番に近い構成のテスト環境と，業務を想定したテストデータを用意する。
      - 本番稼働中のシステムの顧客データを，そのままテスト環境で自由に使えるようにする。
      - テスト環境は，開発者のパソコン1台だけで用意する。
      - テストの手順は決めず，担当者がそれぞれの判断で実施する。
    a: ア
    exp: |
      システム統合テストは、テスト計画に従い、ハードウェアやネットワークを含め本番に近い構成のテスト環境と、実際の業務を想定したテストデータを準備して行います。本番の個人情報などを使う場合は、マスキングなどの保護策や利用の承認が必要です。
    why:
      - 正解です。計画に基づき、本番に近い環境と業務を想定したデータを準備します。
      - 本番の顧客データをそのまま使うと、個人情報漏えいなどのリスクがあります。
      - システム全体を統合したテストには、本番に近い構成の環境が必要です。
      - 手順を決めずに実施すると、網羅性や再現性が確保できません。
    terms:
      - システムテスト
      - テストデータ法
  - id: A12-133
    topic: 12-4-12
    diff: 2
    q: システム統合及びシステム検証テストの結果の評価として，適切なものはどれか。
    c:
      - テスト結果がシステム要件を満たしているか，テストの網羅性は十分かを評価し，その結果を文書化する。
      - テストの実施件数だけで，品質の良否を判断する。
      - テスト結果の評価は，次の工程が終わってから行う。
      - テストで不具合が検出されなかった場合は，評価を省略する。
    a: ア
    exp: |
      システム統合及びシステム検証テストの結果は、システム要件との対応（追跡可能性）、テストの網羅性、期待した結果との一致などの観点で評価し、文書化します。不具合が出なかった場合でも、テストが十分に行われたかを評価する必要があります。
    why:
      - 正解です。要件の充足と網羅性を評価して文書化します。
      - 実施件数だけでは、要件をどれだけ確認したかが分かりません。
      - 評価は次の工程に進む前に行い、問題があれば対処する必要があります。
      - 不具合が出なくても、テストの網羅性が不足していれば品質は保証できません。
    terms:
      - システムテスト
  - id: A12-134
    topic: 12-5-1
    diff: 2
    q: システム及び／又はソフトウェアの導入のタスクとして，適切なものはどれか。
    c:
      - ソフトウェアユニットのテストを行う。
      - システム要件に基づいてシステムの構成を決める。
      - 役目を終えたシステムを停止する。
      - 導入計画を作成し，それに従ってシステムを本番の稼働環境に設置して，利用できる状態にする。
    a: エ
    exp: |
      導入では、導入の手順・体制・スケジュール・資源などを定めた導入計画を作成し、計画に従ってシステムやソフトウェアを本番の稼働環境に設置して、データベースの初期設定や移行などを行い、利用できる状態にします。導入後の利用者支援も行います。
    why:
      - ユニットのテストは、ソフトウェア構築のタスクです。
      - システムの構成の決定は、システム設計のタスクです。
      - システムの停止は、廃棄のタスクです。
      - 正解です。導入計画に従って本番環境に設置します。
    terms:
      - システム移行
  - id: A12-135
    topic: 12-5-4-2
    diff: 2
    q: システムの導入を実施する際の体制として，最も適切なものはどれか。
    c:
      - 導入手順は文書化せず，担当者の経験に任せる。
      - 開発部門だけでなく，利用部門とシステム運用部門も参加して導入手順を確認し，役割分担を明確にする。
      - 導入作業は開発部門が単独で行い，運用部門への引継ぎは稼働後に検討する。
      - 利用部門には導入が完了するまで一切知らせない。
    a: イ
    exp: |
      導入の実施では、導入手順と導入体制を定め、開発部門、利用部門、システム運用部門が協力して作業します。利用部門は業務の切替えやデータの確認を、運用部門は稼働後の運用を担うため、導入の段階から参加して役割を明確にしておくことが重要です。仮想環境を用いて導入手順を事前に検証することもあります。
    why:
      - 手順を文書化しないと、作業漏れや誤りが起きやすく、再実施もできません。
      - 正解です。関係部門が参加し、役割分担を明確にして導入します。
      - 運用部門への引継ぎを後回しにすると、稼働直後の運用に支障が出ます。
      - 利用部門が知らないと、業務の切替えやデータ確認の準備ができません。
    terms:
      - システム移行
  - id: A12-136
    topic: 12-5-4-3
    diff: 1
    q: システム導入後の利用者支援として，適切なものはどれか。
    c:
      - 利用者への説明は，ソースコードを配布することで代える。
      - 操作手順をまとめた教育訓練資料を用意し，問合せに対応する窓口を設ける。
      - 利用者からの問合せには，開発が終了したので対応しない。
      - 操作方法は利用者が自分で試行錯誤して覚えるようにする。
    a: イ
    exp: |
      導入時の利用者支援では、利用者が新しいシステムを円滑に使えるよう、操作マニュアルや教育訓練資料を用意し、研修を行ったり、問合せ窓口を設けたりします。導入直後は問合せが多いため、支援体制を整えておくことが重要です。
    why:
      - ソースコードは利用者向けの説明資料ではありません。
      - 正解です。教育訓練資料と問合せ窓口で利用者を支援します。
      - 導入直後こそ問合せが多く、対応しないと業務に支障が出ます。
      - 試行錯誤に任せると、誤操作や習得の遅れが生じます。
    terms:
      - 教育訓練
  - id: A12-137
    topic: 12-5-5-2
    diff: 2
    q: 開発を委託したシステムの納入と受入れにおいて，発注者側が行うこととして，最も適切なものはどれか。
    c:
      - 納入された成果物は，テストをせずにそのまま本番稼働させる。
      - 受入れ体制を整え，あらかじめ定めた受入れ基準に基づいて，要件と受入れテストの対応を確認しながら受入れテストを行う。
      - 受入れ基準は，受入れテストの結果を見てから決める。
      - 受入れテストは，開発を担当した受託者だけに任せる。
    a: イ
    exp: |
      納入と受入れでは、発注者が受入れ体制を整え、契約や要件定義に基づいてあらかじめ定めた受入れ基準に従い、受入れテストを行って成果物が要求を満たすかを判断します。要件と受入れテストの対応（双方向の追跡可能性）を確認し、要件の確認漏れがないようにします。
    why:
      - テストをせずに稼働させると、要求を満たさない場合に業務に影響が出ます。
      - 正解です。受入れ体制と事前の受入れ基準に基づき、要件との対応を確認してテストします。
      - 基準を後から決めると、合否の判断が恣意的になり紛争の原因にもなります。
      - 受入れテストは発注者（利用者）が主体となって行うものです。
    terms:
      - 受入れテスト
      - 検収
      - トレーサビリティ
  - id: A12-138
    topic: 12-5-5-3
    diff: 1
    q: 多数の拠点の利用者に新システムの操作を習得させる教育訓練の方法として，Web ブラウザを用いて各自の都合のよい時間に学習でき，学習の進捗も管理できるものはどれか。
    c:
      - OJT
      - ブレーンストーミング
      - ロールプレイング
      - WBT（Web Based Training）
    a: エ
    exp: |
      WBT（Web Based Training）は、Web ブラウザを通じて教材を配信する e-ラーニングの形態です。利用者は場所や時間を選ばずに学習でき、管理者は受講状況や理解度を把握できます。多数の拠点に分散した利用者の教育訓練に適しています。
    why:
      - OJT は、職場で実際の業務を通じて指導する方法です。
      - ブレーンストーミングは、自由に意見を出し合ってアイデアを発想する技法です。
      - ロールプレイングは、役割を演じて対応を練習する方法です。
      - 正解です。Web で教材を配信し、進捗管理もできる教育訓練の方法です。
    terms:
      - 教育訓練
      - e-ラーニング
  - id: A12-139
    topic: 12-5-6-2
    diff: 3
    q: 妥当性確認テストで不具合が検出された場合の対応として，最も適切なものはどれか。
    c:
      - 利用者に運用で回避してもらい，不具合は記録しない。
      - 不具合の件数が少なければ，対応せずに稼働させる。
      - 不具合の根本原因を分析して是正処置と欠陥修正を行い，学んだ教訓を記録して以後の開発に生かす。
      - 不具合の現象だけを修正し，原因の分析や記録は行わない。
    a: ウ
    exp: |
      妥当性確認テストの結果の管理では、検出した不具合について根本原因を明らかにし、是正処置や欠陥修正、改善作業を行います。修正の内容は要件やテストとの対応（双方向の追跡可能性）を保ったまま管理し、学んだ教訓を記録して、同様の問題の再発防止に役立てます。
    why:
      - 記録しないと、不具合の管理や再発防止ができません。
      - 件数が少なくても、影響の大きい不具合が残っている可能性があります。
      - 正解です。根本原因を分析して是正し、教訓を記録します。
      - 現象だけを直すと、同じ原因による不具合が再発するおそれがあります。
    terms:
      - 妥当性確認テスト
      - 根本原因
      - 是正処置
  - id: A12-140
    topic: 12-5-6-3
    diff: 2
    q: 妥当性確認テストの手法として，利用者が実際の業務の環境でソフトウェアを一定期間使い，意図した用途に適しているかを評価するものはどれか。
    c:
      - ソフトウェアの試行利用
      - コードインスペクション
      - 単体テスト
      - 負荷テスト
    a: ア
    exp: |
      妥当性確認テストは、システムやソフトウェアが利用者の意図した用途や環境で要求を満たすかを確認するテストです。その手法として、利用者が実際の環境でソフトウェアを試行的に使う試行利用や、使いやすさを評価する使用性テストなどがあります。
    why:
      - 正解です。実際の業務環境で試しに使い、用途への適合を評価します。
      - コードインスペクションは、ソースコードを会議形式で検査するレビュー手法です。
      - 単体テストは、個々のユニットが仕様どおりに動くかを開発者が確認するテストです。
      - 負荷テストは、大量のデータや処理を与えて性能限界などを確認するテストです。
    terms:
      - 妥当性確認テスト
      - インスペクション
      - 負荷テスト
  - id: A12-141
    topic: 12-5-6-3
    diff: 2
    q: 妥当性確認テストとして行う使用性テストの説明として，適切なものはどれか。
    c:
      - 修正によって既存の機能に影響がないかを確認する。
      - プログラムの命令がすべて実行されたかを確認する。
      - 想定される利用者に実際に操作してもらい，操作のしやすさや分かりやすさを評価する。
      - 大量のトランザクションを発生させ，応答時間を測定する。
    a: ウ
    exp: |
      使用性テスト（ユーザビリティテスト）は、想定される利用者に実際の作業を行ってもらい、その様子を観察したり意見を聞いたりして、操作のしやすさ、分かりやすさ、満足度などを評価するテストです。利用者の視点での適合性を確認するため、妥当性確認テストの手法として用いられます。
    why:
      - 既存機能への影響の確認は、回帰テストです。
      - 命令がすべて実行されたかの確認は、ホワイトボックステストの命令網羅です。
      - 正解です。利用者に操作してもらい、使いやすさを評価します。
      - 応答時間の測定は、性能テストや負荷テストです。
    terms:
      - ユーザビリティ
      - 妥当性確認テスト
      - 回帰テスト
  - id: A12-142
    topic: 12-6-2
    diff: 2
    q: 稼働中のシステムを廃棄する計画を立てる際に考慮すべきこととして，最も適切なものはどれか。
    c:
      - 廃棄によって組織の業務や運用の完整性が損なわれないよう，代替手段の準備や必要なデータの保存・移行，利用者への通知を計画する。
      - 廃棄するシステムのデータは，保存期間の要件にかかわらずすべて直ちに消去する。
      - 記憶媒体は，データを消去せずにそのまま売却する。
      - 利用者には，システムを停止した後で通知する。
    a: ア
    exp: |
      廃棄のタスクでは、システムやソフトウェアの稼働を終了させても組織の運用の完整性（integrity）が保たれるよう、廃棄計画を立てます。代替するシステムへの切替え、法令などで保存が必要なデータの保存・移行、利用者への事前通知、記憶媒体のデータ消去などを計画し実施します。
    why:
      - 正解です。運用の完整性を保つよう、代替手段やデータの扱い、通知を計画します。
      - 法令などで保存が必要なデータもあるため、保存期間の要件を確認する必要があります。
      - データを消去せずに売却すると、情報漏えいのおそれがあります。
      - 停止後の通知では、利用者が業務の準備をできません。事前に通知します。
    terms:
      - システムの廃棄
  - id: A12-143
    topic: 12-6-4-1
    diff: 2
    q: 保守プロセスを開始する準備として，保守の担当者が行うこととして，適切なものはどれか。
    c:
      - 修正依頼は，口頭で受け付け，記録しないで対応する。
      - 開発プロセスから設計書やソースコードなど保守に必要な成果物を引き継ぎ，保守の計画と手続，問題管理の手続を確立する。
      - 開発時の成果物は不要なので，すべて破棄する。
      - 保守の手続は，最初の問題が報告されてから考える。
    a: イ
    exp: |
      保守プロセス開始の準備では、開発プロセスから保守に必要な成果物（設計書、ソースコード、テスト資料など）を引き継ぎ、保守の計画及び手続を作成し、問題報告や修正依頼を受け付けて追跡する問題管理の手続を確立し、保守のための文書を作成します。
    why:
      - 記録しないと、対応の状況が追跡できず、対応漏れが起きます。
      - 正解です。成果物を引き継ぎ、計画・手続と問題管理の手続を確立します。
      - 開発時の成果物は、修正の分析や実施に不可欠です。
      - 手続を事前に決めておかないと、問題が起きたときに適切に対応できません。
    terms:
      - 問題管理
  - id: A12-144
    topic: 12-6-4-2
    diff: 2
    q: 保守の手順のうち「問題把握及び修正の分析」で行う作業として，適切なものはどれか。
    c:
      - 修正したプログラムを本番環境に適用する。
      - 問題報告や修正依頼の内容を分析し，問題を再現・検証したうえで，修正の実施方法の選択肢を用意する。
      - 開発プロセスから成果物を引き継ぐ。
      - 修正後のシステムについて，依頼者の受入れを得る。
    a: イ
    exp: |
      問題把握及び修正の分析では、問題報告や修正依頼の種類（是正・改良など）、範囲、影響を分析し、問題を再現・検証します。そのうえで修正実施の選択肢を用意し、選択した方法について承認を得てから修正を実施します。
    why:
      - 修正の本番適用は、修正の実施以降の作業です。
      - 正解です。依頼を分析し、問題を再現・検証して修正の選択肢を用意します。
      - 成果物の引継ぎは、保守プロセス開始の準備の作業です。
      - 依頼者の受入れは、保守レビュー及び受入れの作業です。
    terms:
      - 是正保守
  - id: A12-145
    topic: 12-6-4-3
    diff: 2
    q: 保守の手順のうち「修正の実施」の説明として，適切なものはどれか。
    c:
      - 修正の対象となるプログラムや関連する文書を特定し，機能追加・性能改良・問題の是正などの修正を行って，修正部分と影響範囲をテストする。
      - プログラムだけを修正し，設計書などの関連文書は更新しない。
      - 修正依頼の内容を確認せずに，すぐにソースコードを変更する。
      - 修正した部分だけをテストし，影響を受ける可能性のある既存機能は確認しない。
    a: ア
    exp: |
      修正の実施では、修正するシステムやソフトウェア、関連文書を決定し、機能追加、性能改良、問題の是正などの修正を行います。修正部分のテストに加え、変更が既存の機能に悪影響を与えていないかを回帰テストで確認し、関連文書も更新します。
    why:
      - 正解です。対象を特定して修正し、修正部分と影響範囲をテストします。
      - 関連文書を更新しないと、プログラムと文書が食い違い、以後の保守が困難になります。
      - 修正内容の分析と承認を経ずに変更すると、誤った修正や影響の見落としが起きます。
      - 既存機能への影響を回帰テストで確認しないと、新たな不具合を見逃します。
    terms:
      - 回帰テスト
      - 完全化保守
  - id: A12-146
    topic: 12-6-4-4
    diff: 2
    q: 保守の手順のうち「保守レビュー及び／又は受入れ」で行うこととして，適切なものはどれか。
    c:
      - 問題報告を受け付けて，問題管理の台帳に登録する。
      - 修正の実施方法の選択肢を用意する。
      - 修正されたシステムが依頼どおりに修正され，完全性が保たれているかをレビューし，修正の完了について承認を得る。
      - 開発プロセスから成果物を引き継ぐ。
    a: ウ
    exp: |
      保守レビュー及び受入れでは、修正を依頼した組織などとともにレビューを行い、修正されたシステムが依頼どおりで完全性が保たれていることを確認し、修正の完了について承認（受入れ）を得ます。
    why:
      - 問題報告の受付と登録は、問題管理の手続に従って保守の初めに行う作業です。
      - 修正の選択肢の用意は、問題把握及び修正の分析の作業です。
      - 正解です。修正の結果をレビューし、完了の承認を得ます。
      - 成果物の引継ぎは、保守プロセス開始の準備の作業です。
    terms:
      - 問題管理
  - id: A12-147
    topic: 12-6-4-5
    diff: 2
    q: 保守で同様の障害が繰り返し発生している場合の再発防止策の実施として，最も適切なものはどれか。
    c:
      - 障害の根本原因を分析して原因を取り除く是正処置を行い，必要に応じて開発や保守の手順も見直す。
      - 障害が起きるたびに，システムを再起動して復旧させる対応を続ける。
      - 障害の記録を削除して，発生件数を減らす。
      - 障害が発生した機能の利用を，理由を示さずに禁止する。
    a: ア
    exp: |
      再発防止策の実施では、発生した問題の根本原因を分析し、その原因を除去する是正処置を行います。原因が作業手順やレビューの不備にある場合は、プロセス自体を改善して、同じ種類の問題が再び起きないようにします。
    why:
      - 正解です。根本原因を取り除き、必要なら手順も改善します。
      - 再起動による復旧は暫定的な対処で、原因が残るため再発します。
      - 記録を削除しても問題は解決せず、分析もできなくなります。
      - 理由なく利用を禁止しても、根本原因は解決されず業務にも支障が出ます。
    terms:
      - 是正処置
      - 根本原因
