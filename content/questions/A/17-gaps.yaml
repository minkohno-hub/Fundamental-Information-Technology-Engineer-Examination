category: '17'
reviewed:
  at: '2026-10-21'
  method: 作成後の逐問レビュー（情報システム戦略の策定手順、モデル、品質統制、デジタルリテラシーの説明をシラバスVer.9.2の用語例と照合）
questions:
  - id: A17-028
    topic: 17-1-1-2
    diff: 2
    q: 情報システム戦略を策定する手順において，最初に行うべきことはどれか。
    c:
      - 経営戦略や事業戦略を確認し，情報システム戦略の目的と方針を明確にする。
      - 個別システムのプログラム設計を行う。
      - 導入するハードウェアの機種を決定する。
      - 開発ベンダからの提案書を評価する。
    a: ア
    exp: |
      情報システム戦略は経営戦略を実現するための戦略です。策定にあたっては、まず経営戦略・事業戦略を確認して目的と方針を明確にし、現状の業務と情報システムを調査・分析したうえで、あるべき姿（業務モデルや情報システムモデル）を描き、全体システム化計画や投資計画にまとめます。
    why:
      - 正解です。経営戦略との整合が出発点です。
      - プログラム設計は個別システムの開発工程で行う作業です。
      - 機種の決定は個別の計画や調達の段階で行います。
      - 提案書の評価は調達の段階で行う作業です。
    terms:
      - 提案書
  - id: A17-029
    topic: 17-1-1-7
    diff: 2
    q: 情報システム戦略で作成するモデルのうち，業務モデルの説明として，適切なものはどれか。
    c:
      - 従業員の給与体系を表したもの
      - 企業が顧客に価値を提供し，収益を上げる事業の仕組みを表したもの
      - 情報システムを構成するハードウェアの配置を表したもの
      - 業務の機能や流れ，扱う情報の関係を，DFD や E-R 図などを用いて体系的に表したもの
    a: エ
    exp: |
      情報システム戦略では、収益を上げる事業の仕組みであるビジネスモデルを基に、業務の機能・流れや情報の関係を表した業務モデルを作成し、さらに業務モデルを支える情報システムの機能や構成を表した情報システムモデルを作成します。業務モデルの表記には DFD、E-R 図、BPMN などが用いられます。
    why:
      - 給与体系は業務モデルの対象ではありません。
      - これはビジネスモデルの説明です。
      - これは情報システムモデルの一部（技術的な構成）に当たります。
      - 正解です。業務の機能や流れ、情報の関係を表したものです。
    terms:
      - ビジネスモデル
      - DFD
  - id: A17-030
    topic: 17-1-5
    diff: 3
    q: 情報システム戦略の実行における品質統制の説明として，最も適切なものはどれか。
    c:
      - 個々のプログラムのソースコードの記述ルールを決める。
      - 品質統制フレームワークに基づき，情報システムの品質を確保するための管理プロセスを定めて，その実施状況を監視・評価し，必要に応じて是正する。
      - 開発ベンダに品質の責任をすべて委ね，発注者は関与しない。
      - 品質の問題が発生してから，その都度担当者の判断で対処する。
    a: イ
    exp: |
      品質統制は、情報システム戦略に基づいて構築・運用される情報システムの品質を組織として確保するための仕組みです。品質統制フレームワークに沿って品質の方針や基準、管理プロセス（計画・実施・監視・評価・改善）を定め、それが遵守されているかを監視・評価し、問題があれば是正します。
    why:
      - コーディング規約は個別の開発工程での品質管理の一部にすぎません。
      - 正解です。管理プロセスを定めて監視・評価・是正します。
      - 発注者は外部委託しても品質に対する責任を負い、統制する必要があります。
      - 問題が起きてから場当たり的に対処するのは統制とはいえません。
    terms:
      - ITガバナンス
      - COBIT
  - id: A17-031
    topic: 17-4-1-2
    diff: 1
    q: デジタルリテラシーに含まれるメディアリテラシーの説明として，適切なものはどれか。
    c:
      - メディアが伝える情報をうのみにせず，主体的に読み解いて真偽や意図を判断し，活用する能力
      - コンピュータの部品を組み立てて修理する能力
      - プログラムを高速に実行するための最適化を行う能力
      - 外国語の文書を翻訳する能力
    a: ア
    exp: |
      デジタルリテラシーは、デジタル技術やデータを活用して課題を解決する能力で、IT を理解して使いこなす IT リテラシー、情報を批判的に読み解き適切に発信するメディアリテラシー、情報セキュリティへの意識などを含みます。組織では研修などを通じてこれらを高め、システムの活用を促進します。
    why:
      - 正解です。情報を主体的・批判的に読み解く能力です。
      - これはハードウェア保守の技能で、メディアリテラシーではありません。
      - これはプログラミングの技能です。
      - これは語学の能力です。
    terms:
      - メディアリテラシー
      - ITリテラシー
