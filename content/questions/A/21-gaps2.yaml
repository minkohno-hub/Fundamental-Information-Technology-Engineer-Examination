reviewed: { at: '2026-10-21', method: '作成後の逐問レビュー（AI 社会原則の考え方，XBRL・電子入札・HEMS など各用語の定義をシラバスVer.9.2の用語例と照合）' }
questions:
  - id: A21-031
    topic: 21-1-4-1
    diff: 2
    q: 「人間中心の AI 社会原則」における，公平性，説明責任及び透明性の原則の考え方として，最も適切なものはどれか。
    c:
      - AI を利用した意思決定によって，人々が出身や性別などを理由に不当に差別されないようにし，利用者が意思決定の過程や結果について納得できる説明を受けられるようにする。
      - AI の判断の誤りで生じた損害は，AI に責任があるとして，開発者も利用者も責任を負わないものとする。
      - AI の学習に用いるアルゴリズムや学習データの内容は，企業秘密のため一切開示しないものとする。
      - AI の利用は人間の作業を全て置き換えることを目的とし，人間が判断に関与しない仕組みを目指す。
    a: ア
    exp: |
      「人間中心の AI 社会原則」は，AI を社会に受け入れていくための基本原則を示したもので，人間中心の原則，公平性，説明責任及び透明性の原則などを掲げています。AI の利用によって人々が不当な差別を受けないようにし，AI を利用した意思決定について，利用者が納得できるよう適切な説明を行う責任を果たすことが求められます。AI 自体に責任を負わせて人間が責任を免れることはできません。
    why:
      - 正解です。不当な差別の防止と，意思決定に関する説明責任・透明性の確保が公平性，説明責任及び透明性の原則です。
      - AI は法的な責任主体ではなく，開発者や利用者が責任と説明の義務を負うのが基本です。
      - 説明責任と透明性の原則は，利用者が納得できるよう適切な情報の提供や説明を求めるもので，一切開示しないとする考え方とは逆です。
      - 人間中心の原則は，AI が人間の能力を拡張するために使われることを重視しており，人間の関与をなくすことを目指すものではありません。
    terms: [人間中心のAI社会原則, 説明責任]

  - id: A21-032
    topic: 21-1-4-2
    diff: 2
    q: AI の分類における特化型 AI の説明として，適切なものはどれか。
    c:
      - 囲碁や画像認識など，特定の領域やタスクに限って能力を発揮するように作られた AI
      - 人間と同じように，あらゆる領域の課題を自ら学習して解決できる AI
      - 学習データを必要とせず，ルールだけを与えれば自動的に動作する AI
      - 人間の知能を超えた状態の AI が，自らより高性能な AI を設計し続ける状態
    a: ア
    exp: |
      特化型 AI（狭い AI）は，囲碁，画像認識，音声認識，翻訳といった特定の領域・タスクで高い性能を出すように設計された AI で，現在実用化されている AI の大半はこれに当たります。人間のようにあらゆる領域に対応できる AI は汎用 AI（汎用人工知能）と呼ばれ，実現の難しさとしてフレーム問題などが挙げられます。
    why:
      - 正解です。特定の領域・タスクに限定して能力を発揮するのが特化型 AI です。
      - あらゆる領域の課題を扱える AI は汎用 AI の説明です。
      - 機械学習を用いる AI は学習データを必要とします。ルールだけで動作する AI は特化型 AI の定義ではありません。
      - 人間の知能を超えた AI が自己改良を続ける状態は，シンギュラリティ（技術的特異点）の考え方です。
    terms: [特化型AI, 汎用AI]

  - id: A21-033
    topic: 21-2-1
    diff: 1
    q: エンジニアリングシステムの目的として，最も適切なものはどれか。
    c:
      - 製品の設計，製造，生産管理などの技術的な業務に情報技術を活用して，開発期間の短縮，品質の向上，コストの削減を図る。
      - 顧客の購買履歴を分析して，個別の顧客に合わせた販売促進を行う。
      - 社内の会計処理を自動化して，決算を早期に確定する。
      - 従業員の勤怠情報を一元管理して，給与計算を正確に行う。
    a: ア
    exp: |
      エンジニアリングシステムは，製品の設計（CAD），製造（CAM），生産管理，設計情報の管理などの技術業務を情報技術で支援・統合し，開発期間の短縮，品質の向上，コストの削減を目指すシステムの総称です。製造業では，設計から製造までの情報を連携させる CIM や，製品情報を一元管理する PDM などが代表例です。
    why:
      - 正解です。設計・製造などの技術業務を IT で効率化して，期間・品質・コストを改善します。
      - 顧客の購買履歴の分析による販売促進は，CRM などのマーケティング系の仕組みの目的です。
      - 会計処理の自動化と決算の早期化は，会計システムの目的です。
      - 勤怠管理と給与計算は，人事・給与システムの目的です。
    terms: [エンジニアリングシステム, CAD]

  - id: A21-034
    topic: 21-3-1-1
    diff: 2
    q: 国や地方公共団体の入札における電子入札の特徴として，適切なものはどれか。
    c:
      - 入札の公告から開札までの手続をネットワーク上で行うことで，事業者が出向く負担を減らし，手続の透明性と公平性を高める。
      - 入札金額を事業者同士が事前に調整できるように，参加者の金額を随時公開する。
      - 入札は電子化されるため，入札参加者の資格審査は不要となる。
      - 落札者の決定は，応札者が増えるため，価格だけで機械的に行うことが法律で義務付けられている。
    a: ア
    exp: |
      電子入札は，入札公告，入札書の提出，開札，落札者の決定といった入札手続をインターネットなどのネットワーク上で行う仕組みです。事業者が入札会場に出向く必要がなくなり，事務の効率化，手続の透明性と公平性の向上，談合の防止などが期待できます。参加資格の審査や電子証明書による本人確認は引き続き必要です。
    why:
      - 正解です。入札手続をネットワーク上で行い，事業者の負担を減らして透明性・公平性を高めます。
      - 入札金額を事前に公開すると，談合を助長するため不適切です。電子入札は開札時まで金額を秘匿します。
      - 電子化しても参加資格の審査は必要であり，電子証明書で本人確認も行います。
      - 落札者の決定方法は案件ごとに定められ，総合評価方式など価格以外を考慮する方式もあります。
    terms: [電子入札, 電子商取引]

  - id: A21-035
    topic: 21-3-2-2
    diff: 2
    q: XBRL（eXtensible Business Reporting Language）の説明として，適切なものはどれか。
    c:
      - 財務諸表などの財務情報を，XML を用いて統一的な形式で表現し，企業間や機関との間で交換・再利用しやすくするための言語
      - 製品の形状データを，CAD ソフトウェアの種類に依存せず表現して交換するための国際標準
      - 銀行間で，口座振替などのデータを交換するための通信手順
      - 発注者と受注者が取引条件を取り決めるために交わす基本取引契約書の標準様式
    a: ア
    exp: |
      XBRL は，財務諸表や有価証券報告書などの財務報告情報を XML で記述するための言語です。項目の意味をタグで定義するため，企業や監督機関，投資家などの間でデータを交換し，分析に再利用しやすくなります。日本でも金融商品取引法に基づく開示書類の電子提出（EDINET）などで使われています。製品モデルの交換は STEP，EDI の取引条件の取決めは基本取引規約などが対象です。
    why:
      - 正解です。財務情報を XML で統一的に表現する言語です。
      - 製品モデルデータの表現と交換に関する標準は STEP です。
      - 銀行間のデータ交換手順は，全国銀行協会手順などが該当します。
      - 取引条件の取決めは基本取引規約などの EDI の取決めに該当し，XBRL は財務情報の記述言語です。
    terms: [XBRL, XML-EDI]

  - id: A21-036
    topic: 21-4-2-1
    diff: 1
    q: ユビキタスコンピューティングの説明として，適切なものはどれか。
    c:
      - コンピュータやネットワークが生活環境のあらゆる場所に組み込まれ，利用者がそれを意識せずに，いつでもどこでも利用できる環境
      - 大型のコンピュータに処理を集中させ，利用者は端末から時間を分割して利用する環境
      - 物理的なサーバを持たず，必要なときに仮想サーバを借りて利用する契約形態
      - 多数のコンピュータが分担して，一つの大規模な計算を行う技術
    a: ア
    exp: |
      ユビキタスコンピューティングは，コンピュータやネットワークが家電，衣類，建物などの身の回りに溶け込み，利用者が特に意識しなくても，いつでもどこでも情報サービスを受けられる環境や考え方です。情報家電や IoT，センサーネットワークなどが普及する前提となる概念です。
    why:
      - 正解です。あらゆる場所に溶け込んだ，いつでもどこでも使える環境を指します。
      - 大型機に処理を集中し，端末から時間を分割して利用するのは，タイムシェアリングシステムです。
      - 必要なときに仮想サーバを借りて利用する形態は，クラウドコンピューティングです。
      - 多数のコンピュータで大規模計算を分担するのは，グリッドコンピューティングなどです。
    terms: [ユビキタスコンピューティング, 情報家電]

  - id: A21-037
    topic: 21-4-2-2
    diff: 2
    q: HEMS（Home Energy Management System）の説明として，適切なものはどれか。
    c:
      - 家庭内の電力使用量を計測して可視化し，家電や設備を制御することで，省エネルギーを支援するシステム
      - 工場の生産設備の稼働状況を監視し，製造工程を最適化するシステム
      - 大規模なビルの空調や照明を一括して制御し，ビル全体のエネルギーを管理するシステム
      - 電力会社が発電所から需要家まで電力を送る送電網を監視するシステム
    a: ア
    exp: |
      HEMS は，家庭の電力使用量を計測して画面などで見える化し，エアコン，照明，給湯器，太陽光発電，蓄電池などを制御して，省エネルギーや電力の効率的な利用を支援するシステムです。ホームネットワークでこれらの機器を接続し，スマートフォンから操作や確認ができるものもあります。ビル向けは BEMS，工場向けは FEMS と呼ばれます。
    why:
      - 正解です。家庭内のエネルギー使用の可視化と機器の制御で省エネルギーを支援します。
      - 工場の生産設備のエネルギー管理は FEMS に当たります。
      - 大規模なビルのエネルギー管理は BEMS に当たります。
      - 送電網の監視は電力会社側の系統管理であり，家庭向けの HEMS ではありません。
    terms: [HEMS, ホームネットワーク]

  - id: A21-038
    topic: 21-5-1-2
    diff: 2
    q: 医療機器の一つである患者モニタリング装置の機能として，適切なものはどれか。
    c:
      - 患者の心拍数，血圧，血中酸素飽和度などの生体情報を継続的に測定して表示し，異常を検知したときにはアラームで医療従事者に知らせる。
      - 患者の電子カルテの内容を自動で書き換え，診断を確定する。
      - 患者の体内に挿入して，医師の操作なしに手術を完了する。
      - 患者の体温を測定するのみで，測定値は記録せず表示もしない。
    a: ア
    exp: |
      患者モニタリング装置（生体情報モニタ）は，心電図，心拍数，血圧，呼吸数，血中酸素飽和度（SpO2），体温などを継続的に測定して表示し，設定した範囲を外れたときにアラームで知らせる装置です。集中治療室や手術室，病棟で使われ，ネットワークで接続してナースステーションのセントラルモニタに情報を集約するものもあります。診断の確定は医師が行います。
    why:
      - 正解です。生体情報の継続的な測定と表示，異常時のアラーム通知が主な機能です。
      - 診断の確定は医師の役割であり，モニタリング装置が電子カルテを書き換えて診断することはありません。
      - 医師の操作なしに手術を完了する装置は一般的な患者モニタリング装置の機能ではありません。
      - 測定値を表示して記録・通知するのが機能であり，表示も記録もしないのでは目的を果たしません。
    terms: [患者モニタリング装置, 医療機器]
