category: '10'
batch: H2
reviewed:
  at: '2026-10-30'
  method: 独立レビュー担当が解答を伏せて全問を自力解答し、正答の一意性・誤答の検証と既存問題との重複確認を実施。A10-516・518 は引用付き再確認で、実文の選択肢と各誤答解説の整合も検証済み
questions:
  - id: A10-514
    topic: 10-3-1-5
    diff: 3
    scope: 10-3-1-5 DHCP のアドレスリースと更新手続き。リース期間の半分で更新を試み、失敗しても期限までは使い続け、期限切れでアドレスを失う動作の判断
    prereq: DHCP のアドレスにはリース期間があり、クライアントは期間の半分が過ぎた時点でサーバへ更新を要求すること、更新できないまま期限を迎えるとアドレスは使用できなくなること
    hard: 「更新の要求に失敗したら直ちに通信できなくなる」という誤解を避け、期限までの猶予と、期限切れ後の動作（新しい取得手続きの開始）を切り分ける必要がある。
    q: |
      DHCP でリース期間 24 時間の IP アドレスを取得したクライアントがある。取得から 12 時間後に更新を要求したが、サーバから応答がなかった。この後のクライアントの動作として、正しいものはどれか。
    c:
      - 更新できなかった場合、リース期間は自動的に 24 時間延長される
      - 更新の応答がない時点で、直ちにアドレスの使用をやめる
      - サーバの応答がない場合、クライアントが自分で新しいアドレスを決めて使い続ける
      - リース期限までは現在のアドレスを使い続け、期限までに更新できなければ、アドレスの使用をやめて取得の手続きをやり直す
    a: エ
    exp: |
      DHCP のリースでは、クライアントはリース期間の半分 （本件では 12 時間）が過ぎた時点で更新を要求します。応答がない場合でも、リース期限までは現在のアドレスを使い続けることができ、その間も更新の要求を繰り返します。ただし、期限までに更新できなければ、そのアドレスは使えなくなり、クライアントはアドレス取得の手続き （発見から始まる一連のやり取り）を最初からやり直します。アドレスをクライアントが勝手に決めたり、期間が自動で延びたりすることはありません。
    why:
      - リース期間はサーバが決めるものであり、応答がないことで自動的に延長されることはありません。
      - 更新の失敗は即時の使用停止ではなく、期限まで猶予があります。
      - アドレスの割当てはサーバの役割であり、クライアントが独自に決めると重複の危険があります。
      - 正解です。期限までは使用でき、期限切れで初めて取得をやり直すのがリースの動作です。
    know: DHCP リースの要点は「半分の時点で更新を試みる」「期限までは使える」「期限切れで再取得」という時間の流れ。更新の失敗と期限切れを混同しないことが、この仕組みの理解の鍵である。
    terms:
      - DHCP
      - リース
    verify:
      manual: DHCP のリース更新の流れ（半分での更新要求、失敗時の継続使用と再試行、期限切れでの再取得）と各選択肢を照合し、アだけが動作に一致することを確認した。
  - id: A10-515
    topic: 10-3-1-6
    diff: 3
    scope: 10-3-1-6 DNS のキャッシュと TTL。名前解決の結果を保持する時間 （TTL）が、レコード変更の反映の速さと引き換えになることの判断
    prereq: DNS の応答には TTL が含まれ、キャッシュはその間は問い合わせを省略すること、レコードを変更しても、既にキャッシュされた古い情報は TTL が切れるまで使われ得ること
    hard: サーバ移転の直前に TTL を短くしておくという、変更の順序まで含めた判断が問われる。移転後に短くしても、既に長い TTL でキャッシュされた情報には効かない点が要点になる。
    q: |
      Web サーバを新しい IP アドレスへ移転する計画がある。移転の直後から利用者が新しいサーバへつながるようにするため、DNS に関する事前の手当てとして、最も適切なものはどれか。
    c:
      - 移転が完了してから、対象レコードの TTL を短い値に変更する
      - 移転の際に、世界中のキャッシュサーバへ古いレコードの削除を依頼する
      - 移転の前に、TTL を長い値に変更しておき、問合せの回数を減らす
      - 移転の十分前に、対象レコードの TTL を短い値に変更しておき、移転時にレコードを新しい IP アドレスへ書き換える
    a: エ
    exp: |
      DNS のキャッシュは、レコードに設定された TTL の間、古い情報を保持し続けます。移転の直前にレコードを書き換えても、長い TTL でキャッシュされた古い IP アドレスが、TTL の満了まで使われてしまいます。そこで、移転の十分前 （少なくとも従来の TTL の期間より前）に TTL を短くしておき、古い情報が早く消える状態にしてから、移転時に IP アドレスを書き換えるのが正しい手順です。キャッシュの削除を外部から依頼する仕組みはありません。
    why:
      - 移転後に TTL を短くしても、既に長い TTL でキャッシュされた古い情報には効きません。
      - 他組織のキャッシュを削除させる仕組みはなく、依頼という手段は存在しません。
      - TTL を長くすると、古い情報が残る時間が延びてしまい、目的と逆の効果になります。
      - 正解です。TTL を事前に短くしておくことで、書換え後の古いキャッシュの残存時間を短くできます。
    know: DNS の変更の反映速度は、TTL によって決まる。移転のような計画的な変更では「先に TTL を短く、後で書き換える」という順序が要点であり、設定変更のタイミングそのものが設計対象になる。
    terms:
      - DNS
      - TTL
      - キャッシュ
    verify:
      manual: キャッシュの保持期間が TTL で決まることと手順の順序を照合し、事前に TTL を短くする方法だけが書換え直後の古い情報の残存を抑えられること、事後の変更や削除依頼では効かないことを確認した。
  - id: A10-516
    topic: 10-2-3
    diff: 3
    scope: 10-2-3 TCP の輻輳制御（スロースタート）。接続の開始直後は送出量を小さく始め、確認応答が届くごとにウィンドウを倍に広げていく動作を数える問題
    prereq: スロースタートでは、輻輳ウィンドウはラウンドトリップ時間 （1 往復）ごとに約 2 倍に増えること
    hard: セグメントが届くたびに 1 つずつ増えるのではなく、往復を単位として指数的に増えることを数える必要がある。初期値の数え方 （開始時点を 1 とすること）も問われる。
    q: |
      TCP のスロースタートでは、輻輳ウィンドウの大きさは、確認応答が順調に届く間、1 往復 （ラウンドトリップ時間）ごとに約 2 倍に増える。初期の輻輳ウィンドウが 1 セグメントのとき、4 往復後の輻輳ウィンドウは何セグメントになるか。
    c:
      - '16'
      - '8'
      - '32'
      - '5'
    a: ア
    exp: |
      往復ごとに 2 倍になるので、変化は次のとおりです。
      - 開始時点： 1
      - 1 往復後： 2
      - 2 往復後： 4
      - 3 往復後： 8
      - 4 往復後： 16
      輻輳ウィンドウは 16 セグメントになります。この指数的な増加により、接続の開始直後は慎重に、回線に余裕があると分かれば速やかに送出量を増やせるのが、スロースタートの狙いです。
    why:
      - 正解です。1 から 4 回の 2 倍で、16 セグメントです。
      - 3 往復後の値です。本問は 4 往復後を問うています。
      - 5 往復後の値です。数える往復の回数が 1 回多くなっています。
      - 往復ごとに 1 セグメントずつ増えると考えた場合の値です（1 → 2 → 3 → 4 → 5）。スロースタートは倍々に増えます。
    know: スロースタートの増加は往復を単位とした指数関数 （2 の累乗）である。「スロー」とは開始が小さいという意味であり、増加そのものは速い、という点が、この方式の要点である。
    terms:
      - TCP
      - 輻輳制御
      - スロースタート
    verify:
      type: value
      value: 16
  - id: A10-517
    topic: 10-1-6
    diff: 3
    scope: 10-1-6 イーサネットの CSMA/CD と最小フレーム長。送信中に衝突を検知できるよう、フレームの送信時間が信号の往復時間より長くなければならないことの判断
    prereq: 衝突の検知は、信号がケーブルの端まで届いて戻ってくるまでの間に、まだ送信中であることが条件であること、伝送速度が上がると同じフレーム長の送信時間は短くなること
    hard: 「フレームが短い」という見た目の性質ではなく、送信時間と伝搬時間の比較という物理的な条件から、最小フレーム長が決まる理由を導く必要がある。
    q: |
      CSMA/CD 方式のイーサネットで、フレームに最小長（64 バイト）が定められている理由として、正しいものはどれか。
    c:
      - 宛先の MAC アドレスを格納するために、最低 64 バイトが必要なため
      - 送信側が、フレームを送り終える前に衝突の発生を知ることができるよう、送信時間が信号の往復の伝搬時間より長くなるようにするため
      - ネットワーク機器のバッファが、64 バイト未満のフレームを保持できないため
      - フレームが短いと、受信側でチェックサムの計算ができなくなるため
    a: イ
    exp: |
      CSMA/CD では、送信中のホストが衝突 （他のホストの信号との重なり）を検知して、送信を中止し再送します。衝突を知るには、最遠の相手の信号が戻ってくるまでの間、自分のフレームをまだ送信中である必要があります。フレームが短すぎると、衝突が起きても送り終えた後になり、検知できません。そこで、送信時間が信号の往復時間より長くなるよう、最小フレーム長が定められています。伝送速度が上がると送信時間は短くなるため、高速化の際にはこの条件が制約になりました。
    why:
      - MAC アドレスは 6 バイトであり、64 バイトという長さの根拠ではありません。
      - 正解です。衝突検知の条件（送信中に衝突を知ること）が、最小長の理由です。
      - バッファの容量の問題ではなく、信号の伝搬時間と送信時間の関係が理由です。
      - チェックサム（FCS）の計算はフレームの長さに依存せず、短いフレームでも計算できます。
    know: 最小フレーム長は、物理的な信号の往復時間から決まる制約である。CSMA/CD の「聞きながら送り、ぶつかったらやめる」という動作が成立するための条件として理解することが要点である。
    terms:
      - CSMA/CD
      - イーサネット
      - フレーム
    verify:
      manual: 衝突検知の条件（信号の往復時間内に送信中であること）と各選択肢を照合し、最小長の理由が伝搬時間との関係であること、他の選択肢が無関係な理由であることを確認した。
  - id: A10-518
    topic: 10-1-5
    diff: 2
    scope: 10-1-5 VLAN とタグ VLAN（トランク）。スイッチ間で複数の VLAN のフレームを運ぶ際に、フレームへ VLAN の識別情報を付ける仕組みの判断
    prereq: スイッチ間の接続では、どの VLAN のフレームかを区別する情報 （タグ）が必要になること
    q: |
      2 台のスイッチを 1 本のリンクで接続し、そのリンクで VLAN 10 と VLAN 20 の両方の通信を通したい。スイッチ間のリンクで必要になる仕組みはどれか。
    c:
      - スイッチ間のケーブルを 2 本にし、VLAN ごとに物理的に分ける
      - スイッチ間では VLAN の区別はできず、1 つの VLAN しか通せない
      - スイッチ間のリンクでは、IP アドレスで VLAN を区別する
      - フレームに VLAN の識別情報（タグ）を付けて送るタグ VLAN（トランク）を使う
    a: エ
    exp: |
      複数の VLAN のフレームを 1 本のスイッチ間リンクで運ぶには、フレームごとに「どの VLAN のものか」を示す情報が必要です。タグ VLAN （IEEE 802.1Q）では、フレームに VLAN ID を含むタグを付加し、受信側のスイッチがタグを見て適切な VLAN へ振り分けます。このようなリンクはトランクと呼ばれます。ケーブルを VLAN の数だけ分ける方法でも通信はできますが、タグを使う仕組みを問う本問では、タグ VLAN が答えです。
    why:
      - ケーブルを 2 本に分ける方法は、問題文の「1 本のリンク」という条件に反します。1 本のリンクで複数の VLAN を区別するには、フレームへのタグの付加が必要です。
      - タグ VLAN を使えば、複数の VLAN を 1 本のリンクで通すことができます。
      - レイヤ 2 のスイッチはフレームを MAC アドレスとタグで扱い、IP アドレスで VLAN を区別するのではありません。
      - 正解です。タグの付加により、1 本のリンクで複数の VLAN を区別して運べます。
    know: VLAN は論理的な分割であり、スイッチをまたぐ場合は「どの VLAN のフレームか」を伝えるタグが必要になる。タグ VLAN とトランクの関係が、この分野の要点である。
    terms:
      - VLAN
      - タグVLAN
      - スイッチ
    verify:
      manual: スイッチ間リンクで複数 VLAN を運ぶ条件（フレームごとの VLAN の識別情報）と各選択肢を照合し、タグの付加がその仕組みであること、物理分離や IP による区別は異なる方法であることを確認した。
  - id: A10-519
    topic: 10-1-6
    diff: 3
    scope: 10-1-6 無線 LAN のチャネル設計。2.4 GHz 帯では周波数が重ならないチャネルの組合せ （1、6、11）を選ぶことで、干渉を避ける判断
    prereq: 無線 LAN の各チャネルは幅を持ち、番号の近いチャネル同士は周波数が重なって干渉すること、2.4 GHz 帯で重ならないのは 1、6、11 の組合せであること
    hard: 隣り合うアクセスポイントに「近い番号」ではなく、重ならない間隔のチャネルを割り当てる必要があることを、フロアの配置と結び付けて判断する必要がある。
    q: |
      オフィスのフロアに、2.4 GHz 帯の無線 LAN アクセスポイントを複数台設置する。隣り合うアクセスポイント同士の電波干渉を避けるための、チャネルの割当てとして適切なものはどれか。
    c:
      - 隣り合うアクセスポイントには、1、6、11 のように、周波数が重ならないチャネルを割り当てる
      - 全てのアクセスポイントに、同じチャネルを割り当てる
      - 隣り合うアクセスポイントには、1、2、3 のように、番号の近いチャネルを割り当てる
      - チャネルは自動取得に任せ、設計では考慮しない
    a: ア
    exp: |
      2.4 GHz 帯の無線 LAN では、各チャネルが周波数の幅を持ち、番号が近いチャネルは互いに重なって干渉します。5 チャネル分離れた 1、6、11 の組合せは互いに重ならないため、隣り合うアクセスポイントにはこの3つを繰り返し割り当てるのが標準的な設計です。同じチャネル同士は通信の取り合いで調整が働きますが、部分的に重なるチャネル同士は干渉として互いの通信を壊し合うため、避ける必要があります。
    why:
      - 正解です。重ならないチャネル（1、6、11）の割当てが、干渉を避ける設計です。
      - 全台が同じチャネルでは、取り合いの範囲が広がり、フロア全体の実効速度が落ちます。
      - 番号の近いチャネルは周波数が重なり、互いに干渉して通信品質を大きく落とします。
      - 自動取得に任せると、部分的に重なる割当てになることがあり、設計で方針を定めることが必要です。
    know: 無線 LAN の設計では、チャネルの「重なり」が干渉の原因になる。2.4 GHz 帯では 1、6、11 が重ならない組合せであることが、チャネル設計の基本として押さえるべき要点である。
    terms:
      - 無線LAN
      - チャネル
    verify:
      manual: 2.4 GHz 帯のチャネルの周波数の重なり（5 間隔で重ならない、1・6・11 の組合せ）と各選択肢を照合し、重ならない割当てだけが干渉を避ける設計であることを確認した。
  - id: A10-520
    topic: 10-3-1-3
    diff: 3
    scope: 10-3-1-3 電子メールの送信ドメイン認証 （SPF・DKIM・DMARC）。3つの仕組みが、送信元サーバの宣言、署名による改ざん防止、失敗時の扱いの指示と、それぞれ異なる役割を持つことの判断
    prereq: SPF は送信元サーバの IP アドレスの正当性を DNS で宣言する仕組み、DKIM はメールへのデジタル署名、DMARC は認証に失敗したメールの扱いの指示と報告の仕組みであること
    hard: 3つの仕組みが全て「なりすまし対策」と一括りにされがちなところを、検証する対象 （経路か、内容か）と役割の違いで切り分ける必要がある。
    q: |
      送信ドメイン認証のうち、受信側が「認証に失敗したメールをどう扱うか （拒否するか、迷惑メールフォルダへ入れるか）」を、送信側ドメインの管理者が DNS のポリシーとして宣言できる仕組みはどれか。
    c:
      - SPF
      - POP3
      - DMARC
      - DKIM
    a: ウ
    exp: |
      DMARC は、SPF や DKIM の認証結果と組み合わせて使われる仕組みで、ドメインの管理者が「認証に失敗したメールをどう扱うか （何もしない・隔離する・拒否する）」のポリシーを DNS に宣言できます。あわせて、認証結果の報告を受け取ることもできます。SPF は「そのドメインの送信元として正当なサーバの IP アドレス」を宣言する仕組み、DKIM はメールにデジタル署名を付けて改ざんと送信者の正当性を検証する仕組みであり、失敗時の扱いの宣言は DMARC の役割です。
    why:
      - SPF は送信元サーバの正当性を宣言する仕組みであり、失敗したメールの扱いまでは指示しません。
      - POP3 はメールを受信するためのプロトコルであり、送信元の認証とは無関係です。
      - 正解です。失敗時の取扱いのポリシーを宣言できるのは DMARC です。
      - DKIM は署名による検証の仕組みであり、失敗時の扱いの宣言は役割ではありません。
    know: 送信ドメイン認証は、SPF （経路の宣言）、DKIM （署名による検証）、DMARC （失敗時の扱いと報告）の役割分担で成り立つ。どの仕組みが何を決めるのかの切り分けが要点である。
    terms:
      - DMARC
      - SPF
      - DKIM
    verify:
      manual: 3つの仕組みの役割（SPF は送信元サーバの宣言、DKIM は署名による改ざん検知、DMARC は失敗時のポリシー宣言と報告）を照合し、失敗時の扱いを宣言できるのは DMARC だけであることを確認した。
  - id: A10-521
    topic: 10-3-1-6
    diff: 3
    scope: 10-3-1-6 Web のキャッシュとオリジンサーバの転送量。キャッシュのヒット率から、コンテンツの送信元（オリジン）が実際に転送するデータ量を計算する問題
    prereq: キャッシュにヒットしたリクエストではオリジンからの転送は発生しないこと、転送量はリクエスト数と 1 件当たりのデータ量の積であること
    hard: ヒット率を「転送量の削減分」として正しく適用し、リクエスト総数への掛け方を取り違えない必要がある。単位 （GB への換算）も問われる。
    q: |
      ある Web サイトでは、1 日に 100 万件のリクエストがあり、1 件当たりの平均の転送データ量は 50 K バイトである。キャッシュサーバのヒット率が 60 ％のとき、オリジンサーバが 1 日に転送するデータ量は何 G バイトか。ここで、ヒットしたリクエストではオリジンからの転送は発生せず、1 G バイト ＝ 1,000,000 K バイトとする。
    c:
      - '50'
      - '20'
      - '30'
      - '40'
    a: イ
    exp: |
      オリジンへ届くのは、キャッシュにヒットしなかったリクエストだけです。
      - ミスのリクエスト数： 1,000,000 × （1 － 0.6）＝ 400,000 件
      - 転送量： 400,000 × 50 K バイト ＝ 20,000,000 K バイト ＝ 20 G バイト
      キャッシュが全体の 6 割を肩代わりするため、オリジンの転送量は総量 （50 G バイト）の 4 割に減ります。
    why:
      - キャッシュの効果を考えず、全リクエスト分を転送した場合の値です。
      - 正解です。ミス分 40 万件 × 50 K バイト ＝ 20 G バイトです。
      - ヒット率を 40 ％として計算した場合の値です。本問のヒット率は 60 ％です。
      - ヒット率を 20 ％として計算した場合の値です（ミス 80 万件 × 50 K バイト ＝ 40 G バイト）。本問のヒット率は 60 ％です。
    know: キャッシュの効果は、ヒット率の分だけオリジンの負荷と転送量を減らす。総量に （1 － ヒット率）を掛けるという計算の形が、キャッシュ設計の基本である。
    terms:
      - キャッシュ
      - ヒット率
    verify:
      type: value
      value: 20
