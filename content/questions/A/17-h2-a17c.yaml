  method: 独立レビュアーが盲検で再解答し、正答・解説・重複を確認
questions:
  - id: A17-521
    topic: 17-1-1-2
    diff: 3
    scope: 17-1-1-2 情報システム戦略の策定手順。経営戦略との整合を取るために、現状の分析からあるべき姿を描き、戦略を定める進め方の判断
    prereq: 情報システム戦略は、経営戦略を踏まえ、業務と情報システムの現状を分析し、あるべき姿との差を埋める方策として策定すること
    hard: 流行の技術の導入から始める進め方と、現状とあるべき姿の差から方策を導く進め方を切り分ける必要がある。
    q: |
      情報システム戦略を策定することになった。策定の進め方として、適切なものはどれか。
    c:
      - 経営戦略を踏まえ、業務と情報システムの現状を分析し、あるべき姿との差を埋める方策を戦略として定める
      - 注目されている新しい技術を選び、その技術の導入計画を戦略とする
      - 各部門から要望を集め、集まった順に実施する計画を戦略とする
      - 現在のシステムの保守計画を、そのまま戦略とする
    a: ア
    exp: |
      情報システム戦略は、経営戦略の実現を情報システムで支えるための方策です。策定では、まず業務と情報システムの現状を分析し、経営戦略から導かれる「あるべき姿」との差を明らかにして、その差を埋める方策を戦略として定めます。技術の流行や部門の要望の集積、保守計画の延長は、経営との整合を取る戦略の策定にはなりません。
    why:
      - 正解です。現状とあるべき姿の差から方策を導く進め方です。
      - 技術は手段であり、経営の課題から離れて技術の導入を目的化しては、戦略になりません。
      - 要望の集積は、全体の優先順位や経営との整合を欠きます。
      - 保守計画は現状の維持の計画であり、将来への方策ではありません。
    know: 戦略策定の型は、「現状の分析→あるべき姿→差を埋める方策」。技術や要望は、その材料であって出発点ではない。
    terms:
      - 情報システム戦略
    verify:
      manual: 情報システム戦略の策定では、経営戦略を踏まえて業務と情報システムの現状を分析し、あるべき姿との差を埋める方策を戦略として定める進め方が適切であることを、技術の導入計画・要望の集積・保守計画の延長との比較から確認した。
  - id: A17-522
    topic: 17-1-2-2
    diff: 3
    scope: 17-1-2-2 ビジネスアーキテクチャ。エンタープライズアーキテクチャの中で、業務の構造を対象とする層の識別
    prereq: ビジネスアーキテクチャは、組織の構造、業務プロセス、業務で扱う情報の流れなど、業務そのものの構造を設計の対象にすること
    hard: データやアプリケーション、技術基盤を対象とする他の層と、業務を対象とする層を切り分ける必要がある。
    q: |
      エンタープライズアーキテクチャの設計で、受注から出荷までの業務の流れと、各部門の役割分担、業務で扱う情報の受け渡しを整理した。この整理の対象は、どのアーキテクチャに当たるか。
    c:
      - テクノロジアーキテクチャ
      - アプリケーションアーキテクチャ
      - データアーキテクチャ
      - ビジネスアーキテクチャ
    a: エ
    exp: |
      業務の流れ、組織と役割、業務で扱う情報の受け渡しという、業務そのものの構造を対象とするのは、ビジネスアーキテクチャです。データアーキテクチャはデータの構造と管理を、アプリケーションアーキテクチャは業務を支えるアプリケーションの構成を、テクノロジアーキテクチャは基盤となる技術の構成を、それぞれ対象にします。対象の違いで層を見分けます。
    why:
      - テクノロジアーキテクチャの対象は、サーバやネットワークなどの技術基盤の構成です。
      - アプリケーションアーキテクチャの対象は、業務を支えるアプリケーションの構成です。
      - データアーキテクチャの対象は、データの構造と管理の仕方です。本件は業務の流れそのものです。
      - 正解です。業務の流れと役割分担は、業務の構造の設計です。
    know: EA の層の見分けは、「何を設計の対象にしているか」。業務→ビジネス、データ→データ、アプリケーション→アプリケーション、基盤→テクノロジ、の対応で押さえる。
    terms:
      - ビジネスアーキテクチャ
      - エンタープライズアーキテクチャ
    verify:
      manual: 受注から出荷までの業務の流れ、各部門の役割分担、業務で扱う情報の受け渡しの整理が、業務そのものの構造を対象とするビジネスアーキテクチャに当たることを、他の三つの層との対象の違いから確認した。
  - id: A17-523
    topic: 17-1-1-4
    diff: 3
    scope: 17-1-1-4 情報システム戦略遂行のための組織体制。情報システムに関する最高責任者（CIO）の役割の判断
    prereq: CIO は、経営の立場から情報システム戦略の策定と遂行に責任を持ち、経営層と情報システム部門の橋渡しを行う役割であること
    hard: 技術の専門家としての役割と、経営の立場で戦略に責任を持つ役割を切り分ける必要がある。
    q: |
      ある会社で、情報システムの投資や全体の方針について、経営層と情報システム部門の間で意思の疎通がうまくいっていない。CIO（最高情報責任者）を置くことの狙いとして、適切なものはどれか。
    c:
      - 最も高度な技術的判断を、一人で担う
      - 経営の立場から情報システム戦略の策定と遂行に責任を持ち、経営層と情報システム部門の橋渡しを行う
      - 情報システム部門の日常の作業の監督を、細かく行う
      - ベンダとの価格交渉だけを、専門に担う
    a: イ
    exp: |
      CIO は、経営層の一員として、情報システム戦略の策定と遂行に責任を持つ役割です。経営の目標と情報システムの取組をつなぐ橋渡しが、その中心的な狙いです。個別の技術判断や日常の作業の監督、価格交渉は、それぞれの担当の役割であり、CIO の役割を置く狙いではありません。
    why:
      - 技術判断の専門家は必要ですが、CIO の狙いは経営の立場での責任にあります。
      - 正解です。経営と情報システムをつなぐ、戦略への責任が CIO の役割です。
      - 日常の作業の監督は、部門の管理者の役割です。
      - 価格交渉は調達の実務であり、CIO を置く狙いではありません。
    know: CIO の要点は「経営層の一員であること」。技術の専門家ではなく、経営と情報システムの橋渡し役である。
    terms:
      - CIO
      - 情報システム戦略
    verify:
      manual: CIO を置く狙いは、経営の立場から情報システム戦略の策定と遂行に責任を持ち、経営層と情報システム部門の橋渡しを行うことであることを、技術判断の専担・日常の監督・価格交渉との区別から確認した。
  - id: A17-524
    topic: 17-1-5
    diff: 3
    scope: 17-1-5 品質統制。情報システムの品質を全社で一定の水準に保つための、基準と確認の仕組みの判断
    prereq: 品質統制では、開発や運用の品質の基準を定め、その遵守の状況を確認し、問題があれば是正する仕組みを全社で回すこと
    hard: 個々のプロジェクトの品質活動と、全社の基準として統制する仕組みを切り分ける必要がある。
    q: |
      部門ごとに開発の進め方がばらばらで、品質にばらつきが出ている。情報システムの品質統制の取組として、適切なものはどれか。
    c:
      - 各プロジェクトの品質は、プロジェクトの判断に完全に任せる
      - 品質の確認は、外部の監査に全て任せる
      - 全社共通の品質の基準と進め方を定め、各プロジェクトの遵守の状況を確認し、是正する仕組みを作る
      - 品質の問題が起きたプロジェクトだけ、その都度指導する
    a: ウ
    exp: |
      品質統制は、品質を組織全体で一定の水準に保つための仕組みです。全社共通の基準と進め方を定め、遵守の状況を確認し、問題があれば是正するという循環を作ることで、部門ごとのばらつきを抑えます。プロジェクト任せではばらつきが残り、問題の起きた所だけの指導では予防になりません。外部の監査は、この仕組みを補うものであり、代わりにはなりません。
    why:
      - 完全に任せるのでは、ばらつきという問題そのものが解消されません。
      - 外部の監査だけでは、日頃の進め方の統制は行えません。
      - 正解です。基準の設定と、確認と是正の循環が、統制の仕組みです。
      - 起きた所だけの指導は事後の対応であり、全体の予防にはなりません。
    know: 統制の要点は、「基準を定める・守られているか確認する・是正する」の循環を、組織の仕組みとして回すことである。
    terms:
      - 品質統制
      - 標準化
    verify:
      manual: 部門ごとに開発の進め方がばらばらで品質にばらつきが出ている状況に対し、全社共通の品質の基準と進め方を定め、各プロジェクトの遵守の状況を確認し是正する仕組みを作る取組が適切であることを、プロジェクト任せ・事後の指導・外部監査への全面依存との比較から確認した。
  - id: A17-525
    topic: 17-1-1-7
    diff: 3
    scope: 17-1-1-7 モデル。現状の業務を表すモデルと、あるべき姿の業務を表すモデルを使い分ける判断
    prereq: 業務のモデル化では、現状を表すモデルで問題を把握し、あるべき姿のモデルで将来の業務を描くこと、両者を比べることで改善の差が明らかになること
    hard: モデルを作ること自体が目的になる進め方と、現状と将来の比較に使う進め方を切り分ける必要がある。
    q: |
      業務の改善を検討するに当たり、現在の受注業務の流れを図に表したモデルと、改善後の業務の流れを表したモデルを作成した。これらのモデルの使い方として、適切なものはどれか。
    c:
      - 改善後のモデルだけを示し、現在のモデルは破棄する
      - モデルは開発部門だけが参照し、業務部門には見せない
      - 二つのモデルを比べ、業務の流れのどこがどう変わるかを示して、改善の内容と影響を関係者で共有する
      - モデルは作成すること自体が目的であり、比較には使わない
    a: ウ
    exp: |
      現状のモデルと、あるべき姿のモデルを比べることで、業務のどこがどう変わるのかが具体的に分かり、改善の内容と、その影響を受ける人や手順を、関係者で共有できます。現在のモデルがなければ、変化の大きさも影響の範囲も判断できません。モデルは、作ること自体ではなく、この比較と共有のために使います。
    why:
      - 現在のモデルを捨てると、変化の差と影響の範囲が判断できません。
      - 業務のモデルは、業務部門こそが確認すべき相手であり、共有が必要です。
      - 正解です。現状と将来の比較による、変化と影響の共有がモデルの使い方です。
      - モデルは、検討と共有のための道具であり、作成自体は目的ではありません。
    know: モデルの価値は「比べられること」と「共有できること」。現状と将来の二つをそろえて初めて、改善の議論の土台になる。
    terms:
      - モデル化
      - 業務プロセス
    verify:
      manual: 現在の受注業務のモデルと改善後のモデルを作成した場合、二つを比べて業務の流れの変化と影響を関係者で共有する使い方が適切であることを、作成自体の目的化・現行モデルの破棄・非共有との比較から確認した。
  - id: A17-526
    topic: 17-3-1
    diff: 3
    scope: 17-3-1 ソリューションビジネス。製品の販売ではなく、顧客の課題の解決を提案するビジネスの進め方の判断
    prereq: ソリューションビジネスでは、顧客の業務の課題を把握し、製品やサービスを組み合わせて課題の解決として提案すること
    hard: 製品の機能の売り込みと、課題の解決の提案という、営業の姿勢の違いを切り分ける必要がある。
    q: |
      情報システムの提供会社が、在庫の過剰に悩む小売業者に対し、在庫のデータの分析から課題を明らかにし、発注の仕組みとシステムを組み合わせた改善策を提案した。このような事業の進め方は何と呼ばれるか。
    c:
      - マスマーケティング
      - OEM 生産
      - ソリューションビジネス（課題解決型の事業）
      - フランチャイズ
    a: ウ
    exp: |
      顧客の課題を把握し、製品やサービスを組み合わせて、その解決策として提案する事業の進め方は、ソリューションビジネスと呼ばれます。製品の機能そのものを売るのではなく、「顧客の課題がどう解決されるか」を価値として提供する点が特徴です。提供する側には、顧客の業務を理解する力が求められます。
    why:
      - マスマーケティングは、不特定多数への画一的な働きかけであり、個別の課題の解決ではありません。
      - OEM 生産は、他社のブランドで製品を製造する形態であり、課題の提案とは関係がありません。
      - 正解です。課題の把握と、解決策としての提案が、ソリューションビジネスの形です。
      - フランチャイズは、事業の仕組みとブランドの使用を許諾する形態であり、本件とは異なります。
    know: ソリューションビジネスの要点は、「製品を売る」から「課題の解決を売る」への転換である。顧客の業務の理解が出発点になる。
    terms:
      - ソリューション
    verify:
      manual: 在庫の過剰に悩む小売業者に対してデータの分析から課題を明らかにし、発注の仕組みとシステムを組み合わせた改善策を提案する進め方が、ソリューションビジネスに当たることを、他の三つの事業形態との区別から確認した。
  - id: A17-527
    topic: 17-4-1-1
    diff: 3
    scope: 17-4-1-1 システム活用促進と評価の目的。稼働したシステムが業務で実際に活用されているかを評価し、改善につなげる循環の判断
    prereq: システムの評価は、稼働の有無だけでなく、業務で活用され効果を上げているかを確認し、活用の促進と改善につなげること
    hard: 「稼働していること」をもって成功とする評価と、「活用され効果が出ているか」を問う評価を切り分ける必要がある。
    q: |
      導入した営業支援システムが、技術的には安定して稼働している。しかし、営業担当者の入力が進まず、蓄積されたデータが活動に使われていない。システム活用の評価として、適切なものはどれか。
    c:
      - 入力しない担当者を、個別に注意して終わりにする
      - システムの処理速度を、さらに高める
      - 安定して稼働しているので、評価は成功として終了する
      - 稼働の安定性だけでなく、利用の実態と業務への効果を評価し、活用されない原因への対策につなげる
    a: エ
    exp: |
      システムの活用の評価は、「動いているか」ではなく、「使われて、業務の効果につながっているか」を問うものです。本件では、入力が進まないという利用の実態が問題であり、その原因（入力の負担、効果の実感の不足など）を確かめて、活用の促進策につなげることが評価の目的です。安定稼働だけで成功とすると、導入の目的である業務の改善が置き去りになります。
    why:
      - 個別の注意だけでは、入力が進まない仕組みの原因が解消されません。
      - 処理速度は本件の問題ではなく、速くしても利用は進みません。
      - 稼働の安定は前提であり、それだけでは導入の目的の達成は分かりません。
      - 正解です。利用の実態と効果の評価が、活用の促進につながります。
    know: 活用の評価の物差しは、「稼働」ではなく「利用と効果」。使われていない原因を確かめて、促進策に回すことが循環の形である。
    terms:
      - システム活用
      - 評価
    verify:
      manual: 安定稼働しているが営業担当者の入力が進まずデータが使われていない営業支援システムについては、稼働の安定性だけでなく利用の実態と業務への効果を評価して活用されない原因への対策につなげることが適切であることを、成功として終了・個別の注意・処理速度の向上との比較から確認した。
  - id: A17-528
    topic: 17-1-1-1
    diff: 4
    scope: 17-1-1-1 情報システム戦略の目的。情報システムの取組が、経営の目標の達成にどう貢献するかという目的の判断
    prereq: 情報システム戦略の目的は、情報システムの活用によって、経営の目標の達成や競争力の強化に貢献することであり、技術の刷新そのものは目的ではないこと
    hard: 新しい技術の導入や、システムの新しさといった手段の達成を、目的と取り違えていないかを見分ける必要がある。
    q: |
      情報システム戦略の目的の記述として、最も適切なものはどれか。
    c:
      - 情報システム部門の規模を、拡大すること
      - 最新の技術を、他社より早く導入すること
      - 社内の全てのシステムを、同じ会社の製品でそろえること
      - 情報システムの活用によって、売上の拡大や費用の削減など、経営の目標の達成に貢献すること
    a: エ
    exp: |
      情報システム戦略の目的は、情報システムを経営の目標の達成に役立てることです。売上の拡大、費用の削減、顧客への対応の改善など、経営の成果への貢献が、戦略の評価の物差しになります。技術の導入の速さ、製品の統一、部門の規模は、いずれも手段や状態の話であり、それ自体は目的ではありません。
    why:
      - 部門の規模の拡大は、経営の成果とは関係のない、組織の状態の話です。
      - 技術の導入は手段であり、速さ自体が経営の成果を保証するものではありません。
      - 製品の統一は、運用の都合による手段の一つであり、目的ではありません。
      - 正解です。経営の目標への貢献が、情報システム戦略の目的です。
