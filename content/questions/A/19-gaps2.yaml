reviewed: { at: '2026-10-21', method: '作成後の逐問レビュー（CX デザイン，プロモーション戦略の用語の定義をシラバスVer.9.2の用語例と照合）' }
questions:
  - id: A19-030
    topic: 19-2-1-3
    diff: 2
    q: CX（Customer Experience：顧客体験）デザインの考え方として，最も適切なものはどれか。
    c:
      - 商品の購入前から購入後までの顧客の一連の接点（タッチポイント）を通した体験全体を捉え，顧客にとっての価値が高まるように設計する。
      - 商品の機能と価格だけを比較し，競合より安くすることを最優先に設計する。
      - 店舗での接客品質だけを対象にして，Web サイトやアプリでの体験は設計の対象外とする。
      - 顧客の意見は聞かずに，社内の担当者の経験だけで体験を設計する。
    a: ア
    exp: |
      CX は，商品そのものの使い心地（UX）に限らず，認知，比較，購入，利用，サポート，再購入といった顧客と企業との接点全体で得られる体験を指します。CX デザインでは，顧客の行動や感情の流れを可視化（カスタマージャーニーマップなど）して改善点を見つけ，顧客ロイヤルティの向上やリテンション率の改善につなげます。
    why:
      - 正解です。接点全体を通した顧客の体験を捉えて設計します。
      - 機能と価格だけの比較では，体験全体を捉えたことになりません。
      - 店舗に限定せず，Web やアプリなど全ての接点が対象です。
      - 顧客の行動や声に基づいて設計するのが原則であり，社内の経験だけでは偏ります。
    terms: [CXデザイン, UX, 顧客ロイヤルティ]

  - id: A19-031
    topic: 19-2-2-4
    diff: 2
    q: マーケティングのプロモーション戦略において，パブリシティに該当するものはどれか。
    c:
      - 新製品の発表をプレスリリースとして報道機関に提供し，記事やニュースとして取り上げてもらう。
      - テレビや新聞の広告枠を購入して，新製品の広告を出稿する。
      - 購入者に対して，期間限定の割引クーポンを配布する。
      - 営業担当者が顧客を訪問して，製品の説明と提案を行う。
    a: ア
    exp: |
      プロモーション（販売促進）の手段は，広告，販売促進（セールスプロモーション），パブリシティ，人的販売などに分けられます。パブリシティは，企業が報道機関に情報を提供し，記事や番組として報道してもらう活動で，掲載料を支払わない点が広告と異なります。信頼性が高い反面，内容や掲載の可否・時期は企業が管理できません。
    why:
      - 正解です。報道機関に情報提供して報道してもらうのがパブリシティです。
      - 広告枠を購入して出稿するのは広告です。
      - 割引クーポンの配布は販売促進（セールスプロモーション）です。
      - 営業担当者による説明は人的販売です。
    terms: [パブリシティ, プロモーション戦略]
