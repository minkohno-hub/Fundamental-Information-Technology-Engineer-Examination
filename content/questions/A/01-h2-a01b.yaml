questions:
  - id: A01-601
    topic: 1-2-1-1
    diff: 3
    q: |
      ある感染症について，集団全体の感染率は 1％ である。検査の性能は，感染している人の 95％ が陽性，感染していない人の 5％ が陽性（偽陽性）と判定される。ある人が検査で陽性と判定されたとき，この人が実際に感染している確率に最も近いものはどれか。
    c: ['16.1％', '19.0％', '95.0％', '5.0％']
    a: ア
    scope: 1-2-1-1 確率（条件付き確率，ベイズの定理）。条件付き確率の定義 P(A|B)＝P(A∧B)／P(B) と全確率の考え方だけで解け，範囲内の計算である。
    prereq: 条件付き確率の定義，同時確率の乗法定理，全確率（陽性になる場合の合計）の求め方
    hard: 「感染者が陽性になる確率」と「陽性者が感染している確率」の向きを取り違えやすく，陽性になる全パターンの合計を分母に置く2段階の計算が必要。
    exp: |
      求めたいのは P(感染｜陽性)＝P(感染かつ陽性)／P(陽性) です。人数で考えると分かりやすくなります。10,000 人を想定します。
      | 区分 | 人数 | 陽性になる人数 |
      | --- | --- | --- |
      | 感染している | 100 | 100×0.95＝95 |
      | 感染していない | 9,900 | 9,900×0.05＝495 |
      陽性者の合計は 95＋495＝590 人で，そのうち実際に感染している人は 95 人です。
      P(感染｜陽性)＝95／590＝約 0.161，すなわち約 16.1％ です。感染率が低いと，偽陽性の人数が真陽性を上回るため，陽性でも感染の可能性は意外に低くなります。
    why:
      - 正解です。95／（95＋495）＝約16.1％ で，分母に偽陽性の 495 人を含めて計算した結果です。
      - 分母を陽性になる全体（真陽性＋偽陽性）ではなく偽陽性率 0.05 そのものとして 0.0095／0.05＝19％ と計算した誤りです。陽性者全体で割る必要があります。
      - 感染者が陽性になる確率 P(陽性｜感染)＝95％ を，そのまま P(感染｜陽性) と取り違えた誤りです。条件の向きが逆で，感染率 1％ が反映されていません。
      - 偽陽性率 5％ を答えにした誤りです。これは P(陽性｜非感染) であり，陽性者が感染している確率ではありません。
    know: ベイズの定理 P(A|B)＝P(B|A)×P(A)／P(B)。P(B|A) と P(A|B) は一般に等しくありません。事前確率（有病率）が低いと，高性能の検査でも陽性的中率は低くなります。人数に直して表にすると計算ミスを防げます。
    terms: [条件付き確率, ベイズの定理]
    verify: { value: '0.01*0.95/(0.01*0.95+0.99*0.05)*100', tolerance: 0.05 }

  - id: A01-602
    topic: 1-2-1-1
    diff: 2
    q: |
      くじが 100 枚あり，賞金は 1 等 10,000 円が 1 枚，2 等 1,000 円が 5 枚，3 等 200 円が 20 枚で，残りははずれ（賞金なし）である。このくじを 1 枚 200 円で購入するとき，1 枚あたりの期待損益はどれか。ここで，損益は賞金から購入代金を引いた値とする。
    c: ['-10円', '+10円', '-190円', '+190円']
    a: ア
    scope: 1-2-1-1 確率。期待値は確率の応用（確率×値の総和）として基本情報技術者試験で出題される基礎計算であり，加法の考え方だけで解ける。
    prereq: 期待値（確率×金額の総和）の求め方，損益＝賞金−購入代金
    exp: |
      賞金の期待値は「各賞金×その確率」の総和です。
      | 区分 | 確率 | 賞金 | 確率×賞金 |
      | --- | --- | --- | --- |
      | 1 等 | 1／100 | 10,000 | 100 |
      | 2 等 | 5／100 | 1,000 | 50 |
      | 3 等 | 20／100 | 200 | 40 |
      | はずれ | 74／100 | 0 | 0 |
      賞金の期待値は 100＋50＋40＝190 円です。購入代金 200 円を引くと，期待損益は 190−200＝−10 円（平均すると 1 枚あたり 10 円の損）です。
    why:
      - 正解です。賞金の期待値 190 円から購入代金 200 円を引いた −10 円が期待損益です。
      - 賞金の期待値 190 円と購入代金 200 円の差の符号を逆にした誤りです。期待値より代金が高いので損になります。
      - 賞金の期待値（190 円）の符号を反転して 190 円の損と読み違えた誤りです。購入代金との差を取る必要があります。
      - 賞金の期待値（190 円）を期待損益と取り違えた誤りです。購入代金 200 円を引いていません。
    know: 期待値＝Σ（値×確率）。損益を問われたら，賞金の期待値から費用を引きます。期待値は「1回あたりの平均」であり，実際に得られる金額ではない点にも注意します。
    terms: [期待値]
    verify: { value: '(10000*1+1000*5+200*20)/100-200' }

  - id: A01-603
    topic: 1-2-1-2
    diff: 3
    q: |
      ある試験の得点が，平均 62 点，標準偏差 8 点の正規分布に従うとする。正規分布では，平均から標準偏差の ±2 倍の範囲内に全体の約 95％ が含まれる。偏差値を 50＋10×（得点−平均）／標準偏差 で定義するとき，78 点を取った受験者の偏差値と，その得点以上を取る受験者の割合の組合せとして，最も適切なものはどれか。
    c: ['偏差値 70，上位約 2.5％', '偏差値 70，上位約 5％', '偏差値 78，上位約 2.5％', '偏差値 66，上位約 16％']
    a: ア
    scope: 1-2-1-2 統計（標準偏差，正規分布）。標準偏差を単位とした位置の読み取りと正規分布の対称性は範囲内であり，必要な 95％ の値は問題文で与えている。
    prereq: 標準化（平均からの距離を標準偏差で測る），正規分布が左右対称であること
    hard: 偏差値の計算と，「±2σ に 95％」から片側の裾を求める対称性の利用（5％ を 2 で割る）を組み合わせる。
    exp: |
      まず 78 点が平均から標準偏差の何倍離れているかを求めます。
      （78−62）／8＝16／8＝2 なので，平均＋2σ の位置です。偏差値は 50＋10×2＝70 です。
      次に割合です。平均±2σ の範囲に約 95％ が入るので，範囲の外側は約 5％ です。正規分布は左右対称なので，上側と下側に半分ずつ，上側（78 点以上）は約 5÷2＝2.5％ です。
    why:
      - 正解です。偏差値は 50＋10×2＝70，上側の裾は（100−95）／2＝2.5％ です。
      - 偏差値は正しいが，範囲の外側 5％ を上側と下側に分けずそのまま上位の割合とした誤りです。上側だけなら半分の 2.5％ です。
      - 得点そのもの（78）を偏差値と取り違えた誤りです。偏差値は平均を 50，標準偏差を 10 に換算した値です。
      - 標準偏差 8 ではなく 10 で割って（78−62）／10＝1.6 とし偏差値 66 とした誤りです。また 16％ は＋1σ の上側の割合で，78 点は＋2σ の位置なので当てはまりません。
    know: 正規分布では平均±1σ に約 68％，±2σ に約 95％，±3σ に約 99.7％ が含まれます。偏差値 50 が平均で，偏差値 70 は＋2σ，偏差値 60 は＋1σ にあたります。片側の割合を問われたら，両側の外側を 2 で割ります。
    terms: [正規分布, 標準偏差, 偏差値]
    verify: { manual: '(78-62)/8=2 より +2σ。偏差値=50+10*2=70。外側=100-95=5%、片側=2.5%。誤答の66は(78-62)/10=1.6 から 50+16、16%は+1σの上側 (100-68)/2' }

  - id: A01-604
    topic: 1-2-1-2
    diff: 3
    q: |
      変数 x と y の相関係数が 0.8 であり，y の標準偏差は 4 である。新しい変数 z を z＝10−3y で定義したとき，x と z の相関係数と，z の標準偏差の組合せとして，適切なものはどれか。
    c: ['相関係数 −0.8，標準偏差 12', '相関係数 0.8，標準偏差 12', '相関係数 −0.8，標準偏差 4', '相関係数 −2.4，標準偏差 12']
    a: ア
    scope: 1-2-1-2 統計（相関係数，標準偏差）。一次変換で標準偏差が絶対値倍になり，相関係数の絶対値が変わらないという性質は相関係数の基本的な理解の範囲である。
    prereq: 相関係数の範囲（−1 以上 1 以下）と符号の意味，標準偏差が散らばりの尺度であること
    hard: 負の係数による変換で「符号は反転するが大きさは不変」な相関係数と「絶対値倍になる」標準偏差を別々に判断する必要がある。
    exp: |
      z＝10−3y は y を −3 倍して 10 を足した一次変換です。
      | 量 | 変換の影響 | 結果 |
      | --- | --- | --- |
      | 標準偏差 | 係数の絶対値倍，定数の加算は影響しない | 4×｜−3｜＝12 |
      | 相関係数 | 係数が負なので符号だけ反転，絶対値は不変 | 0.8 → −0.8 |
      y が増えるほど z は減るので，x と z は逆向きの関係（負の相関）になります。標準偏差は散らばりの大きさなので負にはなりません。
    why:
      - 正解です。標準偏差は 4×3＝12，相関係数は符号が反転して −0.8 になります。
      - 標準偏差は正しいが，係数が負でも相関係数の符号は変わらないと誤解した結果です。z は y と逆向きに動くので符号は反転します。
      - 相関係数は正しいが，標準偏差を変換前のままとした誤りです。係数 −3 の絶対値倍（3 倍）に散らばりが広がります。
      - 相関係数に係数 −3 を掛けてしまった誤りです。相関係数は −1 以上 1 以下に収まる無次元の量で，尺度を変えても大きさは変わりません。
    know: 相関係数は単位や尺度の変更（正の定数倍・定数加算）に影響されません。係数が負のときだけ符号が反転します。標準偏差は定数加算に影響されず，定数倍では絶対値倍になります（分散は 2 乗倍）。
    terms: [相関係数, 標準偏差]
    verify: { manual: '標準偏差=|−3|×4=12，相関係数 0.8 → −0.8（負係数で符号反転，大きさ不変）。−2.4 は 0.8×(−3) の誤り' }

  - id: A01-605
    topic: 1-3-2
    diff: 3
    q: |
      5 種類の文字 A〜E の出現頻度が，それぞれ 40％，25％，15％，10％，10％ である。これらをハフマン符号化したときの 1 文字あたりの平均符号長（ビット）はどれか。ここで，平均符号長は出現頻度で重み付けした符号長の平均とする。
    c: ['2.15', '2.20', '2.35', '3.00']
    a: ア
    scope: 1-3-2 符号理論（ハフマン符号，情報源符号化）。ハフマン木の構成と平均符号長の計算は，シラバスのハフマン符号の理解そのものである。
    prereq: ハフマン木の作り方（出現頻度の小さい 2 つを順に併合），平均符号長＝Σ（頻度×符号長）
    hard: 併合を 4 回繰り返して各文字の木の深さを読み取り，頻度で重み付け平均する複数段階の計算が必要。
    exp: |
      頻度の小さいものから 2 つずつ併合して木を作ります。
      | 手順 | 残りの節点 | 併合 |
      | --- | --- | --- |
      | 1 | 40，25，15，10，10 | D＋E＝20 |
      | 2 | 40，25，15，20 | C＋（D，E）＝35 |
      | 3 | 40，25，35 | B＋35＝60 |
      | 4 | 40，60 | A＋60＝100 |
      各文字の符号長は A＝1，B＝2，C＝3，D＝4，E＝4 です。平均符号長は 0.40×1＋0.25×2＋0.15×3＋0.10×4＋0.10×4＝0.40＋0.50＋0.45＋0.40＋0.40＝2.15 ビットです。
    why:
      - 正解です。符号長 1，2，3，4，4 を頻度で重み付けして 2.15 ビットになります。
      - 符号長を 2，2，2，3，3 とした，頻度を考慮しない均衡に近い木の平均（0.8＋0.5＋0.3＋0.3＋0.3＝2.2）です。最頻出の A に 1 ビットを割り当てられるので最短ではありません。
      - 符号長を 2，2，3，3，3 とした木の平均（0.8＋0.5＋0.45＋0.3＋0.3＝2.35）です。有効な接頭語符号ですが符号空間に空きがあり，ハフマン符号ほど短くなりません。
      - 5 種類を区別する固定長符号（3 ビット）の長さです。ハフマン符号は頻度に偏りがあれば固定長より短くなります。
    know: ハフマン符号は出現頻度の高い文字に短い符号を割り当てる可変長符号で，平均符号長が最短になります（接頭語符号なので一意に復号可能）。併合時に同じ頻度が複数あっても，平均符号長は同じになります。
    terms: [ハフマン符号]
    verify:
      value: |
        (() => { let n = [0.4,0.25,0.15,0.1,0.1].map(p => ({p})); let total = 0; while (n.length > 1) { n.sort((x, y) => x.p - y.p); const a = n.shift(), b = n.shift(); total += a.p + b.p; n.push({p: a.p + b.p}); } return total; })()

  - id: A01-606
    topic: 1-3-1
    diff: 4
    q: |
      記号 A〜E の出現確率が，それぞれ 1／2，1／4，1／8，1／16，1／16 である情報源がある。この情報源の平均情報量（エントロピー）と，各記号をハフマン符号化したときの 1 記号あたりの平均符号長の組合せはどれか。ここで，単位はいずれもビットである。
    c: ['平均情報量 1.875，平均符号長 1.875', '平均情報量 1.875，平均符号長 2.0', '平均情報量 2.32，平均符号長 1.875', '平均情報量 2.32，平均符号長 3.0']
    a: ア
    scope: 1-3-1 情報理論と 1-3-2 符号理論（ハフマン符号）。平均情報量は確率 p の記号の情報量が −log2 p であることの加重平均で，ハフマン符号の理論の範囲内である。
    prereq: 情報量 −log2 p，平均情報量の計算，ハフマン符号の平均符号長の求め方
    hard: 情報理論（平均情報量）と符号化（平均符号長）の 2 論点を統合し，確率が 2 のべき乗のとき両者が一致することまで見抜く必要がある。
    exp: |
      各記号の情報量は −log2 p ビットです。
      | 記号 | 確率 | 情報量 | 確率×情報量 | ハフマン符号長 | 確率×符号長 |
      | --- | --- | --- | --- | --- | --- |
      | A | 1／2 | 1 | 0.5 | 1 | 0.5 |
      | B | 1／4 | 2 | 0.5 | 2 | 0.5 |
      | C | 1／8 | 3 | 0.375 | 3 | 0.375 |
      | D | 1／16 | 4 | 0.25 | 4 | 0.25 |
      | E | 1／16 | 4 | 0.25 | 4 | 0.25 |
      平均情報量は 0.5＋0.5＋0.375＋0.25＋0.25＝1.875 ビットです。ハフマン符号は 1／16 と 1／16 の併合から始めて符号長 1，2，3，4，4 になり，平均符号長も 1.875 ビットで一致します。確率がすべて 2 のべき乗（1／2^k）のとき，ハフマン符号の平均符号長は平均情報量に等しくなります。
    why:
      - 正解です。平均情報量も平均符号長も 1.875 ビットで，確率が 2 のべき乗なので一致します。
      - 平均符号長を 2.0 とした誤りです。符号長 1，2，3，4，4 を重み付けすると 1.875 で，符号長が情報量と一致するため平均情報量と等しくなります。
      - 2.32 は 5 記号が等確率のときの平均情報量 log2 5 です。確率に偏りがあるので平均情報量はそれより小さくなり，平均符号長 1.875 が平均情報量を下回ることもありません。
      - 5 記号が等確率と誤解した平均情報量 log2 5≒2.32 と，固定長符号（3 ビット）を組み合わせた誤りです。偏りのある情報源は可変長符号で短くできます。
    know: 平均情報量は情報源を符号化するときの平均符号長の下限（情報源符号化定理）を与えます。ハフマン符号の平均符号長は平均情報量以上で，確率がすべて 1／2^k の形なら等しくなります。確率が等しいときに平均情報量は最大です。
    terms: [平均情報量, ハフマン符号]
    verify: { manual: 'H=0.5*1+0.25*2+0.125*3+0.0625*4*2=1.875。ハフマン併合 1/16+1/16=1/8, 1/8+1/8=1/4, 1/4+1/4=1/2, 1/2+1/2=1 より符号長1,2,3,4,4 平均=0.5+0.5+0.375+0.5=1.875。log2(5)=2.3219' }

  - id: A01-607
    topic: 1-4-1-4
    diff: 3
    q: |
      5 ビットの符号語 00000，01011，10101，11110 の 4 つだけを使ってデータを伝送する。この符号語の集合の最小ハミング距離と，誤り検出・訂正能力の組合せとして，適切なものはどれか。ここで，ハミング距離は 2 つの符号語で異なるビットの個数とする。
    c: ['最小ハミング距離 3，2 ビットまでの誤りを検出でき，1 ビットの誤りを訂正できる', '最小ハミング距離 3，3 ビットまでの誤りを検出でき，1 ビットの誤りを訂正できる', '最小ハミング距離 3，2 ビットまでの誤りを検出でき，2 ビットの誤りを訂正できる', '最小ハミング距離 4，3 ビットまでの誤りを検出でき，1 ビットの誤りを訂正できる']
    a: ア
    scope: 1-4-1-4 誤り検出・訂正（ハミング符号）。最小ハミング距離 d と検出 d−1 ビット・訂正 ⌊(d−1)／2⌋ ビットの関係は，誤り検出訂正符号の基本原理として範囲内である。
    prereq: ハミング距離の定義，全ての符号語の組のハミング距離の求め方，検出・訂正可能ビット数と最小距離の関係
    hard: 6 組すべての符号語の距離を求めて最小値を取り（最大値や一部の組で判断しない），そこから検出能力と訂正能力を別々に導く 2 段階の推論が必要。
    exp: |
      全ての符号語の組のハミング距離を求め，最小値を取ります。
      | 組 | 異なるビット | 距離 |
      | --- | --- | --- |
      | 00000 と 01011 | 3 | 3 |
      | 00000 と 10101 | 3 | 3 |
      | 00000 と 11110 | 4 | 4 |
      | 01011 と 10101 | 4 | 4 |
      | 01011 と 11110 | 3 | 3 |
      | 10101 と 11110 | 3 | 3 |
      最小ハミング距離は d＝3 です。誤りを検出できるのは d−1＝2 ビットまで，訂正できるのは ⌊(d−1)／2⌋＝1 ビットまでです。
    why:
      - 正解です。最小距離 3 から，検出は d−1＝2 ビット，訂正は 1 ビットです。
      - 最小距離は正しいが，検出できるビット数を d と誤解した結果です。検出できるのは d−1 ビットまでで，3 ビットの誤りは別の符号語に化ける可能性があります。
      - 検出能力は正しいが，訂正できるビット数を検出と同じ 2 ビットと誤解した結果です。2 ビット誤ると別の符号語の方が近くなる場合があり，訂正は ⌊(d−1)／2⌋ ビットまでです。
      - 最大の距離（4）を最小距離と取り違えた誤りです。能力を決めるのは最も近い符号語どうしの距離，つまり最小値です。
    know: 最小ハミング距離 d の符号は，d−1 ビットまでの誤りを検出でき，⌊(d−1)／2⌋ ビットまでの誤りを訂正できます。能力は最も近い符号語の組で決まります。検出と訂正を同時に最大にはできません。
    terms: [ハミング距離, ハミング符号]
    verify: { manual: '全6組を再計算 00000-01011=3, 00000-10101=3, 00000-11110=4, 01011-10101=4(排他的論理和11110), 01011-11110=3(10101), 10101-11110=3(01011)。最小3，検出2，訂正1' }

  - id: A01-608
    topic: 1-4-1-4
    diff: 4
    q: |
      データ 4 ビット（d1 d2 d3 d4）に 3 ビットの検査ビット（p1 p2 p3）を付加したハミング符号を，p1 p2 d1 p3 d2 d3 d4 の順に並べて 7 ビットの符号語とする。偶数パリティで，検査ビットは次のとおり定める。
      ```
      p1 ＝ d1 ⊕ d2 ⊕ d4   （1，3，5，7 番目のビットの排他的論理和が 0）
      p2 ＝ d1 ⊕ d3 ⊕ d4   （2，3，6，7 番目のビットの排他的論理和が 0）
      p3 ＝ d2 ⊕ d3 ⊕ d4   （4，5，6，7 番目のビットの排他的論理和が 0）
      ```
      受信した 7 ビット 0110001 に 1 ビットの誤りがあるとき，誤りを訂正して得られるデータ（d1 d2 d3 d4）はどれか。受信側では，1，3，5，7 番目の検査結果を s1，2，3，6，7 番目を s2，4，5，6，7 番目を s3（排他的論理和が 1 なら 1）とし，s3 s2 s1 を 2 進数と読んだ値が誤りのビットの位置を表す。
    c: ['1011', '1001', '0001', '1101']
    a: ア
    scope: 1-4-1-4 誤り検出・訂正（ハミング符号）。シンドロームから誤り位置を求めて 1 ビット訂正する手順は，ハミング符号の動作原理そのものであり，必要な規則は問題文で与えている。
    prereq: 排他的論理和，偶数パリティ，ハミング符号のシンドロームによる誤り位置の特定
    hard: 3 組の検査結果を計算し，シンドロームの並び（s3 s2 s1）から位置を求め，訂正後に検査ビットを除いてデータ部を取り出す多段階の処理が必要。
    exp: |
      受信語のビットを位置 1〜7 で並べます。
      | 位置 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | 役割 | p1 | p2 | d1 | p3 | d2 | d3 | d4 |
      | 受信 | 0 | 1 | 1 | 0 | 0 | 0 | 1 |
      s1＝位置 1，3，5，7 → 0⊕1⊕0⊕1＝0。s2＝位置 2，3，6，7 → 1⊕1⊕0⊕1＝1。s3＝位置 4，5，6，7 → 0⊕0⊕0⊕1＝1。
      s3 s2 s1＝110（2 進）＝6 なので，6 番目のビットが誤りです。6 番目を反転すると符号語は 0110011 になり，データ部（位置 3，5，6，7）は d1 d2 d3 d4＝1 0 1 1 です。
    why:
      - 正解です。シンドローム 110（＝6）の位置 6 を反転して，データは 1011 です。
      - 誤りを訂正せず，受信したデータ位置（3，5，6，7）のビットをそのまま取り出した誤りです。d3 が 0 のままになっています。
      - s1 s2 s3 の順に読んで 011（＝3）と解釈し，3 番目のビット（d1）を誤って反転した結果です。位置は s3 s2 s1 の順に読みます。
      - s2 と s1 を入れ替えて 101（＝5）と読み，5 番目のビット（d2）を誤って反転した結果です。誤りの位置は 6 番目（d3）です。
    know: ハミング符号では検査ビットを 2 の冪乗の位置（1，2，4）に置くと，シンドロームの値が誤りビットの位置を直接示します。シンドローム 0 は誤りなし。訂正後に検査ビットを取り除いてデータを取り出すことを忘れないようにします。
    terms: [ハミング符号, 偶数パリティ]
    verify:
      value: |
        (() => { const r = '0110001'.split('').map(Number); const b = i => r[i-1]; const s1 = b(1)^b(3)^b(5)^b(7), s2 = b(2)^b(3)^b(6)^b(7), s3 = b(4)^b(5)^b(6)^b(7); const pos = s3*4 + s2*2 + s1; if (pos) r[pos-1] ^= 1; return Number([r[2], r[4], r[5], r[6]].join('')); })()

  - id: A01-609
    topic: 1-3-6
    diff: 2
    q: |
      2 進数の文字列を上位ビットから 1 ビットずつ読む有限オートマトンがある。状態は A，B，C の 3 つで，開始状態は A，受理状態は A である。状態遷移は次の表のとおりである。
      | 状態 | 入力 0 | 入力 1 |
      | --- | --- | --- |
      | A | A | B |
      | B | C | A |
      | C | B | C |
      このオートマトンが受理する入力文字列はどれか。
    c: ['1001', '1011', '1101', '1110']
    a: ア
    scope: 1-3-6 オートマトン（有限オートマトン，状態遷移）。状態遷移表に従って入力列をたどり，受理状態で終わるかを判定する問題で，範囲内の基本技能である。
    prereq: 有限オートマトンの状態遷移表の読み方，受理状態の意味
    exp: |
      開始状態 A から入力を 1 文字ずつ読んで遷移をたどり，最後に受理状態 A にいるかを調べます。
      | 入力列 | 遷移 | 終了状態 |
      | --- | --- | --- |
      | 1001 | A→B→C→B→A | A（受理） |
      | 1011 | A→B→C→C→C | C |
      | 1101 | A→B→A→A→B | B |
      | 1110 | A→B→A→B→C | C |
      終了状態が A になるのは 1001 だけです。なお，このオートマトンは 3 の倍数（1001＝9）を受理するように作られています。
    why:
      - 正解です。A→B→C→B→A とたどって受理状態 A で終わります（9 は 3 の倍数）。
      - 状態 C で入力 1 を読んだときの遷移を，状態 B の場合（A に戻る）と混同した誤りです。実際は C に留まり，C で終わるため受理されません。
      - 状態 A で入力 1 を読むと B に移ることを見落とし，最後の入力 1 で A に戻ると誤認した結果です。実際は B で終わり受理されません。
      - 状態 B で入力 0 を読んだときに A に戻ると誤認した結果です。実際は C に移るため，C で終わり受理されません。
    know: 有限オートマトンは，状態遷移表または状態遷移図に従って入力を読み，終了時に受理状態にいれば受理します。途中で受理状態を通っても，最後に受理状態でなければ受理しません。
    terms: [有限オートマトン, 状態遷移]
    verify:
      value: |
        (() => { const t = {A:{0:'A',1:'B'}, B:{0:'C',1:'A'}, C:{0:'B',1:'C'}}; const ok = s => s.split('').reduce((st, ch) => t[st][ch], 'A') === 'A'; return Number(['1001','1011','1101','1110'].find(ok)); })()
