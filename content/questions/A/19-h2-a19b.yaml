  method: 独立レビュー担当が解答を伏せて全問を自力解答・検算し、正答の一意性・誤答の検証と既存問題との重複確認を実施。A19-511 の誤答の値と解説の導出を実計算に合う形へ差し替え、実文引用付きの再確認で全件の整合を検証済み
questions:
  - id: A19-510
    topic: 19-3-2
    diff: 3
    scope: 19-3-2 Web マーケティングの指標。広告費、クリック数、コンバージョン率から購入件数を経て、顧客獲得単価 （CPA）を求める問題
    prereq: コンバージョン数はクリック数にコンバージョン率を掛けたもの、CPA は広告費をコンバージョン数で割ること、クリック単価 （CPC）は広告費をクリック数で割ること
    hard: CPC と CPA という似た指標を混同しないよう、計算の段階を分けて進める必要がある。コンバージョン率の適用先も問われる。
    q: |
      ある EC サイトが、リスティング広告に 240 万円を投じた。その結果、クリック数は 12,000 件、クリックから購入に至る割合 （コンバージョン率）は 2.5 ％であった。顧客獲得単価 （CPA： 購入 1 件当たりの広告費）は何円か。
    c:
      - '8000'
      - '20000'
      - '800'
      - '200'
    a: ア
    exp: |
      段階を分けて計算します。
      - 購入件数： 12,000 × 0.025 ＝ 300 件
      - CPA： 2,400,000 ÷ 300 ＝ 8,000 円
      なお、広告費 ÷ クリック数 ＝ 200 円は、クリック単価（CPC）であり、CPA とは別の指標です。
    why:
      - 正解です。購入 300 件で割った 8,000 円が CPA です。
      - 購入件数を 120 件とした場合の値です。購入件数は 12,000 × 2.5 ％ ＝ 300 件です。
      - コンバージョン率を 25 ％として購入件数を 3,000 件とした場合の値です。本問のコンバージョン率は 2.5 ％です。
      - クリック単価（CPC）です。CPA は購入 1 件当たりの費用であり、分母がクリック数ではなく購入件数です。
    know: デジタル広告の指標は、CPC （クリック単価） → コンバージョン数 → CPA （獲得単価）の順に積み上がる。分母に何を使うかが指標の違いであり、計算では段階を分けることが要点である。
    terms:
      - CPA
      - コンバージョン率
      - CPC
    verify:
      type: value
      value: 8000
  - id: A19-511
    topic: 19-3-2
    diff: 3
    scope: 19-3-2 顧客生涯価値 （LTV）と顧客獲得コスト （CAC）の関係。継続期間と年間粗利から LTV を求め、獲得コストとの比で健全性を判断する問題
    prereq: LTV は、顧客が継続期間にもたらす粗利の合計で見積もること、事業の健全性の目安として LTV が CAC を十分に上回ることが求められること
    hard: 売上ではなく粗利で数えることと、継続期間を掛けることの両方を処理した上で、比の意味 （獲得にかけた費用を回収できるか）を判断する必要がある。
    q: |
      定額制サービスで、顧客 1 人当たりの年間の粗利は 3 万円、平均の継続期間は 4 年、新規顧客 1 人の獲得にかかるコスト （CAC）は 2.4 万円である。顧客生涯価値 （LTV）と CAC の比 （LTV ÷ CAC）はいくつか。ここで、LTV は年間粗利に継続期間を掛けた単純な合計とする。
    c:
      - '0.2'
      - '1.25'
      - '4'
      - '5'
    a: エ
    exp: |
      - LTV ＝ 3 万円 × 4 年 ＝ 12 万円
      - LTV ÷ CAC ＝ 12 ÷ 2.4 ＝ 5
      獲得にかけた費用の 5 倍の粗利が見込める水準であり、獲得コストを十分に回収できる健全な状態と判断されます。間違えやすいのは、LTV を年間の売上や粗利だけで済ませて継続期間を掛け忘れる点と、比の向き （LTV ÷ CAC か CAC ÷ LTV か）を取り違える点です。
    why:
      - CAC を LTV で割る、比の向きを取り違えた場合の値（2.4 ÷ 12 ＝ 0.2）です。本問で問われているのは LTV ÷ CAC です。
      - 継続期間を掛けずに、年間の粗利 3 万円をそのまま LTV とした場合の値（3 ÷ 2.4 ＝ 1.25）です。LTV は継続期間を通した合計です。
      - 継続期間の 4 年を、そのまま比の値と読み替えた値です。比は LTV ÷ CAC で求めます。
      - 正解です。LTV 12 万円 ÷ CAC 2.4 万円 ＝ 5 です。
    know: LTV と CAC の比は、顧客獲得の投資が回収できるかを示す指標。LTV は売上ではなく粗利で、継続期間を通して見積もる点が、計算の要点である。
    terms:
      - LTV
      - CAC
      - 粗利
    verify:
      type: value
      value: 5
  - id: A19-512
    topic: 19-1-2
    diff: 3
    scope: 19-1-2 ブルーオーシャン戦略。既存市場の競争の軸を取り合うのではなく、コストと差別化を同時に実現して新しい需要を開く考え方の判断
    prereq: ブルーオーシャンは、競争のない新しい市場空間を創り出す考え方であり、バリューイノベーション（価値革新）によって差別化と低コストを同時に追求すること
    hard: 「低価格にする」だけでも「差別化する」だけでもなく、業界の常識的な取捨選択を変えることで両方を同時に実現する点を見抜く必要がある。
    q: |
      ある娯楽施設は、競合施設との間で、設備の豪華さと料金の安さを巡る競争が激しくなっていた。そこで同施設は、高価格帯の利用者が重視する一部の設備を思い切ってやめる一方、低価格帯の利用者がこれまで諦めていた新しい体験の要素を加え、コストを下げながら独自の価値を打ち出すことにした。この考え方に最も近いものはどれか。
    c:
      - 差別化戦略： 独自の特徴に費用をかけ、高い価格でも選ばれる状態を作る
      - コストリーダーシップ戦略： 業界内で最も低いコストを実現し、価格で競合に勝つ
      - 集中戦略： 特定の狭い市場に絞り、その中で競争優位を築く
      - ブルーオーシャン戦略： 競争の軸そのものを組み替え、差別化と低コストを同時に実現して新しい需要を創る
    a: エ
    exp: |
      この施策は、業界の常識だった要素を「やめる」ことと新しい要素を「加える」ことを同時に行い、コストの削減と独自の価値の創出を両立させています。これは、既存市場の競争から離れて新しい需要の空間を創るブルーオーシャン戦略の考え方 （バリューイノベーション）です。低コストだけを追求するならコストリーダーシップ、独自性に費用をかけるなら差別化ですが、本件は取捨選択の組替えによる両立である点が決定打です。
    why:
      - 差別化だけなら、コストは上がる方向になります。本件ではやめる判断でコストも下げています。
      - 価格競争で勝つことだけが目的ではなく、新しい体験という独自の価値も加えています。
      - 市場を狭く絞る話ではなく、需要の作り方そのものを変える話です。
      - 正解です。要をやめることと新しい要素を加えることの組替えで、差別化と低コストを同時に狙っています。
    know: ブルーオーシャン戦略の核心は、差別化か低コストかの二者択一を崩し、要素の取捨選択 （減らす・やめる・増やす・加える）を組み替えて両立させる点にある。ポーターの基本戦略との区別が要点である。
    terms:
      - ブルーオーシャン戦略
      - バリューイノベーション
      - 差別化戦略
    verify:
      manual: 施策の要素（設備をやめることによるコスト削減と、新しい体験の追加による独自価値）を各戦略の定義と照合し、両立を狙うバリューイノベーション＝ブルーオーシャンだけが一致すること、基本戦略はいずれか一方の追求であることを確認した。
  - id: A19-513
    topic: 19-1-2
    diff: 3
    scope: 19-1-2 ポーターの 5 つの競争要因（ファイブフォース）。具体的な出来事が、どの競争要因に当たるかを分類する問題
    prereq: 5 つの要因は、業界内の競争、参入の脅威、代替品の脅威、買い手の交渉力、売り手の交渉力であり、出来事の「誰が、誰に対して力を及ぼすのか」で分類すること
    hard: 値下げ要求や競合の登場といった現象を、表面ではなく力関係の向きで分類する必要がある。特に、顧客側の力が強まる話と、別業界の製品に需要を奪われる話の区別が問われる。
    q: |
      ある部品メーカの業界で起きた次の出来事のうち、「代替品の脅威」に分類されるものはどれか。
    c:
      - 顧客がこれまで使っていた金属部品を、より安くて軽い樹脂製の別素材の部品に置き換え始めた
      - 大手の完成品メーカが、部品の調達先を集約し、価格の引下げを強く要求するようになった
      - 海外の新しいメーカが、同じ種類の部品でこの市場に参入してきた
      - 部品の原料を供給する化学メーカが値上げを発表し、部品メーカ各社が受け入れざるを得なくなった
    a: ア
    exp: |
      ファイブフォースの分類は「力の出どころ」で行います。樹脂製の別素材への置き換えは、異なる製品 （代替品）が自社の製品の需要を奪う話であり、代替品の脅威です。完成品メーカの価格要求は顧客側の力、すなわち買い手の交渉力です。海外メーカの参入は新規参入の脅威、原料メーカの値上げは売り手 （供給業者）の交渉力に当たります。
    why:
      - 正解です。別素材の製品への需要の移行は、代替品の脅威です。
      - 顧客が価格を要求する力を強める話であり、買い手の交渉力に分類されます。
      - 同じ種類の製品での参入は、新規参入の脅威に分類されます。
      - 供給側が価格を決める力を強める話であり、売り手の交渉力に分類されます。
    know: ファイブフォースの分類は、出来事の見た目ではなく「誰の力が強まっているか」で行う。代替品は別業界・別素材の製品が需要を奪う場合、買い手・売り手は取引相手の交渉力の場合、という切り分けが要点である。
    terms:
      - ファイブフォース
      - 代替品
    verify:
      manual: 4つの出来事について力の出どころ（別素材の製品、顧客、参入者、供給業者）を特定し、代替品の脅威に当たるのが樹脂製部品への置き換えだけであることを確認した。
  - id: A19-514
    topic: 19-1-3-2
    diff: 3
    scope: 19-1-3-2 コアコンピタンス。企業の中核となる強みが満たすべき条件 （顧客への価値、競合との差別化、模倣の難しさ、他の事業への展開可能性）を状況から判断する問題
    prereq: コアコンピタンスは、顧客に価値を提供し、競合が真似しにくく、複数の事業に応用できる能力であること
    hard: 4つの候補が、それぞれ異なる理由で条件を欠いている （真似しやすい、他事業に使えない、顧客価値に直結しない）ことを切り分ける必要がある。
    q: |
      ある食品メーカの能力のうち、コアコンピタンスとして最も適切なものはどれか。
    c:
      - 最新の生産設備を導入したことで、業界平均より少しだけ速く生産できるようになった
      - 長年の発酵技術の蓄積によって生まれた独自の風味を出す製法で、他社が再現できず、調味料や飲料など複数の製品分野に応用でき、顧客の支持も厚い
      - 本社の立地が良く、取引先が訪問しやすい
      - 特定のベテラン社員が持つ、属人的な営業の勘と人脈
    a: イ
    exp: |
      コアコンピタンス （中核となる強み）には、顧客にとっての価値があること、競合との差別化になっていること、簡単には模倣できないこと、他の事業や製品へ展開できること、といった条件が求められます。発酵技術に基づく製法は、蓄積の上に立つため模倣が難しく、複数の製品分野へ応用でき、顧客の支持という価値も伴うため、条件を満たします。設備による生産速度は導入すれば他社も追いつけるため模倣が容易であり、立地は顧客価値に直結する能力とはいえず、人脈や勘は個人に固定されて組織の能力として展開できません。
    why:
      - 設備は購入すれば他社も導入できるため、模倣の難しさの条件を満たしません。
      - 正解です。価値、差別化、模倣の難しさ、展開可能性の条件を全て満たします。
      - 立地の良さは、顧客への価値を提供する組織的な能力とはいえません。
      - 属人的な勘と人脈は、その社員の退職で失われ、組織の能力として蓄積・展開できません。
    know: コアコンピタンスの判定は、強みの列挙ではなく条件への当てはまりで行う。「模倣できるか」「他の事業に使えるか」「組織に蓄積されているか」という問いの立て方が要点である。
    terms:
      - コアコンピタンス
    verify:
      manual: コアコンピタンスの4条件（顧客価値、差別化、模倣困難性、展開可能性）と4候補を照合し、発酵技術の製法だけが全条件を満たすこと、他の候補がそれぞれ異なる条件で落ちることを確認した。
  - id: A19-515
    topic: 19-1-3-2
    diff: 3
    scope: 19-1-3-2 垂直統合。川上 （原材料・部品供給）への統合と川下 （販売・流通）への統合の向きと、それぞれの狙いの判断
    prereq: 垂直統合は、バリューチェーンの前後の段階を自社に取り込むことであり、川上への統合は供給の安定、川下への統合は顧客との接点や流通の掌握が狙いになること
    hard: 買収した相手がバリューチェーンのどちら側にあるかを見極め、統合の向きと狙いを対応付ける必要がある。同業者の買収（水平統合）との区別も問われる。
    q: |
      完成品メーカの A 社が、主要部品を供給していた部品メーカを買収し、自社のグループに取り込んだ。この動きの分類と狙いの組合せとして、正しいものはどれか。
    c:
      - 水平統合であり、同業者を減らして市場シェアを高めることが狙いである
      - 川下への垂直統合であり、販売チャネルを直接握ることが狙いである
      - 川上への垂直統合であり、部品の供給の安定と、品質や納期の統制が狙いである
      - 多角化であり、無関係な事業へ進出してリスクを分散することが狙いである
    a: ウ
    exp: |
      部品メーカは、完成品メーカにとってバリューチェーンの川上 （供給側）に当たります。これを自社に取り込むのは川上への垂直統合であり、部品の調達を安定させ、品質や納期、原価を直接統制できることが狙いです。川下への統合は、販売店や流通の買収の場合であり、同業者の買収は水平統合、全く別の事業への進出は多角化 （非関連型）に当たります。
    why:
      - 相手は同業の完成品メーカではなく部品メーカであり、水平統合ではありません。
      - 買収した相手は販売側ではなく供給側であるため、川下への統合ではありません。
      - 正解です。供給側の取り込みは川上への垂直統合で、狙いは供給の安定と統制です。
      - 相手は自社の事業と前後の関係にある事業であり、無関係な事業への進出ではありません。
    know: 統合の分類は、買収相手がバリューチェーンのどこにいるかで決まる。供給側なら川上、販売側なら川下、同業なら水平、という切り分けが、戦略の用語の要点である。
    terms:
      - 垂直統合
      - バリューチェーン
    verify:
      manual: 買収相手のバリューチェーン上の位置（供給側＝川上）と統合の分類を照合し、狙い（供給の安定と統制）と一致するのがアだけであることを確認した。
  - id: A19-516
    topic: 19-3-2
    diff: 3
    scope: 19-3-2 定額制サービスの解約率と平均継続期間。月次の解約率が一定のとき、顧客が平均して何か月継続するかを計算する問題
    prereq: 毎月一定の割合で解約が進む場合、平均継続期間は解約率の逆数（1 ÷ 解約率）になること
    hard: 解約率を「契約者の減少の速さ」として捉え、残存のイメージから逆数を導く必要がある。百分率への換算も問われる。
    q: |
      定額制サービスで、契約者の月次の解約率が 4 ％で一定しているとする。契約者が平均して継続する期間は、何か月か。
    c:
      - '40'
      - '25'
      - '96'
      - '12.5'
    a: イ
    exp: |
      毎月、契約者の 4 ％が解約していく場合、平均継続期間は解約率の逆数になります。

      1 ÷ 0.04 ＝ 25 か月

      直感的には、毎月 25 分の 1 ずつ減っていくため、平均すると 25 か月で入れ替わるという計算です。解約率を下げることが、そのまま継続期間の延長 （顧客生涯価値の向上）につながります。
    why:
      - 解約率を 2.5 ％として計算した場合の値です。本問では 4 ％が与えられています。
      - 正解です。1 ÷ 0.04 ＝ 25 か月です。
      - 解約しない割合 （96 ％）を、そのまま期間の数値として読み替えた値です。期間は解約率の逆数で求めます。
      - 解約率を 8 ％として計算した場合の値です。本問の解約率は 4 ％です。
    know: 一定の解約率の下での平均継続期間は、解約率の逆数で求められる。解約率の改善が継続期間と顧客生涯価値にどう効くかを見積もる際の、基本の計算である。
    terms:
      - チャーン率
      - 解約率
      - LTV
    verify:
      type: value
      value: 25
  - id: A19-517
    topic: 19-2-1-1
    diff: 3
    scope: 19-2-1-1 プロダクトライフサイクルと価格戦略。導入期に高価格で投入して早期に投資を回収するスキミングプライシングと、低価格で普及を急ぐペネトレーションプライシングの使い分けの判断
    prereq: スキミング （上澄み）価格は、価格に敏感でない層から高い利益率で回収する方法であり、代替のない独自性がある場合に機能すること、ペネトレーション価格は普及とシェアの獲得を優先する方法であること
    hard: 製品の特性 （独自性が高く模倣されにくい）と市場の状態から、どちらの価格戦略が合うかを選ぶ必要がある。一般に「安いほうが売れる」という直感を、条件で上書きできるかが問われる。
    q: |
      新しい製品を市場に投入する。製品には特許で守られた独自技術が使われており、当面は競合品が現れにくく、価格が高くても購入する熱心な顧客層が見込める。この状況に合う価格戦略はどれか。
    c:
      - ペネトレーションプライシング： 低い価格で投入し、急速に普及させてシェアを獲得する
      - プライスライニング： 数段階の価格の棚を用意し、顧客に選ばせる
      - スキミングプライシング： 高い価格で投入し、価格に敏感でない層から早期に投資を回収する
      - コストプラス法： 原価に一定の利益率を上乗せして価格を決める
    a: ウ
    exp: |
      独自技術で守られ、模倣されにくく、価格に敏感でない顧客層が見込める状況は、スキミングプライシング （上澄み価格）に向いています。高い価格で投入し、熱心な層から早期に投資を回収し、その後は価格を下げながら層を広げていく方法です。ペネトレーションプライシングは、逆に低価格で普及を急ぎ、シェアや標準の獲得を優先する場合の方法であり、価格に敏感な市場や、普及そのものが競争力になる場合に合います。
    why:
      - 低価格で普及を狙う方法であり、本件のように高価格でも買う層がいる状況の利点を活かせません。
      - 価格の段階の設定の話であり、投入時の価格水準の戦略とは別の論点です。
      - 正解です。独自性と価格に敏感でない層という条件が、スキミングの成立条件に合います。
      - 原価からの価格決定の方法であり、市場や顧客層の条件に基づく戦略の選択ではありません。
    know: 価格戦略は、製品の独自性と顧客の価格感応度で選ぶ。スキミングは「高くても買う層 ＋ 模倣の遅れ」、ペネトレーションは「普及の速さが競争力」という、それぞれの成立条件が要点である。
    terms:
      - スキミングプライシング
      - ペネトレーションプライシング
      - プロダクトライフサイクル
    verify:
      manual: 状況の条件（特許による独自性、模倣の遅れ、価格に敏感でない層）と各価格戦略の成立条件を照合し、スキミングプライシングだけが条件に一致することを確認した。
