questions:
  - id: A22-501
    topic: 22-3-1-1
    diff: 3
    scope: 22-3-1-1 財務会計の損益分岐点分析。変動費率と固定費から損益分岐点売上高を求め、実際の売上高と比べる安全余裕率の計算であり、範囲内。
    prereq: 限界利益率（1 − 変動費率）と損益分岐点売上高 ＝ 固定費 ÷ 限界利益率 の関係
    hard: 損益分岐点売上高を求める中間ステップを経て、損益分岐点比率と安全余裕率の違い（分母と意味）を区別する必要がある。
    q: |
      ある事業の当期の売上高は 8,000 万円、変動費率は 60％、固定費は 2,400 万円である。この事業の安全余裕率は何％か。
    c: ['25', '40', '75', '33']
    a: ア
    exp: |
      安全余裕率は、実際の売上高が損益分岐点売上高をどれだけ上回っているかを示します。まず損益分岐点売上高を求めます。
      - 限界利益率 ＝ 1 − 変動費率 ＝ 1 − 0.6 ＝ 0.4
      - 損益分岐点売上高 ＝ 固定費 ÷ 限界利益率 ＝ 2,400 ÷ 0.4 ＝ 6,000 万円
      - 安全余裕率 ＝ （売上高 − 損益分岐点売上高） ÷ 売上高 ＝ （8,000 − 6,000） ÷ 8,000 ＝ 0.25
      したがって 25％ です。売上が 25％ 減るまでは赤字にならないことを意味します。
    why:
      - 正解です。損益分岐点売上高 6,000 万円との差 2,000 万円を、売上高 8,000 万円で割った値です。
      - 限界利益率（1 − 変動費率）そのものです。安全余裕率とは別の指標です。
      - 損益分岐点比率（6,000 ÷ 8,000）の値です。安全余裕率はこれを 100％ から引いた残りです。
      - 差額 2,000 万円を損益分岐点売上高 6,000 万円で割った値です。分母は実際の売上高でなければなりません。
    know: 安全余裕率と損益分岐点比率は合計が 100％ になる対の指標。安全余裕率が高いほど、売上の減少に対する余裕が大きい。分母はどちらも実際の売上高である。
    terms: [損益分岐点, 安全余裕率, 限界利益]
    verify: { value: '(8000 - 2400 / (1 - 0.6)) / 8000 * 100' }

  - id: A22-502
    topic: 22-3-1-1
    diff: 3
    scope: 22-3-1-1 財務会計の損益分岐点分析の応用。限界利益と営業利益の比である営業レバレッジ係数を使い、売上変動に対する営業利益の変動を予測する計算であり、範囲内。
    prereq: 限界利益 ＝ 売上高 − 変動費、営業利益 ＝ 限界利益 − 固定費 の関係
    hard: 売上高の増加額に限界利益率を掛ける経路と、営業レバレッジ係数を経由する経路のどちらでも検証でき、固定費が変わらない前提を見抜く必要がある。
    q: |
      ある事業の売上高は 5,000 万円、変動費は 3,500 万円、固定費は 1,200 万円である。固定費が変わらないまま売上高が 8％ 増加すると、営業利益は何万円になるか。
    c: ['420', '324', '1,620', '700']
    a: ア
    exp: |
      営業レバレッジ係数を使うと、固定費が変わらないときの利益の増え方を予測できます。
      - 限界利益 ＝ 5,000 − 3,500 ＝ 1,500 万円、営業利益 ＝ 1,500 − 1,200 ＝ 300 万円
      - 営業レバレッジ係数 ＝ 限界利益 ÷ 営業利益 ＝ 1,500 ÷ 300 ＝ 5
      - 営業利益の増加率 ＝ 8％ × 5 ＝ 40％
      - 新しい営業利益 ＝ 300 × 1.4 ＝ 420 万円
      検算すると、新しい売上高 5,400 万円 × 限界利益率 0.3 ＝ 1,620 万円から固定費 1,200 万円を引いても 420 万円になります。
    why:
      - 正解です。売上の増加率に営業レバレッジ係数 5 を掛け、営業利益が 40％ 増えるためです。
      - 営業利益も売上高と同じ 8％ だけ増えると考えた値です。固定費が変わらないため、利益の増加率は売上より大きくなります。
      - 増加後の限界利益（5,400 × 0.3）の値です。ここから固定費 1,200 万円を差し引く必要があります。
      - 売上高の増加額 400 万円がそのまま利益になると考え、300 万円に加えた値です。増加額のうち変動費の分は利益になりません。
    know: 営業レバレッジ係数 ＝ 限界利益 ÷ 営業利益。固定費の比率が大きい事業ほど係数が大きく、売上の変動が利益に増幅されて現れる。固定費が変わらない前提でのみ使える。
    terms: [限界利益, 営業レバレッジ]
    verify: { value: '300 * (1 + 0.08 * (1500 / 300))' }

  - id: A22-503
    topic: 22-3-4
    diff: 4
    scope: 22-3-4 資金管理・設備投資の経済性計算。割引率で将来キャッシュフローを割り引く正味現在価値法による投資案の評価であり、範囲内。
    prereq: 現在価値の考え方、年金現価係数を用いた等額キャッシュフローの割引計算
    hard: 年金現価係数で 4 年分のキャッシュフローの現在価値をまとめ、初期投資額と比較して符号まで正しく判定する必要がある。年数を取り違えた係数との区別も要る。
    q: |
      初期投資額 10,000 千円の設備投資案がある。投資の効果として、各年とも年末に 3,000 千円のキャッシュフローが 4 年間得られる。割引率を 10％、4 年・10％ の年金現価係数を 3.170 とするとき、この投資案の正味現在価値は何千円か。
    c: ['-490', '2,000', '-2,539', '490']
    a: ア
    exp: |
      正味現在価値（NPV）は、将来キャッシュフローの現在価値の合計から初期投資額を引いたものです。
      - 毎年のキャッシュフローが等額なので、現在価値の合計 ＝ 3,000 × 3.170 ＝ 9,510 千円
      - NPV ＝ 9,510 − 10,000 ＝ −490 千円
      NPV が負なので、この投資案は割引率 10％ の要求水準では採算が取れず、採用すべきではありません。
    why:
      - 正解です。現在価値 9,510 千円が初期投資額 10,000 千円に届かず、差額は −490 千円です。
      - 割引計算をせず、単純合計 12,000 千円から初期投資額を引いた値です。将来のお金の時間的価値を無視しています。
      - 3 年分の年金現価係数 2.487 を使った場合の値（3,000 × 2.487 − 10,000）です。期間は 4 年です。
      - 差額の符号を取り違えた値です。現在価値が初期投資額を下回るので、NPV は負になります。
    know: 正味現在価値法では NPV ＞ 0 の投資案を採用する。等額のキャッシュフローが続く場合は年金現価係数でまとめて割り引ける。回収期間法と違い、時間的価値と全期間のキャッシュフローを反映できる。
    terms: [NPV, 回収期間法]
    verify: { value: '3000 * 3.170 - 10000' }

  - id: A22-504
    topic: 22-3-2
    diff: 3
    scope: 22-3-2 財務分析。売上債権・棚卸資産・買入債務の各回転期間からキャッシュコンバージョンサイクルを組み立てる計算であり、範囲内。
    prereq: 回転期間 ＝ 365 × 平均残高 ÷ 年間取引額（売上高または売上原価）という換算のしかた
    hard: 3 つの回転期間をそれぞれ正しい分母（売上債権は売上高、棚卸資産と買入債務は売上原価）で求め、買入債務だけを差し引く符号の向きを判断する必要がある。
    q: |
      ある企業の売上高は 36,500 万円、売上原価は 29,200 万円、平均売上債権は 3,000 万円、平均棚卸資産は 2,400 万円、平均買入債務は 1,600 万円である。1 年を 365 日として、キャッシュコンバージョンサイクルは何日か。
    c: ['40', '60', '80', '20']
    a: ア
    exp: |
      キャッシュコンバージョンサイクルは、仕入れから販売代金の回収までに現金が拘束される期間です。各回転期間を求めます。
      - 売上債権回転期間 ＝ 365 × 3,000 ÷ 36,500 ＝ 30 日
      - 棚卸資産回転期間 ＝ 365 × 2,400 ÷ 29,200 ＝ 30 日
      - 買入債務回転期間 ＝ 365 × 1,600 ÷ 29,200 ＝ 20 日
      - キャッシュコンバージョンサイクル ＝ 30 ＋ 30 − 20 ＝ 40 日
      買入債務の分だけ支払いが後になるので、その期間は差し引きます。
    why:
      - 正解です。売上債権 30 日と棚卸資産 30 日の合計から、買入債務 20 日を差し引いた値です。
      - 買入債務回転期間を差し引くのを忘れた値です。仕入れ代金の支払猶予は現金の拘束を短くします。
      - 3 つの回転期間をすべて加えた値です。買入債務は加算ではなく差し引く方向です。
      - 買入債務回転期間の値そのものです。各資産の回転期間を含めた合成が必要です。
    know: キャッシュコンバージョンサイクル ＝ 売上債権回転期間 ＋ 棚卸資産回転期間 − 買入債務回転期間。短いほど運転資金の負担が軽く、マイナスになる業態（先に代金を受け取る小売など）もある。
    terms: [キャッシュコンバージョンサイクル]
    verify: { value: '365 * 3000 / 36500 + 365 * 2400 / 29200 - 365 * 1600 / 29200' }

  - id: A22-505
    topic: 22-3-2
    diff: 3
    scope: 22-3-2 財務分析。自己資本利益率を売上高当期純利益率・総資産回転率・財務レバレッジに分解するデュポン分析で、財務レバレッジを自己資本比率から導く計算であり、範囲内。
    prereq: 財務レバレッジ ＝ 総資産 ÷ 自己資本 であり、自己資本比率の逆数になること
    hard: 自己資本比率 50％ から財務レバレッジ（その逆数の 2 倍）を導く段階を挟み、3 要素を正しい順序で組み合わせる必要がある。自己資本比率をそのまま掛ける誤りと区別する。
    q: |
      ある企業の売上高当期純利益率は 4％、総資産回転率は 1.25 回、自己資本比率は 50％ である。自己資本利益率は何％か。
    c: ['10', '5', '2.5', '8']
    a: ア
    exp: |
      自己資本利益率（ROE）は、デュポン分析によって3つの要素に分解できます。
      - ROE ＝ 売上高当期純利益率 × 総資産回転率 × 財務レバレッジ
      - 財務レバレッジ ＝ 総資産 ÷ 自己資本 ＝ 1 ÷ 自己資本比率 ＝ 1 ÷ 0.5 ＝ 2 倍
      - ROE ＝ 4 × 1.25 × 2 ＝ 10％
      負債を使って総資産を自己資本の 2 倍にしているため、総資産に対する利益率（4 × 1.25 ＝ 5％）が、自己資本に対しては 2 倍の 10％ になります。
    why:
      - 正解です。純利益率 4％、回転率 1.25 回、財務レバレッジ 2 倍の積で、10％ になります。
      - 財務レバレッジを掛ける前の値で、これは総資産利益率（ROA）に当たります。自己資本に対する率にはレバレッジが必要です。
      - 自己資本比率 0.5 をそのまま掛けた値です。レバレッジは自己資本比率の逆数なので、割る方向が逆です。
      - 総資産回転率を掛け忘れ、純利益率とレバレッジだけを組み合わせた値です。3 要素すべてが必要です。
    know: ROE は「売上高当期純利益率 × 総資産回転率 × 財務レバレッジ」に分解でき（デュポン分析）、収益性・効率性・負債の活用のどこで稼いでいるかを読み取れる。財務レバレッジは自己資本比率の逆数である。
    terms: [ROE]
    verify: { value: '4 * 1.25 * (1 / 0.5)' }

  - id: A22-506
    topic: 22-2-1-1
    diff: 3
    scope: 22-2-1-1 OR の輸送問題。北西角法（左上隅法）で初期実行可能解を作り、その総輸送費を計算する問題であり、範囲内。
    prereq: 輸送問題の供給量・需要量の制約、配分量 × 単位輸送費 の合計が総輸送費になること
    hard: 行と列の残量を管理しながら左上から順に配分を確定させる手順を追い、各セルへの配分量を間違えずに費用を積み上げる必要がある。
    q: |
      2 つの工場から 3 つの需要地へ製品を輸送する。工場 A の供給量は 40、工場 B の供給量は 60、需要地 X の需要量は 30、Y は 50、Z は 20 である。単位当たりの輸送費は、A から X が 5、Y が 8、Z が 6、B から X が 7、Y が 4、Z が 9 である。北西角法（左上隅法）で初期解を作ったときの総輸送費はいくらか。
    c: ['570', '500', '540', '750']
    a: ア
    exp: |
      北西角法は、表の左上（北西）のセルから順に、供給量と需要量の小さいほうを配分していく方法です。
      - A から X へ 30（X の需要が埋まり、A の残りは 10）
      - A から Y へ 10（A の供給が尽き、Y の残りは 40）
      - B から Y へ 40（Y の需要が埋まり、B の残りは 20）
      - B から Z へ 20（Z の需要が埋まる）
      総輸送費 ＝ 30 × 5 ＋ 10 × 8 ＋ 40 × 4 ＋ 20 × 9 ＝ 150 ＋ 80 ＋ 160 ＋ 180 ＝ 570 です。
    why:
      - 正解です。北西角法の配分（30、10、40、20）に各単位輸送費を掛けて合計した値です。
      - 単位輸送費の小さいセルから配分する最小費用法で作った初期解の総輸送費です。北西角法は費用を見ずに左上から配分します。
      - A から Y への単位輸送費を 5 と読み違えて計算した値です。そのセルの単価は 8 です。
      - A から Y へ先に 40 を配分するなど、左上からの順序に従わない配分の総輸送費です。
    know: 北西角法は輸送費を一切見ずに左上から機械的に配分するので、実行可能解は必ず得られるが、費用の良い解になるとは限らない。得られた初期解を改善して最適解を求めるのが輸送問題の解法の流れである。
    terms: [線形計画法]
    verify: { value: '30 * 5 + 10 * 8 + 40 * 4 + 20 * 9' }

  - id: A22-507
    topic: 22-2-1-4
    diff: 4
    scope: 22-2-1-4 OR の意思決定理論。各案の期待値を求めたうえで、完全情報の下での期待値との差である完全情報の価値を計算する問題であり、範囲内。
    prereq: 期待値 ＝ 各状態の利益 × 生起確率 の合計という計算
    hard: 最良案の期待値と完全情報下の期待値という 2 種類の期待値を別々に組み立て、その差を取る必要がある。状態ごとの最大値を選ぶ完全情報側の構成を取り違えやすい。
    q: |
      新製品の販売案 A と B を検討している。市場の状態は好況（確率 0.3）、普通（確率 0.5）、不況（確率 0.2）のいずれかになる。利益（万円）は、案 A が好況 900、普通 400、不況 −200、案 B が好況 600、普通 450、不況 100 である。完全情報の価値（完全情報の期待価値）は何万円か。
    c: ['85', '90', '515', '430']
    a: ア
    exp: |
      完全情報の価値は、「事前に状態が分かれば得られる期待値」と「分からないまま最良の案を選んだときの期待値」の差です。
      - 案 A の期待値 ＝ 900 × 0.3 ＋ 400 × 0.5 ＋ （−200） × 0.2 ＝ 270 ＋ 200 − 40 ＝ 430 万円
      - 案 B の期待値 ＝ 600 × 0.3 ＋ 450 × 0.5 ＋ 100 × 0.2 ＝ 180 ＋ 225 ＋ 20 ＝ 425 万円
      - 情報がない場合の最良は案 A で 430 万円です。
      - 完全情報があれば状態ごとに最良の案（好況は A の 900、普通は B の 450、不況は B の 100）を選べ、その期待値 ＝ 900 × 0.3 ＋ 450 × 0.5 ＋ 100 × 0.2 ＝ 515 万円
      - 完全情報の価値 ＝ 515 − 430 ＝ 85 万円。これが市場調査などに払える金額の上限になります。
    why:
      - 正解です。完全情報下の期待値 515 万円から、最良案の期待値 430 万円を引いた値です。
      - 完全情報下の期待値から、次善の案 B の期待値 425 万円を引いた値です。基準は最良案の期待値です。
      - 完全情報下の期待値そのものです。情報の価値は、現状の最良案との差額として求めます。
      - 情報がない場合の最良案（案 A）の期待値そのものです。完全情報で上積みできる分が価値になります。
    know: 完全情報の価値（EVPI）＝ 完全情報下の期待値 − 最良案の期待値。情報収集のコストがこの値を上回るなら、その調査には見合う価値がない。期待値だけでは測れない「情報そのものの価格」を与える指標である。
    terms: [期待値, 完全情報の価値]
    verify: { value: '(0.3 * 900 + 0.5 * 450 + 0.2 * 100) - (0.3 * 900 + 0.5 * 400 + 0.2 * (-200))' }

  - id: A22-508
    topic: 22-3-3
    diff: 2
    scope: 22-3-3 会計処理の減価償却。期首帳簿価額に一定率を掛ける定率法で、2 年目までの償却の進み方を計算する問題であり、範囲内。
    prereq: 定率法では未償却残高（期首帳簿価額）に償却率を掛けて各年の償却額を求めること
    q: |
      取得原価 1,200 万円の設備を、償却率 0.400 の定率法で減価償却する。残存価額は考慮しないものとして、取得から 2 年目までの減価償却費の累計額は何万円か。
    c: ['768', '960', '480', '672']
    a: ア
    exp: |
      定率法では、各年の償却額 ＝ 期首帳簿価額 × 償却率 で計算し、償却するほど帳簿価額が減るので償却額も年々小さくなります。
      - 1 年目 ＝ 1,200 × 0.400 ＝ 480 万円（期末帳簿価額は 720 万円）
      - 2 年目 ＝ 720 × 0.400 ＝ 288 万円
      - 累計額 ＝ 480 ＋ 288 ＝ 768 万円
    why:
      - 正解です。1 年目 480 万円と 2 年目 288 万円の合計です。
      - 毎年、取得原価に率を掛けて 480 万円ずつ償却した値です。定率法では 2 年目以降、取得原価ではなく期首帳簿価額に率を掛けます。
      - 1 年目の償却額だけの値です。2 年目までの累計が問われています。
      - 2 年目の償却額を、1 年目の償却額 480 万円に率を掛けて 192 万円とした場合の合計です。率を掛けるのは帳簿価額のほうです。
    know: 定率法は期首帳簿価額に一定率を掛けるため、償却額は年々減少する（費用の早期計上）。定額法は取得原価を耐用年数で割り、毎年同額になる。両者の違いは「掛ける対象が残高か原価か」にある。
    terms: [減価償却, 定額法]
