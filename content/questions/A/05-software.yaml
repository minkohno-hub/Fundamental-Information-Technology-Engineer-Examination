  method: 作成後の逐問レビュー（OS・ミドルウェアの定義をシラバスVer.9.2の用語例と照合、ページ置換などは検算用の関数で独立に再計算）
questions:
  - id: A05-001
    topic: 5-1-1
    diff: 2
    q: セキュア OS の特徴として，適切なものはどれか。
    c:
      - 利用者がソースコードを自由に入手して改変できる。
      - スマートフォンなどの携帯端末で動作するように設計されている。
      - 強制アクセス制御などの機能により，管理者権限をもつ利用者であっても，定められた範囲を超える操作をできないようにする。
      - 1台のコンピュータで複数の OS を同時に動作させる。
    a: ウ
    exp: |
      セキュア OS は、強制アクセス制御（MAC）や最小特権の考え方を取り入れ、通常の OS よりもセキュリティを強化した OS です。管理者（root）であっても、セキュリティポリシーで許可されていない操作はできないため、管理者権限を奪われた場合の被害を限定できます。SELinux などが例です。
    why:
      - ソースコードを自由に入手・改変できるのはオープンソースの OS の特徴です。
      - 携帯端末向けに設計されているのはモバイル端末用 OS（Android や iOS など）です。
      - 正解です。強制アクセス制御で管理者の権限も制限します。
      - 複数の OS を同時に動作させるのは仮想化技術です。
    terms:
      - セキュアOS
      - アクセス制御
  - id: A05-002
    topic: 5-1-2
    diff: 2
    q: OS のカーネルの構成方式のうち，マイクロカーネルの特徴として，適切なものはどれか。
    c:
      - カーネルには最小限の機能だけをもたせ，ファイル管理やデバイス制御などはカーネルの外のプロセスとして実行する。
      - アプリケーションとカーネルを区別せず，すべての処理を同じ権限で実行する。
      - OS の主要な機能をすべてカーネルに組み込み，カーネル内で直接呼び出して高速に処理する。
      - カーネルを持たず，アプリケーションが直接ハードウェアを制御する。
    a: ア
    exp: |
      マイクロカーネルは、メモリ管理やプロセス間通信などの最小限の機能だけをカーネルに置き、ファイルシステムやデバイスドライバなどはカーネル外のサーバプロセスとして動かす方式です。機能を独立して変更しやすく、一部の不具合がシステム全体に波及しにくい一方、プロセス間通信が増えて性能が落ちやすい面があります。
    why:
      - 正解です。最小限の機能だけをカーネルにもたせます。
      - 一般的な OS は、カーネルモードとユーザーモードで権限を分けています。
      - これはモノリシックカーネルの説明です（Linux など）。
      - カーネルを持たない構成はマイクロカーネルの説明ではありません。
    terms:
      - カーネル
  - id: A05-003
    topic: 5-1-2
    diff: 2
    q: CPU の動作モードについての説明として，適切なものはどれか。
    c:
      - すべてのプログラムは同じモードで動作し，実行できる命令に違いはない。
      - OS のカーネルはカーネルモード（特権モード）で動作し，すべての命令を実行できる。アプリケーションはユーザーモードで動作し，特権命令は実行できない。
      - アプリケーションはカーネルモードで動作し，OS はユーザーモードで動作する。
      - ユーザーモードでは入出力命令を自由に実行できるが，カーネルモードでは実行できない。
    a: イ
    exp: |
      CPU には、すべての命令を実行できるカーネルモード（スーパーバイザーモード、特権モード）と、入出力命令などの特権命令を実行できないユーザーモードがあります。OS のカーネルはカーネルモードで、アプリケーションはユーザーモードで動作します。アプリケーションが入出力などを行うときは、システムコール（SVC）で OS に依頼します。これにより、アプリケーションの誤りや不正がシステム全体に影響することを防ぎます。
    why:
      - モードによって実行できる命令は異なります。
      - 正解です。カーネルは特権モード、アプリケーションはユーザーモードで動作します。
      - モードの割当てが逆です。
      - 入出力命令などの特権命令は、カーネルモードでのみ実行できます。
    terms:
      - カーネル
      - 割込み
  - id: A05-004
    topic: 5-1-2
    diff: 1
    q: コンピュータの電源を入れたときに，ROM などに格納された小さなプログラムから順に読み込んで，最終的に OS を起動する仕組みを何というか。
    c:
      - ブートストラップ
      - ディスパッチ
      - スプーリング
      - ガベージコレクション
    a: ア
    exp: |
      ブートストラップ（ブート）は、電源投入時に ROM（ファームウェア）に格納されたプログラムが起動し、それが補助記憶装置からブートローダを読み込み、ブートローダが OS を読み込む、というように段階的にプログラムを読み込んで OS を起動する仕組みです。
    why:
      - 正解です。段階的に読み込んで OS を起動する仕組みです。
      - ディスパッチは、実行可能状態のタスクに CPU を割り当てることです。
      - スプーリングは、低速な入出力装置へのデータを一時的に補助記憶装置にためて、処理の効率を上げる仕組みです。
      - ガベージコレクションは、使われなくなったメモリ領域を自動的に回収する仕組みです。
    know: 複数の OS を切り替えて起動できるようにすることをマルチブート、ネットワーク上のサーバから OS を読み込んで起動することをネットワークブートといいます。
    terms:
      - ブートストラップ
  - id: A05-005
    topic: 5-1-3
    diff: 2
    q: OS のジョブ管理の説明として，適切なものはどれか。
    c:
      - 利用者から投入されたジョブの実行順序を決め，ジョブの開始から終了までを制御する。
      - 入出力装置の動作を制御し，データを転送する。
      - 主記憶の領域をプログラムに割り当て，不要になったら解放する。
      - ファイルの作成や削除，アクセス権の管理を行う。
    a: ア
    exp: |
      ジョブ管理は、利用者がコンピュータに依頼する仕事の単位であるジョブについて、投入されたジョブを受け付け、実行の順序や時期を決め（ジョブスケジューリング）、実行から結果の出力までを制御する OS の機能です。決められた時刻や順序でジョブを自動実行するジョブスケジューラーは、バッチ処理の運用に欠かせません。
    why:
      - 正解です。ジョブの実行順序の決定と実行の制御を行います。
      - これは入出力管理の説明です。
      - これは記憶管理の説明です。
      - これはファイル管理（データ管理）の説明です。
    terms:
      - ジョブ管理
  - id: A05-006
    topic: 5-1-4-1
    diff: 2
    q: タスク（プロセス）の状態遷移で，実行状態のタスクが入出力処理を要求したとき，そのタスクが移る状態はどれか。
    c:
      - 終了状態
      - 待ち状態
      - 実行可能状態
      - 実行状態のまま
    a: イ
    exp: |
      タスクには、主に「実行状態」「実行可能状態（レディ）」「待ち状態（ブロック）」の3つの状態があります。
      - 実行状態のタスクが入出力などの完了を待つ必要が生じると → 待ち状態
      - 入出力が完了すると → 実行可能状態（すぐには実行状態にならない）
      - 実行可能状態のタスクに CPU が割り当てられる（ディスパッチ）と → 実行状態
      - 割り当てられた時間を使い切ったり、優先度の高いタスクに CPU を奪われたりすると → 実行可能状態
    why:
      - タスクは入出力の要求だけでは終了しません。
      - 正解です。入出力の完了を待つため待ち状態になります。
      - 実行可能状態になるのは、タイムスライスを使い切った場合や、他のタスクに CPU を奪われた場合です。
      - 入出力を待つ間 CPU を占有し続けると効率が悪いため、実行状態からは外れます。
    know: 待ち状態から直接実行状態に移ることはなく、いったん実行可能状態になってから CPU の割当てを待ちます。
    terms:
      - タスク管理
  - id: A05-007
    topic: 5-1-4-1
    diff: 2
    q: プロセスとスレッドの関係についての説明として，適切なものはどれか。
    c:
      - 1つのスレッドの中に複数のプロセスを作ることができる。
      - プロセスとスレッドは同じものを指す別の呼び方である。
      - 1つのプロセスの中に複数のスレッドを作ることができ，同じプロセス内のスレッドはメモリ空間などの資源を共有する。
      - スレッドは必ずプロセスとは別のメモリ空間をもち，資源を共有しない。
    a: ウ
    exp: |
      プロセスは OS が資源（メモリ空間など）を割り当てる単位で、スレッドはプロセスの中で CPU を割り当てて実行する処理の単位です。同じプロセス内の複数のスレッドはメモリ空間を共有するため、プロセスを複数作るより少ない資源で並行処理ができ、切替えも高速です。その反面、共有データへの同時アクセスには排他制御が必要です。
    why:
      - 関係が逆です。プロセスの中にスレッドがあります。
      - プロセスとスレッドは異なる概念です。
      - 正解です。スレッドはプロセス内の資源を共有します。
      - 同じプロセス内のスレッドはメモリ空間を共有します。
    terms:
      - タスク管理
  - id: A05-008
    topic: 5-1-4-2
    diff: 2
    q: タスクのスケジューリング方式のうち，ラウンドロビン方式の説明として，適切なものはどれか。
    c:
      - 処理時間の最も短いタスクから順に実行する。
      - 到着した順にタスクを実行し，実行中のタスクは終了するまで中断しない。
      - 実行可能なタスクに一定時間（タイムクウォンタム）ずつ順番に CPU を割り当て，時間を使い切ったタスクは待ち行列の最後に回す。
      - 優先度の最も高いタスクに CPU を割り当て，そのタスクが終わるまで実行させる。
    a: ウ
    exp: |
      ラウンドロビン方式は、実行可能なタスクに一定の時間（タイムクウォンタム、タイムスライス）ずつ順番に CPU を割り当て、時間内に終わらなければ待ち行列の最後に戻す方式です。すべてのタスクに公平に CPU が割り当てられるため、対話型のシステムに向いています。
    why:
      - これは処理時間順方式（SPT）の説明です。
      - これは到着順方式（FCFS）の説明です。中断しない方式をノンプリエンプティブといいます。
      - 正解です。一定時間ずつ順番に割り当てます。
      - これは優先順方式の説明です。
    know: 実行中のタスクから CPU を取り上げて別のタスクに割り当てられる方式をプリエンプティブ方式、取り上げない方式をノンプリエンプティブ方式といいます。
    terms:
      - タスク管理
      - ラウンドロビン
  - id: A05-009
    topic: 5-1-4-2
    diff: 3
    q: |
      3つのタスク A，B，C が時刻 0 に同時に到着し，待ち行列に A，B，C の順に並んだ。各タスクの CPU 処理時間は A が 3 ミリ秒，B が 1 ミリ秒，C が 2 ミリ秒である。タイムクウォンタムを 1 ミリ秒とするラウンドロビン方式で実行したとき，タスク C が終了する時刻は何ミリ秒か。ここで，入出力やタスク切替えの時間は無視する。
    c:
      - '3'
      - '4'
      - '5'
      - '6'
    a: ウ
    exp: |
      1ミリ秒ずつ順番に実行される様子を追います。
      - 0〜1：A（残り 2）→ 行列の最後へ　行列：B, C, A
      - 1〜2：B（残り 0、終了）　行列：C, A
      - 2〜3：C（残り 1）→ 最後へ　行列：A, C
      - 3〜4：A（残り 1）→ 最後へ　行列：C, A
      - 4〜5：C（残り 0、終了）
      - 5〜6：A（残り 0、終了）
      C は時刻 5 ミリ秒に終了します。
    why:
      - 3 は C が1回目の割当てを終えた時刻で、まだ処理が残っています。
      - 4 は A の2回目の割当てが終わった時刻です。
      - 正解です。時刻 5 に C が終了します。
      - 6 は A が終了する時刻です。
    terms:
      - ラウンドロビン
    verify:
      manual: タイムクウォンタム1msで A,B,C,A,C,A の順に実行されることを逐次トレースし、C 終了=5, A 終了=6, B 終了=2 を確認
  - id: A05-010
    topic: 5-1-5
    diff: 2
    q: OS のデータ管理（ファイル管理）機能の役割として，適切なものはどれか。
    c:
      - 主記憶の不足を補うために，仮想的な記憶領域を提供する。
      - ジョブの実行を予定された時刻に開始する。
      - 利用者やプログラムがファイルを名前で扱えるようにし，記憶装置上の物理的な格納位置を意識しなくてよいようにする。
      - CPU の割当て順序を決める。
    a: ウ
    exp: |
      データ管理（ファイル管理）は、補助記憶装置上のデータをファイルとして管理する OS の機能です。利用者やプログラムはファイル名とディレクトリでファイルを指定すればよく、ディスク上のどこに記録されているかを意識する必要がありません。ファイルへのアクセス方法の提供やアクセス権の管理も行います。
    why:
      - これは仮想記憶管理の役割です。
      - これはジョブ管理の役割です。
      - 正解です。物理的な格納位置を意識せずにファイルを扱えるようにします。
      - これはタスク管理（プロセス管理）の役割です。
    terms:
      - ファイルシステム
  - id: A05-011
    topic: 5-1-6
    diff: 2
    q: スプーリングの説明として，適切なものはどれか。
    c:
      - データを複数のディスクに分散して書き込み，高速化する。
      - 主記憶の内容の一部を補助記憶装置に退避して，主記憶の空きを作る。
      - プリンターなどの低速な装置への出力データをいったん補助記憶装置に書き出し，装置の空き具合に合わせて出力することで，CPU を早く次の処理に使えるようにする。
      - CPU を介さずに，入出力装置と主記憶の間でデータを直接転送する。
    a: ウ
    exp: |
      スプーリングは、プリンターのような低速な入出力装置とのデータのやり取りを、高速な補助記憶装置（スプール）を介して行う仕組みです。プログラムは出力データをスプールに書き込めばすぐに次の処理に進め、実際の出力は OS が裏で行います。これにより CPU の待ち時間が減り、システム全体の処理効率が向上します。
    why:
      - これは RAID0（ストライピング）の説明です。
      - これはスワッピング（ロールアウト）の説明です。
      - 正解です。低速な装置との入出力を補助記憶装置で仲介します。
      - これは DMA の説明です。
    terms:
      - スプーリング
  - id: A05-012
    topic: 5-1-7-1
    diff: 2
    q: 主記憶の可変長の領域の割当てと解放を繰り返すと，細かい空き領域が散在して大きな領域を割り当てられなくなることがある。この状態を解消するために，使用中の領域を移動して空き領域を1つにまとめる処理はどれか。
    c:
      - スワッピング
      - コンパクション
      - オーバーレイ
      - ページング
    a: イ
    exp: |
      可変長の領域の割当てと解放を繰り返すと、使われていない小さな領域があちこちに分散します（フラグメンテーション、断片化）。合計の空き容量は十分でも、連続した大きな領域を確保できなくなります。コンパクションは、使用中の領域を詰めて移動し、空き領域を連続した1つの領域にまとめる処理です。
    why:
      - スワッピングは、実行中のプログラムを主記憶と補助記憶の間で入れ替える（スワップアウト・スワップイン）処理です。
      - 正解です。使用中の領域を移動して空き領域をまとめます。
      - オーバーレイは、プログラムを複数の部分に分け、必要な部分だけを主記憶に読み込んで実行する方式です。
      - ページングは、主記憶を固定長のページに分けて管理する仮想記憶の方式です。
    know: ガベージコレクションは、プログラムが使い終わったメモリ領域を自動的に回収する機能で、Java などの言語処理系がもっています。
    terms:
      - 記憶管理
  - id: A05-013
    topic: 5-1-7-2
    diff: 2
    q: 仮想記憶方式で，プログラムが参照したページが主記憶上に存在しないときに発生する割込みはどれか。
    c:
      - ページアウト
      - ページフォールト
      - スラッシング
      - タイムスライス満了
    a: イ
    exp: |
      ページフォールトは、プログラムが参照しようとしたページが主記憶上になく、補助記憶上にあるときに発生する割込みです。OS は補助記憶から主記憶へそのページを読み込み（ページイン）、必要なら主記憶上の別のページを補助記憶へ追い出し（ページアウト）ます。
    why:
      - ページアウトは、主記憶のページを補助記憶へ追い出す動作で、割込みの名称ではありません。
      - 正解です。参照したページが主記憶にないときに発生します。
      - スラッシングは、ページフォールトが多発してページの入替えに時間を取られ、処理がほとんど進まなくなる状態です。
      - タイムスライス満了は、割り当てられた CPU 時間を使い切ったときに発生するタイマー割込みです。
    terms:
      - 仮想記憶
      - ページフォールト
  - id: A05-014
    topic: 5-1-7-2
    diff: 3
    q: |
      主記憶に3つのページ枠がある仮想記憶システムで，ページ置換えアルゴリズムに LRU を用いる。ページ枠は最初すべて空であり，ページを次の順に参照したとき，ページフォールトは何回発生するか。
      1，2，3，1，4，2，5，1
    c:
      - 8回
      - 6回
      - 7回
      - 5回
    a: ウ
    exp: |
      LRU（Least Recently Used）は、最も長い間参照されていないページを追い出します。主記憶の状態を順に追います（右ほど最近の参照）。
      - 1：フォールト {1}　2：フォールト {1,2}　3：フォールト {1,2,3}（ここまで3回）
      - 1：主記憶にある（ヒット）→ 参照順は 2,3,1
      - 4：フォールト、最も古い 2 を追い出す {3,1,4}（4回目）
      - 2：フォールト、最も古い 3 を追い出す {1,4,2}（5回目）
      - 5：フォールト、最も古い 1 を追い出す {4,2,5}（6回目）
      - 1：フォールト、最も古い 4 を追い出す {2,5,1}（7回目）
    why:
      - 8回は、参照のたびにすべてフォールトになったとした数で、2回目の 1 の参照はヒットです。
      - 6回は、最も古く読み込んだページを追い出す FIFO を使った場合の回数です（2 の再参照がヒットになる）。
      - 正解です。LRU ではページフォールトが7回発生します。
      - 5回は計算の誤りです。
    know: FIFO は「最初に読み込んだ順」、LRU は「最後に参照された時刻が古い順」に追い出します。同じ参照列でも結果が変わる点に注意しましょう。
    terms:
      - 仮想記憶
      - LRU
    verify:
      value: (() => { const refs = [1,2,3,1,4,2,5,1]; let mem = []; let f = 0; for (const p of refs) { const i = mem.indexOf(p); if (i >= 0) { mem.splice(i, 1); mem.push(p); } else { f++; if (mem.length === 3) mem.shift(); mem.push(p); } } return f; })()
  - id: A05-015
    topic: 5-1-7-2
    diff: 2
    q: 仮想記憶システムでスラッシングが発生したときの状態として，適切なものはどれか。
    c:
      - 補助記憶装置の容量が不足して，新しいファイルを作成できない。
      - 1つのプログラムが主記憶を独占し，他のプログラムが実行できない。
      - ページフォールトが頻発してページの入替え処理に多くの時間が使われ，CPU の利用率が下がって処理がほとんど進まない。
      - 主記憶の容量に十分な余裕があり，ページの入替えがまったく発生しない。
    a: ウ
    exp: |
      スラッシングは、主記憶に対して実行中のプログラムが多すぎる場合などに、ページフォールトが頻発し、ページの入替え（ページイン・ページアウト）に時間を取られて、本来の処理がほとんど進まなくなる状態です。同時に実行するプログラムを減らす（多重度を下げる）か、主記憶を増やすことで解消します。
    why:
      - 補助記憶の容量不足はスラッシングとは別の問題です。
      - 主記憶の独占はスラッシングの定義ではありません。
      - 正解です。ページの入替えに時間を取られて処理が進まない状態です。
      - これはスラッシングとは逆の、余裕がある状態です。
    terms:
      - 仮想記憶
      - スラッシング
  - id: A05-016
    topic: 5-1-8
    diff: 2
    q: OS のネットワーク制御機能の説明として，適切なものはどれか。
    c:
      - ネットワーク上の利用者の画面のデザインを統一する。
      - TCP/IP などの通信プロトコルの処理を行い，アプリケーションがネットワークを通じて通信できるようにする。
      - ネットワークの回線を物理的に敷設する。
      - アプリケーションの業務処理の内容を決める。
    a: イ
    exp: |
      OS のネットワーク制御機能は、TCP/IP などの通信プロトコルの処理（プロトコルスタック）を備え、アプリケーションに通信のための共通のインタフェース（ソケットなど）を提供します。アプリケーションは通信の細かな手順を意識せずに、ネットワーク越しにデータを送受信できます。
    why:
      - 画面のデザインは OS のネットワーク制御の役割ではありません。
      - 正解です。プロトコル処理を行い通信を可能にします。
      - 回線の敷設は物理的な工事で、OS の機能ではありません。
      - 業務処理の内容はアプリケーションが決めます。
    terms:
      - TCP/IP
  - id: A05-017
    topic: 5-1-9
    diff: 2
    q: UNIX 系 OS で，あるファイルのアクセス権が rwxr-x--- と表示された。このファイルについての説明として，適切なものはどれか。
    c:
      - すべての利用者が読み・書き・実行できる。
      - 所有グループの利用者だけが書き込める。
      - 所有者は読み・書き・実行ができ，所有グループの利用者は読みと実行ができ，その他の利用者は何もできない。
      - 所有者だけが読み込めて，他の利用者は実行だけができる。
    a: ウ
    exp: |
      UNIX 系 OS のアクセス権は、所有者・所有グループ・その他の利用者の順に3文字ずつ、r（読み）、w（書き）、x（実行）で表し、許可されていない権限は「-」で示します。
      rwx（所有者：読み・書き・実行）、r-x（グループ：読み・実行）、---（その他：権限なし）です。
    why:
      - その他の利用者には権限がありません（---）。
      - グループには書込みの権限（w）がありません。
      - 正解です。3文字ずつ所有者・グループ・その他の権限を表します。
      - 所有者は書込みと実行もでき、その他の利用者は何もできません。
    know: 必要最小限の利用者に必要最小限の権限だけを与える「最小権限の原則」は、セキュリティの基本です。
    terms:
      - アクセス権
  - id: A05-018
    topic: 5-1-10
    diff: 2
    q: OS の管理者アカウント（root や Administrator など）の取扱いとして，適切なものはどれか。
    c:
      - 管理者権限が必要な作業のときだけ使用し，日常の作業は一般の利用者アカウントで行う。
      - 管理者アカウントでの操作は記録しないようにする。
      - 作業を効率化するため，すべての利用者で1つの管理者アカウントを共有する。
      - パスワードを忘れないように，初期設定のパスワードのまま使用する。
    a: ア
    exp: |
      管理者アカウントはシステムのあらゆる操作ができるため、誤操作やマルウェア感染、不正利用が起きたときの被害が大きくなります。そのため、管理者権限が必要なときだけ使い（必要なときだけ権限を昇格する）、普段は一般の権限で作業するのが原則です。誰が操作したかを追跡できるよう、共有は避け、操作のログを記録します。
    why:
      - 正解です。必要なときだけ管理者権限を使うのが原則です。
      - 管理者の操作こそ記録して、不正や誤操作を追跡できるようにすべきです。
      - 共有すると、誰が操作したのか特定できず、責任追跡ができません。
      - 初期設定のパスワードは推測されやすく、不正アクセスの原因になります。
    know: LDAP は、利用者のアカウント情報などを一元的に管理するディレクトリサービスにアクセスするためのプロトコルです。
    terms:
      - アクセス権
      - LDAP
  - id: A05-019
    topic: 5-1-11
    diff: 2
    q: OS のセキュリティ制御機能のうち，誰がいつどのような操作を行ったかを記録して，後から追跡できるようにする機能はどれか。
    c:
      - デフラグメンテーション機能
      - ページング機能
      - ロギング（監査証跡の記録）機能
      - スプーリング機能
    a: ウ
    exp: |
      ロギング機能やオーディット（監査）機能は、利用者のログイン、ファイルへのアクセス、設定の変更などの操作を記録（ログ）に残す機能です。記録を後から確認することで、不正な操作の発見や原因の追跡ができ、操作した人の責任を明らかにできます（アカウンタビリティ、責任追跡性）。
    why:
      - デフラグメンテーションはディスクの断片化を解消する機能です。
      - ページングは仮想記憶の管理方式です。
      - 正解です。操作の記録で責任追跡を可能にします。
      - スプーリングは入出力の効率化の機能です。
    terms:
      - アカウンタビリティ
      - ログ管理
  - id: A05-020
    topic: 5-1-12
    diff: 2
    q: ソフトウェアの障害が発生したときに，原因を調査するため，その時点の主記憶の内容などを記録したものはどれか。
    c:
      - ジャーナル
      - チェックポイント
      - スナップショットバックアップ
      - メモリダンプ
    a: エ
    exp: |
      メモリダンプ（ダンプ）は、障害が発生した時点の主記憶やレジスタの内容をファイルなどに出力したものです。プログラムがどの状態で異常終了したかを解析し、障害の原因を特定するのに使います。
    why:
      - ジャーナル（ログ）は、データベースなどの更新の履歴を記録したもので、障害からの回復に使います。
      - チェックポイントは、障害からの回復に備えて処理の途中の状態を定期的に保存する時点のことです。
      - スナップショットバックアップは、ある時点のディスクの状態を保存する手法で、障害の原因調査用ではありません。
      - 正解です。障害時点の主記憶の内容を記録したものです。
    terms:
      - ダンプ
  - id: A05-021
    topic: 5-2-1
    diff: 1
    q: ミドルウェアの説明として，適切なものはどれか。
    c:
      - OS とアプリケーションの間で動作し，データベース管理や通信管理など多くのアプリケーションに共通する機能を提供するソフトウェア
      - ハードウェアを直接制御し，すべてのソフトウェアの土台となるソフトウェア
      - 文書作成や表計算など，利用者の業務に直接使われるソフトウェア
      - ハードウェアの中に組み込まれ，電源投入時に最初に動作するソフトウェア
    a: ア
    exp: |
      ミドルウェアは、OS とアプリケーションの中間に位置し、多くのアプリケーションが共通して必要とする機能を提供するソフトウェアです。DBMS（データベース管理システム）、TP モニター（トランザクション処理を管理するソフトウェア）、通信管理ソフトウェア、Web サーバソフトウェアなどがあります。
    why:
      - 正解です。OS とアプリケーションの間で共通機能を提供します。
      - これは OS（基本ソフトウェア）の説明です。
      - これはアプリケーションソフトウェアの説明です。
      - これはファームウェア（BIOS や UEFI など）の説明です。
    terms:
      - ミドルウェア
      - DBMS
  - id: A05-022
    topic: 5-2-2
    diff: 1
    q: シェルの説明として，適切なものはどれか。
    c:
      - 利用者が入力したコマンドを解釈して，OS のカーネルに処理を依頼するプログラム
      - ハードディスクの断片化を解消するプログラム
      - プログラムの誤りを見つけるためのプログラム
      - ネットワーク上の不正な通信を遮断するプログラム
    a: ア
    exp: |
      シェルは、利用者とカーネル（OS の中核）の間に位置するコマンドインタプリタです。利用者がコマンドを入力すると、シェルがそれを解釈してプログラムを起動したり、カーネルの機能を呼び出したりします。カーネルを殻（shell）のように包んでいることが名前の由来です。複数のコマンドを並べたシェルスクリプトで作業を自動化することもできます。
    why:
      - 正解です。コマンドを解釈してカーネルに伝えます。
      - これはデフラグメンテーションツールの説明です。
      - これはデバッガの説明です。
      - これはファイアウォールの説明です。
    terms:
      - シェル
      - カーネル
  - id: A05-023
    topic: 5-2-3
    diff: 1
    q: API（Application Programming Interface）の説明として，適切なものはどれか。
    c:
      - 利用者がマウスで操作するための画面
      - プログラムの誤りを自動で修正する機能
      - プログラムの実行速度を測定する機能
      - OS やソフトウェア，Web サービスの機能を，他のプログラムから呼び出して利用するための手順や規約
    a: エ
    exp: |
      API は、あるソフトウェアの機能を、別のプログラムから利用するための呼出し方法（関数名、引数、戻り値、通信の形式など）を定めたものです。OS の API を使えばファイル操作などを行え、Web API を使えば地図や決済などの外部サービスの機能を自分のアプリケーションに組み込めます。
    why:
      - 利用者が操作する画面は GUI です。
      - 誤りの自動修正は API の説明ではありません。
      - 実行速度の測定は性能評価ツールの機能です。
      - 正解です。機能を他のプログラムから利用するための規約です。
    terms:
      - API
  - id: A05-024
    topic: 5-2-4
    diff: 2
    q: DLL（Dynamic Link Library）の特徴として，適切なものはどれか。
    c:
      - ソースプログラムの形で保存されたライブラリで，利用時にはコンパイルが必要である。
      - プログラムの作成時にライブラリをすべて実行ファイルに組み込むので，実行時にライブラリのファイルを必要としない。
      - 実行中に変更できない，読出し専用のライブラリである。
      - プログラムの実行時に必要になったライブラリを結合するので，複数のプログラムで共有でき，実行ファイルを小さくできる。
    a: エ
    exp: |
      DLL（動的リンクライブラリ）は、プログラムの実行時にリンク（結合）されるライブラリです。複数のプログラムが同じライブラリを共有できるため、記憶領域を節約でき、ライブラリを更新すれば利用する全プログラムに反映されます。一方、ライブラリのファイルがないと実行できず、版の違いによる不具合が起きることもあります。
    why:
      - これはソースライブラリの説明です。
      - これは静的リンクの説明です。
      - DLL は読出し専用であることが特徴ではありません。
      - 正解です。実行時に結合し、複数のプログラムで共有できます。
    terms:
      - ライブラリ
  - id: A05-025
    topic: 5-2-5
    diff: 2
    q: コンポーネントウェアの説明として，適切なものはどれか。
    c:
      - 特定の機能をもつ再利用可能なソフトウェア部品（コンポーネント）を組み合わせて，アプリケーションを構築する。
      - プログラムをすべて一から作成し，部品を一切使わない。
      - ハードウェアの部品を組み合わせて，コンピュータを組み立てる。
      - 設計書から自動的にプログラムのソースコードを生成する。
    a: ア
    exp: |
      コンポーネントウェアは、特定の機能をもち、決められたインタフェースで他の部品と組み合わせられるソフトウェア部品を組み合わせて、アプリケーションを効率よく構築する考え方です。部品の再利用で開発期間の短縮と品質の向上が期待できます。分散したオブジェクトの連携の仕様として CORBA などがあります。
    why:
      - 正解です。再利用可能な部品を組み合わせて構築します。
      - 部品を使わないのは、コンポーネントウェアと逆の考え方です。
      - ハードウェアの組立てはソフトウェアのコンポーネントウェアではありません。
      - 設計書からコードを生成するのはプログラムジェネレーターなどの機能です。
    terms:
      - コンポーネントウェア
  - id: A05-026
    topic: 5-2-6
    diff: 2
    q: アプリケーションの開発フレームワークを利用する利点として，適切なものはどれか。
    c:
      - 多くのアプリケーションに共通する処理の枠組みが用意されているので，個別の処理の開発に集中でき，品質も一定に保ちやすい。
      - フレームワークを使うと，どんなプログラム言語でも同じソースコードが動作する。
      - フレームワークを使えば，テストを一切行わなくてよい。
      - フレームワークは利用者の業務要件を自動的に決めてくれる。
    a: ア
    exp: |
      開発フレームワークは、Web アプリケーションなどの開発でよく必要になる処理（画面遷移、データベースへのアクセス、認証など）の枠組みと部品をまとめたものです。開発者は枠組みに従って個別の処理を書けばよいので、開発の効率が上がり、構造がそろうため品質や保守性も高めやすくなります。
    why:
      - 正解です。共通処理の枠組みを再利用できます。
      - フレームワークは特定の言語向けに作られていることがほとんどです。
      - フレームワークを使ってもテストは必要です。
      - 業務要件は利用者と開発者が決めるもので、フレームワークが決めるものではありません。
    terms:
      - 開発フレームワーク
  - id: A05-027
    topic: 5-3-1
    diff: 2
    q: カレントディレクトリが /home/user/docs のとき，相対パス ../data/a.txt が指すファイルの絶対パスはどれか。
    c:
      - /data/a.txt
      - /home/data/a.txt
      - /home/user/data/a.txt
      - /home/user/docs/data/a.txt
    a: ウ
    exp: |
      相対パスはカレントディレクトリを起点にファイルの位置を表します。「..」は1つ上（親）のディレクトリを表します。
      /home/user/docs の1つ上は /home/user、そこから data/a.txt をたどるので /home/user/data/a.txt です。
    why:
      - ルートディレクトリから始めた誤りです。
      - 2つ上のディレクトリにさかのぼった誤りです。
      - 正解です。親ディレクトリ /home/user の下の data/a.txt です。
      - 「..」を無視して、カレントディレクトリの下にあるとした誤りです。
    know: ルートディレクトリ（/）から始まるパスを絶対パスといいます。「.」はカレントディレクトリ自身を表します。
    terms:
      - ディレクトリ
  - id: A05-028
    topic: 5-3-1
    diff: 2
    q: シンボリックリンクの説明として，適切なものはどれか。
    c:
      - 別のファイルやディレクトリの位置（パス）を記録した特殊なファイルで，元のファイルを削除するとリンクから参照できなくなる。
      - ファイルの内容を丸ごと複製した，独立したファイルである。
      - ファイルを圧縮して，容量を小さくしたものである。
      - ファイルの更新履歴を保存する仕組みである。
    a: ア
    exp: |
      シンボリックリンクは、別のファイルやディレクトリへのパスを記録した特殊なファイルで、それを開くと実体のファイルを参照できます。Windows のショートカットや macOS のエイリアスと似た働きです。実体を削除するとリンクは参照先を失います。
    why:
      - 正解です。パスを記録した参照用のファイルです。
      - 内容を複製したものはコピーです。
      - 圧縮はアーカイブツールなどの機能です。
      - 更新履歴の保存はバージョン管理の機能です。
    terms:
      - ディレクトリ
  - id: A05-029
    topic: 5-3-2
    diff: 2
    q: FAT ファイルシステムと比較した NTFS の特徴として，適切なものはどれか。
    c:
      - ファイルごとのアクセス権の設定や，障害からの回復を助けるジャーナリング機能をもつ。
      - 扱える1ファイルの最大サイズが 4G バイト未満に制限される。
      - 構造が単純で，多くの機器と互換性があるが，アクセス権の設定はできない。
      - 光ディスク専用のファイルシステムである。
    a: ア
    exp: |
      NTFS は Windows の標準的なファイルシステムで、利用者ごとのアクセス権の設定、ファイルの暗号化や圧縮、ファイルシステムの変更を記録して障害時の整合性の回復を助けるジャーナリングなどの機能をもちます。
      FAT は構造が単純で多くの機器で読み書きできる反面、アクセス権の機能がなく、FAT32 では1ファイルの大きさが 4G バイト未満に制限されます。
    why:
      - 正解です。アクセス権とジャーナリングが NTFS の特徴です。
      - 4G バイト未満の制限は FAT32 の特徴です。
      - これは FAT の特徴です。
      - 光ディスクには ISO 9660 や UDF などのファイルシステムが使われます。
    terms:
      - ファイルシステム
  - id: A05-030
    topic: 5-3-3
    diff: 3
    q: ファイル編成のうち，索引順編成ファイルの特徴として，適切なものはどれか。
    c:
      - キーの順にレコードを格納した基本データ域と索引域をもち，順次アクセスと索引による直接アクセスの両方ができる。挿入されたレコードはあふれ域に格納される。
      - キーから計算したアドレスにレコードを格納し，直接アクセスする。順次アクセスには向かない。
      - レコードを先頭から順に格納し，先頭から順にしかアクセスできない。
      - レコードを格納する順序に規則はなく，すべてのレコードを調べないと目的のレコードを見つけられない。
    a: ア
    exp: |
      索引順編成ファイルは、レコードをキーの順に格納した基本データ域と、キーと格納位置の対応を記録した索引域、レコードの追加に備えたあふれ域からなります。キー順の順次処理と、索引を使った直接アクセスの両方ができます。追加が多いとあふれ域が増えて効率が落ちるため、定期的に再編成します。
    why:
      - 正解です。順次アクセスと索引による直接アクセスの両方ができます。
      - これは直接編成ファイルの特徴です。
      - これは順編成ファイルの特徴です。
      - 規則なく格納されていても、索引があれば目的のレコードを探せます。説明は索引順編成に当てはまりません。
    terms:
      - ファイル編成
  - id: A05-031
    topic: 5-3-4
    diff: 3
    q: 日曜日にフルバックアップを取得し，月曜日から土曜日までは毎日，前日のバックアップ以降に変更されたデータだけを増分バックアップとして取得している。木曜日の業務中にディスクが故障したとき，水曜日の業務終了時点の状態に戻すために必要なバックアップはどれか。
    c:
      - 月曜日から水曜日の増分バックアップだけ
      - 水曜日の増分バックアップだけ
      - 日曜日のフルバックアップと，水曜日の増分バックアップだけ
      - 日曜日のフルバックアップと，月曜日・火曜日・水曜日の増分バックアップ
    a: エ
    exp: |
      増分バックアップは「前日のバックアップ以降に変更された分」だけを保存します。各日の増分にはその日の変更しか含まれないため、復旧には、フルバックアップを戻した後、月・火・水の増分を順に適用する必要があります。
    why:
      - 基になるフルバックアップがないと復元できません。
      - 増分だけでは、基になるデータがありません。
      - 水曜日の増分には水曜日の変更しか含まれないため、月曜日と火曜日の変更が失われます。これが成り立つのは、毎回フルバックアップ以降の変更をすべて保存する差分バックアップの場合です。
      - 正解です。フルバックアップに各日の増分を順に適用します。
    know: 差分バックアップは取得に時間がかかる代わりに、復旧はフルと最新の差分の2つで済みます。増分バックアップは取得が速い代わりに、復旧に多くのバックアップが必要です。
    terms:
      - バックアップ
  - id: A05-032
    topic: 5-4-1
    diff: 2
    q: ローコード開発ツールの説明として，適切なものはどれか。
    c:
      - 開発したアプリケーションを自動で利用者に販売する。
      - 画面の部品を配置したり，処理の流れを図で設定したりすることで，ソースコードの記述を最小限にしてアプリケーションを開発できる。
      - すべての処理をアセンブラ言語で記述して，実行速度を最大にする。
      - プログラムの誤りを自動的にすべて取り除く。
    a: イ
    exp: |
      ローコード開発ツールは、画面の部品をドラッグして配置したり、処理を図や設定で定義したりすることで、手書きのソースコードを最小限にしてアプリケーションを開発できるツールです。開発期間を短縮でき、業務部門の担当者が自ら開発する EUD（エンドユーザー開発）にも使われます。コードをまったく書かずに開発するものはノーコード開発ツールといいます。
    why:
      - 販売はローコード開発ツールの機能ではありません。
      - 正解です。少ないコードでアプリケーションを開発できます。
      - アセンブラ言語での開発は、ローコードとは正反対です。
      - 誤りをすべて取り除くツールはありません。
    terms:
      - ローコード開発
  - id: A05-033
    topic: 5-4-1
    diff: 3
    q: 組込みシステムの開発で用いる ICE（インサーキットエミュレーター）の説明として，適切なものはどれか。
    c:
      - 開発用のコンピュータとは異なるプロセッサ用の目的プログラムを生成するコンパイラ
      - 回路の動作を，ソフトウェア上で模擬的に実行するツール
      - プログラムの実行過程の命令や変数の値を記録して出力するツール
      - 対象のマイコンの代わりに基板に接続し，実機に近い状態でプログラムの実行を制御したり，内部の状態を観察したりしてデバッグする装置
    a: エ
    exp: |
      ICE（In-Circuit Emulator）は、組込み機器の基板上のマイコン（またはその接続端子）に接続して、マイコンの動作を模倣・制御するハードウェアのデバッグ装置です。プログラムを1命令ずつ実行したり、レジスタやメモリの内容を観察したりでき、実際のハードウェア上での動作を確認しながらデバッグできます。
    why:
      - これはクロスコンパイラの説明です。
      - これはシミュレーターの説明です。
      - これはトレーサーの説明です。
      - 正解です。実機に接続してデバッグするハードウェアの装置です。
    terms:
      - ICE
  - id: A05-034
    topic: 5-4-2
    diff: 2
    q: 言語処理ツールのうち，リンカ（連係編集プログラム）の役割として，適切なものはどれか。
    c:
      - コンパイルなどで生成された複数の目的プログラムやライブラリを結合して，実行可能なロードモジュールを作成する。
      - ロードモジュールを主記憶に読み込んで，実行できる状態にする。
      - ソースプログラムを1文ずつ解釈しながら実行する。
      - コンパイルの前に，ソースプログラム中のマクロの展開やファイルの取込みを行う。
    a: ア
    exp: |
      プログラムが実行されるまでの一般的な流れは、原始プログラム（ソースプログラム）→ コンパイラ → 目的プログラム → リンカ → ロードモジュール → ローダ → 主記憶で実行、です。リンカは複数の目的プログラムやライブラリを結合し、実行可能なロードモジュールを作ります。
    why:
      - 正解です。目的プログラムを結合してロードモジュールを作ります。
      - これはローダの役割です。
      - これはインタプリタの役割です。
      - これはプリプロセッサの役割です。
    know: 実行時コンパイラ（JIT コンパイラ）は、中間コードを実行時に機械語に変換して高速化します。クロスコンパイラは、開発に使うコンピュータとは異なる種類のコンピュータ向けの目的プログラムを生成します。
    terms:
      - リンカ
      - コンパイラ
  - id: A05-035
    topic: 5-4-2
    diff: 2
    q: 組込みシステムの開発で，開発用のパソコン上で，実機に搭載されるプロセッサ用の目的プログラムを生成するために用いるものはどれか。
    c:
      - 逆アセンブラ
      - クロスコンパイラ
      - プリプロセッサ
      - インタプリタ
    a: イ
    exp: |
      クロスコンパイラは、コンパイラが動作するコンピュータとは異なるアーキテクチャのコンピュータ（ターゲット）向けの目的プログラムを生成するコンパイラです。組込みシステムでは、性能の高い開発用パソコンでマイコン用のプログラムを作成するのに使います。
    why:
      - 逆アセンブラは機械語をアセンブラ言語に戻すツールです。
      - 正解です。異なるプロセッサ向けのコードを生成します。
      - プリプロセッサはコンパイルの前処理を行うツールです。
      - インタプリタはプログラムを解釈しながら実行するもので、別のプロセッサ用の目的プログラムは生成しません。
    terms:
      - コンパイラ
  - id: A05-036
    topic: 5-5-1
    diff: 2
    q: OSS のライセンスのうち，GPL（GNU General Public License）の特徴として，適切なものはどれか。
    c:
      - GPL のソフトウェアを改変して再頒布する場合，改変したソフトウェアのソースコードも GPL で公開しなければならない（コピーレフト）。
      - 改変したソフトウェアのソースコードを公開する必要はなく，著作権表示を残せば自由に利用できる。
      - ソフトウェアの利用は無料だが，ソースコードは公開されていない。
      - 商用目的での利用は一切禁止されている。
    a: ア
    exp: |
      GPL は代表的なコピーレフト型のライセンスで、ソフトウェアを自由に利用・改変・再頒布できますが、改変したものを頒布する場合は、そのソースコードも同じ GPL の条件で公開する必要があります。これにより、派生したソフトウェアも自由なソフトウェアであり続けることが保証されます。
    why:
      - 正解です。派生物にも GPL を適用させるのがコピーレフトです。
      - これは BSD ライセンスや MIT ライセンスなど、制約の緩いライセンスの特徴です。
      - ソースコードを公開しないものはオープンソースではありません（無料で配布されるフリーウェアなど）。
      - GPL のソフトウェアは商用目的でも利用できます。
    know: Apache ライセンスや MPL などもあります。同じソフトウェアを複数のライセンスから選べるようにすることをデュアルライセンスといいます。
    terms:
      - OSS
      - GPL
  - id: A05-037
    topic: 5-5-2
    diff: 2
    q: Linux についての説明として，適切なものはどれか。
    c:
      - スマートフォンでは動作しない。
      - UNIX とは無関係に開発された，Windows 用の拡張機能である。
      - 特定の企業だけが開発し，ソースコードは公開されていない。
      - Linux カーネルはオープンソースで開発されており，カーネルにさまざまなソフトウェアを組み合わせたディストリビューションとして配布されることが多い。
    a: エ
    exp: |
      Linux は UNIX 系の OS で、Linux カーネルはオープンソース（GPL）で世界中の開発者により開発されています。カーネルに、シェル、ライブラリ、各種アプリケーションなどを組み合わせて、インストールしやすくまとめたものをディストリビューションといいます。サーバ、組込み機器、スマートフォン（Android のカーネル）など幅広く使われています。
    why:
      - Android は Linux カーネルを基にしており、スマートフォンでも動作します。
      - Linux は UNIX 互換の OS として開発されました。
      - Linux カーネルのソースコードは公開されています。
      - 正解です。オープンソースのカーネルとディストリビューションという形態です。
    know: FreeBSD、NetBSD、OpenBSD なども、オープンソースの UNIX 系 OS です。
    terms:
      - Linux
      - OSS
  - id: A05-038
    topic: 5-5-3
    diff: 2
    q: オープンソースソフトウェアの開発コミュニティについての説明として，適切なものはどれか。
    c:
      - 特定の企業の社員だけが参加でき，外部からの意見は受け付けない。
      - 参加者はソースコードを閲覧できない。
      - 世界中の開発者や利用者が参加し，ソースコードの改良，不具合の報告や修正，文書の作成などを協力して行う。
      - コミュニティが開発したソフトウェアには，必ず有償の保守サービスが付く。
    a: ウ
    exp: |
      OSS は、開発者や企業、利用者などが参加するコミュニティによって開発・保守されることが多く、誰でもソースコードを読み、不具合の報告や改善の提案、修正の提供ができます。多くの人の目で確認されることで品質が高まる一方、保守の継続性はコミュニティの活発さに左右されます。
    why:
      - OSS のコミュニティは、一般に外部からの参加や意見を受け入れています。
      - OSS はソースコードが公開されているのが前提です。
      - 正解です。多くの参加者の協力で開発が進められます。
      - 有償の保守サービスが必ず付くわけではありません。必要なら企業が提供するサポートを契約します。
    terms:
      - OSS
  - id: A05-039
    topic: 5-5-4
    diff: 2
    q: 企業がシステムに OSS を利用する際の考慮点として，適切なものはどれか。
    c:
      - OSS を改変した場合，ライセンスにかかわらず改変部分を秘密にできる。
      - OSS は無料なので，ライセンスの条件を確認する必要はない。
      - ライセンスの条件を確認して遵守し，脆弱性情報の収集と更新の体制やサポートの方法を検討しておく。
      - OSS は多くの人が見ているので，脆弱性は存在しない。
    a: ウ
    exp: |
      OSS は無償で利用できることが多い一方、ライセンスごとに改変や再頒布の条件が定められているため、条件を確認して守る必要があります。また、脆弱性が見つかることもあるため、情報を収集して速やかに更新する体制や、問題が起きたときのサポート（コミュニティ、商用サポートなど）を検討しておくことが重要です。利用している部品を一覧にした SBOM の作成も有効です。
    why:
      - GPL のように、改変したソースコードの公開を求めるライセンスもあります。
      - 無料でもライセンスの条件はあり、違反すると法的な問題になります。
      - 正解です。ライセンスの遵守と脆弱性対応・サポートの検討が必要です。
      - OSS にも脆弱性は存在しえます。
    terms:
      - OSS
      - SBOM
  - id: A05-040
    topic: 5-1-1
    diff: 1
    q: スマートフォンやタブレット端末で動作するモバイル端末用 OS の例として，適切なものはどれか。
    c:
      - Android
      - HTML
      - SQL
      - COBOL
    a: ア
    exp: |
      Android は Google が中心となって開発しているモバイル端末用の OS で、Linux カーネルを基にしています。iOS（Apple）も代表的なモバイル端末用 OS です。タッチ操作、省電力、アプリの配布の仕組みなどを備えています。
    why:
      - 正解です。Android はモバイル端末用 OS です。
      - HTML は Web ページを記述するマークアップ言語です。
      - SQL はデータベースを操作する言語です。
      - COBOL は事務処理用のプログラム言語です。
    terms:
      - Linux
  - id: A05-041
    topic: 5-4-1
    diff: 2
    q: 開発ツールのうち，プログラムの実行中にあらかじめ指定した1時点での主記憶やレジスタなどの内容を出力して，プログラムの動作を確認するために用いるものはどれか。
    c:
      - スナップショットダンプ
      - アサーションチェッカ
      - トレーサー
      - バージョン管理ツール
    a: ア
    exp: |
      スナップショット（スナップショットダンプ）は、プログラムの実行中、あらかじめ指定した時点で主記憶やレジスタの内容を出力する機能です。プログラムを止めずに途中の状態を確認できるため、デバッグに使われます。
    why:
      - 正解です。指定した時点のメモリなどの内容を出力します。
      - アサーションチェッカは、プログラム中に書いた「成り立つべき条件（アサーション）」が実行時に成り立っているかを検査するツールです。
      - トレーサーは、プログラムの実行過程の命令や変数の値の変化を逐次記録して出力するツールで、特定の1時点の内容を出力するものではありません。
      - バージョン管理ツールは、ソースコードなどの変更履歴を管理するツールです。
    terms:
      - デバッグ
