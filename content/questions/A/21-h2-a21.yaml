  method: 独立レビュアーが盲検で再解答し、正答・解説・重複を確認
questions:
  - id: A21-501
    topic: 21-2-3
    diff: 3
    scope: 21-2-3 生産方式の選択。多品種少量で品種の切り替えが頻繁な生産に、セル生産方式を選ぶ判断
    prereq: セル生産方式は、1 人または少人数の作業者が、1 つの製品の組立てをほぼ全工程担当する方式であり、品種の切り替えに柔軟に対応できること、ライン生産方式は、同一製品の大量生産に向くこと
    hard: 生産量と品種の多さという条件から、方式の長所・短所を結び付ける必要がある。効率の観点（大量生産のライン）との釣り合いも問われる。
    q: |
      ある工場では、顧客ごとの仕様の違いが大きく、多品種を少量ずつ生産しており、品種の切り替えが頻繁に発生する。生産方式の選択として、適切なものはどれか。
    c:
      - 受注を断り、単一品種の大量生産に特化する
      - 'ライン生産方式: 工程を細かく分け、流れ作業で同一製品を大量に作る'
      - 'ロット生産方式: 一定量をまとめて作り、品種ごとに設備を止めて段取り替えを行う'
      - 'セル生産方式: 少人数の作業者が製品の組立ての全工程を担当し、品種の切り替えに柔軟に対応できる'
    a: エ
    exp: |
      生産方式は、品種の多さと量の条件で選びます。セル生産方式は、少人数の作業者が 1 つの製品の組立てをほぼ全工程担当する方式で、品種が変わっても段取り替えの影響が小さく、多品種少量の生産に向きます。ライン生産方式は、同一製品を大量に流れ作業で作る場合に効率が高く、本件のような頻繁な切り替えには向きません。本件の条件（多品種、少量、切り替えが頻繁）には、セル生産方式が合います。
    why:
      - 受注を断ることは、生産方式の選択ではありません。
      - ライン生産は、同一製品の大量生産で真価を発揮する方式であり、頻繁な切り替えでは効率が落ちます。
      - ロット生産は、まとめて作る分だけ在庫を持ち、切り替えのたびに設備を止める必要があります。
      - 正解です。品種の切り替えへの柔軟さが、本件の条件に合います。
    know: 生産方式の選択は、「品種の多さ × 量」という条件と、方式の長所の対応で判断することが要点である。
    terms:
      - セル生産方式
      - ライン生産
    verify:
      manual: 多品種少量で切り替えが頻繁という条件には、少人数が全工程を担当し切り替えに柔軟なセル生産方式が適することを、ライン生産（大量生産向き）との対比で確認した。
  - id: A21-502
    topic: 21-2-3
    diff: 3
    scope: 21-2-3 かんばん方式（後工程引き取り）。前工程は後工程が引き取った分だけ作ることで、在庫の持ちすぎを防ぐ仕組みの適用判断
    prereq: かんばん方式では、後工程が必要なものを、必要なときに、必要な量だけ前工程から引き取り、前工程は引き取られた分だけを補充生産すること
    hard: 在庫過多の原因が「前工程の見込み生産」にあることを読み取り、引き取りを合図にする仕組みと結び付ける必要がある。
    q: |
      ある工場では、前工程が見込みで部品を作り続けるため、工程間に部品の在庫が山積みになっている。改善の進め方として、かんばん方式の考え方に沿ったものはどれか。
    c:
      - 工程間の在庫を全て倉庫に移し、工場内では見えないようにする
      - 後工程は、必要な部品を全て外部から購入するように切り替える
      - 後工程が使った分だけを、前工程が補充して作るようにし、かんばんをその引き取りと補充の合図として使う
      - 前工程の生産量を増やし、在庫をさらに積み増して欠品を防ぐ
    a: ウ
    exp: |
      かんばん方式は、後工程引き取りの仕組みです。後工程は、必要なものを、必要なときに、必要な量だけ前工程から引き取ります。前工程は、引き取られた分だけを補充して作ります。かんばんは、その引き取りと補充生産の指示の役割を持ちます。これにより、作りすぎが抑えられ、工程間の在庫が減ります。本件の問題は、前工程の見込み生産による作りすぎであり、この仕組みが直接効きます。
    why:
      - 在庫を移して見えなくすることは、問題の解決にはなりません。
      - 外部購入への切替えは、工程間の引き取りの仕組みの改善ではありません。
      - 正解です。引き取った分だけ作ることが、作りすぎを防ぎます。
      - 生産量を増やすことは、在庫過多の問題を悪化させます。
    know: かんばん方式の要点は、「押す生産から、引く生産へ」という転換である。在庫の問題を作り方の仕組みから判断することが鍵である。
    terms:
      - かんばん方式
      - 後工程引き取り
    verify:
      manual: 前工程の見込み生産で工程間の在庫が山積みになる問題に対して、後工程が引き取った分だけを前工程が補充生産するかんばん方式が改善になることを確認した。
  - id: A21-503
    topic: 21-3-2-1
    diff: 3
    scope: 21-3-2-1 EDI の仕組み。取引先との受発注データを、標準化された形式で電子的に交換し、手作業と書式のばらつきをなくす進め方の判断
    prereq: EDI（電子データ交換）は、企業間で受発注などの取引データを、あらかじめ取り決めた標準の形式で、コンピュータ間で交換する仕組みであること
    hard: 問題の本質が「電子化の有無」ではなく「書式の標準化と自動連携」にあることを読み取る必要がある。
    q: |
      受発注業務で、取引先ごとに異なる書式の FAX や電子メールで注文が届き、その都度、自社のシステムへ手入力しているため、入力ミスと工数が問題になっている。改善として、EDI の導入が適切と判断される理由はどれか。
    c:
      - 紙の注文書を画像として保存できるため、保管場所を減らせるから
      - 取引データを標準化された形式でシステム間で直接交換できるため、手入力がなくなり、ミスと工数を減らせるから
      - 取引先との電話連絡の回数を増やし、口頭で確認できるから
      - 注文の内容を、自社の担当者が判断して修正できるから
    a: イ
    exp: |
      EDI（Electronic Data Interchange）は、受発注などの取引データを、企業間で取り決めた標準の形式で、コンピュータ間で交換する仕組みです。本件の問題は、書式のばらつきによる手入力と、そのミスです。EDI では、相手のシステムから自社のシステムへデータが直接連携されるため、手入力そのものがなくなります。紙を画像で保存する電子化（イメージ化）とは異なり、データとして連携できることが要点です。
    why:
      - 画像としての保存は、データの連携ではなく、手入力の問題は解消されません。
      - 正解です。標準形式でのシステム間連携が、手入力をなくします。
      - 電話連絡の増加は、自動化の方向とは逆です。
      - 担当者が内容を修正することは、EDI の目的ではなく、かえって誤りの原因になります。
    know: EDI の要点は、「電子化」ではなく「標準化されたデータの、システム間の直接交換」である。似た言葉の仕組みとの違いが鍵である。
    terms:
      - EDI
      - 電子データ交換
    verify:
      manual: 取引先ごとに書式が異なる注文の手入力が問題である状況に対して、標準形式でシステム間に直接データを交換するEDIが、手入力とミスをなくす改善になることを確認した。
  - id: A21-504
    topic: 21-4-1
    diff: 3
    scope: 21-4-1 IoT の活用（予知保全）。設備に取り付けたセンサーのデータを集め、異常の兆候を捉えて、故障する前に保全する進め方の判断
    prereq: 予知保全は、設備の状態をセンサーなどで監視し、振動や温度の変化から異常の兆候を捉えて、故障の前に保全を行う考え方であること
    hard: 定期保全（時間基準）や事後保全（壊れてから直す）との違いを、事例の進め方から読み分ける必要がある。
    q: |
      工場の設備について、故障してから修理する進め方では、生産の停止が大きな損失になっている。設備にセンサーを取り付け、振動と温度のデータを継続的に集めて、異常の兆候が見えた時点で保全を行うように変えた。この保全の考え方はどれか。
    c:
      - '定期保全: 使用時間や期間を基準に、状態にかかわらず保全する'
      - '改良保全: 故障の原因を取り除くよう、設備の構造を改良する'
      - '予知保全: 状態を監視し、異常の兆候を捉えて、故障する前に保全する'
      - '事後保全: 故障が発生してから修理する'
    a: ウ
    exp: |
      保全の考え方は、「いつ保全するか」で分類します。予知保全は、センサーなどで設備の状態を監視し、振動や温度の変化といった異常の兆候に基づいて、故障の前に保全を行います。本件は、まさにその進め方です。事後保全は、従来の進め方（壊れてから直す）そのものです。定期保全は、状態ではなく時間を基準にします。改良保全は、保全の機会に構造を改良する考え方であり、本件の中心ではありません。
    why:
      - 定期保全の基準は時間であり、本件は状態（兆候）を基準にしています。
      - 設備の改良の話ではなく、保全の時期の決め方の話です。
      - 正解です。兆候に基づく保全が、予知保全です。
      - 事後保全は、故障が起きてから修理する、変える前の進め方そのものです。
    know: 保全方式の識別は、「保全のきっかけが、故障か、時間か、状態の兆候か」という軸で判断することが要点である。
    terms:
      - 予知保全
      - IoT
    verify:
      manual: センサーで振動と温度を監視し異常の兆候で保全する進め方が予知保全に当たることを、事後保全（故障後）・定期保全（時間基準）・改良保全（構造の改良）との、きっかけによる区別から確認した。
  - id: A21-505
    topic: 21-1-4-3
    diff: 3
    scope: 21-1-4-3 AI の利活用における留意点（学習データの偏り）。学習に使ったデータの偏りが、AI の判断の偏りとして現れる問題の識別
    prereq: AI の判断は学習データに依存し、データに偏りがあると、特定の属性の人に不利な判断をするなど、偏りが結果に現れることがあること
    hard: 問題の原因が、プログラムの誤りではなく、学習データの構成にあることを読み取る必要がある。検証の進め方（属性ごとの結果の確認）も含まれる。
    q: |
      採用選考の支援に AI を導入したところ、特定の属性の応募者が、経歴の内容によらず一律に低く評価される傾向が見つかった。AI の利活用における留意点として、この問題の捉え方として適切なものはどれか。
    c:
      - 学習データに偏りがあると、その偏りが AI の判断に反映される。過去の選考結果をそのまま学習させた場合、過去の偏りが再現されることがあるため、データの内容と、属性ごとの評価結果を検証する必要がある
      - 評価の傾向は、応募者の側の属性の問題であり、AI の側で対応することはない
      - AI の判断は客観的であるため、傾向が見つかっても、問題として扱う必要はない
      - AI の精度を上げるために、学習データの量を増やせば、偏りは自動的に解消される
    a: ア
    exp: |
      AI は、学習データに含まれる傾向を学びます。過去の選考結果に偏りがあれば、それを学習した AI の判断にも偏りが現れます。このため、利活用では、学習データの内容の確認と、導入後の結果を属性ごとに検証することが重要です。データの量を増やしても、偏りのあるデータが増えるだけでは、偏りは解消されません。AI の判断だから客観的だ、とは言えないことが、本件の教えるところです。
    why:
      - 正解です。データの偏りの反映という観点と、検証の必要性を捉えています。
      - 傾向の原因は AI の側（学習データ）にあり得るため、検証が必要です。
      - 偏りのある結果は、公平さの観点から問題であり、放置はできません。
      - 量を増やすだけでは、偏りの割合は変わらず、自動的には解消されません。
    know: AI の留意点の要点は、「AI はデータの写し鏡である」という視点である。導入時はデータの確認、運用時は結果の検証、という両面が鍵である。
    terms:
      - 学習データ
      - バイアス
    verify:
      manual: 特定の属性が一律に低く評価される傾向の問題が、学習データの偏りの反映として捉えられること、データ内容の確認と属性ごとの結果の検証が必要であることを確認した。
  - id: A21-506
    topic: 21-3-1-2
    diff: 3
    scope: 21-3-1-2 電子決済の方式の選択。店舗側の導入の負担と、利用者の使い方の観点から、コード決済などを選ぶ判断
    prereq: コード決済は、スマートフォンの画面のコードを読み取る方式で、店舗側は専用の端末が不要な場合があり、導入の負担が比較的小さいこと、IC カード決済は専用の読み取り端末を要すること
    hard: 決済方式の選択を、利用者の利便性だけでなく、店舗側の導入コストと運用の観点から判断する必要がある。
    q: |
      小規模な小売店が、現金以外の決済を新たに導入したい。初期費用を抑え、専用端末を置く場所も限られている。電子決済の方式の選択として、適切なものはどれか。
    c:
      - 現金の扱いを効率化するため、決済は導入せず、レジの台数を増やす
      - コード決済を導入する。店舗側は、印刷したコードの掲示や、既存のスマートフォン・タブレットの利用で始められる場合があり、初期の負担が小さい
      - 決済の導入は、店舗の規模にかかわらず、大規模店と同じ方式で統一しなければならない
      - IC カード決済だけを導入する。専用の読み取り端末の設置が前提であり、初期費用は最も小さい
    a: イ
    exp: |
      決済方式の選択では、店舗側の導入の負担も条件になります。コード決済は、利用者のスマートフォンに表示されたコードを店舗が読み取る、あるいは店舗のコードを利用者が読み取る方式であり、店舗側は専用の読み取り端末なしに始められる場合があり、初期費用を抑えられます。IC カード決済は、専用の読み取り端末の設置が前提であり、本件の「初期費用を抑えたい」「場所が限られる」という条件には、コード決済の方が合います。
    why:
      - レジを増やすことは、現金以外の決済の導入という目的に応えていません。
      - 正解です。導入の負担の小ささが、本件の条件に合います。
      - 方式の選択は、店舗の条件に応じて行うものであり、一律の統一が求められるものではありません。
      - IC カード決済は専用端末を要し、初期費用が最も小さいとは言えません。
    know: 決済方式の選択は、「利用者の使い方」と「店舗側の導入の負担」の両面から判断することが要点である。
    terms:
      - コード決済
      - 電子決済
    verify:
      manual: 初期費用を抑え場所も限られる小規模店舗の条件には、専用端末なしに始められる場合があるコード決済が適することを、ICカード決済（専用端末が前提）との対比で確認した。
  - id: A21-507
    topic: 21-4-1
    diff: 3
    scope: 21-4-1 デジタルツインの活用。実物の設備や工程を仮想空間に再現し、変更の影響を実物で試す前に検証する進め方の判断
    prereq: デジタルツインは、現実の対象（設備、工程、製品）の状態をデータで仮想空間に再現し、シミュレーションによる検証や予測に使う仕組みであること
    hard: 単なる 3 次元の見た目の再現ではなく、実物の状態と結び付いた再現であることと、検証を仮想側で行う利点を読み取る必要がある。
    q: |
      工場の生産ラインの配置換えを検討している。実物のラインを止めて試すことはできないため、ラインの設備と流れを仮想空間に再現し、配置換えの影響を事前に検証することにした。この仕組みの活用として、適切なものはどれか。
    c:
      - 'POS システム: 販売時点の情報を収集し、在庫や売上を管理する'
      - 'トレーサビリティ: 生産から販売までの履歴を記録し、問題の発生時に追跡する'
      - 'かんばん方式: 後工程の引き取りに合わせて、前工程が補充生産する'
      - 'デジタルツイン: 実物の状態をデータで仮想空間に再現し、変更の影響を仮想側で検証する'
    a: エ
    exp: |
      デジタルツインは、現実の対象の状態をデータで仮想空間に再現する仕組みです。実物のラインの再現（ツイン）に対して変更を加えて検証することで、実物を止めることなく、配置換えの影響を事前に確かめられます。本件のように「実物では試せない変更を、仮想側で試す」ことが、代表的な活用です。他の選択肢は、いずれも履歴の追跡、生産の仕組み、販売の情報の仕組みであり、仮想空間での再現と検証ではありません。
    why:
      - 販売時点の売上情報を収集する仕組みであり、工場の設備の再現とは対象が異なります。
      - 変更の履歴を記録して追跡する仕組みであり、設備を仮想空間に再現して検証する仕組みではありません。
      - 生産の進み具合に応じて生産量を調整する仕組みであり、設備を仮想空間に再現する仕組みではありません。
      - 正解です。実物の再現による、仮想側での検証です。
    know: デジタルツインの要点は、「実物と結び付いた仮想の再現で、試せないことを試す」ことである。見た目の模型との違いが鍵である。
    terms:
      - デジタルツイン
    verify:
      manual: 生産ラインを仮想空間に再現して配置換えの影響を事前に検証する仕組みがデジタルツインに当たることを、トレーサビリティ・かんばん方式・POSとの、目的による区別から確認した。
  - id: A21-508
    topic: 21-5-1-3
    diff: 3
    scope: 21-5-1-3 自動車制御システムとリアルタイム性。障害物の検知から制動までを遅れなく行うために、組込み制御に求められる応答の性質の判断
    prereq: 組込みシステムの制御では、決められた時間内に処理を終えること（リアルタイム性）が求められる場合があり、安全に関わる制御では特に厳しく要求されること
    hard: 処理の速さ（平均的な性能）と、期限内に必ず終わること（リアルタイム性）の違いを読み取る必要がある。
    q: |
      自動車の自動ブレーキは、障害物を検知してから、決められた短い時間内に制動を開始しなければならない。このような制御に求められる性質として、適切なものはどれか。
    c:
      - '処理の量を増やすこと: 時間内に終わるかどうかよりも、多くの情報を処理できることが求められる'
      - 'ネットワークへの常時接続: 外部のサーバと通信し続けることが求められる'
      - '画面の表示の美しさ: 運転者への表示の見栄えが求められる'
      - 'リアルタイム性: 処理の平均的な速さではなく、決められた時間内に必ず処理を終えることが求められる'
    a: エ
    exp: |
      安全に関わる組込み制御では、処理が「速い」だけでは不十分で、「決められた時間内に必ず終わる」ことが求められます。これがリアルタイム性です。自動ブレーキのように、遅れが事故につながる制御では、この性質が設計の前提になります。平均的には速くても、時々期限を超えるようでは、安全な制御とは言えません。処理の量や表示、通信の話は、本件の要求とは別の観点です。
    why:
      - 処理量の多さは、期限の保証にはつながりません。
      - 常時接続は、制動の判断を車両側で完結させる本件の制御とは別の話です。
      - 表示の見栄えは、制動の制御の要求ではありません。
      - 正解です。期限内に必ず終わることが、リアルタイム性です。
    know: リアルタイム性の要点は、「速さ」ではなく「期限の保証」である。安全に関わる組込み制御の判断の軸として押さえることが鍵である。
    terms:
      - リアルタイム性
      - 組込みシステム
    verify:
      manual: 障害物の検知から決められた時間内に制動を開始しなければならない制御には、平均的な速さではなく期限内に必ず処理を終えるリアルタイム性が求められることを確認した。
