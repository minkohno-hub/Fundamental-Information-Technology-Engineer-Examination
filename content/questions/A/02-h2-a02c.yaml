questions:
  - id: A02-517
    topic: 2-2-2-1
    diff: 3
    scope: 2-2-2-1 グラフの幅優先探索。隣接する頂点を番号の小さい順にキューへ入れる規則で、訪問順序を追う問題
    prereq: 幅優先探索はキューを使い、始点に近い頂点から順に訪問すること、訪問済みの頂点は再びキューに入れないこと
    hard: キューへの出し入れの順序を正しく追わないと、深さ優先探索の順序と混ざってしまう。隣接頂点を入れる順番の規則も結果に影響する。
    q: |
      無向グラフの頂点 1 を始点として、幅優先探索を行う。各頂点からは、まだ訪問していない隣接頂点を、頂点番号の小さい順にキューへ入れるものとする。訪問順序として正しいものはどれか。

      隣接関係は次のとおりである。
      - 頂点 1： 2、3
      - 頂点 2： 1、4、5
      - 頂点 3： 1、6
      - 頂点 4： 2
      - 頂点 5： 2、6
      - 頂点 6： 3、5
    c:
      - 1、2、3、4、5、6
      - 1、3、6、5、2、4
      - 1、2、4、5、6、3
      - 2、3、4、5、6、1
    a: ア
    exp: |
      キューの動きを追います。
      - 頂点 1 を訪問し、隣接する 2、3 をキューに入れる → キューは (2, 3)
      - 2 を取り出して訪問し、隣接する 4、5 を入れる → キューは (3, 4, 5)
      - 3 を取り出して訪問し、隣接する 6 を入れる → キューは (4, 5, 6)
      - 以後は 4、5、6 の順に訪問し、6 の隣接は全て訪問済みです
      訪問順序は 1、2、3、4、5、6 です。始点からの距離（たどる辺の数）の小さい順に訪問されるのが、幅優先探索の特徴です。
    why:
      - 正解です。キューによる幅優先で、距離の小さい頂点から順に訪問されています。
      - 隣接頂点を番号の大きい順に選ぶ深さ優先探索でたどった場合の順序です。本問は幅優先探索であり、頂点 3 の前に頂点 2 を訪問します。
      - 深さ優先探索でたどった場合の順序です。幅優先では、頂点 2 の次に頂点 4 ではなく頂点 3 を訪問します。
      - 始点を最後に訪問する順序になっており、探索の開始点が誤っています。
    know: 幅優先探索はキュー、深さ優先探索はスタック（または再帰）で実現される。訪問順序は「始点からの距離の順」になるのが幅優先の性質であり、順序を問う問題ではキューへの出し入れを丁寧に追うことが要点である。
    terms:
      - 幅優先探索
      - キュー
      - グラフ
    verify:
      manual: キューの状態遷移を (2,3) → 2訪問 (3,4,5) → 3訪問 (4,5,6) → 以後 4、5、6 と全て追跡し、深さ優先の順序と番号降順の順序が誤答になることを確認した。
  - id: A02-518
    topic: 2-2-2-1
    diff: 3
    scope: 2-2-2-1 グラフの深さ優先探索。隣接頂点を番号の小さい順に選んで深くたどる規則で、訪問順序を追う問題
    prereq: 深さ優先探索は、たどれる限り奥へ進み、行き止まりで戻ること、戻った先でまだ訪問していない隣接頂点があればそちらへ進むこと
    hard: 行き止まりから戻る（バックトラックする）位置を正しく追う必要がある。特に、奥の頂点から戻った後に、浅い頂点の未訪問の隣接へ進む順序が問われる。
    q: |
      無向グラフの頂点 1 を始点として、深さ優先探索を行う。各頂点では、まだ訪問していない隣接頂点のうち番号が最も小さいものを次に選ぶものとする。訪問順序として正しいものはどれか。

      隣接関係は次のとおりである。
      - 頂点 1： 2、3
      - 頂点 2： 1、4
      - 頂点 3： 1、5、6
      - 頂点 4： 2、6
      - 頂点 5： 3
      - 頂点 6： 3、4
    c:
      - 1、2、4、6、3、5
      - 1、2、4、3、6、5
      - 1、3、6、4、2、5
      - 1、2、3、4、5、6
    a: ア
    exp: |
      深さ優先の動きを追います。
      - 1 → 2 → 4 と進み、4 の隣接で未訪問の 6 へ進みます
      - 6 の隣接（3、4）は、4 が訪問済み、3 が未訪問なので 3 へ進みます
      - 3 の隣接で未訪問の 5 へ進みます
      - 5 は行き止まりで、全ての頂点を訪問済みです
      訪問順序は 1、2、4、6、3、5 です。ポイントは、頂点 6 から隣接する頂点 3 へ進めるため、1 まで戻らずに 3 を訪問できることです。
    why:
      - 正解です。深くたどり、6 から 3 へ進んで 5 に至る順序です。
      - 頂点 4 から 6 ではなく 3 へ戻ったとする順序です。4 の隣接には 3 は含まれず、6 が未訪問で選ばれます。
      - 隣接頂点を番号の大きい順に選んだ場合の順序です。本問の規則は小さい順です。
      - 番号順に訪問しただけの並びであり、探索の規則による順序ではありません。
    know: 深さ優先探索は「行けるところまで進み、行き止まりで戻る」探索。戻る位置は直前の頂点とは限らず、未訪問の隣接を持つ最も近い祖先まで戻る（本問では 6 から直接 3 へ進める）点が要点である。
    terms:
      - 深さ優先探索
      - スタック
      - グラフ
    verify:
      manual: 訪問の進行（1→2→4→6→3→5）を隣接関係と照合し、6 の隣接に 3 が含まれるため戻らずに進めること、番号順や降順規則の並びが規則と一致しないことを確認した。
  - id: A02-519
    topic: 2-3-1
    diff: 3
    scope: 2-3-1 ヒープへの要素の挿入。最大ヒープを表す配列の末尾に要素を加え、親との交換で適切な位置まで上げる操作を追う問題
    prereq: 配列による完全二分木の表現（要素 i の親は要素 i ÷ 2 の切り捨て）、最大ヒープは親が子以上の値を持つこと
    hard: 挿入した要素が、親と比べて交換されるたびに位置が半分ずつ上がることを、添字の計算とともに追う必要がある。
    q: |
      最大ヒープを表す配列が {50, 30, 40, 10, 20, 35} である。ここに値 45 を挿入し、ヒープの性質を保つように再構成したとき、45 が入る位置は配列の何番目か。ここで、配列の要素番号は 1 から始まり、要素 i の親は要素番号 (i ÷ 2 の商）である。
    c:
      - '7'
      - '3'
      - '1'
      - '6'
    a: イ
    exp: |
      挿入は、末尾に仮置きしてから親と比較して上げる操作です。
      - 45 を末尾（7 番目）に置く → {50, 30, 40, 10, 20, 35, 45}
      - 親は 7 ÷ 2 の商 ＝ 3 番目の 40 です。45 ＞ 40 なので交換 → {50, 30, 45, 10, 20, 35, 40}
      - 新しい親は 3 ÷ 2 の商 ＝ 1 番目の 50 です。45 ＜ 50 なので交換せず終了します
      45 の最終位置は 3 番目です。
    why:
      - 末尾に置いたまま再構成しなかった場合の位置です。40 より大きいため、このままではヒープの性質を満たしません。
      - 正解です。40 とだけ交換し、3 番目が最終位置です。
      - 1 番目の 50 とも交換した場合の位置です。45 は 50 より小さいため、根までは上がりません。
      - 親を (i － 1) の位置などと取り違えた場合に近い位置です。親は i ÷ 2 の商で求めます。
    know: ヒープへの挿入は「末尾に置いて、親より大きい間は交換して上げる」操作であり、上がる回数は木の高さ程度で収まる。親子の添字の関係（親は i ÷ 2 の商）が、配列による木表現の基本である。
    terms:
      - ヒープ
      - 二分木
    verify:
      type: value
      value: 3
  - id: A02-520
    topic: 2-2-2-1
    diff: 3
    scope: 2-2-2-1 二分探索木の探索。挿入の順序によって決まる木の形をたどり、目的の値を探すときの比較回数を数える問題
    prereq: 二分探索木は、左の部分木の値が全てその頂点より小さく、右の部分木の値が全て大きいこと、挿入は探索と同じ経路をたどって空いた位置に置くこと
    hard: 木の形は挿入の順序で決まるため、まず6つの値の挿入を全てたどって木を組み立て、その上で探索の経路を数えるという2段階の作業が必要になる。
    q: |
      空の二分探索木に、値 30、20、40、10、25、35 をこの順に挿入した。その後、値 25 を探索するとき、値を比較する回数は何回か。ここで、二分探索木では、現在の頂点より小さい値は左へ、大きい値は右へ進むものとする。
    c:
      - '4'
      - '3'
      - '2'
      - '6'
    a: イ
    exp: |
      挿入によってできる木は次の形です。
      - 30 が根、左に 20、右に 40
      - 20 の左に 10、右に 25
      - 40 の左に 35
      25 の探索は、30（25 は小さいので左へ）→ 20（25 は大きいので右へ）→ 25（一致）と進み、比較は 3 回です。
    why:
      - 20 の子を両方とも確認する数え方をした場合の回数です（30、20、10、25）。二分探索木では、大小の判定で進む方向を 1 つに絞ります。
      - 正解です。比較は 30、20、25 の 3 回です。
      - 根から数えて深さだけを見た場合などに近い回数です。経路は 30、20、25 の 3 頂点です。
      - 全ての頂点と比較した場合の回数です。探索は 1 本の経路だけをたどります。
    know: 二分探索木の探索コストは、木の形（挿入順序で決まる）における目的値の深さで決まる。整った形では比較回数は少なく、偏った形では線形探索に近くなる。
    terms:
      - 二分探索木
      - 探索
    verify:
      type: value
      value: 3
  - id: A02-521
    topic: 2-2-2-1
    diff: 3
    scope: 2-2-2-1 クイックソートの分割。先頭の要素をピボットとして区間を分割したとき、ピボットの最終位置が、ピボットより小さい要素の個数で決まることを問う問題
    prereq: 分割の後は、ピボットより小さい要素が全て左、大きい要素が全て右に集まり、ピボットはその境界の位置に確定すること
    hard: 分割中の要素の動きを追わなくても、ピボットの位置は「ピボットより小さい要素の個数」から決まることを見抜く必要がある。ピボットが先頭の要素である点も読み取りが要る。
    q: |
      配列 {40, 25, 60, 15, 35, 50, 45} に対して、クイックソートの分割を 1 回行う。ピボットは先頭の要素（40）とし、ピボットより小さい要素を全て左側に、大きい要素を全て右側に集める。分割の後、ピボット（40）が入るのは配列の何番目か。ここで、要素番号は 1 から始まる。
    c:
      - '4'
      - '7'
      - '5'
      - '3'
    a: ア
    exp: |
      分割後のピボットの位置は、ピボットより小さい要素の個数で決まります。40 より小さい要素は 25、15、35 の 3 個です。これらが左側に集まるため、ピボットはその次の位置、すなわち 4 番目に入ります。右側には 60、50、45 の 3 個が入ります。
    why:
      - 正解です。小さい要素 3 個の次に当たる 4 番目が、ピボットの確定位置です。
      - 配列の末尾であり、ピボットが最大値の場合の位置です。40 より大きい要素が 3 個あります。
      - ピボット自身も小さい側に数えてしまった場合の値です。40 以下は 4 個ありますが、ピボットの位置は、ピボットより小さい要素の個数に 1 を足したものです。
      - ピボットより小さい要素の個数そのものです。ピボットの位置は、その個数に 1 を足した番目です。
    know: クイックソートの分割では、ピボットの最終位置だけがその回で確定する。その位置は、ピボットより小さい要素の個数に 1 を足した場所であり、分割中の交換の細部を追わなくても求められる。
    terms:
      - クイックソート
    verify:
      type: value
      value: 4
  - id: A02-522
    topic: 2-2-2-1
    diff: 3
    scope: 2-2-2-1 マージソートの併合。整列済みの2つの部分列を併合するときの、要素の比較回数を数える問題
    prereq: 併合は、両方の部分列の先頭同士を比較して小さい方を取り出す操作の繰り返しであり、一方の列が尽きたら残りは比較なしに移すこと
    hard: 比較が起きるのは両方の列に要素が残っている間だけであり、最後に残った要素の移動では比較が起きないことを数え分ける必要がある。
    q: |
      整列済みの部分列 {2, 5, 8} と {3, 4, 9} を、マージソートの手順で併合する。この併合における要素の比較回数は何回か。
    c:
      - '4'
      - '6'
      - '5'
      - '9'
    a: ウ
    exp: |
      先頭同士の比較を追います。
      - 2 と 3 を比較 → 2 を取り出す（1 回目）
      - 5 と 3 を比較 → 3 を取り出す（2 回目）
      - 5 と 4 を比較 → 4 を取り出す（3 回目）
      - 5 と 9 を比較 → 5 を取り出す（4 回目）
      - 8 と 9 を比較 → 8 を取り出す（5 回目）
      - 左の列が尽きたので、残りの 9 は比較なしに移します
      比較回数は 5 回です。
    why:
      - 途中の比較を 1 回数え落とした場合の回数です。比較は、2 と 3、5 と 3、5 と 4、5 と 9、8 と 9 の 5 回行われます。
      - 出力される要素の個数（6）と混同した値です。最後の要素の移動では比較は起きません。
      - 正解です。両方の列に要素がある間の比較は 5 回です。
      - 2つの列の要素数の積など、別の量です。併合の比較は先頭同士だけで行われます。
    know: 併合の比較回数は、両列の要素数の合計より最大で 1 回少なくなる（最後に残った要素は比較なしに移るため）。総当たりの比較ではなく、先頭同士だけを比べる点が併合の効率の元である。
    terms:
      - マージソート
    verify:
      type: value
      value: 5
  - id: A02-523
    topic: 2-3-1
    diff: 4
    scope: 2-3-1 完全二分木の節点と葉の数。左詰めで節点が置かれる完全二分木について、最下層の埋まり方から葉の総数を数える問題
    prereq: 完全二分木は、最下層以外は全て埋まり、最下層は左から詰めて置かれること、葉は子を持たない節点であること
    hard: 葉は最下層だけにあるのではなく、最下層の節点の親にならなかった前層の節点も葉になる。2つの層にわたって葉を数える必要がある。
    q: |
      節点数が 20 の完全二分木がある。根を第 1 層として、最下層の節点は左から詰めて置かれている。この木の葉（子を持たない節点）の数はいくつか。
    c:
      - '8'
      - '9'
      - '11'
      - '10'
    a: エ
    exp: |
      層ごとに数えます。
      - 第 1〜4 層は全て埋まり、節点数は 1 ＋ 2 ＋ 4 ＋ 8 ＝ 15 です
      - 残りの 20 － 15 ＝ 5 個は第 5 層に、左から詰めて置かれます
      - 第 5 層の 5 個は全て葉です
      - 第 4 層の 8 個のうち、子を持つのは第 5 層の 5 個の親になる 3 個（左から 3 個）だけで、残りの 5 個は葉です
      葉の総数は 5 ＋ 5 ＝ 10 です。
    why:
      - 第 4 層の節点数そのものです。葉は第 5 層と第 4 層の両方にあります。
      - 第 5 層の 5 個と、第 4 層の子を持たない節点を 4 個とした場合の数です。第 4 層で子を持つのは 3 個なので、葉は 5 個です。
      - 第 5 層の節点の親の数を数え方で取り違えた場合の数です。親は 3 個であり、葉の計算は 10 になります。
      - 正解です。第 5 層の葉 5 個と、第 4 層の葉 5 個で、合計 10 個です。
    know: 完全二分木の葉は最下層だけとは限らない。最下層が部分的にしか埋まっていないときは、その親にならなかった前層の節点も葉になる。左詰めという条件から、親になる節点の数（最下層の節点数を 2 で割って切り上げ）が決まる点が要点である。
    terms:
      - 完全二分木
      - 二分木
    verify:
      type: value
      value: 10
  - id: A02-524
    topic: 2-2-2-1
    diff: 3
    scope: 2-2-2-1 二次探査法によるハッシュ表への挿入。衝突のたびに調べる位置が平方数（1、4、9、…）ずつ離れていく探査をたどる問題
    prereq: ハッシュ関数 h(k) ＝ k mod 10、二次探査法では衝突時に（ハッシュ値 ＋ i の 2 乗）を表の大きさで割った余りの位置を順に調べること
    hard: 探査の間隔が 1、2、3 と増えるのではなく、1、4、9 という平方数で増えることと、表の末尾を超えた位置は剰余を取って先頭側へ回ることを、両方正しく適用する必要がある。
    q: |
      大きさ 10 のハッシュ表に、ハッシュ関数 h(k) ＝ k mod 10 と二次探査法で、キー 13、23、33 がこの順に格納されている。二次探査法では、衝突したとき、ハッシュ値の位置から 1 の 2 乗、2 の 2 乗、3 の 2 乗、…だけ先の位置を順に調べる（表の大きさを超える位置は、大きさで割った余りを位置とする）。表の位置は 0 から 9 とする。ここに新たにキー 43 を格納するとき、43 が入る位置はどれか。
    c:
      - '7'
      - '5'
      - '2'
      - '3'
    a: ウ
    exp: |
      まず現在の表の状態を確認します。
      - 13： h ＝ 3 → 位置 3 に格納
      - 23： h ＝ 3、位置 3 は使用中のため、3 ＋ 1 ＝ 位置 4 に格納
      - 33： h ＝ 3、位置 3、4 は使用中のため、3 ＋ 4 ＝ 位置 7 に格納

      43 のハッシュ値は 3 です。位置 3、4、7 はいずれも使用中であり、次に調べるのは 3 ＋ 9 ＝ 12、つまり位置 2（12 を 10 で割った余り）です。位置 2 は空いているため、43 は位置 2 に入ります。
    why:
      - 探査の途中の位置（3 ＋ 2 の 2 乗 ＝ 7）ですが、そこも 33 が使用中です。
