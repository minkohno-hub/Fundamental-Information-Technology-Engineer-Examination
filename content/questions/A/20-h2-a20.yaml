category: '20'
batch: H2
reviewed:
  at: '2026-10-30'
  method: 独立レビュアーが盲検で再解答し、正答・解説・重複を確認
questions:
  - id: A20-501
    topic: 20-1-1-1
    diff: 3
    scope: 20-1-1-1 技術開発の関門の位置の判定。研究の段階で止まっているのか、事業化の段階で止まっているのかを、事例の状況から切り分ける問題
    prereq: 研究の成果を開発につなげる段階の関門が「魔の川」、開発の成果を事業化する段階の関門が「死の谷」、事業化後に市場の競争を生き抜く関門が「ダーウィンの海」であること
    hard: 関門の名前の定義ではなく、事例が過程のどの位置で止まっているか（原理の実証は終わったが、開発プロジェクトが始まっていない）を読み取る必要がある。
    q: |
      大学との共同研究で、新しい材料の原理の実証には成功した。しかし、製品に使える形にするための開発プロジェクトに予算が付かず、研究の成果が、開発の段階に進めないまま止まっている。この停滞が起きている関門はどれか。
    c:
      - 死の谷
      - キャズム
      - 魔の川
      - ダーウィンの海
    a: ウ
    exp: |
      技術が事業になるまでの過程では、段階ごとに越えにくい関門があります。研究の成果を開発につなげる段階の関門が「魔の川」です。本件は、原理の実証（研究）には成功しましたが、開発プロジェクト自体が始まっておらず、止まっているのは研究から開発への移行の段階です。「死の谷」は、開発に成功した成果を事業化する段階の関門であり、本件はまだその手前の段階にいます。
    why:
      - 死の谷は、開発の成果を事業化する段階の関門です。本件は、開発プロジェクトが始まっていません。
      - キャズムは、事業化された製品の、採用者の層の広がりに関する溝であり、研究開発の段階の関門ではありません。
      - 正解です。研究から開発への移行で止まっており、魔の川に当たります。
      - ダーウィンの海は、事業化した製品が市場の競争を生き抜く段階の関門であり、本件のはるか先の段階です。
    know: 技術開発の関門の判定は、「今、過程のどこで止まっているか」という位置の読み取りが要点である。研究→開発は魔の川、開発→事業化は死の谷、という段階の対応が鍵である。
    terms:
      - 魔の川
      - 死の谷
      - ダーウィンの海
    verify:
      manual: 原理の実証に成功したが開発プロジェクトに予算が付かず研究段階にとどまっている事例が、研究から開発への移行の関門である魔の川に当たることを、死の谷（事業化の関門）・ダーウィンの海（市場競争）・キャズム（採用の広がり）との段階の区別から確認した。
  - id: A20-502
    topic: 20-1-1-1
    diff: 3
    scope: 20-1-1-1 キャズム。新技術好きの初期採用者には売れた製品が、実用性を重視する多数派に広がらない事例の識別
    prereq: キャズムは、アーリーアダプタ（初期採用者）とアーリーマジョリティ（初期多数採用者）の間にある、採用が進まなくなる溝であること
    hard: 採用者層の違い（目新しさを求める層と、実績と実用を求める層）を読み取り、溝の位置を特定する必要がある。
    q: |
      新しい業務支援ツールを発売したところ、新しいもの好きの利用者には好評で一定数が売れた。しかしその後、実績や使い勝手の確かさを重視する一般の利用者層には広がらず、売上が伸び悩んでいる。この状況の説明として、適切なものはどれか。
    c:
      - キャズム（溝）に直面している。初期採用者と、実用を重視する多数派の間には、求めるものの違いによる溝がある
      - コモディティ化が進んだ。競合製品との差がなくなった
      - 死の谷に直面している。事業化の資金が不足している
      - 幻滅期に入った。新技術への期待が、市場全体で冷めた
    a: ア
    exp: |
      新製品の採用者は、目新しさを好む層から、実用と実績を重視する層へと広がっていきます。両者の間には、求めるものの違いによる大きな溝（キャズム）があり、ここを越えられない製品は、初期の好評にもかかわらず広がりません。本件は、製品が事業化され、初期の利用者には売れた後の話であり、資金の関門（死の谷）ではありません。幻滅期は技術への期待の循環の話、コモディティ化は差別化が失われる話であり、本件の状況とは異なります。
    why:
      - 正解です。採用者層の間の溝が、伸び悩みの説明です。
      - 差別化の消失の話ではなく、利用者層の広がりの段階の問題です。
      - 資金の関門の話ではありません。製品は発売され、売れ始めています。
      - 幻滅期は、新技術への社会的な期待の移り変わりの話であり、採用者層の広がりの話ではありません。
    know: キャズムの要点は、「売れた相手」と「次に売れるべき相手」の違いである。初期の成功がそのまま多数派への広がりを保証しない、という点が鍵である。
    terms:
      - キャズム
      - アーリーアダプタ
    verify:
      manual: 初期採用者には売れたが実用重視の多数派に広がらない状況がキャズムに当たることを、死の谷（資金の関門）・幻滅期（期待の循環）・コモディティ化（差別化の消失）との区別から確認した。
  - id: A20-503
    topic: 20-2-1
    diff: 3
    scope: 20-2-1 ハイプサイクル。新技術への期待が、過熱の頂点から幻滅期を経て成熟へ向かう流れにおける、段階の識別
    prereq: ハイプサイクルでは、新技術が登場し、期待が膨らむ過熱期を経て、期待どおりでない現実に期待が冷める幻滅期に入り、その後、理解が進んで安定期へ向かうこと
    hard: 事例の描写（大きく取り上げられた後に、期待外れの声が増える）から、曲線上の段階を読み取る必要がある。
    q: |
      ある新技術は、登場直後にメディアで大きく取り上げられ、「社会を変える」と期待が急速に膨らんだ。しかし、実際の導入事例で限界や問題が目立ち始め、「期待外れだった」という論調が増えている。ハイプサイクルにおける、この技術の位置はどれか。
    c:
      - '過熱期: 期待が頂点に向かって膨らんでいる段階'
      - '幻滅期: 過熱した期待が、現実の限界に直面して冷めていく段階'
      - '安定期: 技術の利点が理解され、着実に普及する段階'
      - '黎明期: 技術が登場し、注目が始まった段階'
    a: イ
    exp: |
      ハイプサイクルは、新技術に対する期待の移り変わりを表したものです。登場（黎明期）の後、期待が急速に膨らむ過熱期があり、次に、現実の限界が見えて期待が冷める幻滅期が来ます。その後、技術の適切な使い道の理解が進み（啓蒙期）、着実な普及の安定期へ向かいます。本件は、過熱の後に「期待外れ」の論調が増えている段階であり、幻滅期に当たります。
    why:
      - 過熱期は期待が膨らんでいる最中の段階です。本件は、その後の冷めていく局面です。
      - 正解です。期待が冷めていく局面が、幻滅期です。
      - 安定期は、理解が進んで普及が着実になる後の段階です。
      - 黎明期は登場直後の段階です。本件は、すでに過熱を経ています。
    know: ハイプサイクルの要点は、期待の「膨らみ」と「冷め」の順序である。事例の論調の変化から、曲線上の位置を読み取ることが鍵である。
    terms:
      - ハイプサイクル
      - 幻滅期
    verify:
      manual: 登場直後の過熱の後に期待外れの論調が増えている状況が、ハイプサイクルの幻滅期に当たることを、黎明期・過熱期・安定期との順序の区別から確認した。
  - id: A20-504
    topic: 20-1-1-3
    diff: 3
    scope: 20-1-1-3 PoC（概念実証）の適用。本格的な開発の前に、実現可能性の不確かな部分だけを小さく検証する進め方の判断
    prereq: PoC は、アイディアや技術が実現できるかどうかを、本格的な投資の前に、小規模な検証で確かめる活動であること
    hard: 検証すべき対象が「作れるかどうか（実現可能性）」であり、検証の範囲を不確かな部分に絞る、という進め方を読み取る必要がある。
    q: |
      新しい画像認識の技術を使ったサービスを構想しているが、その認識の精度が業務に耐える水準に達するかどうかが不確かである。本格的な開発に投資する前の進め方として、適切なものはどれか。
    c:
      - 不確かさを理由に、構想自体を破棄する
      - 精度の検証は行わず、サービス全体を完成させてから、利用者の反応を見る
      - 精度はベンダの公表値を信頼し、そのまま本格開発に進む
      - PoC として、実際の業務の画像を使って認識精度だけを小規模に検証し、結果を見て本格開発の可否を判断する
    a: エ
    exp: |
      PoC（Proof of Concept、概念実証）は、構想の実現可能性を、本格的な投資の前に小規模に確かめる活動です。本件の不確かな点は「認識精度が業務に耐えるか」であり、実際のデータでその点だけを先に検証すれば、大きな投資の前に判断ができます。不確かさを抱えたまま全体を作る進め方は、手戻りの危険が大きくなります。検証の対象を、不確かな部分に絞ることが要点です。
    why:
      - 不確かさは、検証で解消する対象であり、直ちに破棄する理由にはなりません。
      - 全体を完成させてからでは、実現できないことが分かったときの損失が大きくなります。
      - 公表値は条件が自社の業務と異なる場合があり、自社のデータでの確認が必要です。
      - 正解です。不確かな部分を先に小さく検証し、判断材料を得ます。
    know: PoC の要点は、「最も不確かな部分を、最も小さい費用で先に確かめる」という考え方である。本格開発の可否の判断材料を得る活動である点が鍵である。
    terms:
      - PoC
      - 概念実証
    verify:
      manual: 認識精度が業務に耐えるか不確かな状況で、本格開発の前に実際のデータで精度だけを小規模に検証する進め方がPoCとして適切であることを確認した。
  - id: A20-505
    topic: 20-1-1-1
    diff: 3
    scope: 20-1-1-1 オープンイノベーション。自社にない技術や知見を、外部の組織との連携で取り込む進め方の判断
    prereq: オープンイノベーションは、自社の内部の研究開発だけに頼らず、大学や他社などの外部の技術やアイディアを組み合わせて、革新を生み出す考え方であること
    hard: 自前主義の限界（必要な技術が社内にない）と、外部連携による解決を結び付ける必要がある。
    q: |
      製品の開発で、自社にはない材料技術が必要になった。自社で一から研究すると量産の時期に間に合わない。オープンイノベーションの考え方に沿った進め方はどれか。
    c:
      - その材料技術を持つ大学や企業と連携し、外部の知見を取り込んで開発を進める
      - 開発自体を中止し、既存製品の販売に専念する
      - 社内の研究部門を増員し、あくまで自社だけで研究を完結させる
      - 材料技術が不要になるよう、製品の仕様を大幅に落とす
    a: ア
    exp: |
      オープンイノベーションは、革新の源泉を自社の内部だけに閉じず、外部の技術やアイディアを積極的に取り込む考え方です。必要な技術が社内になく、時間の制約もある本件では、その技術を持つ大学や企業との連携が、考え方に沿った進め方です。自社だけで完結させる自前主義は、時間の点で本件の制約に合いません。仕様を落とすことや開発の中止は、問題の解決にはなりません。
    why:
      - 正解です。外部の知見の取り込みが、オープンイノベーションです。
      - 開発の中止は、革新の進め方ではありません。
      - 自社だけで完結させる進め方は、オープンイノベーションとは逆の考え方であり、時期にも間に合いません。
      - 仕様を落とすことは、必要な技術の問題を避けるだけで、解決にはなりません。
    know: オープンイノベーションの要点は、「必要な知見は、自社の中にあるとは限らない」という前提である。内と外の境界の開き方が、判断の鍵である。
    terms:
      - オープンイノベーション
    verify:
      manual: 自社にない材料技術が必要で時間の制約がある状況で、その技術を持つ大学や企業と連携して外部の知見を取り込む進め方が、オープンイノベーションに沿うことを確認した。
  - id: A20-506
    topic: 20-1-1-3
    diff: 3
    scope: 20-1-1-3 リーンスタートアップ。最小限の製品（MVP）で仮説を検証しながら、新規事業の不確実性を減らしていく進め方の判断
    prereq: リーンスタートアップでは、最小限の機能を持つ製品（MVP）を早期に出し、利用者の反応を測って、仮説の検証と方向の修正を繰り返すこと
    hard: 不確実性の高い事業で、「完成度を上げてから出す」進め方との違いを読み取る必要がある。
    q: |
      利用者の需要が読み切れない、新しいサービス事業を立ち上げる。リーンスタートアップの考え方に沿った進め方はどれか。
    c:
      - 競合の成功したサービスを、そのまま模倣して提供する
      - 需要の予測が付くまで、製品の開発には着手しない
      - 最小限の機能を持つ製品（MVP）を早期に出し、利用者の反応を測りながら、仮説の検証と修正を繰り返す
      - 1 年かけて機能を全て作り込み、完成した時点で初めて利用者に公開する
    a: ウ
    exp: |
      リーンスタートアップは、不確実性の高い新規事業のための進め方です。核となる仮説（利用者はこの価値を求めるはずだ）を、最小限の機能を持つ製品（MVP）で早期に確かめ、反応の測定結果に応じて、方向を維持するか修正するかを繰り返します。需要が読み切れない状況で、完成度を優先して長期間作り込む進め方は、外れたときの損失が大きくなります。本件の状況には、検証を繰り返す進め方が合います。
    why:
      - 模倣は、自社の利用者の需要の仮説を検証する進め方ではありません。
      - 需要の予測は、実際に製品を出して反応を見ることでしか確かめられない面があります。
      - 正解です。MVP による仮説の検証の繰り返しが、リーンスタートアップです。
      - 完成してから初めて公開する進め方では、需要の仮説の検証が最後までできません。需要が読み切れない状況では、長く作り込むほど、外れた場合の損失も大きくなります。
    know: リーンスタートアップの要点は、「作る前に売れるかは分からない。だから小さく出して測る」という姿勢である。不確実性への対処の仕方が鍵である。
    terms:
      - リーンスタートアップ
      - MVP
    verify:
      manual: 需要が読み切れない新規事業において、MVPを早期に出して反応を測り仮説の検証と修正を繰り返す進め方が、リーンスタートアップに沿うことを確認した。
  - id: A20-507
    topic: 20-2-2
    diff: 3
    scope: 20-2-2 技術ロードマップ。市場・製品・技術の層を時間軸で結び、必要な技術の開発時期を逆算して計画する進め方の判断
    prereq: 技術ロードマップは、市場の変化、製品の計画、必要な技術の開発を、時間軸の上に層として並べ、相互の関係を明らかにした計画の図であること
    hard: 単なる予定表ではなく、製品の時期から技術の開発時期を逆算する、層の間の結び付きを読み取る必要がある。
    q: |
      5 年後に新しい製品分野への参入を計画している。技術ロードマップの策定として、適切な進め方はどれか。
    c:
      - 今年度の開発予算の配分だけを決める
      - 現在の技術の延長で開発できる項目だけを、担当者ごとに一覧表にする
      - 競合他社の製品の発売時期だけを並べた表を作る
      - 市場の変化と製品の投入計画、その製品に必要な技術の開発計画を、時間軸の上に層として並べ、製品の時期から技術の開発時期を逆算して計画する
    a: エ
    exp: |
      技術ロードマップは、市場、製品、技術という層を、共通の時間軸の上に並べた計画の図です。製品をいつ出すかという計画から、その時点で必要な技術がいつまでに完成していなければならないかを逆算し、技術の開発の時期を定めます。これにより、長期の計画と個別の開発のつながりが見えるようになります。単なる項目の一覧や、競合の時期の表、単年度の予算では、この役割は果たせません。
    why:
      - 単年度の予算の配分は、長期の計画の図の役割とは異なります。
      - 現在の延長の項目の一覧では、将来の製品との結び付きや時期の逆算ができません。
      - 競合の時期だけでは、自社の製品と技術の計画にはなりません。
      - 正解です。層を時間軸で結び、逆算して計画するのが技術ロードマップです。
    know: 技術ロードマップの要点は、「市場の時間軸の上で、製品と技術を結び付ける」ことである。将来の製品から逆算する発想が鍵である。
    terms:
      - 技術ロードマップ
    verify:
      manual: 製品の投入計画から必要な技術の開発時期を逆算し、市場・製品・技術の層を時間軸で結ぶ計画が技術ロードマップの策定であることを確認した。
  - id: A20-508
    topic: 20-1-1-3
    diff: 3
    scope: 20-1-1-3 デザイン思考の適用。利用者の行動の観察から課題を捉え直し、解決策を考える進め方の判断
    prereq: デザイン思考では、利用者への共感（観察や対話による理解）を起点に、課題を定義し直し、アイディアの試作と検証を繰り返すこと
    hard: 技術や機能の発想から入るのではなく、利用者の実際の行動の理解から課題を定義し直す、という起点の違いを読み取る必要がある。
    q: |
      業務支援ツールの利用が一部の担当者に広がらない理由が、機能の不足なのか、使い方の分かりにくさなのか、判別できていない。デザイン思考の進め方として、適切なものはどれか。
    c:
      - まず新しい機能の候補を技術部門で列挙し、開発のしやすさの順に実装する
      - 利用者への説明会の回数を増やし、既存の使い方の徹底を図る
      - 競合ツールの機能一覧を調べ、不足している機能を全て追加する
      - 担当者の実際の作業を観察し、対話を通じて、つまずきの実態を理解した上で、解決すべき課題を定義し直す
    a: エ
    exp: |
      デザイン思考は、利用者への共感を起点とする問題解決の進め方です。まず、観察や対話によって利用者の行動と困り事を理解し、「本当の課題は何か」を定義し直します。本件のように原因が判別できていない段階では、機能の追加に進む前に、観察によって課題を捉え直すことが、進め方に沿っています。説明の徹底や競合の模倣は、課題の理解を深める活動ではありません。
    why:
      - 技術部門の発想と開発のしやすさが起点であり、利用者の理解が抜けています。
      - 使い方の徹底は、既存の理解の枠内での対処であり、課題の捉え直しにはなりません。
      - 競合の機能の模倣は、利用者の実態の理解とは別の進め方です。
      - 正解です。観察による理解から、課題を定義し直すのがデザイン思考の起点です。
    know: デザイン思考の要点は、「解くべき課題は、観察によって定義し直す」という起点である。解決策の列挙より先に、理解がある、という順序が鍵である。
    terms:
      - デザイン思考
    verify:
      manual: 利用が広がらない原因が判別できていない段階で、担当者の作業の観察と対話から課題を定義し直す進め方が、デザイン思考に沿うことを確認した。
