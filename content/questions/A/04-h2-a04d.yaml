questions:
  - id: A04-525
    topic: 4-2-2-1
    diff: 3
    scope: 4-2-2-1 階層キャッシュの実効アクセス時間。1次キャッシュと2次キャッシュのヒット率が段階的に与えられた場合の、加重平均による実効アクセス時間の計算
    prereq: 実効アクセス時間は、各段階に到達する確率でアクセス時間を加重平均したものであること、2次キャッシュへの到達は1次キャッシュのミスが条件になること
    hard: ヒット率が「全体に対する割合」か「ミスした中での割合」かを見分け、到達確率を掛け合わせて各段階の時間を重み付けする必要がある。
    q: |
      1 次キャッシュのヒット率は 80 ％で、アクセス時間は 5 ナノ秒である。1 次キャッシュでミスした場合にアクセスする 2 次キャッシュのヒット率は 90 ％で、主記憶までのアクセス時間の合計は 25 ナノ秒である。2 次キャッシュでもミスした場合は、主記憶までのアクセス時間の合計が 125 ナノ秒かかる。実効アクセス時間は何ナノ秒か。
    c:
      - '9'
      - '15'
      - '29'
      - '11'
    a: エ
    exp: |
      各段階に到達する確率で、アクセス時間を加重平均します。

      - 1 次でヒット（確率 0.8）: 5 ナノ秒
      - 2 次でヒット（確率 0.2 × 0.9 ＝ 0.18）: 25 ナノ秒
      - 主記憶まで（確率 0.2 × 0.1 ＝ 0.02）: 125 ナノ秒

      実効アクセス時間 ＝ 0.8 × 5 ＋ 0.18 × 25 ＋ 0.02 × 125
      ＝ 4 ＋ 4.5 ＋ 2.5
      ＝ 11 ナノ秒
    why:
      - 主記憶まで到達する経路を無視した場合の値（0.8 × 5 ＋ 0.2 × 25）です。到達確率は小さいものの、125 ナノ秒の経路も含めます。
      - 1 次と 2 次のアクセス時間を単純に平均した場合の値（（5 ＋ 25）÷ 2 ＝ 15）です。到達確率による重み付けが必要です。
      - 2 次キャッシュの段階を飛ばし、1 次でミスしたら主記憶へ行くとして計算した場合の値（0.8 × 5 ＋ 0.2 × 125 ＝ 29）です。
      - 正解です。到達確率で加重平均すると 11 ナノ秒です。
    know: 階層キャッシュの実効アクセス時間は、到達確率の掛け算（条件付きの確率）で各段階を重み付けする。ヒット率がどの範囲に対する割合かを読むことが要点である。
    terms:
      - キャッシュ
      - ヒット率
    verify:
      type: value
      value: 11
  - id: A04-526
    topic: 4-1-6
    diff: 3
    scope: 4-1-6 RAID5 の実効容量。ディスク本数とパリティの関係から、データの格納に使える容量を求める問題
    prereq: RAID5 では、パリティが各ディスクに分散して記録され、全体としてディスク 1 本分がパリティに使われること
    hard: 「1 本分がパリティ」という関係を、ディスクの総容量から引く形で適用する必要がある。RAID1（半分）や RAID6（2 本分）との混同を切り分ける。
    q: |
      2 テラバイトのディスク 6 本で RAID5 のディスクアレイを構成する。データを格納できる実効容量は何テラバイトか。
    c:
      - '10'
      - '12'
      - '6'
      - '8'
    a: ア
    exp: |
      RAID5 では、パリティ（誤り訂正の情報）が全ディスクに分散して記録され、容量としてはディスク 1 本分がパリティに使われます。

      実効容量 ＝ （6 － 1）× 2 テラバイト ＝ 10 テラバイト

      なお、ディスク 1 本が故障しても、残りのディスクとパリティからデータを復元できます。
    why:
      - 正解です。（6 － 1）× 2 ＝ 10 テラバイトです。
      - パリティの分を引かずに、総容量をそのまま答えた値です。1 本分はパリティに使われます。
      - RAID1（ミラーリング）で 2 本構成の場合など、半分になる計算に近い値です。RAID5 のパリティは 1 本分です。
      - パリティを 2 本分として引いた場合の値であり、RAID6 の計算です。本問は RAID5 です。
    know: RAID の実効容量は、冗長化の方式で決まる。RAID5 は「本数 － 1」、RAID6 は「本数 － 2」、RAID1 は半分、という対応が要点である。
    terms:
      - RAID5
      - パリティ
    verify:
      type: value
      value: 10
  - id: A04-527
    topic: 4-1-2
    diff: 3
    scope: 4-1-2 稼働率。1か月の稼働実績（総時間・故障回数・停止時間の合計）から MTBF と MTTR を求め、稼働率を計算する問題
    prereq: MTBF は総稼働時間を故障回数で割ったもの、MTTR は総停止時間を故障回数で割ったもの、稼働率は MTBF ÷（MTBF ＋ MTTR）であること
    hard: 総時間から停止時間を引いて稼働時間を求める段階と、2つの指標を求めてから稼働率に合成する段階の、2段の計算が必要である。
    q: |
      あるシステムの 1 か月（720 時間）の運用で、故障が 3 回発生し、停止時間の合計は 12 時間であった。この実績から求めた稼働率は、およそ何％か。
    c:
      - '99.2'
      - '99.7'
      - '95.2'
      - '98.3'
    a: エ
    exp: |
      まず、稼働時間は 720 － 12 ＝ 708 時間です。

      - MTBF ＝ 708 ÷ 3 ＝ 236 時間
      - MTTR ＝ 12 ÷ 3 ＝ 4 時間
      - 稼働率 ＝ MTBF ÷ （MTBF ＋ MTTR）＝ 236 ÷ 240 ＝ 0.9833…

      稼働率はおよそ 98.3 ％です。なお、708 ÷ 720 という計算でも同じ値が得られます。
    why:
      - 故障の回数を 6 回と数え違え、MTTR が 2 時間になった場合の値です（236 ÷ （236 ＋ 2）≒ 99.2）。故障は 3 回であり、MTTR は 4 時間です。
      - 停止時間を 2 時間と読み違えた場合の値です（（720 － 2）÷ 720 ≒ 99.7）。停止時間の合計は 12 時間でした。
      - 停止時間を故障回数で割らず（MTTR とせず）に、そのまま分母に使った場合の値です（236 ÷ （236 ＋ 12）≒ 95.2）。稼働率は MTBF と MTTR の比で求めます。
      - 正解です。MTBF 236 時間、MTTR 4 時間から、稼働率は 98.3 ％です。
    know: 稼働率の実績計算は、稼働時間＝総時間－停止時間、という切り分けから始まる。MTBF と MTTR を経由する経路と、稼働時間の割合を直接求める経路が一致することも確認の要点である。
    terms:
      - MTBF
      - MTTR
      - 稼働率
    verify:
      type: value
      value: 98.3
  - id: A04-528
    topic: 4-2-3
    diff: 3
    scope: 4-2-3 パイプライン処理の実行時間。段数と段当たりの時間から、多数の命令を実行する総時間を求める問題
    prereq: パイプラインでは、最初の命令が全段を通るまでの時間がかかり、その後は段当たりの時間ごとに 1 命令ずつ完了すること
    hard: 命令数に段当たりの時間を単純に掛けるのではなく、パイプラインが満たされるまでの初期の遅れ（段数分）を加える必要がある。
    q: |
      4 段のパイプラインで命令を実行する。各段の処理時間は 10 ナノ秒でそろっている。100 個の命令を実行するのに必要な時間は何ナノ秒か。
    c:
      - '400'
      - '1030'
      - '1000'
      - '4000'
    a: イ
    exp: |
      パイプラインでは、最初の命令が完了するまでに 4 段分（40 ナノ秒）かかり、その後は 10 ナノ秒ごとに 1 命令ずつ完了します。

      実行時間 ＝ （4 ＋ （100 － 1））× 10
      ＝ 103 × 10
      ＝ 1,030 ナノ秒

      段数と命令数を用いた （段数 ＋ 命令数 － 1）× 段の時間、という形で一般化できます。
    why:
      - 段数と命令数だけを掛けた値（4 × 100 ＝ 400）です。段当たりの処理時間（10 ナノ秒）を掛けていません。
      - 正解です。（4 ＋ 99）× 10 ＝ 1,030 ナノ秒です。
      - 命令数 × 段の時間だけを計算した値です。パイプラインが満たされるまでの、最初の命令の遅れが抜けています。
      - パイプラインを使わず、1 命令ずつ 4 段を直列に処理した場合の値（100 × 4 × 10）です。パイプラインでは段が重なって動きます。
    know: パイプラインの総時間は、初期の満たし時間＋定常状態の積み重ねで決まる。「段数＋命令数－1」という形は、スカラの性能計算の基本形である。
    terms:
      - パイプライン
    verify:
      type: value
      value: 1030
  - id: A04-529
    topic: 4-2-1-1
    diff: 3
    scope: 4-2-1-1 磁気ディスクの平均アクセス時間。回転数から求める平均回転待ち時間と、シーク時間の合計の計算
    prereq: 平均回転待ち時間は、1 回転にかかる時間の半分であること
    hard: 回転数（毎分）から 1 回転の時間（ミリ秒）への単位換算と、その半分を取る、という2つの操作を正しくつなげる必要がある。
    q: |
      回転数が 7,200 回転／分の磁気ディスクで、平均シーク時間が 3 ミリ秒のとき、平均アクセス時間はおよそ何ミリ秒か。ここで、データ転送時間は無視できるものとする。
    c:
      - '11.3'
      - '7.2'
      - '10.3'
      - '5.1'
    a: イ
    exp: |
      1 回転にかかる時間は、60 秒 ÷ 7,200 ＝ 8.33 ミリ秒です。目的のセクタがヘッドの下に来るまでの平均回転待ち時間は、その半分の 4.17 ミリ秒です。

      平均アクセス時間 ＝ 平均シーク時間 ＋ 平均回転待ち時間
      ＝ 3 ＋ 4.17
      ＝ およそ 7.2 ミリ秒
    why:
      - 回転待ち時間として 1 回転分を使い、シーク時間も加えた値です。回転待ちは平均では半回転分です。
      - 正解です。3 ＋ 4.17 ＝ およそ 7.2 ミリ秒です。
      - シーク時間を 2 ミリ秒と読み違え、回転待ち時間として 1 回転分（8.33 ミリ秒）を使った場合の値です（2 ＋ 8.33 ≒ 10.3）。シーク時間は 3 ミリ秒であり、回転待ちは平均で半回転分です。
      - 回転待ち時間を、1 回転の時間の 4 分の 1 として計算した場合の値です（3 ＋ 8.33 ÷ 4 ≒ 5.1）。平均回転待ちは半回転分です。
    know: ディスクのアクセス時間は、シーク時間と回転待ち時間の合計が中心であり、回転待ちは「1 回転の時間 ÷ 2」で求める。回転数から時間への単位換算が要点である。
    terms:
      - シーク時間
      - 回転待ち時間
    verify:
      type: value
      value: 7.2
  - id: A04-530
    topic: 4-2-2-2
    diff: 3
    scope: 4-2-2-2 アムダールの法則の逆算。目標の高速化率とコア数から、並列化可能でなければならない割合を求める計算
    prereq: 高速化率は 1 ÷（並列化できない割合 ＋ 並列化できる割合 ÷ コア数）で求めること、この式を、並列化できる割合について解くこと
    hard: 式を順方向に使うのではなく、目標の高速化率から並列化可能割合を逆算する必要があり、並列部分の高速化を落とした式で解く誤りと切り分ける必要がある。
    q: |
      ある処理を 8 コアのプロセッサで実行し、高速化率（1 コアの場合に対する速度の倍率）を 2 倍にしたい。アムダールの法則に基づくと、処理のうち並列化可能でなければならない割合は、およそ何％か。
    c:
      - '57'
      - '50'
      - '43'
      - '88'
    a: ア
    exp: |
      並列化可能な割合を p と置きます。高速化率の式は、1 ÷ （（1 － p）＋ p ÷ 8）＝ 2 です。分母が 0.5 になることから、（1 － p）＋ p ÷ 8 ＝ 0.5、つまり 1 － （7 ÷ 8）× p ＝ 0.5 であり、p ＝ 0.5 ÷ （7 ÷ 8）＝ 4 ÷ 7 ≒ 0.57 です。およそ 57 ％を並列化する必要があります。直列部分が残る限り高速化には上限があるため、目標の高速化率が大きいほど、必要な並列化割合は急激に高くなります。
    why:
      - 正解です。（1 － p）＋ p ÷ 8 ＝ 0.5 を解くと、p ＝ 4 ÷ 7 ≒ 57 ％です。
      - 並列化した部分も速くならないものとして、1 ÷ （1 － p）＝ 2 と置いた場合の値です。並列部分はコア数で割る必要があります。
      - 直列と並列の割合の置き方を取り違えて式を立てた場合の値です（（7 × p ＋ 1）÷ 8 ＝ 0.5 と置くと、p ≒ 43 ％になります）。並列化できない割合は （1 － p）です。
      - 並列化によって減らせる分の係数（1 － 1 ÷ 8 ＝ 0.875）を、そのまま必要な並列化割合として読み替えた値（およそ 88 ％）です。
    know: アムダールの法則の要点は、高速化率の上限が逐次部分の割合で決まることである。この式は、目標の高速化率から必要な並列化割合を逆算する使い方もでき、その場合は直列部分の影響の大きさが一層はっきりする。
    terms:
      - アムダールの法則
    verify:
      type: value
      value: 57
  - id: A04-531
    topic: 4-1-7
    diff: 3
    scope: 4-1-7 アクティブ・アクティブ構成の容量設計。両系が負荷を分け合う構成で、片系の故障時に残りの系が全体の負荷を引き受けるための余裕の考え方
    prereq: 負荷を分け合う構成では、片系が止まったときに、残りの系の処理能力が全体の負荷以上でなければ、サービスを維持できないこと
    hard: 冗長構成の「台数」ではなく、故障時の負荷の移動先の処理能力に着目する必要がある。通常時の負荷率の上限（50％）を、故障時の引き受け可能量から逆算する。
    q: |
      2 台のサーバで負荷を均等に分け合うアクティブ・アクティブ構成の Web システムがある。片方のサーバが故障しても、残りの 1 台でサービスの応答時間を維持したまま処理を継続したい。通常時の運用として適切なものはどれか。
    c:
      - 各サーバの負荷率を 90 ％程度まで高め、設備の利用効率を優先する
      - 各サーバの負荷率を 50 ％以下に抑え、故障時には残りのサーバが全体の負荷を引き受けられるようにする
      - 故障時に備えて、各サーバに全体の負荷を処理できる性能を持たせ、通常時も負荷率を 100 ％で運用する
      - 故障したサーバの負荷は、自動的にクライアント側で処理されるため、負荷率の配慮は不要である
    a: イ
    exp: |
      負荷を分け合う構成では、片系の故障時に、もう一方が全体の負荷（通常時の 2 台分）を引き受けます。応答時間を維持したまま引き受けるには、残りの 1 台に全体の負荷を処理する余力が必要であり、通常時の負荷率は各台 50 ％以下に抑えることが条件になります。負荷率を高くし過ぎると、故障時に過負荷となり、応答の悪化や連鎖的な停止を招きます。
    why:
      - 利用効率は上がりますが、片系の故障時に残りのサーバが全体の負荷を処理し切れず、応答時間を維持できません。
      - 正解です。故障時の引き受けを可能にするため、通常時は各台 50 ％以下が条件です。
      - 全体の負荷を処理できる性能があっても、負荷率 100 ％で運用すれば余力がなく、故障時の上乗せに耐えられません。
      - サーバの処理をクライアント側が肩代わりすることはなく、負荷は残りのサーバに集中します。
    know: 冗長構成の可用性は、台数だけでなく「故障時に負荷が移る先の余力」で決まる。分け合う構成では、通常時の負荷率の上限が故障時の継続条件から逆算される点が要点である。
    terms:
      - 冗長化
      - フェイルオーバ
    verify:
      manual: 2台で負荷を分け合う構成で片系が故障すると残りの1台が全体の負荷を引き受けること、そのため通常時の負荷率を各台50％以下に抑える必要があることを、他の選択肢（高負荷運用、クライアント肩代わり、余力なしの100％運用）との対比で確認した。
  - id: A04-532
    topic: 4-2-3
    diff: 3
    scope: 4-2-3 M/M/1 待ち行列の平均応答時間。到着率とサービス率から、系内での平均応答時間（待ち時間とサービス時間の合計）を求める問題
    prereq: M/M/1 の平均応答時間は 1 ÷（サービス率 － 到着率）で求めること、利用率は到着率 ÷ サービス率であること
    hard: 平均の「待ち時間」ではなく「応答時間（待ち＋サービス）」を問うていることを読み分け、対応する式を選ぶ必要がある。
    q: |
      M/M/1 待ち行列で、平均到着率が 8 件／秒、平均サービス率が 10 件／秒のとき、系内での平均応答時間（到着してから処理が終わるまでの時間）は何秒か。
    c:
      - '0.5'
      - '1.25'
      - '0.1'
      - '0.4'
    a: ア
    exp: |
      M/M/1 の平均応答時間は、次の式で求めます。

      平均応答時間 ＝ 1 ÷ （サービス率 － 到着率）
      ＝ 1 ÷ （10 － 8）
      ＝ 0.5 秒

      参考までに、利用率は 8 ÷ 10 ＝ 0.8、平均の待ち時間（処理開始までの時間）は 0.4 秒であり、サービス時間 0.1 秒を加えると応答時間 0.5 秒と一致します。
    why:
      - 正解です。1 ÷ （10 － 8）＝ 0.5 秒です。
      - 到着率とサービス率の比を、そのまま時間として読み替えたような値です。応答時間は率の差の逆数で求めます。
      - サービス時間（1 ÷ サービス率）だけの値です。応答時間には、待ち時間も含まれます。
      - 平均の待ち時間だけの値です。応答時間は、待ち時間にサービス時間を加えたものです。
    know: M/M/1 では、待ち時間と応答時間で式が異なる。応答時間＝1 ÷ （サービス率－到着率）という形と、到着率がサービス率に近づくと応答時間が急増する感度が要点である。
    terms:
      - 待ち行列
      - M/M/1
    verify:
      type: value
      value: 0.5
