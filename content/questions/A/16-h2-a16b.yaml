questions:
  - id: A16-507
    topic: 16-1-5
    diff: 3
    scope: 16-1-5 監査証拠の入手方法。在庫の実在性と網羅性という異なる検証目的に対して、それぞれ適した監査手続（実査・立会いと記録からの追跡）を選ぶ問題
    prereq: 実在性（記録にあるものが実在するか）は実物への確認、網羅性（実在するものが全て記録されているか）は実物から記録への追跡で検証すること
    hard: 検証の方向（記録→実物か、実物→記録か）が目的によって逆になることを見分ける必要がある。同じ「在庫の確認」でも、目的が違えば手続が異なる点が要点になる。
    q: |
      システム監査人が、倉庫の在庫管理システムについて監査を行っている。在庫データに登録された品目が実際に倉庫に存在すること（実在性）を確認するための手続として、最も適切なものはどれか。
    c:
      - 倉庫で棚卸しに立ち会い、在庫データから抽出した品目が、実際に現物として存在することを確認する
      - 在庫データの登録画面の入力チェックが、正しく設定されているかをレビューする
      - 在庫の入出庫の承認記録を確認し、承認されていない出庫がないことを確かめる
      - 在庫金額の前年との増減を分析し、異常な変動がないことを確かめる
    a: ア
    exp: |
      実在性の確認は「記録にあるものが実在するか」を確かめることであり、記録（在庫データ）から現物へ向かう方向の手続が必要です。棚卸しへの立会いと、データから抽出した品目の現物の確認がこれに当たります。なお、逆に現物から記録へ追う手続は、実在するものが漏れなく登録されているか（網羅性）の確認になります。入力チェックや承認の確認は統制の評価、増減の分析は分析的手続であり、いずれも実在性を直接は確かめません。
    why:
      - 正解です。データから現物を確認する方向の手続が、実在性の検証になります。
      - 入力チェックのレビューは統制の整備状況の評価であり、登録済みの品目の実在を確かめるものではありません。
      - 承認記録の確認は、出庫の正当性の確認であり、品目の実在性とは別の検証目的です。
      - 増減分析は異常の有無の手がかりにはなりますが、個々の品目の実在を直接確認するものではありません。
    know: 監査手続は、検証目的と「方向」で選ぶ。実在性は記録から実物へ、網羅性は実物から記録へという向きの違いが、証拠の当てはまりを決める要点である。
    terms: [監査証拠, 棚卸し]
    verify:
      manual: 検証目的（実在性）と各手続の方向・対象を照合し、データから現物へ向かう立会いだけが実在性の直接証拠になること、他は統制評価・正当性・分析的手続で目的が異なることを確認した。

  - id: A16-508
    topic: 16-1-9
    diff: 3
    scope: 16-1-9 監査結果の報告と改善の要求。指摘事項の影響の大きさに応じて、報告先と改善の求め方を判断する問題
    prereq: 監査の指摘は、経営に与える影響の重要度に応じて報告と対応が決まること、重大な不備は速やかに経営層へ報告し、改善計画と期限を求めること
    hard: 「全ての指摘を同じ重さで扱う」のではなく、影響の大きさで優先付けする判断が問われる。特に、財務報告に影響しうる統制の不備は、現場レベルの注意では済まない点を見抜く必要がある。
    q: |
      システム監査で、売上計上のプログラムに、承認なしに単価を変更できる不備が見つかった。この不備を使うと、売上と利益を意図的に操作できてしまう。監査人の対応として、最も適切なものはどれか。
    c:
      - 経営層へ速やかに報告し、不備の是正と、過去の売上への影響の調査を含む改善計画の提出と期限の設定を求める
      - 現場の担当者に口頭で注意し、次回の定期監査で直っているかを確認する
      - 軽微な不備として、監査報告書の末尾にまとめて記載する
      - 不備を発見した事実だけを記録し、対応は被監査部門の判断に委ねる
    a: ア
    exp: |
      この不備は、財務報告の数値そのものを操作できてしまうものであり、影響は現場の作業ミスにとどまらず、経営の信頼性に関わります。重要度の高い指摘は、経営層へ速やかに報告し、是正だけでなく、既に影響が出ていないかの調査を含めた改善計画と、その期限の設定を求めることが適切です。対応を先送りしたり、影響の調査を求めなかったりすると、不正や誤りが見逃されたまま決算に反映される危険があります。
    why:
      - 正解です。影響の大きさに応じ、経営層への報告と、影響調査を含む改善計画・期限の要求が必要です。
      - 口頭の注意と次回までの先送りでは、財務報告に影響する不備への対応として不十分です。
      - 財務数値を操作できる不備は軽微とはいえず、扱いが影響の大きさに見合っていません。
      - 監査人は指摘への対応状況を追う責任があり、判断を全面的に委ねることは適切ではありません。
    know: 指摘事項への対応は、影響の重要度で決まる。財務報告や法令に関わる不備は、是正に加えて「既に影響が出ていないか」の調査までが求められる点が、監査報告の要点である。
    terms: [システム監査, 改善勧告]
    verify:
      manual: 不備の影響（財務数値の操作可能性）と各対応の重さを照合し、経営層への速やかな報告と影響調査を含む改善計画・期限の要求だけが、重要度に見合う対応であることを確認した。

  - id: A16-509
    topic: 16-1-2-2
    diff: 3
    scope: 16-1-2-2 監査人の独立性。監査部門の所属と指揮命令の関係から、外観上の独立性が損なわれている状況を判断する問題
    prereq: 独立性には、偏りのない判断という精神上の独立性と、利害関係がないように見える立場という外観上の独立性があり、人事評価や予算の権限が監査対象側にある体制は、外観上の独立性を損なうこと
    hard: 監査人が個人的に公正であっても、監査対象の責任者から人事や予算の指揮を受ける立場では、公正な判断をしても利害関係を疑われる立場となり、外観上の独立性が損なわれる点を見抜く必要がある。
    q: |
      A社では、情報システム部の開発課長が、システム監査部門の監査人の人事評価と予算の承認を行っている。監査人自身は、開発課の業務には関与していない。この体制の問題点として、最も適切なものはどれか。
    c:
      - 監査対象の責任者が監査人の評価と予算を握っており、組織的独立性が損なわれている
      - 監査人が開発課の業務に関与していないため、監査に必要な知識が不足している
      - 人事評価を行うことは、監査人の精神的独立性を直接損なうものではないので、問題はない
      - 監査部門の予算が情報システム部から出ていること自体は、独立性とは関係がない
    a: ア
    exp: |
      独立性には、監査人の心構えの問題である精神上の独立性と、監査対象と利害関係がないように見える立場である外観上の独立性があります。本件では、監査される側の責任者が、監査人の人事評価と予算を握っています。この関係では、厳しい指摘をしにくくなる圧力が構造的に生じるため、監査人個人が公正でも、外観上の独立性が損なわれていると判断されます。監査部門は、監査対象の責任者の指揮の外（例えば経営者や監査役に直結する位置）に置くことが求められます。
    why:
      - 正解です。評価と予算を通じた指揮の関係が、組織的独立性を損なっています。
      - 業務に関与していないことはむしろ独立性の条件であり、知識の不足は別の問題です。本件の本質は指揮関係にあります。
      - 人事評価の権限は、監査人の判断への圧力として働くため、独立性の問題です。「直接ではない」という読み方は誤りです。
      - 予算の出所そのものより、承認権を監査対象の責任者が持つことが問題であり、独立性と関係が深い事項です。
    know: 独立性は、個人の公正さ（精神上の独立性）だけでは足りず、第三者から見て利害関係がないといえる立場（外観上の独立性）が伴って初めて保たれる。監査の体制を見るときは、評価・予算・報告先といった指揮命令の線をたどることが要点である。
    terms: [独立性, システム監査]
    verify:
      manual: 独立性の2側面（精神上の独立性・外観上の独立性）と本件の指揮関係を照合し、評価・予算の承認権が監査対象側にあることが外観上の独立性の欠如に当たること、他の選択肢が論点を取り違えていることを確認した。

  - id: A16-510
    topic: 16-1-6
    diff: 3
    scope: 16-1-6 職務分掌に関する統制の評価。申請と承認が同一人物に集中している業務について、相互牽制の観点から不備を判断する問題
    prereq: 職務分掌は、取引の申請・承認・実行・記録を分けることで、不正や誤りを一人で完結させない仕組みであること
    hard: 手順書に承認の印欄があるなど形式が整っていても、実質的に同一人物が申請と承認を兼ねていれば牽制が働かないことを見抜く必要がある。
    q: |
      A社の購買システムでは、取引先マスタへの新規登録を、購買担当者が申請し、同じ購買担当者が承認も行う運用になっている。登録された取引先への発注と支払は、別の担当者が行っている。監査人の指摘として、最も適切なものはどれか。
    c:
      - 取引先の登録の申請と承認が同一人物であり、架空の取引先を登録される危険があるため、職務分掌の不備である
      - 発注と支払が別の担当者であるため、相互牽制は十分に働いており、指摘事項はない
      - 取引先の登録件数が多いため、サンプリングではなく全件の確認が必要である
      - 承認の記録がシステムに残っているため、統制は有効に機能している
    a: ア
    exp: |
      職務分掌の目的は、一連の処理を複数の担当者に分けることで、不正や誤りを一人で完結できなくすることです。本件では、実在しない取引先（架空の取引先）を、担当者が自分で申請し自分で承認して登録できてしまいます。その後の発注と支払が別の担当者でも、実在すると見える架空の取引先への支払が成立し得るため、入口である登録の段階の牽制の欠如が重大な不備です。承認欄の形式や記録の有無ではなく、誰と誰が分かれているかが評価の対象です。
    why:
      - 正解です。申請と承認の兼務は、架空取引先の登録という不正の入口を開く分掌の不備です。
      - 発注と支払の分離だけでは、登録された取引先の実在性が保証されず、牽制は十分とはいえません。
      - 確認の範囲（全件か抽出か）は証拠の集め方の問題であり、本件の統制そのものの不備とは別の論点です。
      - 記録が残ることは事後の追跡には役立ちますが、不正を未然に防ぐ牽制にはなっていません。
    know: 職務分掌の評価は「処理のどの段階が、誰に分かれているか」で行う。特にマスタ登録のような入口の処理は、後段の処理全体の信頼性の前提になるため、申請と承認の分離が重要である。
    terms: [職務分掌, 内部統制]
    verify:
      manual: 処理の流れ（登録→発注→支払）と分掌の状態を照合し、入口である登録の申請・承認が同一人物であることが、架空取引先という具体的な危険を生む分掌の不備に当たることを確認した。

  - id: A16-511
    topic: 16-1-5
    diff: 4
    scope: 16-1-5 統計的サンプリングにおける標本サイズの決定要因。許容逸脱率・期待逸脱率・信頼水準の変化が、必要な標本数にどう影響するかを判断する問題
    prereq: 属性サンプリングでは、許容できる逸脱率が小さいほど、また期待する逸脱率が許容に近いほど、必要な標本数は大きくなること
    hard: 3つの要因（許容逸脱率、期待逸脱率、信頼水準）が標本数に与える影響の向きを、それぞれ正しく判断する必要がある。特に「期待逸脱率が上がると標本は増える」という、直感と逆の関係が要点になる。
    q: |
      システム監査で、承認統制が守られているかを統計的サンプリング（属性サンプリング）で検証する。必要な標本数が最も大きくなる条件の組合せはどれか。
    c:
      - 許容逸脱率が小さく、期待逸脱率が許容逸脱率に近く、信頼水準が高い
      - 許容逸脱率が大きく、期待逸脱率が許容逸脱率に近く、信頼水準が高い
      - 許容逸脱率が小さく、期待逸脱率が 0 に近く、信頼水準が低い
      - 許容逸脱率が大きく、期待逸脱率が 0 に近く、信頼水準が低い
    a: ア
    exp: |
      属性サンプリングの標本数は、次の関係で決まります。
      - 許容逸脱率が小さいほど、わずかな逸脱も見逃せないため、標本数は大きくなる
      - 期待逸脱率が許容逸脱率に近いほど、判定が際どくなるため、標本数は大きくなる（期待逸脱率が 0 に近ければ、少ない標本でも判定できる）
      - 信頼水準が高いほど、判定を確かなものにするため、標本数は大きくなる
      したがって、標本数が最も大きくなるのは、許容逸脱率が小さく、期待逸脱率が許容に近く、信頼水準が高い組合せです。
    why:
      - 正解です。3つの要因が全て、標本数を大きくする向きに働きます。
      - 許容逸脱率が大きいと、判定に余裕が生まれるため、標本数は小さくなります。
      - 期待逸脱率が 0 に近く信頼水準も低い条件では、必要な標本数は小さくなります。
      - 3つの要因が全て、標本数を小さくする向きであり、最も小さい組合せです。
    know: サンプリングの標本数は「どれだけ厳しく、どれだけ際どく、どれだけ確かに判定するか」で決まる。期待逸脱率と許容逸脱率の差が小さいほど判定が難しくなり、標本が増える点が、直感に反する要点である。
    terms: [サンプリング, 属性サンプリング]
    verify:
      manual: 3要因（許容逸脱率・期待逸脱率・信頼水準）それぞれについて標本数への影響の向きを統計的サンプリングの理論と照合し、3要因全てが増大方向にそろう組合せが1つだけであることを確認した。

  - id: A16-512
    topic: 16-2-1
    diff: 3
    scope: 16-2-1 改善状況の確認（フォローアップ）。是正措置が実施されたことの確認にとどまらず、その措置が実際に機能し続けていることまでを確かめる方法を選ぶ問題
    prereq: フォローアップでは、改善の実施の有無だけでなく、有効性（統制として機能しているか）を、一定期間の運用の証拠で確認すること
    hard: 「手順書が改訂された」「システムが修正された」という実施の証拠だけでは、運用の有効性までは確かめられないことを見分ける必要がある。
    q: |
      前回のシステム監査で「承認のない変更が実施できてしまう」という指摘を受けたシステムについて、改善状況の確認（フォローアップ）を行っている。被監査部門からは、変更管理システムを改修し、承認がない変更は登録できないようにしたとの報告があった。監査人の確認方法として、最も適切なものはどれか。
    c:
      - 改修後に実施された変更の記録を抽出し、承認のない変更が実際に登録されていないこと、承認の記録が残っていることを一定期間分について確認する
      - 改修の完了報告書を受け取り、報告どおりに改修された旨の文書がそろっていることを確認する
      - 担当者に聞き取りを行い、承認のない変更はしていないとの回答を得る
      - 変更管理の手順書が改訂されていることを確認する
    a: ア
    exp: |
      フォローアップでは、是正措置が「実施されたこと」と「有効に機能していること」の両方を確認します。システムの改修は実施の証拠にはなりますが、実際に承認のない変更が防がれているかは、改修後の運用の記録を確かめなければ分かりません。一定期間の変更記録を抽出して、承認のない登録がないことと承認の証跡が残っていることを確認するのが、有効性まで踏み込む確認方法です。文書の受け取りや聞き取りだけでは、運用の実態は検証できません。
    why:
      - 正解です。運用の記録による確認が、統制の有効性までを確かめる方法です。
      - 完了報告書の確認は実施の報告を受けたにすぎず、実際に機能しているかの証拠にはなりません。
      - 聞き取りによる回答は証拠としての力が弱く、記録による裏付けが必要です。
      - 手順書の改訂は整備の確認であり、運用が手順どおりかは別に確かめる必要があります。
    know: フォローアップの要点は「直したと言っているか」ではなく「直った状態で運用されているか」。整備（設計・導入）と運用（実際に機能しているか）は別の確認対象であり、運用は記録の証拠で確かめる。
    terms: [フォローアップ, システム監査]
    verify:
      manual: 確認方法を「運用記録による有効性の確認」「実施報告の受領」「聞き取り」「整備文書の確認」に分類し、指摘の是正が機能していることまで確かめられるのが運用記録の確認だけであることを確認した。
