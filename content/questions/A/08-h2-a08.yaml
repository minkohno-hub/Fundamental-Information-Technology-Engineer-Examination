questions:
  - id: A08-501
    topic: 8-1-2
    diff: 3
    scope: 8-1-2 音声のディジタル化。サンプリング周波数、量子化ビット数、チャンネル数から、非圧縮の音声データ量を求める計算
    prereq: 非圧縮の音声データ量は、サンプリング周波数 × 量子化ビット数 × チャンネル数 × 時間 で求め、ビットからバイトへの換算（8 ビット ＝ 1 バイト）をすること
    hard: 3つの要素の掛け算に加え、ビットとバイトの換算、時間の単位（分→秒）の換算が重なる。
    q: |
      サンプリング周波数 44.1 kHz、量子化ビット数 16 ビット、ステレオ（2 チャンネル）で、1 分間の音声を非圧縮で記録した。データ量はおよそ何 M バイトか。ここで、1 M バイトは 10 の 6 乗バイトとする。
    c: ['10.6', '5.3', '21.2', '84.7']
    a: ア
    exp: |
      1 秒当たりのデータ量は、44,100 × 16 × 2 ＝ 1,411,200 ビットです。バイトに直すと、1,411,200 ÷ 8 ＝ 176,400 バイトです。

      1 分間（60 秒）では、176,400 × 60 ＝ 10,584,000 バイト、すなわちおよそ 10.6 M バイトです。要素を取り違えやすいのは、ステレオの 2 チャンネル分と、ビットからバイトへの換算です。
    why:
      - 正解です。44,100 × 16 × 2 × 60 ÷ 8 ≒ 10.6 M バイトです。
      - モノラル（1 チャンネル）として計算した値です。本問はステレオ（2 チャンネル）です。
      - サンプリング周波数を 2 倍（88.2 kHz）として計算した値です。本問は 44.1 kHz です。
      - ビットのままの数値を、バイトと取り違えた値です。8 ビットで 1 バイトへの換算が必要です。
    know: 音声データ量の計算は、「周波数 × ビット数 × チャンネル数 × 秒数 ÷ 8」という一連の流れが要点である。単位の換算が、誤りの入りやすい場所である。
    terms: [サンプリング周波数, 量子化]
    verify: { type: value, value: 10.6 }

  - id: A08-502
    topic: 8-1-3
    diff: 3
    scope: 8-1-3 静止画のデータ量。解像度と色深度（1 画素当たりのビット数）から、非圧縮の画像データ量を求める計算
    prereq: 非圧縮の静止画データ量は、横の画素数 × 縦の画素数 × 1 画素当たりのバイト数 で求めること、フルカラー（24 ビット）は 1 画素が 3 バイトであること
    hard: 色深度のビットからバイトへの換算と、画素数の掛け算が重なる。モノクロや 8 ビットカラーとの取り違えが起きやすい。
    q: |
      横 1,920 画素、縦 1,080 画素、フルカラー（1 画素当たり 24 ビット）の静止画を、非圧縮で保存した。データ量はおよそ何 M バイトか。ここで、1 M バイトは 10 の 6 乗バイトとする。
    c: ['6.2', '2.1', '12.4', '49.8']
    a: ア
    exp: |
      画素数は、1,920 × 1,080 ＝ 2,073,600 画素です。フルカラーでは 1 画素が 24 ビット ＝ 3 バイトであるため、データ量は 2,073,600 × 3 ＝ 6,220,800 バイト、すなわちおよそ 6.2 M バイトです。

      色深度が変わると、データ量はその比率で変わります。8 ビットカラーなら 1 画素 1 バイトで、約 3 分の 1 になります。
    why:
      - 正解です。1,920 × 1,080 × 3 ≒ 6.2 M バイトです。
      - 1 画素を 1 バイト（8 ビットカラー）として計算した値です。本問はフルカラー（24 ビット）です。
      - 1 画素を 6 バイト（48 ビット）として計算した値です。本問は 24 ビット、すなわち 3 バイトです。
      - 24 ビットをバイトに換算せず、ビットの数値のまま計算した系統の値です。8 ビットで 1 バイトへの換算が必要です。
    know: 画像データ量の計算は、「画素数 × 1 画素のバイト数」が要点である。色深度のビット数をバイトに直す段階が、誤りの入りやすい場所である。
    terms: [フルカラー, 色深度]
    verify: { type: value, value: 6.2 }

  - id: A08-503
    topic: 8-1-2
    diff: 3
    scope: 8-1-2 標本化定理。元の信号に含まれる最高周波数から、必要となる最低のサンプリング周波数を求める問題
    prereq: 標本化定理により、元の信号を復元するには、含まれる最高周波数の 2 倍以上のサンプリング周波数が必要であること
    hard: 「最高周波数そのもの」ではなく「その 2 倍」が境界であることを適用する必要がある。
    q: |
      最高で 8 kHz の周波数成分を含む音声を、元の波形を復元できるようにディジタル化したい。標本化定理によれば、サンプリング周波数は最低何 kHz 必要か。
    c: ['16', '8', '4', '32']
    a: ア
    exp: |
      標本化定理（サンプリング定理）によれば、元の信号を正しく復元するには、信号に含まれる最高周波数の 2 倍以上の周波数でサンプリングする必要があります。

      最高周波数が 8 kHz であるため、必要なサンプリング周波数は、その 2 倍以上であり、最低は 16 kHz です。これを下回ると、復元した波形に元の信号にはない成分が現れる（折返し雑音）などの問題が生じます。
    why:
      - 正解です。最高周波数の 2 倍、16 kHz が最低の水準です。
      - 最高周波数そのものの値です。定理の要求は、その 2 倍です。
      - 最高周波数の半分の値です。復元には不十分です。
      - 最高周波数の 4 倍の値です。復元は可能ですが、本問が問う最低の水準ではありません。
    know: 標本化定理の要点は、「最高周波数の 2 倍」という一つの関係である。CD の 44.1 kHz が、可聴域の上限（約 20 kHz）の 2 倍を超える値に設定されていることも、この定理から説明できる。
    terms: [標本化定理, サンプリング]
    verify: { type: value, value: 16 }

  - id: A08-504
    topic: 8-2-1-1
    diff: 3
    scope: 8-2-1-1 色の表現。印刷に使う減法混色（CMYK）と、ディスプレイに使う加法混色（RGB）の使い分けの判断
    prereq: ディスプレイは光の 3 原色（RGB）の加法混色で色を表し、印刷はインクの 3 原色に黒を加えた CMYK の減法混色で色を表すこと、両者では表現できる色の範囲が異なること
    hard: 画面で作った色が印刷で再現できない理由を、混色の方法と色域の違いから読み取る必要がある。
    q: |
      パンフレットのデータを画面で作成し、印刷会社に出したところ、一部の鮮やかな色が、画面よりもくすんで印刷された。この現象の説明として、適切なものはどれか。
    c:
      - 画面は RGB の加法混色、印刷は CMYK の減法混色で色を表現し、表現できる色の範囲（色域）が異なるため、画面で出せる色の一部は印刷では再現できないから
      - 印刷会社のプリンタの解像度が、画面の解像度より低いから
      - データの圧縮によって、色の情報が失われたから
      - 紙の大きさが、画面の表示範囲と異なるから
    a: ア
    exp: |
      ディスプレイは、赤・緑・青の光を混ぜる加法混色（RGB）で色を表し、混ぜるほど明るくなります。印刷は、シアン・マゼンタ・イエローのインクを重ね、光を吸収させる減法混色（CMYK）で色を表します。両者は表現できる色の範囲（色域）が異なり、RGB で出せる鮮やかな色の一部は、CMYK では再現できません。画面と印刷で色が違って見える、代表的な理由です。解像度や圧縮、大きさの話ではありません。
    why:
      - 正解です。混色の方法と色域の違いが、色の再現の違いの理由です。
      - 解像度は、細かさ（精細さ）の問題であり、色のくすみの理由ではありません。
      - 圧縮による情報の損失は起こり得ますが、本問の色の再現範囲の話ではありません。
      - 大きさの違いは、色の表現とは関係しません。
    know: 色の表現の要点は、「画面は RGB（光、加法）、印刷は CMYK（インク、減法）」という対応と、色域の違いである。媒体をまたぐ色の問題は、この観点で判断する。
    terms: [CMYK, RGB, 減法混色]
    verify:
      manual: 画面の鮮やかな色が印刷でくすむ現象が、RGB（加法混色）とCMYK（減法混色）の色域の違いによるものであることを、解像度・圧縮・大きさの問題ではない点とあわせて確認した。

  - id: A08-505
    topic: 8-1-4
    diff: 3
    scope: 8-1-4 動画のデータ量。1 フレームのデータ量とフレームレート、時間から、非圧縮の動画データ量を求める計算
    prereq: 非圧縮の動画データ量は、1 フレームのデータ量 × 1 秒当たりのフレーム数（フレームレート） × 秒数 で求めること
    hard: フレームという単位を挟むため、静止画の計算に「1 秒当たりの枚数」と「秒数」の 2 つの掛け算が加わる。
    q: |
      1 フレームが 0.5 M バイトの動画を、フレームレート 30 フレーム／秒で、60 秒間、非圧縮で記録した。データ量は何 M バイトか。
    c: ['900', '30', '15', '1,800']
    a: ア
    exp: |
      1 秒当たりのデータ量は、0.5 × 30 ＝ 15 M バイトです。60 秒間では、15 × 60 ＝ 900 M バイトになります。

      動画のデータ量は、静止画と比べて桁違いに大きくなるため、実際の動画配信や保存では、圧縮が不可欠になります。本問は、その圧縮前の大きさの目安を求める計算です。
    why:
      - 正解です。0.5 × 30 × 60 ＝ 900 M バイトです。
      - フレームレートを時間と取り違えた系統の値（0.5 × 60）です。1 秒当たりの枚数と秒数の、両方を掛ける必要があります。
      - 1 秒当たりのデータ量（0.5 × 30）で止まっている値です。60 秒分が必要です。
      - フレームレートを 60 と読み違えた値（0.5 × 60 × 60）です。本問は 30 フレーム／秒です。
    know: 動画データ量の計算は、「1 フレーム × フレームレート × 秒数」という 3 つの掛け算が要点である。どの数が掛けられていないか、という確認が誤りの発見につながる。
    terms: [フレームレート, 動画]
    verify: { type: value, value: 900 }

  - id: A08-506
    topic: 8-1-5
    diff: 3
    scope: 8-1-5 圧縮形式の選択。色数が少なく、文字や輪郭の多い画像に、可逆圧縮の形式を選ぶ判断
    prereq: JPEG は写真のような色の変化の多い画像に向く非可逆圧縮であり、PNG は可逆圧縮で、色数の少ない図や文字の輪郭を劣化させずに保存できること
    hard: 画像の内容（写真か、図や文字か）から、圧縮の方式の向き不向きを結び付ける必要がある。ファイルの大きさだけでは決まらない点も問われる。
    q: |
      企業のロゴと、文字の多い説明図を Web ページに載せる。これらの画像の保存形式の選択として、適切なものはどれか。
    c:
      - PNG を選ぶ。可逆圧縮であり、色数の少ないロゴや、文字の輪郭が劣化せずに保存できる
      - JPEG を選ぶ。非可逆圧縮でファイルは小さくなるが、文字の輪郭ににじみが出やすい
      - BMP（無圧縮）を選ぶ。劣化はないが、ファイルが非常に大きくなる
      - 形式はどれでも、見た目は変わらない
    a: ア
    exp: |
      ロゴや説明図は、色数が少なく、文字や線の輪郭がはっきりしていることが重要な画像です。PNG は可逆圧縮であり、輪郭を劣化させずに保存でき、この種の画像では圧縮の効果も得られます。JPEG は写真に向く非可逆圧縮であり、輪郭の周辺にノイズ（にじみ）が出やすく、文字の多い画像には不向きです。BMP は劣化しませんが、無圧縮でファイルが大きくなり、Web での利用には適しません。画像の内容に合わせて形式を選ぶことが要点です。
    why:
      - 正解です。可逆圧縮で輪郭が保たれることが、この種の画像に合います。
      - JPEG のにじみは、文字やロゴの輪郭では目立ちやすく、不向きです。
      - BMP は劣化しませんが、Web で配るにはファイルが大きすぎます。
      - 形式によって、輪郭の画質もファイルの大きさも変わります。
    know: 画像形式の選択は、「写真か、図や文字か」という内容と、「可逆か、非可逆か」という方式の対応で判断することが要点である。
    terms: [PNG, JPEG, 可逆圧縮]
    verify:
      manual: ロゴと文字の多い説明図には、可逆圧縮で輪郭が劣化しないPNGが適すること、JPEGは輪郭ににじみが出やすく、BMPは無圧縮で大きすぎることを確認した。

  - id: A08-507
    topic: 8-2-2
    diff: 3
    scope: 8-2-2 AR（拡張現実）の活用。現実の映像に、作業手順などの情報を重ねて表示する、保守作業の支援への適用の識別
    prereq: AR は、現実世界の映像や視界に、コンピュータの情報を重ねて表示する技術であり、VR（仮想現実）は現実とは別の仮想の世界に入り込む技術であること
    hard: 実物を見ながら情報を重ねる場面が AR、仮想の世界そのものを体験する場面が VR、という適用の違いを読み取る必要がある。
    q: |
      工場の保守作業で、作業者が見ている実物の機械の映像に、点検の手順や、部品の位置の案内を重ねて表示し、作業を支援する仕組みを導入した。この技術の分類はどれか。
    c:
      - 'AR（拡張現実）: 現実の映像に、情報を重ねて表示する'
      - 'VR（仮想現実）: 現実とは別の仮想の世界を体験させる'
      - 'メタバース: 多数の利用者が、仮想空間で交流する'
      - 'モーションキャプチャ: 人の動きを測定し、データ化する'
    a: ア
    exp: |
      本件の仕組みは、作業者が見ている現実の機械の映像に、点検手順や部品の位置といった情報を重ねて表示しています。現実世界を土台に、情報を重ねる技術は AR（拡張現実）です。VR は、現実とは別の仮想の世界に入り込んで体験する技術であり、実物の機械を見る本件とは異なります。メタバースは仮想空間での交流、モーションキャプチャは動きの測定であり、いずれも本件の仕組みとは異なります。
    why:
      - 正解です。現実への情報の重ね合わせが、AR です。
      - VR は仮想の世界そのものの体験であり、実物を見る作業の支援ではありません。
      - 交流のための仮想空間の話であり、本件の作業支援とは異なります。
      - 動きの測定の技術であり、情報の重ねて表示する仕組みではありません。
    know: AR と VR の区別は、「現実に重ねるか（AR）、仮想に入るか（VR）」という軸が要点である。適用の場面から技術を逆にたどる判断が鍵である。
    terms: [AR, 拡張現実]
    verify:
      manual: 実物の機械の映像に点検手順や部品の位置を重ねて表示する仕組みがARに当たることを、VR（仮想世界の体験）・メタバース（仮想空間での交流）・モーションキャプチャ（動きの測定）との区別から確認した。

  - id: A08-508
    topic: 8-1-2
    diff: 3
    scope: 8-1-2 音声のビットレートとデータ量。ビットレート（1 秒当たりのビット数）が与えられた符号化済みの音声について、再生時間からデータ量を求める計算
    prereq: 符号化済みの音声や動画のデータ量は、ビットレート × 時間 で求め、ビットからバイトへの換算をすること
    hard: サンプリングの計算（A08-501 の型）とは異なり、ビットレートが直接与えられる型である。ビットとバイトの換算と、分から秒への換算が要点になる。
    q: |
      ビットレート 128 kbps で符号化された 3 分間の楽曲の、データ量はおよそ何 M バイトか。ここで、1 kbps は 1,000 ビット／秒、1 M バイトは 10 の 6 乗バイトとする。
    c: ['2.9', '23', '1.4', '5.8']
    a: ア
    exp: |
      3 分間は 180 秒です。データ量は、128,000 ビット／秒 × 180 秒 ＝ 23,040,000 ビットです。バイトに直すと、23,040,000 ÷ 8 ＝ 2,880,000 バイト、すなわちおよそ 2.9 M バイトです。

      ビットレートは、1 秒当たりのビット数であるため、時間との掛け算で総ビット数になり、最後にバイトへの換算が必要です。この換算を忘れると、8 倍大きな値になってしまいます。
    why:
      - 正解です。128,000 × 180 ÷ 8 ≒ 2.9 M バイトです。
      - ビットの数値を、バイトに換算せず、そのまま M の単位で読んだ値です。
      - 時間を 90 秒（1 分半）として計算した値です。本問は 3 分間、すなわち 180 秒です。
      - ビットレートを 256 kbps として計算した値です。本問は 128 kbps です。
    know: ビットレートからの計算は、「ビットレート × 秒数 ÷ 8」という流れが要点である。ビットとバイトの換算が、最も誤りの入りやすい場所である。
    terms: [ビットレート, 符号化]
    verify: { type: value, value: 2.9 }
