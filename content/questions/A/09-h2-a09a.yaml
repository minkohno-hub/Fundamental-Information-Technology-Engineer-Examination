    q: |
      次の社員表に対して，次の SQL 文を実行した結果として得られる氏名を，行の出力順に示したものはどれか。給与の単位は万円である。

      ```
      SELECT 氏名 FROM 社員 e WHERE 給与 > (SELECT AVG(給与) FROM 社員 WHERE 部署 = e.部署) ORDER BY 社員番号
      ```
    attach: |
      〔社員表〕
      | 社員番号 | 氏名 | 部署 | 給与 |
      |---|---|---|---|
      | 1 | 青 | X | 300 |
      | 2 | 赤 | X | 200 |
      | 3 | 黄 | X | 400 |
      | 4 | 緑 | Y | 250 |
      | 5 | 紫 | Y | 250 |
      | 6 | 白 | Z | 500 |
      | 7 | 黒 | Z | 100 |
      | 8 | 灰 | Z | 330 |
    c:
      - "黄，白，灰"
      - "青，黄，白，灰"
      - "青，黄，緑，紫，白，灰"
      - "黄，緑，紫，白"
    a: ア
    scope: "データベース言語(SQL)の相関副問合せ，集約関数（AVG）。外側の行ごとに副問合せを評価する動作は，SELECT 文の基本的な操作として範囲内。"
    prereq: "相関副問合せ（外側の行の値を内側で参照して行ごとに評価する），AVG の計算，比較演算子（＞）で等しい値は含まれないこと"
    hard: "部署ごとの平均を求め，各行を自分の部署の平均と比較する多段階の処理を行う。全体平均との比較や「以上」との比較など，よく起こす誤りと結果が近く，混同しやすい。"
    exp: |
      副問合せは外側の行の部署（e.部署）が同じ社員だけの平均給与を求めます。各部署の平均は次のとおりです。
      | 部署 | 給与 | 平均 | 平均を超える社員 |
      |---|---|---|---|
      | X | 300，200，400 | 300 | 黄（400）。青は 300 で等しいので含まれない |
      | Y | 250，250 | 250 | なし（全員が等しい） |
      | Z | 500，100，330 | 310 | 白（500），灰（330） |
      結果は社員番号順に 黄，白，灰 です。
    why:
      - "正解です。各社員を自分の部署の平均と比較し，平均を「超える」社員（黄，白，灰）だけが残ります。"
      - "部署ごとではなく全社員の平均（2330÷8＝291.25）と比較した誤りです。この場合は青（300）も超えますが，部署別の平均 300 とは等しいので，正しくは含まれません。"
      - "「＞」を「＞＝」と読み違えた誤りです。平均と等しい青（X 部署の平均 300）や，Y 部署の 2 人（平均 250 と等しい）も含まれますが，問題の条件は平均を超えることです。"
      - "各部署の最高給与の社員を選ぶ問合せと取り違えた誤りです。Y 部署の 2 人は平均と等しいため該当しません。"
    know: "相関副問合せは外側の各行について内側を再評価するため，「グループごとの平均より大きい行」のようなグループ内比較に使える。GROUP BY との違い（行を残したまま集計値と比較できる）も押さえる。"
    terms: ["相関副問合せ", "副問合せ", "集約関数"]
    verify:
      sql:
        setup: |
          CREATE TABLE 社員(社員番号 INTEGER PRIMARY KEY,氏名 TEXT,部署 TEXT,給与 INTEGER);
          INSERT INTO 社員 VALUES(1,'青',  'X',300),(2,'赤','X',200),(3,'黄','X',400),(4,'緑','Y',250),(5,'紫','Y',250),(6,'白','Z',500),(7,'黒','Z',100),(8,'灰','Z',330);
        mode: result
        query: "SELECT group_concat(氏名, '，') FROM (SELECT 氏名 FROM 社員 e WHERE 給与 > (SELECT AVG(給与) FROM 社員 WHERE 部署 = e.部署) ORDER BY 社員番号)"

  - id: A09-508
    topic: 9-3-2-2
    diff: 4
    q: |
      商品表のすべての商品を購入したことがある会員を求める SQL 文はどれか。
    attach: |
      〔商品表〕
      | 商品ID | 商品名 |
      |---|---|
      | P1 | ペン |
      | P2 | ノート |
      | P3 | 定規 |

      〔購入表〕
      | 会員 | 商品ID |
      |---|---|
      | M1 | P1 |
      | M1 | P2 |
      | M1 | P3 |
      | M2 | P1 |
      | M2 | P2 |
      | M3 | P1 |
      | M3 | P2 |
      | M3 | P3 |
      | M4 | P3 |
    c:
      - "SELECT DISTINCT x.会員 FROM 購入 x WHERE NOT EXISTS (SELECT * FROM 商品 p WHERE NOT EXISTS (SELECT * FROM 購入 y WHERE y.会員 = x.会員 AND y.商品ID = p.商品ID))"
      - "SELECT 会員 FROM 購入 GROUP BY 会員 HAVING COUNT(*) >= (SELECT COUNT(*) FROM 商品) - 1"
      - "SELECT DISTINCT x.会員 FROM 購入 x WHERE EXISTS (SELECT * FROM 商品 p WHERE NOT EXISTS (SELECT * FROM 購入 y WHERE y.会員 = x.会員 AND y.商品ID = p.商品ID))"
      - "SELECT DISTINCT x.会員 FROM 購入 x WHERE x.商品ID NOT IN (SELECT 商品ID FROM 商品)"
    a: ア
    scope: "データベース言語(SQL)の副問合せ・相関副問合せ（EXISTS，NOT EXISTS）。「すべてを満たす」問合せを二重の NOT EXISTS で表す方法は，相関副問合せの基本的な操作として範囲内。"
    prereq: "EXISTS と NOT EXISTS の意味，相関副問合せの評価，「すべての～」を「～でないものが存在しない」と言い換える論理"
    hard: "「すべての商品を買った」を二重否定（買っていない商品が存在しない）に変換し，内側と外側の NOT EXISTS がそれぞれ何を表すかを会員ごとに追う必要がある。"
    exp: |
      「すべての商品を購入した」は「購入していない商品が 1 つも存在しない」と言い換えられるため，NOT EXISTS を二重に使います。
      内側の NOT EXISTS は，会員 x が商品 p を購入していないとき真です。外側の NOT EXISTS は，そのような商品 p が 1 つも存在しないとき真です。
      | 会員 | 購入していない商品 | 外側の NOT EXISTS |
      |---|---|---|
      | M1 | なし | 真（結果に含まれる） |
      | M2 | P3 | 偽 |
      | M3 | なし | 真（結果に含まれる） |
      | M4 | P1，P2 | 偽 |
      結果は M1，M3 です。EXISTS にすると（購入していない商品が存在する会員）M2，M4 になり，意味が逆になります。
    why:
      - "正解です。購入していない商品が存在しない会員（M1，M3）だけが残る，二重の NOT EXISTS の形です。"
      - "購入件数が「商品数−1」以上を条件にした誤りです。2 種類買った M2 も含まれ，M1 と M3 以外の会員が結果に混ざります。商品の種類まで確かめるには二重否定が必要です。"
      - "外側を EXISTS にした誤りです。この形では「購入していない商品が 1 つ以上ある会員」を求めることになり，結果は M2 と M4 で，正解と逆になります。"
      - "購入表の商品が商品表にないものを探す条件で，すべての商品を買った会員の判定になっていません。すべての購入商品が商品表にあるため結果は 0 行です。"
    know: "「すべての～した」（全称）は SQL に直接の構文がなく，「～しなかったものが存在しない」という二重の NOT EXISTS で表す。関係代数の割り算に相当する。件数の比較（COUNT）でも書けるが，重複や範囲外の値に注意が必要。"
    terms: ["EXISTS", "相関副問合せ", "副問合せ"]
    verify:
      sql:
        setup: |
          CREATE TABLE 商品(商品ID TEXT PRIMARY KEY,商品名 TEXT);
          CREATE TABLE 購入(会員 TEXT,商品ID TEXT,PRIMARY KEY(会員,商品ID));
          INSERT INTO 商品 VALUES('P1','ペン'),('P2','ノート'),('P3','定規');
          INSERT INTO 購入 VALUES('M1','P1'),('M1','P2'),('M1','P3'),('M2','P1'),('M2','P2'),('M3','P1'),('M3','P2'),('M3','P3'),('M4','P3');
        mode: choices
        expectRows: [["M1"], ["M3"]]

