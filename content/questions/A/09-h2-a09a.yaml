  - id: A09-511
    topic: 9-3-2-2
    diff: 4
    q: |
      次の R 表と S 表に対して，SQL1～SQL4 を実行した。結果の行数を（SQL1，SQL2，SQL3，SQL4）の順に示したものはどれか。ここで，SQL の規格に従い，UNION，INTERSECT，EXCEPT では重複行の判定に際して NULL どうしを同じ値とみなすものとする。

      SQL1
      ```
      SELECT x FROM R UNION SELECT x FROM S
      ```
      SQL2
      ```
      SELECT x FROM R INTERSECT SELECT x FROM S
      ```
      SQL3
      ```
      SELECT x FROM R EXCEPT SELECT x FROM S
      ```
      SQL4
      ```
      SELECT R.x FROM R INNER JOIN S ON R.x = S.x
      ```
    attach: |
      〔R 表〕
      | x |
      |---|
      | 1 |
      | 2 |
      | NULL |
      | NULL |

      〔S 表〕
      | x |
      |---|
      | 2 |
      | NULL |
      | 3 |
    c:
      - "4，2，1，1"
      - "5，1，3，1"
      - "4，2，1，3"
      - "4，2，2，1"
    a: ア
    scope: "データベース言語(SQL)の集合演算（UNION，INTERSECT，EXCEPT）と結合，NULL の扱い。集合演算は関係代数の和・積・差に対応する SELECT 文の基本操作であり，問題文で NULL の扱いを明示しているので範囲内。"
    prereq: "UNION，INTERSECT，EXCEPT は重複行を除いた集合として計算すること，等値結合では NULL = NULL が真にならないこと"
    hard: "集合演算では NULL どうしを同一とみなし，結合では同一とみなさないという扱いの違いを使い分けて，4 つの結果の行数をそれぞれ求める必要がある。"
    exp: |
      R は {1，2，NULL，NULL}，S は {2，NULL，3} です。集合演算は重複を除いた集合 R = {1，2，NULL}，S = {2，NULL，3} として計算します。
      | SQL | 計算 | 結果 | 行数 |
      |---|---|---|---|
      | SQL1 | 和集合 | 1，2，NULL，3 | 4 |
      | SQL2 | 積集合 | 2，NULL | 2 |
      | SQL3 | 差集合（R から S を除く） | 1 | 1 |
      | SQL4 | 等値結合 | x が 2 の 1 組のみ | 1 |
      SQL4 の結合では NULL = NULL が真にならないので，NULL の行は対応しません。結合で対応するのは x が 2 の行だけで 1 行です。したがって（4，2，1，1）です。
    why:
      - "正解です。集合演算では NULL を同一視して重複を除き（4，2，1），結合では NULL が対応しないので 1 行です。"
      - "集合演算でも NULL どうしを別の値とみなした誤りです。この場合は UNION が 5 行，INTERSECT が 1 行，EXCEPT が 3 行になりますが，規格では集合演算の重複判定で NULL は同一とみなされます。"
      - "結合でも NULL = NULL が成立すると考えた誤りです。この場合は R の NULL 2 行と S の NULL 1 行が対応して 2 行増え 3 行になりますが，比較が不明になる NULL は結合条件を満たしません。"
      - "EXCEPT で R の NULL が残ると考えた誤りです。NULL を同一視すると S にも NULL があるため差集合から除かれ，残るのは x が 1 の行だけです。"
    know: "NULL どうしの扱いは場面で異なる。WHERE や結合条件の等値比較では不明（偽扱い）だが，DISTINCT，GROUP BY，UNION などの重複判定では同じ値とみなされる。"
    terms: ["集合演算", "UNION", "INTERSECT", "EXCEPT", "NULL", "内部結合"]
    verify:
      sql:
        setup: |
          CREATE TABLE R(x INTEGER);
          CREATE TABLE S(x INTEGER);
          INSERT INTO R VALUES(1),(2),(NULL),(NULL);
          INSERT INTO S VALUES(2),(NULL),(3);
        mode: result
        query: "SELECT (SELECT COUNT(*) FROM (SELECT x FROM R UNION SELECT x FROM S)), (SELECT COUNT(*) FROM (SELECT x FROM R INTERSECT SELECT x FROM S)), (SELECT COUNT(*) FROM (SELECT x FROM R EXCEPT SELECT x FROM S)), (SELECT COUNT(*) FROM (SELECT R.x FROM R INNER JOIN S ON R.x = S.x))"

  - id: A09-512
    topic: 9-3-2-2
    diff: 3
    q: |
      社員表から次のようにビュー「部署別人数」を定義した。その後，社員表に対して 3 つの操作を順に実行した。最後に次の SQL 文を実行したときの結果はどれか。

      ビューの定義
      ```
      CREATE VIEW 部署別人数 (部署, 人数) AS SELECT 部署, COUNT(*) FROM 社員 GROUP BY 部署
      ```
      操作（順に実行）
      ```
      DELETE FROM 社員 WHERE 社員ID = 2
      INSERT INTO 社員 VALUES (7, '総務'), (8, '総務')
      UPDATE 社員 SET 部署 = '営業' WHERE 社員ID = 5
      ```
      最後に実行する SQL 文
      ```
      SELECT 部署 FROM 部署別人数 WHERE 人数 = (SELECT MAX(人数) FROM 部署別人数)
      ```
    attach: |
      〔社員表（ビュー定義時点）〕
      | 社員ID | 部署 |
      |---|---|
      | 1 | 営業 |
      | 2 | 営業 |
      | 3 | 開発 |
      | 4 | 開発 |
      | 5 | 開発 |
      | 6 | 総務 |
    c:
      - "総務"
      - "開発"
      - "開発，総務"
      - "エラーになる"
    a: ア
    scope: "データベース言語(SQL)のビュー（CREATE VIEW）と，GROUP BY による集計，INSERT，UPDATE，DELETE。ビューが実表のデータを参照する仮想の表であることは SQL の基本事項として範囲内。"
    prereq: "ビューは実データを持たず参照のたびに問合せが実行される仮想表であること，GROUP BY と COUNT(*)，INSERT/UPDATE/DELETE の効果"
    hard: "ビュー定義時点ではなく，3 つの更新操作を反映した現在の社員表からビューの内容を導き，その上で副問合せ（最大値との比較）まで評価する多段階の処理が必要。"
    exp: |
      ビューは問合せを名前付きで保存したもので，参照するたびに社員表の現在の内容から計算されます。3 つの操作を順に反映します。
      | 操作 | 社員表の変化 |
      |---|---|
      | DELETE（社員ID 2） | 営業が 1 人（社員ID 1）になる |
      | INSERT（7，8） | 総務が 3 人（6，7，8）になる |
      | UPDATE（社員ID 5） | 開発が 2 人（3，4），営業が 2 人（1，5）になる |
      現在のビューは（営業，2），（開発，2），（総務，3）です。人数の最大値は 3 なので，該当する部署は総務だけです。
    why:
      - "正解です。ビューは更新後の社員表から計算され，人数が最大の 3 になるのは総務だけです。"
      - "ビュー定義時点の人数（開発が 3 人で最多）のまま変わらないとした誤りです。ビューは結果のコピーではなく，参照時に実表から計算し直されます。"
      - "UPDATE による社員ID 5 の移動を反映し忘れ，開発が 3 人のまま総務と並ぶと考えた誤りです。実際は営業と開発が 2 人ずつになり，最大は総務の 3 人だけです。"
      - "集計を含むビューは参照できないとした誤りです。GROUP BY を使ったビューも SELECT で参照でき，一般に行えないのは，そのビューに対する INSERT や UPDATE です。"
    know: "ビューは実表の内容を反映する仮想の表で，実表の更新は次回の参照から即座に見える。GROUP BY や集約関数を含むビューは，参照はできるが一般に更新はできない。"
    terms: ["ビュー", "GROUP BY", "集約関数", "副問合せ"]
    verify:
      sql:
        setup: |
          CREATE TABLE 社員(社員ID INTEGER PRIMARY KEY,部署 TEXT);
          INSERT INTO 社員 VALUES(1,'営業'),(2,'営業'),(3,'開発'),(4,'開発'),(5,'開発'),(6,'総務');
          CREATE VIEW 部署別人数 (部署, 人数) AS SELECT 部署, COUNT(*) FROM 社員 GROUP BY 部署;
          DELETE FROM 社員 WHERE 社員ID = 2;
          INSERT INTO 社員 VALUES (7, '総務'), (8, '総務');
          UPDATE 社員 SET 部署 = '営業' WHERE 社員ID = 5;
        mode: result
        query: "SELECT GROUP_CONCAT(部署) FROM (SELECT 部署 FROM 部署別人数 WHERE 人数 = (SELECT MAX(人数) FROM 部署別人数) ORDER BY 部署)"

  - id: A09-513
    topic: 9-3-2-2
    diff: 3
    q: |
      次の社員表に対して，各社員の給与をその社員が所属する部署の平均給与と比べる次の SQL 文を実行した。結果の行数はいくつか。

      ```
      SELECT 社員ID FROM 社員 e
      WHERE 給与 > (SELECT AVG(給与) FROM 社員 WHERE 部署 = e.部署)
      ```
    attach: |
      〔社員表〕
      | 社員ID | 部署 | 給与 |
      |---|---|---|
      | 1 | A | 300 |
      | 2 | A | 500 |
      | 3 | A | 400 |
      | 4 | B | 200 |
      | 5 | B | 200 |
      | 6 | B | 800 |
      | 7 | C | 600 |
    c: ["2", "3", "4", "5"]
    a: ア
    scope: "データベース言語(SQL)の相関副問合せ。外側の行ごとに副問合せが評価され，同じ部署の平均が使われることは SELECT 文の副問合せ・相関副問合せの基本操作として範囲内。"
    prereq: "相関副問合せでは外側の表の行ごとに副問合せが再評価されること，AVG の計算，> と >= の違い"
    hard: "部署ごとに異なる平均値を求めて社員 1 人ずつ比較する必要がある。A の平均がちょうど 400 で社員ID 3 と等しくなること，C は 1 人だけで平均と等しいことを見落としやすい。"
    exp: |
      相関副問合せでは，外側の社員 e の部署ごとに副問合せの平均が決まります。
      | 部署 | 給与 | 部署の平均 | 平均より大きい社員 |
      |---|---|---|---|
      | A | 300，500，400 | 400 | 社員ID 2（500）のみ。社員ID 3 は 400 で等しいため偽 |
      | B | 200，200，800 | 400 | 社員ID 6（800）のみ |
      | C | 600 | 600 | なし（等しい） |
      結果は社員ID 2 と 6 の 2 行です。
    why:
      - "正解です。部署ごとの平均（A=400，B=400，C=600）より大きい社員は 2 人だけです。"
      - "副問合せが部署に関係なく全体の平均（約 428.6）を使うと考えた誤りです。この場合は 500，800，600 の 3 行になりますが，相関副問合せは外側の部署 e.部署 で絞って平均を求めます。"
      - "条件を >= と読み替え，平均と等しい社員ID 3（400）と社員ID 7（600）も含めた誤りです。条件は > なので，平均と等しい場合は結果に含まれません。"
      - "平均より大きい社員ではなく，平均以下の社員（5 人）を数えた誤りです。不等号の向きを取り違えており，大きい社員は 2 人だけです。"
    know: "相関副問合せは外側の各行について副問合せを評価し直す。副問合せ内の部署の条件を忘れる（相関を外す）と全体平均との比較になり，結果が変わる。平均と等しい行は > では対象外。"
    terms: ["相関副問合せ", "副問合せ", "集約関数"]
    verify:
      sql:
        setup: |
          CREATE TABLE 社員(社員ID INTEGER PRIMARY KEY,部署 TEXT,給与 INTEGER);
          INSERT INTO 社員 VALUES(1,'A',300),(2,'A',500),(3,'A',400),(4,'B',200),(5,'B',200),(6,'B',800),(7,'C',600);
        mode: result
        query: "SELECT COUNT(*) FROM (SELECT 社員ID FROM 社員 e WHERE 給与 > (SELECT AVG(給与) FROM 社員 WHERE 部署 = e.部署))"

  - id: A09-514
    topic: 9-3-2-2
    diff: 2
    q: |
      顧客表と注文表から，注文が 1 件もない顧客の顧客名を求める SQL 文はどれか。注文表には金額が 0 の注文（無償サンプルの手配）も登録されている。
    attach: |
      〔顧客表〕
      | 顧客ID | 顧客名 |
      |---|---|
      | 1 | 青木 |
      | 2 | 井上 |
      | 3 | 上田 |
      | 4 | 遠藤 |

      〔注文表〕
      | 注文ID | 顧客ID | 金額 |
      |---|---|---|
      | 11 | 1 | 500 |
      | 12 | 1 | 300 |
      | 13 | 3 | 0 |
    c:
      - "SELECT c.顧客名 FROM 顧客 c LEFT OUTER JOIN 注文 o ON c.顧客ID = o.顧客ID WHERE o.注文ID IS NULL"
      - "SELECT c.顧客名 FROM 顧客 c LEFT OUTER JOIN 注文 o ON c.顧客ID = o.顧客ID WHERE o.注文ID = NULL"
      - "SELECT c.顧客名 FROM 顧客 c INNER JOIN 注文 o ON c.顧客ID <> o.顧客ID"
      - "SELECT 顧客名 FROM 顧客 WHERE 顧客ID NOT IN (SELECT 顧客ID FROM 注文 WHERE 金額 > 0)"
    a: ア
    scope: "データベース言語(SQL)の外部結合，NULL の判定（IS NULL），副問合せ（NOT IN）。「存在しないもの」を求める基本的な書き方は SELECT 文の基本操作として範囲内。"
    prereq: "左外部結合で対応行がない場合に右表の列が NULL になること，NULL の判定は IS NULL で行うこと，等号では NULL を判定できないこと"
    exp: |
      左外部結合では，注文のない顧客の注文表の列がすべて NULL になります。そこで「注文ID IS NULL」の行を選べば注文のない顧客になります。
      | 顧客 | 注文 | 結合結果の注文ID |
      |---|---|---|
      | 青木 | 11，12 | 11，12 |
      | 井上 | なし | NULL |
      | 上田 | 13（金額 0） | 13 |
      | 遠藤 | なし | NULL |
      該当するのは井上と遠藤です。他の選択肢を実行すると，= NULL は 0 行，<> の結合は注文のある顧客も返し，金額の条件付きの NOT IN は上田まで含みます。
    why:
      - "正解です。左外部結合の NULL 補完行を IS NULL で拾うことで，注文のない井上と遠藤が得られます。"
      - "「= NULL」と書いた誤りです。NULL との等号比較は常に不明となり真にならないため，結果は 0 行になります。NULL の判定は IS NULL を使います。"
      - "顧客ID が等しくない組合せを結合した誤りです。他の顧客の注文と組み合わさるため，注文のある顧客も結果に現れ，注文のない顧客を求めたことにはなりません。"
      - "金額が 0 を超える注文だけを対象にした誤りです。金額 0 の注文だけをもつ上田も「注文なし」として結果に含まれてしまい，求める結果（井上，遠藤）と異なります。"
    know: "「存在しない」を求めるには，左外部結合して IS NULL を調べる方法，NOT EXISTS，NOT IN の 3 つが代表的。NULL の判定に = は使えず IS NULL を使う。副問合せの条件を足すと意味が変わる点に注意する。"
    terms: ["左外部結合", "外部結合", "NULL", "副問合せ", "IN"]
    verify:
      sql:
        setup: |
          CREATE TABLE 顧客(顧客ID INTEGER PRIMARY KEY,顧客名 TEXT);
          CREATE TABLE 注文(注文ID INTEGER PRIMARY KEY,顧客ID INTEGER,金額 INTEGER);
          INSERT INTO 顧客 VALUES(1,'青木'),(2,'井上'),(3,'上田'),(4,'遠藤');
          INSERT INTO 注文 VALUES(11,1,500),(12,1,300),(13,3,0);
        mode: choices
        expectRows: [["井上"], ["遠藤"]]

