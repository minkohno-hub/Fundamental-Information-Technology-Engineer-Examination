      |---|---|---|
      | 1 | A | 300 |
      | 2 | A | NULL |
      | 3 | B | 200 |
      | 4 | B | 400 |
      | 5 | B | 300 |
      | 6 | C | 600 |
      | 7 | D | NULL |
      | 8 | E | 100 |
      | 9 | E | 200 |
    c:
      - "C"
      - "A，B，C"
      - "B，C"
      - "結果は 0 行"
    a: ア
    scope: "データベース言語(SQL)のグループ化（GROUP BY，HAVING），集約関数（AVG）と副問合せ，NULL の扱い。AVG が NULL を除いて計算することは集約関数の基本として範囲内。"
    prereq: "AVG などの集約関数は NULL の行を計算から除くこと，副問合せ（スカラー副問合せ）の値と HAVING の比較，> と >= の違い"
    hard: "全体の平均と部署ごとの平均の両方で NULL を除外して計算し，全体平均がちょうど 300 になって A，B の平均と等しくなる（厳密な大小比較では選ばれない）点まで追う必要がある。"
    exp: |
      AVG は NULL の行を分母にも分子にも含めません。
      全体の平均は NULL を除く 7 件（300，200，400，300，600，100，200）の合計 2100 を 7 で割り，300 です。
      | 部署 | 給与（NULL を除く） | AVG | 全体平均 300 より大きいか |
      |---|---|---|---|
      | A | 300 | 300 | 等しいので偽 |
      | B | 200，400，300 | 300 | 等しいので偽 |
      | C | 600 | 600 | 真 |
      | D | なし | NULL | 比較が不明で偽扱い |
      | E | 100，200 | 150 | 偽 |
      したがって結果は C だけです。
    why:
      - "正解です。全体平均が 300 で，これを厳密に超える部署平均は C（600）だけです。"
