    prereq: "内部結合は両方に対応行がある組合せだけを返すこと，左（右）外部結合は左（右）の表の行をすべて残して対応行がなければ相手の列を NULL にすること，NULL との等値比較は真にならないこと"
    exp: |
      まず内部結合で対応する組合せを数えます。部署ID が D1 の 2 人，D2 の 2 人が部署表と対応し，部署ID が NULL の遠藤は NULL = 'D1' などが真にならないため対応しません。
      | 結合 | 内訳 | 行数 |
      |---|---|---|
      | 内部結合 | 青木，井上（D1），上田，大野（D2） | 4 |
      | 左外部結合 | 内部結合の 4 行＋遠藤（部署名 NULL） | 5 |
      | 右外部結合 | 内部結合の 4 行＋総務（D3）＋人事（D4）で社員名は NULL | 6 |
      左外部結合は社員表（左）の全 5 行を保証し，右外部結合は部署表（右）の全 4 行を保証します。したがって（4，5，6）です。
