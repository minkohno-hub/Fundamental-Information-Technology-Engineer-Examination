    a: ア
    scope: "データベース言語(SQL)のグループ化（GROUP BY に複数列を指定する），HAVING，集約関数（SUM）。複数列によるグループ化の結果を求める操作は SELECT 文の基本として範囲内。"
    prereq: "GROUP BY に複数の列を指定すると列の値の組合せごとにグループ化されること，HAVING でグループごとの合計を絞り込むこと"
    hard: "店舗と商品の組合せ 6 グループの合計を求めて条件で絞り，さらに結果の合計の総和を計算する 3 段階の処理が必要。グループ化の単位を取り違えると別の値になる。"
    exp: |
      （店舗，商品）の組合せごとに数量を合計します。
      | 店舗 | 商品 | 数量 | 合計 | 10 以上 |
      |---|---|---|---|---|
      | A | x | 4，6 | 10 | 該当 |
      | A | y | 3，8 | 11 | 該当 |
      | B | x | 10 | 10 | 該当 |
      | B | y | 2，3 | 5 | 対象外 |
      | C | x | 5 | 5 | 対象外 |
      | C | y | 5，6 | 11 | 該当 |
      該当は 4 行で，合計の総和は 10＋11＋10＋11＝42 です。
    why:
      - "正解です。店舗と商品の組合せで 6 グループになり，合計が 10 以上の 4 グループ（合計の総和 42）が残ります。"
      - "店舗だけでグループ化した誤りです。A が 21，B が 15，C が 16 でいずれも 10 以上となり，3 行・総和 52 になりますが，GROUP BY には店舗と商品の両方が指定されています。"
      - "HAVING ではなく，行ごとの数量が 10 以上の行（B の x だけ）に絞り込んだ誤りです。HAVING は集計後のグループの合計に対する条件です。"
      - "商品だけでグループ化した誤りです。x が 25，y が 27 となり 2 行・総和 52 になりますが，店舗ごとの内訳に分かれる点を見落としています。"
    know: "GROUP BY に複数の列を書くと，列の値の組合せごとにグループができる。SELECT に書ける非集約の列は GROUP BY に指定した列に限られ，HAVING の条件はグループ単位の集計値にかかる。"
    terms: ["GROUP BY", "HAVING", "集約関数"]
    verify:
      sql:
        setup: |
          CREATE TABLE 売上(店舗 TEXT,商品 TEXT,数量 INTEGER);
          INSERT INTO 売上 VALUES('A','x',4),('A','x',6),('A','y',3),('A','y',8),('B','x',10),('B','y',2),('B','y',3),('C','x',5),('C','y',5),('C','y',6);
        mode: result
        query: "SELECT COUNT(*), SUM(合計) FROM (SELECT 店舗, 商品, SUM(数量) AS 合計 FROM 売上 GROUP BY 店舗, 商品 HAVING SUM(数量) >= 10)"

