      - "NULL を 0 として扱う誤りです。この場合は全体平均が 233.3，A は 150 となって B，C が残りますが，AVG は NULL の行を除いて計算するので成り立ちません。"
      - "副問合せの結果に NULL が含まれると全体が空になると誤解した誤りです。副問合せの AVG は NULL を除いた 300 という値を返すので，比較は通常どおり行われます。"
    know: "集約関数（COUNT(*) を除く）は NULL の行を無視する。AVG は NULL を 0 とみなさず，その行を件数にも数えない。全員が NULL のグループの AVG は NULL になり，比較は真にならない。"
    terms: ["集約関数", "HAVING", "GROUP BY", "副問合せ", "NULL"]
    verify:
