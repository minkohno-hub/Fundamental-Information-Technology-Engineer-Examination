      - "左外部結合を内部結合と同じ扱いにして，対応のない遠藤が消えるとした誤りです。左外部結合は左表の行を必ず残し，部署名を NULL にして 1 行出力します。"
    know: "外部結合は「どちらの表の行を必ず残すか」で左・右・完全に分かれる。NULL の行は等値結合の条件では対応せず，内部結合では消えるが外部結合では NULL 補完の行として残る。"
