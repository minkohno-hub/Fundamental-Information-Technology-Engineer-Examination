    a: ア
    scope: "データベース言語(SQL)の副問合せ・相関副問合せ・EXISTS・集約関数。部署ごとの最大値を持つ行を求める問合せは SELECT 文の基本的な操作の組合せとして範囲内。"
    prereq: "相関副問合せと非相関副問合せの違い，IN と = の意味，NOT EXISTS の評価（自分自身の行も副問合せの対象になること）"
    hard: "4 つの SQL 文のそれぞれについて，どの行が条件を満たすかを実際の表で評価する必要がある。非相関の IN は他の部署の最大値と偶然同額の社員を拾い，>= の NOT EXISTS は自分自身と比較して常に偽になる。"
    exp: |
      期待する結果は，営業の青木，開発の黄田，総務の白石と黒田（同額 400 で 2 人）です。各 SQL 文を表に当てはめます。
      | SQL 文の特徴 | 結果 |
      |---|---|
      | 相関副問合せで部署ごとの MAX と等しい | 青木，黄田，白石，黒田（期待どおり） |
      | 全体の MAX（600）と等しい | 黄田のみ |
      | 各部署の最大値の集合（500，600，400）に含まれる | 給与がこの集合にある全員（赤井 400，緑川 500 も含む）で 6 人全員 |
      | NOT EXISTS の条件が >= | 自分自身が必ず条件を満たすため副問合せが必ず 1 行以上返り，結果は 0 行 |
      したがって，部署ごとに MAX を求める相関副問合せが正解です。
    why:
      - "正解です。相関副問合せで各社員の部署ごとの最大給与と比較しており，同額の白石と黒田も含めて 4 人が得られます。"
      - "全社員の最大給与だけと比較した誤りです。部署の条件がないため，全体で最も高い黄田（600）しか得られません。"
      - "部署ごとの最大値を集合にして IN で比較した誤りです。どの部署の最大値かを区別しないため，他部署の最大値と同額の赤井（400）や緑川（500）まで含まれます。"
      - "NOT EXISTS の副問合せで >= を使った誤りです。社員自身も比較対象になるため副問合せは常に 1 行以上返り，NOT EXISTS が真にならず結果は 0 行です。"
    know: "「グループ内で最大の行」を求めるには相関副問合せで部署ごとの MAX と比較する。非相関の IN は部署の対応が失われる。NOT EXISTS で最大を求めるときは，自分自身を除くため不等号は > にする。"
    terms: ["相関副問合せ", "副問合せ", "EXISTS", "集約関数"]
    verify:
      sql:
        setup: |
          CREATE TABLE 社員(社員ID INTEGER PRIMARY KEY,氏名 TEXT,部署 TEXT,給与 INTEGER);
          INSERT INTO 社員 VALUES(1,'青木','営業',500),(2,'赤井','営業',400),(3,'黄田','開発',600),(4,'緑川','開発',500),(5,'白石','総務',400),(6,'黒田','総務',400);
        mode: choices
        expectRows: [["青木"], ["黄田"], ["白石"], ["黒田"]]

  - id: A09-517
    topic: 9-3-2-2
    diff: 2
    q: |
      次の商品表に対して次の SQL 文を実行した。結果の行数はいくつか。価格と分類は NULL を許す列である。

      ```
      SELECT 商品名 FROM 商品
      WHERE 価格 BETWEEN 100 AND 300 AND 分類 NOT IN ('B', 'C')
      ```
    attach: |
      〔商品表〕
      | 商品名 | 価格 | 分類 |
      |---|---|---|
      | a | 100 | A |
      | b | 300 | B |
      | c | 200 | NULL |
      | d | 250 | C |
      | e | 350 | A |
      | f | NULL | A |
      | g | 150 | A |
      | h | 99 | C |
    c: ["2", "3", "1", "5"]
    a: ア
    scope: "データベース言語(SQL)の述語（BETWEEN，IN，NOT IN）と NULL の扱い。BETWEEN が両端を含むこと，NULL との比較が真にならないことは SELECT 文の基本操作として範囲内。"
    prereq: "BETWEEN a AND b は a 以上 b 以下であること，NULL を含む比較は不明になり WHERE では行が選ばれないこと，NOT IN の意味"
    hard: "BETWEEN の両端の扱い，NULL の行（価格と分類のそれぞれ）の脱落，NOT IN の除外という 3 つの条件を行ごとに追う必要がある。"
    exp: |
      行ごとに条件を評価します。WHERE は結果が真の行だけを残し，NULL を含む比較は不明で残りません。
      | 商品 | 価格 100〜300 | 分類 NOT IN (B，C) | 結果 |
      |---|---|---|---|
      | a | 真（100 は含む） | A なので真 | 選ばれる |
      | b | 真（300 は含む） | B なので偽 | × |
      | c | 真 | NULL は不明 | ×（不明） |
      | d | 真 | C なので偽 | × |
      | e | 偽（350） | － | × |
      | f | 不明（NULL） | － | × |
      | g | 真 | A なので真 | 選ばれる |
      | h | 偽（99） | － | × |
      したがって a と g の 2 行です。
    why:
      - "正解です。価格が 100〜300 で分類が B，C 以外かつ NULL でない商品 a と g の 2 行です。"
      - "分類が NULL の商品 c も「B でも C でもない」ので条件を満たすと考えた誤りです。NULL との比較は不明になり，NOT IN も真にならないため c は選ばれません。"
      - "BETWEEN の端の値（100 と 300）を含めない誤りです。BETWEEN は両端を含むので，価格 100 の a は条件を満たします（この読み方だと g だけの 1 行になります）。"
      - "分類の条件を無視して価格の条件だけで数えた誤りです。価格が範囲内の a，b，c，d，g の 5 行になりますが，AND で結ばれた分類の条件も必要です。"
    know: "WHERE は条件が真の行だけを残し，偽と不明は除く。NULL を含む比較（NOT IN も）は不明になる。BETWEEN は両端を含み，a <= x AND x <= b と同じ意味。"
    terms: ["BETWEEN", "IN", "NULL", "SQL"]
    verify:
      sql:
        setup: |
          CREATE TABLE 商品(商品名 TEXT,価格 INTEGER,分類 TEXT);
          INSERT INTO 商品 VALUES('a',100,'A'),('b',300,'B'),('c',200,NULL),('d',250,'C'),('e',350,'A'),('f',NULL,'A'),('g',150,'A'),('h',99,'C');
        mode: result
        query: "SELECT COUNT(*) FROM (SELECT 商品名 FROM 商品 WHERE 価格 BETWEEN 100 AND 300 AND 分類 NOT IN ('B', 'C'))"
