questions:
  - id: A13-001
    topic: 13-1-1-1
    diff: 1
    q: ウォーターフォールモデルの特徴として，適切なものはどれか。
    c:
      - 開発サイクルを繰り返すたびにリスク分析を行い，システムを徐々に大きくしていく。
      - 短い期間の反復を繰り返し，動くソフトウェアを少しずつ追加していく。
      - 要件定義，設計，プログラミング，テストなどの工程を順番に進め，原則として前の工程に戻らない。
      - 試作品を早い段階で作成して利用者に評価してもらい，要求を明確にしながら開発を進める。
    a: ウ
    exp: |
      ウォーターフォールモデルは、要件定義 → 設計 → プログラミング → テスト のように工程を上流から下流へ順番に進め、各工程の成果物をレビューで確定させてから次の工程に移る開発モデルです。進捗や作業範囲を管理しやすい反面、後の工程で要求の誤りが見つかると手戻りの影響が大きくなります。要求が明確で変更の少ない大規模開発に向いています。
    why:
      - これはスパイラルモデルの説明です。
      - これはアジャイル開発（反復型の開発）の説明です。
      - 正解です。工程を順番に進め、原則として後戻りしません。
      - これはプロトタイピングモデルの説明です。
    terms:
      - ウォーターフォールモデル
  - id: A13-002
    topic: 13-1-1-1
    diff: 1
    q: プロトタイピングモデルが特に有効な状況として，最も適切なものはどれか。
    c:
      - 利用者の要求があいまいで，画面や操作のイメージを確認しながら要求を固めたい。
      - 既存のプログラムのソースコードが失われたため，実行形式から仕様を復元したい。
      - 要求が明確に定まっていて，開発の途中で変更される可能性が極めて低い。
      - 同じ業界向けに機能の一部だけが異なる製品を多数開発し，共通部品を計画的に再利用したい。
    a: ア
    exp: |
      プロトタイピングモデルは、開発の初期段階で試作品（プロトタイプ）を作り、利用者に実際に見て操作してもらって評価を受け、要求の誤解や漏れを早期に発見する開発モデルです。利用者の要求があいまいな場合や、ユーザーインタフェースの使い勝手が重要なシステムで特に有効です。
    why:
      - 正解です。試作品で要求を確認・明確化できます。
      - 実行形式などから仕様を復元するのはリバースエンジニアリングです。
      - 要求が明確で変更が少ない場合は、ウォーターフォールモデルが向いています。
      - 共通部品を計画的に再利用して類似製品を開発するのはソフトウェアプロダクトラインです。
    terms:
      - プロトタイピングモデル
      - ウォーターフォールモデル
  - id: A13-003
    topic: 13-1-1-1
    diff: 2
    q: スパイラルモデルの説明として，適切なものはどれか。
    c:
      - 開発者が1台のコンピュータを共有し，交代しながらプログラムを作成する。
      - 既存の業務パッケージをそのまま導入し，業務をパッケージに合わせる。
      - 全工程を一度だけ順番に実施し，最後に全機能をまとめてリリースする。
      - システムをいくつかのサブシステムに分割し，計画，リスク分析，開発，評価のサイクルを繰り返しながら，システムを徐々に拡大していく。
    a: エ
    exp: |
      スパイラルモデルは、ベーム（Boehm）が提唱した開発モデルで、目標設定・リスク分析・開発とテスト・次の計画 というサイクルを螺旋（スパイラル）状に繰り返し、システムを徐々に完成に近づけます。各サイクルでリスク分析を行い、リスクの高い部分を早めに検証する点が特徴です。サイクルの中で各部分の開発にウォーターフォールモデルやプロトタイピングを組み合わせることもあります。
    why:
      - これはペアプログラミングやモブプログラミングのような共同作業の説明であり、開発モデルではありません。
      - これはパッケージソフトウェアの導入（ノンカスタマイズ導入）の説明であり、開発モデルではありません。
      - これはウォーターフォールモデルの説明です。
      - 正解です。リスク分析を含むサイクルを繰り返してシステムを拡大します。
    terms:
      - スパイラルモデル
  - id: A13-004
    topic: 13-1-1-1
    diff: 2
    q: ソフトウェア開発モデルのうち，段階的モデル（インクリメンタルモデル）と進展的モデル（エボリューショナルモデル）の違いの説明として，適切なものはどれか。
    c:
      - どちらのモデルも開発を一度しか行わず，違いは文書の量だけである。
      - 段階的モデルはテストを省略し，進展的モデルはテストだけを繰り返す。
      - 段階的モデルは要求が確定していない場合に用いるが，進展的モデルは最初にすべての要求を確定させてから開発する。
      - 段階的モデルは最初に要求を確定させてから機能を分割して順次開発するが，進展的モデルは要求が最初には確定しておらず，開発を繰り返しながら要求を洗練させる。
    a: エ
    exp: |
      段階的モデル（インクリメンタルモデル）は、開発の最初にシステム全体の要求を確定させ、それを複数の部分に分けて段階的に開発・リリースするモデルです。一方、進展的モデル（エボリューショナルモデル）は、最初の時点では要求がすべて確定していないことを前提に、開発・評価を繰り返しながら要求を明確にし、システムを進化させていくモデルです。
    why:
      - どちらのモデルも開発を複数回に分けて繰り返します。
      - どちらのモデルでも開発した部分のテストは行います。
      - 2つのモデルの説明が逆です。
      - 正解です。要求を最初に確定させるかどうかが主な違いです。
    terms:
      - 段階的モデル
      - 進展的モデル
  - id: A13-005
    topic: 13-1-1-1
    diff: 2
    q: ソフトウェアプロダクトラインの説明として，適切なものはどれか。
    c:
      - 類似した複数の製品に共通する部分を再利用可能なコア資産として整備し，それを組み合わせて個々の製品を効率よく開発する。
      - 製造ラインの機械を制御する組込みソフトウェアを開発する手法である。
      - 製品の販売終了日を定め，サポートを終了するまでの期間を管理する。
      - 1つの製品だけを対象に，要件定義からテストまでの工程を順番に進める。
    a: ア
    exp: |
      ソフトウェアプロダクトラインは、特定の分野で類似した複数の製品（製品群）を開発するときに、共通する部分（共通性）と製品ごとに異なる部分（可変性）を分析し、共通部分をコア資産として計画的に整備・再利用して、個々の製品を効率よく開発する手法です。開発期間の短縮や品質の向上が期待できます。
    why:
      - 正解です。製品群の共通部分をコア資産として計画的に再利用します。
      - 名前に「ライン」が付いていますが、製造ライン向けの組込み開発という意味ではありません。
      - 販売終了やサポート終了の管理は製品ライフサイクル管理の話であり、ソフトウェアプロダクトラインとは異なります。
      - これは単一製品をウォーターフォールモデルで開発する場合の説明です。
    terms:
      - ソフトウェアプロダクトライン
      - ソフトウェア再利用
  - id: A13-006
    topic: 13-1-1-2
    diff: 2
    q: アジャイルソフトウェア開発宣言で，より価値をおくとしているものの組合せとして，適切なものはどれか。
    c:
      - 動くソフトウェアよりも包括的なドキュメントを，変化への対応よりも計画に従うことを重視する。
      - 個人と対話よりもプロセスやツールを，顧客との協調よりも契約交渉を重視する。
      - 変化への対応よりも計画に従うことを，個人と対話よりもプロセスやツールを重視する。
      - 包括的なドキュメントよりも動くソフトウェアを，計画に従うことよりも変化への対応を重視する。
    a: エ
    exp: |
      アジャイルソフトウェア開発宣言（2001年）は、次の4つの価値を掲げています。
      - プロセスやツールよりも個人と対話を
      - 包括的なドキュメントよりも動くソフトウェアを
      - 契約交渉よりも顧客との協調を
      - 計画に従うことよりも変化への対応を
      右側（プロセス、ドキュメントなど）にも価値があることを認めながら、左側により価値をおくとしています。
    why:
      - 重視する側と比較される側が逆になっています。
      - 宣言では、プロセスやツールよりも個人と対話を、契約交渉よりも顧客との協調を重視します。
      - 宣言では、計画に従うことよりも変化への対応を重視し、プロセスやツールよりも個人と対話を重視します。
      - 正解です。動くソフトウェアと変化への対応により価値をおきます。
    know: 宣言は、右側の項目（ドキュメントや計画など）を不要としているわけではありません。
    terms:
      - アジャイル
  - id: A13-007
    topic: 13-1-1-2
    diff: 2
    q: アジャイルソフトウェアの12の原則に含まれる考え方として，適切なものはどれか。
    c:
      - 要求の変更はたとえ開発の後期であっても歓迎し，変化を味方につけて顧客の競争力を引き上げる。
      - 短期間で成果を上げるため，チームに長時間労働を継続させる。
      - 開発の初期にすべての要求を凍結し，以後の変更は受け付けない。
      - 進捗の最も重要な尺度は，作成したドキュメントのページ数である。
    a: ア
    exp: |
      アジャイルソフトウェアの12の原則には、「要求の変更はたとえ開発の後期であっても歓迎します」「動くソフトウェアこそが進捗の最も重要な尺度です」「一定のペースを継続的に維持できるようにしなければなりません（持続可能な開発）」「チームがもっと効率を高めることができるかを定期的に振り返り、それに基づいて自分たちのやり方を最適に調整します」などがあります。
    why:
      - 正解です。開発後期の要求変更も歓迎するのが原則の一つです。
      - 原則では、一定のペースを継続的に維持できる持続可能な開発を求めています。
      - 原則は変化への対応を重視しており、要求の凍結はこれに反します。
      - 原則では、進捗の最も重要な尺度は動くソフトウェアであるとしています。
    terms:
      - アジャイル
  - id: A13-008
    topic: 13-1-1-2
    diff: 2
    q: XP（エクストリームプログラミング）のプラクティスとして，適切でないものはどれか。
    c:
      - 2人の開発者が1台のコンピュータを使って共同でプログラムを作成する。
      - コードを頻繁に結合してビルドとテストを行う。
      - 開発の最初に全機能の詳細設計書を完成させ，承認を得てからコーディングに着手する。
      - テストを先に書き，そのテストに合格するようにコードを書く。
    a: ウ
    exp: |
      XP（エクストリームプログラミング）は、アジャイル開発の代表的な手法で、テスト駆動開発、ペアプログラミング、リファクタリング、ソースコードの共同所有、継続的インテグレーション、シンプルな設計、小規模リリースなどのプラクティス（実践項目）を定めています。開発の最初にすべての詳細設計を完成させるのは、ウォーターフォール型の進め方であり、XP のプラクティスではありません。
    why:
      - これはペアプログラミングで、XP のプラクティスです。
      - これは継続的インテグレーションで、XP のプラクティスです。
      - 正解です。最初に全機能の詳細設計を完成させるのは XP の考え方に反します。
      - これはテスト駆動開発で、XP のプラクティスです。
    terms:
      - XP
      - テスト駆動開発
      - ペアプログラミング
      - 継続的インテグレーション
  - id: A13-009
    topic: 13-1-1-2
    diff: 2
    q: テスト駆動開発（TDD）の進め方として，適切なものはどれか。
    c:
      - テストケースを作成せず，利用者による受入れテストだけで品質を確認する。
      - プログラムをすべて完成させた後で，まとめてテストケースを作成する。
      - テストは専門のテストチームだけが行い，開発者はテストコードを書かない。
      - 最初に失敗するテストを書き，そのテストに合格する最小限のコードを書いた後，リファクタリングで設計を改善する。
    a: エ
    exp: |
      テスト駆動開発（TDD）は、実装する前にテストコードを書き、次の短いサイクルを繰り返す開発手法です。
      1. まだ実装がないため失敗するテストを書く（レッド）
      2. テストに合格する最小限のコードを書く（グリーン）
      3. テストが通る状態を保ったままコードを整理する（リファクタリング）
      テストが自動化されて常に実行できるため、変更による不具合を早期に発見できます。
    why:
      - テスト駆動開発は自動化された単体レベルのテストを開発の中心に置く手法です。
      - テストを後からまとめて作るのは、テスト駆動開発とは逆の進め方です。
      - テスト駆動開発では、開発者自身がテストコードを書きます。
      - 正解です。テストを先に書き、合格させてからリファクタリングします。
    terms:
      - テスト駆動開発
      - リファクタリング
  - id: A13-010
    topic: 13-1-1-2
    diff: 2
    q: モブプログラミングの説明として，適切なものはどれか。
    c:
      - 3人以上のチーム全員が1台のコンピュータの前に集まり，1人がキーボードを操作し，他のメンバーが指示や助言をしながら，役割を交代して共同でプログラムを作成する。
      - 2人の開発者がペアになり，1人がコードを書き，もう1人がそれをレビューする。
      - 開発者がそれぞれ別の機能を担当し，完成後に全員でコードレビューを行う。
      - 不特定多数の開発者がインターネット上で分散してソースコードを作成し，公開する。
    a: ア
    exp: |
      モブプログラミングは、チーム全員（3人以上）が同じ時間に同じ場所（またはオンライン）で、1台のコンピュータを使って同じ作業を行う手法です。キーボードを操作する人をドライバー、指示や助言を行う人をナビゲーターと呼び、一定時間ごとに役割を交代します。知識の共有が進み、レビュー待ちなどの待ち時間が減る効果があります。
    why:
      - 正解です。チーム全員が1台のコンピュータで役割を交代しながら作業します。
      - これはペアプログラミングの説明です。
      - これは通常の分担開発とコードレビューの説明です。
      - これはオープンソースのような分散型の開発の説明です。
    terms:
      - モブプログラミング
      - ペアプログラミング
  - id: A13-011
    topic: 13-1-1-2
    diff: 1
    q: リファクタリングの説明として，適切なものはどれか。
    c:
      - プログラムに新しい機能を追加して，利用者の要求に応える。
      - 発見されたバグを修正するために，プログラムの出力結果を変更する。
      - 実行形式のプログラムを解析して，ソースコードや仕様を復元する。
      - プログラムの外部から見た振る舞いを変えずに，内部構造を改善して保守しやすくする。
    a: エ
    exp: |
      リファクタリングは、ソフトウェアの外部から見た動作（入出力や機能）を変えずに、重複したコードの共通化や分かりにくい名前の変更などによって内部の構造を改善することです。プログラムを読みやすく、変更しやすくする目的で行います。動作が変わっていないことを確認するために、自動テスト（回帰テスト）と組み合わせて行うのが一般的です。
    why:
      - 機能の追加は外部から見た振る舞いを変えるので、リファクタリングではありません。
      - バグ修正は外部から見た振る舞いを変える修正であり、リファクタリングとは区別されます。
      - これはリバースエンジニアリングの説明です。
      - 正解です。振る舞いを変えずに内部構造を改善します。
    terms:
      - リファクタリング
  - id: A13-012
    topic: 13-1-1-2
    diff: 2
    q: XP のプラクティス又は原則についての説明のうち，YAGNI に当たるものはどれか。
    c:
      - 開発したコードを1日に何度も統合し，自動でビルドとテストを行う。
      - 将来必要になるかもしれないという理由だけで機能を作り込まず，今必要な機能だけを実装する。
      - 顧客の代表者が開発チームと同じ場所にいて，いつでも質問に答えられるようにする。
      - どの開発者でもシステムのどのコードでも改善できるように，コードの所有権をチーム全体でもつ。
    a: イ
    exp: |
      YAGNI（You Aren't Gonna Need It：それはきっと必要にならない）は、「将来必要になりそう」という予測で機能や仕組みを先回りして作り込むことを戒め、今必要なものだけを最もシンプルに実装するという考え方です。不要な機能の作り込みによる無駄や複雑化を防ぎます。
    why:
      - これは継続的インテグレーションの説明です。
      - 正解です。今必要な機能だけを実装するという考え方です。
      - これはオンサイト顧客（顧客の同席）の説明です。
      - これはソースコードの共同所有の説明です。
    terms:
      - YAGNI
      - ソースコードの共同所有
      - 継続的インテグレーション
      - XP
  - id: A13-013
    topic: 13-1-1-2
    diff: 2
    q: スクラムにおけるプロダクトオーナーの役割として，適切なものはどれか。
    c:
      - 開発チームの作業時間を管理し，個々のメンバーの作業を細かく指示する。
      - プロダクトバックログの項目を明確にして並べ替え，プロダクトの価値を最大化することに責任をもつ。
      - スクラムの理論と実践を理解できるようにチームや組織を支援し，チームの障害を取り除く。
      - スプリントの中で，動作するインクリメントを作成する作業を行う。
    a: イ
    exp: |
      スクラムのチーム（スクラムチーム）は、プロダクトオーナー、スクラムマスター、開発者で構成されます。プロダクトオーナーは、プロダクトの価値を最大化することに責任をもち、プロダクトバックログ（作るべき機能などの一覧）の項目の作成・説明・並べ替え（優先順位付け）を行います。
    why:
      - スクラムのチームは自己管理型であり、作業の細かな指示は誰の役割でもありません。
      - 正解です。プロダクトバックログを管理し、価値の最大化に責任をもちます。
      - これはスクラムマスターの役割です。
      - これは開発者の役割です。
    terms:
      - スクラム
      - プロダクトオーナー
      - プロダクトバックログ
      - スクラムマスター
  - id: A13-014
    topic: 13-1-1-2
    diff: 2
    q: スクラムにおけるスクラムマスターの役割として，適切なものはどれか。
    c:
      - プロジェクトの予算を承認し，プロジェクトの開始を正式に認可する。
      - プロダクトバックログの優先順位を最終的に決定する。
      - 開発者に代わってプログラムを作成し，スプリントの成果物の完成に責任をもつ。
      - スクラムの理論や実践をチームと組織が理解できるように支援し，チームの進捗を妨げる障害の除去を促す。
    a: エ
    exp: |
      スクラムマスターは、スクラムガイドに定義されたとおりにスクラムを確立させることに責任をもちます。チームや組織がスクラムを理解・実践できるようにコーチングを行い、進捗を妨げる障害の除去を促し、スクラムイベントが有益な時間内に行われるように支援します。指示・命令するのではなく、チームに奉仕するリーダー（サーバントリーダー）として振る舞います。
    why:
      - 予算の承認やプロジェクトの正式な認可は、スポンサーなど組織側の役割です。
      - プロダクトバックログの優先順位付けはプロダクトオーナーの役割です。
      - 成果物（インクリメント）を作成するのは開発者の役割です。
      - 正解です。スクラムの実践を支援し、障害の除去を促します。
    terms:
      - スクラムマスター
      - プロダクトオーナー
      - スクラム
  - id: A13-015
    topic: 13-1-1-2
    diff: 2
    q: スクラムのイベントの説明として，適切なものはどれか。
    c:
      - スプリントは期間を固定せず，すべてのプロダクトバックログ項目が完了するまで続ける。
      - スプリントレトロスペクティブは，完成したインクリメントを利害関係者に提示して，フィードバックを得る場である。
      - デイリースクラムは，開発者が毎日同じ時間と場所で15分以内で行い，スプリントゴールに向けた進捗を検査して当日の計画を調整する。
      - スプリントレビューは，チームの人間関係やプロセスを改善するために，開発者だけで行う。
    a: ウ
    exp: |
      スクラムでは、1か月以内の固定の期間であるスプリントを繰り返して開発します。スプリントの中で次のイベントを行います。
      - スプリントプランニング：スプリントで行う作業を計画する
      - デイリースクラム：開発者が毎日15分以内で進捗を検査し、計画を調整する
      - スプリントレビュー：成果を利害関係者に提示し、フィードバックを得てプロダクトバックログを見直す
      - スプリントレトロスペクティブ：人・プロセス・ツールの観点でスプリントを振り返り、改善策を決める
    why:
      - スプリントは1か月以内の固定の期間（タイムボックス）です。
      - 成果を提示してフィードバックを得るのはスプリントレビューです。
      - 正解です。デイリースクラムは15分以内で毎日行います。
      - プロセスの改善を話し合うのはスプリントレトロスペクティブであり、スプリントレビューは利害関係者も参加して成果を検査する場です。
    terms:
      - スクラム
      - スプリント
      - デイリースクラム
      - スプリントレビュー
      - レトロスペクティブ
  - id: A13-016
    topic: 13-1-1-2
    diff: 1
    q: ふりかえり（レトロスペクティブ）の手法である KPT の Keep，Problem，Try の説明の組合せとして，適切なものはどれか。
    c:
      - Keep は良かったので今後も続けること，Problem はうまくいかなかったことや問題点，Try は次に試す改善策である。
      - Keep は次に試す改善策，Problem は良かったこと，Try は問題点である。
      - Keep は保留にしている作業，Problem は顧客からの苦情，Try はテストの再実行である。
      - Keep は担当者が抱えている作業，Problem はバグの件数，Try は試作品の作成である。
    a: ア
    exp: |
      KPT は、チームの活動を振り返るためのフレームワークです。
      - Keep：うまくいったので今後も続けたいこと
      - Problem：うまくいかなかったこと、問題点
      - Try：Problem の解決や Keep の強化のために次に試すこと
      の3つに分けて意見を出し合い、次の活動の改善につなげます。アジャイル開発のスプリントレトロスペクティブなどで用いられます。
    why:
      - 正解です。続けること・問題点・次に試すことの3つに分けて振り返ります。
      - Keep と Try と Problem の意味が入れ替わっています。
      - Keep は保留中の作業ではなく、良かったので続けることです。
      - Keep・Problem・Try は、作業量や件数を数えるものではありません。
    terms:
      - KPT
      - レトロスペクティブ
  - id: A13-017
    topic: 13-1-1-1
    diff: 2
    q: DevOps の説明として，適切なものはどれか。
    c:
      - 開発担当者と運用担当者が密接に連携・協力し，ツールによる自動化なども活用して，ソフトウェアを迅速かつ継続的にリリースする取組みである。
      - システムの運用を外部の事業者に一括して委託する契約形態である。
      - 開発部門と運用部門の責任範囲を明確に分離し，運用部門は開発の完了後にだけシステムを引き継ぐ。
      - 機械学習モデルの学習・デプロイ・監視を継続的に行うための取組みに限定した用語である。
    a: ア
    exp: |
      DevOps は、開発（Development）と運用（Operations）を組み合わせた言葉で、開発担当者と運用担当者が協力し合い、継続的インテグレーションや継続的デリバリーなどの自動化の仕組みも活用して、ビジネスの要求に応じたソフトウェアのリリースを迅速かつ頻繁に行う取組みです。機械学習モデルを対象に同様の考え方を適用したものを MLOps といいます。
    why:
      - 正解です。開発と運用が連携して迅速・継続的にリリースします。
      - 運用の外部委託はアウトソーシングであり、DevOps とは異なります。
      - 開発と運用を分断するのは、DevOps が解消しようとしている従来の体制です。
      - 機械学習モデルを対象にしたものは MLOps であり、DevOps はソフトウェア全般を対象とします。
    terms:
      - DevOps
      - MLOps
      - 継続的インテグレーション
  - id: A13-018
    topic: 13-1-1-1
    diff: 2
    q: MLOps の説明として，適切なものはどれか。
    c:
      - 機械学習に用いるデータを匿名化して，第三者に提供する仕組み
      - 人間が作成した規則を推論エンジンに登録し，専門家の判断を再現する仕組み
      - 業務システムの運用手順を紙のマニュアルにまとめ，運用担当者が手作業で実行する体制
      - 機械学習モデルの開発チームと運用チームが協調し，モデルの学習，デプロイ，監視，再学習という一連のサイクルを継続的かつ自動的に回せるようにする取組み
    a: エ
    exp: |
      MLOps（Machine Learning Operations）は、DevOps の考え方を機械学習に適用したものです。機械学習モデルは、本番環境のデータの傾向が変わると精度が下がることがあるため、モデルの学習・評価・デプロイ・本番での監視・再学習のサイクルを継続的に、できるだけ自動化して回す仕組みや体制を整えます。
    why:
      - これは匿名加工情報などのデータ提供の仕組みであり、MLOps とは異なります。
      - これはエキスパートシステムの説明です。
      - 手作業中心の運用体制は、自動化と継続的な改善を目指す MLOps とは逆です。
      - 正解です。機械学習モデルのライフサイクルを継続的に回す取組みです。
    terms:
      - MLOps
      - DevOps
  - id: A13-019
    topic: 13-1-1-3
    diff: 2
    q: SRE（サイト信頼性エンジニアリング）の説明として，適切なものはどれか。
    c:
      - 障害が発生したときに限り，運用担当者が手作業で復旧を行う体制
      - Web サイトのデザインを統一して，利用者にとって見やすく使いやすいページを作成する取組み
      - システムの運用にソフトウェアエンジニアリングの手法を取り入れ，信頼性の目標を定めて計測し，手作業の運用を自動化することでサービスの信頼性を高める取組み
      - 検索エンジンの検索結果で自社サイトが上位に表示されるようにする取組み
    a: ウ
    exp: |
      SRE（Site Reliability Engineering）は、Google が提唱した、システム運用の課題をソフトウェアエンジニアリングで解決する取組みです。サービスレベル目標（SLO）を定めて信頼性を計測し、許容できる障害の範囲（エラーバジェット）の中で開発のスピードと信頼性のバランスを取ります。また、繰り返し発生する手作業（トイル）を自動化して減らします。
    why:
      - 手作業での事後対応に頼る体制は、自動化を重視する SRE の考え方とは異なります。
      - これは Web デザインやユーザビリティの改善の説明です。
      - 正解です。エンジニアリングの手法で運用を自動化し、信頼性を高めます。
      - これは SEO（検索エンジン最適化）の説明です。
    terms:
      - SRE
      - DevOps
  - id: A13-020
    topic: 13-1-1-3
    diff: 2
    q: 継続的デリバリーと継続的デプロイの違いの説明として，適切なものはどれか。
    c:
      - 継続的デリバリーと継続的デプロイは，ソースコードの統合を1日1回にまとめる点が共通しており，違いはない。
      - 継続的デリバリーではテストを自動化しないが，継続的デプロイではテストだけを自動化する。
      - 継続的デリバリーは本番環境まで自動的に反映するが，継続的デプロイは開発環境にだけ反映する。
      - 継続的デリバリーでは本番環境へのリリースが可能な状態を常に保ち，本番への反映は人の判断で行うが，継続的デプロイではテストに合格した変更を本番環境まで自動的に反映する。
    a: エ
    exp: |
      継続的インテグレーション（CI）は、コードの変更を頻繁に統合し、自動でビルドとテストを行うことです。継続的デリバリー（CD）は、CI に加えてテスト環境などへのデプロイも自動化し、いつでも本番環境にリリースできる状態を保つことで、本番へのリリースは承認などの人の判断を経て行います。継続的デプロイは、さらに本番環境へのリリースまでを自動化するものです。
    why:
      - 本番環境への反映を自動化するかどうかに違いがあり、統合の回数を1日1回にまとめるものでもありません。
      - 継続的デリバリーでもビルドやテストを自動化します。
      - 本番環境まで自動的に反映するのは継続的デプロイです。
      - 正解です。本番への反映を自動で行うかどうかが違いです。
    terms:
      - 継続的デリバリー
      - 継続的デプロイ
      - 継続的インテグレーション
  - id: A13-021
    topic: 13-1-1-3
    diff: 2
    q: カオスエンジニアリングの説明として，適切なものはどれか。
    c:
      - 乱数を用いて大量の入力データを自動生成し，プログラムに与えて脆弱性を探す。
      - 本番環境などで意図的に障害を発生させ，システムが障害に耐えて回復できるかを検証し，弱点を見つけて改善する。
      - ソースコードを解析して，制御の流れが複雑な部分を特定する。
      - プロジェクトの混乱を防ぐため，開発チームの作業手順を厳格に標準化する。
    a: イ
    exp: |
      カオスエンジニアリングは、本番環境（又はそれに近い環境）で、サーバの停止やネットワークの遅延などの障害を意図的に発生させ、システム全体が想定どおりに耐えて回復できるかを実験的に確かめる手法です。実際の障害が起きる前に弱点を発見し、システムの回復力（レジリエンス）を高めます。
    why:
      - これはファジングの説明です。
      - 正解です。意図的に障害を起こして回復力を検証します。
      - これはソースコードの静的解析（複雑度の計測など）の説明です。
      - カオスエンジニアリングは、作業手順の標準化を指す言葉ではありません。
    terms:
      - カオスエンジニアリング
      - ファジング
  - id: A13-022
    topic: 13-1-1-3
    diff: 2
    q: DevSecOps の説明として，適切なものはどれか。
    c:
      - 開発が完了してリリースする直前に，セキュリティ専門部署がまとめて脆弱性診断を行う。
      - 開発と運用の連携にセキュリティを組み込み，設計の初期段階から運用までの全工程で継続的にセキュリティ対策を行う。
      - 開発環境をインターネットから切り離し，開発者以外の立入りを禁止する。
      - セキュリティ対策の運用を外部の事業者に委託する。
    a: イ
    exp: |
      DevSecOps は、DevOps にセキュリティ（Security）を組み込んだ考え方です。セキュリティ対策を開発の最後に行うのではなく、設計・開発・テスト・運用の各段階に組み込み（シフトレフト）、脆弱性検査ツールなどを CI/CD のパイプラインで自動実行して、迅速なリリースとセキュリティを両立させます。
    why:
      - リリース直前にまとめて対策する従来の方法は、DevSecOps が改善しようとしている点です。
      - 正解です。全工程にセキュリティ対策を組み込みます。
      - これは物理的・ネットワーク的な隔離の説明であり、DevSecOps の考え方ではありません。
      - これはセキュリティ運用の外部委託であり、DevSecOps とは異なります。
    terms:
      - DevSecOps
      - DevOps
  - id: A13-023
    topic: 13-1-1-4
    diff: 1
    q: ローコード開発の特徴として，適切なものはどれか。
    c:
      - 画面上で部品を配置したり設定したりすることで，ソースコードをほとんど書かずにアプリケーションを開発できる。
      - プログラムの行数を数えて，開発規模を見積もる。
      - 開発者が書いたソースコードを第三者が1行ずつ読んで誤りを探す。
      - すべての処理をアセンブリ言語で記述して，実行速度を最大限に高める。
    a: ア
    exp: |
      ローコード開発は、GUI 上で画面部品や処理の部品を組み合わせたり、設定したりすることで、手書きのソースコードを最小限に抑えてアプリケーションを開発する手法です。開発期間を短縮でき、プログラミングの専門家でない利用部門の担当者でも開発しやすくなります。ソースコードをまったく書かずに開発するものはノーコード開発と呼ばれます。
    why:
      - 正解です。ソースコードをほとんど書かずに開発できます。
      - これは LOC 法による規模見積りの説明です。
      - これはコードレビュー（コードインスペクションなど）の説明です。
      - アセンブリ言語での記述はローコード開発とは正反対の、低水準な言語による開発です。
    terms:
      - ローコード開発
  - id: A13-024
    topic: 13-1-1-5
    diff: 2
    q: ソフトウェアの再利用を促進するための方策として，適切なものはどれか。
    c:
      - モジュールの独立性を高め，インタフェースを標準化して部品として登録・管理する。
      - プロジェクトごとに独自のコーディング規約を定め，部品の形式を統一しない。
      - 1つのモジュールに多くの機能を詰め込み，汎用的に使えるようにする。
      - 各モジュールが互いのデータを直接参照するようにして，結合度を高める。
    a: ア
    exp: |
      ソフトウェアを再利用しやすくするには、モジュールの独立性を高める（モジュール強度を高く、モジュール結合度を低くする）こと、インタフェースや形式を標準化すること、部品をライブラリとして登録して検索・利用しやすく管理することが有効です。再利用によって、開発の生産性と品質の向上が期待できます。
    why:
      - 正解です。独立性の高い部品を標準化して管理すると再利用しやすくなります。
      - 規約や形式がばらばらだと、他のプロジェクトで部品を流用しにくくなります。
      - 多くの機能を詰め込むとモジュール強度が下がり、必要な機能だけを再利用しにくくなります。
      - 結合度を高めるとモジュール同士の依存が強くなり、単独での再利用が難しくなります。
    terms:
      - ソフトウェア再利用
      - モジュール結合度
  - id: A13-025
    topic: 13-1-1-6
    diff: 2
    q: リバースエンジニアリングの説明として，適切なものはどれか。
    c:
      - 試作品を作成して利用者に評価してもらい，要求を明確にする。
      - 既存のソフトウェアのプログラムを解析して，その仕様や設計の情報を導き出す。
      - 要求仕様から設計を行い，それを基にプログラムを作成する。
      - プログラムの振る舞いを変えずに，内部構造を改善する。
    a: イ
    exp: |
      リバースエンジニアリングは、既存のソフトウェアのソースコードやオブジェクトコードを解析して、仕様や設計情報（関数の呼出し関係を表すコールグラフなど）を明らかにすることです。ドキュメントが失われたシステムの保守や、互換性のある製品の開発などに利用されます。通常の開発の流れ（仕様 → 設計 → プログラム）を逆にたどる点が名前の由来で、通常の流れはフォワードエンジニアリングと呼ばれます。
    why:
      - これはプロトタイピングの説明です。
      - 正解です。プログラムを解析して仕様や設計を導き出します。
      - これは通常の開発の流れであるフォワードエンジニアリングの説明です。
      - これはリファクタリングの説明です。
    know: ソフトウェアのリバースエンジニアリングは、利用許諾契約で禁止されている場合があり、その場合は契約違反となるおそれがあります。
    terms:
      - リバースエンジニアリング
      - リファクタリング
  - id: A13-026
    topic: 13-1-1-7
    diff: 1
    q: マッシュアップの説明として，適切なものはどれか。
    c:
      - 複数の Web サービスなどが公開している API を組み合わせて，新しいサービスを作り出す。
      - 1台のサーバ上で複数の OS を同時に動作させる。
      - 大量のデータから統計的手法を用いて有用な規則性を見つけ出す。
      - 既存のシステムの画面をそのまま残して，内部の処理だけを作り直す。
    a: ア
    exp: |
      マッシュアップは、複数の Web サービスやサイトが提供している API（地図情報、天気情報、検索など）を組み合わせて、新しいサービスを作り出す開発手法です。既存のサービスを部品のように利用するため、短期間・低コストで開発できます。例えば、地図サービスの API と店舗情報を組み合わせて、店舗の位置を地図上に表示するサービスを作ることができます。
    why:
      - 正解です。複数の API を組み合わせて新しいサービスを作ります。
      - これはサーバの仮想化の説明です。
      - これはデータマイニングの説明です。
      - これはマッシュアップではなく、システムの再構築（リエンジニアリング）の一形態です。
    terms:
      - マッシュアップ
      - API
  - id: A13-027
