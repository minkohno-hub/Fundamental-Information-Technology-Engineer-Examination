  - id: A13-028
    topic: 13-1-3
    diff: 2
    q: ソフトウェア開発における形式手法の説明として，適切なものはどれか。
    c:
      - 数学的な基礎をもつ形式仕様記述言語で仕様を記述し，その正しさを論理的に検証する。
      - 開発の各工程で作成する文書の様式を決められた書式に統一する。
      - 経験の豊富な技術者が，過去の経験に基づいて設計の良し悪しを判断する。
      - 利用者へのインタビューやアンケートで要求を収集する。
    a: ア
    exp: |
      形式手法は、集合論や論理学などの数学的な基礎をもつ形式仕様記述言語（VDM、Z、B メソッドなど）を用いて仕様を厳密に記述し、仕様の矛盾や誤りを証明やモデル検査などで論理的に検証する手法です。あいまいさのない仕様を作成できるため、鉄道や航空、IC カードなど高い信頼性が求められる分野で利用されています。VDM の記述を支援するツールとして VDMTools があります。
    why:
      - 正解です。数学的な言語で仕様を記述し、論理的に検証します。
      - 「形式」は文書の様式のことではなく、数学的に厳密な記述を意味します。
      - 経験に基づく判断は、数学的・論理的に検証する形式手法とは対照的です。
      - これは要求の収集（ヒアリングなど）の手法の説明です。
    terms:
      - 形式手法
  - id: A13-029
    topic: 13-1-4-1
    diff: 2
    q: 共通フレーム（SLCP-JCF）の目的として，適切なものはどれか。
    c:
      - 開発組織のプロセスの成熟度を5段階で評価し，認証を与える。
      - ソフトウェアの構想から開発，運用，保守，廃棄に至るまでのライフサイクルで必要な作業項目や用語を定義し，取得者と供給者などの関係者が同じ言葉で話せるようにする。
      - システム開発の見積り金額を，作業項目ごとに定められた単価で自動的に算出する。
      - 開発に用いるプログラム言語とツールを1つに統一し，その使用を義務付ける。
    a: イ
    exp: |
      共通フレーム（SLCP-JCF：Software Life Cycle Process - Japan Common Frame）は、ソフトウェアライフサイクルプロセスの国際規格 ISO/IEC 12207（JIS X 0160）を基に、情報システムの企画、要件定義、開発、運用、保守、廃棄までに必要な作業項目（プロセス、アクティビティ、タスク）とその内容を定義した枠組みです。発注者（取得者）と受注者（供給者）などの関係者が「同じ言葉」で話せるようにし、取引の誤解やトラブルを防ぐことが目的です。IPA の「共通フレーム 2013」は ISO/IEC 12207:2008（JIS X 0160:2012）に整合した版で、IPA は 2021 年に、ISO/IEC/IEEE 12207:2017（JIS X 0160:2021）に合わせた改訂は行わないとしています。
    why:
      - プロセスの成熟度を段階で評価するのは CMMI です。
      - 正解です。作業項目と用語を共通化し、関係者の共通の物差しにします。
      - 共通フレームは見積り金額を算出する仕組みではありません。
      - 共通フレームは特定の開発言語やツール、開発モデルを規定するものではありません。
    terms:
      - 共通フレーム
      - JIS X 0160
      - CMMI
  - id: A13-030
    topic: 13-1-4-2
    diff: 2
    q: CMMI の説明として，適切なものはどれか。
    c:
      - ソフトウェアの品質特性を，機能適合性や使用性などの特性に分類した品質モデルである。
      - ソフトウェアを構成するコンポーネントの一覧を記述した文書である。
      - 開発組織のプロセスの成熟度を5段階のレベルで捉え，プロセス改善を進めるための指針となるモデルである。
      - IT サービスマネジメントのベストプラクティスをまとめたフレームワークである。
    a: ウ
    exp: |
      CMMI（Capability Maturity Model Integration：能力成熟度モデル統合）は、ソフトウェアやシステムを開発する組織のプロセスの成熟度を評価し、改善の道筋を示すモデルです。段階表現では、成熟度を レベル1（初期）、レベル2（管理された）、レベル3（定義された）、レベル4（定量的に管理された）、レベル5（最適化している）の5段階で表します。
    why:
      - これは JIS X 25010 などの品質モデルの説明です。
      - これは SBOM の説明です。
      - 正解です。プロセスの成熟度を5段階で捉えるモデルです。
      - これは ITIL の説明です。
    terms:
      - CMMI
      - SBOM
  - id: A13-031
    topic: 13-1-4-2
    diff: 3
    q: CMMI の段階表現における成熟度レベルのうち，組織の標準プロセスが確立され，各プロジェクトがそれを基にテーラリングしたプロセスを用いている状態はどれか。
    c:
      - レベル2（管理された）
      - レベル5（最適化している）
      - レベル3（定義された）
      - レベル1（初期）
    a: ウ
    exp: |
      CMMI の成熟度レベルの概要は次のとおりです。
      - レベル1（初期）：プロセスが場当たり的で、成功は個人の能力に依存する
      - レベル2（管理された）：プロジェクト単位で要件、計画、進捗などが管理されている
      - レベル3（定義された）：組織の標準プロセスが確立され、各プロジェクトはそれをテーラリングして使う
      - レベル4（定量的に管理された）：プロセスの実績が定量的に測定され、統計的に管理されている
      - レベル5（最適化している）：定量的な理解に基づき、プロセスを継続的に改善している
    why:
      - レベル2は、プロジェクト単位で管理されている段階で、組織の標準プロセスはまだ確立していません。
      - レベル5は、定量的な理解に基づいてプロセスを継続的に改善している状態です。
      - 正解です。組織の標準プロセスをテーラリングして使うのはレベル3です。
      - レベル1は、プロセスが場当たり的で個人の能力に依存する状態です。
    terms:
      - CMMI
      - テーラリング
  - id: A13-032
    topic: 13-2-1
    diff: 2
    q: A 社は B 社にプログラムの開発を請負契約で委託した。契約で著作権の帰属について何も定めていない場合，完成したプログラムの著作権の帰属先として，適切なものはどれか。
    c:
      - 実際にプログラムを作成した B 社に帰属する。
      - 著作権は発生せず，誰でも自由に利用できる。
      - 開発費用を支払った A 社に帰属する。
      - A 社と B 社の共有となる。
    a: ア
    exp: |
      請負契約で開発されたプログラムの著作権は、契約で特に定めがなければ、実際に創作した側（受託者である B 社。社員が職務上作成した場合は職務著作として B 社）に帰属します。費用を支払ったことだけでは、発注者に著作権は移りません。発注者が著作権を得たい場合は、契約書で著作権の譲渡を定めておく必要があります。
    why:
      - 正解です。契約の定めがなければ、創作した受託者に帰属します。
      - プログラムは著作物であり、創作した時点で著作権が発生します。
      - 開発費用を支払っても、契約で譲渡を定めない限り著作権は移転しません。
      - 契約で定めない限り、共有にはなりません。
    know: 労働者派遣の場合は、派遣先の指揮命令の下で作成したプログラムについて、派遣先の職務著作と扱われる場合があります。実際の帰属は契約や就業の実態によって異なるため、契約で著作権の帰属を明確にしておくことが重要です。
    terms:
      - 職務著作
      - 請負契約
  - id: A13-033
    topic: 13-2-1
    diff: 2
    q: 著作権法による保護の対象となるものはどれか。
    c:
      - プログラムを作成するためのプログラム言語そのもの
      - プログラムで用いるアルゴリズム（解法）
      - プログラムで用いる通信プロトコル（規約）
      - プログラムを記述したソースコード
    a: エ
    exp: |
      著作権法では、プログラムは著作物として保護されます（著作権法10条1項9号）。ソースコードやオブジェクトコードは、表現として保護の対象になります。一方、同法10条3項は、プログラムの著作物の保護は、その作成に用いるプログラム言語、規約、解法には及ばないと定めています。アイデアそのものではなく、具体的な表現を保護するのが著作権の考え方です。
    why:
      - 著作権法は、プログラム言語を保護の対象としないと定めています。
      - 著作権法は、解法（アルゴリズム）を保護の対象としないと定めています。
      - 著作権法は、規約（プロトコル）を保護の対象としないと定めています。
      - 正解です。ソースコードはプログラムの表現として保護されます。
    terms:
      - 職務著作
  - id: A13-034
    topic: 13-2-1
    diff: 2
    q: 会社の従業員が職務上作成したプログラムが職務著作となる場合の説明として，適切なものはどれか。
    c:
      - 法人の発意に基づいて従業員が職務上作成し，契約や就業規則などに別段の定めがなければ，プログラムの著作者は法人となる。プログラムの場合は法人名義で公表されることを要件としない。
      - プログラムを作成した従業員が著作者となり，法人は利用許諾を受けて使用する。
      - 職務著作は特許庁に登録した場合にだけ認められる。
      - 法人名義で公表されたプログラムに限り，職務著作として法人が著作者となる。
    a: ア
    exp: |
      著作権法15条の職務著作（法人著作）の規定では、法人等の発意に基づき、その業務に従事する者が職務上作成する著作物で、法人等が自己の名義で公表するものは、作成時の契約や勤務規則に別段の定めがない限り、その法人等が著作者となります（1項）。ただしプログラムの著作物については、法人名義で公表されること（公表要件）は必要なく、発意と職務上の作成の要件を満たせば足ります（2項）。社内でだけ使うプログラムも職務著作になり得ます。
    why:
      - 正解です。別段の定めがなければ法人が著作者となり、プログラムは公表要件が不要です。
      - 職務著作の要件を満たす場合は、作成した従業員ではなく法人が著作者になります。
      - 著作権は登録なしに発生し、職務著作も特許庁への登録を要件としません。
      - プログラムの職務著作では、法人名義での公表は要件ではありません。
    terms:
      - 職務著作
  - id: A13-035
    topic: 13-2-2
    diff: 3
    q: 特許権の実施権に関する説明として，適切なものはどれか。
    c:
      - 通常実施権を許諾された者は，その特許発明を独占的に実施でき，他者の実施を差し止めることができる。
      - 専用実施権を設定すると，設定した範囲内では特許権者自身も特許発明を実施できなくなる。
      - 通常実施権は，同じ範囲について1社にしか許諾できない。
      - 専用実施権は，当事者の契約だけで効力が生じ，特許庁への登録は必要ない。
    a: イ
    exp: |
      特許の実施権には次の2種類があります。
      - 専用実施権（特許法77条）：設定した範囲内で特許発明を独占的に実施できる権利。設定した範囲内では特許権者自身も実施できなくなる（68条ただし書）。特許庁への登録が効力発生の要件（98条）
      - 通常実施権（78条）：特許発明を実施できる権利だが独占的ではない。同じ範囲について複数の者に許諾でき、効力の発生に登録は不要（登録がなくても、特許権を取得した者などに対抗できる。99条）
    why:
      - 独占的に実施して差止めを請求できるのは専用実施権者であり、通常実施権者にはその権利はありません。
      - 正解です。専用実施権の設定範囲では特許権者も実施できません。
      - 通常実施権は独占的ではないため、同じ範囲で複数の者に許諾できます。
      - 専用実施権は、特許庁に登録しなければ効力が生じません。
    terms:
      - 実施権
      - ライセンサー
      - ライセンシー
  - id: A13-036
    topic: 13-2-3
    diff: 1
    q: ソフトウェアのライセンス契約における，ライセンサーとライセンシーの説明として，適切なものはどれか。
    c:
      - ライセンサーとライセンシーは，どちらもライセンス料を受け取る者である。
      - ライセンサーはソフトウェアを販売する小売店であり，ライセンシーはソフトウェアの開発者である。
      - ライセンサーは使用の許諾を受ける者であり，ライセンシーは使用を許諾する権利者である。
      - ライセンサーは使用を許諾する権利者であり，ライセンシーは使用の許諾を受ける者である。
    a: エ
    exp: |
      ライセンス契約では、著作権や特許権などの権利をもち、その使用（利用・実施）を許諾する側をライセンサー（許諾者）、許諾を受けて使用する側をライセンシー（被許諾者）といいます。通常、ライセンシーがライセンサーにライセンス料（使用料）を支払います。
    why:
      - 通常、ライセンス料はライセンシーが支払い、ライセンサーが受け取ります。
      - 小売店や開発者という区別ではなく、許諾する側と受ける側の区別です。
      - ライセンサーとライセンシーの説明が逆です。
      - 正解です。許諾する側がライセンサー、受ける側がライセンシーです。
    terms:
      - ライセンサー
      - ライセンシー
  - id: A13-037
    topic: 13-2-4
    diff: 2
    q: 技術的保護の手段の説明のうち，アクティベーションに当たるものはどれか。
    c:
      - 音楽や映像などのデジタルコンテンツの利用や複製を，暗号化などの技術で制御し，著作権を保護する技術の総称である。
      - デジタル放送の番組を記録型 DVD などに録画する際に，1回だけ録画できるようにするなどのコピー制御を行う。
      - ビデオテープや DVD などの媒体に信号を加え，複製を行えないようにする。
      - ソフトウェアのインストール後に，ライセンス情報と機器の情報などをメーカーに送信して認証を受け，認証されるまでは使用を制限することで，不正な使用を防ぐ。
    a: エ
    exp: |
      主な技術的保護の手段は次のとおりです。
      - アクティベーション：ソフトウェアのライセンス情報（プロダクトキーなど）と機器の情報をメーカーに送って認証を受ける仕組み。1つのライセンスを複数の機器で使う不正な使用を防ぐ
      - CPRM：記録型 DVD などの記録メディア向けの著作権保護技術。デジタル放送の録画で「1回だけ録画可能」などのコピー制御に使われる
      - DRM：デジタルコンテンツの著作権を保護し、利用や複製を制御する技術の総称
      - コピーガード：媒体の複製を防止する技術の総称
    why:
      - これは DRM（デジタル著作権管理）の説明です。
      - これは CPRM の説明です。
      - これはコピーガードの説明です。
      - 正解です。ライセンス情報で認証を受け、不正な使用を防ぎます。
    terms:
      - アクティベーション
      - CPRM
      - DRM
      - コピーガード
  - id: A13-038
    topic: 13-3-1
    diff: 1
    q: システム開発で用いるステージング環境の説明として，適切なものはどれか。
    c:
      - 本番環境とほぼ同じ構成で用意し，リリース前に本番に近い条件で最終的な動作確認を行うための環境
      - 利用者が実際の業務でシステムを使用している環境
      - 開発者が個人の端末上でプログラムを作成し，単体テストを行うための環境
      - 障害に備えて，本番環境のデータを遠隔地に複製して保管しておくための環境
    a: ア
    exp: |
      システム開発では、目的に応じて次のような環境を使い分けます。
      - 開発環境：開発者がプログラムの作成や単体テストを行う
      - テスト環境：結合テストやシステムテストを行う
      - ステージング環境：本番環境とほぼ同じ構成で、リリース前の最終確認（性能や運用手順の確認など）を行う
      - 本番環境：利用者が実際の業務で使用する
    why:
      - 正解です。本番に近い条件でリリース前の最終確認を行う環境です。
      - これは本番環境の説明です。
      - これは開発環境の説明です。
      - これはバックアップサイトなどの災害対策の説明です。
    terms:
      - ステージング環境
  - id: A13-039
    topic: 13-3-2-2
    diff: 2
    q: 開発環境における設計データ管理で，設計書やソースコードなどをリポジトリで一元管理する目的として，最も適切なものはどれか。
    c:
      - 更新履歴やアクセス権を管理し，必要なデータを検索できるようにして，関係者が最新で正しいデータを共有できるようにする。
      - プログラムの実行速度を向上させるため，ソースコードを機械語に変換する。
      - データを開発者ごとの端末に分散して保存し，他の開発者が参照できないようにする。
      - 設計データを紙に印刷して保管することで，電子データを不要にする。
    a: ア
    exp: |
      リポジトリは、設計書、ソースコード、テストデータなどの開発に関する情報を一元的に格納するデータベース（保管場所）です。更新履歴の管理、アクセス権の管理、検索の機能をもち、関係者が最新で正しい情報を共有でき、誤った版のデータを使うことを防げます。
    why:
      - 正解です。履歴・アクセス権を管理し、正しいデータを共有します。
      - ソースコードを機械語に変換するのはコンパイラの役割です。
      - 端末ごとに分散して保存すると、一元管理ができず、最新の版が分からなくなります。
      - 紙での保管は検索や履歴の管理が難しく、リポジトリによる一元管理の目的とは異なります。
    terms:
      - リポジトリ
      - バージョン管理
  - id: A13-040
    topic: 13-3-2-4
    diff: 2
    q: 開発環境で使用するソフトウェアのライセンス管理として，適切なものはどれか。
    c:
      - インストールの記録は残さず，問題が起きたときに調べる。
      - 開発環境での使用は，ライセンス契約の条件にかかわらず自由に複製してよい。
      - 保有するライセンスの数と，実際にインストールされているソフトウェアの数やバージョンを定期的に棚卸して照合する。
      - ライセンスを1つ購入すれば，開発チームの全員の端末にインストールしてよい。
    a: ウ
    exp: |
      ライセンス管理では、購入したライセンスの数や契約条件と、実際に端末にインストールされているソフトウェアの種類・数・バージョンを台帳で管理し、定期的に棚卸して照合します。これにより、ライセンス数を超えた不正コピーによる契約違反や著作権侵害を防ぐとともに、余っているライセンスを有効に活用できます。
    why:
      - 記録を残さないと使用状況を把握できず、不正コピーを防げません。
      - 開発環境での使用でも、ライセンス契約の条件に従う必要があります。
      - 正解です。保有数と使用数を定期的に棚卸して照合します。
      - 契約で許された数を超えてインストールすると、不正コピーとなります。
    terms:
      - ライセンス管理（開発環境）
      - バージョン管理
  - id: A13-041
    topic: 13-4-1
    diff: 2
    q: ソフトウェア構成管理の説明として，適切なものはどれか。
    c:
      - ソースコードや文書などのソフトウェア構成品目を識別し，その変更を管理して，各版の構成と状態を記録することで，構成品目の完全性を保つ。
      - プログラムの処理を構成するモジュールの強度と結合度を評価する。
      - ネットワーク機器の接続構成を図にまとめて管理する。
      - プロジェクトの要員の構成を決め，各要員に作業を割り当てる。
    a: ア
    exp: |
      ソフトウェア構成管理は、開発や保守の対象となるソースコード、設計書、テスト仕様書などのソフトウェア構成品目を識別し（構成識別）、ベースラインを定めてその変更を管理し（構成制御、変更管理）、各構成品目の版や状態を記録・報告し（構成状況の記録）、正しさを確認する（構成監査）活動です。どの版の構成品目を組み合わせると、どの版のソフトウェアになるかを常に正しく把握できるようにし、一貫性・正確性（完全性）を保証します。
    why:
      - 正解です。構成品目を識別し、変更と状態を管理して完全性を保ちます。
      - これはモジュール設計の評価の説明です。
      - これはネットワークの構成管理の説明であり、ソフトウェア構成管理とは対象が異なります。
      - これはプロジェクトの資源（要員）管理の説明です。
    terms:
      - 構成管理（ソフトウェア）
      - ベースライン
  - id: A13-042
    topic: 13-4-1
    diff: 2
    q: SBOM（Software Bill of Materials）を作成・管理する主な目的として，適切なものはどれか。
    c:
      - ソフトウェアの開発に必要な費用を部品ごとに見積もり，予算を確定させる。
      - ソフトウェアに含まれる OSS などのコンポーネントとその版やライセンスを把握し，脆弱性が見つかったときの影響範囲の特定やライセンス管理に役立てる。
      - ソフトウェアの利用者に，操作方法を説明する。
      - ソフトウェアを構成するプログラムの処理時間を計測し，性能を改善する。
    a: イ
    exp: |
      SBOM（ソフトウェア部品表）は、ソフトウェアを構成するコンポーネント（自社開発の部品や OSS のライブラリなど）について、名称、版（バージョン）、供給者、ライセンス、依存関係などを一覧にしたものです。構成管理の一環として作成・管理し、使用している部品に脆弱性が公表されたときに影響を受ける製品を素早く特定したり、ライセンス違反を防いだりするために活用します。
    why:
      - SBOM は費用の見積書ではなく、ソフトウェアの構成部品の一覧です。
      - 正解です。構成部品を把握して、脆弱性の影響範囲の特定やライセンス管理に使います。
      - 操作方法を説明するのは利用者マニュアルです。
      - 処理時間の計測はプロファイリングなどの性能分析の作業です。
    terms:
      - SBOM
      - OSS
      - 構成管理（ソフトウェア）
  - id: A13-043
    topic:
      - 13-4-2-1
      - 13-4-2-2
    diff: 2
    q: ソフトウェアの変更管理の手順として，適切なものはどれか。
    c:
      - 変更要求はすべて受け付け，影響を分析せずに到着順に実施する。
      - 不具合を見つけた開発者が，承認を得ずに直接本番環境のプログラムを修正し，記録は残さない。
      - 変更要求を記録し，影響範囲や工数を分析したうえで承認を得てから変更を実施し，変更後の構成品目の版と状況を記録する。
      - 変更を行った後に，変更前の版はすべて削除する。
    a: ウ
    exp: |
      変更管理では、変更要求を受け付けて記録し、変更による影響の範囲・工数・リスクを分析して、変更の可否を承認者（変更管理委員会など）が判断します。承認された変更だけを実施し、テストで確認した後、変更後の構成品目の版や状況を記録します（構成状況の記録）。これにより、構成品目の一貫性・正確性を保ち、問題が起きたときに以前の版に戻すこともできます。
    why:
      - 影響を分析しないと、変更による副作用や優先度を判断できません。
      - 承認を得ない変更や記録のない変更は、構成の完全性を損ない、不具合の原因になります。
      - 正解です。記録・影響分析・承認・実施・記録の手順で管理します。
      - 変更前の版を削除すると、問題が起きたときに元に戻したり、変更の履歴を確認したりできません。
    terms:
      - 変更管理（ソフトウェア）
      - 構成管理（ソフトウェア）
  - id: A13-044
    topic: 13-4-2-3
    diff: 2
    q: ソフトウェアのリリース管理及び出荷に関する説明として，適切なものはどれか。
    c:
      - リリースのたびに版番号を付け直さず，常に同じ版番号で出荷する。
      - リリースの判断は担当の開発者が個人で行い，記録は残さない。
      - リリースするソフトウェアの版を識別して記録し，出荷した版の構成品目とその文書を，定められた保管期間にわたって再現できるように保管する。
      - リリースした後は，そのソースコードを保管せずに削除する。
    a: ウ
    exp: |
      リリース管理では、リリースするソフトウェアと文書を版（バージョン）で識別し、どの構成品目のどの版を組み合わせて出荷したかを記録します。また、出荷したソフトウェアとその文書のマスターコピーを、契約や規則で定めた保管期間にわたって保管し、保守や不具合調査の際に同じものを再現できるようにします。
    why:
      - 版番号を付けないと、利用者がどの版を使っているかを識別できません。
      - リリースは定められた手順と承認に基づいて行い、記録を残します。
      - 正解です。版を識別・記録し、保管期間にわたって再現可能に保管します。
      - ソースコードを削除すると、出荷後の保守や不具合の調査ができなくなります。
    terms:
      - リリース管理（ソフトウェア）
      - バージョン管理
  - id: A13-045
    topic: 13-3-2-3
    diff: 2
    q: 分散型のバージョン管理システムの特徴として，適切なものはどれか。
    c:
      - リポジトリは1台のサーバにだけ存在し，サーバに接続しないとコミットできない。
      - 同じファイルを複数の開発者が同時に変更することは，仕組み上いっさいできない。
      - ファイルの最新版だけを保存し，過去の版は保存しない。
      - 各開発者の手元にリポジトリの完全な複製をもつため，ネットワークに接続していなくても変更履歴の記録（コミット）や履歴の参照ができる。
    a: エ
    exp: |
      バージョン管理システムには、集中型と分散型があります。集中型（Subversion など）は、サーバ上の1つのリポジトリで履歴を管理するため、コミットにはサーバへの接続が必要です。分散型（Git など）は、各開発者が手元（ローカル）にリポジトリの完全な複製をもち、ローカルでコミットや履歴の参照を行い、必要に応じてリモートのリポジトリと同期（プッシュ、プル）します。
    why:
      - これは集中型のバージョン管理システムの特徴です。
      - 分散型では、各自が並行して変更し、後でマージ（統合）できます。
      - バージョン管理システムは過去の版を含めた変更履歴を保存します。
      - 正解です。手元にリポジトリの複製をもち、オフラインでもコミットできます。
    terms:
      - バージョン管理
      - リポジトリ
