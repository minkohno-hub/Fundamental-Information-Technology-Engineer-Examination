questions:
  - id: A22-047
    topic: 22-1-1-2
    diff: 2
    q: 株式会社の株主の責任に関する記述として，適切なものはどれか。
    c:
      - 株主は出資額を限度として責任を負い，会社の債務について出資額を超えて個人の財産で弁済する義務はない。
      - 株主は会社の債務について，無限に責任を負う。
      - 株主は会社の債務について，持株数にかかわらず均等に，個人の財産で連帯して責任を負う。
      - 株主は経営者として，会社の全ての業務を直接執行する義務を負う。
    a: ア
    exp: |
      株式会社では，出資者である株主は出資額を限度とする有限責任を負うにとどまり，会社の債務を個人の財産で弁済する義務はありません。また，所有（株主）と経営（取締役など）が分離しているため，株主が業務を直接執行する義務を負うこともありません。持分会社のうち合名会社の社員は無限責任を負う点が，株式会社と異なります。
    why:
      - 正解です。株主は出資額を限度とする有限責任です。
      - 無限責任は合名会社の社員などの責任であり，株式会社の株主は負いません。
      - 株主が個人の財産で連帯して責任を負うことはありません。
      - 業務の執行は取締役などが担い，株主に直接執行の義務はありません。
    terms: [株式会社, 持分会社, 有限責任]

  - id: A22-048
    topic: 22-1-2-1
    diff: 2
    q: 経営管理に PDCA サイクルを適用するとき，C（Check）に該当する活動はどれか。
    c:
      - 実績を計画値と比較し，差異が生じた原因を分析して評価する。
      - 経営目標を達成するための行動計画と予算を立てる。
      - 計画に従って、業務を実施する。
      - 評価の結果に基づいて，計画や業務の進め方を見直し，是正する。
    a: ア
    exp: |
      PDCA サイクルは，Plan（計画），Do（実行），Check（評価），Act（改善）を繰り返して，業務や経営の質を継続的に高める管理手法です。Check では，実績を計画と比較して差異とその原因を分析し，成果を評価します。計画の策定は Plan，実施は Do，評価結果に基づく見直しと是正は Act に当たります。
    why:
      - 正解です。実績と計画の比較，差異の原因分析と評価が Check です。
      - 目標達成のための計画と予算の策定は Plan です。
      - 計画に従った業務の実施は Do です。
      - 評価結果に基づく見直しや是正は Act です。
    terms: [PDCA, 経営目標]

  - id: A22-049
    topic: 22-1-4
    diff: 2
    q: SRI（Socially Responsible Investment：社会的責任投資）の説明として，適切なものはどれか。
    c:
      - 財務面の評価に加えて，環境保全，社会貢献，倫理的な経営といった社会的責任の遂行状況も考慮して，投資先の企業を選ぶ投資の手法
      - 投資先を短期間で頻繁に入れ替えて，値動きによる利益だけを狙う投資の手法
      - 国債だけに投資して，元本の保全を最優先する投資の手法
      - 投資先の経営には一切関与せず，財務指標が最も高い企業だけに投資する手法
    a: ア
    exp: |
      SRI は，企業の財務状況だけでなく，環境への配慮，人権や労働環境，地域社会への貢献，法令遵守などの社会的責任（CSR）の取組みも評価して投資先を選ぶ手法です。近年は ESG 投資として，環境（Environment），社会（Social），企業統治（Governance）の観点を重視する考え方に発展しています。企業側では，レピュテーションリスクへの対応としても社会的責任の遂行が重要になります。
    why:
      - 正解です。財務面に加え，環境・社会・倫理面の取組みも評価して投資します。
      - 短期の売買で値動きの利益だけを狙うのは，社会的責任とは関係のない投機的な手法です。
      - 国債への投資は安全性重視の運用で，投資先企業の社会的責任の評価とは無関係です。
      - 財務指標だけで選ぶ手法は，社会的責任を評価に含めないため SRI ではありません。
    terms: [SRI, CSR, レピュテーションリスク]

  - id: A22-050
    topic: 22-1-5-1
    diff: 3
    q: AI の大規模言語モデルにおけるスケーリング則の説明として，適切なものはどれか。
    c:
      - モデルのパラメタ数，学習データ量，学習に使う計算量を増やすと，モデルの性能（損失）が規則的に改善する傾向があるという経験則
      - 出力する文章の長さが長くなるほど，モデルの処理時間が必ず短くなるという法則
      - モデルのパラメタ数を増やすほど，学習データの量は少なくて済むという法則
      - 利用者数が増えるほど，モデルの使用料金が一定の割合で値上がりするという法則
    a: ア
    exp: |
      スケーリング則は，大規模言語モデルの性能（損失）が，パラメタ数，学習データ量，学習に使う計算量を増やすにつれて，べき乗則に従って規則的に改善するという経験的な関係です。この関係を使うと，大規模な学習を行う前に，必要な資源の規模と得られる性能を見積もれます。ただし，永久に性能が向上する保証はなく，データの質や学習方法も性能に影響します。
    why:
      - 正解です。パラメタ数，データ量，計算量の増加に伴って性能が規則的に改善する傾向を示す経験則です。
      - 出力が長くなれば一般に処理時間は増えます。スケーリング則とは関係がありません。
      - 一般にパラメタ数を増やす場合は，それに見合う学習データ量の増加も必要とされます。
      - 利用料金の変動に関する法則ではありません。
    terms: [スケーリング則, 大規模言語モデル]

  - id: A22-051
    topic: 22-2-1-3
    diff: 2
    q: 次の作業の先行関係と所要日数から，プロジェクト全体の最短所要日数（クリティカルパスの長さ）を求めたとき，正しいものはどれか。

      | 作業 | 先行作業 | 所要日数 |
      | --- | --- | --- |
      | A | なし | 3 |
      | B | A | 4 |
      | C | A | 2 |
      | D | B，C | 5 |
      | E | C | 6 |
      | F | D，E | 1 |
    c:
      - 13日
      - 12日
      - 11日
      - 21日
    a: ア
    exp: |
      日程計画では，開始から終了までの経路のうち，所要日数の合計が最も長い経路がクリティカルパスで，その長さがプロジェクト全体の最短所要日数です。経路は A-B-D-F が 3+4+5+1=13 日，A-C-D-F が 3+2+5+1=11 日，A-C-E-F が 3+2+6+1=12 日なので，最長の A-B-D-F の 13 日がクリティカルパスです。クリティカルパス上の作業が遅れると全体の納期が遅れます。
    why:
      - 正解です。最長経路 A-B-D-F の 3+4+5+1=13 日です。
      - 12 日は経路 A-C-E-F の合計であり，最長ではありません。
      - 11 日は経路 A-C-D-F の合計であり，最長ではありません。
      - 21 日は全作業の所要日数の合計です。並行して進められる作業があるため最短日数にはなりません。
    terms: [クリティカルパス, アローダイアグラム]
    verify: { value: '3+4+5+1' }

  - id: A22-052
    topic: 22-2-2-1
    diff: 2
    q: データ分析における 2 次データの例として，適切なものはどれか。
    c:
      - 官公庁が公表している統計データを，自社の市場分析に利用する。
      - 自社で顧客に対してアンケートを実施し，その回答を集計する。
      - 自社の実験設備で試験を行い，その測定値を記録する。
      - 自社の店舗で、来店客の動きを観察して記録する。
    a: ア
    exp: |
      1 次データは，分析の目的に合わせて自ら調査，実験，観察などによって新たに収集したデータです。2 次データは，他の者が別の目的で既に収集・公表しているデータを，分析に再利用するものです。官公庁の統計，業界団体の調査報告，企業の公開資料などが該当します。2 次データは低コストで入手できる反面，目的に完全に合わない場合があります。
    why:
      - 正解です。他者が既に収集した統計を再利用するので 2 次データです。
      - 自らアンケートを実施して収集するので 1 次データです。
      - 自ら実験して測定するので 1 次データです。
      - 自ら観察して記録するので 1 次データです。
    terms: [1次データ, 2次データ]

  - id: A22-053
    topic: 22-3-1-2
    diff: 2
    q: 複式簿記による企業会計の手順として，適切なものはどれか。
    c:
      - 取引を発生順に仕訳帳へ記録し，勘定科目ごとに総勘定元帳へ転記したうえで，決算を行って財務諸表を作成する。
      - 取引をまず総勘定元帳へ記録し，その後に仕訳帳へまとめて転記して，財務諸表を作成する。
      - 取引は仕訳帳へ記録せず，決算のときに財務諸表を直接作成する。
      - 財務諸表を先に作成し，その内容を後から仕訳帳に記録する。
    a: ア
    exp: |
      複式簿記では，取引が発生するたびに借方と貸方に分けて仕訳帳へ日付順に仕訳します。次に，仕訳を勘定科目ごとの総勘定元帳へ転記し，期末に試算表で借方と貸方の合計が一致することを確認し，決算整理を経て貸借対照表や損益計算書などの財務諸表を作成します。
    why:
      - 正解です。仕訳帳への仕訳，総勘定元帳への転記，決算，財務諸表の作成の順です。
      - 記帳の順序が逆です。先に仕訳帳へ仕訳し，それを総勘定元帳へ転記します。
      - 取引は発生ごとに仕訳帳へ記録します。記録なしに財務諸表は作れません。
      - 財務諸表は帳簿の記録を集計して作成するもので，先に作成することはありません。
    terms: [仕訳帳, 総勘定元帳]

  - id: A22-054
    topic: 22-3-4
    diff: 2
    q: 企業グループにおけるキャッシュマネジメントの目的として，最も適切なものはどれか。
    c:
      - グループ内の各社の資金を集中して管理し，余剰資金と不足資金を融通することで，資金の効率的な運用と外部借入の削減を図る。
      - 各社が独自に資金を管理し，グループ内での資金の融通は禁止する。
      - 資金の余剰が生じないように，余った資金は全て配当として分配する。
      - 売上債権の回収を遅らせて，手元の現金を減らす。
    a: ア
    exp: |
      キャッシュマネジメントは，企業が保有する現金や預金の動きを把握し，資金の過不足を調整して，資金を効率的に運用する管理手法です。企業グループでは，各社の資金を親会社などに集中させ（キャッシュマネジメントシステム），余剰のある会社から不足する会社へ融通することで，外部からの借入を減らし，資金の運用効率を高められます。
    why:
      - 正解です。資金を集中管理して融通し合うことで，運用の効率化と借入の削減ができます。
      - 資金の融通を禁止すると，余剰と不足が同時に発生しても調整できず，効率が悪くなります。
      - 余剰を全て配当に回すことは目的ではなく，必要な運転資金や投資を確保できなくなります。
      - 債権の回収を遅らせると，手元の資金がかえって不足します。回収は計画的に早める方向で管理します。
    terms: [キャッシュマネジメント, 資金計画]
