questions:
  - id: A14-510
    topic: 14-6-3
    diff: 3
    scope: 14-6-3 スケジュール短縮の技法。当初は直列だった作業を並行して行うファストトラッキングと、資源を追加するクラッシングの違いを、状況から判断する問題
    prereq: ファストトラッキングは作業の順序関係を変えて並行化し、手戻りのリスクを伴うこと、クラッシングは資源の追加で期間を詰め、コストが増えること
    hard: どちらの技法も期間は短くなるが、代償 （手戻りのリスクか、コストの増加か）が異なることを、状況の記述から切り分ける必要がある。
    q: |
      プロジェクトの完了が遅れる見通しとなった。当初は「設計が完了してから製造を開始する」計画であったが、設計の前半部分が確定した段階で、その部分の製造を先行して開始することにした。追加の要員や設備は投入していない。この短縮の進め方はどれに当たるか。
    c:
      - ファストトラッキング： 直列の作業を並行化して期間を詰める方法
      - クラッシング： 資源を追加投入して作業期間そのものを短くする方法
      - モンテカルロ法： 確率的なばらつきを加えて期間を見積もる方法
      - クリティカルチェーン法： 資源の競合を考慮してバッファで管理する方法
    a: ア
    exp: |
      この進め方はファストトラッキングです。本来は直列（設計の完了 → 製造の開始）だった作業の一部を並行して行うことで、全体の期間を詰めています。追加の資源は投入していない点も、クラッシングとの区別になります。ファストトラッキングの代償は、設計の後半の変更が先行した製造部分に及んだ場合の手戻りのリスクです。一方、クラッシングは要員などの資源を追加して作業期間そのものを短縮し、コストが増加します。
    why:
      - 正解です。順序関係を変えて並行化しており、資源の追加もないため、ファストトラッキングに当たります。
      - クラッシングは資源の追加投入が前提であり、本件では追加の要員や設備は使っていません。
      - モンテカルロ法は見積りの分析手法であり、期間を短縮する実行の方法ではありません。
      - クリティカルチェーン法は、資源の競合とバッファによる計画・管理の方法であり、作業の並行化そのものを指す名称ではありません。
    know: スケジュール短縮の代表的な技法は、ファストトラッキング （並行化、手戻りのリスク）とクラッシング （資源の追加、コストの増加）の2つ。状況の記述から「順序を変えたのか」「資源を足したのか」で切り分けることが要点である。
    terms: [ファストトラッキング, クラッシング]
    verify:
      manual: 状況の要素（直列作業の並行化、資源の追加なし）と各技法の定義を照合し、ファストトラッキングだけが一致すること、クラッシングは資源追加が必須で本件に当たらないことを確認した。

  - id: A14-511
    topic: 14-8-3
    diff: 2
    scope: 14-8-3 リスク対応戦略のうち転嫁。委託契約の違約金・損害賠償の条項によって、遅延による損失の負担を委託先に移す事例の分類。
    prereq: 転嫁は、リスクの影響（損失の負担）を契約などによって第三者に移す対応であり、発生確率そのものは下げないこと
    hard: 保険以外の移転の形（契約条項による負担の移転）を見抜く必要がある。委託先に任せること自体が転嫁なのではなく、損失の負担先を定める条項が転嫁の実体である点が問われる。
    q: |
      開発の一部を外部ベンダーに委託する契約で、納期遅延が発生した場合は、遅延による損失の一部をベンダー側が負担する旨の違約金と損害賠償の条項を定めた。このリスク対応戦略はどれか。
    c:
      - 転嫁
      - 回避
      - 軽減
      - 受容
    a: ア
    exp: |
      契約の条項によって損失の負担をベンダーという第三者に移す対応は、リスク対応戦略の「転嫁」に当たります。転嫁の代表例には、保険への加入のほか、本問のような違約金・損害賠償条項の設定があります。なお、転嫁によって遅延の発生確率そのものが下がるわけではありません。回避はリスクの原因となる活動自体をやめること、軽減は発生確率や影響度を下げる手当てをすること、受容は何もせず発生を受け入れることです。
    why:
      - 正解です。損失の負担を契約で第三者に移すことは、転嫁の代表的な形の一つです。
      - 回避は、リスクの源である活動を取りやめる対応であり、本件では委託そのものを続けています。
      - 軽減は、進捗管理の強化などで遅延の起きにくさや影響を下げる対応であり、条項による負担の移転は発生確率には作用しません。
      - 受容は、対策を取らずに発生を受け入れることであり、契約で負担の分担を定めた本件とは異なります。
    know: リスク対応の4戦略は、リスクにどう向き合うかで区別する。転嫁は「影響の宛先を変える」方法であり、保険だけでなく、契約条項による負担の移転も含まれる点が要点である。
    terms: [リスク対応, 転嫁]
    verify:
      manual: 対応の内容（契約条項による損失負担の移転）と4戦略の定義を照合し、転嫁だけが一致すること、委託の継続（回避でない）、発生確率への無作用（軽減でない）を確認した。
  - id: A14-512
    topic: 14-3-3
    diff: 3
    scope: 14-3-3 ステークホルダーの分析（権力・関心グリッド）。影響力と関心の高さの組合せから、重点的に管理すべき相手を判断する問題
    prereq: 影響力（権力）が大きく、プロジェクトへの関心も高いステークホルダーは、密接に連携して管理する対象になること
    hard: 4人のステークホルダーが、影響力と関心の組合せでそれぞれ異なる区分に入るため、2つの軸を同時に評価して、重点管理の対象を特定する必要がある。
    q: |
      プロジェクトのステークホルダーを、影響力と関心の高さで分類した。重点的に管理し、密接に連携すべき対象はどれか。

      - 役員 P： 影響力は大きいが、このプロジェクトへの関心は低い
      - 部門長 Q： 影響力は大きく、進捗への関心も高い
      - 利用部門の担当者 R： 影響力は小さいが、関心は高い
      - 取引先の窓口 S： 影響力も関心も小さい
    c:
      - 部門長 Q
      - 役員 P
      - 利用部門の担当者 R
      - 取引先の窓口 S
    a: ア
    exp: |
      権力・関心グリッドでは、影響力（権力）と関心の両方が高いステークホルダーが、最も重点的に管理する対象になります。プロジェクトの成否を左右する力を持ち、かつ関心が高いため、期待のずれが起きないよう密接に連携します。部門長 Q がこれに当たります。役員 P は影響力は大きいが関心は低いため、満足度を保ちつつ効率的に接する対象です。担当者 R は情報提供を続ける対象、窓口 S は最小限の監視の対象です。
    why:
      - 正解です。影響力と関心の両方が高く、重点管理の対象です。
      - 影響力は大きいものの関心は低く、密接な連携よりも、満足度を損なわない効率的な関わり方が求められる対象です。
      - 関心は高いものの影響力は小さく、情報提供を通じて協力関係を保つ対象です。
      - 影響力も関心も小さく、対応の優先度は最も低くなります。
    know: ステークホルダー管理は、全員に同じ労力をかけるのではなく、影響力と関心の組合せで関わり方を変える。両方高い相手が重点管理という原則が、グリッド分析の要点である。
    terms: [ステークホルダー, 権力・関心グリッド]
    verify:
      manual: 4人を影響力と関心の2軸で分類し、両方高い区分に入るのが部門長 Q だけであること、各区分の関わり方（重点管理、満足度の維持、情報提供、監視）を確認した。

  - id: A14-513
    topic: 14-4-3
    diff: 3
    scope: 14-4-3 WBS とスコープ管理。プロジェクトの成果物に必要な作業の追加が、承認手続きを経ずに行われるスコープクリープの問題を判断する問題
    prereq: WBS は成果物を漏れなく作業に分解したものであり、含まれていない作業の追加は、変更管理を通して影響を評価してから行うこと
    hard: 追加の作業自体は一見有益でも、手続きを経ない追加は、期間とコストへの影響が評価されないまま全体を圧迫する （スコープクリープ）という問題の構造を見抜く必要がある。
    q: |
      開発プロジェクトの終盤、利用部門から「ついでにこの集計機能も入れてほしい」と依頼された。プロジェクトマネージャに相談せず、担当者が善意でその機能の開発を始めたところ、他の作業に遅れが出始めた。この状況の問題点として、最も適切なものはどれか。
    c:
      - スコープの変更が、影響の評価と承認の手続きを経ずに行われており、スコープクリープが起きている
      - 集計機能の品質が低いことが、遅れの直接の原因である
      - 担当者の開発速度が遅いことが、遅れの原因である
      - 利用部門が機能を依頼したこと自体が、契約違反である
    a: ア
    exp: |
      問題は、スコープ （作業の範囲）の変更が手続きを経ていないことです。成果物に必要な作業は WBS で管理され、作業の追加は、期間・コスト・品質への影響を評価し、承認を受けてから基準 （ベースライン）に反映します。この手続きを省いた追加は「スコープクリープ」と呼ばれ、少しずつの追加が積み重なって全体の遅れやコスト超過を招きます。機能の良し悪しや担当者の速度ではなく、管理の手続きの問題として捉えることが要点です。
    why:
      - 正解です。未承認のスコープ追加による全体への影響の広がりが、スコープクリープの問題です。
      - 品質の話は本件には示されておらず、遅れの構造的な原因でもありません。
      - 担当者の速度ではなく、計画外の作業が割り込んだことが遅れの原因です。
      - 利用部門が要望を出すこと自体は通常の行為であり、問題は要望を受けた側の手続きの省略にあります。
    know: スコープ管理の要点は「追加を禁止すること」ではなく「追加の影響を評価し、承認してから計画に織り込むこと」。手続きを経ない小さな追加の蓄積がスコープクリープであり、大規模な遅延の典型的な原因になる。
    terms: [WBS, スコープクリープ, スコープ]
    verify:
      manual: 状況の要素（未承認の作業追加、他作業への遅れの波及）と各選択肢を照合し、スコープ変更の手続きの省略という管理上の問題が本件の本質であることを確認した。

  - id: A14-514
    topic: 14-9-3
    diff: 3
    scope: 14-9-3 管理図による工程の異常判定。中心線の同じ側に測定値が連続して並ぶ「連（ラン）」のルールから、偶然では説明しにくい偏りを判断する問題
    prereq: 管理限界の内側にあっても、点の並び方に規則性（片側への連続など）がある場合は、工程に異常な要因が入り込んだ兆候と判断すること
    hard: 全ての点が管理限界内であることだけを見ると「正常」としてしまうが、並び方のルール （同じ側に 7 点連続）を適用して異常の兆候を読み取る必要がある。
    q: |
      部品の寸法を管理図で監視している。最近の測定値は全て管理上限と管理下限の内側にあるが、中心線より上の側に 7 点連続して並んでいる。この状況の判断として、最も適切なものはどれか。
    c:
      - 点が全て管理限界内でも、中心線の片側に連続して並ぶ偏りは工程の異常の兆候であり、要因を調査すべきである
      - 点が全て管理限界内にあるため、工程は安定しており、対応は不要である
      - 中心線より上に並ぶのは、寸法が大きい側であるため、品質が向上している証拠である
      - 測定の回数が不足しているため、判断は次回の測定まで保留すべきである
    a: ア
    exp: |
      管理図では、管理限界を超えた点があるかどうかだけでなく、点の並び方の規則性も異常の判定に使います。中心線の同じ側に点が連続して並ぶ状態は「連（ラン）」と呼ばれ、例えば 7 点連続すると、偶然に片側へ偏る確率は小さく、工程の平均そのものがずれてきている兆候と判断します。限界内であっても、要因（工具の摩耗、材料の変化など）の調査を始めるべき状況です。
    why:
      - 正解です。並び方の偏りは、管理限界内でも異常の兆候として扱います。
      - 限界内かどうかは判定の一部にすぎず、並び方の規則性を無視すると、ずれの進行を見逃します。
      - 中心線からのずれは、寸法の大小によらず工程の変化を示すものであり、「大きい側だから良い」という評価はできません。
      - 7 点の連続という情報は既に判断に十分であり、保留は対応を遅らせます。
    know: 管理図の異常判定には、限界の超過だけでなく、連（片側への連続）や傾向（連続した上昇・下降）といった並び方のルールがある。工程の「ずれ始め」を早期に捉えることが、管理図の使い方の要点である。
    terms: [管理図, 品質管理]
    verify:
      manual: 管理図の異常判定ルール（限界超過のほか、中心線の片側への 7 点連続＝連）を本件に適用し、限界内でも要因調査が必要な異常の兆候に当たることを確認した。

  - id: A14-515
    topic: 14-10-3
    diff: 3
    scope: 14-10-3 調達の契約タイプ。成果物の仕様が固まっている場合の定額請負契約と、実費にフィーを加える契約とで、コスト超過のリスクを負う側が異なることの判断
    prereq: 定額請負では受注側がコスト超過のリスクを負い、実費精算型では発注側が実際の費用を負担するためリスクを負うこと
    hard: 仕様の確定度が高いという状況と、リスクをどちらに置きたいかという目的を、契約タイプの性質と結び付けて選ぶ必要がある。
    q: |
      成果物の仕様が詳細に確定しているシステム開発を外部に委託する。発注側は、開発コストが当初の見込みを超えた場合の負担を、できるだけ受注側に負わせたい。この目的に合う契約タイプはどれか。
    c:
      - 定額請負契約： 金額を固定し、実際のコストが増えても受注側が負担する
      - 実費精算プラスフィー契約： 実際にかかった費用に報酬を加えて支払う
      - 単価契約： 作業者の単価だけを決め、実績の作業量に応じて支払う
      - 出来高払い契約： 進捗の割合に応じて見積額の一部ずつを支払う
    a: ア
    exp: |
      定額請負契約では、契約金額が固定されるため、実際のコストが見込みを超えても、その超過分は受注側の負担になります。仕様が確定している場合は、受注側も金額を見積もりやすく、この方式が機能します。一方、実費精算プラスフィー契約では、発注側が実際のコストを負担するため、コスト超過のリスクは発注側に残ります。仕様が不確定で変更が多い場合は実費型が選ばれることもありますが、本件の目的（超過を受注側に負わせる）には定額請負が合います。
    why:
      - 正解です。金額が固定されるため、超過のリスクは受注側に移ります。
      - 実費精算型は、実際のコストを発注側が支払う仕組みであり、リスクは発注側に残ります。
      - 単価契約は作業量に応じて支払額が変わるため、コスト超過の負担を固定できません。
      - 出来高払いは支払の時期の取り決めであり、最終的な負担の配分を定額請負のように固定するものではありません。
    know: 契約タイプの選択は、コストリスクを発注側と受注側のどちらが負うかという配分の問題。仕様の確定度が高いほど定額型が機能し、不確定なほど実費型が現実的になる、という対応関係が要点である。
    terms: [調達, 契約]
    verify:
      manual: 各契約タイプについてコスト超過時の負担者を照合し、定額請負だけが受注側負担になること、本件の状況 （仕様が確定）と目的 （超過を受注側へ）に一致することを確認した。

  - id: A14-516
    topic: 14-11-3
    diff: 2
    scope: 14-11-3 コミュニケーション経路数の逆算。経路の総数からメンバー数を求める問題であり、経路数の式を逆向きに使う解法である。
    prereq: メンバー全員が相互に情報伝達を行う場合の経路数は n (n － 1) ÷ 2 で求められること
    hard: 総数から人数を逆算するため、式への当てはめと検算が必要になる。経路数は2次式で増えるため、総数と人数は比例しない点も含まれる。
    q: |
      あるプロジェクトでは、メンバー全員が相互に情報伝達を行っており、コミュニケーションの経路（チャネル）の総数が 45 本である。メンバーは何人か。
    c: ['8', '9', '10', '12']
    a: ウ
    exp: |
      経路の数は n (n － 1) ÷ 2 で求めます。総数が 45 本になる人数を探すと、n ＝ 10 のとき 10 × 9 ÷ 2 ＝ 45 本となり一致します（n ＝ 9 では 36 本、n ＝ 8 では 28 本で、いずれも 45 本にはなりません）。人数に対して経路は2次式で増えるため、総数から人数を逆算するときは、当てはめて検算する進め方が確実です。
    why:
      - 8 人のときの経路数は 28 本であり、45 本にはなりません。
      - 9 人のときの経路数は 36 本であり、45 本にはなりません。
      - 正解です。10 × 9 ÷ 2 ＝ 45 本で、総数と一致します。
      - 12 人のときの経路数は 66 本であり、45 本を超えてしまいます。
    know: コミュニケーション経路は n (n － 1) ÷ 2 で増え、人数に対して2次式で膨らむ。総数から人数を逆算する場面でも、同じ式を逆向きに使うことが要点である。
    terms: [コミュニケーション, ステークホルダー]
    verify: { type: value, value: 10 }
  - id: A14-517
    topic: 14-5-3
    diff: 3
    scope: 14-5-3 責任分担マトリクス （RACI）。作業の実行責任と、最終的な説明責任が異なる役割であることの判断
    prereq: RACI では、実行する者 （Responsible）と最終責任を負う者 （Accountable）は別の役割として定義され、説明責任者は作業ごとに 1 人に定めること
    hard: 日常の言葉では「責任者」が両方の意味で使われるため、作業をする責任と、結果に答える責任を区別して読み取る必要がある。
    q: |
      責任分担マトリクス（RACI）で、ある作業について「その作業を実際に遂行する役割」と「その作業の結果について最終的に責任を負い、承認する役割」を表す記号の組合せとして、正しいものはどれか。
    c:
      - 遂行するのは R（実行責任）、最終責任を負うのは A（説明責任）であり、A は作業ごとに 1 人だけに割り当てる
      - 遂行するのは A（説明責任）、最終責任を負うのは R（実行責任）である
      - 遂行と最終責任は常に同じ役割であり、R と A は同一人物に割り当てる
      - 最終責任を負う A は、関係者全員に割り当ててよい
    a: ア
    exp: |
      RACI は、作業に対する役割を R （Responsible： 実行責任）、A （Accountable： 説明責任）、C （Consulted： 相談先）、I （Informed： 報告先）に分けて表す方法です。実際に作業を遂行するのは R、結果について最終的に責任を負い承認するのは A であり、この2つは別の役割です。特に A は、責任の所在を明確にするため、作業ごとに 1 人だけに割り当てます。R は複数人でも構いません。
    why:
      - 正解です。遂行は R、最終責任は A で、A は作業ごとに 1 人です。
      - R（実行責任）と A（説明責任）の意味が逆になっています。遂行するのは R の側です。
      - 遂行と最終責任は区別される役割であり、同一人物でなければならない決まりはありません （小規模な作業で兼ねることはあっても、定義上は別の役割です）。
      - A を複数人に割り当てると、最終責任の所在が曖昧になるため、1 人に定めます。
    know: RACI の要点は、実行 （R）と最終責任 （A）の分離と、A の一意性。責任分担の表を作る際に「誰がやるか」と「誰が答えるか」を分けて考えることが、体制設計の基本になる。
    terms: [RACI, 責任分担マトリクス]
    verify:
      manual: RACI の各記号の定義（R は実行、A は最終責任で作業ごとに 1 人、C は相談先、I は報告先）と照合し、アだけが遂行と最終責任の割当てを正しく述べていることを確認した。
