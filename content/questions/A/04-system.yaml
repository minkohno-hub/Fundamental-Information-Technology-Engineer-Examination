category: '4'
reviewed: { at: '2026-10-21', method: '作成後の逐問レビュー（定義はシラバスVer.9.2の用語例・JIS等の一般的な定義と照合、計算は検算式で独立に再計算）' }
questions:
  - id: A04-001
    topic: 4-1-1
    diff: 1
    q: 一定期間分のデータをまとめておき，夜間などに一括して処理する処理形態はどれか。
    c: ['バッチ処理', 'リアルタイム処理', '対話型処理', 'オンライントランザクション処理']
    a: ア
    exp: |
      バッチ処理（一括処理）は、データを一定期間または一定量ためておき、まとめて処理する形態です。給与計算や月次の請求処理など、すぐに結果を返す必要のない処理に向いています。処理をまとめることで、資源を効率よく使えます。
    why:
      - 正解です。データをためて一括で処理するのがバッチ処理です。
      - リアルタイム処理は、データが発生したらすぐに処理して結果を返す形態です。
      - 対話型処理は、利用者が画面と対話しながら処理を進める形態です。
      - オンライントランザクション処理は、端末からの要求をその都度処理する形態で、銀行の ATM などが該当します。
    terms: [バッチ処理]

  - id: A04-002
    topic: 4-1-1
    diff: 2
    q: 分散処理システムと比較した集中処理システムの特徴として，適切なものはどれか。
    c:
      - 資源や運用管理を一か所に集約できるので管理しやすいが，中心のコンピュータが停止するとシステム全体が停止する。
      - 処理を複数のコンピュータで分担するので，一部が故障しても全体が止まりにくい。
      - 各拠点で独自にコンピュータを運用するので，拠点ごとに柔軟な対応ができる。
      - システムの拡張は，コンピュータの台数を増やすことで容易に行える。
    a: ア
    exp: |
      集中処理は、1台の大型コンピュータなどにすべての処理を集める方式です。データやセキュリティの管理を一元化しやすい反面、そのコンピュータが停止するとシステム全体が使えなくなり、負荷も集中します。
    why:
      - 正解です。管理しやすい一方で、中心が単一障害点になります。
      - これは分散処理システムの特徴です。
      - 拠点ごとに運用するのは分散処理システムの特徴です。
      - 台数を増やして拡張（スケールアウト）しやすいのは分散処理システムです。
    terms: [分散処理]

  - id: A04-003
    topic: 4-1-2
    diff: 2
    q: デュアルシステムの説明として，適切なものはどれか。
    c:
      - 2組のシステムで同じ処理を同時に行い，結果を照合しながら処理を進める。一方が故障しても，もう一方で処理を続けられる。
      - 主系で処理を行い，待機系は主系が故障したときに処理を引き継ぐ。
      - 2台のコンピュータで処理の負荷を分散させ，それぞれ別の処理を行う。
      - 複数のプロセッサが主記憶を共有して，1つの OS で処理を行う。
    a: ア
    exp: |
      デュアルシステムは、2組のシステムが同じ処理を同時に実行し、結果を照合する構成です。結果が一致しなければ異常を検知でき、一方が故障しても他方で処理を継続できるため、信頼性が非常に高く、銀行や鉄道の重要なシステムなどに使われます。
    why:
      - 正解です。同じ処理を2系統で行い照合するのがデュアルシステムです。
      - 主系と待機系で構成するのはデュプレックスシステムです。
      - 負荷を分散して別々の処理を行うのはロードシェアリングシステム（負荷分散）です。
      - 主記憶を共有するのは密結合マルチプロセッサシステムです。
    know: デュプレックスシステムの待機系には、常に起動しておき短時間で切り替えるホットスタンバイと、障害発生時に起動するコールドスタンバイがあります。
    terms: [デュアルシステム, デュプレックスシステム]

  - id: A04-004
    topic: 4-1-2
    diff: 2
    q: 災害時に備えるバックアップサイトのうち，ホットサイトの説明として，適切なものはどれか。
    c:
      - 本番と同等のシステムを常に稼働させておき，データも随時同期して，障害時にすぐに切り替えられるようにする。
      - 設備や回線などの場所だけを用意しておき，障害が発生してから機器を設置してシステムを構築する。
      - 機器は用意しておくが，障害時にデータの復元や設定を行ってから業務を再開する。
      - バックアップデータを遠隔地の倉庫に保管しておく。
    a: ア
    exp: |
      ホットサイトは、本番と同等のシステムを別の拠点で常に稼働させ、データも同期しておく方式です。障害時には短時間で切り替えられますが、費用は最も高くなります。
    why:
      - 正解です。常に稼働させてすぐに切り替えるのがホットサイトです。
      - 場所などだけを用意しておくのはコールドサイトです。費用は安いですが、復旧に時間がかかります。
      - 機器を用意しておき、障害時に設定やデータの復元を行うのはウォームサイトです。
      - バックアップデータの遠隔保管はサイトの方式ではなく、データの保管方法です。
    terms: [バックアップサイト]

  - id: A04-005
    topic: 4-1-2
    diff: 1
    q: クラウドサービスの形態のうち，PaaS の説明として，適切なものはどれか。
    c:
      - アプリケーションを開発・実行するための OS やミドルウェアなどのプラットフォームを提供する。
      - 電子メールやグループウェアなどのアプリケーションそのものを提供する。
      - 仮想マシンやストレージ，ネットワークなどのインフラを提供し，OS は利用者が選んで導入する。
      - 利用者が書いた関数を，イベントの発生時にだけ実行する環境を提供する。
    a: ア
    exp: |
      PaaS（Platform as a Service）は、アプリケーションを動かすための土台（OS、データベース、開発・実行環境など）をサービスとして提供する形態です。利用者はインフラや OS の管理をせずに、自分のアプリケーションの開発と運用に集中できます。
    why:
      - 正解です。プラットフォームを提供するのが PaaS です。
      - アプリケーションそのものを提供するのは SaaS です。
      - インフラを提供するのは IaaS です。
      - イベント発生時に関数を実行する環境を提供するのは FaaS です。
    know: 利用者が管理する範囲は IaaS → PaaS → SaaS の順に小さくなります。
    terms: [クラウドコンピューティング, SaaS, PaaS, IaaS]

  - id: A04-006
    topic: 4-1-2
    diff: 2
    q: サーバ仮想化におけるライブマイグレーションの説明として，適切なものはどれか。
    c:
      - 稼働中の仮想マシンを停止させずに，別の物理サーバに移動させる。
      - 物理サーバの OS を，仮想マシンを使わずに直接更新する。
      - 仮想マシンのディスクの内容を定期的に複製して保存する。
      - 1台の物理サーバ上で，複数の OS を順番に切り替えて起動する。
    a: ア
    exp: |
      ライブマイグレーションは、仮想マシンを稼働させたまま、メモリの内容などを別の物理サーバに転送して移動させる技術です。物理サーバの保守や負荷分散のときに、サービスを止めずに仮想マシンを移動できます。
    why:
      - 正解です。稼働したまま別の物理サーバへ移動させます。
      - 仮想マシンを使わない更新は、ライブマイグレーションとは関係ありません。
      - ディスクの複製はスナップショットやバックアップの説明です。
      - 複数の OS を切り替えて起動するのはマルチブートです。
    terms: [仮想化]

  - id: A04-007
    topic: 4-1-2
    diff: 2
    q: VDI（デスクトップ仮想化）の説明として，適切なものはどれか。
    c:
      - サーバ上で利用者ごとのデスクトップ環境を仮想マシンとして動作させ，利用者は端末から画面を遠隔操作して利用する。
      - 1台の PC に複数のディスプレイを接続して，作業領域を広げる。
      - PC のハードディスクを暗号化して，盗難時の情報漏えいを防ぐ。
      - 利用者の PC の設定を，ファイルに書き出して別の PC に移す。
    a: ア
    exp: |
      VDI（Virtual Desktop Infrastructure）は、利用者のデスクトップ環境（OS やアプリケーション）をサーバ上の仮想マシンで動かし、利用者は手元の端末から画面転送で操作する仕組みです。データは端末に残らずサーバ側に集約されるため、端末の紛失時の情報漏えいリスクを減らせ、管理も一元化できます。
    why:
      - 正解です。デスクトップ環境をサーバ上で仮想化します。
      - 複数のディスプレイの接続はマルチディスプレイで、仮想化とは関係ありません。
      - ディスクの暗号化は情報漏えい対策の一つですが、VDI ではありません。
      - 設定の移行は VDI の説明ではありません。
    terms: [VDI, シンクライアント]

  - id: A04-008
    topic: 4-1-2
    diff: 2
    q: IaC（Infrastructure as Code）の説明として，適切なものはどれか。
    c:
      - サーバやネットワークなどのインフラの構成を，コードとして記述し，ツールで自動的に構築・変更できるようにする。
      - インフラの機器を，すべて自社で購入して所有する。
      - アプリケーションのソースコードを，インフラの担当者だけが管理する。
      - インフラの設定作業を，手順書に従って手作業で行う。
    a: ア
    exp: |
      IaC は、サーバ・ネットワーク・ストレージなどのインフラの構成を設定ファイルなどのコードで記述し、ツールで自動的に構築・変更する手法です。同じ環境を何度でも正確に再現でき、変更履歴をバージョン管理で追跡でき、手作業による設定ミスを減らせます。
    why:
      - 正解です。インフラ構成をコードで管理して自動構築します。
      - 機器の所有形態は IaC とは関係ありません（オンプレミスの説明）。
      - IaC はアプリケーションのコードの管理者を決める考え方ではありません。
      - 手作業での設定は、IaC が置き換えようとする従来の方法です。
    terms: [IaC]

  - id: A04-009
    topic: 4-1-2
    diff: 2
    q: エッジコンピューティングの説明として，適切なものはどれか。
    c:
      - 利用者や IoT 機器の近くにあるサーバでデータを処理し，通信の遅延やクラウドへのデータ量を減らす。
      - すべてのデータを一か所の大規模なデータセンターに集めて処理する。
      - インターネット上の多数のコンピュータの空き資源を集めて，大規模な計算を行う。
      - 利用者の端末を使わずに，サーバだけで処理を完結させる。
    a: ア
    exp: |
      エッジコンピューティングは、データの発生源（IoT 機器や利用者）に近い場所（ネットワークの端＝エッジ）にサーバを置いて処理する考え方です。クラウドまで送らずに近くで処理するため、応答が速く、通信量も削減できます。自動運転や工場の機械制御など、遅延が許されない用途で重要です。
    why:
      - 正解です。データの発生源の近くで処理します。
      - 一か所に集めて処理するのは、クラウドの集中型の処理の説明です。
      - 多数のコンピュータの空き資源を集めるのはグリッドコンピューティングです。
      - エッジコンピューティングは端末の近くのサーバを活用する考え方で、この説明は当てはまりません。
    terms: [エッジコンピューティング]

  - id: A04-010
    topic: 4-1-2
    diff: 2
    q: サーバレスアーキテクチャ（FaaS）の特徴として，適切なものはどれか。
    c:
      - 利用者はサーバの管理を意識せずにプログラム（関数）を用意し，イベントの発生時にだけ実行されて，実行した分だけ課金される。
      - 物理サーバを一切使わずにプログラムを実行する技術である。
      - サーバを常に起動しておき，利用者が自分で OS を管理する。
      - 端末どうしが直接通信し，サーバを必要としない。
    a: ア
    exp: |
      サーバレス（FaaS：Function as a Service）では、利用者はサーバの用意・管理を行わず、処理を関数として登録しておくだけで、リクエストなどのイベントが発生したときにクラウド事業者が自動的に実行します。実行時間などに応じた従量課金で、負荷に応じた拡張も自動で行われます。
    why:
      - 正解です。サーバ管理を意識せず、イベント駆動で実行されます。
      - 「サーバレス」は利用者がサーバを管理しないという意味で、実際には事業者のサーバ上で動作します。
      - これは IaaS などで利用者が仮想サーバを管理する場合の説明です。
      - 端末どうしが直接通信するのはピアツーピアです。
    terms: [サーバレス, クラウドコンピューティング]

  - id: A04-011
    topic: 4-1-2
    diff: 3
    q: サーバ仮想化の方式のうち，コンテナ型の特徴として，適切なものはどれか。
    c:
      - ホスト OS のカーネルを共有してアプリケーションの実行環境を分離するので，仮想マシンごとにゲスト OS を動かす方式より軽量で起動が速い。
      - 仮想マシンごとに独立したゲスト OS を動かすので，異なる種類の OS を同じサーバで動かせる。
      - ハードウェアを直接制御するハイパーバイザー上で，複数のゲスト OS を動かす。
      - 1つの OS を複数の物理サーバに分割して動かす。
    a: ア
    exp: |
      コンテナ型仮想化は、1つのホスト OS のカーネルを複数のコンテナで共有し、アプリケーションとその実行に必要なライブラリなどをまとめたコンテナ単位で実行環境を分離します。ゲスト OS を起動しないため、軽量で起動が速く、多数の環境を効率よく動かせます。一方で、ホスト OS と異なる種類の OS は動かせません。
    why:
      - 正解です。カーネルを共有するので軽量です。
      - ゲスト OS を動かすのは、ハイパーバイザー型やホスト型の仮想化の特徴です。
      - これはハイパーバイザー型の説明です。
      - 1つの OS を複数の物理サーバに分割する方式ではありません。
    terms: [仮想化, コンテナ]

  - id: A04-012
    topic: 4-1-2
    diff: 2
    q: ピアツーピア（P2P）方式の説明として，適切なものはどれか。
    c:
      - ネットワーク上のコンピュータどうしが対等な立場で，サーバを介さずに直接データをやり取りする。
      - 処理を依頼するクライアントと，処理を提供するサーバに役割を分ける。
      - 1台の大型コンピュータに端末を接続して処理を行う。
      - 処理を複数の層に分け，層ごとに別のサーバで処理する。
    a: ア
    exp: |
      ピアツーピア方式は、ネットワークに参加するコンピュータ（ピア）が対等な関係で、サーバを経由せずに直接通信する方式です。サーバに負荷が集中しないので拡張しやすい一方、全体の管理や統制が難しいという面があります。
    why:
      - 正解です。対等な立場で直接通信する方式です。
      - クライアントとサーバに役割を分けるのはクライアントサーバ方式です。
      - 大型コンピュータに端末を接続するのは集中処理です。
      - 処理を層に分けるのは3層クライアントサーバシステムなどです。
    terms: [ピアツーピア]

  - id: A04-013
    topic: 4-1-3
    diff: 2
    q: HPC（ハイパフォーマンスコンピューティング）の説明として，適切なものはどれか。
    c:
      - 多数のプロセッサやコンピュータを並列に動作させ，気象予測や物理シミュレーションなどの大規模な計算を高速に行う。
      - 1台の PC の消費電力を抑えて，長時間動作させる。
      - 利用者の近くで小規模なデータを処理する。
      - 主記憶を使わずに，補助記憶だけで処理を行う。
    a: ア
    exp: |
      HPC は、スーパーコンピュータやクラスタなど、多数のプロセッサを並列に使って、科学技術計算などの大規模な計算を高速に処理する技術です。気象予測、創薬、材料開発、AI の学習などに利用されています。
    why:
      - 正解です。大規模並列で高速に計算する技術です。
      - 省電力化は HPC の目的ではありません。
      - 利用者の近くで処理するのはエッジコンピューティングです。
      - 主記憶を使わない処理はありえません。
    terms: [HPC]

  - id: A04-014
    topic: 4-1-4
    diff: 2
    q: 3層クライアントサーバシステムで，利用者とのやり取り（画面の表示や入力の受付）を担当する層はどれか。
    c: ['プレゼンテーション層', 'ファンクション層（アプリケーション層）', 'データベースアクセス層', 'トランスポート層']
    a: ア
    exp: |
      3層クライアントサーバシステムは、システムを次の3つの層に分けて構成します。
      - プレゼンテーション層：画面の表示や入力の受付など、利用者とのやり取り
      - ファンクション層：業務の処理（ビジネスロジック）
      - データベースアクセス層：データベースの検索・更新
      層を分けることで、一つの層を変更しても他の層への影響が少なくなります。
    why:
      - 正解です。利用者とのやり取りはプレゼンテーション層が担当します。
      - ファンクション層は、業務の処理（計算や判断）を担当します。
      - データベースアクセス層は、データの検索や更新を担当します。
      - トランスポート層は、OSI 基本参照モデルの第4層で、通信の層であり、この3層構成の層ではありません。
    terms: [3層クライアントサーバシステム]

  - id: A04-015
    topic: 4-1-4
    diff: 2
    q: シンクライアントシステムの特徴として，適切なものはどれか。
    c:
      - 端末には必要最小限の機能だけをもたせ，アプリケーションやデータはサーバ側で管理するので，端末からの情報漏えいのリスクを減らせる。
      - 端末に大容量の記憶装置を搭載し，データを端末ごとに保存する。
      - サーバを使わずに，端末どうしで直接データを共有する。
      - 端末の処理能力を最大限に高めて，サーバの負荷を減らす。
    a: ア
    exp: |
      シンクライアント（thin＝薄い）は、端末側の機能を画面表示や入力など最小限にとどめ、アプリケーションの実行やデータの保存をサーバ側で行う方式です。端末にデータが残らないため情報漏えい対策になり、ソフトウェアの更新などの管理もサーバ側で一元的に行えます。
    why:
      - 正解です。端末の機能を最小限にし、サーバで集中管理します。
      - 端末ごとにデータを保存するのは、従来のファットクライアントの特徴です。
      - 端末どうしで直接共有するのはピアツーピアです。
      - 端末の処理能力を高めるのはシンクライアントの考え方と逆です。
    terms: [シンクライアント]

  - id: A04-016
    topic: 4-1-5
    diff: 2
    q: 一般的な Web システムの構成で，利用者のブラウザからの要求を受けて HTML などを返す Web サーバ，業務処理を行うアプリケーションサーバ，データを管理するデータベースサーバに分ける理由として，最も適切なものはどれか。
    c:
      - 役割ごとにサーバを分けて，負荷に応じた増強や保守を層ごとに行いやすくするため
      - ブラウザにプログラムをインストールする必要をなくすため
      - 通信の暗号化を不要にするため
      - データベースサーバをインターネットに直接公開するため
    a: ア
    exp: |
      Web システムを Web サーバ・アプリケーションサーバ・データベースサーバに分けると、それぞれの役割に合ったサーバを選べ、アクセスが増えたときに負荷の高い層だけを増強するなど、柔軟に対応できます。また、データベースサーバを内部ネットワークに置き、外部から直接アクセスできないようにすることで、セキュリティも高められます。
    why:
      - 正解です。層ごとの増強や保守がしやすくなります。
      - ブラウザを使う Web システムは、もともと専用のプログラムのインストールが不要です。サーバを分ける理由ではありません。
      - サーバを分けても、通信の暗号化は必要です。
      - データベースサーバはインターネットに直接公開しないのが原則です。
    terms: [3層クライアントサーバシステム, Webサーバ]

  - id: A04-017
    topic: 4-1-6
    diff: 2
    q: 容量 1T バイトのハードディスク 4 台で RAID5 を構成したとき，データを格納できる実効容量は何 T バイトか。
    c: ['3', '4', '2', '1']
    a: ア
    exp: |
      RAID5 は、データとパリティ（誤り訂正用の情報）を複数のディスクに分散して記録します。全体で1台分の容量がパリティに使われるので、実効容量は (台数−1)×1台の容量 です。(4−1)×1T＝3T バイトです。
    why:
      - 正解です。1台分がパリティに使われるので 3T バイトです。
      - 4 は冗長性のない RAID0（ストライピング）の場合の容量です。
      - 2 は RAID1 や RAID10 のように半分をミラーに使う場合、または RAID6（2台分をパリティに使う）の場合の容量です。
      - 1 はすべてのディスクに同じデータを書く場合の容量です。
    know: RAID5 は1台のディスクが故障してもデータを復元できますが、2台同時の故障には耐えられません。2台の故障に耐える RAID6 は2台分の容量をパリティに使います。
    terms: [RAID]
    verify: { value: '(4 - 1) * 1' }

  - id: A04-018
    topic: 4-1-6
    diff: 1
    q: RAID1 の説明として，適切なものはどれか。
    c:
      - 2台以上のディスクに同じデータを書き込み（ミラーリング），1台が故障してもデータを失わないようにする。
      - データを複数のディスクに分散して書き込み（ストライピング），読み書きを高速化するが，冗長性はない。
      - データとパリティを複数のディスクに分散して書き込む。
      - データと2種類のパリティを分散して書き込み，2台が同時に故障しても復元できる。
    a: ア
    exp: |
      RAID1 はミラーリングとも呼ばれ、同じデータを2台（以上）のディスクに書き込みます。1台が故障しても、もう1台にデータが残っているので処理を継続できます。実効容量は全体の半分になります。
    why:
      - 正解です。RAID1 はミラーリングです。
      - これは RAID0（ストライピング）の説明です。1台でも故障するとデータが失われます。
      - これは RAID5 の説明です。
      - これは RAID6 の説明です。
    terms: [RAID]

  - id: A04-019
    topic: 4-1-6
    diff: 2
    q: NAS と SAN の説明の組合せとして，適切なものはどれか。
    c:
      - NAS は LAN に接続してファイル単位で共有するストレージ，SAN はサーバとストレージを専用のネットワークで接続してブロック単位でアクセスする仕組み
      - NAS はサーバとストレージを専用のネットワークで接続する仕組み，SAN は LAN に接続してファイルを共有するストレージ
      - NAS も SAN も，サーバの内部に増設するディスク装置
      - NAS は磁気テープ装置，SAN は光ディスク装置
    a: ア
    exp: |
      NAS（Network Attached Storage）は、LAN に直接接続して、複数の PC やサーバからファイル単位で共有できる記憶装置です。SAN（Storage Area Network）は、サーバとストレージを Fibre Channel などの専用の高速ネットワークで接続し、サーバからはディスクのようにブロック単位でアクセスできる仕組みです。
    why:
      - 正解です。NAS はファイル共有、SAN はストレージ専用のネットワークです。
      - 説明が逆になっています。
      - NAS や SAN はネットワーク経由で接続するもので、サーバ内部の装置ではありません。
      - 記録媒体の種類による区別ではありません。
    terms: [NAS, SAN]

  - id: A04-020
    topic: 4-1-7
    diff: 2
    q: フェールセーフの考え方に基づく設計の例として，適切なものはどれか。
    c:
      - 鉄道の信号機が故障したときは，赤信号を表示して列車を停止させる。
      - サーバの1台が故障しても，残りのサーバで処理能力を落として運転を続ける。
      - 誤った操作ができないように，扉が閉まっていないと電子レンジが動作しない。
      - 故障しにくい高品質の部品を使い，故障の発生そのものを防ぐ。
    a: ア
    exp: |
      フェールセーフは、故障や異常が発生したときに、システムを安全側の状態に移すという考え方です。信号機が故障したら「止まれ」を表示する、異常を検知したら機械を停止させる、といった設計が該当します。
    why:
      - 正解です。故障時に安全側（停止）に移すのはフェールセーフです。
      - 機能を落としながら運転を続けるのはフェールソフトです。
      - 誤操作を防ぐのはフールプルーフです。
      - 故障の発生自体を防ぐのはフォールトアボイダンス（障害回避）です。
    know: フォールトトレランスは、故障が発生してもシステム全体として正常に機能を継続させる考え方で、冗長構成などで実現します。
    terms: [フェールセーフ, フェールソフト, フールプルーフ]

  - id: A04-021
    topic: 4-1-7
    diff: 2
    q: フールプルーフの説明として，適切なものはどれか。
    c:
      - 利用者が誤った操作をしても，危険な状態になったりシステムが誤動作したりしないようにする。
      - 障害が発生したときに，システムを安全側の状態にする。
      - 障害が発生したときに，機能を縮小してでも運転を継続する。
      - システムを構成する機器を二重化して，障害時に切り替える。
    a: ア
    exp: |
      フールプルーフは、人が誤った操作をしても、事故や誤動作につながらないように設計する考え方です。例えば、入力値の範囲チェック、確認画面の表示、差し込む向きが決まっていて逆に挿せないコネクタなどが該当します。
    why:
      - 正解です。誤操作への対策がフールプルーフです。
      - これはフェールセーフの説明です。
      - これはフェールソフトの説明です。
      - これは冗長化によるフォールトトレランスの実現方法です。
    terms: [フールプルーフ]

  - id: A04-022
    topic: 4-1-7
    diff: 2
    q: アクティブ-スタンバイ構成の説明として，適切なものはどれか。
    c:
      - 稼働系が処理を行い，待機系は稼働系の障害時に処理を引き継ぐ。
      - 複数の系がすべて同時に処理を行い，負荷を分散する。
      - 2つの系が同じ処理を行い，結果を照合する。
      - 1つの系だけで処理し，障害時は修理が終わるまで停止する。
    a: ア
    exp: |
      アクティブ-スタンバイ構成は、稼働系（アクティブ）で処理を行い、待機系（スタンバイ）は普段は処理をせずに待機して、稼働系に障害が起きたときに処理を引き継ぐ構成です。待機系の資源は通常時に使われませんが、構成が単純です。
    why:
      - 正解です。待機系が障害時に引き継ぎます。
      - これはアクティブ-アクティブ構成の説明です。通常時も全系の資源を使えますが、障害時は残りの系で全負荷を担う必要があります。
      - これはデュアルシステムの説明です。
      - これは冗長化していないシンプレックスシステムの説明です。
    terms: [デュプレックスシステム]

  - id: A04-023
    topic: 4-2-1-1
    diff: 1
    q: システムの性能指標のうち，スループットの説明として，適切なものはどれか。
    c:
      - 単位時間あたりに処理できる仕事の量
      - 利用者が要求を入力し終えてから，最初の応答が返ってくるまでの時間
      - ジョブを投入してから，結果がすべて得られるまでの時間
      - システムが正常に稼働している時間の割合
    a: ア
    exp: |
      スループットは、単位時間あたりに処理できる仕事の量（例えば1秒あたりのトランザクション数）を表す指標です。システム全体の処理能力の高さを示します。
    why:
      - 正解です。単位時間あたりの処理量がスループットです。
      - これはレスポンスタイム（応答時間）の説明です。
      - これはターンアラウンドタイムの説明です。
      - これは稼働率の説明です。
    terms: [スループット, レスポンスタイム]

  - id: A04-024
    topic: 4-2-1-1
    diff: 2
    q: システムの性能を評価するベンチマークの説明として，適切なものはどれか。
    c:
      - 標準的なプログラムを実際にシステムで実行して処理時間などを測定し，性能を比較する。
      - システムを構成する装置の仕様書の数値だけを比べて，性能を推定する。
      - 稼働中のシステムの資源の使用状況を継続的に測定する。
      - 故障が発生するまでの平均時間を求める。
    a: ア
    exp: |
      ベンチマークは、性能評価用の標準的なプログラム（ベンチマークプログラム）を実際に実行して処理時間などを測定し、システムの性能を比較・評価する方法です。トランザクション処理の性能を測る TPC、CPU の整数演算・浮動小数点演算の性能を測る SPECint・SPECfp などがあります。
    why:
      - 正解です。標準プログラムを実行して測定します。
      - 仕様書の数値の比較だけでは、実際の性能は分かりません。
      - 稼働中のシステムの継続的な測定はモニタリングです。
      - 故障までの平均時間は MTBF で、信頼性の指標です。
    terms: [ベンチマーク]

  - id: A04-025
    topic: 4-2-1-2
    diff: 1
    q: スケールアウトの説明として，適切なものはどれか。
    c:
      - サーバの台数を増やして処理を分散させ，システム全体の処理能力を高める。
      - サーバの CPU やメモリを高性能なものに交換して，1台あたりの処理能力を高める。
      - サーバの台数を減らして，運用費用を削減する。
      - サーバの処理能力を下げて，消費電力を抑える。
    a: ア
    exp: |
      スケールアウトは、サーバの台数を増やして処理を分散させることで、システム全体の処理能力を高める方法です。Web サーバのように処理を分けやすいシステムに向いています。
    why:
      - 正解です。台数を増やすのがスケールアウトです。
      - 1台の性能を上げるのはスケールアップです。
      - 台数を減らすのはスケールインです。
      - 性能を下げるのはスケールダウンです。
    terms: [スケールアウト]

  - id: A04-026
    topic: 4-2-1-2
    diff: 2
    q: キャパシティプランニングの説明として，適切なものはどれか。
    c:
      - 現在の資源の使用状況や将来の業務量の予測を基に，必要な処理能力や記憶容量を見積もり，システムの構成を計画する。
      - システムの障害が発生したときの復旧手順を計画する。
      - システム開発の要員の配置を計画する。
      - システムの利用者に対する教育の内容を計画する。
    a: ア
    exp: |
      キャパシティプランニングは、システムの資源（CPU、メモリ、ディスク、ネットワークなど）の使用状況を測定し、将来の業務量の増加を予測して、必要十分な処理能力や容量を見積もり、システムの構成（サイジング）や増強の計画を立てる活動です。
    why:
      - 正解です。将来の需要に必要な能力を見積もり計画します。
      - 障害時の復旧手順の計画は、コンティンジェンシー計画などです。
      - 要員の計画はプロジェクトの資源計画です。
      - 利用者教育の計画は、導入・受入れの活動です。
    terms: [キャパシティプランニング]

  - id: A04-027
    topic: 4-2-2-1
    diff: 2
    q: RASIS の評価項目のうち，Serviceability（保守性）が表す内容として，適切なものはどれか。
    c:
      - 障害が発生したときに，修理や復旧を容易かつ迅速に行えること
      - 障害が発生せず，正しく動作し続けること
      - システムが必要なときに利用できること
      - データの矛盾が発生しないこと
    a: ア
    exp: |
      RASIS はシステムの信頼性を評価する5つの項目の頭文字です。
      - Reliability（信頼性）：故障しにくいこと（MTBF で評価）
      - Availability（可用性）：使いたいときに使えること（稼働率で評価）
      - Serviceability（保守性）：故障時に速やかに修理できること（MTTR で評価）
      - Integrity（完全性）：データの矛盾が起きないこと
      - Security（安全性）：不正アクセスなどから守られていること
    why:
      - 正解です。保守性は修理・復旧のしやすさです。
      - これは Reliability（信頼性）の説明です。
      - これは Availability（可用性）の説明です。
      - これは Integrity（完全性）の説明です。
    terms: [RASIS, MTBF, MTTR]

  - id: A04-028
    topic: 4-2-2-2
    diff: 1
    q: MTBF が 480 時間，MTTR が 20 時間のシステムの稼働率はどれか。
    c: ['0.96', '0.04', '0.95', '24']
    a: ア
    exp: |
      稼働率＝MTBF÷(MTBF＋MTTR) で求めます。
      480÷(480＋20)＝480÷500＝0.96 です。
      MTBF（平均故障間隔）は故障せずに動いている平均時間、MTTR（平均修復時間）は修理にかかる平均時間です。
    why:
      - 正解です。480÷500＝0.96 です。
      - 0.04 は稼働していない時間の割合（不稼働率）です。
      - 0.95 は計算の誤りです。
      - 24 は MTBF÷MTTR で、稼働率ではありません。
    know: 稼働率を上げるには、MTBF を長くする（故障しにくくする）か、MTTR を短くする（すぐ直せるようにする）ことが必要です。
    terms: [稼働率, MTBF, MTTR]
    verify: { value: '480 / (480 + 20)' }

  - id: A04-029
    topic: 4-2-2-2
    diff: 2
    q: 稼働率が 0.9 の装置を2台並列に接続し，少なくとも1台が稼働していればシステムが稼働するようにした。システム全体の稼働率はどれか。
    c: ['0.99', '0.81', '0.9', '1.8']
    a: ア
    exp: |
      並列接続では、2台とも停止したときだけシステムが停止します。
      1台が停止している確率は 1−0.9＝0.1 なので、2台とも停止する確率は 0.1×0.1＝0.01 です。
      システムの稼働率＝1−0.01＝0.99 です。
    why:
      - 正解です。1−(1−0.9)²＝0.99 です。
      - 0.81 は直列接続（両方が稼働して初めて稼働）の場合の稼働率 0.9×0.9 です。
      - 0.9 は1台だけの稼働率です。並列にすると稼働率は上がります。
      - 稼働率は確率なので 1 を超えることはありません。
    terms: [稼働率]
    verify: { value: '1 - (1 - 0.9) ** 2', tolerance: 0.000001 }

  - id: A04-030
    topic: 4-2-2-2
    diff: 3
    q: 稼働率 0.9 の装置 A と，稼働率 0.8 の装置 B を2台並列にしたものを，直列に接続したシステムがある。システム全体の稼働率はどれか。
    c: ['0.864', '0.72', '0.576', '0.96']
    a: ア
    exp: |
      まず並列部分の稼働率を求めます。装置 B が2台とも停止する確率は (1−0.8)²＝0.04 なので、並列部分の稼働率は 1−0.04＝0.96 です。
      これと装置 A を直列に接続するので、全体の稼働率は 0.9×0.96＝0.864 です。
    why:
      - 正解です。0.9×0.96＝0.864 です。
      - 0.72 は装置 B を1台だけ直列に接続した場合（0.9×0.8）です。
      - 0.576 はすべてを直列に接続した場合（0.9×0.8×0.8）です。
      - 0.96 は並列部分だけの稼働率です。
    know: 複雑な構成は、並列部分と直列部分に分けて、内側から順に計算するのが基本です。
    terms: [稼働率]
    verify: { value: '0.9 * (1 - (1 - 0.8) ** 2)', tolerance: 0.000001 }

  - id: A04-031
    topic: 4-2-2-2
    diff: 2
    q: 故障率の時間的な変化を表すバスタブ曲線で，使用開始直後に故障率が高い期間の故障を何というか。
    c: ['初期故障', '偶発故障', '摩耗故障', '共通原因故障']
    a: ア
    exp: |
      バスタブ曲線は、機器の故障率の時間的な変化を表した曲線で、浴槽（バスタブ）の断面のような形になります。
      - 初期故障期：製造上の欠陥などで、使い始めに故障率が高い期間（時間とともに減少）
      - 偶発故障期：故障率がほぼ一定で低い期間
      - 摩耗故障期：劣化により故障率が再び上がる期間
    why:
      - 正解です。使用開始直後の故障は初期故障です。
      - 偶発故障は、故障率がほぼ一定の安定した期間に偶然起こる故障です。
      - 摩耗故障は、長期間の使用による劣化で起こる故障です。
      - 共通原因故障は、一つの原因で複数の機器が同時に故障することで、バスタブ曲線の期間の名称ではありません。
    terms: [バスタブ曲線]

  - id: A04-032
    topic: 4-2-3
    diff: 2
    q: TCO（Total Cost of Ownership）の説明として，適切なものはどれか。
    c:
      - システムの導入費用だけでなく，運用・保守・教育などの費用も含めた，所有期間全体にかかる総費用
      - システムの導入時にかかるハードウェアとソフトウェアの購入費用
      - システムの導入によって得られる利益を，投資額で割った値
      - システムの開発に必要な要員の人数
    a: ア
    exp: |
      TCO（総所有コスト）は、システムの導入費用（初期費用）に加えて、運用費、保守費、利用者の教育費、障害時の損失など、システムを所有・利用する期間全体にかかるすべての費用を合計したものです。導入費用が安くても運用費用が高いことがあるため、システムの経済性は TCO で評価します。
    why:
      - 正解です。所有期間全体の総費用です。
      - 導入時の費用だけでは TCO になりません（初期費用、イニシャルコスト）。
      - これは ROI（投資利益率）の説明です。
      - 要員数は TCO ではありません。
    terms: [TCO]

  - id: A04-033
    topic: 4-2-3
    diff: 2
    q: システム A は初期費用 300 万円，年間運用費用 120 万円，システム B は初期費用 600 万円，年間運用費用 60 万円である。両システムの総費用（初期費用と運用費用の合計）が等しくなる利用年数はどれか。
    c: ['5年', '3年', '6年', '10年']
    a: ア
    exp: |
      利用年数を n 年とすると、総費用はシステム A が 300＋120n 万円、システム B が 600＋60n 万円です。
      両者が等しくなるのは 300＋120n＝600＋60n、つまり 60n＝300 で n＝5 年です。
      5年を超えて使うと、年間運用費用の安いシステム B の方が総費用が安くなります。
    why:
      - 正解です。5年で総費用がどちらも 900 万円で等しくなります。
      - 3年の時点では A が 660 万円、B が 780 万円で、A の方が安いです。
      - 6年の時点では A が 1,020 万円、B が 960 万円で、すでに B の方が安く、等しくはなりません。
      - 10年の時点では A が 1,500 万円、B が 1,200 万円で、等しくはなりません。
    know: 初期費用だけでなく運用費用も含めた総費用（TCO）で比較することが大切です。
    terms: [TCO]
    verify: { value: '(600 - 300) / (120 - 60)' }

  - id: A04-034
    topic: 4-1-2
    diff: 2
    q: クラスタシステムの説明として，適切なものはどれか。
    c:
      - 複数のコンピュータをネットワークで結合し，利用者からは1台のコンピュータのように見えるようにして，可用性や処理能力を高める。
      - 1台のコンピュータの中に複数の CPU を搭載し，主記憶を共有して処理する。
      - 1台のコンピュータを複数の仮想マシンに分割して利用する。
      - 端末に最小限の機能だけをもたせ，処理をサーバで行う。
    a: ア
    exp: |
      クラスタは、複数のコンピュータ（ノード）を結合して、全体として1台のコンピュータのように動作させるシステムです。一部のノードが故障しても他のノードで処理を継続する高可用性（HA）クラスタや、処理を分散して性能を高める負荷分散クラスタ、HPC クラスタなどがあります。
    why:
      - 正解です。複数のコンピュータを1台のように見せる構成です。
      - これは密結合マルチプロセッサシステムの説明です。
      - これはサーバ仮想化の説明です。
      - これはシンクライアントの説明です。
    terms: [クラスタ]

  - id: A04-035
    topic: 4-2-1-1
    diff: 2
    q: ターンアラウンドタイムの説明として，適切なものはどれか。
    c:
      - 処理を依頼してから，その結果がすべて得られるまでの時間
      - 要求の入力が終わってから，最初の応答が始まるまでの時間
      - 単位時間あたりに処理できる仕事の量
      - CPU が1命令を実行するのにかかる時間
    a: ア
    exp: |
      ターンアラウンドタイムは、ジョブを依頼（投入）してから、処理結果の出力がすべて終わるまでの時間です。主にバッチ処理の性能を評価するのに使います。
      レスポンスタイム（応答時間）は、オンライン処理で要求の入力を終えてから最初の応答が返るまでの時間です。
    why:
      - 正解です。依頼から結果がすべて得られるまでの時間です。
      - これはレスポンスタイムの説明です。
      - これはスループットの説明です。
      - これは命令実行時間（CPI×サイクルタイム）の説明です。
    terms: [レスポンスタイム, スループット]

  - id: A04-036
    topic: 4-1-6
    diff: 3
    q: RAID6 の特徴として，適切なものはどれか。
    c:
      - データと2種類のパリティを分散して記録するので，同時に2台のディスクが故障してもデータを復元できる。
      - パリティを使わず，同じデータを2台に書き込むので，実効容量は半分になる。
      - データを分散して記録するだけで，冗長性はない。
      - パリティを専用の1台のディスクに記録する。
    a: ア
    exp: |
      RAID6 は、RAID5 のパリティを2種類にしたもので、データと2種類のパリティを複数のディスクに分散して記録します。2台分の容量をパリティに使う代わりに、2台のディスクが同時に故障してもデータを復元できます。大容量ディスクで復旧に時間がかかる環境で、復旧中のもう1台の故障に備えるために使われます。
    why:
      - 正解です。2台同時の故障に耐えられます。
      - これは RAID1（ミラーリング）の説明です。
      - これは RAID0（ストライピング）の説明です。
      - パリティ専用のディスクを使うのは RAID3 や RAID4 です。
    terms: [RAID]
