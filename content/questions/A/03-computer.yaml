questions:
  - id: A03-001
    topic: 3-1-2
    diff: 2
    q: クロック周波数が 2.0GHz の CPU で、1 命令の実行に平均 4 クロックを要するとき、この CPU の性能は約何 MIPS か。
    c: ['50', '200', '500', '8,000']
    a: ウ
    exp: |
      1秒間のクロック数は 2.0GHz ＝ 2.0×10⁹ 回です。1命令に平均4クロックかかるので、1秒間に実行できる命令数は 2.0×10⁹ ÷ 4 ＝ 5×10⁸ 命令です。MIPS は「1秒間に何百万（10⁶）命令を実行できるか」なので、5×10⁸ ÷ 10⁶ ＝ 500 MIPS となります。
    why:
      - ア：50 は 2.0×10⁹ ÷ 4 を 10⁷ で割ったような桁の誤りです。
      - イ：200 は 2.0×10⁹ ÷ 10⁷ のように、CPI（4クロック）で割るのを忘れた上で桁も誤った値です。
      - ウ：正解です。2.0×10⁹ ÷ 4 ÷ 10⁶ ＝ 500 です。
      - エ：8,000 はクロック周波数に CPI を掛けてしまった誤り（2,000×4）です。
    know: |
      CPI（Cycles Per Instruction）は1命令あたりの平均クロック数、MIPS（Million Instructions Per Second）は1秒あたりの実行命令数（百万単位）です。「MIPS ＝ クロック周波数[Hz] ÷ CPI ÷ 10⁶」と覚えておくと、どの組合せが出ても解けます。
    terms: [CPU]
    verify: { value: '2.0e9 / 4 / 1e6' }
