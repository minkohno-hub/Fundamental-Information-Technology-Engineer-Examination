  - id: A18-001
    topic: 18-1-1
    diff: 2
    q: 情報システムの分類のうち，SoE（Systems of Engagement）の説明として，最も適切なものはどれか。
    c:
      - 社内の申請・承認の手続を電子化し，決められた経路で回付するシステム
      - 蓄積したデータを分析し，意思決定に役立つ洞察を得ることを目的としたシステム
      - 会計や受発注など，企業の取引や業務の記録を正確に処理・保存することを目的とした基幹系システム
      - 顧客や利用者とのつながりを深めることを目的とし，SNS やモバイルアプリなどを通じて顧客体験を高めるシステム
    a: エ
    exp: |
      SoE（Systems of Engagement）は、顧客や利用者との関係（エンゲージメント）を強化することを目的とするシステムで、変化への迅速な対応が求められます。正確な記録を重視する SoR（Systems of Record）や、データ分析によって洞察を得る SoI（Systems of Insight）と対比して用いられます。
    why:
      - 申請・承認の手続を電子化して回付するのはワークフローシステムです。
      - データを分析して洞察を得ることを目的とするシステムは SoI です。
      - 取引や業務の記録を正確に処理・保存する基幹系システムは SoR です。
      - 正解です。顧客とのつながりを強化するシステムが SoE です。
    terms:
      - SoE
      - SoR
      - SoI
      - ワークフローシステム
  - id: A18-002
    topic: 18-1-1
    diff: 2
    q: ERP パッケージの導入における Fit to Standard の考え方として，最も適切なものはどれか。
    c:
      - 現行業務とパッケージの機能との差異を洗い出し，差異はすべてアドオン開発で埋めて現行業務をそのまま維持する。
      - パッケージの標準機能に業務を合わせることを前提に業務プロセスを見直し，追加開発（アドオン）を最小限に抑える。
      - パッケージの標準機能のうち，現行業務と合わない機能だけを選んで導入する。
      - パッケージは使わずに，自社の業務に合わせてすべての機能を新規に開発する。
    a: イ
    exp: |
      Fit to Standard は、ERP パッケージなどの標準機能（ベストプラクティス）に業務を合わせることを前提として、標準機能で業務が運用できるかを確認し、必要に応じて業務プロセスを変更する導入手法です。アドオン開発を最小限にすることで、導入期間やコストを抑え、バージョンアップにも追随しやすくなります。
    why:
      - 差異をアドオン開発で埋めて現行業務を維持するのは、従来型の Fit & Gap 分析に基づく導入の考え方です。
      - 正解です。標準機能に業務を合わせ、アドオンを最小限にするのが Fit to Standard です。
      - 業務と合わない機能だけを導入するのは目的と逆です。標準機能に合わせて業務を変えるのが Fit to Standard です。
      - すべてを新規に開発するのはスクラッチ開発であり、パッケージを利用する考え方ではありません。
    terms:
      - Fit to Standard
      - ERP
  - id: A18-003
    topic: 18-1-1
    diff: 2
    q: IIBA（International Institute of Business Analysis）が策定した，ビジネスアナリシスの知識体系ガイドはどれか。
    c:
      - PMBOK
      - BABOK
      - ITIL
      - SWEBOK
    a: イ
    exp: |
      BABOK（A Guide to the Business Analysis Body of Knowledge）は、IIBA が策定したビジネスアナリシスの知識体系ガイドです。ビジネス上のニーズを明らかにし、課題の解決策を定義して変革を実現するための知識エリアや技法をまとめており、システム化構想や要件定義の進め方の参考になります。
    why:
      - PMBOK は、米国の PMI が発行するプロジェクトマネジメントの知識体系ガイドです。
      - 正解です。ビジネスアナリシスの知識体系は BABOK です。
      - ITIL は、IT サービスマネジメントのベストプラクティス集です。
      - SWEBOK は、IEEE Computer Society がまとめたソフトウェアエンジニアリングの知識体系です。
    terms:
      - BABOK
  - id: A18-004
    topic: 18-1-2
    diff: 1
    q: システム化計画の立案で実施する作業として，最も適切なものはどれか。
    c:
      - システム化の対象範囲，全体開発スケジュール，プロジェクト推進体制，開発投資対効果などを検討して計画を立てる。
      - 稼働中のシステムで発生した障害の原因を調査し，復旧させる。
      - 確定した要件に基づいて，画面や帳票の詳細なレイアウトを設計する。
      - 作成したプログラムについて，モジュール単位でテストを行い不具合を修正する。
    a: ア
    exp: |
      システム化計画の立案では、システム化構想に基づいて、システム化の対象範囲、全体開発スケジュール、プロジェクト推進体制、要員教育計画、開発投資対効果、導入リスクなどを検討し、システム化計画としてまとめます。開発やテスト、運用の作業は、この計画が承認された後の工程で行います。
    why:
      - 正解です。対象範囲・スケジュール・体制・投資対効果などを決めるのがシステム化計画です。
      - 稼働中のシステムの障害対応は、運用・保守の段階の作業です。
      - 画面や帳票の詳細なレイアウトの設計は、要件定義の後の設計工程で行います。
      - モジュール単位のテストは、開発工程（ソフトウェア構築）で行う単体テストです。
    terms:
      - システム化計画
  - id: A18-005
    topic:
      - 18-1-2
      - 17-1-1-5
    diff: 2
    q: IT ポートフォリオの説明として，最も適切なものはどれか。
    c:
      - IT 投資を目的や特性によって分類し，投資案件全体のリスクと効果のバランスを評価しながら，経営資源の配分を最適化する手法
      - 市場成長率と市場占有率を軸に自社の事業や製品を分類し，資源配分を検討する手法
      - 財務，顧客，業務プロセス，学習と成長の4つの視点から業績を評価する手法
      - 組織全体の業務とシステムをモデル化し，現状とあるべき姿を比較する手法
    a: ア
    exp: |
      IT ポートフォリオは、金融資産のポートフォリオの考え方を IT 投資に応用したもので、IT 投資を戦略的投資、業務効率化投資、インフラ投資などに分類し、投資案件全体としてリスクと効果のバランスをとりながら資源を配分する手法です。
    why:
      - 正解です。IT 投資を分類し、全体のリスクと効果のバランスで配分を決めるのが IT ポートフォリオです。
      - 市場成長率と市場占有率で事業を分類するのは PPM（プロダクトポートフォリオマネジメント）です。
      - 4つの視点から業績を評価するのは BSC（バランススコアカード）です。
      - 業務とシステムをモデル化して As-is と To-be を比較するのは EA です。
    terms:
      - ITポートフォリオ
      - PPM
      - BSC
      - EA
  - id: A18-006
    topic: 18-1-2
    diff: 2
    q: |
      情報システムへの投資額は 5,000 万円であり，導入後 5 年間にわたって毎年 1,500 万円の効果が見込まれる。投資効果を ROI ＝（効果の合計 − 投資額）÷ 投資額 × 100（%）で評価するとき，ROI は何 % か。
    c:
      - 50
      - 150
      - 30
      - 33
    a: ア
    exp: |
      5 年間の効果の合計は 1,500 万円 × 5 ＝ 7,500 万円です。ROI ＝（7,500 − 5,000）÷ 5,000 × 100 ＝ 2,500 ÷ 5,000 × 100 ＝ 50（%）となります。ROI（Return On Investment：投資利益率）は、投資額に対してどれだけの利益が得られたかを示す指標です。
    why:
      - 正解です。（7,500 − 5,000）÷ 5,000 × 100 ＝ 50 % です。
      - 効果の合計 7,500 万円を投資額で割った値（150 %）であり、投資額を差し引いていません。
      - 1 年分の効果 1,500 万円を投資額で割った値（30 %）であり、5 年間の効果の合計を使っていません。
      - 投資額を差し引く前後を取り違え、2,500 ÷ 7,500 を計算した値（約 33 %）です。
    terms:
      - ROI
    verify:
      value: (1500 * 5 - 5000) / 5000 * 100
  - id: A18-007
    topic: 18-1-2
    diff: 3
    q: |
      初期投資額が 1,000 万円で，1 年後と 2 年後にそれぞれ 600 万円のキャッシュフローが得られる投資案がある。割引率を年 10 % とするとき，この投資案の正味現在価値（NPV）はおよそ何万円か。
    c:
      - 約 41 万円
      - 200 万円
      - 約 1,041 万円
      - 約 91 万円
    a: ア
    exp: |
      NPV（Net Present Value：正味現在価値）は、将来のキャッシュフローを割引率で現在価値に換算した合計から初期投資額を引いたものです。1 年後の 600 万円の現在価値は 600 ÷ 1.1 ≒ 545.5 万円、2 年後の 600 万円は 600 ÷ 1.1² ＝ 600 ÷ 1.21 ≒ 495.9 万円です。NPV ≒ 545.5 ＋ 495.9 − 1,000 ≒ 41.3 万円となります。NPV が正なので、この投資案は採算がとれると判断できます。
    why:
      - 正解です。545.5 ＋ 495.9 − 1,000 ≒ 41 万円です。
      - 割引を行わずに 600 × 2 − 1,000 を計算した値です。お金の時間的価値を考慮していません。
      - キャッシュフローの現在価値の合計（約 1,041 万円）であり、初期投資額を差し引いていません。
      - 2 年後のキャッシュフローも 1.1 で 1 回だけ割り引いた値（600 ÷ 1.1 × 2 − 1,000 ≒ 91）であり、2 年分の割引になっていません。
    terms:
      - NPV
    verify:
      value: 600 / 1.1 + 600 / pow(1.1, 2) - 1000
      tolerance: 0.5
  - id: A18-008
    topic: 18-1-2
    diff: 1
    q: 3,000 万円を投資して業務システムを導入したところ，毎年 800 万円の効果が一定して得られる見込みである。回収期間法で評価すると，投資額を回収するのに要する期間は何年か。
    c:
      - 0.27 年
      - 3.75 年
      - 4 年
      - 3 年
    a: イ
    exp: |
      回収期間法は、投資額を毎年の効果（キャッシュフロー）で回収するのに何年かかるかで投資を評価する方法です。毎年の効果が一定なので、回収期間 ＝ 投資額 ÷ 年間の効果 ＝ 3,000 ÷ 800 ＝ 3.75（年）となります。回収期間が短いほど有利と判断しますが、回収後の効果や時間的価値を考慮しない点に注意が必要です。
    why:
      - 800 ÷ 3,000 と割る数と割られる数を逆にした値です。回収期間は投資額 ÷ 年間の効果で求めます。
      - 正解です。3,000 ÷ 800 ＝ 3.75 年です。
      - 3.75 年を切り上げた値です。毎年一定の効果が得られるなら、端数も年の割合（600 ÷ 800 ＝ 0.75 年）で求めます。
      - 3 年間の効果 2,400 万円で回収できたとみなした値です。3 年後でも 600 万円が未回収です。
    terms:
      - 回収期間法
    verify:
      value: 3000 / 800
  - id: A18-009
    topic: 18-2-1
    diff: 2
    q: 要求分析のために利用者へインタビューを行う。半構造化インタビューの説明として，最も適切なものはどれか。
    c:
      - 質問の内容と順序をすべて事前に決めておき，どの相手にも同じ質問を同じ順序で行う。
      - 主要な質問項目をあらかじめ用意しておき，相手の回答に応じて質問を追加したり順序を変えたりしながら進める。
      - 質問票を配布して回答を記入してもらい，回収して集計する。
      - 質問項目は用意せず，テーマだけを決めて相手に自由に話してもらう。
    a: イ
    exp: |
      インタビューには、質問を事前に固定する構造化インタビュー、主要な質問だけを用意して状況に応じて柔軟に深掘りする半構造化インタビュー、質問を決めずに自由に話してもらう非構造化インタビューがあります。半構造化インタビューは、聞き漏れを防ぎつつ、想定外のニーズも引き出しやすい方法です。
    why:
      - 質問の内容と順序をすべて固定するのは構造化インタビューです。
      - 正解です。主要な質問を用意しつつ柔軟に進めるのが半構造化インタビューです。
      - 質問票を配布して記入してもらうのはアンケート（質問紙法）であり、インタビューではありません。
      - 質問項目を用意せず自由に話してもらうのは非構造化インタビューです。
    terms:
      - 半構造化インタビュー
  - id: A18-010
    topic: 18-2-2-2
    diff: 1
    q: 販売管理システムの要件のうち，非機能要件に該当するものはどれか。
    c:
      - 受注データを入力すると，在庫を自動的に引き当てる。
      - 毎月末に締め処理を行い，得意先ごとに請求書を発行する。
      - 得意先の与信限度額を超える受注は，保留として登録する。
      - 平日の 8 時から 22 時まで稼働し，受注入力の応答時間は 3 秒以内とする。
    a: エ
    exp: |
      機能要件は、システムが「何をするか」（業務処理の機能）を定めた要件です。非機能要件は、機能以外に求められる性能、可用性、信頼性、セキュリティ、運用・保守性などの品質に関する要件です。稼働時間や応答時間は、可用性と性能に関する非機能要件です。
    why:
      - 在庫の自動引当ては、システムが実行する処理を定めた機能要件です。
      - 締め処理や請求書の発行は、業務処理の機能を定めた機能要件です。
      - 与信限度額を超える受注の保留は、業務ルールを処理として実現する機能要件です。
      - 正解です。稼働時間や応答時間は性能・可用性に関する非機能要件です。
    terms:
      - 非機能要件
      - 機能要件
  - id: A18-011
    topic:
      - 18-2-2-2
      - 18-2-2-1
    diff: 2
    q: 要件定義において定める業務要件の説明として，最も適切なものはどれか。
    c:
      - システムの性能，可用性，セキュリティなど，機能以外に求められる品質を定義したもの
      - プログラムの内部構造やモジュールの分割方法を定義したもの
      - システムが実現すべき入出力や処理の内容を，システムの機能として定義したもの
      - システム化の対象となる業務について，新しい業務の手順，業務ルール，扱う情報などのあるべき姿を定義したもの
    a: エ
    exp: |
      要件定義では、まず業務要件として、システム化の対象業務について新しい業務の流れ、業務ルール、扱う情報、関係する組織などのあるべき姿を定義します。次に、その業務を実現するためにシステムに求められる機能要件と非機能要件（システム要件）を定義します。
    why:
      - 性能や可用性など機能以外の品質を定めたものは非機能要件です。
      - プログラムの内部構造やモジュール分割は、ソフトウェア設計の工程で決める内容です。
      - システムの入出力や処理の内容を定めたものは機能要件です。
      - 正解です。対象業務のあるべき姿を定義したものが業務要件です。
    terms:
      - 業務要件
      - 機能要件
      - 非機能要件
      - 要件定義
  - id: A18-012
    topic: 18-2-2-3
    diff: 2
    q: 要件定義の手法のうち，DOA の説明として，最も適切なものはどれか。
    c:
      - 業務で扱うデータの構造に着目してデータを中心に分析・設計する手法であり，業務の手順が変わってもデータ構造は比較的変わりにくいという考えに基づく。
      - 業務機能をサービスという単位で部品化し，それらを連携させてシステムを構築する手法である。
      - 業務の処理手順（プロセス）に着目し，処理の流れを中心に分析・設計する手法である。
      - データとそれを操作する手続をひとまとめにしたオブジェクトを単位として分析・設計する手法である。
    a: ア
    exp: |
      DOA（Data Oriented Approach：データ中心アプローチ）は、業務で扱うデータに着目し、E-R 図などでデータの構造を明確にしてからシステムを設計する手法です。業務の処理手順は変わりやすい一方、データ構造は比較的安定しているため、変更に強く、データの重複も避けやすくなります。
    why:
      - 正解です。データを中心に分析・設計するのが DOA です。
      - 業務機能をサービス単位で部品化して連携させるのは SOA です。
      - 処理手順を中心に設計するのは POA（プロセス中心アプローチ）です。
      - データと手続をまとめたオブジェクトを単位とするのはオブジェクト指向のアプローチです。
    terms:
      - DOA
      - E-R図
      - SOA
  - id: A18-013
    topic:
      - 18-3-2-3
      - 18-3-2-2
    diff: 1
    q: RFP の説明として，最も適切なものはどれか。
    c:
      - ベンダが，発注者の要求に対する実現方法や体制，スケジュール，費用を示して提出する文書
      - 発注者とベンダの間で，提供されるサービスの範囲と品質の水準を合意した文書
      - 発注者が，調達するシステムの概要や要求事項，提案の条件などを示して，ベンダに具体的な提案書の提出を依頼する文書
      - 発注者が，システム化の検討に先立って，ベンダに技術動向や製品・サービスの情報の提供を依頼する文書
    a: ウ
    exp: |
      RFP（Request For Proposal：提案依頼書）は、発注者が調達対象のシステムの目的、概要、要求事項、契約条件、提案書の提出方法などを示し、ベンダに提案を依頼する文書です。RFP を事前に示すことで、各ベンダから同じ前提に基づく提案を受けられ、公平で客観的な比較・評価ができます。
    why:
      - ベンダが実現方法や費用を示して提出するのは提案書（および見積書）です。
      - サービスの範囲と品質の水準を合意した文書は SLA（サービスレベル合意書）です。
      - 正解です。要求事項を示して提案書の提出を依頼するのが RFP です。
      - 技術動向や製品情報の提供を依頼するのは RFI（情報提供依頼書）です。
    terms:
      - RFP
      - RFI
      - 提案書
