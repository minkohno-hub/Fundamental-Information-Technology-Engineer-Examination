    q: 情報システムの調達における一般的な手順として，最も適切なものはどれか。
    c:
      - 契約の締結 → RFI の発行 → 提案書・見積書の受領 → RFP の発行 → 調達先の選定
      - RFP の発行 → RFI の発行 → 契約の締結 → 提案書・見積書の受領 → 調達先の選定
      - 提案書・見積書の受領 → RFP の発行 → RFI の発行 → 契約の締結 → 調達先の選定
      - RFI の発行 → RFP の発行 → 提案書・見積書の受領 → 提案内容の評価・調達先の選定 → 契約の締結
    a: エ
    exp: |
      調達では、まず RFI でベンダから技術や製品の情報を集め、それを基に要求事項を整理して RFP を作成・発行します。ベンダから提案書と見積書を受け取り、あらかじめ定めた評価基準で評価して調達先を選定し、最後に契約を締結します。
    why:
      - 契約は調達先を選定した後に締結するものであり、最初に行うことはできません。
      - RFI は RFP を作成するための情報収集なので、RFP より先に行います。また、契約は提案の受領と選定の後に締結します。
      - 提案書は RFP を受けてベンダが作成するので、RFP の発行より前には受領できません。
      - 正解です。情報収集（RFI）、提案依頼（RFP）、提案受領、評価・選定、契約の順です。
    terms:
      - RFI
      - RFP
      - 提案書
  - id: A18-015
    topic: 18-3-2-5
    diff: 2
    q: |
      システムの調達で，4 社の提案を次の評価項目と重みで評価する。各項目の評価点に重みを掛けて合計した値が最も高い会社を選定するとき，選定される会社とその合計点の組合せはどれか。

      | 会社 | 機能（重み 0.5） | 価格（重み 0.3） | サポート（重み 0.2） |
      | --- | --- | --- | --- |
      | A 社 | 80 | 60 | 90 |
      | B 社 | 70 | 90 | 60 |
      | C 社 | 90 | 50 | 60 |
      | D 社 | 60 | 90 | 90 |
    c:
      - 75 点の D 社
      - 74 点の B 社
      - 76 点の A 社
      - 72 点の C 社
    a: ウ
    exp: |
      各社の合計点は次のとおりです。A 社：80 × 0.5 ＋ 60 × 0.3 ＋ 90 × 0.2 ＝ 40 ＋ 18 ＋ 18 ＝ 76。B 社：35 ＋ 27 ＋ 12 ＝ 74。C 社：45 ＋ 15 ＋ 12 ＝ 72。D 社：30 ＋ 27 ＋ 18 ＝ 75。最も高いのは 76 点の A 社です。調達先の選定では、このように評価項目と重み付けをあらかじめ決めておき、提案を客観的に比較します。
    why:
      - D 社は価格とサポートが高いものの、重みの大きい機能が 60 点のため 30 ＋ 27 ＋ 18 ＝ 75 点で、A 社に及びません。
      - B 社は価格が最も高い評価ですが、35 ＋ 27 ＋ 12 ＝ 74 点です。
      - 正解です。A 社は 40 ＋ 18 ＋ 18 ＝ 76 点で最も高くなります。
      - C 社は機能が最も高い評価ですが、価格とサポートが低く 45 ＋ 15 ＋ 12 ＝ 72 点です。
    terms:
      - 提案書
    verify:
      value: max(80*0.5 + 60*0.3 + 90*0.2, 70*0.5 + 90*0.3 + 60*0.2, 90*0.5 + 50*0.3 + 60*0.2, 60*0.5 + 90*0.3 + 90*0.2)
      tolerance: 0.001
  - id: A18-016
    topic: 18-3-2-1
    diff: 2
    q: 公共機関などの調達方法のうち，企画競争入札（企画競争）の説明として，最も適切なものはどれか。
    c:
      - 発注者があらかじめ指名した事業者だけを入札に参加させ，落札者を決める。
      - 競争によらずに，発注者が任意に選んだ特定の事業者と契約する。
      - 複数の事業者から企画や提案を募り，提案内容を評価して最も優れた提案を行った事業者を選定する。
      - 調達内容を公告して参加資格を満たす事業者を広く募り，原則として最も有利な価格を示した事業者と契約する。
    a: ウ
    exp: |
      企画競争は、価格だけでは評価できない調達で、複数の事業者から企画・提案を受け、その内容を評価して最も優れた提案者を選ぶ方式です（プロポーザル方式とも呼ばれます）。システム開発のように、提案の質が成果を大きく左右する調達で用いられます。
    why:
      - 発注者が指名した事業者だけで競争させるのは指名競争入札です。
      - 競争によらず特定の事業者と契約するのは随意契約です。
      - 正解です。提案内容を評価して事業者を選ぶのが企画競争入札です。
      - 公告して広く参加者を募り価格で決めるのは一般競争入札です。
    terms:
      - 企画競争入札
      - 一般競争入札
  - id: A18-017
    topic: 18-3-2-7
    diff: 2
    q: システム開発の委託契約のうち，準委任契約の特徴として，最も適切なものはどれか。
    c:
      - 受託者は，善良な管理者の注意をもって委託された業務を遂行する義務を負うが，成果物の完成義務は負わない。
      - 受託者は成果物を完成させる義務を負い，完成した成果物が契約の内容に適合しない場合には責任を負う。
      - 契約で定めていなくても，作業が終了した時点で，作成された成果物の著作権は必ず委託者に帰属する。
      - 受託者の労働者は，委託者の指揮命令を受けて委託者のための業務に従事する。
    a: ア
    exp: |
      準委任契約では、受託者は委託された事務（業務）を、善良な管理者の注意（善管注意義務）をもって処理する義務を負いますが、成果物の完成義務は負いません。要件定義や運用支援など、成果物の内容を事前に確定しにくい作業で用いられます。これに対して請負契約では、受託者は仕事の完成義務を負い、成果物が契約の内容に適合しない場合は契約不適合責任を負います。いずれの契約でも、委託者は受託者の労働者に直接指揮命令できません。
    why:
      - 正解です。善管注意義務を負うが完成義務は負わないのが準委任契約です。
      - 完成義務と契約不適合責任を負うのは請負契約の特徴です。
      - 著作権の帰属は契約で個別に取り決めます。取決めがなければ、原則として著作物を作成した受託者側に著作権が帰属します。
      - 委託者が労働者に指揮命令するのは労働者派遣の特徴です。準委任契約や請負契約では、委託者は直接指揮命令できません。
    terms:
      - 準委任契約
      - 請負契約
  - id: A18-018
    topic: 18-3-1
    diff: 1
    q: グリーン調達の説明として，最も適切なものはどれか。
    c:
      - 製品やサービスを調達する際に，品質や価格だけでなく，環境への負荷ができるだけ小さいものを優先して選ぶ。
      - 必要な部品を，必要なときに必要な量だけ調達し，在庫を最小限にする。
      - 複数の部門で個別に行っていた購買を一つの部門にまとめ，購買量を増やして価格を引き下げる。
      - 調達先の人権への配慮，労働環境，法令遵守などの社会的責任への取組みを評価して調達先を選ぶ。
    a: ア
    exp: |
      グリーン調達（グリーン購入）は、製品・サービスや部品・原材料を調達する際に、環境への負荷が小さいもの、あるいは環境に配慮した取組みを行う事業者から優先的に調達することです。国は「グリーン購入法」により、国の機関などに環境物品等の調達を推進するよう定めています。
    why:
      - 正解です。環境負荷の小さいものを優先して調達するのがグリーン調達です。
      - 必要なものを必要なときに必要な量だけ調達するのは JIT（ジャストインタイム）の考え方です。
      - 購買を一つの部門に集約して価格を下げるのは集中購買の説明です。
      - 人権・労働環境・法令遵守など社会的責任への取組みを含めて評価するのは CSR 調達の説明です。
    terms:
      - グリーン調達
  - id: A18-019
    topic: 18-3-1
    diff: 2
    q: 調達計画で用いる内外作基準の説明として，最も適切なものはどれか。
    c:
      - 開発や運用の作業を自社で行うか外部に委託するかを，コスト，品質，技術力，機密保持などの観点から判断するための基準
      - 調達先の候補となる事業者に，技術や製品に関する情報の提供を依頼するための基準
      - 契約した成果物が要求どおりであるかを確認し，受け入れるかどうかを判断するための基準
      - ソフトウェアの使用許諾条件を守って利用しているかを確認するための基準
    a: ア
    exp: |
      内外作基準は、システム開発や運用の作業を自社で行う（内作・内製）か、外部に委託する（外作・外製）かを判断する基準です。コスト、品質、納期、自社の技術力や要員、ノウハウの蓄積、機密保持などの観点から定め、調達計画の立案に用います。
    why:
      - 正解です。内製か外部委託かを判断する基準が内外作基準です。
      - 事業者に情報提供を依頼するのは RFI であり、内外作基準ではありません。
      - 成果物を受け入れるかどうかを判断するのは受入れ（検収）基準です。
      - 使用許諾条件の遵守の確認はライセンス管理の活動です。
    terms:
      - 内外作基準
      - RFI
