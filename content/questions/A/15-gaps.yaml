category: '15'
reviewed:
  at: '2026-10-21'
  method: 作成後の逐問レビュー（JIS Q 20000-1 のサービスの設計及び移行・需要管理・パフォーマンス評価の要求事項、ファシリティマネジメントの定義をシラバスVer.9.2の用語例と照合）；第3回：JIS Q 20000-1:2020 の 8.4 供給及び需要、8.5.2.1／8.5.2.2、9.1 の記述をJIPDEC「ITSMSユーザーズガイド」の規格引用で確認し、設計の記述を修正
questions:
  - id: A15-051
    topic: 15-1-1
    diff: 1
    q: サービスマネジメントにおけるサービスライフサイクルの段階を，順序どおりに並べたものはどれか。
    c:
      - 計画立案，設計，移行，提供，改善
      - 設計，計画立案，提供，移行，改善
      - 計画立案，提供，設計，改善，移行
      - 移行，設計，計画立案，改善，提供
    a: ア
    noShuffle: true
    exp: |
      サービスマネジメントは、サービスの計画立案、設計、移行、提供、改善というライフサイクル全体を通じて、顧客に価値をもたらすサービスを管理する活動です。サービスは、サービスを構成するサービスコンポーネント（人、プロセス、技術など）を組み合わせて提供され、合意したサービス品質を維持・改善することが求められます。
    why:
      - 正解です。計画立案から改善までの順序です。
      - 設計の前に計画立案を行い、提供の前に移行を行います。
      - 設計と移行は提供の前に行います。
      - 計画立案が最初で、提供の後に改善を行います。
    terms:
      - サービスマネジメントシステム
  - id: A15-052
    topic: 15-2-10
    diff: 2
    q: サービスマネジメントにおける需要管理の説明として，適切なものはどれか。
    c:
      - 発生したインシデントを記録し，できるだけ早くサービスを回復する。
      - サービスの停止を伴う変更を，変更諮問委員会の承認を得て実施する。
      - サービスの提供に必要な資産の構成情報を記録し，正確に維持する。
      - サービスに対する現在及び将来の需要を予測し，顧客の需要とサービスの消費を監視・報告する。
    a: エ
    exp: |
      需要管理では、サービスに対する現在及び将来の需要を決定・文書化し、需要予測を行います。また、需要とサービスの消費を監視して報告します。需要の情報は、必要な資源の量を計画する容量管理の基礎になります。
    why:
      - これはインシデント管理の説明です。
      - これは変更管理の説明です。
      - これは構成管理の説明です。
      - 正解です。需要の予測と消費の監視・報告を行います。
    terms:
      - 需要管理
      - CAB
      - 変更管理
  - id: A15-053
    topic: 15-2-13-1
    diff: 2
    q: JIS Q 20000-1 に基づくサービスの設計及び移行において，新規サービス又はサービス変更の計画で決定する事項として，適切なものはどれか。
    c:
      - 提供中のサービスで発生したインシデントの優先度
      - 設計，構築及び移行の活動に関する権限と責任，スケジュール，必要な資源，サービス受入れ基準
      - 停止したサービスを回復するための暫定的な回避策
      - 次年度のシステム監査の監査テーマと監査人
    a: イ
    exp: |
      新規サービス又はサービス変更の計画では、サービス要求事項を基に、設計・構築・移行の活動の権限と責任、実施する活動と時期、必要な人的・技術的・財務的資源、他のサービスへの依存関係、サービス受入れ基準などを決定します。計画に従ってサービスを設計し、構築・試験を経て運用に移行します。
    why:
      - これはインシデント管理で行う活動です。
      - 正解です。体制、スケジュール、資源、受入れ基準などを計画します。
      - これはインシデント管理や問題管理で行う活動です。
      - これはシステム監査計画で決める事項です。
    terms:
      - サービスの移行
      - サービス受入れ基準
  - id: A15-054
    topic: 15-2-13-2
    diff: 2
    q: サービスの設計及び移行の「設計」における活動として，適切なものはどれか。
    c:
      - 退職者の利用者 ID を削除する。
      - サービス要求事項を満たすように新規サービス又はサービス変更を設計し，関係者の権限・責任，必要な資源，SLA や契約の変更，サービスカタログの更新などを含めて文書化する。
      - 移行を終えたサービスについて，顧客満足度調査を行う。
      - サービスの提供開始後に，SLA の達成状況を顧客に報告する。
    a: イ
    exp: |
      JIS Q 20000-1:2020 の 8.5.2.2 では、新規サービス又はサービス変更を、サービスの要求事項を満たすように設計し、文書化することを求めています。設計には、関与する関係者の権限と責任、人・技術・情報・財務の資源の変更に対する要求事項、教育訓練の要求事項、新規 SLA や支援する契約書、SMS の変更、他のサービスへの影響、サービスカタログの更新などから、関連する項目を含めます。その後、設計に従って構築・試験し、受入れ基準を満たすことを確認して移行します。
    why:
      - これは情報セキュリティ管理やアクセス管理の運用の活動です。
      - 正解です。サービスの要求事項を満たすように設計し、関連する事項を含めて文書化します。
      - これは提供・改善の段階で行う顧客満足の測定です。
      - これはサービスの提供段階で行うサービスレベル管理やサービスの報告の活動です。
    terms:
      - サービス受入れ基準
      - SLA
  - id: A15-055
    topic: 15-3-1-1
    diff: 2
    q: JIS Q 20000-1 のパフォーマンス評価における監視，測定，分析及び評価について，組織が決定すべき事項として適切なものはどれか。
    c:
      - 開発プロジェクトのクリティカルパス
      - 監視・測定が必要な対象，その方法，実施する時期，結果を分析・評価する時期
      - 内部監査を担当する監査人の給与体系
      - 新たに提供するサービスの販売価格と販売チャネル
    a: イ
    exp: |
      パフォーマンス評価では、組織は、何を監視・測定する必要があるか、妥当な結果を得るための監視・測定・分析・評価の方法、監視・測定の実施時期、その結果を分析・評価する時期を決定します。そして SMS とサービスのパフォーマンス及び有効性を評価し、その証拠として文書化した情報を保持します。
    why:
      - これはプロジェクトのスケジュール管理で扱う事項です。
      - 正解です。対象・方法・時期を決めて評価します。
      - パフォーマンス評価で決定する事項ではありません。
      - これはマーケティング戦略で決める事項です。
    terms:
      - サービスマネジメントシステム
      - KPI
  - id: A15-056
    topic: 15-3-1-2
    diff: 2
    q: サービスマネジメントにおけるサービスの報告の説明として，適切なものはどれか。
    c:
      - サービス目標に対するパフォーマンスや傾向情報などを含む報告書を作成し，SMS とサービスの有効性について意思決定に役立てる。
      - サービスの停止に備えて，代替手段と復旧手順を定める。
      - 利用者からの問合せを一元的に受け付け，記録する。
      - 提供者と顧客が合意したサービスレベル目標を文書化する。
    a: ア
    exp: |
      サービスの報告では、報告の要求事項と目的を決定し、SMS とサービスのパフォーマンス及び有効性について報告書を作成します。報告書には、サービス目標に対する実績、重大なインシデントなどの情報、傾向情報などを含め、利害関係者の意思決定や改善に役立てます。
    why:
      - 正解です。パフォーマンスや傾向を報告し、意思決定に用います。
      - これはサービス継続管理の説明です。
      - これはサービスデスクの説明です。
      - これは SLA の説明です。
    terms:
      - サービスデスク
      - サービス継続管理
      - SLA
  - id: A15-057
    topic: 15-5-1-1
    diff: 1
    q: ファシリティマネジメントの説明として，適切なものはどれか。
    c:
      - 企業などが組織活動のために，施設とその環境を総合的に企画，管理，活用する経営活動
      - 情報システムの開発作業の進捗を管理する活動
      - 情報資産に対する脅威と脆弱性を分析して，対策を決める活動
      - IT サービスの障害の根本原因を調査し，再発を防止する活動
    a: ア
    exp: |
      ファシリティマネジメントは、土地・建物・設備などの施設とその環境を、経営的視点から総合的に企画・管理・活用する活動です。IT の分野では、データセンタやサーバ室の電源設備、空調設備、防災・防犯設備などを適切に維持し、情報システムを安全かつ効率よく稼働させることが含まれます。
    why:
      - 正解です。施設とその環境を経営資源として総合的に管理します。
      - これはプロジェクトマネジメントの進捗管理の説明です。
      - これはリスクアセスメントの説明です。
      - これは問題管理の説明です。
    terms:
      - ファシリティマネジメント
      - 問題管理
      - リスク分析
  - id: A15-058
    topic: 15-5-1-3
    diff: 2
    q: データセンタの施設・設備の維持保全に関する記述として，適切なものはどれか。
    c:
      - 自家発電装置は停電時にしか使わないので，定期的な試運転は不要である。
      - 空調設備や UPS を計画的に点検し，劣化した部品を故障する前に交換するのは予防保全である。
      - 故障してから修理する事後保全では，故障による停止は発生しない。
      - 施設・設備の維持保全は，建設時に一度だけ行えばよい。
    a: イ
    exp: |
      施設・設備の維持保全には、故障を未然に防ぐため定期的に点検や部品交換を行う予防保全と、故障が発生してから修理する事後保全があります。情報システムを支える電源設備（UPS・自家発電装置）や空調設備などは停止の影響が大きいため、計画的な点検・試運転などの予防保全が重要です。
    why:
      - 非常時に確実に動作させるため、定期的な点検・試運転が必要です。
      - 正解です。故障前に計画的に点検・交換するのは予防保全です。
      - 事後保全は故障後に修理するため、故障による停止が発生します。
      - 設備は経年劣化するため、運用期間を通じて継続的に維持保全を行います。
    terms:
      - 予防保全
      - ファシリティマネジメント
