    q: テストケースの設計技法のうち，原因結果グラフ法の説明として，適切なものはどれか。
    c:
      - 意図的に誤りを埋め込んでテストを行い，その発見状況から残存する誤りの数を推定する。
      - 入力値の範囲を，同じ処理が行われるグループに分け，各グループから代表値を選ぶ。
      - プログラムの内部構造に着目し，すべての命令を少なくとも1回実行するようにテストケースを作る。
      - 入力条件（原因）と出力（結果）の論理的な関係をグラフで表し，それを基に決定表を作成してテストケースを導く。
    a: エ
    exp: |
      原因結果グラフ法は、仕様に含まれる入力条件（原因）と出力（結果）の関係を、AND・OR・NOT などの論理関係を示すグラフで表し、それを決定表に変換してテストケースを設計するブラックボックステストの技法です。入力条件の組合せを漏れなく、かつ効率よくテストできます。
    why:
      - 誤りを埋め込んで残存数を推定するのは、エラー埋込法です。
      - 入力をグループに分けて代表値を選ぶのは、同値分割法です。
      - 内部構造に着目して命令を網羅するのは、ホワイトボックステストの命令網羅です。
      - 正解です。原因と結果の関係をグラフにし、決定表からテストケースを導きます。
    terms:
