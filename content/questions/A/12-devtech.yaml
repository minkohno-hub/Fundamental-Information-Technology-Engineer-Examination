    a: イ
    exp: |
      GoF（Gang of Four）の23のデザインパターンは、目的によって3つに分類されます。
      - 生成に関するパターン：Factory Method、Abstract Factory、Singleton、Builder、Prototype
      - 構造に関するパターン：Adapter、Composite、Decorator、Facade、Proxy など
