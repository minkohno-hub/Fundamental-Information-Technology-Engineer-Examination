    q: |
      判定条件「A or B」（A，B は単一の条件）に対して，次の2つのテストケースを実施した。このテストケースについての記述として，適切なものはどれか。

      | テストケース | A | B |
      | --- | --- | --- |
      | 1 | 真 | 偽 |
      | 2 | 偽 | 真 |
    c:
      - 判定条件網羅は満たすが，条件網羅は満たさない。
      - 複数条件網羅を満たす。
      - 条件網羅は満たすが，判定条件網羅は満たさない。
      - 条件網羅と判定条件網羅の両方を満たす。
    a: ウ
    exp: |
      条件網羅は、判定に含まれる個々の条件（A、B）がそれぞれ真と偽の両方になることを求めます。A は真・偽、B は偽・真をとるので、条件網羅は満たします。一方、判定条件網羅は、判定全体（A or B）の結果が真と偽の両方になることを求めますが、2つのケースはどちらも判定結果が真なので満たしません。このように、条件網羅を満たしても判定条件網羅を満たすとは限りません。
    why:
      - 判定結果が偽になるケースがないので、判定条件網羅は満たしません。また、条件網羅は満たしています。
      - 複数条件網羅には、真真・真偽・偽真・偽偽の4つの組合せすべてが必要です。
      - 正解です。各条件は真偽をとりますが、判定結果は真だけです。
      - 判定結果がどちらも真で偽のケースがないため、判定条件網羅は満たしません。
    verify:
      manual: ケース1は 真 or 偽 = 真、ケース2は 偽 or 真 = 真。A・B はそれぞれ真偽をとるので条件網羅は成立、判定は真のみで判定条件網羅は不成立。複数条件網羅は2^2=4通りが必要であることを確認
    terms:
      - 条件網羅
      - 判定条件網羅
      - 複数条件網羅
