    a: エ
    exp: |
      同値分割法（同値分析法）は、入力値を、プログラムが同じように処理するグループ（同値クラス）に分け、各クラスから代表値を1つずつ選ぶ技法です。設問では、無効クラス（0 未満）、有効クラス（0〜12、13〜64、65〜120）、無効クラス（120 超）の5つのクラスがあるので、−5、6、30、90、200 のように各クラスから1つずつ選びます。
    why:
      - 区分の境界付近の値を選ぶのは限界値分析の考え方で、無効クラス（0 未満、120 超）の代表値も含まれていません。
      - 有効範囲の両端の値だけで、一般料金のクラスや無効クラスが含まれていません。
      - 有効クラスだけで、エラーとなる無効クラスの代表値が含まれていません。
      - 正解です。5つの同値クラスから代表値を1つずつ選んでいます。
    terms:
      - 同値分割
      - 限界値分析
      - ブラックボックステスト
