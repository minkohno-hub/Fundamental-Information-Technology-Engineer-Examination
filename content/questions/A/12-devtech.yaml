    q: エラー埋込法で，プログラムに 30 個のエラーを意図的に埋め込んでテストを行ったところ，埋め込んだエラーが 24 個，埋め込んだもの以外の固有のエラーが 48 個発見された。まだ発見されていない固有のエラーは何個と推定できるか。ここで，埋め込んだエラーと固有のエラーは同じ割合で発見されるものとする。
    c:
      - '60'
      - '12'
      - '6'
      - '24'
    a: イ
    exp: |
      エラー埋込法では、埋め込んだエラーの発見率と固有のエラーの発見率が等しいと考えて、固有のエラーの総数を推定します。
      - 埋込みエラーの発見率 = 24 ÷ 30 = 0.8
      - 固有のエラーの推定総数 = 48 ÷ 0.8 = 60
      - 未発見の固有のエラー = 60 − 48 = 12
    why:
      - 60 は、固有のエラーの推定総数で、ここから発見済みの 48 を引く必要があります。
      - 正解です。推定総数 60 から発見済みの 48 を引いて 12 です。
      - 6 は、埋め込んだエラーのうち未発見のもの（30 − 24）の数で、固有のエラーの残存数ではありません。
      - 24 は、埋め込んだエラーの発見数で、固有のエラーの残存数の推定値ではありません。
    verify:
      value: 48 * 30 / 24 - 48
    terms:
      - エラー埋込法
