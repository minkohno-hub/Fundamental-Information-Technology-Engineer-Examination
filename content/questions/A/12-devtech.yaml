      Factory Method は、インスタンスを生成する処理をサブクラスに任せるので、生成に関するパターンです。
    why:
      - Adapter は、インタフェースを変換してクラスを組み合わせる、構造に関するパターンです。
      - 正解です。Factory Method は生成に関するパターンです。
      - Observer は、オブジェクト間の通知の仕組みを定める、振る舞いに関するパターンです。
      - Composite は、木構造でオブジェクトを組み立てる、構造に関するパターンです。
