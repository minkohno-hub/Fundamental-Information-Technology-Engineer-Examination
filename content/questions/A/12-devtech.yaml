    q: テスト工程で，テスト項目の消化数に対する累積バグ発見数をグラフにした。テスト項目の消化は計画どおりに進んでおり，曲線の傾きが次第に小さくなって飽和に近づいてきた。このグラフから判断できることとして，最も適切なものはどれか。
    c:
      - バグの修正が間に合わず，未解決のバグが増え続けていると判断できる。
      - 残存するバグが確実に 0 になったと判断できる。
      - テストを開始した直後の段階であり，今後バグの発見数が急増すると判断できる。
      - バグの発見が収束に向かっており，品質が安定してきていると判断できる。
    a: エ
    exp: |
      累積バグ発見数のグラフ（バグ曲線、信頼度成長曲線）は、一般にゴンペルツ曲線のような S 字形になります。テスト初期は発見数が少なく、中盤で急増し、終盤には新たなバグが見つかりにくくなって飽和に近づきます。テスト項目の消化が順調なうえで曲線が飽和に近づいていれば、バグが収束して品質が安定してきたと判断できます。
    why:
      - 累積発見数のグラフからは、未解決のバグの数は分かりません。未解決数は別に管理します。
      - 曲線が飽和に近づいても、残存バグが 0 であることは保証されません。
      - テスト開始直後は傾きが小さくても、その後急増して S 字になります。設問のように傾きが小さくなって飽和に近づくのは終盤の状態です。
      - 正解です。飽和に近づいていれば、バグの発見が収束しつつあります。
