  - id: A12-067
    topic: 12-3-6
    diff: 2
    q: 制御フローグラフのノード（節点）の数が 9，エッジ（辺）の数が 11 である，1つの連結したプログラムのサイクロマティック複雑度はいくらか。
    c:
      - '4'
      - '3'
      - '20'
      - '2'
    a: ア
    exp: |
      サイクロマティック複雑度（McCabe の循環的複雑度）は、プログラムの制御の流れの複雑さを表す尺度で、制御フローグラフのエッジ数を E、ノード数を N、連結成分の数を P とすると、M = E − N + 2P で求めます。1つの連結したプログラムでは P = 1 なので、M = 11 − 9 + 2 = 4 です。値が大きいほどテストや保守が難しいとされます。
    why:
      - 正解です。11 − 9 + 2 = 4 です。
      - 3 は、2P ではなく 1 を加えた値で、公式と合いません。
      - 20 は、エッジ数とノード数を足した値で、複雑度の求め方ではありません。
      - 2 は、エッジ数からノード数を引いただけで、2P（= 2）を加えていない値です。
    verify:
      value: 11 - 9 + 2 * 1
    terms:
      - サイクロマティック複雑度
  - id: A12-068
    topic: 12-3-6
    diff: 2
    q: |
      あるプログラムに含まれる判定は次のとおりである。このプログラムのサイクロマティック複雑度はいくらか。ここで，条件式はすべて単一の条件（and や or を含まない）であり，プログラムは入口と出口が1つずつの構造化されたものとする。

      - if 文が 2 個
      - while 文が 1 個
      - for 文が 1 個
      - それ以外の分岐や繰返しはない
    c:
      - '5'
      - '6'
      - '3'
      - '4'
    a: ア
    exp: |
      入口と出口が1つずつの構造化されたプログラムでは、サイクロマティック複雑度は「判定（2分岐）の数 + 1」で求められます。if 文・while 文・for 文はそれぞれ1つの判定を含むので、判定の数は 2 + 1 + 1 = 4、複雑度は 4 + 1 = 5 です。これは、プログラムの独立した経路の数を表し、基本経路を網羅するのに必要なテストケース数の目安になります。
    why:
      - 正解です。判定の数 4 に 1 を加えて 5 です。
      - 6 は、判定の数に 2 を加えた値で、求め方が誤っています。
      - 3 は、if 文だけを数えて 1 を加えた値で、while 文と for 文の判定を数えていません。
      - 4 は判定の数そのもので、1 を加えていません。
    verify:
      value: (2 + 1 + 1) + 1
    terms:
      - サイクロマティック複雑度
  - id: A12-069
    topic: 12-3-7
    diff: 1
    q: プログラムを実行せずにソースコードを解析して，初期化されていない変数の参照や使われていない変数，コーディング規約への違反などを検出する手法はどれか。
    c:
      - 静的解析
      - 動的テスト
      - 負荷テスト
      - 探索的テスト
    a: ア
    exp: |
      静的解析は、プログラムを実行せずに、ソースコードをツールなどで解析して欠陥の可能性がある箇所を検出する手法です。未初期化変数の参照、到達しないコード、規約違反などを、テストより前の段階で効率よく見つけられます。これに対して、プログラムを実際に実行して確認する方法を動的テストといいます。
    why:
      - 正解です。プログラムを実行せずにソースコードを解析します。
      - 動的テストは、プログラムを実際に実行して、その動作を確認する手法です。
      - 負荷テストは、プログラムを実行し、想定を超える負荷をかけてシステムの限界や耐性を確認するテストです。
