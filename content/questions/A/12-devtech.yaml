    c:
      - 下位のモジュールを早い段階で十分にテストできるが，システム全体の処理の流れを確認できるのはテストの後半になる。
      - 結合の順序を考える必要がなく，不具合が見つかったときに原因の箇所を特定しやすい。
      - テストの初期の段階から，システム全体の処理の流れを確認できる。
      - 未完成の下位モジュールの代わりとなるスタブを作成する必要がある。
    a: ア
    exp: |
      ボトムアップテストは、最下位のモジュールから順に上位のモジュールを結合してテストする方法です。上位のモジュールが未完成のときは、ドライバを用いてテスト対象を呼び出します。共通的に使われる下位モジュールを先に十分テストできますが、システム全体の動作は上位のモジュールを結合するまで確認できません。
    why:
      - 正解です。下位を早く十分にテストできるが、全体の確認は後半になります。
      - 結合の順序を考えないのはビッグバンテストですが、一度に結合するため不具合の箇所はかえって特定しにくくなります。
      - 初期の段階から全体の流れを確認できるのは、トップダウンテストの特徴です。
      - ボトムアップテストで必要になるのは上位の代わりのドライバで、スタブはトップダウンテストで用います。
    terms:
      - ボトムアップテスト
      - トップダウンテスト
      - テストドライバ
      - スタブ
      - 統合テスト
  - id: A12-083
    topic:
      - 12-4-5
      - 12-6-1
    diff: 1
    q: 回帰テスト（リグレッションテスト）の目的として，適切なものはどれか。
    c:
      - プログラムの修正や機能追加によって，それまで正しく動作していた部分に悪影響が出ていないことを確認する。
      - 予測できない不正なデータを大量に入力して，脆弱性を検出する。
      - 大量のデータを投入して，システムが処理できる限界を確認する。
      - 発注者が，システムが業務で使用できるかどうかを確認して受け入れる。
    a: ア
    exp: |
      回帰テストは、プログラムを修正したり機能を追加したりしたときに、変更していない部分も含めて、以前と同じように正しく動作することを確認するテストです。修正が思わぬ箇所に影響してデグレード（品質の後退）が起きていないかを調べます。繰り返し実施するため、テストの自動化が効果的です。
    why:
      - 正解です。変更による他の部分への悪影響がないことを確認します。
      - 不正なデータを大量に入力して脆弱性を見つけるのはファジングです。
      - 処理の限界を確認するのは負荷テストです。
      - 発注者が業務で使えるかを確認するのは受入れテストです。
    terms:
      - 回帰テスト
      - 負荷テスト
      - 受入れテスト
      - ファジング
  - id: A12-084
    topic:
      - 12-4-5
      - 12-4-11
    diff: 2
    q: ソフトウェアの検証テストのうち，負荷テストの説明として，適切なものはどれか。
    c:
      - 通常の運用時に想定される処理量で，応答時間やスループットが要件を満たしているかを確認する。
      - 設計時の想定を超えるデータ量やアクセス数などの負荷をかけ，システムが異常停止せずに処理を継続できるかや，処理能力の限界を確認する。
      - テスト担当者がソフトウェアを操作しながら学習し，その結果に基づいて次に行うテストを考えて実行する。
      - 修正による影響が，修正していない部分に及んでいないことを確認する。
    a: イ
    exp: |
      負荷テストは、大量のデータやアクセスなど、想定の上限やそれを超える負荷をかけて、システムが耐えられるか、処理能力の限界はどこか、限界を超えたときに異常停止やデータ破壊が起きないかを確認するテストです。通常の負荷で応答時間などの性能要件を満たすかを確認する性能テストとは目的が異なります。
    why:
      - 通常の処理量で応答時間やスループットを確認するのは性能テストです。
      - 正解です。想定を超える負荷をかけて耐性や限界を確認します。
      - 操作しながら学習して次のテストを考えるのは探索的テストです。
      - 修正の影響が他に及んでいないことを確認するのは回帰テストです。
    terms:
      - 負荷テスト
      - 性能テスト
      - 回帰テスト
      - 探索的テスト
  - id: A12-085
    topic: 12-4-11
    diff: 2
    q: 探索的テストの説明として，適切なものはどれか。
    c:
      - テスト担当者がソフトウェアを操作しながら学習し，テストの設計と実行を同時に進め，結果に応じて次に行うテストを決めていく。
      - ソースコードを実行せずに，ツールで解析して欠陥を検出する。
      - ランダムに生成した大量のデータをツールで自動的に入力し続け，異常な動作を検出する。
      - 事前に作成した詳細なテスト手順書のとおりにテストを実行し，手順にない操作は行わない。
    a: ア
    exp: |
      探索的テストは、テスト担当者の知識や経験を生かし、ソフトウェアを実際に操作して得た情報から次に試すべきテストを考え、テストの設計と実行を並行して進める手法です。事前の設計では想定しにくい不具合の発見に有効で、手順書に基づくテストを補完する目的で使われます。
    why:
      - 正解です。学習・設計・実行を同時に進めます。
      - ソースコードを実行せずに解析するのは静的解析です。
      - ランダムなデータを自動で大量に入力するのはファジングです。
      - 手順書のとおりに実行するのは、事前にテストを設計しておく記述式（スクリプト化された）テストです。
    terms:
      - 探索的テスト
      - ファジング
      - 静的解析
  - id: A12-086
    topic:
      - 12-4-11
      - 12-4-8
    diff: 2
    q: システム検証テスト（システムテスト）の説明として，適切なものはどれか。
    c:
      - 発注者が，システムが業務で使用できることを確認し，受け入れるかどうかを判断する。
      - 個々のモジュールが，モジュールの仕様どおりに動作することを確認する。
      - モジュールを結合し，モジュール間のインタフェースが正しく動作することを確認する。
      - 開発者側が，ソフトウェアやハードウェアなどを統合したシステム全体について，機能要件と非機能要件を含むシステム要件を満たしていることを確認する。
    a: エ
    exp: |
      システム検証テスト（システムテスト、総合テスト）は、開発者側がシステム全体を対象に、システム要件定義で定めた要件をすべて満たしているかを確認するテストです。機能テストのほか、性能テスト、負荷テスト、セキュリティテストなどの非機能要件のテストも行います。
    why:
      - 発注者が業務での使用可否を確認して受け入れるのは受入れテストです。
      - 個々のモジュールを仕様に照らして確認するのは単体テストです。
      - モジュール間のインタフェースを確認するのは統合テスト（結合テスト）です。
      - 正解です。システム全体がシステム要件を満たすことを確認します。
    terms:
      - システムテスト
      - 単体テスト
      - 受入れテスト
      - 統合テスト
      - 非機能要件
  - id: A12-087
    topic: 12-5-5-1
    diff: 1
    q: システム開発を外部に委託した場合の受入れテストについての記述として，適切なものはどれか。
    c:
      - 受入れテストで見つかった不具合は，検収後に修正すればよいので記録しない。
      - 発注者（利用者側）が主体となって，あらかじめ定めた受入れ基準に基づき，システムが要件を満たし業務で利用できるかを確認する。
      - 受注者（開発者側）が主体となって，モジュールの内部構造に着目したテストを行う。
      - 受入れ基準は，テストを実施した後で，その結果を見てから決める。
    a: イ
    exp: |
      受入れテストは、発注者（利用部門など）が主体となって、納入されたシステムが要件を満たしており、実際の業務で使えるかを確認するテストです。合否を判断する受入れ基準は、事前に受注者と合意しておきます。合格すれば検収を行い、不合格の項目は記録して是正を求めます。
    why:
      - 不具合は記録して受注者に是正を求め、修正を確認してから検収します。
      - 正解です。発注者が主体となり、受入れ基準に基づいて確認します。
      - 開発者側が内部構造に着目して行うのは、単体テストなどのホワイトボックステストです。
      - 受入れ基準は事前に定めて合意しておくもので、結果を見てから決めると公正な判定ができません。
    terms:
      - 受入れテスト
      - 検収
      - ホワイトボックステスト
  - id: A12-088
    topic:
      - 12-5-5-1
      - 12-5-2
    diff: 1
    q: システム開発の委託契約における検収の説明として，適切なものはどれか。
    c:
      - 開発に着手する前に，作業範囲と費用を見積もることである。
      - 納品された成果物を発注者が検査し，合格と判断して受け取ることであり，一般に代金を支払う根拠となる。
      - 稼働後に見つかった契約内容との不適合について，受注者が修補などの責任を負うことである。
      - 受注者が開発作業の進捗状況を定期的に発注者へ報告することである。
    a: イ
    exp: |
      検収は、発注者が、納品された成果物を検収基準（受入れ基準）に照らして検査し、合格であれば受け取ることです。検収の完了をもって成果物の引渡しが完了したとし、代金の支払いの根拠とするのが一般的です。
    why:
      - 作業範囲と費用を見積もるのは、契約前の見積りの作業です。
      - 正解です。納品物を検査して受け取ることで、支払いの根拠になります。
      - 不適合について受注者が修補などの責任を負うのは、契約不適合責任です。
      - 進捗状況の報告は、プロジェクトの進捗管理の活動で、検収ではありません。
    terms:
      - 検収
      - 受入れテスト
  - id: A12-089
    topic:
      - 12-5-6-1
      - 12-5-3
    diff: 3
    q: 妥当性確認テストの目的として，適切なものはどれか。
    c:
      - システムやソフトウェアが，実際の利用環境において，利用者が意図する用途や要求を満たしていることを確認する。
      - 開発の初期段階で試作品を作成し，画面のイメージを利用者と共有する。
      - 設計書の記述どおりにプログラムが作られていることを，開発者が確認する。
      - ソースコードのすべての命令が少なくとも1回実行されたことを確認する。
    a: ア
    exp: |
      妥当性確認（バリデーション）は、作られたシステムが、意図された利用環境で、利用者の本来の目的や要求に合っているか（正しいものを作ったか）を確認することです。これに対して検証（ベリフィケーション）は、成果物が仕様や設計どおりに作られているか（正しく作ったか）を確認することです。妥当性確認テストでは、使用性テストやソフトウェアの試行利用などの技法を用います。
    why:
      - 正解です。意図された用途・要求に合っているかを確認します。
      - 試作品で画面イメージを共有するのは、要件定義段階のプロトタイピングです。
      - 設計書どおりに作られているかを確認するのは検証（ベリフィケーション）で、妥当性確認とは区別されます。
      - すべての命令が実行されたかを確認するのは、ホワイトボックステストの命令網羅の基準です。
    terms:
      - 妥当性確認テスト
      - 命令網羅
      - プロトタイピング
      - 使用性
  - id: A12-090
    topic: 12-5-5-4
    diff: 1
    q: 利用者用文書類のうち，ウィザードの説明として，適切なものはどれか。
    c:
      - 操作中の画面から必要な説明を呼び出して表示できる電子的なマニュアル
      - 操作方法を例題に沿って順に学べるように構成した学習用の資料
      - 対話形式で利用者に順に入力や選択を求め，複雑な設定や操作を段階的に完了させる仕組み
      - 利用者からよく寄せられる質問と，その回答をまとめたもの
    a: ウ
    exp: |
      ウィザードは、ソフトウェアのインストールや初期設定などの複雑な操作を、画面の指示に従って質問に答えたり項目を選んだりしながら、1ステップずつ進められるようにする仕組みです。利用者が操作手順を覚えていなくても、作業を正しく完了できます。
    why:
      - 画面から呼び出して表示する電子的なマニュアルは、オンラインヘルプです。
      - 例題に沿って順に学べる資料は、チュートリアル（学習書）です。
      - 正解です。対話形式で段階的に操作を完了させます。
      - よくある質問と回答をまとめたものは、FAQ です。
    terms:
      - 利用者マニュアル
  - id: A12-091
    topic: 12-5-4-1
    diff: 2
    q: システムの導入計画を作成する際に定めておくべき事項として，最も適切なものはどれか。
    c:
      - 各モジュールのサイクロマティック複雑度の上限値
      - 導入の手順と体制，スケジュール，導入の可否を判断する基準，問題が発生した場合の対応方法
      - プログラムで使用する変数の命名規則
      - 各ユーザーストーリーのストーリーポイント
    a: イ
    exp: |
      導入計画では、導入要件や移行要件を踏まえて、導入作業の手順、利用部門・システム運用部門などを含む導入体制、スケジュール、導入可否の判断基準、インストール計画、問題発生時の対応（旧環境への切戻しなど）を定め、関係者の合意を得ます。
    why:
      - サイクロマティック複雑度の上限は、コーディングやコードレビューの品質基準として定めるものです。
      - 正解です。導入の手順・体制・判断基準などを定めます。
      - 変数の命名規則は、コーディング標準で定めるものです。
      - ストーリーポイントは、アジャイル開発でユーザーストーリーの大きさを見積もるものです。
    terms:
      - サイクロマティック複雑度
      - 命名規則
      - ストーリーポイント
  - id: A12-092
    topic: 12-6-3
    diff: 1
    q: 本番稼働中のシステムで，利用者から報告された障害の原因を調べ，プログラムの誤りを修正した。この保守の種類として，適切なものはどれか。
    c:
      - 予防保守
      - 是正保守
      - 適応保守
      - 完全化保守
    a: イ
    exp: |
      JIS X 0161（ISO/IEC 14764）では、ソフトウェア保守を次の4つに分類しています。
      - 是正保守：発見された問題（障害）を訂正するための修正
      - 予防保守：潜在的な欠陥が故障として現れる前に発見して訂正するための修正
      - 適応保守：変化した又は変化している環境でソフトウェアを使えるように保つための修正
      - 完全化保守：性能や保守性の向上など、ソフトウェアを改良するための修正
      報告された障害の誤りを修正するのは是正保守です。
    why:
      - 予防保守は、まだ故障として現れていない潜在的な欠陥を、事前に発見して訂正するものです。
      - 正解です。発見された障害を訂正するのは是正保守です。
      - 適応保守は、OS の更新や法制度の変更など、環境の変化に合わせてソフトウェアを修正するものです。
      - 完全化保守は、性能や保守性などを改善するためにソフトウェアを修正するものです。
    terms:
      - 是正保守
      - 適応保守
      - 完全化保守
      - 予防保守
  - id: A12-093
    topic: 12-6-3
    diff: 2
    q: 稼働中の業務アプリケーションを，サーバの OS のバージョンアップ後も引き続き使用できるように修正した。この保守の種類として，最も適切なものはどれか。
    c:
      - 是正保守
      - 完全化保守
      - 適応保守
      - 予防保守
    a: ウ
    exp: |
      適応保守は、ソフトウェアを取り巻く環境（OS・ミドルウェア・ハードウェアや、業務・制度など）が変化したときに、ソフトウェアをその環境で使い続けられるように修正する保守です。OS のバージョンアップへの対応はその典型例です。
    why:
      - 是正保守は、発見された障害を訂正するための修正で、環境の変化への対応ではありません。
      - 完全化保守は、性能や保守性などを改善するための修正です。
      - 正解です。環境の変化に対応するための修正は適応保守です。
      - 予防保守は、潜在的な欠陥が故障として現れる前に発見して訂正するための修正です。
    terms:
      - 適応保守
      - 是正保守
      - 完全化保守
      - 予防保守
  - id: A12-094
    topic: 12-6-3
    diff: 2
    q: 予防保守の説明として，適切なものはどれか。
    c:
      - 利用者から報告された障害を，報告を受けてから訂正する。
      - 稼働中のソフトウェアに潜在する欠陥を，故障として現れる前に発見して訂正する。
      - 稼働環境の変化に合わせてソフトウェアを修正する。
      - 処理性能や保守性を向上させるためにソフトウェアを修正する。
    a: イ
    exp: |
      予防保守は、運用中に故障として顕在化する前に、ソフトウェアに潜在している欠陥を発見して訂正する保守です。障害が発生してから対応する是正保守と比べて、業務への影響を未然に防げます。
    why:
      - 報告された障害を訂正するのは是正保守です。
      - 正解です。潜在的な欠陥を故障の前に訂正します。
      - 環境の変化に合わせて修正するのは適応保守です。
      - 性能や保守性を向上させるための修正は完全化保守です。
    terms:
      - 予防保守
      - 是正保守
      - 適応保守
      - 完全化保守
  - id: A12-095
    topic:
      - 12-6-1
      - 12-6-3
    diff: 1
    q: リファクタリングの説明として，適切なものはどれか。
    c:
      - 利用者の要望に応じて，ソフトウェアに新しい機能を追加する。
      - 既存のプログラムを解析して，その仕様や設計の情報を導き出す。
      - ソフトウェアの外部から見た動作を変えずに，内部の構造を改善して，理解しやすく変更しやすいものにする。
      - 旧システムのデータを，新システムのデータ形式に変換して移す。
    a: ウ
    exp: |
      リファクタリングは、プログラムの外部仕様（入力に対する出力などの振る舞い）を変えずに、重複したコードの共通化、長いメソッドの分割、分かりやすい名前への変更などによって内部構造を改善することです。保守性が向上し、その後の機能追加や修正がしやすくなります。振る舞いが変わっていないことは回帰テストで確認します。
    why:
      - 新しい機能の追加は外部から見た動作が変わるので、リファクタリングではありません。
      - 既存のプログラムから仕様や設計を導き出すのは、リバースエンジニアリングです。
      - 正解です。外部から見た動作を変えずに内部構造を改善します。
      - データ形式を変換して移すのは、システム移行におけるデータ移行の作業です。
    terms:
      - リファクタリング
      - リバースエンジニアリング
      - 回帰テスト
      - システム移行
  - id: A12-096
    topic: 12-6-1
    diff: 2
    q: 設計書が残っていない既存システムを再構築するにあたり，既存のソースコードやデータベースの定義を解析して，プログラムの仕様や設計の情報を導き出す手法はどれか。
    c:
      - リファクタリング
      - フォワードエンジニアリング
      - プロトタイピング
      - リバースエンジニアリング
    a: エ
    exp: |
      リバースエンジニアリングは、既存のソフトウェアのソースコードや実行形式、データ定義などを解析して、その仕様や設計の情報を明らかにする手法です。保守や再構築（リエンジニアリング）の際に、失われた設計情報を復元するために用います。なお、市販ソフトウェアのリバースエンジニアリングは、使用許諾契約で制限されている場合があります。
    why:
      - リファクタリングは、外部から見た動作を変えずに内部構造を改善することです。
      - フォワードエンジニアリングは、仕様や設計からプログラムを作成する通常の方向の開発で、逆方向の解析ではありません。
      - プロトタイピングは、試作品を作成して利用者に評価してもらい、要求を明確にする手法です。
      - 正解です。既存のソフトウェアから仕様や設計を導き出します。
    terms:
      - リバースエンジニアリング
      - リファクタリング
      - プロトタイピング
  - id: A12-097
    topic:
      - 12-6-4-6
      - 12-6-5
    diff: 2
    q: 新システムへの移行方式のうち，並行運用（並行移行）の特徴として，適切なものはどれか。
    c:
      - 業務やサブシステムの単位で，順番に新システムへ切り替えていく。
      - ある時点で旧システムを停止して新システムへ一度に切り替えるので，移行の手間は少ないが，問題が発生したときの影響が大きい。
      - 一部の部門や拠点で先に新システムを稼働させ，問題がないことを確認してから全体に展開する。
      - 新旧のシステムを一定期間同時に稼働させて結果を照合するので，新システムに問題があっても業務への影響を抑えられるが，運用の負担や費用が増える。
    a: エ
    exp: |
      並行運用（並行移行）は、新システムの稼働後もしばらく旧システムを並行して動かし、両者の処理結果を比較しながら移行する方式です。新システムに問題があっても旧システムで業務を続けられるため安全性が高い反面、二重の入力や運用が必要になり、負担や費用が大きくなります。
    why:
      - 業務などの単位で順に切り替えるのは段階移行です。
      - 一度に切り替えるのは一斉移行（一括移行）です。
      - 一部の部門で先行稼働させてから展開するのはパイロット移行です。
      - 正解です。新旧を並行稼働させ、安全だが負担が大きい方式です。
    terms:
      - システム移行
  - id: A12-098
    topic: 12-6-4-6
    diff: 2
    q: システムの移行作業の進め方として，適切なものはどれか。
    c:
      - 移行のスケジュールは利用部門には知らせず，開発部門の中だけで管理する。
      - 移行計画を文書化して関係者に通知し，移行後は結果を検証して評価するとともに，旧環境のデータを必要な期間保持して安全に管理する。
      - 移行作業の開始と同時に，旧環境のデータをすべて消去する。
      - 移行の結果は，本番稼働後に障害が発生したときにだけ確認する。
    a: イ
    exp: |
      移行では、移行計画を文書化して検証し、関係者全員に移行計画や移行の実施を通知します。必要に応じて新旧環境を並行運用したうえで旧環境を停止し、移行結果を検証・評価します。旧環境に関連するデータは、後で参照が必要になる場合に備えて保持し、安全性を確保します。
    why:
      - 利用部門も移行の影響を受けるため、移行計画は関係者全員に通知します。
      - 正解です。計画の文書化・通知、結果の検証、旧データの保持を行います。
      - 旧環境のデータは、移行の失敗や後日の参照に備えて保持すべきで、移行開始と同時に消去してはいけません。
      - 移行の結果は、障害の有無にかかわらず移行後に検証し、評価します。
    terms:
      - システム移行
  - id: A12-099
    topic: 12-6-5
    diff: 2
    q: 稼働中のシステムを廃棄する際の作業として，適切なものはどれか。
    c:
      - 記憶媒体は，データを消去せずにそのまま廃棄物として処分する。
      - 廃棄するシステムのデータは，法令などで定められた保存期間にかかわらず，直ちにすべて消去する。
      - 利用者への事前の通知は不要であり，システムを停止した後で廃棄したことを知らせればよい。
      - 廃棄計画を立案して利用者に通知し，必要に応じて新旧環境の並行運用と利用者の教育訓練を行い，廃棄後も必要なデータを保持してアクセスできるようにしておく。
    a: エ
    exp: |
      システムの廃棄では、廃棄計画を立案して利用者に通知し、代わりのシステムがある場合は新旧環境の並行運用や利用者の教育訓練を行います。廃棄後も、監査や法令で必要なデータは保持し、アクセスできるようにしておきます。記憶媒体は、データを完全に消去するか物理的に破壊してから処分します。
    why:
      - データを消去せずに媒体を処分すると情報漏えいにつながるため、完全消去や物理的な破壊を行います。
      - 法令などで保存期間が定められたデータは、廃棄後も保持してアクセスできるようにしておく必要があります。
      - 利用者の業務に影響するため、廃棄計画は事前に利用者に通知します。
      - 正解です。計画・通知・並行運用と教育訓練・データ保持を行います。
    terms:
      - システム移行
  - id: A12-100
    topic:
      - 12-2-6-3
      - 12-2-6-4
    diff: 1
    q: ブラックボックステストの説明として，適切なものはどれか。
    c:
      - プログラムを実行せずに，ソースコードを目視やツールで検査する。
      - 意図的にエラーを埋め込んでテストし，テストの十分さを評価する。
      - プログラムの内部構造を考慮せず，仕様に基づいて入力と出力の関係が正しいかを確認する。
      - プログラムの内部構造に着目し，命令や分岐が実行されるようにテストケースを設計する。
    a: ウ
    exp: |
      ブラックボックステストは、プログラムを中身の見えない箱とみなし、外部仕様に基づいて、入力に対して期待どおりの出力が得られるかを確認するテストです。テストケースの設計には、同値分割、限界値分析、原因結果グラフ、実験計画法などを用います。主にソフトウェア統合テストやシステムテストで使われます。
    why:
      - プログラムを実行せずに検査するのは、レビューや静的解析です。
      - 意図的にエラーを埋め込んでテストの十分さや残存エラー数を評価するのは、エラー埋込法です。
      - 正解です。内部構造を考慮せず、仕様に基づいて入出力を確認します。
      - 内部構造に着目して命令や分岐を網羅するのは、ホワイトボックステストです。
    terms:
      - ブラックボックステスト
      - ホワイトボックステスト
      - 静的解析
      - エラー埋込法
  - id: A12-101
    topic: 12-2-6-3
    diff: 2
    q: ソフトウェアユニットのテストに用いるホワイトボックステストの説明として，適切なものはどれか。
    c:
      - 内部構造を考慮せずに，同値分割や限界値分析によって外部仕様からテストケースを設計する。
      - 利用者が実際の業務の手順に沿って操作し，使い勝手を評価する。
      - 想定を超える量のデータを投入して，処理能力の限界を確認する。
      - プログラムの内部の論理構造に基づいてテストケースを設計し，命令や分岐，条件がどの程度実行されたかを網羅率で評価する。
    a: エ
    exp: |
      ホワイトボックステストは、プログラムの内部構造（制御の流れや条件）を把握したうえでテストケースを設計する方法です。命令網羅、判定条件網羅（分岐網羅）、条件網羅、複数条件網羅などの基準を定め、その網羅率（カバレッジ）でテストの十分さを評価します。主に単体テストで用います。
    why:
      - 外部仕様からテストケースを設計するのは、ブラックボックステストです。
      - 利用者が実際の手順で使い勝手を評価するのは、使用性テスト（ユーザビリティテスト）です。
      - 処理能力の限界を確認するのは、負荷テストです。
      - 正解です。内部構造に基づいて設計し、網羅率で評価します。
    terms:
      - ホワイトボックステスト
      - ブラックボックステスト
      - ユーザビリティテスト
      - 負荷テスト
      - 命令網羅
  - id: A12-102
    topic: 12-2-2-5
    diff: 2
    q: システム処理方式のうち，クライアントサーバシステムと比較した Web システムの特徴として，適切なものはどれか。
    c:
      - サーバを使わずに，各端末が単独で処理を完結させる。
      - 利用者の端末には Web ブラウザがあればよく，業務アプリケーションの更新はサーバ側だけで済むので，クライアントへの配布の手間が少ない。
      - 1台のホストコンピュータに専用端末を接続し，すべての処理をホストで行う。
      - 業務アプリケーションを各クライアントにインストールする必要があり，更新のたびにすべてのクライアントへの配布作業が必要になる。
    a: イ
    exp: |
      Web システムは、クライアント側の Web ブラウザから HTTP でサーバにアクセスし、処理の多くをサーバ側で行う方式です。専用のクライアントアプリケーションを各端末に導入するクライアントサーバシステムと比べて、アプリケーションの配布や更新の手間が少なく、利用者の端末の種類にも依存しにくいのが特徴です。
    why:
      - 各端末が単独で処理を完結させるのはスタンドアロンの形態で、Web システムではありません。
      - 正解です。端末にはブラウザがあればよく、更新はサーバ側で済みます。
      - 1台のホストに専用端末を接続してすべての処理を行うのは、集中処理（ホスト集中型）の形態です。
      - 各クライアントにアプリケーションを導入して配布するのは、従来型のクライアントサーバシステムの特徴です。
    terms:
      - Webシステム
      - クライアントサーバシステム
      - 集中処理
