    q: レビュー手法のうち，インスペクションの説明として，適切なものはどれか。
    c:
      - 成果物の作成者自身が主催し，参加者に成果物の内容を説明しながら問題点の指摘を受ける。
      - モデレーターと呼ばれる進行役が主導し，参加者の役割や手順，チェックリストなどを定めて公式に実施し，指摘した欠陥は修正の完了まで追跡する。
      - 参加者が持ち回りでレビューの責任者を務めながら，順に成果物をレビューする。
      - 成果物の作成者が，自分一人で机上で成果物を見直す。
    a: イ
    exp: |
      インスペクションは、訓練を受けたモデレーター（進行役）が主導し、作成者、読み手、記録係、検査者などの役割を決め、事前の準備、会議、修正、修正確認（フォローアップ）という手順を踏んで公式に行うレビューです。チェックリストなどを使って欠陥を体系的に検出し、結果を記録してプロセスの改善にも活用します。
    why:
      - 作成者が主催し、説明しながら指摘を受けるのはウォークスルーです。
      - 正解です。モデレーターが主導し、公式な手順で実施します。
      - 参加者が持ち回りで責任者を務めるのはラウンドロビンレビューです。
      - 作成者が一人で見直すのはデスクチェック（自己レビュー）で、複数人で行うインスペクションではありません。
    terms:
      - インスペクション
      - ウォークスルー
  - id: A12-061
    topic: 12-2-15
    diff: 2
    q: 設計書のレビュー会議の運営方法として，最も適切なものはどれか。
    c:
      - 会議では欠陥の指摘に集中し，修正方法の詳細な検討は会議の後で作成者が行う。
      - 参加者は会議の場で初めて資料を読み，その場で気付いた点を指摘する。
      - 指摘された欠陥の数を，作成者の人事評価に直接反映させる。
      - 時間を節約するため，指摘事項は記録せず，口頭で伝えるだけにする。
    a: ア
    exp: |
      レビューの目的は、成果物の欠陥をできるだけ早く、多く見つけることです。会議の時間を有効に使うため、その場では欠陥の指摘に集中し、修正方法の詳しい検討は作成者が後で行います。参加者は事前に資料を読んで準備し、指摘事項は記録して修正を確認します。また、レビューの結果を作成者の評価に使うと欠陥を隠す動機が生まれるため避けます。
    why:
      - 正解です。会議では欠陥の指摘に集中します。
      - 事前に資料を読まないと、限られた時間で十分な指摘ができません。参加者は事前に準備します。
      - 欠陥の数を人事評価に使うと、作成者が欠陥を隠したり指摘をためらったりするようになり、レビューの効果が下がります。
      - 指摘事項を記録しないと、修正漏れや修正の確認ができなくなります。
    terms:
      - インスペクション
  - id: A12-062
    topic:
