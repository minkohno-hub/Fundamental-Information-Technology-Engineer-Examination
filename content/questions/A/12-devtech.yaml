    q: |
      次のプログラムについて，命令網羅と判定条件網羅（分岐網羅）をそれぞれ満たすために必要な最小のテストケース数の組合せとして，適切なものはどれか。ここで，x と y の値は互いに独立に設定できるものとする。

      ```
      if (x > 0)
        a ← a + 1
      endif
      if (y > 0)
        b ← b + 1
      endif
      ```
    c:
      - 命令網羅 2，判定条件網羅 2
      - 命令網羅 1，判定条件網羅 4
      - 命令網羅 1，判定条件網羅 2
      - 命令網羅 2，判定条件網羅 4
    a: ウ
    exp: |
      - 命令網羅：すべての命令を少なくとも1回実行すればよいので、x > 0 かつ y > 0 となる1ケースで、2つの代入文がどちらも実行されます。
      - 判定条件網羅：各判定の結果が真と偽の両方になる必要があります。（x > 0，y > 0）と（x ≦ 0，y ≦ 0）の2ケースで、2つの判定がそれぞれ真と偽になります。
      4ケースは、真偽の全組合せ（すべての経路）を通す場合の数で、判定条件網羅の最小数ではありません。
    why:
      - 命令網羅は、両方の判定が真になる1ケースで全命令を実行できます。
      - 判定条件網羅は、各判定が真と偽になればよく、全組合せの4ケースは必要ありません。
      - 正解です。命令網羅は1ケース、判定条件網羅は2ケースで満たせます。
      - 命令網羅は1ケース、判定条件網羅は2ケースで満たせるので、どちらも多すぎます。
    verify:
      manual: 命令網羅は(x>0,y>0)の1ケースで全命令を実行。判定条件網羅は(x>0,y>0)と(x≤0,y≤0)の2ケースで2つの判定がそれぞれ真偽になる。全経路は2×2=4 で最小数ではないことを確認
    terms:
      - 命令網羅
