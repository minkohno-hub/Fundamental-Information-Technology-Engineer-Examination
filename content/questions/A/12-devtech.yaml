category: '12'
reviewed:
  at: '2026-10-21'
  method: 作成後の逐問レビュー（シラバスVer.9.2の用語例、JIS X 25010・JIS X 0161・GoF デザインパターンなどの定義と照合、計算問題は検算式で独立に再計算し、テストケース数は手順を記録）
questions:
  - id: A12-001
    topic: 12-1-2-5
    diff: 1
    q: システムに対する要求のうち，非機能要件に該当するものはどれか。
    c:
      - 会員登録時に，入力された郵便番号から住所を補完する。
      - 通常時のオンライン処理の応答時間を3秒以内とする。
      - 月末に顧客ごとの請求書を作成して印刷する。
      - 受注データを入力すると，在庫を自動的に引き当てる。
    a: イ
    exp: |
      非機能要件は、システムが「何をするか」（業務機能）以外の要件で、性能（応答時間・スループット）、信頼性、セキュリティ、運用性、保守性、移行性などの品質や制約に関するものです。応答時間を3秒以内とするのは性能に関する要件なので、非機能要件に該当します。
    why:
      - 住所の補完は、画面の入力時にシステムが行う処理なので機能要件です。
      - 正解です。応答時間は性能に関する非機能要件です。
      - 請求書の作成・印刷は、システムが提供する業務機能なので機能要件です。
      - 在庫の自動引当ては、システムが実行する業務処理の内容なので機能要件です。
    know: 機能要件は「システムで何ができるか」、非機能要件は「どのくらいの品質・条件で動くか」と覚えると区別しやすくなります。
    terms:
      - 非機能要件
      - 機能要件
  - id: A12-002
    topic: 12-1-1
    diff: 2
    q: システム要件定義のタスクとして，適切なものはどれか。
    c:
      - 完成したシステムを本番環境に設置し，利用者に操作方法を教育する。
      - ソフトウェアユニットごとにソースコードを作成し，単体テストを行う。
      - システムに求められる機能や性能，運用・保守などの要件を明確にし，利害関係者と合意して文書化する。
      - 要件を実現する手段を，ハードウェア，ソフトウェア及び手作業に割り当ててシステムの構成を決める。
    a: ウ
    exp: |
      システム要件定義では、システム化の目標と対象範囲を定め、システムの機能及び能力（応答時間・スループットなど）、業務・組織及び利用者の要件（セキュリティ、移行、運用、保守など）を明確にします。定義した要件は利害関係者のレビューを受けて合意し、文書化します。
    why:
      - 本番環境への設置や利用者教育は、導入のタスクです。
      - ソースコードの作成と単体テストは、実装（ソフトウェア構築）のタスクです。
      - 正解です。要件を明確にし、合意して文書化するのが要件定義のタスクです。
      - 要件をハードウェア・ソフトウェア・手作業に割り当てるのは、システム設計（システム方式設計）のタスクです。
    terms:
      - 要件定義
      - 単体テスト
  - id: A12-003
    topic:
      - 12-1-3
      - 12-1-6
    diff: 2
    q: 要件定義書と設計書の間で双方向の追跡可能性（トレーサビリティ）を確保することによって得られる効果として，最も適切なものはどれか。
    c:
      - 設計書を作成しなくても，要件定義書から直接コーディングに着手できる。
      - 開発に用いるプログラム言語の実行速度が向上する。
      - 要件の変更が開発の途中で発生しなくなる。
      - 要件が設計に漏れなく反映されているか，また，設計の各要素がどの要件に基づくものかを確認できる。
    a: エ
    exp: |
      双方向の追跡可能性（トレーサビリティ）とは、上流の成果物（要件）から下流の成果物（設計・プログラム・テスト）へ、また下流から上流へと対応関係をたどれることです。要件から設計をたどれば反映漏れが分かり、設計から要件をたどれば根拠のない設計（不要な機能）が分かります。要件変更時の影響範囲の把握にも役立ちます。
    why:
      - トレーサビリティは成果物間の対応関係をたどれるようにすることで、設計書の作成を省略するものではありません。
      - 成果物の対応関係を管理しても、プログラムの実行速度には影響しません。
      - 要件の変更が起きなくなるわけではなく、変更が起きたときに影響範囲を調べやすくなります。
      - 正解です。上流から下流、下流から上流の両方向に対応を確認できます。
    terms:
      - トレーサビリティ
      - 要件定義
  - id: A12-004
    topic: 12-1-6
    diff: 2
    q: 要件と，それを実現する設計項目やテストケースとの対応関係を表形式で整理し，要件の実装漏れやテスト漏れを確認するために用いるものはどれか。
    c:
      - WBS
      - ガントチャート
      - トレーサビリティマトリクス
      - 決定表
    a: ウ
    exp: |
      トレーサビリティマトリクスは、行に要件、列に設計項目やテストケースなどをとり、対応する箇所に印を付けた表です。どの設計やテストにも対応しない要件があれば、実装漏れやテスト漏れが分かります。双方向の追跡可能性を確認するための代表的な手段です。
    why:
      - WBS は、プロジェクトの作業を階層的に分解して作業範囲を明確にするものです。
      - ガントチャートは、作業ごとの日程を横棒で表した工程表です。
      - 正解です。要件と設計・テストの対応を表で管理します。
      - 決定表は、条件の組合せとそれに対応する動作を表形式で整理したものです。
    terms:
      - トレーサビリティ
      - 決定表
  - id: A12-005
    topic: 12-1-7-1
    diff: 1
    q: 業務要件を把握するためのヒアリングの進め方として，適切なものはどれか。
    c:
      - 業務を実際に担当している者には聞かず，上位の管理者だけから話を聞く。
      - 回答の内容は聞き手が記憶しておき，議事録は作成しない。
      - 相手の負担を減らすため，質問事項は事前に伝えず，その場で思いついた順に質問する。
      - 事前にヒアリング計画を立てて目的や質問事項を相手に伝えておき，終了後は議事録を作成して内容を相手に確認してもらう。
    a: エ
    exp: |
      ヒアリングは、利用者や業務担当者から要求や現状の問題点を聞き取る手法です。事前に目的・対象者・質問事項などのヒアリング計画を立て、相手に準備してもらうと効率よく必要な情報が得られます。終了後は議事録を作成し、相手に確認してもらって認識の食い違いを防ぎます。
    why:
      - 管理者だけでは現場の業務の詳細や問題点を把握できないため、実際の担当者からも聞くべきです。
      - 議事録を作成しないと、後で内容を確認できず、認識の食い違いや聞き漏れに気付けません。
      - 質問事項を事前に伝えないと、相手が資料や回答を準備できず、聞き漏れや不正確な回答が増えます。
      - 正解です。計画的に準備し、議事録で内容を確認します。
    terms:
      - ヒアリング
  - id: A12-006
    topic: 12-1-7-2
    diff: 1
    q: ユースケース図におけるアクターの説明として，適切なものはどれか。
    c:
      - システム内部のクラス間の継承関係
      - システムの外部にあって，システムとやり取りする利用者や外部システムなどの役割
      - システムが利用者に提供する機能のひとまとまり
      - 1つのオブジェクトがとる状態とその遷移
    a: イ
    exp: |
      ユースケース図は、システムが提供する機能（ユースケース）と、それを利用する外部の存在（アクター）との関係を表す UML の図です。アクターは人型の記号で表し、特定の個人ではなく「顧客」「店員」「決済システム」のような役割を表します。人だけでなく外部のシステムや装置もアクターになります。
    why:
      - クラス間の継承関係（汎化）はクラス図で表します。
      - 正解です。アクターはシステム外部の利用者や外部システムの役割です。
      - システムが提供する機能のまとまりはユースケースで、楕円で表します。
      - オブジェクトの状態と遷移はステートマシン図で表します。
    terms:
      - ユースケース
      - ユースケース図
      - ステートマシン図
  - id: A12-007
    topic: 12-1-7-3
    diff: 1
    q: 要件定義の段階でプロトタイプを作成する主な目的として，適切なものはどれか。
    c:
      - 既存のソースコードを解析して，設計情報を復元する。
      - 本番稼働するシステムを最初に完成させて，テスト工程を省略する。
      - 画面などの試作品を利用者に実際に操作してもらい，要求の誤解や漏れを早い段階で発見する。
      - 大量のデータを投入して，システムが処理できる限界を測定する。
    a: ウ
    exp: |
      プロトタイプ（試作品）を作成して利用者に評価してもらうと、文書だけでは伝わりにくい画面の操作性や機能のイメージを確認でき、要求の誤解や漏れを早い段階で発見できます。このような進め方をプロトタイピングといい、画面の見た目だけを作った模型はモックアップと呼ばれます。
    why:
      - ソースコードを解析して設計情報を導き出すのは、リバースエンジニアリングです。
      - プロトタイプは要求を確認するための試作品で、テストを省略するためのものではありません。
      - 正解です。試作品で要求を確認し、誤解や漏れを早く見つけます。
      - 処理の限界を測定するのは、負荷テストです。
    terms:
      - プロトタイピング
      - リバースエンジニアリング
      - 負荷テスト
  - id: A12-008
    topic: 12-1-7-4
    diff: 2
    q: DFD（Data Flow Diagram）の基本的な構成要素に含まれないものはどれか。
    c:
      - データの流れを示すデータフロー
      - 処理の実行順序や分岐の条件を示す制御の流れ
      - データを加工・変換するプロセス
      - データを蓄積するデータストア
    a: イ
    exp: |
      DFD は、データの流れに着目して業務やシステムを表す図で、次の4つの要素で構成されます。
      - データフロー（矢印）：データの流れ
      - プロセス（円）：データの加工・変換
      - データストア（二本線）：データの蓄積（ファイルなど）
      - 外部実体（源泉・吸収、四角形）：データの発生源や行き先
      DFD は処理の実行順序や分岐の条件などの制御の流れは表しません。
    why:
      - データフローは DFD の構成要素で、矢印でデータの流れを表します。
      - 正解です。DFD では制御の流れ（順序や分岐条件）は表しません。
      - プロセスは DFD の構成要素で、データを加工・変換する処理を表します。
      - データストアは DFD の構成要素で、ファイルなどのデータの蓄積を表します。
    terms:
      - DFD
  - id: A12-009
    topic: 12-1-7-4
    diff: 1
    q: 業務分析に用いる図のうち，DFD の特徴として，適切なものはどれか。
    c:
      - 業務におけるデータの流れと処理に着目して表し，処理の実行順序や分岐の条件は表さない。
      - 条件の組合せとそれに対応する動作を表形式で表す。
      - 実体（エンティティ）と実体間の関連によって，データの構造を表す。
      - 時間の経過に沿って，オブジェクト間のメッセージのやり取りを表す。
    a: ア
    exp: |
      DFD（データフロー図）は、業務やシステムを「データがどこから来て、どの処理で変換され、どこに蓄えられ、どこへ出ていくか」という観点で表す図です。現状の業務を分析したり、新しいシステムの機能を整理したりするのに使います。制御の流れは表さない点が流れ図と異なります。
    why:
      - 正解です。データの流れと処理を表し、制御の流れは表しません。
      - 条件の組合せと動作を表形式で表すのは決定表（デシジョンテーブル）です。
      - 実体と関連でデータ構造を表すのは E-R 図です。
      - 時間の経過に沿ってメッセージのやり取りを表すのは UML のシーケンス図です。
    terms:
      - DFD
      - E-R図
      - シーケンス図
      - 決定表
  - id: A12-010
    topic:
      - 12-1-7-5
      - 12-2-9-2
    diff: 1
    q: 要件定義やデータベースの概念設計で E-R 図を用いる目的として，適切なものはどれか。
    c:
      - 処理量からシステムの応答時間を見積もる。
      - プログラムの処理手順を，順次・選択・繰返しの構造で表す。
      - 対象業務で扱うデータを実体と関連で表し，データの構造を明確にする。
      - システムの機能を，利用者の視点からアクターとの関係で表す。
    a: ウ
    exp: |
      E-R 図は、業務で扱う対象を実体（エンティティ）、実体どうしの結び付きを関連（リレーションシップ）として表し、多重度（1対多など）も示します。特定の DBMS に依存しない概念データモデルを作成し、データの構造を関係者で確認するために用います。
    why:
      - 応答時間の見積りは性能評価の作業で、E-R 図の目的ではありません。
      - 処理手順を順次・選択・繰返しで表すのは、流れ図や NS 図です。
      - 正解です。実体と関連でデータの構造を表します。
      - 利用者の視点でシステムの機能を表すのは、ユースケース図です。
    terms:
      - E-R図
      - NS図
      - ユースケース図
  - id: A12-011
    topic: 12-1-7-6
    diff: 1
    q: UML の図のうち，1つのオブジェクトが外部からのイベントに応じてどのような状態をとり，どのように遷移するかを表すものはどれか。
    c:
      - ステートマシン図
      - クラス図
      - ユースケース図
      - 配置図
    a: ア
    exp: |
      ステートマシン図は、オブジェクトがとりうる状態と、イベントによる状態の遷移を表す UML の振る舞い図です。例えば、注文オブジェクトが「受付済」「出荷済」「完了」「キャンセル」とどのように状態を変えるかを表します。
    why:
      - 正解です。オブジェクトの状態とイベントによる遷移を表します。
      - クラス図は、クラスの属性・操作とクラス間の関係という静的な構造を表します。
      - ユースケース図は、システムの機能とそれを利用するアクターの関係を表します。
      - 配置図は、ハードウェア（ノード）とその上に配置されるソフトウェアの構成を表します。
    terms:
      - ステートマシン図
      - クラス図
      - ユースケース図
      - 配置図
  - id: A12-012
    topic: 12-1-7-6
    diff: 2
    q: 業務の処理の流れを表すために用いる UML の図で，処理（アクション）の順序や分岐，並行処理を表すことができ，スイムレーンによって処理の担当者を区別することもできるものはどれか。
    c:
      - パッケージ図
      - アクティビティ図
      - オブジェクト図
      - コミュニケーション図
    a: イ
    exp: |
      アクティビティ図は、処理（アクション）の流れを表す UML の図で、開始・終了、分岐と合流、フォーク（並行処理の開始）とジョイン（同期）を表せます。スイムレーン（区画）を使って、どの担当者や部門がどの処理を行うかを示すこともでき、業務フローの記述によく使われます。
    why:
      - パッケージ図は、モデル要素をグループ（パッケージ）にまとめ、その依存関係を表します。
      - 正解です。処理の流れ・分岐・並行処理を表し、スイムレーンも使えます。
      - オブジェクト図は、ある時点におけるオブジェクト（インスタンス）とその間のリンクを表します。
      - コミュニケーション図は、オブジェクト間のリンクと、やり取りされるメッセージを表します。
    terms:
      - アクティビティ図
      - コミュニケーション図
      - オブジェクト図
      - パッケージ図
  - id: A12-013
    topic: 12-1-7-6
    diff: 2
    q: UML のコミュニケーション図の説明として，適切なものはどれか。
    c:
      - オブジェクト間のメッセージを，縦方向を時間軸として時系列に沿って表す。
      - オブジェクト間の接続関係（リンク）に着目し，やり取りされるメッセージを順序を示す番号付きで表す。
      - クラスの属性と操作，及びクラス間の関連を表す。
      - システムの機能と，それを利用するアクターとの関係を表す。
    a: イ
    exp: |
      コミュニケーション図は、相互作用図の一つで、オブジェクトをリンクで結び、リンクに沿ってやり取りされるメッセージを「1:」「2:」のような番号で順序付けて表します。オブジェクト間の構造的なつながりが分かりやすいのが特徴です。同じ相互作用を時間軸で表すとシーケンス図になります。
    why:
      - 時間軸に沿ってメッセージを表すのはシーケンス図です。
      - 正解です。リンクに着目し、番号でメッセージの順序を示します。
      - クラスの属性・操作と関連を表すのはクラス図です。
      - システムの機能とアクターの関係を表すのはユースケース図です。
    terms:
      - コミュニケーション図
      - シーケンス図
      - クラス図
      - ユースケース図
  - id: A12-014
    topic: 12-1-7-6
    diff: 2
    q: UML のパッケージ図の用途として，適切なものはどれか。
    c:
      - ハードウェア（ノード）へのソフトウェアの配置を表す。
      - 1つのオブジェクトの状態の遷移を表す。
      - ある時点におけるオブジェクトとその間のリンクを表す。
      - クラスなどのモデル要素をグループにまとめ，グループ間の依存関係を表す。
    a: エ
    exp: |
      パッケージ図は、クラスなどのモデル要素をパッケージ（フォルダ形の記号）にまとめ、パッケージ間の依存関係を表す UML の構造図です。大規模なシステムを構成するサブシステムや層の関係を整理するのに使います。
    why:
      - ハードウェアへのソフトウェアの配置を表すのは配置図です。
      - オブジェクトの状態の遷移を表すのはステートマシン図です。
      - ある時点のオブジェクトとリンクを表すのはオブジェクト図です。
      - 正解です。モデル要素をまとめたパッケージと、その依存関係を表します。
    terms:
      - パッケージ図
      - 配置図
      - ステートマシン図
      - オブジェクト図
  - id: A12-015
    topic: 12-1-7-6
    diff: 2
    q: UML のクラス図で，関連の端に記述し，関連先のクラスがその関連においてどのような役割を果たすかを示すものはどれか。
    c:
      - ロール名
      - 属性
      - 操作
      - 多重度
    a: ア
    exp: |
      クラス図の関連の端には、ロール名（役割名）と多重度を記述できます。例えば「社員」と「部署」の関連で、社員側に「所属員」、部署側に「所属先」と書けば、それぞれが関連の中で果たす役割が分かります。クラス自体は、クラス名・属性・操作の3つの区画で表します。
    why:
      - 正解です。ロール名は関連におけるクラスの役割を示します。
      - 属性は、クラスの2段目の区画に記述する、そのクラスがもつデータです。
      - 操作は、クラスの3段目の区画に記述する、そのクラスがもつ振る舞い（メソッド）です。
      - 多重度は、関連の端に記述して、相手のクラスのインスタンスがいくつ対応するか（1、0..1、* など）を示します。
    terms:
      - クラス図
  - id: A12-016
    topic: 12-1-7-6
    diff: 1
    q: UML のクラス図で，関連の端に「1..*」と記述されている場合の意味として，適切なものはどれか。
    c:
      - 0又は1
      - 0以上（上限なし）
      - 1以上（上限なし）
      - ちょうど1
    a: ウ
    exp: |
      多重度は「下限..上限」の形式で書き、「*」は上限がないことを表します。「1..*」は1以上（少なくとも1つ）、「0..1」は0又は1、「0..*」又は「*」は0以上、「1」はちょうど1を表します。
    why:
      - 0又は1の場合は「0..1」と記述します。
      - 0以上の場合は「0..*」又は「*」と記述します。
      - 正解です。下限が1で、上限がありません。
      - ちょうど1の場合は「1」と記述します。
    terms:
      - クラス図
  - id: A12-017
    topic: 12-1-7-7
    diff: 1
    q: アジャイル開発で用いられるユーザーストーリーの説明として，適切なものはどれか。
    c:
      - 利用者の立場から，誰が，何のために，何をしたいかを簡潔な文で表した要求の記述
      - 開発者が作成するプログラムの詳細な処理手順書
      - テスト工程で発見したバグの一覧表
      - システム障害の発生時における連絡手順をまとめた文書
    a: ア
    exp: |
      ユーザーストーリーは、「〈利用者〉として、〈目的〉のために、〈機能〉がほしい」のような形式で、利用者にとっての価値を短い文で表した要求です。詳細は開発チームとプロダクトオーナーなどの会話で明確にし、完成を判断するための受入れ基準を付けます。ユーザーストーリーはプロダクトバックログの項目として優先順位付けされます。
    why:
      - 正解です。利用者の視点で、誰が・何のために・何をしたいかを表します。
      - 詳細な処理手順書は、モジュールの内部設計の成果物で、利用者視点の要求ではありません。
      - 発見したバグの一覧は、テスト工程の障害管理の記録です。
      - 障害時の連絡手順は、運用の手順書に記載する内容です。
    terms:
      - ユーザーストーリー
  - id: A12-018
    topic: 12-1-7-7
    diff: 2
    q: ストーリーポイントの説明として，適切なものはどれか。
    c:
      - ユーザーストーリーごとの業務上の重要度を表す優先順位
      - ユーザーストーリーの実現に要する作業時間を，時間単位で正確に見積もったもの
      - ユーザーストーリーを実現する作業の大きさを，規模や複雑さ，不確実性などを考慮して，ストーリー間の相対的な値で見積もったもの
      - 完成したソフトウェアのソースコードの行数
    a: ウ
    exp: |
      ストーリーポイントは、ユーザーストーリーの大きさを、基準とするストーリーとの比較で相対的に見積もった値です。時間ではなく、作業量・複雑さ・不確実性をまとめて表します。1、2、3、5、8 のようなフィボナッチ数列に近い値を使い、チームでプランニングポーカーを行って決めることがあります。
    why:
      - 業務上の重要度に基づく優先順位は、プロダクトバックログの並び順で表すもので、ストーリーポイントではありません。
      - ストーリーポイントは時間単位の見積りではなく、相対的な大きさを表します。
      - 正解です。作業の大きさを相対的な値で見積もります。
      - ソースコードの行数は、完成したプログラムの規模を表す尺度です。
    know: チームが1回のイテレーションで完了できたストーリーポイントの合計をベロシティといい、今後の計画に利用します。
    terms:
      - ストーリーポイント
      - ユーザーストーリー
  - id: A12-019
    topic: 12-1-7-7
    diff: 2
    q: アジャイル開発において，1回のイテレーション（スプリント）では実現できないほど大きく，複数のユーザーストーリーに分割して扱う要求を何というか。
    c:
      - ベロシティ
      - エピック
      - タスク
      - インクリメント
    a: イ
    exp: |
      エピックは、大きすぎて1回のイテレーションに収まらない要求のことです。そのままでは見積りや実装が難しいため、利用者にとって価値のある単位を保ちながら、複数のユーザーストーリーに分割してプロダクトバックログで管理します。
    why:
      - ベロシティは、チームが1回のイテレーションで完了できる作業量（ストーリーポイントの合計など）です。
      - 正解です。大きな要求をエピックといい、ストーリーに分割します。
      - タスクは、ユーザーストーリーを実現するために行う具体的な作業で、ストーリーより小さな単位です。
      - インクリメントは、イテレーションの成果として作られた、利用可能な状態のプロダクトの増分です。
    terms:
      - エピック
      - ユーザーストーリー
  - id: A12-020
    topic:
      - 12-1-7-8
      - 12-2-11-3
    diff: 1
    q: |
      次の決定表に従って送料を決めるとき，会員が 3,000 円の商品を購入した場合の送料はどれか。

      | | 規則1 | 規則2 | 規則3 | 規則4 |
      | --- | --- | --- | --- | --- |
      | 会員である | Y | Y | N | N |
      | 購入金額が 5,000 円以上である | Y | N | Y | N |
      | 送料無料 | X | － | X | － |
      | 送料半額 | － | X | － | － |
      | 通常の送料 | － | － | － | X |
    c:
      - 送料半額
      - 送料無料と送料半額の両方を適用する
      - 送料無料
      - 通常の送料
    a: ア
    exp: |
      決定表（デシジョンテーブル）は、上段に条件、下段に動作を書き、各列（規則）で条件の組合せ（Y/N）と実行する動作（X）を対応させた表です。会員である（Y）、購入金額が 5,000 円以上ではない（N）という組合せは規則2に当たり、動作は「送料半額」です。
    why:
      - 正解です。条件が Y・N の規則2に該当し、送料半額になります。
      - 1つの規則で X が付いている動作は「送料半額」だけなので、両方を適用することはありません。
      - 送料無料になるのは、購入金額が 5,000 円以上の規則1と規則3です。
      - 通常の送料になるのは、非会員で 5,000 円未満の規則4です。
    terms:
      - 決定表
  - id: A12-021
    topic: 12-1-7-8
    diff: 2
    q: SysML の説明として，適切なものはどれか。
    c:
      - ソフトウェア製品の品質特性を定めた国際規格
      - UML を基に拡張したモデリング言語で，ソフトウェアだけでなくハードウェアなどを含むシステム全体の要求，構造及び振る舞いを表すために用いる。
      - 関係データベースのデータを定義したり操作したりするための言語
      - Web ページの文書構造を記述するためのマークアップ言語
    a: イ
    exp: |
      SysML（Systems Modeling Language）は、OMG が UML を基に策定したシステムズエンジニアリング向けのモデリング言語です。UML の一部の図を流用・拡張し、要求を表す要求図や、性能などの制約式を表すパラメトリック図などを加えて、ハードウェア・ソフトウェア・人などからなるシステム全体をモデル化します。
    why:
      - ソフトウェア製品の品質特性を定めた規格は ISO/IEC 25010（JIS X 25010）です。
      - 正解です。UML を拡張し、システム全体のモデル化に用います。
      - データベースの定義・操作を行う言語は SQL です。
      - Web ページの文書構造を記述するのは HTML です。
    terms:
      - SysML
      - UML
      - ISO/IEC 25010
  - id: A12-022
    topic: 12-2-2-3
    diff: 2
    q: クラウドサービスのうち IaaS を利用してシステムを構築する場合に，一般に利用者が自ら導入・管理する範囲として，適切なものはどれか。
    c:
      - アプリケーションソフトウェアだけ
      - OS，ミドルウェア及びアプリケーションソフトウェア
      - 提供されるアプリケーションの利用者ごとの設定だけ
      - サーバやストレージなどの物理的なハードウェアとその設置場所
    a: イ
    exp: |
      IaaS（Infrastructure as a Service）では、事業者がサーバ・ストレージ・ネットワークなどの基盤（多くは仮想マシン）を提供し、利用者はその上の OS、ミドルウェア、アプリケーションを自ら導入・管理します。PaaS では OS やミドルウェアまで事業者が提供し、利用者はアプリケーションを管理します。SaaS ではアプリケーションまで事業者が提供します。
    why:
      - アプリケーションだけを利用者が管理するのは PaaS の場合です。
      - 正解です。IaaS では OS から上を利用者が管理します。
      - アプリケーションの設定程度だけを利用者が行うのは SaaS の場合です。
      - 物理的なハードウェアと設置場所は、IaaS では事業者が管理します。利用者が自ら管理するのはオンプレミスの場合です。
    terms:
      - IaaS
      - PaaS
      - SaaS
  - id: A12-023
    topic: 12-2-2-5
    diff: 2
    q: マイクロサービスアーキテクチャの特徴として，適切なものはどれか。
    c:
      - すべての機能を1つの実行単位にまとめ，システム全体を一括してデプロイする。
      - 1台の大型コンピュータにすべての処理とデータを集中させる。
      - 利用者の端末には画面表示などの最小限の機能だけをもたせ，処理はすべてサーバで行う。
      - システムを，独立して開発・デプロイできる小さなサービスの集まりとして構成し，サービス間は API を通じて連携させる。
    a: エ
    exp: |
      マイクロサービスアーキテクチャは、システムを業務機能ごとの小さなサービスに分け、各サービスを独立して開発・デプロイ・スケールできるようにする方式です。サービス間は HTTP などを使った API で連携し、一般に各サービスが自分のデータを管理します。変更の影響を局所化しやすい反面、サービス間通信の遅延や、運用・障害解析の複雑さが課題になります。
    why:
      - すべての機能を1つの実行単位にまとめるのは、モノリシックなアーキテクチャです。
      - 1台のコンピュータにすべてを集中させるのは、集中処理の説明です。
      - 端末に最小限の機能だけをもたせるのは、シンクライアントの説明です。
      - 正解です。小さなサービスを API で連携させます。
    terms:
      - マイクロサービスアーキテクチャ
      - API
      - シンクライアント
      - 集中処理
  - id: A12-024
    topic:
      - 12-2-2-2
      - 12-2-1
    diff: 2
    q: システム設計（システム方式設計）で行う作業として，適切なものはどれか。
    c:
      - システム要件を，ハードウェア，ソフトウェア，サービス及び手作業のどれで実現するかを決め，システムの構成要素に割り当てる。
      - 利用者にヒアリングを行い，業務上の要求を洗い出す。
      - 本番稼働後に発生した障害の原因を調べ，プログラムを修正する。
      - プログラムのソースコードを作成し，コンパイルエラーを取り除く。
    a: ア
    exp: |
      システム設計（システム方式設計）では、システム要件をハードウェア構成品目・ソフトウェア構成品目・サービス・手作業に割り当て、利用者の作業範囲を明確にしたうえで、ハードウェア構成、ソフトウェア構成、システム処理方式（集中・分散、クライアントサーバなど）、データベース方式を決定します。
    why:
      - 正解です。要件を構成要素と手作業に割り当てます。
      - ヒアリングによる要求の洗い出しは、要件定義（業務分析）の作業です。
      - 稼働後の障害の修正は、保守（是正保守）の作業です。
      - ソースコードの作成は、実装（ソフトウェア構築）の作業です。
    terms:
      - 要件定義
      - ヒアリング
      - 是正保守
  - id: A12-025
    topic: 12-2-2-6
    diff: 2
    q: データベースの方式のうち，オブジェクト指向データベース（OODB）の説明として，適切なものはどれか。
    c:
      - レコード間の親子関係を網の目状に表し，1つの子レコードが複数の親レコードをもつことができる。
      - データを行と列からなる表で表し，表どうしを列の値によって関連付ける。
      - データとそれを操作する手続（メソッド）を一体化したオブジェクトとして格納し，複雑な構造のデータを扱いやすくする。
      - すべてのデータを主記憶上に置き，ディスクへのアクセスを減らして高速に処理する。
    a: ウ
    exp: |
      オブジェクト指向データベースは、オブジェクト指向の考え方に基づき、データ（属性）と手続（メソッド）をカプセル化したオブジェクトをそのまま格納するデータベースです。画像や設計図面のような複雑な構造のデータや、オブジェクト指向言語のプログラムとの親和性が高いことが特徴です。
    why:
      - レコード間の親子関係を網状に表すのは網型データベース（NDB）です。
      - 表（関係）でデータを表し、値で関連付けるのは関係データベース（RDB）です。
      - 正解です。データと手続を一体化したオブジェクトを格納します。
      - データを主記憶上に置いて高速化するのはインメモリデータベースです。
    terms:
      - オブジェクト指向データベース
      - 関係データベース
      - 網型データベース
      - インメモリデータベース
  - id: A12-026
    topic: 12-2-2-6
    diff: 2
    q: Web サイトの利用者ごとのセッション情報を，大量のアクセスに対して高速に読み書きしたい。データの構造は単純で，キーを指定して値を取り出す処理がほとんどであり，複雑な結合や厳密なスキーマは必要ない。この用途に最も適したデータベースはどれか。
    c:
      - キーバリュー型データベース
      - XMLデータベース
      - 階層型データベース
      - 網型データベース
    a: ア
    exp: |
      キーバリュー型データベース（KVS）は NoSQL の一種で、キーと値の組だけでデータを管理します。構造が単純なため、複数のサーバへの分散（水平スケール）が容易で、キーによる読み書きを高速に行えます。セッション情報やキャッシュのように、キーで値を取り出すだけの用途に適しています。
    why:
      - 正解です。キーによる単純で高速な読み書きに適しています。
      - XML データベースは、XML 文書を階層構造のまま格納し、XPath などで検索する方式で、文書データの管理に向きます。
      - 階層型データベースは、レコードを木構造（1対多の親子関係）で管理する方式で、キーによる単純な読み書きを分散して行う用途には向きません。
      - 網型データベースは、レコード間の親子関係を網状にたどってアクセスする方式で、大量アクセスの水平分散には向きません。
    terms:
      - キーバリュー型データベース
      - NoSQL
      - 網型データベース
      - 階層型データベース
      - XML
  - id: A12-027
    topic: 12-2-4
    diff: 3
    q: クリーンアーキテクチャの考え方として，適切なものはどれか。
    c:
      - 内側の業務ルールの層が外側の層を直接参照できるように，内側から外側への依存を基本とする。
      - 層を分けずに，画面の処理の中にデータベースへのアクセスと業務ルールを直接記述する。
      - 業務ルールを扱う層から，特定のデータベース製品や UI フレームワークの機能を直接呼び出すようにして，処理を簡潔にする。
      - ソフトウェアを同心円状の層に分け，ソースコードの依存関係は，外側の層（UI，データベース，フレームワークなど）から内側の層（業務ルール）へ向かう方向だけにする。
    a: エ
    exp: |
      クリーンアーキテクチャは、ロバート・C・マーチンが提唱した設計の考え方です。中心にエンティティ（業務ルール）、その外側にユースケース、インタフェースアダプター、フレームワークとドライバ（UI・DB など）を置き、「依存は内側へのみ向かう」という規則を守ります。内側が外側の機能を使う場合は、内側でインタフェースを定義して外側に実装させます（依存性逆転の原則）。これにより、業務ルールが DB や UI の変更の影響を受けず、単体でテストしやすくなります。
    why:
      - 依存の方向が逆です。内側から外側への依存は禁止されます。
      - 層を分けずに記述すると、UI・DB・業務ルールが密結合になり、変更やテストが難しくなります。
      - 業務ルールが特定の製品やフレームワークに直接依存すると、それらの変更の影響を受けるため、クリーンアーキテクチャの考え方に反します。
      - 正解です。依存の方向は外側から内側への一方向だけです。
    terms:
      - クリーンアーキテクチャ
      - 依存性逆転の原則
  - id: A12-028
    topic: 12-2-8-2
    diff: 2
    q: JIS X 25010（ISO/IEC 25010）の製品品質モデルを構成する品質特性に含まれないものはどれか。
    c:
      - 互換性
      - 機能適合性
      - 移植性
      - 満足性
    a: エ
    exp: |
      JIS X 25010:2013 の製品品質モデルは、機能適合性、性能効率性、互換性、使用性、信頼性、セキュリティ、保守性、移植性の8つの品質特性で構成されます。満足性は、製品品質モデルではなく、利用時の品質モデル（有効性、効率性、満足性、リスク回避性、利用状況網羅性）の品質特性です。
    why:
      - 互換性は製品品質モデルの品質特性で、他の製品と情報を交換したり環境を共有したりできる度合いです。
      - 機能適合性は製品品質モデルの品質特性で、明示された要求を満たす機能を提供する度合いです。
      - 移植性は製品品質モデルの品質特性で、別の環境へ移すことができる度合いです。
      - 正解です。満足性は利用時の品質モデルの品質特性です。
    terms:
      - ISO/IEC 25010
  - id: A12-029
    topic: 12-2-8-2
    diff: 2
    q: JIS X 25010 の製品品質モデルで，モジュール性，再利用性，解析性，修正性及び試験性を副特性としてもつ品質特性はどれか。
    c:
      - 保守性
      - 信頼性
      - 移植性
      - 使用性
    a: ア
    exp: |
      保守性は、製品やシステムを修正できる有効性と効率性の度合いで、副特性はモジュール性（構成要素の変更が他に与える影響が小さい）、再利用性、解析性（欠陥や影響範囲を診断しやすい）、修正性、試験性です。
    why:
      - 正解です。モジュール性・再利用性・解析性・修正性・試験性は保守性の副特性です。
      - 信頼性の副特性は、成熟性、可用性、障害許容性（耐故障性）、回復性です。
      - 移植性の副特性は、適応性、設置性、置換性です。
      - 使用性の副特性は、適切度認識性、習得性、運用操作性、ユーザーエラー防止性、ユーザーインタフェース快美性、アクセシビリティです。
    terms:
      - ISO/IEC 25010
      - 使用性
      - 可用性
  - id: A12-030
    topic: 12-2-8-2
    diff: 2
    q: JIS X 25010 の製品品質特性のうち，互換性の説明として，適切なものはどれか。
    c:
      - 同じハードウェア環境又はソフトウェア環境を共有しながら，他の製品やシステムと情報を交換したり，要求された機能を実行したりできる度合い
      - 明示された条件の下で使用する資源の量に関係する性能の度合い
      - 明示された条件の下で，明示された期間にわたって，システムが明示された機能を実行する度合い
      - 製品やシステムを，ある環境から別の環境へ，有効かつ効率的に移すことができる度合い
    a: ア
    exp: |
      互換性は、他の製品・システムと同じ環境を共有して悪影響なく動作できること（共存性）と、他の製品・システムと情報を交換して使用できること（相互運用性）を副特性とする品質特性です。
    why:
      - 正解です。環境の共有や情報交換ができる度合いが互換性です。
      - 使用する資源の量に関係する性能の度合いは性能効率性です。
      - 明示された条件・期間で機能を実行する度合いは信頼性です。
      - 別の環境へ移すことができる度合いは移植性です。
    terms:
      - ISO/IEC 25010
  - id: A12-031
    topic: 12-2-8-1
    diff: 2
    q: JIS X 25010 の利用時の品質モデルにおいて，リスク回避性が表すものとして，適切なものはどれか。
    c:
      - 製品やシステムを明示された利用状況で使用したときに，利用者のニーズが満たされる度合い
      - 経済状況，人の生活又は環境に対する潜在的なリスクを，製品やシステムが緩和する度合い
      - 利用者が目標を達成する際に，その正確さ及び完全さに関連して使用した資源の度合い
      - 利用者が明示された目標を達成する上での正確さ及び完全さの度合い
    a: イ
    exp: |
      利用時の品質モデルは、利用者が実際の利用状況で製品を使ったときの品質を表し、有効性、効率性、満足性、リスク回避性、利用状況網羅性の5つの品質特性で構成されます。リスク回避性は、経済・健康と安全・環境の各リスクを緩和する度合いです。
    why:
      - 利用者のニーズが満たされる度合いは満足性です。
      - 正解です。潜在的なリスクを緩和する度合いがリスク回避性です。
      - 目標達成に関連して使用した資源の度合いは効率性です。
      - 目標達成の正確さ・完全さの度合いは有効性です。
    terms:
      - ISO/IEC 25010
  - id: A12-032
    topic: 12-2-8-2
    diff: 2
    q: 「稼働環境を新しいバージョンの OS に変更しても，修正せずに又は少ない作業で動作させることができる」という要求に，主に関係する JIS X 25010 の品質特性はどれか。
    c:
      - 移植性
      - 使用性
      - 機能適合性
      - セキュリティ
    a: ア
    exp: |
      移植性は、製品やシステムを、あるハードウェア・ソフトウェア・運用環境から別の環境へ移すことができる有効性と効率性の度合いです。副特性の適応性は、異なる環境や進化する環境に適応できる度合いを表し、OS のバージョン変更への対応はこれに当たります。
    why:
      - 正解です。別の環境で動作させやすい度合いは移植性（適応性）です。
      - 使用性は、利用者が有効かつ効率的に、満足して使用できる度合いです。
      - 機能適合性は、明示された要求を満たす機能を提供する度合いで、稼働環境の変更への対応ではありません。
      - セキュリティは、情報やデータを保護し、認可された範囲でアクセスさせる度合いです。
    terms:
      - ISO/IEC 25010
      - 使用性
  - id: A12-033
    topic:
      - 12-2-9-2
      - 12-2-9-1
    diff: 2
    q: データ中心アプローチ（DOA）の考え方として，適切なものはどれか。
    c:
      - 処理の効率を上げるために，同じデータを複数のファイルに重複させて保持する。
      - 業務で扱うデータは処理手順に比べて変化しにくいので，先にデータの構造を分析・設計し，それを基にシステムを構築する。
      - 業務の処理手順を中心に分析し，処理ごとに必要なデータファイルを個別に設計する。
      - データとそれを操作する手続を，オブジェクトとして一体化して設計する。
    a: イ
    exp: |
      データ中心アプローチは、業務の手順は変わりやすいが、業務で扱うデータそのものは比較的安定しているという考えに基づき、E-R 図や正規化でデータ構造を先に設計する手法です。データを全社で共有し、同じ事実を1か所だけに記録する「一事実一箇所」を目指すことで、データの重複や不整合を防ぎます。
    why:
      - データを重複させると不整合が起きやすく、一事実一箇所を目指すデータ中心アプローチの考え方に反します。
      - 正解です。安定したデータ構造を先に設計します。
      - 処理手順を中心に設計するのは、プロセス中心アプローチ（POA）です。
      - データと手続をオブジェクトとして一体化するのは、オブジェクト指向設計です。
    terms:
      - データ中心アプローチ
      - プロセス中心アプローチ
      - オブジェクト指向
      - 正規化
  - id: A12-034
    topic: 12-2-9-3
    diff: 1
    q: 構造化設計における段階的詳細化の説明として，適切なものはどれか。
    c:
      - データの構造を先に設計してから，処理を設計する。
      - 試作品を利用者に評価してもらい，改良を繰り返して仕様を固める。
      - 細かな部品を先に作成し，それらを組み合わせて上位の機能を作り上げていく。
      - システムの機能を上位から下位へと階層的に分解し，段階を追って詳細化していく。
    a: エ
    exp: |
      構造化設計では、システム全体の機能を大きな単位から小さな単位へと階層的に分解し、各段階で少しずつ詳細化していきます（段階的詳細化、トップダウンアプローチ）。分解された各機能は、順次・選択・繰返しの3つの基本構造の組合せで表します。
    why:
      - データ構造を先に設計するのは、データ中心アプローチの考え方です。
      - 試作品の評価と改良を繰り返すのは、プロトタイピングです。
      - 部品を先に作って組み合わせるのは、ボトムアップの進め方です。
      - 正解です。上位から下位へ階層的に詳細化します。
    terms:
      - 構造化設計
      - プロトタイピング
      - データ中心アプローチ
  - id: A12-035
    topic:
      - 12-2-9-3
      - 12-2-11-3
    diff: 1
    q: NS 図（Nassi-Shneiderman 図）の説明として，適切なものはどれか。
    c:
      - 順次・選択・繰返しの3つの基本構造を長方形の箱の組合せで表すので，構造化されていない任意の箇所への分岐は表せない。
      - 機能の階層を表す図式目次と，入力・処理・出力の関係を表す図で構成する。
      - 処理の流れを記号と矢印でつないで表し，任意の箇所への分岐も自由に表せる。
      - データの流れと処理，データストアの関係を表す。
    a: ア
    exp: |
      NS 図は、構造化プログラミングの考え方に基づき、順次・選択・繰返しの各構造を長方形の箱を入れ子にして表す図です。矢印を使わないため、goto 文のような任意の分岐を書くことができず、自然に構造化されたプログラムの設計になります。
    why:
      - 正解です。基本構造を箱で表し、任意の分岐は表せません。
      - 図式目次と入力・処理・出力の図で構成するのは HIPO です。
      - 記号と矢印で処理の流れを表すのは流れ図（フローチャート）で、任意の分岐も書けてしまいます。
      - データの流れと処理、データストアを表すのは DFD です。
    terms:
      - NS図
      - 流れ図
      - HIPO
      - DFD
      - 制御構造
  - id: A12-036
    topic: 12-2-9-3
    diff: 2
    q: HIPO の説明として，適切なものはどれか。
    c:
      - 入力データと出力データの構造の対応関係から，プログラムの構造を導く。
      - オブジェクトの状態と，イベントによる状態の遷移を表す。
      - 条件の組合せと実行する動作を表形式で整理する。
      - 機能の階層構造を図式目次で表し，各機能を入力・処理・出力の関係で表した総括ダイアグラムと詳細ダイアグラムで記述する。
    a: エ
    exp: |
      HIPO（Hierarchy plus Input Process Output）は、機能の階層（Hierarchy）を表す図式目次と、各機能の入力（Input）・処理（Process）・出力（Output）を表す IPO 図（総括ダイアグラム・詳細ダイアグラム）を組み合わせて、システムやプログラムの機能を記述する手法です。
    why:
      - 入出力データ構造の対応からプログラム構造を導くのはジャクソン法です。
      - 状態とイベントによる遷移を表すのは状態遷移図やステートマシン図です。
      - 条件の組合せと動作を表形式で整理するのは決定表です。
      - 正解です。図式目次と入力・処理・出力の図で機能を記述します。
    terms:
      - HIPO
      - ジャクソン法
      - 決定表
      - 状態遷移
  - id: A12-037
    topic: 12-2-9-3
    diff: 2
    q: 構造化設計の手法のうち，ジャクソン法の説明として，適切なものはどれか。
    c:
      - プログラムの内部構造に着目し，すべての命令を少なくとも1回実行するテストケースを設計する。
      - データの流れに着目し，入力・変換・出力の3つの部分にモジュールを分割する。
      - 機能を上位から下位へ段階的に分解した図式目次を作成する。
      - 入力データと出力データの構造を明らかにし，それらの対応関係を基にプログラムの構造を導く。
    a: エ
    exp: |
      ジャクソン法は、入力データと出力データの構造を、基本・連続（順次）・選択・繰返しの要素で木構造の図に表し、両者の対応関係からプログラムの構造を導くデータ構造中心の設計手法です。データ構造が明確な事務処理プログラムの設計に向いています。
    why:
      - すべての命令を1回以上実行するテストケースの設計は、命令網羅です。
      - データの流れに着目して入力・変換・出力に分けるのは、STS 分割です。
      - 機能を段階的に分解した図式目次を作るのは HIPO です。
      - 正解です。入出力データ構造の対応からプログラム構造を導きます。
    terms:
      - ジャクソン法
      - STS分割
      - HIPO
      - 命令網羅
  - id: A12-038
    topic: 12-2-9-3
    diff: 3
    q: 入力データの構造を集合の観点から分析し，各処理を「いつ」「何回」実行するかを明確にしてプログラムの構造を決める設計手法はどれか。
    c:
      - ワーニエ法
      - ジャクソン法
      - HIPO
      - NS図
    a: ア
    exp: |
      ワーニエ法は、入力データの構造に着目し、集合論の考え方に基づいて、データの集まり（ファイル、グループ、レコードなど）ごとに処理を「いつ」「何回」行うかを階層的に整理してプログラムの構造を決める手法です。ジャクソン法が入力と出力の両方のデータ構造の対応を重視するのに対し、ワーニエ法は入力データの構造を中心に考えます。
    why:
      - 正解です。入力データの構造と集合論の考え方を用います。
      - ジャクソン法は、入力と出力のデータ構造の対応関係からプログラムの構造を導く手法です。
      - HIPO は、図式目次と入力・処理・出力の図で機能を記述する手法です。
      - NS 図は、順次・選択・繰返しを箱の組合せで表す、処理手順の記述方法です。
    terms:
      - ワーニエ法
      - ジャクソン法
      - HIPO
      - NS図
  - id: A12-039
    topic: 12-2-9-4
    diff: 2
    q: オブジェクト指向設計の原則（SOLID）のうち，単一責任の原則の説明として，適切なものはどれか。
    c:
      - 派生クラスのインスタンスは，基底クラスのインスタンスと置き換えても正しく動作しなければならない。
      - 上位のモジュールは下位のモジュールに直接依存せず，両者とも抽象に依存すべきである。
      - 1つのクラスが担う責任を1つにし，クラスを変更する理由が1つだけになるようにする。
      - ソフトウェアの構成要素は，拡張に対しては開いていて，修正に対しては閉じているべきである。
    a: ウ
    exp: |
      SOLID は、オブジェクト指向設計の5つの原則の頭文字です。
      - S：単一責任の原則（変更する理由は1つ）
      - O：開放閉鎖原則（拡張に開き、修正に閉じる）
      - L：リスコフの置換原則（派生型は基底型と置換可能）
      - I：インタフェース分離の原則（使わない操作への依存を強制しない）
      - D：依存性逆転の原則（上位も下位も抽象に依存する）
      単一責任の原則に従うと、1つの変更が無関係な機能に影響しにくくなります。
    why:
      - これはリスコフの置換原則の説明です。
      - これは依存性逆転の原則の説明です。
      - 正解です。クラスを変更する理由を1つにします。
      - これは開放閉鎖原則（オープン・クローズドの原則）の説明です。
    terms:
      - SOLID
      - 単一責任の原則
      - 開放閉鎖原則
      - リスコフの置換原則
      - 依存性逆転の原則
  - id: A12-040
    topic: 12-2-9-4
    diff: 3
    q: 支払方法の種類が追加されるたびに，既存の支払処理クラスの条件分岐を書き換えていた。そこで，支払方法を表す抽象的なインタフェースを定義し，支払方法ごとに実装クラスを追加するだけで対応できるように設計を改めた。この改善が主に従っている SOLID の原則はどれか。
    c:
      - 開放閉鎖原則
      - リスコフの置換原則
      - 単一責任の原則
      - インタフェース分離の原則
    a: ア
    exp: |
      開放閉鎖原則は、ソフトウェアの構成要素は「拡張に対して開いていて、修正に対して閉じている」べきだという原則です。既存のコードを修正せずに、新しいクラスを追加するだけで機能を拡張できるようにします。抽象（インタフェース）に対してプログラミングし、多相性（ポリモーフィズム）を使って実装を切り替えるのが典型的な実現方法です。
    why:
      - 正解です。既存コードを修正せず、クラスの追加で拡張できるようにしています。
      - リスコフの置換原則は、派生型を基底型と置き換えても正しく動作することを求める原則で、設問の改善の主目的ではありません。
      - 単一責任の原則は、クラスを変更する理由を1つにする原則で、拡張時に既存コードを修正しないことを主眼とするものではありません。
      - インタフェース分離の原則は、使わない操作をもつ大きなインタフェースへの依存を避けるために、インタフェースを分割する原則です。
    terms:
      - 開放閉鎖原則
      - SOLID
      - ポリモーフィズム
  - id: A12-041
    topic: 12-2-9-4
    diff: 3
    q: 長方形クラスを継承して正方形クラスを作り，正方形では幅を変更すると高さも同じ値に変わるようにした。その結果，長方形として扱っている既存のプログラムで「幅だけを変更して面積を確認する」処理が期待どおりに動作しなくなった。この設計が違反している SOLID の原則はどれか。
    c:
      - 開放閉鎖原則
      - 依存性逆転の原則
      - 単一責任の原則
      - リスコフの置換原則
    a: エ
    exp: |
      リスコフの置換原則は、派生クラスのインスタンスを基底クラスのインスタンスとして使っても、プログラムが正しく動作しなければならないという原則です。設問では、長方形に期待される「幅だけを変えられる」という振る舞いを正方形が満たさないため、長方形の代わりに正方形を使うと動作が変わってしまいます。継承は、振る舞いの互換性まで保てる場合にだけ使うべきです。
    why:
      - 開放閉鎖原則は、既存コードを修正せずに拡張できるようにする原則で、設問の問題とは異なります。
      - 依存性逆転の原則は、上位と下位のモジュールがともに抽象に依存するようにする原則です。
      - 単一責任の原則は、クラスを変更する理由を1つにする原則で、設問の問題は継承による置換の不整合です。
      - 正解です。派生クラスで置き換えると正しく動作しなくなっています。
    terms:
      - リスコフの置換原則
      - SOLID
      - 継承
  - id: A12-042
    topic: 12-2-9-4
    diff: 3
    q: 印刷・スキャン・ファクス送信の操作をすべてもつ1つの大きなインタフェースを定義したため，印刷機能しかもたない機器のクラスでも，使わないスキャンやファクス送信の操作を実装しなければならなくなった。そこで，インタフェースを役割ごとに分割した。この改善が従っている SOLID の原則はどれか。
    c:
      - 開放閉鎖原則
      - 依存性逆転の原則
      - リスコフの置換原則
      - インタフェース分離の原則
    a: エ
    exp: |
      インタフェース分離の原則は、クライアントに、自分が使わない操作への依存を強制してはならないという原則です。大きな汎用インタフェースを、利用者ごと・役割ごとの小さなインタフェースに分割することで、不要な実装や、使わない操作の変更による影響を避けられます。
    why:
      - 開放閉鎖原則は、既存コードを修正せずに拡張できるようにする原則です。
      - 依存性逆転の原則は、上位モジュールと下位モジュールがともに抽象に依存するようにする原則です。
      - リスコフの置換原則は、派生型を基底型と置き換えても正しく動作することを求める原則です。
      - 正解です。使わない操作への依存をなくすために、インタフェースを分割しています。
    terms:
      - インタフェース分離の原則
      - SOLID
  - id: A12-043
    topic: 12-2-9-4
    diff: 1
    q: オブジェクト指向におけるカプセル化の効果として，適切なものはどれか。
    c:
      - オブジェクトの内部のデータを外部から直接操作させず，公開した操作を通じてだけ利用させるので，内部の実装を変更しても利用側に影響しにくい。
      - 上位クラスの属性や操作を下位クラスが引き継ぐので，共通部分を再利用できる。
      - 同じメッセージを送っても，受け取ったオブジェクトのクラスに応じて異なる振る舞いをさせることができる。
      - クラスからインスタンスを生成するときに，初期化の処理を自動的に行うことができる。
    a: ア
    exp: |
      カプセル化は、データ（属性）とそれを操作する手続（メソッド）を1つにまとめ、内部のデータを外部から隠して（情報隠蔽）、公開した操作を通じてだけ利用させることです。利用側は内部の実装を知らなくてよいため、内部を変更しても影響が利用側に及びにくく、保守性や部品としての再利用性が高まります。
    why:
      - 正解です。内部を隠して公開した操作だけで利用させます。
      - 上位クラスの性質を下位クラスが引き継ぐのは継承（インヘリタンス）です。
      - 同じメッセージに対してクラスごとに異なる振る舞いをするのは多相性（ポリモーフィズム）です。
      - インスタンス生成時に初期化を行うのはコンストラクタです。
    terms:
      - カプセル化
      - 継承
      - ポリモーフィズム
      - コンストラクタ
  - id: A12-044
    topic: 12-2-9-4
    diff: 1
    q: オブジェクト指向設計で，「普通預金」「定期預金」「当座預金」の各クラスに共通する性質を抽出して，上位のクラス「預金」を定義することを何というか。
    c:
      - 集約
      - 汎化
      - 特化
      - インスタンス化
    a: イ
    exp: |
      汎化は、複数のクラスに共通する属性や操作を取り出して、より一般的な上位クラス（スーパークラス）を定義することです。下位クラスと上位クラスは「普通預金は預金の一種である」という is-a 関係になり、下位クラスは上位クラスの性質を継承します。逆に、上位クラスを基に違いを加えて下位クラスを定義することを特化といいます。
    why:
      - 集約は、「全体」と「部分」の関係（part-of 関係）を表します。
      - 正解です。共通する性質を上位クラスにまとめるのは汎化です。
      - 特化は、上位クラスを基に、固有の性質を加えた下位クラスを定義することで、汎化とは逆の方向です。
      - インスタンス化は、クラスを基に具体的なオブジェクト（インスタンス）を生成することです。
    terms:
      - 汎化
      - 特化
      - 集約
      - インスタンス
  - id: A12-045
    topic: 12-2-9-4
    diff: 1
    q: クラス間の関係のうち，「パソコン」と「CPU」「メモリ」「ディスク」のように，全体と部分の関係（part-of 関係）を表すものはどれか。
    c:
      - 集約
      - 汎化
      - 継承
      - 依存
    a: ア
    exp: |
      集約は、あるクラスのオブジェクトが、他のクラスのオブジェクトを部分としてもつ「全体－部分」の関係です。UML のクラス図では、全体側に白抜きのひし形を付けた線で表します。部分が全体と生存期間を共にする強い集約をコンポジションといい、黒塗りのひし形で表します。全体を部分に分けることを分解といいます。
    why:
      - 正解です。全体と部分の関係は集約です。
      - 汎化は、「〜は〜の一種である」という is-a 関係で、全体と部分の関係ではありません。
      - 継承は、汎化の関係にある上位クラスの性質を下位クラスが引き継ぐことで、全体と部分の関係ではありません。
      - 依存は、一方のクラスの変更が他方に影響する、一時的な利用などの関係です。
    terms:
      - 集約
      - 汎化
      - 継承
      - クラス図
  - id: A12-046
    topic: 12-2-9-4
    diff: 2
    q: 図形を表す上位クラスに「面積を求める」操作を定義し，下位クラスの円や三角形でそれぞれの計算方法を実装した。呼出し側は図形の種類を意識せずに同じ操作を呼び出すだけで，それぞれに適した方法で面積が求められる。このようなオブジェクト指向の性質を何というか。
    c:
      - 集約
      - 多相性（ポリモーフィズム）
      - インスタンス化
      - カプセル化
    a: イ
    exp: |
      多相性（ポリモーフィズム、多態性）は、同じメッセージ（操作の呼出し）を送っても、受け取ったオブジェクトのクラスに応じて異なる振る舞いをする性質です。下位クラスで上位クラスの操作を再定義（オーバーライド）することで実現します。呼出し側は図形の種類ごとの条件分岐が不要になり、新しい図形を追加しても呼出し側を修正せずに済みます。
    why:
      - 集約は、全体と部分の関係（part-of 関係）です。
      - 正解です。同じ呼出しでクラスごとに異なる振る舞いをするのが多相性です。
      - インスタンス化は、クラスからオブジェクトを生成することです。
      - カプセル化は、データと操作をまとめ、内部を隠して公開した操作だけで利用させることです。
    terms:
      - ポリモーフィズム
      - オーバーライド
      - カプセル化
      - 集約
  - id: A12-047
    topic: 12-2-9-5
    diff: 2
    q: ドメイン駆動設計（DDD）におけるユビキタス言語の説明として，適切なものはどれか。
    c:
      - どのプラットフォームでも同じように動作するように設計されたプログラム言語
      - いつでもどこでもネットワークにつながる環境で用いられる通信プロトコル
      - 業務の専門家と開発者が共通に使う用語や表現であり，会話や文書だけでなく，モデルやソースコードの命名にも一貫して用いる。
      - 開発チームの内部だけで使う略語を定めた一覧であり，業務の専門家には公開しない。
    a: ウ
    exp: |
      ユビキタス言語は、ドメイン駆動設計で、業務の専門家（ドメインエキスパート）と開発者が共有する共通の言葉です。同じ概念を同じ言葉で表し、その言葉をドメインモデルやクラス名・メソッド名にもそのまま使うことで、業務の理解とソフトウェアの構造のずれを防ぎます。
    why:
      - 特定のプログラム言語のことではありません。「ユビキタス（遍在する）」は、関係者の会話から成果物まであらゆる場所で使うことを意味します。
      - ネットワークの通信プロトコルではありません。
      - 正解です。業務の専門家と開発者が共有し、コードにも用いる共通の言葉です。
      - 業務の専門家と共有するための言葉なので、開発者だけの略語一覧とは逆の考え方です。
    terms:
      - ユビキタス言語
      - DDD
  - id: A12-048
    topic: 12-2-9-5
    diff: 3
    q: ドメイン駆動設計（DDD）の考え方として，適切なものはどれか。
    c:
      - 対象業務（ドメイン）の知識をドメインモデルとして表現し，業務ルール（ドメインロジック）をそのモデルに集約して，業務の専門家と共に継続的に改善していく。
      - 業務ルールを特定のフレームワークの機能に強く結び付けて実装し，フレームワークと切り離せないようにする。
      - データベースの表構造を最初に固定し，業務ルールは画面ごとのプログラムにそれぞれ記述する。
      - 業務の専門家とは要件定義の初めに一度だけ打合せを行い，その後は開発者だけで設計を進める。
    a: ア
    exp: |
      ドメイン駆動設計（Domain-Driven Design）は、エリック・エヴァンスが提唱した設計手法で、ソフトウェアの中心に業務（ドメイン）のモデルを置きます。業務の専門家と開発者がユビキタス言語で対話しながらドメインモデルを作り、業務ルール（ドメインロジック）をモデルに集めて、UI やデータベースなどの技術的な関心事から分離します。モデルは理解が深まるたびに継続的に改善します。
    why:
      - 正解です。ドメインモデルに業務ルールを集め、専門家と共に改善します。
      - DDD では、業務ルールを技術的な仕組みから分離し、特定のフレームワークに依存させないようにします。
      - 業務ルールを画面ごとに分散させると、同じルールが重複して不整合が起きやすく、ドメインモデルに集約する DDD の考え方に反します。
      - DDD では、業務の専門家との継続的な対話でモデルを洗練させます。
    terms:
      - DDD
      - ユビキタス言語
  - id: A12-049
    topic: 12-2-11-1
    diff: 2
    q: モジュール分割技法のうち，STS 分割の説明として，適切なものはどれか。
    c:
      - データの流れに着目し，入力データを処理する部分，データを変換する部分，出力データを作成する部分に分割する。
      - 複数の箇所で使われる共通の機能を，独立したモジュールにする。
      - 入力データと出力データの構造の対応関係から，プログラムの構造を導く。
      - 入力されるトランザクションの種類ごとに処理を分け，それぞれを1つのモジュールにする。
    a: ア
    exp: |
      STS 分割（Source/Transform/Sink 分割）は、データの流れに着目して、プログラムを源泉（Source：入力）、変換（Transform：処理）、吸収（Sink：出力）の3つの部分に分割する技法です。入力データが最も抽象化された点（最大抽象入力点）と、出力データとして具体化され始める点（最大抽象出力点）を境界にして分けます。
    why:
      - 正解です。データの流れに沿って入力・変換・出力に分けます。
      - 共通の機能を独立したモジュールにするのは共通機能分割です。
      - 入出力のデータ構造の対応からプログラム構造を導くのはジャクソン法です。
      - トランザクションの種類ごとに分けるのは TR 分割（トランザクション分割）です。
    terms:
      - STS分割
      - TR分割
      - 共通機能分割
      - ジャクソン法
  - id: A12-050
    topic: 12-2-11-1
    diff: 2
    q: 「受注」「出荷」「返品」など，入力される伝票の種類によって処理の内容が大きく異なるプログラムをモジュールに分割する場合に，最も適した分割技法はどれか。
    c:
      - 共通機能分割
      - TR分割
      - ワーニエ法
      - STS分割
    a: イ
    exp: |
      TR 分割（トランザクション分割）は、入力されるデータ（トランザクション）の種類を判別し、種類ごとに異なる処理をそれぞれ独立したモジュールにする技法です。伝票の種類によって処理が大きく異なる場合に適しています。
    why:
      - 共通機能分割は、複数箇所で使う共通の機能を独立させる技法です。
      - 正解です。トランザクションの種類ごとにモジュールを分けます。
      - ワーニエ法は、入力データの構造を基にプログラムの構造を決める設計手法で、モジュール分割技法ではありません。
      - STS 分割は、一連のデータの流れを入力・変換・出力に分ける技法で、処理の種類が入力によって分かれる場合には TR 分割が適しています。
    terms:
      - TR分割
      - STS分割
      - 共通機能分割
      - ワーニエ法
  - id: A12-051
    topic: 12-2-11-1
    diff: 1
    q: 日付の妥当性チェックや税額の計算など，複数のプログラムで同じように必要となる処理を，独立したモジュールにまとめるモジュール分割技法はどれか。
    c:
      - TR分割
      - 段階的詳細化
      - STS分割
      - 共通機能分割
    a: エ
    exp: |
      共通機能分割は、複数のモジュールやプログラムで共通して使われる機能を取り出し、独立したモジュール（サブルーチン）にする技法です。同じ処理を何度も作らずに済み、修正も1か所で済むため、生産性と保守性が向上します。
    why:
      - TR 分割は、トランザクションの種類ごとに処理を分ける技法です。
      - 段階的詳細化は、機能を上位から下位へ階層的に分解していく考え方で、共通の処理をまとめる技法ではありません。
      - STS 分割は、データの流れに着目して入力・変換・出力に分ける技法です。
      - 正解です。共通の処理を独立したモジュールにまとめます。
    terms:
      - 共通機能分割
      - STS分割
      - TR分割
      - 構造化設計
  - id: A12-052
    topic: 12-2-11-2
    diff: 2
    q: モジュール強度（凝集度）のうち，最も強度が高く，望ましいとされるものはどれか。
    c:
      - 時間的強度
      - 論理的強度
      - 機能的強度
      - 暗合的強度
    a: ウ
    exp: |
      モジュール強度は、モジュール内部の構成要素どうしの関連の強さで、高いほど独立性が高い良い設計です。高い順に、機能的強度、情報的強度、連絡的強度、手順的強度、時間的強度、論理的強度、暗合的強度です。機能的強度は、モジュールが単一の機能だけを実行する状態です。
    why:
      - 時間的強度は、初期化処理のように、同じ時期に実行する処理をまとめたもので、強度は低い部類です。
      - 論理的強度は、関連する複数の機能を1つのモジュールにまとめ、引数などでどれを実行するかを選ぶもので、強度は低い部類です。
      - 正解です。単一の機能だけを実行する機能的強度が最も高い強度です。
      - 暗合的強度は、互いに関係のない処理を寄せ集めたもので、最も強度が低い状態です。
    know: モジュール強度は高く、モジュール結合度は弱くするのが望ましい設計です。
    terms:
      - モジュール強度
      - モジュール結合度
  - id: A12-053
    topic: 12-2-11-2
    diff: 2
    q: 呼出し元のモジュールが処理の種類を示すフラグを引数として渡し，呼び出されたモジュールはそのフラグの値によって実行する処理を切り替えている。このモジュール間の結合の種類はどれか。
    c:
      - 共通結合
      - データ結合
      - 制御結合
      - 内容結合
    a: ウ
    exp: |
      制御結合は、呼び出す側が、呼び出される側の処理の流れを制御するための情報（フラグやスイッチ）を渡す結合です。呼び出す側が相手の内部の論理を知っている必要があるため、データ結合やスタンプ結合より結合度が強くなります。モジュール結合度は、弱い順にデータ結合、スタンプ結合、制御結合、外部結合、共通結合、内容結合です。
    why:
      - 共通結合は、複数のモジュールが大域的な共通領域にあるデータ構造を参照する結合です。
      - データ結合は、処理に必要なデータ項目だけを引数で渡す結合で、最も弱く望ましい結合です。
      - 正解です。処理を切り替えるフラグを渡すのは制御結合です。
      - 内容結合は、他のモジュールの内部のデータを直接参照したり、内部に直接分岐したりする、最も強い結合です。
    terms:
      - 制御結合
      - データ結合
      - 共通結合
      - 内容結合
      - モジュール結合度
  - id: A12-054
    topic: 12-2-11-2
    diff: 2
    q: 呼出し元のモジュールが顧客情報のレコード（構造体）全体を引数として渡しているが，呼び出されたモジュールは，そのうちの顧客番号だけを使用している。このモジュール間の結合の種類はどれか。
    c:
      - データ結合
      - スタンプ結合
      - 外部結合（モジュール結合度）
      - 制御結合
    a: イ
    exp: |
      スタンプ結合は、データ構造（レコードや構造体）を引数として渡し、呼び出されたモジュールがその一部だけを使う結合です。使わない項目の構造が変わっても影響を受ける可能性があるため、必要な項目だけを渡すデータ結合より結合度が強くなります。
    why:
      - データ結合は、必要なデータ項目だけを引数で渡す結合です。顧客番号だけを渡すように改めればデータ結合になります。
      - 正解です。構造体全体を渡して一部だけを使うのはスタンプ結合です。
      - 外部結合は、外部で宣言された単一のデータ項目（大域変数）を複数のモジュールが共有する結合です。
      - 制御結合は、処理の流れを制御するフラグなどを渡す結合です。
    terms:
      - スタンプ結合
      - データ結合
      - 外部結合（モジュール結合度）
      - 制御結合
  - id: A12-055
    topic: 12-2-13
    diff: 1
    q: アーキテクチャパターンの MVC モデルにおいて，Controller の役割として，適切なものはどれか。
    c:
      - 業務で扱うデータと，その処理（ビジネスロジック）を担う。
      - Model のデータを利用者に分かる形で画面に表示する。
      - 利用者からの入力を受け付け，それに応じて Model や View に処理を指示する。
      - データベースの表を正規化して設計する。
    a: ウ
    exp: |
      MVC モデルは、対話型のアプリケーションを Model（データとビジネスロジック）、View（表示）、Controller（入力の受付と制御）の3つの役割に分けるアーキテクチャパターンです。役割を分けることで、例えば画面のデザインを変更しても業務処理に影響しにくくなり、分担して開発しやすくなります。
    why:
      - データとビジネスロジックを担うのは Model です。
      - データを画面に表示するのは View です。
      - 正解です。Controller は入力を受け付けて Model や View を制御します。
      - 表の正規化はデータベース設計の作業で、MVC の役割ではありません。
    terms:
      - MVC
      - 正規化
  - id: A12-056
    topic: 12-2-14
    diff: 1
    q: GoF のデザインパターンのうち，あるクラスのインスタンスがシステム内で1つしか生成されないことを保証するものはどれか。
    c:
      - Adapter
      - Observer
      - Singleton
      - Composite
    a: ウ
    exp: |
      Singleton パターンは、クラスのコンストラクタを外部から呼べないようにし、唯一のインスタンスを返す操作を用意することで、インスタンスが1つだけであることを保証する生成に関するパターンです。設定情報の管理やログ出力など、システム全体で1つだけ存在すればよいオブジェクトに使います。
    why:
      - Adapter は、既存クラスのインタフェースを、利用者が期待する別のインタフェースに変換するパターンです。
      - Observer は、あるオブジェクトの状態変化を、依存する複数のオブジェクトに通知するパターンです。
      - 正解です。インスタンスが1つであることを保証します。
      - Composite は、部分と全体を木構造で表し、個々のオブジェクトとその集まりを同一視して扱えるようにするパターンです。
    terms:
      - Singletonパターン
      - Observerパターン
      - Adapterパターン
      - Compositeパターン
      - デザインパターン
  - id: A12-057
    topic: 12-2-14
    diff: 2
    q: デザインパターンのうち，Observer パターンの説明として，適切なものはどれか。
    c:
      - オブジェクトを生成する処理をサブクラスに任せ，生成するクラスを利用側から切り離す。
      - 既存のクラスのインタフェースを，利用者が期待する別のインタフェースに変換する。
      - 部分と全体を木構造で表し，個々のオブジェクトとその集まりを同一視して扱えるようにする。
      - あるオブジェクトの状態が変化したときに，それに依存する複数のオブジェクトへ自動的に通知して更新させる。
    a: エ
    exp: |
      Observer パターンは、観察される側（Subject）に観察する側（Observer）を登録しておき、Subject の状態が変化したときに登録されたすべての Observer に通知する振る舞いに関するパターンです。Subject は Observer の具体的なクラスを知らなくてよいため、両者の結合を弱くできます。GUI のイベント処理などで使われます。
    why:
      - これは Factory Method パターンの説明です。
      - これは Adapter パターンの説明です。
      - これは Composite パターンの説明です。
      - 正解です。状態の変化を依存するオブジェクトに通知します。
    terms:
      - Observerパターン
      - Adapterパターン
      - Compositeパターン
      - Factory Methodパターン
  - id: A12-058
