    q: 入場料金を年齢で決めるプログラムがある。年齢は 0〜120 の整数を有効とし，0〜12 歳は子ども料金，13〜64 歳は一般料金，65〜120 歳はシニア料金とし，それ以外の値はエラーとする。同値分割法でテストデータを選ぶとき，最も適切なものはどれか。
