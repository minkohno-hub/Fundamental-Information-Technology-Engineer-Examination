    q: 外部のライブラリのクラスを利用したいが，そのメソッド名や引数の形式が，自システムで定めたインタフェースと合わない。ライブラリのクラスを修正せずに，間に変換用のクラスを置いて利用できるようにしたい。適用するデザインパターンとして，適切なものはどれか。
