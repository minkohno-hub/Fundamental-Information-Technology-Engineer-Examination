questions:
  - id: A06-501
    topic: 6-1-2
    diff: 3
    scope: 6-1-2 PWM 制御の応用。デューティ比から、負荷にかかる平均電圧を求める計算
    prereq: PWM では、電源電圧と 0 の間を高速に切り替え、オン時間の比率（デューティ比）によって、負荷にかかる平均の電圧（＝電源電圧 × デューティ比）を調整すること
    hard: デューティ比の定義の計算ではなく、その比率を電圧に適用する段階が加わる。オフ側の比率との取り違えが起きやすい。
    q: |
      PWM 制御で、12 V の電源をオン・オフし、モータを駆動している。デューティ比が 25 ％のとき、モータにかかる平均電圧はおよそ何 V か。
    c: ['3', '9', '6', '48']
    a: ア
    exp: |
      PWM では、電源電圧と 0 の間を高速に切り替えるため、負荷にかかる平均電圧は、電源電圧にデューティ比（1 周期のうちオンになっている時間の比率）を掛けた値になります。

      12 × 0.25 ＝ 3 V です。デューティ比を変えることで、電源電圧そのものを変えずに、平均の電圧、ひいてはモータの回転の速さを調整できます。取り違えやすいのは、オフ時間の比率ではなく、オン時間の比率を使う点です。
    why:
      - 正解です。12 × 0.25 ＝ 3 V です。
      - オフ時間の比率（75 ％）を掛けた値（12 × 0.75）です。使うのはオン時間の比率です。
      - デューティ比を 50 ％ と読み違えた値（12 × 0.5）です。本問のデューティ比は 25 ％です。
      - デューティ比で割った値（12 ÷ 0.25）です。平均電圧は、掛けて求めます。
    know: PWM の平均電圧は「電源電圧 × デューティ比」という一つの掛け算が要点である。オンとオフのどちらの比率かを取り違えないことが鍵である。
    terms: [PWM, デューティ比]
    verify: { type: value, value: 3 }

  - id: A06-502
    topic: 6-1-5
    diff: 3
    scope: 6-1-5 CMOS 回路の消費電力。電源電圧と動作周波数を同時に変えた場合の、動的な消費電力の変化の計算
    prereq: CMOS 回路の動的な消費電力は、負荷容量 C、電源電圧 V、動作周波数 f に対して、おおむね C × V の 2 乗 × f に比例すること
    hard: 電圧の効果が 2 乗で効くことと、周波数の効果が 1 乗で効くことを、同時に適用する必要がある。
    q: |
      CMOS 回路の動的な消費電力は、おおむね C × V の 2 乗 × f に比例する。動作周波数を 2 倍にし、電源電圧を半分にした場合、動的な消費電力はおよそ何倍になるか。
    c: ['0.5', '2', '0.25', '1']
    a: ア
    exp: |
      各要素の変化を、式に当てはめます。周波数が 2 倍になることで、消費電力は 2 倍になります。電源電圧が半分になることで、電圧は 2 乗で効くため、消費電力は （1/2）の 2 乗 ＝ 1/4 倍になります。

      合わせると、2 × 1/4 ＝ 0.5 倍です。電圧を下げることが、消費電力の削減に大きく効くことが、この式の読みどころです。
    why:
      - 正解です。2 倍 × 1/4 倍 ＝ 0.5 倍です。
      - 周波数の変化だけを見て、電圧の効果を無視した値です。
      - 電圧の変化だけを見て、周波数の効果を無視した値です。
      - 電圧の効果を 1 乗として考え、2 倍と相殺すると誤認した値です。電圧は 2 乗で効きます。
    know: 消費電力の見積もりは、式の各要素の変化を、指数（電圧は 2 乗、周波数は 1 乗）に注意して掛け合わせることが要点である。
    terms: [CMOS, 消費電力]
    verify: { type: value, value: 0.5 }

  - id: A06-503
    topic: 6-1-4
    diff: 3
    scope: 6-1-4 論理式の簡単化。吸収法則を用いて、冗長な項を取り除いた等しい論理式を判定する問題
    prereq: 吸収法則により、A・（A ＋ B）＝ A、A ＋ A・B ＝ A のように、一方の項に吸収される形の式は簡単化できること
    hard: 見た目の複雑さに惑わされず、法則を適用して本質的に同じ式かどうかを判定する必要がある。
    q: |
      論理式 A・（A ＋ B）と等しい、最も簡単な式はどれか。ここで、・は論理積、＋は論理和を表す。
    c:
      - A
      - A・B
      - A ＋ B
      - B
    a: ア
    exp: |
      展開すると、A・（A ＋ B）＝ A・A ＋ A・B ＝ A ＋ A・B となります。ここで吸収法則（A ＋ A・B ＝ A）を適用すると、式は A になります。真理値で確かめても、A が 0 のとき式全体は 0、A が 1 のとき式全体は 1 となり、B の値には左右されません。つまり、この式は実質的に A そのものです。
    why:
      - 正解です。吸収法則により A になります。
      - A・B は、B が 0 の場合に値が変わってしまいます（元の式は A が 1、B が 0 のとき 1）。
      - A ＋ B は、A が 0、B が 1 の場合に値が変わってしまいます（元の式は 0）。
      - B は、A の値に左右される元の式とは、無関係な式です。
    know: 論理式の簡単化は、展開と法則の適用に加えて、「特定の入力で値が変わらないか」という真理値での確認が要点である。
    terms: [吸収法則, 論理式]
    verify:
      manual: A・（A＋B）を展開してA＋A・Bとし、吸収法則でAになること、真理値（A=1,B=0で1、A=0で0）でも元の式とAが一致し、他の選択肢は反例の入力で値が変わることを確認した。

  - id: A06-504
    topic: 6-1-1
    diff: 3
    scope: 6-1-1 正論理と負論理の対応。負論理で表した論理積が、正論理では論理和に対応することの判定
    prereq: 負論理では、電圧の低い方を 1、高い方を 0 と割り当てるため、同じ回路の動作を負論理で読むと、正論理とは論理演算の対応が入れ替わること
    hard: 回路そのものではなく、値の割り当て方の違いによって、同じ動作が別の演算として読めることを理解する必要がある。
    q: |
      ある論理回路は、正論理（電圧の高い方を 1）で読むと、論理積（AND）の動作をする。この回路を負論理（電圧の低い方を 1）で読むと、どの演算の動作として読めるか。
    c:
      - 論理和（OR）
      - 論理積（AND）のまま
      - 否定（NOT）
      - 排他的論理和（XOR）
    a: ア
    exp: |
      負論理では、1 と 0 の割り当てが正論理と逆になります。正論理の AND は「両方の入力が高いときだけ出力が高い」回路です。これを負論理で読み直すと、「どちらか一方でも入力が低い（＝負論理の 1）とき、出力が低い（＝負論理の 1）」となり、これは論理和（OR）の真理値表と一致します。この対応は、ド・モルガンの法則とも結びついています。
    why:
      - 正解です。論理の割り当てを反転させると、AND は OR として読めます。
      - 割り当てを反転させると演算の対応も変わるため、AND のままにはなりません。
      - 入力の数が変わるわけではなく、NOT（1 入力の反転）にはなりません。
      - XOR は、入力が異なるときに 1 になる演算であり、本問の対応とは異なります。
    know: 正論理と負論理の要点は、「回路は同じでも、値の割り当てで演算の読みが変わる」ことである。AND と OR の入れ替わりが代表例である。
    terms: [負論理, 正論理]
    verify:
      manual: 正論理のAND回路（両入力が高いときだけ出力が高い）を負論理で読み直すと、どちらか一方が負論理の1のとき出力が負論理の1となり、ORの真理値表と一致することを確認した。

  - id: A06-505
    topic: 1-5-1
    diff: 3
    scope: 1-5-1 A/D 変換の分解能。ビット数と入力範囲から、量子化の 1 段階（1 LSB）に対応する電圧を求める計算
    prereq: n ビットの A/D 変換では、入力範囲を 2 の n 乗の段階に分け、1 段階の幅は 入力範囲 ÷（2 の n 乗）であること
    hard: 段階の数（2 の 8 乗 ＝ 256）と入力範囲の割り算に加え、単位（V と mV）の換算が必要になる。
    q: |
      8 ビットの A/D 変換器で、0 V から 5 V の範囲の電圧を変換する。量子化の 1 段階（1 LSB）に相当する電圧はおよそ何 mV か。
    c: ['19.5', '39', '9.8', '195']
    a: ア
    exp: |
      8 ビットでは、段階の数は 2 の 8 乗 ＝ 256 です。1 段階の幅は、入力範囲を段階の数で割ります。

      5 ÷ 256 ≒ 0.0195 V、すなわち約 19.5 mV です。ビット数が 1 増えるごとに、1 段階の幅は半分になり、分解能は細かくなります。
    why:
      - 正解です。5 V ÷ 256 ≒ 19.5 mV です。
      - 7 ビット（128 段階）として計算した値（5 ÷ 128）です。本問は 8 ビットです。
      - 9 ビット（512 段階）として計算した値（5 ÷ 512）です。本問は 8 ビットです。
      - 割り算の結果の桁を取り違えた値です。0.0195 V は 19.5 mV です。
    know: A/D 変換の分解能は、「範囲 ÷ 2 のビット数乗」という計算と、単位の換算が要点である。ビット数と段階の数の対応が鍵である。
    terms: [A/D変換, 分解能]
    verify: { type: value, value: 19.5 }

  - id: A06-506
    topic: 6-1-2
    diff: 3
    scope: 6-1-2 制御方式の分類。あらかじめ定めた手順どおりに動作するシーケンス制御と、結果を測って目標に合わせるフィードバック制御の、事例による識別
    prereq: シーケンス制御は、あらかじめ定められた順序と条件で処理を進める制御であり、フィードバック制御は、制御量を測定して目標値との差をなくすように操作する制御であること
    hard: 両方の事例が身近な機器であり、「センサーがあるかどうか」ではなく「結果を目標と比べて調整しているか」で読み分ける必要がある。
    q: |
      制御方式の分類として、適切な組合せはどれか。
    c:
      - 全自動洗濯機の「洗い → すすぎ → 脱水」の運転はシーケンス制御、室温を測定して出力を調整するエアコンの温度制御はフィードバック制御
      - 全自動洗濯機の運転はフィードバック制御、エアコンの温度制御はシーケンス制御
      - 洗濯機の運転も、エアコンの温度制御も、シーケンス制御
      - 洗濯機の運転も、エアコンの温度制御も、フィードバック制御
    a: ア
    exp: |
      洗濯機の運転は、あらかじめ定められた順序（洗い、すすぎ、脱水）と条件で進むため、シーケンス制御です。各工程の結果を目標値と比べながら調整しているわけではありません。一方、エアコンの温度制御は、室温という結果を測定し、目標の温度との差をなくすように出力を調整するため、フィードバック制御です。「結果を測って目標に合わせるかどうか」が、区別の軸です。
    why:
      - 正解です。手順の制御と、結果に基づく調整の制御を正しく組み合わせています。
      - 洗濯機の運転は定められた順序の制御であり、エアコンは結果に基づく調整であり、分類が逆です。
      - エアコンの温度制御は、室温を測って調整するため、シーケンス制御ではありません。
      - 洗濯機の運転は、結果を目標値と比べて調整する仕組みではないため、フィードバック制御ではありません。
    know: 制御方式の識別は、「手順が決まっているか（シーケンス）」「結果を測って目標に合わせるか（フィードバック）」という軸で判断することが要点である。
    terms: [シーケンス制御, フィードバック制御]
    verify:
      manual: 洗濯機の運転は定められた順序で進むシーケンス制御、エアコンの温度制御は室温を測定して目標に合わせるフィードバック制御であることを、結果の測定と調整の有無の観点から確認した。

  - id: A06-507
    topic: 6-1-1
    diff: 3
    scope: 6-1-1 LED 点灯回路の設計。電源電圧、LED の順方向電圧、目標の電流から、直列抵抗の値を求める計算
    prereq: LED に直列に入れる抵抗には、電源電圧から LED の順方向電圧を引いた電圧がかかり、抵抗値はその電圧を目標の電流で割って求めること
    hard: 電源電圧をそのまま使うのではなく、LED の電圧降下を差し引く段階がある。電流の単位（mA）を A に直す必要もある。
    q: |
      電源電圧 5 V で、順方向電圧 2 V の LED を、電流 20 mA で点灯させたい。LED に直列に入れる抵抗の値はおよそ何 Ω か。
    c: ['150', '250', '100', '350']
    a: ア
    exp: |
      抵抗にかかる電圧は、電源電圧から LED の順方向電圧を引いた、5 － 2 ＝ 3 V です。電流の目標は 20 mA ＝ 0.02 A です。

      抵抗値 ＝ 3 ÷ 0.02 ＝ 150 Ω です。この抵抗は、電流を制限し、LED に過大な電流が流れて壊れることを防ぐ役割を持ちます。
    why:
      - 正解です。（5 － 2） ÷ 0.02 ＝ 150 Ω です。
      - LED の電圧降下を引かずに、電源電圧のまま計算した値（5 ÷ 0.02）です。
      - 抵抗にかかる電圧を、LED の順方向電圧そのままの 2 V として計算した値（2 ÷ 0.02）です。抵抗にかかるのは、電源電圧から LED の電圧を引いた 3 V です。
      - LED の電圧を引く代わりに加えて計算した値（7 ÷ 0.02）です。
    know: LED の抵抗の計算は、「抵抗にかかる電圧 ＝ 電源 － LED の順方向電圧」という引き算と、mA から A への換算が要点である。
    terms: [LED, 順方向電圧]
    verify: { type: value, value: 150 }

  - id: A06-508
    topic: 6-1-3
    diff: 3
    scope: 6-1-3 FPGA の適用判断。試作段階で回路の変更が頻繁に起こる場面に、プログラム可能な論理デバイスを選ぶ理由の判断
    prereq: FPGA は、製造後に回路の構成を書き換えることができる論理デバイスであり、仕様の変更への対応や、試作・少量生産に向くこと、一方で量産時の単価や性能では専用 IC（ASIC）に分があること
    hard: デバイスの特徴（書き換え可能）を、開発の状況（変更の頻発、少量）に対応付ける必要がある。量産向きの選択肢との区別も問われる。
    q: |
      制御装置の試作を進めており、論理回路の仕様変更が頻繁に発生し、生産量も少量にとどまる見込みである。論理デバイスの選択として、適切なものはどれか。
    c:
      - FPGA を選ぶ。製造後も回路構成を書き換えられるため、仕様変更にそのつど対応でき、少量生産でも専用 IC を作る初期費用がかからない
      - 専用 IC（ASIC）を選ぶ。大量生産で単価は下げられるが、回路の変更のたびに作り直しが必要になる
      - 固定された論理の汎用 IC を組み合わせる。変更への対応は配線の変更で済ませる
      - 論理回路は使わず、全ての処理を汎用プロセッサのソフトウェアで置き換える
    a: ア
    exp: |
      FPGA は、製造後に回路の構成をプログラムで書き換えることができるデバイスです。仕様変更が頻繁な試作段階では、変更のたびに作り直す必要がなく、開発を速く進められます。生産量が少量であれば、専用 IC（ASIC）の開発にかかる大きな初期費用を負担する利点も薄くなります。ASIC が向くのは、仕様が固まり、大量生産で単価を下げる場合です。本件の状況（変更が頻繁、少量）には、FPGA が合います。
    why:
      - 正解です。書き換え可能性と、少量での費用の観点が、状況に合っています。
      - ASIC は、変更のたびに作り直しが必要であり、変更が頻繁な本件には向きません。
      - 汎用 IC の組合せは、規模が大きくなると部品点数と基板が膨らみ、変更の対応も煩雑になります。
      - ソフトウェアへの置き換えは、処理の速度や並列性が求められる論理回路の代わりになるとは限りません。
    know: デバイスの選択は、「変更への強さ」と「生産量に対する費用」の釣り合いで判断することが要点である。試作・少量は FPGA、確定・量産は ASIC という対応が鍵である。
    terms: [FPGA, ASIC]
    verify:
      manual: 仕様変更が頻繁で生産量が少量という状況には、製造後も回路を書き換えられるFPGAが適し、ASICは仕様が固まった大量生産向きであることを確認した。
