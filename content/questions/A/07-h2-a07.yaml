category: '07'
batch: H2
reviewed: { at: '2026-10-27', method: '作成後に独立した検算・実行検証と、解答を伏せた再解答による確認' }
questions:
  - id: A07-501
    topic: 7-2-3-1
    diff: 3
    scope: 画面設計（入力データのチェック方法）。リミット・組合せ・照合・フォーマットの各チェックの定義は、シラバス 7-2-3-1 の用語例にあり、項目の性質から手法を選ぶ判断は範囲内。
    prereq: 入力チェック（ニューメリック，リミット，フォーマット，組合せ，照合）の各定義
    hard: 4つの入力項目それぞれについて、似た名称のチェック手法の中から性質に合う手法を選び分ける必要がある。
    q: |
      受注入力画面で，次の四つの項目に対して入力データのチェックを行う。各項目に適用するチェック方法の組合せとして，適切なものはどれか。

      | 項目 | チェックの内容 |
      | --- | --- |
      | 1 | 数量が 1 以上 999 以下であること |
      | 2 | 出荷希望日が受注日以降の日付であること |
      | 3 | 入力された顧客コードが顧客マスタに登録されていること |
      | 4 | 郵便番号が「3桁の数字，ハイフン，4桁の数字」の形式であること |
    c:
      - 項目1 リミットチェック，項目2 組合せチェック，項目3 照合チェック，項目4 フォーマットチェック
      - 項目1 ニューメリックチェック，項目2 照合チェック，項目3 組合せチェック，項目4 フォーマットチェック
      - 項目1 リミットチェック，項目2 照合チェック，項目3 組合せチェック，項目4 ニューメリックチェック
      - 項目1 フォーマットチェック，項目2 組合せチェック，項目3 ニューメリックチェック，項目4 リミットチェック
    a: ア
    exp: |
      四つの項目を、何を調べるチェックなのかで一つずつ分類します。
      - 項目1は「値が許容範囲に収まるか」を調べるのでリミットチェック（範囲チェック）です。
      - 項目2は「出荷希望日」と「受注日」という二つの項目の関係（前後関係）を調べるので組合せチェックです。
      - 項目3は入力値を別に保持するマスタと突き合わせて存在を確認するので照合チェックです。
      - 項目4は桁数・文字の並び（書式）を調べるのでフォーマットチェックです。
      ニューメリックチェックは「数字だけで構成されているか」を調べるものであり、範囲や書式の適否までは調べません。
    why:
      - 正解です。範囲はリミット、項目間の関係は組合せ、マスタとの突合は照合、書式はフォーマットで確認します。
      - 数量の範囲確認は数字かどうかの確認ではなくリミットチェックです。また日付の前後関係は項目間の関係なので組合せチェックであり、マスタとの突合は照合チェックです。
      - 日付の前後関係は照合ではなく組合せチェックです。顧客コードの存在確認は組合せではなく照合チェックです。郵便番号はハイフンを含む書式の確認なのでニューメリックだけでは足りません。
      - 数量の範囲確認は書式ではなくリミットチェック、顧客コードの確認は数字かどうかではなくマスタとの照合です。割り当てが全体にずれています。
    know: 入力チェックは「数字か（ニューメリック）」「範囲内か（リミット）」「書式どおりか（フォーマット）」「複数項目の整合（組合せ）」「マスタに存在するか（照合）」に分けて覚える。誤りやすいのは、範囲の確認をニューメリックチェックと混同すること。
    terms: [リミットチェック, 組合せチェック, 照合チェック, フォーマットチェック, ニューメリックチェック]

  - id: A07-502
    topic: 7-2-4
    diff: 4
    scope: コード設計（桁別コード）。コードの桁ごとに意味を割り当てる桁別コードの特徴（桁ごとの値の個数に上限がある）は、シラバス 7-2-4 の範囲内。必要なのは桁数と文字種からの場合の数の計算のみ。
    prereq: 桁別コードの構造，n 進 m 桁で表せる値の個数の計算
    hard: 欠番・除外文字を差し引いた実際の使用可能数を桁ごとに数え、ちょうど足りる桁と足りない桁を区別する必要がある。
    q: |
      商品コードを「大分類（英大文字1桁）＋中分類（数字2桁）＋連番（数字3桁）」の桁別コードとして設計する。次の運用条件のもとで，将来必要な値の個数を満たせなくなる桁はどれか。

      - 大分類は，数字の 1 や 0 と紛らわしい英大文字 I と O を使わない。将来は 24 種類を使用する見込みである。
      - 中分類は 00 から使用できる。将来は 100 種類を使用する見込みである。
      - 連番は，中分類ごとに 000 を欠番として 001 から付番する。将来は一つの中分類に最大 1,000 品目を付番する見込みである。
    c:
      - 連番だけが不足する。
      - 大分類だけが不足する。
      - 中分類だけが不足する。
      - どの桁も不足しない。
    a: ア
    exp: |
      桁ごとに「使用できる値の個数」を数えて必要数と比べます。
      | 桁 | 使用できる個数 | 必要数 | 判定 |
      | --- | --- | --- | --- |
      | 大分類 | 26 - 2（I，O 除外）= 24 | 24 | ちょうど足りる |
      | 中分類 | 00〜99 の 100 通り | 100 | ちょうど足りる |
      | 連番 | 001〜999 の 999 通り（10^3 - 1） | 1,000 | 1 不足 |
      大分類と中分類は必要数と使用可能数が等しいので足ります。連番だけが、000 を欠番にしたため 999 通りとなり 1 品目分足りません。
    why:
      - 正解です。連番は 000 を欠番とするため 999 通りしかなく、必要な 1,000 品目に 1 足りません。
      - 英大文字 26 種から I と O の 2 種を除いても 24 種が残るので、必要な 24 種類にちょうど足ります。除外を二重に引くか、26 種のままか迷うと誤ります。
      - 数字 2 桁は 00 から 99 までの 100 通りあり、必要な 100 種類にちょうど足ります。最大値 99 を個数と取り違えると不足と誤解します。
      - 連番の 000 を欠番にする条件を見落とすと 1,000 通りあると誤解します。欠番を除くと 999 通りで不足します。
    know: 桁別コードは桁ごとに表せる値の個数の上限があり、一つの桁が足りなくなるとコード体系全体の桁数変更が必要になる。n 進 m 桁の個数は n の m 乗で、0 始まりか 1 始まりか、欠番・除外文字の有無を必ず確認する。
    terms: [桁別コード]
    verify: { manual: '大分類 26-2=24（必要24で足りる），中分類 10^2=100（必要100で足りる），連番 10^3-1=999（必要1000で不足）を確認' }

  - id: A07-503
    topic: 7-2-7
    diff: 3
    scope: ユニバーサルデザイン（WAI，WCAG，JIS X 8341）。アクセシビリティ向上のための基本的な配慮（代替テキスト，色以外の手がかり，キーボード操作，意味のあるリンク文言，文字サイズの変更）は、シラバス 7-2-7 の考え方の範囲内。
    prereq: WCAG の四原則（知覚可能，操作可能，理解可能，堅牢）の考え方
    hard: 複数の改善案から、それぞれがどの利用者の障壁を取り除くかを判断し、適切な案だけの組合せを選ぶ必要がある。
    q: |
      Web ページのアクセシビリティを高めるための改善案として，適切なものの組合せはどれか。

      - a 画像の内容を伝える代替テキストを設定する。
      - b 入力エラーを赤色の文字だけで示していたものを，「エラー」という文言とアイコンも併記して示すようにする。
      - c すべてのリンクの文言を「こちら」に統一して，デザインを整える。
      - d マウス操作でしか開けなかったメニューを，キーボードの Tab キーと Enter キーでも操作できるようにする。
      - e 読みやすさを保つため，文字サイズをブラウザで変更できないように固定する。
    c:
      - a，b，d
      - a，c，d
      - b，c，e
      - a，d，e
    a: ア
    exp: |
      アクセシビリティは、利用者の身体条件や利用環境にかかわらず情報や機能を利用できる度合いです。各案を障壁の解消という観点で検討します。
      - a 画面読み上げソフトの利用者などに画像の内容が伝わるので適切です。
      - b 色の違いが分かりにくい利用者にもエラーが伝わるので適切です（色だけに頼らない）。
      - c リンク文言が全部同じだと、リンク一覧を読み上げたときにリンク先を区別できず不適切です。
      - d マウスを使えない利用者でも操作できるので適切です。
      - e 弱視の利用者などが拡大できなくなるので不適切です。
      適切な案は a，b，d です。
    why:
      - 正解です。代替テキスト、色以外の手がかりの併記、キーボード操作への対応はいずれも利用上の障壁を取り除きます。
      - リンク文言を「こちら」に統一すると、読み上げでリンク一覧を聞いたときに行き先を区別できなくなるため不適切です。デザインの統一を優先した誤りです。
      - リンク文言の統一は行き先が分からなくなる案であり、文字サイズの固定は拡大して読む利用者を妨げる案です。どちらも利用者の障壁を増やします。
      - 文字サイズの固定は、弱視の利用者や高齢者が拡大して読むことを妨げます。見た目を保つ工夫は利用の自由度を下げる点でアクセシビリティに反します。
    know: WCAG は知覚可能・操作可能・理解可能・堅牢の四原則で構成され、日本の JIS X 8341-3 はこれに対応する。色だけで情報を伝えない、キーボードだけで操作できる、拡大しても使える、は頻出の観点。
    terms: [アクセシビリティ, WCAG, JIS X 8341]

  - id: A07-504
    topic: 7-2-5
    diff: 2
    scope: Webデザイン（レスポンシブ Web デザイン，メディアクエリ）。メディアクエリで画面幅に応じて表示を切り替える仕組みは、シラバス 7-2-5 の用語例にあり、min-width と max-width の意味の理解は範囲内。
    prereq: メディアクエリ（min-width，max-width）の意味
    hard: 画面幅の境界値（767px と 768px）と min-width/max-width の向きを取り違えやすい。
    q: |
      次のスタイルシートでは，画面幅に応じて表示する要素を切り替えている。ブラウザの表示領域の幅が 1024 ピクセルのときと 767 ピクセルのときに，それぞれ表示される要素の組合せとして，適切なものはどれか。ただし，表示される要素は display が block になった要素のことである。

      ```
      .menu   { display: none; }
      .toggle { display: none; }
      .side   { display: none; }
      @media (min-width: 768px)  { .menu   { display: block; } }
      @media (max-width: 767px)  { .toggle { display: block; } }
      @media (min-width: 1024px) { .side   { display: block; } }
      ```
    c:
      - 1024 ピクセルは menu と side，767 ピクセルは toggle だけ
      - 1024 ピクセルは menu と side，767 ピクセルはどれも表示されない
      - 1024 ピクセルは side だけ，767 ピクセルは toggle だけ
      - 1024 ピクセルは toggle と side，767 ピクセルは menu だけ
    a: ア
    exp: |
      min-width は「幅がその値以上のとき」、max-width は「幅がその値以下のとき」に適用される条件です。
      | 幅 | min 768 | max 767 | min 1024 | 表示される要素 |
      | --- | --- | --- | --- | --- |
      | 1024 | 成立 | 不成立 | 成立 | menu，side |
      | 767 | 不成立 | 成立 | 不成立 | toggle |
      各ルールは別々の要素の display を block にするだけで、互いを打ち消さないので、1024 ピクセルでは menu と side の両方が表示されます。
    why:
      - 正解です。1024 は min-width が 768 と 1024 の二つとも成立し、767 は max-width の 767 だけが成立します。
      - 767 ピクセルは max-width 767 の条件に「以下」で含まれるので toggle が表示されます。境界値 768 と 767 の取扱いを取り違えた誤りです。
      - min-width 768 と min-width 1024 は段階的に置き換わるのではなく、幅が両方の条件を満たせば両方が適用されます。したがって menu も表示されます。
      - min-width を「以下」、max-width を「以上」と逆に読んだ場合の結果です。min-width は下限、max-width は上限を指定します。
    know: メディアクエリはレスポンシブ Web デザインの中心技術で、画面幅などの条件に応じて CSS を切り替える。min-width は以上、max-width は以下で、同時に複数の条件が成立すれば複数のルールが適用される。
    terms: [メディアクエリ, レスポンシブWebデザイン]
    verify: { manual: '幅1024は 1024>=768 かつ 1024<=767 偽 かつ 1024>=1024 より menu,side。幅767は 767>=768 偽，767<=767 真，767>=1024 偽 より toggle のみ、を確認' }

  - id: A07-505
    topic: 7-2-8
    diff: 3
    scope: ユーザビリティ評価（ヒューリスティック評価，ユーザビリティテスト）。二つの手法の評価者・実施時期・得られる情報の違いは、シラバス 7-2-8 の範囲内。
    prereq: ヒューリスティック評価とユーザビリティテストの特徴と使い分け
    hard: 専門家による検査と利用者の観察という性質の異なる手法を、開発段階に合わせて組み合わせる判断が必要で、一見もっともらしい省略案が多い。
    q: |
      新しい予約サイトの開発で，現在は画面のワイヤーフレームができた段階であり，動作するプロトタイプはまだない。社内には，設計担当者とは別に UI の専門家が 3 人いる。後日，想定利用者を募ることもできる。ユーザビリティ評価の進め方として，最も適切なものはどれか。
    c:
      - 専門家 3 人がユーザビリティの原則に照らしてワイヤーフレームを評価して明らかな問題を取り除き，動作するプロトタイプができた後に，想定利用者に代表的な課題を実施してもらうテストで操作上の問題を確認する。
      - 設計担当者自身が一人でユーザビリティの原則に照らして評価すれば，利用者に課題を実施してもらうテストは不要である。
      - 開発メンバーを被験者として代表的な課題を実施してもらうテストだけを行えば，専門家による評価も想定利用者の参加も不要である。
      - 利用者を対象とするテストは，リリース後まで行わず，それまでは専門家による評価も含めて一切の評価を行わない。
    a: ア
    exp: |
      ヒューリスティック評価は、専門家（複数が望ましい）が経験則（ヒューリスティクス）に照らして画面を検査する手法で、利用者を集めなくても早い段階から実施でき、明らかな問題を安く取り除けます。一方、ユーザビリティテストは想定利用者に課題を実施してもらい、つまずきを観察する手法で、実際の使われ方でしか分からない問題を発見できます。
      したがって、ワイヤーフレーム段階では専門家によるヒューリスティック評価を行い、動くプロトタイプができてから利用者によるテストを行う、という順に組み合わせるのが適切です。
    why:
      - 正解です。早期は専門家の検査で明らかな問題を除き、プロトタイプ後に想定利用者の観察で実際の操作上の問題を確認します。
      - 設計者自身の評価は思い込みで見落としやすく、一人では発見できる問題も少なくなります。また、利用者の実際のつまずきは観察しないと分かりません。
      - 開発メンバーは設計意図や用語を熟知しているため、想定利用者とは異なる行動をとります。被験者として不適切で、問題を見逃します。
      - 評価をリリース後まで先送りすると、問題の修正コストが大きくなります。早期に評価して手戻りを小さくする考え方に反します。
    know: ヒューリスティック評価は専門家が原則に照らして検査する手法で、早期から低コストで実施できるが実際の利用者の行動は分からない。ユーザビリティテストは想定利用者の観察で、被験者は開発者ではなく想定利用者にする。
    terms: [ヒューリスティック評価, ユーザビリティテスト, ワイヤーフレーム]

  - id: A07-506
    topic: 7-2-1
    diff: 3
    scope: UX デザインの五段階モデル（戦略，要件，構造，骨格，表層）。各段階で行う作業の例と、抽象から具体への順序は、シラバス 7-2-1 の範囲内。
    prereq: UX デザインの五段階モデルの各段階の意味と順序
    hard: 作業内容から五段階のどれに当たるかを判断し、構造と骨格、戦略と要件など隣り合う段階の順序を取り違えないようにする必要がある。
    q: |
      UX デザインの五段階モデルに沿って，Web サイトの開発で行う次の作業を，抽象的な（土台となる）ものから具体的なものの順に並べたものはどれか。

      1. 色，フォント，画像などの見た目の決定
      2. サイトマップやページ遷移の設計
      3. 画面のレイアウトを示すワイヤーフレームの作成
      4. 必要な機能の一覧とコンテンツの要求の整理
      5. 利用者のニーズとサイトの事業目標の明確化
    c:
      - 5，4，2，3，1
      - 5，4，3，2，1
      - 4，5，2，3，1
      - 5，2，4，3，1
    a: ア
    exp: |
      五段階モデルは、土台から順に「戦略」「要件」「構造」「骨格」「表層」です。各作業を段階に当てはめます。
      | 作業 | 段階 |
      | --- | --- |
      | 5 利用者のニーズと事業目標 | 戦略 |
      | 4 機能一覧とコンテンツ要求 | 要件 |
      | 2 サイトマップ・ページ遷移 | 構造 |
      | 3 ワイヤーフレーム（画面レイアウト） | 骨格 |
      | 1 色・フォント・画像 | 表層 |
      よって 5，4，2，3，1 の順になります。上の段階の決定が下の段階の前提になります。
    why:
      - 正解です。戦略、要件、構造、骨格、表層の順で、抽象的な目的から見た目の細部へ具体化します。
      - 構造（情報の組立てと遷移）の前に骨格（画面レイアウト）を作る順です。全体の構成が決まる前に個々の画面配置を決めることになり、五段階の順序と逆です。
      - 要件（何を作るか）を戦略（なぜ作るか）より先に置く順です。目的が決まらないまま機能を決めることになり、土台が逆転しています。
      - 構造（サイトマップ）を要件（必要な機能とコンテンツ）より先に置く順です。何を載せるかが決まる前に構成は決められません。
    know: 五段階モデルは下から戦略（目的とニーズ）、要件（機能とコンテンツ）、構造（情報の構成と遷移）、骨格（画面レイアウトとナビゲーション）、表層（見た目）。上位の決定が下位を制約するので、手戻りを避けるには上から順に決める。
    terms: [UXデザインの五段階モデル, ワイヤーフレーム]

  - id: A07-507
    topic: 7-2-6
    diff: 2
    scope: 人間中心設計（JIS Z 8530，ISO 9241-210）。利用の状況の把握、ユーザー要求事項の明示、設計解決策の作成、評価という活動を反復する考え方は、シラバス 7-2-6 の範囲内。
    prereq: 人間中心設計の四つの活動と反復の考え方
    hard:
    q: |
      人間中心設計（JIS Z 8530）に基づく開発で，試作した画面を想定利用者 10 人に評価してもらったところ，7 人が目的の操作を完了できなかった。このときの対応として，適切なものはどれか。
    c:
      - 失敗の原因を分析し，利用の状況の理解，ユーザー要求事項，設計による解決策のうち関係する活動に戻って設計を見直し，改めて評価する。
      - 評価で見つかった問題は，開発完了後の保守で対応することとして，予定どおり次の工程に進む。
      - 失敗した利用者に操作方法を教育して，次回の評価で完了できるようにする。
      - 評価結果にかかわらず，開発者が判断して最終的な仕様を確定する。
    a: ア
    exp: |
      人間中心設計は、「利用の状況の把握と明示」「ユーザー要求事項の明示」「設計による解決策の作成」「設計の評価」の活動を、要求が満たされるまで反復して行う考え方です。評価の結果が要求を満たさなかったときは、原因に応じて前の活動へ戻り、設計を見直して再び評価します。
      誤りの原因が利用の状況の理解不足なら最初の活動、要求の取り違えなら要求の明示、画面設計の問題なら解決策の作成に戻ります。
    why:
      - 正解です。評価結果を踏まえて関係する活動に戻り、設計を見直して再評価する反復が人間中心設計の特徴です。
      - 問題を保守に回すと、完成後の修正で費用が大きくなります。評価の結果を次の設計に生かす反復の考え方に反します。
      - 利用者に操作を覚えさせて問題を回避するのは、人に合わせて設計を変える人間中心設計の考え方とは逆で、設計側の問題が残ります。
      - 利用者の評価を無視して開発者だけで仕様を決めるのは、利用者を中心に据える考え方に反します。
    know: 人間中心設計（JIS Z 8530，ISO 9241-210）は、利用状況の理解、ユーザー要求事項の明示、解決策の作成、評価を反復する。評価結果が要求を満たさない場合は終わらせずに前の活動へ戻る点が重要。
    terms: [人間中心設計]

  - id: A07-508
    topic: 7-1-3
    diff: 2
    scope: GUI（ラジオボタン，チェックボックス，リストボックス，プルダウンメニュー，トグルボタン）。各部品の用途に応じた使い分けは、シラバス 7-1-3 の用語例の範囲内。
    prereq: 主な GUI 部品の用途（排他選択，複数選択，ON/OFF の切替え）
    hard:
    q: |
      次の四つの入力に使う GUI 部品の組合せとして，適切なものはどれか。

      | 項目 | 入力の内容 |
      | --- | --- |
      | 1 | 配送方法を「宅配便」「メール便」「店頭受取」の 3 種類から 1 つ選ぶ。選択肢は常にすべて見えるようにしたい。 |
      | 2 | 通知メールを受け取る設定の ON と OFF を切り替える。切り替えた時点で設定を反映する。 |
      | 3 | 興味のあるカテゴリを 30 種類の中から複数選ぶ。画面上に確保できる領域は狭い。 |
      | 4 | 利用規約に同意するかどうかを入力する。 |
    c:
      - 項目1 ラジオボタン，項目2 トグルボタン，項目3 リストボックス，項目4 チェックボックス
      - 項目1 プルダウンメニュー，項目2 チェックボックス，項目3 リストボックス，項目4 トグルボタン
      - 項目1 ラジオボタン，項目2 トグルボタン，項目3 チェックボックス，項目4 リストボックス
      - 項目1 ラジオボタン，項目2 チェックボックス，項目3 プルダウンメニュー，項目4 トグルボタン
    a: ア
    exp: |
      条件ごとに適した部品を検討します。
      - 項目1は「1つだけ選ぶ」「選択肢が常に見える」ので、排他選択のラジオボタンです。
      - 項目2は即時に反映する ON/OFF の切替えなので、トグルボタン（スイッチ）です。
      - 項目3は「複数選択」かつ「領域が狭い」ので、スクロールできるリストボックス（複数選択）です。30 個のチェックボックスでは領域を大きく使います。
      - 項目4は同意の有無という 2 値の入力なので、チェックボックスです。
    why:
      - 正解です。排他選択はラジオボタン、即時の ON/OFF はトグル、領域が狭い複数選択はリストボックス、同意の有無はチェックボックスが適します。
      - プルダウンメニューは選択肢を閉じて隠すため、常に見せたい条件に合いません。また、ON/OFF の即時反映にはチェックボックスよりトグルが適します。
      - 30 個のチェックボックスは画面の領域を大きく使うため、領域が狭い条件に合いません。同意の入力にリストボックスを使うのも不自然です。
      - 通常のプルダウンメニューは 1 つしか選べず、複数選択の要件を満たしません。また、同意の有無にトグルボタンを使うと入力の意味が曖昧になります。
    know: 部品の選び方は、1つだけ選ぶならラジオボタンまたはプルダウン、複数選ぶならチェックボックスまたはリストボックス（複数選択）、ON/OFF の即時切替えならトグル。選択肢を常に見せたいか、領域が狭いかが分かれ目。
    terms: [ラジオボタン, チェックボックス, リストボックス, プルダウンメニュー, トグルボタン]
