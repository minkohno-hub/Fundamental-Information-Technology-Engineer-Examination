questions:
  - id: A22-509
    topic: 22-2-1-6
    diff: 4
    scope: 22-2-1-6 OR の在庫管理。経済的発注量（EOQ）のときと現行の発注量のときで、年間の発注費用と保管費用の合計をそれぞれ計算し、削減効果を比較する問題であり、範囲内。
    prereq: 年間の発注費用 ＝ 1 回の発注費用 × （年間需要量 ÷ 発注量）、年間の保管費用 ＝ 保管費用（1 個あたり） × 平均在庫（発注量 ÷ 2）という見積り
    hard: EOQ の値（200 個）を公式で求める段階に加え、現行と EOQ の2通りについて発注費用と保管費用を別々に計算して合計を比較する、複数段階の計算が必要になる。
    q: |
      ある部品の年間需要量は 2,000 個、発注 1 回あたりの発注費用は 2,500 円、在庫 1 個あたりの年間保管費用は 250 円である。現在は 1 回に 80 個ずつ発注している。発注量を経済的発注量（EOQ）に変更すると、年間の総費用（発注費用と保管費用の合計）は何円削減できるか。ここで、平均在庫は発注量の半分とし、EOQ は √（2 × 年間需要量 × 発注費用 ÷ 保管費用）で求めるものとする。
    c: ['37,500', '15,000', '22,500', '50,000']
    a: ウ
    exp: |
      まず EOQ を求めます。EOQ ＝ √（2 × 2,000 × 2,500 ÷ 250）＝ √40,000 ＝ 200 個です。次に、2 通りの年間総費用を計算します。
      - 現行（80 個ずつ）： 発注回数 2,000 ÷ 80 ＝ 25 回 → 発注費用 2,500 × 25 ＝ 62,500 円。保管費用は平均在庫 40 個 × 250 ＝ 10,000 円。合計 72,500 円
      - EOQ（200 個ずつ）： 発注回数 2,000 ÷ 200 ＝ 10 回 → 発注費用 2,500 × 10 ＝ 25,000 円。保管費用は平均在庫 100 個 × 250 ＝ 25,000 円。合計 50,000 円
      削減額 ＝ 72,500 − 50,000 ＝ 22,500 円です。EOQ では、発注費用と保管費用がちょうど等しくなっている点も確認できます。
    why:
      - 発注費用の差だけを見た値（62,500 − 25,000）です。発注量を増やすと保管費用が増える分を差し引く必要があります。
      - 保管費用の差だけを見た値（25,000 − 10,000）です。保管費用は増える側であり、削減額の計算には発注費用の減少と合わせて考える必要があります。
      - 正解です。現行の合計 72,500 円から EOQ の合計 50,000 円を引いて 22,500 円です。
      - EOQ のときの総費用そのものです。求められているのは削減額です。
    know: 発注量を増やすと発注費用は減るが保管費用は増える。EOQ はこの2つの合計が最小になる点であり、そこでは両費用が等しくなる。費用の片方だけを見て発注量を決めると、合計では損になる。
    terms: [経済的発注量]
    verify: { value: '(2500 * (2000 / 80) + 250 * 80 / 2) - (2500 * (2000 / 200) + 250 * 200 / 2)' }

  - id: A22-510
    topic: 22-2-1-3
    diff: 3
    scope: 22-2-1-3 プロジェクトの時間見積り。PERT の三点見積り（楽観値・最可能値・悲観値の加重平均）で作業の期待所要時間を求める問題であり、範囲内。
    prereq: 三点見積りの期待値 ＝ （楽観値 ＋ 4 × 最可能値 ＋ 悲観値） ÷ 6 という加重の形
    hard: 単純平均ではなく最可能値を 4 倍する加重平均である点と、3 つの値の役割を取り違えないことが求められる。
    q: |
      ある作業の所要時間について、楽観値が 4 日、最可能値が 7 日、悲観値が 16 日と見積もられた。PERT の三点見積りによる期待所要時間は何日か。
    c: ['9', '7', '8', '10']
    a: ウ
    exp: |
      三点見積りの期待値は、最可能値を重視した加重平均で、（楽観値 ＋ 4 × 最可能値 ＋ 悲観値） ÷ 6 で求めます。
      - （4 ＋ 4 × 7 ＋ 16） ÷ 6 ＝ （4 ＋ 28 ＋ 16） ÷ 6 ＝ 48 ÷ 6 ＝ 8 日
      悲観値が大きいため、期待値は最可能値の 7 日より少し大きくなります。
    why:
      - 3 つの値の単純平均（（4 ＋ 7 ＋ 16） ÷ 3）の値です。三点見積りでは最可能値を 4 倍して加重します。
      - 最可能値そのものです。楽観値と悲観値も織り込むのが三点見積りです。
      - 正解です。（4 ＋ 28 ＋ 16） ÷ 6 ＝ 8 日です。
      - 楽観値と悲観値だけを平均した場合（（4 ＋ 16） ÷ 2）の値です。三点見積りでは最可能値を 4 倍して織り込みます。
    know: 三点見積りは、不確実性の大きい作業について、幅を持った3つの見積りを1つの期待値に集約する方法。最可能値への重み 4 は、分布の偏りを近似するための係数である。
    terms: [PERT, 三点見積り]
    verify: { value: '(4 + 4 * 7 + 16) / 6' }

  - id: A22-511
    topic: 22-3-2
    diff: 3
    scope: 22-3-2 財務分析。棚卸資産を除いた当座資産で当座比率を計算し、流動比率との違いを判断する問題であり、範囲内。
    prereq: 当座比率 ＝ 当座資産 ÷ 流動負債、当座資産 ＝ 流動資産 − 棚卸資産 という関係
    hard: 流動資産をそのまま使う流動比率との違い（換金の確実性が低い棚卸資産を除く）を踏まえて分子を組み立てる必要がある。
    q: |
      ある企業の流動資産は 800 百万円（うち棚卸資産 300 百万円、売上債権 350 百万円、現金及び預金 150 百万円）、流動負債は 500 百万円である。当座比率は何％か。
    c: ['160', '100', '70', '130']
    a: イ
    exp: |
      当座比率は、すぐに現金化できる資産（当座資産）で流動負債をどれだけ賄えるかを見る指標です。
      - 当座資産 ＝ 流動資産 − 棚卸資産 ＝ 800 − 300 ＝ 500 百万円
      - 当座比率 ＝ 500 ÷ 500 × 100 ＝ 100％
      流動比率（800 ÷ 500 ＝ 160％）より厳しい評価になるのは、売れるかどうか不確実な棚卸資産を除いているためです。
    why:
      - 流動比率（流動資産 ÷ 流動負債）の値です。当座比率では棚卸資産を除きます。
      - 正解です。当座資産 500 百万円 ÷ 流動負債 500 百万円 で 100％ です。
      - 売上債権だけを分子にした値です。現金及び預金も当座資産に含めます。
      - 現金及び預金を除いた値です。当座資産は「流動資産 − 棚卸資産」で求めます。
    know: 当座比率は流動比率を厳しくした指標で、棚卸資産のように換金が不確実なものを除く。両者を併せて見ることで、在庫に依存した見かけの流動性を排除できる。
    terms: [当座比率, 流動比率]
    verify: { value: '(800 - 300) / 500 * 100' }

  - id: A22-512
    topic: 22-3-1-2
    diff: 3
    scope: 22-3-1-2 財務会計の原価計算。期首・仕入・期末の在庫から売上原価を組み立て、売上総利益まで求める2段階の計算であり、範囲内。
    prereq: 売上原価 ＝ 期首商品棚卸高 ＋ 当期商品仕入高 − 期末商品棚卸高 という構造
    hard: 在庫の増減を正しい符号で組み入れる段階と、売上高から差し引く段階の2つを、順序を誤らずに処理する必要がある。
    q: |
      ある小売店の当期の売上高は 2,000 万円、期首商品棚卸高は 200 万円、当期商品仕入高は 1,500 万円、期末商品棚卸高は 350 万円である。売上総利益は何万円か。
    c: ['500', '850', '650', '300']
    a: ウ
    exp: |
      まず売上原価を組み立てます。
      - 売上原価 ＝ 期首 200 ＋ 仕入 1,500 − 期末 350 ＝ 1,350 万円
      - 売上総利益 ＝ 売上高 2,000 − 売上原価 1,350 ＝ 650 万円
      期末に残った在庫は売れていないので原価から除き、期首の在庫は当期に売れた原価に含める、という流れです。
    why:
      - 期首・期末の在庫を両方とも無視し、売上高から仕入高だけを引いた値です。在庫の動きも原価の構成要素です。
      - 期首在庫を加え忘れた場合（2,000 − （1,500 − 350））の値です。期首在庫も当期の原価を構成します。
      - 正解です。売上原価 1,350 万円を差し引いて 650 万円です。
      - 期末在庫を引き忘れた場合の値です。売上原価が期首＋仕入の 1,700 万円となり、粗利は 300 万円になります。
    know: 売上原価は「期首 ＋ 仕入 − 期末」で組み立てる。在庫の評価や棚卸しが売上原価を通じて利益に直結するため、期末在庫の確定は決算の重要手続になる。
    terms: [売上原価, 売上総利益]
    verify: { value: '2000 - (200 + 1500 - 350)' }

  - id: A22-513
    topic: 22-2-1-5
    diff: 3
    scope: 22-2-1-5 需要予測。新しいデータほど重みを大きくする加重移動平均で、来期の需要予測値を計算する問題であり、範囲内。
    prereq: 加重移動平均は、各期の実績に重みを掛けて合計する（重みの合計は 1）という計算の形
    hard: 4 週分の実績と重みの対応（最も新しい週に最大の重み）を正しく割り当て、掛けて合計する必要がある。単純平均との違いも判断の対象になる。
    q: |
      ある商品の直近 4 週の需要は、古い順に 120 個、140 個、130 個、150 個であった。重みを古い順に 0.1、0.2、0.3、0.4 とする加重移動平均で、来週の需要を予測すると何個になるか。
    c: ['135', '139', '131', '137']
    a: イ
    exp: |
      加重移動平均は、各週の需要に重みを掛けて合計します。重みは新しい週ほど大きくします。
      - 120 × 0.1 ＋ 140 × 0.2 ＋ 130 × 0.3 ＋ 150 × 0.4 ＝ 12 ＋ 28 ＋ 39 ＋ 60 ＝ 139 個
      単純移動平均（（120 ＋ 140 ＋ 130 ＋ 150） ÷ 4 ＝ 135 個）より大きくなります。最近の需要が増えている傾向を、重み付けによって予測に反映できているためです。
    why:
      - 単純移動平均の値です。重み付けをしていないため、最近の増加傾向が反映されません。
      - 正解です。重みを掛けた合計は 139 個です。
      - 重みの割り当てを逆（新しい週ほど小さい重み）にした場合の値です（48 ＋ 42 ＋ 26 ＋ 15 ＝ 131）。重みは新しい週ほど大きくします。
      - 直近の週とその1つ前の週の重みを取り違えた場合の値です（12 ＋ 28 ＋ 52 ＋ 45 ＝ 137）。最も新しい週の重みが最大の 0.4 です。
    know: 加重移動平均は、古いデータの影響を薄め、直近の変化を予測に反映させる方法。重みの付け方で予測の追随性が変わり、単純移動平均はその特殊な場合（全て等しい重み）といえる。
    terms: [移動平均法, 需要予測]
    verify: { value: '120 * 0.1 + 140 * 0.2 + 130 * 0.3 + 150 * 0.4' }

  - id: A22-514
    topic: 22-3-1-2
    diff: 3
    scope: 22-3-1-2 原価計算の製造間接費の配賦。配賦基準（機械作業時間）の比率で間接費を分け、製品の製造原価まで求める問題であり、範囲内。
    prereq: 配賦額 ＝ 間接費総額 × （その製品の配賦基準量 ÷ 配賦基準量の合計）という比例配分の計算
    hard: 配賦率を先に求める経路でも比率で分ける経路でもよいが、製品 A の時間の割合（300 ÷ 500）を取り違えず、直接費に加える2段階の計算が必要になる。
    q: |
      ある工場の製造間接費の総額は 600 万円で、機械作業時間を基準に製品へ配賦する。製品 A の機械作業時間は 300 時間、製品 B は 200 時間であった。製品 A の直接費が 500 万円のとき、製品 A の製造原価は何万円か。
    c: ['740', '860', '500', '1,100']
    a: イ
    exp: |
      まず製品 A への製造間接費の配賦額を求めます。
      - 配賦額 ＝ 600 × （300 ÷ （300 ＋ 200）） ＝ 600 × 0.6 ＝ 360 万円
      - 製品 A の製造原価 ＝ 直接費 500 ＋ 配賦額 360 ＝ 860 万円
      配賦は、共通にかかった費用を、消費した基準量の比率で分ける手続です。
    why:
      - 時間の比率を取り違え、製品 B の割合（200 ÷ 500）で配賦した場合の値です。製品 A の割合は 300 ÷ 500 です。
      - 正解です。配賦額 360 万円に直接費 500 万円を加えて 860 万円です。
      - 直接費だけの値です。製造間接費の配賦額を加える必要があります。
      - 間接費の総額をそのまま製品 A に加えた値です。間接費は A と B に分けて配賦します。
    know: 製造間接費は、製品ごとに直接は捉えられないため、機械作業時間や直接作業時間などの配賦基準で分ける。配賦基準の選び方によって製品別の原価が変わる点が、原価計算の重要な論点である。
    terms: [製造間接費, 製造原価]
    verify: { value: '500 + 600 * 300 / (300 + 200)' }

  - id: A22-515
    topic: 22-3-5
    diff: 3
    scope: 22-3-5 在庫の評価。期中の受払い全体から平均単価を求める総平均法で、期末在庫の評価額を計算する問題であり、範囲内。
    prereq: 総平均法の平均単価 ＝ （期首在庫金額 ＋ 当期仕入金額） ÷ （期首在庫数量 ＋ 当期仕入数量）という計算
    hard: 数量と金額を別々に合計して平均単価を出す段階と、その単価を期末数量に掛ける段階の2つを処理する必要がある。先入先出法や移動平均法の手順と混同しないことも求められる。
    q: |
      ある材料の 4 月の受払いは次のとおりである。総平均法で評価した場合、4 月末の在庫の評価額は何円か。

      - 期首在庫： 100 個（単価 500 円）
      - 4 月 5 日仕入： 200 個（単価 560 円）
      - 4 月 18 日仕入： 100 個（単価 620 円）
      - 4 月中の払出： 250 個
    c: ['78,000', '84,000', '90,000', '75,000']
    a: イ
    exp: |
      総平均法では、期間全体の平均単価を先に求めます。
      - 金額の合計 ＝ 100 × 500 ＋ 200 × 560 ＋ 100 × 620 ＝ 50,000 ＋ 112,000 ＋ 62,000 ＝ 224,000 円
      - 数量の合計 ＝ 100 ＋ 200 ＋ 100 ＝ 400 個
      - 平均単価 ＝ 224,000 ÷ 400 ＝ 560 円
      - 期末在庫は 400 − 250 ＝ 150 個なので、評価額 ＝ 150 × 560 ＝ 84,000 円
    why:
      - 後入先出法で評価した場合の値です（期末は古い在庫から残り、100 × 500 ＋ 50 × 560 ＝ 78,000）。総平均法では期間全体の平均単価を使います。
      - 正解です。平均単価 560 円 × 期末 150 個で 84,000 円です。
      - 先入先出法で評価した場合の値です（期末は新しい在庫が残り、50 × 560 ＋ 100 × 620 ＝ 90,000）。平均単価は受払い全体から求めます。
      - 期首の単価 500 円で評価した場合の値です。期中の仕入単価も平均に織り込みます。
    know: 総平均法は期間の終わりに平均単価が確定するため、払出の都度に単価が決まる移動平均法と違い、期間中は在庫の金額が確定しない。先入先出法・移動平均法との手順の違いが評価額の差になる。
    terms: [総平均法, 在庫評価]
    verify: { value: '150 * (100 * 500 + 200 * 560 + 100 * 620) / 400' }

  - id: A22-516
    topic: 22-3-1-4
    diff: 4
    scope: 22-3-1-4 損益計算書の読み取り。段階利益を順に計算し、特別損失と法人税等まで経て当期純利益を求める複合問題であり、範囲内。
    prereq: 売上総利益、営業利益、経常利益、税引前当期純利益、当期純利益という段階利益の並びと、それぞれに加減する項目
    hard: 営業外損益と特別損失を入れる位置を正しく置き、最後に税引前利益へ税率を適用するまで、4 段階の計算を一貫して処理する必要がある。
    q: |
      ある企業の損益計算書の項目は次のとおりである。当期純利益は何百万円か。ここで、法人税等は税引前当期純利益の 30％ とする。

      - 売上高 5,000、売上原価 3,200、販売費及び一般管理費 1,100
      - 営業外収益 80、営業外費用 130、特別損失 150（単位は全て百万円）
    c: ['650', '500', '455', '350']
    a: エ
    exp: |
      段階利益を上から順に計算します。
      - 売上総利益 ＝ 5,000 − 3,200 ＝ 1,800
      - 営業利益 ＝ 1,800 − 1,100 ＝ 700
      - 経常利益 ＝ 700 ＋ 80 − 130 ＝ 650
      - 税引前当期純利益 ＝ 650 − 150（特別損失） ＝ 500
      - 法人税等 ＝ 500 × 0.3 ＝ 150、当期純利益 ＝ 500 − 150 ＝ 350 百万円
    why:
      - 経常利益の値です。特別損失と法人税等を差し引く前の段階です。
      - 税引前当期純利益の値です。法人税等を差し引いて当期純利益になります。
      - 経常利益に税率を適用した値です。税率は、特別損失を差し引いた後の税引前当期純利益に適用します。
      - 正解です。税引前 500 百万円から法人税等 150 百万円を引いて 350 百万円です。
    know: 損益計算書の段階利益は、本業の利益（営業利益）、経常的な収支を加えた利益（経常利益）、臨時の損益を加えた税引前利益、税金を引いた当期純利益、という順に意味が変わる。どの段階の利益かが分析の出発点になる。
    terms: [損益計算書, 当期純利益]
    verify: { value: '(5000 - 3200 - 1100 + 80 - 130 - 150) * (1 - 0.3)' }
