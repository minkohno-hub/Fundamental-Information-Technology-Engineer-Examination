questions:
  - id: A04-517
    topic: 4-2-2-2
    diff: 3
    scope: 4-2-2-2 並列処理とアムダールの法則。並列化できる割合が限られる場合の、全体の高速化率を求める問題
    prereq: アムダールの法則（全体の高速化率は、並列化できない部分の割合に支配される）
    hard: 並列化できる部分だけがコア数で速くなり、残りの部分はそのまま残るため、高速化率がコア数そのものにはならない点を計算に反映させる必要がある。
    q: |
      あるプログラムの実行時間のうち、80 ％は並列化できる部分であり、残りの 20 ％は逐次に実行しなければならない。このプログラムを 8 コアのプロセッサで実行するとき、全体の高速化率として最も近い値はどれか。
    c: ['2.5', '3.3', '5', '6.4']
    a: イ
    exp: |
      アムダールの法則では、高速化率は次の式で求めます。

      高速化率 ＝ 1 ÷ （並列化できない割合 ＋ 並列化できる割合 ÷ コア数）
      ＝ 1 ÷ (0.2 ＋ 0.8 ÷ 8)
      ＝ 1 ÷ (0.2 ＋ 0.1)
      ＝ 1 ÷ 0.3 ≒ 3.33

      最も近い値は 3.3 です。コア数を無限に増やしても、高速化率は 1 ÷ 0.2 ＝ 5 が上限です。
    why:
      - コア数を 4 とした場合の値（1 ÷ (0.2 ＋ 0.8 ÷ 4) ≒ 2.5）です。本問は 8 コアです。
      - 正解です。1 ÷ (0.2 ＋ 0.1) ≒ 3.3 です。
      - コア数を無限に増やしたときの上限（1 ÷ 0.2）です。8 コアではそこまで届きません。
      - 並列化できる割合にコア数を単純に掛けた値（0.8 × 8）です。逐次部分がボトルネックになることを考慮していません。
    know: アムダールの法則は、並列化の効果が「並列化できない部分の割合」で頭打ちになることを示す。高速化率の上限は、コア数ではなく逐次部分の割合だけで決まる。
    terms: [アムダールの法則, 並列処理]
    verify: { type: value, value: 3.3 }

  - id: A04-518
    topic: 4-2-1-1
    diff: 3
    scope: 4-2-1-1 キャッシュメモリと実効アクセス時間。ヒット時とミス時のアクセス時間から、平均の実効アクセス時間を求める問題
    prereq: ヒット率による加重平均、ミス時はキャッシュへのアクセスに加えて主記憶へのアクセスが必要なこと
    hard: ミス時の時間に、キャッシュへアクセスした時間も含まれる点を見落としやすい。ヒット率とミス率で加重平均する構造も押さえる必要がある。
    q: |
      キャッシュメモリのヒット率が 90 ％、ヒット時のアクセス時間が 10 ナノ秒である。ミスした場合は、キャッシュへのアクセスに加えて主記憶からデータを読み出すために 90 ナノ秒が追加で必要になる。このとき、実効アクセス時間は何ナノ秒か。
    c: ['14.5', '18', '19', '28']
    a: ウ
    exp: |
      ミス時のアクセス時間は、キャッシュの 10 ナノ秒に主記憶の 90 ナノ秒を加えた 100 ナノ秒です。

      実効アクセス時間 ＝ 0.9 × 10 ＋ 0.1 × 100
      ＝ 9 ＋ 10
      ＝ 19 ナノ秒

      ヒット率で加重平均するのが要点です。
    why:
      - ミス率を 5 ％として計算した値（0.95 × 10 ＋ 0.05 × 100 ＝ 14.5）です。本問のミス率は 10 ％です。
      - ミス時の時間を主記憶の 90 ナノ秒だけとして計算した値（0.9 × 10 ＋ 0.1 × 90 ＝ 18）です。ミス時もキャッシュへのアクセス時間が必要です。
      - 正解です。0.9 × 10 ＋ 0.1 × 100 ＝ 19 ナノ秒です。
      - ヒット率を 80 ％として計算した値（0.8 × 10 ＋ 0.2 × 100 ＝ 28）です。本問のヒット率は 90 ％です。
    know: 実効アクセス時間は、ヒット時とミス時の時間をヒット率で加重平均したもの。ミス時の時間には、キャッシュへのアクセス時間も含まれる点が間違えやすい。
    terms: [キャッシュメモリ, ヒット率, 実効アクセス時間]
    verify: { type: value, value: 19 }

  - id: A04-519
    topic: 4-2-1-2
    diff: 3
    scope: 4-2-1-2 磁気ディスクのアクセス時間。シーク時間、平均回転待ち時間、データ転送時間の合計を求める問題
    prereq: 回転待ち時間は回転周期から求めること（平均は半回転分）、転送時間はデータ量を転送速度で割ること
    hard: 回転数が毎分単位で与えられるため秒・ミリ秒への換算が必要であり、平均回転待ちが半回転分である点も押さえる必要がある。
    q: |
      回転数が 6,000 回転／分の磁気ディスク装置がある。平均シーク時間が 4 ミリ秒、転送速度が 160 M バイト／秒のとき、16 K バイトのデータを読むためのアクセス時間は約何ミリ秒か。ここで、1 K バイト ＝ 1,000 バイト、1 M バイト ＝ 1,000,000 バイトとする。
    c: ['5.1', '9.1', '14.1', '19.1']
    a: イ
    exp: |
      アクセス時間は、シーク時間、回転待ち時間、転送時間の合計です。
      - 回転周期： 60 秒 ÷ 6,000 回転 ＝ 0.01 秒 ＝ 10 ミリ秒。平均回転待ち時間は半回転分の 5 ミリ秒
      - 転送時間： 16,000 バイト ÷ 160,000,000 バイト／秒 ＝ 0.0001 秒 ＝ 0.1 ミリ秒
      - 合計： 4 ＋ 5 ＋ 0.1 ＝ 9.1 ミリ秒
    why:
      - シーク時間を落とした値（5 ＋ 0.1）です。アクセス時間にはシーク時間も含まれます。
      - 正解です。4 ＋ 5 ＋ 0.1 ＝ 9.1 ミリ秒です。
      - 回転待ち時間を 1 回転分（10 ミリ秒）として計算した値です。平均の待ちは半回転分です。
      - 回転待ち時間を 1 回転分とし、さらに平均待ちも加えた値です。回転待ちは平均の 5 ミリ秒だけを数えます。
    know: ディスクのアクセス時間は「平均シーク時間 ＋ 平均回転待ち時間（半回転分）＋ 転送時間」の合計。回転数から回転周期への換算と、平均待ちが半分になる理由が要点である。
    terms: [シーク時間, 回転待ち時間, データ転送時間]
    verify: { type: value, value: 9.1 }

  - id: A04-520
    topic: 4-1-2
    diff: 2
    scope: 4-1-2 稼働率と許容停止時間。目標稼働率から、期間内に許容される停止時間の長さを逆算する問題
    prereq: 稼働率の定義（停止できる割合は 1 － 稼働率）、時間と分への単位換算
    q: |
      月間（30 日）の稼働率 99.95 ％を目標とするシステムがある。この目標を守るために許容される停止時間は、月間で最大何分か。
    c: ['3.6', '21.6', '36', '216']
    a: イ
    exp: |
      30 日は 30 × 24 ＝ 720 時間です。停止できる割合は 1 － 0.9995 ＝ 0.0005 なので、

      許容停止時間 ＝ 720 × 0.0005 ＝ 0.36 時間
      ＝ 0.36 × 60 ＝ 21.6 分

      間違えやすいのは、割合の桁（0.05 ％は 0.0005）と、時間から分への換算の2点です。稼働率 99.9 ％なら許容は 43.2 分、99.99 ％なら 4.32 分というように、9 が 1 つ増えるごとに許容停止時間は 10 分の 1 になります。
    why:
      - 停止できる割合を 0.005 と 10 倍に取り違え（720 × 0.005 ＝ 3.6)、さらにその数値を、時間のまま分と読み替えた場合の値です。正しくは割合 0.0005 で計算し、0.36 時間を分に換算します。
      - 正解です。720 時間 × 0.0005 ＝ 0.36 時間 ＝ 21.6 分です。
      - 720 × 0.05 ＝ 36 を分と読み替えた値です。割合の取り違えと単位の混同があります。
      - 0.36 時間を 216 分と換算した値です。1 時間は 60 分なので、0.36 時間は 21.6 分です。
    know: 許容停止時間は「期間の長さ × (1 － 稼働率）」で求める。稼働率の 9 の数が増えるほど許容時間は 10 分の 1 ずつ短くなり、分単位の換算まで含めて扱うことが実務では重要になる。
    terms: [稼働率]
    verify: { type: value, value: 21.6 }

  - id: A04-521
    topic: 4-1-2
    diff: 2
    scope: 4-1-2 故障率と MTBF。故障率が一定の装置を直列に接続した場合の、システム全体の MTBF を求める問題
    prereq: MTBF は故障率の逆数であること、直列系では故障率が加算されること
    q: |
      故障率が 0.001／時間で一定の装置がある。この装置を 4 台直列に接続したシステム全体の MTBF は何時間か。ここで、直列系ではいずれか 1 台の故障がシステム全体の故障になるものとする。
    c: ['250', '500', '1000', '4000']
    a: ア
    exp: |
      直列系では、故障率は台数分だけ加算されます。システム全体の故障率は 0.001 × 4 ＝ 0.004／時間です。

      MTBF ＝ 1 ÷ 故障率 ＝ 1 ÷ 0.004 ＝ 250 時間

      装置 1 台だけなら MTBF は 1 ÷ 0.001 ＝ 1,000 時間ですが、直列では「どれか 1 台が故障すれば全体が故障する」ため、故障の機会が台数分に増えます。故障率は加算、MTBF はその逆数という関係を押さえることが要点です。
    why:
      - 正解です。故障率は 4 台分で 0.004／時間となり、MTBF はその逆数の 250 時間です。
      - 2 台分として計算した値です。本問は 4 台の直列です。
      - 装置 1 台だけの MTBF（1 ÷ 0.001）です。直列では台数分だけ故障しやすくなります。
      - 台数を掛けてしまった値です。直列では MTBF は増えるのではなく、故障率が加算されて MTBF は短くなります。
    know: 故障率が一定（指数分布）の部品では、直列系の故障率は各故障率の和になり、MTBF はその逆数。並列冗長とは逆に、直列の台数が増えるほど MTBF は短くなる。
    terms: [故障率, MTBF]
    verify: { type: value, value: 250 }

  - id: A04-522
    topic: 4-2-3
    diff: 3
    scope: 4-2-3 バッチ処理の性能指標。FCFS で処理するジョブの完了時刻から、平均ターンアラウンド時間を求める問題
    prereq: ターンアラウンド時間は「完了時刻 － 到着時刻」であること、先着順（FCFS）では前のジョブの完了を待つこと
    hard: 各ジョブの完了時刻が、到着時刻と前のジョブの処理の積み重ねで決まることを追い、到着時刻を引く前の量（完了時刻の平均など）と混同しない必要がある。
    q: |
      3 つのジョブを 1 台の処理装置で先着順（FCFS）に処理する。各ジョブの到着時刻と処理時間（分）が次の表のとき、平均ターンアラウンド時間は何分か。

      | ジョブ | 到着時刻（分） | 処理時間（分） |
      | --- | --- | --- |
      | J1 | 0 | 5 |
      | J2 | 1 | 3 |
      | J3 | 2 | 4 |
    c: ['3.33', '4', '7.33', '8.33']
    a: ウ
    exp: |
      FCFS では、J1 が 0〜5 分、J2 は J1 の完了を待って 5〜8 分、J3 は 8〜12 分に処理されます。
      - J1： 完了 5、ターンアラウンド ＝ 5 － 0 ＝ 5
      - J2： 完了 8、ターンアラウンド ＝ 8 － 1 ＝ 7
      - J3： 完了 12、ターンアラウンド ＝ 12 － 2 ＝ 10
      平均は (5 ＋ 7 ＋ 10) ÷ 3 ＝ 22 ÷ 3 ≒ 7.33 分です。
    why:
      - 平均待ち時間（(0 ＋ 4 ＋ 6) ÷ 3 ≒ 3.33）です。ターンアラウンド時間には処理時間自身も含まれます。
      - 平均処理時間（(5 ＋ 3 ＋ 4) ÷ 3）です。待ち時間が含まれていません。
      - 正解です。各ジョブの（完了時刻 － 到着時刻）の平均で、約 7.33 分です。
      - 平均完了時刻（(5 ＋ 8 ＋ 12) ÷ 3 ≒ 8.33）です。到着時刻を引いていません。
    know: ターンアラウンド時間は、投入（到着）から完了までの経過時間であり、待ち時間と処理時間の合計に等しい。完了時刻の平均とは別物で、到着時刻を引くことが要点である。
    terms: [ターンアラウンド時間, スループット]
    verify: { type: value, value: 7.33 }

  - id: A04-523
    topic: 4-2-2-2
    diff: 4
    scope: 4-2-2-2 並列処理の実行時間。逐次部分、並列化できる部分、同期のオーバヘッドを組み合わせて実行時間を求める問題
    prereq: 並列化できる部分はプロセッサ数で割れること、逐次部分とオーバヘッドは割れないこと
    hard: 実行時間が3つの要素（割れない逐次部分、割れる並列部分、割れないオーバヘッド）の合計になることを見抜き、それぞれを正しく扱う必要がある。
    q: |
      逐次に実行すると 120 秒かかる処理がある。この処理は、並列化できない部分が 20 秒、残りの 100 秒はプロセッサ数に応じて分割できる部分から成る。これを 4 台のプロセッサで並列実行すると、同期や通信のオーバヘッドが合計 8 秒発生する。全体の実行時間は何秒か。
    c: ['30', '45', '53', '120']
    a: ウ
    exp: |
      実行時間は、3つの要素の合計です。
      - 逐次部分： 20 秒（そのまま）
      - 並列部分： 100 ÷ 4 ＝ 25 秒
      - オーバヘッド： 8 秒（そのまま）
      合計は 20 ＋ 25 ＋ 8 ＝ 53 秒です。高速化率は 120 ÷ 53 ≒ 2.26 にとどまります。
    why:
      - 全体を 4 台で割った値（120 ÷ 4）です。逐次部分とオーバヘッドは割り算できません。
      - オーバヘッドを落とした値（20 ＋ 25）です。本問では同期などのオーバヘッド 8 秒が発生します。
      - 正解です。20 ＋ 25 ＋ 8 ＝ 53 秒です。
      - 逐次実行の時間そのものです。並列部分は 25 秒に短縮されます。
    know: 並列実行の実行時間は、逐次部分、分割できる部分（台数で割る）、オーバヘッド（台数を増やすと増えることもある）の合計で決まる。台数を増やしても逐次部分とオーバヘッドが下限を作る。
    terms: [並列処理, オーバヘッド]
    verify: { type: value, value: 53 }

  - id: A04-524
    topic: 4-1-7
    diff: 4
    scope: 4-1-7 フェイルオーバと実効稼働率。切替えの成功率を考慮して、主系・待機系の構成の実効的な稼働率を求める問題
    prereq: 主系が故障したときにだけ待機系と切替えが関与すること、各事象の確率を掛け合わせて経路ごとに足すこと
    hard: 理想的な並列系の式（1 － 故障率の積）をそのまま使えず、切替えが成功するという条件を経路に組み込む必要がある。
    q: |
      主系と待機系から成るシステムがある。主系と待機系の稼働率はどちらも 0.99 で、主系が故障したときに待機系へ正しく切り替わる確率は 0.90 である。このシステムの実効的な稼働率として最も近い値はどれか。ここで、稼働率が最も近いパーセントの値を選ぶこと。
    c: ['99', '98.01', '99.89', '99.99']
    a: ウ
    exp: |
      システムが稼働する経路は2つあります。
      - 主系が稼働する： 0.99
      - 主系が故障し（0.01)、切替えが成功し（0.90)、待機系が稼働する（0.99)： 0.01 × 0.90 × 0.99 ＝ 0.00891
      合計は 0.99 ＋ 0.00891 ＝ 0.99891、すなわち約 99.89 ％です。切替えの失敗が、理想的な並列系との差を生みます。
    why:
      - 主系だけの稼働率です。待機系への切替えが成功する経路も稼働に寄与します。
      - 主系と待機系の両方が稼働していないと動かない、直列構成と誤解した場合の値（0.99 × 0.99 ＝ 0.9801）です。本問の待機系は、主系が故障したときだけ使われます。
      - 正解です。0.99 ＋ 0.01 × 0.90 × 0.99 ≒ 99.89 ％です。
      - 切替えが常に成功すると仮定した理想的な並列系の値（1 － 0.01 × 0.01 ＝ 99.99 ％）です。本問では切替えの失敗が 10 ％あります。
    know: 待機系の実効稼働率は「主系の稼働 ＋ 主系の故障 × 切替え成功 × 待機系の稼働」で決まる。切替えの成功率が 1 でない限り、単純な並列系の式（1 － 故障率の積）にはならない。
    terms: [フェイルオーバ, 稼働率]
    verify:
      manual: '主系稼働 0.99 に、主系故障 0.01 × 切替成功 0.90 × 待機系稼働 0.99 ＝ 0.00891 を加えると 0.99891 となり、選択肢の 99.89 が最も近いことを再計算で確認'
