      - 1001 は初期値と個数の和から余りを 9 と計算した誤りです。51 を 16 で割った余りは 3 です。
      - 正解です。(6＋45)÷16 の余りが 3 で、4 ビットでは 0011 です。
    know: |
      T フリップフロップは、入力が来るたびに出力が反転します。n 段縦続した回路は、入力パルスを 2 進数で数えるカウンタとなり、2 の n 乗個で一巡します。初期値がある場合は、初期値に個数を足してから余りを取ります。
    terms:
      - フリップフロップ
      - カウンタ
    verify:
      value: Number(((6 + 45) % 16).toString(2).padStart(4, "0"))
  - id: A03-615
    topic: 3-1-10
    diff: 4
    scope: 3-1-10 マルチプロセッサシステム（アムダールの法則）と 3-1-8 マルチコアプロセッサ。並列化できない部分と通信などのオーバヘッドがあるとき、コア数を増やしても性能が頭打ちになる考え方は範囲内。式は問題文に与える。
    prereq: アムダールの法則の考え方、処理時間の式の評価
    hard: 与えられた式から、並列部分の時間の減少と、コア数に比例するオーバヘッドの増加がつり合う点を求める必要がある。コア数を増やすほど短くなるという直感を覆す。
    q: |
      ある処理は 1 コアで 100 秒かかり，その 10％ は逐次処理（並列化できない）である。n コアで実行したときの処理時間 T(n) が，通信のオーバヘッドを含めて次の式で表されるものとする。
      ```
      T(n) ＝ 100 × (0.1 ＋ 0.9 ÷ n) ＋ 0.4 × (n − 1)   （単位は秒）
      ```
      処理時間が最も短くなるコア数 n はどれか。ここで，n は 1 以上の整数とする。
    c:
      - '15'
      - '30'
      - '20'
      - '10'
    a: ア
    exp: |
      T(n) ＝ 10 ＋ 90 ÷ n ＋ 0.4(n − 1) です。n が増えると 90÷n は減りますが、0.4(n−1) は増えます。
      | n | 90÷n | 0.4(n−1) | T(n) |
      |---|---|---|---|
      | 10 | 9.0 | 3.6 | 22.6 |
      | 15 | 6.0 | 5.6 | 21.6 |
      | 20 | 4.5 | 7.6 | 22.1 |
      | 30 | 3.0 | 11.6 | 24.6 |
      最小となるのは n＝15 で、21.6 秒です（90÷n ＝ 0.4n となる n²＝225 付近）。周辺の n＝14 では 21.63、n＝16 では 21.63 とわずかに長くなります。
    why:
      - 正解です。T(15)＝10＋6＋5.6＝21.6 秒で最小です。
      - 30 は「コアが多いほど速い」と考えた誤りです。T(30)＝24.6 秒で、15 コアの場合より長くなります。
      - 20 は並列化の効果を優先して多めに選んだ誤りです。オーバヘッドの増加が短縮を上回り、T(20)＝22.1 秒で 15 より長くなります。
      - 10 はコア数が少なく、並列化による短縮がまだ十分に得られていません。n を増やすと T(n) はさらに短くなります。
    know: |
      アムダールの法則は、並列化できない部分があると台数効果に上限があることを示します。さらに、通信や同期のオーバヘッドが台数に応じて増える場合は、台数を増やしすぎるとかえって遅くなります。
    terms:
      - アムダールの法則
      - マルチコアプロセッサ
    verify:
      value: (() => { let best = 1; let bt = Infinity; for (let n = 1; n <= 100; n++) { const t = 100 * (0.1 + 0.9 / n) + 0.4 * (n - 1); if (t < bt) { bt = t; best = n; } } return best; })()
  - id: A03-616
    topic: 3-1-10
    diff: 3
    scope: 3-1-10 マルチプロセッサシステム（アムダールの法則）。速度向上率の式を与え、目標の向上率から並列化できる割合を逆算するのは、アムダールの法則の応用として範囲内。
    prereq: アムダールの法則（速度向上率＝1÷((1−p)＋p÷n)）、一次方程式
    hard: 順方向の計算ではなく、目標の速度向上率から並列化率を逆算する。向上率÷コア数や 1−1÷向上率といった単純な式に飛びつく誤答を誘う。
    q: |
      並列化できる部分の割合を p，コア数を n とすると，アムダールの法則による速度向上率は 1 ÷ ((1 − p) ＋ p ÷ n) で表される。8 コアで速度向上率 5 倍を得るために必要な p の最小値は約何％か。
    c:
      - 約80％
      - 約91％
      - 約87.5％
      - 約62.5％
    a: イ
    exp: |
      式に n＝8、速度向上率＝5 を代入します。
      1 ÷ ((1 − p) ＋ p ÷ 8) ＝ 5 より (1 − p) ＋ p ÷ 8 ＝ 0.2
      1 − p ＋ p ÷ 8 ＝ 1 − (7÷8)p ＝ 0.2 なので (7÷8)p ＝ 0.8
      p ＝ 0.8 × 8 ÷ 7 ＝ 6.4 ÷ 7 ≒ 0.914 で、約 91％ です。
      8 コアでは並列化できる部分が 91％ 以上必要です。
    why:
      - 80 は 1−1÷5 として、コア数 n を考えなかった誤りです。これは n が無限大のときに 5 倍を得る p です。
      - 正解です。1−(7/8)p＝0.2 より p≒0.914 です。
      - 87.5 は 1−1÷8 ＝ 7÷8 で、式を使わずにコア数だけから求めた値です。
      - 62.5 は 5÷8 で、速度向上率÷コア数（並列化効率）を並列化率と取り違えた誤りです。
    know: |
      速度向上率 S＝1÷((1−p)＋p÷n) の n を無限大にすると S の上限は 1÷(1−p) になります。目標の向上率が決まっているときは、式を p について解くことで必要な並列化率が求まります。
    terms:
      - アムダールの法則
    verify:
      value: (1 - 1 / 5) / (1 - 1 / 8) * 100
      tolerance: 0.5
  - id: A03-617
    topic: 3-1-8
    diff: 4
    scope: 3-1-8 プロセッサの高速化技術（マルチコアプロセッサ）と 3-1-10（アムダールの法則）。コア数を増やすと発熱によりクロック周波数を下げる必要がある、という状況で処理時間がどう変わるかは、マルチコアの性能の考え方として範囲内。前提は問題文に与える。
    prereq: 処理時間はクロック周波数に反比例、アムダールの法則に基づく処理時間の計算
    hard: 並列化できる部分と逐次部分を分けた処理時間の計算に、クロック低下による全体の延びを合成する。クロック低下を並列部分だけに適用する誤りや、全体に掛ける向きの誤りを誘う。
    q: |
      ある処理は，1 コア・基準のクロックで 100 秒かかり，そのうち 20 秒は逐次処理で，80 秒は完全に並列化できる。4 コアで実行すると基準のクロックで動作するが，コアを 8 個にすると発熱のためクロック周波数が基準の 0.8 倍に下がる。処理時間はクロック周波数に反比例し，並列化のオーバヘッドは無視できるとき，4 コアから 8 コアにしたことによる処理時間の短縮率はいくつか。
    c:
      - 18.75％
      - 6.25％
      - 25％
      - 40％
    a: イ
    exp: |
      4 コアの処理時間は 20 ＋ 80 ÷ 4 ＝ 40 秒です。
      8 コアでクロックが基準のままなら 20 ＋ 80 ÷ 8 ＝ 30 秒ですが、クロックが 0.8 倍になると処理時間は逐次部分も含めて 1 ÷ 0.8 倍になります。
      8 コアの処理時間 ＝ 30 ÷ 0.8 ＝ 37.5 秒です。
      短縮率は (40 − 37.5) ÷ 40 ＝ 0.0625、すなわち 6.25％ です。
    why:
      - 18.75 はクロック低下を並列部分だけに適用し、(20＋10÷0.8)＝32.5 秒とした誤りです。クロックが下がれば逐次部分も遅くなります。
      - 正解です。30÷0.8＝37.5 秒で、40 秒からの短縮率は 6.25％ です。
      - 25 はクロック低下を考えず、40 秒から 30 秒になった（10÷40）とした誤りです。
      - 40 は 30 秒に 0.8 を掛けて 24 秒とした誤りです。処理時間はクロック周波数に反比例するので、0.8 で割ります。
    know: |
      処理時間は、処理に要するクロック数÷クロック周波数です。クロック周波数が下がると全ての処理が遅くなります。コア数を増やしても、発熱や電力の制約でクロックが下がれば、性能向上はアムダールの法則の見積もりより小さくなります。
    terms:
      - マルチコアプロセッサ
      - アムダールの法則
      - クロック周波数
    verify:
      value: (40 - (20 + 80 / 8) / 0.8) / 40 * 100
  - id: A03-618
    topic: 3-4-1-3
    diff: 4
    scope: 3-4-1-3 入出力制御の方式（プログラム制御方式）と 3-1-6-3 割込み（入出力割込み）。ポーリングと割込みの CPU 負荷を比較し、損益分岐点を求める考え方は範囲内で、必要な時間は問題文に示す。
    prereq: ポーリング（定期的な状態確認）と割込み方式の違い、CPU 使用率の計算
    hard: 到着頻度に依存しない常時の負荷と、到着ごとの負荷を分けて立式し、二つの方式の使用率が等しくなる到着頻度を連立で求める。方式の優劣が頻度で逆転する点を理解する必要がある。
    q: |
      周辺装置からの入力の受付けを，次の二つの方式で比較する。
      ・ポーリング方式：100 マイクロ秒ごとに装置の状態確認を行い，1 回の確認に 4 マイクロ秒を要する。入力があったときは，読込みの処理にさらに 10 マイクロ秒を要する。
      ・割込み方式：入力があるたびに割込みが発生し，読込みを含めた割込み処理に 80 マイクロ秒を要する。
      入力が毎秒 λ 回到着するとき，二つの方式の CPU 使用率が等しくなる λ は約何回/秒か。ここで，入力の到着は一様で，ポーリングの周期の間に入力は高々 1 回とし，ほかの負荷は無視する。
    c:
      - 約1,000
      - 約571
      - 約4,000
      - 約500
    a: イ
    exp: |
      ポーリング方式は、入力の有無にかかわらず毎秒 10,000 回の状態確認を行うので、確認の負荷は 4 × 10,000 ＝ 40,000 マイクロ秒/秒＝4％ です。これに入力ごとの読込み 10 マイクロ秒が加わり、CPU 使用率は 0.04 ＋ 10×10⁻⁶ × λ です。
      割込み方式は入力ごとに 80 マイクロ秒なので、CPU 使用率は 80×10⁻⁶ × λ です。
      二つが等しくなるのは 0.04 ＋ 10×10⁻⁶ λ ＝ 80×10⁻⁶ λ のときで、0.04 ＝ 70×10⁻⁶ λ より λ ＝ 0.04 ÷ 70×10⁻⁶ ≒ 571 回/秒です。
      これより入力が少なければ割込み方式、多ければポーリング方式の負荷が小さくなります。
    why:
      - 1,000 は式を立てずに「ポーリングが毎秒 10,000 回の確認をする」ことなどから見当で選んだ値です。使用率を等置して解くと一致しません。
      - 正解です。0.04＋10×10⁻⁶λ＝80×10⁻⁶λ より λ≒571 回/秒です。
      - 4,000 は 0.04 ÷ 10×10⁻⁶ で、ポーリングの読込みの負荷だけで割った誤りです。割込み方式の負荷（80 マイクロ秒）との差で割る必要があります。
      - 500 は 0.04 ÷ 80×10⁻⁶ として、ポーリングの読込み 10 マイクロ秒を考えずに割込みの負荷だけで割った誤りです。
    know: |
      ポーリング方式は入力がなくても確認の負荷が一定にかかり、入力が頻繁なときは効率がよくなります。割込み方式は入力があったときだけ処理するので、入力が少ないときに有利です。どちらが有利かは到着の頻度で決まります。
    terms:
      - ポーリング
      - 割込み
      - プログラム制御方式
    verify:
      value: (4 / 100) / (80e-6 - 10e-6)
      tolerance: 1
  - id: A03-619
    topic: 3-1-6-3
    diff: 4
    scope: 3-1-6-3 割込み（割込みの優先順位と多重割込み）。優先順位の高い割込みが低い処理に割り込み、低い割込みは待たされる動作を時間軸で追うことは割込みの動作原理の範囲内。
    prereq: 割込みの優先度、多重割込み（高い優先度が低い処理を中断する）
    hard: 4 つの割込み要求が重なる状況で、中断・待ち・再開の順序を時間軸で追う必要がある。到着順に処理するという誤りや、待機中の割込みの扱いを誤りやすい。
    q: |
      割込みレベルが 1（最高）〜3（最低）の割込みがある。優先順位の高い割込みは，実行中の低い優先順位の割込み処理を中断して処理され，同じまたは低い優先順位の割込み要求は待たされる。中断された処理は，より高い要求がなくなると再開される。次の割込み要求があったとき，レベル 2 の割込みの処理が完了する時刻は何ミリ秒か。ここで，割込みの切替えに要する時間は無視する。
      | 要求の時刻 | レベル | 処理時間 |
      |---|---|---|
      | 0 ミリ秒 | 3 | 6 ミリ秒 |
      | 2 ミリ秒 | 1 | 2 ミリ秒 |
      | 3 ミリ秒 | 2 | 4 ミリ秒 |
      | 5 ミリ秒 | 1 | 1 ミリ秒 |
    c:
      - '7'
      - '8'
      - '9'
      - '13'
    a: ウ
    exp: |
      時間軸で追います。
      | 時間 | 実行する処理 | 説明 |
      |---|---|---|
      | 0〜2 | レベル 3 | 0 ミリ秒に開始。残り 4 |
      | 2〜4 | レベル 1 | 2 ミリ秒の要求が割り込む。3 ミリ秒のレベル 2 の要求は待つ |
      | 4〜5 | レベル 2 | レベル 1 の完了後、待っているレベル 2 がレベル 3 より先に実行。残り 3 |
      | 5〜6 | レベル 1 | 5 ミリ秒の要求が割り込む |
      | 6〜9 | レベル 2 | 再開して完了（残り 3） |
      | 9〜13 | レベル 3 | 残り 4 を実行して完了 |
      レベル 2 の割込み処理が完了するのは 9 ミリ秒です。
    why:
      - 7 は 3 ミリ秒に要求されてすぐ処理を始め、4 ミリ秒で終わるとした誤りです。そのとき最高のレベル 1 が実行中で、レベル 2 は待たされます。
      - 8 は 5 ミリ秒のレベル 1 の要求（1 ミリ秒）を見落とした誤りです。レベル 2 の処理を中断するため、その分完了が遅れます。
      - 正解です。レベル 1（2〜4）の後 4〜5 で実行、5〜6 は中断され、6〜9 で完了します。
      - 13 はレベル 3 の割込み処理の完了時刻（全処理時間の合計）です。レベル 2 はレベル 3 より優先されるので先に終わります。
    know: |
      割込み処理中でも、より優先順位の高い割込みが発生すれば、現在の処理を中断してそちらを実行します（多重割込み）。同じか低い優先順位の要求は、実行中の処理が終わるまで待たされます。待ちが複数あるときは優先順位の高いものから処理されます。
    terms:
      - 割込み優先度
      - 割込み
    verify:
      value: (() => { const req = [[0, 3, 6], [2, 1, 2], [3, 2, 4], [5, 1, 1]]; const rem = req.map(r => r[2]); let t = 0; const fin = {}; while (Object.keys(fin).length < 4) { let pick = -1; for (let i = 0; i < 4; i++) { if (req[i][0] <= t && rem[i] > 0 && (pick < 0 || req[i][1] < req[pick][1])) pick = i; } rem[pick]--; t++; if (rem[pick] === 0) fin[pick] = t; } return fin[2]; })()
  - id: A03-620
    topic: 3-1-6-3
    diff: 2
    scope: 3-1-6-3 割込み（入出力割込み、外部割込み、内部割込み）と 3-4-1-3 DMA 方式。DMA 転送の完了を CPU に知らせる割込みの種類を識別することは範囲内。
    prereq: 割込みの分類（内部割込み、外部割込み、入出力割込み、SVC 割込み）、DMA 方式
    hard: null
    q: |
      DMA 方式でディスク装置から主記憶へのデータ転送が終了したとき，DMA コントローラが CPU に転送の終了を知らせるために発生させる割込みと，その分類として，適切なものはどれか。
    c:
      - プログラム割込みで，内部割込みに分類される。
      - タイマ割込みで，外部割込みに分類される。
      - SVC 割込みで，内部割込みに分類される。
      - 入出力割込みで，外部割込みに分類される。
    a: エ
    exp: |
      DMA 方式では、CPU が転送の開始を指示した後、データ転送は DMA コントローラが行います。転送が終了すると、DMA コントローラは入出力割込みで CPU に通知します。
      入出力割込みは、入出力装置などの CPU の外部の要因で発生するので、外部割込みに分類されます。CPU は割込みを受けて、転送結果の確認や次の転送の準備などの後処理を行います。
    why:
      - プログラム割込みは、ゼロ除算や不正なアドレスの参照など、プログラムの実行中に起きる異常で発生する割込みで、転送の終了とは関係がありません。
      - タイマ割込みは、設定した時間が経過したことを知らせる割込みです。分類は外部割込みですが、転送の終了を通知するものではありません。
      - SVC 割込みは、実行中のプログラムが OS の機能を呼び出すために自ら発生させる割込みで、DMA コントローラが発生させるものではありません。
      - 正解です。入出力の完了などを知らせる入出力割込みで、CPU の外部の要因で発生する外部割込みです。
    know: |
      割込みは、CPU の内部の要因（ゼロ除算、SVC 命令など）による内部割込みと、外部の要因（入出力の完了、タイマなど）による外部割込みに分けられます。入出力割込みとタイマ割込みは外部割込み、SVC 割込みとプログラム割込みは内部割込みです。
    terms:
      - 入出力割込み
      - DMA
      - 外部割込み
    verify:
      manual: 知識問題。割込みの分類（入出力割込みは外部割込み、SVC割込みとプログラム割込みは内部割込み）を再確認
