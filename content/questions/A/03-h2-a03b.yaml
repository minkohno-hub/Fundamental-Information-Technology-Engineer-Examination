category: '03'
batch: H2
reviewed:
  at: '2026-10-27'
  method: 作成後に独立した検算・実行検証と、解答を伏せた再解答による確認
questions:
  - id: A03-601
    topic: 3-4-1-3
    diff: 3
    scope: 3-4-1-3 入出力制御の方式（プログラム制御方式、DMA方式）。転送中にCPUが解放される点と、設定・完了割込みの処理時間を使って占有率を比較する考え方は、DMA方式の仕組みそのものであり範囲内。
    prereq: DMA方式とプログラム制御方式の違い、転送時間＝データ量÷転送速度
    hard: 転送時間の算出、DMAでCPUが負担する時間の合算、占有率の差の算出という3段階が必要。DMAではCPUが全く使われないという誤解や分母の取り違えを誘う。
    q: |
      ディスク装置から主記憶へ，1ブロック 4,000 バイトのデータを連続して転送する。ディスクの転送速度は 20M バイト/秒（1M＝10⁶）である。DMA 方式では，1ブロックごとに CPU が転送開始の設定に 30 マイクロ秒，転送完了割込みの処理に 50 マイクロ秒を要し，転送中の CPU は他の処理を実行できる。プログラム制御方式では，CPU が転送の間ずっと入出力処理に専念する。バスの競合は考えないものとすると，DMA 方式にしたとき，入出力以外の処理に使える CPU 時間の割合は，プログラム制御方式に比べて何ポイント増えるか。
    c:
      - 60ポイント
      - 71ポイント
      - 40ポイント
      - 100ポイント
    a: ア
    exp: |
      1ブロックの転送時間は 4,000 ÷ 20×10⁶ ＝ 200×10⁻⁶ 秒＝200 マイクロ秒です。
      DMA 方式で CPU が入出力のために使う時間は、設定 30 ＋ 完了割込み 50 ＝ 80 マイクロ秒で、転送1ブロック（200 マイクロ秒）あたりの占有率は 80 ÷ 200 ＝ 40％です。残りの 60％ を他の処理に使えます。
      プログラム制御方式では転送の間 CPU が 100％ 入出力に使われるので、他の処理に使える割合は 0％ です。
      したがって増加分は 60 − 0 ＝ 60 ポイントです。
    why:
      - 正解です。DMA の占有率は 80÷200＝40％ で他の処理に使える割合は 60％、プログラム制御方式では 0％ なので差は 60 ポイントです。
      - 71 は分母を 200＋80＝280 として 80÷280≒29％ と計算した誤りです。CPU の入出力処理は転送と並行して行われるので、分母は転送時間の 200 です。
      - 40 は DMA 方式で CPU が入出力に使う割合そのものです。使える割合（100−40）に直しておらず、設問の「増える割合」を取り違えています。
      - 100 は DMA なら CPU が全く使われないと考えた誤りです。転送の設定と完了割込みの処理は CPU が行うので負担はゼロになりません。
    know: |
      DMA 方式は、CPU が転送の開始（アドレス・長さの設定）と完了割込みの処理だけを行い、データ転送そのものは DMA コントローラが行う方式です。CPU が空くのは転送中であって、設定と割込み処理の時間は CPU が負担する点が間違えやすいところです。
    terms:
      - DMA
      - プログラム制御方式
    verify:
      value: 100 - (30 + 50) / (4000 / 20e6 * 1e6) * 100
  - id: A03-602
    topic: 3-1-6-3
    diff: 3
    scope: 3-1-6-3 割込み（外部割込み・入出力割込み）。割込み処理に CPU 時間が使われ、割込みの発生頻度と処理時間からオーバヘッドを見積もる考え方は割込みの動作原理の範囲内。
    prereq: 割込み処理中は実行中のプログラムが進まないこと、周期と頻度の換算
    hard: 周期割込みと発生頻度の異なる割込みを秒あたりの占有時間に直して合算し、処理時間に足すのではなく使える割合で割る必要がある。足し算で済ませる誤答が自然に出る。
    q: |
      ある計算ジョブは，割込みがなければ CPU 時間を 30 秒必要とする。このジョブの実行中には，5 ミリ秒周期のタイマ割込み（1回の処理に 150 マイクロ秒）と，毎秒 400 回発生するディスクの転送完了割込み（1回の処理に 250 マイクロ秒）が発生し続ける。割込みの処理中はジョブが進まず，ほかのオーバヘッドは無視するとき，ジョブが完了するまでの経過時間は約何秒か。
    c:
      - 約34.5秒
      - 約30.1秒
      - 約33.3秒
      - 約33.9秒
    a: ア
    exp: |
      1秒あたりの割込み処理時間を求めます。
      | 割込み | 1秒あたりの回数 | 1回の処理 | 1秒あたりの合計 |
      |---|---|---|---|
      | タイマ | 1,000÷5＝200 回 | 150 μs | 30 ms |
      | ディスク | 400 回 | 250 μs | 100 ms |
      合計は 130 ms/秒＝13％ で、ジョブに使える CPU 時間は 1秒あたり 0.87 秒です。
      ジョブは 30 秒分の CPU 時間を、1秒あたり 0.87 秒ずつしか進められないので、経過時間は 30 ÷ 0.87 ≒ 34.5 秒です。
    why:
      - 正解です。割込みに 13％ が使われ、ジョブは 87％ の速度でしか進まないので 30÷0.87≒34.5 秒です。
      - 30.1 は割込み処理 130 ms を 1 回だけ加算した誤りです。割込みはジョブ実行中ずっと発生し続けます。
      - 33.3 はタイマ割込みを無視し、ディスク割込み（10％）だけで 30÷0.9 と計算した誤りです。周期割込みも CPU 時間を使います。
      - 33.9 は 30×1.13 と、13％ を30秒に上乗せした誤りです。割込み時間は経過時間に対する割合なので、上乗せした時間にもさらに割込みが入ります。
    know: |
      割込み処理のオーバヘッドは「頻度×1回の処理時間」で占有率にして考えます。ジョブの経過時間は CPU 時間÷(1−割込み占有率) です。割込みの周期が与えられたら、まず 1秒あたりの回数に換算します。
    terms:
      - 割込み
      - 外部割込み
    verify:
      value: 30 / (1 - (1000 / 5 * 150e-6 + 400 * 250e-6))
      tolerance: 0.05
  - id: A03-603
    topic: 3-4-1-3
    diff: 4
    scope: 3-4-1-3 入出力制御の方式（DMA方式）と 3-3-1 バスの種類と特徴・性能。DMA がバスを使うことで CPU のメモリアクセスが遅れる（サイクルスチール）ことと、バス転送速度の計算は範囲内。
    prereq: バス転送速度＝データ幅×クロック周波数、DMA 方式、CPU の処理時間の分解
    hard: バス帯域の計算、DMA によるバス占有率、CPU 側の処理時間をバスに依存する部分としない部分に分けた加重計算の3つを統合する。全体を 1/0.75 倍にする誤答が自然。
    q: |
      データバスの幅が 32 ビット，クロック周波数が 100MHz で，1クロックで1回データを転送できるメモリバスがある。このバスを使って，ディスクから主記憶への DMA 転送を 100M バイト/秒で行う（1M＝10⁶）。DMA 転送がバスを優先的に使用し，CPU が使えるバスの時間がその分だけ減るものとする。CPU の命令実行時間のうち 80％ はバスを使ったメモリアクセスに要し，残り 20％ はバスを使わない。メモリアクセスに要する時間は，CPU が使えるバスの時間の割合に反比例して長くなるとき，DMA 転送中の CPU の命令実行時間は，DMA 転送がないときの約何倍か。
    c:
      - 約1.25倍
      - 約1.33倍
      - 約1.27倍
      - 約1.20倍
    a: ウ
    exp: |
      バスの最大転送速度は 32ビット÷8＝4 バイト × 100×10⁶ ＝ 400M バイト/秒です。
      DMA は 100M バイト/秒を使うので、バスの占有率は 100÷400＝25％ で、CPU が使えるバスの時間は 75％ です。
      DMA がないときの命令実行時間を 1 とすると、バスを使わない部分は 0.2 のまま、バスを使う部分は 0.8 ÷ 0.75 ≒ 1.0667 に延びます。
      合計は 0.2 ＋ 1.0667 ≒ 1.267 で、約 1.27 倍です。
    why:
      - 1.25 は DMA のバス占有率 25％ をそのまま加えて 1＋0.25 とした誤りです。使える時間が 75％ になると時間は 1÷0.75 倍で、しかも延びるのはバスを使う部分だけです。
      - 1.33 は実行時間全体を 1÷0.75 倍にした誤りです。バスを使わない 20％ は DMA の影響を受けません。
      - 正解です。0.2＋0.8÷0.75≒1.27 倍で、バスに依存する部分だけが延びます。
      - 1.20 は延びた時間を 0.25×0.8 ＝ 0.2 とし、1＋0.2 と計算した誤りです。使える時間が 75％ になると所要時間は 1÷0.75 倍になり、25％ の加算にはなりません。
    know: |
      DMA 方式では、DMA コントローラがバスを使う間 CPU のメモリアクセスが待たされます（サイクルスチール）。DMA により CPU の入出力処理は減りますが、バスを共有するため CPU の性能がゼロ影響になるわけではありません。バス転送速度は データ幅[バイト]×クロック周波数 で求めます。
    terms:
      - DMA
      - サイクルスチール
      - バス
    verify:
      value: 0.2 + 0.8 / (1 - 100 / (32 / 8 * 100))
      tolerance: 0.005
  - id: A03-604
    topic: 3-3-3
    diff: 3
    scope: 3-3-3 バスの容量と性能（バスのアクセスモード）。アドレスとデータを時分割で送るバスでのバースト転送の実効転送速度は、バスの性能の考え方として範囲内。
    prereq: バスの転送速度＝転送バイト数÷転送時間、クロック周期とクロック数の換算
    hard: アドレス送出のクロックを含めた実効転送時間を求めること、周波数からクロック周期への換算、バイト数の算出の3段階。理論最大値を答える誤りを誘う。
    q: |
      アドレスとデータを同じ信号線で時分割に送るバスがある。データバス幅は 32 ビット，クロック周波数は 50MHz である。1回の転送では，最初の 1 クロックでアドレスを送り，続く 8 クロックで 8 ワード（1ワード＝32 ビット）のデータを連続して転送する（バースト転送）。このバスの実効転送速度は約何 M バイト/秒か。ここで，1M＝10⁶ とする。
    c:
      - 約100
      - 約356
      - 約200
      - 約178
    a: エ
    exp: |
      1回の転送に要するクロック数は、アドレス 1 ＋ データ 8 ＝ 9 クロックです。1クロックの時間は 1÷50MHz ＝ 20 ナノ秒なので、1回の転送時間は 9 × 20 ＝ 180 ナノ秒です。
      転送されるデータは 8 ワード × 4 バイト ＝ 32 バイトです。
      実効転送速度は 32 バイト ÷ 180 ナノ秒 ≒ 1.78×10⁸ バイト/秒、約 178M バイト/秒です。
    why:
      - 100 はバーストを使わず、1ワードごとにアドレスを送る場合（4 バイト÷2 クロック）の値です。この問題ではアドレスは 1 回だけです。
      - 356 は 1クロックの時間を 10 ナノ秒（100MHz 相当）として計算した誤りです。50MHz の周期は 20 ナノ秒です。
      - 200 は 4バイト×50MHz のバスの理論値で、アドレスを送る 1 クロックを数えていません。
      - 正解です。32 バイトを 9 クロック（180 ナノ秒）で転送するので約 178M バイト/秒です。
    know: |
      バスの理論的な最大転送速度は「データ幅×クロック周波数」ですが、アドレスの送出などのオーバヘッドがあると実効値は下がります。バースト転送は、アドレスを1回送って連続するデータをまとめて転送し、オーバヘッドの割合を下げる方式です。
    terms:
      - バス
      - バースト転送
      - データバス
    verify:
      value: 8 * 4 / (9 / 50e6) / 1e6
      tolerance: 0.5
  - id: A03-605
    topic: 3-2-1
    diff: 2
    scope: 3-2-1 メモリの種類と特徴（DRAM）。DRAM は定期的な再書込み（リフレッシュ）が必要で、その時間割合を見積もる計算は DRAM の特徴の理解として範囲内。
    prereq: DRAM のリフレッシュ、ミリ秒・マイクロ秒・ナノ秒の換算
    hard: null
    q: |
      ある DRAM は 8,192 行で構成され，記憶内容を保つために，全ての行を 64 ミリ秒以内にリフレッシュする必要がある。1行のリフレッシュに 60 ナノ秒を要し，リフレッシュ中はその DRAM にアクセスできないとき，リフレッシュのために DRAM が使えない時間の割合は約何％か。
    c:
      - 約0.077％
      - 約0.77％
      - 約7.7％
      - 約0.38％
    a: イ
    exp: |
      64 ミリ秒ごとに全 8,192 行をリフレッシュするので、1周期あたりのリフレッシュ時間は 8,192 × 60 ナノ秒 ＝ 491,520 ナノ秒 ≒ 491.5 マイクロ秒です。
      周期は 64 ミリ秒＝64,000 マイクロ秒なので、割合は 491.5 ÷ 64,000 ≒ 0.0077 ＝ 約 0.77％ です。
      SRAM はリフレッシュが不要なので、この時間は DRAM に特有のオーバヘッドです。
    why:
      - 0.077 は桁を1つ小さく誤った値です。ナノ秒・マイクロ秒・ミリ秒の換算ミスで生じます。
      - 正解です。8,192×60ns＝491.5μs を 64ms で割って約 0.77％ です。
      - 7.7 は単位換算で桁を1つ誤った値です。491.5 マイクロ秒を 6,400 マイクロ秒で割ったときの結果に当たります。
      - 0.38 は行数を半分（4,096 行）として計算したか、60 ナノ秒を 30 ナノ秒と誤った場合の値です。問題の行数と時間をそのまま使います。
    know: |
      DRAM はコンデンサに電荷として記憶するため、放電で内容が失われる前に定期的に読み出して書き戻す（リフレッシュ）必要があります。SRAM（フリップフロップ）にはこの動作が不要で、その分高速ですが高価で大容量化に不向きです。
    terms:
      - DRAM
      - リフレッシュ
    verify:
      value: 8192 * 60e-9 / 64e-3 * 100
      tolerance: 0.005
  - id: A03-606
    topic: 3-2-6
    diff: 3
    scope: 3-2-6 記録媒体の種類と特徴（SSD、フラッシュメモリ、ウェアレベリング）。書換え回数に上限があること、書込みを均等に分散して寿命を延ばす考え方から総書込み量を見積もるのは範囲内。
    prereq: フラッシュメモリの書換え回数の上限、ウェアレベリングの目的
    hard: ウェアレベリングで全体の総書込み可能量（容量×上限回数）になると捉えること、書込み増幅を実際の書込み量に反映すること、日から年への換算の3つを組み合わせる。
    q: |
      容量 512G バイトの SSD がある。各セルの書換え回数の上限は 3,000 回で，ウェアレベリングにより書込みは全セルに均等に分散される。ホストからは毎日 60G バイトの書込みがあり，内部では書込み増幅のため，ホストの書込み量の 2 倍の量が実際にフラッシュメモリへ書き込まれる。この SSD を使い続けたとき，書換え回数の上限に達するまでの期間は約何年か。ここで，1年は 365 日とする。
    c:
      - 約70年
      - 約8.2年
      - 約35年
      - 約17.5年
    a: ウ
    exp: |
      ウェアレベリングにより全セルが均等に書き換えられるので、寿命までに書き込める総量は 512G × 3,000 ＝ 1,536,000G バイトです。
      1日あたりに実際に書き込まれる量は、書込み増幅を含めて 60G × 2 ＝ 120G バイトです。
      寿命の日数は 1,536,000 ÷ 120 ＝ 12,800 日で、年に直すと 12,800 ÷ 365 ≒ 35.1 年です。
    why:
      - 70 は書込み増幅を考慮せず、ホストの書込み量 60G バイト/日で割った値です。実際のフラッシュへの書込みは 2 倍です。
      - 8.2 は容量を考えず、上限の 3,000 回を毎日1回の書換えとして 3,000 日（約 8.2 年）と考えた誤りです。毎日書き換えられるのは全体ではなく 120G バイトです。
      - 正解です。512G×3,000÷(60G×2)＝12,800 日で約 35 年です。
      - 17.5 は書込み増幅を 2 回（4倍）適用してしまった誤りです。
    know: |
      フラッシュメモリは書換え回数に上限があるため、SSD ではウェアレベリングで書込みを分散します。均等化が理想的に働く場合、総書込み可能量は「容量×書換え上限」です。内部でホスト書込み量より多く書き込む場合（書込み増幅）は、実際の書込み量で割ります。
    terms:
      - SSD
      - ウェアレベリング
      - フラッシュメモリ
    verify:
      value: 512 * 3000 / (60 * 2) / 365
      tolerance: 0.5
  - id: A03-607
    topic: 3-5-3
    diff: 4
    scope: 3-5-3 補助記憶装置（ハードディスク装置、トラック、シリンダ、セクター）。平均シーク時間、平均回転待ち時間、データ転送時間からアクセス時間を求めることはハードディスクの性能の基本であり範囲内。
    prereq: 平均回転待ち時間＝1回転の半分、トラックの読取り時間、シーク時間
    hard: 最初の位置決め（シークと回転待ち）と、トラックをまたぐたびの移動時間と回転待ちを区別して積み上げる。ディスクは移動中も回転し続けるため、毎回平均回転待ちを足す誤答が自然。
    q: |
      回転数が毎分 6,000 回転，1トラックの容量が 125K バイトのハードディスク装置がある。平均シーク時間は 5 ミリ秒である。500K バイトのファイルが，4トラックにわたり，各トラックの先頭から全体を使って連続して格納されており，どのトラックも先頭セクタは同じ回転角にある。ファイルの先頭トラックにヘッドを位置付けるのに平均シーク時間と平均回転待ち時間がかかり，その後 1 トラック読み終えるごとにヘッドは直ちに隣のトラックへ 1 ミリ秒で移動する。移動の間もディスクは回転し続けるとき，このファイル全体を読み出す時間は何ミリ秒か。
    c:
      - '68'
      - '50'
      - '80'
      - '53'
    a: ウ
    exp: |
      1回転の時間は 60÷6,000 ＝ 10 ミリ秒で、1トラックの読取りも 10 ミリ秒です。平均回転待ち時間は 5 ミリ秒です。
      最初のトラックは、シーク 5 ＋ 回転待ち 5 ＋ 読取り 10 ＝ 20 ミリ秒です。
      各トラックの読取りが終わるのは先頭セクタの回転角です。1 ミリ秒でヘッドが隣へ移動する間にディスクは 0.1 回転進むので、次の先頭セクタが来るまでさらに 9 ミリ秒待ち、続けて読取りに 10 ミリ秒かかります。つまり2本目以降の1トラックあたり 1 ＋ 9 ＋ 10 ＝ 20 ミリ秒です。
      合計は 20 ＋ 20 × 3 ＝ 80 ミリ秒です。
    why:
      - 68 は移動のたびに平均回転待ち 5 ミリ秒を加えた（1＋5＋10 を3回）誤りです。この問題では先頭セクタの位置が決まっており、待ち時間は 9 ミリ秒です。
      - 50 は 5＋5＋読取り 40 ミリ秒とし、トラック間の移動と先頭セクタ待ちをまったく加えていない誤りです。
      - 正解です。20＋(1＋9＋10)×3＝80 ミリ秒です。
      - 53 はトラック間の移動 1 ミリ秒×3 だけを加えた誤りです。移動後に先頭セクタが再び来るまで待つ時間が抜けています。
    know: |
      ハードディスクのアクセス時間は「シーク時間＋回転待ち時間＋データ転送時間」です。平均回転待ち時間は 1回転の半分ですが、先頭セクタの位置が決まっている場合は回転角から待ち時間を求めます。ディスクは常に回転しているので、ヘッド移動中も回転は進みます。
    terms:
