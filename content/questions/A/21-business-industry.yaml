    q: クラウドファンディングの説明として，適切なものはどれか。
    c:
      - インターネットを通じて不特定多数の人に業務を発注し，成果物を受け取る。
      - 個人が保有する自動車や部屋などの遊休資産を，他の個人に貸し出す。
      - 企業が保有するサーバやソフトウェアを，インターネット経由で利用者に提供する。
      - 新しい製品の開発や事業などの目的を示して，インターネットを通じて不特定多数の人から資金を集める。
    a: エ
    exp: |
      クラウドファンディングは、群衆（crowd）と資金調達（funding）を組み合わせた造語で、実現したいプロジェクトや製品を Web 上で公開し、賛同した不特定多数の人から少額ずつ資金を募る仕組みです。支援の見返りに製品やサービスを受け取る購入型、見返りを求めない寄付型、出資して事業の利益の分配を受ける投資型などがあります。
    why:
      - これはクラウドソーシングの説明です。
      - これはシェアリングエコノミーの説明です。
      - これはクラウドコンピューティング（SaaS など）の説明です。
