questions:
  - id: A21-001
    topic: 21-1-2
    diff: 1
    q: 小売店の POS システムの説明として，適切なものはどれか。
    c:
      - 取引先との間で，受発注のデータを標準的な形式で電子的に交換する。
      - 商品を販売した時点で，バーコードなどから商品ごとの販売情報を読み取って収集し，売上や在庫の管理に活用する。
      - 顧客との接点で得られた情報を一元管理し，長期的な関係の構築に活用する。
      - 企業の会計，人事，生産，販売などの基幹業務の情報を一元的に管理する。
    a: イ
    exp: |
      POS（Point Of Sale：販売時点情報管理）システムは、レジで商品のバーコード（JAN コードなど）を読み取った「販売した時点」で、何が・いつ・いくつ・いくらで売れたかを記録するシステムです。収集したデータは売上集計だけでなく、在庫管理、発注、売れ筋・死に筋の分析などに使われます。
    why:
      - 受発注データを企業間で電子的に交換するのは EDI です。
      - 正解です。販売時点で商品ごとの販売データを収集します。
      - 顧客情報を一元管理して関係を深めるのは CRM（顧客関係管理）の考え方です。
      - 基幹業務を統合して管理するのは ERP（ERP パッケージ）です。
    terms:
      - POSシステム
      - EDI
      - ERP
  - id: A21-002
    topic: 21-1-2
    diff: 1
    q: 食品の生産から加工，流通，販売までの各段階の履歴を記録し，問題が起きたときに原因の段階や出荷先を追跡できるようにすることを何というか。
    c:
      - スケーラビリティ
      - ユーザビリティ
      - トレーサビリティ
      - アクセシビリティ
    a: ウ
    exp: |
      トレーサビリティ（追跡可能性）は、製品や食品がいつ、どこで、誰によって生産・加工・流通されたかの履歴をたどれるようにすることです。問題が発生したときに、原因となった工程を特定したり（さかのぼり）、該当する製品の出荷先を特定して回収したり（追跡）できます。RFID タグやブロックチェーンを使って記録の信頼性を高める取組みもあります。
    why:
      - スケーラビリティは、利用者や処理量の増加に応じてシステムを拡張できることです。
      - ユーザビリティは、製品やシステムの使いやすさのことです。
      - 正解です。生産・流通の履歴を追跡できることです。
      - アクセシビリティは、高齢者や障害者を含む誰もが情報や機器を利用できることです。
    terms:
      - トレーサビリティ
      - アクセシビリティ
  - id: A21-003
    topic: 21-1-2
    diff: 2
    q: ERP パッケージを導入する目的として，最も適切なものはどれか。
    c:
      - 稟議などの申請書類を電子化し，決められた経路で承認を回付する。
      - 営業担当者の訪問履歴や商談の進捗を共有し，営業活動を効率化する。
      - 販売，生産，会計，人事などの基幹業務の情報を統合し，経営資源を全社的に有効活用する。
      - 部門内のメンバーがスケジュールや文書を共有し，共同作業を円滑にする。
    a: ウ
    exp: |
      ERP（Enterprise Resource Planning：企業資源計画）は、企業全体の経営資源（ヒト・モノ・カネ・情報）を一元的に管理して有効に活用する考え方で、それを実現する統合業務パッケージを ERP パッケージといいます。部門ごとに別々のシステムを使う場合と比べ、データの重複入力や不整合が減り、全社の状況をリアルタイムに把握できます。
    why:
      - これはワークフローシステムの目的です。
      - これは SFA（営業支援システム）の目的です。
      - 正解です。基幹業務を統合して全社の経営資源を有効活用します。
      - これはグループウェアの目的です。
    terms:
      - ERP
      - SFA
      - グループウェア
      - ワークフローシステム
  - id: A21-004
    topic: 21-1-2
    diff: 2
    q: デジタルツインの説明として，適切なものはどれか。
    c:
      - 本人の顔や声をまねた偽の動画や音声を，AI を用いて作成する。
      - 現実世界の設備や都市などから収集したデータを基に，サイバー空間上にその対象を再現し，状態の監視や将来の予測のためのシミュレーションに用いる。
      - 1台の物理サーバ上で，複数の仮想サーバを同時に動作させる。
      - 同じ構成のシステムを2系統用意し，同じ処理を同時に行って結果を照合する。
    a: イ
    exp: |
      デジタルツインは、現実（フィジカル空間）にある工場設備、製品、都市などを IoT のセンサーなどで計測したデータを基に、サイバー空間上に「双子」のように再現したものです。現実の対象を止めずに、仮想空間で状態の監視、故障の予兆検知、条件を変えたシミュレーションなどができます。フィジカル空間とサイバー空間を連携させるサイバーフィジカルシステム（CPS）の一形態です。
    why:
      - AI で偽の動画や音声を作るのはディープフェイクです。
      - 正解です。現実の対象をサイバー空間上に再現して活用します。
      - 1台の物理サーバで複数の仮想サーバを動かすのはサーバの仮想化です。
      - 2系統で同じ処理を行い結果を照合するのはデュアルシステムです。
    terms:
      - デジタルツイン
      - IoT
      - ディープフェイク
  - id: A21-005
    topic: 21-1-1
    diff: 2
    q: XBRL の説明として，適切なものはどれか。
    c:
      - 関係データベースのデータを定義・操作するための言語である。
      - 財務諸表などの財務情報を，コンピュータで処理しやすいように記述するための XML ベースの言語である。
      - Web ページの見た目（レイアウトや色）を指定するための言語である。
      - 電子メールで画像や音声などを送るための規格である。
    a: イ
    exp: |
      XBRL（eXtensible Business Reporting Language）は、財務諸表などの事業報告の情報を作成・流通・利用しやすくするために、XML をベースに標準化された言語です。各項目にタグ（意味情報）が付いているため、ソフトウェアで自動的に集計・比較・分析できます。金融庁の EDINET（有価証券報告書などの電子開示システム）でも利用されています。
    why:
      - データベースを定義・操作する言語は SQL です。
      - 正解です。財務情報を記述する XML ベースの言語です。
      - Web ページの見た目を指定する言語は CSS です。
      - 電子メールでマルチメディアを扱うための規格は MIME です。
    terms:
      - XBRL
      - XML
      - EDINET
  - id: A21-006
    topic: 21-1-3
    diff: 2
    q: スマートグリッドの説明として，適切なものはどれか。
    c:
      - 地方公共団体の組織間を結ぶ，行政専用の閉域ネットワーク
      - 道路と車両を情報通信で結び，渋滞の緩和や事故の防止を図る仕組み
      - 人工衛星からの電波を受信して，現在位置を測定する仕組み
      - 情報通信技術を用いて電力の需要側と供給側の双方から電力の流れを制御し，電力網全体を最適化する仕組み
    a: エ
    exp: |
      スマートグリッド（次世代送電網）は、スマートメーターなどの情報通信技術を使って、発電所などの供給側と家庭・事業所などの需要側の双方から電力の流れをきめ細かく把握・制御し、電力の需給を最適化する電力網です。太陽光や風力など出力が変動する再生可能エネルギーの導入拡大にも役立ちます。
    why:
      - これは LGWAN（総合行政ネットワーク）の説明です。
      - これは ITS（高度道路交通システム）の説明です。
      - これは GPS（全地球測位システム）の説明です。
      - 正解です。電力網を情報通信技術で最適化する仕組みです。
    terms:
      - スマートグリッド
      - ITS
      - LGWAN
      - GPS
  - id: A21-007
    topic: 21-1-4-3
    diff: 1
    q: 生成 AI を業務で利用する際の留意点のうち，ハルシネーションに関するものはどれか。
    c:
      - 学習データの偏りによって，特定の属性の人に不利な判断をすることがある。
      - AI が事実と異なる内容を，もっともらしい文章として生成することがあるので，出力の内容を確認する。
      - 判断の根拠が人に分かりにくいので，説明できるようにする技術を用いる。
      - 実在の人物の顔や声をまねた偽の映像を作成できるので，悪用に注意する。
    a: イ
    exp: |
      ハルシネーション（幻覚）は、生成 AI が事実に基づかない誤った内容を、あたかも正しいかのようにもっともらしく生成してしまう現象です。存在しない文献や数値を答えることもあるため、業務で使う場合は、出典を確認する、人が内容をチェックする（ヒューマンインザループ）、信頼できる資料を検索して回答に使う仕組みを組み合わせる、などの対策をとります。
    why:
      - これはアルゴリズムのバイアス（学習データの偏り）に関する留意点です。
      - 正解です。もっともらしい誤情報を生成する現象への注意です。
      - これは説明可能な AI（XAI）に関する留意点です。
      - これはディープフェイクに関する留意点です。
    terms:
      - ハルシネーション
      - 生成AI
      - ディープフェイク
      - XAI
      - AIのバイアス
  - id: A21-008
    topic: 21-1-4-3
    diff: 2
    q: 説明可能な AI（XAI）が求められる理由として，最も適切なものはどれか。
    c:
      - AI の処理には高い計算能力が必要であり，専用のハードウェアで高速化する必要があるから
      - 深層学習などのモデルは判断の根拠が人に分かりにくく，融資の審査や医療などでは，結果の妥当性を検証したり利用者に説明したりする必要があるから
      - AI が生成した文章の著作権が，すべて AI の開発者に帰属するから
      - AI の学習には大量のデータが必要であり，データの収集費用を抑える必要があるから
    a: イ
    exp: |
      深層学習などの複雑なモデルは、入力から出力に至る判断の過程が人にとって分かりにくい「ブラックボックス」になりがちです。人の生活や権利に影響する分野（融資の審査、採用、医療診断など）では、なぜその結果になったのかを説明できないと、誤りや偏りに気付けず、利用者の納得も得られません。そこで、判断の根拠を人が理解できる形で示す説明可能な AI（XAI）が求められています。
    why:
      - 計算の高速化は、GPU などのハードウェアで対応する問題です。
      - 正解です。判断の根拠を示し、妥当性の検証や説明を可能にするためです。
      - AI が生成した文章の著作権がすべて開発者に帰属するという決まりはなく、XAI の目的とも関係しません。
      - データの収集費用の問題は、判断の根拠を説明するという XAI の目的とは関係しません。
    terms:
      - XAI
      - 機械学習
  - id: A21-009
    topic: 21-2-2
    diff: 1
    q: かんばん方式の説明として，適切なものはどれか。
    c:
      - 後工程が，必要な部品を必要なときに必要な量だけ前工程から引き取り，前工程は引き取られた分だけを生産する。部品の引取りや生産の指示に「かんばん」と呼ぶ票を用いる。
      - 製品の需要予測に基づいて，各工程がそれぞれ計画した量をまとめて生産し，次の工程に送る。
      - 1人又は少人数の作業者が，部品の取付けから検査まで，製品の組立ての全工程を担当する。
      - 設計データを基に，コンピュータで工作機械を制御して部品を加工する。
    a: ア
    exp: |
      かんばん方式は、トヨタ生産方式で用いられる JIT（Just In Time）を実現するための手法です。後工程が「かんばん」と呼ぶ票を使って前工程から必要な分だけを引き取り、前工程は引き取られた分だけを補充生産します（後工程引取り方式、プル方式）。これにより、つくりすぎや中間在庫のムダを減らせます。
    why:
      - 正解です。後工程引取りと、かんばんによる指示の仕組みです。
      - 計画に基づいて前工程から押し出すように生産するのはプッシュ方式で、かんばん方式とは逆の考え方です。
      - これはセル生産方式の説明です。
      - これは CAM や NC（数値制御）工作機械による加工の説明です。
    terms:
      - かんばん方式
      - JIT
      - セル生産方式
  - id: A21-010
    topic: 21-2-2
    diff: 2
    q: セル生産方式の特徴として，適切なものはどれか。
    c:
      - 1人又は少人数の作業者が製品の組立ての全工程を担当するので，多品種少量生産や生産品目の変更に柔軟に対応しやすい。
      - ベルトコンベアに沿って工程を細かく分け，各作業者が単純な作業を繰り返すので，単一製品の大量生産に向く。
      - 受注してから設計を始め，顧客ごとに異なる製品を1つずつ生産する。
      - 工程ごとに一定数量をまとめて生産し，まとめて次の工程に送る。
    a: ア
    exp: |
      セル生産方式は、U 字型などに配置した作業台（セル）で、1人又は少人数の作業者が部品の取付けから検査までの複数の工程を受け持って製品を完成させる生産方式です。作業者に多能工としての技能が必要になりますが、ライン生産方式と比べて段取り替えが容易で、多品種少量生産や需要の変化に柔軟に対応できます。
    why:
      - 正解です。少人数で全工程を受け持つので、品目の変更に柔軟に対応できます。
      - これはライン生産方式（流れ作業）の説明です。
      - これは個別受注生産の説明です。
      - これはロット生産方式の説明です。
    terms:
      - セル生産方式
      - ライン生産方式
  - id: A21-011
    topic: 21-2-2
    diff: 2
    q: リーン生産方式の説明として，適切なものはどれか。
    c:
      - 生産を海外の専門企業に委託し，自社では設計と販売だけを行う。
      - トヨタ生産方式などを研究して体系化したもので，在庫やつくりすぎ，手待ちなどのムダを徹底的に排除して，必要なものを必要な量だけ効率よく生産する。
      - 製品の設計から製造までの情報をコンピュータで統合し，生産全体を管理する。
      - 需要の変動に備えて，大量の製品在庫を常に確保しておく生産方式である。
    a: イ
    exp: |
      リーン（lean）は「ぜい肉のない、引き締まった」という意味です。リーン生産方式は、トヨタ生産方式を米国の研究者が分析して一般化したもので、顧客にとって価値を生まない活動（在庫、つくりすぎ、手待ち、運搬、不良など）をムダとして徹底的に排除し、少ない資源で効率よく生産することを目指します。JIT やかんばん方式はその中心的な手法です。
    why:
      - 製造を外部の専門企業に任せるのは、EMS などを利用したファブレス経営の説明です。
      - 正解です。ムダを徹底的に排除する生産方式です。
      - これは CIM（コンピュータ統合生産）の説明です。
      - 大量の在庫を抱えることは、リーン生産方式が排除しようとするムダにあたります。
    terms:
      - リーン生産方式
      - JIT
      - CIM
  - id: A21-012
    topic: 21-2-3
    diff: 2
    q: |
      製品 A を 10 個生産する。製品 A は 1 個につき部品 B を 2 個使い，部品 B は 1 個につき部品 C を 3 個使って製造する。部品 B の在庫が 4 個，部品 C の在庫が 15 個あるとき，MRP の考え方で求めた部品 C の正味所要量は何個か。ここで，製品 A の在庫はなく，ほかの条件は考えないものとする。
    c:
      - '48'
      - '45'
      - '33'
      - '60'
    a: ウ
    exp: |
      MRP では、上位の品目から順に「総所要量 − 在庫 = 正味所要量」を求め、その正味所要量に部品表の使用数を掛けて下位の品目の総所要量を求めます。
      - 部品 B の総所要量 = 10 × 2 = 20 個、正味所要量 = 20 − 4 = 16 個
      - 部品 C の総所要量 = 16 × 3 = 48 個、正味所要量 = 48 − 15 = 33 個
    why:
      - 部品 C の総所要量で、部品 C の在庫 15 個を差し引いていません。
      - 部品 B の在庫 4 個を差し引かずに 10 × 2 × 3 − 15 と計算した値です。
      - 正解です。部品 B の在庫を差し引いた 16 個分の部品 C から、C の在庫を差し引きます。
      - 10 × 2 × 3 と、在庫を一切考慮せずに計算した値です。
    terms:
      - MRP
      - 部品表
    verify:
      value: (10 * 2 - 4) * 3 - 15
  - id: A21-013
    topic: 21-2-3
    diff: 2
    q: MRP（資材所要量計画）の説明として，適切なものはどれか。
    c:
      - 製品ごとに一定期間の需要を予測し，在庫が発注点を下回ったら一定量を発注する。
      - 生産計画を基に，部品表と在庫情報を用いて，必要な部品や資材の正味所要量と発注時期を算出する。
      - 後工程が前工程から必要な部品を必要な分だけ引き取る。
      - 製品の外観や構造を，コンピュータの画面上で設計して図面を作成する。
    a: イ
    exp: |
      MRP（Material Requirements Planning：資材所要量計画）は、いつ製品を何個つくるかという基準生産計画を基に、部品表（BOM）で必要な部品・資材の総所要量を展開し、在庫や発注残を差し引いて正味所要量を求め、調達期間（リードタイム）を考慮して発注時期を決める手法です。
    why:
      - これは在庫管理における定量発注方式の説明です。
      - 正解です。部品表と在庫情報から正味所要量と発注時期を求めます。
      - これはかんばん方式（JIT）の説明です。
      - これは CAD の説明です。
    terms:
      - MRP
      - 部品表
      - CAD
      - かんばん方式
      - 定量発注方式
  - id: A21-014
    topic: 21-2-3
    diff: 2
    q: FMS（Flexible Manufacturing System）の説明として，適切なものはどれか。
    c:
      - 生産の情報だけでなく，受注，設計，販売などの情報もコンピュータで統合し，企業全体の生産活動を最適化する考え方
      - 部品の在庫が発注点を下回ったときに，自動的に発注するシステム
      - 製品の設計段階で，コンピュータ上で強度などの解析を行うシステム
      - NC 工作機械，自動搬送装置，自動倉庫などをコンピュータで統合的に制御し，多品種少量の製品を効率よく生産できるようにしたシステム
    a: エ
    exp: |
      FMS（Flexible Manufacturing System：フレキシブル生産システム）は、数値制御（NC）工作機械、産業用ロボット、無人搬送車、自動倉庫などをコンピュータで結んで統合制御し、加工する品目が変わっても段取り替えを自動化して柔軟に対応できるようにした生産システムです。多品種少量生産を効率的に行うことを目的とします。より小規模な単位のものを FMC（Flexible Manufacturing Cell）といいます。
    why:
      - これは CIM（コンピュータ統合生産）の説明です。
      - これは在庫管理システムの自動発注の説明で、FMS とは関係しません。
      - これは CAE の説明です。
      - 正解です。生産設備を統合制御して多品種少量生産に柔軟に対応します。
    terms:
      - FMS
      - CIM
      - CAE
  - id: A21-015
    topic: 21-2-4
    diff: 1
    q: CAD で作成した設計データを基に，NC 工作機械を動作させるための加工データを作成するなど，製造工程を支援するシステムはどれか。
    c:
      - PDM
      - CAD
      - CAE
      - CAM
    a: エ
    exp: |
      CAM（Computer Aided Manufacturing：コンピュータ支援製造）は、CAD（Computer Aided Design：コンピュータ支援設計）で作成した設計データを基に、NC 工作機械の加工手順や工具の経路などのデータを作成し、製造工程を支援するシステムです。CAD と CAM を連携させたものを CAD/CAM といいます。
    why:
      - PDM は、設計図面や部品表など製品に関するデータを一元管理するシステムです。
      - CAD は、コンピュータを使って製品の設計や図面の作成を行うシステムです。
      - CAE は、設計した製品の強度や熱の伝わり方などをコンピュータ上でシミュレーションして解析するシステムです。
      - 正解です。設計データから加工データを作成し製造を支援します。
    terms:
      - CAM
      - CAE
      - CAD
      - PDM
  - id: A21-016
    topic: 21-3-1-3
    diff: 2
    q: インターネットを利用した販売におけるロングテールの説明として，適切なものはどれか。
    c:
      - 売上の上位 20% の商品が，売上全体の約 80% を占める。
      - 顧客が商品を購入するまでに，注意，関心，欲求，記憶，行動の段階を経る。
      - 商品の販売数は，発売直後に最も多く，その後は急速に減少する。
      - 販売数の少ない多数のニッチ商品であっても，品ぞろえを豊富にすることで，その売上の合計が全体の中で無視できない割合を占めるようになる。
    a: エ
    exp: |
      販売数を縦軸、商品を売れる順に横軸に並べると、売れ筋商品の山の右側に、少しずつしか売れない商品が長い尾（ロングテール）のように続きます。実店舗では陳列スペースの制約から尾の部分の商品は扱いにくいですが、在庫や陳列のコストが小さいネット販売では多数のニッチ商品を扱えるため、その売上の合計が大きな割合を占めるようになります。
    why:
      - これはパレートの法則（80:20 の法則）の説明で、ロングテールとは逆に上位商品の重要性を示す考え方です。
      - これは購買行動のモデル（AIDMA）の説明です。
      - これは商品の販売数の時間的な推移を表すもので、ロングテールの説明ではありません。
      - 正解です。ニッチ商品の売上の積み重ねが大きくなることです。
    terms:
      - ロングテール
      - パレート分析
  - id: A21-017
    topic: 21-3-1-3
    diff: 1
    q: 電子商取引の取引形態のうち，CtoC に該当するものはどれか。
    c:
      - 部品メーカが，取引先の製造業者から電子的に受注する。
      - 個人が不要になった品物をフリマアプリに出品し，別の個人が購入する。
      - 企業が自社の Web サイトで，消費者に商品を販売する。
      - 国が，企業からの申請や届出をオンラインで受け付ける。
    a: イ
    exp: |
      電子商取引は、取引の当事者によって分類されます。
      - BtoB（Business to Business）：企業間の取引
      - BtoC（Business to Consumer）：企業と消費者の取引
      - CtoC（Consumer to Consumer）：消費者（個人）間の取引。ネットオークションやフリマアプリなど
      - GtoB（Government to Business）：行政と企業の取引
      - GtoC（Government to Citizen）：行政と市民の取引
    why:
      - 企業間の取引なので BtoB です。
      - 正解です。個人間の取引なので CtoC です。
      - 企業から消費者への販売なので BtoC です。
      - 行政と企業の間の手続なので GtoB です。
    terms:
      - 電子商取引
      - CtoC
      - BtoC
      - BtoB
  - id: A21-018
    topic: 21-3-1-3
    diff: 2
    q: OtoO（Online to Offline）の例として，適切なものはどれか。
    c:
      - 実店舗で商品を確認した後，価格の安いネットショップで購入する。
      - スマートフォンのアプリで近くの店舗で使えるクーポンを配信し，実店舗への来店を促す。
      - 企業が，購買を検討している顧客に，Web 上で商品の比較サイトを提供する。
      - 個人のブログに広告を掲載し，閲覧者が購入した金額に応じて報酬を支払う。
    a: イ
    exp: |
      OtoO（O2O：Online to Offline）は、Web やスマートフォンなどオンラインでの情報提供（クーポンの配信や店舗情報の案内など）によって、実店舗（オフライン）での購買を促す施策です。オンラインとオフラインを区別せずに一体として顧客体験を設計する OMO（Online Merges with Offline）という考え方もあります。
    why:
      - 実店舗で確認してネットで購入する行動はショールーミングと呼ばれ、OtoO とは逆向きの流れです。
      - 正解です。オンラインの施策で実店舗への来店を促しています。
      - 比較サイトの提供はオンライン内で完結しており、実店舗への送客ではありません。
      - これはアフィリエイト（成果報酬型広告）の説明です。
    terms:
      - OtoO
      - OMO
      - アフィリエイト
  - id: A21-019
    topic: 21-3-1-2
    diff: 1
    q: フィンテック（FinTech）の説明として，適切なものはどれか。
    c:
      - 農業にロボットやセンサーなどの技術を導入し，作業を省力化する取組み
      - 工場の生産設備をネットワークで結び，生産を自動化・最適化する取組み
