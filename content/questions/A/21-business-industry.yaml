      - ライフログ
      - 情報銀行
  - id: A21-027
    topic: 21-4-1
    diff: 2
    q: 組込みシステムで用いられるリアルタイム OS の特徴として，最も適切なものはどれか。
    c:
      - 優先度に基づくプリエンプティブなスケジューリングなどにより，発生した事象に対して決められた時間内に応答することを重視する。
      - 大量のデータをまとめて一括処理し，処理全体のスループットを最大化することを重視する。
      - 多数の利用者が端末から同時に利用できるよう，CPU の処理時間を均等に割り当てることを重視する。
      - 利用者が操作しやすいように，グラフィカルな画面の表示を重視する。
    a: ア
    exp: |
      リアルタイム OS（RTOS）は、機器の制御など、決められた時間内に処理を完了させること（時間制約）が求められる組込みシステムで使われる OS です。センサーからの信号などのイベントが発生したら、優先度の高いタスクに直ちに CPU を割り当てる（プリエンプション）ことで、応答時間の上限を保証しやすくしています。
    why:
      - 正解です。決められた時間内に応答することを重視します。
      - これはバッチ処理の考え方で、応答時間の保証を重視するリアルタイム OS とは目的が異なります。
      - これはタイムシェアリングシステムの特徴です。
      - GUI の使いやすさは、パソコン向けの OS などで重視される特徴です。
    terms:
      - リアルタイムOS
      - 組込みシステム
      - タスク管理
  - id: A21-028
    topic: 21-4-1
    diff: 2
    q: IoT システムにエッジコンピューティングを採用する利点として，適切なものはどれか。
    c:
      - センサーなどの機器の近くでデータを処理するので，応答の遅延を小さくでき，クラウドに送るデータ量も削減できる。
      - データを処理する場所が1か所に集中するので，システムの管理対象が減る。
      - すべてのデータをクラウド上のサーバに集めて処理するので，機器側に処理能力が全く必要なくなる。
      - 機器とクラウドの間の通信がなくなるので，ネットワークの設計が不要になる。
    a: ア
    exp: |
      エッジコンピューティングは、IoT 機器やその近く（ネットワークの端＝エッジ）に設置したサーバでデータを処理する方式です。遠くのクラウドまでデータを送って処理結果を待つ必要がないので応答が速くなり、必要なデータだけをクラウドに送ればよいため通信量や負荷も減らせます。自動運転や工場の設備制御など、即時の応答が必要な用途に向きます。
    why:
      - 正解です。遅延の短縮と通信量の削減が利点です。
      - 処理を多数のエッジに分散するので、管理対象はむしろ増えます。
      - すべてをクラウドで処理するのはエッジコンピューティングとは逆の構成です。
      - エッジで処理した結果などをクラウドと送受信することが多く、通信がなくなるわけではありません。
    terms:
      - エッジコンピューティング
      - IoT
      - センサー
  - id: A21-029
    topic: 21-5-1-1
    diff: 1
    q: MaaS（Mobility as a Service）の説明として，適切なものはどれか。
    c:
      - 機械同士がネットワークを介して，人を介さずに情報をやり取りして動作する。
      - 自動車がインターネットに常時接続し，渋滞情報や車両の状態などをやり取りする。
      - 鉄道，バス，タクシー，シェアサイクルなどの複数の移動手段を組み合わせ，検索・予約・決済を一括して行えるようにし，移動を一つのサービスとして提供する。
      - 運転者が操作しなくても，システムが自動車の運転を行う。
    a: ウ
    exp: |
      MaaS（Mobility as a Service）は、複数の交通手段を、ICT を使って一つのサービスとして統合し、出発地から目的地までの経路検索・予約・支払などをスマートフォンのアプリなどで一括して行えるようにする考え方です。自家用車に頼らない移動の利便性の向上や、渋滞・環境問題の緩和が期待されます。
    why:
      - これは M2M（Machine to Machine）の説明です。
      - これはコネクテッドカーの説明です。
      - 正解です。複数の移動手段を一つのサービスとして提供します。
      - これは自動運転の説明です。
    terms:
      - MaaS
      - コネクテッドカー
      - 自動運転
      - M2M
  - id: A21-030
    topic: 21-5-1-3
    diff: 3
    q: 自動運転のレベル分けにおいて，レベル 3（条件付運転自動化）の説明として，適切なものはどれか。
    c:
      - 特定の条件下では，システムがすべての運転操作を行い，作動継続が困難な場合の対応もシステムが行うので，運転者が対応する必要はない。
      - システムは，前後又は左右のいずれかの車両制御を支援するだけで，運転は運転者が行う。
      - 特定の条件下ではシステムがすべての運転操作を行うが，システムからの介入要求があった場合には，運転者が適切に対応する必要がある。
      - どのような条件下でも，システムがすべての運転操作を行う。
    a: ウ
    exp: |
      自動運転のレベルは、一般に次のように分類されます。
      - レベル 1（運転支援）：前後（加減速）又は左右（ハンドル）のいずれかをシステムが支援
      - レベル 2（部分運転自動化）：前後・左右の両方をシステムが支援。運転の主体は運転者
      - レベル 3（条件付運転自動化）：特定の条件下でシステムが運転を行うが、作動継続が困難な場合はシステムの介入要求に運転者が対応する
      - レベル 4（高度運転自動化）：特定の条件下でシステムが運転を行い、作動継続が困難な場合の対応もシステムが行う
      - レベル 5（完全運転自動化）：条件の限定なく、常にシステムが運転を行う
    why:
      - 作動継続が困難な場合の対応までシステムが行うのはレベル 4（高度運転自動化）です。
      - 前後又は左右のいずれかを支援するのはレベル 1（運転支援）です。
      - 正解です。システムの介入要求に運転者が対応する必要があるのがレベル 3 です。
      - 条件の限定なくシステムが運転するのはレベル 5（完全運転自動化）です。
    terms:
      - 自動運転
      - 自動運転レベル
