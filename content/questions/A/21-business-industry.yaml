      - これはスマートファクトリーの取組みです。
      - これは電子政府・電子自治体の取組みです。
      - 正解です。IT を活用した新しい金融サービスのことです。
    terms:
      - フィンテック
      - スマートファクトリー
      - 電子政府
      - アカウントアグリゲーション
  - id: A21-020
    topic: 21-3-1-2
    diff: 2
    q: RFID の特徴として，適切なものはどれか。
    c:
      - タグには情報を書き込むことができず，製造時に記録した情報だけを読み取る。
      - 電波などを用いて IC タグの情報を非接触で読み書きでき，複数のタグを一括して読み取ることもできる。
      - 情報を記録したタグは，読取り装置に直接接触させなければ読み取れない。
      - 印刷した縞模様の太さで情報を表すので，読取り装置に正確に向けて1つずつ読み取る必要がある。
    a: イ
    exp: |
      RFID（Radio Frequency IDentification）は、IC チップとアンテナを組み込んだ小さなタグ（IC タグ、RF タグ）の情報を、電波などを使って非接触で読み書きする技術です。バーコードと違って、箱の中など直接見えない位置にあるタグや、複数のタグをまとめて読み取ることもできます。物流管理、在庫管理、セルフレジ、交通系 IC カードなどに利用されています。
    why:
      - 書込み可能なタグも多く、読取り専用に限られません。
      - 正解です。非接触で読み書きでき、一括読取りも可能です。
      - RFID は非接触で読み取れることが特徴です。
      - これはバーコード（JAN コードなど）の特徴です。
    terms:
      - RFID
      - ICカード
      - JANコード
  - id: A21-021
    topic: 21-3-1-2
    diff: 2
    q: IC カードが磁気ストライプカードに比べて安全性が高いとされる理由として，最も適切なものはどれか。
    c:
      - 利用するときに必ず読取り装置へ挿入する必要がある。
      - IC チップ内部の情報を不正に読み出そうとすると，データが消去されたり回路が破壊されたりするなど，耐タンパ性が高い。
      - カードの表面に利用者の氏名が印字されている。
      - 記録できる情報の量が磁気ストライプカードより少ない。
    a: イ
    exp: |
      耐タンパ性（タンパリング＝不正な改ざんや解析への耐性）とは、内部の情報を外部から不正に読み出したり改ざんしたりすることが困難な性質です。IC カードは、IC チップ内に暗号鍵などを保持し、チップを分解・解析しようとするとデータが消去されるなどの仕組みを備えているため、磁気ストライプのデータを読み取って複製（スキミング）されやすい磁気カードよりも偽造が困難です。
    why:
      - 非接触型の IC カードもあり、挿入が必須ではありません。また、挿入の有無は安全性の理由になりません。
      - 正解です。耐タンパ性の高さが安全性の理由です。
      - 氏名の印字は安全性の向上にはつながりません。
      - IC カードは磁気カードより多くの情報を記録できます。また、記録量の少なさは安全性の理由になりません。
    terms:
      - ICカード
      - 耐タンパ性
  - id: A21-022
    topic: 21-3-1-4
    diff: 2
    q: eKYC の説明として，適切なものはどれか。
    c:
      - 複数の金融機関の口座情報を，1つの画面にまとめて表示するサービス
      - 店舗で QR コードを読み取って代金を支払う決済方法
      - 銀行口座の開設などで，本人確認書類の画像と本人の容貌の画像をスマートフォンなどで送信させるなどして，オンラインで本人確認を完結させる仕組み
      - 不正に得た資金の出所を隠す行為を防ぐための監視の仕組み
    a: ウ
    exp: |
      KYC（Know Your Customer）は、金融機関などが取引相手の本人確認を行う手続です。eKYC（electronic Know Your Customer）は、それを電子的に行う仕組みで、運転免許証などの本人確認書類の撮影画像と、その場で撮影した本人の顔の画像を照合するなどの方法で、来店や書類の郵送なしに本人確認を完結できます。
    why:
      - これはアカウントアグリゲーションの説明です。
      - これは QR コード決済（キャッシュレス決済の一種）の説明です。
      - 正解です。オンラインで本人確認を完結させる仕組みです。
      - これは AML（マネーロンダリング対策）の説明です。
    terms:
      - eKYC
      - アカウントアグリゲーション
      - AML・CFT
      - キャッシュレス決済
  - id: A21-023
    topic: 21-3-1-3
