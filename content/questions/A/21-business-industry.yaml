    terms:
      - クラウドファンディング
      - クラウドソーシング
      - シェアリングエコノミー
      - クラウドコンピューティング
  - id: A21-024
    topic: 21-3-1-3
    diff: 2
    q: オムニチャネルの説明として，適切なものはどれか。
    c:
      - 自社の Web サイトに他社の広告を掲載し，成果に応じて報酬を受け取る。
      - 製造業者が卸売業者や小売業者を介さずに，消費者に直接販売する。
      - 実店舗，EC サイト，スマートフォンアプリなどの販売チャネルを連携させ，顧客がどのチャネルでも同じように商品の購入や受取りができるようにする。
      - 販売チャネルを EC サイトだけに絞り込み，実店舗を廃止して費用を削減する。
    a: ウ
    exp: |
      オムニチャネル（omni＝すべての）は、実店舗、EC サイト、アプリ、SNS、カタログ通販など、あらゆる販売チャネルの在庫や顧客情報を統合し、顧客がチャネルを意識せずに買物できるようにする戦略です。例えば、EC サイトで注文した商品を最寄りの店舗で受け取る、店舗の在庫をアプリで確認する、といったことができます。
    why:
      - これはアフィリエイトの説明です。
      - これは DtoC（Direct to Consumer）の説明です。
      - 正解です。すべての販売チャネルを連携・統合します。
      - チャネルを絞り込むことは、複数のチャネルを統合するオムニチャネルとは逆の考え方です。
    terms:
      - オムニチャネル
      - DtoC
      - アフィリエイト
  - id: A21-025
    topic: 21-3-2-1
    diff: 3
    q: EDI の取引当事者間で取り決める規約のうち，送受信するメッセージの形式（データ項目の並びやコードなど）を定めるものはどれか。
    c:
      - 情報伝達規約
      - 基本取引規約
      - 業務運用規約
      - 情報表現規約
    a: エ
    exp: |
      EDI では、異なる企業のコンピュータ間で正しくデータを交換するため、次のような階層の取決め（規約）を行います。
      - 基本取引規約：EDI による取引の契約上の取決め（法的な効力など）
      - 業務運用規約：業務やシステムの運用に関する取決め（取引データを送る時間帯など）
      - 情報表現規約：メッセージの形式やデータコードなどの取決め
      - 情報伝達規約：通信回線やプロトコルなど、データを伝送する方法の取決め
    why:
      - 情報伝達規約は、通信手順（プロトコル）など、データを伝送するための取決めです。
      - 基本取引規約は、EDI による取引の契約に関する取決めです。
      - 業務運用規約は、システムの運用時間など、業務の運用に関する取決めです。
      - 正解です。メッセージの形式やコードを定める規約です。
    terms:
      - EDI
      - EDI規約
  - id: A21-026
    topic: 21-3-3
    diff: 1
    q: シェアリングエコノミーの例として，適切なものはどれか。
