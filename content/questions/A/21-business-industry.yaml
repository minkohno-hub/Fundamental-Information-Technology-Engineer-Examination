      フィンテック（FinTech）は Finance（金融）と Technology（技術）を組み合わせた造語で、IT を活用した革新的な金融サービスやその取組みを指します。スマートフォン決済、個人間送金、複数の口座情報をまとめて表示するアカウントアグリゲーション、AI による与信審査、ブロックチェーンを使った暗号資産などが例です。
    why:
