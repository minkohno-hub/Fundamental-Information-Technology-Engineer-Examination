questions:
  - id: A17-501
    topic: 17-2-1
    diff: 4
    q: |
      経理部では，請求書の内容を会計システムへ入力する作業が月間 2,400 件あり，1 件当たり 5 分かかっている。RPA を導入すると，この作業時間の 80% を自動化できる見込みである。人件費は 1 時間当たり 3,000 円，RPA の初期導入費用は 600 万円，年間の保守費用は 120 万円である。保守費用を差し引いた年間の純効果で投資を回収するとき，回収期間は約何年か。ここで，作業は年間 12 か月で一定とし，その他の費用は考慮しない。
    c:
      - 約 0.8 年
      - 約 0.9 年
      - 約 1.3 年
      - 約 1.0 年
    a: ウ
    scope: 17-2-1 業務プロセスの改善（RPA）と 18-1-2 開発投資対効果の回収期間法の組合せ。RPA 導入の費用対効果を時間・人件費から金額に換算して回収期間を求める計算は、シラバスの範囲内である。
    prereq: RPA の目的、回収期間法（投資額÷年間の純効果）、時間と金額の換算
    hard: 作業時間から削減額への換算と保守費用の控除という多段階の計算が必要で、保守費用の扱いを誤ると別の選択肢に至る。
    exp: |
      年間の作業時間は 2,400 件 × 12 か月 × 5 分 ÷ 60 ＝ 2,400 時間です。自動化できる時間は 2,400 × 0.8 ＝ 1,920 時間，削減できる人件費は 1,920 × 3,000 円 ＝ 576 万円です。ここから年間保守費用 120 万円を引くと，年間の純効果は 576 － 120 ＝ 456 万円です。
      回収期間 ＝ 初期投資 ÷ 年間の純効果 ＝ 600 ÷ 456 ≒ 1.32 年となります。
      | 項目 | 計算 | 金額 |
      | --- | --- | --- |
      | 年間作業時間 | 2,400 × 12 × 5 ÷ 60 | 2,400 時間 |
      | 削減時間 | 2,400 × 0.8 | 1,920 時間 |
      | 削減額 | 1,920 × 3,000 円 | 576 万円 |
      | 純効果 | 576 － 120 | 456 万円 |
    why:
      - 自動化率 80% も保守費用も無視して，全作業の人件費 720 万円で割った値（600 ÷ 720 ≒ 0.83）です。効果を過大に見積もっています。
      - 保守費用を効果に足してしまった値（600 ÷ (576 ＋ 120) ≒ 0.86）です。保守費用は効果を減らす費用であり，足すのは符号の取り違えです。
      - 正解です。600 ÷ 456 ≒ 1.32 年です。
      - 保守費用を差し引かず，削減額 576 万円で割った値（600 ÷ 576 ≒ 1.04）です。RPA は毎年保守費用がかかるため，純効果で評価します。
    know: 回収期間法は時間的価値を考慮せず，回収後の効果も評価しない。RPA の効果は削減時間×単価で求め，保守費用などの継続費用は差し引いた純効果で評価する。
    terms:
      - RPA
      - 回収期間法
    verify:
      value: 600 / (2400*12*5/60*0.8*3000/10000 - 120)
      tolerance: 0.05
  - id: A17-502
    topic: 17-1-2-1
    diff: 3
    q: |
      EA（エンタープライズアーキテクチャ）の 4 つの階層のうち，各階層で作成される成果物の組合せとして，適切なものはどれか。
    c:
      - ビジネスアーキテクチャ＝ネットワーク構成図，データアーキテクチャ＝情報システム関連図，アプリケーションアーキテクチャ＝データ定義表，テクノロジアーキテクチャ＝業務流れ図
      - ビジネスアーキテクチャ＝データ定義表，データアーキテクチャ＝業務流れ図，アプリケーションアーキテクチャ＝ネットワーク構成図，テクノロジアーキテクチャ＝情報システム関連図
      - ビジネスアーキテクチャ＝業務流れ図，データアーキテクチャ＝データ定義表，アプリケーションアーキテクチャ＝情報システム関連図，テクノロジアーキテクチャ＝ネットワーク構成図
      - ビジネスアーキテクチャ＝情報システム関連図，データアーキテクチャ＝ネットワーク構成図，アプリケーションアーキテクチャ＝業務流れ図，テクノロジアーキテクチャ＝データ定義表
    a: ウ
    scope: 17-1-2 エンタープライズアーキテクチャ（ビジネス・データ・アプリケーション・テクノロジの各アーキテクチャと成果物）。成果物名と階層の対応は，シラバスの用語例にそのまま挙げられている。
    prereq: EA の 4 階層とそれぞれの代表的な成果物の名称
    hard: 4 階層と 4 種類の成果物を同時に対応づける必要があり，名称の印象だけで入れ替えた組合せが紛らわしい。
    exp: |
      EA は政策・業務，データ，アプリケーション，テクノロジの 4 階層で現状（As-Is）と目標（To-Be）を体系化します。各階層の代表的な成果物は次のとおりです。
      | 階層 | 代表的な成果物 |
      | --- | --- |
      | ビジネス | 業務説明書，業務流れ図（WFA），DFD |
      | データ | データ定義表，E-R 図，情報体系整理図 |
      | アプリケーション | 情報システム関連図，情報システム機能構成図 |
      | テクノロジ | ハードウェア構成図，ソフトウェア構成図，ネットワーク構成図 |
      4 つの成果物をこの表に当てはめた組合せだけが適切です。
    why:
      - ネットワーク構成図をビジネスに当てている誤りです。ネットワークやハードウェアの構成は，最も技術寄りのテクノロジ階層の成果物です。
      - ビジネスとデータ，アプリケーションとテクノロジの成果物をそれぞれ入れ替えています。業務の流れは業務の階層，データの定義はデータの階層で扱います。
      - 正解です。業務流れ図はビジネス，データ定義表はデータ，情報システム関連図はアプリケーション，ネットワーク構成図はテクノロジの成果物です。
      - 業務流れ図をアプリケーションに，情報システム関連図をビジネスに当てている誤りです。システム間の関連は業務ではなくアプリケーション階層です。
    know: EA の階層は業務に近い順にビジネス，データ，アプリケーション，テクノロジ。成果物名の印象で混同しやすいので，システム間の関係はアプリケーション，物理構成はテクノロジと整理する。
    terms:
      - EA
      - ビジネスアーキテクチャ
      - データアーキテクチャ
    verify:
      manual: 4 階層の成果物を IPA の EA 参照モデル（業務流れ図・データ定義表・情報システム関連図・ネットワーク構成図）と照合し，正解のみ全対応が一致することを確認
  - id: A17-503
    topic: 17-2-1
    diff: 2
    q: |
      受注処理で，見積りから出荷指示までに 5 段階の承認があり，納期の長期化が問題になっている。BPR（Business Process Reengineering）の考え方に沿った対応はどれか。
    c:
      - 顧客満足度の向上を目標に，承認の目的を見直して，金額の小さい案件は承認を省略するなど業務プロセス自体を抜本的に設計し直す。
      - 現行の業務手順を維持したまま，入力画面の項目配置を変更して入力時間を短縮する。
      - 承認処理を担当する事務員を増員して，各承認の待ち時間を短縮する。
      - 現行の 5 段階の承認フローは変えずに，承認者へ未承認の督促メールを自動送信する。
    a: ア
    scope: 17-2-1 業務プロセスの改善と問題解決（BPR）。BPR が既存の枠組みにとらわれずプロセスを根本から再設計する手法であることを，具体的な状況に当てはめて判断する問題で，シラバスの範囲内である。
    prereq: BPR と業務改善（部分最適の改善）の違い
    hard: どの選択肢も一見もっともらしい改善策であり，既存プロセスを前提にするか否かで BPR かどうかを見極める必要がある。
    exp: |
      BPR は，目標（ここでは納期短縮や顧客満足度の向上）を起点に，既存の組織や業務手順の前提を疑って，プロセスそのものを抜本的に再設計する手法です。承認の目的を見直し，不要な承認を廃止・統合するのは，この考え方に合致します。
      督促メールの自動化，入力画面の改善，要員の増員は，現行の 5 段階の承認という構造を前提にした部分的な改善であり，効果はあっても BPR ではありません。
    why:
      - 正解です。目標を起点に，承認という既存の前提を見直してプロセス自体を設計し直しています。
      - 入力画面の改善は，作業単位の効率化にとどまります。プロセスの構造は変わらないため，BPR とはいえません。
      - 増員は現行プロセスを前提にした資源の追加です。プロセスの再設計ではなく，コスト増を伴う対症療法になります。
      - 督促は現行フローを維持したままの運用改善です。承認の段階数が多いという根本原因には手が付けられていません。
    know: BPR は既存業務を前提とした改善（カイゼン）と異なり，目的から逆算してゼロベースでプロセスを再設計する。情報システム化や RPA はその実現手段になる。
    terms:
      - BPR
  - id: A17-504
    topic: 17-3-2
    diff: 4
    q: |
      社内の人事システムを，オンプレミスで構築する案と，SaaS を利用する案で比較する。オンプレミス案は初期費用 1,800 万円，年間の運用費 300 万円である。SaaS 案は初期費用 200 万円で，1 人当たり月額 2,500 円の利用料が 150 人分かかる。利用年数が何年を超えると，オンプレミス案の累計費用が SaaS 案を下回るか。ここで，その他の費用は考慮しない。
    c:
      - 約 3.6 年
      - 約 10.7 年
      - 約 5.3 年
      - 約 4.0 年
    a: イ
    scope: 17-3-2 ソリューションサービスの種類（クラウドサービス，オンプレミス）。クラウドとオンプレミスの費用構造（初期費用中心か利用料中心か）の違いを理解し，累計費用で採用を判断することは，シラバスの範囲内である。
    prereq: SaaS とオンプレミスの費用構造，累計費用（TCO）の損益分岐の考え方
    hard: SaaS の月額・人数・12 か月から年額を求め，両案の累計費用を年数の一次式で表して交点を求める多段階の計算になる。
    exp: |
      SaaS 案の年間利用料は 2,500 円 × 150 人 × 12 か月 ＝ 450 万円です。利用年数を x 年とすると，累計費用は次のとおりです。
      | 案 | 累計費用（万円） |
      | --- | --- |
      | オンプレミス | 1,800 ＋ 300x |
      | SaaS | 200 ＋ 450x |
      両者が等しくなる x は 1,800 ＋ 300x ＝ 200 ＋ 450x より 1,600 ＝ 150x，x ≒ 10.67 年です。これを超えて利用するとオンプレミス案の方が安くなります。
    why:
      - 初期費用の差を SaaS の年間利用料で割った値（1,600 ÷ 450）です。オンプレミスの運用費 300 を考慮していないため，交点が早く来てしまいます。
      - 正解です。1,600 ÷ 150 ≒ 10.67 年です。
      - 初期費用の差 1,600 を運用費 300 で割った値です。SaaS 側の継続的な利用料を考慮しておらず，交点が早く来てしまいます。
      - オンプレミスの初期費用を SaaS の年間利用料で割った値（1,800 ÷ 450）です。SaaS の初期費用 200 を引き忘れ，運用費 300 も無視しています。
    know: クラウドは初期費用が小さく利用料が継続的に発生し，オンプレミスは初期費用が大きい。利用期間が長くなるほど相対的にオンプレミスが有利になるが，運用要員や拡張性も考慮して判断する。
    terms:
      - SaaS
      - オンプレミス
    verify:
      value: (1800 - 200) / (2500*150*12/10000 - 300)
      tolerance: 0.05
  - id: A17-505
    topic: 17-1-1-6
    diff: 3
    q: |
      販売管理に ERP パッケージを導入する。標準機能と現行業務の差異が 120 件あり，業務部門は全件についてアドオン開発を要望している。アドオンを多数開発すると，バージョンアップ時の再開発や検証の費用が膨らむことが分かっている。ERP の導入方針として，最も適切なものはどれか。
    c:
      - 標準機能を一切使わず，ERP を単なるデータベース基盤として利用して業務は全て個別開発する。
      - 差異が多いため，ERP パッケージの導入を中止して，現行システムの個別改修を継続する。
      - 差異ごとに，業務を標準機能に合わせて変更できるかを検討し，競争力の源泉となる業務に限ってアドオンを許容する。
      - 現行業務を変えないことを最優先とし，120 件すべてをアドオンで実現する。
    a: ウ
    scope: 17-1-1-6 個別の開発計画（ERP）と 18-1-1 Fit to Standard。ERP パッケージの標準機能に業務を合わせる考え方と，アドオン抑制の判断は，シラバスの用語例にある。
    prereq: ERP の特徴，Fit to Standard と Fit & Gap の違い，アドオンの影響
    hard: 全件アドオンか導入中止かという極端な案が並ぶ中で，保守性とコストの観点から差異ごとに判断する方針を選ぶ必要がある。
    exp: |
      ERP パッケージは業務のベストプラクティスを標準機能として備えており，導入効果は標準機能に業務を合わせる（Fit to Standard）ことで得られます。アドオンを多数開発すると，開発費のほかバージョンアップ時の再開発・検証の負担が増え，パッケージを使う利点が失われます。
      したがって，差異ごとに業務変更の可否を検討し，競争力の源泉となる業務など，真に必要なものに限ってアドオンを認めるのが適切です。
    why:
      - 標準機能を使わない利用は，ERP の業務プロセスと情報の統合という価値を放棄しており，パッケージを導入する意味がありません。
      - 差異が多いことは，業務を標準に合わせるための検討材料です。直ちに導入中止とするのは，全体最適の機会を失う極端な判断です。
      - 正解です。標準機能に合わせることを基本とし，必要なものだけアドオンを許容する方針です。
      - 全件のアドオンは，費用が膨らむうえ，バージョンアップの追従も困難になります。パッケージ導入の利点を損ないます。
    know: ERP 導入では，業務をパッケージに合わせる Fit to Standard が基本。アドオンは費用増とバージョンアップ時の負担になるため，必要最小限にとどめる。
    terms:
      - ERP
      - Fit to Standard
  - id: A17-506
    topic: 17-4-1-4
    diff: 3
    q: |
      小売業の A 社では，店舗の販売実績（表形式のデータ）に加えて，Web サイトのアクセスログや顧客からの問合せ文書も分析に活用したい。当面は分析の目的が定まっていないため，まずは形式を問わず全てのデータをそのまま蓄積し，後から目的に応じて加工・分析できる基盤を用意する。このとき適切な基盤はどれか。
    c:
      - ファイルサーバ上の個人用フォルダ
      - 業務システムの本番データベース
      - データウェアハウス
      - データレイク
    a: エ
    scope: 17-4-1-4 情報システム利用実態の評価・検証（ログ分析）と 9-5 データベースの応用（データウェアハウス，ビッグデータ）。構造化・非構造化データを蓄積する基盤の使い分けは，シラバスの範囲内である。
    prereq: データウェアハウスとデータレイクの違い，構造化データと非構造化データ
    hard: 蓄積する形式の自由度と分析目的の有無という 2 つの条件を照らし合わせて，似た用途のデータ基盤から選ぶ必要がある。
    exp: |
      データレイクは，構造化データ，ログや文書などの非構造化データを，加工せずそのまま蓄積し，必要になったときに分析する基盤です。目的が未定で形式も多様なこの状況に適しています。
      一方，データウェアハウスは，分析目的に合わせてあらかじめ整理・統合した（主に構造化された）データを時系列に蓄積する基盤で，目的が決まっている集計・分析に向きます。本番データベースは業務処理用であり，分析負荷や形式の制約があります。
    why:
      - 個人用フォルダは全社で共有・管理できず，データの利活用基盤として不適切です。
      - 本番データベースは業務処理用です。分析の負荷が業務に影響し，ログや文書の蓄積にも向きません。
      - データウェアハウスは，目的に沿って整理した構造化データを蓄積するもので，文書やログをそのまま保存するには向きません。
      - 正解です。形式を問わず，目的が未定のデータをそのまま蓄積できます。
    know: データレイクは生データをそのまま保管し後から加工（スキーマを読み出し時に決める），データウェアハウスは分析目的に合わせて整理・統合したデータを蓄積する。混同しやすい。
    terms:
      - データレイク
      - データウェアハウス
  - id: A17-507
    topic: 17-1-4
    diff: 4
    q: |
      EC サイトの月間売上は「訪問者数 × 購入率 × 客単価」で表される。現在は，月間訪問者数 100 万人，購入率 2%，客単価 5,000 円である。施策により客単価を 5,500 円に引き上げ，訪問者数は変わらないものとして，月間売上 1 億 5,000 万円を目標とするとき，購入率の目標値（KPI）は約何%必要か。
    c:
      - 約 3.0%
      - 約 2.8%
      - 約 2.7%
      - 約 2.2%
    a: ウ
    scope: 17-1-4 フレームワーク（KGI，KPI）。最終目標（KGI）を要素に分解して重要業績評価指標（KPI）の目標値を求める考え方は，シラバスの KGI・KPI の範囲内である。
    prereq: KGI と KPI の関係，売上の要素分解
    hard: 目標売上を要素に分解して，変化する客単価の影響を考慮した逆算が必要で，比率の足し引きによる誤りが起きやすい。
    exp: |
      KGI は月間売上 1 億 5,000 万円です。売上 ＝ 訪問者数 × 購入率 × 客単価 なので，購入率 ＝ 売上 ÷ (訪問者数 × 客単価) です。
      購入率 ＝ 150,000,000 ÷ (1,000,000 × 5,500) ＝ 150,000,000 ÷ 5,500,000,000 ≒ 0.0273，つまり約 2.7% です。
      現状の売上は 1,000,000 × 0.02 × 5,000 ＝ 1 億円で，目標は 1.5 倍です。客単価が 1.1 倍になるので購入率は 1.5 ÷ 1.1 ≒ 1.36 倍，2% × 1.36 ≒ 2.7% と確認できます。
    why:
      - 客単価の向上を考慮せず，旧単価 5,000 円で逆算した値（1.5 倍の 3.0%）です。客単価を上げる前提なので購入率は低くて済みます。
      - 売上 1.5 倍から客単価 10% 増を引き算して 1.4 倍とした値（2% × 1.4）です。要素は掛け算の関係なので，比で割る必要があります。
      - 正解です。1.5 億円 ÷ (100 万 × 5,500 円) ≒ 2.7% です。
      - 客単価の上昇率 10% を購入率にそのまま掛けた値（2% × 1.1）です。目標の 1.5 倍に届きません。
    know: KGI を要素に分解し，各要素の KPI に落とし込む。要素が積の関係にあるときは，足し引きではなく比（掛け算・割り算）で逆算する。
    terms:
      - KPI
      - KGI
    verify:
      value: 150000000 / (1000000 * 5500) * 100
      tolerance: 0.05
  - id: A17-508
    topic: 17-3-2
    diff: 3
    q: |
      ある企業は，顧客の個人情報データベースを自社の管理下の国内設備に置く方針である。一方で，キャンペーン時にアクセスが急増する Web サイトは，負荷に応じて資源を柔軟に増減させたい。この要件を満たす構成として，最も適切なものはどれか。
    c:
      - 個人情報データベースも Web サイトも，ピーク時のアクセスに合わせた自社設備を購入して運用する。
      - 個人情報データベースは自社設備（プライベート環境）に置き，Web サイトはパブリッククラウド上に構築して，両者を連携させる。
      - 個人情報データベースをパブリッククラウドに置き，Web サイトは自社設備に置く。
      - 個人情報データベースも Web サイトも，全てパブリッククラウドに移行する。
    a: イ
    scope: 17-3-2 ソリューションサービスの種類（パブリッククラウド，プライベートクラウド，ハイブリッドクラウド，オンプレミス）。要件に応じてクラウドの形態を組み合わせる判断は，シラバスの範囲内である。
    prereq: パブリッククラウド，プライベートクラウド，ハイブリッドクラウドの特徴
    hard: データの管理要件と負荷変動という相反する 2 つの要件を，それぞれ異なる環境に割り当てる組合せの判断が必要である。
    exp: |
      個人情報は自社の管理下の国内設備に置く要件があるため，自社設備（オンプレミスやプライベート環境）に置きます。一方，急増するアクセスには，必要なときに資源を増減できるパブリッククラウドが適しています。
      このように，複数の形態を組み合わせて使う構成がハイブリッドクラウドです。両者を連携させることで，管理要件と柔軟性の両立ができます。
    why:
      - ピークに合わせた設備の購入は，普段の稼働率が低く，コストの無駄になります。柔軟な増減の要件も満たせません。
      - 正解です。管理要件はプライベート環境，負荷変動はパブリッククラウドで満たす組合せです。
      - 役割を逆にした構成です。個人情報を外部に置くと管理方針に反し，急増する Web 側は自社設備で処理しきれません。
      - 全てのパブリッククラウド化は，自社管理下の国内設備に置く方針に反します。
    know: ハイブリッドクラウドは，パブリックとプライベート（オンプレミスを含む）を組み合わせ，データの重要度や負荷変動などの要件に応じて配置を分ける。
    terms:
      - ハイブリッドクラウド
      - パブリッククラウド
      - プライベートクラウド
  - id: A17-509
    topic: 17-1-2-1
    diff: 2
    q: |
      EA に基づいて全社の業務とシステムを最適化する際の進め方として，適切なものはどれか。
    c:
      - 目標（To-Be）モデルだけを作成し，現状は調査せずに移行計画を策定する。
      - 現状（As-Is）モデルを作成したら，そのまま現状維持を計画とする。
      - 現状（As-Is）モデルを作成し，目標（To-Be）モデルを定め，両者の差を分析して，移行計画を策定する。
      - 各部門が個別に最適なシステムを構築し，全体の調整は行わない。
    a: ウ
    scope: 17-1-2-1 エンタープライズアーキテクチャの目的と考え方（As-Is モデル，To-Be モデル）。現状と目標のモデルを作成してギャップを埋める進め方は，シラバスの用語例にある。
    prereq: EA の目的，As-Is モデルと To-Be モデル
    hard: 選択肢はいずれも短い進め方の記述で，現状分析と目標設定の順序と，両者の差を移行計画に結びつける点を確認する必要がある。
    exp: |
      EA は，組織全体の業務とシステムを統一的な手法で体系的に記述し，全体最適の視点で見直す手法です。進め方は，まず現状（As-Is）を可視化し，あるべき姿である目標（To-Be）を定め，両者の差（ギャップ）を明らかにして，そのギャップを埋める移行計画を策定します。
      現状を調べずに目標だけを描いても，何をどう変えるべきか分かりません。部門ごとの個別最適を放置すると，EA の目的である全体最適が実現できません。
    why:
      - 現状を把握していないため，目標との差が分からず，実現可能な移行計画を立てられません。
      - 現状の可視化は出発点にすぎません。目標を定めてギャップを埋めなければ，最適化になりません。
      - 正解です。As-Is，To-Be，ギャップ分析，移行計画の順に進めます。
      - 個別最適の積み重ねは，重複や不整合を生みます。EA は全体最適を目的とした手法です。
    know: EA の基本の流れは As-Is の現状分析，To-Be の目標設定，ギャップ分析，移行計画。部門横断で統一的な表記を用いて全体最適を図る。
    terms:
      - EA
      - As-Isモデル
      - To-Beモデル
  - id: A17-510
    topic: 17-2-1
    diff: 3
    q: |
      次の 4 つの業務について，RPA の導入を検討している。RPA の導入効果が最も期待できる業務はどれか。

      | 業務 | 実施頻度 | 手順の明確さ | 例外処理の割合 | 操作対象 |
      | --- | --- | --- | --- | --- |
      | 業務 1 | 月に数件 | 手順が明確 | 約 2% | 一つのシステム |
      | 業務 2 | 毎日数百件 | 担当者の判断に依存 | 約 40% | 複数の既存システムの画面 |
      | 業務 3 | 毎日数百件 | 手順が明確 | 約 2% | 複数の既存システムの画面 |
      | 業務 4 | 毎日数百件 | 手順が明確 | 約 2% | 紙の書類への押印 |
    c:
      - 業務 3
      - 業務 2
      - 業務 4
      - 業務 1
    a: ア
    scope: 17-2-1 業務プロセスの改善と問題解決（RPA）。RPA が定型的で繰返しの多い PC 上の操作を自動化するものであるという特性を，業務の条件に当てはめて判断する問題で，シラバスの範囲内である。
    prereq: RPA の特性，向く業務と向かない業務
    hard: 頻度，手順の明確さ，例外率，操作対象の 4 つの条件を同時に評価し，一部の条件だけが良い業務を除外する必要がある。
    exp: |
      RPA は，人が PC 上で行う定型的で繰返しの多い操作を，ソフトウェアのロボットが代行する技術です。効果が大きいのは，頻度が高く，手順が明確で，例外が少なく，PC の画面操作で完結する業務です。
      | 業務 | 判定 | 理由 |
      | --- | --- | --- |
      | 業務 1 | 効果小 | 頻度が低く自動化の費用に見合わない |
      | 業務 2 | 不向き | 判断依存で例外が多い |
      | 業務 3 | 適する | 高頻度，手順明確，例外少，画面操作 |
      | 業務 4 | 不向き | 紙への押印は PC 上の操作ではない |
    why:
      - 正解です。4 つの条件の全てが RPA に適しています。
      - 担当者の判断や例外が多く，ルール化しにくい業務は，現状の RPA では自動化が困難です。
      - 頻度や手順は適していても，紙への押印は PC 上の操作ではないため，RPA で自動化できません。
      - 手順は明確でも月に数件では，開発費や保守費に見合う効果が出にくい業務です。
    know: RPA の対象は定型・反復・ルールが明確な PC 上の操作。判断を要する業務や例外が多い業務，低頻度の業務は費用対効果が低く，AI 等との併用を検討する。
    terms:
      - RPA
  - id: A17-511
    topic: 17-1-2-3
    diff: 3
    q: |
      合併した 2 社の顧客データを統合して，全社共通の顧客マスタを作成する。両社とも顧客コードの体系が異なり，同一顧客が両方に登録されている場合もある。統合に向けて，データアーキテクチャの観点で最初に行うべき作業はどれか。
    c:
      - 両社の顧客データの項目と意味をデータ定義表などで整理して標準化したうえで，名寄せのルールを定める。
      - 顧客データの統合は行わず，両社のシステムを個別に運用し続ける。
      - 統合後の画面デザインを先に決定し，データの項目はそれに合わせて後から決める。
      - 両社の顧客コードを単純に連結して，重複があってもそのまま一つのテーブルに格納する。
    a: ア
    scope: 17-1-2-3 データアーキテクチャ（データ定義表，E-R 図）と 22-2-2-2 データの加工・分析（名寄せ）。データの定義を標準化して重複を整理する作業は，シラバスの範囲内である。
    prereq: データアーキテクチャの成果物（データ定義表），名寄せ，マスタデータの標準化
    hard: 画面設計やデータ連結を急ぐ案が並ぶ中で，データの意味の統一と名寄せルールの策定が前提になることを見抜く必要がある。
    exp: |
      データアーキテクチャは，業務で扱うデータの種類・意味・関係を整理して定義するものです。統合に先立って，両社の顧客データの項目名・意味・コード体系・桁数などを整理して標準化し，同一顧客を判別して統合する名寄せのルール（どの項目で同一とみなすか）を定める必要があります。
      定義を整理せずに連結すると，同一顧客の重複や意味の不一致が残り，統合後のデータの品質が保てません。
    why:
      - 正解です。データの定義を標準化し，名寄せのルールを決めるのが最初の作業です。
      - 統合しないままでは，全社で顧客を横断的に把握するという目的が達成できません。
      - 画面はデータを利用する側の設計です。データの定義が決まらないと，画面の項目も確定できません。
      - 体系の異なるコードを連結しても，同一顧客の重複が残り，データの意味も統一されません。
    know: データの統合では，データ定義表で項目の意味・形式を標準化し，名寄せで重複を解消する。システムの見た目より先に，データの意味の統一が必要。
    terms:
      - データアーキテクチャ
      - 名寄せ
  - id: A17-512
    topic: 17-1-6
    diff: 4
    q: |
      情報システム戦略の実行状況を，三つの KPI の達成率を重み付けして総合評価する。達成率は，値が大きいほど良い指標では「実績 ÷ 計画」，値が小さいほど良い指標では「計画 ÷ 実績」とし，上限を 100% とする。総合達成率は何%か。

      | KPI | 重み | 計画 | 実績 |
      | --- | --- | --- | --- |
      | 日次受注処理件数 | 50% | 400 件 | 360 件 |
      | 受注のリードタイム | 30% | 2.0 時間 | 2.5 時間 |
      | 入力ミス率 | 20% | 1.0% | 0.8% |
    c:
      - 99%
      - 94%
      - 89%
      - 90%
    a: ウ
    scope: 17-1-6 情報システム戦略実行マネジメント（モニタリング指標，差異分析）と 17-1-4 KPI。KPI の計画と実績を比べる差異分析で，指標の向きに応じた達成率を求める計算は，シラバスの範囲内である。
    prereq: KPI，差異分析，加重平均
    hard: 指標ごとに達成率の式の向きが異なり，上限 100% の適用と重み付けを組み合わせた多段階の計算になる。
    exp: |
      指標の向きを判定して達成率を求めます。受注処理件数は大きいほど良いので 360 ÷ 400 ＝ 90%。リードタイムは小さいほど良いので 2.0 ÷ 2.5 ＝ 80%。入力ミス率も小さいほど良く 1.0 ÷ 0.8 ＝ 125% ですが上限により 100% とします。
      | KPI | 達成率 | 重み | 寄与 |
      | --- | --- | --- | --- |
      | 受注処理件数 | 90% | 0.5 | 45% |
      | リードタイム | 80% | 0.3 | 24% |
      | 入力ミス率 | 100%（上限） | 0.2 | 20% |
      合計は 45 ＋ 24 ＋ 20 ＝ 89% です。
    why:
      - 全ての指標を「実績 ÷ 計画」で計算した値（0.9 × 0.5 ＋ 1.25 × 0.3 ＋ 0.8 × 0.2 ≒ 98.5%）です。小さいほど良い指標の向きを取り違えています。
      - 入力ミス率の達成率に上限を適用せず 125% のまま加重した値（45 ＋ 24 ＋ 25）です。上限 100% の条件を見落としています。
      - 正解です。90% × 0.5 ＋ 80% × 0.3 ＋ 100% × 0.2 ＝ 89% です。
      - 重みを使わず三つの達成率を単純平均した値（(90 ＋ 80 ＋ 100) ÷ 3）です。重み付けの条件を無視しています。
    know: KPI の達成率は，指標が高いほど良いか低いほど良いかで式の向きが変わる。重み付けや上限などの評価ルールは問題文の条件に従って適用する。
    terms:
      - KPI
    verify:
      value: (0.5*(360/400) + 0.3*(2.0/2.5) + 0.2*min(1, 1.0/0.8))*100
      tolerance: 0.5
