questions:
  - id: A15-509
    topic: 15-2-5
    diff: 3
    scope: 15-2-5 インシデント管理における解決期限の管理。SLA の時計が一時停止する条件（利用者側の対応待ち）を含めて、期限超過かどうかを判断する問題
    prereq: インシデントの解決期限は受付からの経過時間で測ること、利用者の確認待ちなどサービス提供者側で進められない時間は、合意により SLA の計測から除くことがあること
    hard: 単純な経過時間ではなく、一時停止の時間を差し引いた「計測対象の時間」で期限を判定する必要がある。停止が認められるのは、ボールが利用者側にある時間だけという条件も問われる。
    q: |
      A社のサポートデスクでは、優先度「高」のインシデントの解決期限を、SLA の計測対象時間で 8 時間と定めている。SLA では、利用者の回答待ちの間は計測を一時停止することが合意されている。あるインシデントは受付から実時間で 11 時間経過したが、そのうち 2 時間は利用者の回答待ち、1 時間は部品の到着待ち（提供者側の都合）であった。このインシデントは解決期限を超過しているか。
    c:
      - 超過している。計測対象時間は 9 時間であり、期限の 8 時間を超えている
      - 超過していない。計測対象時間は 8 時間であり、期限ちょうどである
      - 超過していない。計測対象時間は 11 時間だが、回答待ちの間は対応が進んでいたとみなす
      - 超過している。計測は実時間で行うため、経過した 11 時間がそのまま対象になる
    a: ア
    exp: |
      SLA の計測から除けるのは、合意された一時停止の時間、すなわち利用者の回答待ちの 2 時間だけです。部品の到着待ちは提供者側の都合であり、計測は止まりません。

      計測対象時間 ＝ 11 － 2 ＝ 9 時間

      期限の 8 時間を超えているため、このインシデントは解決期限を超過しています。
    why:
      - 正解です。一時停止できるのは利用者側の待ち時間だけであり、計測対象は 9 時間で期限超過です。
      - 部品の到着待ちまで差し引いた場合の判定です。提供者側の都合による待ちは、一時停止の対象にはなりません。
      - 回答待ちの扱いを取り違えています。回答待ちの間は計測が止まるのであり、対応が進んでいたとみなすのではありません。
      - 実時間で測るという前提が誤りです。SLA では、一時停止の合意がある場合は計測対象時間で判定します。
    know: SLA の期限管理では「実時間」と「計測対象時間」を区別する。一時停止が認められるのは、合意された条件（利用者側の対応待ちなど）の間だけであり、提供者側の都合では止まらない。
    terms: [SLA, インシデント管理]
    verify:
      manual: 実時間 11 時間から一時停止が認められる利用者の回答待ち 2 時間だけを差し引いて計測対象 9 時間とし、部品到着待ちは提供者側の都合で差し引けないこと、期限 8 時間との比較で超過になることを確認した。

  - id: A15-510
    topic: 15-2-12-2
    diff: 3
    scope: 15-2-12-2 問題管理における根本原因の特定。繰り返し発生するインシデントに対し、表面的な対処ではなく根本原因を掘り下げる進め方を選ぶ問題
    prereq: 問題管理の目的は、インシデントの根本原因を特定して再発を防ぐことであり、既知の誤りの記録と恒久対策につなげること
    hard: 選択肢には「早く復旧させる」「手順を厳しくする」といった一見もっともな対応が含まれており、原因の特定そのものに踏み込む選択肢を見分ける必要がある。
    q: |
      A社では、月末の締め処理のたびに、同じ印刷ジョブの異常終了が繰り返し発生している。再起動すれば処理は完了するため、毎回その場の対処で済ませてきた。問題管理として、次に取るべき行動はどれか。
    c:
      - 異常終了が発生したときのジョブの入力データ、実行環境、処理ログを集め、正常に終わる月との違いから、異常の条件を特定する
      - 締め処理の担当者を増やし、異常終了のたびにすぐ再起動できる体制にする
      - 印刷ジョブの再起動手順を、より詳しい手順書に改訂する
      - 異常終了を検知したら、自動で再起動する仕組みを導入する
    a: ア
    exp: |
      繰り返し発生するインシデントに対して問題管理が行うのは、根本原因の特定です。再起動で復旧できることは既に対策（回避策）として成立しているため、次に必要なのは「なぜ月末にだけ異常終了するのか」という条件の特定です。正常に終わる月と異常の月の入力データや環境の差分を集めて比べることで、例えば特定のデータ量や特定レコードの存在といった発生条件が見えてきます。原因が特定できれば、既知の誤りとして記録し、恒久対策（プログラムの修正など）へ進めます。
    why:
      - 正解です。再発する問題では、発生条件の特定が根本原因への入口になります。
      - 復旧の速さは改善しますが、異常終了そのものは発生し続けるため、問題管理の目的である再発防止にはつながりません。
      - 回避策の手順の改善であり、役には立ちますが、原因の特定には踏み込んでいません。
      - 自動化しても異常終了は発生し続け、原因によっては誤った結果を自動で確定させる危険もあります。
    know: 問題管理とインシデント管理の違いは、目的が「復旧」か「再発防止」かにある。再発する事象では、正常時との差分を集めて発生条件を特定することが、根本原因分析の第一歩になる。
    terms: [問題管理, 根本原因]
    verify:
      manual: 各選択肢を「原因の特定」「復旧の迅速化」「回避策の改善」「対処の自動化」に分類し、問題管理の目的（再発防止のための原因特定）に直接進むのは差分による条件の特定だけであることを確認した。

  - id: A15-511
    topic: 15-2-15-1
    diff: 3
    scope: 15-2-15-1 変更管理における変更の分類。定型化され手順が確立した低リスクの変更を、標準変更として事前承認の枠で扱う判断の問題
    prereq: 変更は、影響とリスクに応じて通常変更（その都度評価・承認）と標準変更（手順が確立し事前に承認された定型変更）に分けられること
    hard: 「毎回、変更諮問委員会で承認するのが安全」という直感と、定型変更を標準変更として効率化することが正式な仕組みであることの区別が問われる。緊急変更との混同も避ける必要がある。
    q: |
      A社では、利用者からの申請に基づくパスワードの再設定が、毎日数十件発生している。手順は確立しており、影響範囲も本人のアカウントに限られ、過去に問題が起きたこともない。この変更の扱いとして、最も適切なものはどれか。
    c:
      - 手順と影響が確立した定型的な変更として、標準変更に分類し、事前に承認された手順でその都度実施する
      - 変更のたびに変更諮問委員会（CAB）を開き、個別に評価と承認を受ける
      - 緊急性の高い変更として、緊急変更の手続きで実施する
      - 変更ではなくサービス要求としても扱わず、申請の都度、担当者の判断で実施する
    a: ア
    exp: |
      変更管理では、手順が確立し、影響が限られ、リスクが低い定型的な変更は「標準変更」として分類し、あらかじめ承認された手順の範囲で実施します。パスワードの再設定はその典型例です。これにより、毎回の評価・承認の負担をなくしつつ、手順と記録は管理の対象に残ります。CAB による個別承認は、影響の評価が必要な通常変更のための仕組みです。
    why:
      - 正解です。定型・低リスク・手順確立という条件を満たすため、標準変更として扱います。
      - CAB の個別承認は非定型で影響の大きい変更のためのもので、毎日数十件の定型変更に適用すると処理が滞ります。
      - 緊急変更は、重大な障害の復旧など、通常の評価を待てない場合の手続きであり、定型業務には該当しません。
      - 管理の枠外で実施すると、記録が残らず、後の監査や問題発生時の追跡ができなくなります。
    know: 変更の分類（標準・通常・緊急）は、リスクと定型性で決まる。標準変更は「承認が不要」なのではなく「手順ごと事前に承認されている」変更であり、記録は通常どおり残す点が要点である。
    terms: [変更管理, 標準変更, CAB]
    verify:
      manual: 定型性・影響範囲・リスク・実績の4条件と各選択肢を照合し、標準変更の定義を満たすこと、CAB 個別承認は通常変更、緊急変更は復旧用途であり、いずれも本件には当たらないことを確認した。

  - id: A15-512
    topic: 15-1-4
    diff: 3
    scope: 15-1-4 可用性管理における直列構成の稼働率。利用者から見たサービスが複数の構成要素の直列で成り立つ場合の、全体の稼働率を計算する問題
    prereq: 直列構成では、全体の稼働率は各要素の稼働率の積になること
    hard: 「低いほうに合わせる」「平均を取る」といった直感的な求め方では正しくならず、独立した停止の重なりを積で表す必要がある。小数のかけ算の結果をパーセントに直す段階も間違えやすい。
    q: |
      A社の Web サービスは、Web サーバ（稼働率 99.9 ％）とデータベースサーバ（稼働率 99.5 ％）の両方が稼働しているときだけ利用できる。各サーバの停止は互いに独立しているものとして、サービス全体の稼働率は何％か。
    c: ['99.4', '99.5', '99.7', '99.9']
    a: ア
    exp: |
      両方が稼働していないとサービスが使えない直列構成では、稼働率は積になります。

      0.999 × 0.995 ＝ 0.994005

      すなわち約 99.4 ％です。各要素単体より、サービス全体の稼働率は低くなります。月（720 時間）に換算すると、停止が許されるのは約 4.3 時間であり、データベースサーバ単体の停止（約 3.6 時間）に Web サーバの停止が上乗せされる形になります。
    why:
      - 正解です。直列構成の稼働率は 0.999 × 0.995 ≒ 99.4 ％です。
      - 低いほうの要素（データベースサーバ）の稼働率そのものです。Web サーバの停止の分も差し引く必要があります。
      - 2つの稼働率の平均を取った値です。直列では平均ではなく積で求めます。
      - 高いほうの要素の稼働率そのものです。もう一方の停止もサービス停止になります。
    know: サービスの稼働率は、利用者の視点では構成要素の直列・並列の関係で決まる。直列の要素が増えるほど全体の稼働率は下がるため、個々の要素にはサービス目標より高い稼働率が求められる。
    terms: [稼働率, 可用性管理]
    verify: { type: value, value: 99.4 }

  - id: A15-513
    topic: 15-2-17
    diff: 3
    scope: 15-2-17 性能管理におけるボトルネックの特定。リソースごとの使用率と待ちの状況から、応答時間の劣化の主因となっている資源を判断する問題
    prereq: ボトルネックは、使用率が飽和に近く、かつ待ちが発生している資源であり、他の資源に余裕があっても全体の応答はその資源で決まること
    hard: 複数の資源の数値を並べて読み、最も使用率の高い資源だけでなく、待ち行列の発生と合わせて主因を判断する必要がある。空き容量の大きいメモリの追加のような誤った処方を選ばないことも問われる。
    q: |
      A社の業務システムで、月末のピーク時に応答時間が通常の 5 倍に劣化する。ピーク時の測定値は、CPU 使用率 96 ％（実行待ちの処理が常時発生）、メモリ使用率 55 ％（空きは十分）、ディスクの I/O 待ちは小さく、ネットワークの帯域使用率は 30 ％であった。応答劣化の主因として最も適切なものはどれか。
    c:
      - CPU が飽和しており、処理が CPU の空きを待っている
      - メモリが不足しており、ページングが多発している
      - ディスクの読み書きが追い付いていない
      - ネットワークの帯域が不足している
    a: ア
    exp: |
      CPU 使用率が 96 ％で実行待ちが常時発生していることは、処理が CPU の処理能力の上限で詰まっていることを示します。この状態では、他の資源に余裕があっても応答時間は CPU の待ちで決まります。メモリは使用率 55 ％で空きが十分にあり、ページング多発の兆候もありません。ディスクとネットワークにも余裕があります。対策は、処理の分散や CPU の増強、ピークの平準化といった CPU 側の手当てになります。
    why:
      - 正解です。使用率の飽和と実行待ちの発生が、CPU のボトルネックを示しています。
      - メモリ使用率は 55 ％で空きがあり、ページングの兆候も示されていません。
      - ディスクの I/O 待ちは小さいと測定されており、主因とは考えられません。
      - 帯域使用率は 30 ％で、余裕があります。
    know: ボトルネックの特定は「使用率が高いこと」と「待ちが発生していること」の2点で判断する。片方の資源が飽和すると、他の資源を増強しても応答は改善しない点が、性能管理の要点である。
    terms: [ボトルネック, キャパシティ管理]
    verify:
      manual: 測定値の4資源について、使用率と待ちの有無を照合し、飽和と実行待ちが同時に起きている CPU だけが主因の条件を満たすこと、他の3資源には余裕があることを確認した。

  - id: A15-514
    topic: 15-2-7
    diff: 3
    scope: 15-2-7 サービスレベル管理における減額（サービス料の調整）。SLA の実績値が属する区分を目標の表から読み取り、減額後の請求額を計算する問題
    prereq: 減額率は、実績の稼働率がどの区分に入るかで決まること、請求額は月額から減額分を差し引くこと
    hard: 稼働率の小数第1位までを正しく区分に当てはめることと、減額率を月額に掛ける計算の両方を正確に行う必要がある。
    q: |
      A社は、月額 200 万円でシステムの運用サービスを提供している。契約では、月間稼働率に応じて次の減額を行うことが定められている。当月の実績の稼働率が 99.2 ％であったとき、減額後の請求額は何万円か。

      - 稼働率 99.5 ％以上： 減額なし
      - 稼働率 99.0 ％以上 99.5 ％未満： 月額の 5 ％を減額
      - 稼働率 99.0 ％未満： 月額の 10 ％を減額
    c: ['180', '190', '195', '200']
    a: イ
    exp: |
      実績 99.2 ％は「99.0 ％以上 99.5 ％未満」の区分に入るため、減額率は 5 ％です。

      減額分 ＝ 200 × 0.05 ＝ 10 万円
      請求額 ＝ 200 － 10 ＝ 190 万円

      区分の読み取りでは、99.2 ％が「99.5 ％未満」であることと「99.0 ％以上」であることの両方を確認します。境界の値（ちょうど 99.5 ％や 99.0 ％）では、「以上」と「未満」のどちらに属するかで区分が変わる点も間違えやすいところです。
    why:
      - 減額率 10 ％の区分を適用した値です。99.2 ％は 99.0 ％以上なので、10 ％の区分には入りません。
      - 正解です。5 ％の減額で、請求額は 190 万円です。
      - 減額率を 2.5 ％として計算した値です。区分表の 5 ％が正しい率です。
      - 減額なしの金額です。99.2 ％は 99.5 ％未満なので、減額の対象になります。
    know: SLA の減額（サービス料の調整）は、実績がどの区分に入るかで機械的に決まる。境界値の前後で結果が変わるため、区分の「以上・未満」の読み取りが実務でも重要になる。
    terms: [SLA, サービスレベル管理]
    verify: { type: value, value: 190 }
