questions:
  - id: A21-509
    topic: 21-1-1
    diff: 3
    scope: 21-1-1 社内業務支援システム。会議の日程調整や文書の共有を効率化する、グループウェアの活用の判断
    prereq: グループウェアは、電子メール、スケジュールの共有、文書の共有、掲示板などによって、組織の中の情報の共有と共同作業を支援する仕組みであること
    hard: 個々の業務システム（販売や会計）と、部門を横断する情報共有の仕組みを切り分ける必要がある。
    q: |
      ある会社では、会議の日程調整に何度もメールのやり取りが必要で、会議の資料も担当者ごとに版がばらばらになっている。社内業務の支援の改善として、適切なものはどれか。
    c: ['グループウェアを導入し、スケジュールの共有と、資料の共同編集と版の管理を行えるようにする', '販売管理システムを導入する', '会議の回数を半分に減らすよう、通達を出す', '資料の印刷を禁止する']
    a: ア
    exp: |
      日程の調整と資料の共有は、組織の中の情報の共有と共同作業の問題です。グループウェアは、スケジュールの共有、文書の共有と版の管理、掲示板などの機能で、この種の社内業務を支援します。販売管理システムは販売の業務の仕組みであり、本件の問題には当たりません。会議の回数や印刷の制限は、共有の仕組みの改善にはなりません。
    why:
      - 正解です。スケジュールと文書の共有が、グループウェアの機能です。
      - 販売管理システムは、販売の業務を扱う仕組みであり、日程と資料の共有の問題には当たりません。
      - 回数の制限は、調整の手間そのものを減らすものではありません。
      - 印刷の禁止は、資料の版のばらつきを解消しません。
    know: 社内業務支援の要点は「部門を横断する共有」。スケジュール・文書・連絡の共有は、グループウェアの領域である。
    terms: [グループウェア]
    verify:
      manual: 会議の日程調整の手間と資料の版のばらつきという問題に対し、グループウェアを導入してスケジュールの共有と資料の共同編集と版の管理を行えるようにする改善が適切であることを、販売管理システムの導入・会議の回数の制限・印刷の禁止との比較から確認した。
  - id: A21-510
    topic: 21-1-2
    diff: 3
    scope: 21-1-2 基幹業務支援システム及び業務パッケージ。パッケージの導入で、業務の進め方を標準の機能に合わせる考え方の判断
    prereq: 業務パッケージの導入では、パッケージの標準の機能に業務を合わせることで、開発と保守の負担を抑えられること、独自の作り込み（カスタマイズ）を増やすと、更新や保守の負担が大きくなること
    hard: 「現行の業務の全てをそのまま再現する」という要求と、標準に合わせる割り切りを切り分ける必要がある。
    q: |
      基幹業務のパッケージソフトを導入することになった。ある部門から、「現在の業務の進め方をそのまま再現するよう、全ての機能を作り込んでほしい」という要望が出ている。導入の進め方として、適切なものはどれか。
    c: ['業務の進め方を見直してパッケージの標準の機能に合わせ、作り込みは競争力に関わる部分などに限る', '要望どおり、全ての進め方をそのまま作り込む', 'パッケージの利用をやめ、全てを一から開発する', '作り込みの要否は、ベンダの判断に全て任せる']
    a: ア
    exp: |
      パッケージの利点は、実績のある標準の機能を使うことで、開発と保守の負担を抑えられることです。現在の進め方を全て作り込む（カスタマイズする）と、導入の費用が膨らみ、パッケージの版の更新にも追随しにくくなります。業務の進め方を見直して標準に合わせ、作り込みは、他社との違いを生む部分など、必要な範囲に限ることが、導入の基本です。
    why:
      - 正解です。標準への適合と、作り込みの限定が、パッケージ導入の基本です。
      - 全ての作り込みは、費用の増大と、更新の困難を招きます。
      - 全てを一から開発するのでは、パッケージを選んだ意味がなくなります。
      - 作り込みの要否は、自社の業務の事情に基づいて自社が判断するものです。
    know: パッケージ導入の要点は、「システムを業務に合わせる」から「業務も見直して標準に合わせる」への転換である。作り込みは、違いを生む部分に絞る。
    terms: [業務パッケージ, カスタマイズ]
    verify:
      manual: 基幹業務のパッケージの導入では、業務の進め方を見直して標準の機能に合わせ、作り込みは競争力に関わる部分などに限る進め方が適切であることを、全ての作り込み・一からの開発・ベンダ任せとの比較から確認した。
  - id: A21-511
    topic: 21-2-2
    diff: 3
    scope: 21-2-2 自動制御の構成要素。生産ラインの事例から、検出部・制御部・操作部のうち、操作部に当たるものを同定する問題
    prereq: 自動制御は、対象の状態を測る検出部、目標と比べて判断する制御部、判断を受けて対象に働きかける操作部から構成されること
    hard: 信号の流れ（検出、判断、操作）をたどって、各装置の役割を対応付ける必要がある。「制御装置」という名前の印象だけで判断の主体を選ばないことが問われる。
    q: |
      生産ラインで、ベルトコンベア上の製品の位置を光センサで検出し、その信号を受けた制御装置の判断でモータが止まり、包装機が動作する仕組みがある。この仕組みで、"操作部" に当たるものはどれか。
    c: ['モータ', '光センサ', '制御装置', '製品の位置']
    a: ア
    exp: |
      自動制御の仕組みは、役割の面から 3 つの要素に分けて捉えます。対象の状態を測る部分が検出部、目標と比べてどう動くかを判断する部分が制御部、判断を受けて対象に実際に働きかける部分が操作部です。本件では、製品の位置を検出する光センサが検出部、信号を受けて判断する制御装置が制御部に当たります。そして、判断を受けてベルトコンベアを実際に動かし、止めるモータが操作部です。製品の位置は、制御の対象となる量（制御量）であり、仕組みの要素そのものではありません。
    why:
      - 正解です。判断を受けて、対象（ベルトコンベア）を実際に動かす部分が、操作部です。
      - 光センサは、製品の位置を検出する検出部です。対象に働きかける部分ではありません。
      - 制御装置は、信号を受けて判断を行う制御部です。名前の印象ではなく、信号の流れの中の役割で判断します。
      - 製品の位置は、制御によって保ちたい対象の量（制御量）であり、仕組みを構成する装置ではありません。
    know: 制御の構成は、「測る（検出部）、判断する（制御部）、動かす（操作部）」という信号の流れで捉えると、装置と役割の対応を誤らない。制御量は装置ではなく、対象の量である点も要点である。
    terms: [センサ, 操作部]
    verify:
      manual: 自動制御の構成要素の役割分担（検出部は光センサ、制御部は制御装置、操作部は対象を実際に動かすモータ）と照合し、モータだけが操作部に当たることを確認した。
  - id: A21-512
    topic: 21-2-4
    diff: 3
    scope: 21-2-4 コンピュータ支援システム。設計した部品の強度を、試作品を作る前にコンピュータ上で解析する CAE の活用の判断
    prereq: CAE は、設計した製品の強度や熱などの性質を、コンピュータ上の解析（シミュレーション）で確かめる支援の仕組みであること
    hard: 設計の図面を作る支援（CAD）と、性質を解析する支援（CAE）、製造を支援する仕組み（CAM）の役割を切り分ける必要がある。
    q: |
      機械部品の設計部門で、試作品を作る前に、設計した部品が想定の力に耐えるかどうかを、コンピュータ上の解析で確かめたい。活用する仕組みとして、適切なものはどれか。
    c: ['CAE（コンピュータ支援解析）で、強度の解析を行う', 'CAD で、部品の図面を作成し直す', 'CAM で、工作機械の加工の手順を生成する', '生産管理システムで、部品の在庫を確認する']
    a: ア
    exp: |
      設計した製品の強度や熱の性質などを、コンピュータ上の解析で確かめる支援は、CAE の役割です。試作品を作る前に解析で確かめることで、設計の手戻りや試作の費用を抑えられます。CAD は設計の図面や形状を作る支援、CAM は工作機械の加工を支援する仕組みであり、性質の解析は行いません。
    why:
      - 正解です。性質の解析による確認が、CAE の役割です。
      - CAD は図面や形状を作る支援であり、それだけでは耐えられるかは分かりません。
      - CAM は製造の段階の支援であり、設計の確認ではありません。
      - 在庫の確認は、設計の妥当性の確認とは関係がありません。
    know: 設計製造の支援の対応は、「描く CAD、確かめる CAE、作る CAM」。目的の段階で見分ける。
    terms: [CAE, CAD]
    verify:
      manual: 試作品を作る前に設計した部品が想定の力に耐えるかをコンピュータ上の解析で確かめるには、CAE で強度の解析を行うことが適切であることを、CAD・CAM・生産管理システムとの役割の違いから確認した。
  - id: A21-513
    topic: 21-3-1-1
    diff: 3
    scope: 21-3-1-1 電子受発注システム。発注の自動化に加えて、納品の検収との連携まで含めた運用の判断
    prereq: 電子受発注では、発注データのやり取りを自動化できること、ただし検収の確認は、納品の実態と突き合わせて行う必要があること
    hard: 自動化の範囲を広げすぎて、検収の確認まで省略する運用の誤りを切り分ける必要がある。
    q: |
      取引先との電子受発注システムを導入する。発注データは自動で送受信される。運用の設計として、適切なものはどれか。
    c: ['発注は自動化し、納品の際は、届いた品目と数量を発注データと突き合わせて検収する', 'データでやり取りするので、納品の検収は省略する', '発注データの送信をもって、支払いまで自動で済ませる', '電子受発注の導入後は、電話での確認を全て禁止する']
    a: ア
    exp: |
      電子受発注は、発注のデータのやり取りを正確で速いものにしますが、実際に届いた品目と数量が正しいかは、納品の場面で発注データと突き合わせて確認（検収）します。データの自動化は、実物の確認の代わりにはなりません。検収を経ずに支払いまで進める運用は、誤った納品への支払いの危険があります。
    why:
      - 正解です。発注の自動化と、納品の検収は、別の手続として両立させます。
      - 検収の省略は、誤納品や数量の誤りを見逃すもとになります。
      - 支払いは検収を経て行うものであり、発注の送信と結び付けるべきではありません。
      - 緊急時などの確認の手段まで禁止する必要はなく、本題は検収の有無です。
    know: 電子化の要点は、「データのやり取り」と「実物の確認」を混同しないこと。自動化しても、検収の手続は残る。
    terms: [電子受発注, 検収]
    verify:
      manual: 電子受発注の導入では、発注は自動化し、納品の際は届いた品目と数量を発注データと突き合わせて検収する運用が適切であることを、検収の省略・支払いまでの自動化・電話確認の全面禁止との比較から確認した。
  - id: A21-514
    topic: 21-3-1-4
    diff: 3
    scope: 21-3-1-4 電子商取引の留意点。消費者向けの通販で、価格や送料などの条件を、購入の前に分かりやすく示すことの判断
    prereq: 消費者向けの電子商取引では、価格に加えて送料などの負担を含め、購入の条件を消費者が誤認しないよう表示すること、契約の申込みと承諾の仕組みを明確にすること
    hard: 販売の都合のよい表示（本体価格だけの強調）と、消費者が総額を判断できる表示を切り分ける必要がある。
    q: |
      消費者向けの通販サイトで、商品の価格は大きく表示されているが、送料は購入の手続の最後の画面で初めて示される作りになっている。電子商取引の留意点として、適切なものはどれか。
    c: ['送料を含む支払総額が、購入を決める前に分かるよう表示する', '送料は最後に示す作りのままにする', '送料を商品の価格に含め、価格そのものを引き上げる', '送料の表示は、法律上は不要である']
    a: ア
    exp: |
      消費者向けの電子商取引では、消費者が条件を誤認しないよう、価格とあわせて、送料などの負担を含む支払いの総額が、購入の判断の前に分かるように表示することが求められます。最後の画面で初めて総額が分かる作りは、消費者に不利な不意打ちになります。価格自体の引上げは表示の問題の解決ではなく、送料の表示も必要な情報です。
    why:
      - 正解です。総額が判断の前に分かる表示が、消費者の保護につながります。
      - 最後に示す作りでは、消費者が総額を知らないまま手続を進めることになります。
      - 価格の引上げは、表示の分かりにくさへの対策ではありません。
      - 送料は購入の条件の一部であり、表示が必要です。
    know: EC の表示の要点は、「総額が、決める前に分かるか」。本体価格だけの強調は、消費者の誤認を招く。
    terms: [電子商取引, EC]
    verify:
      manual: 消費者向けの通販サイトで送料が購入手続の最後で初めて示される作りについては、送料を含む支払総額が購入を決める前に分かるよう表示することが適切であることを、現状維持・価格の引上げ・表示不要という考えとの比較から確認した。
  - id: A21-515
    topic: 21-3-3
    diff: 3
    scope: 21-3-3 ソーシャルメディア。企業が公式アカウントで情報を発信する際の運用の決まり（確認の手順）の判断
    prereq: 企業の公式の発信は、担当者の個人的な発信と異なり、内容の確認の手順や、問題が起きた場合の対応をあらかじめ定めておくこと
    hard: 速さを優先して確認なしで発信する運用と、公式の発信としての確認の手順を切り分ける必要がある。
    q: |
      企業が、ソーシャルメディアの公式アカウントで新製品の情報を発信している。運用の決まりとして、適切なものはどれか。
    c: ['発信の前に内容を確認する担当と手順を定め、誤りや問題が見つかった場合の訂正と謝罪の対応もあらかじめ決めておく', '担当者が、思い付いた内容をその場で自由に発信する', '反応を増やすため、他社の話題に便乗した発信を積極的に行う', '問題のある発信を見つけても、自然に沈静化するまで何もしない']
    a: ア
    exp: |
      企業の公式アカウントの発信は、企業としての発言として受け取られます。そのため、発信の前の確認の手順を定め、誤りがあった場合の訂正や謝罪の進め方も、あらかじめ決めておくことが必要です。担当者の自由な発信や、話題への便乗は、誤った情報や不適切な表現の拡散を招き、問題の放置は、批判の拡大（炎上）を招きます。
    why:
      - 正解です。確認の手順と、問題時の対応の事前の決定が、公式発信の運用です。
      - 公式の発信を担当者の自由に任せると、企業としての統制が取れません。
      - 便乗した発信は、不適切な表現で批判を受ける危険が高く、反応の増加と引き換えにできません。
      - 問題の放置は、誤った情報の拡散と批判の拡大を招きます。
    know: 公式発信の要点は、「速さ」より「確認の手順」と「問題時の動き方を先に決めておくこと」。炎上は、初動の遅れで大きくなります。
    terms: [ソーシャルメディア, 公式アカウント]
    verify:
      manual: 企業の公式アカウントの運用では、発信の前に内容を確認する担当と手順を定め、誤りや問題が見つかった場合の訂正と謝罪の対応もあらかじめ決めておくことが適切であることを、自由な発信・便乗・放置との比較から確認した。
  - id: A21-516
    topic: 21-4-2-1
    diff: 3
    scope: 21-4-2-1 民生機器の特徴と動向。ネットワークにつながる家電の、ソフトウェアの更新への対応の判断
    prereq: 民生機器もソフトウェアで制御されており、脆弱性の修正などの更新が提供されること、利用者が専門知識を持たない前提で、更新の仕組みが分かりやすく安全である必要があること
    hard: 「家電は買ったまま使い続けるもの」という前提と、つながる機器の更新の必要性を切り分ける必要がある。
    q: |
      ネットワークに接続するエアコンや冷蔵庫などの民生機器について、セキュリティの観点からの留意点として、適切なものはどれか。
    c: ['脆弱性の修正などのために、ソフトウェアの更新が提供される仕組みがあり、利用者が更新を適用できるようにする', '民生機器は、購入時のソフトウェアのままで使い続けることが前提である', '家電は情報システムではないので、脆弱性とは無関係である', '更新は販売店の担当者でなければ、一切行えないようにする']
    a: ア
    exp: |
      ネットワークにつながる民生機器は、ソフトウェアで制御される情報機器でもあり、脆弱性が見つかれば修正の更新が必要です。利用者は専門家ではないため、更新が提供される仕組みと、利用者が迷わず適用できる進め方が求められます。購入時のまま使い続ける前提では、既知の脆弱性が残り続けます。
    why:
      - 正解です。更新の提供と、利用者が適用できる仕組みが、つながる家電の前提です。
      - 購入時のままでは、見つかった脆弱性が放置されます。
      - ネットワークにつながる機器は、脆弱性の影響を受ける対象です。
      - 販売店でなければ更新できないのでは、修正の適用が大幅に遅れます。
    know: 民生機器の要点は、「家電も、つながれば情報機器」。専門知識のない利用者でも更新できる仕組みが、設計の前提になる。
    terms: [民生機器, 脆弱性]
    verify:
