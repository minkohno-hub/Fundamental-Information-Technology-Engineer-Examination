category: '16'
reviewed: { at: '2026-10-21', method: '作成後の逐問レビュー（システム監査基準・システム管理基準（令和5年改訂）、財務報告に係る内部統制の基準、JIS Q 38500 の内容とシラバスVer.9.2の用語例と照合）' }
questions:
  - id: A16-001
    topic: 16-1-2-1
    diff: 1
    q: システム監査の目的として，適切なものはどれか。
    c:
      - 専門性と客観性を備えた監査人が，一定の基準に基づいて IT システムの利活用を検証・評価し，その適切性について保証を与える，又は改善のための助言を行う。
      - 監査人が情報システムの不備を発見し，監査人自らがプログラムを修正して不備を解消する。
      - 企業の財務諸表が，一般に公正妥当と認められる会計の基準に従って適正に表示されているかについて意見を表明する。
      - 情報システムに関する法令違反を行った担当者を特定し，処分を決定する。
    a: ア
    exp: |
      システム監査基準では、システム監査を「専門性と客観性を備えた監査人が、一定の基準に基づいて IT システムの利活用に係る検証・評価を行い、監査結果の利用者にこれらのガバナンス、マネジメント、コントロールの適切性等に対する保証を与える、又は改善のための助言を行う監査の一類型」としています。不備の改善は監査対象の組織が行うもので、監査人が自ら行うものではありません。
    why:
      - 正解です。検証・評価を行い、保証又は助言を行います。
      - 改善の実施は被監査部門の責任です。監査人が自ら修正すると、自分の作業を監査することになり独立性も損なわれます。
      - これは公認会計士などが行う財務諸表の監査（会計監査）の目的です。
      - 担当者の処分の決定は経営者や人事部門の役割で、システム監査の目的ではありません。
    terms: [システム監査, 監査人の独立性, 内部監査]

  - id: A16-002
    topic: [16-1-9, 16-1-2-1]
    diff: 2
    q: システム監査人の「外観上の独立性」が損なわれるおそれがあるものはどれか。
    c:
      - 監査対象となる販売管理システムの開発プロジェクトに，要件定義から参加していた者が，そのシステムの監査を担当する。
      - 監査の専門的な論点について，社外の専門家に意見を求めて参考にする。
      - 予備調査で，監査対象部門から業務手順書などの資料の提供を受ける。
      - 本調査で，監査対象部門の担当者に業務の実施状況についてインタビューする。
    a: ア
    exp: |
      システム監査基準では、システム監査人は監査対象の領域又は活動から独立していなければならず、これを外観上の独立性と精神上の独立性に分けています。
      - 外観上の独立性：監査対象と身分上・組織上の関係や利害関係がなく、第三者から見て独立していること
      - 精神上の独立性：監査の判断を公正かつ客観的に行う精神的な態度を保つこと
      自分が開発に関わったシステムを監査すると、自己の作業を評価することになり、外観上の独立性が損なわれます。
    why:
      - 正解です。開発に関与した者が監査すると、外観上の独立性が損なわれます。
      - 外部の専門家の意見を参考にすることは監査の品質を高めるもので、独立性を損なうものではありません。
      - 資料の提供を受けることは予備調査の通常の手続であり、独立性を損ないません。
      - インタビューは代表的な監査技法であり、独立性を損ないません。
    terms: [外観上の独立性, 精神上の独立性, 予備調査, システム監査基準]

  - id: A16-003
    topic: 16-1-9
    diff: 2
    q: システム監査基準とシステム管理基準の関係についての説明として，適切なものはどれか。
    c:
      - システム監査基準はシステム監査人の行為規範であり，システム管理基準は組織体が IT ガバナンスや IT マネジメントを実践するための規範で，監査上の判断尺度として利用される。
      - システム管理基準はシステム監査人の行為規範であり，システム監査基準は組織体の情報システムの管理の規範である。
      - システム監査基準もシステム管理基準も，情報セキュリティ監査だけに用いる基準である。
      - システム監査基準とシステム管理基準は法律であり，すべての企業に遵守と監査の実施が義務付けられている。
    a: ア
    exp: |
      経済産業省が公表している2つの基準は役割が異なります。
      - システム監査基準：システム監査人がシステム監査を実施するときの行為規範（監査人の倫理、独立性、監査計画、監査の実施、報告など）
      - システム管理基準：組織体が IT ガバナンスや IT マネジメントを実践するための規範（あるべき姿）。システム監査では、監査上の判断尺度として利用される
      どちらも法令ではなく、任意監査などで利用されるガイドラインです。
    why:
      - 正解です。監査基準は監査人の行為規範、管理基準は判断尺度です。
      - 2つの基準の役割が逆になっています。
      - 情報セキュリティ監査には、情報セキュリティ監査基準や情報セキュリティ管理基準を用います。
      - 2つの基準は法律ではなくガイドラインであり、システム監査の実施が義務付けられているわけではありません。
    terms: [システム監査基準, システム管理基準, 情報セキュリティ監査, ITガバナンス]

  - id: A16-004
    topic: 16-1-1
    diff: 1
    q: 監査の分類のうち，法定監査に該当するものはどれか。
    c:
      - 会社法や金融商品取引法に基づいて，公認会計士又は監査法人が行う財務諸表の監査
      - 経営者の指示で，社内の監査部門が行う情報システムの監査
      - 取引先からの要請を受けて，外部の監査人に依頼して行う情報セキュリティ監査
      - 経営者の依頼で，外部のコンサルタントが行う業務プロセスの監査
    a: ア
    exp: |
      法律によって実施が義務付けられている監査を法定監査、組織が自らの判断で実施する監査を任意監査といいます。会社法や金融商品取引法に基づく会計監査は法定監査です。システム監査や情報セキュリティ監査は、一般に任意監査として実施されます。また、組織の内部の者が行う監査を内部監査、外部の独立した者が行う監査を外部監査といいます。
    why:
      - 正解です。法律に基づく会計監査は法定監査です。
      - 社内の監査部門による監査は内部監査で、通常は任意監査です。
      - 外部の監査人が行う外部監査ですが、取引先の要請によるもので法律に基づく義務ではないため任意監査です。
      - 外部の者が行う監査ですが、経営者の判断で行う任意監査です。
    terms: [法定監査, 任意監査, 内部監査, 外部監査, 情報セキュリティ監査]

  - id: A16-005
    topic: 16-1-4
    diff: 2
    q: システム監査の計画のうち，個別監査計画に記載する内容として，最も適切なものはどれか。
    c:
      - 個々の監査の目的，監査対象，監査手続，実施時期，担当する監査人
      - 複数年度にわたる監査の基本方針と，重点的に監査する領域
      - その年度に実施する監査の対象，概略の日程，必要な要員と予算
      - 監査の結果として発見した指摘事項と，それに対する改善提案
    a: ア
    exp: |
      システム監査の計画は、通常、次の3つの階層で策定します。
      - 中長期計画：複数年度にわたる監査の方針や重点領域を定める
      - 年度計画：その年度に実施する監査の対象、時期、要員、予算などを定める
      - 個別監査計画：個々の監査について、目的、対象、手続、日程、担当者などを具体的に定める
      いずれも、リスクの大きさに応じて重点を置くリスクアプローチの考え方で策定します。
    why:
      - 正解です。個々の監査の具体的な実施内容を定めます。
      - 複数年度にわたる基本方針と重点領域は中長期計画に記載します。
      - 年度の監査対象、日程、要員、予算は年度計画に記載します。
      - 指摘事項と改善提案は、監査の結果として監査報告書に記載します。
    terms: [システム監査計画, リスクアプローチ, システム監査報告書]

  - id: A16-006
    topic: [16-1-2-2, 16-1-4]
    diff: 2
    q: システム監査におけるリスクアプローチの説明として，適切なものはどれか。
    c:
      - リスクの評価に基づいて，重大な不備につながるリスクが大きい領域に監査の資源を重点的に配分し，監査を効率的かつ効果的に行う。
      - すべての監査対象に同じ量の監査手続を適用し，監査の網羅性を確保する。
      - 監査対象部門が自らリスクを評価した結果を，そのまま監査の結論とする。
      - 監査人が負うリスクを避けるため，リスクの高い領域は監査の対象から除外する。
    a: ア
    exp: |
      リスクアプローチは、監査対象のリスクを評価し、重大な不備や誤りにつながるリスクが大きい領域に監査の時間や人員を重点的に割り当てる考え方です。限られた監査資源で、監査の目的を効果的かつ効率的に達成できます。監査計画の策定や監査手続の選択の段階で適用します。
    why:
      - 正解です。リスクの大きい領域に監査資源を重点的に配分します。
      - 一律に同じ量の手続を適用すると、重要な領域の監査が不十分になるおそれがあり、リスクアプローチとは逆の考え方です。
      - 監査対象部門の自己評価は参考にできますが、監査人は自ら証拠を入手して結論を出す必要があります。
      - リスクの高い領域こそ重点的に監査する必要があり、除外するのは不適切です。
    terms: [リスクアプローチ, システム監査計画, CSA]

  - id: A16-007
    topic: 16-1-5
    diff: 2
    q: システム監査の予備調査の説明として，適切なものはどれか。
    c:
      - 本調査に先立って，資料の閲覧や関係者へのヒアリングなどで監査対象の実態を把握し，監査の要点を明確にして監査手続を具体化する。
      - 監査手続を適用して，監査の結論を裏付けるための十分かつ適切な監査証拠を入手する。
      - 指摘事項に対する改善計画の実施状況を確認する。
      - 監査の結論を監査報告書にまとめて，監査の依頼者に報告する。
    a: ア
    exp: |
      システム監査は、監査計画 → 予備調査 → 本調査 → 評価・結論 → 報告 → フォローアップの流れで行います。予備調査では、監査対象の業務やシステムの概要を、文書の閲覧や関係者へのヒアリングなどで把握し、監査の要点（重点的に確かめる点）を明らかにして、本調査で適用する監査手続を具体的に決めます。
    why:
      - 正解です。監査対象の実態を把握して監査手続を具体化します。
      - 監査証拠を入手するのは本調査です。
      - 改善計画の実施状況の確認はフォローアップです。
      - 監査報告書による報告は、評価・結論の後の報告の段階です。
    terms: [予備調査, 本調査, 監査証拠, フォローアップ, システム監査報告書]

  - id: A16-008
    topic: [16-1-5, 16-1-2-2]
    diff: 2
    q: システム監査人が監査の結論（監査意見）を形成するときに，その根拠とすべきものはどれか。
    c:
      - 監査手続を実施して入手した，十分かつ適切な監査証拠
      - 監査対象部門の責任者から受けた口頭による説明だけ
      - 過去の監査経験に基づく監査人の推測
      - 監査を依頼した経営者の意向
    a: ア
    exp: |
      システム監査人は、監査手続を適用して十分かつ適切な監査証拠を入手し、その評価に基づいて監査の結論を形成します。「十分」は証拠の量、「適切」は証拠の質（監査の目的との関連性や信頼性）を表します。監査証拠と、それを入手した過程は監査調書に記録します。
    why:
      - 正解です。十分かつ適切な監査証拠に基づいて結論を形成します。
      - 口頭の説明だけでは裏付けが不十分です。文書や記録の確認などで裏付ける必要があります。
      - 推測は証拠ではありません。結論は入手した証拠に基づいて形成します。
      - 依頼者の意向に従って結論を変えると、監査の客観性が損なわれます。
    terms: [監査証拠, 監査手続, 監査調書]

  - id: A16-009
    topic: [16-1-5, 16-1-2-2]
    diff: 2
    q: 監査調書の説明として，適切なものはどれか。
    c:
      - 監査人が実施した監査手続，入手した監査証拠，結論に至った過程などを記録したもので，監査の結論の根拠となるため，適切に保管する。
      - 監査の結論，指摘事項，改善提案をまとめて，監査の依頼者に提出する文書である。
      - 監査の対象，日程，担当者などを，監査の実施前に定めた文書である。
      - 監査対象部門が，指摘事項に対する改善の内容と日程をまとめた文書である。
    a: ア
    exp: |
      監査調書は、システム監査人が実施した監査手続の内容、入手した監査証拠、その評価と結論に至った過程などを記録した文書です。監査の結論を裏付ける根拠となるため、体系的に整理して、一定期間安全に保管する必要があります。監査の品質を確認する資料や、次回以降の監査の参考資料にもなります。
    why:
      - 正解です。監査手続と監査証拠を記録した、結論の根拠となる文書です。
      - これはシステム監査報告書の説明です。
      - これは個別監査計画書の説明です。
      - これは被監査部門が作成する改善計画書の説明です。
    terms: [監査調書, 監査手続, 監査証拠, システム監査報告書, システム監査計画]

  - id: A16-010
    topic: 16-1-5
    diff: 2
    q: システム監査技法のうち，チェックリスト法の説明として，適切なものはどれか。
    c:
      - 監査人があらかじめ作成した質問書に対して，監査対象部門に回答を求める。
      - 監査人が，監査対象の業務に関係する文書や記録を閲覧して，その内容を確かめる。
      - 監査人が，監査対象部門の関係者に直接質問して回答を得る。
      - 監査人が，監査対象の現場に出向いて，業務の実施状況を直接観察する。
    a: ア
    exp: |
      代表的なシステム監査技法には次のようなものがあります。
      - チェックリスト法：監査人が作成した質問書（チェックリスト）に監査対象部門が回答する
      - ドキュメントレビュー法：文書や記録を閲覧して内容を確かめる
      - インタビュー法：関係者に直接質問して回答を得る
      - 現地調査法：現場に出向き、業務の状況を直接観察・調査する
      - ウォークスルー法：記録などをもとに、データの生成から出力までの処理の流れを追跡する
      - 突合・照合法：関連する記録同士を突き合わせて一致を確かめる
    why:
      - 正解です。質問書に回答を求めるのがチェックリスト法です。
      - 文書や記録を閲覧するのはドキュメントレビュー法です。
      - 関係者に直接質問するのはインタビュー法です。
      - 現場に出向いて観察するのは現地調査法です。
    terms: [チェックリスト法, ドキュメントレビュー法, インタビュー法, 現地調査法, システム監査技法]

  - id: A16-011
    topic: 16-1-5
    diff: 3
    q: 稼働中のシステムに監査用の架空の口座などを設け，本番のデータと一緒に監査用のテストデータを処理させて，その処理結果を検証するシステム監査技法はどれか。
    c: ['ITF法', 'テストデータ法', 'スナップショット法', '並行シミュレーション法']
    a: ア
    exp: |
      ITF（Integrated Test Facility）法は、稼働中のシステムに監査用の架空の口座（ダミーのファイルやレコード）を設け、本番のトランザクションと一緒に監査用のデータを処理させて、その結果を確かめる技法です。本番の環境でプログラムの処理の正確性を検証できます。
    why:
      - 正解です。本番の環境で架空口座を使って検証するのは ITF 法です。
      - テストデータ法は、監査人が用意したテストデータを監査対象のプログラムで処理させ、予想した結果と比較する技法です。本番データと一緒に処理するものではありません。
      - スナップショット法は、プログラムの特定の箇所に監査用のモジュールを組み込み、処理途中のデータを抽出して検証する技法です。
      - 並行シミュレーション法は、監査人が監査対象と同じ機能のプログラムを用意し、同じデータを処理させて結果を比較する技法です。
    terms: [ITF法, テストデータ法, スナップショット法, 並行シミュレーション法, CAAT]

  - id: A16-012
    topic: 16-1-5
    diff: 3
    q: システム監査技法のうち，スナップショット法の説明として，適切なものはどれか。
    c:
      - プログラムの特定の箇所に監査用のモジュールを組み込んでおき，処理の途中のデータを抽出・記録して，処理の正確性を検証する。
      - 監査人が作成したテストデータを監査対象のプログラムで処理させ，あらかじめ想定した結果と比較する。
      - 監査人が監査対象と同じ機能をもつプログラムを用意し，本番と同じデータを処理させて，両者の結果を比較する。
      - システムに記録されたアクセスログなどを分析して，不正なアクセスや異常な処理がないかを確かめる。
    a: ア
    exp: |
      スナップショット法は、監査対象のプログラムの特定の処理点に監査用のモジュールを組み込み、処理の途中のデータの状態を写真のように記録（スナップショット）して、処理が正しく行われているかを確かめる技法です。いずれもコンピュータを利用して行う監査技法（CAAT）の一種です。
    why:
      - 正解です。処理途中のデータを抽出して検証するのがスナップショット法です。
      - これはテストデータ法の説明です。
      - これは並行シミュレーション法の説明です。
      - これはログ分析法の説明です。
    terms: [スナップショット法, テストデータ法, 並行シミュレーション法, CAAT]

  - id: A16-013
    topic: 16-1-5
    diff: 2
    q: システム監査で用いる CAAT の説明として，適切なものはどれか。
    c:
      - 監査人がコンピュータを利用して監査手続を実施する技法の総称で，データの抽出・分析やテストデータ法などが含まれる。
      - 監査対象部門が，自部門の内部統制の有効性を自ら評価する手法である。
      - 監査人が，監査対象部門の責任者と面談して，業務の課題を聞き取る手法である。
      - 監査報告書の作成を自動化するための文書作成ソフトウェアである。
    a: ア
    exp: |
      CAAT（Computer Assisted Audit Techniques：コンピュータ支援監査技法）は、監査人がコンピュータやソフトウェアを利用して監査手続を実施する技法の総称です。大量のデータからの条件に合うデータの抽出や分析、テストデータ法、ITF 法、スナップショット法、並行シミュレーション法などが含まれます。手作業では困難な大量のデータの全件検査なども可能になります。
    why:
      - 正解です。コンピュータを利用して監査手続を行う技法の総称です。
      - これは CSA（統制自己評価）の説明です。
      - これはインタビュー法の説明で、コンピュータを利用する技法ではありません。
      - CAAT は監査手続を実施する技法で、報告書を作成するソフトウェアではありません。
    terms: [CAAT, CSA, インタビュー法, テストデータ法]

  - id: A16-014
    topic: 16-1-6
    diff: 2
    q: システム監査におけるフォローアップの説明として，適切なものはどれか。
    c:
      - 監査報告書で指摘した事項について，監査対象部門が改善計画に沿って改善を実施しているかを，監査人が確認し評価する。
      - 監査人が自ら改善策を実施し，指摘した不備を解消する。
      - 監査報告書を提出する前に，指摘事項を監査対象部門に伝えて改善させ，報告書から削除する。
      - 監査対象部門の同意が得られた事項だけを指摘事項として監査報告書に記載する。
    a: ア
    exp: |
      フォローアップは、監査報告書で示した指摘事項や改善提案に対して、監査対象部門が策定した改善計画が適切に実施されているかを、システム監査人が確認・評価する活動です。改善を実施する責任は監査対象部門（及び経営者）にあり、監査人自身が改善を行うことはありません。
    why:
      - 正解です。監査人は改善の実施状況を確認・評価します。
      - 改善の実施は監査対象部門の責任です。監査人が改善を行うと独立性が損なわれます。
      - 監査で発見した事項は、監査の結論として報告書に記載すべきもので、削除するのは不適切です。
      - 指摘事項は監査証拠に基づいて監査人が判断するもので、監査対象部門の同意を条件とするものではありません。
    terms: [フォローアップ, システム監査報告書, 監査人の独立性]

  - id: A16-015
    topic: 16-2-1
    diff: 2
    q: 日本の「財務報告に係る内部統制の評価及び監査の基準」に示された内部統制の基本的要素のうち，米国の COSO フレームワークの構成要素には含まれていないものはどれか。
    c: ['IT（情報技術）への対応', '統制環境', '統制活動', '情報と伝達']
    a: ア
    exp: |
      COSO フレームワークでは、内部統制の構成要素を統制環境、リスク評価、統制活動、情報と伝達、モニタリング活動の5つとしています。日本の基準では、これに「IT（情報技術）への対応」を加えた6つを基本的要素としています。
      日本の基準の6つの基本的要素：統制環境、リスクの評価と対応、統制活動、情報と伝達、モニタリング（監視活動）、IT（情報技術）への対応
    why:
      - 正解です。IT への対応は日本の基準で追加された要素です。
      - 統制環境は COSO の構成要素にも含まれ、ほかの要素の基礎となるものです。
      - 統制活動は COSO の構成要素にも含まれます。
      - 情報と伝達は COSO の構成要素にも含まれます。
    terms: [内部統制, COSO, ITへの対応, 統制環境]

  - id: A16-016
    topic: 16-2-1
    diff: 2
    q: 内部統制における職務分掌の考え方に沿った対応として，適切なものはどれか。
    c:
      - 物品の発注を行う担当者と，納品された物品の検収を行う担当者を別の者にする。
      - 業務を効率化するため，取引の承認と記帳を同じ担当者がまとめて行う。
      - 開発の担当者に，本番環境のプログラムを直接変更できる権限を与える。
      - 担当者の不在時に備えて，全員に全業務の承認権限を与える。
    a: ア
    exp: |
      職務分掌は、業務の担当と権限・責任を明確にし、一つの業務の重要な部分（承認・実行・記録・保管など）を異なる担当者に分けて、相互にけん制させる仕組みです。一人の担当者が不正や誤りを行っても、ほかの担当者によって発見されやすくなります。システムの開発担当者と運用担当者を分けることも、職務分掌の例です。
    why:
      - 正解です。発注と検収を分けて相互にけん制させます。
      - 承認と記帳を同じ者が行うと、誤りや不正を発見しにくくなります。
      - 開発担当者が本番環境を直接変更できると、承認されていない変更や不正な変更を防げません。
      - 全員に承認権限を与えると、権限と責任の分離ができなくなります。
    terms: [職務分掌, 内部統制]

  - id: A16-017
    topic: 16-2-1
    diff: 3
    q: IT に係る全般統制に該当するものはどれか。
    c:
      - システムの開発・変更の手続や，本番環境へのアクセス権限を管理する仕組み
      - 受注データの入力時に，数量や単価が有効な範囲にあるかを検査する仕組み
      - 取引先のマスタデータを登録・変更するときに，責任者が承認する仕組み
      - 入力データのエラーを検出したときに，修正して再入力させる仕組み
    a: ア
    exp: |
      IT に係る統制は2つに分けられます。
      - 全般統制：業務処理統制が有効に機能する環境を保証するための統制。システムの開発・保守の管理、システムの運用管理、アクセス管理などのセキュリティ確保、外部委託の管理など
      - 業務処理統制：個々の業務プロセスに組み込まれた統制。入力情報の完全性・正確性の確保、エラーデータの修正と再処理、マスタデータの維持管理、システムの利用に関する認証・操作範囲の限定など
    why:
      - 正解です。開発・変更管理やアクセス管理は全般統制です。
      - 入力データの範囲の検査は、業務処理に組み込まれた業務処理統制です。
      - マスタデータの維持管理は業務処理統制の例です。
      - エラーデータの修正と再処理は業務処理統制の例です。
    terms: [IT全般統制, 業務処理統制, 内部統制]

  - id: A16-018
    topic: 16-2-2
    diff: 2
    q: JIS Q 38500（IT ガバナンス）で，組織の統治機関（経営陣）が IT について行うべき主要なタスクとして示されている3つの組合せはどれか。
    c:
      - 評価，指示，モニタ
      - 計画，実行，改善
      - 識別，防御，検知
      - 企画，開発，運用
    a: ア
    exp: |
      JIS Q 38500 は、組織の統治機関が IT の利用を統治するための原則と、統治機関が行うべきタスクを示した規格です。統治機関は、IT の現在と将来の利用を評価し（Evaluate）、計画と方針の作成・実施を指示し（Direct）、方針に沿った実施とパフォーマンスをモニタする（Monitor）とされ、EDM モデルと呼ばれます。
    why:
      - 正解です。評価・指示・モニタの3つのタスクです。
      - 計画・実行・改善は PDCA サイクルなどの管理の流れに近いもので、JIS Q 38500 のタスクではありません。
      - 識別・防御・検知は、NIST のサイバーセキュリティフレームワークの機能の一部です。
      - 企画・開発・運用は、情報システムのライフサイクルの段階を表すものです。
    terms: [ITガバナンス, JIS Q 38500]

  - id: A16-019
    topic: 16-1-8
    diff: 2
    q: 経済産業省が公表している基準を用いて情報セキュリティ監査を行うとき，監査人が監査上の判断の尺度として用いるものはどれか。
    c: ['情報セキュリティ管理基準', '情報セキュリティ監査基準', 'システム監査基準', 'JIS Q 20000-1']
    a: ア
    exp: |
      情報セキュリティ監査では、監査人の行為規範として情報セキュリティ監査基準を、監査上の判断の尺度として情報セキュリティ管理基準を用います。情報セキュリティ管理基準は、JIS Q 27001 や JIS Q 27002 を基に、組織が情報セキュリティマネジメントを実践するための管理項目を示したものです。
    why:
      - 正解です。判断の尺度は情報セキュリティ管理基準です。
      - 情報セキュリティ監査基準は、監査人の行為規範（監査の実施の方法など）を定めた基準です。
      - システム監査基準は、システム監査を行う監査人の行為規範です。
      - JIS Q 20000-1 は、サービスマネジメントシステムの要求事項を定めた規格です。
    terms: [情報セキュリティ監査, 情報セキュリティ管理基準, システム監査基準, JIS Q 20000]

  - id: A16-020
    topic: 16-2-3
    diff: 2
    q: 内部統制や法令遵守の評価に用いられる CSA（統制自己評価）の説明として，適切なものはどれか。
    c:
      - 業務を担当する部門の管理者や担当者が，自らの業務のリスクと統制の有効性を評価する手法
      - 独立した外部の監査人が，財務諸表の適正性について意見を表明する手法
      - 監査人がコンピュータを利用して，大量のデータを抽出・分析する手法
      - 経営者が，監査部門の監査計画を承認する手続
    a: ア
    exp: |
      CSA（Control Self Assessment：統制自己評価）は、業務を実際に担当している部門の管理者や担当者が、ワークショップや質問書などを使って、自らの業務のリスクや内部統制の有効性を評価する手法です。現場の当事者が評価するため、統制への意識が高まり、問題点を早期に発見しやすくなります。内部監査部門は、その結果を監査の参考にすることがあります。
    why:
      - 正解です。業務の当事者が自ら統制を評価する手法です。
      - これは外部監査人による財務諸表の監査（会計監査）の説明です。
      - これは CAAT（コンピュータ支援監査技法）の説明です。
      - 監査計画の承認は経営者の役割ですが、CSA ではありません。
    terms: [CSA, 内部統制, CAAT]
