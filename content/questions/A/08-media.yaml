  method: 作成後の逐問レビュー（形式・規格の特徴を一般的な技術資料の記述と照合、計算は検算式で独立に再計算）
questions:
  - id: A08-001
    topic: 8-1-1
    diff: 1
    q: 動画や音声のデータを受信しながら，受信が完了するのを待たずに順次再生する方式はどれか。
    c:
      - エンコード
      - ダウンロード
      - オーサリング
      - ストリーミング
    a: エ
    exp: |
      ストリーミングは、データを受信しながら同時に再生する方式です。ファイル全体を受信し終える前に再生を始められるため、待ち時間が短く、端末にファイルを保存しなくても視聴できます。動画配信サービスやライブ配信で使われています。
    why:
      - エンコードは、データを特定の形式に符号化（圧縮など）することです。
      - ダウンロードは、ファイル全体を受信して保存する方式です。再生は受信完了後になります。
      - オーサリングは、文字・画像・音声・動画などの素材を組み合わせてコンテンツを作成することです。
      - 正解です。受信しながら再生するのがストリーミングです。
    terms:
      - ストリーミング
  - id: A08-002
    topic: 8-1-2
    diff: 2
    q: MIDI の説明として，適切なものはどれか。
    c:
      - 人間の聴覚の特性を利用して，聞こえにくい音を削って圧縮する形式である。
      - 音声の波形を標本化・量子化して，圧縮せずに記録する形式である。
      - 音の高さ・長さ・強さ・楽器の種類などの演奏情報を記録する規格で，音そのものの波形は記録しない。
      - 映像と音声をまとめて記録する形式である。
    a: ウ
    exp: |
      MIDI（Musical Instrument Digital Interface）は、電子楽器どうしやコンピュータとの間で演奏情報をやり取りするための規格です。「どの楽器で、どの高さの音を、どの強さで、いつ鳴らすか」といった情報を記録し、音の波形そのものは記録しないため、データ量が非常に小さくなります。再生する機器の音源によって音色が変わります。
    why:
      - これは MP3 などの非可逆圧縮の音声形式の説明です。
      - これは WAV などの非圧縮の音声形式の説明です。
      - 正解です。演奏情報を記録する規格です。
      - これは MP4 や AVI などの動画のコンテナフォーマットの説明です。
    terms:
      - MIDI
      - MP3
  - id: A08-003
    topic: 8-1-3
    diff: 1
    q: 静止画の形式のうち，フルカラーの写真の保存に適した，非可逆圧縮の形式はどれか。
    c:
      - JPEG
      - PNG
      - GIF
      - BMP
    a: ア
    exp: |
      JPEG は、人の目に目立ちにくい情報を削って高い圧縮率を実現する非可逆圧縮の画像形式で、フルカラー（約1,677万色）を扱えるため写真に適しています。圧縮率を高くするほど画質は劣化します。デジタルカメラでは、撮影日時などの情報を Exif 形式で画像に付け加えて保存します。
    why:
      - 正解です。JPEG は写真向けの非可逆圧縮形式です。
      - PNG はフルカラーも扱える可逆圧縮の形式で、透過の指定もできます。写真にも使えますが、非可逆圧縮ではありません。
      - GIF は使える色が 256 色までで、可逆圧縮の形式です。イラストや簡単なアニメーションに使われます。
      - BMP は基本的に圧縮しない形式で、データ量が大きくなります。
    terms:
      - JPEG
      - 可逆圧縮
  - id: A08-004
    topic: 8-1-3
    diff: 2
    q: ベクターデータ（ベクタ形式の画像）の特徴として，適切なものはどれか。
    c:
      - 写真のような色の微妙な変化を表すのに最も適している。
      - 画像を細かな点（画素）の集まりとして表すので，拡大すると輪郭がギザギザになる。
      - デジタルカメラで撮影した画像は，必ずベクターデータになる。
      - 図形を点の座標や線・曲線の式で表すので，拡大・縮小しても輪郭が粗くならない。
    a: エ
    exp: |
      ベクターデータは、図形を始点・終点の座標や曲線の式、塗りの色などの情報で表す形式です。表示するたびに計算して描くため、拡大・縮小しても輪郭が滑らかなままで、ロゴや図面に向いています。SVG がその代表的な形式です。
    why:
      - 写真のような複雑な色の変化は、ラスターデータの方が適しています。
      - これはラスターデータ（ビットマップデータ）の特徴です。
      - デジタルカメラの画像はラスターデータです。
      - 正解です。拡大しても画質が劣化しないのがベクターデータの特徴です。
    terms:
      - ベクターデータ
      - SVG
  - id: A08-005
    topic: 8-1-4
    diff: 2
    q: 動画の圧縮符号化方式 H.265（HEVC）の特徴として，適切なものはどれか。
    c:
      - 圧縮を行わずに映像を記録するための規格である。
      - 静止画を可逆圧縮するための規格である。
      - H.264 の後継の規格で，同程度の画質を H.264 のおよそ半分のデータ量で実現でき，4K/8K 映像の配信などに使われる。
      - 音声だけを圧縮するための規格である。
    a: ウ
    exp: |
      H.265（HEVC：High Efficiency Video Coding）は、H.264（MPEG-4 AVC）の後継となる動画の圧縮符号化方式です。圧縮効率が高く、同程度の画質を約半分のデータ量で実現できるため、4K/8K 放送や高解像度の動画配信に使われています。
    why:
      - H.265 は圧縮符号化の規格です。
      - 静止画の可逆圧縮には PNG などが使われます。
      - 正解です。H.264 より高効率な動画圧縮方式です。
      - H.265 は動画（映像）の圧縮方式です。音声には AAC などを組み合わせます。
    terms:
      - MPEG
  - id: A08-006
    topic: 8-1-5
    diff: 2
    q: 可逆圧縮の説明として，適切なものはどれか。
    c:
      - 人間が知覚しにくい情報を削るので，元のデータと完全には同じに戻せない。
      - 圧縮したデータを伸長すると，元のデータと完全に同じデータに戻せる圧縮方式で，ZIP などが該当する。
      - 圧縮率が常に非可逆圧縮よりも高い。
      - データを暗号化して，第三者が読めないようにする方式である。
    a: イ
    exp: |
      可逆圧縮は、圧縮したデータを伸長（解凍）すると元のデータと1ビットも違わずに戻せる方式です。プログラムや文書など、少しでも変わると困るデータに使われます。ZIP、PNG、GIF などが該当します。一方、JPEG や MP3、MPEG などの非可逆圧縮は、一部の情報を削る代わりに高い圧縮率を実現します。
    why:
      - これは非可逆圧縮の説明です。
      - 正解です。完全に元に戻せるのが可逆圧縮です。
      - 一般に非可逆圧縮の方が圧縮率を高くできます。
      - 暗号化は圧縮とは目的の異なる技術です。
    know: ファクシミリの画像の圧縮には、MH・MR・MMR などの可逆圧縮方式が使われます。
    terms:
      - 可逆圧縮
  - id: A08-007
    topic: 8-1-5
    diff: 2
    q: 100M バイトのデータを圧縮したところ，25M バイトになった。圧縮率（圧縮後のデータ量÷圧縮前のデータ量）は何％か。
    c:
      - '75'
      - '400'
      - '4'
      - '25'
    a: エ
    exp: |
      圧縮率をこの問題の定義（圧縮後÷圧縮前）で計算すると、25÷100＝0.25 で 25％ です。値が小さいほどよく圧縮されていることを表します。
    why:
      - 75％ は削減できたデータ量の割合（1−0.25）です。
      - 400％ は圧縮前÷圧縮後で、比が逆です。
      - 4 は圧縮前÷圧縮後の倍率（4倍）を、百分率と取り違えた値です。
      - 正解です。25÷100＝25％ です。
    know: 圧縮率は「圧縮後÷圧縮前」で定義することが多いですが、資料によって定義が異なることがあるため、問題文の定義を確認しましょう。
    terms:
      - 可逆圧縮
    verify:
      value: 25 / 100 * 100
  - id: A08-008
    topic: 8-2-1-1
    diff: 1
    q: ディスプレイの表示などで用いられる，光の3原色を混ぜ合わせるほど明るくなる混色の方法はどれか。
    c:
      - 加法混色（RGB）
      - グレースケール化
      - ハーフトーン（網点）
      - 減法混色（CMY）
    a: ア
    exp: |
      光の3原色は赤（Red）・緑（Green）・青（Blue）で、重ねるほど明るくなり、3色を同じ強さで重ねると白になります。これを加法混色といい、ディスプレイやプロジェクターで使われます。
      一方、色の3原色であるシアン（Cyan）・マゼンタ（Magenta）・イエロー（Yellow）は、混ぜるほど暗くなる減法混色で、印刷に使われます（実際の印刷では黒（K）を加えた CMYK）。
    why:
      - 正解です。光の3原色の加法混色です。
      - グレースケール化は、カラー画像を白から黒までの濃淡だけの画像に変換する処理で、混色の方法ではありません。
      - ハーフトーン（網点）は、点の大きさや密度で濃淡を表す印刷の技法で、光の3原色の混色方法ではありません。
      - 減法混色は、混ぜるほど暗くなる混色で、印刷で使われます。
    terms:
      - 加法混色
  - id: A08-009
    topic: 8-2-1-2
    diff: 2
    q: 横 4 インチ，縦 3 インチの写真を 300dpi でスキャナで読み取ったときの画素数はどれか。
    c:
      - 1,080,000
      - 3,600
      - 360,000
      - '12'
    a: ア
    exp: |
      300dpi は1インチあたり 300 ドットです。横は 4×300＝1,200 画素、縦は 3×300＝900 画素なので、
      画素数は 1,200×900＝1,080,000 画素です。
    why:
      - 正解です。1,200×900＝1,080,000 画素です。
      - 3,600 は 300×12（縦横のインチ数の積）のように、一方向にだけ解像度を掛けた値です。
      - 360,000 は 1,200×300 のように、縦の解像度の計算を誤った値です。
      - 12 は面積（平方インチ）だけの値です。
    terms:
      - 解像度
    verify:
      value: (4*300) * (3*300)
  - id: A08-010
    topic: 8-2-1-3
    diff: 1
    q: グラフィックスソフトウェアの「レイヤー」機能の説明として，適切なものはどれか。
    c:
      - 画像のファイル形式を変換する。
      - 画像の明るさや色合いを自動で補正する。
      - 画像を透明なシートを重ねたような複数の層に分けて編集でき，ある層の変更が他の層に影響しない。
      - 画像の不要な部分を切り取って，必要な部分だけを残す。
    a: ウ
    exp: |
      レイヤーは、画像を透明なシートを重ねたような複数の層に分けて扱う機能です。背景、人物、文字などを別々の層に置けば、一部だけを動かしたり修正したりしても他の部分に影響しません。
    why:
      - これは形式変換の機能です。
      - これは色調補正の機能です。
      - 正解です。層に分けて独立に編集できる機能です。
      - これはトリミングの説明です。
    terms:
      - グラフィックスソフトウェア
  - id: A08-011
    topic: 8-2-2
    diff: 1
    q: AR（拡張現実）の説明として，適切なものはどれか。
    c:
      - コンピュータで作った仮想の世界に入り込んだような体験をさせる。
      - 物体を立体的に記録した光の干渉縞から，立体像を再生する。
      - 現実の風景にコンピュータで作った情報や映像を重ねて表示し，現実を拡張する。
      - 実際の人の動きをセンサーで計測して，CG のキャラクターに反映させる。
    a: ウ
    exp: |
      AR（Augmented Reality：拡張現実）は、カメラなどで捉えた現実の風景に、CG や文字などのデジタル情報を重ねて表示する技術です。スマートフォンをかざすと家具の配置イメージが表示されるアプリなどがあります。
    why:
      - これは VR（仮想現実）の説明です。現実の視界を遮って仮想空間を体験させます。
      - これはホログラムの説明です。
      - 正解です。現実に情報を重ねるのが AR です。
      - これはモーションキャプチャの説明です。
    know: MR（複合現実）は、現実空間と仮想の物体を融合させ、仮想の物体に触れて操作するなどの相互作用ができる技術です。
    terms:
      - AR
      - VR
  - id: A08-012
    topic: 8-2-2
    diff: 2
    q: メタバースの説明として，適切なものはどれか。
    c:
      - 現実の機器の状態をセンサーで取得し，仮想空間に再現してシミュレーションする。
      - 電子データに改ざんできない形で取引の記録を残す仕組みである。
      - インターネット上に構築された3次元の仮想空間で，利用者はアバターを使って他の利用者と交流したり経済活動を行ったりできる。
      - 映像を見たいときに，見たい番組を選んで視聴できるサービスである。
    a: ウ
    exp: |
      メタバースは、インターネット上に作られた3次元の仮想空間で、利用者が自分の分身であるアバターを操作して、他の利用者との交流、イベントへの参加、仮想の商品の売買などを行えるサービスや空間のことです。
    why:
      - これはデジタルツインの説明です。
      - これはブロックチェーンの説明です。
      - 正解です。アバターで交流などを行う仮想空間がメタバースです。
      - これはビデオオンデマンド（VOD）の説明です。
    terms:
      - VR
  - id: A08-013
    topic: 8-1-1
    diff: 2
    q: 動画ファイルの形式で用いられる「コンテナフォーマット」の説明として，適切なものはどれか。
    c:
      - 画像を画素の集まりで表す形式である。
      - 映像データを圧縮する方式そのもので，H.264 などがある。
      - 文書を，どの環境でも同じレイアウトで表示できるようにする形式である。
      - 映像・音声・字幕などのデータをまとめて1つのファイルに格納するための形式で，MP4 などがある。
    a: エ
    exp: |
      コンテナフォーマットは、圧縮された映像・音声・字幕などの複数のデータを1つのファイルにまとめて格納するための入れ物（コンテナ）の形式です。MP4、MOV（QuickTime）、AVI などがあります。中に入れる映像や音声の圧縮方式（コーデック）は、H.264 や AAC など別に選びます。
    why:
      - これはラスターデータの説明です。
      - H.264 は映像の圧縮方式（コーデック）で、コンテナフォーマットとは別の概念です。
      - これは PDF の説明です。
      - 正解です。複数のデータをまとめる入れ物の形式です。
    terms:
      - MPEG
