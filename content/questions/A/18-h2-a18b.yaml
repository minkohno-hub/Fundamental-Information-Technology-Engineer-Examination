questions:
  - id: A18-509
    topic: 18-1-2
    diff: 3
    scope: 18-1-2 システム化計画の立案。導入費用と運用費用、削減の効果を 5 年間で合計し、投資の収支を評価する計算
    prereq: 投資の評価では、導入時の一時的な費用だけでなく、毎年の運用費用と効果を、評価の期間全体で合計して比べること
    hard: 一時的な費用と毎年の費用・効果を混同しやすい。期間全体の合計に直してから比べる必要がある。
    q: |
      新しいシステムの導入を計画している。導入の費用は 1,000 万円、運用の費用は年間 200 万円、業務の効率化による削減の効果は年間 450 万円と見積もられている。5 年間で評価すると、効果から費用を差し引いた収支は幾らか。
    c: ['250 万円', '450 万円', '1,250 万円', '50 万円']
    a: ア
    exp: |
      5 年間で合計すると、効果は 450 万円 × 5 年 ＝ 2,250 万円です。費用は、導入の 1,000 万円に、運用の 200 万円 × 5 年 ＝ 1,000 万円を加えた 2,000 万円です。収支は 2,250 万円 － 2,000 万円 ＝ 250 万円となります。投資の評価では、このように期間全体で費用と効果を合計して比べます。
    why:
      - 正解です。5 年間の効果 2,250 万円から、費用の合計 2,000 万円を引いた値です。
      - 1 年分の効果の金額そのものです。問われているのは、5 年間の収支です。
      - 効果の合計から導入の費用だけを引き、運用の費用を引いていない値です。
      - 5 年間の収支 250 万円を、5 年で割って 1 年平均に直した値です。問われているのは期間全体の収支です。
    know: 投資評価の計算は、「一時的な費用」と「毎年の費用・効果」を分けて、期間全体の合計に直すことが要点である。
    terms: [システム化計画, 費用対効果]
    verify:
      value: 250
  - id: A18-510
    topic: 18-2-2-2
    diff: 3
    scope: 18-2-2-2 要件の定義。機能要件と非機能要件の区別を、具体的な要件の文に適用する判断
    prereq: 機能要件はシステムが行う処理や機能の要件、非機能要件は性能・信頼性・使いやすさなど、機能以外の品質の要件であること
    hard: 「画面の応答時間」のような、機能に見えるが品質の要件であるものを、正しく非機能要件に切り分ける必要がある。
    q: |
      要件定義で集めた次の要件のうち、非機能要件に当たるものはどれか。
    c: ['照会画面の応答時間は、3 秒以内であること', '受注データから請求書を作成できること', '在庫の引当てを、受注の順に行うこと', '月末に、売上の一覧表を出力できること']
    a: ア
    exp: |
      応答時間は、処理の速さという品質についての要件であり、非機能要件です。非機能要件には、性能のほかに、信頼性、使いやすさ、セキュリティなどがあります。他の三つは、請求書の作成、在庫の引当て、一覧表の出力という、システムが行う処理そのものについての要件であり、機能要件です。要件を定義する際は、この二つを区別して漏れなく集めることが大切です。
    why:
      - 正解です。応答時間は性能の品質の要件であり、非機能要件です。
      - 請求書の作成は、システムが行う処理の要件であり、機能要件です。
      - 在庫の引当ての順序は、処理の進め方の要件であり、機能要件です。
      - 一覧表の出力は、システムが行う処理の要件であり、機能要件です。
    know: 機能要件は「何をするか」、非機能要件は「どの水準でするか」。応答時間や信頼性は、後者に当たる。
    terms: [機能要件, 非機能要件]
    verify:
      manual: 照会画面の応答時間を 3 秒以内とする要件が性能に関する非機能要件に当たることを、請求書作成・在庫引当て・一覧表出力という処理そのものの機能要件との区別から確認した。
  - id: A18-511
    topic: 18-2-2-3
    diff: 3
    scope: 18-2-2-3 要件定義の手法。利用者が言葉だけでは要件を固められない場合に、試作品で確認する進め方の判断
    prereq: プロトタイプ（試作品）を用いると、利用者は実際の操作のイメージを持って要件を確認でき、認識のずれを早い段階で見つけられること
    hard: 文書の確認だけを繰り返す進め方と、目に見える形で確認する手法の使い分けが必要である。
    q: |
      画面の操作の進め方について、利用者と開発側の認識が文書の確認だけではそろわず、要件定義が進まない。進め方の改善として、適切なものはどれか。
    c: ['画面の試作品（プロトタイプ）を用意し、利用者に操作してもらって、要件を確認する', '文書の分量を増やし、記述を詳細にして確認してもらう', '要件の確認は開発の後に回し、先に設計を進める', '利用者の代表者ではなく、開発側の判断で要件を決める']
    a: ア
    exp: |
      画面の操作のような、言葉だけではイメージしにくい要件は、試作品を実際に操作してもらうことで、利用者と開発側の認識をそろえることができます。これがプロトタイプを用いる手法です。認識のずれを要件定義の段階で見つけられるため、後の手戻りを防げます。文書を増やすだけでは、イメージのずれは解消されにくいものです。
    why:
      - 正解です。試作品による操作の体験が、認識のずれを解消します。
      - 文書を詳細にしても、操作のイメージのずれは埋まりにくく、確認のたびに新たな食い違いが見つかって、かえって手戻りが増えます。必要なのは、試作品で操作を体験してもらうことです。
      - 確認を後ろに回すと、認識のずれが設計以降の大きな手戻りになります。
      - 要件は利用者の業務のものであり、開発側の判断だけで決めるものではありません。
    know: 要件定義で認識がそろわない論点は、「言葉で説明する」から「試作品で体験してもらう」に切り替える。要件の確定は、開発の前に行う。
    terms: [プロトタイプ, 要件定義]
    verify:
      manual: 画面の操作について文書の確認だけでは利用者と開発側の認識がそろわない場合、画面のプロトタイプを用意して操作してもらって要件を確認する進め方が適切であることを、文書の詳細化・確認の後回し・開発側の決定との比較から確認した。
  - id: A18-512
    topic: 18-1-1
    diff: 4
    scope: 18-1-1 システム化構想の立案。受注と生産の計画を連携させ、部門ごとの最適化の弊害を避ける全体最適の判断
    prereq: 部門ごとの最適化だけを進めると、部門間の連携が取れず全体としては非効率になること、全体最適の視点で業務とシステムを構想すること
    hard: 各部門の改善策はいずれも一見正しく、その「つながりの欠如」こそが問題であることを読み取る必要がある。
    q: |
      営業部門は受注を増やすために納期の短い注文を受け、生産部門は効率のために大きなロットでまとめて生産し、在庫が増えている。両部門とも、自部門の目標は達成しているが、会社全体では在庫の費用と納期遅れが同時に増えている。システム化構想の立案における対応として、最も適切なものはどれか。
    c: ['受注の情報と生産の計画を連携させ、全体のバランスで判断できる仕組みを構想する', '営業部門の受注の管理を、より細かく行うシステムにする', '生産部門のロット計算を、より高速なシステムにする', '在庫の保管場所を増やして対応する']
    a: ア
    exp: |
      本件の問題は、各部門の進め方そのものではなく、部門の間がつながっていないことです。受注の情報と生産の計画を連携させ、会社全体のバランス（在庫と納期の両立）で判断できる仕組みを構想することが、全体最適の考え方です。各部門の処理を速くしたり細かくしたりしても、部門の間の問題は解けません。
    why:
      - 正解です。部門間の連携による、全体のバランスの仕組みです。
      - 営業部門の中だけの改善であり、生産とのつながりの問題は解けません。
      - 生産部門の中だけの効率化であり、受注とのつながりの問題は解けません。
      - 在庫の置き場の確保は、症状への対処であり、仕組みの改善ではありません。
    know: 全体最適の判断は、「問題は部門の中か、部門の間か」を見分けることから始まる。部門間の連携の欠如は、部門内の改善では解けない。
    terms: [全体最適, 部分最適]
    verify:
      manual: 営業と生産の各部門が自部門の目標を達成しながら会社全体で在庫費用と納期遅れが増えている事例では、受注情報と生産計画を連携させ全体のバランスで判断できる仕組みを構想する対応が最も適切であることを、各部門内の改善との比較から確認した。
  - id: A18-513
    topic: 18-2-2-4
    diff: 3
    scope: 18-2-2-4 利害関係者要件の確認。影響を受ける部門のうち、確認の対象から漏れやすい関係者の要件を拾う判断
    prereq: 要件の確認では、直接の利用者だけでなく、監査や法令の順守に関わる部門など、影響を受ける全ての利害関係者の要件を確認すること
    hard: 目立つ利用者の要件に目が向きがちであり、「記録の保存や証跡」を求める関係者の漏れを見つける必要がある。
    q: |
      新しい受注システムの要件定義で、営業部門と倉庫部門の要件は確認したが、稼働後に、経理部門から「監査のために、受注の変更の履歴を 7 年間保存してほしいという要件を聞かれていない」と指摘された。要件の確認の進め方として、適切なものはどれか。
    c: ['直接の利用部門だけでなく、記録や証跡に関わる部門を含め、利害関係者を洗い出して要件を確認する', '指摘を受けたので、変更履歴の保存だけを追加する', '要件の確認は、利用部門に限るのが原則である', '監査への対応は、稼働後に必要になった時点で考える']
    a: ア
    exp: |
      要件の確認では、システムを直接使う部門だけでなく、そのシステムの情報を使う部門や、記録の保存・証跡の確保を求める部門など、影響を受ける利害関係者を漏れなく洗い出し、それぞれの要件を確認します。本件では、経理・監査の観点の関係者が洗い出しから漏れていました。指摘のあった項目だけを追加しても、他の漏れが残るおそれがあります。
    why:
      - 正解です。利害関係者の洗い出しそのものを見直す対応です。
      - 項目の追加だけでは、洗い出しの漏れという原因が解消されません。
      - 要件の確認の対象は、利用部門に限られません。記録を使う部門も関係者です。
      - 保存の要件は設計に影響するため、稼働後の対応では手戻りが大きくなります。
    know: 要件の漏れの多くは、「人の漏れ」から来る。直接の利用者だけでなく、情報を使う部門・記録を求める部門まで、関係者を洗い出す。
    terms: [利害関係者, 要件定義]
    verify:
      manual: 受注の変更履歴の保存という経理部門の要件が確認から漏れていた事例では、直接の利用部門だけでなく記録や証跡に関わる部門を含めて利害関係者を洗い出して要件を確認する進め方が適切であることを、項目の追加のみとの比較から確認した。
  - id: A18-514
    topic: 18-3-2-4
    diff: 3
    scope: 18-3-2-4 提案書・見積書の評価。前提条件の異なる見積りを、そのままの金額で比べる誤りを避ける判断
    prereq: 見積りの比較では、作業の範囲や前提の条件をそろえて比べること、前提が異なれば金額の差は実力の差を表さないこと
    hard: 「最も安い見積り」をそのまま選ぶ判断の誤りを、前提の不統一という観点から見抜く必要がある。
    q: |
      3 社から見積書が届いた。最も安い A 社の見積りは、データ移行の作業を含んでいないことが分かった。他の 2 社は移行を含んでいる。調達選定における見積りの評価として、適切なものはどれか。
    c: ['各社の見積りの前提（作業の範囲）をそろえ、不足する作業の金額を加えるなどして、同じ条件で比べる', '最も安い A 社を、そのまま選定する', 'A 社の見積りは無効として、残り 2 社で比べる', '3 社に、もう一度同じ金額になるよう見積り直させる']
    a: ア
    exp: |
      見積りの金額は、前提とする作業の範囲がそろって初めて、比べる意味を持ちます。本件では、A 社の見積りにデータ移行が含まれていないため、安さは範囲の狭さによるものです。前提をそろえ、不足する作業の金額を加えて同じ条件で比べることで、公正な評価ができます。範囲の違いに気付かずに金額だけで選ぶと、契約の後に追加の費用が発生します。
    why:
      - 正解です。前提をそろえて比べることが、見積り評価の基本です。
      - 金額だけで選ぶと、含まれていない作業が契約後に追加費用になります。
      - 前提の違いは、見積りの無効の理由にはなりません。そろえて比べることができます。
      - 金額をそろえさせることは、評価の目的に反します。各社の条件は金額以外にもあります。
    know: 見積り比較の鉄則は「同じ土俵で比べる」。金額の差が、範囲の差なのか実力の差なのかを切り分ける。
    terms: [見積書, 調達選定]
    verify:
      manual: 最も安い見積りにデータ移行が含まれていない場合、各社の前提をそろえて不足する作業の金額を加えて同じ条件で比べる評価が適切であることを、金額だけの選定との比較から確認した。
  - id: A18-515
    topic: 18-3-2-7
    diff: 3
    scope: 18-3-2-7 契約締結。検収の条件と支払いの条件を契約に定めることの意味の判断
    prereq: 契約では、成果物を確認する検収の手続と基準、支払いの時期と条件を明確に定めること、検収を経て初めて受領が確定すること
    hard: 「信頼関係があれば細部は不要」という考えと、後日の食い違いを防ぐために条件を定める意味を切り分ける必要がある。
    q: |
      システム開発を外部に委託する契約で、成果物の検収について、契約書への定め方として適切なものはどれか。
    c: ['検収の期間、確認の基準、不合格の場合の扱いを、契約に明確に定める', '検収は信頼関係に任せ、契約には定めない', '検収の基準は、納品の後に協議して決める', '支払いは検収の前に済ませ、検収は形式的に行う']
    a: ア
    exp: |
      検収は、成果物が契約の内容に合っているかを確認し、受領を確定させる手続です。期間、確認の基準、不合格の場合の扱い（修正の求め方など）を契約に明確に定めておくことで、納品の後の食い違いを防げます。基準を後から協議するのでは、判断の物差しがなく、支払いを先に済ませると、修正を求める立場が弱くなります。
    why:
      - 正解です。検収の条件の明確化が、後の食い違いを防ぎます。
      - 信頼関係があっても、手続と基準の定めがないと、判断の食い違いが起きます。
      - 基準を納品の後に決めるのでは、その基準自体が争いのもとになります。
      - 検収の前の支払いは、成果物の確認と受領の順序を逆転させます。
    know: 契約の定めは「疑っているから」ではなく「食い違いを防ぐため」。検収は、期間・基準・不合格の扱いの三点セットで定める。
    terms: [検収, 契約]
    verify:
      manual: システム開発の委託契約では、検収の期間・確認の基準・不合格の場合の扱いを契約に明確に定めることが適切であることを、信頼への依存・基準の後決め・支払いの先行との比較から確認した。
  - id: A18-516
    topic: 18-3-1
    diff: 3
    scope: 18-3-1 調達計画。開発を一括で委託するか、分割して委託するかの判断に、責任の所在と調整の負担を織り込む考え方
    prereq: 一括の委託は責任の所在が一か所に集まる利点があり、分割の委託は各分野の専門性を生かせる一方、委託者側の調整の負担が増えること
    hard: 価格の観点だけでなく、責任の所在と調整の負担という観点で、分割の利害を判断する必要がある。
    q: |
      新しいシステムの開発の調達で、全体を 1 社に一括で委託するか、アプリケーションと基盤を分けて 2 社に委託するか検討している。分割して委託する場合の注意点として、適切なものはどれか。
    c: ['2 社の間の責任の切り分けと、連携の調整を、委託者側が行う必要が生じる', '分割すれば、責任の所在は自動的に明確になる', '分割しても、委託者側の負担は変わらない', '分割の場合は、契約書は 1 本にまとめるべきである']
    a: ア
    exp: |
      分割して委託すると、各分野の専門性を生かせる一方で、会社どうしの境目で問題が起きた場合の責任の切り分けと、日頃の連携の調整を、委託者側が担う必要が生じます。一括の委託では、この調整は受託した 1 社の内部で行われます。分割を選ぶ場合は、その調整の体制を委託者側に用意できるかが、判断の要点になります。
    why:
      - 正解です。境目の責任の切り分けと調整は、委託者側の役割になります。
      - 分割によって境目が生じるため、責任の所在は、かえって明確に定める必要があります。
      - 調整の役割が委託者側に移る分、負担は増えます。
      - 分割の委託では、相手ごとに契約を結ぶのが通常です。1 本にまとめるものではありません。
    know: 調達の分割の判断は、「専門性を生かせる」利点と、「境目の調整を自ら担う」負担の、両面で見る。一括か分割かは、調整の体制が持てるかで決まる。
    terms: [調達, 一括発注]
    verify:
      manual: 開発を 2 社に分割して委託する場合は、2 社の間の責任の切り分けと連携の調整を委託者側が行う必要が生じることが注意点として適切であることを、一括委託との対比から確認した。
