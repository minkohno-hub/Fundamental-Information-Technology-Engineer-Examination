reviewed: { at: '2026-10-21', method: '作成後の逐問レビュー（JIS Q 20000-1 の用語・ITIL・シラバスVer.9.2の用語例と照合、稼働率・容量・バックアップなどの計算は verify の式で独立に再計算）' }
questions:
  - id: A15-001
    topic: 15-1-2
    diff: 1
    q: JIS Q 20000-1（ISO/IEC 20000-1）が規定している内容として，適切なものはどれか。
    c:
      - サービスマネジメントシステム（SMS）を確立し，実施し，維持し，継続的に改善するための要求事項
      - 情報セキュリティマネジメントシステム（ISMS）を確立し，維持し，継続的に改善するための要求事項
      - 製品やサービスの品質を継続的に保証するための品質マネジメントシステムの要求事項
      - 事業者が個人情報を適切に取り扱うための個人情報保護マネジメントシステムの要求事項
    a: ア
    exp: |
      JIS Q 20000-1 は、サービス提供者がサービスを計画・設計・移行・提供・改善するための仕組みであるサービスマネジメントシステム（SMS）について、その確立・実施・維持・継続的改善の要求事項を定めた規格です。第三者による認証の基準として使われます。JIS Q 20000 の規格群には、要求事項（第1部）のほかに適用の手引（第2部）などがあります。
    why:
      - 正解です。SMS の要求事項を規定した規格です。
      - ISMS の要求事項を規定しているのは JIS Q 27001 です。
      - 品質マネジメントシステムの要求事項を規定しているのは JIS Q 9001 です。
      - 個人情報保護マネジメントシステムの要求事項を規定しているのは JIS Q 15001 です。
    terms: [JIS Q 20000, サービスマネジメントシステム, JIS Q 27001]

  - id: A15-002
    topic: 15-1-3
    diff: 1
    q: ITIL の説明として，適切なものはどれか。
    c:
      - IT サービスマネジメントの成功事例（ベストプラクティス）を体系的にまとめたフレームワークで，英国政府機関が作成したものが始まりである。
      - プロジェクトマネジメントに必要な知識を，知識エリアとプロセス群に分けて体系化したガイドである。
      - ソフトウェア開発組織のプロセスの成熟度を5段階で評価するモデルである。
      - 組織の統治機関が IT の利用を評価・指示・モニタするための原則を示した規格である。
    a: ア
    exp: |
      ITIL（Information Technology Infrastructure Library）は、IT サービスマネジメントのベストプラクティスを集めたフレームワークです。英国政府機関（CCTA、後の OGC）が作成したものが始まりで、版を重ねて現在は ITIL 4 が公開されています。規格ではなくガイドラインであり、JIS Q 20000 の基になった考え方の一つでもあります。
    why:
      - 正解です。IT サービスマネジメントのベストプラクティス集です。
      - これは PMBOK ガイドの説明です。
      - これは CMMI（能力成熟度モデル統合）の説明です。
      - これは IT ガバナンスの規格である JIS Q 38500 の説明です。
    terms: [ITIL, JIS Q 20000, ITガバナンス]

  - id: A15-003
    topic: 15-1-4
    diff: 1
    q: SLA の説明として，適切なものはどれか。
    c:
      - サービス提供者と顧客との間で，提供するサービスの内容と，稼働率や応答時間などのサービスレベルの目標を合意して文書化したもの
      - サービス提供者が，組織内部の別の部門との間でサービスの提供を支えるための運用上の取決めを合意したもの
      - 提供中のサービスの概要や利用条件，問合せ窓口などを，利用者向けに一覧にまとめたもの
      - サービスやその構成要素に対する変更を，承認を得るために正式に申請したもの
    a: ア
    exp: |
      SLA（Service Level Agreement：サービスレベル合意書）は、サービス提供者と顧客の間で、サービスの範囲・内容と、サービス時間、可用性（稼働率）、応答時間などの目標値を合意した文書です。目標値を達成できなかった場合の扱い（料金の減額など）を定めることもあります。
    why:
      - 正解です。顧客との間でサービスレベルを合意した文書です。
      - 組織内部の部門との運用上の合意は OLA です。
      - 利用者向けのサービスの一覧はサービスカタログです。
      - 変更の正式な申請は変更要求（RFC）です。
    terms: [SLA, OLA, サービスカタログ, 変更要求]

  - id: A15-004
    topic: [15-1-4, 15-2-7]
    diff: 2
    q: Web サービスのサービスレベルに関する次の記述のうち，SLO に該当するものはどれか。
    c:
      - 月間のサービス稼働率の目標値を 99.9 % 以上とする。
      - サービスの応答時間を1分ごとに測定し，その測定値を記録する。
      - 目標を達成できなかった月は月額料金の一部を返金することを，顧客と文書で取り決める。
      - 今後1年間の利用者数の伸びを予測し，必要なサーバの台数を見積もる。
    a: ア
    exp: |
      サービスレベルを管理するときは次の3つを区別します。
      - SLI（サービスレベル指標）：稼働率や応答時間など、サービスレベルを測るための指標とその測定値
      - SLO（サービスレベル目標）：SLI に対して設定する目標値（例 月間稼働率 99.9 % 以上）
      - SLA（サービスレベル合意書）：SLO などを顧客と合意し、未達時の扱いなども含めて文書化したもの
    why:
      - 正解です。指標に対する目標値なので SLO です。
      - 応答時間という指標の測定なので SLI に当たります。
      - 顧客との合意と未達時の取決めなので SLA に当たります。
      - 将来の需要を予測して資源を見積もるのは容量・能力管理（キャパシティ計画）の活動です。
    terms: [SLO, SLI, SLA, 容量・能力管理]

  - id: A15-005
    topic: 15-2-7
    diff: 2
    q: サービスレベル管理の活動として，適切なものはどれか。
    c:
      - SLA で合意した目標に対する実績を監視・測定して顧客に報告し，定期的にレビューして必要に応じてサービスの改善や SLA の見直しを行う。
      - 繰り返し発生するインシデントの根本原因を調査し，再発を防止するための恒久的な対策を検討する。
      - サービスを構成するハードウェアやソフトウェアの識別情報と相互の関係を記録し，正確に維持する。
      - 災害の発生に備えて代替拠点を準備し，サービスを再開する手順を定めておく。
    a: ア
    exp: |
      サービスレベル管理（SLM）は、顧客とサービスレベルの目標を合意し（SLA）、その目標に対する実績を監視・測定・報告し、定期的なレビューを通じて改善するプロセスです。合意 → 監視 → 報告 → レビュー → 改善という PDCA サイクルを回して、合意したサービスレベルを維持・向上させます。
    why:
      - 正解です。合意したサービスレベルの監視・報告・レビューを行います。
      - これは問題管理の活動です。
      - これは構成管理の活動です。
      - これはサービス継続管理の活動です。
    terms: [サービスレベル管理, SLA, 問題管理, 構成管理, サービス継続管理]

  - id: A15-006
    topic: [15-2-8, 15-1-4]
    diff: 2
    q: IT サービスの提供者が，顧客と合意した SLA を達成するために，同じ組織内の他部門（ネットワーク運用部門など）との間で取り交わす運用レベルの合意を何というか。
    c: ['OLA', 'SLA', 'RFC', 'CMDB']
    a: ア
    exp: |
      OLA（Operational Level Agreement：運用レベル合意書）は、サービス提供者と組織内部の部門（内部供給者）との間で、サービスの提供を支える作業の内容や対応時間などを合意したものです。顧客との SLA を確実に達成できるように、それを支える OLA や外部の供給者との契約の内容を SLA と整合させておく必要があります。
    why:
      - 正解です。組織内部の部門との運用レベルの合意です。
      - SLA はサービス提供者と顧客との間の合意です。
      - RFC（変更要求）は、変更を正式に申請するものです。
      - CMDB は構成品目の情報を管理するデータベースです。
    terms: [OLA, SLA, 供給者管理, 変更要求, CMDB]

  - id: A15-007
    topic: 15-2-8
    diff: 3
    q: JIS Q 20000-1 の供給者管理における「外部供給者」と「内部供給者」の説明として，適切なものはどれか。
    c:
      - 外部供給者はサービス提供者の組織の外部の者で契約を結んでサービスの一部を提供し，内部供給者はより大きな組織の一部であるが SMS の適用範囲外にあり，文書化した合意に基づいてサービスの一部を提供する。
      - 外部供給者はサービスを利用する顧客のことであり，内部供給者はサービスを提供する SMS 内の要員のことである。
      - 外部供給者とは文書化した合意だけを結び，内部供給者とは法的な拘束力のある契約を必ず結ぶ。
      - 外部供給者も内部供給者も SMS の適用範囲内の部門であり，サービス提供者と同じ方針と手順に直接従う。
    a: ア
    exp: |
      JIS Q 20000-1 では、サービスの設計・移行・提供・改善の一部を担う他者を供給者と呼び、次のように区別します。
      - 外部供給者：サービス提供者の組織の外部の関係者で、サービス提供者と契約を結ぶ（クラウドサービス事業者やアウトソーシング先など）
      - 内部供給者：より大きな組織の一部ではあるが SMS の適用範囲外にあり、サービス提供者と文書化した合意（OLA に相当）を結ぶ
      また、顧客が供給者として行動する場合もあります。サービス提供者は、供給者が提供する部分も含めてサービス全体に責任を負います。
    why:
      - 正解です。外部は契約、内部は文書化した合意で関係を定めます。
      - 顧客や SMS 内の要員は供給者ではありません。供給者はサービスの一部を提供する者です。
      - 契約を結ぶのは外部供給者で、内部供給者とは文書化した合意を結びます。関係が逆です。
      - 供給者は SMS の適用範囲外の者です。そのため契約や合意で管理する必要があります。
    terms: [供給者管理, OLA, サービスマネジメントシステム]

  - id: A15-008
    topic: 15-2-3
    diff: 1
    q: サービスカタログの説明として，適切なものはどれか。
    c:
      - 稼働中のサービスについて，サービスの内容，利用条件，問合せ窓口などを，顧客や利用者に向けて文書化した情報
      - 計画中・開発中・稼働中・廃止済みを含む，サービス提供者が管理するすべてのサービスの一覧
      - サービスを構成する機器やソフトウェアの属性と相互の関係を記録したデータベース
      - 顧客とサービス提供者の間で，サービスレベルの目標値を合意した文書
    a: ア
    exp: |
      サービスカタログは、顧客や利用者に提供しているサービスの説明、利用できる条件（対象者・時間）、サービス要求の方法や問合せ窓口などを文書化した情報です。サービスカタログ管理では、その内容が正確で最新の状態に保たれるようにします。計画中や廃止済みのサービスまで含めた全体はサービスポートフォリオと呼びます。
    why:
      - 正解です。稼働中のサービスを利用者向けに説明したものです。
      - 計画中から廃止済みまでを含むサービス全体の一覧はサービスポートフォリオです。
      - 構成品目の属性と関係を記録したものは CMDB（構成管理データベース）です。
      - サービスレベルの目標値を合意した文書は SLA です。
    terms: [サービスカタログ, サービスポートフォリオ, CMDB, SLA]

  - id: A15-009
    topic: 15-2-11
    diff: 2
    q: 容量・能力管理の活動として，適切なものはどれか。
    c:
      - CPU やディスクの使用率を監視してしきい値を超えていないかを確認し，需要の予測に基づいて将来必要となる資源を計画する。
      - サービスの停止時間を記録して稼働率を算出し，可用性の目標を達成するための冗長化を検討する。
      - サービスの利用者から寄せられた苦情を記録し，調査して対応結果を報告する。
      - 新しいソフトウェアのリリースを試験し，稼働環境へ展開する手順を計画する。
    a: ア
    exp: |
      容量・能力管理（キャパシティ管理）は、現在と将来の需要に対して、サービスの提供に必要な資源（CPU、メモリ、ディスク、ネットワークなど）の容量・能力が十分であるようにするプロセスです。資源の使用率を監視し、しきい値を超えたら警告を出したり、需要の予測に基づいて容量・能力計画を立てたりします。
    why:
      - 正解です。使用率の監視と将来の容量の計画を行います。
      - 稼働率を算出して可用性の目標を管理するのはサービス可用性管理です。
      - 苦情の記録・調査・報告は事業関係管理の活動です。
      - リリースの試験と展開はリリース及び展開管理の活動です。
    terms: [容量・能力管理, サービス可用性管理, 事業関係管理, リリース及び展開管理]

  - id: A15-010
    topic: 15-2-11
    diff: 2
    q: 容量 1,000 G バイトのディスクを使用するファイルサーバがある。現在の使用量は 500 G バイトで，今後は毎月 25 G バイトずつ一定に増加すると予測している。使用率が 80 % に達した時点で増設する方針のとき，増設が必要になるのは何か月後か。
    c: ['12 か月後', '20 か月後', '32 か月後', '8 か月後']
    a: ア
    exp: |
      使用率 80 % に当たる使用量は 1,000 × 0.8 = 800 G バイトです。現在の 500 G バイトから 800 G バイトまでの増加分は 300 G バイトなので、300 ÷ 25 = 12 か月後に増設が必要になります。容量・能力管理では、このように需要の予測としきい値から、資源を追加する時期を前もって計画します。
    why:
      - 正解です。（800 − 500）÷ 25 = 12 か月です。
      - （1,000 − 500）÷ 25 = 20 か月で、ディスクが満杯になるまでの期間です。しきい値の 80 % を考慮していません。
      - 800 ÷ 25 = 32 か月で、現在の使用量 500 G バイトを差し引いていません。
      - （700 − 500）÷ 25 = 8 か月で、しきい値を 70 % として計算した値です。
    terms: [容量・能力管理]
    verify: { value: '(1000 * 0.8 - 500) / 25' }

  - id: A15-011
    topic: 15-2-18
    diff: 1
    q: あるサービスの MTBF が 950 時間，MTTR が 50 時間のとき，このサービスの稼働率は幾らか。
    c: ['0.95', '0.053', '0.947', '0.050']
    a: ア
    exp: |
      稼働率は、全体の時間のうち正常に稼働している時間の割合で、次の式で求めます。
      稼働率 ＝ MTBF ÷（MTBF ＋ MTTR）＝ 950 ÷（950 ＋ 50）＝ 950 ÷ 1,000 ＝ 0.95
    why:
      - 正解です。950 ÷ 1,000 ＝ 0.95 です。
      - 50 ÷ 950 ≒ 0.053 で、MTTR を MTBF で割った値です。稼働率の式ではありません。
      - （950 − 50）÷ 950 ≒ 0.947 で、稼働率の式ではありません。
      - 50 ÷ 1,000 ＝ 0.050 で、停止している時間の割合（1 − 稼働率）です。
    terms: [稼働率, MTBF, MTTR, サービス可用性管理]
    verify: { value: '950 / (950 + 50)' }

  - id: A15-012
    topic: 15-2-18
    diff: 3
    q: あるシステムの稼働率が 0.98，MTTR が 4 時間であるとき，MTBF は何時間か。
    c: ['196 時間', '200 時間', '204 時間', '98 時間']
    a: ア
    exp: |
      稼働率 ＝ MTBF ÷（MTBF ＋ MTTR）なので、MTBF を x とすると x ÷（x ＋ 4）＝ 0.98 です。
      x ＝ 0.98x ＋ 3.92 より 0.02x ＝ 3.92、x ＝ 196 時間となります。
      検算すると 196 ÷（196 ＋ 4）＝ 196 ÷ 200 ＝ 0.98 で一致します。
    why:
      - 正解です。196 ÷ 200 ＝ 0.98 となります。
      - 200 時間は 4 ÷ 0.02 で、故障から次の故障までの1周期（MTBF ＋ MTTR）の長さです。MTTR を含んでいます。
      - 204 時間は 1周期にさらに MTTR を加えた値で、根拠がありません。
      - 98 時間は 0.98 を 100 倍しただけの値で、MTTR を使っていません。
    terms: [MTBF, MTTR, 稼働率]
    verify: { value: '0.98 * 4 / (1 - 0.98)', tolerance: 0.000001 }

  - id: A15-013
    topic: [15-1-4, 15-2-18]
    diff: 2
    q: サービス時間を毎日 8 時から 20 時までの 12 時間とするサービスで，SLA の可用性の目標を月間（30 日）99.5 % 以上と合意した。この目標を達成するために許容される1か月の停止時間は，最大で何分か。
    c: ['108 分', '216 分', '3.6 分', '7.2 分']
    a: ア
    exp: |
      可用性はサービス時間（合意したサービス提供時間）に対して計算します。
      1か月のサービス時間 ＝ 12 時間 × 30 日 ＝ 360 時間 ＝ 21,600 分
      許容される停止時間 ＝ 21,600 × （1 − 0.995）＝ 21,600 × 0.005 ＝ 108 分
      サービス時間外の停止（夜間の保守など）は可用性の計算に含めません。
    why:
      - 正解です。21,600 分 × 0.005 ＝ 108 分です。
      - 216 分は 24 時間 × 30 日で計算した値で、合意したサービス時間を使っていません。
      - 3.6 分は 12 時間（720 分）× 0.005 で、1日分の許容停止時間です。
      - 7.2 分は 24 時間（1,440 分）× 0.005 で、24 時間を基準にした1日分の値です。
    terms: [SLA, サービス可用性管理]
    verify: { value: '12 * 60 * 30 * (1 - 0.995)', tolerance: 0.000001 }

  - id: A15-014
    topic: 15-2-18
    diff: 1
    q: サービス可用性管理において，MTTR を指標として評価する特性はどれか。
    c: ['保守性', '信頼性', '完全性', '機密性']
    a: ア
    exp: |
      保守性は、障害が発生したときに速やかに修理して元の状態に戻せる性質で、平均修復時間である MTTR で評価します（短いほど保守性が高い）。故障しにくさを表す信頼性は MTBF、使いたいときに使える割合を表す可用性は稼働率で評価します。
    why:
      - 正解です。修復の速さを表す保守性は MTTR で評価します。
      - 信頼性は故障しにくさを表す特性で、MTBF で評価します。
      - 完全性は、データや処理が正確で矛盾がない性質で、MTTR では評価しません。
      - 機密性は、許可された者だけが情報を利用できる性質で、MTTR では評価しません。
    terms: [MTTR, MTBF, 保守性（RASIS）, サービス可用性管理]

  - id: A15-015
    topic: 15-2-19
    diff: 1
    q: 事業継続計画やサービス継続計画で用いられる RTO の説明として，適切なものはどれか。
    c:
      - 災害や障害が発生してから，業務やサービスを再開させるまでの目標時間
      - 災害や障害が発生したときに，どの時点までのデータを復旧させるかの目標
      - 災害や障害が発生したときに，業務やサービスをどの水準まで復旧させるかの目標
      - 障害が発生してから修復が完了するまでの時間の実績の平均
    a: ア
    exp: |
      事業継続やサービス継続の計画では、復旧の目標を次の指標で定めます。
      - RTO（目標復旧時間）：中断からどれだけの時間で再開させるか
      - RPO（目標復旧時点）：どの時点のデータまで戻せればよいか（失ってもよいデータの範囲）
      - RLO（目標復旧レベル）：どの水準（業務量やサービス品質）まで復旧させるか
    why:
      - 正解です。再開させるまでの目標時間です。
      - どの時点のデータまで復旧させるかは RPO（目標復旧時点）です。
      - どの水準まで復旧させるかは RLO（目標復旧レベル）です。
      - 修復時間の実績の平均は MTTR で、目標ではなく実績値です。
    terms: [RTO, RPO, RLO, BCP, MTTR]

  - id: A15-016
    topic: 15-2-19
    diff: 2
    q: 業務システムの RPO を「障害発生の1時間前の時点」と定めた。この目標を達成するための対策として，適切なものはどれか。
    c:
      - データのバックアップ又は遠隔地への複製を，少なくとも1時間ごとに取得する。
      - 障害発生から1時間以内に代替システムへ切り替えられる体制を整える。
      - 毎日1回，夜間にデータのフルバックアップを取得する。
      - 障害発生後の1時間以内に，すべての利用者へ障害の発生を通知する。
    a: ア
    exp: |
      RPO（目標復旧時点）は、障害時にどの時点のデータまで復旧できればよいかを表す目標で、裏返すと失ってもよいデータの量（時間）を示します。障害発生の1時間前の時点まで戻せるようにするには、バックアップや複製（レプリケーション）の取得間隔を1時間以内にする必要があります。
    why:
      - 正解です。1時間ごとに取得すれば、失われるデータは最大1時間分です。
      - 1時間以内に切り替えるのは RTO（目標復旧時間）に関する対策です。
      - 1日1回のバックアップでは最大で約1日分のデータが失われ、RPO を満たせません。
      - 利用者への通知はインシデント対応の一部で、データの復旧時点とは関係ありません。
    terms: [RPO, RTO, バックアップ]

  - id: A15-017
    topic: 15-2-19
    diff: 2
    q: 待機系を用意する冗長化の方式を，障害発生時に待機系へ切り替えて処理を再開するまでの時間が短い順に並べたものはどれか。
    c:
      - ホットスタンバイ，ウォームスタンバイ，コールドスタンバイ
      - コールドスタンバイ，ウォームスタンバイ，ホットスタンバイ
      - ウォームスタンバイ，ホットスタンバイ，コールドスタンバイ
      - ホットスタンバイ，コールドスタンバイ，ウォームスタンバイ
    a: ア
    exp: |
      - ホットスタンバイ：待機系を本番系と同じ状態で起動しておき、障害時にすぐ切り替える。切替えが最も速いが費用は高い。
      - ウォームスタンバイ：待機系の機器や OS は起動しておくが、業務アプリケーションの起動やデータの反映は障害時に行う。ホットとコールドの中間。
      - コールドスタンバイ：待機系を停止させておき（又は別の用途に使っておき）、障害時に起動して準備する。切替えに最も時間がかかる。
    why:
      - 正解です。ホット、ウォーム、コールドの順に切替えが速くなります。
      - 時間が長い順に並べたもので、短い順とは逆です。
      - ホットスタンバイはウォームスタンバイより切替えが速いため、順序が誤りです。
      - コールドスタンバイは障害時に待機系を起動するため、ウォームスタンバイより時間がかかります。
    terms: [ホットスタンバイ, ウォームスタンバイ, コールドスタンバイ, サービス継続管理]

  - id: A15-018
    topic: 15-2-15-1
    diff: 1
    q: インシデント管理の主な目的として，適切なものはどれか。
    c:
      - 中断したサービスや品質が低下したサービスを，回避策も活用して，できるだけ速やかに通常の状態に回復させる。
      - インシデントの根本原因を特定し，恒久的な解決策によって再発を防止する。
      - サービスに対する変更を評価・承認し，計画どおりに実施させる。
      - サービスを構成する要素の情報を正確に記録し，維持する。
    a: ア
    exp: |
      インシデントとは、サービスの計画外の中断、サービスの品質の低下、又はまだ顧客へのサービスに影響していない事象のことです。インシデント管理の目的は、根本原因の解明よりもまず、合意した時間内にサービスを回復させることです。そのために、暫定的な回避策（ワークアラウンド）も積極的に使います。
    why:
      - 正解です。速やかなサービスの回復が目的です。
      - 根本原因の特定と再発防止は問題管理の目的です。
      - 変更の評価・承認は変更管理の目的です。
      - 構成要素の情報の記録・維持は構成管理の目的です。
    terms: [インシデント管理, 回避策, 問題管理, 変更管理, 構成管理]

  - id: A15-019
    topic: 15-2-17
    diff: 1
    q: 同じ種類のサーバ停止が毎週のように発生しており，その都度再起動して復旧させている。停止の根本原因を特定し，恒久的な解決策を講じて再発を防止することを目的とするプロセスはどれか。
    c: ['問題管理', 'インシデント管理', 'サービス要求管理', 'リリース及び展開管理']
    a: ア
    exp: |
      問題管理は、一つ又は複数のインシデントの根本原因（問題）を特定し、その影響を最小限にするとともに、再発を防止する（予防する）ためのプロセスです。毎回の再起動でサービスを回復させるのはインシデント管理の役割で、それとは別に問題管理で根本原因を取り除く必要があります。恒久的な解決策の実施にシステムの変更が伴う場合は、変更管理を通して実施します。
    why:
      - 正解です。根本原因の特定と再発防止は問題管理の目的です。
      - インシデント管理は、再起動などで速やかにサービスを回復させることが目的で、根本原因の除去は目的としません。
      - サービス要求管理は、パスワードの再設定や情報の提供など、利用者からの定型的な要求を扱います。
      - リリース及び展開管理は、承認された変更をリリースとして稼働環境に展開するプロセスです。
    terms: [問題管理, 根本原因, インシデント管理, サービス要求管理, リリース及び展開管理]

  - id: A15-020
    topic: 15-2-17
    diff: 3
    q: 問題管理における「既知の誤り」の説明として，適切なものはどれか。
    c:
      - 根本原因が特定されているか，又は回避策によってサービスへの影響を低減又は除去する方法がある問題
      - 原因が全く分からず，サービスデスクでは対応方法を決められないインシデント
      - 利用者が誤った操作をしたことで発生したインシデント
      - 試験の段階で発見されたが，まだ記録されていないソフトウェアの欠陥
    a: ア
    exp: |
      既知の誤り（known error）は、根本原因が特定されたか、回避策が見つかっている問題のことです。既知の誤りとその回避策を記録して共有しておくと、同じ症状のインシデントが発生したときに、サービスデスクなどがすぐに回避策を適用してサービスを回復できます。恒久的な解決策は、変更管理を通じて実施します。
    why:
      - 正解です。原因又は回避策が分かっている問題です。
      - 原因が分からない状態は既知の誤りではありません。既知の誤りは原因又は回避策が判明しているものです。
      - 利用者の操作ミスによるインシデントを指す用語ではありません。
      - 既知の誤りは記録して管理するものであり、未記録の欠陥を指すものではありません。
    terms: [既知の誤り, 問題管理, 回避策]

  - id: A15-021
    topic: 15-2-15-1
    diff: 2
    q: インシデント管理で，インシデントへの対応の優先度を決定するときに用いる要素の組合せとして，適切なものはどれか。
    c:
      - 業務への影響の大きさと緊急度
      - 報告してきた利用者の役職と受付の順番
      - 同じ日に受け付けたインシデントの件数と担当者の経験年数
      - 解決に必要な費用と対応できる要員の数
    a: ア
    exp: |
      インシデントの優先度は、業務やサービスに与える影響（影響を受ける利用者の数や業務の重要度）と、緊急度（どれだけ早く解決する必要があるか）を組み合わせて決めるのが一般的です。優先度に応じて解決目標時間を定め、優先度の高いものから対応します。
    why:
      - 正解です。影響と緊急度の組合せで優先度を決めます。
      - 役職や受付順では業務への影響を反映できず、重要なインシデントの対応が遅れるおそれがあります。
      - インシデントの件数や担当者の経験は、個々のインシデントの優先度を決める要素ではありません。
      - 費用や要員の数は対応の方法を決めるときの考慮点で、優先度の決定要素ではありません。
    terms: [インシデント管理]

  - id: A15-022
    topic: 15-2-15-1
    diff: 2
    q: サービスデスクで受け付けたインシデントが，サービスデスクの要員の知識では解決できなかったため，専門的な技術をもつ二次サポートのチームに対応を引き継いだ。このような対応を何というか。
    c: ['機能的エスカレーション', '階層的エスカレーション', '標準変更', '問題の記録']
    a: ア
    exp: |
      エスカレーションには2種類あります。
      - 機能的エスカレーション：より高度な専門知識や技術をもつ担当者・チームへ対応を引き継ぐ（例 一次サポートから二次サポートへ）
      - 階層的エスカレーション：解決目標時間内に解決できない、影響が大きいなどの場合に、より上位の管理者へ報告して判断や追加の資源を求める
    why:
      - 正解です。専門チームへ対応を引き継ぐのは機能的エスカレーションです。
      - 階層的エスカレーションは、上位の管理者へ報告して判断を仰ぐものです。専門チームへの引継ぎではありません。
      - 標準変更は、事前に承認されたリスクの低い定型的な変更のことです。
      - 問題の記録は、根本原因の調査が必要なときに問題管理で行うもので、対応の引継ぎを表す用語ではありません。
    terms: [機能的エスカレーション, 階層的エスカレーション, サービスデスク, 標準変更]

  - id: A15-023
    topic: 15-2-15-2
    diff: 2
    q: JIS Q 20000-1 における重大なインシデントへの対応として，適切なものはどれか。
    c:
      - 重大なインシデントの判断基準をあらかじめ定めておき，該当するインシデントは文書化した手順に従って管理し，トップマネジメントに通知する。
      - 重大なインシデントも通常のインシデントと区別せず，受け付けた順に処理する。
      - 重大なインシデントは根本原因が判明するまで，回避策を使わずにサービスを停止しておく。
      - 重大なインシデントは利用者の不安を招くため，解決するまで関係者以外には一切知らせない。
    a: ア
    exp: |
      JIS Q 20000-1 では、インシデントを重大なインシデントとして分類する基準を定め、重大なインシデントは文書化した手順に従って分類・管理し、トップマネジメントに通知することを求めています。重大なインシデントには責任者を指名し、サービスの回復後には再発防止のためのレビューを行います。
    why:
      - 正解です。判断基準と手順を定め、トップマネジメントに通知します。
      - 重大なインシデントは影響が大きいため、通常とは区別して優先的に対応します。
      - サービスの回復が優先で、回避策を使って速やかに回復させるべきです。根本原因の調査は回復と並行して問題管理で行います。
      - 影響を受ける顧客や利用者への適切な情報提供が必要で、関係者以外に一切知らせないのは不適切です。
    terms: [重大なインシデント, インシデント管理, 回避策]

  - id: A15-024
    topic: 15-2-16
    diff: 1
    q: サービス要求管理で扱う「サービス要求」に該当するものはどれか。
    c:
      - 利用者からの，忘れてしまったパスワードの再設定の依頼
      - 社内のメールサーバが停止し，メールの送受信ができないという連絡
      - 同じ障害が繰り返し発生している原因を調査してほしいという依頼
      - 業務システムのデータベースを新しいバージョンに更新する計画
    a: ア
    exp: |
      サービス要求は、利用者からの情報提供の依頼、助言の依頼、アクセス権の付与、事前に承認された定型的な作業（標準変更）などの要求です。パスワードの再設定やソフトウェアの使い方の問合せなどが代表例で、あらかじめ定めた手順で対応（実現）します。サービスの中断や品質低下はインシデントとして扱います。
    why:
      - 正解です。パスワードの再設定は定型的なサービス要求です。
      - メールサーバの停止はサービスの中断なので、インシデントとして扱います。
      - 繰り返す障害の原因調査は問題管理で扱います。
      - データベースの更新はサービスへの変更で、変更管理やリリース及び展開管理で扱います。
    terms: [サービス要求管理, サービス要求, インシデント管理, 問題管理, 変更管理]

  - id: A15-025
    topic: 15-2-12-1
    diff: 1
    q: 変更管理の説明として，適切なものはどれか。
    c:
      - サービスやその構成要素に対する変更要求を記録し，影響やリスクを評価して，承認された変更だけを計画的に実施させる。
      - 利用者からの問合せや障害の連絡を一元的に受け付け，記録して対応する。
      - 稼働環境へ展開するソフトウェアを構築・試験し，展開の手順を計画する。
      - サービスの提供に必要な資源の使用状況を監視し，将来の需要に備える。
    a: ア
    exp: |
      変更管理は、変更要求（RFC）を記録・分類し、変更によるサービスへの影響、リスク、費用などを評価したうえで承認の可否を判断し、承認された変更の実施を管理するプロセスです。無秩序な変更による障害を防ぐことが目的で、問題管理で見つかった恒久的な解決策なども変更管理を通じて実施します。
    why:
      - 正解です。変更要求の評価・承認と実施の管理を行います。
      - 問合せや障害の連絡を一元的に受け付けるのはサービスデスクの役割です。
      - リリースの構築・試験と展開の計画はリリース及び展開管理の活動です。
      - 資源の監視と将来の需要への備えは容量・能力管理の活動です。
    terms: [変更管理, 変更要求, サービスデスク, リリース及び展開管理, 容量・能力管理]

  - id: A15-026
    topic: 15-2-12-2
    diff: 2
    q: 変更管理における「標準変更」の説明として，適切なものはどれか。
    c:
      - リスクが低く手順が確立されており，事前に承認されているため，個別の承認を経ずに実施できる変更
      - 重大なインシデントを解決するために，通常の手続を短縮して直ちに実施する必要がある変更
      - 影響やリスクを個別に評価し，変更諮問委員会（CAB）の助言を得て承認の可否を判断する変更
      - 変更の実施に失敗したときに，変更前の状態に戻す作業
    a: ア
    exp: |
      変更はリスクや緊急性によって分類されます。
      - 標準変更：リスクが低く、手順が確立した定型的な変更（PC の追加配備など）。事前に承認されており、サービス要求として実施されることも多い
      - 通常の変更：個別に評価し、必要に応じて CAB の助言を得て承認する
      - 緊急変更：重大なインシデントの解決などのため、迅速に実施する必要がある変更。簡略化した手続で承認し、事後にレビューする
      失敗したときに元に戻すことはロールバック（切り戻し）といいます。
    why:
      - 正解です。事前承認済みの定型的な変更です。
      - これは緊急変更の説明です。
      - これは通常の変更の説明です。
      - これはロールバック（切り戻し）の説明です。
    terms: [標準変更, 緊急変更, CAB, 切り戻し, 変更管理]

  - id: A15-027
    topic: 15-2-12-2
    diff: 2
    q: 変更管理における CAB（変更諮問委員会）の役割として，適切なものはどれか。
    c:
      - 変更要求の影響やリスクの評価，承認の可否，実施の優先順位について，変更の承認者に助言する。
      - 承認された変更を含むリリースを構築して，稼働環境へ展開する作業を実施する。
      - 繰り返し発生するインシデントの根本原因を分析する。
      - 構成管理データベースに記録された構成品目の情報を日々更新する。
    a: ア
    exp: |
      CAB（Change Advisory Board：変更諮問委員会）は、変更の評価や承認の判断を支援するために、技術・業務・顧客など様々な立場の関係者で構成される組織です。変更要求について影響やリスク、優先順位を検討し、承認者に助言します。変更の実施後には、変更が目的を達成したかを確認するレビュー（PIR）も行われます。
    why:
      - 正解です。変更の評価・承認について助言します。
      - リリースの構築と展開はリリース及び展開管理の作業で、CAB の役割ではありません。
      - 根本原因の分析は問題管理の活動です。
      - 構成品目の情報の更新は構成管理の活動です。
    terms: [CAB, 変更管理, 変更実施後のレビュー, リリース及び展開管理, CMDB]

  - id: A15-028
    topic: 15-2-14
    diff: 2
    q: リリース及び展開管理の説明として，適切なものはどれか。
    c:
      - 承認された変更を含むリリースを計画・構築して受入れ試験環境で試験し，受入れ基準を満たしたものを稼働環境に展開する。失敗に備えて元に戻す手順も用意する。
      - リリースの受入れ試験は，利用者が実際に使う稼働環境で直接行い，問題があればその場で修正する。
      - 緊急のリリースは，変更管理の承認も記録も必要とせず，担当者の判断で稼働環境に展開する。
      - リリースは利用者への影響が大きいので，展開の計画は展開が完了した後にまとめて作成する。
    a: ア
    exp: |
      リリース及び展開管理は、変更管理で承認された新規又は変更されたサービスやその構成要素を、リリースとしてまとめて計画・構築・試験し、稼働環境へ展開するプロセスです。リリースの受入れ基準を定め、稼働環境と分離した受入れ試験環境で検証してから展開します。展開に失敗した場合に備えて、元の状態に戻す（ロールバックする）手順も計画します。
    why:
      - 正解です。試験環境で検証してから稼働環境へ展開します。
      - 稼働環境で直接試験すると、利用者のサービスに影響を与えるおそれがあります。試験は受入れ試験環境で行います。
      - 緊急リリースでも、変更管理の手続（簡略化された承認や事後の記録・レビュー）は必要です。
      - 展開の計画は展開の前に作成し、利用者への影響を考慮した時期や手順を決めておきます。
    terms: [リリース及び展開管理, 緊急リリース, 変更管理, 切り戻し]

  - id: A15-029
    topic: 15-2-5
    diff: 2
    q: 構成管理において，CMDB（構成管理データベース）に記録して管理する情報として，適切なものはどれか。
    c:
      - サーバ，ソフトウェア，文書などの構成品目（CI）の識別情報，版（バージョン），状態及び構成品目間の関係
      - 利用者ごとのサービスの利用料金と，その請求・入金の状況
      - サービスデスクの要員ごとの勤務予定と残業時間
      - 提供中のサービスについての利用者向けの説明と申込みの方法
    a: ア
    exp: |
      構成管理では、サービスを提供するために管理が必要な要素を構成品目（CI）として識別し、その属性（種類、版、所在、状態など）と、CI 同士の関係（どのサーバでどのソフトウェアが動くかなど）を CMDB に記録して、正確な状態に維持します。CI にはハードウェアやソフトウェアだけでなく、SLA や手順書などの文書も含まれます。正確な構成情報は、インシデントの影響範囲の特定や変更の影響の評価に使われます。
    why:
      - 正解です。CI の識別情報・版・関係を記録します。
      - 利用料金の請求・入金の状況は、サービスの会計業務で管理する情報です。
      - 要員の勤務予定や残業時間は人的資源の管理で扱う情報で、CMDB の対象ではありません。
      - 利用者向けのサービスの説明はサービスカタログに記載する情報です。
    terms: [構成管理, CMDB, 構成品目, サービスカタログ]

  - id: A15-030
    topic: 15-2-4
    diff: 2
    q: 社内の PC に導入されているソフトウェアを調査し，保有しているライセンスの数と照合して，ライセンス違反や不要なライセンスの購入を防ぐ活動を何というか。
    c: ['ソフトウェア資産管理', '構成管理', 'リリース及び展開管理', '容量・能力管理']
    a: ア
    exp: |
      ソフトウェア資産管理（SAM：Software Asset Management）は、組織が保有・利用するソフトウェアとそのライセンスを把握し、導入数と保有ライセンス数の照合などによって、ライセンス契約の違反を防いだり、過剰な購入をなくして費用を適正化したりする活動です。IT 資産全体の管理を IT アセットマネジメント（ITAM）といいます。
    why:
      - 正解です。ソフトウェアとライセンスの管理はソフトウェア資産管理です。
      - 構成管理は、サービスの構成品目とその関係を正確に維持する活動で、ライセンスの照合が主な目的ではありません。
      - リリース及び展開管理は、リリースを稼働環境へ展開する活動です。
      - 容量・能力管理は、資源の容量が需要に対して十分かを管理する活動です。
    terms: [IT資産管理, SAM, 構成管理, リリース及び展開管理, 容量・能力管理]

  - id: A15-031
    topic: 15-2-6
    diff: 2
    q: JIS Q 20000-1 のプロセスのうち，顧客満足度を定期的に測定し，サービスに対する苦情を記録・調査して対応し，その結果を報告する活動を含むものはどれか。
    c: ['事業関係管理', 'サービスレベル管理', '需要管理', '供給者管理']
    a: ア
    exp: |
      事業関係管理は、サービス提供者と顧客との良好な関係を築き、維持するためのプロセスです。顧客とその利害関係者を特定し、サービスのパフォーマンスや事業の変化について定期的に話し合います。また、顧客満足度を測定し、サービスの苦情を記録・調査・対応して、解決結果を報告します。
    why:
      - 正解です。顧客満足度の測定と苦情の管理を含みます。
      - サービスレベル管理は、合意したサービスレベルの目標に対する実績を監視・報告するプロセスです。
      - 需要管理は、サービスの需要を予測して把握するプロセスです。
      - 供給者管理は、外部供給者や内部供給者のパフォーマンスを管理するプロセスです。
    terms: [事業関係管理, サービスレベル管理, 需要管理, 供給者管理]

  - id: A15-032
    topic: 15-2-9
    diff: 2
    q: 情報システムの TCO（総所有費用）の説明として，適切なものはどれか。
    c:
      - ハードウェアやソフトウェアの導入費用だけでなく，運用・保守費用，利用者の教育費用などを含めた，導入から廃棄までにかかる費用の総額
      - ハードウェアとソフトウェアを購入するために必要な初期費用の総額
      - システムを運用する要員の人件費を，年間で合計した額
      - システムを導入したことによって得られる利益を，投資額で割った値
    a: ア
    exp: |
      TCO（Total Cost of Ownership：総所有費用）は、システムの導入時の費用（初期費用）だけでなく、運用・保守、障害対応、利用者の教育・サポートなど、導入から廃棄までにかかるすべての費用を合計したものです。サービスの予算業務や、クラウドサービスへの移行などの比較検討に使われます。
    why:
      - 正解です。導入から廃棄までの総費用です。
      - 初期費用だけでは、運用・保守などの費用が含まれないため TCO ではありません。
      - 運用要員の人件費は TCO の一部にすぎません。
      - 利益を投資額で割った値は ROI（投資利益率）です。
    terms: [TCO]

  - id: A15-033
    topic: 15-2-13-3
    diff: 2
    q: 新しいサービスへの移行において，本番の移行の前に，本番と同等の環境で移行作業を実際に行い，移行手順の妥当性，所要時間，問題点などを確認することを何というか。
    c: ['移行リハーサル', '運用テスト', '受入れテスト', 'ロールバック']
    a: ア
    exp: |
      移行リハーサルは、本番の移行と同じ手順を、本番と同等の環境で事前に実施して、手順の誤りや抜け、所要時間、問題が起きたときの対応などを確認するものです。その結果を踏まえて移行計画を見直し、移行を実施してよいか（移行判断）を決定します。
    why:
      - 正解です。移行作業を事前に試すのは移行リハーサルです。
      - 運用テストは、運用手順やシステムの運用上の機能が、実際の運用で問題なく使えるかを確認するテストです。
      - 受入れテストは、利用者や発注者が、システムやサービスが要件を満たしているかを確認するテストです。
      - ロールバックは、変更や移行に失敗したときに元の状態に戻すことです。
    terms: [サービスの移行, 切り戻し]

  - id: A15-034
    topic: 15-4-3
    diff: 1
    q: サービスデスクの役割として，適切なものはどれか。
    c:
      - 利用者からの問合せ，サービス要求，障害の連絡などを一元的に受け付ける単一の窓口（SPOC）となる。
      - 変更要求の影響とリスクを評価し，承認の可否について助言する。
      - インシデントの根本原因を分析し，恒久的な解決策を開発する。
      - 構成品目の情報を記録したデータベースを設計し，維持する。
    a: ア
    exp: |
      サービスデスクは、利用者とサービス提供者の間の単一の窓口（SPOC：Single Point Of Contact）として、問合せ、サービス要求、インシデントの連絡などを受け付けて記録し、その場で解決できるものは解決（一次解決）し、解決できないものは適切な担当へエスカレーションします。対応状況を利用者に伝えるのも役割です。
    why:
      - 正解です。窓口を一元化した SPOC として機能します。
      - 変更の評価と承認の助言は CAB（変更諮問委員会）の役割です。
      - 根本原因の分析と恒久的な解決策の開発は、問題管理の担当チームが行います。
      - CMDB の設計・維持は構成管理の役割です。
    terms: [サービスデスク, SPOC, CAB, 問題管理, CMDB]

  - id: A15-035
    topic: 15-4-3
    diff: 2
    q: 地理的に離れた複数の拠点にいるサービスデスクの要員を通信技術で結び，利用者からは一つのサービスデスクとして見えるように運営する形態を何というか。
    c: ['バーチャルサービスデスク', 'ローカルサービスデスク', '中央サービスデスク', 'フォロー・ザ・サン']
    a: ア
    exp: |
      サービスデスクの組織の形態には、次のようなものがあります。
      - ローカルサービスデスク：利用者の拠点の近くに設置する
      - 中央サービスデスク：1か所に集約して設置する
      - バーチャルサービスデスク：要員は複数の拠点に分散しているが、通信技術によって一つのサービスデスクとして運営する
      - フォロー・ザ・サン：時差のある複数の地域の拠点を組み合わせ、昼間の地域が順に対応を引き継いで 24 時間対応する
    why:
      - 正解です。分散した要員を一つに見せる形態です。
      - ローカルサービスデスクは、利用者の拠点の近くに個別に設置する形態です。
      - 中央サービスデスクは、要員を1か所に集約する形態です。
      - フォロー・ザ・サンは、時差を利用して地域間で対応を引き継ぎ、24 時間対応を実現する形態です。
    terms: [バーチャルサービスデスク, ローカルサービスデスク, 中央サービスデスク, フォロー・ザ・サン]

  - id: A15-036
    topic: 15-4-3
    diff: 2
    q: サービスデスクで，問合せの一次解決率を高めるとともに，利用者が自己解決できるようにする施策として，適切なものはどれか。
    c:
      - 過去の問合せと解決方法を知識ベースに蓄積し，FAQ やチャットボットとして利用者にも公開する。
      - サービスデスクで受け付けた問合せは，内容にかかわらずすべて二次サポートへ引き継ぐ。
      - 対応にかかる時間を短縮するため，問合せの記録を省略する。
      - 専門知識をもつ要員だけが対応できるように，解決方法の情報を個人で管理させる。
    a: ア
    exp: |
      知識ベース（ナレッジベース）に過去の問合せの内容と解決方法を蓄積すると、サービスデスクの要員が素早く回答でき、一次解決率が向上します。よくある質問を FAQ として公開したり、チャットボットで自動応答したりすれば、利用者が自分で解決できる場面も増え、サービスデスクの負荷も下がります。
    why:
      - 正解です。知識ベースを活用して一次解決と自己解決を促します。
      - すべて二次サポートへ引き継ぐと、一次解決率は下がり、二次サポートの負荷も増えます。
      - 記録を省略すると、対応状況の追跡や知識の蓄積、傾向分析ができなくなります。
      - 情報を個人で管理させると知識が共有されず、一次解決率は向上しません。
    terms: [知識ベース, サービスデスク, 機能的エスカレーション]

  - id: A15-037
    topic: 15-4-3
    diff: 2
    q: コールセンターなどで使われる CTI の説明として，適切なものはどれか。
    c:
      - 電話とコンピュータを連携させ，着信時に発信者番号から顧客情報を検索して担当者の画面に表示したり，着信を適切な担当者へ振り分けたりする。
      - 利用者からの質問に対し，あらかじめ登録した回答を自動的に返す対話型のプログラムである。
      - 利用者からの問合せをすべて一つの窓口で受け付けるという考え方である。
      - よくある質問とその回答をまとめて，利用者が参照できるように公開したものである。
    a: ア
    exp: |
      CTI（Computer Telephony Integration）は、電話とコンピュータを統合する技術です。着信時に発信者の電話番号から顧客データベースを検索して対応履歴などを画面に表示したり、問合せの種類に応じて着信を担当者へ自動的に振り分けたりできます。サービスデスクやコールセンターの対応の効率化に使われます。
    why:
      - 正解です。電話とコンピュータを統合する技術です。
      - これはチャットボットの説明です。
      - これは SPOC（単一窓口）の説明です。
      - これは FAQ の説明です。
    terms: [CTI, SPOC, 知識ベース]

  - id: A15-038
    topic: 15-4-2
    diff: 2
    q: 毎週日曜日の夜にフルバックアップを取得し，月曜日から土曜日までは毎日夜間に増分バックアップを取得している。1回のバックアップは1本のテープに記録する。木曜日の昼に障害が発生し，水曜日の夜のバックアップの時点までデータを復旧するとき，必要なテープは何本か。
    c: ['4 本', '2 本', '3 本', '5 本']
    a: ア
    exp: |
      増分バックアップは、直前のバックアップ（フル又は増分）以降に変更されたデータだけを保存します。そのため復旧には、直近のフルバックアップに、それ以降のすべての増分バックアップを順に適用する必要があります。
      日曜日のフル（1本）＋ 月曜日・火曜日・水曜日の増分（3本）＝ 4 本
      差分バックアップ（前回のフルバックアップ以降の変更をすべて保存）であれば、フルと水曜日の差分の 2 本で復旧できます。
    why:
      - 正解です。フル1本と増分3本が必要です。
      - 2 本で済むのは差分バックアップの場合です。増分バックアップでは途中の日の分もすべて必要です。
      - 3 本では、フルバックアップか増分バックアップのどれか1本が不足します。
      - 5 本は木曜日の分まで数えていますが、木曜日の夜のバックアップは障害時点ではまだ取得されていません。
    terms: [増分バックアップ, 差分バックアップ, フルバックアップ]
    verify: { value: '1 + 3' }

  - id: A15-039
    topic: 15-4-2
    diff: 2
    q: 差分バックアップ方式の特徴を，増分バックアップ方式と比較して述べたものとして，適切なものはどれか。
    c:
      - 復旧にはフルバックアップと最新の差分バックアップだけを使えばよいが，フルバックアップからの日数が経つほど1回のバックアップの量が増える。
      - 1回のバックアップの量は常に最小になるが，復旧にはフルバックアップ以降のすべてのバックアップが必要になる。
      - フルバックアップを一度取得すれば，以後はフルバックアップを取得する必要がない。
      - 変更の有無にかかわらず毎回すべてのデータを保存するので，復旧が最も簡単である。
    a: ア
    exp: |
      - 差分バックアップ：直近のフルバックアップ以降に変更されたデータをすべて保存する。復旧はフル＋最新の差分の2つで済むが、日が経つほど保存量と時間が増える。
      - 増分バックアップ：直前のバックアップ以降に変更されたデータだけを保存する。毎回の保存量は少ないが、復旧にはフル以降のすべての増分を順に適用する必要がある。
      どちらの方式でも、定期的にフルバックアップを取得し直します。
    why:
      - 正解です。復旧は簡単ですが、保存量は日ごとに増えます。
      - これは増分バックアップの特徴です。
      - 差分バックアップも増分バックアップも、基準となるフルバックアップを定期的に取得し直します。
      - 毎回すべてのデータを保存するのはフルバックアップです。
    terms: [差分バックアップ, 増分バックアップ, フルバックアップ]

  - id: A15-040
    topic: 15-4-2
    diff: 2
    q: 夜間のバッチ処理で，ジョブ A（20 分）の終了後にジョブ B（30 分）とジョブ C（40 分）を同時に並行して実行し，ジョブ B とジョブ C の両方が終了した後にジョブ D（10 分）を実行する。ジョブ A を開始してからジョブ D が終了するまでの時間は何分か。なお，ジョブの切替えに要する時間は無視する。
    c: ['70 分', '100 分', '60 分', '50 分']
    a: ア
    exp: |
      ジョブ B とジョブ C は並行して実行されるため、両方が終了するのは長い方のジョブ C（40 分）が終わったときです。
      20（A）＋ 40（B と C のうち長い方）＋ 10（D）＝ 70 分
      ジョブスケジューラーでは、このようなジョブの先行関係を定義して自動実行し、最も時間がかかる経路が全体の処理時間を決めます。
    why:
      - 正解です。20 ＋ 40 ＋ 10 ＝ 70 分です。
      - 100 分はすべてのジョブを順番に実行した場合の時間で、並行実行を考慮していません。
      - 60 分は短い方のジョブ B（30 分）を使った値で、ジョブ C の終了を待っていません。
      - 50 分は A・B・C の最大値の 40 分に D を加えただけで、ジョブ A の時間を含めていません。
    terms: [ジョブ管理]
    verify: { value: '20 + Math.max(30, 40) + 10' }

  - id: A15-041
    topic: 15-4-1
    diff: 2
    q: システム運用管理における AIOps の説明として，適切なものはどれか。
    c:
      - 監視データやログなどの大量の運用データを AI で分析し，障害の予兆の検知，原因の推定，対応の自動化などを行って運用を効率化する。
      - 開発チームと運用チームが協力し，ソフトウェアの開発からリリースまでを迅速かつ継続的に行う。
      - 運用担当者の作業手順を文書化し，手作業による運用オペレーションを標準化する。
      - AI を利用したアプリケーションを開発するために，学習用のデータを収集・加工する。
    a: ア
    exp: |
      AIOps（AI for IT Operations）は、システムの監視データ、ログ、イベントなどの大量の運用データを AI（機械学習など）で分析し、異常や障害の予兆の検知、関連するアラートの集約、原因の推定、対応の自動化などを行う取組みです。運用の負荷の軽減やサービスの安定化に役立ちます。
    why:
      - 正解です。AI で運用データを分析して運用を高度化します。
      - これは DevOps の説明です。
      - 作業手順の文書化は業務運用マニュアルの整備で、AI の活用ではありません。
      - これは AI 開発のためのデータ準備の説明で、IT 運用への AI の活用ではありません。
    terms: [AIOps]

  - id: A15-042
    topic: 15-5-1-2
    diff: 1
    q: データセンターなどの電源設備としての UPS の役割として，適切なものはどれか。
    c:
      - 停電や瞬時電圧低下が起きたときに，蓄電池から短時間電力を供給し，自家発電装置が起動するまでの間をつないだり，システムを安全に停止させたりする。
      - 燃料を使って発電し，長時間の停電でも電力を供給し続ける。
      - 落雷などによって電源線や通信線に発生する過電圧から，機器を保護する。
      - 地震の揺れが建物や機器に伝わりにくくして，機器の転倒や損傷を防ぐ。
    a: ア
    exp: |
      UPS（無停電電源装置）は、停電や瞬時電圧低下のときに内蔵の蓄電池から電力を供給する装置です。供給できるのは短時間なので、長時間の停電に備えて自家発電装置を併設し、発電機が起動して電力が安定するまでの間を UPS でつなぎます。自家発電装置がない場合は、UPS が電力を供給している間にシステムを安全に停止（シャットダウン）させます。
    why:
      - 正解です。短時間の電力供給で停電の影響を防ぎます。
      - これは自家発電装置の説明です。UPS の蓄電池では長時間の供給はできません。
      - これはアレスタなどのサージ防護デバイスの説明です。
      - これは免震装置の説明です。
    terms: [UPS, 自家発電装置, サージ防護デバイス, 免震装置]

  - id: A15-043
    topic: 15-5-1-2
    diff: 2
    q: サーバルームの空調で，サーバラックの前面（吸気面）同士，背面（排気面）同士を向かい合わせて列を配置する方式の説明として，適切なものはどれか。
    c:
      - 吸気側の通路（コールドアイル）に冷気を集め，排気側の通路（ホットアイル）の暖気と混ざらないようにして，冷却の効率を高める。
      - すべてのラックを同じ向きに並べ，前の列の排気を後ろの列の吸気として再利用する。
      - ラックの排気側の通路に冷気を送り込み，排気の温度を下げてから室外に出す。
      - 室温を一定に保つため，冷気と暖気をラックの間で十分に混合させる。
    a: ア
    exp: |
      ラックの吸気面同士を向かい合わせた通路をコールドアイル、排気面同士を向かい合わせた通路をホットアイルといいます。冷気をコールドアイルに供給し、ホットアイルの暖気を空調機に戻すことで、冷気と暖気が混ざるのを防ぎ、冷却の効率を高めます。通路を壁や扉で囲う（キャッピング）と、さらに効果が高まります。
    why:
      - 正解です。冷気と暖気を分離して冷却効率を高めます。
      - 同じ向きに並べると前の列の暖かい排気を後ろの列が吸い込み、冷却効率が悪くなります。
      - 冷気は吸気側（コールドアイル）に送ります。排気側に送っても機器の冷却には役立ちません。
      - 冷気と暖気を混合させると冷却効率が下がります。分離することが目的です。
    terms: [コールドアイル]

  - id: A15-044
    topic: 15-5-1-4
    diff: 2
    q: データセンターの電力使用の効率を示す指標である PUE を，施設全体の消費電力量と IT 機器の消費電力量から求めたい。施設全体の消費電力量が 1,500 kWh，そのうち IT 機器の消費電力量が 1,000 kWh のとき，PUE は幾らか。
    c: ['1.5', '0.67', '0.5', '2.5']
    a: ア
    exp: |
      PUE（Power Usage Effectiveness）は、データセンター全体の消費電力を IT 機器の消費電力で割った値です。
      PUE ＝ 1,500 ÷ 1,000 ＝ 1.5
      空調や照明などの IT 機器以外の消費電力が少ないほど 1.0 に近づき、効率が良いことを表します。グリーン IT の取組みで、省エネルギーの評価に使われる指標です。
    why:
      - 正解です。1,500 ÷ 1,000 ＝ 1.5 です。
      - 0.67 は 1,000 ÷ 1,500 で、分子と分母が逆です。
      - 0.5 は IT 機器以外の消費電力 500 を IT 機器の消費電力で割った値です。
      - 2.5 は施設全体と IT 機器の消費電力を足して 1,000 で割った値で、根拠がありません。
    terms: [PUE, グリーンIT]
    verify: { value: '1500 / 1000' }

  - id: A15-045
    topic: 15-5-1-2
    diff: 2
    q: 落雷によって電源線や通信線に発生する異常な高電圧（サージ）から，サーバやネットワーク機器を保護するために設置するものはどれか。
    c: ['サージ防護デバイス（SPD）', 'UPS', '自家発電装置', 'MDF']
    a: ア
    exp: |
      サージ防護デバイス（SPD：Surge Protective Device）は、落雷などで電源線や通信線に瞬間的に発生する過電圧（サージ）を大地へ逃がして、接続した機器を保護する装置です。アレスタ（避雷器）とも呼ばれます。
    why:
      - 正解です。サージを逃がして機器を保護します。
      - UPS は停電時に電力を供給する装置で、雷サージの防護が主な目的ではありません。
      - 自家発電装置は長時間の停電時に発電して電力を供給する設備です。
      - MDF（主配線盤）は、建物外部からの通信回線を引き込んで構内の配線と接続する設備です。
    terms: [サージ防護デバイス, UPS, 自家発電装置]

  - id: A15-046
    topic: 15-3-2-1
    diff: 2
    q: サービスマネジメントシステムで不適合が発生したときの「是正処置」の説明として，適切なものはどれか。
    c:
      - 不適合の原因を特定して除去し，同じ不適合が再発しないようにするための処置
      - 発見された不適合そのものを取り除くために，その場で行う応急的な処置
      - 不適合が発生したかどうかを確認するために，計画的に行う内部監査
      - 不適合の発生を記録せずに，次の改善計画で検討する処置
    a: ア
    exp: |
      不適合とは、要求事項を満たしていないことです。不適合が発生したときは、まず不適合を管理して修正する（不適合そのものを除去する）とともに、原因を明確にして除去し、再発を防ぐための是正処置をとります。是正処置の有効性もレビューします。これらは継続的改善の基本的な活動です。
    why:
      - 正解です。原因を除去して再発を防止する処置です。
      - これは修正の説明です。不適合そのものを除去しても、原因を除去しなければ再発します。
      - 内部監査はパフォーマンス評価の活動で、不適合を見つける手段の一つです。是正処置ではありません。
      - 不適合は記録して対処する必要があり、記録せずに先送りするのは不適切です。
    terms: [不適合, 継続的改善]

  - id: A15-047
    topic: 15-3-2-2
    diff: 2
    q: サービスデスクの改善で，KGI（重要目標達成指標）を「利用者満足度調査で満足と回答した割合を 90 % 以上にする」と定めた。この目標の達成に向けた活動の進捗を測る KPI（重要業績評価指標）として，最も適切なものはどれか。
    c:
      - 問合せのうち，サービスデスクの一次対応で解決した割合
      - 利用者満足度調査で満足と回答した割合
      - サービスデスクの要員が使用している PC の台数
      - サービスデスクが入居しているビルの階数
    a: ア
    exp: |
      KGI は最終的な目標の達成度を測る指標、KPI は目標達成のための重要な活動やプロセスの実行状況を測る指標です。利用者満足度を高めるには、問合せをすばやく解決することが重要なので、一次解決率や平均応答時間などが KPI として適切です。KPI を継続的に監視し、改善の効果を確認しながら PDCA サイクルを回します。
    why:
      - 正解です。満足度の向上につながる活動の状況を測る KPI です。
      - これは KGI そのもので、達成に向けた活動の進捗を測る KPI ではありません。
      - PC の台数は利用者満足度の向上との関係が乏しく、活動の進捗を測る指標になりません。
      - ビルの階数はサービスの改善とは関係がなく、指標になりません。
    terms: [継続的改善, サービスデスク]

  - id: A15-048
    topic: 15-2-1
    diff: 1
    q: サービスマネジメントシステムに PDCA サイクルを適用するとき，C（Check）の段階で行う活動として，適切なものはどれか。
    c:
      - 内部監査やマネジメントレビューを実施し，SMS とサービスのパフォーマンスを評価する。
      - サービスマネジメントの方針と目的を定め，必要な資源を計画する。
      - 計画に従って，サービスマネジメントのプロセスを運用する。
      - 評価の結果に基づいて是正処置をとり，継続的に改善する。
    a: ア
    exp: |
      JIS Q 20000-1 などのマネジメントシステム規格は、PDCA サイクルによる継続的改善を基本にしています。
      - Plan：方針・目的を定め、リスクと機会への取組みや資源を計画する
      - Do：計画に従ってサービスの設計・移行・提供などのプロセスを運用する
      - Check：監視・測定・分析・評価、内部監査、マネジメントレビューを行う
      - Act：不適合に対する是正処置や継続的改善を行う
    why:
      - 正解です。パフォーマンスの評価は Check の段階です。
      - 方針・目的の決定と資源の計画は Plan の段階です。
      - プロセスの運用は Do の段階です。
      - 是正処置と継続的改善は Act の段階です。
    terms: [サービスマネジメントシステム, 継続的改善]

  - id: A15-049
    topic: 15-2-20
    diff: 2
    q: サービスマネジメントシステムにおける情報セキュリティ管理の活動として，適切なものはどれか。
    c:
      - 情報セキュリティ方針を定め，サービスと SMS に関する情報セキュリティのリスクを計画した間隔でアセスメントし，管理策を決定して実施する。
      - 情報セキュリティは技術的な問題なので，サービスの提供者ではなく機器の製造者がすべての責任を負う。
      - 情報セキュリティインシデントは，通常のインシデントと区別せず，記録も報告もしない。
      - 一度定めた管理策は，サービスや脅威が変化しても見直さない。
    a: ア
    exp: |
      JIS Q 20000-1 の情報セキュリティ管理では、トップマネジメントが承認した情報セキュリティ方針を定め、情報セキュリティのリスクを計画した間隔でアセスメントし、リスクに対処する管理策を決定・実施します。情報セキュリティインシデントは、文書化した手順に従って管理し、記録して報告します。管理策の有効性を監視し、必要に応じて見直します。
    why:
      - 正解です。方針の策定、リスクアセスメント、管理策の実施を行います。
      - サービス提供者は、供給者が担う部分も含めてサービスの情報セキュリティに責任を負います。
      - 情報セキュリティインシデントは、手順に従って管理し、記録・報告する必要があります。
      - サービスや脅威の変化に応じて、リスクアセスメントと管理策の見直しを行う必要があります。
    terms: [情報セキュリティ管理, リスクアセスメント, 情報セキュリティインシデント]

  - id: A15-050
    topic: 15-2-2
    diff: 2
    q: サービスポートフォリオの説明として，適切なものはどれか。
    c:
      - サービス提供者が管理するサービス全体を表すもので，計画中・開発中のサービス，稼働中のサービス，廃止したサービスを含む。
      - 稼働中のサービスだけを，顧客が申し込めるように説明したもの
      - サービスの提供に使用しているハードウェアの一覧と，その保守契約の内容
      - インシデントの件数や解決時間などの実績を，月ごとに顧客へ報告する文書
    a: ア
    exp: |
      サービスポートフォリオは、サービス提供者が管理するすべてのサービスを、その状態とともに表したものです。計画中・開発中のサービスの部分をサービス・パイプライン、稼働中のサービスの部分をサービスカタログ、廃止したサービスの部分を廃止済みサービスと呼ぶことがあります。どのサービスに投資するかなどの判断に使われます。
    why:
      - 正解です。計画中から廃止済みまでのすべてのサービスを含みます。
      - 稼働中のサービスだけを顧客向けに説明したものはサービスカタログです。
      - ハードウェアの一覧と保守契約は資産管理や供給者管理で扱う情報です。
      - 実績の報告はサービスの報告で作成する文書です。
    terms: [サービスポートフォリオ, サービスカタログ]
