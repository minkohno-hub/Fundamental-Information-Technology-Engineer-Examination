reviewed: { at: '2026-10-30', method: '独立レビュー担当が解答を伏せて解き直し、法令の内容の正確さ・誤答の検証と既存問題との重複確認を実施。重複と判定された A23-511 は労働契約申込みみなし制度を問う問題に差し替え、再レビューで非重複と正確さを確認' }
questions:
  - id: A23-509
    topic: 23-4-5-8
    diff: 3
    scope: 23-4-5-8 製造物責任法（PL 法）。製造物の欠陥による事故について、過失がなくても製造業者が責任を負う仕組みと、その範囲を判断する問題であり、範囲内。
    prereq: 製造物責任は、製造業者の過失ではなく製造物の欠陥を要件とする責任であり、損害の対象は生命・身体・財産（製造物自体の損害は除かれる）であること
    hard: 「取扱説明書のとおりに使った」「製造業者の注意不足は証明できていない」という事実から、過失の有無ではなく欠陥の有無で判断する枠組みを適用する必要がある。
    q: |
      消費者が、購入した電気製品を取扱説明書どおりに使用していたところ、製品内部の不具合で発火し、火災により家具が焼損し、本人もやけどを負った。製造業者が製品の設計や製造に注意を尽くしたかどうかは立証されていない。製造物責任法（PL 法）に基づく損害賠償について、最も適切なものはどれか。
    c:
      - 製品に欠陥があったと認められれば、製造業者に過失が証明されなくても、やけどと家具の損害について賠償責任が生じ得る
      - 製造業者の過失が証明できない以上、賠償責任は生じない
      - 賠償の対象はやけど（身体の損害）だけで、家具の損害は対象にならない
      - 製品自体の価格が最も大きな損害なので、賠償は製品の買換え費用に限られる
    a: ア
    exp: |
      製造物責任法は、通常の不法行為と異なり、製造業者の「過失」ではなく、製造物の「欠陥」（通常有すべき安全性を欠いていること）を要件とします。過失の立証がなくても、欠陥と損害の因果関係が認められれば賠償責任が生じます。賠償の対象は、生命・身体への損害と、欠陥のある製造物以外の財産（本件では家具）への損害です。ただし、製造物自体の損害（製品の買換え費用）だけでは対象になりません。
    why:
      - 正解です。欠陥を要件とする責任であり、身体の損害と、製品以外の財産の損害が対象になります。
      - 過失を要件とするのは民法の不法行為です。製造物責任法は、消費者が過失を立証する困難を避けるために設けられた仕組みです。
      - 財産の損害も対象です。対象外なのは、その製造物自体の損害だけです。
      - 製造物自体の損害だけでは、製造物責任法の賠償は生じません。本件には身体と家具の損害があります。
    know: 製造物責任法の3点セットは「欠陥を要件とする（過失は不要）」「対象は生命・身体と他の財産」「製造物自体の損害は対象外」。責任を負うのは製造業者等で、販売店は原則として含まれない点も論点になる。
    terms: [製造物責任法]
    verify:
      manual: 事例の損害（やけど、家具の焼損、製品自体の焼損）を製造物責任法の要件（欠陥）と対象範囲（身体と他財産は対象、製造物自体は対象外）に当てはめ、過失の立証が不要であることを確認した。

  - id: A23-510
    topic: 23-1-4
    diff: 3
    scope: 23-1-4 不正競争防止法の商品形態模倣。他社の商品の形態を実質的に同一のまま模倣して販売する行為が、販売開始から3年の間規制されることを判断する問題であり、範囲内。
    prereq: 商品形態模倣は、他人の商品の形態（形状・模様・色彩など）を実質的に同一の形態で模倣した商品を、販売等する行為をいうこと
    hard: 「少し色を変えた」「機能的な形状ではない」という事実の評価と、保護期間（日本国内で最初に販売された日から3年）の当てはめが必要になる。
    q: |
      A社は、B社が1年前に発売した文房具について、外観の形状や模様が実質的に同一の商品を製造し、自社ブランドで販売し始めた。色をわずかに変えているが、全体の形態の印象は変わらない。不正競争防止法における、この行為の扱いとして、最も適切なものはどれか。
    c:
      - 商品の形態を実質的に同一のまま模倣した商品の販売に当たり、B社の商品が日本国内で最初に販売された日から3年以内であるため、不正競争に該当し得る
      - 色を少しでも変えていれば、形態の模倣には当たらず問題ない
      - 商品の形態は著作権でしか保護されないため、B社の商品に著作物性がなければ何をしても自由である
      - 模倣が規制されるのは、発売から10年以上経ったロングセラー商品に限られる
    a: ア
    exp: |
      不正競争防止法は、不正競争の一類型として「商品形態模倣」を定めています。他人の商品の形態を実質的に同一の形態で模倣した商品を譲渡・貸渡し・展示などする行為が対象で、わずかな変更で印象が変わらない場合は「実質的に同一」と評価されます。保護期間は、その商品が日本国内で最初に販売された日から3年です。本件は発売から1年の時点の模倣なので、期間内であり、不正競争に該当し得ます。機能を確保するために不可欠な形態は除かれますが、本件の文房具の外観はそれには当たりません。
    why:
      - 正解です。実質的に同一の形態の模倣販売は、販売開始から3年以内であれば不正競争に該当し得ます。
      - わずかな色彩の変更で全体の印象が変わらなければ、「実質的に同一」の評価は変わりません。
      - 商品形態の模倣は、不正競争防止法が著作権とは別に規制する類型です。著作物性の有無は要件ではありません。
      - 保護期間は3年と短く、発売直後の模倣から先行者の投下資本の回収を守る制度です。10年ではありません。
    know: 商品形態模倣は「実質的同一性」と「販売開始から3年」という期間が鍵。デッドコピーに近い模倣を短期間だけ禁じることで、先行開発者の回収機会を守る趣旨である。
    terms: [不正競争防止法, 商品形態模倣]
    verify:
      manual: 事例の模倣（実質的に同一、色の微変更のみ）と時期（発売1年後）を、商品形態模倣の要件と3年の保護期間に当てはめ、該当し得ることを確認した。

  - id: A23-511
    topic: 23-3-3
    diff: 3
    scope: 23-3-3 労働者派遣の違法な受入れに対する効果。偽装請負などの違法状態で労働者を受け入れた場合に生じる、労働契約申込みみなし制度の効果を判断する問題であり、範囲内。
    prereq: 労働者派遣法に違反して労働者を受け入れた事業主は、その労働者に対して、派遣元との労働条件と同一の条件で労働契約の申込みをしたものとみなされること
    hard: 「自動的に雇用関係が生じる」のではなく、申込みをしたものとみなされ、労働者の承諾によって初めて契約が成立するという、制度の段階構造を理解する必要がある。
    q: |
      A社は、請負の形式で B 社の従業員 C を自社事業所で働かせていたが、その実態は A 社が C に直接指揮命令をする偽装請負であり、労働者派遣法に違反する受入れであった。この場合の C と A 社の関係についての法的な扱いとして、最も適切なものはどれか。
    c:
      - A 社は、C に対して、B 社との労働契約と同じ労働条件で労働契約の申込みをしたものとみなされ、C が承諾すれば、A 社と C の間に労働契約が成立する
      - C は、承諾の意思表示をするまでもなく、自動的に A 社の従業員になる
      - A 社には行政上の指導や罰則があり得るが、C との関係に法的な効果は一切生じない
      - C は、まず B 社を退職しなければ、A 社との労働契約を成立させることはできない
    a: ア
    exp: |
      労働者派遣法には「労働契約申込みみなし制度」があります。派遣の許可を持たない事業者から労働者を受け入れる、偽装請負の状態で受け入れるなど、法に違反する形で労働者を受け入れた場合、受入れた事業主（派遣先）は、その時点で、その労働者に対して、派遣元との労働契約と同じ労働条件で労働契約の申込みをしたものとみなされます。そのうえで労働者が承諾すれば、派遣先との間に労働契約が成立します。自動的に従業員になるわけではなく、承諾という労働者の意思表示が契約成立の要件である点が、この制度の特徴です。
    why:
      - 正解です。申込みをしたものとみなされ、労働者の承諾で派遣先との労働契約が成立するのが、みなし制度の仕組みです。
      - 契約は申込みと承諾で成立します。みなし制度でも、労働者の承諾がなければ契約は成立しません。
      - みなし制度は、労働者と受入事業主の間の雇用関係に直接効果を生む仕組みです。行政の指導や罰則だけにとどまりません。
      - 退職は要件ではありません。みなし申込みは違反行為が終わった日から1年間は撤回できないため、労働者はその間に承諾の意思表示をすれば、契約を成立させることができます。
    know: 労働契約申込みみなし制度は、違法な派遣や偽装請負への実効的な歯止めとして設けられた仕組み。労働条件は派遣元との契約と同じ内容で申込んだものとみなされる。ただし、派遣先が違反を知らず、知らなかったことについて過失がなかった場合は、この制度は適用されない。
    terms: [偽装請負, 労働者派遣, 労働契約申込みみなし制度]
    verify:
      manual: 事例の状態（偽装請負による法違反の受入れ）を労働契約申込みみなし制度の発動要件に当てはめ、効果が「申込みをしたものとみなす」であり契約成立には労働者の承諾が要ることを確認した。

  - id: A23-512
    topic: 23-2-4-1
    diff: 3
    scope: 23-2-4-1 個人情報保護法の匿名加工情報。個人情報を復元できないよう加工して利活用する際の、加工の基準と取扱いのルールを判断する問題であり、範囲内。
    prereq: 匿名加工情報は、特定の個人を識別できないよう、かつ復元できないよう加工した情報であり、作成時の公表や再識別の禁止などのルールがあること
    hard: 「氏名を消せばよい」という理解の誤りを退け、他の情報と照合しても識別できない水準の加工と、作成した情報の安全管理や再識別禁止まで含めて判断する必要がある。
    q: |
      A社は、購買履歴のデータを、特定の個人を識別できないよう加工した上で、需要分析のために外部の研究機関に提供したいと考えている。匿名加工情報として適切に扱うための対応として、最も適切なものはどれか。
    c:
      - 加工基準に従って氏名の削除や年齢の区分化などを行い、復元できないようにした上で、含まれる情報の項目を公表して提供する
      - 氏名だけを削除すれば匿名加工情報になるので、そのまま提供する
      - 提供先と秘密保持契約を結べば、加工をしなくても匿名加工情報として提供できる
      - 加工した後も、元の情報と突き合わせれば個人を特定できる方法を残しておく
    a: ア
    exp: |
      匿名加工情報は、個人情報保護法の加工基準に従って、特定の個人を識別できないようにし、かつ復元できないように加工した情報です。加工は氏名の削除だけでなく、識別につながる部分の削除、一般化（年齢を年代に置換えるなど）、他の情報と照合しても識別できない水準にすることが求められます。作成したときは、含まれる個人情報の項目を公表しなければならず、提供先を含め、元の情報との照合による再識別は禁止されます。安全管理措置も必要です。
    why:
      - 正解です。基準に従った加工（復元不可）と、項目の公表が、匿名加工情報の扱いの基本です。
      - 氏名を消しても、他の属性の組合せで個人が識別できる場合があります。基準に沿った加工が全体として必要です。
      - 秘密保持契約は情報の扱いの約束であり、加工の代替にはなりません。未加工の個人情報をそのまま渡せば、通常の第三者提供の手続の問題になります。
      - 復元できる方法を残すことは、匿名加工情報の要件（復元できないこと）に反します。再識別も禁止されています。
    know: 匿名加工情報のポイントは「識別できない」「復元できない」「再識別しない」の3点と、作成時の項目の公表。仮名加工情報（社内利用に限る制度）と混同しないことも重要である。
    terms: [匿名加工情報]
    verify:
      manual: 匿名加工情報の要件（加工基準、復元不可、再識別の禁止、項目の公表）を事例の各対応案と照合し、基準どおりの加工と公表を行う案だけが適合することを確認した。

  - id: A23-513
    topic: 23-1-2
    diff: 3
    scope: 23-1-2 著作権法の引用の要件。自社の資料への他人の文章の転載が、適法な引用に当たるかどうかを、主従関係と出所の明示から判断する問題であり、範囲内。
    prereq: 引用が認められるには、公正な慣行に合致し、報道・批評・研究その他の引用の目的上正当な範囲内であり、自社の著作物が主、引用部分が従の関係にあること
    hard: 出所を記載していても、量的に引用部分が中心になっていれば引用とは認められないという、主従関係の判断が核心になる。
    q: |
      A社は、自社の製品紹介ページを作成する際、競合他社の技術解説記事の文章の大部分を転載し、自社の文章は導入と結びの数行だけとした。出所として記事の媒体名は記載した。この利用は、著作権法の引用として認められるか。最も適切なものはどれか。
    c:
      - 転載部分がページの大部分を占め、自社の文章が従の立場になっているため、引用の要件を満たさず、認められない可能性が高い
      - 出所を明示してあれば、量がどれだけ多くても引用として認められる
      - 製品紹介という営利目的のページでは、引用は一切認められない
      - 文章の転載は著作権の対象ではないため、自由に利用できる
    a: ア
    exp: |
      引用が認められるには、(1) 公正な慣行に合致すること、(2) 引用の目的上正当な範囲内であること、(3) 自分の著作物が主で、引用部分が従であること（主従関係）、(4) 出所の明示、が求められます。本件では、出所は記載されていますが、転載部分がページの大部分を占め、自社の文章が数行だけでは、主従関係が逆転しており、正当な範囲を超えています。したがって、引用としては認められない可能性が高い形です。なお、営利目的であること自体は引用を直ちに否定するものではありません。
    why:
      - 正解です。出所の明示があっても、主従関係が逆転した大量の転載は引用の要件を満たしません。
      - 出所の明示は要件の1つにすぎません。量や主従関係の要件を満たさなければ引用にはなりません。
      - 営利目的の利用でも、要件を満たせば引用は認められます。目的の営利性だけで一律に否定されるものではありません。
      - 文章は言語の著作物として著作権の対象です。転載には原則として権利者の許諾が要ります。
    know: 引用の判断は「明瞭区別性」「主従関係」「出所の明示」などを総合して行う。出所さえ書けばよいという理解は誤りで、量的に従であることが中心的な要件になる。
    terms: [引用, 著作権]
    verify:
      manual: 事例（転載が大部分、自社の文章は数行、出所は記載）を引用の要件群（主従関係、正当な範囲、出所明示）に当てはめ、主従関係を欠くことを確認した。

  - id: A23-514
    topic: 23-1-3
    diff: 3
    scope: 23-1-3 特許法の職務発明。従業員の発明について、勤務規程等で定めた場合に特許を受ける権利が初めから使用者に帰属する仕組みと、従業員への相当の利益の付与を判断する問題であり、範囲内。
    prereq: 職務発明については、契約や勤務規則であらかじめ定めることで、特許を受ける権利を発明の完成時から使用者に帰属させることができること、その場合も従業員には相当の利益を受ける権利があること
    hard: 「会社の設備で作った発明は自動的に会社のもの」という誤解を退け、事前の定めの有無と、従業員に従業員側の権利（相当の利益）が残ることを併せて判断する必要がある。
    q: |
      A社では、就業規則に「従業員が職務上行った発明について、特許を受ける権利は発明の時から会社に帰属する」と定め、従業員の意見を聴取する手続を経てこの規則を定めている。研究員 B が職務発明をしたときの扱いとして、最も適切なものはどれか。
    c:
      - 規則の定めにより特許を受ける権利は発明の時から A 社に帰属するが、B には相当の利益を受ける権利がある
      - 規則の定めがあっても、特許を受ける権利は常に B に帰属し、会社は無償で譲り受けることはできないにしても、対価なしに帰属させることはできない
      - 会社が特許を取得したら、追加の利益付与は一切不要である
      - 職務発明をした従業員には、特許を受ける権利と相当の利益の両方を放棄させることができる
    a: ア
    exp: |
      特許法の職務発明の制度では、契約や勤務規則にあらかじめ定めておくことで、職務発明についての特許を受ける権利を、発明が完成した時から使用者（会社）に帰属させることができます。ただし、その場合でも、発明をした従業員には「相当の利益」を受ける権利が認められています。相当の利益は金銭に限らず、昇進や留学など経済的な利益も含まれます。規則を定める際には、従業員の意見を聴くことが求められ、本件はその手続も経ています。権利の帰属と利益の付与は別の話であり、両方とも放棄させることはできません。
    why:
      - 正解です。事前の定めによる使用者への原始帰属と、従業員の相当の利益を受ける権利が併存します。
      - 事前的定めがある場合は、発明の時から使用者に帰属します。いつも発明者に帰属するという理解は、現在の制度とは異なります。
      - 特許の取得は会社の権利の行使であり、従業員への相当の利益の付与とは別に必要です。
      - 相当の利益を受ける権利は、従業員保護のために認められたもので、放棄させる定めは認められません。
    know: 職務発明は「権利の帰属（事前の定めで使用者に原始帰属）」と「従業員の相当の利益」の2点で理解する。2015 年の法改正で原始帰属の仕組みが明文化され、対価の概念も「相当の金銭」から「相当の利益」に広がった。
