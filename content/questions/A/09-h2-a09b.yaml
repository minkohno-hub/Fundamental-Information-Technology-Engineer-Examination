  method: 独立レビュー担当が解答を伏せて解き直し、操作列とジャーナルを再実行して全問の誤答の検証と既存問題との重複確認を実施
questions:
  - id: A09-601
    topic: 9-4-1
    diff: 3
    q: |
      あるトランザクションが，データ A，B，C を更新する。ロックの獲得を lock(X)，解放を unlock(X) と表すとき，2相ロックプロトコルに従っているロック操作の順序はどれか。
    c:
      - lock(A) → lock(B) → A を更新 → B を更新 → unlock(A) → unlock(B) → lock(C) → C を更新 → unlock(C)
      - lock(A) → A を更新 → unlock(A) → lock(B) → B を更新 → unlock(B) → lock(C) → C を更新 → unlock(C)
      - lock(A) → lock(B) → A を更新 → unlock(A) → lock(C) → B を更新 → C を更新 → unlock(B) → unlock(C)
      - lock(A) → lock(B) → A を更新 → lock(C) → B を更新 → C を更新 → unlock(C) → unlock(A) → unlock(B)
    a: エ
    scope: 同時実行制御（排他制御）の項目にある2相ロックの理解。ロックの獲得と解放の順序規則だけで判定でき、範囲内の知識で解答できる。
    prereq: 専有ロックの意味と、ロックを獲得してから更新することの理解
    hard: 4つの操作列で最初の unlock の位置を見比べ、それ以降に lock がないかを順に確認する必要がある。個別のロックが正しく使われていても全体では違反する点が紛らわしい。
    exp: |
      2相ロックプロトコルは、トランザクションを「ロックを獲得するだけの成長相」と「ロックを解放するだけの縮退相」に分け、最初の unlock を実行した後は新たな lock を一切行わない規則です。判定は「最初の unlock より後ろに lock があるか」を見ます。
      | 操作列 | 最初の unlock の位置 | それ以降の lock |
      | --- | --- | --- |
      | 1番目 | 7番目（unlock(C)） | なし → 適合 |
      | 2番目 | 4番目（unlock(A)） | lock(C) あり → 違反 |
      | 3番目 | 3番目（unlock(A)） | lock(B) あり → 違反 |
      | 4番目 | 5番目（unlock(A)） | lock(C) あり → 違反 |
      1番目は更新と lock が交互に現れますが、unlock が最後にまとまっているので成長相と縮退相が分かれており、2相ロックに従います。
    why:
      - A と B の組、C の単独という2つの塊に分けており、それぞれは2相でも全体として unlock の後に lock があるため違反です。
      - 1件ごとにロックと解放を繰り返す方式で、データごとには排他できても、解放後に別のロックを獲得しているので2相ではありません。
      - A を解放した後に C をロックしており、縮退相に入ってからロックを獲得しているので違反です。「lock をまとめて先に行えば良い」と誤解し、途中の unlock の位置を見落としやすい選択肢です。
      - 正解です。最初の unlock より前にすべての lock を獲得しており、縮退相では lock を行っていません。
    know: 2相ロックは直列化可能性（同時実行しても、いずれかの直列実行と同じ結果になること）を保証しますが、デッドロックの発生は防げません。分散データベースの2相コミットメントとは別の概念なので混同しないこと。
    terms:
      - 2相ロック
      - 専有ロック
      - 排他制御
  - id: A09-602
    topic: 9-4-1
    diff: 4
    q: |
      次の表は，ある時点での各トランザクションのロックの保持状況と，待ち状態になっている要求を示す。専有ロックは他のトランザクションの共有ロック・専有ロックのいずれとも両立せず，共有ロックどうしは両立する。トランザクションはコミットまでロックを解放しない。

      | トランザクション | 保持しているロック | 待っている要求 |
      | --- | --- | --- |
      | T1 | X に専有 | Y の専有ロック |
      | T2 | Y に専有 | Z の専有ロック |
      | T3 | Z に共有 | W の専有ロック |
      | T4 | W に専有 | X の共有ロック |
      | T5 | V に専有 | X の共有ロック |

      デッドロックの原因となっている循環待ちを構成しているトランザクションの組合せはどれか。
    c:
      - T1，T2，T3，T4
      - T1，T2，T3，T4，T5
      - T1，T2，T4
      - T2，T3，T4，T5
    a: ア
    scope: 同時実行制御（排他制御）のうち、専有ロック・共有ロックの両立性とデッドロック（循環待ち）の判定。ロックの両立表だけを使って判断できる。
    prereq: 共有ロックと専有ロックの両立性、デッドロックが循環待ちで起きること
    hard: 各要求が「どのトランザクションを待っているか」を両立性から導き、待ちの連鎖をたどって閉路を見つける2段階の推論が必要。閉路に入らず待たされているだけの T5 を含めてしまいやすい。
    exp: |
      各要求について、誰が待たせているかを両立性から決めます。
      | 待つ側 | 要求 | 待たせている側 |
      | --- | --- | --- |
      | T1 | Y の専有 | T2（Y を専有中） |
      | T2 | Z の専有 | T3（Z を共有中。専有は共有と両立しない） |
      | T3 | W の専有 | T4（W を専有中） |
      | T4 | X の共有 | T1（X を専有中。共有は専有と両立しない） |
      | T5 | X の共有 | T1（X を専有中） |
      T1→T2→T3→T4→T1 と待ちが一巡しており、この4件が循環待ち（デッドロック）です。T5 は T1 を待っているだけで、T5 を待っているトランザクションはなく閉路には入りません。デッドロックが解消され T1 がコミットすれば T5 は進めます。
    why:
      - 正解です。T1→T2→T3→T4→T1 の閉路を構成する4件です。
      - T5 も待ち状態ですが、待っている相手の T1 は閉路の中にいるだけで、T5 自体は誰からも待たれていません。「待ち状態＝デッドロック」と考える誤りです。
      - T3 を抜いてしまう誤りです。T2 の専有要求は T3 が持つ共有ロックと両立しないので、T2 は T3 を待っており、T3 も閉路の一員です。
      - T1 を除き T5 を加えた組合せで、T4 が待つ X の専有者が T1 であることを見落としています。T4 の待ち先は T5 ではなく T1 です。
    know: デッドロックの検出は、トランザクションの待ち関係を有向グラフにして閉路を探す方法が代表的です。検出後は閉路中のいずれかをロールバックして解消します。共有ロックを持つ側が専有ロック要求を待たせる点が見落としやすいポイントです。
    terms:
      - デッドロック
      - 専有ロック
      - 共有ロック
  - id: A09-603
    topic: 9-4-1
    diff: 3
    q: |
      二つのトランザクション T1，T2 が，同じ行 R を読み取ってから更新する処理を並行して実行する。DBMS は，読取り時に共有ロック，更新時に専有ロックを要求し，ロックはコミットまで保持する。次の順序で操作が発行されたときの結果と，その回避策の組合せとして，適切なものはどれか。

      | 順序 | トランザクション | 操作 |
      | --- | --- | --- |
      | 1 | T1 | R を読み取る |
      | 2 | T2 | R を読み取る |
      | 3 | T1 | R を更新する |
      | 4 | T2 | R を更新する |
    c:
      - 更新の消失が発生する。更新時の専有ロックを共有ロックに変更すれば避けられる。
      - デッドロックは発生せず，T2 の更新が T1 のコミットまで待たされるだけである。
      - デッドロックが発生する。更新するつもりの読取りでは，最初から専有ロックを要求する。
      - デッドロックが発生する。ロックの粒度を行から表に変えれば避けられる。
    a: ウ
    scope: 同時実行制御（排他制御）の共有ロックと専有ロックの両立性、ロックによるデッドロックの発生条件。範囲内の知識だけで解答できる。
    prereq: 共有ロックどうしは両立し、専有ロックは他のロックと両立しないこと
    hard: 手順3の時点で T1 が専有ロックに昇格できない理由を、T2 の共有ロックとの両立性から導く必要がある。ロック粒度や共有ロックへの変更など、一見もっともらしい誤った対策が並ぶ。
    exp: |
      手順1、2で T1、T2 とも R の共有ロックを保持します。
      手順3で T1 が専有ロックを要求しますが、T2 が共有ロックを保持している間は両立しないため T1 は T2 の解放を待ちます。
      手順4で T2 も専有ロックを要求しますが、今度は T1 の共有ロックが邪魔になり T2 は T1 を待ちます。
      T1 は T2 を、T2 は T1 を待つ循環待ちとなり、デッドロックが発生します（ロック昇格によるデッドロック）。
      回避策は、更新が予定される読取りの時点で専有ロックを要求することです。そうすれば手順2の T2 の読取りが T1 のコミットまで待たされるだけで、循環待ちは生じません。
    why:
      - 専有ロックを共有ロックにすると、2人が同時に更新できてしまい、更新の消失が防げなくなります。この処理でロックが原因で起きるのは更新の消失ではなくデッドロックです。
      - T1 のほうが先に更新を要求したので T1 が先に進めると考える誤りです。T2 の共有ロックが残っている限り T1 は専有ロックを得られません。
      - 正解です。昇格要求どうしが互いの共有ロックに阻まれて循環待ちになり、最初から専有ロックを取れば回避できます。
      - デッドロックが起きる点は合っていますが、表単位にしても共有ロックと専有ロックの両立性は変わらないため、同じ循環待ちが起きます。粒度の変更は回避策になりません。
    know: 更新目的の読取りで専有ロックを取る方法のほか、ロックの待ち時間に上限を設けて超えたらロールバックする方法、デッドロックを検出して一方を強制ロールバックする方法もあります。ロック粒度を粗くすると同時実行性が下がる点にも注意します。
    terms:
      - デッドロック
      - 共有ロック
      - 専有ロック
      - ロック粒度
  - id: A09-604
    topic: 9-4-1
    diff: 3
    q: |
      注文表に対して，次のようにトランザクション T1，T2 が実行された。T1 の最初の問合せで取得した3行の値は，T2 によって変更されていない。T1 の2回目の問合せ結果が1回目と異なった現象の名称と，その原因の説明の組合せとして，適切なものはどれか。

      | 順序 | T1 | T2 |
      | --- | --- | --- |
      | 1 | 注文日が 10月1日の件数を数える（結果は 3） | |
      | 2 | | 注文日が 10月1日の行を1行挿入して COMMIT |
      | 3 | 注文日が 10月1日の件数を数える（結果は 4） | |
    c:
      - ノンリピータブルリード。T1 が読み取った行の値を T2 が変更したため。
      - ロストアップデート。T1 と T2 の更新が互いに上書きされたため。
      - ダーティリード。T1 が T2 のコミット前の変更を読み取ったため。
      - ファントムリード。既存の行へのロックでは，後から挿入される行を保護できなかったため。
    a: エ
    scope: 同時実行制御（排他制御）と ACID 特性の独立性に関する、同時実行時に起こる読取り異常の識別。事象の定義だけで判定できる。
    prereq: ダーティリード、ノンリピータブルリード、ファントムリードの定義
    hard: 同じ検索条件の結果が変わるという共通の見かけの現象から、「既存行の値の変更」か「新しい行の出現」かを区別する必要がある。ノンリピータブルリードと取り違えやすい。
    exp: |
      同じ条件の問合せを同一トランザクション内で繰り返したとき、結果の行の集合が変わる現象をファントムリードといいます。問題の T1 が最初に読んだ3行は T2 に変更されておらず、T2 が新しい行を挿入してコミットしたことで、2回目に4行目が「幻のように」現れています。
      | 現象 | 内容 |
      | --- | --- |
      | ダーティリード | 他のトランザクションの未コミットの変更を読む |
      | ノンリピータブルリード | 既に読んだ行が他のトランザクションの変更で書き換わる |
      | ファントムリード | 条件に合う行が増減する（挿入・削除） |
      行ごとの共有ロックは既存の行にしかかからないので挿入された行を守れず、防ぐには表やキー範囲に対するロックなど、より強い分離が必要です。
    why:
      - 既に読んだ行の値が書き換わる現象です。問題文に「3行の値は変更されていない」とあるので該当しません。件数が変わるだけで同じ現象と考える誤りです。
      - ロストアップデートは同じデータへの更新が上書きされて失われる現象です。この例は T1 が読み取るだけで、更新の競合はありません。
      - T2 は挿入後に COMMIT 済みで、T1 の2回目の問合せはコミット後に行われています。未コミットのデータを読んだわけではないのでダーティリードではありません。
      - 正解です。同じ検索条件で行数が変わっており、既存行を変更したのではなく新たな行が現れたのでファントムリードです。
    know: 分離レベルを上げるほど、ダーティリード、ノンリピータブルリード、ファントムリードの順に防止でき、その分だけ同時実行性は下がります。独立性の完全な確保が直列化可能な状態です。
    terms:
      - ファントムリード
      - ノンリピータブルリード
      - ダーティリード
      - 独立性
  - id: A09-605
    topic: 9-4-3
    diff: 2
    q: |
      次の事象のうち，トランザクションの ACID 特性の耐久性（Durability）が満たされなかったために起きたと考えられるものはどれか。
    c:
      - 振替処理のコミット完了を利用者に通知した直後に電源が切れ，再起動すると，コミット済みの振替内容が失われていた。
      - 二つの振替処理を同時に実行したとき，一方が他方の処理途中の残高を読み取って計算した。
      - 振替処理の途中で障害が発生し，出金の更新だけが反映されて入金の更新が反映されなかった。
      - 在庫数の更新後に，在庫数が負の値になっていた。
    a: ア
    scope: トランザクション管理に含まれる ACID 特性（原子性、一貫性、独立性、耐久性）の各特性と、違反事例の対応づけ。
    prereq: ACID 特性の4つの性質の定義
    hard: 4つの事例がいずれも障害や同時実行に関する話であり、症状から性質を正しく対応づける必要がある。
    exp: |
      耐久性は、いったんコミットされたトランザクションの結果は、その後に障害が起きても失われないという性質です。コミット通知の後に内容が失われた事例が耐久性の違反です。DBMS は更新後ログをコミット時にディスクへ書き出すことで、障害後もロールフォワードで結果を復元して耐久性を保ちます。
      他の事例は次の特性に対応します。
      | 事例 | 該当する特性 |
      | --- | --- |
      | 出金だけ反映され入金が反映されない | 原子性（全部か皆無か） |
      | 在庫数が負になる | 一貫性（整合性制約を保つ） |
      | 他の処理の途中状態を読む | 独立性（互いに干渉しない） |
    why:
      - 正解です。コミット済みの結果が障害後に失われているので、耐久性の違反です。
      - 他の処理の途中の値を読んでいるので、同時実行の処理が互いに影響し合わないという独立性の違反です。
      - 処理の一部だけが反映されており、全部実行か全く実行されないかのどちらかであるべき原子性の違反です。障害が起きたことに引きずられて耐久性と答える誤りです。
      - 在庫数が負にならないという整合性制約を満たしていないので、一貫性の違反に当たります。
    know: ACID 特性は、原子性（Atomicity）、一貫性（Consistency）、独立性（Isolation）、耐久性（Durability）の頭文字です。障害に関係するのは原子性と耐久性で、原子性はコミット前の障害に、耐久性はコミット後の障害に対応します。
    terms:
      - ACID特性
      - 耐久性
      - 原子性
      - 一貫性
      - 独立性
  - id: A09-606
    topic: 9-4-2
    diff: 2
    q: |
      口座 A から口座 B へ 10,000 円を振り替えるトランザクション（A の残高を減らし，B の残高を増やして COMMIT）を実行中，A の更新を行い，その更新内容がディスク上のデータベースにも書き出された後，B の更新前に DBMS が異常終了した。再起動したときの DBMS の回復処理として，適切なものはどれか。
    c:
      - 更新前ログを用いて A の更新を取り消し，トランザクションの開始前の状態に戻す。
      - B の更新処理を DBMS が自動的に続行し，トランザクションを完了させる。
      - 更新後ログを用いて A の更新を再度反映させ，A の減額を確定させる。
      - A の更新はディスクに残っているので，そのままにしておく。
    a: ア
    scope: 障害回復のうち、コミット前に障害が起きたトランザクションに対するバックワードリカバリ（ロールバック）とログの使い分け。
    prereq: 更新前ログと更新後ログの役割、コミット前後の処理の違い
    hard: 更新がディスクに反映済みで一見正しく見える状況から、コミット前の障害のため原子性を守るために取り消すという判断が必要。
    exp: |
      このトランザクションはコミットされる前に障害で中断されたので、原子性により「全く実行されなかった」状態に戻す必要があります。A の更新はすでにディスクに書き出されているため、更新前ログ（更新前の値）を使って A の残高を元に戻すバックワードリカバリ（ロールバック）を行います。
      一方、更新後ログを使って更新を再現するロールフォワードは、コミット済みなのにディスクへ反映されていない更新を回復するための処理で、未コミットの更新には使いません。
    why:
      - 正解です。未コミットのトランザクションは更新前ログでロールバックし、原子性を保ちます。
      - DBMS はアプリケーションの処理の続きを知らず、中断した処理を自動的に再開する機能はありません。再実行するのは利用者側の役割です。
      - 更新後ログによるロールフォワードは、コミット済みのトランザクションが対象です。未コミットの更新を確定させると A だけが減る不整合になります。
      - 更新がディスクに残っていると、振替の片方だけが反映された不整合な状態になります。ディスクにあるから正しいとは限りません。
    know: 障害回復では、コミット前のトランザクションは更新前ログでロールバック、コミット済みで反映が不確実なトランザクションは更新後ログでロールフォワードします。再起動後に行うこれらの回復処理をウォームスタートの回復といいます。
    terms:
      - 更新前ログ
      - 更新後ログ
      - ロールバック
      - 原子性
  - id: A09-607
    topic: 9-4-2
    diff: 3
    q: |
      DBMS が時刻 tf に異常終了した。直前のチェックポイントの時刻は tc であり，チェックポイント時には，それ以前にコミットされた更新はすべてディスク上のデータベースに反映されている。障害発生までの各トランザクションの状況は次の表のとおりである。再起動時の障害回復で，更新後ログによるロールフォワードの対象と，更新前ログによるロールバックの対象の組合せとして，適切なものはどれか。ここで，T6 のロールバックは障害の前に完了している。

      | トランザクション | 開始 | 終了 |
      | --- | --- | --- |
      | T1 | tc より前 | tc より前にコミット |
      | T2 | tc より前 | tc 以後，tf より前にコミット |
      | T3 | tc より前 | tf の時点で未終了 |
      | T4 | tc 以後 | tf より前にコミット |
      | T5 | tc 以後 | tf の時点で未終了 |
      | T6 | tc 以後 | tf より前にロールバック完了 |
    c:
      - ロールフォワード：T1，T2，T4　ロールバック：T3，T5
      - ロールフォワード：T2，T4　ロールバック：T3，T5，T6
      - ロールフォワード：T2，T4　ロールバック：T3，T5
      - ロールフォワード：T4　ロールバック：T3，T5
    a: ウ
    scope: 障害回復のうち、チェックポイントを使ったロールフォワード・ロールバックの対象トランザクションの判定。ログとチェックポイントの基本的な使い方で解ける。
    prereq: チェックポイントの意味、コミット済みか未コミットかによる回復方法の違い
    hard: 開始時刻・終了時刻とチェックポイントの位置関係から、6件それぞれに必要な処理（なし／REDO／UNDO）を判断する多件の場合分けが必要。
    exp: |
      チェックポイント以前にコミットされた更新はデータベースに反映済みなので、回復は不要です。回復の対象は、チェックポイント以後に障害までの間で影響が残る可能性のあるトランザクションです。
      | T | 状況 | 回復処理 |
      | --- | --- | --- |
      | T1 | tc 前にコミット | 不要（反映済み） |
      | T2 | tc 以後にコミット | ロールフォワード（更新後ログ） |
      | T3 | 未コミットで障害 | ロールバック（更新前ログ） |
      | T4 | tc 以後にコミット | ロールフォワード |
      | T5 | 未コミットで障害 | ロールバック |
      | T6 | 障害前にロールバック完了 | 不要 |
      T2 は tc より前に開始していても、コミットが tc 以後なので反映が不確実であり、ロールフォワードが必要です。
    why:
      - T1 はチェックポイント以前にコミット済みで、更新はデータベースに反映済みです。チェックポイントの意味を取り違え、コミットしたものはすべて REDO とする誤りです。
      - T6 はロールバックが障害の前に完了しているので、再起動時の処理は不要です。「ロールバック済み」を未終了と同じに扱った誤りです。
      - 正解です。tc 以後にコミットした T2、T4 がロールフォワード、未コミットの T3、T5 がロールバックの対象です。
      - T2 が漏れています。tc より前に開始したことだけを見て対象外にしていますが、コミットは tc 以後なので反映が保証されず、ロールフォワードが必要です。
    know: チェックポイントは、バッファ上の更新内容をディスクに書き出し、その時点の状態をログに記録する仕組みです。再起動時に読み返すログの範囲を最新のチェックポイント以降に絞れるため、回復時間を短縮できます。
    terms:
      - チェックポイント
      - ロールフォワード
      - ロールバック
      - ジャーナル
  - id: A09-608
    topic: 9-4-2
    diff: 4
    q: |
      次のジャーナル（更新前の値と更新後の値を記録したもの）が残った状態で DBMS が異常終了した。チェックポイント時点のデータベースは X＝100，Y＝200，Z＝300 であり，障害時点でディスク上の値は不定である。再起動時の障害回復を行った後の X，Y，Z の値の合計はどれか。ここで，回復は，コミット済みのトランザクションのログを先頭から順に再適用し，未コミットのトランザクションは更新を逆順にすべて取り消すものとする。

      | 番号 | 記録内容 |
      | --- | --- |
      | 1 | チェックポイント |
      | 2 | T1 開始，T2 開始 |
      | 3 | T1 が X を更新（前 100，後 150） |
      | 4 | T2 が Y を更新（前 200，後 260） |
      | 5 | T1 コミット |
      | 6 | T3 開始 |
      | 7 | T3 が Z を更新（前 300，後 330） |
      | 8 | T2 が Y を更新（前 260，後 290） |
      | 9 | T3 コミット |
      | 10 | T4 開始，T4 が X を更新（前 150，後 170） |
      | 11 | 障害発生 |
    c:
      - '790'
      - '650'
      - '680'
      - '740'
    a: ウ
    scope: 障害回復のうち、更新前ログ・更新後ログを使ったロールフォワードとロールバックの結果の判定。ログの適用手順を追うだけで解け、範囲内である。
    prereq: 更新前ログと更新後ログの意味、コミット済み・未コミットで回復方法が異なること
    hard: コミット済み2件の再適用と、未コミット2件の取消し（同じデータへの複数回更新を逆順に戻す）を、データごとに追跡して最終値を出す多段階の処理が必要。
    verify:
      manual: コミット済み T1，T3 を再適用し X＝150，Z＝330。未コミット T2 は Y を 290→260→200 と逆順に戻して 200，T4 は X を 170→150 に戻す。X 150，Y 200，Z 330 の合計は 680 と別途確認。取消しが最後の1件だけなら Y＝260 で 740，取消しなしなら 170＋290＋330＝790，T1 のみ再適用なら 150＋200＋300＝650。
    exp: |
      コミットされたトランザクションは T1、T3、未コミットは T2、T4 です。
      | データ | 処理 | 回復後の値 |
      | --- | --- | --- |
      | X | T1 のコミット済み更新を再適用して 150。T4（未コミット）の 150→170 は取り消して 150 に戻す | 150 |
      | Y | T2（未コミット）の 200→260→290 を逆順に取り消す（290→260→200） | 200 |
      | Z | T3 のコミット済み更新を再適用 | 330 |
      合計は 150＋200＋330＝680 です。
    why:
      - 未コミットの T2、T4 の更新を取り消さず、すべての更新を残した場合（170＋290＋330）の値です。回復処理にロールバックがない誤りです。
      - T1 のコミット済み更新だけを再適用し、T3 の更新を落とした値（150＋200＋300）です。T3 もコミット済みなので Z は 330 になります。
      - 正解です。X＝150、Y＝200、Z＝330 で合計 680 です。
      - T2 の更新を最後の1件（290→260）しか取り消さなかった値（150＋260＋330）です。同じトランザクションの更新は、逆順にすべて取り消す必要があります。
    know: ロールバックは、更新前ログを使って最後の更新から順にさかのぼって元に戻します。コミット済みのトランザクションの更新後ログはロールフォワードで先頭から順に再適用します。ログを書いてからデータを書く（WAL）ことで、この回復が可能になります。
    terms:
      - 更新前ログ
      - 更新後ログ
      - ロールフォワード
      - ロールバック
      - チェックポイント
