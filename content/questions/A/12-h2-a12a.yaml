questions:
  - id: A12-701
    topic: 12-3-8-4
    diff: 2
    scope: 12-3-8-4 ソフトウェアユニットのテストの手法（同値分析法）。有効・無効同値クラスの切り出しとテストケース数の決定は、同値分割法の基本手順そのものでありシラバス範囲内。
    prereq: 同値分割法で有効同値クラスと無効同値クラスを区別する方法
    q: |
      入力項目「年齢」（整数）の仕様は次のとおりである。同値分割法でテストケースを設計するとき、すべての同値クラスを1回以上テストするために必要な最小のテストケース数はいくらか。ここで、無効な入力のテストでは、1つのテストケースに含める無効な入力は1種類だけとする。

      - 0〜17 は「未成年」、18〜64 は「一般」、65〜120 は「高齢」として受け付ける。
      - 負の値、121 以上の値、整数として解釈できない入力（文字列など）はエラーとする。
    c: ['6', '5', '4', '3']
    a: ア
    exp: |
      同値分割法では、入力を「同じ扱いになる値の集合」である同値クラスに分け、各クラスから代表値を1つ選んでテストします。
      - 有効同値クラスは 0〜17、18〜64、65〜120 の3つで、それぞれ1ケースずつ必要です。
      - 無効同値クラスは「負の値」「121 以上」「整数でない入力」の3つです。
      - 無効な入力を1つのケースに複数含めると、エラーの原因がどの入力か区別できず、エラー処理の確認が1つ分隠れてしまうため、無効クラスは1ケースにつき1つとします。
      したがって 3 + 3 = 6 ケースです。
    why:
      - 正解です。有効クラス3つと無効クラス3つで、合計6ケースになります。
      - 「整数でない入力」を無効クラスとして数え落とし、負の値と 121 以上の2つだけにした場合の値です。
      - 無効な入力をすべて1つのケースにまとめた場合（3 + 1）の値です。原因の切り分けができず不適切です。
      - 有効同値クラスの3つだけを数え、エラーになる無効クラスのテストを忘れた値です。
    know: 無効同値クラスは、1ケースに複数の無効値を混ぜない（エラー処理が互いに隠れるため）。有効クラスは複数の入力項目があれば1ケースで同時に代表できるが、無効クラスは個別に確認する。入力の型（数値以外）も無効クラスになる点を忘れやすい。
    terms: [同値分割, 同値クラス]
    verify: { value: '[[0,17],[18,64],[65,120]].length + ["負","上限超過","非整数"].length' }

  - id: A12-702
    topic: 12-3-8-4
    diff: 3
    scope: 12-3-8-4 ソフトウェアユニットのテストの手法（限界値分析法）。隣り合う同値クラスの境界でのテスト値の選び方は限界値分析法の基本であり範囲内。
    prereq: 限界値分析法で境界の両側の値をテストすること、同値クラスの隣接関係
    hard: 隣り合う有効クラスが境界を共有するため、クラスごとに数えると値が重複する。重複を除いて数える必要がある。
    q: |
      注文数量 q（整数）の仕様は次のとおりである。限界値分析法で、同値クラスどうしの各境界について、境界の両側の値（隣り合う2つのクラスの、境界に最も近い値）を1つずつテスト値とする。重複する値は1回だけ数えるとき、必要な最小のテスト値の個数はいくらか。

      | 数量 q | 扱い |
      | --- | --- |
      | 0 以下 | 受付不可 |
      | 1〜9 | 通常料金 |
      | 10〜50 | 割引料金 |
      | 51 以上 | 受付不可 |
    c: ['6', '8', '4', '3']
    a: ア
    exp: |
      同値クラスの境界は「0 と 1」「9 と 10」「50 と 51」の3か所です。限界値分析法では、各境界の両側の値をテストします。
      | 境界 | テスト値 |
      | --- | --- |
      | 受付不可と通常料金の間 | 0，1 |
      | 通常料金と割引料金の間 | 9，10 |
      | 割引料金と受付不可の間 | 50，51 |
      3か所×2値で、重複する値はないので 6 個です。
      有効クラスごとに「内側の端と外側の隣の値」を数えると、通常料金で 0，1，9，10、割引料金で 9，10，50，51 となり、9 と 10 が重複します。重複を除くと 6 個になります。
    why:
      - 正解です。境界3か所の両側の値 0，1，9，10，50，51 の6個です。
      - 有効クラスごとに4値ずつ（4 + 4）数え、隣接クラスで共有する 9 と 10 の重複を除いていない値です。
      - 全体の外側の端（0，1，50，51）だけを数え、通常料金と割引料金の境界（9，10）を落とした値です。
      - 境界の数（3か所）をそのままテスト値の個数としており、各境界の両側の値を数えていません。
    know: 限界値分析法は、同値クラスの境界でバグが出やすいことに着目し、境界値とそのすぐ外側（内側）の値を選ぶ。隣り合う有効クラス（9 と 10）の境界も境界であり、見落としやすい。境界値に「プラスマイナス1」を含める流儀もあるが、問題文の定義に従う。
    terms: [限界値分析, 同値クラス]
    verify: { value: '(() => { const cl = [[-1e9, 0], [1, 9], [10, 50], [51, 1e9]]; const s = new Set(); for (let i = 0; i < cl.length - 1; i++) { s.add(cl[i][1]); s.add(cl[i + 1][0]); } return s.size; })()' }

  - id: A12-703
    topic: 12-3-8-4
    diff: 3
    scope: 12-3-8-4 ソフトウェアユニットのテストの手法（条件網羅、判定条件網羅）。与えられたテストケースがどの網羅基準を満たすかの判定は両基準の定義の適用で、範囲内。
    prereq: 条件網羅と判定条件網羅の定義、論理式 A and (B or C) の評価
    hard: 3つの条件それぞれの真偽と判定全体の真偽を別々に集計する必要があり、「B と C は両方の値をとる」ことに引きずられて条件 A の偏りを見落としやすい。
    q: |
      判定条件「A and (B or C)」（A，B，C は互いに独立な単一の条件で、すべて毎回評価されるものとする）に対して、次の3つのテストケースを実施した。このテストについて適切な記述はどれか。

      | テストケース | A | B | C |
      | --- | --- | --- | --- |
      | 1 | 真 | 真 | 偽 |
      | 2 | 真 | 偽 | 真 |
      | 3 | 真 | 偽 | 偽 |
    c:
      - 判定条件網羅は満たすが、条件網羅は満たさない。
      - 条件網羅は満たすが、判定条件網羅は満たさない。
      - 条件網羅と判定条件網羅の両方を満たす。
      - 条件網羅も判定条件網羅も満たさない。
    a: ア
    exp: |
      まず判定全体 A and (B or C) の値を求めます。
      | テストケース | B or C | 判定全体 |
      | --- | --- | --- |
      | 1 | 真 | 真 |
      | 2 | 真 | 真 |
      | 3 | 偽 | 偽 |
      判定全体は真と偽の両方になるので、判定条件網羅は満たします。
      一方、条件網羅は個々の条件 A，B，C がそれぞれ真と偽の両方をとることを求めます。B（真，偽，偽）と C（偽，真，偽）は両方の値をとりますが、A は3ケースとも真で、偽になるケースがありません。よって条件網羅は満たしません。
    why:
      - 正解です。判定全体は真・真・偽で両方の値をとりますが、条件 A が一度も偽になりません。
      - B と C だけを見て条件網羅を満たしていると誤解し、さらに判定全体が偽になるケース3を見落とした場合の結論です。
      - B と C が真偽の両方をとることから、条件 A も同様に満たされていると思い込んだ誤りです。A は常に真です。
      - 判定全体が真と偽の両方になるので、判定条件網羅は満たします。満たさないとするのは判定結果の確認漏れです。
    know: 条件網羅は「個々の条件」、判定条件網羅は「判定全体」の真偽を問う別の基準で、一方が満たされても他方が満たされるとは限らない。複数の条件のうち1つでも片側の値しかとらなければ条件網羅は不成立。
    terms: [条件網羅, 判定条件網羅]
    verify: { manual: '全ケースで A=真。B は 真,偽,偽、C は 偽,真,偽。判定 A and (B or C) は ケース1=真 and (真 or 偽)=真、ケース2=真 and (偽 or 真)=真、ケース3=真 and (偽 or 偽)=偽。判定は真偽の両方、A は真のみであることを確認。' }

  - id: A12-704
    topic: 12-2-6-3
    diff: 4
    scope: 12-2-6-3 ソフトウェアユニットのテストの設計（ホワイトボックステスト）と 12-3-8-4 命令網羅・判定条件網羅。入れ子の分岐に対して網羅率を求める作業は両基準の定義の適用であり範囲内。
    prereq: 命令網羅率と判定条件網羅率の定義、入れ子の if の実行経路の追跡
    hard: 入れ子のため、外側の判定が偽のときは内側の判定が評価されない。複合条件も判定全体で真偽を数える。命令網羅率と判定条件網羅率という2つの指標を別々に集計する。
    q: |
      次のプログラムに対して、3つのテストケースを実施した。命令網羅率と判定条件網羅率の組合せとして、適切なものはどれか。ここで、命令は r への代入文 3つとし、判定条件網羅率は「判定1〜3の真偽（計6通り）のうち実行された割合」とする。判定1（a > 0 and b > 0）は、全体の真偽で数える。

      ```
      if (a > 0 and b > 0)       // 判定1
        if (c > 0)               // 判定2
          r ← 1
        else
          r ← 2
        endif
      else
        if (d > 0)               // 判定3
          r ← 3
        endif
      endif
      ```

      | テストケース | a | b | c | d |
      | --- | --- | --- | --- | --- |
      | 1 | 1 | 1 | 0 | 0 |
      | 2 | 1 | 0 | 1 | 1 |
      | 3 | 0 | 1 | 1 | 0 |
    c:
      - 命令網羅率 約 67%，判定条件網羅率 約 83%
      - 命令網羅率 約 67%，判定条件網羅率 約 67%
      - 命令網羅率 100%，判定条件網羅率 約 83%
      - 命令網羅率 約 33%，判定条件網羅率 50%
    a: ア
    exp: |
      各テストケースの実行経路を追います。
      | ケース | 判定1 | 判定2 | 判定3 | 実行される代入 |
      | --- | --- | --- | --- | --- |
      | 1 | 真（a>0, b>0） | 偽（c=0） | 評価されない | r ← 2 |
      | 2 | 偽（b=0） | 評価されない | 真（d=1） | r ← 3 |
      | 3 | 偽（a=0） | 評価されない | 偽（d=0） | なし |
      命令網羅率は、実行された代入が r ← 2 と r ← 3 の2つなので 2/3（約 67%）です。r ← 1 は判定2が真になるケース（a>0, b>0, c>0）がないので実行されません。
      判定条件網羅率は、判定1の真・偽、判定2の偽、判定3の真・偽の5通りなので 5/6（約 83%）です。判定2の真だけが未実行です。
    why:
      - 正解です。命令は2/3、判定は判定2の真を除く5/6です。
      - 判定は5通りが実行されており、4通りで数えているのは、判定1の真偽を条件ごとに数えるなど集計を誤った値です。
      - ケース2・3で判定1が偽のときも r ← 1 の行が実行されると誤解し、全命令を実行済みとした値です。r ← 1 は未実行です。
      - 実行された命令・判定の数を過小に数えた値です。ケース1と2だけで命令は2つ、判定は5通りが実行されます。
    know: 命令網羅100%でも判定条件網羅100%とは限らず、逆に判定条件網羅100%なら（到達可能な命令は）命令網羅も満たす。入れ子の判定は、外側の結果次第で評価されない点と、複合条件は判定全体の真偽で数える点に注意する。
    terms: [命令網羅, 判定条件網羅, ホワイトボックステスト]
    verify: { manual: '全ケースを独立に追跡。ケース1 判定1=真, 判定2=偽 → r←2。ケース2 判定1=偽(b=0), 判定3=真 → r←3。ケース3 判定1=偽(a=0), 判定3=偽。実行代入={r←2, r←3}=2/3=66.7%。実行判定={判1真,判1偽,判2偽,判3真,判3偽}=5/6=83.3%。' }

  - id: A12-705
    topic: 12-3-8-4
    diff: 4
    scope: 12-3-8-4 ソフトウェアユニットのテストの手法（複数条件網羅）。条件間に依存関係があるときに実現可能な真偽の組合せを数える作業は、複数条件網羅の定義の適用で範囲内。
    prereq: 複数条件網羅の定義（条件の真偽の全組合せ）、数値の範囲条件の論理
    hard: 条件 A と B が同じ変数 x に依存するため、理論上の 2³ 通りのうち実現できない組合せを取り除く必要がある。
    q: |
      判定条件「(x ≧ 10 and x ≦ 20) or y = 0」（x，y は整数で、互いに独立に値を設定できる）について、複数条件網羅を満たす最小のテストケース数はいくらか。ここで、複数条件網羅は、3つの単一条件（A：x ≧ 10、B：x ≦ 20、C：y = 0）の真偽の実現可能な組合せをすべて実行することとする。
    c: ['6', '8', '4', '3']
    a: ア
    exp: |
      3つの条件の真偽の組合せは理論上 2³ = 8 通りですが、A と B は同じ変数 x に依存するので、実現できない組合せがあります。
      - A が偽（x < 10）かつ B が偽（x > 20）となる x は存在しません。
      - したがって (A, B) の組合せのうち実現できるのは、（真，真）：x が 10〜20、（真，偽）：x > 20、（偽，真）：x < 10 の3通りです。
      - y = 0 の条件 C は x と独立なので真偽の2通りです。
      実現可能な組合せは 3 × 2 = 6 通りで、複数条件網羅に必要な最小のテストケース数は 6 です。
    why:
      - 正解です。(A, B) の実現可能な3通りと C の2通りの積で 6 です。
      - 条件の独立性を前提に 2³ を計算した値です。A と B が同時に偽になる組合せは実現できません。
      - 2つの条件の組合せ数（2²）と同じ値で、3つの条件のうち実現可能な組合せを数えていません。
      - (A, B) の実現可能な3通りだけを数え、独立な条件 C の真偽を掛け合わせていない値です。
    know: 複数条件網羅の最大ケース数は 2ⁿ（n は単一条件の数）だが、条件間に依存関係があれば実現可能な組合せだけが対象になる。範囲条件 x ≧ a and x ≦ b のように同じ変数を使う条件の組は特に注意する。
    terms: [複数条件網羅, 条件網羅]
    verify: { value: '(() => { const s = new Set(); for (let x = -50; x <= 50; x++) for (const y of [0, 1]) s.add([x >= 10, x <= 20, y === 0].join()); return s.size; })()' }

  - id: A12-706
    topic: 12-3-6
    diff: 2
    scope: 12-3-6 コードレビュー（サイクロマティック複雑度）。制御フローグラフのノード・エッジ数から複雑度を求める M = E − N + 2 は範囲内の計算。
    prereq: 制御フローグラフの読み方、サイクロマティック複雑度の算出式 E − N + 2
    q: |
      ある関数の制御フローグラフは、ノード 1〜9 と次の11本の有向エッジで表される（連結で、入口はノード1、出口はノード9）。この関数のサイクロマティック複雑度はいくらか。

      | 始点 | 終点 |
      | --- | --- |
      | 1 | 2 |
      | 2 | 3 |
      | 2 | 4 |
      | 3 | 5 |
      | 4 | 5 |
      | 5 | 6 |
      | 6 | 2 |
      | 6 | 7 |
      | 7 | 8 |
      | 7 | 9 |
      | 8 | 9 |
    c: ['4', '2', '3', '20']
    a: ア
    exp: |
      サイクロマティック複雑度 M は、エッジ数 E、ノード数 N、連結成分数 P（1つの関数なら 1）を用いて M = E − N + 2P で求めます。
      - E = 11、N = 9、P = 1
      - M = 11 − 9 + 2 = 4
      確認のため判定ノード（出ていくエッジが2本のノード）を数えると、ノード 2、6、7 の3つで、M = 判定の数 + 1 = 4 と一致します。M は、基本経路網羅に必要な独立した経路の数でもあります。
    why:
      - 正解です。11 − 9 + 2 = 4 で、判定ノード3つ + 1 とも一致します。
      - E − N（= 2）を答えとしており、公式の + 2 を加え忘れた値です。
      - E − N + 1 と、2P ではなく 1 を加えた値です。公式は E − N + 2P です。
      - エッジ数とノード数を足した値（11 + 9）で、複雑度の算出式ではありません。
    know: M = E − N + 2P（P は連結成分数）。入口と出口が1つずつの構造化プログラムでは、M = 判定（2分岐）の数 + 1 でも求まる。エッジ数を数え間違えないよう、判定ノードの数で検算するとよい。
    terms: [サイクロマティック複雑度, 制御フローグラフ]
    verify: { value: '11 - 9 + 2 * 1' }

  - id: A12-707
    topic: 12-3-6
    diff: 3
    scope: 12-3-6 コードレビュー（サイクロマティック複雑度）。判定の数と複雑度の関係（M = 判定の数 + 1）から未知の分岐数を逆算する問題で、範囲内の考え方。
    prereq: M = 判定の数 + 1、複合条件と多分岐（case 文）の判定数の数え方
    hard: 複合条件を条件ごとに数え、n 分岐の case 文を n − 1 個の判定として数える規則を使って、複雑度から分岐数を逆算する。数え方の違いで答えが1ずつずれる。
    q: |
      あるプログラムのサイクロマティック複雑度は 10 である。このプログラムは、判定の数に 1 を加えた値を複雑度とし、次の規則で判定を数える。case 文のちょうど n 分岐（default を含む）であるとき、n はいくらか。

      - 複合条件（and や or で結ばれたもの）は、単一の条件ごとに1つの判定とする。
      - n 分岐の case 文は、n − 1 個の判定とする。
      - プログラムの構成は、単一の条件の if 文が2個、条件が A and B の if 文が1個、単一の条件の while 文が1個、case 文が1個である。
    c: ['5', '4', '6', '3']
    a: ア
    exp: |
      判定の数を規則に従って数えます。
      | 構成 | 判定の数 |
      | --- | --- |
      | 単一条件の if 文 2個 | 2 |
      | A and B の if 文 | 2（A と B） |
      | while 文 | 1 |
      | case 文（n 分岐） | n − 1 |
      M = 判定の数 + 1 = 2 + 2 + 1 + (n − 1) + 1 = n + 5 です。
      M = 10 より n + 5 = 10、n = 5 となります。
    why:
      - 正解です。M = n + 5 = 10 より n = 5 です。
      - case 文の判定数を n（n − 1 ではなく）として数え、M = n + 6 としたために1小さくなった値です。
      - 複合条件 A and B を1つの判定としか数えず、判定が1つ少ないとして逆算したために1大きくなった値です。
      - 判定に 1 を加える手順や複合条件の分を重ねて引きすぎた値で、規則どおりに数えると合いません。
    know: McCabe の複雑度は M = 判定の数 + 1（入口・出口が1つの場合）。複合条件を1つの判定とみなすか条件ごとに数えるかで値が変わるため、問題文の規則に従う。case 文は n 分岐で n − 1 個の判定に相当する。
    terms: [サイクロマティック複雑度]
    verify: { value: '10 - 1 - (2 + 2 + 1) + 1' }

  - id: A12-708
    topic: 12-1-7-8
    diff: 3
    scope: 12-1-7-8 その他の手法（決定表（デシジョンテーブル））。「-」（任意）を含む規則の展開と、漏れ・重複の検査は決定表の基本的な使い方で範囲内。
    prereq: 決定表の読み方、「-」（任意）の意味、条件の組合せ 2ⁿ 通り
    hard: 「-」を展開すると規則どうしが重複する。展開後の件数の合計だけを比べると漏れが隠れる点に気づく必要がある。
    q: |
      次の決定表は、3つの条件 C1〜C3（Y：成立、N：不成立、-：成立・不成立のどちらでもよい）の組合せに対する動作を定めたものである。条件の組合せ 2³ = 8 通りのうち、どの規則にも当てはまらない組合せはいくつあるか。

      | | R1 | R2 | R3 | R4 | R5 |
      | --- | --- | --- | --- | --- | --- |
      | C1 | Y | Y | N | N | - |
      | C2 | Y | N | Y | N | Y |
      | C3 | - | Y | - | Y | Y |
    c: ['2', '0', '3', '4']
    a: ア
    exp: |
      各規則の「-」を展開して、当てはまる組合せ（C1, C2, C3）を書き出します。
      | 規則 | 当てはまる組合せ |
      | --- | --- |
      | R1 | (Y,Y,Y)，(Y,Y,N) |
      | R2 | (Y,N,Y) |
      | R3 | (N,Y,Y)，(N,Y,N) |
      | R4 | (N,N,Y) |
      | R5 | (Y,Y,Y)，(N,Y,Y) |
      R5 の2つの組合せは R1、R3 と重複しているので、重複を除いた組合せは (Y,Y,Y)，(Y,Y,N)，(Y,N,Y)，(N,Y,Y)，(N,Y,N)，(N,N,Y) の6通りです。
      8 − 6 = 2 で、漏れているのは (Y,N,N) と (N,N,N) の2通りです。
    why:
      - 正解です。重複を除くと6通りで、(Y,N,N) と (N,N,N) の2通りが漏れています。
      - 展開した件数の合計が 2+1+2+1+2 = 8 なので漏れなしとした値です。重複を数えているため漏れが隠れています。
      - 8 − 5（規則の数）とした値です。1つの規則が複数の組合せを表す場合があるので、規則の数と組合せの数は一致しません。
      - 規則 R1〜R4 の列数が4つだから 8 − 4 としたような値で、「-」の展開と R5 を考慮していません。
    know: 決定表の検査は「-」を展開した組合せ集合で行う。規則が重複していても動作が同じなら矛盾ではないが、組合せの数の合計だけで網羅を判断してはいけない。漏れ（定義されていない組合せ）と矛盾（同じ組合せで動作が異なる）の両方を点検する。
    terms: [決定表]
    verify: { value: '(() => { const rules = [[1,1,2],[1,0,1],[0,1,2],[0,0,1],[2,1,1]]; let miss = 0; for (let m = 0; m < 8; m++) { const v = [(m >> 2) & 1, (m >> 1) & 1, m & 1]; if (!rules.some(r => r.every((x, i) => x === 2 || x === v[i]))) miss++; } return miss; })()' }
