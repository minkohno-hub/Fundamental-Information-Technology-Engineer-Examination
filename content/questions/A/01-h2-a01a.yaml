questions:
  - id: A01-501
    topic: 1-1-1
    diff: 1
    q: 8進数の小数 0.4 を10進数で表したものはどれか。
    c: ['0.4', '0.5', '0.125', '0.25']
    a: イ
    scope: 基礎理論の「離散数学（基数）」。n進数の小数部の各桁の重みが n⁻¹、n⁻² であることは、基数変換の基本として試験範囲内である。
    prereq: n進数の位取りの重み（小数部は n の負べき）を知っていること。
    exp: |
      8進数の小数第1位の重みは 8⁻¹＝1/8＝0.125 です。したがって 0.4₈ ＝ 4×(1/8) ＝ 0.5 となります。
      2進数の 0.1₂＝0.5 と同じく、「基数のべき乗の逆数」が各桁の重みになることを使います。
      検算：0.5 を8倍すると 4.0 で、整数部が 4 なので 8進で 0.4 に戻ります。
    why:
      - 8進数の数字をそのまま10進数の数字として読んでしまった誤りです。基数が違えば値も異なります。
      - 正解です。4×(1/8)＝0.5 です。
      - 小数第1位の重み 1/8 だけを答えた誤りです。係数の 4 を掛け忘れています。
      - 4×(1/16) の値で、16進数の重みと混同した誤りです。8進数の重みは 1/8 です。
    know: 整数部と同様に、小数部も基数のべき乗を重みとして位取りします。10進数の 0.5 は2進で 0.1、8進で 0.4、16進で 0.8 と、基数ごとに表記が変わります。
    terms: [基数変換]
    verify: { value: '4 / 8' }

  - id: A01-502
    topic: 1-1-1
    diff: 2
    q: 2進数 101101.011 を16進数で表したものはどれか。
    c: ['2D.6', '2D.3', 'B4.6', '55.3']
    a: ア
    scope: 基礎理論の「離散数学（基数）」。2進数と16進数の相互変換（4桁ずつの対応）は基数変換の標準的な技能で、試験範囲内である。
    prereq: 2進数4桁が16進数1桁に対応すること。
    hard: 整数部と小数部で4桁の区切り方向が逆であり、小数部の末尾に 0 を補う点を誤りやすい。
    exp: |
      小数点を基準に、整数部は右（小数点側）から、小数部は左（小数点側）から4桁ずつに区切ります。
      整数部 101101 → 0010｜1101 ＝ 2｜D、小数部 011 → 0110（右に 0 を補う）＝ 6 です。
      よって 2D.6₁₆ です。検算：2D.6₁₆ ＝ 2×16＋13＋6/16 ＝ 45.375、101101.011₂ ＝ 32＋8＋4＋1＋0.25＋0.125 ＝ 45.375 で一致します。
    why:
      - 正解です。整数部は左に、小数部は右に 0 を補って4桁にそろえます。
      - 小数部 011 を左に 0 を補って 0011 としてしまった誤りです。小数部は左（小数点側）が上位なので、補う 0 は右側です。0011 は 0.1875 になります。
      - 整数部を左から 1011｜01 と区切った誤りです（1011｜0100 ＝ B4）。整数部は小数点側（右）から区切ります。
      - 3桁ずつ区切って8進数として読んだ結果です。16進数への変換では4桁ずつに区切る必要があります。
    know: 2進→8進は3桁、2進→16進は4桁ずつ区切ります。区切りは常に小数点から外側へ向かって行い、足りない桁は整数部は左、小数部は右に 0 を補います。
    terms: [基数変換, 16進数]
    verify: { manual: '2D.6(16)=2*16+13+6/16=45.375、101101.011(2)=32+8+4+1+0.25+0.125=45.375 で一致。2D.3=45.1875、B4.6=180.375、55.3(16)=85.1875 で不一致を確認' }

  - id: A01-503
    topic: 1-1-1
    diff: 2
    q: |
      ある n 進数（n は 6 以上の整数）で表した次の加算が成り立っている。n はどれか。ここで、13、25、40 はいずれも n 進数である。

      13 ＋ 25 ＝ 40
    c: ['6進数', '7進数', '8進数', '9進数']
    a: ウ
    scope: 基礎理論の「離散数学（基数）」。n進数の位取りと桁上がりの理解は基数変換の基礎で、未知の基数を位取りの式から求める問題は範囲内である。
    prereq: n進数の位取り（各桁の重みが n のべき乗）と桁上がりの仕組み。
    hard: 10進数の筆算の感覚から離れ、位取りの式を立てて未知の基数を求める必要がある。
    exp: |
      n進数の 13 は n＋3、25 は 2n＋5、40 は 4n を表します（n≧6 なので各桁の数字はすべて有効）。
      加算の式は (n＋3)＋(2n＋5)＝4n、すなわち 3n＋8＝4n となり n＝8 です。
      別解：1の位は 3＋5＝8 で、結果の1の位が 0 なので 8 が n で割り切れて 1 桁上がります。n≧6 でこれを満たすのは n＝8 だけです。
      確認：8進数で 13₈＝11、25₈＝21、11＋21＝32＝40₈ です。
    why:
      - 6進数では 13₆＝9、25₆＝17 で合計 26 となり、40₆＝24 と一致しません。1の位 3＋5＝8 が 6 の倍数でなく、桁上がりの結果が 0 になりません。
      - 7進数では 13₇＝10、25₇＝19 で合計 29 となり、40₇＝28 と一致しません。1の位 3＋5＝8 は 7 で割ると余り 1 です。
      - 正解です。3n＋8＝4n より n＝8 です。
      - 9進数では 13₉＝12、25₉＝23 で合計 35 となり、40₉＝36 と一致しません。1の位 3＋5＝8 は9進では1桁で収まり、桁上がりしません。
    know: n進数の加算では、各桁の和が n 以上になったとき n を引いて上の桁へ1繰り上げます。未知の基数は、各桁を n の式に直して方程式にするか、1の位の桁上がり条件から絞り込みます。
    terms: [基数変換]
    verify: { value: '[...Array(30).keys()].find(n => n > 5 && (n + 3) + (2 * n + 5) === 4 * n)' }

  - id: A01-504
    topic: [1-1-4, 1-1-5]
    diff: 2
    q: |
      全体集合を {0, 1, 2, 3, 4, 5, 6, 7} とし、集合の要素 i をビット列の下位から i 番目のビット（最下位が 0 番目）で表す。要素が含まれるビットを 1 とする。
      集合 A ＝ 01011010、集合 B ＝ 00111100 のとき、「A に含まれるが B には含まれない要素」の集合を表すビット列はどれか。
    c: ['01100110', '00100100', '00011000', '01000010']
    a: エ
    scope: 基礎理論の「集合と命題」「論理演算」。差集合（A と B の補集合の積）をビット演算（論理積・否定）で表す考え方は、ビット列による集合表現として範囲内である。
    prereq: 論理積、否定、排他的論理和のビットごとの演算と、集合の和・積・差の意味。
    hard: 集合の差を、否定と論理積の組合せ（A AND (NOT B)）に翻訳して計算する必要があり、似た結果になる他の演算が誤答になる。
    exp: |
      「A に含まれ B に含まれない」は、各ビットで A が 1 かつ B が 0 であることなので、A AND (NOT B) で求まります。
      | 式 | ビット列 |
      | --- | --- |
      | A | 01011010 |
      | NOT B | 11000011 |
      | A AND (NOT B) | 01000010 |
      したがって要素 {1, 6} を表す 01000010 です。
    why:
      - A XOR B（どちらか一方だけに含まれる要素＝対称差）の結果です。B だけに含まれる要素も 1 になるので、差集合ではありません。
      - 逆向きの差（B に含まれ A に含まれない要素）B AND (NOT A) の結果です。A と B の順序を取り違えています。
      - A AND B（両方に含まれる要素＝積集合）の結果です。「B に含まれない」という条件が反映されていません。
      - 正解です。A AND (NOT B) ＝ 01000010 です。
    know: ビット列による集合表現では、和集合は OR、積集合は AND、補集合は NOT、差集合 A−B は A AND (NOT B)、対称差は XOR に対応します。順序のある差を XOR と混同しないよう注意します。
    terms: [ビット演算, ベン図]
    verify: { manual: 'JSで (0b01011010 & ~0b00111100 & 255) を2進表示すると 01000010。XOR=01100110、B-A=00100100、AND=00011000 を確認' }

  - id: A01-505
    topic: [1-1-2, 1-1-3]
    diff: 2
    q: |
      8ビットの2の補数で整数を表す。負の数 x の絶対値を、「全ビットを反転して 1 を加える」ことで求める手順を、すべての入力に適用する。
      次の入力のうち、この手順で正しい絶対値が得られないものはどれか。
    c: ['0', '-1', '-128', '-127']
    a: ウ
    scope: 基礎理論の「数値の表現」「算術演算と精度」。2の補数表現の範囲（−128〜127）と、範囲外になるときのオーバーフローは範囲内の知識である。
    prereq: 8ビットの2の補数の表現範囲と、符号の反転（全ビット反転＋1）。
    hard: 負数の絶対値は常に正で表せると思い込みやすく、最小値だけが表現範囲外になる非対称性に気づく必要がある。
    exp: |
      8ビットの2の補数で表せる範囲は −128〜127 です。負の数が −128 のとき、絶対値 128 は表現範囲の上限 127 を超えます。
      実際に −128＝10000000 の全ビットを反転すると 01111111、1 を加えると 10000000 に戻り、−128 のままです（オーバーフロー）。
      他の入力は、−1＝11111111 → 00000000＋1＝00000001（1）、−127＝10000001 → 01111110＋1＝01111111（127）となり、いずれも正しい絶対値になります。0 も 00000000 → 11111111＋1＝00000000 で 0 のままです。
    why:
      - 0 は反転して 1 を加えると桁上がりが捨てられて 0 に戻り、絶対値 0 と一致します。誤りの原因は、0 に符号反転を行うと値が変わると思い込むことです。
      - −1 は 11111111 を反転して 1 を加えると 00000001 で、正しく絶対値 1 になります。「−1 は全ビット1なので特別」という思い込みによる誤答です。
      - 正解です。絶対値 128 は 8ビットの2の補数で表せず、結果が 10000000（−128）のままになります。
      - −127 は 10000001 を反転して 1 を加えると 01111111（127）で、正しい結果になります。最小値の −127 と −128 を取り違えた誤答です。
    know: n ビットの2の補数は −2ⁿ⁻¹〜2ⁿ⁻¹−1 を表し、正負の範囲が非対称です。最小値 −2ⁿ⁻¹ は符号を反転しても自分自身に戻るため、abs や符号反転でオーバーフローが起きます。
    terms: [2の補数, オーバーフロー]
    verify: { manual: '8ビット: -128=10000000 → 反転01111111 +1 = 10000000(-128)。-127=10000001 → 01111110+1=01111111(127)、-1 → 00000001、0 → 0 をJSで確認' }

  - id: A01-506
    topic: 1-1-2
    diff: 3
    q: |
      次の形式の32ビット浮動小数点数がある。
      ・先頭1ビットが符号（0 は正、1 は負）
      ・続く8ビットが指数部（符号なし整数 e として読み、実際の指数は e−127）
      ・残り23ビットが仮数部 f（値は 1.f の形、すなわち先頭に省略された 1 がある）
      数値は（−1）^符号 × 1.f × 2^(e−127) で表される。
      16進表記で C1A80000 が表す10進数はどれか。
    c: ['-21', '-5', '-42', '-10.5']
    a: ア
    scope: 基礎理論の「数値の表現」。単精度浮動小数点数の符号・指数・仮数の読み方は問題文に与えており、2進と16進の変換と浮動小数点数の値の求め方は試験範囲内である。
    prereq: 16進数と2進数の変換、浮動小数点数（符号・指数部・仮数部）の意味。
    hard: ビット列の切り出し位置が16進の桁境界とずれており、バイアスと省略された先頭の 1 の扱いを同時に正しく適用する必要がある。
    exp: |
      C1A80000 を2進数にすると 1100 0001 1010 1000 0000 … です。先頭から切り出します。
      | 部分 | ビット | 値 |
      | --- | --- | --- |
      | 符号 | 1 | 負 |
      | 指数部 | 10000011 | e＝131、指数 131−127＝4 |
      | 仮数部 | 0101000… | 0.0101₂＝0.25＋0.0625＝0.3125 |
      値は −1.3125 × 2⁴ ＝ −1.3125 × 16 ＝ −21 です。
    why:
      - 正解です。−1.3125×16＝−21 です。
      - 仮数部の先頭の 1 を付け忘れて −0.3125×16 としたため、−5 になった誤りです。
      - 指数のバイアスを 126 と誤り、指数を 5（2⁵＝32）として −1.3125×32 を求めた誤りです。
      - バイアスを 128 と誤り、指数を 3（2³＝8）として −1.3125×8 を求めた誤りです。
    know: 単精度（32ビット）は符号1・指数部8・仮数部23ビットです。正規化された数の仮数は先頭の 1 が省略されているため、値は 1.f として扱います。指数部にはバイアス（単精度では127）が加えられています。
    terms: [浮動小数点数, 16進数, 正規化（浮動小数点数）]
    verify: { value: '(() => { const d = new DataView(new ArrayBuffer(4)); d.setUint32(0, 0xC1A80000); return d.getFloat32(0); })()' }

  - id: A01-507
    topic: [1-1-2, 1-1-1]
    diff: 3
    q: |
      パック10進数形式で、符号を最下位の4ビットに置き、正を C、負を D で表す。4バイト（00 12 34 5D）のパック10進数が表す値を、32ビットの2の補数で表した16進数はどれか。
    c: ['0x00003039', '0xFFFFCFC6', '0x80003039', '0xFFFFCFC7']
    a: エ
    scope: 基礎理論の「数値の表現」。パック10進数（BCD）と2の補数の相互変換は、数値表現の標準的な内容であり、符号の置き方は問題文に示している。
    prereq: パック10進数（BCD）の桁と符号の構成、2の補数の求め方、16進数と10進数の変換。
    hard: 10進の BCD から整数値を求め、さらに別の表現（2の補数）へ変換する2段階の処理で、符号の扱いを誤りやすい。
    exp: |
      パック10進数は各桁を4ビットで表し、最下位の4ビットが符号です。00 12 34 5D は桁が 0,0,1,2,3,4,5、符号が D（負）なので、値は −12345 です。
      12345 を16進数にすると 0x3039（3×4096＋0×256＋3×16＋9）です。
      −12345 の32ビットの2の補数は、0x00003039 の全ビットを反転（0xFFFFCFC6）して 1 を加えた 0xFFFFCFC7 です。
      検算：0x00003039＋0xFFFFCFC7 ＝ 0x100000000 となり、32ビットでは 0 になります。
    why:
      - 符号 D を無視して絶対値 12345（正）の2の補数表現を答えた誤りです。値は負なので、負数の補数にする必要があります。
      - 全ビットを反転しただけで、1 を加え忘れた（1の補数にとどまった）誤りです。
      - 絶対値を 12345 とし、最上位ビットだけを 1 にした符号と絶対値の表現です。2の補数表現ではありません。
      - 正解です。−12345 の2の補数で、0x3039 の反転に 1 を加えた値です。
    know: パック10進数は1バイトに2桁を入れ、符号を最下位の4ビットに置きます（C は正、D は負が代表的）。2の補数は「全ビット反転＋1」で、反転だけの1の補数との違いが誤答の定番です。
    terms: [パック10進数, 2の補数, 16進数]
    verify: { manual: 'パック10進 0012345D → -12345。12345=0x3039。JSで (-12345 >>> 0).toString(16) = ffffcfc7 を確認。0x3039+0xFFFFCFC7=0x100000000' }

  - id: A01-508
    topic: 1-1-3
    diff: 3
    q: |
      8ビットの2の補数で表した整数 01101000（10進数で 104）を、ビット列全体を1ビット左へシフトして2倍にする。最上位からあふれたビットは捨て、最下位には 0 を入れる。この結果の説明として、適切なものはどれか。
    c:
      - '結果は 11010000 で、-48 を表す。2倍の 208 が表現範囲を超えるため、オーバーフローが生じている'
      - '結果は 11010000 で、208 を表す。左シフトで正しく2倍になる'
      - '結果は 11010000 で、-48 を表す。符号ビットが変わっても桁あふれは起きていない'
      - '結果は 11010000 で、-80 を表す。上位1ビットが符号、残りが絶対値になる'
    a: ア
    scope: 基礎理論の「算術演算と精度」。シフト演算による2倍と、2の補数の表現範囲を超えたときのオーバーフローは範囲内の知識である。
    prereq: 2の補数の値の読み方（最上位ビットの重みが −128）とシフト演算。
    hard: ビット列の変化（左シフト）と値の解釈（符号付き）を結びつけ、符号が反転することからオーバーフローを判断する必要がある。
    exp: |
      01101000 を左へ1ビットシフトすると 11010000 です。最上位ビットの重みは −128 なので、
      11010000 ＝ −128＋64＋16 ＝ −48 と読めます。
      本来の 2 倍は 104×2＝208 ですが、8ビットの2の補数で表せる範囲は −128〜127 で、208 は範囲を超えています。そのため結果が負の数に化け、オーバーフローが生じています。
      「正の数を2倍したのに符号が負になった」ことが、符号付き整数でのオーバーフローの典型的な目安です。
    why:
      - 正解です。11010000＝−48 で、2倍の 208 が範囲外のためオーバーフローです。
      - 11010000 を符号なし整数（208）として読んだ誤りです。問題の整数は2の補数で表した符号付きなので、最上位ビットの重みは −128 です。
      - ビット列の値は正しく −48 と読めていますが、正の数を2倍して負になっている点を見落としています。符号の反転はオーバーフローの典型的な兆候です。
      - 符号と絶対値の表現として読んだ誤りです。この問題は2の補数表現なので、最上位ビットの重みは −128 になります。
    know: 符号付き整数の左シフトは2倍にあたりますが、結果が表現範囲を超えるとオーバーフローします。符号なしと符号付きでは同じビット列でも値が異なり、桁上がりの有無と符号付きオーバーフローの有無は別の判定です。
    terms: [算術シフト, 2の補数, オーバーフロー]
    verify: { manual: 'JSで ((0b01101000 << 1) & 255) = 0b11010000 = 208、8bit符号付き 208-256=-48 を確認。範囲外(208>127)を確認' }
