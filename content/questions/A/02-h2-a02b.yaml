questions:
  - id: A02-509
    topic: 2-2-2-1
    diff: 3
    scope: 2-2-2-1 探索アルゴリズム。整列済み配列に対する2分探索を、目的の値が存在しないケースでトレースし、比較回数を数える問題であり、範囲内。
    prereq: 2分探索では、中央の要素と比較して探索範囲を半分に絞り、範囲が空になったら「存在しない」と確定すること
    hard: 値が見つからない場合に、探索がどの時点で終わるか（範囲が空になるまで比較が続く）を正しく追う必要がある。中央の位置の決め方（切り捨て）も結果に影響する。
    q: |
      昇順に整列された配列 [2, 5, 8, 12, 16, 23, 38, 56, 72, 91]（要素番号 1〜10）に対して、値 20 を2分探索する。探索範囲の両端を lo、hi とし、中央は （lo ＋ hi） ÷ 2 の商（小数点以下切り捨て）の位置とする。値 20 が存在しないことが確定するまでに、配列の要素と比較する回数は何回か。
    c:
      - '2'
      - '4'
      - '10'
      - '3'
    a: エ
    exp: |
      探索の経過を追います。
      - 1 回目： lo ＝ 1、hi ＝ 10、中央は要素番号 5 の 16。16 ＜ 20 なので、右半分（lo ＝ 6）に絞ります。
      - 2 回目： lo ＝ 6、hi ＝ 10、中央は要素番号 8 の 56。56 ＞ 20 なので、左側（hi ＝ 7）に絞ります。
      - 3 回目： lo ＝ 6、hi ＝ 7、中央は要素番号 6 の 23。23 ＞ 20 なので、hi ＝ 5 となり、lo（6）＞ hi（5）で範囲が空になります。
      したがって、比較は 3 回で、存在しないことが確定します。
    why:
      - 2 回目で範囲が要素番号 6〜7 に絞られた時点で、まだ 23 との比較が必要です。2 回では確定しません。
      - 探索範囲の終わりの初期値を、要素番号 10 ではなく 11（要素数 ＋ 1）とする取り違えをした場合の回数です（23、8、12、16 と比較します）。
      - 10 回は線形探索で全要素を調べた場合の回数です。2分探索では範囲が半分ずつ狭まります。
      - 正解です。16、56、23 と 3 回比較した時点で範囲が空になり、不存在が確定します。
    know: 2分探索の比較回数は、成功時だけでなく失敗時（不存在の確定）でも log2（n） のオーダーになる。不存在の確定は「範囲が空になる」ことで行われ、最後の比較まで必要な場合がある。
    terms:
      - 2分探索法
    verify:
      manual: 探索範囲の変化（1〜10 → 6〜10 → 6〜7 → 空）を中央の決め方（切り捨て）に沿って再現し、比較した要素が 16、56、23 の3つであることを確認した。
  - id: A02-510
    topic: 2-2-2-1
    diff: 3
    scope: 2-2-2-1 整列アルゴリズム。挿入ソートの実行過程で、要素の移動が何回起きるか（逆転の数と一致する）を数える問題であり、範囲内。
    prereq: 挿入ソートは、未整列の先頭要素を取り出し、整列済みの部分の適切な位置まで既存の要素をずらして挿入する整列であること
    hard: 各要素について「自分より前にあって自分より大きい要素」の数を数え、合計が移動回数になることを、各挿入の過程で追う必要がある。
    q: |
      配列 [5, 2, 4, 6, 1, 3] を挿入ソートで昇順に整列する。挿入の際に、既存の要素を1つ分後ろへずらす操作を「移動」と数えると、整列が完了するまでの移動は合計何回起きるか。
    c:
      - '7'
      - '15'
      - '5'
      - '9'
    a: エ
    exp: |
      挿入ソートの移動回数は、配列中の「逆転」（前にある要素のほうが大きい組）の数と一致します。要素ごとに、自分より前にあって自分より大きい要素の数を数えます。
      - 2： 前の 5 が大きい → 1
      - 4： 前の 5 が大きい → 1
      - 6： 前に大きい要素はない → 0
      - 1： 前の 5、2、4、6 が全て大きい → 4
      - 3： 前の 5、4、6 が大きい → 3
      合計は 1 ＋ 1 ＋ 0 ＋ 4 ＋ 3 ＝ 9 回です。
    why:
      - 一部の逆転を見落とした値です。1 についての逆転が 4 つある点が数え落としやすい箇所です。
      - 全ての組の数（6 要素から 2 つを選ぶ 15 通り）です。逆転している組だけが移動の原因になります。
      - 要素の個数に近い値ですが、移動は逆転の数だけ起きます。各要素が最低でも 1 回は動くわけではなく、値 6 のように移動が 0 回の要素もあります。
      - 正解です。逆転の数は 9 で、挿入ソートの移動回数と一致します。
    know: 挿入ソートの移動回数（および作業量）は配列の逆転数で決まる。ほぼ整列されたデータでは逆転数が少なく高速だが、逆順に近いデータでは最大で n（n − 1）÷ 2 回の移動になる。
    terms:
      - 挿入ソート
    verify:
      value: 4 + 1 + 2 + 2
  - id: A02-511
    topic: 2-2-2-1
    diff: 2
    scope: 2-2-2-1 ハッシュ探索。チェイン法（同じハッシュ値のキーをリストでつなぐ方法）で、特定のキーを探索する際の比較回数を数える問題であり、範囲内。
    prereq: ハッシュ関数 h（k） ＝ k を 5 で割った余り でキーを格納し、チェイン法では各バケット内のリストを先頭から順に比較すること
    q: |
      ハッシュ関数 h（k） ＝ k mod 5 を用い、チェイン法でキー 12、7、22、3、17 をこの順にハッシュ表へ格納した。キー 17 を探索するとき、キーとの比較は何回行われるか。ここで、各バケットのリストは格納した順に先頭からたどるものとする。
    c:
      - '2'
      - '5'
      - '4'
      - '1'
    a: ウ
    exp: |
      まず各キーのハッシュ値を求めます。12 → 2、7 → 2、22 → 2、3 → 3、17 → 2 です。バケット 2 のリストには、格納順に 12、7、22、17 がつながります。キー 17 の探索では、このリストを先頭から比較するので、12（不一致）、7（不一致）、22（不一致）、17（一致）と、比較は 4 回です。バケット 3 のキー 3 は、探索の対象になりません。
    why:
      - バケット 2 の 2 番目までの比較回数です。17 はリストの 4 番目にあります。
      - 格納したキーの総数です。比較の対象は、同じバケットのリスト内だけです。
      - 正解です。バケット 2 のリスト（12、7、22、17）を先頭から比較して 4 回です。
      - ハッシュ値が一致しただけで見つかったことにはなりません。チェイン内を順に比較します。
    know: チェイン法の探索コストは、そのバケットのリストの長さで決まる。ハッシュ値が偏るとリストが長くなり、探索が遅くなるため、偏りの少ないハッシュ関数の選択が重要である。
    terms:
      - ハッシュ法
    verify:
      value: '4'
  - id: A02-512
    topic: 2-2-2-3
    diff: 4
    scope: 2-2-2-3 グラフの最短経路。ダイクストラ法の考え方で、小さいグラフの最短距離を、確定していく過程を追って求める問題であり、範囲内。
    prereq: 各節点について「そこまでの最短距離」を小さい順に確定し、隣接する節点の距離の見積りを更新していくという最短経路の求め方
    hard: 直接の辺（A から C へ 5）が最短に見えても、中継したほうが短くなる経路（A → B → C で 3）を拾い、距離の見積りを更新しながら最終目的地までの最短値を組み立てる必要がある。
    q: |
      頂点 A、B、C、D、E と、重み付きの無向の辺（A-B： 2、A-C： 5、B-C： 1、B-D： 4、C-D： 1、C-E： 6、D-E： 2）からなるグラフがある。A から E までの最短経路の長さはいくつか。
    c:
      - '6'
      - '9'
      - '8'
      - '11'
    a: ア
    exp: |
      A からの最短距離を順に確定します。
      - A ＝ 0。A から直接届くのは B（2）と C（5）です。
      - 最も小さい B ＝ 2 を確定します。B を経由すると、C は 2 ＋ 1 ＝ 3 に更新でき、D は 2 ＋ 4 ＝ 6 になります。
      - 次に C ＝ 3 を確定します。C を経由すると、D は 3 ＋ 1 ＝ 4 に更新でき、E は 3 ＋ 6 ＝ 9 になります。
      - 次に D ＝ 4 を確定します。D を経由すると、E は 4 ＋ 2 ＝ 6 に更新できます。
      - E ＝ 6 が確定し、最短経路は A → B → C → D → E（2 ＋ 1 ＋ 1 ＋ 2 ＝ 6）です。
    why:
      - 正解です。A → B → C → D → E の合計は 6 です。
      - A → B → C → E（2 ＋ 1 ＋ 6 ＝ 9）の長さです。E へは D を中継したほうが短くなります。
      - A → B → D → E（2 ＋ 4 ＋ 2）や A → C → D → E（5 ＋ 1 ＋ 2）の長さです。C を中継する経路のほうが短くなります。
      - A → C → E（5 ＋ 6）の長さです。辺を少なく通る経路が最短とは限りません。
    know: 最短路では「直接の辺」より「中継した迂回」が短いことが普通にある。ダイクストラ法は、未確定の中で最も小さい距離を1つずつ確定し、隣接点の見積りを緩和（更新）していく手続きである。
    terms:
      - ダイクストラ法
    verify:
      value: 2 + 1 + 1 + 2
  - id: A02-513
    topic: 2-2-2-4
    diff: 3
    scope: 2-2-2-4 文字列照合。単純照合（先頭から1文字ずつずらす方法）で、パターンが見つかるまでの文字比較の回数を数える問題であり、範囲内。
    prereq: 単純照合では、テキストの各開始位置について、パターンの先頭から順に文字を比較し、不一致があれば次の開始位置へ1つずらすこと
    hard: 不一致が起きた位置によって、その開始位置での比較回数が変わる点（1文字目で不一致なら1回、3文字目まで一致すれば3回）を、位置ごとに追う必要がある。
    q: |
      テキスト「ABABC」から、パターン「ABC」を単純照合で探す。テキストの左端から開始位置を1つずつずらし、各位置ではパターンの先頭から順に比較し、不一致があればその位置での比較を打ち切る。パターンが見つかるまでに、文字の比較は何回行われるか。
    c:
      - '4'
      - '7'
      - '3'
      - '9'
    a: イ
    exp: |
      開始位置ごとに比較を追います。
      - 位置 1（A から）： A ＝ A、B ＝ B、A ≠ C → 3 回で打ち切り
      - 位置 2（B から）： B ≠ A → 1 回で打ち切り
      - 位置 3（A から）： A ＝ A、B ＝ B、C ＝ C → 3 回で発見
      合計は 3 ＋ 1 ＋ 3 ＝ 7 回です。単純照合では、一致が進んだ位置で不一致になると、それまでの比較が無駄になることが分かります。
    why:
      - 位置 1 での比較（3 回）を見落とし、位置 2 と位置 3 の比較だけを合計した場合の値です。各位置での比較は 3、1、3 回です。
      - 正解です。位置ごとの比較回数の合計は 7 回です。
      - パターンの長さそのものです。見つかるまでに、前の開始位置での比較も行われています。
      - 全位置でパターンの全長まで比較した場合のような値です。不一致の時点で打ち切るため、位置 2 では 1 回で済みます。
    know: 単純照合の弱点は、部分的に一致した後に不一致になると、進んだ分だけ比較が無駄になること。この無駄を避ける工夫が、KMP 法などの高速な照合アルゴリズムにつながる。
    terms:
      - 文字列照合
    verify:
      value: 3 + 1 + 3
  - id: A02-514
    topic: 2-2-2-2
    diff: 3
    scope: 2-2-2-2 再帰と計算量。フィボナッチ数をメモ化（計算結果を保存して再利用する）付きで計算した場合の、関数の呼出回数を数える問題であり、範囲内。
    prereq: メモ化なしの再帰では同じ引数の計算が何度も繰り返されるが、メモ化では各引数の値は1度だけ計算され、2度目は保存済みの値を返すこと
    hard: 「計算する値の種類は 7 つ」という数え方と混同せず、キャッシュから返す呼出しも含めた総呼出回数を、呼出しの木をたどって数える必要がある。
    q: |
      フィボナッチ関数 fib（n）（fib（0） ＝ 0、fib（1） ＝ 1、fib（n） ＝ fib（n − 1） ＋ fib（n − 2））に、計算結果を保存するメモ化を付けて fib（6）を計算する。fib の呼び出しは、保存済みの値を返すだけの呼び出しも含めて何回行われるか。
    c:
      - '7'
      - '9'
      - '11'
      - '25'
    a: ウ
    exp: |
      メモ化がある場合、新しい値の計算は fib（5）→ fib（4）→ fib（3）→ fib（2）という一筋の連鎖で進み、その過程で fib（1）と fib（0）も計算されます。それ以外の引数の呼出しは、全て保存済みの値を返すだけで済みます。呼出しの総数は、fib（n）について 2n − 1 回という形になり、n ＝ 6 では 11 回です。内訳は、新しい値を計算する呼出し 7 回（fib（0）から fib（6）までの各値の初回の計算）と、保存済みの値を返す呼出し 4 回です。メモ化なしでは 25 回の呼出しが必要であり、重複した計算を省く効果が分かります。
    why:
      - 計算される値の種類の数（fib（0）〜 fib（6））です。呼出しの回数は、保存済みの値を返す呼出しも数えるため、これより多くなります。
      - 一部の呼出し（保存済みの値を返す回出し）の数え落としがある値です。連鎖の各段で、もう一方の引数の呼出しも発生します。
      - 正解です。メモ化付きの総呼出回数は 11 回（2n − 1）です。
      - メモ化なしの場合の呼出回数です。メモ化によって重複計算が省かれ、11 回まで減ります。
    know: メモ化は「同じ引数の計算は1度だけ」という仕組みで、指数的に膨らむ再帰の呼出しを線形のオーダーまで減らす。動的計画法のトップダウン版とみることができ、保存のためのメモリと引き換えに時間を得る典型例である。
    terms:
      - メモ化
      - 再帰
    verify:
      value: 2 * 6 - 1
  - id: A02-515
    topic: 2-1-2-3
    diff: 3
    scope: 2-1-2-3 キューの応用。円形に並んだ要素から一定間隔で取り除く処理（ヨセフスの問題）を、キューの回転としてトレースする問題であり、範囲内。
    prereq: キューから取り出して末尾へ戻す操作を繰り返すことで、円形の並びを順に処理できること
    hard: 数える対象に取り出す本人を含めるかどうか（3番目ちょうどの人を除く）を一貫させ、除くたびに円が縮む過程を最後の1人まで追う必要がある。
    q: |
      1〜7 の番号が付いた 7 人が円形に並んでいる。1 の人から数え始め、3 番目に当たる人を順に円から除いていく（除いた人の次の人から、再び 1、2、3 と数える）。最後に残るのは何番の人か。
    c:
      - '7'
      - '6'
      - '4'
      - '1'
    a: ウ
    exp: |
      除かれる順序を追います（数え始めは各回、前の人が除かれた次の人）。
      - 1 から数えて 3 番目： 3 が除かれる（残り 1、2、4、5、6、7）
      - 4 から数えて 3 番目： 6 が除かれる（残り 1、2、4、5、7）
      - 7 から数えて 3 番目： 2 が除かれる（残り 1、4、5、7）
      - 4 から数えて 3 番目： 7 が除かれる（残り 1、4、5）
      - 1 から数えて 3 番目： 5 が除かれる（残り 1、4）
      - 4 から数えて 3 番目： 1 が除かれる（残り 4）
      したがって、最後に残るのは 4 番の人です。
    why:
      - 7 は 4 番目に除かれる人です。除く過程の途中までで止めた読み違いです。
      - 6 は 2 番目に除かれる人です。最後まで残る人ではありません。
      - 正解です。除かれる順序は 3、6、2、7、5、1 で、残るのは 4 です。
      - 除いた人の次の人ではなく、1 つ前の人から数え直す誤りをした場合に残る人です。本問は、除いた人の次の人から数え直します。
    know: この問題（ヨセフスの問題）は、キューの「取り出して末尾に戻す」操作で円形の処理を表せる好例。除く間隔と人数で最後の残りが決まり、シミュレーションの題材として古くから用いられる。
    terms:
      - キュー
    verify:
      manual: 円の状態を1回ずつ書き換えて除去順（3、6、2、7、5、1）を再現し、最後に残るのが 4 であることを確認した。
  - id: A02-516
    topic: 2-2-2-1
    diff: 2
    scope: 2-2-2-1 計算量の経験的な見分け方。処理時間の実測値の増え方から、アルゴリズムの計算量のオーダーを推定する問題であり、範囲内。
    prereq: データ量を 2 倍にしたとき、O（n）では処理時間は約 2 倍、O（n の 2 乗）では約 4 倍、O（n log n）では約 2 倍強になること
    q: |
      あるプログラムについて、データ量 n と処理時間の実測値が次のとおりであった。この増え方から推定される計算量のオーダーとして、最も適切なものはどれか。

      - n ＝ 1,000 のとき 2.0 秒
      - n ＝ 2,000 のとき 8.1 秒
      - n ＝ 4,000 のとき 32.2 秒
    c:
      - O（log n）
      - O（n log n）
      - O（n）
      - O（n の 2 乗）
    a: エ
    exp: |
      データ量を 2 倍にするごとに、処理時間は 2.0 → 8.1 → 32.2 秒と、約 4 倍ずつ増えています。n を 2 倍にしたときに時間が約 4 倍になるのは、時間 ∝ n の 2 乗 の振る舞いです。O（n）なら約 2 倍、O（n log n）でも 2 倍を少し超える程度、O（log n）なら少ししか増えません。したがって、この実測は O（n の 2 乗）の計算量と整合します。
    why:
      - 対数の計算量では、データ量を 2 倍にしても時間はわずかしか増えません。
      - n log n は線形に近い増え方（2 倍強）であり、4 倍ずつの増加とは合いません。
      - 線形の計算量では、データ量 2 倍で時間も約 2 倍です。実測は約 4 倍ずつ増えています。
      - 正解です。2 倍のデータ量で約 4 倍の時間になるのが、2 乗のオーダーの特徴です。
    know: 計算量は、実測値の比率からも推定できる。データ量を 2 倍にして時間の倍率を見る方法は、性能問題の切り分けや、理論上のオーダーの検証に使われる。
    terms:
      - 計算量
    verify:
