questions:
  - id: A22-517
    topic: 22-2-1
    diff: 3
    scope: 22-2-1 労働分配率。付加価値を外部購入価値の控除で求め、人件費の合計との比を計算する問題
    prereq: 付加価値は売上高から外部購入価値を引いたもの、人件費は製造労務費と販管費の人件費の合計であること
    hard: 付加価値の計算で、売上原価と販管費の両方から外部購入分を差し引くことと、人件費に両方の人件費を含めることの、両方を正しく処理する必要がある。
    q: |
      ある会社の当期の数値は次のとおりである。労働分配率は何％か。

      - 売上高： 12,000 万円
      - 売上原価： 7,200 万円（うち労務費 1,800 万円、残りは材料費などの外部購入価値）
      - 販売費及び一般管理費： 3,000 万円（うち人件費 1,200 万円、残り 1,800 万円は外部購入価値）
    c: ['25', '50', '62.5', '75']
    a: ウ
    exp: |
      労働分配率 ＝ 人件費 ÷ 付加価値 です。
      - 付加価値 ＝ 売上高 － 外部購入価値 ＝ 12,000 － (5,400 ＋ 1,800) ＝ 4,800 万円
      - 人件費 ＝ 労務費 ＋ 販管費の人件費 ＝ 1,800 ＋ 1,200 ＝ 3,000 万円
      - 労働分配率 ＝ 3,000 ÷ 4,800 ＝ 0.625、すなわち 62.5 ％
    why:
      - 人件費を売上高で割った値（3,000 ÷ 12,000）です。労働分配率の分母は付加価値です。
      - 労務費 1,800 万円を、販管費の人件費と同じ 1,200 万円と読み違えた場合の値（人件費 2,400 ÷ 付加価値 4,800）です。人件費は労務費 1,800 万円と人件費 1,200 万円の合計です。
      - 正解です。付加価値 4,800 万円に対して人件費 3,000 万円で、62.5 ％です。
      - 人件費に販管費の外部購入分まで含めた場合の値（3,600 ÷ 4,800）です。人件費は労務費と人件費の合計です。
    know: 労働分配率は、企業が生み出した付加価値のうち人件費に配分された割合。付加価値の計算（外部購入価値の控除）と人件費の範囲（製造・販管の両方）の両方を正しく押さえることが要点である。
    terms: [労働分配率, 付加価値]
    verify: { type: value, value: 62.5 }

  - id: A22-518
    topic: 22-2-1
    diff: 2
    scope: 22-2-1 インタレスト・カバレッジ・レシオ。事業利益と支払利息から、利息の支払能力を測る指標を計算する問題
    prereq: インタレスト・カバレッジ・レシオは（営業利益 ＋ 受取利息・配当金）÷ 支払利息で定義されること
    q: |
      ある会社の営業利益は 480 万円、受取利息及び配当金は 60 万円、支払利息は 60 万円である。インタレスト・カバレッジ・レシオは何倍か。
    c: ['6', '8', '9', '10']
    a: ウ
    exp: |
      インタレスト・カバレッジ・レシオ ＝ 事業利益 ÷ 金融費用（支払利息）です。事業利益は、営業利益に受取利息・配当金を加えたものです。

      (480 ＋ 60) ÷ 60 ＝ 540 ÷ 60 ＝ 9 倍

      分子が営業利益だけ（480 万円）だと 8 倍になり、定義より小さく出ます。受取利息・配当金は、本業以外から得る金融収益として事業利益に含めるのが、この指標の定義です。
    why:
      - 営業利益から費用を差し引いた後の利益（純利益に近い値 360 万円）を分子にした場合の値です。分子は事業利益です。
      - 営業利益だけを分子にした場合の値（480 ÷ 60）です。受取利息・配当金も事業利益に含めます。
      - 正解です。事業利益 540 万円 ÷ 支払利息 60 万円 ＝ 9 倍です。
      - 分子に支払利息まで加えた値（600 ÷ 60）です。支払利息は分母の側の量です。
    know: インタレスト・カバレッジ・レシオは、事業で得た利益（事業利益）が利息の何倍あるかを示し、大きいほど利息の支払いに余裕がある。分子は営業利益だけでなく受取利息・配当金を含む点が定義の要点である。
    terms: [インタレスト・カバレッジ・レシオ]
    verify: { type: value, value: 9 }

  - id: A22-519
    topic: 22-2-1
    diff: 3
    scope: 22-2-1 在庫管理の指標。平均棚卸資産と年間売上原価から、棚卸資産の回転期間を日数で求める問題
    prereq: 棚卸資産回転率（回数）は売上原価を平均棚卸資産で割ること、回転期間は 365 日を回転率で割ること（売上高ではなく売上原価を使う）
    hard: 回転率の分子に売上高ではなく売上原価を使うことと、回数から日数への変換の両方を正しく扱う必要がある。
    q: |
      ある会社の年間売上原価は 7,300 万円、売上高は 14,600 万円、平均棚卸資産は 500 万円である。棚卸資産の回転期間は約何日か。
    c: ['12.5', '20', '25', '30']
    a: ウ
    exp: |
      棚卸資産回転率 ＝ 売上原価 ÷ 平均棚卸資産 ＝ 7,300 ÷ 500 ＝ 14.6 回です。

      回転期間 ＝ 365 ÷ 14.6 ＝ 25 日

      在庫の回転は、原価ベースで測るため、分子には売上高ではなく売上原価を用います。売上高で計算すると利益分だけ回転率が大きく（29.2 回）なり、期間は 12.5 日と実際より短く見えてしまうため、注意が必要です。
    why:
      - 分子に売上高を用いた場合の値（365 ÷ (14,600 ÷ 500) ＝ 12.5）です。在庫は原価で評価されるため、売上原価を使います。
      - 平均棚卸資産を 400 万円として計算した場合の値です。本問では 500 万円です。
      - 正解です。回転率 14.6 回から、期間は約 25 日です。
      - 回転期間を月単位の概算（約 1 か月）で丸めた値です。日数では約 25 日が正しい値です。
    know: 在庫の回転期間は、売上原価ベースの回転率から求める。売上高を使うと利益分だけ回転が速く見えてしまうため、原価で統一することが要点である。
    terms: [棚卸資産回転率, 在庫管理]
    verify: { type: value, value: 25 }

  - id: A22-520
    topic: 22-2-2
    diff: 3
    scope: 22-2-2 回収期間法。各年のキャッシュフローの累計が投資額に達するまでの期間を、端数の年を按分して求める問題
    prereq: 回収期間は累計キャッシュフローが投資額と等しくなる時点、途中の年はその年のキャッシュフローで按分すること
    hard: 累計で判定することと、最後の年の端数を「残額 ÷ その年のキャッシュフロー」で按分することの両方が必要になる。
    q: |
      投資額 1,200 万円の設備投資案がある。各年のキャッシュフローが 1 年目 300 万円、2 年目 400 万円、3 年目 400 万円、4 年目 400 万円のとき、回収期間は何年か。ここで、キャッシュフローは各年を通じて均等に発生するものとする。
    c: ['3', '3.25', '3.5', '4']
    a: イ
    exp: |
      累計キャッシュフローは、1 年目 300 万円、2 年目 700 万円、3 年目 1,100 万円、4 年目 1,500 万円です。3 年目の終わりでは 100 万円不足します。

      回収期間 ＝ 3 ＋ 100 ÷ 400 ＝ 3.25 年

      不足分を 4 年目のキャッシュフローで按分するのが要点です。
    why:
      - 3 年目の累計 1,100 万円を「ほぼ回収できた」として切り捨てた値です。厳密には 100 万円不足します。
      - 正解です。3 年に、残り 100 万円を 4 年目の 400 万円で按分した 0.25 年を加えます。
      - 不足分を 200 万円と読み違えるなどした場合の値です。不足は 1,200 － 1,100 ＝ 100 万円です。
      - 回収が完了する年度の番号をそのまま答えた値です。端数の年を按分すると 3.25 年です。
    know: 回収期間法では、累計キャッシュフローが投資額に達する時点を求め、達する年の内部は均等発生を仮定して按分する。貨幣の時間価値を考慮しない点が、この手法の限界として知られる。
    terms: [回収期間法, キャッシュフロー]
    verify: { type: value, value: 3.25 }

  - id: A22-521
    topic: 22-1-2
    diff: 2
    scope: 22-1-2 貸倒引当金の設定。売掛金残高に貸倒実績率を掛けた要設定額から、既にある引当金残高を差し引いて繰入額を求める問題（差額補充法）
    prereq: 貸倒引当金は、期末の債権残高に貸倒の実績率を掛けて見積もること、差額補充法では要設定額と既存の残高の差額だけを繰り入れること
    hard: 要設定額そのものではなく、既存の残高との差額が当期の繰入額になる点を見落とさない必要がある。
    q: |
      決算において、売掛金 2,000 万円に対して貸倒実績率 2 ％で貸倒引当金を設定する。貸倒引当金の既存の残高が 15 万円あるとき、差額補充法により当期に繰り入れる金額は何万円か。
    c: ['25', '40', '55', '15']
    a: ア
    exp: |
      まず、期末に必要な引当金の額（要設定額）を計算します。

      要設定額 ＝ 2,000 万円 × 2 ％ ＝ 40 万円

      差額補充法では、既にある残高との差額だけを繰り入れます。

      繰入額 ＝ 40 － 15 ＝ 25 万円

      引当金は、将来の貸倒れに備えて、損失の見込み額をあらかじめ費用として計上し、債権の評価から差し引いておく仕組み（貸倒引当金は資産の控除項目として表示される）であり、実際にはまだ発生していない損失を見積もる点が特徴です。
    why:
      - 正解です。要設定額 40 万円から既存の残高 15 万円を差し引いた 25 万円です。
      - 要設定額そのものです。既存の残高があるため、その分を差し引いた額が繰入額になります。
      - 既存の残高を差し引く代わりに加えてしまった場合の値です。繰入れは残高を要設定額まで増やす操作です。
      - 既存の残高そのものです。本問で求めるのは、当期に新たに繰り入れる金額です。
    know: 貸倒引当金の設定は「要設定額を決める計算」と「残高との差額を繰り入れる手続き」の 2 段構えである。差額補充法と、全額を入れ替える洗替法との違いも要点である。
    terms: [貸倒引当金]
    verify: { type: value, value: 25 }
  - id: A22-522
    topic: 22-2-1-1
    diff: 4
    scope: 22-2-1-1 経済的発注量（EOQ）。1 回の発注量を増やすと発注費用は減り保管費用は増えるという関係から、合計が最小になる発注量を求める問題
    prereq: 経済的発注量は、年間需要・1 回当たりの発注費用・1 個当たりの年間保管費用から、平方根の式で求められること
    hard: 式の中の「2」を落としたり、保管費用や需要の数値を取り違えたりすると、異なる値になる。式の各要素の意味を押さえて代入する必要がある。
    q: |
      ある部品の年間需要は 1,800 個、発注 1 回当たりの費用は 5,000 円、1 個当たりの年間の保管費用は 200 円である。経済的発注量（EOQ）は何個か。ここで、EOQ は、年間需要を D、発注 1 回当たりの費用を S、1 個当たりの年間保管費用を H として、√（2 × D × S ÷ H）で求めるものとする。
    c: ['300', '212', '424', '95']
    a: ア
    exp: |
      式に数値を当てはめます。

      EOQ ＝ √（2 × 1,800 × 5,000 ÷ 200）＝ √（18,000,000 ÷ 200）＝ √90,000 ＝ 300 個

      1 回の発注量を増やすと、年間の発注回数が減って発注費用は下がりますが、平均在庫が増えて保管費用は上がります。EOQ は、この 2 つの費用の合計が最小になる点であり、年間発注回数は 1,800 ÷ 300 ＝ 6 回になります。
    why:
      - 正解です。√（2 × 1,800 × 5,000 ÷ 200）＝ √90,000 ＝ 300 個です。
      - 式の「2」を落として計算した場合の値（√（1,800 × 5,000 ÷ 200）＝ √45,000 ≒ 212）です。
      - 保管費用を 100 円と読み違えた場合の値（√（2 × 1,800 × 5,000 ÷ 100）＝ √180,000 ≒ 424）です。保管費用は 200 円です。
      - 年間需要を 180 個と桁を読み違えた場合の値（√（2 × 180 × 5,000 ÷ 200）＝ √9,000 ≒ 95）です。年間需要は 1,800 個です。
    know: 経済的発注量は、発注費用（発注量に反比例）と保管費用（発注量に比例）の釣り合いで決まる。平方根の形になることが、この問題の構造的な特徴である。
    terms: [経済的発注量, 在庫管理]
    verify: { type: value, value: 300 }
  - id: A22-523
    topic: 22-2-1-2
    diff: 3
    scope: 22-2-1-2 発注点と安全在庫。リードタイム中の平均使用量に、需要のばらつきから決まる安全在庫を加えて発注点を求める問題
    prereq: 安全在庫は「安全係数 × 1 日の使用量の標準偏差 × リードタイムの平方根」、発注点は「1 日平均使用量 × リードタイム ＋ 安全在庫」
    hard: 安全在庫の計算で、リードタイムに平方根を取る点が要点になる。平均使用量分とばらつき分を分けて計算する必要がある。
    q: |
      ある部品の 1 日の平均使用量は 50 個、リードタイムは 6 日、1 日の使用量の標準偏差は 10 個、安全係数は 2 である。発注点は何個か。ここで、6 の平方根は約 2.45 として計算すること。
    c: ['320', '349', '360', '400']
    a: イ
    exp: |
      発注点 ＝ 1 日平均使用量 × リードタイム ＋ 安全在庫 です。
      - リードタイム中の平均使用量： 50 × 6 ＝ 300 個
      - 安全在庫： 2 × 10 × √6 ≒ 2 × 10 × 2.45 ＝ 49 個
      - 発注点 ＝ 300 ＋ 49 ＝ 349 個
    why:
      - 安全在庫を 2 × 10 ＝ 20 個とした場合の値です。リードタイムの平方根を掛けていません。
      - 正解です。300 ＋ 49 ＝ 349 個です。
      - 安全在庫を標準偏差 × リードタイム（10 × 6 ＝ 60 個）とした場合の値です。ばらつきの合算には平方根を使います。
      - 安全在庫を 1 日の平均使用量 × 安全係数（50 × 2 ＝ 100 個）とした場合の値です。安全在庫は使用量の平均ではなく、ばらつき（標準偏差）から求めます。
    know: 発注点は「リードタイム中の平均使用量 ＋ 安全在庫」。安全在庫は需要のばらつきに対応する分であり、標準偏差にリードタイムの平方根を掛ける形が標準である。
    terms: [発注点, 安全在庫]
    verify: { type: value, value: 349 }

  - id: A22-524
    topic: 22-2-2
    diff: 4
    scope: 22-2-2 目標利益を達成するための必要売上高。固定費と目標利益の合計を、限界利益率で割って求める問題
    prereq: 限界利益は固定費の回収と利益の源泉であり、売上高 × 限界利益率 ＝ 固定費 ＋ 利益という関係が成り立つこと
    hard: 損益分岐点の計算（固定費 ÷ 限界利益率）を土台に、目標利益の分だけ余分に限界利益が必要になる、という一段の拡張を適用する必要がある。
    q: |
      ある会社の固定費は 3,000 万円であり、変動費率は売上の 60 ％である。営業利益 1,000 万円を達成するために必要な売上高は何万円か。
    c: ['10,000', '7,500', '5,000', '6,667']
    a: ア
    exp: |
      限界利益率は、1 － 0.6 ＝ 0.4 （40 ％）です。売上高に限界利益率を掛けた限界利益が、固定費と利益の合計に等しくなる点を求めます。

      必要売上高 ＝ （固定費 ＋ 目標利益）÷ 限界利益率 ＝ （3,000 ＋ 1,000）÷ 0.4 ＝ 4,000 ÷ 0.4 ＝ 10,000 万円

      目標利益が 0 の場合が損益分岐点の売上高（3,000 ÷ 0.4 ＝ 7,500 万円）であり、目標利益の分だけ、それより大きな売上が必要になります。
    why:
      - 正解です。固定費と目標利益の合計 4,000 万円を、限界利益率 0.4 で割った値です。
      - 損益分岐点の売上高（固定費だけを限界利益率で割った値）です。本問では目標利益 1,000 万円の分も稼ぐ必要があります。
      - 目標利益を加える代わりに引いてしまった場合の値（（3,000 － 1,000）÷ 0.4）です。目標利益は必要な限界利益を増やします。
      - 限界利益率ではなく変動費率（0.6）で割ってしまった場合の値（4,000 ÷ 0.6 ≒ 6,667）です。割るのは限界利益率です。
    know: 目標利益を入れた売上計画は、損益分岐点の式の拡張である（必要売上高 ＝ （固定費 ＋ 目標利益）÷ 限界利益率）。分岐点の考え方に「稼ぐべき利益」を上乗せする形が要点である。
    terms: [損益分岐点, 限界利益]
    verify: { type: value, value: 10000 }