      主成分分析は、互いに相関のある多数の変数を、情報（ばらつき）をなるべく失わないように少数の新しい変数（主成分）にまとめる分析手法です。例えば、5教科の点数を「総合力」と「文系・理系の傾向」の2つの指標に要約するといった使い方をします。次元削減の代表的な手法で、教師なし学習の一種でもあります。
    why:
      - これは重回帰分析の説明です。
      - 正解です。多くの変数を少数の合成変数に要約する手法です。
      - これはクラスタ分析（クラスタリング）の説明です。
      - これは相関係数の説明です。
    terms:
      - 主成分分析
  - id: A01-073
    topic: 1-3-8-2
    diff: 3
    q: 2値分類のモデルで，実際に陽性のデータのうち，モデルが陽性と正しく判定した割合を表す指標はどれか。
    c:
      - 再現率
      - 特異度
      - 正解率
      - 適合率
    a: ア
    exp: |
      分類モデルの評価指標は、実際の正解とモデルの判定の組合せで定義されます。
      - 再現率（Recall）＝陽性を正しく陽性と判定した数 ÷ 実際の陽性の数
      - 適合率（Precision）＝陽性を正しく陽性と判定した数 ÷ 陽性と判定した数
      問題文は「実際に陽性のデータのうち」なので再現率です。病気の見逃しを減らしたい場合などに重視されます。
    why:
      - 正解です。実際の陽性のうち正しく検出できた割合です。
      - 特異度は「実際に陰性のデータのうち、正しく陰性と判定した割合」です。
      - 正解率は「全データのうち、判定が正しかった割合」です。
      - 適合率は「陽性と判定したもののうち、実際に陽性だった割合」です。
    know: ROC 曲線は、判定のしきい値を変えたときの「偽陽性率（1−特異度）」と「再現率（真陽性率）」の関係を描いたもので、曲線の下の面積（AUC）が大きいほど良いモデルとされます。
    terms:
      - 再現率
      - 適合率
