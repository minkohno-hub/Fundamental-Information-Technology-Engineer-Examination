    q: 主成分分析の説明として，適切なものはどれか。
    c:
      - 目的変数と複数の説明変数の関係を，一次式で表す。
      - 多数の変数がもつ情報を，できるだけ損なわないように少数の合成変数に要約する。
      - データを，似たもの同士のグループに分ける。
      - 2つの変数の間の直線的な関係の強さを，−1 から 1 の値で表す。
