      - 待ち行列理論
    verify:
      value: (0.8/0.2)/(0.5/0.5)
  - id: A01-040
    topic: 1-2-7
    diff: 2
    q: 動的計画法の説明として，適切なものはどれか。
    c:
      - 問題を小さな部分問題に分け，部分問題の解を記録して再利用しながら，全体の最適解を求める。
      - その時点で最も良く見える選択を繰り返し，後から選択をやり直さない。
      - 可能な解の候補をすべて調べ上げて，最適なものを選ぶ。
      - 乱数を用いて解の候補を生成し，近似的な解を求める。
    a: ア
    exp: |
      動的計画法は、大きな問題を重複する部分問題に分け、一度解いた部分問題の答えを表などに記録しておき、同じ部分問題が出てきたときは記録を再利用する手法です。
      同じ計算を繰り返さないため、単純な再帰に比べて大幅に計算量を減らせます。ナップサック問題や最短経路問題などに使われます。
    why:
      - 正解です。部分問題の解の記録と再利用が特徴です。
      - その時点の最善を選び続けるのは貪欲法（グリーディ法）です。必ずしも最適解が得られるとは限りません。
      - すべての候補を調べるのは全探索（しらみつぶし法）です。
      - 乱数を使う手法はモンテカルロ法などです。
    terms:
      - 動的計画法
  - id: A01-041
    topic: 1-3-1
    diff: 2
    q: 発生確率が 1/8 である事象が起きたことを知らせる情報の情報量は何ビットか。
    c:
      - '0.125'
      - '3'
      - '1'
