      - 各頂点の入次数と出次数は必ず等しい。
    a: ア
    exp: |
      有向グラフの辺は、必ずどこかの頂点から出て（出次数を1増やし）、どこかの頂点に入ります（入次数を1増やす）。
      したがって、入次数の合計も出次数の合計も、どちらも辺の数に等しくなります。
    why:
      - 正解です。どちらの合計も辺の数に等しいです。
      - 入次数の合計は辺の数そのものです。2倍になるのは、無向グラフの次数の合計です。
      - 出発点となる頂点（例えば作業の開始点）のように、入次数が 0 の頂点は存在しえます。
      - 個々の頂点では入次数と出次数が異なることがあります。
    know: アローダイアグラム（PERT 図）や状態遷移図は有向グラフの一種です。
    terms:
      - グラフ理論
