    q: エキスパートシステムの構成要素の組合せとして，適切なものはどれか。
    c:
      - 専門家の知識を蓄えた知識ベースと，その知識を使って結論を導く推論エンジン
      - 大量のデータから自動的に特徴を学習するニューラルネットワークと，学習データ
      - 利用者の発話を認識する音声認識エンジンと，音声合成エンジン
      - 画像を分類する畳み込み層と，プーリング層
    a: ア
    exp: |
      エキスパートシステムは、特定分野の専門家の知識を「もし〜ならば…」といったルールの形で知識ベースに蓄え、推論エンジンがそのルールを組み合わせて結論を導くシステムです。医療診断や故障診断などに使われてきました。
    why:
      - 正解です。知識ベースと推論エンジンが中心的な構成要素です。
      - ニューラルネットワークと学習データは、データから学習する機械学習（ディープラーニング）の構成です。
      - 音声認識・音声合成は対話システムなどの構成要素です。
      - 畳み込み層・プーリング層は CNN（畳み込みニューラルネットワーク）の構成です。
    know: エキスパートシステムは人がルールを書く「知識ベースの AI」、機械学習はデータからルールを学ぶ「データ駆動の AI」と対比されます。
    terms:
      - エキスパートシステム
  - id: A01-051
    topic: 1-3-8-2
    diff: 1
    q: 教師なし学習に該当するものはどれか。
    c:
      - 購買履歴のデータを基に，似た傾向の顧客をグループに分ける。
      - 過去の住宅の広さと価格のデータを基に，新しい住宅の価格を予測する。
      - 対戦を繰り返し，勝ったときに得られる報酬が最大になるような手を学習する。
      - 「迷惑メール」か「通常メール」かのラベルが付いたメールで学習し，新しいメールを分類する。
    a: ア
    exp: |
      教師なし学習は、正解（ラベル）のないデータから、データの構造や特徴を見つけ出す学習です。似たデータをまとめるクラスタリングや、データの次元を減らす次元削減などがあります。顧客のグループ分けは、正解のグループが与えられていないのでクラスタリング（教師なし学習）です。
    why:
      - 正解です。ラベルなしデータのクラスタリングは教師なし学習です。
      - 正解の価格が付いたデータから数値を予測するので、教師あり学習（回帰）です。
      - 報酬を手掛かりに行動を学ぶのは強化学習です。
      - 正解のラベルが付いたデータで分類するので、教師あり学習（分類）です。
    know: 教師あり学習は「回帰（数値の予測）」と「分類（カテゴリの予測）」に大別されます。
    terms:
      - 教師なし学習
      - 教師あり学習
      - 強化学習
  - id: A01-052
    topic: 1-3-8-2
    diff: 2
    q: 機械学習における「過学習」の説明として，適切なものはどれか。
    c:
      - 学習データに過度に適合してしまい，未知のデータに対する予測精度が低くなる。
      - 学習データが少なすぎて，学習データに対しても予測精度が低い。
      - 学習に時間がかかりすぎて，実用的な時間内に学習が終わらない。
      - 学習データと同じデータで評価したため，評価結果が低くなる。
    a: ア
    exp: |
      過学習（過剰適合）は、モデルが学習データの細かな特徴やノイズまで覚え込んでしまい、学習データでは高い精度が出るのに、未知のデータ（テストデータ）では精度が下がる状態です。汎化性能が低い状態ともいえます。
    why:
      - 正解です。学習データへの過度な適合で汎化性能が下がる現象です。
      - 学習データに対しても精度が低いのは、学習不足（未学習）の状態です。
      - 学習時間の長さは過学習の定義ではありません。
      - 学習データと同じデータで評価すると、評価結果は実力より高く出やすくなります。
    know: 過学習の対策には、学習データを増やす、モデルを単純にする、正則化、交差検証による評価、学習を早めに打ち切る（早期終了）などがあります。
    terms:
      - 過学習
