    a: ウ
    exp: |
      行列の積 PQ の i 行 j 列の要素は「P の i 行目と Q の j 列目の対応する要素の積の和」です。
      - 1行1列：1×0＋2×1＝2　　1行2列：1×1＋2×0＝1
      - 2行1列：3×0＋4×1＝4　　2行2列：3×1＋4×0＝3
      よって PQ は1行目 (2, 1)，2行目 (4, 3) です。Q を右から掛けると P の列が入れ替わります。
    why:
      - 行が入れ替わった行列で、QP（Q を左から掛けた積）です。
      - 対応する要素どうしを掛けただけ（アダマール積）で、行列の積ではありません。
      - 正解です。P の1列目と2列目が入れ替わった行列になります。
      - P のままにはなりません。Q は単位行列ではありません。
    know: 行列の積は一般に交換法則が成り立ちません（PQ≠QP）。単位行列 E は E を掛けても元の行列が変わらない行列です。
    terms:
      - 行列
    verify:
      manual: 各要素の積和を再計算し PQ=[[2,1],[4,3]], QP=[[3,4],[1,2]] を確認
  - id: A01-031
