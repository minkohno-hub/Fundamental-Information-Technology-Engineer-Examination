    q: 2個のさいころを同時に投げたとき，出た目の和が 7 になる確率はどれか。
    c:
      - 1/6
      - 7/36
      - 1/12
      - 1/9
    a: ア
    exp: |
      2個のさいころの目の出方は全部で 6×6＝36 通りで、どれも同じ確からしさで起こります。
      和が 7 になるのは (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) の6通りです。確率は 6/36＝1/6 です。
    why:
      - 正解です。6/36＝1/6 です。
      - 7/36 は、和の値 7 をそのまま場合の数としてしまった誤りです。
      - 1/12 は (1,6) と (6,1) のような順序の違いを同じものとして数え、3通りとした誤りです。
