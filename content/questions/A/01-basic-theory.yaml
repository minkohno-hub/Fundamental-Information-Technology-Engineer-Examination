  - id: A01-058
    topic: 1-3-8-4
    diff: 2
    q: GAN（敵対的生成ネットワーク）の説明として，適切なものはどれか。
    c:
      - ノイズを少しずつ加えたデータから，ノイズを取り除く過程を学習して画像を生成する。
      - 大量の文章で学習し，入力された文章の続きを予測して自然な文章を生成する。
      - 本物に似たデータを作る生成器と，本物か生成されたものかを見分ける識別器を競わせて学習し，精巧なデータを生成できるようにする。
      - 正解ラベル付きのデータを使って，画像を決められた分類に振り分ける。
    a: ウ
    exp: |
      GAN（Generative Adversarial Network）は、生成器（ジェネレーター）と識別器（ディスクリミネーター）の2つのネットワークから成ります。生成器は識別器をだませるような本物らしいデータを作ろうとし、識別器は本物と偽物を見分けようとします。両者が競い合うことで、生成器は精巧なデータを作れるようになります。
    why:
      - これは拡散モデルの説明です。
      - これは言語モデル（大規模言語モデル）の説明です。
      - 正解です。生成器と識別器を競わせるのが GAN です。
      - これは教師あり学習による画像分類の説明です。
    know: 生成 AI の技術はディープフェイクなどの悪用にもつながるため、セキュリティや倫理の観点からも出題されます。
    terms:
      - GAN
      - 拡散モデル
  - id: A01-059
    topic: 1-3-8-4
    diff: 2
    q: 大規模言語モデル（LLM）を利用するときの留意点として，適切なものはどれか。
    c:
      - 入力した機密情報が外部に送信されることは，どのようなサービスでもあり得ない。
      - もっともらしいが事実と異なる内容を出力することがあるため，重要な情報は根拠を確認する必要がある。
      - 学習に使われたデータの範囲内の質問には，常に正確に回答する。
      - プロンプト（指示文）の書き方によって，出力が変わることはない。
    a: イ
    exp: |
      大規模言語モデルは、大量の文章から単語の並び方の傾向を学習し、自然な文章を生成します。しかし、事実を検証して回答しているわけではないため、もっともらしい誤情報（ハルシネーション）を出力することがあります。重要な情報は一次情報で確認することが必要です。
    why:
      - 外部のサービスでは入力内容がサービス提供者に送信されるため、機密情報の入力は利用規約や社内ルールに従って判断する必要があります。
      - 正解です。誤った内容を出力しうることに注意が必要です。
      - 学習データの範囲内でも、誤った回答をすることがあります。
      - 指示文の書き方で出力は大きく変わります。そのため、目的に合った指示の工夫（プロンプトエンジニアリング）が重要になります。
    terms:
      - LLM
      - プロンプトエンジニアリング
  - id: A01-060
    topic: 1-3-9
    diff: 2
    q: コンパイラが行う処理のうち，構文解析の説明として，適切なものはどれか。
    c:
      - ソースプログラムの文字の並びを，識別子・定数・演算子などの字句に分割する。
      - 字句（トークン）の並びがプログラム言語の文法に合っているかを調べ，構文木などを作る。
      - 中間的な表現から，目的とする機械語の命令列を生成する。
      - プログラムの実行速度を上げるため，不要な命令を取り除いたり命令の順序を変えたりする。
    a: イ
    exp: |
      コンパイラは一般に、字句解析 → 構文解析 → 意味解析 → 最適化 → コード生成 の順に処理を行います。構文解析では、字句解析で得られた字句の並びが文法規則に従っているかを調べ、プログラムの構造を表す構文木（解析木）を作ります。
    why:
      - 文字の並びを字句に分割するのは字句解析です。
      - 正解です。文法に合っているかを調べるのが構文解析です。
      - 機械語を生成するのはコード生成です。
      - 実行効率を上げるための変換は最適化です。
    know: 意味解析では、変数の型の整合性など、文法だけでは判断できない誤りを調べます。インタプリタは翻訳と実行を1文ずつ行う点がコンパイラと異なります。
    terms:
      - コンパイラ
  - id: A01-061
    topic: 1-3-10
    diff: 2
    q: 関数型言語の特徴として，適切なものはどれか。
    c:
      - データとそれを操作する手続をオブジェクトとしてまとめて記述する。
      - 事実と規則を記述し，それらから推論によって答えを導く。
      - 関数の組合せでプログラムを記述し，副作用（変数の書換えなど）をできるだけ避ける。
      - 命令を実行する順序を手続として記述し，変数の値を順に書き換えて処理を進める。
    a: ウ
    exp: |
      関数型言語は、数学の関数のように「同じ入力には必ず同じ出力を返す」関数を組み合わせてプログラムを作ります。変数の値を書き換えるなどの副作用を避けるため、プログラムの動作を予測しやすく、並列処理とも相性が良いとされます。Haskell などが代表例です。
    why:
      - データと手続をまとめるのはオブジェクト指向言語です。
      - 事実と規則から推論するのは、Prolog などの論理型言語です。
      - 正解です。関数の組合せと副作用の回避が特徴です。
      - 手順を順に記述するのは手続型言語です。
    terms:
      - 関数型言語
  - id: A01-062
    topic: 1-4-1-1
    diff: 1
    q: データ伝送の方式のうち，半二重通信の説明として，適切なものはどれか。
    c:
      - 複数の端末に同じデータを同時に送信する。
      - 常に一方向にしか送信できない。
      - 双方向に同時に送信と受信ができる。
      - 双方向に通信できるが，同時には一方向にしか送信できない。
    a: エ
    exp: |
      半二重通信は、送信と受信の両方ができますが、同時にはどちらか一方しか行えない方式です。トランシーバーのように「送信するときは受信できない」通信がこれにあたります。
    why:
      - 複数の宛先に同時に送るのはブロードキャストやマルチキャストで、伝送路の方式とは別の分類です。
      - 常に一方向にしか送れないのは単方向通信です（放送など）。
      - 同時に双方向の通信ができるのは全二重通信です（電話など）。
      - 正解です。双方向だが同時には一方向です。
    terms:
      - 半二重通信
      - 全二重通信
  - id: A01-063
    topic: 1-4-1-2
    diff: 2
    q: 音声信号を 8kHz で標本化し，1標本を 8 ビットで量子化して PCM で伝送する。1秒あたりのデータ量は何 kビットか。
    c:
      - '512'
      - '64'
      - '16'
      - '8'
    a: イ
    exp: |
      PCM（パルス符号変調）では、アナログ信号を一定間隔で標本化し、各標本の値を量子化してビット列に符号化します。
      8kHz の標本化は1秒間に 8,000 回の標本をとることなので、データ量は 8,000×8 ビット＝64,000 ビット＝64 kビット（64kbit/s）です。
    why:
      - 512 は 8×8×8 のように計算を誤った値です。
      - 正解です。8,000×8＝64,000 ビットです。
      - 16 は計算の誤りです。
      - 8 は標本化周波数（kHz）だけの値です。
    know: PCM は「標本化（サンプリング）→ 量子化 → 符号化」の手順でアナログ信号をデジタル化します。64kbit/s は従来の電話音声の標準的な伝送速度です。
    terms:
      - PCM
      - 標本化定理
    verify:
      value: 8000 * 8 / 1000
  - id: A01-064
    topic: 1-4-1-3
    diff: 2
    q: 時分割多重（TDM）の説明として，適切なものはどれか。
    c:
      - 通信ごとに異なる符号を掛けて送り，受信側で符号を使って分離する。
      - 一つの伝送路の周波数帯域を分割し，各帯域を複数の通信に割り当てる。
      - 光の波長を変えて，一本の光ファイバで複数の信号を送る。
      - 一つの伝送路を短い時間単位に区切り，各時間を複数の通信に順番に割り当てる。
    a: エ
    exp: |
      時分割多重（TDM：Time Division Multiplexing）は、伝送路を使う時間を細かく区切り、それぞれの時間枠（タイムスロット）を複数の通信に順番に割り当てる方式です。各通信は自分の時間枠だけ伝送路を使うので、一本の伝送路を複数の通信で共有できます。
    why:
      - 符号を使って分離するのは符号分割多重（CDM）です。
      - 周波数帯域を分割するのは周波数分割多重（FDM）です。
      - 波長を変えるのは波長分割多重（WDM）です。
      - 正解です。時間を区切って割り当てるのが TDM です。
    terms:
      - TDM
      - FDM
  - id: A01-065
    topic: 1-4-1-4
    diff: 1
    q: 7 ビットのデータ 1011001 に偶数パリティのパリティビットを付加する。パリティビットの値はどれか。
    c:
      - '0'
      - '2'
      - '4'
      - '1'
    a: ア
    exp: |
      偶数パリティは、パリティビットを含めた全体の 1 の個数が偶数になるようにパリティビットを決める方式です。
      1011001 に含まれる 1 の個数は 4 個（偶数）なので、パリティビットは 0 にします。
    why:
      - 正解です。1 の個数がすでに偶数なので 0 です。
      - パリティビットは1ビットなので、0 か 1 の値しかとりません。2 は1ビットでは表せません。
      - パリティビットは1ビットなので、0 か 1 の値しかとりません。4 はデータ中の 1 の個数です。
      - 1 にすると全体の 1 の個数が 5 個（奇数）になり、奇数パリティになってしまいます。
    know: パリティチェックは1ビットの誤りを検出できますが、2ビット同時の誤りは検出できず、誤りの位置も分からないため訂正はできません。
    terms:
      - パリティチェック
    verify:
      manual: 1011001 の1の個数=4（偶数）→パリティ0 を確認
  - id: A01-066
    topic: 1-4-1-4
    diff: 2
    q: 誤り制御の方式のうち，1ビットの誤りを検出するだけでなく，誤りのビット位置を特定して訂正することもできるものはどれか。
    c:
      - 偶数パリティ
      - ハミング符号
      - 奇数パリティ
      - チェックサム
    a: イ
    exp: |
      ハミング符号は、データビットに複数の検査ビットを付け加え、検査ビットの組合せから誤ったビットの位置を特定できるようにした符号です。1ビットの誤りを訂正でき、2ビットの誤りを検出できます。メモリの ECC（誤り訂正符号）などに使われています。
    why:
      - 偶数パリティは1ビットの誤りを検出できますが、位置は分からないので訂正はできません。
      - 正解です。1ビットの誤り訂正ができます。
      - 奇数パリティも偶数パリティと同様に検出だけで、訂正はできません。
      - チェックサムはデータの合計値を使って誤りを検出する方式で、訂正はできません。
    know: CRC（巡回冗長検査）は生成多項式を使った誤り検出方式で、連続した複数ビットの誤り（バースト誤り）の検出に強く、通信のフレーム検査などに使われます。
    terms:
      - ハミング符号
      - CRC
      - ECC
  - id: A01-067
    topic: 1-4-1-5
    diff: 2
    q: 調歩同期方式の説明として，適切なものはどれか。
    c:
      - 特定の同期用文字（SYN）を先頭に付け，その後に続く文字の並びをまとめて送る。
      - 1文字ごとに先頭にスタートビット，末尾にストップビットを付けて，文字単位で送受信のタイミングを合わせる。
      - フラグと呼ばれる特定のビットパターンでフレームの始まりと終わりを示す。
      - 送信側と受信側が別の信号線で共通のクロックを共有する。
    a: イ
    exp: |
      調歩同期方式（非同期方式）は、1文字（例えば8ビット）ごとに先頭へスタートビット、末尾へストップビットを付けて送る方式です。受信側はスタートビットを検出した時点から文字の読み取りを始めるので、送信側と受信側でクロックを常に合わせておく必要がありません。
    why:
      - SYN 文字を使うのはキャラクター同期（SYN 同期）です。
      - 正解です。スタートビットとストップビットで文字単位に同期します。
      - フラグを使うのはフラグ同期で、HDLC などで使われます。
      - 共通のクロックを共有するのは、クロック信号を別に送る同期方式です。
    terms:
      - 調歩同期
  - id: A01-068
    topic: 1-5-1
    diff: 2
    q: 最高 20kHz までの周波数成分を含む音声を A/D 変換するとき，元の信号を復元できるようにするための標本化周波数として，最小の値はどれか。
    c:
      - 10kHz
      - 20kHz
      - 80kHz
      - 40kHz
    a: エ
    exp: |
      標本化定理（サンプリング定理）によると、信号に含まれる最高周波数の2倍より高い周波数で標本化すれば、元の信号を復元できます。最高周波数が 20kHz なら、その2倍の 40kHz が目安になります。
      音楽 CD の標本化周波数 44.1kHz は、人の可聴域の上限（約 20kHz）の2倍を少し上回るように決められています。
    why:
      - 10kHz では、10kHz を超える成分が失われたり、別の周波数として現れたり（エイリアシング）します。
      - 20kHz では、最高周波数の成分を正しく表すことができません。
      - 80kHz でも復元できますが、最小の値ではありません。データ量も必要以上に増えます。
      - 正解です。最高周波数の2倍の 40kHz が目安です。
    know: 厳密には「最高周波数の2倍より高い」周波数が必要です。A/D 変換は標本化・量子化・符号化の順に行います。
    terms:
      - 標本化定理
      - A/D変換
    verify:
      value: 20 * 2
  - id: A01-069
    topic: 1-5-2-1
    diff: 2
    q: フィードバック制御の説明として，適切なものはどれか。
    c:
      - 制御の結果を確認せずに，入力に応じて一定の操作を行う。
      - 制御した結果を測定して目標値と比較し，その差がなくなるように操作量を調整する。
      - 外乱の影響をあらかじめ予測して，結果に影響が出る前に操作量を調整する。
      - あらかじめ決められた順序に従って，制御の各段階を順に進める。
    a: イ
    exp: |
      フィードバック制御は、制御対象の出力（結果）をセンサーで測定し、目標値との差（偏差）を求めて、その差を小さくするように操作量を調整する制御です。エアコンが室温を測りながら設定温度に近づけるように運転を調整するのが典型例です。
    why:
      - 結果を確認しないで操作するのはオープンループ制御です。
      - 正解です。結果を目標値と比較して修正するのがフィードバック制御です。
      - 外乱を予測して先回りして制御するのはフィードフォワード制御です。
      - 決められた順序で段階的に進めるのはシーケンス制御です（洗濯機の工程など）。
    know: フィードバック制御は外乱があっても目標値に近づけられますが、結果を見てから修正するため応答に遅れが生じます。フィードフォワード制御と組み合わせることもあります。
    terms:
      - フィードバック制御
  - id: A01-070
    topic: 1-5-2-2
    diff: 2
    q: 温度によって電気抵抗の値が大きく変化する性質を利用して，温度を測定するセンサーに用いられる素子はどれか。
    c:
      - ジャイロセンサー
      - ホール素子
      - ひずみゲージ
      - サーミスタ
    a: エ
    exp: |
      サーミスタは、温度変化に対して電気抵抗が大きく変化する半導体素子です。抵抗値を測ることで温度が分かるため、体温計、エアコン、家電製品の温度センサーなどに広く使われています。
    why:
      - ジャイロセンサーは回転の速さ（角速度）を検出するセンサーです。
      - ホール素子は磁界の強さを電圧に変換する素子で、磁気センサーとして使われます。
      - ひずみゲージは、物体の変形（ひずみ）によって抵抗値が変わる性質を利用して、力や圧力を測る素子です。
      - 正解です。温度で抵抗値が変わる素子です。
    terms:
      - サーミスタ
      - センサー
  - id: A01-071
    topic: 1-5-2-2
    diff: 1
    q: アクチュエーターの説明として，適切なものはどれか。
    c:
      - 複数の信号を一つの伝送路にまとめる装置
      - 温度や光などの物理量を測定し，電気信号に変換する装置
      - アナログ信号をデジタル信号に変換する装置
      - 電気信号などのエネルギーを，回転や直線運動などの物理的な動きに変換する装置
    a: エ
    exp: |
      アクチュエーターは、制御装置からの電気信号などを受けて、モーターの回転、シリンダの伸縮などの物理的な動きに変換する装置です。センサーが「外界を測る」役割であるのに対し、アクチュエーターは「外界に働きかける」役割をもちます。
    why:
      - 複数の信号をまとめるのは多重化装置です。
      - 物理量を電気信号に変換するのはセンサーです。
      - アナログ信号をデジタル信号に変換するのは A/D 変換器です。
      - 正解です。信号を物理的な動きに変換する装置です。
    know: IoT 機器やロボットは「センサーで測定 → コンピュータで判断 → アクチュエーターで動作」という流れで動きます。代表的なアクチュエーターは、モーター、油圧シリンダ、空気圧シリンダなどです。
    terms:
      - アクチュエーター
      - センサー
