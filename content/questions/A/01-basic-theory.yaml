    topic: 1-3-8-2
    diff: 2
    q: 機械学習のモデルを評価する k 分割交差検証の説明として，適切なものはどれか。
    c:
      - 学習に使ったデータをそのまま使って，k 回評価する。
      - データを学習用と検証用の2つに一度だけ分けて，検証用データで評価する。
      - データを k 種類のモデルで学習させ，最も精度の高いモデルを選ぶ。
      - データを k 個に分割し，そのうち1個を検証用，残りを学習用とする評価を，検証用を入れ替えながら k 回行い，結果を平均する。
    a: エ
    exp: |
      k 分割交差検証では、データを k 個のグループに分け、1個を検証用、残り k−1 個を学習用にしてモデルを評価します。検証用にするグループを順番に入れ替えて k 回繰り返し、その平均で性能を評価します。限られたデータを有効に使い、偏りの少ない評価ができます。
    why:
      - 学習に使ったデータで評価すると、過学習を見逃してしまいます。
      - 一度だけ学習用と検証用に分けるのはホールドアウト検証です。
      - 複数のモデルを比較することはありますが、それは交差検証の定義ではありません。
      - 正解です。検証用を入れ替えて k 回評価します。
    terms:
      - 交差検証
