      tolerance: 0.0001
  - id: A01-019
    topic: 1-2-1-1
    diff: 3
    q: ある製品は工場 A で全体の 60％，工場 B で 40％ が生産されている。不良品の発生率は工場 A が 1％，工場 B が 2％ である。無作為に選んだ製品が不良品であったとき，それが工場 B で生産されたものである確率は約いくらか。
    c:
      - '0.67'
      - '0.40'
      - '0.80'
      - '0.57'
    a: エ
    exp: |
      ベイズの定理を使います。まず不良品になる確率を求めます。
      - 工場 A 製かつ不良品：0.6×0.01＝0.006
      - 工場 B 製かつ不良品：0.4×0.02＝0.008
      - 不良品である確率：0.006＋0.008＝0.014
      不良品であったときに工場 B 製である確率は 0.008÷0.014＝4/7≒0.57 です。
    why:
      - 0.67 は不良率の比 2÷(1＋2) だけで計算し、生産比率を考慮していない値です。
      - 0.40 は不良品であるという情報を使わず、工場 B の生産比率をそのまま答えた値です。
      - 0.80 は工場 B の生産比率に不良率の比を誤って掛け合わせた値です。
      - 正解です。0.008÷0.014≒0.57 です。
    know: 「結果（不良品）が分かったときの原因（工場）の確率」を求めるのがベイズの定理です。P(B｜不良)＝P(B)P(不良｜B)÷P(不良)。迷惑メールフィルタなどにも応用されています。
    terms:
      - ベイズの定理
      - 条件付き確率
    verify:
      value: 0.4*0.02 / (0.6*0.01 + 0.4*0.02)
      tolerance: 0.006
  - id: A01-020
    topic: 1-2-1-1
    diff: 1
    q: 5人の中から3人の代表を選ぶ。選び方は何通りあるか（選ばれた3人の順序は区別しない）。
    c:
      - '10'
      - '15'
      - '60'
      - '20'
    a: ア
    exp: |
      順序を区別しない選び方は組合せで、₅C₃ ＝ 5!÷(3!×2!) ＝ (5×4×3)÷(3×2×1) ＝ 10 通りです。
      「選ばれない2人」を選ぶと考えても ₅C₂ ＝ (5×4)÷(2×1) ＝ 10 通りで、同じ結果になります。
    why:
      - 正解です。₅C₃＝10 です。
      - 15 は ₆C₂ など、異なる組合せの数です。
      - 60 は順序を区別する順列 ₅P₃＝5×4×3 の値です。
      - 20 は ₆C₃ にあたる値です。
    know: 順列 ₙPᵣ＝n!/(n−r)!（順序を区別する）、組合せ ₙCᵣ＝n!/(r!(n−r)!)（順序を区別しない）。₅P₃ を 3! で割ると ₅C₃ になります。
    terms:
      - 順列と組合せ
    verify:
      value: (5*4*3)/(3*2*1)
  - id: A01-021
    topic: 1-2-1-1
    diff: 2
    q: 正規分布の性質として，適切なものはどれか。
    c:
      - 平均値を中心に左右対称な釣鐘型の分布で，平均値 ±1 標準偏差の範囲に全体の約 68％ が含まれる。
      - 成功か失敗かの2通りの結果をもつ試行を1回行ったときの分布である。
      - 平均値よりも大きい側に長く裾を引いた，左右非対称の分布である。
      - 一定時間内に，まれな事象が起こる回数の分布である。
    a: ア
    exp: |
      正規分布は平均値を中心に左右対称な釣鐘型の分布で、平均値・中央値・最頻値が一致します。
      平均値 ±1σ（σ は標準偏差）の範囲に約 68％、±2σ に約 95％、±3σ に約 99.7％ のデータが含まれます。身長や測定誤差など多くの自然現象の分布が正規分布に近くなります。
    why:
      - 正解です。正規分布の代表的な性質です。
      - 成功・失敗の2通りの試行を1回行う分布はベルヌーイ分布です（n 回繰り返すと二項分布）。
      - 正規分布は左右対称です。右に長く裾を引く分布は「歪度が正」の分布です。
      - 一定時間内にまれな事象が起こる回数の分布はポアソン分布です。
    know: 品質管理の管理図では、平均値 ±3σ を管理限界として異常を判断することがあります。
    terms:
      - 正規分布
      - 標準偏差
  - id: A01-022
    topic: 1-2-1-1
    diff: 2
    q: 成功確率が 0.3 の試行を，独立に 10 回繰り返す。成功回数の期待値はいくらか。
    c:
      - '0.3'
      - '3'
      - '7'
      - '10'
    a: イ
    exp: |
      独立な試行を n 回行い、各回の成功確率が p のとき、成功回数は二項分布に従います。その期待値（平均）は n×p です。
      10×0.3＝3 回です。
    why:
      - 0.3 は1回あたりの成功確率です。
      - 正解です。期待値＝n×p＝3 です。
      - 7 は失敗回数の期待値 10×0.7 です。
      - 10 は試行回数です。
    know: 二項分布の分散は n×p×(1−p) です（この例では 2.1）。期待値は「確率×値」をすべての場合について足したもので、長期的な平均値を表します。
    terms:
      - 二項分布
      - 期待値
    verify:
      value: 10 * 0.3
