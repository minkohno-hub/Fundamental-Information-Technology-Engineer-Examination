      - '3'
    a: イ
    exp: |
      M/M/1 モデルでは、利用率 ρ＝平均サービス時間÷平均到着間隔＝3÷4＝0.75 です。
      平均待ち時間（サービスを受けるまで）＝ ρ÷(1−ρ)×平均サービス時間 ＝ 0.75÷0.25×3 ＝ 3×3 ＝ 9分です。
    why:
      - 2.25 分は利用率にサービス時間を掛けただけの値です。
      - 正解です。0.75÷0.25×3＝9 分です。
      - 12 分は待ち時間にサービス時間 3 分を加えた、系内に滞在する平均時間（応答時間）です。
