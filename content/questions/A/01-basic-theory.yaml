    why:
      - これは強化学習の説明です。
      - これはホールドアウトなどによる検証の説明です。
      - 正解です。学習済みモデルを別の課題に再利用します。
      - これは教師なし学習（自己教師あり学習を含む）の説明です。
    terms:
      - 転移学習
      - ファインチューニング
