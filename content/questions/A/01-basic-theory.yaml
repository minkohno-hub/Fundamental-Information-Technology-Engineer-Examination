    know: 利用率 ρ が 1 に近づくと待ち時間は急激に長くなります。M/M/1 の「M」は到着がポアソン分布（到着間隔が指数分布）、サービス時間が指数分布に従うこと、「1」は窓口が1つであることを表します。
    terms:
      - 待ち行列理論
    verify:
      value: (3/4)/(1-3/4)*3
  - id: A01-039
    topic: 1-2-6
    diff: 3
    q: M/M/1 の待ち行列モデルで，平均サービス時間を変えずに窓口の利用率が 0.5 から 0.8 に上昇した。平均待ち時間は何倍になるか。
    c:
      - 2倍
      - 1.6倍
      - 4倍
      - 8倍
    a: ウ
    exp: |
      平均待ち時間は ρ÷(1−ρ)×平均サービス時間 です。平均サービス時間は変わらないので、ρ÷(1−ρ) の比を比べます。
      - ρ＝0.5 のとき：0.5÷0.5＝1
      - ρ＝0.8 のとき：0.8÷0.2＝4
      よって平均待ち時間は 4倍 になります。
    why:
      - 2倍は計算の誤りです。
      - 1.6倍は利用率の比（0.8÷0.5）で、待ち時間が利用率に比例すると誤解した値です。
      - 正解です。1 から 4 へ、4倍になります。
      - 8倍は計算の誤りです。
    know: 利用率が高くなるほど、わずかな負荷の増加で待ち時間が急増します。システムの性能設計では、利用率に余裕を持たせることが重要です。
