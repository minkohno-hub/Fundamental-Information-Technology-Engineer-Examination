    a: イ
    exp: |
      確率 p の事象の情報量は −log₂ p ビットで定義されます。
      p＝1/8 なら −log₂(1/8)＝log₂ 8＝3 ビットです。起こりにくい事象ほど、それが起きたと知ったときの情報量は大きくなります。
    why:
      - 0.125 は確率そのものです。
      - 正解です。log₂ 8＝3 ビットです。
      - 1 ビットは確率 1/2 の事象の情報量です。
      - 8 は確率の逆数で、対数をとっていない値です。
    know: 8通りの等しく起こりうる事象のどれかを区別するには3ビット（2³＝8）が必要、と考えると直感的に理解できます。平均情報量（エントロピー）は各事象の情報量の期待値です。
    terms:
