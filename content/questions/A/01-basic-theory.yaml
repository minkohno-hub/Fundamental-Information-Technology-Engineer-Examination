    q: 次の6個のデータの中央値（メジアン）はどれか。　2，3，3，5，7，10
    c:
      - '5'
      - '8'
      - '4'
      - '3'
    a: ウ
    exp: |
      中央値はデータを小さい順に並べたときの真ん中の値です。データが偶数個のときは、真ん中の2つの値の平均を中央値とします。
