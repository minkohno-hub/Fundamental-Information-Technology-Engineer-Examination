    q: 有向グラフについての記述として，正しいものはどれか。ここで，ある頂点に入ってくる辺の数を入次数，出ていく辺の数を出次数という。
    c:
      - すべての頂点の入次数の合計は，すべての頂点の出次数の合計に等しい。
      - すべての頂点の入次数の合計は，辺の数の2倍に等しい。
