  - id: A01-036
    topic: 1-2-5
    diff: 2
    q: 頂点が 5 個の無向グラフで，どの2頂点の間にも辺が1本ずつある（完全グラフ）とき，辺の数はいくつか。
    c:
      - '10'
      - '5'
      - '20'
      - '25'
    a: ア
    exp: |
      5個の頂点から2個を選ぶ組合せの数だけ辺があります。₅C₂＝(5×4)÷2＝10 本です。
      各頂点から他の4頂点へ辺が出ているので 5×4＝20 と数えると、1本の辺を両端から2回数えているため、2で割ります。
    why:
      - 正解です。₅C₂＝10 です。
      - 5 は頂点の数です。
      - 20 は各辺を2回数えた値です。無向グラフでは辺に向きがないので2で割ります。
      - 25 は 5×5 で、自分自身への辺（ループ）まで数えた値です。
    know: n 頂点の完全グラフの辺の数は n(n−1)/2 です。有向グラフで両方向の辺をすべて引く場合は n(n−1) 本です。
