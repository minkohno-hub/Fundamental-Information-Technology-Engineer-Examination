    q: 統計的仮説検定における「第1種の誤り」の説明として，適切なものはどれか。
    c:
      - 帰無仮説が誤っているにもかかわらず，帰無仮説を棄却しない誤り
      - 有意水準を大きく設定しすぎて，検出力が低下する誤り
      - 帰無仮説が正しいにもかかわらず，帰無仮説を棄却してしまう誤り
