    q: ニューラルネットワークの学習で用いられる誤差逆伝播法（バックプロパゲーション）の説明として，適切なものはどれか。
    c:
      - 入力層から出力層の方向へ順に計算して，出力値を求める。
      - 学習済みのモデルを，別の課題の学習の初期値として利用する。
      - 出力と正解との誤差を，出力層から入力層の方向へ伝えながら，各層の重みを誤差が小さくなるように調整する。
      - 学習データを複数のグループに分けて，交互に学習と評価を行う。
    a: ウ
    exp: |
      誤差逆伝播法は、ニューラルネットワークの出力と正解の差（誤差）を求め、その誤差を出力層から入力層へ向かって逆向きに伝えながら、各結合の重みを少しずつ修正する学習方法です。微分（勾配）を使って、誤差が小さくなる方向へ重みを更新します。
    why:
      - 入力から出力へ順に計算するのは順伝播（フォワードプロパゲーション）です。
      - 学習済みモデルを別の課題に利用するのは転移学習です。
      - 正解です。誤差を逆方向に伝えて重みを更新します。
      - データを分けて学習と評価を繰り返すのは交差検証です。
    terms:
      - バックプロパゲーション
      - ニューラルネットワーク
  - id: A01-055
    topic: 1-3-8-3
    diff: 3
    q: ディープラーニングにおける勾配消失問題の説明として，適切なものはどれか。
    c:
      - 層を深くすると，誤差逆伝播で入力層に近い層へ伝わる勾配が非常に小さくなり，学習が進まなくなる。
      - 学習データに偏りがあると，特定の分類ばかりを出力するようになる。
      - 学習率を大きくしすぎると，重みが発散して学習が収束しなくなる。
      - 学習データが少ないと，学習データに過度に適合してしまう。
    a: ア
    exp: |
      誤差逆伝播では、各層で勾配（微分の値）が掛け合わされながら入力層に向かって伝わります。シグモイド関数のように微分値が小さい活性化関数を使うと、層を重ねるほど勾配が小さくなり、入力層に近い層の重みがほとんど更新されなくなります。これが勾配消失問題です。
    why:
      - 正解です。深い層で勾配が小さくなり学習が進まない問題です。
      - これはデータの偏り（クラス不均衡）による問題です。
      - これは学習率が大きすぎる場合の発散（勾配爆発に近い現象）の説明で、勾配消失とは逆の現象です。
      - これは過学習の説明です。
    know: 対策として、ReLU などの活性化関数の採用、重みの初期値の工夫、バッチ正規化、残差接続などがあります。
    terms:
      - 勾配消失問題
      - 活性化関数
  - id: A01-056
