    q: |
      状態 S0 と S1 をもつ有限オートマトンがある。初期状態は S0 で，入力が 1 のときは状態が切り替わり（S0 なら S1 へ，S1 なら S0 へ），入力が 0 のときは状態が変わらない。入力をすべて読み終えたときに S0 にあれば受理する。受理される入力はどれか。
    c:
      - '1110'
      - '1011'
      - '1001'
      - '0100'
    a: ウ
    exp: |
      状態は 1 を読むたびに切り替わり、0 では変わりません。S0 から始めて最後に S0 に戻るのは、1 の個数が偶数のときです。
      - 1001：1 が2個（偶数）→ S0 で受理
      - 1011：1 が3個 → S1
      - 0100：1 が1個 → S1
      - 1110：1 が3個 → S1
    why:
      - 1 が3個（奇数）なので最後は S1 で、受理されません。
      - 1 が3個（奇数）なので最後は S1 で、受理されません。
      - 正解です。1 が2個なので最後に S0 になり受理されます。
      - 1 が1個（奇数）なので最後は S1 で、受理されません。
    know: このオートマトンは「偶数パリティの検査」と同じ働きをします。有限オートマトンは状態遷移図や状態遷移表で表され、字句解析などに利用されます。
    terms:
      - 有限オートマトン
  - id: A01-049
    topic: 1-3-7
    diff: 2
    q: あるアルゴリズムで，データ件数が 10 倍になると処理時間が約 100 倍になった。このアルゴリズムの時間計算量のオーダとして，最も適切なものはどれか。
    c:
      - O(log n)
      - O(n²)
      - O(n log n)
      - O(n)
    a: イ
    exp: |
      時間計算量 O(n²) は、処理時間がデータ件数 n の2乗に比例することを表します。n が10倍になると処理時間は 10²＝100倍になります。
      単純な選択ソートやバブルソートのように、二重のループで全ての組を比較するアルゴリズムが O(n²) です。
    why:
      - O(log n) なら、10倍のデータでも処理時間はわずかしか増えません（例：2分探索）。
      - 正解です。10倍の2乗で100倍です。
      - O(n log n) なら、10倍のデータで処理時間は10倍強（n＝1,000→10,000 なら約13倍）です。
      - O(n) なら、10倍のデータで処理時間も約10倍です。
    know: 主なオーダ：線形探索 O(n)、2分探索 O(log n)、クイックソートの平均・マージソート O(n log n)、バブルソート O(n²)。
    terms:
      - 計算量
  - id: A01-050
