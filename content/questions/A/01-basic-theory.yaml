  - id: A01-033
    topic: 1-2-3
    diff: 2
    q: ニュートン法の説明として，適切なものはどれか。
    c:
      - 解を含む区間を半分に分け，解が含まれる側の区間を選ぶ操作を繰り返して解を求める。
      - 関数を多項式で近似し，区間を細かく分割して面積の近似値を求める。
      - いくつかの既知の点を通る曲線を作り，その間の値を推定する。
      - 関数のグラフの接線と x 軸との交点を次の近似値とする操作を繰り返し，方程式の解を求める。
    a: エ
    exp: |
      ニュートン法は、ある近似値 x₀ における関数 f(x) の接線を引き、その接線が x 軸と交わる点を次の近似値 x₁ とする操作を繰り返して f(x)＝0 の解に近づける方法です。
      式で表すと xₙ₊₁＝xₙ−f(xₙ)/f′(xₙ) です。解の近くでは非常に速く収束しますが、初期値によっては収束しないこともあります。
    why:
      - 区間を半分にしていくのは二分法です。収束は遅いですが確実です。
      - 区間を分割して面積を求めるのは数値積分（台形公式・シンプソン法など）です。
      - 既知の点から間の値を推定するのは補間法です。
      - 正解です。接線を利用する反復法がニュートン法です。
    terms:
      - ニュートン法
  - id: A01-034
    topic: 1-2-3
    diff: 2
    q: 数値計算で生じる「打切り誤差」の説明として，適切なものはどれか。
    c:
      - 真の値に対する誤差の大きさの比率
      - 測定器の精度の限界によって生じる誤差
      - 無限に続く計算（無限級数など）を，有限回の計算で打ち切ることによって生じる誤差
      - 指定された有効桁数に収めるために，数値の端数を四捨五入や切捨てすることによって生じる誤差
    a: ウ
    exp: |
      打切り誤差は、本来は無限回続く計算や極限操作を、途中で打ち切ることによって生じる誤差です。例えば sin x を無限級数で計算するとき、有限の項で計算を止めると、残りの項の分だけ誤差が生じます。
    why:
      - 真の値に対する誤差の比率は相対誤差です。
      - 測定器の精度による誤差は測定誤差であり、数値計算の打切り誤差ではありません。
      - 正解です。計算を途中で打ち切ることによる誤差です。
      - 端数処理による誤差は丸め誤差です。
    know: 絶対誤差＝｜近似値−真の値｜、相対誤差＝絶対誤差÷｜真の値｜です。
    terms:
      - 誤差
  - id: A01-035
    topic: 1-2-4
    diff: 2
    q: 関数 f(x)＝x²＋3x を微分した関数 f′(x) について，x＝2 における値 f′(2) はどれか。
    c:
      - '4'
      - '13'
      - '7'
      - '10'
    a: ウ
    exp: |
      xⁿ を微分すると n×xⁿ⁻¹ になります。f(x)＝x²＋3x を微分すると f′(x)＝2x＋3 です。
      x＝2 を代入すると f′(2)＝2×2＋3＝7 です。f′(2) は x＝2 における接線の傾きを表します。
    why:
      - 4 は 3x の項を微分した結果（3）を加えていない値です。
      - 13 は微分の計算を誤った値です。
      - 正解です。2×2＋3＝7 です。
      - 10 は微分せずに f(2)＝4＋6 を計算した値です。
    know: 数式処理（数式を記号のまま扱う計算）では、因数分解・微分・積分などをコンピュータで記号的に行います。微分はニュートン法の接線の傾きにも使われます。
    terms:
