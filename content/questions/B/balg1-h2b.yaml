  method: 独立レビュー担当が解答を伏せて全問を自力トレースし、正答の一意性・誤答の検証と既存問題との重複確認を実施。B-ALG-208 は問題文に関数の仕様を明記し、B-ALG-209 の誤答解説の導出を実計算に合う形へ差し替え、再確認で全件の整合を検証済み
questions:
  - id: B-ALG-206
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の走査と累積。負の値を含む配列について、連続区間の和の最大値を、累積をリセットしながら求めるプログラムのトレースであり、範囲内。
    prereq: 配列の走査、累積変数の更新、条件による累積のリセット
    hard: 累積が負になったら次の要素から区間を始めるという分岐が、現在の要素を捨てるのではなく区間の開始位置を変える働きをすることを追う必要がある。
    q: |
      次のプログラムを実行したときの、関数 maxRun(a) の戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      関数 maxRun は、配列 a の連続する要素の和（区間の和）の最大値を返す。a ＝ {3, －5, 4, 2, －1, 3, －4} として maxRun(a) を呼び出す。
    code: |
      ○整数型: maxRun(整数型の配列: a)
        整数型: i, cur, best
        cur ← a[1]
        best ← a[1]
        for (i を 2 から aの要素数 まで 1 ずつ増やす)
          if (cur ＜ 0)
            cur ← a[i]
          else
            cur ← cur ＋ a[i]
          endif
          if (cur ＞ best)
            best ← cur
          endif
        endfor
        return best
    c:
      - '2'
      - '4'
      - '8'
      - '12'
    a: ウ
    exp: |
      cur は「現在の要素で終わる区間の和」、best はこれまでの最大値です。

      | i | a[i] | cur の更新 | cur | best |
      | --- | --- | --- | --- | --- |
      | （初期） | 3 | － | 3 | 3 |
      | 2 | －5 | 3 ≧ 0 なので加算 | －2 | 3 |
      | 3 | 4 | cur ＜ 0 なので a[3] から開始 | 4 | 4 |
      | 4 | 2 | 加算 | 6 | 6 |
      | 5 | －1 | 加算 | 5 | 6 |
      | 6 | 3 | 加算 | 8 | 8 |
      | 7 | －4 | 加算 | 4 | 8 |

      戻り値は 8 です。最大の区間は {4, 2, －1, 3}（要素 3〜6）で、和は 8 です。
    why:
      - 配列全体の和（3 － 5 ＋ 4 ＋ 2 － 1 ＋ 3 － 4 ＝ 2）です。求めるのは連続区間の和の最大値であり、全体の和とは限りません。
      - 配列の最大の要素の値です。1 要素の区間より、複数要素の区間のほうが大きくなる場合があります。
      - 正解です。要素 3〜6 の区間 {4, 2, －1, 3} の和 8 が最大です。
      - 正の要素だけを合計した値（3 ＋ 4 ＋ 2 ＋ 3）です。正の要素の間にある －1 も含めた区間のほうが、連続区間としては自然に数えられます。
    know: 「累積が負になったら区間を切り替える」は、最大区間和を求める走査の基本形。全体の和や要素の最大値とは異なる量であり、負の要素を含む区間が最適になる場合がある点が要点である。
    terms:
      - 配列
      - 累積和
    verify:
      result:
        call: maxRun
        args:
          - - 3
            - -5
            - 4
            - 2
            - -1
            - 3
            - -4
        of: return
    sim:
      entry: maxRun
      args:
        - - 3
          - -5
          - 4
          - 2
          - -1
          - 3
          - -4
  - id: B-ALG-207
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の両端からの走査。配列が回文（前から読んでも後ろから読んでも同じ）かどうかを、両端の要素を比べながら判定するプログラムのトレースであり、範囲内。
    prereq: 両端の添字を近づけていく走査、途中で不一致があれば即座に終了する処理
    hard: 比較の対象が「隣り合う要素」ではなく「対向する位置の要素」であることと、不一致がなければ 1 を返す終了条件を正しく追う必要がある。
    q: |
      次のプログラムを実行したときの、関数 pal(a) の戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      関数 pal は、配列 a が前から読んでも後ろから読んでも同じ並び（回文）なら 1 を、そうでなければ 0 を返す。a ＝ {5, 1, 4, 1, 5} として pal(a) を呼び出す。
    code: |
      ○整数型: pal(整数型の配列: a)
        整数型: i, j
        i ← 1
        j ← aの要素数
        while (i ＜ j)
          if (a[i] ≠ a[j])
            return 0
          endif
          i ← i ＋ 1
          j ← j － 1
        endwhile
        return 1
    c:
      - '1'
      - '2'
      - '5'
      - '0'
    a: ア
    exp: |
      両端の要素を比べながら、添字を内側へ進めます。
      - i ＝ 1、j ＝ 5： a[1] ＝ 5 と a[5] ＝ 5 は一致 → i ＝ 2、j ＝ 4 へ
      - i ＝ 2、j ＝ 4： a[2] ＝ 1 と a[4] ＝ 1 は一致 → i ＝ 3、j ＝ 3 へ
      - i ＜ j ではなくなったのでループを抜け、1 を返します。
      したがって戻り値は 1 です。
    why:
      - 正解です。対向する要素が全て一致し、回文と判定されて 1 が返ります。
      - 比較した組の数です。戻り値は判定結果（1 か 0）であり、比較回数ではありません。
      - 配列の要素数です。戻り値とは関係ありません。
      - 不一致が見つかった場合の戻り値です。本問では両端の組がどちらも一致しています。
    know: 回文判定は「両端から内側へ」という走査の典型例。真ん中の要素は相手がいないため比較の対象にならず、比較は要素数の半分（切り捨て）回で済む。
    terms:
      - 配列
    verify:
      result:
        call: pal
        args:
          - - 5
            - 1
            - 4
            - 1
            - 5
        of: return
    sim:
      entry: pal
      args:
        - - 5
          - 1
          - 4
          - 1
          - 5
  - id: B-ALG-208
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の走査と状態の更新。最大値が複数回現れる配列で、最大値と等しい要素を除いた中での最大値（重複を除いた2番目の値）を求めるプログラムのトレースであり、範囲内。
    prereq: 最大値の更新時に元の最大値が2番目の候補へ移ること、最大値と等しい要素は2番目の値にはならないこと
    hard: 最大値と等しい要素が現れたときは、2番目の候補を更新しないという条件分岐（小さいことの確認）が効く点を含めて、変数の更新を順序どおりに追う必要がある。
    q: |
      次のプログラムを実行したときの、関数 secondD(a) の戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      関数 secondD は、配列の中で、最大値とは異なる値の中での最大値（重複を除いた 2 番目の値）を返す。a ＝ {8, 3, 10, 5, 10, 7} として secondD(a) を呼び出す。
    code: |
      ○整数型: secondD(整数型の配列: a)
        整数型: i, m1, m2, x
        m1 ← 0
        m2 ← 0
        for (i を 1 から aの要素数 まで 1 ずつ増やす)
          x ← a[i]
          if (x ＞ m1)
            m2 ← m1
            m1 ← x
          elseif (x ＜ m1 and x ＞ m2)
            m2 ← x
          endif
        endfor
        return m2
    c:
      - '7'
      - '5'
      - '10'
      - '8'
    a: エ
    exp: |
      m1 が最大値、m2 が「最大値とは異なる値の中での最大値」です。走査の経過は次のとおりです。
      - x ＝ 8： m1 より大きい → m2 ＝ 0、m1 ＝ 8
      - x ＝ 3： m1 より小さく、m2 より大きい → m2 ＝ 3
      - x ＝ 10： m1 より大きい → m2 ＝ 8、m1 ＝ 10
      - x ＝ 5： m1 より小さいが、m2 ＝ 8 より大きくない → 変化なし
      - x ＝ 10： m1 と等しい → どちらの条件にも当てはまらず変化なし（2 番目の値は最大値とは異なる値から選ぶため）
      - x ＝ 7： m1 より小さいが、m2 ＝ 8 より大きくない → 変化なし
      戻り値は 8 です。
    why:
      - 最大値より小さい要素が現れるたびに、比較せずに m2 を上書きしてしまった場合の値です（最後に現れた 7 が残ります）。
      - 最大値 10 が初めて現れた直後の要素です。位置の前後ではなく、値の大きさで決まります。
      - 最大値そのものです。最大値が 2 回現れても、それを 2 番目の値とは数えません。
      - 正解です。最大値 10 を除いた値の中で最も大きいのは 8 です。
    know: 最大値が複数回現れるデータで「2 番目」を考えるときは、同値の扱いが要点になる。最大値と等しい要素を候補から外すには、「最大値より小さい」という条件を更新の判定に含める必要がある。
    terms:
      - 配列
      - 最大値
    verify:
      result:
        call: secondD
        args:
          - - 8
            - 3
            - 10
            - 5
            - 10
            - 7
        of: return
    sim:
      entry: secondD
      args:
        - - 8
          - 3
          - 10
          - 5
          - 10
          - 7
  - id: B-ALG-209
    topic:
      - B2
      - 2-2-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の繰返しと剰余。1から n までの数で割り切れるものの合計を累積するプログラムのトレースであり、範囲内。
    prereq: mod（剰余）が 0 であることが割り切れることと等しいこと、条件を満たす要素だけを累積するループ
    hard: 数えるのではなく、約数そのものを合計に加えていく累積であり、どの数が約数かを全て洗い出した上で合計する必要がある。
    q: |
      次のプログラムを実行したときの、関数 sumDiv(28) の戻り値を、解答群の中から選べ。
    code: |
      ○整数型: sumDiv(整数型: n)
        整数型: i, s
        s ← 0
        for (i を 1 から n まで 1 ずつ増やす)
          if (n mod i ＝ 0)
            s ← s ＋ i
          endif
        endfor
        return s
    c:
      - '28'
      - '84'
      - '6'
      - '56'
    a: エ
    exp: |
      28 の約数を全て洗い出し、合計します。i を 1 から 28 まで動かし、28 mod i ＝ 0 になる i だけを s に加えます。約数は 1、2、4、7、14、28 の 6 個であり、合計は 1 ＋ 2 ＋ 4 ＋ 7 ＋ 14 ＋ 28 ＝ 56 です。3、5、6、8 などでは剰余が 0 にならないため、加えられません。
    why:
      - n 自身（28）を除いた約数の合計です（1 ＋ 2 ＋ 4 ＋ 7 ＋ 14 ＝ 28）。本問では、n 自身も約数に含めて合計します。
      - n 自身を二重に加えてしまった場合の値です（56 ＋ 28 ＝ 84）。
      - 約数の個数です。本問は個数ではなく、約数そのものの合計を返します。
      - 正解です。約数 1、2、4、7、14、28 の合計は 56 です。
    know: 約数の合計は、数え上げと同じ「剰余が 0 か」の判定を使いながら、数える代わりに値そのものを累積する。n 自身を除いた約数の合計が n と等しくなる数（28 のような数）は完全数と呼ばれる。
    terms:
      - 剰余
      - 完全数
    verify:
      result:
        call: sumDiv
        args:
          - 28
        of: return
    sim:
      entry: sumDiv
      args:
        - 28
  - id: B-ALG-210
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の配列の入れ替え。配列の一部分（区間）だけを逆順にするプログラムで、区間の両端から交換を進めるトレースであり、範囲内。
    prereq: 一時変数を使った値の交換、区間の両端の添字を内側へ寄せながら交換を繰り返すこと
    hard: 交換の対象が区間の中だけであり、区間の外の要素は動かないことと、両端の添字が近づいて条件を満たさなくなった時点で止まることを追う必要がある。
    q: |
      次のプログラムを実行したときの、関数 revPart(a) の戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      a ＝ {10, 20, 30, 40, 50, 60, 70} として revPart(a) を呼び出す。配列の引数は参照渡しである。この手続は、a の 2 番目から 5 番目までの区間を逆順にする。
    code: |
      ○整数型: revPart(整数型の配列: a)
        整数型: i, j, t
        i ← 2
        j ← 5
        while (i ＜ j)
          t ← a[i]
          a[i] ← a[j]
          a[j] ← t
          i ← i ＋ 1
          j ← j － 1
        endwhile
        return a[2]
    c:
      - '20'
      - '30'
      - '50'
      - '60'
    a: ウ
    exp: |
      交換は、区間（2 番目から 5 番目）の中だけで行われます。
      - i ＝ 2、j ＝ 5： a[2] と a[5] を交換 → {10, 50, 30, 40, 20, 60, 70}
      - i ＝ 3、j ＝ 4： a[3] と a[4] を交換 → {10, 50, 40, 30, 20, 60, 70}
      - i ＝ 4、j ＝ 3： i ＜ j が成り立たず終了
      区間の外の a[1] ＝ 10 と a[6] ＝ 60、a[7] ＝ 70 は動きません。a[2] は 50 であり、戻り値は 50 です。
    why:
      - 元の a[2] の値です。交換によって a[2] は元の a[5] の値に変わります。
      - 逆順になった後の a[4] の値です。問われているのは a[2] です。
      - 正解です。区間が逆順になり、a[2] には元の a[5] の値 50 が入ります。
      - 配列全体を逆順にしたと誤解した場合に a[2] に来る値（元の a[6]）です。反転するのは 2 番目から 5 番目の区間だけです。
    know: 部分区間の反転は、区間の両端から交換を始め、添字が交差したところで止める。全体の反転と違い、区間の外側の要素は一切動かない点が要点である。
    terms:
      - 配列
      - 交換
    verify:
      result:
        call: revPart
        args:
          - - 10
            - 20
            - 30
            - 40
            - 50
            - 60
            - 70
        of: return
    sim:
      entry: revPart
      args:
        - - 10
          - 20
          - 30
          - 40
          - 50
          - 60
          - 70
  - id: B-ALG-211
    topic:
      - B2
      - 2-2-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の整列。挿入ソートのプログラムについて、要素をずらす内側の繰返しを含めて全体をトレースし、整列後の要素を答える問題であり、範囲内。
    prereq: 挿入ソートの手順（キーとなる要素を取り出し、それより大きい要素を後ろへずらして、空いた位置へ入れる）
    hard: 内側の繰返しでずらした要素の並びが、外側の繰返しのたびにどう変わるかを追う必要がある。特に、ずらす条件を満たさなくなった位置へのキーの挿入位置の扱いが要点になる。
    q: |
      次のプログラムを実行したときの、関数 isort(a) の戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      a ＝ {6, 2, 5, 1, 4} として isort(a) を呼び出す。配列の引数は参照渡しである。
    code: |
      ○整数型: isort(整数型の配列: a)
        整数型: i, j, key
        for (i を 2 から aの要素数 まで 1 ずつ増やす)
          key ← a[i]
          j ← i － 1
          while (j ≧ 1 and a[j] ＞ key)
            a[j ＋ 1] ← a[j]
            j ← j － 1
          endwhile
          a[j ＋ 1] ← key
        endfor
        return a[4]
    c:
      - '5'
      - '2'
      - '6'
      - '4'
    a: ア
    exp: |
      外側の繰返しの各回で、キーとなる要素が整列済みの部分へ挿入されます。
      - i ＝ 2（key ＝ 2）： 6 をずらし、先頭へ → {2, 6, 5, 1, 4}
      - i ＝ 3（key ＝ 5）： 6 をずらし、6 の前へ → {2, 5, 6, 1, 4}
      - i ＝ 4（key ＝ 1）： 6、5、2 をずらし、先頭へ → {1, 2, 5, 6, 4}
      - i ＝ 5（key ＝ 4）： 6、5 をずらし、5 の前へ → {1, 2, 4, 5, 6}
      整列が完了し、a[4] ＝ 5 です。戻り値は 5 です。
    why:
      - 正解です。昇順に整列された {1, 2, 4, 5, 6} の 4 番目は 5 です。
      - 整列後の a[2] の値です。位置を取り違えています。
      - 整列後の a[5]（最大値）の値です。位置を取り違えています。
      - 整列後の a[3] の値です。問われているのは a[4] です。
    know: 挿入ソートは「整列済みの部分を保ちながら、1 つずつ要素を正しい位置へ差し込む」整列。内側の繰返しで要素をずらす回数は、その要素より前にあって大きい要素の個数と一致する。
    terms:
      - 挿入ソート
      - 配列
    verify:
      result:
        call: isort
        args:
          - - 6
            - 2
            - 5
            - 1
            - 4
        of: return
    sim:
      entry: isort
      args:
        - - 6
          - 2
          - 5
          - 1
          - 4
  - id: B-ALG-212
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の条件付きの累積。2つの配列の対応する要素について、条件を満たすものだけを掛けて合計するプログラムのトレースであり、範囲内。
    prereq: 2つの配列の同じ位置の要素を組み合わせる走査、剰余による偶数の判定
    hard: 条件が「a の要素が偶数のとき」であり、b の要素の偶奇ではない点と、条件を満たさない組は積も加算もされない点を正しく追う必要がある。
    q: |
      次のプログラムを実行したときの、関数 edot(a, b) の戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      a ＝ {1, 2, 3, 4}、b ＝ {5, 3, 2, 1} として edot(a, b) を呼び出す。
    code: |
      ○整数型: edot(整数型の配列: a, 整数型の配列: b)
        整数型: i, s
        s ← 0
        for (i を 1 から aの要素数 まで 1 ずつ増やす)
          if (a[i] mod 2 ＝ 0)
            s ← s ＋ a[i] × b[i]
          endif
        endfor
        return s
    c:
      - '21'
      - '10'
      - '0'
      - '11'
    a: イ
    exp: |
      条件を満たすのは、a の要素が偶数の位置だけです。
      - i ＝ 1： a[1] ＝ 1 は奇数 → 加算しない
      - i ＝ 2： a[2] ＝ 2 は偶数 → s ＝ 0 ＋ 2 × 3 ＝ 6
      - i ＝ 3： a[3] ＝ 3 は奇数 → 加算しない
      - i ＝ 4： a[4] ＝ 4 は偶数 → s ＝ 6 ＋ 4 × 1 ＝ 10
      戻り値は 10 です。
    why:
      - 条件を付けずに全ての積を合計した値（5 ＋ 6 ＋ 6 ＋ 4）です。奇数の位置は除外されます。
      - 正解です。偶数の位置の積だけを合計して 10 です。
      - a の要素と b の要素の両方が偶数の場合だけ加算すると誤解した場合の値です。そのような位置は無く、合計は 0 のままになります。
      - a の要素が奇数の位置だけを合計した値（1 × 5 ＋ 3 × 2）です。条件は偶数の位置です。
    know: 2つの配列を組み合わせる走査では、条件の対象がどちらの配列の要素かを読み違えないことが重要。条件付きの累積は、該当する位置だけが合計に寄与する。
