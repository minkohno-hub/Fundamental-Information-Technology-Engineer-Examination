  - id: B-ALG-213
    topic:
      - B2
      - 2-1-2-2
    diff: 4
    scope: 科目B「アルゴリズムとプログラミング」の二重ループによる数え上げ。最頻値（最も多く現れる値）を求めるプログラムについて、同数の値が複数あるときの扱いまで含めたトレースであり、範囲内。
    prereq: 二重ループで各要素の出現回数を数えること、最大値の更新が「より大きいときだけ」行われること
    hard: 出現回数が同数の値が2つあるため、更新条件が「＞」であること（先に現れた値が残る）が結果を決める。回数の数え上げと、更新のタイミングの両方を追う必要がある。
    q: |
      次のプログラムを実行したときの、関数 mode(a) の戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      a ＝ {4, 2, 4, 3, 2, 4, 2} として mode(a) を呼び出す。
    code: |
      ○整数型: mode(整数型の配列: a)
        整数型: i, j, c, best, bestC
        bestC ← 0
        best ← a[1]
        for (i を 1 から aの要素数 まで 1 ずつ増やす)
          c ← 0
          for (j を 1 から aの要素数 まで 1 ずつ増やす)
            if (a[j] ＝ a[i])
              c ← c ＋ 1
            endif
          endfor
          if (c ＞ bestC)
            bestC ← c
            best ← a[i]
          endif
        endfor
        return best
    c:
      - '4'
      - '2'
      - '3'
      - '7'
    a: ア
    exp: |
      各値の出現回数は、4 が 3 回、2 が 3 回、3 が 1 回です。best の更新を追います。
      - i ＝ 1（a[1] ＝ 4）： c ＝ 3 ＞ bestC ＝ 0 → best ＝ 4、bestC ＝ 3
      - i ＝ 2（a[2] ＝ 2）： c ＝ 3 ですが、3 ＞ 3 ではないため更新されません
      - 以後の i でも、c が 3 を超えることはありません
      したがって、戻り値は最初に現れた最頻値の 4 です。同数の場合は、更新条件が「＞」であるため、先に現れた値が残ります。
    why:
      - 正解です。出現回数 3 回で最初に現れた 4 が返ります。
      - 2 も出現回数は 3 回で最頻値の候補ですが、更新条件が「＞」のため、同数では先に登録された 4 が差し替えられません。
      - 最も多い出現回数そのものです。戻り値は「回数」ではなく「値」です。
      - 配列の要素数です。戻り値とは関係ありません。
    know: 最頻値を求める処理では、同数の値が複数あるときの扱い（先勝ちか後勝ちか）は、更新条件を「＞」にするか「≧」にするかで決まる。仕様としてどちらが求められているかを確認することが重要である。
    terms:
      - 二重ループ
      - 配列
    verify:
      result:
        call: mode
        args:
          - - 4
            - 2
            - 4
            - 3
            - 2
            - 4
            - 2
        of: return
    sim:
      entry: mode
      args:
        - - 4
          - 2
          - 4
          - 3
          - 2
          - 4
          - 2
