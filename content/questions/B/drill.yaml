  - id: B-DRL-098
    topic: B3
    diff: 2
    type: input
    accept: ['3', '３']
    q: 次のプログラムを実行した後の変数 mx の値を答えよ。
    code: |
      文字列型: s ← "(()(()))"
      整数型: i, d ← 0, mx ← 0
