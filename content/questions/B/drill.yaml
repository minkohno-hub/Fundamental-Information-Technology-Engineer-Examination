  - id: B-DRL-036
    topic: B3
    diff: 2
    q: 関数 pw を pw(3, 5) として呼び出したときの戻り値はどれか。ここで，整数型の変数に代入するときは小数点以下を切り捨てるものとする。
    code: |
      ○整数型: pw(整数型: x, 整数型: n)
        整数型: h, m
        if (n ＝ 0)
          return 1
        endif
        m ← n ÷ 2
        h ← pw(x, m)
        if (n mod 2 ＝ 0)
          return h × h
        endif
        return h × h × x
    c: ['243', '125', '15', '81']
    a: ア
    exp: |
      指数を半分にして再帰的に累乗を求めます。pw(3,0)＝1、pw(3,1)＝1×1×3＝3、pw(3,2)＝3×3＝9、pw(3,5)＝9×9×3＝243（n＝5 は奇数なので x を 1 回多く掛けます）。3⁵＝243 です。
    why:
      - 正解です。3 の 5 乗です。
      - 125 は 5 の 3 乗で、x と n を逆にしています。
      - 15 は 3×5 で、累乗ではありません。
      - 81 は 3 の 4 乗で、n が奇数のときの × x を忘れた場合です。
    terms: [再帰, 再帰呼出し]
    verify: { result: { call: pw, args: [3, 5] } }
    sim: { entry: pw, args: [3, 5] }

