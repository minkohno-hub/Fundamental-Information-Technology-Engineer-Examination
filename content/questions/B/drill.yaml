  - id: B-DRL-060
    topic: B3
    diff: 2
    q: 要素数 5 の配列 h をハッシュ表として使い，キーを格納する。格納位置が埋まっていれば次の位置（末尾の次は先頭）を調べる。次のプログラムを実行した後の配列 h の内容はどれか。
    code: |
      整数型の配列: h ← {5個の0}
      整数型の配列: keys ← {12, 7, 22}
      整数型: i, p
      for (i を 1 から 3 まで 1 ずつ増やす)
        p ← keys[i] mod 5 ＋ 1
        while (h[p] ≠ 0)
          p ← p mod 5 ＋ 1
        endwhile
        h[p] ← keys[i]
      endfor
    c: ['{0, 0, 12, 7, 22}', '{0, 12, 7, 22, 0}', '{0, 0, 22, 0, 0}', '{12, 7, 22, 0, 0}']
    a: ア
    exp: |
      12, 7, 22 はどれも 5 で割った余りが 2 なので、格納位置は 3 になります（衝突）。12 は h[3]、7 は h[3] が埋まっているので h[4]、22 は h[3], h[4] が埋まっているので h[5] に入ります。
    why:
      - 正解です。衝突したキーは次の空き位置に入ります。
      - 「{0, 12, 7, 22, 0}」は位置を余り（＋1 なし）で決めた場合です。
      - 「{0, 0, 22, 0, 0}」は衝突時に上書きした場合です。
      - 「{12, 7, 22, 0, 0}」はハッシュ値を使わず先頭から詰めた場合です。
    terms: [ハッシュ表]
    verify: { result: { of: 'var:h' } }

