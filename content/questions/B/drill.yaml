      合計 s＝7＋8＋10＝25、25÷3＝8.33… です。ave は整数型なので小数点以下を切り捨てて 8 になります。
    why:
      - 正解です。整数型への代入で切り捨てられます。
      - 8.3 は実数型の変数に代入した場合の概数で、整数型には入りません。
      - 9 は四捨五入や切上げをした場合です。
      - 25 は合計で、要素数で割っていません。
    terms: [整数型, 実数型]
    verify: { result: { of: 'var:ave' } }

  - id: B-DRL-088
    topic: B2
    diff: 1
    q: 関数 cond を cond(7, 3) として呼び出したとき，戻り値が true になるのは【a】にどの式を入れた場合か。
    code: |
      ○論理型: cond(整数型: x, 整数型: y)
        return 【a】
    c:
      - 'x mod y ＝ 1 and y < x'
      - 'x < y or x mod 2 ＝ 0'
      - 'not (x ≧ y)'
      - 'x － y < y and x > 0'
    a: ア
    exp: |
      x＝7, y＝3 を代入して各式を評価します。7 mod 3＝1 は真、3＜7 も真なので and は true です。ほかの式はどれも false になります。
    why:
      - 正解です。true and true で true です。
      - 7＜3 は偽、7 mod 2＝1 なので x mod 2＝0 も偽で、or でも false です。
      - 7≧3 は真なので、その否定は false です。
      - 7－3＝4＜3 が偽なので、and は false です。
    terms: [論理型, 論理積]
    verify:
      cases:
        - { call: cond, args: [7, 3], expect: true }

  - id: B-DRL-089
    topic: B2
    diff: 2
    q: 関数 inRange は，x が 10 以上 20 未満のときだけ true を返す。【a】に入れる式として適切なものはどれか。
    code: |
      ○論理型: inRange(整数型: x)
        return 【a】
    c:
      - '10 ≦ x and x < 20'
      - '10 ≦ x or x < 20'
      - '10 < x and x ≦ 20'
      - 'not (x < 10) and x ≦ 20'
    a: ア
    exp: |
      「10 以上」は 10≦x、「20 未満」は x＜20 で、両方を満たす必要があるので and で結びます。境界の 10 は true、20 は false になります。
    why:
      - 正解です。x＝9, 10, 15, 20 で false, true, true, false になります。
      - or にすると、どんな整数も少なくとも一方を満たすので常に true になります。
      - 10 が false、20 が true になり、境界が両方ずれています。
      - not (x＜10) は 10≦x と同じで正しいですが、x≦20 なので 20 も true になります。
    terms: [論理型, 選択処理]
    verify:
      cases:
        - { call: inRange, args: [9], expect: false }
        - { call: inRange, args: [10], expect: true }
        - { call: inRange, args: [15], expect: true }
        - { call: inRange, args: [20], expect: false }

  - id: B-DRL-090
    topic: B2
    diff: 2
    q: 関数 notBoth は not (a > 3 and b > 3) の値を返す。同じ値を返す式として【a】に入れるものはどれか。
    code: |
      ○論理型: notBoth(整数型: a, 整数型: b)
        return 【a】
    c:
      - 'a ≦ 3 or b ≦ 3'
      - 'a ≦ 3 and b ≦ 3'
      - 'a < 3 or b < 3'
      - 'not (a > 3) and b > 3'
    a: ア
    exp: |
      ド・モルガンの法則により、not (P and Q) は (not P) or (not Q) です。not (a＞3) は a≦3、not (b＞3) は b≦3 なので、a≦3 or b≦3 になります。
    why:
      - 正解です。and の否定は、それぞれの否定の or です。
      - and のままにすると、a＝2, b＝5 のような場合に false になってしまいます。
      - 3 を含まないので、a＝3, b＝5 で false になってしまいます。
      - a＝5, b＝2 のように b だけが 3 以下の場合に false になってしまいます。
    terms: [論理型, 論理積]
    verify:
      cases:
        - { call: notBoth, args: [5, 5], expect: false }
        - { call: notBoth, args: [2, 5], expect: true }
        - { call: notBoth, args: [5, 2], expect: true }
        - { call: notBoth, args: [3, 5], expect: true }
        - { call: notBoth, args: [2, 2], expect: true }

  - id: B-DRL-091
    topic: B2
    diff: 1
    type: input
    accept: ['8', '８']
    q: 次のプログラムを実行した後の変数 n の値を答えよ。
    code: |
      整数型の配列: a ← {}
      整数型: i
      for (i を 1 から 10 まで 1 ずつ増やす)
        if (i mod 4 ≠ 0)
          a の末尾に i を追加する
        endif
      endfor
