  - id: B-DRL-021
    topic: [B3, 2-2-1]
    diff: 2
    q: 関数 bs を bs({1, 3, 5, 7, 9, 11, 13}, 11) として呼び出したときの戻り値はどれか。ここで，整数型の変数に代入するときは小数点以下を切り捨てるものとする。
    code: |
      ○整数型: bs(整数型の配列: a, 整数型: x)
        整数型: lo ← 1, hi ← aの要素数, mid, c ← 0
        while (lo ≦ hi)
          c ← c ＋ 1
          mid ← (lo ＋ hi) ÷ 2
          if (a[mid] ＝ x)
            return c
          elseif (a[mid] < x)
            lo ← mid ＋ 1
          else
            hi ← mid － 1
          endif
        endwhile
        return -c
    c: ['2', '1', '3', '6']
    a: ア
    exp: |
      二分探索で x と比較した回数 c を返します。1 回目は lo＝1, hi＝7 で mid＝4、a[4]＝7＜11 なので lo＝5。2 回目は mid＝(5＋7)÷2＝6、a[6]＝11 で一致し、c＝2 を返します。
    why:
      - 正解です。中央の 7、次に 11 と 2 回の比較で見つかります。
      - 1 回で見つかるのは中央の要素 7 を探した場合です。
      - 3 回は 2 回目の mid を 5 と計算するなど、中央の位置を誤った場合です。
      - 6 は 11 の要素番号で、比較回数ではありません。線形探索なら 6 回の比較が必要です。
    terms: [二分探索]
    verify: { result: { call: bs, args: [[1, 3, 5, 7, 9, 11, 13], 11] } }
    sim: { entry: bs, args: [[1, 3, 5, 7, 9, 11, 13], 11] }

  - id: B-DRL-022
    topic: [B3, 2-2-2]
    diff: 1
    q: 次のプログラムを実行した後の配列 a の内容はどれか。
    code: |
      整数型の配列: a ← {5, 1, 4, 2}
      整数型: i, t
      for (i を 1 から 3 まで 1 ずつ増やす)
        if (a[i] > a[i ＋ 1])
          t ← a[i]
          a[i] ← a[i ＋ 1]
          a[i ＋ 1] ← t
        endif
      endfor
    c: ['{1, 4, 2, 5}', '{1, 2, 4, 5}', '{1, 5, 4, 2}', '{1, 4, 5, 2}']
    a: ア
    exp: |
      隣どうしを比べて、前の方が大きければ交換する操作を 1 往復だけ行います（バブルソートの 1 パス目）。5 と 1 を交換して {1, 5, 4, 2}、5 と 4 を交換して {1, 4, 5, 2}、5 と 2 を交換して {1, 4, 2, 5} となり、最大値 5 が末尾に移動します。
    why:
      - 正解です。1 パスで最大値が末尾に確定します。
      - 「{1, 2, 4, 5}」は整列が完了した状態で、さらにパスを繰り返す必要があります。
      - 「{1, 5, 4, 2}」は i＝1 の交換だけを行った状態です。
      - 「{1, 4, 5, 2}」は i＝2 までの状態で、i＝3 の交換をしていません。
    terms: [バブルソート]
    verify: { result: { of: 'var:a' } }

  - id: B-DRL-023
    topic: [B3, 2-2-2]
    diff: 2
    q: 関数 swaps を swaps({4, 3, 1, 2}) として呼び出したときの戻り値はどれか。
    code: |
      ○整数型: swaps(整数型の配列: a)
        整数型: i, j, t, c ← 0
        for (i を aの要素数 から 2 まで 1 ずつ減らす)
          for (j を 1 から i － 1 まで 1 ずつ増やす)
            if (a[j] > a[j ＋ 1])
              t ← a[j]
              a[j] ← a[j ＋ 1]
              a[j ＋ 1] ← t
              c ← c ＋ 1
            endif
          endfor
        endfor
        return c
    c: ['5', '6', '3', '4']
    a: ア
    exp: |
      バブルソートの交換回数を数えます。1 パス目 {4,3,1,2}→{3,4,1,2}→{3,1,4,2}→{3,1,2,4}（3 回）、2 パス目 {1,3,2,4}→{1,2,3,4}（2 回）、3 パス目は交換なし。合計 5 回です。交換回数は「前にあるのに大きい」組（反転）の数 (4,3)(4,1)(4,2)(3,1)(3,2) の 5 個に等しくなります。
    why:
      - 正解です。1 パス目に 3 回、2 パス目に 2 回交換します。
      - 6 は比較の回数（3＋2＋1）で、交換回数ではありません。
      - 3 は 1 パス目の交換回数だけです。
      - 4 は要素数で、交換回数とは関係ありません。
    terms: [バブルソート]
    verify: { result: { call: swaps, args: [[4, 3, 1, 2]] } }
    sim: { entry: swaps, args: [[4, 3, 1, 2]] }

