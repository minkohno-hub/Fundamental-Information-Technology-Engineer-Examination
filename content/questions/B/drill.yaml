    why:
      - 正解です。5 文字目で深さが 3 になります。
      - 4 は「(」の総数で、途中で閉じた括弧を考慮していません。
      - 2 は前半の (() までの最大の深さです。
      - 0 は最後の d の値です。
    terms: [文字列型, スタック]
    verify: { result: { of: 'var:mx' } }

