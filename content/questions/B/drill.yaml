    exp: |
      4 の倍数でない i だけを追加します。1〜10 のうち 4 の倍数は 4 と 8 の 2 個なので、追加されるのは 10－2＝8 個です。
    why:
      - 正解です。4 と 8 以外の 8 個が追加されます。
      - 2 は 4 の倍数の個数で、条件の ≠ を ＝ と読んだ場合です。
      - 10 は条件を無視してすべて追加した場合です。
      - 7 は 10 を数え忘れた場合です。
    terms: [配列, 選択処理]
    verify: { result: { of: 'var:n' } }

  - id: B-DRL-092
