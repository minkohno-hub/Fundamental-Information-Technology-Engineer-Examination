    why:
      - 正解です。1 つ目の結果を使って 2 つ目を判定します。
      - 2 は 2 つ目の if を elseif のように扱い、判定しなかった場合です。
      - 28 は 2 つ目の判定と計算に元の値 7 を使った場合です。
      - 102 は 2 つ目の if で else 側に進むと考えた場合です。
