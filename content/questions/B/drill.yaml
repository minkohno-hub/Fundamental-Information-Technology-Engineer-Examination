    why:
      - 正解です。値の変わり目が 3 か所で、区間は 4 つです。
      - 3 は値の種類（1, 2, 3）の数で、最後の 1 を別の区間と数えていません。
      - 5 は区間の数より 1 多く、c の初期値 1 と変わり目の数を誤って数えた値です。
      - 7 は要素数です。
    terms: [配列]
    verify: { result: { of: 'var:c' } }

