      n÷2＝2.5 なので i は 1, 2 の 2 回です。i＝1 で a[1] と a[5]、i＝2 で a[2] と a[4] を交換し、中央の a[3] はそのままです。配列が逆順の {5, 4, 3, 2, 1} になります。
    why:
      - 正解です。前半と後半を対称に交換します。
      - 元のままの並びで、繰返しを n まで回すと 2 回交換されて元に戻ってしまいます。
      - 両端の交換（i＝1）だけを行った状態です。
      - t に退避せずに代入した場合で、後半の値が失われています。
    terms: [配列]
    verify: { result: { of: 'var:a' } }

  - id: B-DRL-087
    topic: B2
    diff: 1
    type: input
