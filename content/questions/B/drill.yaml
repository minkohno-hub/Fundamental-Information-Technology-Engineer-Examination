category: B-ALG
subject: B
depth: quick
reviewed: { at: '2026-10-21', method: '作成後の逐問レビュー（手作業のトレースと擬似言語インタプリタによる実行結果の照合）' }
questions:
  - id: B-DRL-001
    topic: B2
    diff: 1
    type: input
    accept: ['5', '５']
    q: 次のプログラムを実行した後の変数 x の値を答えよ。
    code: |
      整数型: x ← 3
      整数型: y ← 5
      x ← x ＋ y
      y ← x － y
      x ← x － y
    c: ['5', '3', '8', '-2']
    a: ア
    exp: |
      作業用の変数を使わずに x と y を入れ替える処理です。x ← 3＋5＝8、y ← 8－5＝3、x ← 8－3＝5 となり、最後に x は 5、y は 3 になります。
    why:
      - 正解です。3 行目で x＝8、4 行目で y＝3、5 行目で x＝8－3＝5 です。
      - 3 は x の初期値で、入れ替えの後に y が持つ値です。
      - 8 は 3 行目の直後の x の値で、まだ 5 行目が実行されていません。
      - －2 は 3－5 で、代入の順序を無視して初期値どうしを引いた値です。
    terms: [順次処理, 整数型]
    verify: { result: { of: 'var:x' } }

  - id: B-DRL-002
    topic: B2
    diff: 1
    q: 次のプログラムを実行した後の変数 z の値はどれか。ここで，整数型の変数に代入するときは小数点以下を切り捨てるものとする。
    code: |
      整数型: a ← 17
      整数型: q, r
      q ← a ÷ 5
      r ← a mod 5
      整数型: z ← q × 10 ＋ r
    c: ['32', '34', '23', '17']
    a: ア
    exp: |
      17 ÷ 5 ＝ 3.4 を整数型の q に代入すると切り捨てて 3、17 mod 5 は 17 を 5 で割った余りの 2 です。z ＝ 3 × 10 ＋ 2 ＝ 32 になります。
    why:
      - 正解です。商 3 と余り 2 から 3×10＋2＝32 です。
      - 余りを 4 と誤って 3×10＋4 とした値です。17－15＝2 が正しい余りです。
      - 商と余りを逆にして 2×10＋3 とした値です。
      - 17 は a の値そのもので、z の計算が反映されていません。
    terms: [整数型]
    verify: { result: { of: 'var:z' } }

  - id: B-DRL-003
    topic: B2
    diff: 1
    type: input
    accept: ['25', '２５']
    q: 次のプログラムを実行した後の変数 s の値を答えよ。
    code: |
      整数型: s ← 0
      整数型: i
      for (i を 1 から 9 まで 2 ずつ増やす)
        s ← s ＋ i
      endfor
    c: ['25', '45', '16', '36']
    a: ア
    exp: |
      i は 1, 3, 5, 7, 9 と 2 ずつ増え、11 になった時点で 9 を超えるので繰返しを終えます。s ＝ 1＋3＋5＋7＋9 ＝ 25 です。
    why:
      - 正解です。奇数 1〜9 の和で 25 です。
      - 45 は 1〜9 をすべて足した値で、2 ずつ増やしていることを見落としています。
      - 16 は 1＋3＋5＋7 で、i＝9 の回を数え忘れています（9 は「9 まで」に含まれます）。
      - 36 は 1〜11 の奇数の和で、9 を超えた 11 まで足しています。
    terms: [繰返し処理]
    verify: { result: { of: 'var:s' } }

  - id: B-DRL-004
    topic: B2
    diff: 1
    type: input
    accept: ['5', '５', '5回']
    q: 次のプログラムを実行したとき，while の繰返しの本体は何回実行されるか。実行後の変数 cnt の値で答えよ。
    code: |
      整数型: n ← 1
      整数型: cnt ← 0
      while (n < 100)
        n ← n × 3
        cnt ← cnt ＋ 1
      endwhile
    c: ['5', '4', '6', '3']
    a: ア
    exp: |
      n は 1→3→9→27→81→243 と変化します。81 のときはまだ n＜100 が真なので本体を実行し、243 になって条件が偽になります。本体の実行は 5 回で、cnt は 5 です。
    why:
      - 正解です。n が 3, 9, 27, 81, 243 になる 5 回です。
      - 4 回は n＝81 で止まると考えた場合です。81＜100 は真なのでもう 1 回実行します。
      - 6 回は 243 になった後も 1 回実行すると数えた場合です。条件は本体の前に判定されます。
      - 3 回は 27 で止めた場合で、100 との比較を誤っています。
    terms: [繰返し処理]
    verify: { result: { of: 'var:cnt' } }

  - id: B-DRL-005
    topic: B2
    diff: 1
    q: 次のプログラムを実行したときに出力される文字列はどれか。
    code: |
      整数型: score ← 75
      if (score ≧ 80)
        "優" を出力する
      elseif (score ≧ 70)
        "良" を出力する
      elseif (score ≧ 60)
        "可" を出力する
      else
        "不可" を出力する
      endif
    c: ['良', '優', '可', '不可']
    a: ア
    exp: |
      条件は上から順に判定し、最初に真になった分岐だけを実行します。75≧80 は偽、75≧70 は真なので「良」を出力し、残りの elseif と else は判定しません。
    why:
      - 正解です。2 番目の条件 score≧70 で初めて真になります。
      - 「優」は score≧80 のときで、75 は 80 未満です。
      - 75≧60 も真ですが、その前の score≧70 で分岐が決まっているので判定されません。
      - 「不可」はどの条件も偽のときだけ出力されます。
    terms: [選択処理]
    verify: { result: { of: output } }

  - id: B-DRL-006
    topic: B2
    diff: 1
    type: input
    accept: ['16', '１６']
    q: 次のプログラムを実行した後の変数 k の値を答えよ。ここで，配列の要素番号は 1 から始まる。
    code: |
      整数型の配列: d ← {4, 8, 15, 16, 23}
      整数型: k ← d[d[1]]
    c: ['16', '4', '15', '23']
    a: ア
    exp: |
      内側から評価します。d[1] は 4 なので、d[d[1]] は d[4] になります。要素番号は 1 から数えるので d[4] は 16 です。
    why:
      - 正解です。d[1]＝4 を要素番号として d[4]＝16 を取り出します。
      - 4 は d[1] の値で、外側の添字参照をしていません。
      - 15 は要素番号を 0 から数えた場合の d[3] にあたる値です。
      - 23 は最後の要素で、d[5] の値です。
    terms: [配列]
    verify: { result: { of: 'var:k' } }

  - id: B-DRL-007
    topic: B2
    diff: 1
    q: 関数 countEven を countEven({3, 6, 8, 11, 14}) として呼び出したときの戻り値はどれか。
    code: |
      ○整数型: countEven(整数型の配列: a)
        整数型: i, c ← 0
        for (i を 1 から aの要素数 まで 1 ずつ増やす)
          if (a[i] mod 2 ＝ 0)
            c ← c ＋ 1
          endif
        endfor
        return c
    c: ['3', '2', '5', '28']
    a: ア
    exp: |
      各要素を 2 で割った余りが 0（偶数）のときだけ c を 1 増やします。3→奇数、6→偶数（c＝1）、8→偶数（c＝2）、11→奇数、14→偶数（c＝3）で、戻り値は 3 です。
    why:
      - 正解です。偶数は 6, 8, 14 の 3 個です。
      - 2 個は 14 を数え忘れた場合です。最後の要素番号 5 まで繰り返します。
      - 5 は要素数で、条件に関係なくすべて数えています。
      - 28 は偶数の合計（6＋8＋14）で、個数ではありません。
    terms: [配列, 選択処理]
    verify: { result: { call: countEven, args: [[3, 6, 8, 11, 14]] } }
    sim: { entry: countEven, args: [[3, 6, 8, 11, 14]] }

  - id: B-DRL-008
    topic: B2
    diff: 1
    type: input
    accept: ['9', '９']
    q: 関数 maxOf を maxOf({7, 2, 9, 4}) として呼び出したときの戻り値を答えよ。
    code: |
      ○整数型: maxOf(整数型の配列: a)
        整数型: m ← a[1]
        整数型: i
        for (i を 2 から aの要素数 まで 1 ずつ増やす)
          if (a[i] > m)
            m ← a[i]
          endif
        endfor
        return m
    c: ['9', '7', '4', '3']
    a: ア
    exp: |
      m を先頭の 7 で初期化し、それより大きい要素が現れたら置き換えます。2 は 7 以下なのでそのまま、9＞7 で m＝9、4 は 9 以下なのでそのままです。戻り値は最大値の 9 です。
    why:
      - 正解です。最大値 9 が返ります。
      - 7 は m の初期値で、9 との比較で置き換わります。
      - 4 は最後の要素で、比較せずに最後の値を返したと考えた場合です。
      - 3 は最大値の要素番号です。この関数は要素番号ではなく値を返します。
    terms: [配列, 戻り値]
    verify: { result: { call: maxOf, args: [[7, 2, 9, 4]] } }
    sim: { entry: maxOf, args: [[7, 2, 9, 4]] }

  - id: B-DRL-009
    topic: B2
    diff: 2
    type: input
    accept: ['10', '１０']
    q: 次のプログラムを実行した後の変数 c の値を答えよ。
    code: |
      整数型: i, j, c ← 0
      for (i を 1 から 4 まで 1 ずつ増やす)
        for (j を i から 4 まで 1 ずつ増やす)
          c ← c ＋ 1
        endfor
      endfor
    c: ['10', '16', '6', '4']
    a: ア
    exp: |
      内側の繰返しは j を i から 4 まで動かすので、i＝1 で 4 回、i＝2 で 3 回、i＝3 で 2 回、i＝4 で 1 回実行されます。合計 4＋3＋2＋1 ＝ 10 回で、c は 10 です。
    why:
      - 正解です。内側の回数は 4, 3, 2, 1 回と減っていきます。
      - 16 は内側を毎回 1 から 4 まで（4 回ずつ）回した場合です。
      - 6 は j を i＋1 から始めた場合（3＋2＋1）の回数です。
      - 4 は外側の繰返しの回数だけです。
    terms: [繰返し処理]
    verify: { result: { of: 'var:c' } }

  - id: B-DRL-010
    topic: B2
    diff: 1
    type: input
    accept: ['1', '１', '1回']
    q: 次のプログラムを実行した後の変数 c の値を答えよ。
    code: |
      整数型: x ← 10
      整数型: c ← 0
      do
        x ← x ＋ 5
        c ← c ＋ 1
      while (x < 10)
    c: ['1', '0', '2', '15']
    a: ア
    exp: |
      do … while は本体を先に実行してから条件を判定する後判定型の繰返しです。1 回目の本体で x＝15、c＝1 となり、その後 15＜10 が偽なので終了します。条件が最初から偽でも本体は 1 回実行されます。
    why:
      - 正解です。後判定なので本体は必ず 1 回は実行されます。
      - 0 は前判定（while … endwhile）と取り違えた場合です。
      - 2 回目は x＝15 で条件が偽になるため実行されません。
      - 15 は x の値で、c ではありません。
    terms: [繰返し処理]
    verify: { result: { of: 'var:c' } }

  - id: B-DRL-011
    topic: B3
    diff: 1
    q: 関数 f を f(5) として呼び出したときの戻り値はどれか。
    code: |
      ○整数型: f(整数型: n)
        if (n ≦ 1)
          return 1
        endif
        return n × f(n － 1)
    c: ['120', '24', '15', '720']
    a: ア
    exp: |
      f(5)＝5×f(4)、f(4)＝4×f(3)、f(3)＝3×f(2)、f(2)＝2×f(1)、f(1)＝1 です。戻りながら掛けていくと 2→6→24→120 となり、5 の階乗 120 が返ります。
    why:
      - 正解です。5×4×3×2×1＝120 です。
      - 24 は f(4)（4 の階乗）の値です。
      - 15 は 5＋4＋3＋2＋1 で、掛け算ではなく足し算をした場合です。
      - 720 は f(6)（6 の階乗）の値です。
    terms: [再帰, 再帰呼出し]
    verify: { result: { call: f, args: [5] } }
    sim: { entry: f, args: [5] }

  - id: B-DRL-012
    topic: B3
    diff: 2
    type: input
    accept: ['19', '１９']
    q: 関数 ds を ds(4096) として呼び出したときの戻り値を答えよ。ここで，整数型の変数に代入するときは小数点以下を切り捨てるものとする。
    code: |
      ○整数型: ds(整数型: n)
        整数型: m
        if (n < 10)
          return n
        endif
        m ← n ÷ 10
        return (n mod 10) ＋ ds(m)
    c: ['19', '10', '6', '22']
    a: ア
    exp: |
      一の位（n mod 10）を取り出し、残りの桁（n ÷ 10 の整数部分）について再帰的に同じ処理をします。ds(4096)＝6＋ds(409)、ds(409)＝9＋ds(40)、ds(40)＝0＋ds(4)、ds(4)＝4 で、各桁の和 6＋9＋0＋4＝19 が返ります。
    why:
      - 正解です。各桁の数字の和 4＋0＋9＋6＝19 です。
      - 10 は 4＋6 だけで、9 と 0 の桁を処理していません。
      - 6 は最初の一の位だけで、再帰の結果を加えていません。
      - 22 は 4＋0＋9＋6 を求めた後にさらに桁数 3 を加えたような値で、処理に対応しません。
    terms: [再帰, 再帰呼出し]
    verify: { result: { call: ds, args: [4096] } }
    sim: { entry: ds, args: [4096] }

  - id: B-DRL-013
    topic: B2
    diff: 2
    type: input
    accept: ['12', '１２']
    q: 関数 gcd を gcd(84, 36) として呼び出したときの戻り値を答えよ。
    code: |
      ○整数型: gcd(整数型: a, 整数型: b)
        整数型: t
        while (b ≠ 0)
          t ← a mod b
          a ← b
          b ← t
        endwhile
        return a
    c: ['12', '6', '4', '36']
    a: ア
    exp: |
      ユークリッドの互除法で最大公約数を求めます。(a, b)＝(84, 36) → 84 mod 36＝12 なので (36, 12) → 36 mod 12＝0 なので (12, 0)。b＝0 で終了し、a の 12 を返します。
    why:
      - 正解です。84 と 36 の最大公約数は 12 です。
      - 6 は公約数の一つですが最大ではありません。
      - 4 も公約数の一つですが最大ではありません。
      - 36 は引数 b の初期値で、繰返しを 1 回も行わなかったと考えた場合です。
    terms: [繰返し処理, 引数]
    verify: { result: { call: gcd, args: [84, 36] } }
    sim: { entry: gcd, args: [84, 36] }

  - id: B-DRL-014
    topic: B2
    diff: 1
    q: 次のプログラムを実行したときの出力はどれか。ここで，出力された値は空白で区切って示す。
    code: |
      整数型: i
      for (i を 3 から 1 まで 1 ずつ減らす)
        i を出力する
      endfor
    c: ['3 2 1', '1 2 3', '3 2', '3 2 1 0']
    a: ア
    exp: |
      「3 から 1 まで 1 ずつ減らす」なので、i は 3, 2, 1 と変化し、0 になった時点で 1 を下回って終了します。出力は 3 2 1 です。
    why:
      - 正解です。i＝3, 2, 1 の 3 回出力します。
      - 1 2 3 は「増やす」と読み違えた場合です。
      - 3 2 は i＝1 の回を含めていません。「1 まで」には 1 も含まれます。
      - 0 は終了条件を満たした値で、本体は実行されません。
    terms: [繰返し処理]
    verify: { result: { of: output } }

  - id: B-DRL-015
    topic: B2
    diff: 1
    type: input
    accept: ['7', '７', '7回']
    q: 次のプログラムを実行した後の変数 c の値を答えよ。
    code: |
      整数型: i, c ← 0
      for (i を 2 から 20 まで 3 ずつ増やす)
        c ← c ＋ 1
      endfor
    c: ['7', '6', '8', '18']
    a: ア
    exp: |
      i は 2, 5, 8, 11, 14, 17, 20 と変化し、次の 23 で 20 を超えて終了します。本体は 7 回実行されるので c は 7 です。回数は (20－2)÷3＋1＝7 とも計算できます。
    why:
      - 正解です。i＝2〜20 の 3 刻みで 7 回です。
      - 6 は i＝20 の回を数え忘れた場合です。20 は「20 まで」に含まれます。
      - 8 は 23 の回まで数えた場合で、23 では本体を実行しません。
      - 18 は 20－2 の差で、増分 3 を考慮していません。
    terms: [繰返し処理]
    verify: { result: { of: 'var:c' } }

  - id: B-DRL-016
    topic: B2
    diff: 2
    q: 次のプログラムを実行した後の変数 s の値はどれか。ここで，m[i, j] は二次元配列 m の i 行 j 列の要素を表す。
    code: |
      整数型の二次元配列: m ← {{2, 0, 1}, {3, 5, 4}, {6, 7, 8}}
      整数型: i, s ← 0
      for (i を 1 から 3 まで 1 ずつ増やす)
        s ← s ＋ m[i, 4 － i]
      endfor
    c: ['12', '15', '36', '13']
    a: ア
    exp: |
      列番号が 4－i なので、i＝1 で m[1, 3]＝1、i＝2 で m[2, 2]＝5、i＝3 で m[3, 1]＝6 を足します。右上から左下への対角線の和で s＝1＋5＋6＝12 です。
    why:
      - 正解です。m[1,3]＋m[2,2]＋m[3,1]＝1＋5＋6＝12 です。
      - 15 は左上から右下への対角線（2＋5＋8）で、m[i, i] を足した場合です。
      - 36 は全要素の合計です。
      - 13 は 3 列目の和（1＋4＋8）で、列番号を 3 に固定して足した場合です。
    terms: [二次元配列]
    verify: { result: { of: 'var:s' } }

  - id: B-DRL-017
    topic: B2
    diff: 1
    q: 次のプログラムを実行した後の配列 a の内容はどれか。
    code: |
      整数型の配列: a ← {1, 2, 3, 4}
      整数型: t ← a[1]
      整数型: i
      for (i を 1 から 3 まで 1 ずつ増やす)
        a[i] ← a[i ＋ 1]
      endfor
      a[4] ← t
    c: ['{2, 3, 4, 1}', '{4, 1, 2, 3}', '{2, 3, 4, 4}', '{1, 1, 1, 1}']
    a: ア
    exp: |
      先頭の 1 を t に退避し、a[1]←a[2]、a[2]←a[3]、a[3]←a[4] と前に詰めて {2, 3, 4, 4} にします。最後に a[4] に退避した 1 を入れるので {2, 3, 4, 1} になります（左に 1 つ回転）。
    why:
      - 正解です。要素を 1 つずつ前に詰め、先頭の値を末尾に回しています。
      - 「{4, 1, 2, 3}」 は右に 1 つ回転した結果で、処理の向きが逆です。
      - 「{2, 3, 4, 4}」 は最後の a[4] ← t を実行する前の状態です。
      - 「{1, 1, 1, 1}」 は後ろから前ではなく前から後ろへコピーした場合（a[i＋1] ← a[i]）に起こる結果です。
    terms: [配列]
    verify: { result: { of: 'var:a' } }

  - id: B-DRL-018
    topic: B2
    diff: 2
    q: 次のプログラムを実行した後の配列 a の内容はどれか。
    code: |
      整数型の配列: a ← {1, 2, 3, 4}
      整数型: i
      for (i を 2 から 4 まで 1 ずつ増やす)
        a[i] ← a[i － 1]
      endfor
    c: ['{1, 1, 1, 1}', '{1, 1, 2, 3}', '{4, 1, 2, 3}', '{2, 3, 4, 4}']
    a: ア
    exp: |
      前から順に a[2]←a[1]＝1、a[3]←a[2]＝1（すでに 1 に書き換わっている）、a[4]←a[3]＝1 となり、すべて 1 になります。後ろにずらすときは、上書きを避けるために後ろの要素から処理する必要があります。
    why:
      - 正解です。書き換えた値を次の回で読むので、先頭の 1 が全体に広がります。
      - 「{1, 1, 2, 3}」 は後ろから（i を 4 から 2 まで減らして）処理したときの結果です。
      - 「{4, 1, 2, 3}」 は末尾を先頭に回す右回転の結果で、この処理では末尾の 4 を退避していません。
      - 「{2, 3, 4, 4}」 は a[i] ← a[i＋1] として前に詰めた結果です。
