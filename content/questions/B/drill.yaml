    q: 次のプログラムを実行した後の変数 ave の値を答えよ。ここで，整数型の変数に代入するときは小数点以下を切り捨てるものとする。
    code: |
      整数型の配列: a ← {7, 8, 10}
      整数型: s ← 0, i, ave
      for (i を 1 から aの要素数 まで 1 ずつ増やす)
        s ← s ＋ a[i]
      endfor
      ave ← s ÷ aの要素数
    c: ['8', '8.3', '9', '25']
    a: ア
