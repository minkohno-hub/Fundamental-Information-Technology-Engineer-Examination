  - id: B-DRL-096
    topic: B3
    diff: 2
    q: 次のプログラムを実行した後の変数 s の値はどれか。ここで，ListElement は単方向リストの要素を表すクラスで，ListElement(v) はメンバ変数 val が v，next が未定義の値のインスタンスを生成する。
    code: |
      ListElement: p ← ListElement(3)
      p.next ← ListElement(5)
      p.next.next ← ListElement(9)
      整数型: s ← 0
      while (p ≠ 未定義)
        s ← s ＋ p.val
        p ← p.next
      endwhile
    c: ['17', '8', '14', '3']
    a: ア
    exp: |
      3→5→9 の順につながったリストを先頭からたどり、val を足します。p.next が未定義になった次の回で p が未定義になり終了します。s＝3＋5＋9＝17 です。
    why:
      - 正解です。3 個の要素すべての和です。
      - 8 は最後の要素 9 を足す前に止めた場合です。p が未定義になるまで続きます。
      - 14 は先頭の 3 を飛ばした場合です。
      - 3 は先頭の要素だけです。
    terms: [連結リスト]
    verify:
      result: { of: 'var:s' }
      options: { classes: { ListElement: { fields: [val, next], ctor: [val] } } }

  - id: B-DRL-097
    topic: B3
    diff: 2
    type: input
