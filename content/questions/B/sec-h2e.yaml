questions:
  - id: B-SEC-133
    topic: [B5, 11-5-2]
    diff: 3
    scope: 科目B「情報セキュリティ」のフィッシングへの対策。不審なメールを受け取った利用者の行動と、組織の報告の仕組みの判断であり、範囲内。
    prereq: フィッシングは、正規の送信者を装って偽の画面に誘導し、認証情報などを入力させる手口であること、不審なメールは開かず・入力せず、決められた窓口に報告することが初動であること
    hard: 「注意深く見れば見分けられる」という前提に立つ対策と、見分けに頼らず報告と遮断の仕組みで守る対策を切り分ける必要がある。
    q: |
      A社で、実在の取引先を装ったメールから偽のログイン画面に誘導され、従業員がパスワードを入力してしまう事案が起きた。再発防止のための対策として、適切なものはどれか。
    c: ['不審なメールを受け取ったら、リンクを開かず、決められた窓口へ報告するよう徹底し、報告されたメールの情報を全社で共有して遮断に使う', 'メールを注意深く読めば見分けられるので、各自の注意に任せる', '外部からのメールは、全て一律に受信を禁止する', 'パスワードを複雑なものに変更すれば、入力しても問題ない']
    a: ア
    exp: |
      フィッシングのメールは精巧になっており、個人の注意力だけに頼る対策には限界があります。有効なのは、利用者が「開かずに入力せず、窓口に報告する」という行動を徹底し、報告された情報を組織で共有して、同じメールの遮断や注意喚起に生かす仕組みです。外部メールの全面禁止は業務を成り立たせませんし、パスワードの複雑さは、偽の画面に入力してしまえば意味を持ちません。
    why:
      - 正解です。報告の徹底と、情報の共有による遮断が、組織としての対策です。
      - 精巧な偽装は注意深く読んでも見分けられない場合があり、個人の注意だけでは再発を防げません。
      - 外部とのメールのやり取りは業務に必要であり、全面禁止は現実的ではありません。
      - 入力したパスワードは攻撃者の手に渡るため、複雑であっても直ちに悪用されるおそれがあります。
    know: フィッシング対策の要点は、「見分ける力」より「開かない・入力しない・報告する」という行動と、報告を組織の防御に生かす仕組みである。
    terms: [フィッシング, パスワード]
    verify:
      manual: 取引先を装ったメールから偽のログイン画面に誘導されパスワードを入力した事案に対し、リンクを開かず決められた窓口へ報告するよう徹底し報告情報を全社で共有して遮断に使う対策が適切であることを、個人の注意への依存・全面禁止・パスワードの複雑化との比較から確認した。
  - id: B-SEC-134
    topic: [B5, 11-5-2]
    diff: 3
    scope: 科目B「情報セキュリティ」の物理的対策。サーバ室への立入りの管理と、共連れの防止の判断であり、範囲内。
    prereq: 重要な機器のある場所は、入室できる人を定め、記録を取り、他人の認証に便乗して入る「共連れ」を防ぐこと
    hard: 利便性のために認証を共有する運用と、一人ずつ認証して記録を残す管理を切り分ける必要がある。
    q: |
      A社のサーバ室では、入室に IC カードの認証が必要である。しかし、実際には、先に入室した人の開けたドアから、認証せずに続いて入ることが常態化している。対策として、適切なものはどれか。
    c: ['入室は一人ずつ認証することを徹底し、認証の記録と実際の入室が合うよう運用する', '忙しい時間帯は、認証を省略してよいことにする', 'ドアを開けた人が、同行者の名前を口頭で伝えることで代える', 'サーバ室の鍵を、関係者の共用の置き場所で管理する']
    a: ア
    exp: |
      他人の認証に便乗して入室する「共連れ」が常態化すると、誰が入室したかの記録が実態と合わなくなり、不正な立入りがあっても追跡できません。対策は、一人ずつ認証する運用の徹底であり、認証の記録と実際の入室を一致させることです。認証の省略や口頭の申告は、記録の信頼性を損ないます。
    why:
      - 正解です。一人ずつの認証の徹底が、記録と実態を一致させます。
      - 時間帯による省略は、記録の抜けを作り、追跡をできなくします。
      - 口頭の伝達は記録として残らず、確認の手段にもなりません。
      - 鍵の共用管理は、誰が使ったか分からなくなるため、認証の仕組み自体を無力にします。
    know: 物理的な入退室の管理の要点は、「認証した人だけが入り、記録が実態と合う」ことである。共連れは、その両方を壊す。
    terms: [共連れ, 入退室管理]
    verify:
      manual: サーバ室で他人の開けたドアから認証せずに入る共連れが常態化している場合、入室は一人ずつ認証することを徹底し認証の記録と実際の入室が合うよう運用する対策が適切であることを、認証の省略・口頭の伝達・鍵の共用との比較から確認した。
  - id: B-SEC-135
    topic: [B5, 11-5-1]
    diff: 3
    scope: 科目B「情報セキュリティ」の情報の格付けと取扱い。重要度に応じて情報を分類し、表示と取扱いの決まりを対応させる判断であり、範囲内。
    prereq: 情報を重要度に応じて分類（格付け）し、分類ごとに、保存・送信・廃棄の取扱いを定めること、分類の表示によって扱う人が判断できるようにすること
    hard: 「全てを厳重に扱う」一律の管理と、分類に応じた扱い分けを切り分ける必要がある。分類の表示の役割も含まれる。
    q: |
      A社では、文書の重要度に関わらず、取扱いの決まりが一律であるため、重要な文書が通常の文書と同じようにメールで送られたり、不要に厳重な管理が軽微な文書にまで及んだりしている。情報の取扱いの改善として、適切なものはどれか。
    c: ['情報を重要度に応じて分類し、分類を表示したうえで、分類ごとに保存・送信・廃棄の取扱いを定める', '全ての文書を、最も重要な文書と同じ厳重さで扱う', '分類は行うが、表示はせず、管理部門だけが把握する', '取扱いの判断は、各担当者の経験に任せる']
    a: ア
    exp: |
      情報の取扱いは、重要度に応じた扱い分けが基本です。情報を分類し、その分類を文書に表示して、分類ごとに保存・送信・廃棄の取扱いを定めることで、扱う人が、その場で正しい扱いを判断できます。全てを最も厳重に扱うことは、業務の負担が過大になり、かえって決まりが守られなくなります。分類を表示しなければ、扱う人には分類が分かりません。
    why:
      - 正解です。分類と表示、分類ごとの取扱いの定めが、扱い分けの仕組みです。
      - 一律の厳重な扱いは負担が過大で、決まり自体が守られなくなるおそれがあります。
      - 表示がなければ、扱う人が分類に応じた扱いを選べません。
      - 担当者の経験への依存は、扱いのばらつきと、重要な情報の軽い扱いを招きます。
    know: 情報の格付けの要点は、「分ける・示す・扱いを対応させる」の三点である。表示のない分類は、現場の判断に使えない。
    terms: [情報の格付け, 機密情報]
    verify:
      manual: 文書の重要度によらず取扱いが一律で、重要な文書が通常と同じに送られ軽微な文書にまで厳重な管理が及ぶ状況に対し、情報を重要度に応じて分類し表示したうえで分類ごとに保存・送信・廃棄の取扱いを定める改善が適切であることを、一律の厳重化・表示なし・経験への依存との比較から確認した。
  - id: B-SEC-136
    topic: [B5, 11-5-2]
    diff: 3
    scope: 科目B「情報セキュリティ」のインシデントの初動。マルウェア感染が疑われる端末への、証拠を保ち被害を広げないための利用者の行動の判断であり、範囲内。
    prereq: 感染が疑われる場合は、ネットワークから切り離して被害の拡大を防ぎ、電源は切らずに（証拠が消える場合がある）、管理者へ速やかに報告すること
    hard: 「すぐに電源を切る」「自分で駆除を試みる」といった一見適切な行動と、拡大防止と証拠保全の両立を切り分ける必要がある。
    q: |
      従業員のパソコンの画面に、不審な警告が繰り返し表示され、動作が著しく遅くなった。マルウェア感染が疑われる場合に、この従業員が取るべき初動として、適切なものはどれか。
    c: ['ネットワークケーブルを抜くなどしてネットワークから切り離し、電源は入れたまま、管理者へ直ちに報告する', '感染を広げないよう、直ちに電源を切る', '自分でセキュリティソフトのスキャンを繰り返し、様子を見る', '警告の画面を閉じて、業務を続ける']
    a: ア
    exp: |
      感染が疑われる端末の初動は、被害の拡大防止と、原因の調査のための保全の両立です。ネットワークから切り離すことで、他の端末への感染の広がりや、外部への通信を止められます。電源を切ると、メモリ上に残る証拠（動作中のマルウェアの情報など）が消えてしまう場合があるため、電源は入れたままにし、管理者へ直ちに報告します。自己流の駆除の試行は、状況を悪化させ、証拠も損ないます。
    why:
      - 正解です。切り離しによる拡大防止と、電源を入れたままの保全と報告が、初動の形です。
      - 電源を切ると、メモリ上の証拠が消え、原因の調査が難しくなります。まず行うべきは、ネットワークからの切り離しです。
      - 自己流のスキャンの繰り返しは、感染を広げる時間を生み、証拠も損ないます。
      - 警告を閉じて業務を続けると、被害が広がり、情報が外部に送られるおそれがあります。
    know: 感染の初動の要点は、「切り離す・消さない・すぐ報告」の三点である。良かれと思っての電源断や自己流の駆除が、調査を困難にする。
    terms: [マルウェア, インシデント]
    verify:
      manual: マルウェア感染が疑われる端末の初動として、ネットワークから切り離し、電源は入れたまま管理者へ直ちに報告する行動が適切であることを、電源断・自己流のスキャン・業務の継続との比較から確認した。
  - id: B-SEC-137
    topic: [B5, 11-5-1]
    diff: 3
    scope: 科目B「情報セキュリティ」のパスワードの使い回し対策。複数のサービスで同じパスワードを使う危険と、管理の負担を下げる方法の判断であり、範囲内。
    prereq: パスワードの使い回しは、一つのサービスの漏えいが他のサービスの不正ログインに直結すること、パスワード管理ツールを使うと、サービスごとに異なる長いパスワードを現実的に管理できること
    hard: 「覚えられる範囲で変える」という中途半端な運用と、ツールで全てを変える運用を切り分ける必要がある。
    q: |
      A社の従業員の多くが、業務の複数のシステムと私的なサービスで、同じパスワードを使い回していることが分かった。対策として、適切なものはどれか。
    c: ['パスワード管理ツールの利用を認め、サービスごとに異なる長いパスワードを設定する', '使い回しは 3 つのサービスまでに制限する', '全員に、月ごとにパスワードの変更を義務付ける', 'パスワードを、忘れないように紙に書いて保管させる']
    a: ア
    exp: |
      パスワードの使い回しは、一つのサービスから漏れたパスワードが、他のサービスへの不正ログイン（パスワードリスト攻撃）に使われる危険があります。対策は、サービスごとに異なるパスワードを使うことですが、覚える負担が大きいため、パスワード管理ツールで生成と保管を行う方法が現実的です。使い回しの数の制限では危険が残り、頻繁な変更の義務付けは、かえって単純なパスワードや使い回しを招くとされています。
    why:
      - 正解です。管理ツールで、サービスごとに異なるパスワードを使う方法です。
      - 数を制限しても、漏れた場合にその範囲で不正ログインされる危険が残ります。
      - 頻繁な変更の義務付けは、負担から単純なパスワードや使い回しを招き、効果が限られます。
      - 紙への記録は、紛失やのぞき見の危険があり、保管の方法として不適切です。
    know: 使い回し対策の要点は、「全て変える」ことと「覚える負担をツールで肩代わりする」ことの組合せである。頻繁な変更の強制は、現代では推奨されない。
    terms: [パスワード, パスワードリスト攻撃]
    verify:
      manual: 業務と私的なサービスでパスワードを使い回している状況に対し、パスワード管理ツールの利用を認めてサービスごとに異なる長いパスワードを設定する対策が適切であることを、使い回しの数の制限・月ごとの変更の義務付け・紙への記録との比較から確認した。
  - id: B-SEC-138
    topic: [B5, 11-5-2]
    diff: 3
    scope: 科目B「情報セキュリティ」の公衆無線 LAN の利用。暗号化の状態が不明なネットワークで業務を行う際の対策の判断であり、範囲内。
    prereq: 公衆の無線 LAN は、通信を盗み見られたり、偽のアクセスポイントに接続させられたりする危険があること、VPN で通信を暗号化すると、その危険を下げられること
    hard: 「パスワード付きの Wi-Fi なら安全」という誤解と、通信の経路そのものを暗号化する対策を切り分ける必要がある。
    q: |
      出張中の従業員が、駅の公衆無線 LAN に接続して、会社のシステムにアクセスしようとしている。セキュリティの観点からの指導として、適切なものはどれか。
    c: ['会社の VPN に接続して通信を暗号化してから、会社のシステムにアクセスする', '無線 LAN にパスワードが設定されていれば、そのままアクセスしてよい', '接続する無線 LAN の名前が駅の案内と合っていれば、安全である', '短時間のアクセスであれば、そのままアクセスしてよい']
    a: ア
    exp: |
      公衆の無線 LAN は、誰が設置したか分からないものや、通信が盗み見られる危険のあるものが含まれます。正規のものを装った偽のアクセスポイントもあり得ます。対策は、VPN（仮想的な専用線）で通信そのものを暗号化してからアクセスすることです。無線 LAN のパスワードや名称の一致は、経路の安全を保証しませんし、短時間でも盗み見の危険は変わりません。
    why:
      - 正解です。VPN による通信の暗号化が、経路の危険への対策です。
      - 無線 LAN のパスワードは、接続の制限のためのものであり、通信の安全を保証しません。
      - 名称は偽物でも同じに名乗れるため、安全の根拠にはなりません。
      - 盗み見の危険は、接続の長さとは関係なく存在します。
    know: 公衆ネットワークの利用の要点は、「接続先を信じない」ことである。経路が信用できない前提で、VPN によって通信自体を守る。
    terms: [VPN, 無線LAN]
    verify:
      manual: 駅の公衆無線 LAN から会社のシステムにアクセスする場合は、会社の VPN に接続して通信を暗号化してからアクセスする指導が適切であることを、パスワード付き Wi-Fi への信頼・名称の一致・短時間の利用との比較から確認した。
  - id: B-SEC-139
    topic: [B5, 11-5-1]
    diff: 4
    scope: 科目B「情報セキュリティ」の内部不正への対策。一人に権限が集中する運用を改め、不正の機会を減らす管理の判断であり、範囲内。
    prereq: 内部不正を防ぐには、申請と承認、作業と確認のように、一連の手続を複数人で分担する職務分掌と、本人の作業が記録され確認される仕組みが有効であること
    hard: 性善説に基づく統制の緩和と、不正が「できない仕組み」にすることの違いを読み取る必要がある。監視の相互性も含まれる。
    q: |
      A社では、経理システムの支払い処理を、一人の担当者が、申請から承認、送金まで一人で行える運用になっている。内部不正への対策として、最も適切なものはどれか。
    c: ['申請と承認を別の担当者に分け、本人の処理は記録され、他の担当者が確認する仕組みにする', '担当者を信頼し、今の運用を続ける', '担当者に、定期的に不正をしない旨の宣誓をしてもらう', '支払いの金額が大きい場合だけ、上長の承認を必要とする']
    a: ア
    exp: |
      内部不正の対策の要点は、不正が一人では完結しない仕組みにすることです。申請と承認を別の担当者に分ける職務分掌と、処理の記録と他の担当者による確認を組み合わせることで、不正の機会そのものを減らし、発見も容易になります。信頼や宣誓は統制にはならず、金額の大きい場合だけの承認では、小さい不正の積み重ねを見逃します。
    why:
      - 正解です。職務を分け、記録と確認を組み合わせることで、不正が一人で完結しなくなります。
      - 信頼は統制の代わりにはなりません。不正は、機会があるところで起きます。
      - 宣誓は意識付けにはなっても、不正を防ぐ仕組みにはなりません。
      - 金額の小さい不正の積み重ねも被害になるため、金額での線引きだけでは不十分です。
    know: 内部不正対策の要点は、「信頼」ではなく「仕組み」。申請・承認・確認を分ける職務分掌が、機会を断つ。
    terms: [職務分掌, 内部不正]
    verify:
      manual: 支払い処理を一人の担当者が申請から承認、送金まで行える運用に対し、申請と承認を別の担当者に分け、本人の処理が記録され他の担当者が確認する仕組みにする対策が最も適切であることを、信頼への依存・宣誓・金額だけの線引きとの比較から確認した。
  - id: B-SEC-140
    topic: [B5, 11-5-2]
    diff: 3
    scope: 科目B「情報セキュリティ」の偽の更新プログラムへの対策。ソフトウェアの更新を、公式の経路から入手することの判断であり、範囲内。
    prereq: 更新の案内を装った画面やメールから入手したプログラムは、マルウェアである場合があること、更新はソフトウェアの公式の配布元や、正規の更新の仕組みから行うこと
    hard: 「更新は速やかに」という原則自体は正しく、その入手の経路の真偽を切り分ける必要がある。
    q: |
      従業員のパソコンに、Web サイトの閲覧中、「お使いのソフトウェアは古くなっています。今すぐ更新してください」という表示が出て、ダウンロードのボタンを押すよう求められた。対応として、適切なものはどれか。
    c: ['その画面からはダウンロードせず、ソフトウェアの公式の配布元や、正規の更新の仕組みから更新する', '更新は重要なので、表示のボタンを押して直ちに更新する', '表示が本物らしく見えるので、従ってよい', '同僚のパソコンにも同じ表示が出たので、従ってよい']
    a: ア
    exp: |
      Web サイトの閲覧中に出る更新の案内には、マルウェアをダウンロードさせる偽物が含まれます。見た目が本物らしくても、同僚にも出ていても、真偽の根拠にはなりません。更新そのものは重要ですが、入手は、ソフトウェアの公式の配布元や、OS やソフトウェアに備わった正規の更新の仕組みから行います。偽の案内に従うと、更新のつもりでマルウェアを入れてしまいます。
    why:
      - 正解です。更新は、正規の経路から行います。
      - 案内の出どころが不明なボタンを押すことは、マルウェアの感染の入り口になります。
      - 見た目は偽物でも精巧に作れるため、真偽の判断の根拠にはなりません。
      - 多くの人に出る表示であっても、偽の広告などが一斉に表示される場合があり、根拠にはなりません。
    know: 更新の鉄則は、「速やかに」かつ「正規の経路で」。閲覧中の画面の案内は、出どころ不明として扱う。
    terms: [マルウェア, アップデート]
    verify:
      manual: Web サイトの閲覧中に出た更新の案内に対しては、その画面からはダウンロードせず、ソフトウェアの公式の配布元や正規の更新の仕組みから更新する対応が適切であることを、表示への従順・見た目・同僚への表示との比較から確認した。
