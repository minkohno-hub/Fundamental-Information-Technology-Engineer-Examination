questions:
  - id: B-SEC-001
    topic: [B5, 11-5-2]
    diff: 2
    q: |
      A社では，社内の経費精算システムの利用者に次の権限を設定している。

      | 利用者 | 所属・役割 | 申請 | 承認 | 支払処理 | マスタ管理 |
      | --- | --- | --- | --- | --- | --- |
      | B氏 | 営業部員 | ○ | | | |
      | C氏 | 営業部長 | ○ | ○ | | |
      | D氏 | 経理部員 | ○ | | ○ | |
      | E氏 | 経理部長 | ○ | ○ | ○ | ○ |
      | F氏 | 情報システム部員 | ○ | | | ○ |

      （○は権限あり）

      内部監査で「一人の利用者が，自分で申請した経費を自分で承認し，支払まで完了できる状態は不適切である」と指摘された。この指摘に該当する利用者として，適切なものはどれか。
    c:
      - E氏だけ
      - C氏とE氏
      - D氏とE氏
      - C氏，D氏，E氏
      - E氏とF氏
    a: ア
    exp: |
      指摘は「申請・承認・支払処理を一人で完結できる」状態です。三つの権限をすべて持つのは E 氏だけです。C 氏は申請と承認はできますが支払処理ができず、D 氏は申請と支払処理はできますが承認ができません。一連の業務を複数人に分担させて不正や誤りを防ぐ考え方を職務分離といいます。
    why:
      - 正解です。E 氏だけが申請・承認・支払処理の三つの権限を持っています。
      - C 氏には支払処理の権限がないため、支払まで完了できません。
      - D 氏には承認の権限がないため、自分の申請を承認できません。
      - C 氏と D 氏はそれぞれ一つの権限が欠けており、一人では完結できません。
      - F 氏のマスタ管理の権限は申請・承認・支払の流れとは別で、指摘の状態に当たりません。
    know: 職務分離に加えて、各利用者に業務上必要な最小限の権限だけを与える最小権限の原則も、アクセス権設計の基本です。
    terms: [職務分離, 最小権限の原則, アクセス権]

  - id: B-SEC-002
    topic: [B5, 11-5-2]
    diff: 2
    q: |
      A社のファイルサーバには，部署ごとのフォルダがある。現在のアクセス権は次のとおりである。

      | フォルダ | 営業部 | 人事部 | 全社員 |
      | --- | --- | --- | --- |
      | /営業 | 読取り・書込み | なし | 読取り |
      | /人事 | なし | 読取り・書込み | 読取り |
      | /共有 | 読取り・書込み | 読取り・書込み | 読取り・書込み |

      /人事 には社員の評価や給与の情報が保存されている。情報セキュリティ担当者は，最小権限の原則に基づいてアクセス権を見直すことにした。最も優先して変更すべき設定はどれか。
    c:
      - /人事 の「全社員」の読取り権限を削除する。
      - /営業 の「全社員」の読取り権限を削除する。
      - /共有 の「全社員」の書込み権限を削除する。
      - /人事 の「人事部」の書込み権限を読取りに変更する。
      - /営業 の「営業部」の書込み権限を読取りに変更する。
    a: ア
    exp: |
      最小権限の原則では、業務に必要な人に必要な範囲だけの権限を与えます。/人事 には評価や給与という機密性の高い情報があり、全社員が読める状態は業務上の必要がなく、漏えい時の影響も最も大きいため、最優先で削除すべきです。
    why:
      - 正解です。機密性の高い人事情報を全社員が読める状態を解消します。
      - /営業 の情報の機密度は示されておらず、人事情報より優先する根拠がありません。
      - /共有 は全社員で共有するためのフォルダで、書込み権限は業務上必要と考えられます。
      - 人事部は人事情報を更新する業務を行うので、書込み権限は必要です。
      - 営業部は営業資料を作成・更新するので、書込み権限は必要です。
    terms: [最小権限の原則, アクセス権, 機密性]

  - id: B-SEC-003
    topic: [B5, 11-1-8-3]
    diff: 2
    q: |
      A社は，社外から利用するWebメールサービスの認証について，次の案を比較している。

      | 案 | 内容 |
      | --- | --- |
      | 案1 | パスワードを英大小文字・数字・記号を含む12文字以上とし，90日ごとに変更させる |
      | 案2 | パスワードを12文字以上とし，加えてスマートフォンのアプリで生成するワンタイムパスワードの入力を求める |
      | 案3 | パスワードを8文字以上とし，秘密の質問（母親の旧姓）の回答を追加で求める |
      | 案4 | パスワードを12文字以上とし，同じパスワードの2回入力を求める |

      最近，他社のサービスから流出したIDとパスワードを使ってログインを試みるパスワードリスト攻撃が多発している。この攻撃への対策として最も効果が高い案はどれか。
    c:
      - 案1
      - 案2
      - 案3
      - 案4
    a: イ
    exp: |
      パスワードリスト攻撃は、他サービスから流出した正しいパスワードを使うため、パスワードの長さや複雑さでは防げません。案2 は「知っているもの（パスワード）」に「持っているもの（スマートフォン）」を組み合わせた多要素認証なので、パスワードが知られていても、スマートフォンがなければログインできません。
    why:
      - 流出したパスワードがそのまま使われる攻撃なので、複雑さや定期変更では防げません。利用者が他サービスと同じパスワードを使っていれば突破されます。
      - 正解です。パスワードと所持物を組み合わせた多要素認証になります。
      - 秘密の質問もパスワードと同じ「知っているもの」で、多要素認証になりません。旧姓などは調べられるおそれもあります。
      - 同じパスワードの 2 回入力は認証要素を増やさず、効果がありません。
    know: パスワードの定期的な変更を求めると、利用者が推測しやすい規則的なパスワードを使う原因になります。このため、流出の疑いがあるときに変更する運用が推奨されるようになっています。
    terms: [パスワードリスト攻撃, 多要素認証, ワンタイムパスワード]

  - id: B-SEC-004
    topic: [B5, 11-1-8-3]
    diff: 2
    q: |
      A社の社内システムは，次のアカウントロックの設定をしている。

      | 項目 | 設定値 |
      | --- | --- |
      | ロックまでの連続失敗回数 | 5回 |
      | ロックの解除 | 30分経過後に自動解除 |
      | 失敗回数のリセット | ログイン成功時 |

      ある日のログに，次のような記録があった。

      | 時刻 | 接続元 | 試行したID | 結果 |
      | --- | --- | --- | --- |
      | 02:00:01 | 203.0.113.5 | user001 | 失敗 |
      | 02:00:02 | 203.0.113.5 | user002 | 失敗 |
      | 02:00:03 | 203.0.113.5 | user003 | 失敗 |
      | … | … | … | … |
      | 02:16:39 | 203.0.113.5 | user999 | 失敗 |

      ログを確認すると，一つの接続元から，999個の異なるIDに対してそれぞれ1回ずつ，同じパスワード「Passw0rd」でログインを試行していた。この攻撃に対する現状の設定の評価として，適切なものはどれか。
    c:
      - 各IDの失敗は1回だけなので，アカウントロックは働かず，攻撃を検知・防止できていない。
      - 5回目の失敗でuser005がロックされるので，以降の攻撃は防止できている。
      - 999個のIDがすべてロックされ，正規の利用者が30分間ログインできなくなる。
      - ロックの解除が自動なので，攻撃者はロック解除後に同じIDで再試行できる。
    a: ア
    exp: |
      この攻撃は、パスワードを固定して ID を次々に変える手口（リバースブルートフォース攻撃）です。アカウントロックは ID ごとの連続失敗回数で働きますが、各 ID の失敗は 1 回ずつなのでロックの条件（5 回）に達しません。接続元ごとの失敗回数の監視や多要素認証などの別の対策が必要です。
    why:
      - 正解です。ID ごとの失敗回数が 1 回なので、ロックは働きません。
      - 失敗回数は ID ごとに数えるので、user005 の失敗は 1 回だけです。
      - どの ID も失敗は 1 回で、5 回に達していないのでロックされません。
      - この攻撃は同じ ID で再試行しておらず、ロックの自動解除は今回の評価に関係しません。
    terms: [リバースブルートフォース攻撃, アカウントロックアウト, ログ]

  - id: B-SEC-005
    topic: [B5, 11-2-1]
    diff: 2
    q: |
      A社のWebサーバのアクセスログの一部を次に示す。社内からの接続元は 192.168.10.0/24 である。

      | No. | 時刻 | 接続元IPアドレス | リクエスト | 応答 |
      | --- | --- | --- | --- | --- |
      | 1 | 09:01:12 | 192.168.10.21 | GET /index.html | 200 |
      | 2 | 09:02:40 | 198.51.100.7 | GET /products?id=12 | 200 |
      | 3 | 09:02:41 | 198.51.100.7 | GET /products?id=12' OR '1'='1 | 500 |
      | 4 | 09:02:43 | 198.51.100.7 | GET /products?id=12 UNION SELECT name,pass FROM users | 200 |
      | 5 | 09:05:10 | 192.168.10.35 | POST /login | 302 |
      | 6 | 09:06:22 | 203.0.113.80 | GET /admin/ | 403 |

      このログから判断できることとして，最も適切なものはどれか。
    c:
      - 198.51.100.7 からSQLインジェクションが試みられ，No.4 で利用者情報が取得された可能性がある。
      - 198.51.100.7 からクロスサイトスクリプティングが試みられ，閲覧者のブラウザでスクリプトが実行された。
      - 203.0.113.80 が管理画面への侵入に成功した。
      - 192.168.10.35 がパスワードリスト攻撃を行った。
      - No.3 の応答が500なので，198.51.100.7 の攻撃はすべて失敗している。
    a: ア
    exp: |
      No.3 と No.4 のリクエストには、SQL 文の一部（' OR '1'='1、UNION SELECT … FROM users）がパラメータに含まれており、SQL インジェクションの試行です。No.4 は応答 200（正常）で、users 表の name と pass を取り出す内容なので、利用者情報が取得された可能性があります。
    why:
      - 正解です。SQL 文を埋め込んだリクエストが正常応答になっています。
      - リクエストに含まれるのはスクリプトではなく SQL 文で、クロスサイトスクリプティングではありません。
      - 応答 403 はアクセス拒否で、侵入に成功したとはいえません。
      - 社内からの 1 回のログインで、攻撃を示す記録はありません。
      - No.3 はエラーでも、No.4 は 200 で応答しているので、すべて失敗したとはいえません。
    terms: [SQLインジェクション, ログ]

  - id: B-SEC-006
    topic: [B5, 11-1-7]
    diff: 2
    q: |
      A社の従業員B氏に，次のメールが届いた。

      | 項目 | 内容 |
      | --- | --- |
      | 差出人表示名 | 経理部 C |
      | 差出人アドレス | c-keiri@a-sya-co.example（A社の正規のドメインは a-sya.example） |
      | 件名 | 【至急】振込先口座変更のお知らせ |
      | 本文 | 取引先D社の振込先が変更になりました。添付ファイルを開き，マクロを有効にして確認してください。 |
      | 添付 | 振込先一覧.xlsm |

      B氏が最初にとるべき行動として，A社の規程に照らして最も適切なものはどれか。A社の規程では，不審なメールを受信した場合は「添付ファイルを開かず，情報システム部に報告する」と定めている。
    c:
      - 添付ファイルを開かず，メールを削除せずに情報システム部に報告する。
      - 添付ファイルを開いてマクロを有効にし，内容を確認してから報告する。
      - 差出人アドレスに返信して，本物の経理部からのメールかどうかを問い合わせる。
      - 誤って開くといけないので，誰にも知らせずにメールを削除する。
      - 同じ部署の全員にメールを転送して注意を呼びかける。
    a: ア
    exp: |
      差出人のドメインが正規の a-sya.example と異なり、マクロ付きファイルを開かせようとしているので、標的型メールの疑いがあります。規程どおり添付ファイルを開かずに報告します。調査や他の受信者への対応のために、メールは削除せずに残しておきます。
    why:
      - 正解です。規程に従い、証拠となるメールを残したまま報告します。
      - マクロを有効にするとマルウェアに感染するおそれがあります。
      - 差出人アドレスは攻撃者のものの可能性があり、返信すると攻撃者とのやり取りになります。確認するなら既知の連絡先を使います。
      - 削除すると調査ができず、組織として他の受信者への注意喚起もできません。
      - 不審なファイル付きのメールを転送すると、誤って開く人を増やすおそれがあります。
    terms: [標的型メール, ソーシャルエンジニアリング, マクロウイルス]

  - id: B-SEC-007
    topic: [B5, 11-2-1]
    diff: 2
    q: |
      A社では，顧客への見積書をメールで送る際，次の手順をとっている。

      | 手順 | 内容 |
      | --- | --- |
      | 1 | 見積書をパスワード付きZIPファイルに圧縮する |
      | 2 | ZIPファイルを添付したメールを顧客に送信する |
      | 3 | 直後に，同じ宛先にパスワードを記載したメールを送信する |

      情報セキュリティ担当者がこの手順の問題点を指摘した。指摘として最も適切なものはどれか。
    c:
      - 宛先を誤った場合，パスワードも同じ誤った宛先に届くので，情報漏えいを防げない。
      - ZIPファイルの圧縮によって，見積書の内容が改ざんされるおそれがある。
      - パスワードを別のメールにすると，メールの到達が遅くなり可用性が損なわれる。
      - 顧客がZIPファイルを開けないので，暗号化の効果がなくなる。
    a: ア
    exp: |
      パスワードを同じ経路（メール）で同じ宛先に直後に送るので、宛先の誤りや、通信経路・メールボックスへの不正アクセスがあれば、ファイルとパスワードの両方が渡ってしまいます。また、暗号化された ZIP ファイルはマルウェア対策ソフトで中身を検査できないという問題もあります。クラウドストレージの共有リンクにアクセス制限をかけるなど、別の方式が推奨されています。
    why:
      - 正解です。同じ宛先・同じ経路で送るので、誤送信時の保護になりません。
      - 圧縮は内容を改ざんするものではありません。
      - メールを 2 通に分けても、到達の遅延は問題点の本質ではありません。
      - 顧客は受け取ったパスワードで開けるので、開けないことは前提として誤りです。
    know: パスワード付き ZIP ファイルとパスワードを別のメールで送る方式は、俗に PPAP と呼ばれ、効果が乏しいとして見直す組織が増えています。
    terms: [PPAP, 暗号化, 情報漏えい]

  - id: B-SEC-008
    topic: [B5, 11-2-1]
    diff: 1
    q: |
      A社の営業部員B氏は，複数の顧客に新製品の案内メールを一斉に送信した際，全員のメールアドレスを「宛先（To）」に入力して送信した。受信者どうしは互いに面識がない。

      送信後にB氏が気付いた問題点と，今後の再発防止策の組合せとして，最も適切なものはどれか。
    c:
      - 問題点は受信者全員に他の顧客のメールアドレスが開示されたこと，再発防止策は一斉送信に一斉メール配信の仕組みを使うか，宛先をBCCにすることを手順化することである。
      - 問題点は受信者全員に他の顧客のメールアドレスが開示されたこと，再発防止策は宛先をCCに変更することである。
      - 問題点はメールの本文が暗号化されていなかったこと，再発防止策はS/MIMEで署名することである。
      - 問題点はメールが迷惑メールと判定されること，再発防止策は送信元ドメイン認証を導入することである。
    a: ア
    exp: |
      To や CC に入れたアドレスは受信者全員に表示されるので、互いに面識のない顧客のメールアドレス（個人情報になり得る）が漏えいしました。BCC のアドレスは他の受信者に表示されません。ただし入力ミスの余地があるため、一斉配信の仕組みの利用や、送信前の確認手順も合わせて整えることが有効です。
    why:
      - 正解です。アドレスの開示が問題で、BCC や配信の仕組みで防げます。
      - CC に入れたアドレスも受信者全員に表示されるので、防止策になりません。
      - 今回の問題は受信者どうしにアドレスが見えたことで、暗号化や署名では防げません。
      - 迷惑メール判定は今回の問題ではありません。
    terms: [情報漏えい, メール誤送信]

  - id: B-SEC-009
    topic: [B5, 11-1-3-2]
    diff: 2
    q: |
      A社の従業員B氏のPCで，マルウェア対策ソフトが「不審なプログラムが外部の不明なサーバと通信している」と警告した。A社のインシデント対応手順の一部は次のとおりである。

      | 手順 | 内容 |
      | --- | --- |
      | 1 | 感染が疑われるPCを直ちにネットワークから切り離す（LANケーブルを抜く，無線LANを無効にする） |
      | 2 | PCの電源は切らずに，情報システム部に連絡する |
      | 3 | 情報システム部の指示があるまでPCを操作しない |

      手順2で「電源を切らない」としている理由として，最も適切なものはどれか。
    c:
      - メモリ上に残っている実行中のプログラムや通信先などの情報を，調査のために保全するため
      - 電源を切ると，マルウェアが他のPCに感染を広げるため
      - 電源を切ると，ネットワークから切り離した状態が解除されるため
      - 電源を入れたままにすると，マルウェアが自動的に駆除されるため
    a: ア
    exp: |
      実行中のプロセスや通信先、メモリ上にだけ存在するマルウェアの痕跡などは、電源を切ると消えてしまいます。原因や被害範囲を調べるデジタルフォレンジックスのために、ネットワークからは切り離して被害の拡大を止めつつ、電源は入れたまま証拠を保全します。
    why:
      - 正解です。揮発性の情報を保全するためです。
      - 電源を切ってもネットワーク経由の感染拡大は起こりません。拡大の防止はネットワークからの切離しで行います。
      - 電源の操作とネットワークからの切離しは無関係です。
      - 電源を入れておくだけでマルウェアが駆除されることはありません。
    terms: [マルウェア, デジタルフォレンジックス, 証拠保全]

  - id: B-SEC-010
    topic: [B5, 11-2-3]
    diff: 2
    q: |
      A社のファイルサーバのバックアップ方式は，次のとおりである。

      | 項目 | 現状 |
      | --- | --- |
      | 方式 | 毎日深夜にフルバックアップを取得 |
      | 保存先 | ファイルサーバと同じLANに常時接続したNAS |
      | 保存世代 | 最新の1世代のみ（前日分を上書き） |

      同業他社でランサムウェアによってサーバとバックアップの両方が暗号化される被害が発生した。A社でも同様の被害を受けた場合に備えて，バックアップ方式の改善策として最も適切なものはどれか。
    c:
      - 複数世代を保存し，そのうち一部をネットワークから切り離した媒体や書換えできない保存先に保管する。
      - バックアップの取得を1日2回に増やし，同じNASに上書きする。
      - フルバックアップを差分バックアップに変更して，取得時間を短くする。
      - NASをRAID5構成にして，ディスク故障に備える。
      - NASのアクセス権を，全社員が読み書きできるように変更する。
    a: ア
    exp: |
      現状では、NAS が常時ネットワークにつながっているため、ランサムウェアがバックアップまで暗号化できます。また 1 世代しかないため、暗号化されたデータでバックアップを上書きすると復旧できません。複数世代を残し、オフライン（ネットワークから切り離した）媒体や書換え不可の保存先に保管することで、感染前の状態に戻せるようにします。
    why:
      - 正解です。世代管理とオフライン保管で、暗号化前のデータを残せます。
      - 同じ NAS に上書きする限り、暗号化されたデータで上書きされる問題は解決しません。
      - 方式を変えても、保存先がネットワーク上にある問題は残ります。
      - RAID はディスク故障への対策で、暗号化されたデータはそのまま冗長化されます。
      - アクセス権を広げると、かえって暗号化される危険が高まります。
    know: バックアップを 3 つ持ち、2 種類の媒体に保存し、そのうち 1 つを別の場所に保管するという 3-2-1 ルールもよく知られています。
    terms: [ランサムウェア, オフラインバックアップ, 世代管理, フルバックアップ]

  - id: B-SEC-011
    topic: [B5, 11-2-3]
    diff: 3
    q: |
      A社は，ファイルサーバのバックアップを次のスケジュールで取得している。

      | 曜日 | 取得するバックアップ |
      | --- | --- |
      | 日曜日 | フルバックアップ |
      | 月曜日〜土曜日 | 差分バックアップ（直前のフルバックアップからの変更分） |

      木曜日の業務時間中にファイルサーバが故障した。水曜日の深夜に取得したバックアップまでの状態に復旧するときに，使用するバックアップが最も少ない組合せはどれか。
    c:
      - 日曜日のフルバックアップと水曜日の差分バックアップ
      - 水曜日の差分バックアップだけ
      - 日曜日のフルバックアップと月曜日〜水曜日の差分バックアップすべて
      - 日曜日のフルバックアップだけ
    a: ア
    exp: |
      差分バックアップは、直前のフルバックアップ以降に変更されたデータをすべて含みます。水曜日の差分には月曜日から水曜日までの変更が含まれるので、日曜日のフルバックアップを戻した後に水曜日の差分を戻せば、水曜日深夜の状態になります。
    why:
      - 正解です。フルバックアップと最新の差分の 2 つで復旧できます。
      - 差分だけでは、変更されていないデータが含まれていません。
      - これは増分バックアップ（直前のバックアップからの変更分）の場合の復旧方法です。差分バックアップでは最新の 1 回分に月曜日からの変更が全て含まれるので、古い差分は不要で、最少の組合せではありません。
      - フルバックアップだけでは、月曜日以降の変更が失われます。
    terms: [差分バックアップ, 増分バックアップ, フルバックアップ]

  - id: B-SEC-012
    topic: [B5, 11-1-4]
    diff: 2
    q: |
      A社の情報システム部は，脆弱性情報をもとに次の4件の対応の優先順位を決めることにした。

      | No. | 対象 | 設置場所 | 脆弱性の内容 | 深刻度 | 攻撃の状況 |
      | --- | --- | --- | --- | --- | --- |
      | 1 | 公開Webサーバ | DMZ（インターネットから接続可） | 認証なしで遠隔からコードを実行できる | 緊急 | 攻撃コードが公開され，悪用が確認されている |
      | 2 | 社内会計サーバ | 社内LAN | 認証済み利用者が権限を昇格できる | 重要 | 悪用は確認されていない |
      | 3 | 検証用PC | ネットワークから切り離した検証室 | 細工したファイルを開くとコードが実行される | 緊急 | 悪用は確認されていない |
      | 4 | 社内Wiki | 社内LAN | 特定の画面で表示が崩れる | 低 | なし |

      最も優先して対応すべきものはどれか。
    c:
      - No.1
      - No.2
      - No.3
      - No.4
    a: ア
    exp: |
      対応の優先度は、脆弱性の深刻度だけでなく、攻撃者から到達できるか（インターネットに公開されているか）や、実際に悪用されているかを合わせて判断します。No.1 は深刻度が緊急で、インターネットから到達でき、すでに悪用が確認されているので、最も危険が差し迫っています。
    why:
      - 正解です。深刻度・到達可能性・悪用状況のいずれも最も危険です。
      - 社内 LAN にあり、認証済み利用者に限られ、悪用も確認されていないので、No.1 より優先度は低くなります。
      - 深刻度は緊急ですが、ネットワークから切り離されており、遠隔から攻撃される可能性が低いです。
      - 表示崩れは深刻度が低く、攻撃の状況もありません。
    know: 脆弱性の深刻度を共通の基準で評価する方法として CVSS があります。
    terms: [脆弱性管理, CVSS, セキュリティパッチ, DMZ]

  - id: B-SEC-013
    topic: [B5, 11-4-1-3]
    diff: 2
    q: |
      A社のサーバ室の入退室管理は，次のとおりである。

      | 項目 | 現状 |
      | --- | --- |
      | 入室 | ICカードをかざして解錠する |
      | 退室 | ボタンを押して解錠する（記録なし） |
      | 入退室の記録 | 入室時のICカードの利用記録だけを保存 |

      ある日，入室記録のない委託業者の作業員がサーバ室内にいたことが判明した。調査の結果，ICカードを持つ社員の入室時に後ろについて一緒に入室していたことが分かった。この事象の再発防止策として，最も適切なものはどれか。
    c:
      - 入室時と退室時の両方でICカードによる認証を必要とし，入室記録がないカードでは退室できないようにする。
      - サーバ室のサーバにクリアスクリーンを設定する。
      - ICカードの暗証番号を定期的に変更する。
      - 委託業者との契約に秘密保持条項を追加する。
    a: ア
    exp: |
      権限のある人の後ろについて入室する行為を共連れといいます。入室と退室の両方で認証を行い、入室の記録がなければ退室できない（逆に退室の記録がなければ再入室できない）仕組みをアンチパスバックといい、共連れした人が退室できなくなるため、共連れの抑止と発見に効果があります。
    why:
      - 正解です。アンチパスバックにより共連れを防止・検知できます。
      - クリアスクリーンは画面ののぞき見や離席時の不正操作への対策で、入室を防ぎません。
      - 作業員はカードを使わずに入室しており、暗証番号の変更では防げません。
      - 契約上の対策は必要な場合もありますが、物理的な不正入室そのものは防げません。
    terms: [共連れ, アンチパスバック, 入退室管理]

  - id: B-SEC-014
    topic: [B5, 11-2-1]
    diff: 2
    q: |
      A社は，顧客の個人情報を含むデータの入力作業をB社に委託している。委託先管理の状況は次のとおりである。

      | 項目 | 現状 |
      | --- | --- |
      | 契約 | 秘密保持の条項を含む |
      | 再委託 | 契約に定めがなく，B社はC社に作業の一部を再委託していた |
      | 安全管理の確認 | 契約時にB社の自己申告書を受け取ったのみ |
      | 作業終了後のデータ | 取扱いの定めなし |

      A社がB社との契約や管理の方法を見直す際に，追加すべき事項として最も適切なものはどれか。
    c:
      - 再委託には事前承認を必要とし，安全管理の状況を定期的に確認するとともに，作業終了後のデータの返却・削除を義務付ける。
      - 秘密保持の条項を削除し，B社の責任で自由に再委託できるようにする。
      - 入力作業の単価を引き下げて，委託費用を削減する。
      - B社の従業員全員の個人情報をA社に提出させる。
    a: ア
    exp: |
      委託先管理では、委託先の選定だけでなく、契約で安全管理措置や再委託の条件を定め、実施状況を定期的に確認し、終了後のデータの取扱いまで管理します。表の問題点は、再委託の定めがないこと、確認が契約時の自己申告だけであること、終了後のデータの扱いがないことの三つで、これらに対応する事項を追加します。
    why:
      - 正解です。表に示された三つの問題点にすべて対応しています。
      - 秘密保持の条項を削除すると情報漏えいの危険が増え、管理を弱める方向です。
      - 費用の削減は情報セキュリティの管理とは関係ありません。
      - 委託先の従業員全員の個人情報を集めることは目的に対して過剰で、問題点の解決になりません。
    terms: [委託先管理, 秘密保持契約]

  - id: B-SEC-015
    topic: [B5, 11-5-3]
    diff: 2
    q: |
      A社はクラウドのストレージサービスに，製品カタログと顧客名簿を保存している。各フォルダの設定は次のとおりである。

      | フォルダ | 保存データ | 公開設定 | アクセスログ |
      | --- | --- | --- | --- |
      | /catalog | 製品カタログ（Webサイトで公開） | インターネットに公開 | 無効 |
      | /customer | 顧客名簿 | インターネットに公開 | 無効 |
      | /backup | 社内システムのバックアップ | 非公開（社内の特定アカウントのみ） | 有効 |

      設定を点検した担当者の指摘として，最も適切なものはどれか。
    c:
      - /customer がインターネットに公開されているので，直ちに非公開にし，アクセスログを有効にして過去の公開期間中のアクセスの有無を調査できるようにする。
      - /catalog はインターネットに公開されているので，直ちに非公開にする。
      - /backup は非公開なので，アクセスログを無効にしてよい。
      - クラウド事業者の責任でデータを保護するので，利用者が設定を点検する必要はない。
    a: ア
    exp: |
      顧客名簿のような機密情報が誰でも閲覧できる設定は、クラウドの設定ミスによる情報漏えいの典型例です。直ちに非公開にするとともに、今後の不正アクセスを検知できるようアクセスログを有効にします。なお、ログが無効だった期間のアクセスは追跡できない可能性があり、事業者のログの提供可否も確認します。製品カタログは公開が目的なので、公開設定は適切です。
    why:
      - 正解です。機密情報の公開を止め、記録を残すようにします。
      - 製品カタログは Web サイトで公開する目的のデータなので、公開設定は業務上正しいです。
      - 非公開のフォルダでも、権限のあるアカウントの不正利用を発見するためにログは必要です。
      - クラウドでは事業者と利用者で責任を分担し、ストレージの公開設定は利用者の責任です（責任共有モデル）。
    terms: [責任共有モデル, クラウド, 情報漏えい, CSPM]

  - id: B-SEC-016
    topic: [B5, 11-5-3]
    diff: 2
    q: |
      A社では，テレワークの際に会社貸与のPCから社内システムを利用する。現在の構成は次のとおりである。

      | 項目 | 現状 |
      | --- | --- |
      | 接続方式 | 自宅のインターネット回線からVPN装置に接続し，社内LANに入る |
      | VPNの認証 | IDとパスワードのみ |
      | VPN装置のソフトウェア | 2年前のバージョンのまま更新していない |
      | 貸与PC | 社外からの業務はVPN接続時のみ許可 |

      最近，VPN装置の既知の脆弱性を悪用して認証情報を窃取し，社内に侵入する攻撃が多数報告されている。A社が優先して実施すべき対策の組合せとして，最も適切なものはどれか。
    c:
      - VPN装置のソフトウェアを最新に更新し，VPNの認証に多要素認証を導入する。
      - VPNを廃止し，社内システムをインターネットに直接公開する。
      - 貸与PCのパスワードを長くする。
      - 自宅の無線LANのSSIDを隠す設定を従業員に依頼する。
    a: ア
    exp: |
      報告されている攻撃は、更新していない VPN 装置の既知の脆弱性を突いて認証情報を盗むものです。まず修正済みのバージョンに更新して脆弱性をふさぎ、さらに盗まれた ID とパスワードだけではログインできないよう多要素認証を導入します。
    why:
      - 正解です。脆弱性の解消と、認証情報が窃取された場合への備えを両方行います。
      - 社内システムを直接公開すると攻撃される範囲が広がり、危険が増します。
      - PC のパスワードは VPN 装置の脆弱性や VPN の認証情報の窃取とは関係ありません。
      - SSID を隠しても VPN 装置の脆弱性は解消されません。
    terms: [VPN, 多要素認証, 脆弱性管理, セキュリティパッチ]

  - id: B-SEC-017
    topic: [B5, 11-5-2]
    diff: 1
    q: |
      A社の人事部から情報システム部に，次の退職者の連絡があった。

      | 氏名 | 退職日 | 利用していたアカウント |
      | --- | --- | --- |
      | B氏 | 3月31日 | 社内システムのID，VPNのID，クラウドの営業支援サービスのID |

      4月10日に点検したところ，社内システムのIDは削除されていたが，VPNとクラウドサービスのIDは有効なまま残っており，4月5日にクラウドサービスへのログイン記録があった。この事象を踏まえた改善策として，最も適切なものはどれか。
    c:
      - 退職時に削除すべきアカウントを一覧で管理し，退職日に全サービスのアカウントを停止する手順とするとともに，定期的にアカウントの棚卸しを行う。
      - 退職者のパスワードを人事部が引き継いで管理する。
      - クラウドサービスの利用を禁止する。
      - 退職者のアカウントは，退職後1年間は残しておく手順とする。
    a: ア
    exp: |
      アカウントの削除が一部のシステムに漏れていたことが原因です。利用者ごとにどのサービスにアカウントがあるかを把握し、退職日に確実に停止する手順と、実在する利用者とアカウントを突き合わせる定期的な棚卸しにより、削除漏れを防ぎ、早期に発見できます。4 月 5 日のログインについては、不正利用の有無を調査する必要があります。
    why:
      - 正解です。削除漏れの原因と発見の両方に対応しています。
      - パスワードの引継ぎは共有アカウントのような状態を生み、利用者の特定ができなくなります。
      - 問題は削除漏れで、サービスの利用そのものではありません。
      - 退職後にアカウントを残すと、今回のような不正利用の危険が続きます。
    terms: [IDの棚卸し, アクセス制御, 内部不正]

  - id: B-SEC-018
    topic: [B5, 11-4-1-1]
    diff: 2
    q: |
      A社の情報の持出し規程の一部を次に示す。

      | 項目 | 規程 |
      | --- | --- |
      | 対象 | 顧客情報を含む電子データ |
      | 持出しの方法 | 会社が貸与する暗号化機能付きUSBメモリに限る |
      | 手続 | 持出し前に上長の承認を受け，持出し管理台帳に記録する |
      | 返却 | 用務終了後，データを消去してUSBメモリを返却し，台帳に記録する |

      次の行為のうち，この規程に違反しないものはどれか。
    c:
      - 上長の承認を受けて台帳に記録し，貸与された暗号化機能付きUSBメモリで顧客情報を持ち出し，用務後にデータを消去して返却した。
      - 急ぎだったため，上長の承認を受けずに貸与のUSBメモリで顧客情報を持ち出し，翌日に事後報告した。
      - 上長の承認を受けたうえで，私物のUSBメモリにパスワードを設定して顧客情報を持ち出した。
      - 上長の承認を受け，顧客情報を個人のクラウドストレージにアップロードして外出先で閲覧した。
    a: ア
    exp: |
      規程は「貸与の暗号化 USB メモリに限る」「事前の上長承認と台帳記録」「用務後の消去と返却」の三点を求めています。三点をすべて満たしているのは、承認・記録を行い、貸与の媒体を使い、用務後に消去・返却した行為だけです。
    why:
      - 正解です。規程の手続と方法をすべて守っています。
      - 承認は持出し前に受ける必要があり、事後報告は違反です。
      - 持出しの方法は貸与の媒体に限られており、私物の USB メモリは違反です。
      - 個人のクラウドストレージは規程で認められた方法ではありません。
    terms: [情報セキュリティポリシー, 人的セキュリティ対策, 持出し管理]

  - id: B-SEC-019
    topic: [B5, 11-5-5]
    diff: 2
    q: |
      A社のWebアプリケーションの商品検索機能は，次の処理を行う。

      | 処理 | 内容 |
      | --- | --- |
      | (1) | 利用者が入力した検索語を受け取る |
      | (2) | 検索語を文字列連結して SQL 文「SELECT * FROM item WHERE name = '検索語'」を組み立て，データベースに問い合わせる |
      | (3) | 検索結果と，「“検索語”の検索結果」という見出しをHTMLに埋め込んで表示する |

      この機能にはSQLインジェクションとクロスサイトスクリプティングの両方の脆弱性がある。それぞれの根本的な対策を行う処理と対策内容の組合せとして，適切なものはどれか。
    c:
      - (2) でプレースホルダを使ってSQL文を組み立て，(3) でHTMLに出力する文字列をエスケープする。
      - (1) で検索語を暗号化し，(3) で検索結果を暗号化する。
      - (2) でHTMLのエスケープを行い，(3) でプレースホルダを使う。
      - (3) でSQL文をエスケープし，(1) でHTMLのタグを削除する。
      - (2) でデータベースの通信をTLSで暗号化し，(3) でサーバ証明書を確認する。
    a: ア
    exp: |
      SQL インジェクションは (2) の SQL 文の組立てで入力値が SQL の一部として解釈されることが原因なので、プレースホルダ（バインド機構）で入力値を値として扱います。クロスサイトスクリプティングは (3) で入力値が HTML の一部として解釈されることが原因なので、出力時に < や " などをエスケープします。対策は、それぞれの解釈が起こる箇所で行うのが根本的です。
    why:
      - 正解です。SQL の組立て時と HTML の出力時に、それぞれ対策します。
      - 暗号化は盗聴への対策で、入力値が命令として解釈される問題は防げません。
      - 対策の種類と処理の箇所が逆になっています。
      - SQL 文の組立ては (2) で、(3) ではありません。(1) でタグを削除するだけでは、出力箇所によっては不十分です。
      - 通信の暗号化と証明書の確認は、SQL インジェクションやクロスサイトスクリプティングを防ぎません。
    terms: [SQLインジェクション, クロスサイトスクリプティング, プレースホルダ, エスケープ処理]

  - id: B-SEC-020
    topic: [B5, 11-5-3]
    diff: 3
    q: |
      A社のファイアウォールのルールを次に示す。ルールは番号の小さい順に評価され，最初に条件に一致したルールの動作が適用される。どのルールにも一致しない通信は拒否される。

      | 番号 | 送信元 | 宛先 | プロトコル/宛先ポート | 動作 |
      | --- | --- | --- | --- | --- |
      | 1 | 任意 | 203.0.113.10（公開Webサーバ） | TCP/443 | 許可 |
      | 2 | 198.51.100.0/24 | 任意 | 任意 | 拒否 |
      | 3 | 任意 | 203.0.113.20（メールサーバ） | TCP/25 | 許可 |
      | 4 | 192.168.1.0/24（社内LAN） | 任意 | TCP/443 | 許可 |

      インターネット上の 198.51.100.8 から，次の通信が行われた。

      | 通信 | 宛先 | プロトコル/宛先ポート |
      | --- | --- | --- |
      | P | 203.0.113.10 | TCP/443 |
      | Q | 203.0.113.20 | TCP/25 |
      | R | 203.0.113.10 | TCP/22 |

      ファイアウォールを通過する通信だけをすべて挙げたものはどれか。
    c:
      - P
      - P，Q
      - Q
      - P，Q，R
      - なし
      - P，R
    a: ア
    exp: |
      通信ごとに上から順に照合します。P は番号 1（宛先 203.0.113.10、TCP/443）に一致するので許可されます。Q は番号 1 には宛先が一致せず、番号 2（送信元 198.51.100.0/24）に一致するので拒否され、番号 3 は評価されません。R は番号 1 のポートが一致せず、番号 2 に一致して拒否されます。通過するのは P だけです。
    why:
      - 正解です。P だけが拒否のルールより前の番号 1 に一致します。
      - Q は番号 3 にも一致しますが、先に番号 2 に一致して拒否されます。
      - Q は番号 2 で拒否されます。P は番号 1 で許可されます。
      - R は TCP/22 で、番号 1 に一致せず番号 2 で拒否されます。
      - P は番号 2 より前の番号 1 で許可されるので、通過します。
      - R は番号 2 で拒否されます。
    know: ルールの順序によって結果が変わるため、拒否したい送信元のルールは、許可のルールより前に置くのが一般的です。
    terms: [ファイアウォール, パケットフィルタリング, 暗黙の拒否]

  - id: B-SEC-021
    topic: [B5, 11-5-3]
    diff: 3
    q: |
      A社のファイアウォールのルールを次に示す。ルールは番号の小さい順に評価され，最初に一致したルールが適用される。どのルールにも一致しない通信は拒否される。DMZ は 203.0.113.0/28，社内LAN は 192.168.1.0/24 である。

      | 番号 | 送信元 | 宛先 | プロトコル/宛先ポート | 動作 |
      | --- | --- | --- | --- | --- |
      | 1 | 192.168.1.0/24 | 203.0.113.0/28 | TCP/22 | 許可 |
      | 2 | 任意 | 203.0.113.5 | TCP/80，TCP/443 | 許可 |
      | 3 | 203.0.113.0/28 | 192.168.1.0/24 | 任意 | 拒否 |
      | 4 | 192.168.1.0/24 | 任意 | TCP/443 | 許可 |

      DMZのWebサーバ 203.0.113.5 がマルウェアに感染し，社内LANへの侵入や外部との通信を試みた。次の通信のうち，ファイアウォールを通過するものはどれか。
    c:
      - 203.0.113.5 から 192.168.1.30 への TCP/445 の通信
      - 203.0.113.5 から 192.168.1.30 への TCP/443 の通信
      - 203.0.113.5 からインターネット上の 198.51.100.9 への TCP/443 の通信
      - 示された通信は，いずれも通過しない
      - 203.0.113.5 から 192.168.1.30 への TCP/22 の通信
    a: エ
    exp: |
      各通信を上から照合します。社内 LAN（192.168.1.30）宛ての TCP/445 と TCP/443 は、番号 1・2 の送信元や宛先に一致せず、番号 3（DMZ→社内 LAN）に一致して拒否されます。インターネット宛ての TCP/443 は、番号 1〜3 に一致せず、番号 4 は送信元が社内 LAN に限られるので一致せず、どのルールにも一致しないので拒否されます。したがって、示された DMZ から社内 LAN やインターネットへの通信はいずれも通過しません。
    why:
      - 番号 3 に一致して拒否されます。
      - 宛先ポートに関係なく、番号 3 に一致して拒否されます。
      - 番号 4 の送信元は社内 LAN だけなので一致せず、最後に拒否されます。
      - 正解です。挙げた通信はどれもファイアウォールを通過しません。
      - 番号 1 は送信元が社内 LAN の場合だけなので一致せず、番号 3 で拒否されます。
    terms: [ファイアウォール, DMZ, 暗黙の拒否]

  - id: B-SEC-022
    topic: [B5, 11-2-6]
    diff: 2
    q: |
      A社のインシデント対応手順では，次の段階を定めている。

      | 段階 | 内容 |
      | --- | --- |
      | 検知・報告 | 異常を発見した者は情報システム部に報告する |
      | 初動対応 | 被害の拡大を防ぐ（封じ込め） |
      | 調査 | 原因と影響範囲を調べる |
      | 復旧 | システムを正常な状態に戻す |
      | 事後対応 | 再発防止策を検討し，関係者に報告する |

      顧客向けWebサイトが改ざんされ，閲覧者を不正なサイトに誘導する仕掛けが埋め込まれていることが分かった。初動対応として最も適切なものはどれか。
    c:
      - Webサイトの公開を一時停止し，閲覧者への被害の拡大を防ぐ。
      - 改ざんされたファイルを直ちに削除して，証拠が残らないようにする。
      - 原因が判明するまで，Webサイトを改ざんされた状態のまま公開を続ける。
      - 再発防止策の検討を最初に行う。
    a: ア
    exp: |
      初動対応の目的は被害の拡大を防ぐことです。改ざんされたサイトを公開し続けると、閲覧者が不正なサイトに誘導され被害が広がるので、まず公開を停止します。改ざんされたファイルやログは、その後の調査のために保全しておきます。
    why:
      - 正解です。閲覧者への被害の拡大を止めることが初動対応です。
      - ファイルを削除すると原因調査ができなくなります。証拠は保全します。
      - 公開を続けると閲覧者の被害が広がります。
      - 再発防止策の検討は事後対応の段階で行います。
    terms: [情報セキュリティインシデント, CSIRT, 証拠保全]

  - id: B-SEC-023
    topic: [B5, 11-5-2]
    diff: 2
    q: |
      A社のサーバの管理者アカウントの運用は次のとおりである。

      | 項目 | 現状 |
      | --- | --- |
      | アカウント | 管理者用の共通アカウント「admin」を管理者3名で共有 |
      | パスワード | 3名が同じパスワードを使用 |
      | 操作ログ | admin によるログインと操作を記録 |

      ある日，admin で重要な設定ファイルが削除された。操作ログを見ても，3名のうち誰が操作したかを特定できなかった。この問題を解決する運用の改善として，最も適切なものはどれか。
    c:
      - 管理者ごとに個別の特権アカウントを発行し，誰がいつ何を操作したかを記録できるようにする。
      - admin のパスワードを毎月変更し，3名に通知する。
      - 操作ログの保存期間を延ばす。
      - admin を4名で共有する。
    a: ア
    exp: |
      共有アカウントでは、ログに記録されるのが admin という名前だけなので、実際に操作した人を特定できません（責任追跡性が確保できない）。管理者ごとに個別のアカウントを発行すれば、ログから操作者を特定できます。特権 ID は利用者を限定し、利用状況を監視することが重要です。
    why:
      - 正解です。個人を識別できるアカウントにすることで、操作者を特定できます。
      - パスワードを変えても共有している限り、誰が操作したかは分かりません。
      - 保存期間を延ばしても、記録に個人が残らない問題は解決しません。
      - 共有する人数を増やすと、特定はさらに難しくなります。
    terms: [特権ID, 責任追跡性, ログ管理]

  - id: B-SEC-024
    topic: [B5, 11-1-3-2]
    diff: 2
    q: |
      A社のPCのマルウェア対策は，次のとおりである。

      | 項目 | 現状 |
      | --- | --- |
      | マルウェア対策ソフト | 全PCに導入，定義ファイルは1日1回自動更新 |
      | OSの更新 | 利用者の任意（自動更新は無効） |
      | 管理者権限 | 全利用者が自分のPCの管理者権限を持つ |

      未知のマルウェアにより，OSの既知の脆弱性を悪用されて複数のPCが感染した。このマルウェアは定義ファイルに登録されていなかった。再発防止策として，最も効果が高い組合せはどれか。
    c:
      - OSの更新を自動で適用するよう設定し，利用者の管理者権限を必要な者だけに限定する。
      - 定義ファイルの更新を1日2回にする。
      - マルウェア対策ソフトを別の製品に変更する。
      - PCのディスクを暗号化する。
    a: ア
    exp: |
      今回の感染は、OS の既知の脆弱性が放置されていたことと、定義ファイルにない未知のマルウェアだったことによります。OS の更新を確実に適用すれば悪用された脆弱性をふさげます。また、利用者に管理者権限がないと、マルウェアが PC の設定を変更したり、深く入り込んだりすることが難しくなり、被害を抑えられます。
    why:
      - 正解です。脆弱性の解消と権限の最小化で、感染と被害を防ぎます。
      - 定義ファイルにないマルウェアなので、更新回数を増やしても検知できません。
      - 製品を替えても、OS の脆弱性が放置されている問題は残ります。
      - ディスクの暗号化は盗難時の情報漏えい対策で、マルウェアの感染は防げません。
    terms: [マルウェア対策, セキュリティパッチ, 最小権限の原則, パターンマッチング法]

  - id: B-SEC-025
    topic: [B5, 11-2-1]
    diff: 2
    q: |
      A社では，サーバのログを次のように管理している。

      | サーバ | ログの保存場所 | 時刻の設定 |
      | --- | --- | --- |
      | Webサーバ | Webサーバ自身のディスク | 手動で設定（実際の時刻より7分進んでいる） |
      | DBサーバ | DBサーバ自身のディスク | NTPサーバと同期 |
      | ファイアウォール | ファイアウォール自身 | NTPサーバと同期 |

      不正アクセスの調査で，各ログを突き合わせて攻撃の流れを追うことにしたが，作業が難航した。また，攻撃者がWebサーバのログを削除した形跡も見つかった。ログ管理の改善策として，最も適切なものはどれか。
    c:
      - すべての機器の時刻をNTPサーバと同期させ，ログを攻撃者が改ざんしにくい別のログサーバに集約して保存する。
      - Webサーバのログの保存期間を短くして，ディスク容量を節約する。
      - ログを取得する機器をファイアウォールだけに限定する。
      - Webサーバの時刻を，DBサーバより7分進めた状態で統一する。
    a: ア
    exp: |
      複数の機器のログを突き合わせるには、時刻が正しくそろっている必要があります。Web サーバだけ時刻がずれているので、NTP で同期させます。また、ログがそのサーバ自身にあると、侵入した攻撃者に削除・改ざんされるおそれがあるので、別のログサーバに集約して保護します。
    why:
      - 正解です。時刻の同期とログの集約・保護の両方を行います。
      - 保存期間を短くすると、調査に必要なログが失われます。
      - ファイアウォールのログだけでは、サーバ内での操作を追跡できません。
      - 時刻をずらしたまま統一しても、実際の時刻やほかの機器のログとは対応がとれません。
    terms: [ログ管理, 監査証跡, SIEM]

  - id: B-SEC-026
    topic: [B5, 11-4-1-1]
    diff: 1
    q: |
      A社の事務所では，次のような状況が見られた。

      | No. | 状況 |
      | --- | --- |
      | 1 | 離席中のPCの画面に，顧客名簿が表示されたままになっていた |
      | 2 | 退社後の机の上に，契約書の写しが置かれたままになっていた |
      | 3 | 会議室のホワイトボードに，システムのパスワードが書かれていた |

      これらへの対策として，A社の情報セキュリティ担当者が全従業員に求める事項の組合せとして，最も適切なものはどれか。
    c:
      - 離席時は画面をロックし，退社時は書類を施錠保管し，パスワードは他人の目に触れる場所に書かない。
      - 離席時はPCの電源を切り，書類はすべて廃棄し，パスワードは付箋に書いてPCに貼る。
      - 離席時は画面の輝度を下げ，書類は机の引出しに入れ，パスワードはホワイトボードの端に小さく書く。
      - PCにマルウェア対策ソフトを導入し，書類を電子化し，パスワードを長くする。
    a: ア
    exp: |
      No.1 にはクリアスクリーン（離席時の画面ロック）、No.2 にはクリアデスク（書類を机の上に放置せず施錠保管）、No.3 にはパスワードを他人に見られる場所に書かないことが対策になります。いずれも、のぞき見や持ち去りによる情報漏えいを防ぐ人的・物理的な対策です。
    why:
      - 正解です。三つの状況にそれぞれ対応しています。
      - 書類をすべて廃棄すると業務に支障があり、付箋に書いたパスワードは他人に見られます。
      - 輝度を下げても画面は読めます。端に書いてもパスワードは見られます。
      - マルウェア対策や長いパスワードは、のぞき見や放置書類の問題を解決しません。
    terms: [クリアスクリーン, クリアデスク, ショルダーハッキング]

  - id: B-SEC-027
    topic: [B5, 11-1-3-2]
    diff: 3
    q: |
      A社では，PCにEDR（エンドポイントでの検知・対応）製品を導入している。ある日，次の記録がEDRの管理画面に表示された。

      | 時刻 | PC | 事象 |
      | --- | --- | --- |
      | 10:02 | PC-15 | メールの添付ファイル「請求書.docm」を開いた |
      | 10:02 | PC-15 | 文書作成ソフトから PowerShell が起動された |
      | 10:03 | PC-15 | PowerShell が外部の 198.51.100.44 からファイルをダウンロードした |
      | 10:05 | PC-15 | PC-15 から社内の複数のPCの TCP/445 への接続が試みられた |
      | 10:06 | PC-22 | PC-15 からの接続を受け付けた |

      この記録から考えられる状況と，情報システム部が直ちに行うべき対応の組合せとして，最も適切なものはどれか。
    c:
      - PC-15 がマクロ付き文書からマルウェアに感染し，社内に感染を広げようとしているので，PC-15 と PC-22 をネットワークから隔離し，198.51.100.44 との通信を遮断する。
      - PC-15 の利用者が業務で PowerShell を使っただけなので，対応は不要である。
      - PC-22 が感染源なので，PC-22 だけを隔離する。
      - 198.51.100.44 は社内のサーバなので，遮断する必要はない。
    a: ア
    exp: |
      マクロ付き文書（.docm）を開いた直後に文書作成ソフトから PowerShell が起動し、外部からファイルを取得し、さらに社内の PC へファイル共有のポート（TCP/445）で接続を試みている流れは、マルウェアの感染と社内での拡散の典型です。接続を受け付けた PC-22 にも感染の疑いがあるので、両方を隔離し、外部の通信先も遮断して被害の拡大を防ぎます。
    why:
      - 正解です。感染の流れを読み取り、感染が疑われる PC の隔離と通信先の遮断を行います。
      - 文書ソフトからの PowerShell 起動と外部からのダウンロード、社内への接続試行は通常の業務の動作とはいえません。
      - 最初に添付ファイルを開いたのは PC-15 で、PC-22 は接続を受けた側です。
      - 198.51.100.44 はダウンロード元の外部のアドレスで、社内のサーバではありません。
    terms: [EDR, マクロウイルス, ファイルレスマルウェア, 標的型攻撃]

  - id: B-SEC-028
    topic: [B5, 11-2-1]
    diff: 2
    q: |
      A社は，社内の情報セキュリティ対策の運用状況を点検するため，次のチェックリストを用いて各部署を確認した。営業部の結果は次のとおりである。

      | No. | 点検項目 | 営業部の結果 |
      | --- | --- | --- |
      | 1 | 退職者・異動者のアカウントが速やかに削除・変更されている | 異動者2名の旧部署の権限が残っていた |
      | 2 | PCのOS・ソフトウェアが最新の状態である | 全台が最新 |
      | 3 | バックアップから実際に復元できることを確認している | 未実施 |
      | 4 | 不審メールの報告手順が周知されている | 周知済み |

      点検結果を受けて営業部が行うべき是正として，適切なものはどれか。
    c:
      - 異動者の旧部署の権限を削除し，バックアップからの復元テストを計画して実施する。
      - PCのOSを再度更新し，不審メールの報告手順を再周知する。
      - 異動者2名のアカウントを削除し，業務で使えないようにする。
      - バックアップの取得を中止する。
    a: ア
    exp: |
      不備があったのは No.1（異動者の旧部署の権限が残っている）と No.3（復元の確認が未実施）です。No.1 は不要になった権限だけを削除し、No.3 は実際に復元できるかをテストします。バックアップは取得していても、復元できなければ意味がありません。
    why:
      - 正解です。不備のあった二つの項目に対応しています。
      - No.2 と No.4 は問題がなく、是正の対象ではありません。
      - 異動者は在籍しており、削除すべきなのは旧部署の権限だけです。アカウントごと削除すると業務ができません。
      - バックアップの中止は、No.3 の不備の是正にならず、むしろ危険を高めます。
    terms: [アクセス権, バックアップ, IDの棚卸し]
