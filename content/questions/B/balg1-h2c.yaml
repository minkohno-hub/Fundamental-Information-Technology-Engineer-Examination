questions:
  - id: B-ALG-214
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の二重ループによる走査。配列の中から、合計が目標値になる要素の組（順序を区別しない）の数を数えるプログラムのトレースであり、範囲内。
    prereq: 二重ループの走査、添字の組の数え方
    hard: 内側のループが外側の添字の次から始まることで、同じ組の二度数えと、自分自身との組を避けていることを読み取る必要がある。同じ値が複数ある場合に、要素の位置が違えば別の組になる点も問われる。
    q: |
      次のプログラムを実行したときの、関数 countPairs(a) の戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      関数 countPairs は、配列 a の要素のうち、異なる 2 要素の合計が 7 になる組の数を返す。a ＝ {4, 2, 5, 3, 5, 1, 6} として countPairs(a) を呼び出す。
    code: |
      ○整数型: countPairs(整数型の配列: a)
        整数型: i, j, cnt
        cnt ← 0
        for (i を 1 から aの要素数 － 1 まで 1 ずつ増やす)
          for (j を i ＋ 1 から aの要素数 まで 1 ずつ増やす)
            if (a[i] ＋ a[j] ＝ 7)
              cnt ← cnt ＋ 1
            endif
          endfor
        endfor
        return cnt
    c:
      - '3'
      - '6'
      - '8'
      - '4'
    a: エ
    exp: |
      合計が 7 になる組は、要素の位置で数えると次の 4 組です。

      - 4（要素1）と 3（要素4）
      - 2（要素2）と 5（要素3）
      - 2（要素2）と 5（要素5）
      - 1（要素6）と 6（要素7）

      値 5 が 2 個あるため、2 との組は 2 組になります。内側のループが i ＋ 1 から始まるので、同じ組を逆順に数えることや、要素自身との組は生じません。戻り値は 4 です。
    why:
      - 1 と 6 の組を見落とした場合の値です。その組も合計は 7 になります。
      - 2 と 5 の組について、5 が 2 個あることを重ねて数え、2 組を 4 組としてしまった場合の値です。2 との組は 2 組だけです。
      - 順序を区別して数えた場合の値（4 組 × 2 通り）です。本問は順序を区別しません。
      - 正解です。合計 7 になる組は 4 組です。
    know: 組の数え方は、添字の走査の範囲で決まる。内側の開始位置が i ＋ 1 であることが、「順序を区別しない・重複しない」数え方を実現している点が要点である。
    terms:
      - 配列
    verify:
      result:
        call: countPairs
        args:
          - - 4
            - 2
            - 5
            - 3
            - 5
            - 1
            - 6
        of: return
    sim:
      entry: countPairs
      args:
        - - 4
          - 2
          - 5
          - 3
          - 5
          - 1
          - 6
  - id: B-ALG-215
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の剰余と商を使った桁の分解。整数の各桁の数字の合計を求めるプログラムのトレースであり、範囲内。
    prereq: 剰余（mod）で一の位を取り出すこと、商で桁を落とすこと、while による反復
    hard: n が書き換わっていく過程を追い、剰余で取り出す桁の順序（一の位から）と、合計に加わる値を一桁ずつ確認する必要がある。0 の桁も合計に加わる（値には影響しないが反復は進む）点も含まれる。
    q: |
      次のプログラムを実行したときの、関数 digitSum(n) の戻り値を、解答群の中から選べ。

      関数 digitSum は、整数 n の各桁の数字の合計を返す。n ＝ 4073 として digitSum(n) を呼び出す。
    code: |
      ○整数型: digitSum(整数型: n)
        整数型: s
        s ← 0
        while (n ＞ 0)
          s ← s ＋ (n mod 10)
          n ← n ÷ 10 の商
        endwhile
        return s
    c:
      - '14'
      - '10'
      - '11'
      - '18'
    a: ア
    exp: |
      剰余で一の位を取り出し、商で桁を落とす反復は、次のように進みます。

      | 反復 | n mod 10 | s | 次の n |
      | --- | --- | --- | --- |
      | 1 回目 | 3 | 3 | 407 |
      | 2 回目 | 7 | 10 | 40 |
      | 3 回目 | 0 | 10 | 4 |
      | 4 回目 | 4 | 14 | 0 |

      戻り値は 14 です。各桁 4、0、7、3 の合計と一致します。
    why:
      - 正解です。各桁の合計 4 ＋ 0 ＋ 7 ＋ 3 ＝ 14 です。
      - 一の位から 3 桁だけ（3 ＋ 7 ＋ 0）を合計した値です。千の位の 4 も含めます。
      - 一の位の 3 を加え忘れた場合の値（4 ＋ 0 ＋ 7）です。全ての桁が合計の対象です。
      - 最初の桁を 2 回加えた場合の値です。各桁は 1 回ずつ加わります。
    know: 桁の分解は、剰余で端の桁を取り出し、商で桁を落とす反復が基本形である。取り出す順序は一の位からであり、合計のような集計では順序は結果に影響しない点も要点である。
    terms:
      - 剰余
    verify:
      result:
        call: digitSum
        args:
          - 4073
        of: return
    sim:
      entry: digitSum
      args:
        - 4073
  - id: B-ALG-216
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の空欄補充（挿入位置の探索）。整列済み配列の中で、キーを挿入すべき位置を返すプログラムの判定条件と、最後まで見つからなかった場合の戻り値の組合せを問う問題であり、範囲内。
    prereq: 線形探索の走査、1 始まりの添字、探索の境界条件
    hard: キーと等しい要素がある場合はその位置で止まること、キーが全要素より大きい場合は要素数の次の位置を返すこと、という境界の両方を、比較の等号の有無と最後の戻り値で切り分ける必要がある。
    q: |
      次のプログラム中の【a】と【b】に入れる正しい答えの組合せを、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      関数 insertPos は、昇順に整列された配列 a の中で、key を挿入すべき位置（1 から始まる番号）を返す。既に key と等しい要素がある場合は、その要素の位置を返す。
    code: |
      ○整数型: insertPos(整数型の配列: a, 整数型: key)
        整数型: i
        for (i を 1 から aの要素数 まで 1 ずつ増やす)
          if (【a】)
            return i
          endif
        endfor
        return 【b】
    c:
      - a：a[i] ≧ key，b：aの要素数 ＋ 1
      - a：a[i] ＞ key，b：aの要素数 ＋ 1
      - a：a[i] ＝ key，b：aの要素数 ＋ 1
      - a：a[i] ≦ key，b：aの要素数 ＋ 1
      - a：a[i] ≧ key，b：aの要素数
    fills:
      - a: a[i] ≧ key
        b: aの要素数 ＋ 1
      - a: a[i] ＞ key
        b: aの要素数 ＋ 1
      - a: a[i] ＝ key
        b: aの要素数 ＋ 1
      - a: a[i] ≦ key
        b: aの要素数 ＋ 1
      - a: a[i] ≧ key
        b: aの要素数
    a: ア
    exp: |
      先頭から走査し、key 以上の要素が最初に現れた位置が挿入位置です。等しい要素があれば、その位置で止まります（等号を含む ≧ が必要です）。最後まで key 以上の要素がなければ、key は全要素より大きいので、挿入位置は末尾の次、すなわち要素数 ＋ 1 です。
    why:
      - 正解です。等号を含む条件で等しい要素の位置に止まり、全要素より大きい場合は要素数 ＋ 1 を返します。
      - a[i] ＞ key では、key と等しい要素を通り過ぎてしまい、等しい要素がある場合にその位置を返せません。
      - a[i] ＝ key では、等しい要素がない場合に途中で止まれず、key より小さい要素だけの範囲でも末尾の次の位置を返してしまいます。
      - a[i] ≦ key では、key より小さい要素のところで止まってしまい、先頭付近の誤った位置を返します。
      - 最後まで見つからなかった場合の戻り値が要素数では、末尾の要素の位置を返してしまい、挿入位置が 1 つ前になります。
    know: 探索の判定条件は、等号を含むかどうかで「等しい要素の扱い」が決まる。境界（等しい要素がある場合と、全要素より大きい場合）で条件を試すことが、空欄補充の検証の要点である。
    terms:
      - 線形探索
    verify:
      cases:
        - call: insertPos
          args:
            - - 2
              - 5
              - 8
              - 12
            - 8
          expect: 3
        - call: insertPos
          args:
            - - 2
              - 5
              - 8
              - 12
            - 20
          expect: 5
        - call: insertPos
          args:
            - - 2
              - 5
              - 8
              - 12
            - 1
          expect: 1
        - call: insertPos
          args:
            - - 2
              - 5
              - 8
              - 12
            - 5
          expect: 2
  - id: B-ALG-217
    topic:
      - B2
      - 2-1-2-1
    diff: 2
    scope: 科目B「アルゴリズムとプログラミング」の累積による累乗の計算。同じ数を繰り返し掛けるプログラムのトレースであり、範囲内。
    prereq: 累積変数の初期値、for による定回数の反復
    hard: 累積の初期値が 1 であることと、反復の回数がそのまま指数になることを対応付ける必要がある。
    q: |
      次のプログラムを実行したときの、関数 power(x, n) の戻り値を、解答群の中から選べ。

      関数 power は、x の n 乗を返す。x ＝ 3、n ＝ 4 として power(x, n) を呼び出す。
    code: |
      ○整数型: power(整数型: x, 整数型: n)
        整数型: i, r
        r ← 1
        for (i を 1 から n まで 1 ずつ増やす)
          r ← r × x
        endfor
        return r
    c:
      - '27'
      - '81'
      - '64'
      - '243'
    a: イ
    exp: |
      r は 1 から始まり、3 が 4 回掛けられます。

      1 → 3 → 9 → 27 → 81

      戻り値は 81（3 の 4 乗）です。反復の回数が指数にそのまま対応します。間違えやすいのは、初期値を 0 にしてしまうと全て 0 になってしまう点と、底と指数を取り違える点です。累乗は乗算の繰返しであり、加算の繰返し（3 ＋ 3 ＋ 3 ＋ 3 ＝ 12）とは異なることも確認しておきます。
    why:
      - 3 の 3 乗であり、掛ける回数が 1 回少ない場合の値です。本問では 4 回掛けます。
      - 正解です。3 の 4 乗は 81 です。
      - 底と指数を取り違えた場合の値（4 の 3 乗）です。底は 3、指数は 4 です。
      - 3 の 5 乗であり、掛ける回数が 1 回多い場合の値です。反復は n 回、すなわち 4 回です。
    know: 累乗は、初期値 1 への繰り返しの乗算で表される。初期値が 1 である理由（0 回掛けた状態が 1 になる）と、反復回数と指数の対応が要点である。
    terms:
      - 累積
    verify:
      result:
        call: power
        args:
          - 3
          - 4
        of: return
    sim:
      entry: power
      args:
        - 3
        - 4
  - id: B-ALG-218
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の条件付きの集計。配列の要素のうち、偶数だけを合計するプログラムのトレースであり、範囲内。
    prereq: 剰余による偶数・奇数の判定、条件付きの累積
    hard: 合計に加わる要素と加わらない要素を、剰余の値で切り分ける必要がある。全体の和や奇数の和との取り違えに注意が要る。
    q: |
      次のプログラムを実行したときの、関数 sumEven(a) の戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      関数 sumEven は、配列 a の要素のうち、偶数の合計を返す。a ＝ {3, 8, 5, 12, 7, 20} として sumEven(a) を呼び出す。
    code: |
      ○整数型: sumEven(整数型の配列: a)
        整数型: i, s
        s ← 0
        for (i を 1 から aの要素数 まで 1 ずつ増やす)
          if (a[i] mod 2 ＝ 0)
            s ← s ＋ a[i]
          endif
        endfor
        return s
    c:
      - '32'
      - '40'
      - '15'
      - '55'
    a: イ
    exp: |
      偶数は 8、12、20 の 3 つです。

      8 ＋ 12 ＋ 20 ＝ 40

      戻り値は 40 です。奇数（3、5、7）は、剰余が 1 になるため合計に加わりません。条件付きの集計では、条件を満たす要素だけを拾うことが本質であり、全体の和（55）や奇数の和（15）と混同しないよう、要素ごとに判定の結果を確認しながら追うのが確実です。
    why:
      - 最初の偶数 8 を加え忘れた場合の値（12 ＋ 20）です。位置にかかわらず、偶数であれば合計に含まれます。
      - 正解です。偶数の合計 8 ＋ 12 ＋ 20 ＝ 40 です。
      - 奇数だけを合計した値（3 ＋ 5 ＋ 7）です。条件は偶数であることです。
      - 配列全体の合計です。条件で選別せずに全要素を加えています。
    know: 条件付きの集計では、条件を満たす要素の選び出しが本質である。剰余が 0 かどうかで偶数・奇数を判定する書き方は、頻出の基本形である。
    terms:
      - 剰余
      - 累積
    verify:
      result:
        call: sumEven
        args:
          - - 3
            - 8
            - 5
            - 12
            - 7
            - 20
        of: return
    sim:
      entry: sumEven
      args:
        - - 3
          - 8
          - 5
          - 12
          - 7
          - 20
  - id: B-ALG-219
    topic:
      - B1
      - 2-2-2-1
    diff: 4
    scope: 科目B「アルゴリズムとプログラミング」の整列と空欄補充。挿入ソートのプログラムで、要素を後ろへずらす条件と、ずらした回数を数える文の空欄の組合せを選ぶ問題であり、範囲内。
    prereq: 挿入ソートは、整列済みの部分の後ろから、挿入する要素より大きい要素を 1 つずつ後ろへずらし、空いた位置に要素を置く整列であること
    hard: 空欄が2つ連動しており、ずらす条件（挿入する要素より大きい間だけ）と、ずらした回数の数え方の両方を満たす組合せを選ぶ必要がある。同じ値がある場合に等号を含むかどうかも、回数に影響する。
    q: |
      次のプログラム中の【a】と【b】に入れる正しい答えの組合せを、解答群の中から選べ。ここで、配列の要素番号は 1 から始まり、配列の引数は参照渡しである。

      関数 insShifts は、挿入ソートで配列 a を昇順に整列し、その過程で要素を後ろへずらした回数の合計を返す。
    code: |
      ○整数型: insShifts(整数型の配列: a)
        整数型: i, j, key, cnt
        cnt ← 0
        for (i を 2 から aの要素数 まで 1 ずつ増やす)
          key ← a[i]
          j ← i － 1
          while (【a】)
            a[j ＋ 1] ← a[j]
            cnt ← 【b】
            j ← j － 1
          endwhile
          a[j ＋ 1] ← key
        endfor
        return cnt
    c:
      - a：j ≧ 1 and a[j] ＞ key，b：cnt ＋ j
      - a：j ＞ 1 and a[j] ＞ key，b：cnt ＋ 1
      - a：j ≧ 1 and a[j] ≧ key，b：cnt ＋ 1
      - a：j ≧ 1 and a[j] ＞ key，b：cnt ＋ 1
      - a：j ≧ 1 and a[j] ＜ key，b：cnt ＋ 1
    fills:
      - a: j ≧ 1 and a[j] ＞ key
        b: cnt ＋ j
      - a: j ＞ 1 and a[j] ＞ key
        b: cnt ＋ 1
      - a: j ≧ 1 and a[j] ≧ key
        b: cnt ＋ 1
      - a: j ≧ 1 and a[j] ＞ key
        b: cnt ＋ 1
      - a: j ≧ 1 and a[j] ＜ key
        b: cnt ＋ 1
    a: エ
    exp: |
      挿入ソートは、key より大きい要素を後ろへずらし続けるので、条件は「j ≧ 1 and a[j] ＞ key」です。ずらすたびに回数を 1 増やします。例えば {5, 2, 4, 1} では、2 を挿入するときに 5 を 1 回、4 を挿入するときに 5 を 1 回、1 を挿入するときに 5、4、2 を 3 回ずらし、合計は 5 回になります。等しい要素は、ずらす必要がない（元の順序が保たれる）ため、条件に等号は含めません。
    why:
      - 回数に j の値を加えると、ずらした回数そのものではなく、位置に依存した値になってしまいます。
      - j ＞ 1 では、先頭の要素（j ＝ 1）との比較とずらしができず、先頭より小さい要素を正しく挿入できません。
      - 等号を含むと、key と同じ値の要素までずらしてしまい、回数が多くなります（例えば {2, 1, 2} では、正しくは 1 回のところが 2 回になります）。
      - 正解です。key より大きい要素だけをずらし、ずらした回数を 1 ずつ数えます。
      - 条件の向きが逆であり、より小さい要素をずらすことになって、昇順の整列になりません。
    know: 挿入ソートで要素をずらす回数は、元の並びにおける「順序の逆転の数」と等しくなる。条件に等号を含むかどうかで、同じ値の要素の扱い（順序の安定性）と、ずらす回数が変わる点が要点である。
    terms:
      - 挿入ソート
    verify:
      cases:
        - call: insShifts
          args:
            - - 5
              - 2
              - 4
              - 1
          expect: 5
        - call: insShifts
          args:
            - - 1
              - 2
              - 3
          expect: 0
        - call: insShifts
          args:
            - - 3
              - 2
              - 1
          expect: 3
        - call: insShifts
          args:
            - - 2
              - 1
              - 2
          expect: 1
    sim:
      entry: insShifts
      args:
        - - 5
          - 2
          - 4
          - 1
  - id: B-ALG-220
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の配列の回転。末尾の要素を先頭へ移し、残りの要素を 1 つずつ後ろへずらすプログラムのトレースであり、範囲内。
    prereq: 配列の要素をずらすときは、末尾側から順に動かさないと、値が上書きされて失われること、末尾の値は先に一時変数へ退避しておくこと
    hard: ずらす処理を末尾側から行う理由（先頭側から行うと値が失われる）と、退避した要素の置き場所を含めて、回転後の配列を構成する必要がある。
    q: |
      次のプログラムを実行したときの、戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まり、配列の引数は参照渡しである。

      関数 rotR は、配列 a の要素を右へ 1 つ回転させ（末尾の要素が先頭へ移り、他の要素は 1 つずつ後ろへずれる）、回転した後の a[3] を返す。a ＝ {5, 3, 8, 1, 9, 4} として rotR(a) を呼び出す。
    code: |
      ○整数型: rotR(整数型の配列: a)
        整数型: i, t, n
        n ← aの要素数
        t ← a[n]
        for (i を n から 2 まで 1 ずつ減らす)
          a[i] ← a[i － 1]
        endfor
        a[1] ← t
        return a[3]
    c:
      - '3'
      - '8'
      - '1'
      - '4'
    a: ア
    exp: |
      まず末尾の 4 を t に退避します。次に、末尾側から順に、1 つ前の要素で上書きします。
      - i ＝ 6： a[6] ← a[5] ＝ 9
      - i ＝ 5： a[5] ← a[4] ＝ 1
      - i ＝ 4： a[4] ← a[3] ＝ 8
      - i ＝ 3： a[3] ← a[2] ＝ 3
      - i ＝ 2： a[2] ← a[1] ＝ 5
      最後に a[1] ← t ＝ 4 とし、配列は {4, 5, 3, 8, 1, 9} になります。a[3] は 3 です。
    why:
      - 正解です。右へ 1 つ回転した後の配列は {4, 5, 3, 8, 1, 9} で、a[3] は 3 です。
      - 回転する前の a[3] の値です。戻り値は、回転した後の配列から読みます。
      - 左へ 1 つ回転させた場合の a[3] の値です。本問の回転は、末尾が先頭へ移る右回転です。
      - 回転した後の a[1] の値（末尾から移ってきた要素）です。問われているのは a[3] です。
    know: 配列の回転は、端の要素を退避し、残りの要素をずらしてから、退避した要素を反対の端へ置く処理である。ずらす処理を末尾側から行うことで、値が上書きされて失われない点が要点である。
    terms:
      - 配列
    verify:
      result:
        call: rotR
        args:
          - - 5
            - 3
            - 8
            - 1
            - 9
            - 4
        of: return
    sim:
      entry: rotR
      args:
        - - 5
          - 3
          - 8
          - 1
          - 9
          - 4
  - id: B-ALG-221
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の2次元配列の走査。行列の要素のうち、基準値より大きいものの個数を数えるプログラムのトレースであり、範囲内。
    prereq: 2次元配列の二重ループによる走査、条件による数え上げ
    hard: 行と列の二重ループで全要素が1回ずつ調べられることを確認し、基準値と等しい要素は含まれない（より大きい、という条件）ことを切り分ける必要がある。
    q: |
      次のプログラムを実行したときの、関数 countAbove(m, t) の戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      関数 countAbove は、3 行 3 列の行列 m の要素のうち、t より大きいものの個数を返す。m は 1 行目 {4, 9, 2}、2 行目 {7, 5, 8}、3 行目 {6, 1, 3}、t ＝ 5 として countAbove(m, t) を呼び出す。
    code: |
      ○整数型: countAbove(整数型の2次元配列: m, 整数型: t)
        整数型: i, j, cnt
        cnt ← 0
        for (i を 1 から 3 まで 1 ずつ増やす)
          for (j を 1 から 3 まで 1 ずつ増やす)
            if (m[i][j] ＞ t)
              cnt ← cnt ＋ 1
            endif
          endfor
        endfor
        return cnt
    c:
      - '3'
      - '9'
      - '5'
      - '4'
    a: エ
    exp: |
      5 より大きい要素は、9（1 行目）、7 と 8（2 行目）、6（3 行目）の 4 個です。5 と等しい要素（2 行目に 1 個）は、「より大きい」という条件に含まれません。戻り値は 4 です。行ごとに数えると 1 行目 1 個、2 行目 2 個、3 行目 1 個であり、二重ループが全ての要素を 1 回ずつ調べていることの確認にもなります。
    why:
      - 各行で最大の要素だけを数えた場合の個数（行数と同じ 3）です。全要素が数え上げの対象です。
      - 行列の全要素の個数です。条件で選別せずに数えています。
      - 5 以上の要素を数えた場合の値です。等しい要素は条件に含まれません。
      - 正解です。5 より大きい要素は 4 個です。
    know: 2次元配列の集計は、行と列の二重ループが基本形である。「より大きい」と「以上」の違いのような、境界の条件の読み取りが、数え上げの要点である。
    terms:
      - 2次元配列
    verify:
      result:
        call: countAbove
        args:
          - - - 4
              - 9
              - 2
            - - 7
              - 5
              - 8
            - - 6
              - 1
              - 3
          - 5
        of: return
    sim:
      entry: countAbove
      args:
        - - - 4
            - 9
            - 2
          - - 7
            - 5
            - 8
          - - 6
            - 1
            - 3
        - 5
