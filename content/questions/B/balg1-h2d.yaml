questions:
  - id: B-ALG-222
    topic: [B2, 2-1-2-1]
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の最大値と最小値の探索。配列を 1 回走査して両方の値を保持し、その差を返すトレースであり、範囲内。
    prereq: 最大値と最小値を別々の変数に保持し、要素ごとに両方と比べること
    hard: 最大値だけ、あるいは最小値だけを追う問題と異なり、2 つの値を同時に更新しながら走査を追う必要がある。
    q: |
      次のプログラムを実行したときの、関数 rangeOf(a) の戻り値を、解答群の中から選べ。

      関数 rangeOf は、配列 a の最大値と最小値の差を返す。a ＝ {7, 3, 12, 5, 9, 3} として rangeOf(a) を呼び出す。
    code: |
      ○整数型: rangeOf(整数型の配列: a)
        整数型: i, mx, mn
        mx ← a[1]
        mn ← a[1]
        for (i を 2 から aの要素数 まで 1 ずつ増やす)
          if (a[i] ＞ mx)
            mx ← a[i]
          endif
          if (a[i] ＜ mn)
            mn ← a[i]
          endif
        endfor
        return mx － mn
    c: ['9', '12', '15', '6']
    a: ア
    exp: |
      走査の過程は、次のようになります。

      - 初期値: mx ＝ 7、mn ＝ 7
      - 3: mn が 3 になる
      - 12: mx が 12 になる
      - 5、9: 更新なし
      - 3: 更新なし（mn はすでに 3）

      最後に、mx ＝ 12、mn ＝ 3 であり、戻り値は 12 － 3 ＝ 9 です。
    why:
      - 正解です。最大値 12 と最小値 3 の差は 9 です。
      - 最大値そのものの値です。問われているのは、最小値との差です。
      - 最大値と最小値の和（12 ＋ 3）を計算した値です。求めるのは差です。
      - 2 番目に大きい値 9 と最小値 3 の差です。最大値は 12 です。
    know: 最大値と最小値を同時に追う走査は、初期値を先頭の要素に置くことが要点である。戻り値が「差」であることまで含めて、問いの読み取りが鍵になる。
    terms: [最大値, 最小値]
    verify:
      result: { call: rangeOf, args: [[7, 3, 12, 5, 9, 3]], of: return }
    sim: { entry: rangeOf, args: [[7, 3, 12, 5, 9, 3]] }

  - id: B-ALG-223
    topic: [B2, 2-1-2-1]
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」のフィボナッチ数列。直前の 2 つの値を保持しながら、反復で第 n 項を求めるトレースであり、範囲内。
    prereq: フィボナッチ数列は、各項が直前の 2 つの項の和であること
    hard: 変数の入れ替え（古い値を一時変数に逃がす）を伴う反復を、項の番号とずらさずに追う必要がある。
    q: |
      次のプログラムを実行したときの、関数 fib(7) の戻り値を、解答群の中から選べ。

      関数 fib は、フィボナッチ数列（第 1 項と第 2 項がともに 1）の第 n 項を返す。
    code: |
      ○整数型: fib(整数型: n)
        整数型: a, b, t, i
        a ← 1
        b ← 1
        for (i を 3 から n まで 1 ずつ増やす)
          t ← a ＋ b
          a ← b
          b ← t
        endfor
        return b
    c: ['13', '8', '21', '7']
    a: ア
    exp: |
      数列は 1、1、2、3、5、8、13 と続きます。反復を追うと、次のようになります。

      - i ＝ 3: t ＝ 2、a ＝ 1、b ＝ 2（第 3 項）
      - i ＝ 4: t ＝ 3、a ＝ 2、b ＝ 3（第 4 項）
      - i ＝ 5: t ＝ 5、a ＝ 3、b ＝ 5（第 5 項）
      - i ＝ 6: t ＝ 8、a ＝ 5、b ＝ 8（第 6 項）
      - i ＝ 7: t ＝ 13、a ＝ 8、b ＝ 13（第 7 項）

      戻り値は 13 です。
    why:
      - 正解です。数列は 1、1、2、3、5、8、13 と続き、第 7 項は 13 です。
      - 第 6 項の値です。反復が 1 回分足りていません。
      - 第 8 項の値です。反復が 1 回分多すぎます。
      - 項の番号そのものです。問われているのは、その項の値です。
    know: 反復で数列を求めるプログラムは、「変数が第何項を保持しているか」を対応付けながら追うことが要点である。1 項のずれが誤答の典型である。
    terms: [フィボナッチ数列, 繰返し処理]
    verify:
      result: { call: fib, args: [7], of: return }
    sim: { entry: fib, args: [7] }

  - id: B-ALG-224
    topic: [B2, 2-1-2-1]
    diff: 3
    scope: B2 アルゴリズムのトレース（各桁の 2 乗和の反復）。入れ子のループで桁を取り出しながら値を置き換え、1 に到達するまでの変換の回数を数える問題である。
    prereq: 10 で割った余りで末尾の桁を取り出せること、商で桁を落としていけること、内側のループ 1 回が「各桁の 2 乗和への置き換え」という 1 回の変換に対応すること
    hard: 変換そのものの計算が内側のループになっており、外側の反復と合わせて二重の反復を追う必要がある。途中の値の列を 1 つずつ書き出さないと、変換の回数を数え誤りやすい点が難しい。
    q: |
      次のプログラムを実行したときの、関数 happySteps(19) の戻り値を、解答群の中から選べ。
      関数 happySteps は、値が 1 になるまで、「各桁の数字の 2 乗の和に置き換える」という変換を繰り返し、変換の回数を返す。
    code: |
      ○整数型: happySteps(整数型: n)
        整数型: cnt, m, s, d
        cnt ← 0
        while (n ≠ 1)
          m ← n
          s ← 0
          while (m ＞ 0)
            d ← m mod 10
            s ← s ＋ d × d
            m ← m ÷ 10 の商
          endwhile
          n ← s
          cnt ← cnt ＋ 1
        endwhile
        return cnt
    c: ['4', '3', '5', '82']
    a: ア
    exp: |
      変換を 1 回ずつ追います。

      19 → 1 の 2 乗 ＋ 9 の 2 乗 ＝ 1 ＋ 81 ＝ 82（1 回目）
      82 → 64 ＋ 4 ＝ 68（2 回目）
      68 → 36 ＋ 64 ＝ 100（3 回目）
      100 → 1 ＋ 0 ＋ 0 ＝ 1（4 回目）

      値が 1 になったため繰返しを終え、戻り値は変換の回数の 4 です。内側の繰返しでは、m mod 10 で末尾の桁を取り出し、m ÷ 10 の商で桁を落としながら、2 乗の和 s を組み立てています。
    why:
      - 正解です。変換の列は 19 → 82 → 68 → 100 → 1 で、変換は 4 回行われます。
      - 1 になる直前の変換（100 → 1）を数え落とした場合の回数です。値が 1 になってから繰返しを抜けるため、最後の変換も数えます。
      - 途中に現れる値の個数（開始の 19 を含めた 19、82、68、100、1 の 5 個）です。問われているのは値の個数ではなく、変換の回数です。
      - 最初の変換の結果そのもの（19 の各桁の 2 乗の和）です。問われているのは、1 に到達するまでの変換の回数です。
    know: 各桁の 2 乗和への置き換えを繰り返すと、1 に到達する数（ハッピー数）と、4 を含む循環に入って 1 に到達しない数に分かれる。途中の値の列を書き出して回数を数えることが確実な解法である。
    terms: [ハッピー数]
    verify:
      result: { call: happySteps, args: [19], of: return }
  - id: B-ALG-225
    topic: [B2, 2-1-2-1]
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」のユークリッドの互除法（剰余版）。剰余で数を置き換える反復のトレースであり、範囲内。
    prereq: 剰余版の互除法では、a を b で割った剰余で置き換えていき、剰余が 0 になったときの割る数が最大公約数であること
    hard: 3 つの変数（a、b、一時変数）の値の移り変わりを、順序を誤らずに追う必要がある。引き算版とは、手順の段数が異なる。
    q: |
      次のプログラムを実行したときの、関数 gcdMod(48, 36) の戻り値を、解答群の中から選べ。

      関数 gcdMod は、剰余を使うユークリッドの互除法で最大公約数を返す。
    code: |
      ○整数型: gcdMod(整数型: a, 整数型: b)
        整数型: t
        while (b ≠ 0)
          t ← a mod b
          a ← b
          b ← t
        endwhile
        return a
    c: ['12', '6', '144', '36']
    a: ア
    exp: |
      反復は、次のように進みます。

      - （a, b）＝（48, 36）: t ＝ 48 mod 36 ＝ 12 → （36, 12）
      - （36, 12）: t ＝ 36 mod 12 ＝ 0 → （12, 0）
      - b が 0 になったので終了します。

      戻り値は 12 です。48 と 36 の最大公約数と一致します。
    why:
      - 正解です。剰余を繰り返すと 12 が残ります。
      - 公約数の 1 つですが、最大ではありません。12 は 48 と 36 の両方を割り切ります。
      - 48 と 36 の最小公倍数です。問われているのは最大公約数です。
      - 1 回目の反復の後の a の値です。反復は b が 0 になるまで続きます。
    know: 剰余版の互除法は、「剰余で置き換える」反復であり、終了時点の a が答えである。一時変数を使う値の回し方が、トレースの要点である。
    terms: [ユークリッドの互除法, 最大公約数]
    verify:
      result: { call: gcdMod, args: [48, 36], of: return }
    sim: { entry: gcdMod, args: [48, 36] }

  - id: B-ALG-226
    topic: [B1, 2-2-2-1]
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の挿入ソートの途中状態。先頭から 3 要素までを対象に挿入を終えた時点の、配列全体の出力のトレースであり、範囲内。
    prereq: 挿入ソートは、整列済みの部分の適切な位置に、次の要素を差し込むこと、対象外の要素は元のまま残ること
    hard: 整列が全体には及んでいない途中状態を、完了状態と区別して追う必要がある。差し込みの際の要素のずれも含まれる。
    q: |
      次のプログラムを実行したとき、手続 test が出力する 5 つの値を出力順に並べたものとして、正しい答えを解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      手続 test は、配列の先頭から 3 要素までを挿入ソートの方法で整列し、配列全体を出力する。
    code: |
      ○test()
        整数型の配列: d ← {5, 2, 4, 1, 3}
        整数型: i, j, t
        for (i を 2 から 3 まで 1 ずつ増やす)
          t ← d[i]
          j ← i － 1
          while (j ≧ 1 and d[j] ＞ t)
            d[j ＋ 1] ← d[j]
            j ← j － 1
          endwhile
          d[j ＋ 1] ← t
        endfor
        d[1] を出力する
        d[2] を出力する
        d[3] を出力する
        d[4] を出力する
        d[5] を出力する
    c: ['2 4 5 1 3', '2 5 4 1 3', '1 2 3 4 5', '2 4 5 3 1', '5 2 4 1 3']
    a: ア
    exp: |
      挿入は、次のように進みます。

      - i ＝ 2: t ＝ 2 を先頭に差し込む → {2, 5, 4, 1, 3}
      - i ＝ 3: t ＝ 4 を、2 と 5 の間に差し込む → {2, 4, 5, 1, 3}

      対象は 3 要素までであるため、残りの 1 と 3 は元のまま残ります。出力は「2 4 5 1 3」です。
    why:
      - 正解です。3 要素まで整列し、残りは元のままです。
      - 1 回目の挿入（i ＝ 2）だけで終わらせた場合の並びです。
      - 配列全体の整列が完了した場合の並びです。本問の対象は 3 要素までです。
      - 後半の要素の順序を、元の並びと取り違えた並びです。1 と 3 は元の順序のまま残ります。
      - 挿入を一度も行う前の、元の配列の並びそのままです。本問では 3 要素までの挿入が行われます。
    know: 整列のトレースでは、「どこまでが整列済みか」という範囲の把握が要点である。途中状態の問題は、完了状態との区別が鍵になる。
    terms: [挿入ソート]
    verify:
      result: { call: test, args: [], of: output }
    sim: { entry: test, args: [] }

  - id: B-ALG-227
    topic: [B1, 2-2-2-1]
    diff: 4
    scope: 科目B「アルゴリズムとプログラミング」の整列済み配列の併合（マージ）。2 つの整列済み配列の先頭どうしを比べながら、1 つの配列にまとめていくトレースであり、片方の配列が尽きた後は番兵との比較で処理が続く点まで含む、範囲内。
    prereq: 併合では、2 つの配列の未処理の先頭どうしを比べ、小さい方を取り出して進めること、番兵（十分大きな値）を末尾に置くと、どちらかが尽きた場合の処理を統一できること
    hard: 2 本の添字が独立に進む過程を追う必要がある。出力される後半では、片方の配列が尽きて番兵（999）との比較で進むため、番兵の役割を理解していないと後半の並びを誤る。
    q: |
      次のプログラムを実行したとき、手続 test が出力する 5 つの値を出力順に並べたものとして、正しい答えを解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      手続 test は、昇順に整列された 2 つの配列 x と y を併合し、結果の先頭から 5 つを出力する。各配列の末尾の 999 は、番兵である。
    code: |
      ○test()
        整数型の配列: x ← {3, 5, 8, 999}
        整数型の配列: y ← {1, 4, 999}
        整数型の配列: z ← {5個の0}
        整数型: i, j, k
        i ← 1
        j ← 1
        for (k を 1 から 5 まで 1 ずつ増やす)
          if (x[i] ＜ y[j])
            z[k] ← x[i]
            i ← i ＋ 1
          else
            z[k] ← y[j]
            j ← j ＋ 1
          endif
        endfor
        z[1] を出力する
        z[2] を出力する
        z[3] を出力する
        z[4] を出力する
        z[5] を出力する
    c: ['1 3 4 5 8', '1 3 4 8 5', '3 1 4 5 8', '1 3 4 5 999', '1 4 3 5 8']
    a: ア
    exp: |
      併合は、次のように進みます。

      - x の 3 と y の 1 を比べ、1 を取り出す
      - x の 3 と y の 4 を比べ、3 を取り出す
      - x の 5 と y の 4 を比べ、4 を取り出す（y の実要素はここで尽きる）
      - x の 5 と y の番兵 999 を比べ、5 を取り出す
      - x の 8 と y の番兵 999 を比べ、8 を取り出す

      結果の先頭 5 つは「1 3 4 5 8」です。y が尽きた後も、番兵 999 との比較で同じ形の処理が続くため、x の残りが順に取り出されます。
    why:
      - 正解です。先頭どうしの比較で、小さい順に取り出されます。
      - 4 番目に x の 8 を先に取り出した場合の並びです。x の 5 の方が、8 より小さいです。
      - 先頭で y の 1 より先に x の 3 を取り出した場合の並びです。1 の方が小さいです。
      - y が尽きた後、x の残りではなく番兵の 999 まで結果に含めてしまった場合の並びです。番兵は比較のための値であり、結果には含めません。
      - 2 番目に y の 4 を取り出した場合の並びです。x の 3 の方が、4 より小さいです。
    know: 併合のトレースは、2 本の添字の進み方を、比べるたびに記録することが要点である。番兵は、境界の場合分けをなくす工夫として使われる。
    terms: [マージ, 番兵]
    verify:
      result: { call: test, args: [], of: output }
    sim: { entry: test, args: [] }

  - id: B-ALG-228
    topic: [B1, 2-2-2-1]
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の累積和。各要素に、それまでの要素の合計を積み上げていく変換のトレースであり、範囲内。
    prereq: 累積和では、2 番目以降の要素を「その要素の元の値 ＋ 直前の累積和」で置き換えること
    hard: 置き換えが同じ配列の中で行われるため、使う値が「元の値」か「更新後の値」かを区別しながら追う必要がある。
    q: |
      次のプログラムを実行したとき、手続 test が出力する 5 つの値を出力順に並べたものとして、正しい答えを解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。
    code: |
      ○test()
        整数型の配列: d ← {3, 1, 4, 1, 5}
        整数型: i
        for (i を 2 から dの要素数 まで 1 ずつ増やす)
          d[i] ← d[i] ＋ d[i － 1]
        endfor
        d[1] を出力する
        d[2] を出力する
        d[3] を出力する
        d[4] を出力する
        d[5] を出力する
    c: ['3 4 8 9 14', '3 1 4 1 5', '14 9 8 4 3', '14 14 14 14 14', '4 5 9 10 15']
    a: ア
    exp: |
      変換は、次のように進みます。

      - d[2] ← 1 ＋ 3 ＝ 4
      - d[3] ← 4 ＋ 4 ＝ 8（直前の d[2] は、更新後の 4 です）
      - d[4] ← 1 ＋ 8 ＝ 9
      - d[5] ← 5 ＋ 9 ＝ 14

      配列は {3, 4, 8, 9, 14} となり、出力は「3 4 8 9 14」です。各要素が、先頭からその要素までの合計（累積和）になっています。
    why:
      - 正解です。直前の累積和を積み上げた並びです。
      - 変換を行う前の、元の配列の並びそのままです。本問では、2 番目以降の要素が累積和に置き換わります。
      - 累積和を、末尾から逆順に出力した場合の並びです。
      - 全体の合計 14 を、全ての要素に出力した場合の並びです。各要素は、その位置までの合計です。
      - 先頭の初期値を、元の 3 ではなく 4 として計算を始めた場合の並びです（4、4＋1、5＋4、9＋1、10＋5）。先頭の要素は元の 3 のまま置き換わりません。
    know: 同じ配列の中で値を更新する処理は、「今使う値が更新前か更新後か」を常に意識することが要点である。累積和は、その典型である。
    terms: [累積和]
    verify:
      result: { call: test, args: [], of: output }
    sim: { entry: test, args: [] }

  - id: B-ALG-229
    topic: [B2, 2-1-2-1]
    diff: 4
    scope: 科目B「アルゴリズムとプログラミング」の空欄補充（二分探索）。中央の添字の計算式と、範囲を絞る際の境界の更新の組合せを選ぶ問題であり、範囲内。
    prereq: 二分探索では、中央の添字は範囲の両端の平均であり、要素が探す値より小さい場合は、下限を中央の 1 つ先に進めること
    hard: 中央の計算における演算の優先順位と、境界を中央そのものではなく 1 つ先に進める理由（無限の繰返しを避ける）の両方を切り分ける必要がある。
    q: |
      次のプログラム中の【a】と【b】に入れる正しい答えの組合せを、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      関数 bsearchPos は、昇順に整列された配列 a から key を二分探索し、見つかった位置を返す。見つからなかった場合は 0 を返す。
    code: |
      ○整数型: bsearchPos(整数型の配列: a, 整数型: key)
        整数型: lo, hi, mid
        lo ← 1
        hi ← aの要素数
        while (lo ≦ hi)
          mid ← 【a】
          if (a[mid] ＝ key)
            return mid
          elseif (a[mid] ＜ key)
            lo ← 【b】
          else
            hi ← mid － 1
          endif
        endwhile
        return 0
    c: ['a：(lo ＋ hi) ÷ 2 の商，b：mid ＋ 1', 'a：(lo ＋ hi) ÷ 2 の商，b：mid', 'a：lo ＋ hi ÷ 2 の商，b：mid ＋ 1', 'a：(lo ＋ hi) ÷ 2 の商，b：mid － 1', 'a：(hi － lo) ÷ 2 の商，b：mid ＋ 1']
    fills:
      - { a: '(lo ＋ hi) ÷ 2 の商', b: 'mid ＋ 1' }
      - { a: '(lo ＋ hi) ÷ 2 の商', b: 'mid' }
      - { a: 'lo ＋ hi ÷ 2 の商', b: 'mid ＋ 1' }
      - { a: '(lo ＋ hi) ÷ 2 の商', b: 'mid － 1' }
      - { a: '(hi － lo) ÷ 2 の商', b: 'mid ＋ 1' }
    a: ア
    exp: |
      中央の添字は、範囲の両端 lo と hi の平均であり、【a】は （lo ＋ hi） ÷ 2 の商 です。括弧がないと、hi ÷ 2 が先に計算され、中央になりません。

      a[mid] が key より小さい場合、key は中央より後ろにあるため、下限を中央の 1 つ先に進めます。【b】は mid ＋ 1 です。mid のままでは、範囲が狭まらず、繰返しが終わらなくなる場合があります。
    why:
      - 正解です。中央は両端の平均、下限は中央の 1 つ先への更新です。
      - 下限を mid のままにすると、a[mid] が key より小さい状況が変わらず、繰返しが終わらなくなる場合があります。
      - 括弧がないため、hi ÷ 2 が先に計算され、中央の添字になりません。
      - 下限を mid － 1 にすると、範囲が逆の方向に広がってしまい、正しく絞れません。
      - （hi － lo） ÷ 2 は範囲の幅の半分であり、添字そのものではありません。中央の添字は、lo に幅の半分を加えた位置です。
    know: 二分探索の空欄は、「中央の計算（括弧と平均）」と「境界の更新（調べた要素を範囲から外す）」の 2 点が要点である。更新で 1 つずらす理由は、終了の保証にある。
    terms: [二分探索]
    verify:
      cases:
        - { call: bsearchPos, args: [[4, 9, 15, 21, 30, 42], 21], expect: 4 }
        - { call: bsearchPos, args: [[4, 9, 15, 21, 30, 42], 42], expect: 6 }
        - { call: bsearchPos, args: [[4, 9, 15, 21, 30, 42], 30], expect: 5 }
        - { call: bsearchPos, args: [[4, 9, 15, 21, 30, 42], 10], expect: 0 }
