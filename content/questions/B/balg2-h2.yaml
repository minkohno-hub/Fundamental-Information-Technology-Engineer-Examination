  # ===== 再帰・文字列と配列のパターン =====
  - id: B-ALG-301
    topic: [B1, 2-2-2-1]
    diff: 2
    scope: 科目B「プログラミングの基本要素」の再帰呼出し。引数に累積値を持たせる末尾再帰の呼出しの連鎖を追い、戻り値を求める問題で、範囲内。
    prereq: 再帰呼出しの引数の受け渡し、基底条件（n ＝ 0）で再帰が止まること
    q: |
      次のプログラムを実行したとき，関数 sumUp(4, 0) の戻り値を，解答群の中から選べ。
    code: |
      ○整数型: sumUp(整数型: n, 整数型: acc)
        if (n = 0)
          return acc
        endif
        return sumUp(n − 1, acc ＋ n)
    c: ['4', '9', '10', '24']
    a: ウ
    exp: |
      引数 acc に、処理した数の合計を累積しながら再帰します。呼出しの連鎖を追います。
      - sumUp(4, 0) → sumUp(3, 4)
      - sumUp(3, 4) → sumUp(2, 7)
      - sumUp(2, 7) → sumUp(1, 9)
      - sumUp(1, 9) → sumUp(0, 10)
      - n ＝ 0 になったので、acc ＝ 10 を返します。
      戻り値は 1 から 4 までの合計 10 です。
    why:
      - 最初に与えた n の値そのものです。戻り値は累積された合計であり、n ではありません。
      - n ＝ 1 の時点の acc の値です。再帰は n ＝ 0 まで進み、最後に 1 が加わります。
      - 正解です。呼出しごとに acc へ n を加えていき、0 ＋ 4 ＋ 3 ＋ 2 ＋ 1 ＝ 10 になります。
      - 4 の階乗（4 × 3 × 2 × 1）の値です。この関数は乗算ではなく加算を累積しています。
    know: 累積値の引数を持つ再帰は、ループの「合計を入れる変数」を引数に変えた形とみることができる。再帰を追うときは、呼出しごとの引数の組を書き並べると間違いにくい。
    terms: [再帰, 繰返し処理]
    verify:
      result: { call: sumUp, args: [4, 0], of: return }
    sim: { entry: sumUp, args: [4, 0] }

  - id: B-ALG-302
    topic: [B2, 2-1-2-1]
    diff: 3
    scope: 科目B「データ構造及びアルゴリズム」の配列の探索。部分パターンが重なり合って現れる場合も含めて出現回数を数える二重ループのトレースで、範囲内。
    prereq: 二重ループによる部分一致の判定、開始位置を 1 つずつずらす走査の仕方
    hard: パターンの出現が重なり合う（一致した直後の位置から次の一致が始まる）ケースを含めて数える必要があり、一致後に開始位置を大きく飛ばす誤読と区別する。
    q: |
      次のプログラムを実行したとき，関数 countPat({1, 2, 1, 2, 1, 1, 2, 1}, {1, 2, 1}) の戻り値を，解答群の中から選べ。
    code: |
      ○整数型: countPat(整数型の配列: a, 整数型の配列: p)
        整数型: i, j, cnt
        論理型: ok
        cnt ← 0
        for (i を 1 から aの要素数 − pの要素数 ＋ 1 まで 1 ずつ増やす)
          ok ← true
          for (j を 1 から pの要素数 まで 1 ずつ増やす)
            if (a[i ＋ j − 1] ≠ p[j])
              ok ← false
            endif
          endfor
          if (ok = true)
            cnt ← cnt ＋ 1
          endif
        endfor
        return cnt
    c: ['2', '3', '4', '6']
    a: イ
    exp: |
      開始位置 i を 1 から 6（8 − 3 ＋ 1）までずらしながら、3 要素ずつ照合します。
      | i | 照合する部分 | 一致 |
      | --- | --- | --- |
      | 1 | 1, 2, 1 | 一致 |
      | 2 | 2, 1, 2 | 不一致 |
      | 3 | 1, 2, 1 | 一致 |
      | 4 | 2, 1, 1 | 不一致 |
      | 5 | 1, 1, 2 | 不一致 |
      | 6 | 1, 2, 1 | 一致 |
      一致は i ＝ 1、3、6 の 3 回です。i ＝ 1 と i ＝ 3 の出現は要素を共有して重なっていますが、このプログラムは開始位置を 1 つずつしか進めないため、両方を数えます。
    why:
      - 重なり合う出現のうち、後の 1 つを見落とした値です。i ＝ 1 と i ＝ 3 は要素を共有しますが、別の開始位置なので両方数えます。
      - 正解です。開始位置 1、3、6 の 3 か所でパターンと一致します。
      - 先頭の要素が 1 である開始位置の数（1、3、5、6）を数えた値です。3 要素すべての一致が必要です。
      - 開始位置の総数（6）そのものです。照合に成功した回数ではありません。
    know: パターンの出現回数を数えるときは、重なりを許すかどうかで結果が変わる。一致した後に開始位置を 1 つだけ進める方法では、重なり合う出現も全て数えられる。
    terms: [線形探索法, 二重ループ]
    verify:
      result: { call: countPat, args: [[1, 2, 1, 2, 1, 1, 2, 1], [1, 2, 1]], of: return }
    sim: { entry: countPat, args: [[1, 2, 1, 2, 1, 1, 2, 1], [1, 2, 1]] }

  - id: B-ALG-303
    topic: [B2, 2-1-2-1]
    diff: 3
    scope: 科目B「データ構造及びアルゴリズム」の整列済み配列の併合（マージ）。2 つの配列の先頭同士を比べながら取り出す処理のトレースで、範囲内。
    prereq: 併合の手順（小さいほうの先頭を取り出し、片方が尽きたら残りをそのまま移す）
    hard: 片方の配列が先に尽きた後の処理（残りの要素がそのまま後ろに付く）を、条件式の短絡評価と合わせて正しく追う必要がある。
    q: |
      次のプログラムを実行したとき，関数 merge({1, 4, 6, 8}, {2, 3, 7}) の戻り値を，解答群の中から選べ。ここで，論理演算 or は，左側の式が true のときは右側の式を評価しない。
    code: |
      ○整数型の配列: merge(整数型の配列: a, 整数型の配列: b)
        整数型: i, j, k, m
        m ← aの要素数 ＋ bの要素数
        整数型の配列: c ← {m個の0}
        i ← 1
        j ← 1
        for (k を 1 から m まで 1 ずつ増やす)
          if (j ＞ bの要素数 or (i ≦ aの要素数 and a[i] ＜ b[j]))
            c[k] ← a[i]
            i ← i ＋ 1
          else
            c[k] ← b[j]
            j ← j ＋ 1
          endif
        endfor
        return c
    c:
      - '{1, 2, 3, 4, 7, 6, 8}'
      - '{1, 2, 3, 4, 6, 7}'
      - '{1, 2, 3, 4, 6, 7, 8}'
      - '{1, 4, 6, 8, 2, 3, 7}'
    a: ウ
    exp: |
      両配列の先頭同士を比べ、小さいほうを c へ移します。
      | k | 比較 | c[k] |
      | --- | --- | --- |
      | 1 | a の 1 と b の 2 | 1 |
      | 2 | a の 4 と b の 2 | 2 |
      | 3 | a の 4 と b の 3 | 3 |
      | 4 | a の 4 と b の 7 | 4 |
      | 5 | a の 6 と b の 7 | 6 |
      | 6 | a の 8 と b の 7 | 7 |
      | 7 | b は尽きた | 8 |
      最後に b が尽きるため、a の残り 8 がそのまま移され、{1, 2, 3, 4, 6, 7, 8} になります。
    why:
      - 後半の 6 と 7 の順序が入れ替わった配列です。k ＝ 5 では a の 6 と b の 7 を比べて 6 が先に移ります。
      - 要素が 6 個しかなく、a の最後の 8 が欠けた配列です。c の要素数は 2 つの配列の合計 7 個です。
      - 正解です。先頭同士の比較を繰り返し、最後は b が尽きて a の残りが付きます。
      - 併合ではなく、a の後ろに b をそのまま連結した配列です。大小の比較による取り出しが行われていません。
    know: 併合は、整列済みの 2 つの配列の先頭同士の比較だけで全体の整列済み配列が得られる処理で、マージソートの基本部品でもある。片方が尽きたら、残りは比較なしにそのまま移せる。
    terms: [マージ, マージソート]
    verify:
      result: { call: merge, args: [[1, 4, 6, 8], [2, 3, 7]], of: return }
    sim: { entry: merge, args: [[1, 4, 6, 8], [2, 3, 7]] }

  - id: B-ALG-304
    topic: [B2, 2-1-2-1]
    diff: 2
    scope: 科目B「データ構造及びアルゴリズム」の配列の走査。2 つの配列に共通する要素を、重複の扱いを仕様どおりに数える二重ループのトレースで、範囲内。
    prereq: 二重ループによる要素の照合、内側のループで見つけた時点で次へ進む制御
    q: |
      次のプログラムを実行したとき，関数 countCommon({3, 1, 4, 1, 5}, {1, 4, 9}) の戻り値を，解答群の中から選べ。
    code: |
      ○整数型: countCommon(整数型の配列: a, 整数型の配列: b)
        整数型: i, j, cnt
        論理型: found
        cnt ← 0
        for (i を 1 から aの要素数 まで 1 ずつ増やす)
          found ← false
          for (j を 1 から bの要素数 まで 1 ずつ増やす)
            if (a[i] = b[j])
              found ← true
            endif
          endfor
          if (found = true)
            cnt ← cnt ＋ 1
          endif
        endfor
        return cnt
    c: ['2', '5', '4', '3']
    a: エ
    exp: |
      a の要素を 1 つずつ、b の中に存在するか調べます。
      | a[i] | b にあるか | cnt |
      | --- | --- | --- |
      | 3 | ない | 0 |
      | 1 | ある | 1 |
      | 4 | ある | 2 |
      | 1 | ある | 3 |
      | 5 | ない | 3 |
      a に 1 が 2 回現れるため、その都度数えられ、戻り値は 3 です。このプログラムは「a の要素のうち、b に存在するものの個数」を数えており、重複を除いた種類数ではありません。
    why:
      - 共通する値の種類の数（1 と 4）です。a の重複も含めて数えるため、この値にはなりません。
      - a の要素数そのものです。b に存在しない要素（3 と 5）まで数えています。
      - found を a の要素ごとに初期化し忘れた場合の値です。i ＝ 2 で true になった後も true のままになり、b に存在しない 5（i ＝ 5）でも数えてしまいます。
      - 正解です。a の 1、4、1 の 3 つが b に存在し、それぞれ数えられます。
    know: 「共通要素の個数」と「共通する値の種類数」は、重複のあるデータでは結果が異なる。どちらの意味で数えるかはプログラムの構造（外側ループが a の要素ごとに 1 回数える）から読み取る。
    terms: [二重ループ, 線形探索法]
    verify:
      result: { call: countCommon, args: [[3, 1, 4, 1, 5], [1, 4, 9]], of: return }
    sim: { entry: countCommon, args: [[3, 1, 4, 1, 5], [1, 4, 9]] }

  # ===== ハッシュ・スタック・整列・リスト =====
  - id: B-ALG-305
    topic: [B2, 2-2-2-1]
    diff: 3
    scope: 科目B「データ構造及びアルゴリズム」のハッシュ表。ハッシュ値が衝突したときに次の空き位置を探す線形探査法で、キーの格納位置を追う問題で、範囲内。
    prereq: ハッシュ関数 h(k) ＝ k mod 表の大きさ、衝突時に後続の位置を順に探す線形探査の手順
    hard: 5 個のキーを順に挿入し、3 回の衝突で探査が積み重なる様子を、表の状態を更新しながら追う必要がある。
    q: |
      大きさ 7 のハッシュ表（位置は 0〜6）に、ハッシュ関数 h(k) ＝ k mod 7 と線形探査法（衝突したら次の位置、6 の次は 0、を順に探す）を用いて、キー 10、17、8、24、15 をこの順に格納する。キー 24 が格納される位置はどれか。
    c: ['3', '5', '4', '6']
    a: イ
    exp: |
      挿入のたびに表の状態を追います。
      | キー | h(k) | 探査の経過 | 格納位置 |
      | --- | --- | --- | --- |
      | 10 | 3 | 空いている | 3 |
      | 17 | 3 | 3 は使用中 → 4 | 4 |
      | 8 | 1 | 空いている | 1 |
      | 24 | 3 | 3、4 は使用中 → 5 | 5 |
      | 15 | 1 | 1 は使用中 → 2 | 2 |
      キー 24 は、ハッシュ値 3 の位置と次の 4 がどちらも埋まっているため、位置 5 に格納されます。
    why:
      - ハッシュ値そのもの（24 mod 7）です。その位置はキー 10 が既に使っており、衝突の解決が必要です。
      - 正解です。位置 3 と 4 が使用中のため、線形探査で位置 5 に格納されます。
      - キー 17 が格納された位置です。キー 24 の探査は、17 の後ろの位置まで進みます。
      - 探査をもう 1 つ先まで進めた値です。位置 5 は空いているので、そこで止まります。
    know: 線形探査法では、衝突したキーが連続した塊（クラスタ）を作り、後続の挿入や探索がその分だけ長くなる。表が満杯に近づくほど、この偏りの影響が大きくなる。
    terms: [ハッシュ法, 線形探査法]
    verify:
      manual: 5 個のキーの挿入を順に追跡した。h(10)＝3、h(17)＝3→4、h(8)＝1、h(24)＝3→4→5、h(15)＝1→2 となり、キー24の格納位置は5であることを確認した。

  - id: B-ALG-306
    topic: [B2, 2-1-2-1]
    diff: 3
    scope: 科目B「データ構造及びアルゴリズム」のスタックの応用。逆ポーランド記法で書かれた式を、スタックの push と pop で評価する過程のトレースで、範囲内。
    prereq: スタックの後入れ先出し、逆ポーランド記法では演算子が来たら直前の 2 つの値を取り出して計算すること
    hard: 演算のたびにスタックの中身が入れ替わる様子を追い、引算では取り出す順序（後の値が右側）まで正しく扱う必要がある。
    q: |
      逆ポーランド記法で書かれた式「6 2 3 ＋ × 4 −」を、スタックを使って左から順に評価する。数値はスタックに push し、演算子が来たらスタックから 2 つの値を pop して計算し、結果を push する（− の計算では、先に push された値を左側、後に push された値を右側とする）。評価が終わったときにスタックに残る値はどれか。
    c: ['26', '34', '10', '24']
    a: ア
    exp: |
      スタックの変化を追います（左が底、右が頂上）。
      | 読んだ要素 | 操作 | スタック |
      | --- | --- | --- |
      | 6 | push | 6 |
      | 2 | push | 6, 2 |
      | 3 | push | 6, 2, 3 |
      | ＋ | 2 ＋ 3 ＝ 5 を push | 6, 5 |
      | × | 6 × 5 ＝ 30 を push | 30 |
      | 4 | push | 30, 4 |
      | − | 30 − 4 ＝ 26 を push | 26 |
      最後に残る値は 26 です。通常の記法で書くと 6 × （2 ＋ 3） − 4 に当たります。
    why:
      - 正解です。2 ＋ 3 を先に計算し、6 倍してから 4 を引いた値です。
      - 最後の演算を引算ではなく加算と取り違えた値（30 ＋ 4）です。
      - 6 と 4 を先に処理して（6 − 4） × 5 としたような値です。演算は式の現れた順に行います。
      - 通常の記法の優先順位で読み替えて 6 × 2 ＋ 3 × 4 と計算した値です。逆ポーランド記法には優先順位の読み替えは不要です。
    know: 逆ポーランド記法は、演算子を被演算子の後ろに置くことで括弧なしに計算順序を表す記法で、スタックで左から機械的に評価できる。コンパイラや電卓の内部処理に応用される。
    terms: [逆ポーランド記法, スタック]
    verify:
      manual: スタックの遷移を全要素について追跡し、＋ で 5、× で 30、− で 26 となることを確認した。誤答は、最後の演算の取り違え（34）、処理順の誤り（10）、通常記法への読み替え（24）に対応する。

  - id: B-ALG-307
    topic: [B2, 2-2-2-1]
    diff: 3
    scope: 科目B「データ構造及びアルゴリズム」のバブルソート。隣接交換を繰り返す外側のループが 2 回終わった時点の配列の状態を追う問題で、範囲内。
    prereq: バブルソートの 1 回の走査（先頭から隣同士を比べて大きいほうを後ろへ送る）の動き
    hard: 2 回の走査のそれぞれで、交換が起きる位置と起きない位置を、配列の状態を更新しながら最後まで追う必要がある。
    q: |
      次のプログラムは、配列を昇順に整列するバブルソートである。関数 bubble2({5, 2, 4, 6, 1, 3}) を実行したときの戻り値を、解答群の中から選べ。
    code: |
      ○整数型の配列: bubble2(整数型の配列: a)
        整数型: i, j, tmp
        for (i を 1 から 2 まで 1 ずつ増やす)
          for (j を 1 から aの要素数 − 1 まで 1 ずつ増やす)
            if (a[j] ＞ a[j ＋ 1])
              tmp ← a[j]
              a[j] ← a[j ＋ 1]
              a[j ＋ 1] ← tmp
            endif
          endfor
        endfor
        return a
    c:
      - '{2, 4, 5, 1, 3, 6}'
      - '{1, 2, 3, 4, 5, 6}'
      - '{2, 4, 1, 3, 5, 6}'
      - '{2, 4, 1, 5, 3, 6}'
    a: ウ
    exp: |
      走査ごとに配列を追います。
      - 1 回目の走査： 5 と 2、5 と 4、6 と 1、6 と 3 が交換され、{2, 4, 5, 1, 3, 6} になります。最大の 6 が末尾に届きます。
      - 2 回目の走査： 2 と 4、4 と 5 は交換なし、5 と 1、5 と 3 が交換され、{2, 4, 1, 3, 5, 6} になります。
      外側のループは 2 回で終わるため、この時点で処理は終了し、まだ完全には整列していません（先頭側に 4、1、3 の順序の乱れが残っています）。
    why:
      - 1 回目の走査が終わった時点の状態です。外側のループは 2 回実行されます。
      - 完全に整列した状態です。このプログラムの走査は 2 回までで、最後まで整列しきる前に終了します。
      - 正解です。2 回目の走査で 5 が 1 と 3 を追い越し、{2, 4, 1, 3, 5, 6} になります。
      - 2 回目の走査で、5 と 3 の交換が漏れた状態です。5 は 1 と交換した後、続けて 3 とも比較されます。
    know: バブルソートの 1 回の走査では、未整列部分の最大値がその部分の末尾に確定する。走査回数を制限すると途中状態になるため、「何回の走査で止めるか」が出力に直接影響する。
    terms: [バブルソート, 交換]
    verify:
      result: { call: bubble2, args: [[5, 2, 4, 6, 1, 3]], of: return }
    sim: { entry: bubble2, args: [[5, 2, 4, 6, 1, 3]] }

  - id: B-ALG-308
    topic: [B2, 2-1-2-1]
    diff: 4
    scope: 科目B「データ構造及びアルゴリズム」の単方向リスト。ポインタのつなぎ替えによる要素の削除と挿入を、ノード表からたどって結果の並びを求める問題で、範囲内。
    prereq: 単方向リストでは「次のノード」へのポインタをたどって走査すること、削除と挿入はポインタのつなぎ替えで行うこと
    hard: 物理的な格納順（ノード番号の順）と、ポインタでたどる論理的な並びが異なる表を読み替え、削除と挿入の 2 操作を順に適用して最終的な並びを導く必要がある。
    q: |
      単方向リストが次のノード表で表されている。先頭（ヘッド）はノード 1 である。

      | ノード | データ | 次のノード |
      | --- | --- | --- |
      | 1 | A | 3 |
      | 2 | B | 5 |
      | 3 | C | 2 |
      | 4 | D | なし |
      | 5 | E | 4 |

      このリストからデータ C のノードを削除し、続いてデータ F の新しいノードをデータ E のノードの直後に挿入した。先頭からたどったときのデータの並びはどれか。
    c:
      - 'A, C, B, E, F, D'
      - 'A, B, E, F, D'
      - 'A, B, F, E, D'
      - 'A, B, E, D, F'
    a: イ
    exp: |
      まずポインタをたどると、元の並びは 1（A）→ 3（C）→ 2（B）→ 5（E）→ 4（D）です。ノード番号の順とは異なる点に注意します。
      - C の削除： C の前任である A の「次のノード」を、C の次の B へつなぎ替えます。並びは A、B、E、D になります。
      - F の挿入： E の「次のノード」を新しい F にし、F の「次のノード」を D にします。
      最終的な並びは A、B、E、F、D です。削除も挿入も、要素を移動させるのではなく、ポインタを数か所つなぎ替えるだけで実現できます。
    why:
      - C が残ったまま F だけを挿入した並びです。削除が反映されていません。
      - 正解です。元の並び A、C、B、E、D から C を取り除き、E の直後に F を入れています。
      - F の位置が E の直前になっています。挿入は E の「直後」であり、E と D の間に入ります。
      - F が末尾に追加された並びです。挿入位置は末尾ではなく、E の直後です。
    know: リスト構造では、要素の物理的な格納順とポインタでたどる論理的な順序は別物である。削除と挿入は、前任ノードのポインタのつなぎ替えで実現でき、配列のように要素をずらす必要がない。
    terms: [連結リスト, ポインタ]
    verify:
      manual: ノード表をヘッドからたどって元の並び A、C、B、E、D を確認し、C の削除（A の次を B へ）と F の挿入（E の次を F、F の次を D）を適用した結果が A、B、E、F、D になることを確認した。
