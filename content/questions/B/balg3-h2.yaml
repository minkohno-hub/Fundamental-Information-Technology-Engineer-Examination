category: B-ALG
subject: B
depth: deep
batch: H2
questions:
  # ===== 関数間の値の受け渡し =====
  - id: B-ALG-401
    topic: [B2, 2-3-1-6]
    diff: 2
    scope: 科目B 「プログラムの処理の基本要素」の手続・関数の呼出し（シラバス 2-3-1-6 手続，関数）。引数が値渡しか参照渡しかを問題文で明示するので，実行の追跡だけで解答できる。
    prereq: 引数・戻り値・局所変数の意味，配列の要素の更新
    hard: 基本型の引数と配列の引数の扱いの違いを同時に追跡し，戻り値の計算にその更新結果が使われる点を読み取る。
    q: |
      次のプログラムを実行したとき，手続 test が出力する 3 つの値を出力順に並べたものとして，正しい答えを解答群の中から選べ。ここで，配列の要素番号は 1 から始まる。

      関数の引数について，整数型などの基本型の引数は値渡し（呼び出し側の変数の値が仮引数にコピーされる）であり，配列の引数は参照渡し（呼び出し側の配列そのものを仮引数が指す）である。
    code: |
      ○整数型: update(整数型: x, 整数型の配列: arr)
        x ← x ＋ 10
        arr[1] ← arr[1] ＋ x
        return arr[1] ＋ x

      ○test()
        整数型: n ← 5
        整数型の配列: d ← {1, 2, 3}
        整数型: r
        r ← update(n, d)
        n を出力する
        d[1] を出力する
        r を出力する
    c: ['5 16 31', '15 16 31', '5 1 16', '15 1 16', '5 16 21']
    a: ア
    exp: |
      update(n, d) が呼ばれると，基本型の x には n の値 5 がコピーされ，配列 arr は d そのものを指します。実行の様子は次のとおりです。

      | 実行する文 | x | arr[1] | 戻り値の計算 |
      | --- | --- | --- | --- |
      | 呼出し直後 | 5 | 1 | |
      | x ← x ＋ 10 | 15 | 1 | |
      | arr[1] ← arr[1] ＋ x | 15 | 16 | |
      | return arr[1] ＋ x | 15 | 16 | 16 ＋ 15 ＝ 31 |

      x の更新は仮引数だけに及ぶので呼び出し側の n は 5 のままです。一方 arr[1] の更新は d[1] そのものの更新なので d[1] は 16 になります。r には戻り値 31 が入ります。出力は 5，16，31 の順です。
    why:
      - 正解です。n は値渡しなので 5 のまま，d[1] は参照渡しなので 16，戻り値は 16 ＋ 15 ＝ 31 です。
      - 基本型の引数 x の変更が呼び出し側の n に伝わると誤解した場合の結果です。x は値のコピーなので n は 5 のままです。
      - 配列 arr が d のコピーだと誤解した場合の結果です。配列は参照渡しなので d[1] は 16 に変わり，戻り値も 31 になります。
      - 基本型を参照渡し，配列を値渡しと取り違えた場合の結果です。実際は逆で，n は 5，d[1] は 16 です。
      - 戻り値の計算で x を更新前の 5 のまま使った場合の結果です。return の時点で x は 15 なので 16 ＋ 15 ＝ 31 になります。
    know: 科目Bの擬似言語では，基本型は値渡し，配列は参照渡しとして扱う問題が多い。呼出し先で配列を書き換えると呼出し元にも反映される（副作用）ので，元の値を残したいときは呼出し前に複製する。
    terms: [引数, 戻り値, 値渡し, 参照渡し, 局所変数]
    verify:
      result: { call: test, args: [], of: output }
    sim: { entry: test, args: [] }

  - id: B-ALG-402
    topic: [B2, 2-3-1-6, 2-1-2-1]
    diff: 3
    scope: 科目B 「プログラムの処理の基本要素」の手続・関数の呼出し・配列・繰返し処理（シラバス 2-3-1-6，2-1-2-1）。大域変数・配列の参照渡し・戻り値の扱いは問題文に明記し，追跡だけで解ける。
    prereq: 大域変数，配列の参照渡し，for 文の追跡
    hard: 呼出しごとに範囲が変わる繰返しで配列が更新され続け，戻り値の合計と大域変数の回数と最終的な配列の 3 つを同時に追う必要がある。
    q: |
      次のプログラムを実行したとき，手続 test が出力する値を出力順に並べたものとして，正しい答えを解答群の中から選べ。ここで，配列の要素番号は 1 から始まり，配列の引数は参照渡しである。

      関数 rotate は，配列 a の先頭から n 個の要素を 1 つずつ前に詰め，元の先頭の値を n 番目に入れる（左循環）。戻り値は元の先頭の値である。大域変数 calls は rotate の呼出し回数を数える。手続 test は，s，calls，d の全要素の順に，値を空白区切りで 1 行ずつ出力する。
    code: |
      大域: 整数型: calls ← 0

      ○整数型: rotate(整数型の配列: a, 整数型: n)
        整数型: i, first
        calls ← calls ＋ 1
        first ← a[1]
        for (i を 1 から n － 1 まで 1 ずつ増やす)
          a[i] ← a[i ＋ 1]
        endfor
        a[n] ← first
        return first

      ○test()
        整数型の配列: d ← {4, 7, 1, 9}
        整数型: s ← 0
        整数型: k
        for (k を 1 から 3 まで 1 ずつ増やす)
          s ← s ＋ rotate(d, k ＋ 1)
        endfor
        s を出力する
        calls を出力する
        dの全要素の値を要素番号の順に空白区切りで出力する
    c: ['15 3 1 7 9 4', '15 3 9 1 7 4', '15 3 4 1 7 9', '15 4 1 7 9 4', '12 3 4 7 1 9']
    a: ア
    exp: |
      k が 1，2，3 のとき rotate は n ＝ 2，3，4 で呼ばれます。呼出しのたびに d が書き換わり，次の呼出しは書き換え後の d に対して行われる点に注意します。

      | k | n | first（戻り値） | 呼出し後の d | s |
      | --- | --- | --- | --- | --- |
      | （開始） | | | 4 7 1 9 | 0 |
      | 1 | 2 | 4 | 7 4 1 9 | 4 |
      | 2 | 3 | 7 | 4 1 7 9 | 11 |
      | 3 | 4 | 4 | 1 7 9 4 | 15 |

      calls は 3 回の呼出しで 3 です。出力は s ＝ 15，calls ＝ 3，d ＝ 1 7 9 4 の順になります。
    why:
      - 正解です。s は 4 ＋ 7 ＋ 4 ＝ 15，calls は 3，d は 3 回の左循環の結果 1 7 9 4 になります。
      - 左循環を右循環（末尾の要素を先頭に移す操作）と取り違えた場合の結果です。rotate は先頭の値を n 番目に移すので d は 1 7 9 4 になります。
      - 繰返しの範囲を n ＝ k（1，2，3）と読み違えた場合の結果です。rotate には k ＋ 1 を渡すので n は 2，3，4 です。
      - calls を k の最大値 3 に 1 を足した 4 と数えた誤りです。呼出しは k ＝ 1 から 3 まで 3 回です。
      - 配列 a を d のコピーと誤解した場合の結果です。配列は参照渡しなので d は書き換わり，2 回目以降の戻り値も更新後の先頭になります。
    know: 大域変数は関数をまたいで値が残るので，呼出し回数の集計などに使われる。配列を参照渡しで書き換える関数は，呼び出すたびに引数の内容が変わるため，連続呼出しでは直前の状態を追跡する。
    terms: [大域変数, 参照渡し, 戻り値, 配列, 副作用]
    verify:
      result: { call: test, args: [], of: output }
    sim: { entry: test, args: [] }

  - id: B-ALG-403
    topic: [B2, 2-3-1-6]
    diff: 3
    scope: 科目B 「プログラムの処理の基本要素」の変数・手続・関数の呼出し（シラバス 2-3-1-6 手続，関数。局所変数，大域変数）。同名の局所変数が大域変数より優先される規則は問題文に明記する。
    prereq: 大域変数と局所変数の有効範囲，関数の戻り値
    hard: 同じ名前の変数が大域と局所に存在し，どの文がどちらを更新するかを関数ごとに見分けて 4 つの値を追跡する。
    q: |
      次のプログラムを実行したとき，手続 test が出力する 4 つの値を出力順に並べたものとして，正しい答えを解答群の中から選べ。

      関数の中で宣言した変数は局所変数であり，大域変数と同じ名前の局所変数を宣言した関数の中では，その名前は局所変数を指す。宣言されていない名前は大域変数を指す。
    code: |
      大域: 整数型: total ← 0

      ○整数型: f(整数型: n)
        整数型: total ← 0
        整数型: i
        for (i を 1 から n まで 1 ずつ増やす)
          total ← total ＋ i
        endfor
        return total

      ○整数型: g(整数型: n)
        整数型: i
        for (i を 1 から n まで 1 ずつ増やす)
          total ← total ＋ i
        endfor
        return total

      ○test()
        整数型: a, b, c
        a ← f(4)
        b ← g(4)
        c ← g(3)
        a を出力する
        b を出力する
        c を出力する
        total を出力する
    c: ['10 10 16 16', '10 20 26 26', '10 10 6 6', '10 10 16 0', '10 10 6 16']
    a: ア
    exp: |
      f は局所変数 total を宣言しているので，f の中の total の加算は大域変数に影響しません。g は total を宣言していないので大域変数 total を更新します。

      | 呼出し | 更新される total | 戻り値 | 大域 total |
      | --- | --- | --- | --- |
      | （開始） | | | 0 |
      | f(4) | f の局所変数（1＋2＋3＋4） | 10 | 0 |
      | g(4) | 大域変数 0 ＋ 10 | 10 | 10 |
      | g(3) | 大域変数 10 ＋ 6 | 16 | 16 |

      a，b，c は 10，10，16 で，最後に出力される大域変数 total は 16 です。
    why:
      - 正解です。f は局所変数だけを更新するので大域は 0 のまま，g の 2 回の呼出しで大域変数が 10，16 と累積します。
      - f も大域変数を更新すると誤解した場合の結果です。f は局所変数 total を宣言しているので大域変数は変わりません。
      - g の呼出しのたびに total が 0 に戻ると誤解した場合の結果です。g は局所変数を持たないので大域変数が累積します。
      - 大域変数 total は g の中で更新されるので，最後に 0 のままにはなりません。局所変数の影響を大域まで広げた誤りです。
      - 戻り値は累積後の total なので g(3) は 6 ではなく 16 です。大域変数だけ累積して戻り値は今回分だけと考えた誤りです。
    know: 大域変数と同名の局所変数は大域変数を隠す。意図せず同名にすると更新が大域に届かないバグになるので，大域変数の更新が目的なら局所変数を宣言してはならない。
    terms: [大域変数, 局所変数, 戻り値, 変数の有効範囲]
    verify:
      result: { call: test, args: [], of: output }
    sim: { entry: test, args: [] }

  - id: B-ALG-404
    topic: [B1, 2-2-2-1, 2-3-1-5]
    diff: 2
    scope: 科目B 「プログラミング全般」の既存プログラムの解読・修正（シラバス 2-3-1-5 制御構造）。比較演算子の選択による同値データの扱いを問題文の仕様から決める。
    prereq: 最大値探索，比較演算（大小と等号の違い）
    hard: 同じ最大値が複数あるときの位置の扱いが比較演算子 1 つで決まることを，テストデータで確かめて判断する。
    q: |
      次のプログラム中の【a】に入れる正しい答えを，解答群の中から選べ。ここで，配列の要素番号は 1 から始まる。

      関数 maxPos は，要素数が 1 以上の整数型の配列 a について，最大値をもつ要素の添字を返す。最大値をもつ要素が複数あるときは，最も小さい添字を返す。
    code: |
      ○整数型: maxPos(整数型の配列: a)
        整数型: i, p
        p ← 1
        for (i を 2 から aの要素数 まで 1 ずつ増やす)
          if (【a】)
            p ← i
          endif
        endfor
        return p
    c: ['a[i] ＞ a[p]', 'a[i] ≧ a[p]', 'a[i] ＞ a[i － 1]', 'a[i] ＞ a[1]', 'a[p] ＞ a[i]']
    a: ア
    exp: |
      p はそれまでの最大値の添字です。a[i] が a[p] より真に大きいときだけ p を更新すれば，同じ値が現れても p は動かず，最初の添字が残ります。

      a ＝ {3, 9, 2, 9} のとき

      | i | a[i] | a[p] | 条件 a[i] ＞ a[p] | p |
      | --- | --- | --- | --- | --- |
      | （開始） | | | | 1 |
      | 2 | 9 | 3 | 真 | 2 |
      | 3 | 2 | 9 | 偽 | 2 |
      | 4 | 9 | 9 | 偽 | 2 |

      戻り値は 2 で，最も小さい添字になります。
    why:
      - 正解です。真に大きいときだけ更新するので，最大値が複数あっても最初に現れた添字が残ります。
      - 等号を含めると，同じ最大値が現れるたびに p が後ろへ移り，最も大きい添字を返してしまいます（{3, 9, 2, 9} で 4）。
      - 直前の要素と比べているだけで，最大値との比較になっていません。{3, 9, 2, 9} では 3 番目と 4 番目の比較で p が 4 になります。
      - 先頭の要素 a[1] との比較なので，a[1] より大きい値が現れるたびに p が更新され，{3, 9, 2, 9} で 4 を返します。
      - 大小が逆なので，最小値の添字を探す処理になります。最大値を求める目的に合いません。
    know: 最大値・最小値の添字を求める処理では，比較に等号を含めるかどうかで同値のときに最初の位置を返すか最後の位置を返すかが変わる。仕様に合わせて境界の扱いを決める。
    terms: [最大値探索, 線形探索法, 境界値分析]
    verify:
      cases:
        - { call: maxPos, args: [[3, 9, 2, 9]], expect: 2 }
        - { call: maxPos, args: [[5, 1, 2]], expect: 1 }
        - { call: maxPos, args: [[1, 2, 3, 4]], expect: 4 }
        - { call: maxPos, args: [[1, 3, 2, 3, 1]], expect: 2 }
        - { call: maxPos, args: [[7]], expect: 1 }
    sim: { entry: maxPos, args: [[3, 9, 2, 9]] }

  - id: B-ALG-405
    topic: [B1, 2-2-2-1]
    diff: 4
    scope: 科目B 「データ構造及びアルゴリズム」の探索（シラバス 2-2-2-1 探索のアルゴリズム。二分探索）。探索範囲を半開区間で扱う仕様と整数除算の前提を問題文に明記し，読解で解答できる。
    prereq: 二分探索の考え方，整数の商，ループ不変条件
    hard: 3 つの空欄が互いに整合する組合せを選ぶ必要があり，不整合の組は無限ループ・範囲外参照・答えの取りこぼしのいずれかになるため，区間の意味から推論しなければならない。
    q: |
      次のプログラム中の【a】～【c】に入れる正しい答えの組合せを，解答群の中から選べ。ここで，配列の要素番号は 1 から始まる。

      関数 lowerBound は，昇順に整列された整数型の配列 a（要素数は 0 以上，同じ値を含むことがある）と整数 x について，a[i] ≧ x を満たす最小の添字 i を返す。そのような要素がないときは，a の要素数 ＋ 1 を返す。探索範囲は「lo 以上 hi 未満」の添字であり，a ÷ b の商 は，a を b で割った商（整数）を表す。
    code: |
      ○整数型: lowerBound(整数型の配列: a, 整数型: x)
        整数型: lo, hi, mid
        lo ← 1
        hi ← aの要素数 ＋ 1
        while (lo 【a】 hi)
          mid ← (lo ＋ hi) ÷ 2 の商
          if (a[mid] ＜ x)
            lo ← 【b】
          else
            hi ← 【c】
          endif
        endwhile
        return lo
    c: ['a：＜，b：mid ＋ 1，c：mid', 'a：≦，b：mid ＋ 1，c：mid', 'a：＜，b：mid，c：mid － 1', 'a：＜，b：mid ＋ 1，c：mid － 1', 'a：≦，b：mid ＋ 1，c：mid － 1', 'a：＜，b：mid，c：mid']
    fills:
      - { a: '＜', b: 'mid ＋ 1', c: 'mid' }
      - { a: '≦', b: 'mid ＋ 1', c: 'mid' }
      - { a: '＜', b: 'mid', c: 'mid － 1' }
      - { a: '＜', b: 'mid ＋ 1', c: 'mid － 1' }
      - { a: '≦', b: 'mid ＋ 1', c: 'mid － 1' }
      - { a: '＜', b: 'mid', c: 'mid' }
    a: ア
    exp: |
      探索範囲は「lo 以上 hi 未満」なので，hi は「答えは hi 以下にある（hi 自身が答えのこともある）」という上限を表します。a[mid] ＜ x なら mid とそれより前に答えはないので lo ← mid ＋ 1，そうでなければ mid 自身が答えの候補なので hi ← mid とします。範囲が空（lo ＝ hi）になったら終了するので，繰返し条件は lo ＜ hi です。

      a ＝ {1, 3, 3, 5, 7}，x ＝ 4 のとき（hi の初期値は 6）

      | lo | hi | mid | a[mid] | 判定 | 更新 |
      | --- | --- | --- | --- | --- | --- |
      | 1 | 6 | 3 | 3 | 4 未満 | lo ＝ 4 |
      | 4 | 6 | 5 | 7 | 4 以上 | hi ＝ 5 |
      | 4 | 5 | 4 | 5 | 4 以上 | hi ＝ 4 |
      | 4 | 4 | | | 範囲が空 | 終了 |

      戻り値は lo ＝ 4 です。x ＝ 8 のときは lo が 6 になり，要素数 ＋ 1 を返します。
    why:
      - 正解です。半開区間 lo 以上 hi 未満に合わせ，lo ＜ hi の間繰り返し，mid が除外できるときだけ mid ＋ 1，候補なら mid に hi を縮めます。
      - lo ＝ hi でも繰り返す条件にした誤りです。lo ＝ hi のとき mid ＝ lo となり，a[mid] ≧ x なら hi ← mid で範囲が変わらず終わらなくなったり，mid が要素数 ＋ 1 になって範囲外を参照したりします。
      - lo ← mid とすると，hi が lo ＋ 1 のとき mid ＝ lo で更新しても範囲が縮まらず，無限ループになります。hi ← mid － 1 も候補 mid を捨ててしまいます。
      - hi ← mid － 1 とすると，a[mid] ≧ x を満たす mid 自身を答えの候補から外してしまいます。{1, 5} で x ＝ 5 のとき 2 ではなく 1 を返します。
      - 閉区間（hi を含む）の書き方の一部だけを混ぜた組合せです。hi の初期値が要素数 ＋ 1 の半開区間では，mid が要素数 ＋ 1 になり範囲外参照になることがあります。
      - lo ← mid，hi ← mid とどちらも範囲を縮めない更新で，範囲が 1 要素以上残る限り終わらなくなります。
    know: 二分探索では，探索範囲を閉区間（lo 以上 hi 以下）で扱うか半開区間（lo 以上 hi 未満）で扱うかで，初期値・繰返し条件・更新式の 3 点が連動して変わる。部分的に混ぜると，無限ループ，範囲外参照，答えの取りこぼしのいずれかになる。
    terms: [二分探索, ループ不変条件, 境界条件]
    verify:
      cases:
        - { call: lowerBound, args: [[1, 3, 3, 5, 7], 3], expect: 2 }
        - { call: lowerBound, args: [[1, 3, 3, 5, 7], 4], expect: 4 }
