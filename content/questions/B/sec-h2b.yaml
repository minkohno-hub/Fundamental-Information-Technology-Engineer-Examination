questions:
  - id: B-SEC-109
    topic: [B5, 11-2-4]
    diff: 3
    scope: 科目B「情報セキュリティ」のデジタルフォレンジック。証拠の揮発性の高さに応じて、保全する順序を判断する問題で、範囲内。
    prereq: メモリや接続状態のように稼働中だけ存在する情報は失われやすく、ディスクの内容や保管されたログは後からでも取得できるという、証拠ごとの性質の違い
    hard: 「重要そうなもの」ではなく「先に失われるもの」という軸で4種類の証拠を並べ替える必要がある。特に、稼働中メモリと現在の接続状態のどちらが先かという、細部の順序の判断が求められる。
    q: |
      マルウェアに感染したサーバの調査で、フォレンジックのための証拠保全を行う。次の4つの証拠について、揮発性が高い（失われやすい）ものから順に保全するとき、その順序として最も適切なものはどれか。

      - W： 現在のネットワーク接続の状態（接続先とセッションの情報）
      - X： 稼働中メモリ上のデータ（実行中のプログラムや暗号化の途中データ）
      - Y： サーバのディスク内に保存されたファイル
      - Z： 外部のログ保管サービスに送信済みのアクセスログ（保管期間1年）
    c:
      - X → W → Y → Z
      - W → X → Y → Z
      - X → Y → W → Z
      - Y → X → W → Z
      - Z → Y → W → X
    a: ア
    exp: |
      証拠保全の原則は「揮発性の高いものから先に」です。稼働中メモリの内容は、プログラムの終了や電源断で直ちに失われ、最も揮発性が高いため最初に保全します（X）。現在のネットワーク接続の状態も、接続が切れれば失われますが、メモリよりは保ちやすいため次です（W）。ディスク内のファイルは、電源を切っても残り、書込みを防ぐ措置を取れば後から取得できます（Y）。既に外部サービスへ送信され1年間保管されるログは、最も失われにくいため最後で構いません（Z）。
    why:
      - 正解です。メモリ、接続状態、ディスク、保管済みログの順が、揮発性の高い順です。
      - メモリの内容はプログラムの終了だけでも失われ、接続状態より揮発性が高いため、メモリが先です。
      - ディスクのファイルは電源断でも残ります。接続状態より先に保全する必要はありません。
      - ディスクはメモリや接続状態より揮発性が低く、最初に保全すると消えやすい証拠を失います。
      - 保管済みのログは最も失われにくい証拠です。順序が全体として逆になっています。
    know: 証拠の揮発性の順序は、一般に「メモリやキャッシュ ＞ 接続状態などの一時的な状態 ＞ ディスク ＞ 遠隔地に保管されたログやバックアップ」とされる。保全の段取りは、この順序で組み立てる。
    terms: [フォレンジック, インシデント対応]
    verify:
      manual: 4種類の証拠について「何が起きると失われるか」（プログラム終了・電源断、接続の終了、媒体の上書き、保管期間の満了）を整理し、揮発性の順序が メモリ ＞ 接続状態 ＞ ディスク ＞ 保管済みログ になることを確認した。

  - id: B-SEC-110
    topic: [B5, 11-1-4]
    diff: 2
    scope: 科目B「情報セキュリティ」の暗号技術。共通鍵暗号の鍵配送問題を解決するために、公開鍵暗号を組み合わせる仕組みを判断する問題で、範囲内。
    prereq: 共通鍵暗号は暗号化と復号に同じ鍵を使うため、相手に鍵を安全に渡す方法が課題になること
    q: |
      A社は、取引先との間で大量のファイルを暗号化して送受信したい。共通鍵暗号は処理が高速だが、相手ごとに鍵を安全に渡す方法が課題である。この課題を解決しつつ高速な暗号化を行う仕組みとして、最も適切なものはどれか。
    c:
      - ファイルの暗号化には共通鍵を使い、その共通鍵だけを受信者の公開鍵で暗号化して送る
      - ファイル全体を受信者の公開鍵で暗号化して送る。共通鍵は使わない
      - 共通鍵をメールの本文に平文で書いて、暗号化したファイルと一緒に送る
      - 共通鍵を2つに分割し、片方をメール、もう片方を電話で伝える
      - 受信者全員で1つの共通鍵を共有し、漏洩しないよう口頭だけで伝える
    a: ア
    exp: |
      大量のデータの暗号化には高速な共通鍵暗号が向いていますが、鍵をどう安全に渡すかが課題です。そこで、データ自体は共通鍵で暗号化し、その共通鍵だけを相手の公開鍵で暗号化して渡す方式（ハイブリッド暗号）が使われます。受信者は自分の秘密鍵で共通鍵を取り出し、その共通鍵でデータを復号します。公開鍵で暗号化された共通鍵は、秘密鍵を持つ受信者しか復号できません。ファイル全体を公開鍵暗号で処理すると、低速で現実的ではありません。
    why:
      - 正解です。共通鍵の高速さと、公開鍵暗号による鍵配送の安全性を組み合わせたハイブリッド暗号です。
      - 公開鍵暗号で大量のファイルを直接暗号化すると、処理が低速になり、現実的ではありません。
      - 平文の鍵を同じ経路で送れば、ファイルと一緒に盗まれたときに暗号化の意味がなくなります。
      - 分割して別経路で伝える方法は、運用が煩雑で、両方を集められれば解読されます。公開鍵暗号を使う確立した方法があります。
      - 全員で同じ鍵を共有すると、誰から漏れたか分からず、1人の漏洩で全体が危険になります。
    know: ハイブリッド暗号は、共通鍵暗号（高速）と公開鍵暗号（鍵配送が安全）の長所を組み合わせる。TLS やファイル暗号化ソフトの多くがこの方式であり、共通鍵はセッションごとに使い捨てるのが一般的である。
    terms: [ハイブリッド暗号方式, 公開鍵暗号方式]
    verify:
      manual: 5つの案を「大量データの処理速度」と「鍵配送の安全性」で評価し、共通鍵でデータを、公開鍵で共通鍵を暗号化する案だけが両立することを確認した。

  - id: B-SEC-111
    topic: [B5, 11-1-6]
    diff: 3
    scope: 科目B「情報セキュリティ」の防御層の選択。Web アプリケーションへの攻撃（HTTP の中身に仕込まれる攻撃）を防ぐために、どの防御装置をどこに置くべきかを判断する問題で、範囲内。
    prereq: ファイアウォールは IP アドレスやポートで通信を制御し、HTTP の中身までは検査しないこと、WAF は HTTP の内容を検査して Web アプリケーションへの攻撃を遮断すること
    hard: 攻撃が「許可された通信（HTTPS の Web アクセス）の中」に紛れて届くため、境界のファイアウォールでは止められない点を見抜き、アプリケーションの手前に置く防御を選ぶ必要がある。
    q: |
      A社の公開 Web サイトは、ファイアウォールで社内ネットワークと区切られた場所に設置され、外部からは HTTPS（ポート 443）の通信だけが許可されている。ところが、Web アプリケーションの入力欄を悪用した攻撃（SQL インジェクションなど）が、許可された HTTPS 通信に紛れて到達し、被害が出た。この攻撃への対策として、最も適切なものはどれか。
    c:
      - Web サーバの手前に WAF を設置し、HTTP のリクエスト内容を検査して攻撃のパターンを遮断する
      - ファイアウォールのルールを追加し、ポート 443 以外の通信を全て遮断する
      - Web サーバの OS のパスワードを、より長いものに変更する
      - 社内ネットワークと Web サーバの間に、もう1台ファイアウォールを追加する
      - Web サーバへの通信を全て遮断し、外部公開を停止する
    a: ア
    exp: |
      今回の攻撃は、正規の利用者と同じ HTTPS 通信の形で届くため、IP アドレスやポート番号で判断するファイアウォールでは、正常なアクセスと区別できません。攻撃を止めるには、HTTP のリクエストの中身（入力値のパターンなど）を検査する装置が必要です。それが WAF（Web アプリケーションファイアウォール）で、Web サーバの手前に置き、SQL インジェクションのような攻撃の特徴を持つリクエストを遮断します。なお、根本対策はアプリケーション側の入力値の検証やパラメータ化であり、WAF はそれを補完する防御層です。
    why:
      - 正解です。許可された通信の中身を検査できる WAF が、この種の攻撃に対応する防御層です。
      - ポート 443 以外は既に遮断されている前提であり、攻撃は 443 を通って届いています。対策になりません。
      - パスワードの強化は認証への攻撃には有効ですが、入力欄を悪用する攻撃の経路とは無関係です。
      - 同じ判断基準のファイアウォールを重ねても、HTTP の中身は検査できないままです。
      - 公開の停止は攻撃は止めますが、事業そのものを止めることになり、対策として適切ではありません。
    know: 防御は層ごとに役割が違う。ファイアウォールは通信の宛先と種類、WAF は HTTP の中身、アプリケーションの入力値検証は根本対策。攻撃がどの層を通るかで、置くべき防御が決まる。
    terms: [WAF, ファイアウォール]
    verify:
      manual: 攻撃の経路（許可された HTTPS 通信の中身）と各対策の検査対象を照合し、HTTP の内容を検査する WAF だけが攻撃を識別できることを確認した。

  - id: B-SEC-112
    topic: [B5, 11-1-7]
    diff: 3
    scope: 科目B「情報セキュリティ」のネットワーク分離と内部対策。侵入を前提として、内部での横展開を防ぐための対策を判断する問題で、範囲内。
    prereq: 境界防御だけでは侵入を完全には防げず、侵入後に攻撃者が内部の他のシステムへ移動（横展開）する危険があること
    hard: 「社内は安全」という前提に立つ対策の限界を読み取り、ネットワークの分割と認証の強化という、侵入後の被害を局所化する方向の対策を選ぶ必要がある。
    q: |
      A社のネットワークは、境界のファイアウォールで外部と区切られているが、内部は1つの大きなネットワークで、どの端末からも全てのサーバにアクセスできる。ある端末がマルウェアに感染した場合、攻撃者が内部の他のサーバへ次々と侵入を広げる（横展開）危険が指摘された。横展開への対策として、最も適切なものはどれか。
    c:
      - ネットワークを部署や用途ごとに分割し、区間ごとに必要な通信だけを許可するとともに、サーバへのアクセスに多要素認証を求める
      - 境界のファイアウォールのルールを細かくし、外部からの通信をさらに制限する
      - 全ての端末のマルウェア対策ソフトの定義ファイルを、1日1回更新する
      - 社内ネットワークの IP アドレス体系を、外部に知られないよう秘密にする
      - サーバの台数を減らして、攻撃対象を少なくする
    a: ア
    exp: |
      横展開は、侵入された後の内部での移動です。境界防御を強化しても、既に内部に入った攻撃者の移動は止められません。対策は、ネットワークを分割して区間間の通信を必要最小限に制限する（マイクロセグメンテーションの考え方）ことと、サーバごとに認証を強化することです。1つの区間で感染が起きても、他の区間のサーバには簡単には届かなくなり、被害が局所化します。端末の対策や境界の強化は侵入防止には役立ちますが、横展開そのものへの対策にはなりません。
    why:
      - 正解です。分割と区間ごとの通信制限、認証の強化は、侵入後の移動を妨げて被害を局所化します。
      - 境界の強化は侵入の防止には効きますが、内部での横展開は止められません。指摘された危険への対策にはなっていません。
      - 定義ファイルの更新は端末の防御を高めますが、感染した端末からの内部移動そのものは防げません。
      - アドレス体系を知られていないことに頼るのは、隠すことによるセキュリティであり、内部にいる攻撃者には通用しません。
      - 台数を減らしても、残ったサーバへの移動のしやすさは変わりません。根本の構造への対策ではありません。
    know: 近年の対策は「侵入を前提とする」考え方（ゼロトラストの流れ）が中心になりつつある。ネットワーク分割と最小権限の通信許可、認証の強化により、1か所の侵害が全体の侵害に広がらない構造にする。
    terms: [ゼロトラスト, ネットワークセグメンテーション]
    verify:
      manual: 論点（内部での横展開）に対して、各対策が働く場所（境界か内部か、侵入前か侵入後か）を照合し、内部の分割と認証強化だけが横展開を直接妨げることを確認した。

  - id: B-SEC-113
    topic: [B5, 11-2-3]
    diff: 4
    scope: 科目B「情報セキュリティ」のログ分析と攻撃の再構成。異なる装置の記録を時系列でつなぎ合わせ、攻撃の流れと現在の状況を判断する読解問題で、範囲内。
    prereq: 認証の成功・失敗、ファイルの書込み、外部への大量通信という記録の意味を、それぞれの装置の役割と結び付けて読むこと
    hard: 4種類の記録を時刻順に並べ、侵入→設置→情報の外部送信という一連の流れとして読み解く必要がある。個別には正常にも見える記録（認証の成功、夜間の通信）を、つなげることで攻撃と判断する点が核心である。
    q: |
      A社のサーバについて、複数の装置の記録に次の出来事があった。時系列で読んだとき、状況の解釈として最も適切なものはどれか。

      - 02時10分 Web サーバの記録に、海外の IP アドレスから管理画面へのログイン失敗が約 300 回記録された
      - 02時25分 同じ IP アドレスから管理画面へのログインが成功した
      - 02時31分 Web サーバ上に、正体不明のプログラムファイルが新規に置かれた
      - 03時05分 Web サーバから、海外のサーバへ約 2G バイトのデータ送信が記録された
    c:
      - 外部からのパスワードの試行で管理画面に侵入され、プログラムを置かれて、データが外部へ持ち出された可能性が高い
      - ログインの失敗は通常の誤入力の範囲であり、成功したログインは管理者の正規の作業である
      - データの送信は、夜間に設定された通常のバックアップである可能性が高いので、問題はない
      - 不明なプログラムは、自動更新で配布された正規のものである可能性が高く、調査は不要である
      - 記録はそれぞれ別の出来事であり、関連付けて考える必要はない
    a: ア
    exp: |
      個別の記録は、それぞれ別の説明も可能に見えます。しかし、同じ IP アドレスによる約 300 回のログイン失敗の直後に成功があること、その数分後に不明なプログラムが置かれたこと、その後に海外へ約 2G バイトの送信があることをつなげると、「パスワードの総当たり等で侵入 → 遠隔操作のためのプログラム（バックドア等）を設置 → データを持ち出し」という典型的な侵入の流れになります。特に、侵入元と同じ方向（海外）への大量送信は、情報漏洩の強い疑いを示します。関連付けて時系列で読むこと（相関分析）が、ログ監視の要点です。
    why:
      - 正解です。失敗の集中→成功→不明プログラムの設置→大量の外部送信という流れは、侵入と情報持ち出しの典型的な形です。
      - 深夜に海外から 300 回の失敗が続いた直後の成功を、正規の作業と見るのは無理があります。失敗の量が誤入力の範囲を超えています。
      - バックアップであれば宛先や時刻が定型化されているはずで、侵入の直後に始まった送信を通常の処理と決めつけることはできません。
      - 自動更新の配布元は正規のベンダであり、侵入直後に現れた出所不明のファイルを正規と判断する根拠はありません。
      - 同じ IP アドレスと短い時間間隔でつながっている記録であり、関連付けこそがこの状況の読み方です。
    know: セキュリティ監視では、単一の記録ではなく、複数の記録を時刻と主体（IP アドレス、アカウント）でつなぐ相関分析が重要。攻撃は「侵入→設置→実行→持ち出し」の段階を踏むため、段階のつながりで検知する。
    terms: [相関分析, ログ管理]
    verify:
      manual: 4つの記録を時刻順と主体（同一 IP アドレス）でつなぎ、侵入→プログラム設置→大量送信という攻撃の段階に一致すること、他の選択肢の解釈が記録の量やタイミングと矛盾することを確認した。

  - id: B-SEC-114
    topic: [B5, 11-1-8-2]
    diff: 3
    scope: 科目B「情報セキュリティ」のソフトウェアの脆弱性管理。利用しているライブラリに脆弱性が公表されたとき、影響範囲の特定と対応の進め方を判断する問題で、範囲内。
    prereq: 自社のシステムがどのライブラリのどの版を使っているかが分からなければ、公表された脆弱性の影響を判断できないこと
    hard: 脆弱性の深刻度だけで反応するのではなく、自社の利用状況（該当する版を使っているか、その機能を使っているか）を先に特定する手順が適切だと判断する必要がある。
    q: |
      A社が利用している著名なライブラリに、深刻度の高い脆弱性が公表された。A社のシステムは多数あり、どのシステムがそのライブラリを使っているかは、すぐには分からない状況である。対応の進め方として、最も適切なものはどれか。
    c:
      - まずソフトウェア部品表（SBOM）や資産管理の情報から、該当ライブラリを使っているシステムと版を特定し、影響を受けるシステムから優先的に対応する
      - 脆弱性の深刻度が高いので、全システムを直ちに停止してから調査を始める
      - ライブラリの新しい版が公開されたら、影響の確認をせずに全システムへ一斉に適用する
      - 公表された脆弱性は他社の問題でもあるため、自社での対応は公表から1か月ほど様子を見る
      - 該当ライブラリを使っているかどうか分からないので、利用者に注意喚起のメールだけを送る
    a: ア
    exp: |
      脆弱性への対応は、「自社が影響を受けるか」の特定から始まります。使っているソフトウェアの部品構成（SBOM などの部品表）が整備されていれば、該当するライブラリと版を使っているシステムを速やかに洗い出せます。そのうえで、外部に公開されているか、脆弱性の対象機能を使っているかなどで優先順位を付け、修正版の適用や回避策を進めます。影響も分からないまま全停止や一斉適用をすると、業務への打撃や、適用自体による障害を招きます。深刻な脆弱性ほど、正確な影響範囲の特定が初動の質を決めます。
    why:
      - 正解です。影響範囲の特定（利用システムと版の洗い出し）が初動であり、そこから優先順位を付けて対応します。
      - 影響を受けるかどうかも分からない段階での全停止は、業務への打撃が大きく、調査の順序としても誤っています。
      - 影響の確認なしの一斉適用は、無関係なシステムへの変更リスクと、適用による不具合のリスクを抱えます。
      - 深刻度の高い脆弱性は公表直後から悪用が始まることが多く、様子見は危険です。
      - 注意喚起だけでは、実際に影響を受けるシステムへの技術的な対応にはなりません。
    know: ソフトウェアの部品表（SBOM）は、脆弱性が公表されたときに「自社のどこが影響を受けるか」を即座に答えるための土台。脆弱性対応は、深刻度 × 自社の利用実態（露出と該当機能）で優先順位を決める。
    terms: [SBOM, 脆弱性管理]
    verify:
      manual: 対応の各案を「影響範囲の特定が初動か」という観点で評価し、部品表から利用システムと版を特定して優先順位を付ける案だけが手順として正しいことを確認した。

  - id: B-SEC-115
    topic: [B5, 11-1-6]
    diff: 2
    scope: 科目B「情報セキュリティ」のセッション管理。ログイン前に発行されたセッション ID を攻撃者に固定される攻撃（セッション固定）への対策を判断する問題で、範囲内。
    prereq: セッション ID は利用者を識別する鍵であり、ログインの前後で同じ ID を使い続けると、他人が用意した ID を使わせる攻撃が成立すること
    q: |
      A社の Web サイトでは、利用者がログインする前からセッション ID が発行され、ログイン後も同じ ID を使い続けている。攻撃者が自分のセッション ID を被害者に使わせ、その ID でログインさせることができると、攻撃者は被害者になりすまして操作できる（セッション固定攻撃）。対策として、最も適切なものはどれか。
    c:
      - ログインが成功した時点で、セッション ID を新しいものに再発行する
      - セッション ID の桁数を、現在の 2 倍にする
      - セッションの有効期限を、現在の半分に短縮する
      - セッション ID を、利用者の ID と同じ文字列にする
      - ログイン画面に、注意喚起の文章を表示する
    a: ア
    exp: |
      セッション固定攻撃は、「ログイン前の ID がログイン後も有効である」ことを突く攻撃です。ログインの成功した時点でセッション ID を再発行すれば、攻撃者が用意した ID はログインと同時に無効になり、なりすましは成立しません。ID の桁数を増やしたり有効期限を短くしたりすることは、推測や盗用への対策にはなっても、「固定された ID を使わせる」という本攻撃の仕組み自体は防げません。ID を利用者 ID と同じにするのは、推測が容易になり逆効果です。
    why:
      - 正解です。ログイン時の再発行により、攻撃者が固定した ID は認証済みのセッションとは結び付きません。
      - 桁数を増やすと推測は難しくなりますが、固定攻撃は ID の値を「使わせる」攻撃なので、推測の難しさは関係ありません。
      - 有効期限の短縮は盗まれた ID の悪用期間を狭めますが、期限内なら固定した ID でなりすませます。
      - ID を推測しやすい文字列にすることは、なりすましの危険をむしろ高めます。
      - 注意喚起は利用者の注意に頼るもので、仕組みとしての対策にはなりません。
    know: セッション管理の基本は、認証状態が変わる時点（ログイン成功時）でセッション ID を再発行すること。これにより、ログイン前に他人が用意した ID を持ち越す攻撃が成立しなくなる。
    terms: [セッション管理, セッションハイジャック]
    verify:
      manual: 攻撃の仕組み（ログイン前の ID の持ち越し）を遮断できるかを各対策で照合し、ログイン時の再発行だけが仕組みを断つことを確認した。

  - id: B-SEC-116
    topic: [B5, 11-1-8-3]
    diff: 4
    scope: 科目B「情報セキュリティ」の DNS を悪用した通信の検知。DNS の問合せの記録の特徴から、データを外部へ運ぶトンネリングの疑いを判断する読解問題で、範囲内。
    prereq: 通常の DNS の問合せは短い名前の解決が中心であり、長い文字列のサブドメインや TXT レコードの大量の問合せは、データを埋め込む用途に使われ得ること
    hard: 許可されている DNS 通信の中に紛れた異常を、名前の長さ・レコードの種類・頻度という複数の特徴の組合せから読み取る必要がある。単に「外部への通信がある」だけでは異常と判断できない点が核心である。
    q: |
      A社の DNS サーバの記録を調査したところ、ある社内 PC から外部の特定ドメインへの問合せに、次の特徴が見られた。この状況の解釈として、最も適切なものはどれか。

      - 問合せ先のサブドメインが、毎回異なる 60 文字前後の英数字の文字列になっている
      - レコードの種類は、名前解決には通常使わない TXT が大半を占める
      - 問合せは 1 日に数千回、業務時間外も続いている
    c:
      - DNS の問合せにデータを埋め込んで外部へ送る DNS トンネリングによる、情報の持ち出しの疑いがある
      - 利用者が多くの Web サイトを閲覧した結果であり、通常の業務利用の範囲である
      - DNS サーバの設定ミスで、同じ問合せが繰り返し記録されているだけである
      - 広告配信の仕組みによる正常な通信であり、問題はない
      - 社内の名前解決が不安定なため、再試行が繰り返されているだけである
    a: ア
    exp: |
      DNS の問合せは、本来は短いホスト名を解決するための短い通信です。本件には、通常とは異なる特徴がそろっています。(1) サブドメインが毎回異なる長い文字列であることは、問合せの名前そのものにデータを埋め込んでいる形です。(2) TXT レコードは応答に大きなテキストを載せられるため、データの受渡しに悪用されます。(3) 業務時間外も含めた数千回の頻度は、人の操作では説明しにくい量です。これらから、ファイアウォールで許可されがちな DNS 通信を隠れ蓑に、データを外部へ運ぶ DNS トンネリングの疑いが濃厚です。
    why:
      - 正解です。長い可変のサブドメイン、TXT の多用、時間外を含む大量の問合せという組合せが、トンネリングの典型的な痕跡です。
      - Web 閲覧に伴う問合せは、実在のサイトの短い名前が中心で、TXT が大半を占めることはありません。
      - 設定ミスでは、同じ名前の問合せの繰り返しになるのが通常で、毎回異なる長い名前にはなりません。
      - 広告配信でも、毎回異なる 60 文字の名前や TXT 中心の問合せという形にはなりません。
      - 再試行は、同じ名前を短時間に繰り返す形であり、本件の特徴（毎回異なる名前、終日継続）とは異なります。
    know: DNS は多くの環境で許可されるため、攻撃の隠れ経路に使われやすい。トンネリングの検知は通信の有無ではなく、名前の長さやエントロピー、レコード種別、頻度といった「形の異常」を見ることが要点である。
    terms: [DNS, DNSトンネリング]
    verify:
      manual: 記録の3つの特徴（毎回異なる長いサブドメイン、TXT の多用、時間外を含む高頻度）を通常の名前解決のパターンと対比し、データを埋め込むトンネリングの痕跡に一致することを確認した。
