  # ===== 再帰 =====
  - id: B-ALG-124
    topic: [B3, 2-2-2-2]
    diff: 2
    q: |
      次の記述中の【a】に入れる正しい答えを，解答群の中から選べ。

      手続 hanoi は，ハノイの塔で n 枚の円盤を棒 from から棒 to へ，棒 via を補助に使って移す手順をたどり，円盤を 1 枚動かすたびに大域変数 count に 1 を加える。hanoi(5, 1, 3, 2) を実行した後の count の値は【a】である。
    code: |
      大域: 整数型: count ← 0

      ○hanoi(整数型: n, 整数型: from, 整数型: to, 整数型: via)
        if (n ≧ 1)
          hanoi(n － 1, from, via, to)
          count ← count ＋ 1
          hanoi(n － 1, via, to, from)
        endif
    c: ['31', '15', '32', '63']
    a: ア
    exp: |
      n 枚を移すには、上の n － 1 枚を補助の棒へ移し、一番下の 1 枚を動かし、n － 1 枚を目的の棒へ移します。手数を T(n) とすると T(n) ＝ 2 × T(n － 1) ＋ 1、T(0) ＝ 0 です。

      | n | 0 | 1 | 2 | 3 | 4 | 5 |
      | --- | --- | --- | --- | --- | --- | --- |
      | T(n) | 0 | 1 | 3 | 7 | 15 | 31 |

      一般に T(n) ＝ 2^n － 1 なので、n ＝ 5 では 31 です。
    why:
      - 正解です。2^5 － 1 ＝ 31 回円盤を動かします。
      - 4 枚の場合の手数（2^4 － 1）です。
      - 2^5 で、1 を引き忘れています。
      - 6 枚の場合の手数、又は hanoi の呼出し回数（2^6 － 1）に相当します。円盤を動かす回数とは異なります。
    terms: [ハノイの塔, 再帰]
    verify:
      result: { call: hanoi, args: [5, 1, 3, 2], of: 'var:count' }
    sim: { entry: hanoi, args: [2, 1, 3, 2] }

  - id: B-ALG-125
    topic: [B3, 2-2-2-2, 1-2-1-1]
    diff: 2
    q: |
      次のプログラム中の【a】に入れる正しい答えを，解答群の中から選べ。

      関数 comb は，n 個から k 個を選ぶ組合せの数 nCk を返す（0 ≦ k ≦ n）。nCk は，k ＝ 0 又は k ＝ n のとき 1 であり，それ以外のときは，ある特定の 1 個を選ぶ場合と選ばない場合に分けて求めることができる。
    code: |
      ○整数型: comb(整数型: n, 整数型: k)
        if (k = 0 or k = n)
          return 1
        endif
        return 【a】
    c: ['comb(n － 1, k － 1) ＋ comb(n － 1, k)', 'comb(n － 1, k － 1) × comb(n － 1, k)', 'n × comb(n － 1, k － 1)', 'comb(n － 1, k － 1) ＋ comb(n － 1, k) ＋ 1', 'comb(n － 1, k － 1) ＋ comb(n － 2, k)']
    a: ア
    exp: |
      特定の 1 個を選ぶ場合は残り n － 1 個から k － 1 個を選び、選ばない場合は残り n － 1 個から k 個を選びます。よって nCk ＝ n－1Ck－1 ＋ n－1Ck です（パスカルの三角形の関係）。

      comb(4, 2) ＝ comb(3, 1) ＋ comb(3, 2) ＝ 3 ＋ 3 ＝ 6
    why:
      - 正解です。選ぶ場合と選ばない場合の和になっています。
      - 和ではなく積にしているので、例えば comb(3, 1) が 1 × 1 ＝ 1 になります。
      - 順列の考え方に近い式で、comb(3, 1) が 3 × 1 ＝ 3 となり一見正しいものの、comb(4, 2) は 4 × 3 ＝ 12 になります。
      - 再帰のたびに 1 を余分に加えるので、値が大きくなります。
      - 選ばない場合の残りの個数を 1 つ多く減らしているので、値が小さくなり、n － 2 ＜ k になると終了条件に達しないことがあります。
    terms: [組合せ, 再帰]
    verify:
      cases:
        - { call: comb, args: [4, 2], expect: 6 }
        - { call: comb, args: [5, 2], expect: 10 }
        - { call: comb, args: [3, 1], expect: 3 }
        - { call: comb, args: [6, 3], expect: 20 }
        - { call: comb, args: [2, 2], expect: 1 }
    sim: { entry: comb, args: [4, 2] }

  - id: B-ALG-126
    topic: [B3, 2-2-2-2]
    diff: 3
    q: |
      次の記述中の【a】に入れる正しい答えを，解答群の中から選べ。

      関数 comb は，n 個から k 個を選ぶ組合せの数を再帰的に求める。comb(5, 2) を呼び出したとき，最初の呼出しを含めて関数 comb が呼び出される回数は【a】である。
    code: |
      ○整数型: comb(整数型: n, 整数型: k)
        if (k = 0 or k = n)
          return 1
        endif
        return comb(n － 1, k － 1) ＋ comb(n － 1, k)
    c: ['19', '10', '20', '9']
    a: ア
    exp: |
      この再帰は、終了条件に達した呼出しが 1 を返し、それらを足し合わせて結果を作ります。comb(5, 2) ＝ 10 なので、1 を返す呼出し（葉）はちょうど 10 回です。葉でない呼出しは必ず 2 回呼び出すので、呼出しの木は葉が 10 個の2分木であり、葉でない呼出しは 10 － 1 ＝ 9 回です。合計 19 回です。

      | 呼出し | 子の呼出し |
      | --- | --- |
      | comb(5,2) | comb(4,1)、comb(4,2) |
      | comb(4,1) | comb(3,0)、comb(3,1) |
      | comb(4,2) | comb(3,1)、comb(3,2) |

      同じ引数の呼出し（comb(3, 1) など）も重複して数えます。
    why:
      - 正解です。葉が 10 回、それ以外が 9 回で、合計 19 回です。
      - comb(5, 2) の値（＝ 1 を返す呼出しの回数）であり、途中の呼出しを数えていません。
      - 葉の 2 倍として数えた値で、葉の数 ＋ 葉でない呼出しの数（葉の数 － 1）になっていません。
      - 葉でない呼出しの回数だけで、終了条件で 1 を返す呼出しを数えていません。
    terms: [再帰, 組合せ]
    verify:
      result: { call: comb, args: [5, 2], of: 'calls:comb' }
    sim: { entry: comb, args: [5, 2] }

  - id: B-ALG-127
    topic: [B3, 2-2-2-2, 1-3-7]
    diff: 3
    q: |
      次の記述中の【a】に入れる正しい答えを，解答群の中から選べ。

      関数 power は，x の n 乗（n ≧ 0）を，n を半分にしながら再帰的に求める。ここで，整数型の変数に実数を代入すると小数点以下は切り捨てられる。power(3, 100) を呼び出したとき，最初の呼出しを含めて関数 power が呼び出される回数は【a】である。
    code: |
      ○整数型: power(整数型: x, 整数型: n)
        整数型: half, h
        if (n = 0)
          return 1
        endif
        half ← n ÷ 2
        h ← power(x, half)
        if (n mod 2 = 0)
          return h × h
        else
          return h × h × x
        endif
    c: ['8', '7', '100', '50']
    a: ア
    exp: |
      power は 1 回の呼出しで自分自身を 1 回だけ、n を半分（切捨て）にして呼び出します。n の変化をたどると

      | 呼出し | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | n | 100 | 50 | 25 | 12 | 6 | 3 | 1 | 0 |

      n ＝ 0 で終了するので 8 回です。呼出し回数はおよそ log2 n ＋ 2 回であり、x を n 回掛ける方法より大幅に少なくなります。
    why:
      - 正解です。n が 100 → 50 → 25 → 12 → 6 → 3 → 1 → 0 と変化し、8 回呼び出されます。
      - n ＝ 0 の呼出し（1 を返す呼出し）を数え忘れています。
      - x を 1 回ずつ掛けていく単純な方法の掛け算の回数です。
      - n を 2 ずつ減らすと考えた場合の回数で、n は半分になっていきます。
    terms: [再帰, 計算量]
    verify:
      result: { call: power, args: [3, 100], of: 'calls:power' }
    sim: { entry: power, args: [3, 13] }

  # ===== 数理・データサイエンス・AI =====
  - id: B-ALG-128
    topic: [B4, 1-2-1-2]
    diff: 2
    q: |
      次のプログラム中の【a】に入れる正しい答えを，解答群の中から選べ。ここで，配列の要素番号は 1 から始まる。

      関数 variance は，整数型の配列 data の値の分散（各値と平均との差の 2 乗の平均）を返す。
    code: |
      ○実数型: variance(整数型の配列: data)
        整数型: i, n
        実数型: mean, s
        n ← dataの要素数
        s ← 0
        for (i を 1 から n まで 1 ずつ増やす)
          s ← s ＋ data[i]
        endfor
        mean ← s ÷ n
        s ← 0
        for (i を 1 から n まで 1 ずつ増やす)
          s ← 【a】
        endfor
        return s ÷ n
    c: ['s ＋ (data[i] － mean) × (data[i] － mean)', 's ＋ (data[i] － mean)', 's ＋ data[i] × data[i] － mean', 's ＋ (data[i] － mean) × (data[i] － mean) ÷ n', 's × (data[i] － mean)']
    a: ア
    exp: |
      分散は、偏差（値 － 平均）の 2 乗を合計し、個数で割ったものです。2 回目の繰返しで偏差の 2 乗を s に足し込み、最後に s ÷ n を返します。

      data が {2, 4, 4, 4, 5, 5, 7, 9} のとき平均は 40 ÷ 8 ＝ 5 です。

      | 値 | 2 | 4 | 4 | 4 | 5 | 5 | 7 | 9 |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | 偏差 | -3 | -1 | -1 | -1 | 0 | 0 | 2 | 4 |
      | 2 乗 | 9 | 1 | 1 | 1 | 0 | 0 | 4 | 16 |

      合計 32 を 8 で割って分散は 4 です（標準偏差はその平方根の 2）。
    why:
      - 正解です。偏差の 2 乗の合計を求めています。
      - 偏差の合計は常に 0 になるので、分散は常に 0 になります。
      - 値の 2 乗から毎回平均を引いており、偏差の 2 乗になっていません。
      - 足し込む段階でも n で割っているので、最後の s ÷ n と合わせて n で 2 回割ることになります。
      - 足し算ではなく掛け算にしており、s の初期値が 0 なので結果は常に 0 になります。
    terms: [分散, 標準偏差, 代表値]
    verify:
      cases:
        - { call: variance, args: [[2, 4, 4, 4, 5, 5, 7, 9]], expect: 4 }
        - { call: variance, args: [[1, 2, 3, 4]], expect: 1.25 }
        - { call: variance, args: [[5, 5]], expect: 0 }
        - { call: variance, args: [[1, 3]], expect: 1 }
    sim: { entry: variance, args: [[2, 4, 4, 4, 5, 5, 7, 9]] }

  - id: B-ALG-129
    topic: [B4, 1-2-3]
    diff: 3
    q: |
      次のプログラム中の【a】に入れる正しい答えを，解答群の中から選べ。

      関数 isqrt は，0 以上の整数 n に対して，2 乗が n 以下となる最大の整数（n の平方根の整数部分）を返す。ニュートン法の考え方を整数の範囲で用い，x の初期値を n とし，y ← (x ＋ n ÷ x) ÷ 2 で次の近似値を求める。近似値は真の値に向かって減少していき，減少しなくなったときの x が答えである。ここで，整数型の変数に実数を代入すると小数点以下は切り捨てられる。
    code: |
      ○整数型: isqrt(整数型: n)
        整数型: x, y
        if (n = 0)
          return 0
        endif
        x ← n
        y ← (x ＋ n ÷ x) ÷ 2
        while (【a】)
          x ← y
          y ← (x ＋ n ÷ x) ÷ 2
        endwhile
        return x
    c: ['y < x', 'y ≦ x', 'y ≠ x', 'y > x']
    a: ア
    exp: |
      次の近似値 y が今の x より小さい間は x を y に置き換えて続け、y が x 以上になったら（減少しなくなったら）終了します。

      isqrt(99) の動き

      | x | n ÷ x | y | y ＜ x |
      | --- | --- | --- | --- |
      | 99 | 1 | 50 | 真 |
      | 50 | 1.98 | 25 | 真 |
      | 25 | 3.96 | 14 | 真 |
      | 14 | 7.07… | 10 | 真 |
      | 10 | 9.9 | 9 | 真 |
      | 9 | 11 | 10 | 偽 |

      9 × 9 ＝ 81 ≦ 99 ＜ 100 なので 9 が答えです。
    why:
      - 正解です。近似値が減少しなくなった時点で終了し、そのときの x を返します。
      - y と x が等しくなった後も繰り返し、値が変わらないため繰返しが終わりません。
      - n ＝ 3 や 8 などでは x と y が 2 つの値を交互にとり、等しくならないので繰返しが終わりません。
      - 最初の y は x より小さいので繰返しに入らず、n をそのまま返してしまいます。
    terms: [ニュートン法]
    verify:
      cases:
        - { call: isqrt, args: [99], expect: 9 }
        - { call: isqrt, args: [16], expect: 4 }
        - { call: isqrt, args: [3], expect: 1 }
        - { call: isqrt, args: [8], expect: 2 }
        - { call: isqrt, args: [1], expect: 1 }
    sim: { entry: isqrt, args: [99] }

  - id: B-ALG-130
    topic: [B4, 1-2-1-2]
    diff: 2
    q: |
      次のプログラム中の【a】と【b】に入れる正しい答えの組合せを，解答群の中から選べ。ここで，配列の要素番号は 1 から始まる。

      関数 median は，昇順に整列済みの整数型の配列 data（要素数 1 以上）の中央値を返す。要素数が奇数のときは中央の値，偶数のときは中央の 2 つの値の平均を中央値とする。ここで，整数型の変数に実数を代入すると小数点以下は切り捨てられる。
    code: |
      ○実数型: median(整数型の配列: data)
        整数型: n, m
        n ← dataの要素数
        m ← n ÷ 2
        if (n mod 2 = 1)
          return 【a】
        else
          return 【b】
        endif
    c: ['a：data[m ＋ 1]，b：(data[m] ＋ data[m ＋ 1]) ÷ 2', 'a：data[m]，b：(data[m] ＋ data[m ＋ 1]) ÷ 2', 'a：data[m ＋ 1]，b：data[m] ＋ data[m ＋ 1] ÷ 2', 'a：data[m ＋ 1]，b：(data[m ＋ 1] ＋ data[m ＋ 2]) ÷ 2', 'a：data[m]，b：data[m]']
    fills:
      - { a: 'data[m ＋ 1]', b: '(data[m] ＋ data[m ＋ 1]) ÷ 2' }
      - { a: 'data[m]', b: '(data[m] ＋ data[m ＋ 1]) ÷ 2' }
      - { a: 'data[m ＋ 1]', b: 'data[m] ＋ data[m ＋ 1] ÷ 2' }
      - { a: 'data[m ＋ 1]', b: '(data[m ＋ 1] ＋ data[m ＋ 2]) ÷ 2' }
      - { a: 'data[m]', b: 'data[m]' }
    a: ア
    exp: |
      m は n ÷ 2 の切捨てです。

      | n | m | 中央の位置 |
      | --- | --- | --- |
      | 5（奇数） | 2 | 3 ＝ m ＋ 1 |
      | 4（偶数） | 2 | 2 と 3 ＝ m と m ＋ 1 |

      奇数なら data[m ＋ 1]、偶数なら (data[m] ＋ data[m ＋ 1]) ÷ 2 です。偶数のときの ÷ 2 は括弧で和全体にかける必要があります。例えば {2, 4, 6, 10} の中央値は (4 ＋ 6) ÷ 2 ＝ 5 です。
    why:
      - 正解です。奇数では中央の要素、偶数では中央の 2 要素の平均を返します。
      - 奇数のとき中央より 1 つ前の要素を返し、要素数が 1 のときは data[0] を参照してエラーになります。
      - 除算が加算より優先されるので、data[m] ＋ (data[m ＋ 1] ÷ 2) を計算してしまいます。
      - 偶数のとき中央の 2 要素より 1 つ後ろの 2 要素の平均になり、要素数 2 では範囲外を参照します。
      - 中央の位置を 1 つ前にずらしたうえ、偶数のとき平均をとっていません。
    terms: [中央値, 代表値]
    verify:
      cases:
        - { call: median, args: [[1, 3, 5]], expect: 3 }
        - { call: median, args: [[2, 4, 6, 10]], expect: 5 }
        - { call: median, args: [[7]], expect: 7 }
        - { call: median, args: [[1, 2]], expect: 1.5 }
        - { call: median, args: [[1, 2, 8, 9, 20]], expect: 8 }
    sim: { entry: median, args: [[2, 4, 6, 10]] }

  - id: B-ALG-131
    topic: [B4, 1-2-1-2]
    diff: 2
    q: |
      次のプログラム中の【a】に入れる正しい答えを，解答群の中から選べ。ここで，配列の要素番号は 1 から始まる。

      関数 movingAverage は，整数型の配列 data について，連続する k 個の値の平均（k 区間の移動平均）を先頭から順に求め，実数型の配列で返す。data の要素数を n とすると，戻り値の要素数は n － k ＋ 1 である。計算量を減らすため，区間の合計 s を毎回計算し直さず，新しく区間に入った値を足し，区間から外れた値を引いて更新する。
    code: |
      ○実数型の配列: movingAverage(整数型の配列: data, 整数型: k)
        実数型の配列: result ← {}
        整数型: i
        実数型: s ← 0
        for (i を 1 から dataの要素数 まで 1 ずつ増やす)
          s ← s ＋ data[i]
          if (i > k)
            s ← 【a】
          endif
          if (i ≧ k)
            result の末尾に s ÷ k を追加する
          endif
        endfor
        return result
    c: ['s － data[i － k]', 's － data[i － k ＋ 1]', 's － data[i － 1]', 's － data[k]', 's － data[1]']
    a: ア
    exp: |
      i 番目の値を足した直後、区間は i － k ＋ 1 番目〜 i 番目にしたいので、区間から外れる i － k 番目の値を引きます。

      data が {2, 4, 6, 8, 10}、k が 3 のとき

      | i | 足す値 | 引く値 | s | 追加する平均 |
      | --- | --- | --- | --- | --- |
      | 1 | 2 | － | 2 | － |
      | 2 | 4 | － | 6 | － |
      | 3 | 6 | － | 12 | 4 |
      | 4 | 8 | data[1] ＝ 2 | 18 | 6 |
      | 5 | 10 | data[2] ＝ 4 | 24 | 8 |

      戻り値は {4, 6, 8} です。
    why:
      - 正解です。区間の外に出た i － k 番目の値を引いています。
      - 区間に残すべき i － k ＋ 1 番目の値を引いてしまい、区間の値が k － 1 個になります。
      - 直前の値を引くので、区間の先頭ではなく区間の途中の値が除かれます。
      - 常に k 番目の値を引くので、区間が進んでも同じ値を引き続けます。
      - 常に先頭の値を引くので、区間が進むと正しい値が引かれません。
    terms: [移動平均, 代表値]
    verify:
