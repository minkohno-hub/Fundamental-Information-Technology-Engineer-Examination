category: B-SEC
subject: B
depth: deep
batch: H2
reviewed:
  at: '2026-10-30'
  method: 独立レビュー担当が解答を伏せて解き直し、全問の再計算・規則適用・誤答の検証と既存問題との重複確認を実施。重複と判定された B-SEC-104 は暗号化鍵の保管を問う別論点の問題に差し替え、再レビューで非重複を確認
questions:
  - id: B-SEC-101
    topic:
      - B5
      - 11-1-8-3
    diff: 3
    scope: 科目B「情報セキュリティ」の認証ログの分析。多数のアカウントへの少量の試行という分布の特徴から、パスワードスプレー攻撃を他の認証攻撃と区別する問題で、範囲内。
    prereq: ブルートフォース攻撃、辞書攻撃、クレデンシャルスタッフィングの試行パターンの違い
    hard: アカウント数・試行回数・使用パスワードの種類という3つの観点からログの集計を読み取り、1アカウントへの集中がない点を見抜く必要がある。
    q: |
      A社の認証サーバのログを集計したところ、ある1時間に、同一の外部IPアドレスから次のログイン試行があった。

      - 対象となったアカウントは 50 個で、アカウントごとに失敗は 2 回ずつ
      - 試されたパスワードは「Password2026」と社名に西暦を付けたものの 2 種類だけ
      - ログインの成功は 0 件

      この試行の特徴を表す攻撃手法として、最も適切なものはどれか。
    c:
      - 他のサービスから漏洩したIDとパスワードの組合せをそのまま試すクレデンシャルスタッフィング
      - 1つのアカウントに対して、辞書にある語句を大量に試す辞書攻撃
      - 多数のアカウントに対して、少数の推測しやすいパスワードを少しずつ試すパスワードスプレー攻撃
      - 1つのアカウントに対して、可能なパスワードを大量に試すブルートフォース攻撃
      - 正規の利用者がパスワードを何度も入力し間違えたことによる失敗
    a: ウ
    exp: |
      攻撃手法は「試行の分布」で見分けます。この集計では、試行が1つのアカウントに集中せず、50 個のアカウントに 2 回ずつ薄く広がっています。使われたパスワードも、ありがちな文字列と社名入りの 2 種類だけです。多数のアカウント × 少数パスワードという形は、アカウントロック（数回の失敗でロック）を回避しながら、弱いパスワードのままの利用者を探すパスワードスプレー攻撃の典型です。成功が 0 件なのは、今回は該当者がいなかったことを示します。
    why:
      - クレデンシャルスタッフィングは漏洩した組合せを試すため、アカウントごとに異なるパスワードが使われるはずです。今回は全アカウントで同じ 2 種類だけでした。
      - 辞書攻撃も1つのアカウントに対して多数の語句を試す攻撃です。パスワードの種類が 2 つだけという点が合いません。
      - 正解です。50 アカウントに 2 回ずつ、2 種類の推測しやすいパスワードを試す分布が、パスワードスプレーの特徴と一致します。
      - ブルートフォース攻撃なら試行は1つのアカウントに集中します。今回はアカウントごとに 2 回だけで、集中が見られません。
      - 正規の利用者の入力ミスであれば、同一IPアドレスから 50 アカウント分がそろって発生することは考えにくく、パスワードの種類も共通しません。
    know: パスワードスプレーは、アカウント単位の失敗回数が少なくロックされにくい点が厄介で、検知には「同一送信元から多数のアカウントへの試行」という横断的な集計が必要になる。対策は多要素認証と、推測しやすいパスワードの禁止である。
    terms:
      - パスワードスプレー
      - ブルートフォース攻撃
    verify:
      manual: ログ集計の3値（対象50アカウント、各2回失敗、パスワード2種類、成功0件）を各攻撃手法の定義パターンと照合し、多数アカウント×少数パスワードの分布に一致するのがパスワードスプレーだけであることを確認した。
  - id: B-SEC-102
    topic:
      - B5
      - 11-5-3
    diff: 3
    scope: 科目B「情報セキュリティ」のファイアウォール運用。ルールが上から順に評価される前提で、前のルールに遮られて適用されないルール（シャドールール）を見つける問題で、範囲内。
    prereq: ファイアウォールのルール評価（最初に一致したルールが適用される）と、条件の包含関係の読み取り
    hard: ルール2の「任意のポートに拒否」がルール3の対象トラフィックを全て先に取り込む包含関係を、ポート443の例外（ルール1）と切り分けて判断する必要がある。
    q: |
      A社のファイアウォールには、次のルールが設定されている。ルールは番号の小さい順に評価され、最初に条件に一致したルールの動作が適用される。

      | 番号 | 送信元 | 宛先 | ポート | 動作 |
      | --- | --- | --- | --- | --- |
      | 1 | 社内LAN | インターネット | TCP 443 | 許可 |
      | 2 | 社内LAN | インターネット | 任意 | 拒否 |
      | 3 | 社内LAN | インターネット | TCP 80 | 許可 |
      | 4 | 任意 | 任意 | 任意 | 拒否 |

      この設定では、適用されることが決してないルールがある。それはどれか。
    c:
      - ルール3
      - ルール4
      - ルール2
      - ルール1
      - すべてのルールに適用される可能性がある
    a: ア
    exp: |
      社内LANからインターネットへの通信は、ポートによって先に一致するルールが変わります。TCP 443 の通信はルール1に一致して許可されます。それ以外のポートの通信は、ルール2の「任意」に一致して拒否されます。TCP 80 の通信も例外ではなく、ルール3にたどり着く前にルール2で拒否されてしまいます。つまりルール3は、ルール2に完全に遮られていて（シャドーされて）、適用されることがありません。意図せず無効になったルールが残ると、設定したつもりの通信が実際には通らない、といった運用ミスの原因になります。
    why:
      - 正解です。社内LAN発の TCP 80 はルール2（任意のポートを拒否）に先に一致するため、ルール3は一度も適用されません。
      - ルール4は、社内LAN以外からの通信など、ルール1〜3に一致しない通信に適用されます。
      - ルール2は、TCP 443 以外の社内LAN発の通信に広く適用されます。適用されないのはその逆です。
      - ルール1は、社内LANからインターネットへの TCP 443 の通信に適用されます。遮られてはいません。
      - ルール3については、到達し得るトラフィックが全てルール2に先取りされるため、適用の可能性はありません。
    know: 広い条件のルールを上に置くと、後ろの細かいルールが shadow（遮蔽）されて無効になる。ルールの棚卸しでは、こうした到達不能なルールと、意図せず広く許可しているルールの両方を点検する。
    terms:
      - ファイアウォール
    verify:
      manual: 社内LAN発の通信をポート別（443、80、その他）に分け、各ルールを上から照合した。443 はルール1、80 とその他はルール2に一致し、ルール3に到達する通信が存在しないことを確認した。
  - id: B-SEC-103
    topic:
      - B5
      - 11-1-3-2
    diff: 2
    scope: 科目B「情報セキュリティ」のインシデント対応。ランサムウェアによる暗号化が進行中の状況で、被害拡大を止める封じ込めを最優先に選ぶ問題で、範囲内。
    prereq: インシデント対応の流れ（検知、封じ込め、根絶、復旧）の順序と、各段階の目的
    q: |
      業務時間中、A社のファイルサーバの共有フォルダにあるファイルが次々と暗号化され始め、複数の従業員のPCからも「ファイルが開けない」という報告が相次いだ。ランサムウェアへの感染が強く疑われる。情報システム部が最初に行うべき対応はどれか。
    c:
      - 感染したマルウェアの解析が完了するまで、現状のまま監視を続ける
      - 全従業員に注意喚起のメールを送信し、各自でファイルの確認を依頼する
      - 全従業員のPCを再起動し、正常に動作するか確認する
      - バックアップから共有フォルダのリストアを直ちに開始する
      - 感染が疑われるPCとファイルサーバをネットワークから隔離し、被害の拡大を止める
    a: オ
    exp: |
      暗号化が「進行中」である点が判断の鍵です。ランサムウェアはネットワーク経由で他のPCやサーバへ広がりながら暗号化を進めるため、まず被害の拡大を止める封じ込め（ネットワークからの隔離）が最優先になります。隔離せずにリストアを始めると、復旧したファイルが再び暗号化される恐れがあります。再起動は証跡（メモリ上の情報など）を失わせ、解析を待つ間の放置は被害を広げます。注意喚起も必要な対応ですが、拡大を止める物理的な措置の後になります。
    why:
      - 解析は重要ですが、完了まで放置すれば暗号化と拡散が続きます。封じ込めを先に行い、隔離した環境で解析します。
      - 注意喚起は並行して行うべき連絡ですが、それ自体は拡散を止められず、最初の一手にはなりません。
      - 再起動では感染は除去できず、揮発性の証跡も失われます。拡大防止にもなりません。
      - リストアは隔離と感染源の除去が済んでから行う復旧段階の作業です。この時点では再暗号化の恐れがあります。
      - 正解です。感染が進行中のため、隔離による封じ込めが最優先です。拡大を止めてから、影響範囲の特定や復旧に移ります。
    know: インシデント対応は、検知→封じ込め→根絶→復旧→事後対応の順が基本。特にマルウェアの拡散が進行中のときは、原因究明より先に封じ込めで被害の拡大を止めることが優先される。
    terms:
      - ランサムウェア
      - EDR
    verify:
      manual: 選択肢を対応段階（封じ込め、復旧、解析、連絡）に分類し、暗号化が進行中という状況条件と照合して、封じ込めだけが拡大防止に直接効くことを確認した。
  - id: B-SEC-104
    topic:
      - B5
      - 11-2-3
    diff: 3
    scope: 科目B「情報セキュリティ」のバックアップ運用。暗号化したバックアップの鍵の保管場所が、漏洩と喪失の両面でリスクになることを判断する問題で、範囲内。
    prereq: 暗号化データの復旧には鍵が必須であること、鍵とデータを同じ場所に置くと分離の意味がなくなること
    hard: 鍵が平文でサーバ内にあり、そのサーバ自身もバックアップ対象であるという二重の問題（サーバ侵害で鍵が漏れる、サーバ喪失で鍵も失われ復旧できない）を見抜く必要がある。
    q: |
      A社は、ファイルサーバのバックアップデータを暗号化してクラウドストレージに保管している。暗号化に使う鍵は、バックアップを管理するサーバ内の設定ファイルに平文で保存されており、そのサーバ自体も同じバックアップの対象に含まれている。この運用の改善策として、最も適切なものはどれか。
    c:
      - バックアップの取得頻度を増やし、鍵の保存方法は変えない
      - 鍵を紙に印刷して、サーバの管理者全員で共有し金庫に保管する
      - 復旧を速くするため、バックアップデータの暗号化を取りやめる
      - 鍵の長さを現在の2倍にし、設定ファイルへの保存は続ける
      - 鍵をバックアップ対象のサーバから分離し、アクセス制御された専用の保管場所（鍵管理の仕組み）で管理する
    a: オ
    exp: |
      問題は鍵の「保管場所」です。鍵がサーバ内の平文ファイルにあると、サーバが侵害されたときにバックアップデータと鍵が一緒に漏れ、暗号化の意味がなくなります。さらに、そのサーバ自体がバックアップ対象なので、サーバが壊れて復旧する場面では、復旧に必要な鍵まで一緒に失われ、バックアップがあっても読み出せません。鍵はデータと分離し、アクセスできる人を限定した専用の鍵管理の仕組みで保管することで、漏洩と喪失の両方のリスクを下げられます。鍵を長くしても、置き場所の問題は解決しません。
    why:
      - 取得頻度は復旧できる時点を細かくするだけで、鍵の漏洩・喪失のリスクとは関係がありません。
      - 紙の鍵を管理者全員で共有すると、誰が使ったか追えず、紛失や持ち出しのリスクが増えます。分離とアクセス制御が本質です。
      - 暗号化を取りやめれば、クラウド側に保管された個人情報などが平文で漏れる危険が生じ、改善にはなりません。
      - 鍵の長さは総当たりへの強さの話であり、平文でサーバに置かれているという保管の問題はそのまま残ります。
      - 正解です。鍵をデータとサーバから分離し、アクセス制御された場所で管理すれば、漏洩と喪失の両方に備えられます。
    know: 暗号化の強さはアルゴリズムや鍵長だけでなく、鍵の保管（生成、保管、アクセス制御、バックアップ、廃棄という鍵のライフサイクル管理）で決まる。鍵とデータを同じ場所に置くと、分離した意味がなくなる。
    terms:
      - バックアップ
      - 共通鍵暗号方式
    verify:
      manual: 現行運用の弱点を「鍵が平文」「データと同じサーバ内」「そのサーバ自身も復旧対象」の3点として特定し、各選択肢が漏洩リスクと喪失リスクの両方を解消するかを照合した。分離保管だけが両方を解消することを確認した。
  - id: B-SEC-105
    topic:
      - B5
      - 11-2-1
    diff: 4
    scope: 科目B「情報セキュリティ」のメール認証。SPF・DKIM の結果とドメインアライメントから DMARC の合否を判定する問題で、範囲内。
    prereq: SPF は送信元IPの検証、DKIM は署名ドメインの検証であり、DMARC はそのどちらかの成功とアライメントを要求すること
    hard: SPF の失敗だけで判断せず、DKIM の署名ドメイン（d=）が From のドメインと一致するアライメントまで確認し、DMARC は「どちらか一方の成功」で合格になる規則を適用する必要がある。
    q: |
      A社のメールサーバが、From のドメインが example.co.jp のメールを受信した。認証結果は次のとおりであった。受信側の DMARC 判定として、適切なものはどれか。なお、example.co.jp の DMARC ポリシーは p=reject とする。

      - SPF の結果：失敗（送信元IPアドレスは example.co.jp の SPF レコードに含まれていない）
      - DKIM の結果：成功（署名は正しく、署名ドメイン d=example.co.jp は From のドメインと一致）
    c:
      - DMARC の認証が成功するのは、SPF と DKIM の両方が成功した場合に限られる
      - SPF が失敗しているため DMARC の認証は失敗し、ポリシーに従って拒否される
      - DKIM が成功していても、SPF が失敗すれば DMARC の認証は常に失敗する
      - p=reject が設定されているため、SPF か DKIM のどちらか一方でも失敗すれば無条件に拒否される
      - DMARC の認証は成功であり、ポリシーによる拒否の対象にはならない
    a: オ
    exp: |
      DMARC の判定規則が鍵です。DMARC は、SPF と DKIM の両方の成功を要求するのではなく、「SPF 又は DKIM のどちらかが成功し、かつ、その認証の対象ドメインが From のドメインと一致（アライメント）していること」を要求します。今回は SPF は失敗しましたが、DKIM が成功し、署名ドメイン d=example.co.jp が From のドメインと一致しているので、アライメントも満たします。したがって DMARC は成功であり、p=reject のポリシーが適用される対象にはなりません。
    why:
      - 両方の成功が必要という点が誤りです。片方の成功とアライメントで DMARC は成功になります。
      - SPF の失敗だけで DMARC が失敗になるわけではありません。DKIM 側の成功とアライメントで補えます。
      - 「SPF が失敗すれば常に失敗」という規則は存在しません。DMARC は2つの認証の片方の成功を認める設計です。
      - p=reject は「DMARC が失敗したメール」を拒否するポリシーです。今回 DMARC は成功しているため、無条件の拒否には当たりません。
      - 正解です。DKIM の成功とアライメントの成立により、DMARC の要求は満たされています。
    know: DMARC の合否は「SPF か DKIM の成功」＋「アライメント」の組合せで決まる。転送で SPF が壊れても DKIM が残れば合格し得る、といった実務上の挙動もこの規則から説明できる。
    terms:
      - DMARC
      - SPF
      - DKIM
    verify:
      manual: DMARC の判定規則（SPF 又は DKIM の成功とアライメント）を与えられた認証結果に適用し、DKIM 成功かつ d= が From ドメインと一致するため合格になることを確認した。
  - id: B-SEC-106
    topic:
      - B5
      - 11-1-8-3
    diff: 2
    scope: 科目B「情報セキュリティ」の認証への攻撃と対策。多要素認証のプッシュ承認を繰り返し送って誤承認を誘う手口（MFA疲労）の対策を選ぶ問題で、範囲内。
    prereq: プッシュ型の多要素認証の仕組みと、正規の承認要求と攻撃者の要求を見分ける手掛かり
    q: |
      A社の従業員のスマートフォンに、深夜、認証アプリからのプッシュ承認要求が30分間に約20回届いた。従業員が「何かの間違いだろう」と考えて承認した直後、海外のIPアドレスからのログインが成功した。この手口への対策として、最も適切なものはどれか。
    c:
      - 承認要求が届いたら、理由にかかわらず全て拒否するよう全従業員に周知する
      - ログインの試行があるたびに、情報システム部へメールで通知する
      - 承認要求の画面にログイン元の場所や端末を表示し、番号の照合（ナンバーマッチング）を必須にする
      - プッシュ通知をやめ、SMSで送信される確認コードの入力に切り替える
      - パスワードの最小桁数を増やし、定期的な変更を全従業員に強制する
    a: ウ
    exp: |
      これは、攻撃者が盗んだパスワードでログインを繰り返し、正規の利用者に大量の承認要求を送り付けて、うんざりした利用者に承認させるMFA疲労（プッシュ疲労）と呼ばれる手口です。対策の本質は「自分の操作による要求かどうかを利用者が判別できるようにすること」で、ログイン元の表示や、ログイン画面に表示された番号と同じ番号を選ばせるナンバーマッチングが有効です。場当たり的な承認では番号が分からず、攻撃を成立させられません。パスワードの強化は、すでにパスワードが突破されている前提の手口には効きません。
    why:
      - 全て拒否する周知は、正規の業務ログインまで妨げ、運用として成り立ちません。判別できる仕組みの導入が先です。
      - 通知は事後の検知には役立ちますが、誤承認そのものを防ぐ仕組みにはなりません。
      - 正解です。要求の出所を確認させ、番号の照合を必須にすることで、攻撃者の要求への誤った承認を防げます。
      - SMSコードへの切替えは、SIMの乗っ取りやフィッシングへの弱さがあり、判別可能性という本質的な対策にもなりません。
      - パスワードは既に攻撃者の手に渡っている前提であり、桁数や変更頻度ではプッシュの誤承認を防げません。
    know: MFA疲労への対策は、ナンバーマッチングや承認要求の回数制限、短時間の大量要求の検知である。多要素認証も「承認の判別可能性」がなければ、利用者の疲労を突かれて突破され得る。
    terms:
      - 多要素認証
      - フィッシング
    verify:
      manual: 手口の成立条件（パスワード突破済み、利用者が要求を判別できない）を特定し、各選択肢がその条件を崩すかを照合した。判別可能性を与えるのはナンバーマッチングだけであることを確認した。
  - id: B-SEC-107
    topic:
      - B5
      - 11-5-5
    diff: 3
    scope: 科目B「情報セキュリティ」のWebアプリケーションの脆弱性。URLのパラメータ書換えで他人の情報が見える事象から、認可の不備（IDOR）を他の脆弱性と区別し、修正方法を選ぶ問題で、範囲内。
    prereq: 認証（本人確認）と認可（権限の確認）の違い、代表的なWeb脆弱性（SQLインジェクション、XSS、CSRF、セッション固定）の成立条件
    hard: 入力値の検証不足に見える事象が、実は「ログイン済み利用者に他人のデータを出すかどうか」のサーバ側認可の欠落であることを、他の脆弱性の成立条件と切り分けて判断する必要がある。
    q: |
      A社の会員サイトでは、ログイン後のマイページが /mypage?id=10023 のようなURLで表示される。ある利用者が、URLの id を 10024 に書き換えたところ、別の利用者の氏名・住所・電話番号が表示された。この脆弱性の種類と修正方法の組合せとして、適切なものはどれか。
    c:
      - セッション固定であり、ログイン時にセッションIDを再発行する
      - CSRFであり、リクエストにトークンを含めて検証する
      - SQLインジェクションであり、入力値をエスケープ処理してからデータベースへ渡す
      - クロスサイトスクリプティングであり、画面への出力時にエンコードを行う
      - 認可の不備であり、サーバ側で、要求されたデータがログイン中の利用者本人のものか検証する
    a: オ
    exp: |
      この利用者は正しくログインできており、問題は「認証」ではなく「認可」にあります。サーバが、id で指定されたデータの持ち主がログイン中の利用者本人であるかを確認せずに表示してしまったため、パラメータを書き換えるだけで他人の情報が見えました。これは安全でない直接オブジェクト参照（IDOR）と呼ばれる認可の不備で、修正はサーバ側での所有者チェックです。SQLインジェクションやXSSなど入力・出力処理の問題ではなく、トークンやセッションIDの対策でも防げません。
    why:
      - セッション固定は、攻撃者が用意したセッションIDを使わせる問題です。セッションの再発行では、認可の欠落は直りません。
      - CSRFは、ログイン中の利用者のブラウザに意図しないリクエストを送らせる攻撃です。本人がURLを書き換えた事象とは仕組みが異なります。
      - SQLインジェクションは、入力がデータベースの命令として解釈される問題です。今回、命令の混入はなく、正規の問合せで他人のデータが返っています。
      - クロスサイトスクリプティングは、他人のブラウザでスクリプトが実行される問題です。今回の事象とは関係がありません。
      - 正解です。ログイン済みの利用者に他人のデータを返してしまうのは認可の欠落であり、サーバ側の所有者検証が修正になります。
    know: 認可の不備は「ログインできるか」ではなく「そのデータを見てよいか」の確認漏れ。画面やURLで隠すだけでは不十分で、データへのアクセスのたびにサーバ側で所有者や権限を検証する必要がある。
    terms:
      - アクセス制御
      - 脆弱性
    verify:
      manual: 事象の成立条件（認証は正常、パラメータ指定の他人のデータを認可なしで返却）を各脆弱性の定義と照合し、認可の不備だけが一致すること、他の4つは成立条件を満たさないことを確認した。
  - id: B-SEC-108
    topic:
      - B5
      - 11-1-8-3
    diff: 4
    scope: 科目B「情報セキュリティ」のパスワード強度の評価。文字種と桁数からパスワード空間を求め、オフラインの総当たりに要する時間を概算する問題で、範囲内。
    prereq: パスワードの組合せ数 ＝ 文字種の数 ^ 桁数 という指数の計算
    hard: 36 の 8 乗という大きな組合せ数を概数で扱い、毎秒の試行回数で割って秒から分へ換算する、指数と単位換算の複合計算が必要になる。
    q: |
      あるシステムのパスワードは、英小文字と数字からなる 8 桁で構成される（各桁は 36 通り）。ハッシュ化されたパスワードのファイルが漏洩し、攻撃者が 1 秒間に 10 の 10 乗回のハッシュ計算を行える環境で総当たりを試みる。すべての組合せを試し尽くすのに要する時間は、最大でおよそ何分か。
    c:
      - 約8時間
      - 約2分
      - 約5分
      - 約47分
      - 約3日
    a: ウ
    exp: |
      パスワードの総組合せ数は、36 の 8 乗です。36 の 8 乗は約 2.82 × 10 の 12 乗通りです。これを 1 秒間に 10 の 10 乗回試せる速度で割ると、約 282 秒、すなわち約 4.7 分になり、およそ 5 分で試し尽くせてしまいます。桁数が 1 つ増えると組合せ数は 36 倍になるため、桁数の不足は指数関数的に効いてきます。ハッシュ化していても、この規模の空間ではオフライン攻撃への耐性は低く、桁数の確保や多要素認証が欠かせません。
    why:
      - 試行速度を 1 秒間に 10 の 8 乗回と読み違えた場合の値（約 28,211 秒）です。指数の読み違いに注意が必要です。
      - 平均すると半分の組合せで見つかることを織り込んだ値です。本問は「すべての組合せを試し尽くす」最大の時間を問うています。
      - 正解です。36 の 8 乗（約 2.82 × 10 の 12 乗）を 10 の 10 乗で割り、約 282 秒 ≒ 約 5 分です。
      - 試行速度を 1 秒間に 10 の 9 乗回と読み違えた場合の値（約 2,821 秒）です。問題文の速度は 10 の 10 乗回です。
      - 試行速度を 1 秒間に 10 の 7 乗回と読み違えた場合の値（約 282,111 秒）です。実際の速度より 1,000 倍遅く見積もっています。
    know: オフライン攻撃では試行速度が桁違いに大きいため、パスワード空間（文字種 ^ 桁数）が小さいと短時間で破られる。強度は桁数に指数関数的に依存し、ソルトや計算コストの高いハッシュ関数で速度を落とす対策も併用される。
    terms:
      - 総当たり攻撃
      - ブルートフォース攻撃
    verify:
      manual: 36 の 8 乗は 2,821,109,907,456 通り（約 2.82 × 10 の 12 乗）。これを毎秒 10 の 10 乗回で割ると約 282 秒、約 4.7 分となり、「約5分」と一致する。誤答は速度の指数の読み違い（10 の 9 乗なら約 2,821 秒で約47分、10 の 8 乗なら約 28,211 秒で約8時間、10 の 7 乗なら約 282,111 秒で約3日）と、平均で半分の組合せで見つかる場合（約2分）に対応することを確認した。
