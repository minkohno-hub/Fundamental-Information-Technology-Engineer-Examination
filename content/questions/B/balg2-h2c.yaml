reviewed:
  at: '2026-10-30'
  method: 独立レビュー担当が解答を伏せて全問を自力トレースし、正答の一意性・誤答の検証と既存問題との重複確認を実施。B-ALG-323 の誤答解説の導出を、実際に選択肢の値を生む数え方・計算へ差し替えて再確認で整合を検証済み
questions:
  - id: B-ALG-317
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」のキュー。エンキューとデキューの組合せによる出力順のトレースであり、範囲内。
    prereq: キューは先入れ先出し（FIFO）であること、大域変数による状態の保持
    hard: エンキューとデキューが混ざるため、各時点のキューの中身を保持しながら追う必要がある。スタック（後入れ先出し）との違いが、具体的な値の動きで問われる。
    q: |
      次のプログラムを実行したとき、手続 test が出力する 3 つの値を出力順に並べたものとして、正しい答えを解答群の中から選べ。ここで、配列の要素番号は 1 から始まり、配列の引数は参照渡しである。

      キューは、配列 q と、大域変数 head（先頭の位置）と tail（末尾の次の位置）で表す。手続 enq は末尾に値を追加し、関数 deq は先頭の値を取り出して返す。
    code: |
      大域: 整数型: head ← 1, tail ← 1

      ○enq(整数型の配列: q, 整数型: v)
        q[tail] ← v
        tail ← tail ＋ 1

      ○整数型: deq(整数型の配列: q)
        整数型: r
        r ← q[head]
        head ← head ＋ 1
        return r

      ○test()
        整数型の配列: q ← {8個の0}
        enq(q, 4)
        enq(q, 9)
        deq(q) を出力する
        enq(q, 6)
        deq(q) を出力する
        deq(q) を出力する
    c:
      - 9 4 6
      - 4 6 9
      - 9 6 4
      - 6 9 4
      - 4 9 6
    a: オ
    exp: |
      キューの変化は、次のように進みます。

      - enq(4): {4}
      - enq(9): {4, 9}
      - deq: 先頭の 4 が取り出されます → 出力 4、中身は {9}
      - enq(6): {9, 6}
      - deq: 先頭の 9 が取り出されます → 出力 9、中身は {6}
      - deq: 残りの 6 が取り出されます → 出力 6

      出力は「4 9 6」です。先に入れた値が先に出る（先入れ先出し）ことが、出力順に表れています。
    why:
      - 取り出した順序のうち、最初の 2 つを入れ替えた並びです。キューでは、入れた順（4、9、6）に取り出されます。
      - 2 回目の deq で、先に入っていた 9 ではなく、後から入れた 6 が出たとする並びです。先頭にある 9 が先に出ます。
      - 後入れ先出し（スタックの動き）で取り出した場合の並びです。キューは先入れ先出しであり、deq は途中で行われています。
      - 全てのエンキューが終わってから、逆順に取り出した場合の並びです。キューでは、入れた順に取り出されます。
      - 正解です。各 deq で、その時点の先頭の値が出力されています。
    know: キューは先入れ先出しであり、エンキューとデキューが混ざる場合は「その時点の先頭」だけが取り出される。スタックとの対比で、途中状態を保持しながら追うことが要点である。
    terms:
      - キュー
    verify:
      result:
        call: test
        args: []
        of: output
    sim:
      entry: test
      args: []
  - id: B-ALG-318
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の二分探索の比較回数。中央の要素との比較で範囲を半分にしながら探す過程のトレースであり、範囲内。
    prereq: 二分探索の範囲の絞り方、中央の添字の計算
    hard: 比較のたびに範囲がどう絞られるかを、中央の値と一緒に追う必要がある。線形探索の比較回数との違いも問われる。
    q: |
      次のプログラムを実行したときの、関数 bsearch(a, key) の戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      関数 bsearch は、昇順に整列された配列 a から key を二分探索し、key と要素を比較した回数を返す。a ＝ {3, 7, 11, 15, 19, 23, 27, 31}、key ＝ 23 として bsearch(a, key) を呼び出す。
    code: |
      ○整数型: bsearch(整数型の配列: a, 整数型: key)
        整数型: lo, hi, mid, cnt
        lo ← 1
        hi ← aの要素数
        cnt ← 0
        while (lo ≦ hi)
          mid ← (lo ＋ hi) ÷ 2 の商
          cnt ← cnt ＋ 1
          if (a[mid] ＝ key)
            return cnt
          elseif (a[mid] ＜ key)
            lo ← mid ＋ 1
          else
            hi ← mid － 1
          endif
        endwhile
        return cnt
    c:
      - '6'
      - '8'
      - '2'
      - '3'
    a: ウ
    exp: |
      比較の過程は、次のように進みます。

      - 1 回目: lo ＝ 1、hi ＝ 8、mid ＝ 4、a[4] ＝ 15 ＜ 23 なので、lo を 5 にします。
      - 2 回目: lo ＝ 5、hi ＝ 8、mid ＝ 6、a[6] ＝ 23 で一致します。

      比較は 2 回で終わり、戻り値は 2 です。線形探索であれば、23 は 6 番目の要素なので 6 回の比較が必要でした。
    why:
      - 線形探索で先頭から探した場合の比較回数です。本問は二分探索です。
      - 配列の全要素と比較した場合の回数です。二分探索では、比較のたびに範囲が半分になります。
      - 正解です。中央との比較 2 回で見つかります。
      - 中央の添字を切り上げで求めた場合の回数です（中央が 5 番目、7 番目、6 番目と進み、比較は 3 回になります）。本問のプログラムは、中央の添字を切り捨てで求めます。
    know: 二分探索の比較回数は、範囲が半分になる過程で決まる。中央の値の推移を追うことが、比較回数の数え上げの要点である。
    terms:
      - 二分探索
    verify:
      result:
        call: bsearch
        args:
          - - 3
            - 7
            - 11
            - 15
            - 19
            - 23
            - 27
            - 31
          - 23
        of: return
    sim:
      entry: bsearch
      args:
        - - 3
          - 7
          - 11
          - 15
          - 19
          - 23
          - 27
          - 31
        - 23
  - id: B-ALG-319
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」のハッシュ探索と削除マーク。削除された位置に残された印を空きと区別して、探索を続けるプログラムのトレースであり、範囲内。
    prereq: 線形探査法では、格納も探索もハッシュ値の位置から順にたどること、キーを削除した位置を単なる空きに戻すと、その先に格納されたキーが探索で見つからなくなるため、削除マークを残すこと
    hard: 削除マーク（－2）は「空き（0）」でも「目的のキー」でもないため、探索を止めずに通り過ぎる必要があることを読み取る必要がある。
    q: |
      次のプログラムを実行したときの、関数 searchLin(a, 34) の戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      ハッシュ表は、要素数 8 の配列 a で表し、ハッシュ関数は h(k) ＝ (k mod 8) ＋ 1、衝突した場合は次の位置を順に調べる（線形探査）。空の位置には 0 が入っている。a ＝ {0, 0, 10, 18, －2, 34, 0, 0} であり、位置 5 の －2 は、格納されていたキー 26 が削除されたことを示す印（削除マーク）である。関数 searchLin は、キーを探して、見つけた位置を返し、見つからなければ 0 を返す。
    code: |
      ○整数型: searchLin(整数型の配列: a, 整数型: key)
        整数型: p
        p ← (key mod 8) ＋ 1
        while (a[p] ≠ 0 and a[p] ≠ key)
          p ← p ＋ 1
        endwhile
        if (a[p] ＝ key)
          return p
        endif
        return 0
    c:
      - '6'
      - '3'
      - '0'
      - '5'
    a: ア
    exp: |
      キー 34 のハッシュ値は （34 mod 8） ＋ 1 ＝ 3 です。探査の経過は次のとおりです。
      - 位置 3： 10（キーではない）→ 次へ
      - 位置 4： 18（キーではない）→ 次へ
      - 位置 5： －2（削除マーク）→ 空きではないため、探索を続けます
      - 位置 6： 34（一致）→ 位置 6 を返します
      削除マークを空きとして扱い、位置 5 で探索を止めてしまうと、その先に格納された 34 が見つからなくなります。マークを残すのは、この探索の継続のためです。
    why:
      - 正解です。削除マークを通り過ぎて、位置 6 でキー 34 が見つかります。
      - ハッシュ値そのものの位置です。その位置には、別のキー 10 が格納されています。
      - 削除マークを空きと誤解し、位置 5 で探索を打ち切った場合の値です。その先に格納されたキーが見つからなくなります。
      - 削除されたキー 26 があった位置です。マークは「ここにキーがあった」という印であり、探索はここを通り過ぎます。
    know: 線形探査法の表でキーを削除するときは、空きに戻すのではなく削除マークを残す。探索が、マークの先にあるキーを探し続けられるようにするためであり、格納と探索と削除は、同じ探査の規則で結ばれている。
    terms:
      - ハッシュ法
      - 線形探査法
      - 削除マーク
    verify:
      result:
        call: searchLin
        args:
          - - 0
            - 0
            - 10
            - 18
            - -2
            - 34
            - 0
            - 0
          - 34
        of: return
    sim:
      entry: searchLin
      args:
        - - 0
          - 0
          - 10
          - 18
          - -2
          - 34
          - 0
          - 0
        - 34
  - id: B-ALG-320
    topic:
      - B1
      - 2-2-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の空欄補充（配列の左回転）。先頭の要素を退避し、残りを前にずらして、退避した要素を末尾に置くプログラムの空欄の組合せを選ぶ問題であり、範囲内。
    prereq: 配列の要素のずらしは、退避用の変数がないと上書きで失われること、ずらす範囲は末尾の手前までであること
    hard: 繰返しの上限（末尾の手前まで）と、末尾へ置く値（退避した先頭の要素）の両方を満たす組合せを選ぶ必要がある。ずらした後の a[1] は元の2番目の要素に変わっている点が、誤答の判別の鍵になる。
    q: |
      次のプログラム中の【a】と【b】に入れる正しい答えの組合せを、解答群の中から選べ。ここで、配列の要素番号は 1 から始まり、配列の引数は参照渡しである。

      関数 rotThird は、配列 a の要素を左へ 1 つ回転させ（先頭の要素が末尾へ移る）、回転後の a[3] を返す。
    code: |
      ○整数型: rotThird(整数型の配列: a)
        整数型: i, t
        t ← a[1]
        for (i を 1 から 【a】 まで 1 ずつ増やす)
          a[i] ← a[i ＋ 1]
        endfor
        【b】
        return a[3]
    c:
      - a：aの要素数 － 1，b：a[aの要素数] ← a[1]
      - a：aの要素数 － 1，b：a[1] ← t
      - a：1，b：a[aの要素数] ← t
      - a：aの要素数 － 1，b：a[aの要素数] ← t
      - a：aの要素数 － 2，b：a[aの要素数] ← t
    fills:
      - a: aの要素数 － 1
        b: a[aの要素数] ← a[1]
      - a: aの要素数 － 1
        b: a[1] ← t
      - a: '1'
        b: a[aの要素数] ← t
      - a: aの要素数 － 1
        b: a[aの要素数] ← t
      - a: aの要素数 － 2
        b: a[aの要素数] ← t
    a: エ
    exp: |
      ずらす範囲は、a[i ＋ 1] が範囲内にある末尾の手前（要素数 － 1）までです。末尾には、退避してあった元の先頭の要素 t を置きます。例えば {3, 5, 2, 6} は {5, 2, 6, 3} になり、a[3] は 6 です。繰返しの途中で a[1] は元の 2 番目の要素に書き換わっているため、末尾に a[1] を置く書き方では誤りになります。
    why:
      - b が a[1] では、ずらした後の a[1]（元の 2 番目の要素）が末尾に入ってしまいます。置くのは退避した t です。
      - b が a[1] ← t では、先頭に退避値が戻ってしまい、回転になりません。
      - a が 1 では、ずらしが 1 要素分しか行われず、残りの要素が元のままになります。
      - 正解です。ずらす範囲と、末尾へ置く退避値の組合せが正しくなっています。
      - a の上限が 1 つ小さいと、末尾の手前の要素がずらせず、回転が不完全になります。
    know: 要素のずらしは、退避・ずらし・復帰の3段階で構成される。ずらす範囲の上限と、退避した値を使う位置が、空欄の判別の要点である。
    terms:
      - 配列
    verify:
      cases:
        - call: rotThird
          args:
            - - 3
              - 5
              - 2
              - 6
          expect: 6
        - call: rotThird
          args:
            - - 1
              - 2
              - 3
              - 4
              - 5
          expect: 4
        - call: rotThird
          args:
            - - 4
              - 8
              - 1
              - 6
              - 9
          expect: 6
        - call: rotThird
          args:
            - - 9
              - 7
              - 5
          expect: 9
  - id: B-ALG-321
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」のポインタによる要素のたどり。次の要素の位置を表す配列を使って、要素を順にたどるプログラムのトレースであり、範囲内。
    prereq: 要素の並び順は、配列の添字順とは限らず、リンク（次の位置）で決まること
    hard: たどる順序が、値の配列と次の位置の配列の2つを交互に参照して決まることを追う必要がある。添字順に読む誤りに注意が要る。
    q: |
      次のプログラムを実行したときの、関数 third(a, nx) の戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      配列 a は値、配列 nx は「次の要素の位置」を保持し、0 は終わりを表す。要素 1 からたどり始め、3 番目にたどる要素の値を、関数 third が返す。a ＝ {10, 20, 30, 50}、nx ＝ {2, 4, 0, 3} とする。
    code: |
      ○整数型: third(整数型の配列: a, 整数型の配列: nx)
        整数型: i, c
        i ← 1
        c ← 1
        while (c ＜ 3)
          i ← nx[i]
          c ← c ＋ 1
        endwhile
        return a[i]
    c:
      - '50'
      - '20'
      - '30'
      - '40'
    a: ア
    exp: |
      たどる順序は、次のようになります。

      - 1 番目: 要素 1、値 10
      - 2 番目: nx[1] ＝ 2 により要素 2、値 20
      - 3 番目: nx[2] ＝ 4 により要素 4、値 50

      戻り値は 50 です。要素の順序は添字順ではなく、nx の指す先で決まります。なお、4 番目にたどるのは nx[4] ＝ 3 により要素 3（値 30）です。
    why:
      - 正解です。たどる順序は要素 1 → 2 → 4 で、3 番目は値 50 です。
      - 2 番目にたどる要素の値です。問われているのは 3 番目です。
      - 配列の添字順に 3 番目の要素（a[3]）の値です。たどる順序は nx で決まります。
      - 配列には存在しない値です。戻り値は、実際にたどった要素の値です。
    know: リンクでつながれた要素の順序は、添字の順序とは独立である。値の配列とリンクの配列を交互にたどることが、この種のトレースの要点である。
    terms:
      - 配列
    verify:
      result:
        call: third
        args:
          - - 10
            - 20
            - 30
            - 50
          - - 2
            - 4
            - 0
            - 3
        of: return
    sim:
      entry: third
      args:
        - - 10
          - 20
          - 30
          - 50
        - - 2
          - 4
          - 0
          - 3
  - id: B-ALG-322
    topic:
      - B2
      - 2-1-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の2次元配列の転置。行と列を入れ替えた配列を作るプログラムのトレースであり、範囲内。
    prereq: 転置は、要素の位置（i, j）を（j, i）に移す操作であること
    hard: 転置後の配列の添字と、元の配列の添字の対応を、具体的な要素で追う必要がある。行数と列数が異なる場合の形の変化も含まれる。
    q: |
      次のプログラムを実行したときの、戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      関数 transposed は、2 行 3 列の行列 m を転置した 3 行 2 列の行列を作り、その 1 行 2 列の要素を返す。m は 1 行目 {1, 2, 3}、2 行目 {4, 5, 6} とする。
    code: |
      ○整数型: transposed(整数型の2次元配列: m)
        整数型の2次元配列: t ← {{0, 0}, {0, 0}, {0, 0}}
        整数型: i, j
        for (i を 1 から 2 まで 1 ずつ増やす)
          for (j を 1 から 3 まで 1 ずつ増やす)
            t[j][i] ← m[i][j]
          endfor
        endfor
        return t[1][2]
    c:
      - '2'
      - '3'
      - '4'
      - '5'
    a: ウ
    exp: |
      転置では、元の要素 m[i][j] が t[j][i] へ移ります。

      - t[1] は、元の 1 列目 {1, 4}
      - t[2] は、元の 2 列目 {2, 5}
      - t[3] は、元の 3 列目 {3, 6}

      戻り値 t[1][2] は、元の m[2][1] であり、値は 4 です。
    why:
      - 元の m[1][2] の値であり、転置で位置が変わるため、t[1][2] とは一致しません。t[1][2] は元の m[2][1] です。
      - 元の m[1][3] の値です。t[1][2] とは行も列も異なります。
      - 正解です。t[1][2] は元の m[2][1] で、値は 4 です。
      - 元の m[2][2] の値です。転置しても位置が変わらない対角の要素であり、t[1][2] とは異なります。
    know: 転置は行と列の役割を入れ替える操作であり、要素の移動は添字の交換（i, j）→（j, i）で表される。非正方行列では形（行数と列数）も入れ替わる点が要点である。
    terms:
      - 2次元配列
    verify:
      result:
        call: transposed
        args:
          - - - 1
              - 2
              - 3
            - - 4
              - 5
              - 6
        of: return
    sim:
      entry: transposed
      args:
        - - - 1
            - 2
            - 3
          - - 4
            - 5
            - 6
  - id: B-ALG-323
    topic:
      - B2
      - 2-3-1-6
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の最大公約数を引き算の繰返しで求める方法。大きい方から小さい方を引く反復のトレースであり、範囲内。
    prereq: 2つの数が等しくなったところが最大公約数であること（引き算版のユークリッド互除法）
    hard: 2つの数が互いに入れ替わりながら近づいていく過程を追う必要がある。剰余を使う方法と結果は同じでも、手順の段数が異なる点も含まれる。
    q: |
      次のプログラムを実行したときの、関数 subGcd(a, b) の戻り値を、解答群の中から選べ。

      関数 subGcd は、引き算の繰返しで最大公約数を返す。a ＝ 12、b ＝ 18 として subGcd(a, b) を呼び出す。
    code: |
      ○整数型: subGcd(整数型: a, 整数型: b)
        while (a ≠ b)
          if (a ＞ b)
            a ← a － b
          else
            b ← b － a
          endif
        endwhile
        return a
    c:
      - '9'
      - '3'
      - '6'
      - '2'
    a: ウ
    exp: |
      反復は、次のように進みます。

      - (12, 18): b のほうが大きいので、b ← 18 － 12 ＝ 6 → (12, 6)
      - (12, 6): a のほうが大きいので、a ← 12 － 6 ＝ 6 → (6, 6)
      - 2つの数が等しくなったので終了します。

      戻り値は 6 です。12 と 18 の最大公約数と一致します。
    why:
      - 大きい方の数 18 を 2 で割った値です。引き算の繰返しの手続に、割る操作は現れません。
      - 反復の過程に現れる数の組を数えた値（(12, 18)、(12, 6)、(6, 6) の 3 組）です。問われているのは戻り値（最大公約数）です。
      - 正解です。引き算を繰り返すと 6 に揃います。
      - 反復の回数を数えた値です。問われているのは戻り値（最大公約数）です。
    know: 最大公約数は、剰余を使う方法だけでなく、引き算の繰返しでも求められる。2つの数が等しくなるまで大きい方を減らす、という終了の形が要点である。
    terms:
      - 最大公約数
    verify:
      result:
        call: subGcd
        args:
          - 12
          - 18
        of: return
    sim:
      entry: subGcd
      args:
        - 12
        - 18
  - id: B-ALG-324
    topic:
      - B1
      - 2-2-2-1
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」のバブルソートの完了後の状態。隣接交換を繰り返して整列を完了させた後の、配列の先頭部分の出力のトレースであり、範囲内。
    prereq: バブルソートは、走査を繰り返すことで全体が整列すること
    hard: 走査が複数回にわたるため、各回の走査の後の状態を順に追う必要がある。1 回の走査だけでは整列が完了しない配列である点が、判別の鍵になる。
    q: |
      次のプログラムを実行したとき、手続 test が出力する 3 つの値を出力順に並べたものとして、正しい答えを解答群の中から選べ。ここで、配列の要素番号は 1 から始まり、配列の引数は参照渡しである。

      手続 sort は、バブルソートで配列を昇順に整列する。
    code: |
      ○sort(整数型の配列: a)
        整数型: i, j, t
        for (i を 1 から aの要素数 － 1 まで 1 ずつ増やす)
          for (j を 1 から aの要素数 － i まで 1 ずつ増やす)
            if (a[j] ＞ a[j ＋ 1])
              t ← a[j]
              a[j] ← a[j ＋ 1]
              a[j ＋ 1] ← t
            endif
          endfor
        endfor

      ○test()
        整数型の配列: d ← {6, 2, 9, 4}
        sort(d)
        d[1] を出力する
        d[2] を出力する
        d[3] を出力する
    c:
      - 2 6 4
      - 2 4 9
      - 6 2 9
      - 4 6 9
      - 2 4 6
    a: オ
    exp: |
      走査は、次のように進みます。

      - 1 回目: {2, 6, 4, 9}（6 と 2、9 と 4 が交換）
      - 2 回目: {2, 4, 6, 9}（6 と 4 が交換）
      - 3 回目: 交換なし

      整列後の配列は {2, 4, 6, 9} であり、出力は d[1] ＝ 2、d[2] ＝ 4、d[3] ＝ 6 の順で、「2 4 6」です。
    why:
      - 1 回目の走査だけで終わらせた場合の並びです。整列は 2 回目の走査まで必要です。
      - 整列後の d[1]、d[2]、d[4] を読んだ並びです。出力は先頭から 3 要素（d[1] から d[3]）です。
      - 交換前の元の並びの先頭です。戻り値は整列の後の配列から読みます。
      - 整列後の配列の末尾 3 要素を読んだ並びです。問われているのは先頭の 3 要素です。
      - 正解です。整列後の先頭 3 要素は 2、4、6 です。
    know: バブルソートは、走査の回数だけ整列が進み、最後尾から順に確定していく。途中状態と完了状態を区別できることが、整列のトレースの要点である。
    terms:
      - バブルソート
    verify:
      result:
        call: test
        args: []
        of: output
    sim:
      entry: test
      args: []
