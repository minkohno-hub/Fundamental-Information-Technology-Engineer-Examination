questions:
  - id: B-SEC-125
    topic: [B5, 11-5-2]
    diff: 3
    scope: 11-5-2 多要素認証の評価。知識・所有・生体という認証の 3 要素のうち、異なる要素の組合せになっているかを判定する問題
    prereq: 認証の要素には、知識（パスワードなど）、所有（IC カードやスマートフォンなど）、生体（指紋など）があり、多要素認証は異なる種類の要素を組み合わせること
    hard: パスワードと PIN のような、見かけは 2 つでも同じ種類（知識）の組合せは多要素にはならない、という判定が求められる。
    q: |
      A社のシステムでは、ログインにパスワードと PIN（暗証番号）の入力を求めている。これを多要素認証に強化する変更として、適切なものはどれか。
    c:
      - パスワード（知識）に加えて、利用者のスマートフォンに表示されるワンタイムコード（所有）を求める
      - パスワードの最小の長さを、現在の 8 文字から 12 文字に延ばす
      - パスワードに加えて、秘密の質問への回答を求める
      - パスワードの有効期間を、90 日から 30 日に短くする
    a: ア
    exp: |
      多要素認証は、知識・所有・生体という異なる種類の要素を組み合わせる認証です。現在のパスワードと PIN は、どちらも知識の要素であり、種類としては 1 つだけです。スマートフォンに表示されるワンタイムコードは、その機器を持っていること（所有）の要素に当たるため、知識との組合せで多要素になります。パスワードの長さや有効期間の変更、秘密の質問の追加は、いずれも知識の要素の中での変更であり、要素の種類は増えません。
    why:
      - 正解です。知識と所有という、異なる種類の要素の組合せです。
      - パスワードを強くする変更であり、要素の種類は知識のままです。
      - 秘密の質問も知識の要素であり、種類は増えません。
      - 有効期間の変更は、知識の要素の運用の変更であり、要素の種類は増えません。
    know: 多要素認証の要点は、「いくつの質問に答えるか」ではなく「異なる種類の要素をいくつ組み合わせるか」である。知識・所有・生体の分類が、判定の鍵である。
    terms: [多要素認証, 認証]
    verify:
      manual: パスワードとPINがともに知識の要素であること、スマートフォンのワンタイムコードが所有の要素であり、知識との組合せで多要素認証になることを、他の選択肢（長さ・秘密の質問・有効期間はいずれも知識の要素内の変更）との対比で確認した。

  - id: B-SEC-126
    topic: [B5, 11-2-1]
    diff: 3
    scope: 11-2-1 特権 ID の管理。管理者権限を持つアカウントを、担当者の異動や退職に合わせて棚卸しし、不要な権限を残さない運用の判断
    prereq: 特権 ID は強力な権限を持つため、利用者の範囲を必要最小限にし、担当の変更に合わせて見直すこと
    hard: 問題が「アカウントの有無」ではなく「権限の残存」にあることを読み取り、棚卸しという運用の対処を結び付ける必要がある。
    q: |
      A社で情報システム部門の監査を行ったところ、1 年前に他部門へ異動した社員が、サーバの管理者権限を持つ特権 ID を今も使える状態であることが分かった。特権 ID の管理として、適切な対応はどれか。
    c:
      - 特権 ID の利用者を定期的に棚卸しし、現在の業務で必要でない権限は速やかに取り消す運用にする。今回の権限も直ちに取り消す
      - 異動した社員は信頼できるため、そのまま使える状態にしておく
      - 特権 ID のパスワードを変更すれば、権限が残っていても問題はない
      - 特権 ID の数を増やし、多くの社員で権限を分け合うようにする
    a: ア
    exp: |
      特権 ID は、システム全体に影響する操作ができる強力なアカウントです。管理の要点は、使える人を現在の業務で必要な範囲に限ること（最小権限）と、異動や退職のたびに見直すことです。定期的な棚卸しにより、不要になった権限を取り消す運用が適切です。信頼を理由に残すことは、内部の誤用や、アカウントが乗っ取られた場合の被害の大きさを考えると不適切です。パスワードの変更は、本人が正規に知っている場合には対処になりません。
    why:
      - 正解です。棚卸しと不要な権限の取消しが、特権 ID の管理です。
      - 信頼の有無にかかわらず、不要な権限を残すことは、最小権限の考え方に反します。
      - 本人が正規の利用者である以上、パスワードの変更では権限の残存は解消されません。
      - 権限を持つ人を増やすことは、リスクを広げる方向であり、対処にはなりません。
    know: 特権 ID の管理の要点は、「必要最小限の人に、必要な間だけ」である。人の異動と権限の見直しを結び付ける運用が鍵である。
    terms: [特権ID, 最小権限]
    verify:
      manual: 異動した社員の管理者権限が残っている問題に対して、定期的な棚卸しと不要な権限の取消しが適切であることを、信頼を理由とする放置・パスワード変更・権限者の拡大との対比で確認した。

  - id: B-SEC-127
    topic: [B5, 11-4-1-2]
    diff: 3
    scope: 11-4-1-2 ビジネスメール詐欺への業務プロセス面の対策。送金を伴う依頼について、メール以外の経路での確認と、複数人による承認を組み合わせる判断
    prereq: 実在の取引先や経営者を装ったメールで送金を指示する詐欺（ビジネスメール詐欺）では、メール自体の見た目では真偽を判断しにくいため、依頼の確認をメール以外の経路で行う手続が有効であること
    hard: 技術的な対策（フィルタや学習）だけではなく、「送金の前に別の経路で確認する」「一人で送金を完結させない」という業務手続の設計が要点であることを読み取る必要がある。
    q: |
      A社で、実在の取引先の担当者を装ったメールが経理担当者に届き、「振込先の口座が変更になったので、今回の支払は新しい口座へ」と指示する事案があった。口座の変更が事実でなかったため実害はなかったが、同種の詐欺への対策として、業務の進め方として適切なものはどれか。
    c:
      - 振込先の変更や送金の依頼は、メールだけで判断せず、あらかじめ登録された電話番号への電話など、メール以外の経路で依頼元に確認する。あわせて、送金は申請者と承認者を分ける
      - 経理担当者に、差出人のメールアドレスを注意深く確認するよう徹底する
      - 取引先からのメールは、全て迷惑メールフォルダに自動で振り分ける
      - 振込先の変更のメールが届いたら、確認のため、そのメールの返信で「本当ですか」と問い合わせる
    a: ア
    exp: |
      ビジネスメール詐欺は、実在の人物を装い、アドレスや文面も本物らしく作られるため、受け取った人の注意力だけに頼る対策には限界があります。要点は、業務の手続そのものに歯止めを組み込むことです。振込先の変更のような重要な依頼は、メールとは別の経路（登録済みの電話番号への電話など）で事実を確認し、送金の申請と承認を別の人が行うことで、一人の判断ミスや騙されが、そのまま送金につながらないようにします。同じメールへの返信では、攻撃者の用意した宛先に届くだけで、確認にはなりません。
    why:
      - 正解です。別の経路での確認と、申請と承認の分離が、手続としての歯止めになります。
      - アドレスは本物らしく偽装されるため、注意深く見ることだけでは見抜けない場合があります。
      - 正規の依頼まで届かなくなり、業務が成り立たなくなります。振り分けは対策になりません。
      - 返信は攻撃者の管理する宛先に届くため、事実の確認にはなりません。別の経路が必要です。
    know: ビジネスメール詐欺への対策の要点は、人の注意力ではなく、手続に確認の歯止めを組み込むことである。「別の経路で確認する」「一人で完結させない」が鍵になる。
    terms: [ビジネスメール詐欺, 振込詐欺]
    verify:
      manual: 取引先を装った振込先変更のメールへの対策として、メール以外の経路での確認と、送金の申請者と承認者の分離が適切であることを、注意力への依存・一律の振り分け・同じメールへの返信による確認との対比で確認した。
  - id: B-SEC-128
    topic: [B5, 11-2-2-4]
    diff: 3
    scope: 11-2-2-4 脆弱性への対応が直ちにできない場合の緩和策。修正プログラムを適用できないシステムについて、公開範囲の制限や監視などの補完的な対策で危険を下げる判断
    prereq: 業務システムの都合で修正プログラムをすぐに適用できない場合でも、脆弱性を放置せず、ネットワークの区画による隔離、アクセス元の制限、攻撃検知の監視強化といった、別の手段で危険を下げることができること
    hard: 「直せないから何もできない」ではなく、脆弱性そのものは残っても、攻撃が届く経路と影響の範囲を絞ることで、現実の危険を下げられることを読み取る必要がある。
    q: |
      A社の基幹業務システムに深刻な脆弱性が公表された。しかし、このシステムは業務アプリケーションとの兼ね合いから、修正プログラムを適用すると業務が停止するおそれがあり、適用の検証には数か月を要する見込みである。この間の対応として、適切なものはどれか。
    c:
      - 脆弱性そのものは残るため、そのシステムをネットワークの区画で隔離し、アクセスできる相手を業務に必要な範囲に絞る。あわせて、そのシステムへの攻撃の兆候の監視を強め、検証が済み次第、速やかに修正プログラムを適用する
      - 検証が終わるまでの数か月間は、特に対策をせず、通常どおり運用を続ける
      - 問題の公表を避けるため、脆弱性の情報を社内にも伏せ、対応を先送りする
      - 検証を省略し、業務が停止するおそれがあっても、直ちに修正プログラムを適用する
    a: ア
    exp: |
      修正プログラムをすぐに適用できない事情がある場合でも、脆弱性を放置することはできません。考え方は、脆弱性そのものではなく「攻撃が届く範囲」と「影響の及ぶ範囲」を絞ることです。システムを区画で隔離し、アクセス元を必要な相手だけに制限すれば、攻撃が届く経路が狭まります。あわせて監視を強めて攻撃の兆候を早く捉える備えをし、検証が完了したら速やかに本来の修正を行います。何もしない先送りは危険をそのまま抱え続けますし、検証なしの適用は業務停止という別の事故を招きます。
    why:
      - 正解です。隔離とアクセス制限で経路を絞り、監視を強め、検証後に本来の修正を行う進め方です。
      - 深刻な脆弱性を数か月間放置すると、その間に攻撃を受ける危険を抱え続けることになります。
      - 情報を伏せることは対策にはならず、関係部署の備えや監視の判断も遅らせます。
      - 検証を省略した適用は、業務停止という別の事故を招くおそれがあり、本末転倒です。
    know: 修正できない期間の対応の要点は、「脆弱性を消す」のではなく「攻撃の届く範囲を絞り、兆候を監視する」という緩和の考え方である。本来の修正までの橋渡しとして位置付けられる。
    terms: [脆弱性, 仮想パッチ]
    verify:
      manual: 修正プログラムを直ちに適用できない基幹システムについて、区画による隔離とアクセス制限、監視の強化を行い、検証後に適用する緩和策が適切であることを、放置・情報の秘匿・無検証の即時適用との対比で確認した。
  - id: B-SEC-129
    topic: [B5, 11-2-1]
    diff: 3
    scope: 11-2-1 委託先で情報セキュリティ事故が起きた場合に備えた取り決め。事故の報告の期限や連絡の体制、共同での対応の進め方を、あらかじめ契約に定めておく判断
    prereq: 情報を預ける委託では、事故は「起きないこと」だけでなく「起きたときに早く知り、連携して対応できること」が重要であり、そのための報告や連絡の取り決めは、事故の後ではなく契約の時点で定めておく必要があること
    hard: 委託先管理というと平時の確認が中心になりがちだが、本問は「事故発生時」の連携の備えを問うており、平時の管理とは別の観点であることを読み取る必要がある。
    q: |
      A社は、顧客情報を扱う業務を外部の事業者に委託している。委託先で情報漏洩などの事故が起きた場合に備えた取り決めとして、適切なものはどれか。
    c:
      - 事故の発生やその疑いを委託先が検知したときは、定められた期限内に A社へ報告すること、連絡の窓口と体制、事故後の調査や再発防止への協力を、あらかじめ契約に定めておく
      - 事故時の対応は委託先の専門分野であるため、A社への報告は、委託先の調査が全て終わってからでよいこととする
      - 事故が起きた場合に備え、委託先には、事故の公表を A社に無断で行わないことだけを義務付ける
      - 事故時の取り決めは、事故が現実に起きてから、その都度話し合って決める
    a: ア
    exp: |
      委託先で事故が起きた場合、被害の拡大を防ぎ、顧客への説明や関係機関への報告を行うには、A社が事故を早く知ることが出発点になります。そのためには、報告の期限、連絡の窓口と体制、調査や再発防止への協力を、契約の時点で具体的に定めておく必要があります。調査の完了を待ってから報告を受けるのでは、A社の対応が大きく遅れます。また、事故の公表を抑えることだけを定めても、事故そのものへの対応にはつながりません。取り決めは、事故が起きてからではなく、起きる前に用意しておくものです。
    why:
      - 正解です。報告の期限と連絡体制、調査への協力を事前に定めることが、事故時の連携の備えです。
      - 調査の完了を待つと、A社が事故を知るのが遅れ、被害の拡大や説明の遅れにつながります。
      - 公表の抑制だけでは、事故の把握や対応の連携にはならず、本末が違います。
      - 事故の最中は時間的な余裕がなく、その場の話し合いでは連携が間に合いません。
    know: 委託先管理の要点の一つは、事故時の連携を平時に決めておくことである。「早く知らせる期限」「誰に連絡するか」「調査にどう協力するか」という、事故対応の取り決めが鍵になる。
    terms: [委託先管理, インシデント対応]
    verify:
      manual: 委託先で事故が起きた場合に備え、報告の期限、連絡の窓口と体制、調査や再発防止への協力を契約にあらかじめ定めておくことが適切であることを、調査完了後の報告・公表の抑制のみ・事故後の話し合いとの対比で確認した。
  - id: B-SEC-130
    topic: [B5, 11-5-3]
    diff: 3
    scope: 11-5-3 ゼロトラストの考え方。ネットワークの内外で信頼を区別せず、アクセスのたびに利用者と端末を確認する設計の判断
    prereq: ゼロトラストでは、社内ネットワークからのアクセスであっても無条件には信頼せず、アクセスごとに認証と認可を行い、端末の状態も確認すること
    hard: 「境界で守る」従来の考え方（内側は安全）と対比し、場所ではなく都度の確認に置き換える発想を読み取る必要がある。
    q: |
      A社では、社内ネットワークに接続した端末は、全ての社内システムに自由にアクセスできる設計になっている。ゼロトラストの考え方に沿った見直しとして、適切なものはどれか。
    c:
      - 社内ネットワークからのアクセスでも無条件には信頼せず、システムへのアクセスのたびに、利用者の認証と端末の状態の確認を行い、必要な範囲だけを許可する
      - 社内ネットワークの境界のファイアウォールを強化し、内側のアクセスは今までどおり自由にする
      - 社内システムへのアクセスを、全て特定の 1 台の端末からに限定する
      - 社外からのアクセスだけを禁止し、社内からのアクセスの確認は行わない
    a: ア
    exp: |
      ゼロトラストは、「内側は安全、外側は危険」という境界の考え方を置き換える発想です。マルウェアに感染した端末が社内にある場合や、正規の利用者のアカウントが乗っ取られた場合には、内側からのアクセスも危険になります。そこで、場所にかかわらず、アクセスのたびに利用者と端末を確認し、業務に必要な範囲だけを許可します。境界の防御そのものは無駄ではありませんが、それだけに頼らないことが、ゼロトラストの要点です。
    why:
      - 正解です。場所ではなく、都度の確認で信頼を判断します。
      - 境界の強化だけでは、内側に入った脅威への対処にはなりません。
      - 1 台への限定は、業務の実施を不必要に妨げ、確認の仕組みの代わりにはなりません。
      - 社外の禁止だけでは、社内の端末の感染や、アカウントの乗っ取りに対応できません。
    know: ゼロトラストの要点は、「信頼は場所では決まらない。都度、確認する」という転換である。境界防御との対比が、判断の鍵である。
    terms: [ゼロトラスト, 認証]
    verify:
      manual: 社内ネットワークからのアクセスを無条件に信頼する設計の見直しとして、アクセスのたびに利用者と端末を確認し必要な範囲だけを許可することが、ゼロトラストに沿うことを確認した。

  - id: B-SEC-131
    topic: [B5, 11-5-3]
    diff: 3
    scope: 11-5-3 ログの監視。集約したログを自動的に監視し、異常な兆候を検知して担当者へ通知し、あらかじめ定めた対応につなげる仕組みの判断
    prereq: ログは集めて保管するだけでは活用できず、異常のパターンを検知する条件と、検知したときの通知先や対応の手順を定めておくことで、攻撃への気づきと初動が早まること
    hard: ログの「保全」ではなく「活用（検知と通知）」が問題であることを読み取り、検知の条件と、通知の先の対応まで含めて設計する点が要点である。
    q: |
      A社では、各サーバのログを専用のサーバに集約して保管している。しかし、ログは調査のときに人が見るだけで、普段は誰も確認しておらず、不正アクセスの兆候が記録されていても、数週間気づかれないことがあった。改善として、適切なものはどれか。
    c:
      - 集約したログを自動で監視し、短時間の大量のログイン失敗など、あらかじめ定めた異常のパターンに当てはまる場合は、担当者へ直ちに通知する。通知を受けた後の確認と対応の手順も決めておく
      - ログの保存期間を延ばし、調査のときに多くの記録を参照できるようにする
      - ログを確認する担当者を増やし、交代で毎日目視で確認する
      - ログの記録項目を増やし、より詳しい記録が残るようにする
    a: ア
    exp: |
      本件の問題は、ログが保存されていないことではなく、記録された兆候に誰も気づかないことです。改善の要点は、ログを自動的に監視し、異常のパターンを検知したら担当者へ通知する仕組みと、通知の後にどう確認し、どう対応するかという手順の両方を用意することです。保存期間を延ばしたり記録項目を増やしたりしても、見る仕組みがなければ気づきの遅れは解消されません。目視の確認は、量の多さと見落としの点で、継続的な対策にはなりにくいものです。
    why:
      - 正解です。自動の監視と通知、それに続く対応の手順が、気づきの遅れを解消します。
      - 保存期間は調査の範囲の話であり、記録された兆候への気づきの早さとは別の問題です。
      - 人手の目視は、ログの量に対して見落としや遅れが生じやすく、根本的な改善になりません。
      - 記録項目を増やしても、兆候を検知して知らせる仕組みがなければ、気づきは早まりません。
    know: ログ活用の要点は、「集める・守る」に加えて「自動で監視し、異常を知らせ、対応につなげる」ことである。検知の条件と通知後の手順までが、仕組みの設計に含まれる。
    terms: [ログ管理, ログ監視]
    verify:
      manual: 集約したログの兆候に気づけない問題の改善として、異常パターンの自動検知と担当者への通知、通知後の対応手順の策定が適切であることを、保存期間の延長・人手の目視・記録項目の追加との対比で確認した。
  - id: B-SEC-132
    topic: [B5, 11-4-1-2]
    diff: 3
    scope: 11-4-1-2 バックアップの世代と保持期間の設計。マルウェアの潜伏期間を考え、感染する前の時点の複製までさかのぼれるだけの世代を残す判断
    prereq: マルウェアの感染は、発覚するまでに時間が潜伏している場合があり、保持している複製が全て感染後のものだと、正常な状態に戻せないこと、そのため保持する世代数と期間は、潜伏の可能性を踏まえて決めること
    hard: バックアップの「取り方」ではなく「どれだけ過去までさかのぼれるか」が問題であることを読み取る必要がある。直近の複製だけでは、感染前の状態に戻れない点が要点である。
    q: |
      A社では、ファイルサーバのバックアップを毎日取得し、直近 3 日分だけを保持している。ある日、マルウェアへの感染が発覚したが、感染したのは約 2 週間前と推定され、保持している 3 日分のバックアップは、いずれも感染した後の状態であった。バックアップの保持の見直しとして、適切なものはどれか。
    c:
      - 保持する世代数と期間を見直し、感染が判明するまでの潜伏期間を考えても、感染する前の時点の複製までさかのぼれるだけの期間分を保持する
      - バックアップの取得間隔を 1 時間ごとに短くし、直近 3 日分をより細かく保持する
      - バックアップの保存先の容量を増やし、同じ 3 日分の保持のまま、1 回の取得量を増やす
      - 感染したデータは復旧できない前提で、バックアップ自体をやめ、再構築の手順だけを用意する
    a: ア
    exp: |
      本件の問題は、バックアップの取得の細かさではなく、さかのぼれる期間の短さです。マルウェアは、侵入してから発覚するまでに潜伏している期間があり、その間のバックアップは、感染した状態を複製している可能性があります。保持期間が 3 日では、2 週間前に感染していた場合、正常な複製が残っていません。見直しの要点は、潜伏期間を考えた保持期間と世代数を確保し、感染前の時点までさかのぼれるようにすることです。間隔を短くしても、保持期間が同じでは解決しません。
    why:
      - 正解です。潜伏期間を踏まえた保持期間と世代数が、感染前の状態へ戻る備えになります。
      - 間隔を細かくしても、保持する期間が 3 日のままでは、感染前の複製は残りません。
      - 容量と 1 回の取得量は、さかのぼれる期間の問題とは関係がありません。
      - バックアップをやめると、障害時の復旧手段そのものを失い、本末転倒です。
    know: バックアップ保持の要点は、「どれだけ過去までさかのぼれるか」である。マルウェアの潜伏を考えると、直近の数日分だけでは足りず、保持期間と世代数の設計が復旧可能性を左右する。
    terms: [バックアップ, 世代管理]
    verify:
      manual: 感染の発覚までに潜伏期間があった事例について、保持期間と世代数を見直し、感染前の時点の複製までさかのぼれるようにすることが適切であることを、取得間隔の短縮・容量の追加・バックアップの廃止との対比で確認した。