questions:
  - id: B-ALG-414
    topic: [B2, 2-3-1-6]
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の再帰。1 から n までの合計を、再帰呼出しで求めるプログラムのトレースであり、範囲内。
    prereq: 再帰呼出しの展開、終了条件
    hard: 再帰が n を 1 つずつ減らしながら展開し、戻る過程で加算が積み上がることを追う必要がある。展開の段数と加算の回数を混同しやすい。
    q: |
      次のプログラムを実行したときの、関数 sumTo(n) の戻り値を、解答群の中から選べ。

      関数 sumTo は、1 から n までの整数の合計を返す。n ＝ 5 として sumTo(n) を呼び出す。
    code: |
      ○整数型: sumTo(整数型: n)
        if (n ＝ 1)
          return 1
        endif
        return n ＋ sumTo(n － 1)
    c: ['10', '15', '20', '25']
    a: イ
    exp: |
      再帰を展開すると、次のようになります。

      sumTo(5) ＝ 5 ＋ sumTo(4)
      ＝ 5 ＋ 4 ＋ sumTo(3)
      ＝ 5 ＋ 4 ＋ 3 ＋ sumTo(2)
      ＝ 5 ＋ 4 ＋ 3 ＋ 2 ＋ sumTo(1)
      ＝ 5 ＋ 4 ＋ 3 ＋ 2 ＋ 1 ＝ 15

      戻り値は 15 です。終了条件は n ＝ 1 のときに 1 を返すことであり、ここから加算が積み上がります。
    why:
      - 1 から 4 までの合計であり、展開が 1 段少ない場合の値です。本問は n ＝ 5 から始まります。
      - 正解です。1 から 5 までの合計は 15 です。
      - n と n － 1 を掛けた場合の値（5 × 4）です。本問は加算の繰返しです。
      - n の 2 乗の値（5 × 5）です。再帰の展開は加算で進みます。
    know: 再帰のトレースは、呼出しの展開と、戻る過程での計算の積み上がりの2方向で追う。終了条件が全体の起点になる点が要点である。
    terms: [再帰]
    verify:
      result: { call: sumTo, args: [5], of: return }
    sim: { entry: sumTo, args: [5] }

  - id: B-ALG-415
    topic: [B2, 2-3-1-6]
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の大域変数と呼出しをまたぐ状態。呼出しのたびに大域のカウンタを進めて返す関数の、複数回の呼出しの出力のトレースであり、範囲内。
    prereq: 大域変数の保持、関数の呼出しと戻り値
    hard: 大域変数が呼出しの間で値を保持することを前提に、各呼出しの戻り値が順に増えていく過程を追う必要がある。局所変数であれば毎回 1 になる、という対比が問われる。
    q: |
      次のプログラムを実行したとき、手続 test が出力する 3 つの値を出力順に並べたものとして、正しい答えを解答群の中から選べ。

      関数 next は、大域変数 g を 1 増やし、その値を返す。
    code: |
      大域: 整数型: g ← 0

      ○整数型: next()
        g ← g ＋ 1
        return g

      ○test()
        next() を出力する
        next() を出力する
        next() を出力する
    c: ['1 2 3', '1 1 1', '0 1 2', '3 3 3', '1 2 4']
    a: ア
    exp: |
      g は大域変数であり、呼出しの間で値が保持されます。

      - 1 回目の呼出し: g は 1 になり、1 を返します。
      - 2 回目の呼出し: g は 2 になり、2 を返します。
      - 3 回目の呼出し: g は 3 になり、3 を返します。

      出力は「1 2 3」です。g が局所変数であれば、毎回 0 から始まって全て 1 になるところが、大域変数との違いです。
    why:
      - 正解です。大域変数 g が保持されるため、戻り値は 1、2、3 と増えていきます。
      - g が局所変数で、呼出しのたびに 0 に戻る場合の並びです。本問の g は大域変数です。
      - 増やす前の値を返す場合の並びです。本問では、増やした後の値を返します。
      - 3 回の呼出しの合計が毎回出力される場合の並びです。出力されるのは各呼出しの戻り値です。
      - 戻り値が呼出しのたびに 2 倍になると誤解した場合の並びです。g は 1 ずつ増えるため、戻り値は 1、2、3 と 1 ずつ増えていきます。
    know: 大域変数は、呼出しをまたいで状態を保持する。このため、同じ関数の戻り値が呼出しの回数によって変わることがあり、状態の初期化の位置がプログラムの意味を決める点が要点である。
    terms: [大域変数]
    verify:
      result: { call: test, args: [], of: output }
    sim: { entry: test, args: [] }

  - id: B-ALG-416
    topic: [B2, 2-3-1-6]
    diff: 4
    scope: 科目B「アルゴリズムとプログラミング」の空欄補充（累乗の再帰）。再帰関数の終了条件と、再帰呼出しを含む戻り値の式の組合せを選ぶ問題であり、範囲内。
    prereq: 累乗は、n の e 乗を「n ×（n の e － 1 乗）」と表せること、e が 0 のときの値（1）が再帰の起点になること
    hard: 終了条件の範囲と、再帰の式の形（掛ける量が各段でどうなるか）の組合せで、小さい指数から正しく計算できる組合せを選ぶ必要がある。終了条件を広げ過ぎると、最後の掛け算が抜けて値が小さくなる。
    q: |
      次のプログラム中の【a】と【b】に入れる正しい答えの組合せを、解答群の中から選べ。

      関数 powRec は、n の e 乗（n を e 回掛けた値）を返す。ただし、e は 0 以上の整数であり、e が 0 の場合は 1 を返す。
    code: |
      ○整数型: powRec(整数型: n, 整数型: e)
        if (【a】)
          return 1
        endif
        return 【b】
    c: ['a：e ＝ 0，b：n × powRec(n, e － 1)', 'a：e ＝ 0，b：powRec(n, e － 1) ＋ n', 'a：e ≦ 1，b：n × powRec(n, e － 1)', 'a：e ＝ 0，b：e × powRec(n, e － 1)', 'a：e ＝ 0，b：powRec(n × n, e － 1)']
    fills:
      - { a: 'e ＝ 0', b: 'n × powRec(n, e － 1)' }
      - { a: 'e ＝ 0', b: 'powRec(n, e － 1) ＋ n' }
      - { a: 'e ≦ 1', b: 'n × powRec(n, e － 1)' }
      - { a: 'e ＝ 0', b: 'e × powRec(n, e － 1)' }
      - { a: 'e ＝ 0', b: 'powRec(n × n, e － 1)' }
    a: ア
    exp: |
      累乗は、n の e 乗 ＝ n ×（n の e － 1 乗）と表せます。終了条件は、e が 0 のときに 1 を返すことです（n の 0 乗は 1）。例えば powRec(2, 3) ＝ 2 × powRec(2, 2) ＝ 2 × 2 × powRec(2, 1) ＝ 2 × 2 × 2 × powRec(2, 0) ＝ 8 です。終了条件を e ≦ 1 に広げると、e が 1 の段階で 1 を返してしまい、最後の n の掛け算が抜けます。
    why:
      - 正解です。e が 0 のときに 1 を返し、n を掛けながら e を 1 つずつ減らす形が累乗の再帰です。
      - 戻り値に n を加える形では、掛け算ではなく加算の繰返しになり、累乗より小さな値になります（powRec(2, 3) で 7 になります）。
      - 終了条件が e ≦ 1 では、e が 1 の段階で 1 を返してしまい、最後の n の掛け算が抜けて、値が小さくなります。
      - e を掛ける形では、掛ける量が段ごとに変わってしまい（3、2、1 と減っていく）、累乗にはなりません。
      - 底を 2 乗して渡すだけでは、n を掛ける計算が一度も行われず、終了条件の 1 がそのまま返ってしまいます（powRec(2, 3) でも戻り値は 1 です）。
    know: 再帰の空欄は、終了条件と「問題を小さくする引数」と「戻り値の組み立て方」で決まる。終了条件は止める役割だけでなく、計算の起点の値を決める役割を持つ点が要点である。
    terms: [再帰, 累乗]
    verify:
      cases:
        - { call: powRec, args: [2, 3], expect: 8 }
        - { call: powRec, args: [3, 2], expect: 9 }
        - { call: powRec, args: [5, 0], expect: 1 }
        - { call: powRec, args: [2, 4], expect: 16 }
    sim: { entry: powRec, args: [2, 3] }
  - id: B-ALG-417
    topic: [B2, 2-2-2-1]
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の選択ソートの1回の処理。未整列の範囲から最小値を探して先頭と交換した後の配列の状態のトレースであり、範囲内。
    prereq: 選択ソートは、未整列の範囲の最小値を見つけ、先頭の要素と交換することで、1 回の処理で最小値を確定させる整列であること
    hard: 最小値を探す走査（位置の記録）と、最後に行う 1 回の交換を、正しく分けて追う必要がある。走査の途中では配列は書き換わらない点も含まれる。
    q: |
      次のプログラムを実行したときの、戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まり、配列の引数は参照渡しである。

      関数 selPass は、配列 a の中から最小値を見つけて先頭の要素と交換し、その後の a[2] を返す。a ＝ {5, 1, 4, 2, 8} として selPass(a) を呼び出す。
    code: |
      ○整数型: selPass(整数型の配列: a)
        整数型: i, m, t
        m ← 1
        for (i を 2 から aの要素数 まで 1 ずつ増やす)
          if (a[i] ＜ a[m])
            m ← i
          endif
        endfor
        t ← a[1]
        a[1] ← a[m]
        a[m] ← t
        return a[2]
    c: ['2', '4', '5', '8']
    a: ウ
    exp: |
      まず、最小値の位置を探します。m は、i ＝ 2 で（a[2] ＝ 1 が a[1] ＝ 5 より小さい）位置 2 になり、その後は、より小さい要素がないため変わりません。走査の間、配列自体は書き換わりません。最後に、先頭（位置 1）と位置 2 を交換し、配列は {1, 5, 4, 2, 8} になります。a[2] は 5 です。選択ソートの 1 回の処理では、交換は最後の 1 回だけであり、最小値が先頭に確定します。
    why:
      - 交換の後の a[4] の値です。問われているのは a[2] です。
      - 交換の後の a[3] の値です。問われているのは a[2] です。
      - 正解です。最小値 1 が先頭へ移り、a[2] には元の先頭の 5 が来ます。
      - 配列の最大値であり、交換の後の a[5] の値です。問われているのは a[2] です。
    know: 選択ソートの要点は、「最小値を探す走査」と「最後の 1 回の交換」が分かれていることである。隣接交換を繰り返すバブルソートとは、配列の書き換わるタイミングが異なる。
    terms: [選択ソート]
    verify:
      result: { call: selPass, args: [[5, 1, 4, 2, 8]], of: return }
    sim: { entry: selPass, args: [[5, 1, 4, 2, 8]] }
  - id: B-ALG-418
    topic: [B2, 2-3-1-6]
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の関数の合成。2つの関数の呼出しの順序が結果に与える影響を計算するプログラムのトレースであり、範囲内。
    prereq: 関数の呼出しと戻り値、呼出しの入れ子
    hard: f(g(x)) と g(f(x)) のように、同じ関数対でも合成の順序で結果が変わることを、それぞれ具体的に計算して切り分ける必要がある。
    q: |
      次のプログラムを実行したときの、関数 calc(x) の戻り値を、解答群の中から選べ。

      関数 f は引数の 2 乗を返し、関数 g は引数に 3 を加えて返す。関数 calc は、f(g(x)) から g(f(x)) を引いた値を返す。x ＝ 2 として calc(x) を呼び出す。
    code: |
      ○整数型: f(整数型: v)
        return v × v

      ○整数型: g(整数型: v)
        return v ＋ 3

      ○整数型: calc(整数型: x)
        return f(g(x)) － g(f(x))
    c: ['7', '18', '25', '32']
    a: イ
    exp: |
      2 つの合成を、それぞれ内側から計算します。

      - f(g(2)): g(2) ＝ 5、f(5) ＝ 25
      - g(f(2)): f(2) ＝ 4、g(4) ＝ 7

      calc(2) ＝ 25 － 7 ＝ 18 です。関数の合成は、適用の順序によって結果が変わるため、順序ごとに分けて計算する必要があります。
    why:
      - g(f(2)) だけの値です。本問は f(g(x)) との差を問うています。
      - 正解です。f(g(2)) ＝ 25 と g(f(2)) ＝ 7 の差は 18 です。
      - f(g(2)) だけの値です。もう一方の合成も計算します。
      - 2 つの合成を足した場合の値です。本問は差を問うています。
    know: 関数の合成は、内側の関数の戻り値が外側の引数になる。順序を入れ替えると一般に結果が変わるため、各合成を内側から順に計算するのが要点である。
    terms: [関数]
    verify:
      result: { call: calc, args: [2], of: return }
    sim: { entry: calc, args: [2] }

  - id: B-ALG-419
    topic: [B2, 2-3-1-6]
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」の再帰と配列。配列の途中から末尾までの合計を、再帰呼出しで求めるプログラムのトレースであり、範囲内。
    prereq: 再帰呼出しの展開、添字による部分範囲の指定
    hard: 開始の添字が 2 であることから、合計に含まれる要素の範囲を正しく切り取る必要がある。再帰の戻る過程で加算される順序も追う必要がある。
    q: |
      次のプログラムを実行したときの、関数 sumFrom(a, i) の戻り値を、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      関数 sumFrom は、配列 a の要素 i から末尾までの合計を返す。a ＝ {3, 5, 2, 6}、i ＝ 2 として sumFrom(a, i) を呼び出す。
    code: |
      ○整数型: sumFrom(整数型の配列: a, 整数型: i)
        if (i ＝ aの要素数)
          return a[i]
        endif
        return a[i] ＋ sumFrom(a, i ＋ 1)
    c: ['11', '13', '16', '18']
    a: イ
    exp: |
      再帰を展開すると、次のようになります。

      sumFrom(a, 2) ＝ 5 ＋ sumFrom(a, 3)
      ＝ 5 ＋ 2 ＋ sumFrom(a, 4)
      ＝ 5 ＋ 2 ＋ 6 ＝ 13

      戻り値は 13 です。開始の添字が 2 なので、先頭の要素 3 は合計に含まれません。
    why:
      - 要素 3（a[3]）を飛ばして、5 と 6 だけを合計した場合の値です。a[3] も範囲に含まれます。
      - 正解です。要素 2 から末尾までの合計 5 ＋ 2 ＋ 6 ＝ 13 です。
      - 配列全体の合計です。開始の添字は 2 であり、先頭の要素は含まれません。
      - 全体の合計に、要素 3 をもう一度加えた場合の値です。各要素は 1 回だけ加わります。
    know: 再帰による部分範囲の処理では、開始位置と終了条件が処理範囲を決める。全体を対象にする処理との違いは、初期呼出しの引数にある点が要点である。
    terms: [再帰, 配列]
    verify:
      result: { call: sumFrom, args: [[3, 5, 2, 6], 2], of: return }
    sim: { entry: sumFrom, args: [[3, 5, 2, 6], 2] }

  - id: B-ALG-420
    topic: [B2, 2-1-2-1]
    diff: 3
    scope: 科目B「アルゴリズムとプログラミング」のスタック。プッシュとポップの組合せによる出力順のトレースであり、範囲内。
    prereq: スタックは後入れ先出し（LIFO）であること、大域変数による状態の保持
    hard: プッシュとポップが混ざるため、各時点のスタックの中身を保持しながら追う必要がある。割り込みのように後から入れた値が先に出ることを、具体的な値で確認する。
    q: |
      次のプログラムを実行したとき、手続 test が出力する 3 つの値を出力順に並べたものとして、正しい答えを解答群の中から選べ。ここで、配列の要素番号は 1 から始まり、配列の引数は参照渡しである。

      スタックは、配列 st と、大域変数 top（末尾の位置）で表す。手続 push は末尾に値を追加し、関数 pop は末尾の値を取り出して返す。
    code: |
      大域: 整数型: top ← 0

      ○push(整数型の配列: st, 整数型: v)
        top ← top ＋ 1
        st[top] ← v

      ○整数型: pop(整数型の配列: st)
        整数型: r
        r ← st[top]
        top ← top － 1
        return r

      ○test()
        整数型の配列: st ← {8個の0}
        push(st, 3)
        push(st, 7)
        pop(st) を出力する
        push(st, 9)
        pop(st) を出力する
        pop(st) を出力する
    c: ['7 9 3', '3 9 7', '7 3 9', '3 7 9', '9 7 3']
    a: ア
    exp: |
      スタックの変化は、次のように進みます。

      - push(3): {3}
      - push(7): {3, 7}
      - pop: 末尾の 7 が取り出されます → 出力 7、中身は {3}
      - push(9): {3, 9}
      - pop: 末尾の 9 が取り出されます → 出力 9、中身は {3}
      - pop: 残りの 3 が取り出されます → 出力 3

      出力は「7 9 3」です。後から入れた値が先に出る（後入れ先出し）ことが、出力順に表れています。
    why:
      - 正解です。各 pop で、その時点の末尾の値が出力されています。
      - 最初の pop で、末尾（top）ではなく先頭の要素（3）を読んでしまった場合の並びです。pop は末尾から取り出します。
      - 2 回目の pop で、割り込んだ 9 ではなく元の 3 が出たとする並びです。9 が末尾にある間は、9 が先に出ます。
      - プッシュした順に出力された並びです。スタックでは、入れた順とは逆向きに取り出されます。
      - 全てのプッシュが終わってから、逆順に取り出した場合の並びです。pop は途中で 1 回行われています。
    know: スタックは後入れ先出しであり、プッシュとポップが混ざる場合は「その時点の末尾」だけが取り出される。途中状態を保持しながら追うことが、トレースの要点である。
    terms: [スタック, 大域変数]
    verify:
      result: { call: test, args: [], of: output }
    sim: { entry: test, args: [] }

  - id: B-ALG-421
    topic: [B2, 2-1-2-1]
    diff: 4
    scope: 科目B「アルゴリズムとプログラミング」の空欄補充（番兵を使った線形探索）。配列の末尾の余分な要素を番兵として使い、探索の繰返し条件と戻り値の組合せを選ぶ問題であり、範囲内。
    prereq: 番兵法では、探す値を末尾に置くことで、範囲のチェックなしに繰返しを止められること、戻り値が番兵の位置かどうかで、見つからなかったことを判定できること
    hard: 繰返しの終了が番兵によって保証される仕組みを前提に、条件の向きと戻り値の組合せを、見つかる場合と見つからない場合の両方で切り分ける必要がある。
    q: |
      次のプログラム中の【a】と【b】に入れる正しい答えの組合せを、解答群の中から選べ。ここで、配列の要素番号は 1 から始まる。

      関数 find は、配列 a の先頭から n 個の要素の中から key を探し、見つかった位置を返す。見つからなかった場合は n ＋ 1 を返す。配列 a には、位置 n ＋ 1 に番兵として key を置く余地があるものとする。
    code: |
      ○整数型: find(整数型の配列: a, 整数型: n, 整数型: key)
        整数型: i
        a[n ＋ 1] ← key
        i ← 1
        while (【a】)
          i ← i ＋ 1
        endwhile
        return 【b】
    c: ['a：a[i] ≠ key，b：i', 'a：a[i] ＝ key，b：i', 'a：a[i] ≠ key，b：i － 1', 'a：i ≦ n，b：i', 'a：a[i] ≠ key，b：n ＋ 1 － i']
    fills:
      - { a: 'a[i] ≠ key', b: 'i' }
      - { a: 'a[i] ＝ key', b: 'i' }
      - { a: 'a[i] ≠ key', b: 'i － 1' }
      - { a: 'i ≦ n', b: 'i' }
      - { a: 'a[i] ≠ key', b: 'n ＋ 1 － i' }
    a: ア
    exp: |
      番兵として位置 n ＋ 1 に key 自身が置かれているため、繰返しは必ず key に出会って止まります。条件は「a[i] が key と異なる間は進める」であり、戻り値は止まった位置 i そのものです。見つからなかった場合は、番兵の位置 n ＋ 1 で止まるため、その値が「見つからなかった」ことを表します。
    why:
      - 正解です。番兵により終了が保証され、止まった位置がそのまま答えになります。
      - 条件が逆では、最初の要素が key でない限り繰返しが始まらず、常に先頭の位置を返してしまいます。
      - 戻り値が i － 1 では、見つかった位置が 1 つ前になり、先頭で見つかった場合に 0 を返してしまいます。
      - i ≦ n という条件だけでは、値を見ずに末尾まで進んでしまい、途中で見つかっても止まれません。
      - 戻り値が n ＋ 1 － i では、位置が末尾からの距離に化けてしまい、見つかった位置を表しません。
    know: 番兵法は、境界のチェックを番兵の配置で不要にする工夫である。繰返し条件と戻り値の意味（番兵の位置＝見つからなかった）は、セットで理解するのが要点である。
    terms: [線形探索, 番兵]
    verify:
      cases:
        - { call: find, args: [[4, 9, 2, 7, 0], 4, 2], expect: 3 }
        - { call: find, args: [[4, 9, 2, 7, 0], 4, 7], expect: 4 }
        - { call: find, args: [[4, 9, 2, 7, 0], 4, 5], expect: 5 }
        - { call: find, args: [[4, 9, 2, 7, 0], 4, 4], expect: 1 }
