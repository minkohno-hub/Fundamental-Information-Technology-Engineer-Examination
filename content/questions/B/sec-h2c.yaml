questions:
  - id: B-SEC-117
    topic: [B5, 11-1-3-2]
    diff: 3
    scope: 11-1-3-2 CSRF（クロスサイトリクエストフォージェリ）の成立条件と対策。ログイン中の利用者のブラウザが意図しないリクエストを送信させられる攻撃の仕組みから、有効な対策を選ぶ問題
    prereq: ブラウザはログイン中のサイト宛のリクエストに、セッションのクッキーを自動で付けること
    hard: 攻撃が成立するのは「利用者の権限でリクエストが送られ、サーバ側がそれを正規の操作と区別できない」ためであり、対策はリクエストの正当性を確認できる仕組みでなければならない点を見抜く必要がある。
    q: |
      A社のインターネットバンキングでは、ログイン中の利用者が、攻撃者の用意した Web ページを開いただけで、そのページに仕込まれた自動送信のフォームによって、利用者のブラウザから送金リクエストが送られてしまう脆弱性が見つかった。銀行のサーバは、セッションのクッキーが付いていることだけを確認していた。この攻撃への対策として、最も適切なものはどれか。
    c:
      - 送金リクエストに、サーバが発行した予測困難なワンタイムトークンを含め、サーバ側でその一致を検証する
      - 送金画面の URL を、利用者ごとに異なる推測困難なものに変更する
      - ログインのパスワードを、より長く複雑なものに変更するよう利用者に求める
      - 送金リクエストを受け付けるポート番号を、標準とは異なる番号に変更する
    a: ア
    exp: |
      この攻撃は CSRF（クロスサイトリクエストフォージェリ）です。ブラウザは、対象サイト宛のリクエストにはログイン中のクッキーを自動で付けるため、攻撃者のページから送られたリクエストでも、サーバからは利用者本人の操作と区別が付きません。有効な対策は、攻撃者が知り得ない情報（サーバが正規の画面にだけ発行するワンタイムトークン）をリクエストに含め、サーバで検証することです。これにより、外部のページから組み立てたリクエストはトークンを持たず、拒否できます。
    why:
      - 正解です。トークンは正規の画面からしか得られないため、外部のページからの偽装リクエストを区別できます。
      - URL を知られにくくしても、利用者のブラウザがその URL へ送信する仕組み自体は変わらず、根本的な対策にはなりません。
      - パスワードの強度は、この攻撃の成立とは無関係です。攻撃はログイン済みのセッションを悪用します。
      - ポート番号の変更は、攻撃の検知を難しくするだけであり、正規のリクエストと偽装リクエストの区別にはなりません。
    know: CSRF の要点は「権限のあるセッションの自動利用」。対策の本筋は、リクエストに秘密の検証材料（トークン）を持たせて、正規の画面経由かどうかをサーバが確認することである。
    terms: [CSRF, ワンタイムトークン]
    verify:
      manual: CSRF の成立条件（クッキーの自動付与とサーバ側の区別不能）と各選択肢を照合し、正規画面経由でだけ得られるトークンの検証だけが偽装リクエストを区別できることを確認した。

  - id: B-SEC-118
    topic: [B5, 11-1-3-2]
    diff: 3
    scope: 11-1-3-2 XSS（クロスサイトスクリプティング）のうち、投稿内容が保存されて他の利用者のブラウザで実行される格納型の仕組みと、出力時の対策を選ぶ問題
    prereq: Web ページに利用者の入力をそのまま埋め込むと、入力に含まれるスクリプトがブラウザで実行されること
    hard: 攻撃の成立場所が「入力の受付時」ではなく「表示時」であることを見抜き、対策を表示（出力）の側に置く必要がある。入力の禁止文字の除去だけでは不十分な理由も問われる。
    q: |
      A社の掲示板サービスでは、投稿された文章がデータベースに保存され、閲覧者のブラウザにそのまま表示される。攻撃者がスクリプトを含む文章を投稿したところ、閲覧者のブラウザでそのスクリプトが実行され、セッション情報が攻撃者に送られてしまった。この攻撃への対策として、最も適切なものはどれか。
    c:
      - 投稿内容を表示する際に、HTML の特殊文字をエスケープ（無害化）してから埋め込む
      - 投稿の文字数を、最大で 100 文字に制限する
      - データベースの投稿データを、暗号化して保存する
      - 掲示板の閲覧に、ログインを必須とする
    a: ア
    exp: |
      これは格納型の XSS（クロスサイトスクリプティング）です。スクリプトが実行されるのは、保存された投稿が他の利用者のブラウザに表示される時点です。対策の本筋は、表示の際に出力される文字列の特殊文字（＜、＞、＆ など）をエスケープし、ブラウザに「プログラムではなく文字」として解釈させることです。入力時に特定の文字列を除去する方法は、書き方の工夫で回避されることがあり、確実ではありません。
    why:
      - 正解です。出力時のエスケープは、スクリプトが埋め込まれていても実行されなくする根本対策です。
      - 文字数の制限は、短いスクリプトでも攻撃が成立するため、対策になりません。
      - 保存時の暗号化は、漏洩時の対策にはなっても、復号して表示すればスクリプトは実行されてしまいます。
      - ログイン必須にしても、ログインした閲覧者のブラウザでスクリプトが実行される点は変わりません。
    know: XSS の対策は「出力時のエスケープ」が本筋。攻撃が成立するのは表示の時点であるため、入力の検査だけに頼らず、埋め込む場所ごとに無害化することが重要である。
    terms: [XSS, エスケープ処理]
    verify:
      manual: 格納型 XSS の成立場所が表示時であることと各選択肢を照合し、出力時のエスケープだけがブラウザでの実行を止められることを確認した。

  - id: B-SEC-119
    topic: [B5, 11-1-6]
    diff: 3
    scope: 11-1-6 パスワードの保存方式。データベースが漏洩した前提で、パスワードそのものを復元されにくくする保存方法（ソルト付きハッシュとストレッチング）を選ぶ問題
    prereq: ハッシュ関数は一方向であり元の値を復元できないこと、同じパスワードからは同じハッシュ値が得られるため、利用者ごとに異なるソルトを付けると事前計算の表（レインボーテーブル）が使えないこと
    hard: 「暗号化して保存」では復号鍵が漏れれば元に戻る点と、単なるハッシュでは高速な総当たりや事前計算表に弱い点を区別し、3つの工夫（ハッシュ化・ソルト・ストレッチング）の組合せを選ぶ必要がある。
    q: |
      A社の会員サイトでは、利用者のパスワードをデータベースに保存している。データベースが漏洩した場合でも、パスワードそのものが容易に判明しないようにしたい。保存方式として、最も適切なものはどれか。
    c:
      - パスワードに、利用者ごとに異なるランダムな値（ソルト）を加えてハッシュ化し、ハッシュ計算を多数回繰り返す（ストレッチング）方式で保存する
      - パスワードを、強固な共通鍵暗号で暗号化して保存する
      - パスワードを、そのままの文字列で保存するが、データベースへのアクセス権を管理者だけに制限する
      - パスワードを Base64 でエンコードして保存する
    a: ア
    exp: |
      パスワードの保存では「元のパスワードを復元できないこと」と「推測に時間がかかること」の両方が求められます。ハッシュ化は一方向であり復元はできません。さらに、利用者ごとに異なるソルトを付けると、同じパスワードでも保存される値が異なり、事前に計算した対応表（レインボーテーブル）が使えなくなります。加えて、ハッシュ計算を多数回繰り返すストレッチングにより、総当たりの試行速度を大きく落とせます。検証のときは、入力されたパスワードに同じソルトを加えて同じ計算を行い、保存値と一致するかを見ます。
    why:
      - 正解です。ハッシュ化、ソルト、ストレッチングの組合せが、漏洩時の判明を最も困難にします。
      - 暗号化は可逆であり、復号鍵が漏洩すれば全員のパスワードが元に戻ってしまいます。
      - アクセス権の制限は漏洩の防止策ですが、漏洩した前提では平文がそのまま判明してしまいます。
      - Base64 は単なる符号化であり、誰でも元の文字列に戻せます。秘匿の効果はありません。
    know: パスワードは「復号して取り出す」ものではなく「照合する」ものなので、可逆な暗号化ではなく一方向のハッシュで保存する。ソルトは事前計算表への対策、ストレッチングは総当たりの速度への対策である。
    terms: [ソルト, ハッシュ関数, ストレッチング]
    verify:
      manual: 保存方式の3点（復元可能性、事前計算表への耐性、総当たりの速度）を各選択肢で照合し、ソルト付きハッシュとストレッチングの組合せだけが全てを満たすことを確認した。

  - id: B-SEC-120
    topic: [B5, 11-1-4]
    diff: 4
    scope: 11-1-4 公開鍵証明書の検証。複数のサイトの証明書の状態（失効・期限・名前の一致・発行者）から、接続してよいサイトと、警告を無視してはならない理由を判断する問題
    prereq: 証明書の検証では、信頼できる認証局までの署名の連鎖、有効期限、失効の有無、接続先のホスト名と証明書の名前の一致を全て確認すること
    hard: 4つのサイトの状態がそれぞれ異なる検証項目で引っかかっており（1つだけが全て満たす）、各項目の意味を切り分けて判断する必要がある。特に、失効した証明書は期限内でも無効である点が要点になる。
    q: |
      A社の従業員が、業務で次の 4 つの Web サイトに接続しようとした。各サイトのサーバ証明書の状態が次のとおりであるとき、ブラウザの警告なしに接続できる（証明書の検証を全て満たす）サイトはどれか。

      - サイト W： 信頼できる認証局が発行、有効期限内、失効していない、ホスト名が証明書の名前と一致
      - サイト X： 信頼できる認証局が発行、有効期限内、認証局によって失効済み、ホスト名が一致
      - サイト Y： 信頼できる認証局が発行、有効期限を過ぎている、失効していない、ホスト名が一致
      - サイト Z： 接続先の運営者自身が発行した自己署名証明書、有効期限内、ホスト名が一致
    c:
      - サイト W
      - サイト X
      - サイト Y
      - サイト Z
    a: ア
    exp: |
      証明書の検証は、発行者の信頼（署名の連鎖）、有効期限、失効の有無、ホスト名の一致の全てを満たして初めて成立します。サイト W は全てを満たします。サイト X は、秘密鍵の漏洩などによって認証局が失効させた証明書であり、期限内でも無効です。サイト Y は期限切れです。サイト Z の自己署名証明書は、発行者の信頼を第三者が保証していないため、通常の検証では信頼できません。
    why:
      - 正解です。検証の全項目を満たしているのはサイト W だけです。
      - 失効した証明書は、たとえ有効期限内であっても使用してはならず、ブラウザは警告を出します。
      - 有効期限を過ぎた証明書は無効であり、期限切れは単なる注意喚起ではありません。
      - 自己署名証明書は、信頼の起点を自分で置かない限り検証が成立せず、なりすましの検知もできません。
    know: 証明書の検証は複数の項目の論理積であり、1つでも欠けると信頼は成立しない。特に「失効」は、鍵の漏洩など重大な理由で期限前に無効化する仕組みであり、期限とは独立に確認される。
    terms: [デジタル証明書, 認証局, 失効]
    verify:
      manual: 証明書検証の4項目（発行者の信頼、期限、失効、ホスト名の一致）を4サイトそれぞれに適用し、全てを満たすのが W だけであることを確認した。

  - id: B-SEC-121
    topic: [B5, 11-5-3]
    diff: 2
    scope: 11-5-3 端末の検疫（ポスチャチェック）。社内システムへの接続前に、端末の OS の更新状況やウイルス対策の稼働状況を検査し、基準を満たす端末だけに接続を許可する仕組みを選ぶ問題
    prereq: 私物端末など管理の及ばない端末は、セキュリティ対策の状態がばらつくこと、接続の可否は「誰が」だけでなく「どの端末からか」でも判断できること
    q: |
      A社では、在宅勤務の拡大に伴い、従業員が自宅の私物 PC から社内システムへ接続する機会が増えた。私物 PC の中には、OS の更新が行われていなかったり、ウイルス対策ソフトが無効化されていたりするものがある。社内システムへの接続を許可する前に、接続元の端末のセキュリティ対策の状況を確認し、基準を満たさない端末は接続させない仕組みを導入したい。この仕組みとして、最も適切なものはどれか。
    c:
      - 接続時に、端末の OS の更新状況やウイルス対策ソフトの稼働状況などを検査し、基準を満たす端末だけに接続を許可する
      - 通信経路を暗号化する VPN を導入し、自宅からの通信を第三者に読まれないようにする
      - 社内システムのパスワードを、より複雑なものに変更するよう従業員に求める
      - 境界のファイアウォールで、接続を許可する送信元 IP アドレスの範囲を絞る
    a: ア
    exp: |
      問われているのは、接続する端末そのものの健全性の確認です。端末の検疫（ポスチャチェック）では、接続の前に、OS やウイルス対策ソフトの状態、ディスク暗号化の有無などを検査し、基準を満たした端末だけに接続を許可します。VPN は通信経路の暗号化が役割であり、端末の状態は検査しません。パスワードの強化は利用者の認証の話であり、在宅勤務では送信元 IP アドレスも一定しないため、IP アドレスによる絞り込みでは端末の健全性は判断できません。
    why:
      - 正解です。接続前に端末の対策状況を検査し、基準でふるい分けることが、目的に直接対応します。
      - VPN が守るのは通信の途中経路であり、接続してくる端末が安全かどうかは分かりません。
      - パスワードの複雑化は成り済ましの対策であり、更新されていない OS などの端末側の弱さは解消しません。
      - 在宅勤務の IP アドレスは家庭ごとに異なり変動するため絞り込みが難しく、仮に絞れても端末の状態は判断できません。
    know: 接続の許可は、利用者の認証（誰か）だけでなく、端末の健全性（どの端末か）でも判断する。管理外の端末が増える環境では、検疫のように状態を検査してから通す仕組みが要点になる。
    terms: [検疫ネットワーク]
    verify:
      manual: 目的（接続前の端末の健全性の確認と基準による選別）と各選択肢の役割（経路の暗号化、認証の強化、IP アドレスによる制限）を照合し、端末の状態を検査する仕組みだけが目的に一致することを確認した。
  - id: B-SEC-122
    topic: [B5, 11-2-1]
    diff: 3
    scope: 11-2-1 EDR（エンドポイントでの検知と対応）。未知のマルウェアの感染を前提に、端末上の不審な振る舞いを常時監視し、隔離と影響範囲の特定を行う仕組みを選ぶ問題
    prereq: パターン照合による検知は、既知のマルウェアのパターンに依存し、未知のものは検知できないことがあること、感染後の対応には端末内部の記録と監視が必要なこと
    hard: 「侵入を防ぐ」対策と「感染した後の検知と対応」の対策を区別し、未知のマルウェアという前提では、振る舞いの監視と隔離の仕組みが要ることを見抜く必要がある。
    q: |
      A社で、従業員の PC が標的型攻撃のマルウェアに感染した。ウイルス対策ソフトは導入されていたが、未知のマルウェアであったため検知できなかった。今後は、端末上の不審な振る舞いを継続的に監視し、感染が疑われる端末の隔離や、影響範囲の特定を迅速に行える仕組みを導入したい。この仕組みとして、最も適切なものはどれか。
    c:
      - 端末の操作や通信を常時記録・監視し、不審な振る舞いを検知したときに端末を隔離して調査できる EDR を導入する
      - 境界に WAF を設置し、Web アプリケーションへのリクエストの内容を検査する
      - ウイルス対策ソフトの定義ファイルを、1 日に複数回更新するように設定する
      - 全ての端末のディスクを暗号化し、記録された情報を読めないようにする
    a: ア
    exp: |
      EDR（Endpoint Detection and Response）は、端末上のプロセスの起動や通信などの振る舞いを常時記録・監視し、マルウェアらしい動きを検知して、端末の隔離や調査（どの端末に広がったか、何が行われたか）を支援する仕組みです。未知のマルウェアはパターン照合では捉えきれないため、感染を前提に「振る舞いで見つけ、広がる前に隔離する」備えが要ります。WAF は Web への攻撃リクエストを境界で検査するもので、端末内部の振る舞いは見えません。定義ファイルの更新は既知のパターンへの備えであり、ディスクの暗号化は紛失・盗難時の情報保護が目的です。
    why:
      - 正解です。振る舞いの常時監視と、検知時の隔離・調査という要件に一致する仕組みです。
      - WAF の対象は Web アプリケーションへの通信であり、感染した端末の内部の動きや隔離には対応しません。
      - 定義ファイルの更新頻度を上げても、未知のマルウェアのパターン自体が存在しないため、検知はできません。
      - ディスクの暗号化は、端末を紛失したときに情報を守る対策であり、感染の検知や拡大の防止にはなりません。
    know: 対策は「防ぐ」だけでなく「感染した後に早く見つけて広げない」段階まで含めて設計する。EDR は、端末の振る舞いの記録と監視によって、検知・隔離・調査を担う仕組みである。
    terms: [EDR]
    verify:
      manual: 要件（未知のマルウェアを前提とした振る舞いの常時監視、隔離、影響範囲の特定）と各選択肢の役割（Web リクエストの境界検査、既知パターンの更新、紛失時の情報保護）を照合し、EDR だけが要件に一致することを確認した。
  - id: B-SEC-123
    topic: [B5, 11-5-2]
    diff: 3
    scope: 11-5-2 バックアップからの復旧可能性の検証。取得の成功と復旧の成功が別物であることから、定期的なリストア（復旧）訓練の必要性を判断する問題
    prereq: バックアップの媒体の劣化、手順書の陳腐化、暗号化鍵の所在不明などにより、取得できていても復旧できないことがあること
    hard: 「バックアップのジョブが成功している」ことと「実際に戻せる」ことの違いを見抜き、検証すべき対象が取得ではなく復旧の手順と結果であることを選ぶ必要がある。
    q: |
      A社では、基幹システムのバックアップが毎晩正常に終了していることを、ジョブの完了ログで確認している。保存先やメディアの状態に問題は見つかっておらず、復旧の手順書も整備されている。しかし、実際に障害が起きた際に、そのバックアップから業務が再開できる状態まで戻せるかは、一度も試したことがない。この状況への対策として、最も適切なものはどれか。
    c:
      - 定期的に、バックアップから実際にシステムを復旧する訓練を行い、復旧の手順と所要時間を確認する
      - バックアップの取得頻度を、毎晩から 1 時間ごとに増やす
      - バックアップの完了ログの保管期間を、1 年から 5 年に延ばす
      - バックアップの保存先を、現在のクラウドから自社のテープ装置に変更する
    a: ア
    exp: |
      バックアップの目的は、障害時に業務を再開できることであり、「取得できている」ことはその前提にすぎません。媒体の読み取り不良、復旧手順の不備、暗号化鍵の所在不明など、復旧を試して初めて分かる問題は多くあります。定期的なリストア（復旧）訓練により、手順書どおりに戻せることと、業務再開までの所要時間（復旧時間の目標との整合）を、平時に検証しておくことが対策になります。
    why:
      - 正解です。復旧できることを実際に試すことが、取得の成功だけでは分からない問題を洗い出します。
      - 頻度を増やしても、復旧できないバックアップが増えるだけであり、戻せることの保証にはなりません。
      - ログの保管は記録の管理であり、復旧の可否とは関係がありません。
      - 保存先の変更は媒体の選択の問題であり、復旧手順が正しいかの検証にはなりません。
    know: バックアップの評価基準は「取れているか」ではなく「戻せるか」。リストア訓練は、バックアップ戦略の最後の検証であり、復旧時間の見積もりの根拠にもなる。
    terms: [バックアップ, リストア]
    verify:
      manual: 取得の成功と復旧の可否が別物であることと各選択肢を照合し、リストア訓練だけが復旧可能性そのものを検証する取組であることを確認した。

  - id: B-SEC-124
    topic: [B5, 11-5-5]
    diff: 3
    scope: 11-5-5 生成AIサービスの業務利用における情報漏洩の管理。従業員が個人契約のサービスに業務情報を入力するシャドーITの状態に対し、利用の実態を踏まえた管理策を選ぶ問題
    prereq: 外部サービスに入力した情報は、そのサービスの学習や保管の対象になり得ること、禁止だけでは利用が水面下に潜り管理できなくなること
    hard: 「禁止する」ことが一見安全に見えるが、利用実態がある場合は、入力データの扱いが契約で保証された業務用サービスへ誘導し、入力してよい情報の範囲を定めることが、管理としての実効性を持つ点を判断する必要がある。
    q: |
      A社では、従業員の一部が個人で契約した生成 AI サービスに、業務資料の要約や文章の添削をさせている実態が分かった。中には、顧客情報を含む資料を入力した例もあった。この状況への対応として、最も適切なものはどれか。
    c:
      - 入力した情報が学習に利用されず、保管や削除の条件が契約で定められた業務用の生成 AI サービスを会社として契約し、入力してよい情報の範囲を規程で定めて利用を認める
      - 生成 AI サービスの利用を全面的に禁止し、違反した従業員は処分するとだけ通達する
      - 顧客情報を入力した従業員だけを特定し、個別に注意する
      - 生成 AI サービスのドメインへの通信を、ファイアウォールですぐに遮断する
    a: ア
    exp: |
      問題は、従業員の利用そのものではなく、入力した業務情報（特に顧客情報）が、個人契約のサービスの学習や保管の対象になり、会社の管理の外で扱われることです。利用の実態がある以上、全面禁止は利用を水面下に潜らせるだけで管理は難しくなります。入力データの扱いが契約で保証された業務用サービスを用意し、入力してよい情報の範囲（顧客情報や機密情報は入力しない等）を規程で明示して、その枠内での利用を公式に認めることが、利便性と管理の両立になる対応です。
    why:
      - 正解です。サービスの契約条件で情報の扱いを統制し、規程で範囲を定めることで、管理の内側に利用を取り込めます。
      - 禁止の通達だけでは、利便性を求める利用が非公式な形で続き、かえって実態が見えなくなります。
      - 個別の注意は、その場の事例への対処にすぎず、仕組みとしての再発防止になりません。
      - 特定ドメインの遮断は、別のサービスへの移行で容易に回避され、入力情報の管理という本質の解決にもなりません。
    know: 新しい外部サービスの業務利用では、「使わせない」よりも「管理できる形で使わせる」ことが実効的な管理になる場合がある。情報の入力先の契約条件と、入力可能な情報の範囲の規程が、統制の両輪である。
    terms: [シャドーIT, 情報セキュリティポリシ]
    verify:
      manual: 問題の本質が入力情報の管理外流出であることと各選択肢を照合し、契約で情報の扱いを保証した業務用サービスへの誘導と規程による範囲設定だけが、利用実態を管理下に取り込めることを確認した。
