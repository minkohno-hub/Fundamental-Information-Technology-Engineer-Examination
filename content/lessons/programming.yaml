lessons:
  - id: prog-01-basics
    order: 1
    title: 擬似言語の基本と変数・代入・型
    body: |
      科目Bのアルゴリズム問題は、IPA が定めた**擬似言語**で書かれます。特定のプログラム言語を知らなくても読めるように作られた共通の書き方で、記述のルールは試験要綱の「別紙2」に示されています。まずは「変数」「代入」「型」の三つを押さえましょう。

      **変数**は値を入れておく箱です。使う前に `整数型: x` のように**型**と名前を宣言します。宣言と同時に初期値を入れるときは `整数型: x ← 0` と書きます。主な型は次のとおりです。

      | 型 | 入る値の例 |
      | --- | --- |
      | 整数型 | 0, 15, -3 |
      | 実数型 | 0.5, 3.14 |
      | 文字型 | "A" |
      | 文字列型 | "abc" |
      | 論理型 | true, false |

      **代入**は `x ← 5` のように矢印で書き、「右辺の値を計算して、左辺の変数に入れる」という意味です。数学の等号とは違うので、`x ← x ＋ 1` は「今の x に 1 を足した値を、改めて x に入れる」という正しい文になります。なお、擬似言語の `=` は代入ではなく「等しいかどうか」の比較です。

      下のプログラムを 1 行ずつ追うと、変数の中身は次のように変わります。

      | 行 | a | b |
      | --- | --- | --- |
      | a ← 3 | 3 | 0 |
      | b ← a × 2 | 3 | 6 |
      | a ← a ＋ b | 9 | 6 |

      **よくある間違い**
      - `a ← a ＋ b` の右辺を、代入した後の値で計算してしまう。右辺は必ず**代入前の値**で計算します。
      - `←` と `=` を混同する。`if (x = 0)` は比較、`x ← 0` は代入です。
      - 宣言だけで値を入れていない変数を、0 が入っていると思い込む。初期値は明示されたものだけを信じましょう。
      - `/* … */` は注釈（コメント）で、処理には影響しません。

      動作例では、二つの変数を使って値を入れ替えています。作業用の変数 `t` を使わずに `a ← b`、`b ← a` と書くと、どちらも同じ値になってしまう点に注意してください。
    example: |
      demo() を出力する
      ○整数型: demo()
        整数型: a ← 3
        整数型: b ← 0
        整数型: t
        b ← a × 2
        a ← a ＋ b
        t ← a
        a ← b
        b ← t
        return a × 10 ＋ b
    questionIds: [A02-027, B-ALG-045, B-ALG-001]

  - id: prog-02-operators
    order: 2
    title: 演算子（算術・比較・論理，mod，÷ の扱い）
    body: |
      擬似言語の式で使う演算子は、大きく**算術**・**比較**・**論理**の三種類です。

      | 種類 | 演算子 | 例と結果 |
      | --- | --- | --- |
      | 算術 | ＋ － × ÷ mod | 7 mod 3 は 1 |
      | 比較 | = ≠ ＞ ≧ ＜ ≦ | 3 ≠ 4 は true |
      | 論理 | and or not | true and false は false |

      **mod** は割り算の余りです。`x mod 2 = 0` なら偶数、`y mod 4 = 0` なら 4 の倍数、`n mod 10` は 1 の位の数字、というように科目Bで非常によく使います。

      **÷** は割り算です。7 ÷ 2 の値そのものは 3.5 ですが、結果を**整数型の変数に代入すると小数点以下が切り捨てられ** 3 になります。試験の問題文には「÷ は商の小数点以下を切り捨てる」のような注記が付くことが多いので、必ず確認しましょう。`n ÷ 10`（切捨て）は「1 の位を取り除く」操作としてよく登場します。

      **優先順位**は高い順に、単項演算子（not、符号）→ × ÷ mod → ＋ － → 比較 → and → or です。迷ったら括弧で囲まれた部分から計算します。

      動作例の関数 digits は、n の各桁の和を求めます。digits(472) のトレースは次のとおりです。

      | 回 | n mod 10 | s | n（÷10 後） |
      | --- | --- | --- | --- |
      | 1 | 2 | 2 | 47 |
      | 2 | 7 | 9 | 4 |
      | 3 | 4 | 13 | 0 |

      **論理演算の評価**：問題文に「and は左側が false なら右側を評価しない」と書かれている場合、`i ≦ n and data[i] ＞ 0` のように、範囲チェックを左に置くことで範囲外の要素を参照しないようにできます。

      **よくある間違い**
      - mod と ÷ を取り違える（472 mod 10 は 2、472 ÷ 10 を整数にすると 47）。
      - 「a は 1 以上 10 以下」を `1 ≦ a ≦ 10` と書く。正しくは `1 ≦ a and a ≦ 10` です。
      - not の範囲を誤る。`not (a and b)` は `(not a) or (not b)` と同じです（ド・モルガンの法則）。
    example: |
      digits(472) を出力する
      ○整数型: digits(整数型: n)
        整数型: s ← 0
        while (n ＞ 0)
          s ← s ＋ (n mod 10)
          n ← n ÷ 10
        endwhile
        return s
    questionIds: [B-ALG-044, B-ALG-046, A02-028]

  - id: prog-03-if
    order: 3
    title: 選択処理 if
    body: |
      条件によって実行する処理を変えるのが**選択処理**です。擬似言語では次の形で書きます。

      ```
      if (条件式1)
        処理1
      elseif (条件式2)
        処理2
      else
        処理3
      endif
      ```

      上から順に条件式を調べ、**最初に true になった一つだけ**を実行して endif の後へ進みます。どれも true でなければ else の処理を実行します。elseif と else は省略できます。

      動作例の関数 grade は、点数に応じて評価を返します。いくつかの値で、どの枝に入るかを確かめましょう。

      | score | 80 以上? | 60 以上? | 戻り値 |
      | --- | --- | --- | --- |
      | 95 | true | （調べない） | 3 |
      | 70 | false | true | 2 |
      | 59 | false | false | 1 |

      70 は「60 以上」にも「80 未満」にも当てはまりますが、elseif の時点で「80 以上ではない」ことが分かっているので、`score ≧ 60 and score ＜ 80` と書く必要はありません。**上の条件が偽であることを前提に下の条件が書かれている**のが elseif の読み方のポイントです。

      **境界値に注意**：科目Bでは「以上・以下・未満・超」の違いがそのまま空欄の選択肢になります。60 点ちょうど、80 点ちょうどのような境目の値を入れて、期待どおりの枝に入るかを確かめましょう。

      **よくある間違い**
      - 条件の順番を逆にする。`if (score ≧ 60)` を先に書くと、95 点も 2 になってしまいます。範囲を絞る条件は、厳しいものから順に並べます。
      - if を二つ並べたものと elseif を同じだと思う。if を並べると、両方の条件が true のとき両方実行されます。
      - endif の位置を読み違え、if の外の文まで条件付きだと思ってしまう。字下げ（インデント）でブロックの範囲を確認しましょう。
    example: |
      grade(95) × 100 ＋ grade(70) × 10 ＋ grade(59) を出力する
      ○整数型: grade(整数型: score)
        if (score ≧ 80)
          return 3
        elseif (score ≧ 60)
          return 2
        else
          return 1
        endif
    questionIds: [B-ALG-146, B-ALG-046, A02-010]

  - id: prog-04-loops
    order: 4
    title: 繰返し for・while・do-while
    body: |
      同じ処理を何度も行うのが**繰返し処理**です。擬似言語には三つの書き方があります。

      | 構文 | 条件を調べる時点 | 最低実行回数 |
      | --- | --- | --- |
      | for (i を 1 から n まで 1 ずつ増やす) … endfor | 毎回の前 | 0 回 |
      | while (条件式) … endwhile | 毎回の前（前判定） | 0 回 |
      | do … while (条件式) | 毎回の後（後判定） | 1 回 |

      **for** は回数が決まっているときに使います。「i を 1 から n まで 1 ずつ増やす」は i ＝ 1, 2, …, n で処理を行います。「i を n から 1 まで 1 ずつ減らす」と書けば逆順です。n が 0 なら一度も実行しません。

      **while** は「条件が true の間」繰り返します。最初から false なら一度も実行しません。

      **do-while** は先に処理を行い、後で条件を調べます。条件が最初から false でも 1 回は実行される点が while との違いです。どちらも条件は「続ける条件」であり、「終わる条件」ではありません。

      動作例の関数 sumTo(4) は 1 から 4 までの和を求めます。

      | i | s（処理後） |
      | --- | --- |
      | 1 | 1 |
      | 2 | 3 |
      | 3 | 6 |
      | 4 | 10 |

      繰返しが終わった後の制御変数の値に頼る問題は避けられることが多いですが、while で自分で i を増やす場合は、終了時の i が「条件を初めて満たさなくなった値」になります。

      **よくある間違い**
      - 回数を 1 回ずれて数える（オフバイワン）。「1 から n まで」は n 回、「0 から n まで」は n＋1 回です。
      - while の中で条件に関わる変数を更新し忘れ、無限ループになる。
      - do-while の条件を「終了条件」と読んでしまう。
      - 二重ループの内側の回数を、外側の変数を含めて正しく数えない。外側が i のとき内側が「1 から i まで」なら、合計は 1＋2＋…＋n 回です。
    example: |
      sumTo(4) × 10 ＋ countDown(0) を出力する
      ○整数型: sumTo(整数型: n)
        整数型: i, s ← 0
        for (i を 1 から n まで 1 ずつ増やす)
          s ← s ＋ i
        endfor
        return s
      ○整数型: countDown(整数型: n)
        整数型: c ← 0
        do
          c ← c ＋ 1
          n ← n － 1
        while (n ＞ 0)
        return c
    questionIds: [A02-029, B-ALG-043, B-ALG-016]

  - id: prog-05-arrays
    order: 5
    title: 配列（要素番号は1から，要素数）
    body: |
      **配列**は、同じ型の値を一列に並べて番号で管理する仕組みです。`整数型の配列: data ← {5, 8, 2}` のように `{ }` で値を並べて作ります。

      | 要素番号 | 1 | 2 | 3 |
      | --- | --- | --- | --- |
      | data[ ] | 5 | 8 | 2 |

      科目Bでは、特に断りがなければ**要素番号は 1 から**始まります（多くのプログラム言語では 0 からなので注意）。`data[2]` は 8、`dataの要素数` は 3 です。最後の要素は `data[dataの要素数]` で表せます。

      配列の全要素を処理する定番の形は次のとおりです。

      ```
      for (i を 1 から dataの要素数 まで 1 ずつ増やす)
        data[i] を使う処理
      endfor
      ```

      **二次元配列**は `x[i, j]` で i 行 j 列の要素を表し、`{{1, 2}, {3, 4}}` のように書きます。行の数・列の数は問題文の定義（「xの行数」「xの列数」など）に従います。

      **配列の配列**（各要素が配列）は `x[i][j]` のように書き、二次元配列とは区別されます。

      動作例の関数 maxOf は、配列の最大値を求めます。maxOf({5, 8, 2}) のトレースは次のとおりです。

      | i | data[i] | m（処理後） |
      | --- | --- | --- |
      | （初期） | − | 5 |
      | 2 | 8 | 8 |
      | 3 | 2 | 8 |

      最大値の初期値を 0 にすると、要素が全て負の数のときに誤った答えになります。先頭の要素 `data[1]` で初期化し、2 番目から比べるのが安全です。

      **よくある間違い**
      - 要素番号 0 を使ってしまう、またはループを「0 から 要素数－1 まで」と書いてしまう。
      - `data[i ＋ 1]` を参照するループを「要素数 まで」回して、範囲外を参照する。この場合は「要素数 － 1 まで」です。
      - 要素番号 i と要素の値 data[i] を取り違える。最大値の「位置」を返すのか「値」を返すのかを問題文で確認しましょう。
    example: |
      maxOf({5, 8, 2}) を出力する
      ○整数型: maxOf(整数型の配列: data)
        整数型: i, m ← data[1]
        for (i を 2 から dataの要素数 まで 1 ずつ増やす)
          if (data[i] ＞ m)
            m ← data[i]
          endif
        endfor
        return m
    questionIds: [B-ALG-002, B-ALG-144, B-ALG-038]

  - id: prog-06-functions
    order: 6
    title: 関数と手続・引数・戻り値
    body: |
      まとまった処理に名前を付けたものが**関数**と**手続**です。

      ```
      ○整数型: add(整数型: a, 整数型: b)
        return a ＋ b
      ```

      先頭の `○` が宣言の目印です。`○` の直後に**戻り値の型**があるものが関数で、`return` で値を返します。戻り値の型がない `○show(整数型: n)` は手続で、値は返さず、出力や大域変数の更新などを行います。

      | 用語 | 意味 | add(2, 3) の場合 |
      | --- | --- | --- |
      | 仮引数 | 宣言側の変数 | a, b |
      | 実引数 | 呼出し側の値 | 2, 3 |
      | 戻り値 | return の値 | 5 |

      呼び出すと、実引数の値が仮引数に入って関数の本体が実行され、return に達した時点で**直ちに**呼出し元に戻ります。return の後ろの文は実行されません。

      **局所変数と大域変数**：関数の中で宣言した変数はその関数の中だけで使え、呼び出すたびに新しく作られます。`大域: 整数型: count ← 0` のように宣言した大域変数は、どの関数からも参照・更新でき、値が保持されます。呼出し回数を数える問題などで使われます。

      動作例では、関数 square を関数 sumSq の中から呼び出しています。sumSq(3) では次のように呼出しが行われます。

      | 呼出し | 戻り値 | s（加算後） |
      | --- | --- | --- |
      | square(1) | 1 | 1 |
      | square(2) | 4 | 5 |
      | square(3) | 9 | 14 |

      **よくある間違い**
      - 仮引数を変更すると呼出し元の変数も変わると思い込む。整数などの値を渡す場合は、呼出し元の変数は変わりません（問題文に参照渡しの説明があればそれに従います）。
      - return の後の文も実行されると考える。
      - 関数の中で同じ名前の局所変数を宣言したとき、大域変数のほうを書き換えていると誤解する。
    example: |
      大域: 整数型: calls ← 0
      sumSq(3) × 10 ＋ calls を出力する
      ○整数型: square(整数型: x)
        calls ← calls ＋ 1
        return x × x
      ○整数型: sumSq(整数型: n)
        整数型: i, s ← 0
        for (i を 1 から n まで 1 ずつ増やす)
          s ← s ＋ square(i)
        endfor
        return s
    questionIds: [A02-030, B-ALG-019, B-ALG-045]

  - id: prog-07-trace
    order: 7
    title: トレース（変数表の書き方）
    body: |
      **トレース**とは、プログラムを頭の中（または紙の上）で 1 行ずつ実行し、変数の値の変化を追うことです。科目Bでは「関数を○○で呼び出したときの戻り値」や「出力」を問う問題の大半がトレースで解けます。

      **変数表の書き方**
      1. 列に、変化する変数（ループ変数・累計・添字など）を並べる。
      2. 行は「ループ 1 回」または「代入 1 回」ごとに追加する。
      3. 条件判定の結果（true／false）も列に書くと間違いが減る。
      4. 値が変わったところだけ書き、変わらない値は空欄か同じ値にする。

      動作例の関数 calc は、配列から偶数だけを足し、奇数の個数を数えます。calc({3, 4, 7, 10}) を変数表でトレースしましょう。

      | i | data[i] | 偶数? | even | odd |
      | --- | --- | --- | --- | --- |
      | （初期） | − | − | 0 | 0 |
      | 1 | 3 | false | 0 | 1 |
      | 2 | 4 | true | 4 | 1 |
      | 3 | 7 | false | 4 | 2 |
      | 4 | 10 | true | 14 | 2 |

      最後に `even × 10 ＋ odd` を返すので、戻り値は 142 です。

      **コツ**
      - 繰返しが多いときは、最初の 2〜3 回で**規則性**を見つける。「i 回目が終わると○○が成り立つ」と分かれば、残りは計算で求められます。
      - 再帰では、呼出しごとに行を分けて「どの呼出しの変数か」を明確にする。
      - 出力の問題では、出力した値を別の列に順に書き出す。

      **よくある間違い**
      - 一つの行で複数の変数を更新するとき、更新済みの値を使ってしまう。文は上から順に一つずつ実行されます。
      - ループの最後の 1 回を書き忘れる。終了条件を満たした時点で表を止めます。
      - 条件判定の向き（＜ と ≦）を見落とす。判定結果の列を作ると防げます。
    example: |
      calc({3, 4, 7, 10}) を出力する
      ○整数型: calc(整数型の配列: data)
        整数型: i, even ← 0, odd ← 0
        for (i を 1 から dataの要素数 まで 1 ずつ増やす)
          if (data[i] mod 2 = 0)
            even ← even ＋ data[i]
          else
            odd ← odd ＋ 1
          endif
        endfor
        return even × 10 ＋ odd
    questionIds: [B-ALG-006, B-ALG-008, B-ALG-023]

  - id: prog-08-search
    order: 8
    title: 探索（線形・二分）
    body: |
      配列の中から目的の値を探すのが**探索**です。科目Bで頻出なのは**線形探索**と**二分探索**です。

      **線形探索**は先頭から順に一つずつ比べます。整列されていなくても使えますが、要素数 n に対して最大 n 回比較します。見つからなかったときの戻り値（-1 など）を問題文で確認しましょう。末尾に探したい値を置く**番兵**を使うと、ループ内の「範囲内か」の判定を省けます。

      **二分探索**は、**昇順に整列済み**の配列で、探す範囲の真ん中と比べて範囲を半分ずつに絞ります。比較回数は最大でおよそ log₂n 回です（1,000 件なら約 10 回）。

      ```
      low ← 1, high ← 要素数
      while (low ≦ high)
        mid ← (low ＋ high) ÷ 2   /* 切捨て */
        data[mid] = x なら見つかった
        data[mid] ＜ x なら low ← mid ＋ 1
        data[mid] ＞ x なら high ← mid － 1
      endwhile
      ```

      動作例で {2, 5, 8, 12, 16, 23, 38} から 23 を探すトレースです。

      | low | high | mid | data[mid] | 判定 |
      | --- | --- | --- | --- | --- |
      | 1 | 7 | 4 | 12 | 12 ＜ 23 → low ← 5 |
      | 5 | 7 | 6 | 23 | 一致 → 6 を返す |

      **よくある間違い**
      - `low ← mid`、`high ← mid` と書く。mid は調べ終わっているので ±1 しないと、範囲が縮まらず無限ループになることがあります。
      - 繰返し条件を `low ＜ high` にして、要素が一つだけ残った場合を調べ忘れる。
      - mid を整数型にしていない（切捨てを忘れる）。
      - 整列されていない配列に二分探索を使う。
    example: |
      binSearch({2, 5, 8, 12, 16, 23, 38}, 23) を出力する
      ○整数型: binSearch(整数型の配列: data, 整数型: x)
        整数型: low ← 1
        整数型: high ← dataの要素数
        整数型: mid
        while (low ≦ high)
          mid ← (low ＋ high) ÷ 2
          if (data[mid] = x)
            return mid
          elseif (data[mid] ＜ x)
            low ← mid ＋ 1
          else
            high ← mid － 1
          endif
        endwhile
        return -1
    questionIds: [B-ALG-004, B-ALG-005, A02-011, A02-012]

  - id: prog-09-sort
    order: 9
    title: 整列（バブル・選択・挿入）
    body: |
      データを大きさの順に並べ替えるのが**整列（ソート）**です。基本の三つの方法を、仕組みで区別できるようにしましょう。

      | 方法 | 考え方 | 1 回の外側ループで確定するもの |
      | --- | --- | --- |
      | バブルソート | 隣り合う要素を比べ、逆順なら交換 | 未整列部分の最大値が末尾へ |
      | 選択ソート | 未整列部分から最小値を探して先頭と交換 | 未整列部分の最小値が先頭へ |
      | 挿入ソート | 整列済み部分の正しい位置に次の値を挿入 | （先頭から i 個が整列済み） |

      いずれも比較回数は最悪でおよそ n²／2 回（計算量 O(n²)）です。挿入ソートはほぼ整列済みのデータに強く、バブルソートと挿入ソートは**安定**（同じ値の順序が保たれる）です。

      動作例はバブルソートで {5, 3, 8, 1} を昇順に並べます。外側ループの各回が終わった時点の配列は次のとおりです。

      | i | 配列 | 確定した末尾 |
      | --- | --- | --- |
      | 開始 | 5 3 8 1 | − |
      | 1 | 3 5 1 8 | 8 |
      | 2 | 3 1 5 8 | 5 8 |
      | 3 | 1 3 5 8 | 3 5 8 |

      外側の i 回目で内側を「1 から 要素数 － i まで」回すのは、末尾の i 個がすでに確定しているからです。

      **交換**は作業用変数を使って `tmp ← data[j]`、`data[j] ← data[j ＋ 1]`、`data[j ＋ 1] ← tmp` の 3 文で行います。

      **よくある間違い**
      - 内側ループの終わりを「要素数 まで」にして `data[j ＋ 1]` が範囲外になる。
      - 昇順と降順で比較の向き（＞ と ＜）を逆にする。
      - 挿入ソートで、値をずらす前に挿入する値を tmp に退避し忘れる。
      - 選択ソートで「最小値」ではなく「最小値の要素番号」を覚えておく必要があることを忘れる。
    example: |
      bubbleSort({5, 3, 8, 1}) を出力する
      ○整数型の配列: bubbleSort(整数型の配列: data)
        整数型: i, j, tmp
        整数型: n ← dataの要素数
        for (i を 1 から n － 1 まで 1 ずつ増やす)
          for (j を 1 から n － i まで 1 ずつ増やす)
            if (data[j] ＞ data[j ＋ 1])
              tmp ← data[j]
              data[j] ← data[j ＋ 1]
              data[j ＋ 1] ← tmp
            endif
          endfor
        endfor
        return data
    questionIds: [B-ALG-007, B-ALG-009, B-ALG-010, A02-015]

  - id: prog-10-recursion
    order: 10
    title: 再帰
    body: |
      関数が自分自身を呼び出すことを**再帰呼出し**といいます。再帰で書かれた関数には、必ず次の二つがあります。

      - **終了条件（基底）**：これ以上呼び出さずに値を返す場合（例 n ≦ 1 なら 1 を返す）
      - **再帰の部分**：問題を一回り小さくして自分を呼び出す部分（例 n × fact(n － 1)）

      終了条件がない、または引数が終了条件に近づかないと、呼出しが止まりません。

      動作例の fact(4) は次のように進みます。呼出しが深くなる「行き」と、値が返ってくる「帰り」に分けて考えるのがコツです。

      | 呼出し | 行き（待ち状態の式） | 帰り（戻り値） |
      | --- | --- | --- |
      | fact(4) | 4 × fact(3) | 4 × 6 ＝ 24 |
      | fact(3) | 3 × fact(2) | 3 × 2 ＝ 6 |
      | fact(2) | 2 × fact(1) | 2 × 1 ＝ 2 |
      | fact(1) | 終了条件 | 1 |

      それぞれの呼出しは**自分専用の局所変数（n など）**をもちます。fact(2) を実行中も、fact(4) の n は 4 のまま待っています。これはスタックに呼出しの情報が積まれていくイメージです。

      **呼出し回数を数える問題**：フィボナッチ数の fib(n) ＝ fib(n－1) ＋ fib(n－2) のように 1 回で 2 回呼ぶ再帰は、呼出しの木を描いて数えます。fib(4) は fib(3) と fib(2) を呼び、全体で 9 回呼び出されます（fib(1)、fib(0) を終了条件とした場合）。

      **よくある間違い**
      - 帰りの計算を忘れ、終了条件の値（1 など）をそのまま答えにしてしまう。
      - 呼出し回数に最初の呼出しを含めるかどうかを読み落とす。
      - 出力文が再帰呼出しの前にあるか後にあるかで出力の順序が逆になることを見落とす。前なら行きの順、後なら帰りの順に出力されます。
    example: |
      fact(4) × 100 ＋ fib(6) を出力する
      ○整数型: fact(整数型: n)
        if (n ≦ 1)
          return 1
        endif
        return n × fact(n － 1)
      ○整数型: fib(整数型: n)
        if (n ≦ 1)
          return n
        endif
        return fib(n － 1) ＋ fib(n － 2)
    questionIds: [B-ALG-020, B-ALG-021, B-ALG-124, A02-018]

  - id: prog-11-structures
    order: 11
    title: スタック・キュー・連結リスト（クラスとインスタンス，参照）
    body: |
      **スタック**は後から入れたものを先に取り出す（LIFO）構造で、入れる操作を push、取り出す操作を pop といいます。**キュー**は先に入れたものを先に取り出す（FIFO）構造で、enqueue／dequeue といいます。科目Bでは、配列と「先頭・末尾の位置を表す変数」で実装したものがよく出ます。

      動作例は、配列 stack と変数 top でスタックを実装しています。top は最後に積んだ要素の要素番号です。

      | 操作 | top | stack の中身 | 取り出した値 |
      | --- | --- | --- | --- |
      | push(1) | 1 | 1 | − |
      | push(2) | 2 | 1 2 | − |
      | push(3) | 3 | 1 2 3 | − |
      | pop() | 2 | 1 2 | 3 |
      | pop() | 1 | 1 | 2 |

      **クラスとインスタンス**：連結リストの問題では、問題文で「クラス ListElement はメンバ変数 val と next をもつ」のように定義されます。`ListElement(5)` と書くとインスタンス（実体）が新しく作られ、その**参照**（場所を指す値）が得られます。メンバ変数は `p.val`、`p.next` のように「.」で参照します。

      **連結リスト**では各要素が次の要素への参照 next をもち、最後の要素の next は `未定義` です。先頭から順にたどる定番の形は次のとおりです。

      ```
      p ← head
      while (p ≠ 未定義)
        p.val を使う処理
        p ← p.next
      endwhile
      ```

      参照を代入しても要素はコピーされません。`q ← p` の後に `q.val ← 9` とすると、p が指す要素の val も 9 になります（同じ要素を指しているため）。

      **よくある間違い**
      - pop で top を減らす順序と値を取り出す順序を逆にする。
      - 要素を挿入するとき、`p.next` を先に書き換えて後ろの要素への参照を失う。新しい要素の next を先に設定します。
      - リストが空（head が未定義）の場合の処理を忘れる。
    example: |
      大域: 整数型の配列: stack ← {0, 0, 0, 0, 0}
      大域: 整数型: top ← 0
      demo() を出力する
      ○push(整数型: v)
        top ← top ＋ 1
        stack[top] ← v
      ○整数型: pop()
        top ← top － 1
        return stack[top ＋ 1]
      ○整数型: demo()
        整数型: a, b
        push(1)
        push(2)
        push(3)
        a ← pop()
        b ← pop()
        return a × 10 ＋ b
    questionIds: [B-ALG-034, B-ALG-101, A02-004, A02-005]

  - id: prog-12-strategy
    order: 12
    title: 科目Bの解き方（問題文の読み方・空欄補充のコツ・テストケースで確かめる）
    body: |
      最後に、科目Bのアルゴリズム問題を時間内に正確に解くための手順をまとめます。

      **1. 問題文を先に読む**
      プログラムより先に説明文を読み、「関数が何を受け取り、何を返すか」をつかみます。次の注記は必ず印を付けましょう。
      - 配列の要素番号の始まり（通常 1）
      - ÷ の扱い（小数点以下の切捨てなど）
      - and／or の評価の仕方（左側だけで決まれば右側を評価しない、など）
      - 見つからない場合の戻り値

      **2. 空欄の役割を考える**
      空欄の前後を見て、「何を数える変数か」「ループが何回目の処理か」を言葉で説明できるようにします。合計なら「今までの合計 ＋ 今の値」、最大値なら「今の最大より大きければ更新」のように、定番の形が当てはまることが多いです。

      **3. 小さなテストケースで確かめる**
      選択肢を空欄に入れて、要素数 2〜3 程度の小さい入力でトレースします。

      | 確かめる入力 | ねらい |
      | --- | --- |
      | 普通のデータ | 基本の動作 |
      | 要素が 1 個・0 回の繰返し | 端の場合 |
      | 境界の値（ちょうど 60 など） | ≦ と ＜ の違い |
      | 同じ値が複数 | 最初か最後か |

      正解でない選択肢は、どれかのケースで期待と違う結果になります。全部をトレースせず、**選択肢の違いが出るケース**を選ぶのが時間短縮のコツです。

      動作例は「1 から n までのうち 3 の倍数の個数を数える」関数です。空欄が `i mod 3 = 0` か `i ÷ 3 = 0` か迷ったら、n ＝ 6 のように答えが分かる入力（3 と 6 で 2 個）で確かめれば区別できます。

      **よくある間違い**
      - プログラムだけ読んで問題文の注記を見落とす。
      - 1 つのケースで合ったからと、他の選択肢を検討せずに決める。複数の選択肢が同じ結果になるケースでは区別できません。
      - 時間をかけすぎる。1 問に詰まったら印を付けて次へ進み、最後に戻りましょう。
    example: |
      countMul3(6) を出力する
      ○整数型: countMul3(整数型: n)
        整数型: i, c ← 0
        for (i を 1 から n まで 1 ずつ増やす)
          if (i mod 3 = 0)
            c ← c ＋ 1
          endif
        endfor
        return c
    questionIds: [B-ALG-003, B-ALG-013, B-ALG-143]
