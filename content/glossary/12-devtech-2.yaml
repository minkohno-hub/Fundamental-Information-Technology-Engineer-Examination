category: システム開発技術
terms:
  - term: 構造化プログラミング
    reading: こうぞうかぷろぐらみんぐ
    aliases: [構造化定理]
    simple: 順次・選択・繰返しの3つの基本構造だけを組み合わせて、読みやすいプログラムを書く考え方です。
    definition: プログラムの制御構造を順次・選択・繰返しの3つの基本構造の組合せで表現し、無秩序な分岐（goto 文の多用）を避けて、理解しやすく保守しやすいプログラムを作成する手法。任意の手順はこの3構造で記述できる（構造化定理）。
    related: [構造化設計]
  - term: インタフェース設計
    reading: いんたふぇーすせっけい
    aliases: [インタフェース設計基準, 入出力設計]
    simple: 画面・帳票や、プログラム同士・外部システムとのデータのやり取りの方法を決める設計です。
    definition: 利用者とシステムの間（画面・帳票・伝票などの入出力）や、ソフトウェアユニット間・外部システムとの間で受け渡すデータの項目、形式、手順などを決める設計作業。操作性や表示を統一するために、インタフェース設計基準を定めて適用する。
    related: [帳票設計, UXデザイン]
  - term: 教育訓練
    reading: きょういくくんれん
    simple: 新しいシステムを使う人や運用する人に、操作方法や手順を身に付けてもらう活動です。
    definition: システムの導入・受入れに当たって、利用者や運用者が新しいシステムを適切に使用・運用できるよう、教育訓練資料を作成し、集合研修や e-ラーニング（WBT：Web Based Training）などで操作や手順を習得させる活動。
    related: [e-ラーニング, 受入れテスト]
  - term: システムの廃棄
    reading: しすてむのはいき
    aliases: [廃棄プロセス, 廃棄計画]
    simple: 使わなくなったシステムを、業務に影響を出さず、データや機器を適切に処分して停止することです。
    definition: 役目を終えたシステムやソフトウェアの稼働を終了させるプロセス。廃棄計画を立て、利用者への通知、必要なデータの保存・移行、記憶媒体のデータ消去、ライセンスや契約の終了などを行い、組織の運用の完整性（integrity）を保ちながら停止する。
    related: [システム移行]
  - term: 是正処置
    reading: ぜせいしょち
    aliases: [再発防止策]
    simple: 起きた問題の根本原因を取り除いて、同じ問題が再び起きないようにする処置です。
    definition: 検出された不適合や不具合について根本原因を特定し、その原因を除去して再発を防止するための処置。その場の不具合を取り除くだけの修正（修正処置）とは区別される。
    related: [根本原因]
