category: マルチメディア
terms:
  - term: サンプリング周波数
    reading: サンプリングしゅうはすう
    simple: 1 秒間に、音の波形を何回測るかを表す数です。
    definition: アナログの音声をディジタル化する際に、1秒間に波形を測定する回数。標本化周波数ともいう。高いほど高い周波数の音まで再現でき、データ量も増える。
    related: [量子化, 標本化定理]
  - term: 量子化
    reading: りょうしか
    simple: 測った値を、決められた段階の数値に置き換えることです。
    definition: ディジタル化の過程の一つで、サンプリングした値を、有限の段階（量子化ビット数で決まる）の数値に近似して置き換えること。ビット数が多いほど、元の値に近くなる。
    related: [サンプリング周波数]
  - term: フルカラー
    reading: フルカラー
    simple: 約 1,677 万色を表せる、色の表現の方式です。
    definition: 1画素当たり24ビット（赤・緑・青に各8ビット）で色を表す方式。表せる色の数は 2 の 24 乗、約1,677万色であり、写真などの保存に使われる。
    related: [色深度]
  - term: 色深度
    reading: しょくしんど
    simple: 1 つの画素の色を、何ビットで表すかという数です。
    definition: 画像の1画素の色を表すのに使うビット数。大きいほど表せる色の数が増え、データ量も増える。フルカラーは24ビットである。
    related: [フルカラー]
  - term: フレームレート
    reading: フレームレート
    simple: 動画で、1 秒間に何枚の画像を表示するかという数です。
    definition: 動画における、1秒当たりのフレーム（コマ）数。単位は fps。大きいほど動きが滑らかになり、非圧縮のデータ量はフレームレートに比例して増える。
    related: [動画]
  - term: 動画
    reading: どうが
    simple: 静止画を連続して表示し、動きに見せる仕組みです。
    definition: 静止画（フレーム）を短い間隔で連続表示することで、動きを表現するもの。データ量が大きいため、通常は圧縮符号化して保存・配信する。
    related: [フレームレート]
  - term: 拡張現実
    reading: かくちょうげんじつ
    simple: 現実の映像に、コンピュータの情報を重ねて見せる技術です。
    definition: AR（Augmented Reality）。現実世界の映像や視界に、文字や図などの情報を重ねて表示する技術。現実とは別の仮想世界を体験する VR（仮想現実）と区別される。
    related: [AR]
  - term: 符号化
    reading: ふごうか
    simple: データを、決められた規則で別の形式に変換することです。
    definition: 音声や動画などのデータを、一定の規則でビット列に変換すること。圧縮を伴う符号化では、ビットレート（1秒当たりのビット数）がデータ量と品質の目安になる。
    related: [ビットレート]
