category: 企業活動
terms:
  - term: 安全余裕率
    reading: あんぜんよゆうりつ
    simple: 今の売上が損益分岐点からどれだけ離れているかを示す割合です。
    definition: （売上高 − 損益分岐点売上高） ÷ 売上高 で求める指標。売上が何％減るまで赤字にならないかを示し、損益分岐点比率との合計は 100％ になる。
    related: [損益分岐点]
  - term: 営業レバレッジ
    reading: えいぎょうればれっじ
    simple: 売上の変化が営業利益に何倍になって表れるかを示す仕組みです。
    definition: 営業レバレッジ係数 ＝ 限界利益 ÷ 営業利益。固定費の割合が大きいほど係数が大きくなり、売上高の増減率に対して営業利益の増減率が増幅される。固定費が不変の範囲でのみ成り立つ。
    related: [限界利益, 損益分岐点]
  - term: キャッシュコンバージョンサイクル
    reading: きゃっしゅこんばーじょんさいくる
    aliases: [CCC]
    simple: 仕入れに払った現金が、販売代金として戻ってくるまでの日数です。
    definition: 売上債権回転期間 ＋ 棚卸資産回転期間 − 買入債務回転期間 で求める日数（Cash Conversion Cycle）。現金が事業に拘束される期間を表し、短いほど運転資金の負担が軽い。
    related: [流動比率]
  - term: 完全情報の価値
    reading: かんぜんじょうほうのかち
    simple: 将来の状態が事前に正確に分かるとしたら、その情報にいくら払えるかを示す金額です。
    definition: 完全情報の下で状態ごとに最良の案を選んだ場合の期待値と、情報なしで最良の案を選んだ場合の期待値との差（EVPI）。市場調査などの情報収集に支払えるコストの上限を与える。
    related: [期待値]
