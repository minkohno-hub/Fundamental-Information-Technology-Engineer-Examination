category: システム企画
terms:
  - term: SoE
    reading: エスオーイー
    fullName: Systems of Engagement
    japanese: つながりのためのシステム
    words:
      - { en: Systems, ja: システム }
      - { en: Engagement, ja: つながり・関与 }
    simple: 顧客とのつながりを深めるためのシステムです。
    definition: SNS やモバイルアプリなどを通じて、顧客や利用者との関係（エンゲージメント）を強化することを目的とするシステム。
    related: [SoR, SoI]
  - term: SoR
    reading: エスオーアール
    fullName: Systems of Record
    japanese: 記録のためのシステム
    words:
      - { en: Systems, ja: システム }
      - { en: Record, ja: 記録 }
    simple: 取引や業務の記録を正確に残すための基幹系システムです。
    definition: 会計や受発注など、企業の取引や業務のデータを正確に処理・記録することを目的とするシステム。
    related: [SoE, SoI]
  - term: SoI
    reading: エスオーアイ
    fullName: Systems of Insight
    japanese: 洞察のためのシステム
    words:
      - { en: Systems, ja: システム }
      - { en: Insight, ja: 洞察 }
    simple: データを分析して、意思決定に役立つ気付きを得るためのシステムです。
    definition: SoR や SoE に蓄積されたデータを分析し、意思決定に役立つ洞察を得ることを目的とするシステム。
    related: [SoE, SoR]
  - term: Fit to Standard
    reading: フィットトゥスタンダード
    simple: パッケージの標準機能に業務を合わせ、追加開発を最小限にする導入方法です。
    definition: ERP パッケージなどの標準機能に業務を合わせることを前提に業務プロセスを見直し、アドオン開発を最小限に抑える導入手法。
    related: [ERP]
  - term: BABOK
    reading: バボック
    fullName: A Guide to the Business Analysis Body of Knowledge
    japanese: ビジネスアナリシス知識体系ガイド
    words:
      - { en: Business Analysis, ja: ビジネスアナリシス }
      - { en: Body of Knowledge, ja: 知識体系 }
    simple: IIBA が作った、ビジネスアナリシスの知識をまとめたガイドです。
    definition: IIBA（International Institute of Business Analysis）が策定した、ビジネスアナリシスの知識エリアや技法を体系化した知識体系ガイド。
  - term: システム化計画
    reading: システムかけいかく
    aliases: [システム化構想, 全体システム化計画, 個別システム化計画]
    simple: どの範囲を、いつまでに、どんな体制とお金でシステム化するかを決めた計画です。
    definition: システム化構想に基づき、対象範囲、全体開発スケジュール、推進体制、要員教育計画、開発投資対効果、導入リスクなどを定めた計画。
    related: [ITポートフォリオ]
  - term: ITポートフォリオ
    reading: アイティーポートフォリオ
    simple: IT 投資を種類ごとに分けて、全体のリスクと効果のバランスで配分を決める手法です。
    definition: IT 投資を戦略的投資・業務効率化投資・インフラ投資などに分類し、投資全体のリスクと効果のバランスを評価して資源配分を最適化する手法。
    related: [IT投資マネジメント]
  - term: ROI
    reading: アールオーアイ
    fullName: Return On Investment
    japanese: 投資利益率
    words:
      - { en: Return, ja: 利益・見返り }
      - { en: On, ja: に対する }
      - { en: Investment, ja: 投資 }
    aliases: [投資利益率, 投資対効果]
    simple: 投資した金額に対して、どれだけ利益が得られたかの割合です。
    definition: 投資によって得られた利益を投資額で割った比率。IT 投資の評価では、効果の合計から投資額を引いた値を投資額で割って求めることが多い。
    related: [NPV, 回収期間法]
  - term: NPV
    reading: エヌピーブイ
    fullName: Net Present Value
    japanese: 正味現在価値
    words:
      - { en: Net, ja: 正味の }
      - { en: Present, ja: 現在の }
      - { en: Value, ja: 価値 }
    aliases: [正味現在価値]
    simple: 将来のお金を今の価値に直して合計し、投資額を引いた値です。
    definition: 将来のキャッシュフローを割引率で現在価値に換算した合計から初期投資額を差し引いた値。正であれば投資は採算がとれると判断する。
    related: [ROI]
  - term: 回収期間法
    reading: かいしゅうきかんほう
    aliases: [回収期間]
    simple: 投資額を何年で取り戻せるかで投資を評価する方法です。
    definition: 投資額を毎年の効果（キャッシュフロー）で回収するのに要する期間によって投資を評価する方法。時間的価値や回収後の効果は考慮しない。
    related: [ROI, NPV]
  - term: 半構造化インタビュー
    reading: はんこうぞうかインタビュー
    aliases: [構造化インタビュー, 非構造化インタビュー]
    simple: 主な質問を決めておき、相手の答えに応じて柔軟に質問を変えるインタビューです。
    definition: 主要な質問項目を事前に用意し、回答に応じて質問の追加や順序の変更を行うインタビュー。質問を固定する構造化、質問を用意しない非構造化と対比される。
  - term: 要件定義
    reading: ようけんていぎ
    simple: 新しいシステムに何が求められるかを決めて文書にする工程です。
    definition: 利害関係者の要求を分析し、業務要件・機能要件・非機能要件を定義して合意する工程。
    related: [業務要件, 機能要件, 非機能要件]
  - term: 業務要件
    reading: ぎょうむようけん
    simple: システム化する業務の新しい手順やルールなど、業務のあるべき姿の要件です。
    definition: システム化の対象業務について、業務の手順・業務ルール・扱う情報などのあるべき姿を定義した要件。
    related: [要件定義]
  - term: 機能要件
    reading: きのうようけん
    simple: システムが「何をするか」を決めた要件です。
    definition: システムが実現すべき入出力や処理の内容など、業務処理の機能に関する要件。
    related: [非機能要件]
  - term: 非機能要件
    reading: ひきのうようけん
    simple: 速さや止まりにくさ、安全性など、機能以外に求められる要件です。
    definition: 性能・可用性・信頼性・セキュリティ・運用保守性など、機能以外にシステムに求められる品質に関する要件。
    related: [機能要件]
  - term: DOA
    reading: ディーオーエー
    fullName: Data Oriented Approach
    japanese: データ中心アプローチ
    words:
      - { en: Data, ja: データ }
      - { en: Oriented, ja: 中心の }
      - { en: Approach, ja: 手法 }
    aliases: [データ中心アプローチ]
    simple: 業務で扱うデータを中心にシステムを設計する方法です。
    definition: 業務で扱うデータの構造に着目し、データを中心に分析・設計する手法。データ構造は処理手順より安定しているため変更に強い。
    related: [E-R図]
  - term: RFP
    reading: アールエフピー
    fullName: Request For Proposal
    japanese: 提案依頼書
    words:
      - { en: Request, ja: 依頼 }
      - { en: For, ja: のための }
      - { en: Proposal, ja: 提案 }
    aliases: [提案依頼書]
    simple: 発注者がベンダに「この条件で提案してください」と依頼する文書です。
    definition: 発注者が調達対象システムの概要、要求事項、契約条件などを示して、ベンダに提案書の提出を依頼する文書。
    related: [RFI, 提案書]
  - term: RFI
    reading: アールエフアイ
    fullName: Request For Information
    japanese: 情報提供依頼書
    words:
      - { en: Request, ja: 依頼 }
      - { en: For, ja: のための }
      - { en: Information, ja: 情報 }
    aliases: [情報提供依頼書]
    simple: 発注前に、ベンダに技術や製品の情報を出してもらうよう依頼する文書です。
    definition: RFP の作成に先立ち、ベンダに技術動向や製品・サービスなどの情報提供を依頼する文書。
    related: [RFP]
  - term: 提案書
    reading: ていあんしょ
    aliases: [見積書, 提案評価, 調達選定]
    simple: ベンダが、発注者の要求にどう応えるかと費用を示して出す文書です。
    definition: RFP を受けたベンダが、実現方法・体制・スケジュール・費用などを示して提出する文書。発注者は評価基準に基づいて提案を評価し調達先を選定する。
    related: [RFP]
  - term: 企画競争入札
    reading: きかくきょうそうにゅうさつ
    aliases: [企画競争, プロポーザル方式]
    simple: 複数の会社から提案を集め、内容が最も優れた会社を選ぶ方法です。
    definition: 複数の事業者から企画・提案を募り、提案内容を評価して最も優れた提案を行った事業者を選定する調達方式。
    related: [一般競争入札]
  - term: 一般競争入札
    reading: いっぱんきょうそうにゅうさつ
    aliases: [指名競争入札, 随意契約]
    simple: 広く参加者を募り、原則として最も有利な価格の会社と契約する方法です。
    definition: 調達内容を公告して参加資格を満たす事業者を広く募り、原則として最も有利な価格を示した者と契約する方式。指名した者だけで競う指名競争入札、競争によらない随意契約と対比される。
    related: [企画競争入札]
  - term: 準委任契約
    reading: じゅんいにんけいやく
    simple: 仕事を誠実に行う義務はあるが、完成させる義務はない契約です。
    definition: 受託者が善良な管理者の注意をもって委託された事務を処理する義務を負い、成果物の完成義務は負わない契約。
    related: [請負契約]
  - term: 請負契約
    reading: うけおいけいやく
    simple: 仕事を完成させることを約束し、その結果に報酬が支払われる契約です。
    definition: 受託者が仕事の完成を約し、委託者がその結果に対して報酬を支払う契約。受託者は完成義務と契約不適合責任を負う。
    related: [準委任契約]
  - term: グリーン調達
    reading: グリーンちょうたつ
    aliases: [グリーン購入]
    simple: 物を買うとき、環境への負担が小さいものを優先して選ぶことです。
    definition: 製品・サービスなどを調達する際に、品質や価格に加えて環境負荷ができるだけ小さいものを優先して選ぶこと。
  - term: 内外作基準
    reading: ないがいさくきじゅん
    simple: 仕事を自社でやるか外部に任せるかを判断する基準です。
    definition: 開発や運用の作業を自社で行う（内作）か外部に委託する（外作）かを、コスト・品質・技術力・機密保持などから判断する基準。
