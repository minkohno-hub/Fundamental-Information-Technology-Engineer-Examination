category: アルゴリズムとプログラミング
terms:
  - term: 最大値
    reading: さいだいち
    simple: 集まりの中で最も大きい値のことです。
    definition: データの集まりの中で最も大きい値。プログラムで求める際は、候補を保持する変数を用意し、走査しながら「現在の候補より大きい値が現れたら置き換える」という更新を繰り返す。2番目に大きい値も同時に求める場合は、最大値の更新時に元の最大値を2番目の候補へ退避させる。
    related: [配列]
  - term: 完全数
    reading: かんぜんすう
    simple: 自分自身を除いた約数の合計が、元の数とぴったり等しくなる数です。
    definition: 正の整数のうち、その数自身を除く約数（真の約数）の合計が、その数自身と等しくなる数。例えば 28 の真の約数は 1、2、4、7、14 で、合計は 28 になる。6、496 などが知られている。
    related: [剰余]
