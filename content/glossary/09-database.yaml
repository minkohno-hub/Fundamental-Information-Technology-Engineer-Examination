category: データベース
terms:
  - term: 関係データベース
    reading: かんけいデータベース
    fullName: Relational Database
    japanese: 関係データベース（リレーショナルデータベース）
    aliases: [RDB, リレーショナルデータベース]
    words:
      - { en: Relational, ja: 関係の（表どうしの関係に基づく） }
      - { en: Database, ja: データベース }
    simple: データを行と列からなる「表」で管理し、表どうしを関連付けて扱うデータベースです。
    definition: 関係モデルに基づき、データを表（関係）として管理し、SQL で操作するデータベース。表の行を組（タプル）、列を属性、属性がとりうる値の集合を定義域という。
    related: [SQL, 正規化, NoSQL]
  - term: NoSQL
    reading: ノーエスキューエル
    fullName: Not only SQL
    japanese: SQL だけではない（非関係型のデータベースの総称）
    words:
      - { en: Not only, ja: 〜だけではない }
      - { en: SQL, ja: 関係データベースの問合せ言語 }
    simple: 表の形にこだわらず、目的に合わせた形でデータを保存するデータベースの総称です。
    definition: 関係モデル以外のデータモデルを採用するデータベースの総称。キーバリュー型、ドキュメント指向型、列指向型、グラフ型などがあり、大量データの高速処理や水平分散に向く。
    related: [関係データベース, ビッグデータ]
  - term: 3層スキーマ
    reading: さんそうスキーマ
    simple: データベースの構造を「利用者から見た形」「全体の論理構造」「物理的な格納方法」の3層に分けて定義する考え方です。
    definition: 外部スキーマ（利用者・アプリケーションから見た構造）、概念スキーマ（データベース全体の論理構造）、内部スキーマ（物理的な格納構造）の3層でデータベースを定義するアーキテクチャ。データの独立性を高める。
    related: [関係データベース]
  - term: データモデル
    reading: データモデル
    simple: データをどのような形で表して管理するかの枠組みです。
    definition: データの構造・操作・制約を表現する枠組み。木構造の階層モデル、網目状のネットワークモデル、表で表す関係モデル、グラフ型などがある。
    related: [関係データベース, E-R図]
  - term: 排他制御
    reading: はいたせいぎょ
    aliases: [同時実行制御]
    simple: 複数の人が同時に同じデータを更新しても、矛盾が起きないように順番を制御することです。
    definition: 複数のトランザクションによる同一データへの同時アクセスを制御して整合性を保つ仕組み。読取り用の共有ロックと更新用の専有ロックがあり、共有ロックどうしは両立するが専有ロックは他のロックと両立しない。
    related: [デッドロック, トランザクション]
  - term: データディクショナリ
    reading: データディクショナリ
    aliases: [データ辞書]
    simple: データの名前・意味・型などの「データについての情報」を一か所にまとめて管理する辞書です。
    definition: データ項目の名称・意味・型・桁数・関連などのメタデータを一元管理する仕組み。
    related: [関係データベース]
  - term: E-R図
    reading: イーアールず
    fullName: Entity-Relationship diagram
    japanese: 実体関連図
    words:
      - { en: Entity, ja: 実体（管理対象のもの） }
      - { en: Relationship, ja: 関連 }
      - { en: diagram, ja: 図 }
    simple: 管理したい「もの」（顧客、注文など）と、それらの間の関係を表す図です。
    definition: 実体（エンティティ）、属性、実体間の関連（リレーションシップ）とその多重度（1対1、1対多、多対多）を表した図。多対多は連関エンティティを設けて1対多に分解する。
    related: [正規化, データモデル]
  - term: 正規化
    reading: せいきか（データベース）
    simple: 表を分けてデータの重複をなくし、更新したときに矛盾が起きないように整理することです。
    definition: 関係データベースの表を、関数従属に基づいて分解し、データの冗長性と更新時異状を排除すること。第1正規形（繰返し項目の排除）、第2正規形（部分関数従属の排除）、第3正規形（推移関数従属の排除）と段階的に進める。
    difference: 浮動小数点数の正規化とは別の概念。
    related: [関数従属, E-R図]
  - term: 関数従属
    reading: かんすうじゅうぞく
    simple: ある項目の値が決まると、別の項目の値が1つに決まる関係のことです。
    definition: 属性 X の値が決まると属性 Y の値が一意に決まる関係（X→Y）。複合キーの一部だけに従属するものを部分関数従属、非キー属性を介して従属するものを推移関数従属、キー全体にだけ従属するものを完全関数従属という。
    related: [正規化]
  - term: 主キー
    reading: しゅキー
    simple: 表の各行を1つに特定するための項目です。重複も空欄も許されません。
    definition: 表の行を一意に識別する列（または列の組）。一意性制約と非 NULL 制約が課される。値が存在しない・不明であることを表す標識を NULL という。
    related: [外部キー, 関係データベース]
  - term: 外部キー
    reading: がいぶキー
    simple: 別の表の主キーを参照する項目で、存在しない値が入らないようにして表どうしをつなぎます。
    definition: 他の表の主キー（または一意キー）を参照する列。参照制約により、参照先に存在しない値（NULL を除く）は格納できない。値の範囲を制限するのは検査制約。
    related: [主キー]
  - term: 物理設計
    reading: ぶつりせっけい
    aliases: [データベースの物理設計]
    simple: データベースを実際の記憶装置にどう格納するか（容量、索引など）を決める設計です。
    definition: 論理設計の結果を DBMS と記憶装置上の格納構造に対応付け、容量の見積り、索引の設計、性能評価などを行う設計工程。
    related: [インデックス]
  - term: 関係代数
    reading: かんけいだいすう
    simple: 表に対して「列を取り出す」「行を選ぶ」「表をつなぐ」などの操作を定めた理論です。SQL の基礎になっています。
    definition: 関係（表）に対する演算体系。射影（列の抽出）、選択（行の抽出）、結合、直積、和、差、共通などの演算がある。
    related: [SQL]
  - term: SQL
    reading: エスキューエル
    fullName: Structured Query Language
    japanese: 構造化問合せ言語
    words:
      - { en: Structured, ja: 構造化された }
      - { en: Query, ja: 問合せ }
      - { en: Language, ja: 言語 }
    simple: 関係データベースのデータを検索・追加・更新・削除するための言語です。
    definition: 関係データベースの定義（CREATE など）・操作（SELECT・INSERT・UPDATE・DELETE）・制御（GRANT・COMMIT など）を行う標準言語（JIS X 3005）。グループごとの条件は HAVING 句に書く。LIKE の % は0文字以上、_ は1文字に一致する。BETWEEN は両端を含む。
    related: [関係データベース, 副問合せ, 結合]
  - term: 副問合せ
    reading: ふくといあわせ
    aliases: [サブクエリ]
    simple: SQL 文の中に入れ子にして書く、もう一つの問合せ（SELECT 文）です。
    definition: SQL 文の中に記述した SELECT 文。外側の問合せの値を参照するものを相関副問合せといい、EXISTS と組み合わせて「〜が存在する行」を求めるのに使う。
    related: [SQL]
  - term: 結合
    reading: けつごう
    aliases: [JOIN]
    simple: 共通の項目を手がかりに、複数の表をつなぎ合わせることです。
    definition: 2つの表を結合条件で組み合わせる操作。条件に合う行だけを残す内部結合、一方の表の全行を残し合わない側を NULL にする外部結合、同じ表どうしを結合する自己結合がある。
    related: [SQL, 関係代数]
  - term: デッドロック
    reading: デッドロック
    simple: 2つ以上の処理が、お互いに相手が持っている資源の解放を待ち続けて、動けなくなる状態です。
    definition: 複数のトランザクション（プロセス）が、互いに相手が占有する資源の解放を待って処理が進まなくなる状態。資源の獲得順序を統一すると防止でき、発生時は一方をロールバックして解消する。
    related: [排他制御]
  - term: 障害回復
    reading: しょうがいかいふく
    simple: 障害が起きたときに、ログなどを使ってデータベースを正しい状態に戻すことです。
    definition: 更新前ログでトランザクションを取り消すロールバック（後退復帰）、バックアップに更新後ログを適用するロールフォワード（前進復帰）などで回復する。チェックポイントはバッファの内容をディスクに書き出す時点で、回復処理の起点となる。
    related: [トランザクション, バックアップ]
  - term: トランザクション
    reading: トランザクション
    simple: 「全部成功」か「全部取り消し」のどちらかになるように、ひとまとまりで扱う一連の処理です。
    definition: データベースに対する一連の処理の単位。原子性（Atomicity）・一貫性（Consistency）・独立性（Isolation）・耐久性（Durability）の ACID 特性を満たす必要がある。COMMIT で確定、ROLLBACK で取消しを行う。
    related: [排他制御, 障害回復]
  - term: インデックス
    reading: インデックス
    aliases: [索引]
    simple: 本の索引のように、目的のデータをすばやく見つけるための仕組みです。
    definition: 列の値から行の格納位置を高速に特定するためのデータ構造。検索は速くなるが、更新時にインデックスの更新が必要になり負荷と領域が増える。B-tree、ビットマップ、ハッシュ、転置インデックスなどがある。
    related: [B木, 物理設計]
  - term: ETL
    reading: イーティーエル
    fullName: Extract / Transform / Load
    japanese: 抽出・変換・格納
    words:
      - { en: Extract, ja: 抽出する }
      - { en: Transform, ja: 変換する }
      - { en: Load, ja: 格納する（読み込ませる） }
    simple: いろいろなシステムからデータを取り出し、使いやすい形に整えて、分析用のデータベースに入れる処理です。
    definition: 業務システムなどからデータを抽出し、形式の統一・クレンジング・集計などの変換を行い、データウェアハウス等へ格納する処理。誤りや重複・表記揺れを修正することをデータクレンジングという。
    related: [データウェアハウス, データレイク]
  - term: データウェアハウス
    reading: データウェアハウス
    aliases: [DWH]
    simple: 分析のために、いろいろなシステムのデータを整理して時系列にためておく大きなデータベースです。
    definition: 意思決定支援のため、複数の業務システムのデータを目的別に統合し、時系列で蓄積したデータベース。特定部門向けに切り出したものをデータマートという。業務処理を即時に行う OLTP に対し、多次元分析を OLAP という。
    related: [ETL, データレイク, BI]
  - term: 2相コミットメント
    reading: にそうコミットメント
    aliases: [2相コミット, 2フェーズコミット]
    simple: 複数のデータベースにまたがる更新を、「準備できた？」と確認してから全員一斉に確定させる方法です。
    definition: 分散トランザクションで、第1相で全参加サイトにコミット可否を問い合わせ、第2相で全サイトが可ならコミット、1つでも不可ならロールバックを指示する制御方式。
    related: [分散データベース, トランザクション]
  - term: 分散データベース
    reading: ぶんさんデータベース
    simple: ネットワーク上の複数の場所にあるデータベースを、1つのデータベースのように扱えるようにしたものです。
    definition: 複数のサイトに分散配置されたデータベースを、利用者が配置を意識せずに（透過的に）利用できるようにしたもの。複製を複数サイトに保持することをレプリケーションという。
    related: [2相コミットメント]
  - term: データレイク
    reading: データレイク
    simple: 形式の違うさまざまなデータを、加工せずにそのままためておく大きな保存場所です。
    definition: 構造化データ（表）、半構造化データ（JSON、XML、ログなど）、非構造化データ（画像・音声・文書など）を元の形式のまま大量に蓄積するデータ基盤。
    related: [データウェアハウス, ビッグデータ]
  - term: 関係
    reading: かんけい
    aliases: [リレーション]
    simple: 関係データベースで、行と列でできた表のことです。
    definition: 関係モデルにおける表（テーブル）。属性の集まりに対して、タプルの集合として定義される。
    related: [関係データベース, タプル, 属性]
  - term: タプル
    reading: たぷる
    simple: 関係(表)の1行にあたる、データの組です。
    definition: 関係（表）の行に相当する、属性値の組。レコードともいう。
    related: [関係データベース, 関係, 属性]
  - term: 属性
    reading: ぞくせい
    aliases: [アトリビュート]
    simple: 関係(表)の1列にあたる、データの項目です。
    definition: 関係（表）の列に相当する、データの項目。フィールド、カラムともいう。
    related: [関係データベース, 関係, タプル, 定義域]
  - term: 定義域
    reading: ていぎいき
    aliases: [ドメイン]
    simple: ある属性が取ることのできる値の範囲です。
    definition: 属性がとり得る値の集合。データ型や値の範囲として定義する。
    related: [関係データベース, 属性]
  - term: インメモリデータベース
    reading: いんめもりでーたべーす
    simple: データを主記憶(メモリ)の上に置いて、高速に処理するデータベースです。
    definition: データを主に主記憶上に保持して処理するデータベース。ディスク入出力が少なく高速だが、電源断に備えた永続化の工夫が必要となる。
    related: [関係データベース, NoSQL]
  - term: キーバリュー型データベース
    reading: きーばりゅーがたでーたべーす
    simple: キーと値の組で、データを格納するデータベースです。
    definition: キーとそれに対応する値の組でデータを管理する NoSQL データベース。単純で高速、スケールアウトしやすい。
    related: [NoSQL, ドキュメント指向データベース]
  - term: ドキュメント指向データベース
    reading: どきゅめんとしこうでーたべーす
    simple: JSONのような文書(ドキュメント)の形で、データを格納するデータベースです。
    definition: JSON などの構造をもつ文書（ドキュメント）を単位としてデータを格納・検索する NoSQL データベース。スキーマを柔軟に変更しやすい。
    related: [NoSQL, キーバリュー型データベース, JSON]
  - term: 列指向データベース
    reading: れつしこうでーたべーす
    aliases: [カラム指向データベース]
    simple: データを行ではなく列ごとにまとめて格納するデータベースで、集計に向いています。
    definition: データを列単位でまとめて格納するデータベース。特定の列に対する集計や分析が高速。
    related: [NoSQL, データウェアハウス]
  - term: グラフデータベース
    reading: ぐらふでーたべーす
    simple: 人のつながりのような、データ間の関係をグラフ構造で格納するデータベースです。
    definition: ノード（頂点）とエッジ（辺）でデータとその関係を表現して格納するデータベース。SNS の友人関係や推薦など、関係をたどる処理に適する。
    related: [NoSQL, グラフ理論]
  - term: 外部スキーマ
    reading: がいぶすきーま
    simple: 利用者やアプリケーションから見える、データの見え方を定義したスキーマです。
    definition: "3 層スキーマで、個々の利用者やアプリケーションから見たデータの形（ビュー）を定義するスキーマ。"
    related: ["3層スキーマ", 概念スキーマ, 内部スキーマ]
  - term: 概念スキーマ
    reading: がいねんすきーま
    simple: データベース全体の論理的な構造を定義したスキーマです。
    definition: "3 層スキーマで、データベース全体の論理的な構造（表、項目、制約）を定義するスキーマ。物理的な格納方法には依存しない。"
    related: ["3層スキーマ", 外部スキーマ, 内部スキーマ]
  - term: 内部スキーマ
    reading: ないぶすきーま
    simple: データをディスク上にどう格納するかなど、物理的な構造を定義したスキーマです。
    definition: "3 層スキーマで、データの物理的な格納方法（ファイル、索引、格納領域など）を定義するスキーマ。"
    related: ["3層スキーマ", 外部スキーマ, 概念スキーマ]
  - term: データの独立性
    reading: でーたのどくりつせい
    simple: データの構造を変えても、アプリケーションに影響が出ないようにする性質です。
    definition: スキーマの変更がアプリケーションに影響しないようにする性質。物理的な変更が概念スキーマに影響しない物理データ独立性と、論理的な変更が外部スキーマに影響しない論理データ独立性がある。
    related: ["3層スキーマ"]
  - term: 階層モデル
    reading: かいそうもでる
    simple: データを親子関係の木構造で表す、古いデータモデルです。
    definition: データを木構造（親と子の 1 対多の関係）で表現するデータモデル。1 つの子は 1 つの親しかもてない。
    related: [データモデル, ネットワークモデル, 関係モデル]
  - term: ネットワークモデル
    reading: ねっとわーくもでる
    aliases: [網モデル]
    simple: 親子関係に加えて、1つの子が複数の親をもてる、古いデータモデルです。
    definition: データを網状の構造（多対多の関係）で表現するデータモデル。階層モデルを拡張し、1 つの子が複数の親をもてる。網モデルともいう。
    related: [データモデル, 階層モデル, 網型データベース]
  - term: 関係モデル
    reading: かんけいもでる
    simple: データを表(関係)の形で表現するデータモデルで、現在の関係データベースの基礎です。
    definition: データを、行と列から成る表（関係）で表現するデータモデル。コッドが提唱し、集合論に基づく関係代数で操作する。関係データベースの基礎。
    related: [データモデル, 関係データベース, 関係代数]
  - term: 論理データモデル
    reading: ろんりでーたもでる
    simple: 業務で扱うデータを、特定のDBMSに依存しない形で整理したモデルです。
    definition: 概念データモデルをもとに、データ項目や関係を整理したもの。関係データベースでは表や主キーなどに展開し、正規化を行う。物理データモデルの前段階。
    related: [データモデル, 物理データモデル, E-R図]
  - term: 物理データモデル
    reading: ぶつりでーたもでる
    simple: 実際に使うDBMSやディスクの特性に合わせて、格納方法まで決めたモデルです。
    definition: 論理データモデルをもとに、使用する DBMS の仕様や性能要件に合わせて、データ型、索引、格納領域などの実装の詳細を定義したモデル。
    related: [データモデル, 論理データモデル, 物理設計]
  - term: ロック
    reading: ろっく
    simple: あるトランザクションがデータを使っている間、ほかのトランザクションが使えないようにする仕組みです。
    definition: データを更新・参照している間、他のトランザクションによるアクセスを制限して、データの整合性を保つ仕組み。
    related: [排他制御, 共有ロック, 専有ロック, ロック粒度]
  - term: 共有ロック
    reading: きょうゆうろっく
    simple: 読み取りのためのロックで、ほかのトランザクションも読み取りだけはできます。
    definition: 参照のためにかけるロック。他のトランザクションも共有ロックをかけて参照できるが、更新はできない。
    related: [排他制御, 専有ロック, ロック]
  - term: 専有ロック
    reading: せんゆうろっく
    aliases: [占有ロック, 排他ロック]
    simple: 更新のためのロックで、ほかのトランザクションは読み取りも更新もできなくなります。
    definition: 更新のためにかけるロック。他のトランザクションは共有ロックも専有ロックもかけられず、参照・更新ができない。
    related: [排他制御, 共有ロック, ロック]
  - term: ロック粒度
    reading: ろっくりゅうど
    simple: ロックをかける範囲の大きさ(表全体か、行ごとかなど)のことです。
    definition: ロックをかけるデータの範囲の大きさ（表、ページ、行など）。粒度が細かいほど同時実行性が高いが、管理のコストが増える。
    related: [排他制御, ロック]
  - term: "2相ロック"
    reading: にそうろっく
    aliases: ["2相ロックプロトコル"]
    simple: ロックをかける段階とはずす段階を分けて、同時実行しても結果が正しくなるようにする方式です。
    definition: トランザクションがロックを獲得するだけの段階（成長相）と、解放するだけの段階（縮退相）を分け、同時実行しても直列化可能性を保証するロック方式。
    related: [排他制御, ロック, デッドロック]
  - term: メタデータ
    reading: めたでーた
    simple: データについてのデータで、データの意味や形式などを説明する情報です。
    definition: データそのものではなく、そのデータの内容、形式、作成者、更新日時などを説明するデータ。データディクショナリに格納される。
    related: [データディクショナリ]
  - term: IRDS
    reading: あいあーるでぃーえす
    fullName: Information Resource Dictionary System
    japanese: 情報資源辞書システム
    words:
      - { en: Information Resource, ja: 情報資源 }
      - { en: Dictionary, ja: 辞書 }
      - { en: System, ja: システム }
    simple: 組織の情報資源の定義を一元的に管理するための、データディクショナリの標準的な仕組みです。
    definition: 組織が扱うデータやプログラムなどの情報資源の定義情報を一元管理するシステムに関する標準規格（ISO/IEC 10027 など）。
    related: [データディクショナリ, メタデータ]
  - term: エンティティ
    reading: えんてぃてぃ
    aliases: [実体]
    simple: 業務の中で管理したい対象(顧客や商品など)を表すものです。
    definition: データとして管理する対象（人、物、事象など）。E-R 図では長方形で表し、後に表として実装される。
    related: [E-R図, リレーションシップ, 連関エンティティ]
  - term: リレーションシップ
    reading: りれーしょんしっぷ
    aliases: [関連]
    simple: エンティティどうしの結びつきを表すものです。
    definition: E-R 図で、エンティティ間の関連を表す線。多重度（1 対 1、1 対多、多対多）をあわせて示す。
    related: [E-R図, エンティティ, 多重度]
  - term: 多重度
    reading: たじゅうど
    aliases: [カーディナリティ]
    simple: エンティティどうしが、いくつ対応するかを表す情報です(1対多など)。
    definition: エンティティ間の関連で、一方のインスタンスが他方のいくつと対応するかを示す数。1 対 1、1 対多、多対多がある。
    related: [E-R図, リレーションシップ]
  - term: 連関エンティティ
    reading: れんかんえんてぃてぃ
    aliases: [関連エンティティ]
    simple: 多対多の関係を、2つの1対多に分解するために置くエンティティです。
    definition: 多対多のリレーションシップを解消するために、2 つのエンティティの間に置く新たなエンティティ。両エンティティの主キーを含む。
    related: [E-R図, エンティティ, 多重度]
  - term: 概念データモデル
    reading: がいねんでーたもでる
    simple: 業務で扱うデータを、DBMSなどに依存せず、全体像として整理したモデルです。
    definition: 業務で扱うデータの対象と関係を、DBMS やデータベースの実装に依存せずに整理したモデル。E-R 図で表現する。
    related: [E-R図, 論理データモデル]
  - term: 第1正規形
    reading: だいいちせいきけい
    simple: 繰返し項目をなくし、1つの欄には1つの値だけが入っている形です。
    definition: すべての属性の値が分割できない単一の値（繰返しや複数値をもたない）である関係。
    related: [正規化, 第2正規形, 非正規形]
  - term: 第2正規形
    reading: だいにせいきけい
    simple: 第1正規形で、主キーの一部だけで決まる項目をなくした形です。
    definition: 第 1 正規形で、主キー以外の属性が主キーの一部だけに関数従属する部分関数従属をなくした関係。
    related: [正規化, 第1正規形, 第3正規形, 部分関数従属]
  - term: 第3正規形
    reading: だいさんせいきけい
    simple: 第2正規形で、主キー以外の項目から決まる項目をなくした形です。
    definition: 第 2 正規形で、主キー以外の属性が他の非キー属性を経由して主キーに従属する推移関数従属をなくした関係。
    related: [正規化, 第2正規形, 推移関数従属]
  - term: 非正規形
    reading: ひせいきけい
    simple: 正規化されていなくて、繰返し項目などが含まれている表の形です。
    definition: 繰返し項目（1 つの欄に複数の値）を含み、第 1 正規形にもなっていない関係。
    related: [正規化, 第1正規形]
  - term: 更新時異状
    reading: こうしんじいじょう
    aliases: [更新時異常, 更新異状]
    simple: 正規化されていない表で、挿入・更新・削除をしたときに起こるデータの矛盾です。
    definition: 正規化が不十分な表で、データの挿入・更新・削除の際に発生する不都合（挿入時異状、更新時異状、削除時異状）の総称。
    related: [正規化]
  - term: 完全関数従属
    reading: かんぜんかんすうじゅうぞく
    simple: 主キー全体によって、はじめて決まる関係です。
    definition: 属性 Y が複合主キー X の全体に関数従属し、X の真部分集合には関数従属しない関係。
    related: [関数従属, 部分関数従属]
  - term: 部分関数従属
    reading: ぶぶんかんすうじゅうぞく
    simple: 複合キーの一部だけで、決まってしまう関係です。
    definition: 属性 Y が主キー X の一部の属性だけに関数従属している関係。第 2 正規形で取り除く対象。
    related: [関数従属, 完全関数従属, 第2正規形]
  - term: 推移関数従属
    reading: すいいかんすうじゅうぞく
    simple: A→B、B→Cとなっていて、AからCが間接的に決まる関係です。
    definition: 属性 A が B を決め、B が C を決める（A→B、B→C）とき、A が C を間接的に決定する関係。第 3 正規形で取り除く対象。
    related: [関数従属, 第3正規形]
  - term: 一意性制約
    reading: いちいせいせいやく
    aliases: [UNIQUE制約]
    simple: 列の値が、表の中で重複しないようにする制約です。
    definition: 指定した列（の組）の値が表内で重複しないことを保証する制約。主キーには一意性制約と非 NULL 制約が課される。
    related: [主キー, 非NULL制約]
  - term: 非NULL制約
    reading: ひぬるせいやく
    aliases: [NOT NULL制約]
    simple: 列に、値が入っていない状態(NULL)を許さない制約です。
    definition: 指定した列に NULL を格納できないようにする制約。
    related: [主キー, 一意性制約, "NULL"]
  - term: 複合キー
    reading: ふくごうきー
    simple: 複数の列を組み合わせて、1行を特定するキーです。
    definition: 単独の列では行を一意に識別できないとき、複数の列の組合せで構成する主キーまたは候補キー。
    related: [主キー, 候補キー]
  - term: 候補キー
    reading: こうほきー
    simple: 主キーになれる条件を満たしている列(の組)のことです。
    definition: 行を一意に識別できる最小の属性の組。候補キーの中から主キーを 1 つ選ぶ。
    related: [主キー, 複合キー]
  - term: "NULL"
    reading: ぬる
    simple: 「値がない」「不明」を表す特別な値で、0や空文字とは違います。
    definition: 値が存在しない、または不明であることを表す特別な値。0 や空文字列とは異なり、比較すると結果は不明（UNKNOWN）になる。
    related: [主キー, 非NULL制約]
  - term: 参照制約
    reading: さんしょうせいやく
    aliases: [参照整合性制約]
    simple: 外部キーの値が、参照先の表に必ず存在するようにする制約です。
    definition: 外部キーの値が、参照先の表の主キーに存在する値か NULL でなければならないとする制約。参照整合性を保つ。
    related: [外部キー, 主キー]
  - term: 検査制約
    reading: けんさせいやく
    aliases: [CHECK制約]
    simple: 列に入る値が、指定した条件を満たすようにする制約です。
    definition: 列の値が満たすべき条件（例：年齢 >= 0）を指定し、それに違反するデータの登録を拒否する制約。
    related: [外部キー, 主キー]
  - term: ディスク容量見積り
    reading: でぃすくようりょうみつもり
    simple: データベースに必要な、ディスクの容量を見積もることです。
    definition: 行数、行長、索引の大きさなどから、データベースに必要なディスク容量を見積もる作業。物理設計の一部。
    related: [物理設計, インデックス]
  - term: 射影
    reading: しゃえい
    simple: 表から、必要な列だけを取り出す操作です。
    definition: 関係から指定した属性（列）だけを取り出す操作。SQL では SELECT 句の列指定に相当する。
    related: [関係代数, 選択（関係代数）, 結合（関係代数）]
  - term: 選択（関係代数）
    reading: せんたくかんけいだいすう
    simple: 表から、条件に合う行だけを取り出す操作です。
    definition: 関係から条件を満たすタプル（行）だけを取り出す操作。SQL では WHERE 句に相当する。
    related: [関係代数, 射影]
  - term: 結合（関係代数）
    reading: けつごうかんけいだいすう
    simple: "2つの表を、共通する列の値が等しい行どうしで1つにつなげる操作です。"
    definition: "2 つの関係を、指定した条件（通常は共通属性の値が等しいこと）を満たすタプルの組合せとして 1 つにつなげる操作。SQL では JOIN に相当する。"
    related: [関係代数, 結合, 直積]
  - term: 直積
    reading: ちょくせき
    simple: "2つの表のすべての行の組合せを作る操作です。"
    definition: "2 つの関係のタプルのすべての組合せを作る操作。行数は両関係の行数の積になる。結合の基になる。"
    related: [関係代数, 結合（関係代数）]
  - term: 和集合（関係代数）
    reading: わしゅうごうかんけいだいすう
    simple: "2つの表の行を合わせて、重複をなくした1つの表にする操作です。"
    definition: 同じ属性構成をもつ 2 つの関係について、いずれかに含まれるタプルをすべて集めた関係を作る操作（重複は除く）。SQL の UNION に相当する。
    related: [関係代数, 差集合]
  - term: 差集合
    reading: さしゅうごう
    simple: 一方の表にあって、もう一方の表にない行を取り出す操作です。
    definition: 同じ属性構成をもつ 2 つの関係について、一方に含まれ他方に含まれないタプルを取り出す操作。SQL の EXCEPT に相当する。
    related: [関係代数, 和集合（関係代数）]
  - term: SELECT
    reading: せれくと
    simple: 表からデータを取り出すSQLの基本の命令です。
    definition: 表から、指定した列、条件に合う行を取り出す SQL の問合せ文。
    related: [SQL, GROUP BY, ORDER BY]
  - term: GROUP BY
    reading: ぐるーぷばい
    simple: 指定した列の値が同じ行をまとめて、グループごとに集計するための句です。
    definition: SELECT 文で、指定した列の値が等しい行をグループにまとめ、グループごとに集約関数で集計するための句。
    related: [SQL, HAVING, 集約関数]
  - term: HAVING
    reading: はびんぐ
    simple: GROUP BYでまとめたグループに対して、条件をつけるための句です。
    definition: GROUP BY で作ったグループに対する条件を指定する句。WHERE 句が行の絞込み、HAVING 句がグループの絞込み。
    related: [SQL, GROUP BY]
  - term: ORDER BY
    reading: おーだーばい
    simple: 結果を、指定した列の順に並べ替えるための句です。
    definition: SELECT 文の結果の行を、指定した列の昇順（ASC）または降順（DESC）に並べ替える句。
    related: [SQL, SELECT]
  - term: LIKE
    reading: らいく
    simple: 文字列の一部が一致する行を探す、あいまい検索のための演算子です。
    definition: 文字列が指定したパターンに一致するかを判定する SQL の演算子。% は任意の長さの文字列、_ は任意の 1 文字を表す。
    related: [SQL, SELECT]
  - term: BETWEEN
    reading: びとうぃーん
    simple: 値が、指定した範囲に入っているかを調べる演算子です。
    definition: 値が指定した下限以上かつ上限以下であるかを判定する SQL の演算子。両端の値を含む。
    related: [SQL, SELECT]
  - term: GRANT
    reading: ぐらんと
    simple: ユーザーに、表などへの操作の権限を与えるSQL文です。
    definition: 利用者に対して、表やビューへの SELECT、UPDATE などの権限を与える SQL 文。
    related: [SQL, REVOKE, アクセス権]
  - term: REVOKE
    reading: りぼーく
    simple: ユーザーに与えていた権限を取り消すSQL文です。
    definition: 利用者に与えていた権限を取り消す SQL 文。
    related: [SQL, GRANT]
  - term: ビュー
    reading: びゅー
    aliases: [VIEW, 仮想表]
    simple: 表から必要な部分を取り出して、仮想的な表として見せる仕組みです。
    definition: 実表に対する問合せ結果を、仮想的な表として定義したもの。データを実体としてはもたず、利用者ごとに見せる範囲を限定するのに使える。
    related: [SQL, 外部スキーマ]
  - term: カーソル
    reading: かーそる
    simple: 問合せの結果を、1行ずつ取り出して処理するための仕組みです。
    definition: SELECT 文が返す複数行の結果を、プログラムから 1 行ずつ取り出すための仕組み。
    related: [SQL, 埋込みSQL]
  - term: 埋込みSQL
    reading: うめこみえすきゅーえる
    simple: プログラム言語の中に、SQL文を埋め込んで書く方式です。
    definition: C や COBOL などのホスト言語のプログラム中に SQL 文を埋め込んで記述し、データベースを操作する方式。
    related: [SQL, カーソル]
  - term: 集約関数
    reading: しゅうやくかんすう
    aliases: [集計関数]
    simple: 複数の行から、合計や平均などを1つの値として求める関数です。
    definition: 複数行の値から 1 つの値を求める関数。COUNT、SUM、AVG、MAX、MIN など。
    related: [SQL, COUNT, GROUP BY]
  - term: COUNT
    reading: かうんと
    simple: 行の数を数える集約関数です。
    definition: 行数、または NULL でない値の個数を数える集約関数。COUNT(*) は NULL を含む行も数え、COUNT(列) は NULL を除いて数える。
    related: [SQL, 集約関数]
  - term: 相関副問合せ
    reading: そうかんふくもんあわせ
    simple: 外側の問合せの値を使って、行ごとに実行される副問合せです。
    definition: 外側の問合せの列を参照する副問合せ。外側の各行ごとに副問合せが評価される。
    related: [副問合せ, EXISTS]
  - term: EXISTS
    reading: えぐじすつ
    simple: 副問合せの結果が1行でもあれば「真」になる演算子です。
    definition: 副問合せが 1 行以上の結果を返せば真になる述語。NOT EXISTS は 1 行も返さないとき真になる。
    related: [副問合せ, 相関副問合せ, IN]
  - term: IN
    reading: いん
    simple: 値が、指定した一覧(または副問合せの結果)のどれかに一致するかを調べる演算子です。
    definition: ある値が、列挙した値の集合または副問合せの結果に含まれるかを判定する述語。
    related: [副問合せ, EXISTS]
  - term: 内部結合
    reading: ないぶけつごう
    aliases: [INNER JOIN]
    simple: 両方の表に対応する行があるものだけを取り出す結合です。
    definition: "2 つの表の結合条件を満たす行の組だけを結果とする結合。どちらかに対応する行がない行は結果に含まれない。"
    related: [結合, 外部結合]
  - term: 外部結合
    reading: がいぶけつごう
    aliases: [OUTER JOIN]
    simple: 対応する行がない側も残して取り出す結合です。
    definition: 結合条件を満たす行に加えて、一方（または両方）の表で対応する行がない行も残し、相手側の列を NULL にして結果に含める結合。左外部結合、右外部結合、完全外部結合がある。
    related: [結合, 内部結合, 左外部結合]
  - term: 左外部結合
    reading: ひだりがいぶけつごう
    aliases: [LEFT OUTER JOIN, LEFT JOIN]
    simple: 左側の表の行はすべて残し、右側の表に対応する行がなければNULLで埋める結合です。
    definition: 左側の表のすべての行を結果に残し、右側の表に対応する行がない場合は右側の列を NULL とする外部結合。
    related: [結合, 外部結合, 内部結合]
  - term: 自己結合
    reading: じこけつごう
    aliases: [セルフジョイン]
    simple: 同じ表どうしを結合することです。
    definition: 同一の表を別名を付けて 2 つの表のように扱い、結合する方法。社員とその上司を同じ表から求める場合など。
    related: [結合, 内部結合]
  - term: ロールフォワード
    reading: ろーるふぉわーど
    simple: 障害が起きたとき、バックアップに更新後ログを適用して、障害直前の状態に戻す処理です。
    definition: バックアップを復元した後、更新後ログ（ジャーナル）を順に適用して、障害発生直前の状態までデータベースを回復する処理。媒体障害時に用いる。
    related: [障害回復, ロールバック, 更新後ログ]
  - term: ロールバック
    reading: ろーるばっく
    aliases: [ROLLBACK]
    simple: 処理の途中で失敗したとき、更新前ログを使って、処理を始める前の状態に戻すことです。
    definition: コミット前のトランザクションの更新を取り消し、トランザクション開始前の状態に戻す処理。更新前ログを使う。
    related: [障害回復, ロールフォワード, コミット]
  - term: チェックポイント
    reading: ちぇっくぽいんと
    simple: 定期的に、メモリ上の更新内容をディスクに書き出して、回復の起点を作る仕組みです。
    definition: 主記憶上の更新内容を二次記憶に反映させ、その時点を記録する仕組み。障害時にはチェックポイント以降のログだけを使って回復できるため、回復時間を短縮できる。
    related: [障害回復, ジャーナル]
  - term: ジャーナル
    reading: じゃーなる
    aliases: [ログファイル]
    simple: データベースの更新の履歴を記録したファイルで、障害回復に使われます。
    definition: データベースの更新内容を時系列に記録したファイル。更新前ログと更新後ログを含み、ロールバックやロールフォワードに用いる。ログファイルともいう。
    related: [障害回復, 更新前ログ, 更新後ログ]
  - term: 更新前ログ
    reading: こうしんまえろぐ
    aliases: [更新前ジャーナル, ビフォアイメージ]
    simple: 更新する前のデータの内容を記録したログで、ロールバックに使います。
    definition: データを更新する前の値を記録したログ。トランザクションの異常終了時に元の値に戻す（ロールバック）ために使う。
    related: [障害回復, ロールバック, 更新後ログ]
  - term: 更新後ログ
    reading: こうしんごろぐ
    aliases: [更新後ジャーナル, アフタイメージ]
    simple: 更新した後のデータの内容を記録したログで、ロールフォワードに使います。
    definition: データを更新した後の値を記録したログ。媒体障害後の回復で、バックアップに更新を再適用する（ロールフォワード）ために使う。
    related: [障害回復, ロールフォワード, 更新前ログ]
  - term: ウォームスタート
    reading: うぉーむすたーと
    simple: 主記憶の内容だけが失われた障害からの再開で、ログを使って短時間で回復する方式です。
    definition: 電源断など、ディスク上のデータは無事で主記憶の内容だけが失われた障害からの再開。チェックポイントとログを用いてコミット済みの更新を反映させ、未コミットの更新を取り消す。
    related: [障害回復, コールドスタート, チェックポイント]
  - term: コールドスタート
    reading: こーるどすたーと
    simple: ログなどに頼らず、データベースを一から起動し直す方式です。
    definition: ログ情報を使わず、システムを初期状態から起動し直す方式。ディスク上のデータが壊れた場合などは、バックアップからの復元が必要になる。
    related: [障害回復, ウォームスタート]
  - term: ACID特性
    reading: あしっどとくせい
    fullName: Atomicity Consistency Isolation Durability
    japanese: 原子性・一貫性・独立性・耐久性
    words:
      - { en: Atomicity, ja: 原子性（全部か無か） }
      - { en: Consistency, ja: 一貫性（整合性を保つ） }
      - { en: Isolation, ja: 独立性（互いに干渉しない） }
      - { en: Durability, ja: 耐久性（確定したら失われない） }
    simple: トランザクションが守るべき、原子性・一貫性・独立性・耐久性という4つの性質です。
    definition: トランザクションが満たすべき 4 つの性質。原子性（全部実行されるか全く実行されないか）、一貫性（整合性が保たれる）、独立性（並行して実行しても互いに影響しない）、耐久性（コミット後は障害でも失われない）。
    related: [トランザクション, 原子性, 一貫性, 独立性, 耐久性]
  - term: 原子性
    reading: げんしせい
    aliases: [アトミシティ]
    simple: トランザクションの処理が、すべて実行されるか、まったく実行されないかのどちらかになる性質です。
    definition: トランザクションの処理がすべて完了するか、全く実行されなかったことになるかのどちらかであり、中途半端な状態が残らない性質。
    related: [ACID特性, トランザクション]
  - term: 一貫性
    reading: いっかんせい
    aliases: [整合性]
    simple: トランザクションの前後で、データの整合性が保たれる性質です。
    definition: トランザクションの実行前後で、データベースが定められた制約を満たす整合した状態に保たれる性質。
    related: [ACID特性, トランザクション]
  - term: 独立性
    reading: どくりつせい
    aliases: [分離性, 隔離性]
    simple: 複数のトランザクションを同時に実行しても、互いの処理が影響し合わない性質です。
    definition: 並行して実行される複数のトランザクションが互いに干渉せず、あたかも一つずつ順に実行されたかのような結果になる性質。
    related: [ACID特性, トランザクション, 排他制御]
  - term: 耐久性
    reading: たいきゅうせい
    aliases: [永続性]
    simple: コミットして確定した結果は、障害が起きても失われない性質です。
    definition: コミットされたトランザクションの結果が、システム障害が発生しても失われず永続的に保持される性質。ログなどで保証する。
    related: [ACID特性, トランザクション, 障害回復]
  - term: コミット
    reading: こみっと
    aliases: [COMMIT]
    simple: トランザクションの更新内容を、確定させることです。
    definition: トランザクションの処理が正常に終了したとき、その更新内容をデータベースに確定させること。コミット後は取り消せない。
    related: [トランザクション, ロールバック]
  - term: B-treeインデックス
    reading: びーつりーいんでっくす
    aliases: [B木インデックス]
    simple: B木という平衡木の構造を使った、最も一般的な索引です。
    definition: B 木（またはその改良である B+木）を用いた索引。等値検索、範囲検索、並べ替えのいずれにも対応でき、多くの DBMS の標準的な索引。
    related: [インデックス, ビットマップインデックス, B木]
  - term: ビットマップインデックス
    reading: びっとまっぷいんでっくす
    simple: 値の種類ごとにビット列で行の有無を表す索引で、値の種類が少ない列に向いています。
    definition: 列の値ごとに、各行が該当するかをビット列で表した索引。性別のように値の種類が少ない列に有効で、複数条件の AND/OR 検索を高速に行える。
    related: [インデックス, B-treeインデックス]
  - term: ハッシュインデックス
    reading: はっしゅいんでっくす
    simple: ハッシュ関数でキーの格納位置を求める索引で、等しい値の検索が高速です。
    definition: ハッシュ関数でキーから格納位置を求める索引。等値検索は高速だが、範囲検索や並べ替えには使えない。
    related: [インデックス, ハッシュ表探索法]
  - term: 転置インデックス
    reading: てんちいんでっくす
    simple: 単語から、それを含む文書の一覧を引けるようにした索引で、全文検索に使われます。
    definition: 単語（用語）から、それが出現する文書や位置の一覧を引けるようにした索引。全文検索エンジンで用いられる。
    related: [インデックス, 検索エンジン]
  - term: ELT
    reading: いーえるてぃー
    fullName: Extract Load Transform
    japanese: 抽出・書出し・変換
    words:
      - { en: Extract, ja: 抽出 }
      - { en: Load, ja: 書出し }
      - { en: Transform, ja: 変換 }
    simple: 先にデータを取り込んでから、取り込み先の中で変換する方式です。
    definition: データを抽出し、まず格納先（データレイクやデータウェアハウス）にそのまま取り込んでから、格納先の処理能力で変換する方式。ETL は変換してから格納する。
    related: [ETL, データウェアハウス, データレイク]
  - term: データクレンジング
    reading: でーたくれんじんぐ
    simple: データの重複、表記ゆれ、誤りなどを見つけて、直して整える作業です。
    definition: データの重複、欠損、表記ゆれ、誤りなどを検出し、修正・統一してデータの品質を高める作業。ETL の変換段階などで行う。
    related: [ETL, データウェアハウス]
  - term: データマート
    reading: でーたまーと
    simple: データウェアハウスから、特定の部門や目的のために切り出したデータの集まりです。
    definition: データウェアハウスのうち、特定の部門や目的向けに必要なデータを切り出したデータベース。
    related: [データウェアハウス, OLAP]
  - term: OLAP
    reading: おーらっぷ
    fullName: Online Analytical Processing
    japanese: オンライン分析処理
    words:
      - { en: Online, ja: 対話的に }
      - { en: Analytical, ja: 分析の }
      - { en: Processing, ja: 処理 }
    simple: 蓄積したデータを、利用者が対話的に多角的な切り口で集計・分析する手法です。
    definition: 大量のデータを、時間、地域、商品などの多次元の切り口で、対話的に集計・分析する処理。スライス、ダイス、ドリルダウンなどの操作がある。データウェアハウスで使われる。
    related: [データウェアハウス, オンライントランザクション処理]
  - term: 透過性
    reading: とうかせい
    simple: 利用者が、データの場所や複製を意識せずに使えるという性質です。
    definition: 分散データベースで、データの所在、複製、分割などを利用者が意識せずに利用できる性質。位置透過性、分割透過性、複製透過性などがある。
    related: [分散データベース, レプリケーション]
  - term: レプリケーション
    reading: れぷりけーしょん
    simple: データベースの複製を別の場所に作り、内容を同期させる仕組みです。
    definition: データベースの複製を別のサーバに作成し、元のデータとの内容を同期させる仕組み。負荷分散や耐障害性の向上に使う。
    related: [分散データベース, 透過性]
  - term: 構造化データ
    reading: こうぞうかでーた
    simple: 表のように、行と列の決まった形式で整理されたデータです。
    definition: 関係データベースの表のように、あらかじめ定義された行・列の構造に整理されたデータ。
    related: [データレイク, 半構造化データ, 非構造化データ]
  - term: 半構造化データ
    reading: はんこうぞうかでーた
    simple: JSONやXMLのように、タグなどで構造は示されるが、固定の表形式ではないデータです。
    definition: JSON や XML など、タグやキーによってデータの構造を自己記述するが、固定の表形式ではないデータ。
    related: [データレイク, 構造化データ, 非構造化データ]
  - term: 非構造化データ
    reading: ひこうぞうかでーた
    simple: 文章、画像、音声のように、決まった形式で整理されていないデータです。
    definition: テキスト、画像、音声、動画など、あらかじめ定義された構造をもたないデータ。
    related: [データレイク, 構造化データ, 半構造化データ]
  - term: ストリーミングデータ
    reading: すとりーみんぐでーた
    simple: センサーやログのように、次々と連続して発生し続けるデータです。
    definition: センサーのデータ、ログ、取引記録など、連続的に絶え間なく発生・到着するデータ。リアルタイムに処理することが多い。
    related: [データレイク, リアルタイム処理]
