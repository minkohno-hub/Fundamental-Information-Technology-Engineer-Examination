category: 法務
terms:
  - term: 商品形態模倣
    reading: しょうひんけいたいもほう
    simple: 他社の商品の見た目をそっくり真似して売ることです。
    definition: 不正競争防止法が禁じる不正競争の一類型。他人の商品の形態（形状、模様、色彩などの外観）を実質的に同一の形態で模倣した商品を、譲渡、貸渡し、展示などする行為。その商品が日本国内で最初に販売された日から3年以内に限って規制される。
    related: [不正競争防止法]
  - term: 職務発明
    reading: しょくむはつめい
    simple: 従業員が仕事として行った発明のことです。
    definition: 従業者がその性質上使用者の業務範囲に属し、かつ使用者の下での職務の遂行により完成した発明。契約や勤務規則であらかじめ定めることで、特許を受ける権利を発明の時から使用者に帰属させることができ、その場合でも従業者は相当の利益を受ける権利を持つ。
    related: [特許を受ける権利]
  - term: 労働契約申込みみなし制度
    reading: ろうどうけいやくもうしこみみなしせいど
    simple: 違法な派遣や偽装請負で働かせた会社は、その人に雇用を申し込んだものとみなされる仕組みです。
    definition: 労働者派遣法に違反する形（無許可の派遣、偽装請負など）で労働者を受け入れた場合、受入れた事業主が、その労働者に対して、派遣元との労働契約と同一の労働条件で労働契約の申込みをしたものとみなす制度。労働者が承諾すれば、その事業主との間に労働契約が成立する。
    related: [労働者派遣, 偽装請負]
  - term: 特許を受ける権利
    reading: とっきょうをうけるけんり
    simple: 発明について特許を申請できる権利です。
    definition: 発明者が発明の完成によって取得する、特許出願をして特許権を得るための財産的権利。原則として発明者に帰属するが、職務発明については契約や勤務規則の事前の定めにより、使用者に発明の時から帰属させることができる。
    related: [職務発明]
