category: 企業活動
terms:
  - term: 事業部制組織
    reading: じぎょうぶせいそしき
    simple: 製品や地域ごとに事業部を作り、それぞれが利益に責任をもって運営する組織です。
    definition: 製品・地域・市場などの単位で事業部を設け、各事業部が必要な機能と権限をもち、利益責任を負って独立的に運営する組織形態。
    related: [職能別組織, カンパニー制組織]
  - term: 職能別組織
    reading: しょくのうべつそしき
    aliases: [機能別組織]
    simple: 製造、販売、経理など、仕事の種類ごとに部門を分けた組織です。
    definition: 製造・販売・経理などの業務機能ごとに部門を編成する組織形態。専門性を高めやすいが、部門間の調整が難しくなりやすい。
    related: [事業部制組織]
  - term: マトリックス組織
    reading: マトリックスそしき
    simple: 仕事の種類別の部門と事業別の部門の両方に所属する、縦横を組み合わせた組織です。
    definition: 職能別組織と事業部制組織（又はプロジェクト組織）を組み合わせ、構成員が2つの部門に所属する組織形態。命令系統が二重になる。
  - term: プロジェクト組織
    reading: プロジェクトそしき
    aliases: [プロジェクトチーム]
    simple: 特定の課題のために各部門から人を集めて作り、終わったら解散する組織です。
    definition: 特定の目的や課題を達成するために各部門から専門家を集めて編成し、目的を達成したら解散する一時的な組織。
  - term: カンパニー制組織
    reading: カンパニーせいそしき
    simple: 社内の事業部門を独立した会社のようにみなして、大きな権限と責任を与える組織です。
    definition: 事業部門を社内の独立した会社とみなし、資本金に相当する資産を配分して、投資などの権限と経営成果の責任を委ねる組織形態。
    related: [事業部制組織]
  - term: 階層型組織
    reading: かいそうがたそしき
    aliases: [ピラミッド型組織]
    simple: 経営者から現場まで、ピラミッドのような階層で命令が伝わる組織です。
    definition: 経営者を頂点に、管理者、現場の担当者へと階層的に権限と命令が伝わる組織形態。
  - term: ラインアンドスタッフ組織
    reading: ラインアンドスタッフそしき
    simple: 業務を直接行う部門（ライン）と、それを専門的に助ける部門（スタッフ）を分けた組織です。
    definition: 業務を直接遂行するライン部門と、専門的な立場から助言・支援を行うスタッフ部門で構成する組織形態。
  - term: CEO
    reading: シーイーオー
    fullName: Chief Executive Officer
    japanese: 最高経営責任者
    words:
      - { en: Chief, ja: 最高の }
      - { en: Executive, ja: 経営・執行 }
      - { en: Officer, ja: 責任者・役員 }
    simple: 会社の経営全体に最終的な責任をもつ人です。
    definition: 企業の経営全体について最終的な責任を負う最高経営責任者。ほかに CDO（最高デジタル責任者）、CPO（最高プライバシー責任者）などの役職もある。
    related: [CIO, CFO]
  - term: CPO
    reading: シーピーオー
    fullName: Chief Privacy Officer
    japanese: 最高プライバシー責任者
    words:
      - { en: Chief, ja: 最高の }
      - { en: Privacy, ja: プライバシー }
      - { en: Officer, ja: 責任者・役員 }
    simple: 会社の個人情報やプライバシーの保護に責任をもつ役員です。
    definition: 組織の個人情報やプライバシーの保護に関する方針の策定と運用を統括し、責任を負う役員。
    related: [CEO, CISO]
  - term: CFO
    reading: シーエフオー
    fullName: Chief Financial Officer
    japanese: 最高財務責任者
    words:
      - { en: Chief, ja: 最高の }
      - { en: Financial, ja: 財務の }
      - { en: Officer, ja: 責任者・役員 }
    simple: 会社のお金（資金調達や財務戦略）に責任をもつ役員です。
    definition: 企業の財務戦略や資金調達、財務報告などについて責任を負う役員。
  - term: CISO
    reading: シーアイエスオー
    fullName: Chief Information Security Officer
    japanese: 最高情報セキュリティ責任者
    words:
      - { en: Chief, ja: 最高の }
      - { en: Information Security, ja: 情報セキュリティ }
      - { en: Officer, ja: 責任者・役員 }
    simple: 会社の情報セキュリティ対策全体に責任をもつ役員です。
    definition: 組織の情報セキュリティ対策を統括し責任を負う役員。
  - term: CSR
    reading: シーエスアール
    fullName: Corporate Social Responsibility
    japanese: 企業の社会的責任
    aliases: [企業の社会的責任]
    words:
      - { en: Corporate, ja: 企業の }
      - { en: Social, ja: 社会的 }
      - { en: Responsibility, ja: 責任 }
    simple: 会社がもうけるだけでなく、環境や人権、地域社会などに責任をもって行動することです。
    definition: 企業が利益の追求だけでなく、環境への配慮、法令遵守、人権の尊重、社会貢献などを通じて、利害関係者に対する責任を果たすという考え方。
    related: [ステークホルダー, SDGs]
  - term: ステークホルダー
    reading: ステークホルダー
    aliases: [利害関係者]
    simple: 株主、従業員、顧客、取引先、地域社会など、会社と利害関係がある人や組織です。
    definition: 企業の活動によって影響を受けたり、企業に影響を与えたりする利害関係者。
  - term: SDGs
    reading: エスディージーズ
    fullName: Sustainable Development Goals
    japanese: 持続可能な開発目標
    words:
      - { en: Sustainable, ja: 持続可能な }
      - { en: Development, ja: 開発 }
      - { en: Goals, ja: 目標 }
    simple: 2015 年に国連で決まった、2030 年までに世界で達成を目指す 17 の目標です。
    definition: 2015 年の国連サミットで採択された、2030 年を期限とする 17 のゴールと 169 のターゲットからなる国際目標。
    related: [CSR]
  - term: コーポレートガバナンス
    reading: コーポレートガバナンス
    aliases: [企業統治]
    simple: 経営者が株主などのために正しく経営しているかを監視する仕組みです。
    definition: 株主などの利害関係者の立場から、経営者の業務執行が適正・効率的に行われるよう監視・規律する企業統治の仕組み。
    related: [内部統制]
  - term: IR
    reading: アイアール
    fullName: Investor Relations
    japanese: 投資家向け広報
    words:
      - { en: Investor, ja: 投資家 }
      - { en: Relations, ja: 関係 }
    simple: 株主や投資家に、会社の経営や業績の情報を伝える活動です。
    definition: 株主や投資家に対して、投資判断に必要な経営方針や財務状況などの情報を適時・公平に提供する活動。
    related: [アニュアルレポート]
  - term: アニュアルレポート
    reading: アニュアルレポート
    aliases: [年次報告書]
    simple: 会社が1年の経営や業績をまとめて、投資家などに向けて出す報告書です。
    definition: 企業が年度ごとに経営方針や財務情報などをまとめて株主・投資家向けに発行する報告書。財務情報と非財務情報をまとめたものを統合報告書という。
    related: [IR]
  - term: コーポレートアイデンティティ
    reading: コーポレートアイデンティティ
    aliases: [CI]
    simple: 会社の理念や特徴を、ロゴやデザインなどで社内外に分かりやすく示すことです。
    definition: 企業の理念や特性を明確にし、ロゴ・シンボルマーク・デザインなどで統一的に社内外に示す活動。
  - term: OJT
    reading: オージェーティー
    fullName: On the Job Training
    japanese: 職場内訓練
    words:
      - { en: On the Job, ja: 仕事をしながら }
      - { en: Training, ja: 訓練 }
    simple: 職場で実際の仕事をしながら、上司や先輩が教える育成方法です。
    definition: 実際の業務を通じて上司や先輩が部下に必要な知識・技能を計画的に指導する教育訓練。職場を離れて行う研修は Off-JT という。
    related: [e-ラーニング]
  - term: ジョブローテーション
    reading: ジョブローテーション
    simple: 計画的に部署を異動させて、いろいろな仕事を経験させることです。
    definition: 人材育成などを目的として、計画的に従業員の職務や部署を定期的に変更すること。
  - term: MBO
    reading: エムビーオー
    fullName: Management By Objectives
    japanese: 目標管理制度
    aliases: [目標管理制度]
    words:
      - { en: Management, ja: 管理 }
      - { en: By Objectives, ja: 目標による }
    simple: 社員が上司と相談して自分の目標を決め、その達成度で評価される仕組みです。
    definition: 組織の目標と関連付けて従業員が自ら目標を設定し、その達成度に基づいて評価を行う人事管理の手法。
  - term: タレントマネジメント
    reading: タレントマネジメント
    simple: 社員のスキルや経験などの情報をまとめて管理し、配置や育成に戦略的に活かすことです。
    definition: 従業員の能力・スキル・経験・評価などの情報を一元管理し、経営戦略の実現に向けて採用・配置・育成などを戦略的に行う手法。
    related: [HRテック]
  - term: コンピテンシー
    reading: コンピテンシー
    simple: 仕事で高い成果を上げる人に共通する行動の特徴です。
    definition: 高い成果を上げる人材に共通してみられる行動特性。人材の評価や育成の基準として用いる。
  - term: ワークライフバランス
    reading: ワークライフバランス
    simple: 仕事と生活の両方を充実させるよう、うまく調和させることです。
    definition: 仕事と、家庭・地域・個人の生活との調和を図り、両方を充実させること。
  - term: HRテック
    reading: エイチアールテック
    aliases: [HRTech]
    simple: AI やクラウドなどの IT を使って、採用・育成・評価などの人事の仕事を効率化することです。
    definition: 人事（Human Resources）と技術（Technology）を組み合わせた造語で、IT を活用して人事業務の効率化や高度化を図る取組み。
    related: [タレントマネジメント]
  - term: リテンション
    reading: リテンション
    simple: 優秀な社員が辞めないように、会社に引き留めておく取組みです。
    definition: 人材の流出を防ぎ、従業員の定着を図るための施策。
  - term: コーチング
    reading: コーチング
    simple: 答えを教えるのではなく、問いかけによって相手が自分で答えを見つけられるよう助ける方法です。
    definition: 対話や質問を通じて相手の考えを引き出し、相手が自ら目標を設定して解決策を見いだせるよう支援する手法。
    related: [メンタリング]
  - term: メンタリング
    reading: メンタリング
    aliases: [メンター]
    simple: 経験豊かな先輩（メンター）が、仕事やキャリアについて後輩を長く支える方法です。
    definition: 経験豊富なメンターが、業務に限らずキャリアや人間関係なども含めて、後輩を継続的に支援・助言する育成手法。
    related: [コーチング]
  - term: ケーススタディ
    reading: ケーススタディ
    aliases: [事例研究]
    simple: 実際にあった事例を題材に、問題点や解決策を考えて学ぶ方法です。
    definition: 実際の事例を題材として、問題点の分析や解決策の検討をグループなどで行う学習方法。
  - term: アダプティブラーニング
    reading: アダプティブラーニング
    simple: 一人一人の理解度に合わせて、学ぶ内容を変えていく学習方法です。
    definition: 学習者の理解度や進捗に応じて、学習内容や難易度を個別に最適化する学習方法。
    related: [e-ラーニング]
  - term: BIA
    reading: ビーアイエー
    fullName: Business Impact Analysis
    japanese: 事業影響度分析
    aliases: [事業影響度分析]
    words:
      - { en: Business, ja: 事業 }
      - { en: Impact, ja: 影響 }
      - { en: Analysis, ja: 分析 }
    simple: 業務が止まったらどれだけ困るかを分析し、優先して復旧する業務を決めることです。
    definition: 業務が停止した場合の影響を分析・評価し、重要業務や目標復旧時間を決めるための分析。BCP の策定に用いる。
    related: [BCP]
  - term: 衛生理論
    reading: えいせいりろん
    aliases: [動機付け・衛生理論, 二要因理論]
    simple: やる気は「不満をなくす要因」と「満足を生む要因」の別々の要因で決まるという、ハーズバーグの理論です。
    definition: ハーズバーグが提唱した理論。給与や作業条件などの衛生要因は不足すると不満を生むが満たしても動機付けにはなりにくく、達成感や承認などの動機付け要因が満足を高めるとする。
    related: [XY理論]
  - term: XY理論
    reading: エックスワイりろん
    simple: 人は命令されないと働かない（X）とみるか、自ら進んで働く（Y）とみるかという、マグレガーの理論です。
    definition: マグレガーが提唱した、人間は本来仕事が嫌いで命令や強制が必要とする X 理論と、自ら目標に向かって働くとする Y 理論からなる人間観の理論。マズローの欲求段階説を基にしている。
    related: [衛生理論]
  - term: 水平思考
    reading: すいへいしこう
    aliases: [ラテラルシンキング]
    simple: 枠にとらわれず、いろいろな角度から自由に発想する考え方です。
    definition: 既存の枠組みにとらわれず多様な視点から発想する思考法。これに対し、論理を積み重ねて深く掘り下げる思考法を垂直思考という。
  - term: Society 5.0
    reading: ソサエティごーてんぜろ
    aliases: [超スマート社会]
    simple: 現実の世界とコンピュータの中の世界を融合させて、経済の発展と社会の課題解決を両立する人間中心の社会です。
    definition: サイバー空間とフィジカル空間を高度に融合させたシステムにより、経済発展と社会的課題の解決を両立する人間中心の社会。狩猟・農耕・工業・情報社会に続く社会として我が国が提唱。
    related: [IoT, ビッグデータ]
  - term: ビッグデータ
    reading: ビッグデータ
    simple: 量が非常に多く、種類もさまざまで、どんどん生まれ続ける大量のデータです。
    definition: 量（Volume）、種類（Variety）、発生・更新の速さ（Velocity）などの特徴をもつ大規模なデータ。分析して業務や社会の課題解決に活用する。
    related: [データマイニング]
  - term: 線形計画法
    reading: せんけいけいかくほう
    simple: 限られた資源の中で、利益を最大（又は費用を最小）にする組合せを求める方法です。
    definition: 1 次式で表した制約条件の下で、1 次式の目的関数を最大化又は最小化する解を求める手法。解法にシンプレックス法がある。
  - term: 発注点
    reading: はっちゅうてん
    simple: 在庫がこの量まで減ったら発注する、という目安の在庫量です。
    definition: 定量発注方式で発注を行う基準となる在庫量。調達期間中の平均使用量に安全在庫を加えて求める。
    related: [安全在庫, 定量発注方式]
  - term: 安全在庫
    reading: あんぜんざいこ
    simple: 予想より多く使われたり納品が遅れたりしても品切れしないよう、余分にもっておく在庫です。
    definition: 需要の変動や調達期間のばらつきによる品切れを防ぐために保有する余裕分の在庫。
    related: [発注点]
  - term: EOQ
    reading: イーオーキュー
    fullName: Economic Ordering Quantity
    japanese: 経済的発注量
    aliases: [経済的発注量]
    words:
      - { en: Economic, ja: 経済的な }
      - { en: Ordering, ja: 発注 }
      - { en: Quantity, ja: 量 }
    simple: 発注にかかる費用と在庫を置いておく費用の合計が一番少なくなる、1回の発注量です。
    definition: 発注費用と保管費用の合計が最小となる 1 回当たりの発注量。√（2 × 年間需要量 × 1 回の発注費用 ÷ 1 個当たりの年間保管費用）で求める。
    related: [定量発注方式]
  - term: 定量発注方式
    reading: ていりょうはっちゅうほうしき
    aliases: [ダブルビン方式]
    simple: 在庫が発注点まで減ったら、決まった量を発注する方式です。
    definition: 在庫量が発注点を下回ったときに、あらかじめ決めた一定量（経済的発注量など）を発注する在庫管理の方式。
    related: [発注点, 定期発注方式]
  - term: 定期発注方式
    reading: ていきはっちゅうほうしき
    simple: 発注する日を決めておき、そのたびに必要な量を計算して発注する方式です。
    definition: 発注間隔を固定し、発注のたびに需要予測と在庫量などから発注量を決める在庫管理の方式。重要度の高い品目に向く。
    related: [定量発注方式]
  - term: ゲーム理論
    reading: ゲームりろん
    simple: 相手の出方や将来の状況を考えて、どの手を選ぶのがよいかを数学的に考える理論です。
    definition: 複数の主体の意思決定や、不確実な状況での戦略の選択を数学的に分析する理論。マクシミン原理、マクシマックス原理などの選択基準がある。
    related: [マクシミン原理]
  - term: マクシミン原理
    reading: マクシミンげんり
    simple: それぞれの案の最悪の結果を比べ、その中で一番ましな案を選ぶ考え方です。
    definition: 各戦略の最小の利得を比較し、それが最大となる戦略を選ぶ悲観的な意思決定の基準。
    related: [ゲーム理論]
  - term: 期待値原理
    reading: きたいちげんり
    simple: 起こりやすさ（確率）を考えて結果を平均した期待値が、一番大きい案を選ぶ考え方です。
    definition: 各状況の確率が分かっている場合に、利得の期待値（利得 × 確率の合計）が最大となる戦略を選ぶ意思決定の基準。
    related: [ゲーム理論]
  - term: QC七つ道具
    reading: キューシーななつどうぐ
    simple: 品質管理で数値のデータを整理・分析するための 7 つの基本的な手法です。
    definition: 主に数値データを扱う品質管理の手法。パレート図、特性要因図、ヒストグラム、散布図、管理図、チェックシート、グラフ（又は層別）。
    related: [新QC七つ道具]
  - term: 散布図
    reading: さんぷず
    simple: 2 つのデータの組を点で表して、関係があるかどうかを見る図です。
    definition: 2 つの変数の値の組を平面上に点で表し、変数間の相関関係を調べる図。
    related: [相関係数]
  - term: 特性要因図
    reading: とくせいよういんず
    aliases: [フィッシュボーンチャート, 魚の骨図]
    simple: 結果と、その原因をまとめた、魚の骨のような形の図です。
    definition: 問題となる結果（特性）とそれに影響する原因（要因）の関係を、魚の骨の形に体系的に整理した図。
  - term: ヒストグラム
    reading: ヒストグラム
    aliases: [度数分布図]
    simple: データを区間に分けて、それぞれの区間に入る数を柱で表したグラフです。
    definition: データの範囲をいくつかの区間に分け、各区間の度数を柱状に表した図。データの分布の形を把握する。
  - term: チェックシート
    reading: チェックシート
    simple: 確認する項目を前もって書いておき、簡単にデータを記録・集計できるようにした表です。
    definition: 点検項目や分類をあらかじめ記載し、データを容易に記録・集計できるようにした用紙。
  - term: レーダーチャート
    reading: レーダーチャート
    simple: いくつかの項目の値を、中心から放射状に伸びた軸に表してバランスを見るグラフです。
    definition: 複数の評価項目を中心から放射状の軸に配置し、各値を結んだ多角形で全体のバランスを表すグラフ。
  - term: ABC分析
    reading: エービーシーぶんせき
    simple: 品目を売上などが大きい順に A・B・C のグループに分け、大事なものを重点的に管理する方法です。
    definition: パレート図を用いて品目を売上高などの累積構成比により A・B・C 群に分け、群ごとに管理の方法を変える手法。
    related: [パレート図]
  - term: 新QC七つ道具
    reading: しんキューシーななつどうぐ
    simple: 言葉のデータを整理して問題を解決するための 7 つの手法です。
    definition: 主に言語データを整理する手法。親和図法、連関図法、系統図法、マトリックス図法、アローダイアグラム法、PDPC 法、マトリックスデータ解析法。
    related: [QC七つ道具]
  - term: 親和図法
    reading: しんわずほう
    simple: 集めた意見などの言葉を、似たものどうしでグループにまとめて整理する方法です。
    definition: 混沌とした問題について集めた言語データを、互いの親和性によってグループ化し、問題の構造を明らかにする手法。
    related: [新QC七つ道具]
  - term: 連関図法
    reading: れんかんずほう
    simple: 原因と結果が複雑に絡んだ問題を、矢印でつないで関係を明らかにする方法です。
    definition: 原因と結果が複雑に絡み合った問題について、要因間の因果関係を矢印で結んで明らかにする手法。
    related: [新QC七つ道具]
  - term: 系統図法
    reading: けいとうずほう
    simple: 目的を達成するための手段を、木の枝のように段階的に展開していく方法です。
    definition: 目的を達成するための手段を、目的と手段の関係で段階的・系統的に展開する手法。
    related: [新QC七つ道具]
  - term: デルファイ法
    reading: デルファイほう
    simple: 専門家へのアンケートと結果のフィードバックを繰り返して、意見をまとめていく予測方法です。
    definition: 複数の専門家にアンケートを行い、集計結果をフィードバックして再回答を求めることを繰り返し、意見を収束させる予測手法。
  - term: モンテカルロ法
    reading: モンテカルロほう
    simple: 乱数を使った試しを何度も繰り返して、答えをおおよそで求める方法です。
    definition: 乱数を用いた模擬的な試行を多数回繰り返し、その結果から求める値や確率を近似的に推定する手法。
  - term: ブレーンストーミング
    reading: ブレーンストーミング
    simple: 人の意見を批判せずに、自由にたくさんのアイデアを出し合う方法です。
    definition: 批判厳禁、自由奔放、質より量、結合・改善の原則の下で、集団で自由にアイデアを出し合う発想法。用紙に書いて回す方法をブレーンライティングという。
  - term: フォーカスグループ
    reading: フォーカスグループ
    simple: 対象者を少人数集めて、座談会の形で意見を聞く調査方法です。
    definition: 調査対象となる少人数を集め、司会者の進行による座談会形式で意見を聞き出す定性的な調査手法。
  - term: 移動平均法
    reading: いどうへいきんほう
    aliases: [移動平均, 単純移動平均]
    simple: 直近の何か月かの平均で次を予測したり、仕入のたびに平均単価を計算し直したりする方法です。
    definition: 需要予測では、直近の一定期間の実績の平均を予測値とする手法。在庫評価では、受け入れるたびに在庫と受入分の平均単価を計算し直して払出単価とする方法。
    related: [先入先出法]
  - term: 故障率曲線
    reading: こしょうりつきょくせん
    simple: 機械の使用時間と故障の起こりやすさの関係を表した、浴槽のような形の曲線です。
    definition: 使用時間と故障率の関係を表した曲線。故障率が低下する初期故障期、ほぼ一定の偶発故障期、上昇する摩耗故障期からなる。
  - term: 稼働分析
    reading: かどうぶんせき
    aliases: [作業分析, 工程分析]
    simple: 人や機械が実際に働いている時間や待っている時間の割合を調べる分析です。
    definition: 作業者や機械の稼働状態の時間構成を調べ、稼働率や非稼働の原因を明らかにする IE の分析手法。
    related: [ワークサンプリング法]
  - term: ワークサンプリング法
    reading: ワークサンプリングほう
    simple: ランダムな時刻に何度も瞬間的に様子を観察して、働いている割合などを推定する方法です。
    definition: 無作為に決めた時刻に作業者や機械の状態を瞬間的に多数回観測し、各状態の時間構成比を統計的に推定する稼働分析の手法。
    related: [稼働分析]
  - term: サーブリック
    reading: サーブリック
    aliases: [動作分析]
    simple: 人の作業を「つかむ」「運ぶ」などの基本動作に分けて分析する方法です。
    definition: 作業者の動作を、つかむ・運ぶ・位置決めなどの基本動作要素（サーブリック記号）に分解して分析する動作分析の手法。
  - term: クラスタ分析法
    reading: クラスタぶんせきほう
    aliases: [クラスタ分析, デンドログラム]
    simple: 似た性質のデータどうしをグループにまとめる分析方法です。
    definition: データ間の類似度に基づいて、データの集まりをいくつかのグループ（クラスタ）に分ける手法。階層的な結合の過程はデンドログラムで表す。
  - term: 損益計算書
    reading: そんえきけいさんしょ
    aliases: [P/L]
    simple: 一定期間にどれだけ売り上げ、どれだけ費用がかかり、いくらもうかったかを示す表です。
    definition: 一定期間の収益と費用から経営成績を示す財務諸表。売上総利益（売上高 − 売上原価）、営業利益（− 販売費及び一般管理費）、経常利益（+ 営業外収益 − 営業外費用）、税引前当期純利益（+ 特別利益 − 特別損失）の順に段階的に利益を示す。
    related: [貸借対照表, 財務諸表]
  - term: 損益分岐点
    reading: そんえきぶんきてん
    aliases: [損益分岐点売上高]
    simple: 売上と費用がちょうど等しくなり、利益が 0 になる売上高のことです。
    definition: 利益が 0 となる売上高。損益分岐点売上高 = 固定費 ÷（1 − 変動費率）。変動費率は変動費 ÷ 売上高、売上高から変動費を引いたものを限界利益という。
  - term: 貸借対照表
    reading: たいしゃくたいしょうひょう
    aliases: [B/S, バランスシート]
    simple: ある時点で会社がどれだけの資産と負債、純資産をもっているかを示す表です。
    definition: 一定時点の財政状態を、資産と負債・純資産に分けて示す財務諸表。資産は流動資産・固定資産、負債は流動負債・固定負債に分類する。
    related: [損益計算書, 流動比率]
  - term: 財務諸表
    reading: ざいむしょひょう
    simple: 会社の経営成績や財政状態を表す、損益計算書や貸借対照表などの書類です。
    definition: 企業の財政状態や経営成績などを利害関係者に報告するための書類。貸借対照表、損益計算書、キャッシュフロー計算書、株主資本等変動計算書など。
    related: [損益計算書, 貸借対照表, キャッシュフロー計算書]
  - term: 流動比率
    reading: りゅうどうひりつ
    aliases: [安全性指標]
    simple: すぐに払う借金に対して、すぐにお金にできる資産がどれだけあるかを示す割合です。
    definition: 流動資産 ÷ 流動負債 × 100（%）で求める、短期的な支払能力を表す安全性の指標。
    related: [貸借対照表]
  - term: ROE
    reading: アールオーイー
    fullName: Return On Equity
    japanese: 自己資本利益率
    aliases: [自己資本利益率, 収益性指標]
    words:
      - { en: Return, ja: 利益 }
      - { en: On Equity, ja: 自己資本に対する }
    simple: 株主が出したお金（自己資本）で、どれだけ利益を上げたかを示す割合です。
    definition: 当期純利益 ÷ 自己資本 × 100（%）で求める収益性の指標。
    related: [ROA]
  - term: ROA
    reading: アールオーエー
    fullName: Return On Assets
    japanese: 総資産利益率
    aliases: [総資産利益率]
    words:
      - { en: Return, ja: 利益 }
      - { en: On Assets, ja: 資産に対する }
    simple: 会社のすべての資産を使って、どれだけ利益を上げたかを示す割合です。
    definition: 利益 ÷ 総資産 × 100（%）で求める収益性の指標。
    related: [ROE]
  - term: 自己資本比率
    reading: じこしほんひりつ
    simple: 会社の資産のうち、返す必要のない自己資本がどれだけの割合かを示す指標です。
    definition: 自己資本 ÷ 総資産 × 100（%）で求める、長期的な安全性を表す指標。
  - term: キャッシュフロー計算書
    reading: キャッシュフローけいさんしょ
    aliases: [営業活動によるキャッシュフロー, 投資活動によるキャッシュフロー, 財務活動によるキャッシュフロー, キャッシュフロー, 間接法]
    simple: 一定期間にお金がどれだけ入って出ていったかを、営業・投資・財務の活動別に示す表です。
    definition: 一定期間の現金及び現金同等物の増減を、営業活動・投資活動・財務活動の区分ごとに示す財務諸表。営業活動の区分は、当期純利益から調整する間接法で作成できる。
    related: [フリーキャッシュフロー]
  - term: フリーキャッシュフロー
    reading: フリーキャッシュフロー
    simple: 本業で稼いだお金から投資に使ったお金を引いた、会社が自由に使えるお金です。
    definition: 営業活動によるキャッシュフローと投資活動によるキャッシュフローの合計。
    related: [キャッシュフロー計算書]
  - term: 減価償却
    reading: げんかしょうきゃく
    simple: 長く使う設備の購入費用を、使える年数に分けて毎年の費用にしていくことです。
    definition: 建物や機械などの固定資産の取得価額を、耐用年数にわたって費用として配分する会計処理。定額法や定率法がある。
    related: [定額法]
  - term: 定額法
    reading: ていがくほう
    simple: 減価償却で、毎年同じ金額を費用にする方法です。
    definition: （取得価額 − 残存価額）÷ 耐用年数を毎期の減価償却費とする方法。帳簿価額に一定率を掛ける方法は定率法という。
    related: [減価償却]
  - term: 先入先出法
    reading: さきいれさきだしほう
    simple: 先に仕入れたものから先に出ていったとみなして、在庫の金額を計算する方法です。
    definition: 先に受け入れた棚卸資産から先に払い出したとみなして払出単価と期末在庫を評価する方法。
    related: [移動平均法, 総平均法]
  - term: 総平均法
    reading: そうへいきんほう
    simple: 期間中に仕入れた全部の平均単価で、在庫の金額を計算する方法です。
    definition: 期首在庫と期中の受入れの合計金額を合計数量で割った平均単価で、払出しと期末在庫を評価する方法。
    related: [先入先出法]
  - term: 棚卸資産評価
    reading: たなおろししさんひょうか
    aliases: [在庫評価]
    simple: 商品や材料などの在庫が、いくらの価値になるかを計算することです。
    definition: 商品・製品・原材料などの棚卸資産の払出単価と期末在庫の金額を決める会計処理。先入先出法、移動平均法、総平均法などがある。
    related: [先入先出法, 移動平均法, 総平均法]
  - term: 母集団
    reading: ぼしゅうだん
    simple: 調べたい対象全体のことです。
    definition: 統計的な調査で、調べたい対象となる集団全体。母集団から抽出した一部を標本という。
    related: [標本抽出]
  - term: 標本抽出
    reading: ひょうほんちゅうしゅつ
    simple: 調べたい全体の中から一部を選び出すことです。
    definition: 母集団から調査対象となる標本を選び出すこと。全体から無作為に選ぶ単純無作為抽出、層に分けて各層から選ぶ層別抽出、段階的に選ぶ多段抽出などがある。母集団すべてを調べるのは全数調査。
    related: [母集団]
  - term: 箱ひげ図
    reading: はこひげず
    aliases: [四分位数]
    simple: データの最小値・中央値・最大値などを箱とひげで表して、ばらつきを見る図です。
    definition: 第 1 四分位数から第 3 四分位数を箱、中央値を箱の中の線、最小値・最大値までをひげで表してデータの分布を示す図。
  - term: クロス集計表
    reading: クロスしゅうけいひょう
    aliases: [分割表]
    simple: 2 つの項目を縦と横にとって、組合せごとの数を数えた表です。
    definition: 2 つ以上の項目（カテゴリ変数）を縦横に組み合わせ、それぞれの組合せの度数を集計した表。
  - term: アソシエーション分析
    reading: アソシエーションぶんせき
    aliases: [バスケット分析, リフト値]
    simple: 「これを買う人はあれも買う」のような、一緒に起きやすい組合せを見つける分析です。
    definition: データの中から「X ならば Y」という関連性（相関ルール）を見つけ出すデータマイニングの手法。支持度、信頼度、リフト値などで評価する。
    related: [データマイニング]
  - term: データマイニング
    reading: データマイニング
    simple: 大量のデータの中から、役に立つ規則や傾向を見つけ出すことです。
    definition: 大量のデータを統計的・数学的な手法で分析し、有用な規則性や関係性を発見すること。
    related: [テキストマイニング, ビッグデータ]
  - term: テキストマイニング
    reading: テキストマイニング
    simple: 文章などの文字のデータを分析して、役に立つ情報を取り出すことです。
    definition: 文章などのテキストデータを単語に分割するなどして分析し、有用な情報を抽出する手法。
    related: [データマイニング]
  - term: 定率法
    reading: ていりつほう
    simple: 減価償却で、帳簿価額に一定の割合を掛けて毎年の費用を計算する方法です。
    definition: 毎期の期首帳簿価額に一定の償却率を掛けて減価償却費を計算する方法。初期の償却費が大きく、年々減少する。毎年同じ金額を償却する方法は定額法という。
    related: [減価償却, 定額法]
  - term: 固定費
    reading: こていひ
    simple: 売上が増えても減っても、変わらずにかかる費用です。
    definition: 操業度（売上高や生産量）の増減に関わらず一定額が発生する費用。家賃、正社員の給与、減価償却費など。操業度に比例して変わる費用は変動費という。
    related: [損益分岐点, 限界利益]
  - term: 変動費率
    reading: へんどうひりつ
    simple: 売上高の中で、変動費が占める割合です。
    definition: 変動費 ÷ 売上高で求める割合。限界利益率は 1 − 変動費率で求められる。
    related: [損益分岐点, 限界利益]
  - term: 限界利益
    reading: げんかいりえき
    simple: 売上から変動費を引いた利益で、固定費を回収するための原資になるものです。
    definition: 売上高から変動費を差し引いた利益。限界利益が固定費と等しくなる点が損益分岐点で、限界利益から固定費を差し引くと営業利益になる。貢献利益ともいう。
    related: [損益分岐点, 固定費]
  - term: 売上総利益
    reading: うりあげそうりえき
    simple: 売上から、商品の仕入れや製造にかかった原価を引いた利益です。
    definition: 売上高から売上原価を差し引いた利益。損益計算書の最初の段階の利益で、粗利益ともいう。
    related: [損益計算書, 営業利益]
  - term: 営業利益
    reading: えいぎょうりえき
    simple: 売上総利益から、販売や管理にかかる費用を引いた、本業の利益です。
    definition: 売上総利益から販売費及び一般管理費を差し引いた利益。本業による利益を表す。
    related: [損益計算書, 売上総利益, 経常利益]
  - term: 経常利益
    reading: けいじょうりえき
    simple: 営業利益に、本業以外の利息などの損益を加えた、普段の活動全体の利益です。
    definition: 営業利益に営業外収益を加え、営業外費用を差し引いた利益。企業の経常的な活動全体の成果を表す。
    related: [損益計算書, 営業利益, 当期純利益]
  - term: 当期純利益
    reading: とうきじゅんりえき
    simple: 税金なども含めて、最終的にその期に残った利益です。
    definition: 経常利益に特別損益を加減し、法人税等を差し引いた最終的な利益。損益計算書の最下段に表示される。
    related: [損益計算書, 経常利益]
  - term: 販売費及び一般管理費
    reading: はんばいひおよびいっぱんかんりひ
    simple: 商品を売るための費用と、会社を管理・運営するための費用を合わせたものです。
    definition: 販売活動に直接かかる販売費と、企業全体の管理活動にかかる一般管理費の総称。広告宣伝費、販売員の給与、役員報酬、事務所の家賃など。売上総利益から差し引くと営業利益になる。
    related: [損益計算書, 営業利益]
  - term: 流動資産
    reading: りゅうどうしさん
    simple: 1年以内に現金に換わることが期待される資産です。
    definition: 現金・預金、受取手形、売掛金、棚卸資産など、営業循環過程にある資産や1年以内に現金化される資産。貸借対照表の借方に表示される。
    related: [貸借対照表]
  - term: 流動負債
    reading: りゅうどうふさい
    simple: 1年以内に支払う必要がある負債です。
    definition: 支払手形、買掛金、短期借入金、未払金など、営業循環過程にある負債や1年以内に支払期限が到来する負債。貸借対照表の貸方に表示される。
    related: [貸借対照表]
  - term: 固定負債
    reading: こていふさい
    simple: 支払期限が1年を超える、長期の負債です。
    definition: 社債や長期借入金など、支払期限が決算日の翌日から1年を超える負債。貸借対照表の貸方に表示される。
    related: [貸借対照表, 流動負債]
  - term: 純資産
    reading: じゅんしさん
    simple: 資産から負債を引いた、会社の持ち主（株主）に帰属する部分です。
    definition: 資産の総額から負債の総額を差し引いた額。株主資本（資本金、利益剰余金など）と評価・換算差額等、新株予約権などから構成され、貸借対照表の貸方に表示される。
    related: [貸借対照表]
  - term: 欲求段階説
    reading: よっきゅうだんかいせつ
    simple: 人の欲求は、低い段階から高い段階へ順に強まっていくという、マズローの理論です。
    definition: マズローが提唱した、生理的欲求・安全の欲求・社会的欲求・尊厳欲求・自己実現欲求の5段階からなる欲求の理論。低次の欲求が満たされると、より高次の欲求が強まるとされる。
    related: [XY理論, 衛生理論]
  - term: 垂直思考
    reading: すいちょくしこう
    simple: 論理を一段ずつ積み重ねて、深く掘り下げていく考え方です。
    definition: 既存の枠組みの中で論理を積み重ね、深く掘り下げて結論を導く思考法。枠にとらわれず多様な視点から発想する水平思考（ラテラルシンキング）と対比される。
    related: [水平思考]
  - term: Off-JT
    reading: おふじぇーてぃー
    fullName: Off the Job Training
    japanese: 職場外訓練
    words:
      - { en: Off the Job, ja: 仕事を離れて }
      - { en: Training, ja: 訓練 }
    simple: 仕事の現場を離れて、研修施設などで行う教育訓練です。
    definition: 職場を離れて集合研修などの形で行う教育訓練。職場で実際の仕事をしながら行う OJT と対比される。
    related: [OJT, 教育訓練]
  - term: 全数調査
    reading: ぜんすうちょうさ
    simple: 対象を一部ではなく、すべて調べる調査方法です。
    definition: 調査対象の全体（母集団）をすべて調べる方法。対象の一部だけを調べる標本抽出（標本調査）と対比される。対象が少ない場合や正確さが特に必要な場合に用いる。
    related: [標本抽出]
