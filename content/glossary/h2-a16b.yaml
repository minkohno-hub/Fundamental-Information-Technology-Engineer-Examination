category: システム監査
terms:
  - term: 棚卸し
    reading: たなおろし
    simple: 在庫などの現物を実際に数え、記録と合っているかを確認することです。
    definition: 保管されている物品や資産の現物を実際に調査し、帳簿やシステムの記録と照合する手続。監査では、記録にある品目の現物を確認することで実在性を、現物から記録を追うことで網羅性を検証する。
    related: [監査証拠]
  - term: 改善勧告
    reading: かいぜんかんこく
    simple: 監査で見つけた問題について、直すよう求める意見のことです。
    definition: 監査人が、監査で発見した不備や問題点について、被監査部門や経営層に対して改善を求める意見。影響の大きい指摘については、是正の方法だけでなく、既に出ている影響の調査や、改善の期限までを求めることがある。
    related: [システム監査, フォローアップ]
  - term: 属性サンプリング
    reading: ぞくせいサンプリング
    simple: 「守られているか、いないか」のような二択の性質を、抜き取りで確かめる方法です。
    definition: 統計的サンプリングの一種で、各標本が特定の属性（例： 承認があるかないか）を持つかどうかを調べ、母集団全体の逸脱率を推定する方法。必要な標本数は、許容逸脱率、期待逸脱率、信頼水準によって決まる。
    related: [サンプリング]
