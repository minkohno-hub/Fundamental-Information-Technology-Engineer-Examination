category: '16'
terms:
  - term: 実地棚卸し
    reading: じっちたなおろし
    simple: 倉庫などに実際に行き、物の数を数えて確かめることです。
    definition: 保管されている物品の実数を、現場で実際に数えて確認すること。記録上の数量と実数を照合することで、記録の正確さや紛失の有無が確かめられる。監査では、実地棚卸しへの立会いが、実物に基づく監査証拠の入手方法になる。
    related: [監査証拠, 棚卸し]
  - term: 重要性
    reading: じゅうようせい
    simple: 監査で、誤りの影響の大きさを判断するための物差しです。
    definition: 監査において、発見した誤りや不備の影響の大きさを測る基準。主に金額の大きさで判断するが、不正や規制違反に関わるものは、金額が小さくても重要と判断する。重要性を定めることで、限られた監査の資源を、影響の大きい部分に集中させる。
    related: [システム監査, 重大な不備]
  - term: 重大な不備
    reading: じゅうだいなふび
    simple: 統制の弱さが大きく、放っておけない状態のことです。
    definition: 内部統制の不備のうち、重要な誤りが発生しても防げない、あるいは見つけられない可能性が高いものをいう。個々の不備が小さくても、組み合わさることで影響が大きくなる場合は、重大な不備として評価され、経営者への報告と改善の対象になる。
    related: [内部統制, 重要性]
