category: ネットワーク
terms:
  - term: VLSM
    reading: ぶいえるえすえむ
    fullName: Variable Length Subnet Mask
    japanese: 可変長サブネットマスク
    words:
      - { en: Variable Length, ja: 可変長 }
      - { en: Subnet Mask, ja: サブネットマスク }
    simple: サブネットごとに違う長さのマスクを使い、必要な台数に合わせてアドレスを無駄なく分ける方法です。
    definition: 一つのアドレス空間を、サブネットごとに異なる接頭辞長で分割する方式。大きい部署には大きいサブネット、機器間の接続には /30 のような小さいサブネットを割り当て、アドレスの浪費を抑える。
    related: [サブネットマスク, CIDR]
  - term: ブロードキャストアドレス
    reading: ぶろーどきゃすとあどれす
    simple: 同じネットワークにいる全員に一度に送るための特別なアドレスです。
    definition: ネットワーク内の全ホストに宛てるアドレスで、ホスト部のビットをすべて 1 にしたもの。ホストには割り当てられない。ホスト部がすべて 0 のものはネットワークアドレス。
    related: [サブネットマスク, ネットワークアドレス]
  - term: 最長一致法
    reading: さいちょういっちほう
    aliases: [ロンゲストマッチ, 最長一致]
    simple: 経路表で宛先に当てはまる経路が複数あるとき、最も細かい（接頭辞が長い）経路を選ぶ決まりです。
    definition: ルータが宛先 IP アドレスと合致する経路が複数あるとき、接頭辞長が最も長い経路を選ぶ方式。表の記載順には依存せず、どれにも合致しないときだけデフォルト経路（0.0.0.0/0）を使う。
    related: [ルータ, ルート集約]
  - term: ルート集約
    reading: るーとしゅうやく
    aliases: [経路集約, スーパーネット化]
    simple: 連続した複数のネットワークの経路を、一つの大きなネットワークの経路にまとめることです。
    definition: 上位ビットが共通の連続したネットワークを、短い接頭辞の 1 本の経路にまとめること。経路表が小さくなる。まとめる範囲に他のネットワークを含むと誤った転送の原因になる。
    related: [CIDR, 最長一致法]
  - term: ラウンドトリップタイム
    reading: らうんどとりっぷたいむ
    aliases: [RTT, 往復遅延時間]
    fullName: Round Trip Time
    japanese: 往復遅延時間
    words:
      - { en: Round Trip, ja: 往復 }
      - { en: Time, ja: 時間 }
    simple: データを送ってから返事が戻ってくるまでにかかる時間です。
    definition: パケットを送信してから応答が戻るまでの往復の時間。ウィンドウ制御の転送速度は、ウィンドウサイズをこの時間で割った値が上限になる。
    related: [ウィンドウ制御, 帯域遅延積]
  - term: 帯域遅延積
    reading: たいいきちえんせき
    aliases: [BDP]
    simple: 回線の速度と往復の遅れをかけた値で、回線を使い切るために送っておくべきデータ量の目安です。
    definition: 回線の帯域（ビット/秒）と往復遅延時間（秒）の積。ACK を待たずに回線上に出しておけるデータ量に相当し、ウィンドウサイズがこれより小さいと回線を使い切れない。
    related: [ウィンドウ制御, ラウンドトリップタイム]
  - term: ストアアンドフォワード方式
    reading: すとああんどふぉわーどほうしき
    aliases: [蓄積交換方式]
    simple: パケットを全部受け取ってから、次の相手へ送り出す中継の方式です。
    definition: ルータやスイッチが、受信したパケット（フレーム）を一度全部蓄積し、誤りの確認などをしてから次のリンクへ転送する方式。リンク数が増えるほど、1 パケットあたりの送信時間が段数分だけ加わる。
    related: [パケット交換, ルータ]
  - term: 回線利用率
    reading: かいせんりようりつ
    simple: 回線の速度のうち、実際にどれだけ使っているかの割合です。
    definition: 実際に流れている通信速度を回線速度で割った割合。必要な回線速度は「必要な通信速度÷利用率の上限」で求める。
    related: [回線容量, 伝送速度]
