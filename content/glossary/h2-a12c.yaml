category: 開発技術
terms:
  - term: include
    reading: インクルード
    simple: いつも一緒に実行される、共通の振る舞いを表す関係です。
    definition: ユースケース間の関係の一つで、基本のユースケースが常に含む共通の振る舞いを切り出したもの。基本側から含まれる側へ矢印を引く。条件がそろったときだけ挿入される extend と区別される。
    related: [ユースケース, extend]
  - term: extend
    reading: エクステンド
    simple: 条件がそろったときだけ、追加で行われる振る舞いを表す関係です。
    definition: ユースケース間の関係の一つで、一定の条件を満たすときだけ基本のユースケースに挿入される拡張の振る舞いを表す。拡張側から基本側へ矢印を引く。常に含まれる include と区別される。
    related: [ユースケース, include]
  - term: モデレータ
    reading: モデレータ
    simple: レビューの進行を仕切る役の人です。
    definition: インスペクションなどの公式なレビューで、作成者とは別に進行を主導する役割。参加者の選定、事前準備の確認、当日の進行と欠陥検出への集中を担う。
    related: [インスペクション]
  - term: テスト容易性
    reading: てすとよういせい
    simple: テストのしやすさの度合いです。仕様が曖昧だと、テストケースを作りにくくなります。
    definition: システムやプログラムが、テストによって欠陥の有無を確認しやすい度合い。仕様や設計が具体的で曖昧さがなく、観測や制御がしやすいほど高い。設計のレビューにテスト担当者が参加すると、この観点から問題を早期に指摘できる。
    tags: [開発技術]
