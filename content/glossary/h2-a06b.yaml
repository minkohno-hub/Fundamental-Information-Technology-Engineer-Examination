category: '06'
terms:
  - term: 最小項
    reading: さいしょうこう
    simple: 入力の組合せのうち、出力が 1 になるものを表す書き方です。
    definition: 論理関数を表す方法の一つで、出力が 1 になる入力の組合せを列挙したもの。各組合せは、全ての変数が肯定または否定の形で現れる積の項として表される。最小項の和の形で書くことで、真理値表と関数の対応が直接分かる。
    related: [真理値表]
  - term: 熱抵抗
    reading: ねつていこう
    simple: 熱の逃げにくさを表す値です。
    definition: 部品から周囲へ熱が逃げる際の、逃げにくさを表す値。単位は ℃/W で、温度上昇は消費電力に熱抵抗を掛けて求まる。値が小さいほど熱が逃げやすく、放熱器の選定では、許容できる温度上昇から必要な熱抵抗を求める。
    related: [放熱]
  - term: 真理値表
    reading: しんりちひょう
    simple: 入力の全ての組合せと、それぞれの出力を並べた表です。
    definition: 論理回路や論理関数について、入力の全ての組合せと、それに対する出力の値を対応させた表。入力が n 個あれば行は 2 の n 乗になる。回路の動作の確認や、論理式の導出の基礎になる。
    related: [最小項]
  - term: 電池容量
    reading: でんちようりょう
    simple: 電池がどれだけの電気をためられるかです。
    definition: 電池から取り出せる電気の量を、電流と時間の積（mAh や Ah）で表したもの。駆動時間は、電池容量を消費電流で割って見積もる。電流が大きいほど、駆動時間は短くなる。
    related: [消費電流]
  - term: 消費電流
    reading: しょうひでんりゅう
    simple: 機器が動作するときに流れる電流です。
    definition: 電子機器が動作する際に流れる電流。平均の消費電流が分かれば、電池容量から駆動時間を見積もることができる。待機時と動作時で大きく異なる機器も多い。
    related: [電池容量]
  - term: センサ
    reading: せんさ
    simple: 温度や光などの量を、電気信号に変える素子です。
    definition: 温度、光、圧力、磁界などの物理的な量を、電気信号に変換する素子。測りたい量に応じて、対応する素子を選ぶ。温度にはサーミスタ、光にはフォトダイオードなどが使われる。
    related: [サーミスタ]
  - term: 不揮発性
    reading: ふきはつせい
    simple: 電源を切っても、内容が消えない性質です。
    definition: 記憶装置について、電源を切っても記録した内容が保持される性質。フラッシュメモリなどが不揮発性であり、プログラムの格納に使われる。反対に、電源を切ると内容が消える性質を揮発性といい、SRAM や DRAM が当たる。
    related: [フラッシュメモリ]
  - term: 放熱
    reading: ほうねつ
    simple: 部品の熱を、周囲に逃がすことです。
    definition: 電子部品が発生した熱を、空気中など周囲へ逃がすこと。放熱が不十分だと部品の温度が上がり、誤動作や寿命の低下を招く。放熱器（ヒートシンク）の選定では、消費電力と許容できる温度上昇から、必要な熱抵抗を求める。
    related: [熱抵抗]
  - term: オームの法則
    reading: おーむのほうそく
    simple: 電圧と電流と抵抗の関係を表す法則です。
    definition: 抵抗に流れる電流は、加えた電圧に比例し、抵抗の値に反比例するという関係。電流 ＝ 電圧 ÷ 抵抗、電圧 ＝ 電流 × 抵抗、抵抗 ＝ 電圧 ÷ 電流の形で使う。消費電力は電圧 × 電流であり、この法則と組み合わせて計算する。
    related: [消費電力]
