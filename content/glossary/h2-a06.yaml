category: ハードウェア
terms:
  - term: PWM
    reading: ピーダブリューエム
    simple: 電源のオンとオフの比率を変えて、出力を調整する方法です。
    definition: Pulse Width Modulation（パルス幅変調）。電源電圧と0の間を高速に切り替え、オン時間の比率（デューティ比）を変えることで、負荷にかかる平均の電圧や電力を調整する制御方式。モータの速度制御などに使われる。
    related: [デューティ比]
  - term: CMOS
    reading: シーモス
    simple: 消費電力の小さい、代表的な半導体の回路方式です。
    definition: 相補型の MOS トランジスタを組み合わせた回路方式。静止時の消費電力が小さく、集積回路の主流となっている。動的な消費電力は、おおむね負荷容量 × 電源電圧の2乗 × 動作周波数に比例する。
    related: [消費電力]
  - term: 吸収法則
    reading: きゅうしゅうほうそく
    simple: 論理式の中で、片方の項がもう片方を飲み込んで消える法則です。
    definition: ブール代数の法則の一つで、A ＋ A・B ＝ A、A・（A ＋ B）＝ A のように、一方の項が他方を吸収して式が簡単になる関係。論理回路の簡単化に使われる。
    related: [論理式]
  - term: 論理式
    reading: ろんりしき
    simple: 論理積や論理和を組み合わせて、回路の動作を表した式です。
    definition: 論理変数と論理演算（論理積、論理和、否定）を組み合わせて、論理回路の動作を表す式。ブール代数の法則を使って簡単化でき、回路の素子数を減らすことにつながる。
    related: [吸収法則]
  - term: 負論理
    reading: ふろんり
    simple: 電圧の低い方を 1、高い方を 0 と割り当てる表し方です。
    definition: 信号の電圧と論理値の割り当て方の一つで、低い電圧を1、高い電圧を0とする。高い電圧を1とする正論理とは割り当てが逆であり、同じ回路でも演算の読みが入れ替わる（正論理のANDは負論理ではOR）。
    related: [正論理]
  - term: 正論理
    reading: せいろんり
    simple: 電圧の高い方を 1、低い方を 0 と割り当てる表し方です。
    definition: 信号の電圧と論理値の割り当て方の一つで、高い電圧を1、低い電圧を0とする。通常の論理回路の記述で用いられる。低い電圧を1とする負論理と対になる。
    related: [負論理]
  - term: 分解能
    reading: ぶんかいのう
    simple: どれだけ細かく区別して測れるか、という細かさです。
    definition: A/D変換などにおける、量を区別できる細かさ。n ビットの A/D 変換では、入力範囲を 2 の n 乗の段階に分け、1段階の幅（範囲 ÷ 2 の n 乗）が分解能の目安になる。ビット数が多いほど細かくなる。
    related: [A/D変換]
  - term: 順方向電圧
    reading: じゅんほうこうでんあつ
    simple: ダイオードや LED に電流が流れるときに、その両端にかかる電圧です。
    definition: ダイオードやLEDに順方向の電流が流れているときに、その両端に生じる電圧降下。LEDの点灯回路では、電源電圧からこの電圧を引いた分が、直列抵抗にかかる。
    related: [LED]
