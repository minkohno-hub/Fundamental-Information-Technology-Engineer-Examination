category: アルゴリズム
terms:
  - term: 最小値
    reading: さいしょうち
    simple: 集まりの中で、最も小さい値です。
    definition: データの集合の中で最も小さい値。配列の走査では、先頭の要素を初期値として保持し、より小さい要素が現れるたびに更新して求める。最大値とあわせて、値の範囲を求めるのに使われる。
    related: [最大値]
  - term: コラッツ数列
    reading: こらっつすうれつ
    simple: 数に決まった操作を繰り返してできる数列です。偶数なら半分にし、奇数なら 3 倍して 1 を足します。
    definition: 正の整数について、偶数なら 2 で割り、奇数なら 3 倍して 1 を加える変換を繰り返して得られる数列。どの開始値からでも最終的に 1 に到達すると予想されているが、証明されていない。
    related: [剰余]
  - term: ハッピー数
    reading: はっぴーすう
    simple: 各桁の数字の 2 乗の和に置き換える操作を繰り返すと、最後に 1 になる数です。
    definition: 正の整数について、各桁の数字の 2 乗の和を求める操作を繰り返したとき、有限回で 1 に到達する数。到達しない数は、4 を含む循環（4 → 16 → 37 → 58 → 89 → 145 → 42 → 20 → 4）に入ることが知られている。
    tags: [アルゴリズム]
