category: '17'
terms:
  - term: 品質統制
    reading: ひんしつとうせい
    simple: 品質を、組織全体で一定の水準に保つ仕組みです。
    definition: 情報システムの開発や運用の品質を、組織全体で一定の水準に保つための仕組み。全社共通の品質の基準と進め方を定め、各プロジェクトの遵守の状況を確認し、問題があれば是正するという循環を回す。個々のプロジェクトの品質活動を束ねる、上位の仕組みである。
    related: [標準化]
  - term: 標準化
    reading: ひょうじゅんか
    simple: 進め方や基準をそろえて、誰でも同じように行えるようにすることです。
    definition: 作業の進め方や品質の基準などを組織で共通のものとして定め、担当者や部門によるばらつきを抑えること。標準化によって、品質の一定の水準の維持、知見の引継ぎ、効率の向上が期待できる。定めた基準の遵守の確認と合わせて行う。
    related: [品質統制]
  - term: モデル化
    reading: もでるか
    simple: 物事の構造や流れを、図などの形に表すことです。
    definition: 業務やシステムの構造や流れを、図や表などのモデルとして表すこと。モデルにすることで、関係者の間で認識を共有し、現状と将来の姿を比べて、変化の内容と影響を検討できるようになる。業務プロセスの分析や設計の基礎になる。
    related: [業務プロセス]
  - term: 経営戦略
    reading: けいえいせんりゃく
    simple: 会社が目指す方向と、そのための方針です。
    definition: 企業が経営の目標を達成するために定める、事業の方向性と方針。情報システム戦略は、経営戦略を踏まえて策定され、情報システムの活用が経営の目標の達成にどう貢献するかという観点で評価される。
    related: [情報システム戦略]
  - term: 業務プロセス
    reading: ぎょうむぷろせす
    simple: 仕事の進め方の、一連の流れです。
    definition: 受注から出荷のように、業務がどのような手順と役割分担で進むかという一連の流れ。業務プロセスをモデルとして表すことで、現状の問題の把握や、改善後の姿の検討ができる。ビジネスアーキテクチャの設計の対象の一つである。
    related: [モデル化, ビジネスアーキテクチャ]
  - term: システム活用
    reading: しすてむかつよう
    simple: 導入したシステムが、業務で実際に使われていることです。
    definition: 導入した情報システムが、業務の中で実際に使われ、業務の効果につながっている状態。稼働の安定だけでは活用とは言えず、利用の実態と業務への効果を評価し、活用されない原因への対策につなげる。
    related: [評価]
  - term: 評価
    reading: ひょうか
    simple: 基準に照らして、状態や結果を確かめることです。
    definition: 対象の状態や結果を、定めた基準や目標に照らして確かめ、良し悪しを判断すること。評価は、判断で終わらせず、改善の取組につなげることで意味を持つ。システムの活用の評価では、利用の実態と業務への効果が物差しになる。
    related: [システム活用]
