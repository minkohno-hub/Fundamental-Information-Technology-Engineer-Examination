category: システム開発技術
terms:
  - term: 制御フローグラフ
    reading: せいぎょふろーぐらふ
    aliases: [コントロールフローグラフ, 制御流れグラフ]
    simple: プログラムの処理の流れを、ノード（処理のまとまり）とエッジ（流れ）で表した図です。
    definition: プログラムの命令列をノード、制御の移り変わりを有向エッジとして表したグラフ。サイクロマティック複雑度の算出や、網羅基準に基づくテスト経路の検討に用いる。
    related: [サイクロマティック複雑度, ホワイトボックステスト]
  - term: 経路網羅
    reading: けいろもうら
    aliases: [全経路網羅, パスカバレッジ]
    simple: 入口から出口までの通り道をすべて1回以上通るテストの基準です。
    definition: プログラムの入口から出口までのすべての実行経路を1回以上実行するテストの網羅基準。分岐が連続すると経路数は 2 の累乗で増え、現実にはすべてを実施できないことが多い。
    related: [命令網羅, 判定条件網羅, 複数条件網羅]
  - term: テスト消化率
    reading: てすとしょうかりつ
    aliases: [テストケース消化率]
    simple: 計画したテストケースのうち、実施し終えた割合です。
    definition: 計画したテストケース総数に対する、実施済みのテストケース数の割合。バグ曲線やバグ検出数と合わせて、テストの進捗と品質の収束を判断するために用いる。
    related: [バグ曲線]
  - term: バグ検出密度
    reading: ばぐけんしゅつみつど
    aliases: [テスト密度当たりのバグ検出数]
    simple: 実施したテストケース1件あたりに見つかったバグの数です。
    definition: 一定期間に検出したバグ数を、同じ期間に実施したテストケース数で割った値。検出バグ数の増減が、品質の変化によるのか実施量の変化によるのかを見分けるために用いる。
    related: [バグ曲線, テスト消化率]
