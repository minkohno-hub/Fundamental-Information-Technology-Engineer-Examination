category: データ構造・アルゴリズム
terms:
  - term: ハッシュ法
    reading: はっしゅほう
    simple: 値から計算した番地にデータをしまう、速く探せる保管方法です。
    definition: キーにハッシュ関数を適用して格納位置を決めるデータの保管・探索方法。衝突が起きたときの解決法として、線形探査法などのオープンアドレス法や、連鎖法（チェーン法）がある。平均的には高速に探索できるが、表が混むと性能が落ちる。
    related: [線形探索法]
  - term: 交換
    reading: こうかん
    simple: 2つのデータの位置や値を入れ替える操作です。
    definition: 整列などの処理で、2つの要素の値を入れ替える操作。一時変数を使って退避しながら行うのが基本で、バブルソートなど隣接交換型の整列の中心的な動作になる。
    related: [バブルソート]
  - term: ポインタ
    reading: ぽいんた
    simple: データそのものではなく、データのある場所を指し示す情報です。
    definition: データの格納位置（アドレスやノード番号）を表す値。リスト構造では、各ノードが「次のノードへのポインタ」を持ち、たどることで要素の並びを表す。挿入や削除はポインタのつなぎ替えで実現できる。
    related: [連結リスト]
  - term: 二分木
    reading: にぶんぎ
    simple: 各要素（節）が最大で2つの子（左と右）をもつ木構造のことです。
    definition: 木構造の一種で、各節（ノード）が左と右の最大2つの子をもつもの。最下段以外の段が全て埋まり、最下段は左から詰めて埋まっている形を完全二分木といい、根から順に配列に格納できる（要素 i の子は要素 2i と 2i＋1)。走査の順序には、行きがけ順（根・左・右）、通りがけ順（左・根・右）、帰りがけ順（左・右・根）がある。
    related: [再帰]
  - term: 削除マーク
    reading: さくじょまーく
    simple: 削除されたデータの場所に残す、「ここにはデータがあった」という目印です。
    definition: 線形探査法などのハッシュ表で、キーを削除した位置に残す特別な印。空きとして扱うと、その位置より先に格納されたキーが探索で見つからなくなるため、探索はマークを通り過ぎて続けられるよう、空きとは区別される。
    related: [ハッシュ法, 線形探査法]
