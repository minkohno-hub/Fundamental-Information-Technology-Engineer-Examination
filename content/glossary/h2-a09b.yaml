category: データベース
terms:
  - term: ダーティリード
    reading: だーてぃりーど
    aliases: [未コミット読取り]
    simple: 他の人がまだ確定していない（取り消されるかもしれない）更新内容を読んでしまう現象です。
    definition: あるトランザクションが、他のトランザクションの未コミットの更新結果を読み取る現象。更新側がロールバックすると、存在しなかった値を読んだことになる。ACID 特性の独立性が保たれていない状態の一つ。
    related: [独立性, 排他制御, ノンリピータブルリード]
  - term: ノンリピータブルリード
    reading: のんりぴーたぶるりーど
    aliases: [反復不能読取り]
    simple: 同じデータを2回読んだのに、間に他の人が更新して値が変わってしまう現象です。
    definition: 同一トランザクション内で同じ行を繰り返し読んだとき、他のトランザクションによる更新とコミットのため、読み取る値が異なる現象。
    related: [独立性, ダーティリード, ファントムリード]
  - term: ファントムリード
    reading: ふぁんとむりーど
    aliases: [幻影読取り]
    simple: 同じ条件で2回検索したのに、間に他の人が行を追加・削除して結果の行数が変わる現象です。
    definition: 同一トランザクション内で同じ検索条件の問合せを繰り返したとき、他のトランザクションによる行の挿入・削除のため、結果の行の集合が変わる現象。既存の行へのロックだけでは防げない。
    related: [独立性, ノンリピータブルリード, ダーティリード]
