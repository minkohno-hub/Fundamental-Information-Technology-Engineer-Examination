category: アルゴリズムとプログラミング
terms:
  - term: 配列
    reading: はいれつ
    simple: 同じ種類のデータを番号付きの箱に並べて入れたものです。番号を指定してすぐに取り出せます。
    definition: 同じ型の要素を連続した領域に並べ、要素番号（添字）で各要素に直接アクセスできるデータ構造。2次元配列は行と列の2つの要素番号で指定する。IPA の擬似言語では要素番号は問題文で指定され、多くは1から始まる。
    difference: リストは要素がポインタでつながり、途中への挿入・削除が容易だが直接アクセスはできない。
    related: [リスト]
  - term: リスト
    reading: リスト
    simple: データが「次のデータの場所」を覚えていて、鎖のようにつながったデータ構造です。
    definition: 各要素がデータと次（双方向リストでは前も）の要素へのポインタをもつデータ構造。ポインタの付け替えだけで挿入・削除できる。末尾が先頭を指すものを環状リストという。
    related: [配列, スタック, キュー]
  - term: キュー
    reading: キュー
    aliases: [待ち行列（データ構造）]
    simple: 先に入れたものから順番に取り出す（先入れ先出し）データの入れ物です。行列に並ぶのと同じです。
    definition: 一端から追加（エンキュー）し、他端から取り出す（デキュー）FIFO（First In First Out）のデータ構造。幅優先探索や処理待ちの管理に使う。
    difference: スタックは最後に入れたものから取り出す LIFO。
    related: [スタック, 幅優先探索]
  - term: 木構造
    reading: きこうぞう
    simple: 1つの根から枝分かれして広がる、木を逆さにしたような形のデータ構造です。
    definition: 節（ノード）と枝からなり、根以外の各節がちょうど1つの親をもつ階層的なデータ構造。子をもたない節を葉という。
    related: [2分木, B木]
  - term: 2分木
    reading: にぶんぎ
    simple: どの節も子を2つまでしか持たない木構造です。
    definition: 各節が高々2つの子（左の子・右の子）をもつ木。先行順（節→左→右）、中間順（左→節→右）、後行順（左→右→節）でたどる。全ての段が詰まった（最下段は左詰めの）ものを完全2分木という。
    related: [2分探索木, ヒープ, 木構造]
  - term: 2分探索木
    reading: にぶんたんさくぎ
    simple: 「左には小さい値、右には大きい値」を置くルールの2分木で、探索に使います。
    definition: 各節について、左部分木のキーはすべて節のキーより小さく、右部分木のキーはすべて大きい2分木。中間順にたどると昇順になる。偏ると探索効率が落ちるため、AVL 木などの平衡木がある。
    related: [2分木, B木]
  - term: ヒープ
    reading: ヒープ
    simple: 親が子より必ず大きい（または小さい）というルールを守る完全2分木です。最大値をすぐ取り出せます。
    definition: 各節の値が子の値以上（最大ヒープ）または以下（最小ヒープ）である完全2分木。配列で表すと、要素番号 i の子は 2i と 2i＋1、親は i÷2（切捨て）。ヒープソートや優先度付きキューに使う。
    difference: プログラム実行時の動的なメモリ領域も「ヒープ」と呼ぶが、別の概念。
    related: [2分木, 整列アルゴリズム]
  - term: B木
    reading: ビーき
    simple: 1つの節にたくさんのキーを持たせ、木の高さを低く保つ木構造で、データベースの索引に使われます。
    definition: 各節が複数のキーと子をもつ多分木で、すべての葉が同じ深さになるように保たれる平衡木。ディスクアクセスの回数を少なくできる。AVL 木は左右の部分木の高さの差を1以下に保つ2分探索木。
    related: [2分探索木, 木構造]
  - term: 流れ図
    reading: ながれず
    aliases: [フローチャート]
    simple: 処理の順番や分かれ道を、決まった記号と線で図にしたものです。
    definition: JIS X 0121 に定められた記号（端子・処理・判断・ループ端・データ・定義済み処理など）を線で結び、処理手順を表した図。判断はひし形で表す。
    related: [制御構造]
  - term: 2分探索法
    reading: にぶんたんさくほう
    aliases: [二分探索]
    simple: 並べ替え済みのデータの真ん中と比べ、探す範囲を半分ずつ絞り込んでいく探し方です。
    definition: 整列済みのデータに対し、探索範囲の中央の要素と比較して範囲を半分に狭める操作を繰り返す探索法。最大比較回数は ⌊log₂ n⌋＋1、計算量は O(log n)。
    related: [線形探索法, 計算量]
  - term: 線形探索法
    reading: せんけいたんさくほう
    aliases: [逐次探索]
    simple: データを先頭から順番に1つずつ調べていく、最も単純な探し方です。
    definition: 先頭から順に目的の値と比較する探索法。整列を必要とせず、計算量は O(n)。末尾に目的の値（番兵）を置くと終端判定を省ける。
    related: [2分探索法]
  - term: 整列アルゴリズム
    reading: せいれつアルゴリズム
    aliases: [ソート]
    simple: データを小さい順（または大きい順）に並べ替える手順のことです。
    definition: |
      主な整列法と計算量：バブルソート・選択ソート・挿入ソートは O(n²)、クイックソートは平均 O(n log n)・最悪 O(n²)、マージソートとヒープソートは最悪でも O(n log n)。
      同じキーの順序が保たれるものを安定な整列といい、バブル・挿入・マージソートは安定、選択・クイック・ヒープ・シェルソートは安定ではない。
    related: [分割統治法, ヒープ, 計算量]
  - term: 分割統治法
    reading: ぶんかつとうちほう
    simple: 大きな問題を小さな同じ形の問題に分けて解き、その答えを組み合わせて全体を解く方法です。
    definition: 問題を部分問題に分割し、再帰的に解いた結果を統合して元の問題の解を得るアルゴリズム設計手法。マージソート、クイックソートなど。
    related: [再帰, 整列アルゴリズム, 動的計画法]
  - term: ハッシュ表探索法
    reading: ハッシュひょうたんさくほう
    aliases: [ハッシュ, ハッシュ表]
    simple: キーから計算した番号（ハッシュ値）の位置にデータを置き、すぐに見つけられるようにする方法です。
    definition: ハッシュ関数でキーから格納位置を算出して格納・探索する方法。異なるキーが同じ位置になること（衝突、シノニム）への対処にオープンアドレス法やチェイン法がある。衝突が少なければ O(1)。
    difference: セキュリティのハッシュ関数（SHA-256 など）は改ざん検知用で、目的が異なる。
    related: [2分探索法]
  - term: ダイクストラ法
    reading: ダイクストラほう
    simple: 地図の上で、出発点から各地点までの最短の道のりを求める方法です。
    definition: 辺の重みが非負のグラフで、確定距離が最小の頂点を順に確定しながら単一始点の最短経路を求めるアルゴリズム。負の重みがある場合はベルマンフォード法を使う。
    related: [グラフ理論, 幅優先探索]
  - term: 幅優先探索
    reading: はばゆうせんたんさく
    aliases: [BFS]
    simple: 出発点に近いところから順に、横に広がるように調べていく探索方法です。
    definition: 始点から近い（浅い）頂点から順に探索する方法で、キューを用いる。深く進んでから戻る深さ優先探索はスタックまたは再帰を用いる。
    related: [キュー, スタック, ダイクストラ法]
  - term: 文字列照合
    reading: もじれつしょうごう
    aliases: [パターンマッチング]
    simple: 長い文章の中から、指定した文字の並びがどこにあるかを探すことです。
    definition: テキスト中からパターン文字列の出現位置を求める処理。単純な方法は O(n×m)、BM 法や KMP 法は照合位置を効率よくずらして高速化する。
    related: [計算量]
  - term: ファイル処理
    reading: ファイルしょり
    simple: ファイルのデータを読んで集計したり、別のファイルと照らし合わせて更新したりする処理です。
    definition: 整列済みのマスタファイルとトランザクションファイルをキー順に照合して更新するマッチング処理、キーが変わるごとに集計するコントロールブレーク処理などがある。
    related: [整列アルゴリズム]
  - term: 形態素解析
    reading: けいたいそかいせき
    simple: 文章を単語などの小さな単位に区切り、それぞれの品詞を判別する処理です。
    definition: 自然言語の文を形態素（意味をもつ最小単位）に分割し、品詞・活用形などを判別する処理。自然言語処理は形態素解析→構文解析→意味解析→文脈解析の順に行う。
    related: [n-gram, LLM]
  - term: n-gram
    reading: エヌグラム
    simple: 文章を「連続する n 文字（または n 単語）」ずつに区切って扱う方法です。
    definition: 連続する n 個の文字・単語の組。全文検索の索引、文書の類似度計算、言語モデルなどに用いる。
    example: 「情報処理」の2-gram は「情報」「報処」「処理」。
    related: [形態素解析]
  - term: コーディング標準
    reading: コーディングひょうじゅん
    aliases: [コーディング規約]
    simple: プログラムの書き方をそろえるためのルールです。読みやすく、間違いを起こしにくくします。
    definition: 字下げ、命名規則、ネストの深さ、使用禁止命令などのプログラムの記述ルール。可読性・保守性の向上と誤りの防止を目的とする。
    related: [モジュール分割]
  - term: モジュール分割
    reading: モジュールぶんかつ
    simple: 大きなプログラムを、役割ごとの小さな部品（モジュール）に分けることです。
    definition: プログラムを機能単位のモジュールに分割すること。モジュール強度（内部の結び付き）を強く、モジュール結合度（モジュール間の結び付き）を弱くすると独立性が高まる。
    related: [モジュール結合度]
  - term: モジュール結合度
    reading: モジュールけつごうど
    simple: モジュール同士がどれくらい強く依存し合っているかを表す尺度で、弱いほど良い設計です。
    definition: モジュール間の関連の強さ。弱い順にデータ結合・スタンプ結合・制御結合・外部結合・共通結合・内容結合。データ結合が最も望ましい。
    related: [モジュール分割]
  - term: データ型
    reading: データがた
    simple: 変数に入れる値の種類（整数、小数、文字列、真偽など）のことです。
    definition: 値の集合とそれに適用できる演算を定めたもの。整数型・実数型・論理型（true/false）・文字型・文字列型、配列などの構造型、データと操作を一体化した抽象データ型がある。
    related: [制御構造]
  - term: 制御構造
    reading: せいぎょこうぞう
    simple: プログラムの流れを決める基本の型で、順番に進む・条件で分かれる・繰り返す の3つがあります。
    definition: 順次・選択（if など）・繰返し（while, do-while, for）の3つの基本構造。前判定の繰返しは0回のこともあり、後判定の繰返しは少なくとも1回実行する。
    related: [流れ図, データ型]
  - term: 引数
    reading: ひきすう
    simple: 関数や手続を呼び出すときに渡す値のことです。
    definition: 手続・関数に渡すデータ。値の複製を渡す値渡しと、変数の参照を渡して呼出し側の変数を変更しうる参照渡しがある。関数が呼出し元に返す値を戻り値という。
    related: [局所変数]
  - term: 局所変数
    reading: きょくしょへんすう
    aliases: [ローカル変数]
    simple: 関数の中だけで使える変数です。関数が終わると消えます。
    definition: 宣言した手続・関数の内部でのみ有効な変数。プログラム全体から参照できる変数は大域変数（IPA の擬似言語では「大域:」を付けて宣言）。
    related: [引数, 再帰]
  - term: オブジェクト指向
    reading: オブジェクトしこう
    simple: データとそれを扱う処理をひとまとめの「オブジェクト」として考え、組み合わせてプログラムを作る考え方です。
    definition: データ（属性）と操作（メソッド）をカプセル化したオブジェクトを単位とする考え方。クラス（型）からインスタンスを生成し、継承で共通部分を再利用、ポリモーフィズムで同じ呼出しに異なる振る舞いをさせる。
    related: [オーバーライド, コンストラクタ, UML]
  - term: オーバーライド
    reading: オーバーライド
    simple: 親クラスから受け継いだメソッドを、子クラスで書き直して動きを変えることです。
    definition: スーパークラスで定義されたメソッドを、サブクラスで同じ名前・同じ引数で再定義すること。
    difference: オーバーロードは、同じ名前で引数の型や個数が異なるメソッドを複数定義すること。
    related: [オーバーロード, オブジェクト指向]
  - term: オーバーロード
    reading: オーバーロード
    simple: 同じ名前で、受け取る引数の種類や数が違うメソッドを複数用意することです。
    definition: 同一のクラス内などで、名前が同じでシグネチャ（引数の型・個数）が異なるメソッドを複数定義すること。
    related: [オーバーライド]
  - term: コンストラクタ
    reading: コンストラクタ
    simple: オブジェクトを作るときに自動で呼ばれ、最初の値を設定する特別なメソッドです。
    definition: インスタンス生成時に呼び出され、メンバ変数の初期化などを行う特殊なメソッド。破棄時に呼ばれるものをデストラクタという。
    related: [オブジェクト指向]
  - term: Ajax
    reading: エイジャックス
    fullName: Asynchronous JavaScript and XML
    japanese: 非同期の JavaScript と XML
    words:
      - { en: Asynchronous, ja: 非同期の（応答を待たずに次の処理に進む） }
      - { en: JavaScript, ja: ブラウザで動くプログラム言語 }
      - { en: XML, ja: データ記述言語 }
    simple: ページ全体を読み込み直さずに、必要な部分だけをサーバとやり取りして書き換える Web の技術です。
    definition: ブラウザ上のスクリプトがサーバと非同期に通信し、受け取ったデータで DOM を操作してページの一部を更新する技術。データ形式は JSON が主流。
    related: [JSON, DOM]
  - term: スクリプト言語
    reading: スクリプトげんご
    simple: 簡単に書けて、すぐに実行できるプログラム言語のグループです。
    definition: 比較的簡易な記述で、インタプリタなどにより手軽に実行できる言語の総称。Python、Ruby、Perl、PHP、ECMAScript（JavaScript）など。
    related: [手続型言語, Java]
  - term: 手続型言語
    reading: てつづきがたげんご
    simple: 「何をどの順番で行うか」という手順を書き並べていくタイプのプログラム言語です。
    definition: 処理手順を命令の並びとして記述する言語。C（システム開発）、COBOL（事務処理）、Fortran（科学技術計算）、R（統計解析）など。
    related: [スクリプト言語, 関数型言語]
  - term: Java
    reading: ジャバ
    simple: 一度書けば OS が違っても同じように動かせる、代表的なオブジェクト指向言語です。
    definition: ソースコードをバイトコードにコンパイルし、Java 仮想マシン（JVM）上で実行するオブジェクト指向言語。プラットフォームに依存しにくい。
    related: [オブジェクト指向]
  - term: 共通言語基盤
    reading: きょうつうげんごきばん
    fullName: Common Language Infrastructure
    japanese: 共通言語基盤
    words:
      - { en: Common, ja: 共通の }
      - { en: Language, ja: 言語 }
      - { en: Infrastructure, ja: 基盤 }
    simple: いろいろなプログラム言語で作った部品を、共通の仕組みの上で一緒に動かすための仕様です。
    definition: JIS X 3016（ISO/IEC 23271）で標準化された、言語非依存の中間言語と実行環境の仕様。.NET の実行環境が代表的な実装。
    difference: 文字入力でコンピュータを操作する CLI（Command Line Interface）とは別物。
    related: [Java]
  - term: HTML
    reading: エイチティーエムエル
    fullName: HyperText Markup Language
    japanese: ハイパーテキスト記述言語
    words:
      - { en: HyperText, ja: ハイパーテキスト（リンクで他の文書へ移動できる文書） }
      - { en: Markup, ja: 目印付け（タグで意味を付けること） }
      - { en: Language, ja: 言語 }
    simple: Web ページの文章の構造（見出し・段落・リンクなど）を書くための言語です。
    definition: タグを用いて文書の構造を記述する Web ページ用のマークアップ言語。XML の文法に従って再定義したものを XHTML という。
    related: [CSS, XML, DOM]
  - term: CSS
    reading: シーエスエス
    fullName: Cascading Style Sheets
    japanese: 段階スタイルシート
    words:
      - { en: Cascading, ja: 段階的に適用される（滝のように流れ落ちる） }
      - { en: Style, ja: 見た目・様式 }
      - { en: Sheets, ja: 記述した紙・ファイル }
    simple: Web ページの文字の大きさや色、配置などの「見た目」を指定する言語です。
    definition: HTML や XML 文書の表示スタイルを指定するスタイルシート言語。構造と表現を分離できる。複数の指定が段階的（カスケード）に適用される。
    related: [HTML]
  - term: XML
    reading: エックスエムエル
    fullName: Extensible Markup Language
    japanese: 拡張可能なマークアップ言語
    words:
      - { en: Extensible, ja: 拡張可能な（自由にタグを追加できる） }
      - { en: Markup, ja: 目印付け }
      - { en: Language, ja: 言語 }
    simple: 自分でタグを決めて、データの意味と構造を表せる言語で、データ交換に使われます。
    definition: 利用者が独自のタグを定義できるマークアップ言語。文書型は DTD や XML Schema で定義する。表示形式の指定・変換に XSL、逐次処理型の API に SAX、メッセージ交換に SOAP がある。
    related: [HTML, DOM, JSON]
  - term: DOM
    reading: ドム
    fullName: Document Object Model
    japanese: 文書オブジェクトモデル
    words:
      - { en: Document, ja: 文書 }
      - { en: Object, ja: オブジェクト（プログラムで扱える部品） }
      - { en: Model, ja: モデル（表現の仕組み） }
    simple: HTML や XML の文書を木の形のデータとして扱い、プログラムから読み書きできるようにする仕組みです。
    definition: 文書を木構造のオブジェクトとして表現し、要素の参照・追加・変更・削除を行うための API。
    difference: SAX は文書を先頭から順に読み、イベントごとに処理する（全体をメモリに展開しない）。
    related: [XML, HTML, Ajax]
  - term: JSON
    reading: ジェイソン
    fullName: JavaScript Object Notation
    japanese: JavaScript のオブジェクト表記法
    words:
      - { en: JavaScript, ja: ブラウザで動くプログラム言語 }
      - { en: Object, ja: オブジェクト }
      - { en: Notation, ja: 表記法 }
    simple: 「名前：値」の組でデータを表す、軽くて読みやすいデータの書き方です。Web API でよく使われます。
    definition: JavaScript のオブジェクトリテラルを基にしたテキスト形式のデータ記述言語。オブジェクト（名前と値の組の集まり）と配列でデータを表す。
    example: '{"name": "佐藤", "age": 20}'
    related: [XML, Ajax]
  - term: UML
    reading: ユーエムエル
    fullName: Unified Modeling Language
    japanese: 統一モデリング言語
    words:
      - { en: Unified, ja: 統一された }
      - { en: Modeling, ja: モデル化（設計図を描くこと） }
      - { en: Language, ja: 言語 }
    simple: ソフトウェアの設計を図で表すための、世界共通の書き方のルールです。
    definition: |
      オブジェクト指向の分析・設計で用いる図の表記法。主な図：クラス図（クラスと関係）、ユースケース図（機能と利用者）、シーケンス図（メッセージの時系列）、アクティビティ図（処理の流れ）、ステートマシン図（状態遷移）、コミュニケーション図（オブジェクト間の連携）。
      クラス図の関係：汎化（白抜き三角の実線）、集約（白抜きひし形）、コンポジション（黒塗りひし形）、依存（破線の矢印）。
    related: [オブジェクト指向]
  - term: 多次元配列
    reading: たじげんはいれつ
    simple: 添字を2つ以上使って要素を指定する配列です。
    definition: "複数の添字（次元）で要素を特定する配列。二次元配列は表（行と列）に相当し、a[i][j] のように参照する。"
    related: [配列, 二次元配列]
  - term: 二次元配列
    reading: にじげんはいれつ
    simple: 行と列の2つの添字で要素を指定する、表のような配列です。
    definition: 行番号と列番号の2つの添字で要素を指定する配列。行列や表形式のデータ、盤面の表現などに使う。
    related: [配列, 多次元配列]
  - term: 動的配列
    reading: どうてきはいれつ
    simple: 実行中に要素数を増やしたり減らしたりできる配列です。
    definition: 実行時に要素数（領域の大きさ）を変更できる配列。必要に応じて領域を確保し直すため、静的配列より柔軟だが領域の再確保にコストがかかる。
    related: [配列, 静的配列]
  - term: 静的配列
    reading: せいてきはいれつ
    simple: 要素数をあらかじめ決めておき、実行中は変えられない配列です。
    definition: 宣言時（コンパイル時）に要素数が固定され、実行中に大きさを変更できない配列。領域確保が単純で高速だが、大きさの変更はできない。
    related: [配列, 動的配列]
  - term: 連結リスト
    reading: れんけつりすと
    aliases: [線形リスト]
    simple: 各要素が次の要素の場所（ポインタ）を持つことでつながったデータ構造です。
    definition: 各要素（セル）がデータと次の要素へのポインタをもち、ポインタをたどって順にアクセスするデータ構造。線形リストともいう。要素の挿入・削除はポインタの付け替えだけで済むが、先頭から順にたどる必要がある。
    related: [リスト, 単方向リスト, 双方向リスト, 環状リスト]
  - term: 単方向リスト
    reading: たんほうこうりすと
    simple: 次の要素へのポインタだけをもつ連結リストです。
    definition: 各要素が後続要素へのポインタのみをもつ連結リスト。一方向にしかたどれない。
    related: [連結リスト, 双方向リスト]
  - term: 双方向リスト
    reading: そうほうこうりすと
    simple: 前の要素と次の要素の両方へのポインタをもつ連結リストです。
    definition: 各要素が前の要素と次の要素の両方へのポインタをもつ連結リスト。前後どちらにもたどれるが、ポインタの分だけ領域を多く使う。
    related: [連結リスト, 単方向リスト]
  - term: 環状リスト
    reading: かんじょうりすと
    simple: 最後の要素が最初の要素につながっている連結リストです。
    definition: 末尾要素のポインタが先頭要素を指し、全体が輪になった連結リスト。どの要素からでも全要素をたどれる。循環リストともいう。
    related: [連結リスト, 単方向リスト]
  - term: FIFO
    reading: ふぃふぉ
    fullName: First In First Out
    japanese: 先入れ先出し
    words:
      - { en: First In, ja: 最初に入ったものが }
      - { en: First Out, ja: 最初に出る }
    simple: 先に入れたデータを先に取り出す方式です。キューがこの方式です。
    definition: 先に格納されたデータが先に取り出される方式。キュー（待ち行列）やプロセスの到着順スケジューリングで用いる。
    related: [キュー, スタック]
  - term: エンキュー
    reading: えんきゅー
    simple: キューの末尾にデータを追加する操作です。
    definition: キューの末尾（後端）にデータを追加する操作。
    related: [キュー, デキュー]
  - term: デキュー
    reading: できゅー
    simple: キューの先頭からデータを取り出す操作です。
    definition: キューの先頭（前端）からデータを取り出して削除する操作。
    related: [キュー, エンキュー]
  - term: 根
    reading: ね
    simple: 木構造の一番上にあって、親をもたない節です。
    definition: 木構造で親をもたない唯一の節（ルート）。すべての節は根から辿れる。
    related: [木構造, 葉, 節]
  - term: 葉
    reading: は
    simple: 木構造で、子をもたない一番端の節です。
    definition: 木構造で子をもたない節（リーフ）。
    related: [木構造, 根, 節]
  - term: 節
    reading: ふし
    aliases: [ノード]
    simple: 木構造やグラフの要素となる点です。
    definition: 木構造やグラフを構成する個々の要素（ノード）。根、内部節、葉に分けられる。
    related: [木構造, 根, 葉]
  - term: 多分木
    reading: たぶんぎ
    simple: "1つの節が3つ以上の子をもてる木です。"
    definition: 各節が2つを超える数の子をもてる木構造。子の数が最大 m の木を m 分木という。B木も多分木の一種。
    related: [木構造, "2分木"]
  - term: 順序木
    reading: じゅんじょぎ
    simple: 子どうしの順番に意味がある木です。
    definition: 同じ親をもつ子の間に順序（左から何番目か）が定められている木構造。順序が区別されない木は無順序木という。
    related: [木構造]
  - term: 完全2分木
    reading: かんぜんにぶんぎ
    simple: 葉以外のすべての節が子を2つもち、葉の深さがすべて等しい2分木です。
    definition: 最下段以外のすべての節が2つの子をもち、すべての葉が同じ深さにある2分木。深さ d のとき節の総数は 2^(d+1)−1。
    related: ["2分木"]
  - term: 先行順
    reading: せんこうじゅん
    aliases: [前順]
    simple: 親を先に訪れてから左の子、右の子の順に調べる木の走査順です。
    definition: "2分木の走査（巡回）法の一つで、節→左部分木→右部分木の順に訪問する方法。前順（行きがけ順）ともいう。"
    related: ["2分木", 中間順, 後行順]
  - term: 中間順
    reading: ちゅうかんじゅん
    aliases: [間順]
    simple: 左の子、親、右の子の順に調べる木の走査順です。
    definition: "2分木の走査法の一つで、左部分木→節→右部分木の順に訪問する方法。間順（通りがけ順）ともいう。2分探索木では値の昇順に訪問する。"
    related: ["2分木", 先行順, 後行順]
  - term: 後行順
    reading: こうこうじゅん
    aliases: [後順]
    simple: 左の子、右の子を調べてから最後に親を調べる木の走査順です。
    definition: "2分木の走査法の一つで、左部分木→右部分木→節の順に訪問する方法。後順（帰りがけ順）ともいう。"
    related: ["2分木", 先行順, 中間順]
  - term: AVL木
    reading: えーぶいえるぎ
    simple: 左右の部分木の高さの差が1以下になるよう保つ、自己平衡型の2分探索木です。
    definition: 各節で左右の部分木の高さの差が1以下であるように回転操作で自己平衡する2分探索木。探索・挿入・削除の計算量が O(log n) に保たれる。
    related: [B木, "2分木"]
  - term: 平衡木
    reading: へいこうぎ
    aliases: [バランス木]
    simple: どの葉の深さもほぼ同じになるよう保たれた木です。
    definition: 節の挿入・削除をしても、根から各葉までの深さが大きくずれないよう調整される木構造の総称。B木、AVL木などがある。
    related: [B木, AVL木]
  - term: 番兵
    reading: ばんぺい
    simple: 探索の終了判定を省くために、配列の末尾に置く探したい値のコピーです。
    definition: 線形探索で探索対象の値を配列の末尾にあらかじめ置いておくことで、配列の範囲を超えたかどうかの判定を省略する手法（またはその値）。比較回数を減らして高速化できる。
    related: [線形探索法]
  - term: バブルソート
    reading: ばぶるそーと
    simple: 隣り合う要素を比べて、順序が逆なら入れ替えることを繰り返す整列法です。
    definition: 隣接する2要素を比較して順序が逆なら交換する操作を端から繰り返し、最大（最小）値を泡のように末尾へ移動させていく整列法。計算量は O(n^2)、安定。
    related: [整列アルゴリズム, 選択ソート, 挿入ソート]
  - term: 選択ソート
    reading: せんたくそーと
    simple: 未整列部分から最小の値を選んで先頭に移すことを繰り返す整列法です。
    definition: 未整列の範囲から最小（最大）の要素を選び、その範囲の先頭の要素と交換することを繰り返す整列法。計算量は O(n^2)、安定ではない。
    related: [整列アルゴリズム, バブルソート]
  - term: 挿入ソート
    reading: そうにゅうそーと
    simple: 整列済みの部分に、1つずつ要素を正しい位置へ挿入していく整列法です。
    definition: 整列済みの部分列に、未整列の要素を一つずつ適切な位置へ挿入していく整列法。計算量は O(n^2) だがほぼ整列済みのデータには高速で、安定。
    related: [整列アルゴリズム, シェルソート]
  - term: クイックソート
    reading: くいっくそーと
    simple: 基準値を決めて小さいグループと大きいグループに分け、それぞれを再帰的に整列する方法です。
    definition: 基準値（ピボット）を選んで、それ以下と以上の2グループに分割し、各グループを再帰的に整列する分割統治法。平均計算量は O(n log n)、最悪は O(n^2)。安定ではない。
    related: [整列アルゴリズム, マージソート, ヒープソート]
  - term: マージソート
    reading: まーじそーと
    simple: データを半分に分けてそれぞれ整列し、整列済みの2つをまとめる方法です。
    definition: データを二分割して各々を整列し、整列済みの2列を併合（マージ）して全体を整列する分割統治法。計算量は常に O(n log n) で安定だが、作業領域が必要。
    related: [整列アルゴリズム, クイックソート]
  - term: ヒープソート
    reading: ひーぷそーと
    simple: ヒープという木構造を使って、最大値（最小値）を順に取り出していく整列法です。
    definition: 要素をヒープ（親が子より常に大きい／小さい完全2分木）に構成し、根の最大（最小）値を取り出しては再構成することを繰り返す整列法。計算量は常に O(n log n)、安定ではない。
    related: [整列アルゴリズム, クイックソート, 優先度付きキュー]
  - term: シェルソート
    reading: しぇるそーと
    simple: 離れた要素どうしで挿入ソートを行い、間隔を狭めながら整列する方法です。
    definition: 一定間隔だけ離れた要素どうしで挿入ソートを行い、間隔を段階的に狭めて最後は間隔1で整列する方法。挿入ソートの改良で、安定ではない。
    related: [整列アルゴリズム, 挿入ソート]
  - term: 安定な整列
    reading: あんていなせいれつ
    simple: キーが同じ要素の元の順序が、整列後も変わらない整列です。
    definition: 同じキー値をもつ要素の相対的な順序が整列の前後で保たれる性質（安定性）をもつ整列法。バブルソート、挿入ソート、マージソートは安定、クイックソート、ヒープソートは安定ではない。
    related: [整列アルゴリズム]
  - term: シノニム
    reading: しのにむ
    simple: ハッシュ関数で同じ格納位置になってしまう、異なるキーどうしのことです。
    definition: ハッシュ表で異なるキーから同じハッシュ値（格納位置）が得られるとき、それらのキーを互いにシノニムという。衝突の原因となる。
    related: [ハッシュ表探索法, 衝突]
  - term: 衝突
    reading: しょうとつ
    simple: ハッシュ表で、別のデータが同じ格納位置になってしまうことです。
    definition: シノニムのデータを格納しようとして、すでに別のデータが同じ位置を占めている状態。オープンアドレス法やチェイン法で解決する。
    related: [ハッシュ表探索法, シノニム, オープンアドレス法, チェイン法]
  - term: オープンアドレス法
    reading: おーぷんあどれすほう
    simple: 衝突したら、ハッシュ表の別の空き位置を探して格納する方法です。
    definition: 衝突が起きたときに、同じ表の中の別の空き位置を（線形走査や再ハッシュなどで）探して格納する衝突解決法。
    related: [衝突, チェイン法, 線形走査法]
  - term: チェイン法
    reading: ちぇいんほう
    simple: 同じ位置になったデータを、リストでつないで管理する方法です。
    definition: 同じハッシュ値のデータを連結リストでつないで格納する衝突解決法。表の外に領域を確保して連鎖させるため、オープンハッシュ法ともいう。
    related: [衝突, オープンアドレス法]
  - term: ベルマンフォード法
    reading: べるまんふぉーどほう
    simple: 辺の重みが負でもよい場合に使える最短経路のアルゴリズムです。
    definition: 単一始点から各頂点への最短経路を求めるアルゴリズム。辺の重みが負でも使え、負の閉路を検出できる。計算量は O(VE) で、ダイクストラ法より遅い。
    related: [ダイクストラ法, 最短経路探索]
  - term: 最短経路探索
    reading: さいたんけいろたんさく
    aliases: [最短経路問題]
    simple: グラフで、2点間の距離（重みの合計）が最小となる道筋を求める問題です。
    definition: 重み付きグラフにおいて、始点から終点までの辺の重みの総和が最小となる経路を求める問題。ダイクストラ法、ベルマンフォード法などの解法がある。
    related: [ダイクストラ法, ベルマンフォード法]
  - term: 深さ優先探索
    reading: ふかさゆうせんたんさく
    aliases: [DFS]
    simple: 行けるところまで深く進み、行き止まりになったら戻って別の道を調べる探索法です。
    definition: グラフや木で、ある頂点から未訪問の隣接頂点へ可能な限り深く進み、行き止まりで戻って別の枝を調べる探索法。スタックまたは再帰で実装する。
    related: [幅優先探索]
  - term: BM法
    reading: びーえむほう
    fullName: Boyer-Moore
    japanese: ボイヤー・ムーア法
    words:
      - { en: Boyer, ja: ボイヤー（考案者） }
      - { en: Moore, ja: ムーア（考案者） }
    simple: パターンの末尾から比較し、一致しなければ大きく読み飛ばして高速に文字列を探す方法です。
    definition: パターンを末尾から先頭に向かって比較し、不一致のとき不一致文字に応じてパターンを一度に大きくずらす文字列照合アルゴリズム。実用上高速。
    related: [文字列照合, KMP法]
  - term: KMP法
    reading: けーえむぴーほう
    fullName: Knuth-Morris-Pratt
    japanese: クヌース・モリス・プラット法
    words:
      - { en: Knuth, ja: クヌース（考案者） }
      - { en: Morris, ja: モリス（考案者） }
      - { en: Pratt, ja: プラット（考案者） }
    simple: パターン内の繰り返しを利用して、無駄な比較を省く文字列探索法です。
    definition: パターンの接頭辞と接尾辞の一致情報（失敗関数）を事前に作り、不一致時にテキスト側を戻さず効率的にずらす文字列照合アルゴリズム。計算量は O(n+m)。
    related: [文字列照合, BM法]
  - term: マッチング処理
    reading: まっちんぐしょり
    aliases: [突合せ処理]
    simple: "2つのファイルのキーを突き合わせて、同じキーのレコードを処理する方法です。"
    definition: キーで整列された複数のファイルを先頭から順に比較し、キーが一致するレコードどうしを処理する方法。マスタファイルの更新などで用いる。
    related: [ファイル処理, マスタファイル, トランザクションファイル]
  - term: マスタファイル
    reading: ますたふぁいる
    simple: 取引先や商品など、基準となるデータを蓄えておくファイルです。
    definition: 顧客、商品、従業員など業務の基礎となる比較的変化の少ないデータを保持するファイル。トランザクションファイルの内容で更新される。
    related: [ファイル処理, トランザクションファイル]
  - term: トランザクションファイル
    reading: とらんざくしょんふぁいる
    simple: 売上や入出金など、日々発生する取引の記録を蓄えるファイルです。
    definition: 売上、入出金、注文など業務で発生した取引の都度記録されるファイル。マスタファイルを更新する入力として用いられる。
    related: [ファイル処理, マスタファイル]
  - term: 構文解析（自然言語）
    reading: こうぶんかいせきしぜんげんご
    simple: 文の中で単語どうしがどう組み合わさっているか、文の構造を調べる処理です。
    definition: 自然言語処理において、形態素の並びから文法規則に従って句や文の構造（構文木）を導く処理。
    related: [形態素解析, 係り受け解析, 自然言語処理]
  - term: 係り受け解析
    reading: かかりうけかいせき
    simple: 文の中のどの語がどの語を修飾しているかを調べる処理です。
    definition: 文節や単語間の修飾・被修飾（係り受け）の関係を解析する処理。日本語の構文解析で広く用いられる。
    related: [形態素解析, 構文解析（自然言語）]
  - term: 文脈解析
    reading: ぶんみゃくかいせき
    simple: 複数の文のつながりや話の流れを踏まえて、意味や指示対象を調べる処理です。
    definition: 文単位を超えて、前後の文との関係や話の流れから照応関係（代名詞が何を指すか）や談話構造、意図を解析する自然言語処理。
    related: [形態素解析, 自然言語処理]
  - term: 自然言語処理
    reading: しぜんげんごしょり
    fullName: Natural Language Processing
    japanese: 自然言語処理
    words:
      - { en: Natural, ja: 自然な（人間が日常使う） }
      - { en: Language, ja: 言語 }
      - { en: Processing, ja: 処理 }
    simple: 人が使う言葉（日本語や英語など）をコンピュータで扱う技術です。
    definition: 日常使われる自然言語をコンピュータで解析・生成する技術の総称。形態素解析、構文解析、意味解析、文脈解析、機械翻訳、対話システムなどを含む。
    related: [形態素解析, 構文解析（自然言語）]
  - term: インデンテーション
    reading: いんでんてーしょん
    simple: プログラムの見やすさのために、行頭に空白を入れて字下げすることです。
    definition: ブロック構造を読み取りやすくするため、行頭に空白やタブを入れて字下げすること。コーディング規約で幅などが定められる。
    related: [コーディング標準]
  - term: 命名規則
    reading: めいめいきそく
    simple: 変数名や関数名の付け方のルールです。
    definition: 変数、関数、クラスなどの名前の付け方（大文字小文字の使い分け、単語の区切り、接頭辞など）に関する規則。コーディング規約の一部。
    related: [コーディング標準]
  - term: モジュール強度
    reading: もじゅーるきょうど
    simple: "1つのモジュール内の処理が、どれだけ強く関連しているかを示す尺度です。"
    definition: モジュール内の各処理の関連の強さを表す尺度で、強いほど良い設計。機能的強度が最も強く、偶発的強度が最も弱い。
    related: [モジュール分割, モジュール結合度, モジュール独立性]
  - term: モジュール独立性
    reading: もじゅーるどくりつせい
    simple: モジュールどうしの依存が小さく、単独で変更・再利用しやすい度合いです。
    definition: モジュール間の結合度が弱く、モジュール強度が強いほど高まる性質。独立性が高いと変更の影響範囲が小さく、保守性・再利用性が向上する。
    related: [モジュール分割, モジュール強度, モジュール結合度]
  - term: STS分割
    reading: えすてぃーえすぶんかつ
    fullName: Source Transform Sink
    japanese: 入力・変換・出力分割
    words:
      - { en: Source, ja: 入力源 }
      - { en: Transform, ja: 変換 }
      - { en: Sink, ja: 出力先 }
    simple: データの流れに沿って、入力・変換・出力の3つに分ける分割法です。
    definition: データの流れに着目し、入力（Source）、変換（Transform）、出力（Sink）の機能に分割する構造化設計のモジュール分割技法。
    related: [モジュール分割, TR分割]
  - term: TR分割
    reading: てぃーあーるぶんかつ
    fullName: Transaction
    japanese: トランザクション分割
    words:
      - { en: Transaction, ja: 処理要求の種類（トランザクション） }
    simple: 処理の種類（トランザクション）ごとに、モジュールを分ける分割法です。
    definition: 入力されるトランザクションの種類ごとに、その処理を行うモジュールを分割する技法。トランザクションの種類を判定する部分と各処理を行う部分から成る。
    related: [モジュール分割, STS分割]
  - term: データ結合
    reading: でーたけつごう
    simple: 必要なデータだけを引数で受け渡す、結合度の弱い結合です。
    definition: モジュール間で単純なデータ項目のみを引数で受け渡す結合。結合度は弱い（良い）。
    related: [モジュール結合度, スタンプ結合, 制御結合]
  - term: スタンプ結合
    reading: すたんぷけつごう
    simple: 構造体など、データ構造全体を受け渡す結合です。
    definition: モジュール間でレコードや構造体などのデータ構造全体を引数で受け渡す結合。受け取り側が使わない項目にも依存するため、データ結合より結合度が強い。
    related: [モジュール結合度, データ結合, 制御結合]
  - term: 制御結合
    reading: せいぎょけつごう
    simple: 相手の処理の流れを決める制御情報（フラグなど）を渡す結合です。
    definition: 一方のモジュールが他方に処理の流れを制御する情報（機能コードやフラグなど）を渡す結合。
    related: [モジュール結合度, スタンプ結合, 外部結合（モジュール結合度）]
  - term: 外部結合（モジュール結合度）
    reading: がいぶけつごうもじゅーるけつごうど
    simple: 外部で宣言された共通のデータ項目を、複数のモジュールが参照する結合です。
    definition: 複数のモジュールが、外部で宣言された単一のデータ項目（グローバルな変数やデータ形式）を共有・参照する結合。
    related: [モジュール結合度, 共通結合, 制御結合]
  - term: 共通結合
    reading: きょうつうけつごう
    simple: 共通のデータ領域（グローバル変数など）を複数のモジュールが共有する結合です。
    definition: 複数のモジュールが共通のデータ領域（大域変数など）を参照・更新する結合。一つの変更が他に波及しやすい。
    related: [モジュール結合度, 外部結合（モジュール結合度）, 内容結合]
  - term: 内容結合
    reading: ないようけつごう
    simple: 他のモジュールの内部に直接入り込んで、中身を直接参照・変更する最も強い結合です。
    definition: あるモジュールが他のモジュールの内部データや処理の途中へ直接アクセス・分岐する結合。結合度が最も強く、避けるべきである。
    related: [モジュール結合度, 共通結合]
  - term: 整数型
    reading: せいすうがた
    simple: 整数を扱うデータ型です。
    definition: 整数値を保持するデータ型。扱える範囲は言語や処理系で決まる。
    related: [データ型, 実数型]
  - term: 実数型
    reading: じっすうがた
    simple: 小数を含む数を扱うデータ型です。
    definition: 小数部をもつ数（浮動小数点数など）を保持するデータ型。誤差が生じることがある。
    related: [データ型, 整数型, 誤差]
  - term: 論理型
    reading: ろんりがた
    aliases: [ブール型]
    simple: 真(true)か偽(false)のどちらかを扱うデータ型です。
    definition: 真と偽の2値のいずれかをとるデータ型。条件式の結果などに用いる。
    related: [データ型]
  - term: 文字型
    reading: もじがた
    simple: "1文字を扱うデータ型です。"
    definition: 英字、数字、記号、かななどの文字1個を保持するデータ型。
    related: [データ型, 文字列型]
  - term: 文字列型
    reading: もじれつがた
    simple: 文字の並び(文字列)を扱うデータ型です。
    definition: 文字を並べた列（文字列）を保持するデータ型。
    related: [データ型, 文字型]
  - term: 抽象データ型
    reading: ちゅうしょうでーたがた
    simple: データの中身の実装を隠し、できる操作だけで定義したデータ型です。
    definition: データの内部表現を隠蔽し、そのデータに対して行える操作（インタフェース）によってのみ定義されたデータ型。スタックやキューなどが例。
    related: [データ型, スタック, キュー]
  - term: 選択処理
    reading: せんたくしょり
    simple: 条件によって実行する処理を切り替える構造です。
    definition: 条件の真偽に応じて実行する処理を選ぶ制御構造（if 文、case 文など）。構造化プログラミングの基本構造の一つ。
    related: [制御構造, 繰返し処理, 順次処理]
  - term: 繰返し処理
    reading: くりかえししょり
    aliases: [反復処理]
    simple: 条件が成り立つ間などに、同じ処理を繰り返す構造です。
    definition: 条件を満たす間、または指定回数、同じ処理を繰り返す制御構造（for 文、while 文など）。前判定と後判定がある。
    related: [制御構造, 選択処理, 順次処理, 前判定, 後判定]
  - term: 順次処理
    reading: じゅんじしょり
    simple: 書かれた順に上から下へ処理を実行する構造です。
    definition: 処理を記述された順に1つずつ実行する制御構造。構造化プログラミングの基本構造の一つ。
    related: [制御構造, 選択処理, 繰返し処理]
  - term: 前判定
    reading: まえはんてい
    simple: 繰返しの前に条件を調べる方式で、1回も実行されないことがあります。
    definition: 繰返し処理で、ループの本体を実行する前に継続条件を判定する方式。条件が最初から偽なら本体は一度も実行されない。
    related: [繰返し処理, 後判定]
  - term: 後判定
    reading: あとはんてい
    simple: 繰返しの後に条件を調べる方式で、必ず1回は実行されます。
    definition: 繰返し処理で、ループの本体を実行した後に継続条件を判定する方式。本体は少なくとも1回実行される。
    related: [繰返し処理, 前判定]
  - term: 値渡し
    reading: あたいわたし
    aliases: [値呼出し]
    simple: 値のコピーを渡す方式で、呼ばれた側で変更しても呼び出し元に影響しません。
    definition: 実引数の値を仮引数にコピーして渡す引数渡しの方式。仮引数を変更しても呼出し元の変数には影響しない。
    related: [引数, 参照渡し]
  - term: 参照渡し
    reading: さんしょうわたし
    aliases: [参照呼出し]
    simple: 変数そのものの場所を渡す方式で、呼ばれた側での変更が呼び出し元に反映されます。
    definition: 実引数のアドレス（参照）を仮引数に渡す方式。仮引数を通じた変更が呼出し元の変数に反映される。
    related: [引数, 値渡し]
  - term: 戻り値
    reading: もどりち
    aliases: [返却値, 返り値]
    simple: 関数が処理を終えたときに、呼び出し元へ返す値です。
    definition: 関数が呼出し元に返す値。手続（戻り値をもたない）と関数（戻り値をもつ）を区別する。
    related: [引数]
  - term: 仮引数
    reading: かりひきすう
    simple: 関数の定義側で宣言する、受け取る値の名前つきの入れ物です。
    definition: 関数や手続の定義側に書かれる引数。呼出し時に実引数の値または参照が渡される。形式引数ともいう。
    related: [引数, 実引数]
  - term: 実引数
    reading: じつひきすう
    simple: 関数を呼び出すときに、実際に渡す値や変数です。
    definition: 関数や手続を呼び出す側が実際に渡す引数。仮引数に対応づけられる。
    related: [引数, 仮引数]
  - term: 大域変数
    reading: たいいきへんすう
    aliases: [グローバル変数]
    simple: プログラム全体のどこからでも使える変数です。
    definition: 関数の外で宣言され、プログラム全体から参照・更新できる変数。有効範囲（スコープ）が広く、意図しない変更の原因になりやすい。
    related: [局所変数]
  - term: クラス
    reading: くらす
    simple: オブジェクトの設計図にあたるもので、データと処理をまとめて定義したものです。
    definition: オブジェクトの属性（データ）と操作（メソッド）を定義した雛型。クラスから生成した実体がインスタンス。
    related: [オブジェクト指向, インスタンス, メソッド]
  - term: インスタンス
    reading: いんすたんす
    simple: クラスをもとに実際に作られた、実体となるオブジェクトです。
    definition: クラスから生成された実体。それぞれが独自の属性値（状態）をもつ。
    related: [オブジェクト指向, クラス]
  - term: 継承
    reading: けいしょう
    aliases: [インヘリタンス]
    simple: 既存のクラスの属性や操作を引き継いで、新しいクラスを作ることです。
    definition: 上位クラス（スーパークラス）の属性やメソッドを下位クラス（サブクラス）が引き継ぐ仕組み。差分だけを定義でき、再利用性が高まる。
    related: [オブジェクト指向, ポリモーフィズム, 汎化]
  - term: カプセル化
    reading: かぷせるか
    simple: データと処理をまとめ、内部の詳細を外から隠すことです。
    definition: オブジェクトの属性と操作を一つにまとめ、内部の実装を隠蔽して公開した操作（インタフェース）経由でのみアクセスさせる仕組み。情報隠蔽ともいう。
    related: [オブジェクト指向, 継承]
  - term: ポリモーフィズム
    reading: ぽりもーふぃずむ
    aliases: [多態性]
    simple: 同じ呼び出しでも、相手のオブジェクトの種類によって違う動作をすることです。
    definition: 同じメッセージ（メソッド呼出し）を送っても、受け取るオブジェクトのクラスによって異なる処理が実行される性質。多相性、多態性ともいう。
    related: [オブジェクト指向, 継承]
  - term: メソッド
    reading: めそっど
    simple: クラスの中に定義された、オブジェクトに対する操作(処理)です。
    definition: クラスに定義された手続・関数で、オブジェクトの振る舞いを表す。メッセージを受け取って実行される。
    related: [オブジェクト指向, クラス, メンバ変数]
  - term: メンバ変数
    reading: めんばへんすう
    aliases: [インスタンス変数]
    simple: クラスの中に定義された、オブジェクトが持つデータ(属性)の入れ物です。
    definition: クラスに定義され、オブジェクトの状態（属性）を保持する変数。フィールドともいう。
    related: [オブジェクト指向, クラス, メソッド]
  - term: デストラクタ
    reading: ですとらくた
    simple: オブジェクトが消えるときに、後始末のために自動的に呼ばれる特別なメソッドです。
    definition: オブジェクトが破棄されるときに自動的に実行され、確保した資源の解放などの後始末を行う特別なメソッド。コンストラクタと対になる。
    related: [コンストラクタ]
  - term: Python
    reading: ぱいそん
    simple: 読みやすい文法で人気が高く、AIやデータ分析でよく使われるスクリプト言語です。
    definition: インデントでブロックを表す読みやすい文法をもつ汎用のスクリプト言語。機械学習やデータ分析、Web開発などで広く使われる。
    related: [スクリプト言語]
  - term: Ruby
    reading: るびー
    simple: 日本で開発された、オブジェクト指向のスクリプト言語です。
    definition: まつもとゆきひろ氏が開発したオブジェクト指向のスクリプト言語。Web フレームワーク Ruby on Rails で知られる。
    related: [スクリプト言語]
  - term: Perl
    reading: ぱーる
    simple: 文字列処理が得意なスクリプト言語です。
    definition: 正規表現による文字列処理に優れたスクリプト言語。テキスト処理やCGIで広く使われた。
    related: [スクリプト言語]
  - term: PHP
    reading: ぴーえいちぴー
    fullName: PHP Hypertext Preprocessor
    japanese: PHP ハイパーテキスト・プリプロセッサ
    words:
      - { en: PHP, ja: 再帰的な略称 }
      - { en: Hypertext, ja: ハイパーテキスト }
      - { en: Preprocessor, ja: 前処理系 }
    simple: Webページを動的に作るのに使われるサーバ側のスクリプト言語です。
    definition: HTML に埋め込んでサーバ側で実行する、Webアプリケーション開発向けのスクリプト言語。
    related: [スクリプト言語]
  - term: JavaScript
    reading: じゃばすくりぷと
    aliases: [ECMAScript]
    simple: Webブラウザ上で動くスクリプト言語で、Webページに動きを与えます。
    definition: Webブラウザに実装されているスクリプト言語で、Node.js によりサーバ側でも使われる。標準仕様は ECMAScript として規格化されている。
    related: [スクリプト言語, JSON]
  - term: C
    reading: しー
    simple: OSなどの開発にも使われる、高速で低水準の操作ができる手続型言語です。
    definition: ポインタによるメモリ操作が可能で、OSや組込みシステムの開発に広く使われる手続型言語。
    related: [手続型言語]
  - term: COBOL
    reading: こぼる
    fullName: COmmon Business Oriented Language
    japanese: 共通事務処理用言語
    words:
      - { en: Common, ja: 共通の }
      - { en: Business Oriented, ja: 事務処理向けの }
      - { en: Language, ja: 言語 }
    simple: 事務処理や業務システム向けに作られた、歴史の古い手続型言語です。
    definition: 事務処理向けに設計された手続型言語。金融機関などの基幹系システムで今も使われている。
    related: [手続型言語]
  - term: Fortran
    reading: ふぉーとらん
    simple: 科学技術計算向けに作られた、歴史の古い手続型言語です。
    definition: 数値計算・科学技術計算向けに設計された初期の手続型言語。
    related: [手続型言語]
  - term: Pascal
    reading: ぱすかる
    simple: 構造化プログラミングの教育向けに作られた手続型言語です。
    definition: ニクラウス・ヴィルトが構造化プログラミングの教育用に設計した手続型言語。
    related: [手続型言語]
  - term: BASIC
    reading: べいしっく
    fullName: Beginner's All-purpose Symbolic Instruction Code
    japanese: 初心者向け汎用記号命令コード
    words:
      - { en: Beginner's, ja: 初心者の }
      - { en: All-purpose, ja: 汎用の }
      - { en: Symbolic Instruction Code, ja: 記号命令コード }
    simple: 初心者向けに作られた、やさしいプログラム言語です。
    definition: 初心者の学習用に設計された手続型言語。簡易なインタプリタで対話的に実行できる。
    related: [手続型言語]
  - term: R
    reading: あーる
    simple: 統計解析やデータ可視化に使われるプログラム言語です。
    definition: 統計解析とグラフ描画のためのプログラム言語および実行環境。データ分析の分野で広く使われる。
    related: [手続型言語]
  - term: JVM
    reading: じぇいぶいえむ
    fullName: Java Virtual Machine
    japanese: Java仮想マシン
    aliases: [Java仮想マシン]
    words:
      - { en: Java, ja: Java }
      - { en: Virtual, ja: 仮想の }
      - { en: Machine, ja: 機械 }
    simple: Javaのバイトコードを実行するための仮想的なコンピュータです。
    definition: Java のバイトコードを解釈・実行するソフトウェア上の仮想マシン。OS やハードウェアの違いを吸収し、同じバイトコードをどの環境でも実行できる。
    related: [Java, バイトコード]
  - term: バイトコード
    reading: ばいとこーど
    simple: Javaなどのソースコードをコンパイルして作られる、仮想マシン用の中間的なコードです。
    definition: Java のソースコードをコンパイルして得られる、JVM が実行する中間コード。特定のCPUに依存しない。
    related: [Java, JVM]
  - term: CLI（共通言語基盤）
    reading: しーえるあいきょうつうげんごきばん
    simple: 共通言語基盤の略称で、CLIと表記されます。
    definition: Common Language Infrastructure の略。.NET で複数のプログラム言語から作られたプログラムを共通の中間言語で実行できるようにする仕様。
    related: [共通言語基盤]
  - term: XHTML
    reading: えっくすえいちてぃーえむえる
    fullName: Extensible HyperText Markup Language
    japanese: 拡張可能なハイパーテキストマークアップ言語
    words:
      - { en: Extensible, ja: 拡張可能な }
      - { en: HyperText, ja: ハイパーテキスト }
      - { en: Markup Language, ja: マークアップ言語 }
    simple: HTMLをXMLの厳密な規則に従って書き直した言語です。
    definition: HTML を XML の文法に従って再定義したマークアップ言語。タグの閉じ忘れなどを許さず、整形式であることが求められる。
    related: [HTML, XML]
  - term: HTML5
    reading: えいちてぃーえむえるふぁいぶ
    simple: HTMLの第5版で、動画や図形の埋込みなどの機能が標準になりました。
    definition: HTML の第5版。video、audio、canvas、セマンティックな要素（section、article など）や Web アプリ向け API を標準化した。
    related: [HTML]
  - term: XSL
    reading: えっくすえすえる
    fullName: Extensible Stylesheet Language
    japanese: 拡張可能なスタイルシート言語
    words:
      - { en: Extensible, ja: 拡張可能な }
      - { en: Stylesheet, ja: スタイルシート }
      - { en: Language, ja: 言語 }
    simple: XMLの文書を別の形式に変換したり、見た目を指定したりする言語です。
    definition: XML 文書の変換（XSLT）や表示形式の指定（XSL-FO）を行うスタイルシート言語。
    related: [XML]
  - term: SAX
    reading: さっくす
    fullName: Simple API for XML
    japanese: XML用の単純API
    words:
      - { en: Simple, ja: 単純な }
      - { en: API, ja: プログラム用の窓口 }
      - { en: XML, ja: XML }
    simple: XMLを先頭から順に読みながら、イベントで処理するAPIです。
    definition: XML 文書を先頭から順次解析し、要素の開始・終了などをイベントとして通知するAPI。メモリ消費が少ない一方、後戻りできない。DOM と対比される。
    related: [XML]
  - term: SOAP
    reading: そーぷ
    fullName: Simple Object Access Protocol
    japanese: 単純オブジェクトアクセスプロトコル
    words:
      - { en: Simple, ja: 単純な }
      - { en: Object Access, ja: オブジェクトへのアクセス }
      - { en: Protocol, ja: 通信規約 }
    simple: XML形式のメッセージでWebサービスを呼び出すためのプロトコルです。
    definition: XML 形式のメッセージを HTTP などで交換して、ネットワーク上のサービスを呼び出すためのプロトコル。
    related: [XML, API]
  - term: XMLスキーマ
    reading: えっくすえむえるすきーま
    simple: XML文書の構造やデータ型の規則を定義する言語です。
    definition: XML 文書が満たすべき要素・属性の構造やデータ型を XML 形式で定義する仕様。DTD よりデータ型の指定が豊富。
    related: [XML, DTD]
  - term: DTD
    reading: でぃーてぃーでぃー
    fullName: Document Type Definition
    japanese: 文書型定義
    words:
      - { en: Document, ja: 文書 }
      - { en: Type, ja: 型 }
      - { en: Definition, ja: 定義 }
    simple: XML文書の要素や属性の構造を定義する、古くからある記述です。
    definition: SGML/XML 文書で使える要素・属性とその構造を定める文書型定義。XML スキーマに比べデータ型の表現力が乏しい。
    related: [XML, XMLスキーマ]
  - term: YAML
    reading: やまる
    fullName: YAML Ain't Markup Language
    japanese: YAMLはマークアップ言語ではない
    words:
      - { en: YAML, ja: 再帰的な略称 }
      - { en: Ain't, ja: ではない }
      - { en: Markup Language, ja: マークアップ言語 }
    simple: インデントで構造を表す、人が読み書きしやすいデータ記述形式です。
    definition: インデントでデータ構造を表現する、人が読み書きしやすいデータ記述形式。設定ファイルでよく使われ、JSON のほぼ上位互換となっている。
    related: [JSON, XML]
  - term: クラス図
    reading: くらすず
    simple: クラスとその関係(継承や関連など)を表す図です。
    definition: UML の構造図の一つで、クラスの属性・操作と、クラス間の関連・継承・集約などの関係を表す図。
    related: [UML, オブジェクト図]
  - term: シーケンス図
    reading: しーけんすず
    simple: オブジェクト間のメッセージのやり取りを、時間の流れに沿って表す図です。
    definition: UML の振る舞い図の一つで、オブジェクト（ライフライン）間で交わされるメッセージを時系列で表す図。
    related: [UML, コミュニケーション図]
  - term: ユースケース図
    reading: ゆーすけーすず
    simple: システムの利用者(アクター)と、システムが提供する機能の関係を表す図です。
    definition: UML の振る舞い図の一つで、アクターとシステムが提供するユースケース（機能）との関係を表す図。要件定義で用いる。
    related: [UML, ユースケース]
  - term: アクティビティ図
    reading: あくてぃびてぃず
    simple: 業務や処理の流れ(分岐や並行処理も含む)を表す図です。
    definition: UML の振る舞い図の一つで、処理や業務の手順の流れ、分岐、並行処理を表す図。フローチャートに似た表現。
    related: [UML, 流れ図]
  - term: ステートマシン図
    reading: すてーとましんず
    simple: オブジェクトの状態が、イベントによってどう変わるかを表す図です。
    definition: UML の振る舞い図の一つで、オブジェクトがとる状態と、イベントによる状態遷移を表す図。状態遷移図に相当する。
    related: [UML, 状態遷移]
  - term: コミュニケーション図
    reading: こみゅにけーしょんず
    simple: オブジェクト間のメッセージのやり取りを、オブジェクトの関係を中心に表す図です。
    definition: UML の振る舞い図の一つで、オブジェクト間の関連（リンク）と、そこでやり取りされるメッセージを表す図。時間順序よりオブジェクトの構造を重視する。
    related: [UML, シーケンス図]
  - term: オブジェクト図
    reading: おぶじぇくとず
    simple: ある時点のオブジェクト(インスタンス)とそのつながりを表す図です。
    definition: UML の構造図の一つで、ある時点におけるインスタンス（オブジェクト）とその間のリンクを表す図。
    related: [UML, クラス図]
  - term: コンポーネント図
    reading: こんぽーねんとず
    simple: システムを構成する部品(コンポーネント)とその依存関係を表す図です。
    definition: UML の構造図の一つで、システムを構成するコンポーネントと、それらの提供・要求するインタフェースや依存関係を表す図。
    related: [UML, 配置図]
  - term: 配置図
    reading: はいちず
    simple: ソフトウェアがどのハードウェア(サーバなど)上で動くかを表す図です。
    definition: UML の構造図の一つで、ノード（サーバ等のハードウェア）と、その上に配置される成果物（ソフトウェア）の関係を表す図。
    related: [UML, コンポーネント図]
