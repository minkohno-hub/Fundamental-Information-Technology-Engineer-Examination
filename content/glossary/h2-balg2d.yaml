category: アルゴリズム
terms:
  - term: 平均
    reading: へいきん
    simple: 合計を、個数で割った値です。
    definition: 数値の集まりについて、合計を個数で割った値。プログラムでは、合計を求める走査の後に割算を行って求める。「平均より大きい要素を数える」のような処理では、平均を求める走査と、数える走査の 2 回の走査が必要になる。
    related: [配列]
  - term: 重複
    reading: ちょうふく
    simple: 同じものが、複数回現れることです。
    definition: 同じ値や要素が、複数回現れていること。データの数え上げでは、重複を含む総数と、重複を除いた種類の数は別の量になるため、どちらを数えるのかを区別する必要がある。
    related: [集合]
