category: データベース
terms:
  - term: 推移的関数従属
    reading: すいいたてきかんすうじゅうぞく
    simple: 主なキーの列から、別の列を経由して決まってしまう関係です。
    definition: 主キーからキーでない列を経由して、別の列が決まる関数従属。第3正規形では除去の対象となり、経由する列をキーとする別の表に切り出すことで解消する。
    related: [第3正規形, 正規化]
  - term: E-Rモデル
    reading: イーアールモデル
    simple: データの実体と、その間の関連を図で表す設計の方法です。
    definition: 実体（エンティティ）と関連（リレーションシップ）でデータの構造を表す、データベースの概念設計のモデル。関係データベースへの変換では、多対多の関連は独立した表に変換される。
    related: [多対多]
  - term: 多対多
    reading: たたいおお
    simple: 両側のどちらから見ても、相手が複数ある関係です。
    definition: 関連の多重度の一つで、両方向に複数の対応がある関係（例：学生と科目）。関係データベースでは、関連自体を表に変換し、両方の主キーを組み合わせた複合主キーを持たせて表す。
    related: [E-Rモデル]
  - term: 関係演算
    reading: かんけいえんざん
    simple: 表から、条件に合う行や列を取り出す操作の集まりです。
    definition: 関係モデルにおける表の操作の体系。選択（行の抽出）、射影（列の抽出）、結合、和・積・差などの集合演算からなる。射影では、結果に重複する行は取り除かれる。
    related: [射影]
  - term: データ独立性
    reading: データどくりつせい
    simple: データの構造を変えても、使うプログラムが影響を受けにくい性質です。
    definition: 3層スキーマにおける独立性で、概念スキーマの変更が外部スキーマに影響しない論理的データ独立性と、内部スキーマ（格納方法）の変更が概念スキーマに影響しない物理的データ独立性の2種類がある。
    related: [3層スキーマ]
  - term: 多値属性
    reading: たちぞくせい
    simple: 1 つの対象が、同じ種類の値を複数持つことができる属性です。
    definition: 1つの実体に対して複数の値を取る属性（例：社員の保有資格）。関係データベースでは、実体のキーと値の組を行とする別の表に切り出して表す。
    related: [E-Rモデル, 第1正規形]
  - term: 位置透明性
    reading: いちとうめいせい
    simple: データがどの場所にあっても、場所を意識せずに使える性質です。
    definition: 分散データベースの透明性の一つで、データの格納場所（拠点やサーバ）を利用者が意識しなくてよい性質。分割のされ方を意識しない分割透明性、複製の存在を意識しない複製透明性と区別される。
    related: [分散データベース]
