category: セキュリティ
terms:
  - term: インシデント対応
    reading: いんしでんとたいおう
    simple: セキュリティ事故が起きたときに、被害を抑えて復旧する活動です。
    definition: マルウェア感染や情報漏洩などのセキュリティインシデントが発生した際に、検知、封じ込め（隔離）、証拠の保全、原因の調査、復旧、再発防止までを行う一連の対応。初動の質が被害の大きさと調査の可否を左右する。
    related: [フォレンジック]
  - term: フォレンジック
    reading: ふぉれんじっく
    simple: 事故の痕跡を証拠として集め、原因を科学的に調べる技術です。
    definition: インシデントの調査のため、メモリやディスク、ログなどの電子的証拠を、改変しないよう手順を守って収集・分析する技術（デジタルフォレンジック）。証拠は揮発性の高いものから先に保全するのが原則である。
    related: [インシデント対応]
  - term: ハイブリッド暗号方式
    reading: はいぶりっどあんごうほうしき
    simple: 共通鍵暗号の速さと公開鍵暗号の安全な鍵渡しを組み合わせた方式です。
    definition: データ自体は処理の高速な共通鍵暗号で暗号化し、その共通鍵だけを受信者の公開鍵で暗号化して送る方式。受信者は秘密鍵で共通鍵を取り出してデータを復号する。共通鍵暗号の鍵配送問題を解決でき、TLS などで広く使われる。
    related: [公開鍵暗号方式]
  - term: ゼロトラスト
    reading: ぜろとらすと
    simple: 社内だから安全とは考えず、全てのアクセスを都度確かめる考え方です。
    definition: ネットワークの内側と外側で信頼を区別せず、全てのアクセスについて利用者と端末を認証・認可し、必要最小限の権限だけを許可するセキュリティの考え方。「決して信頼せず、常に検証する」が原則で、侵入を前提とした対策の基盤になる。
    related: [ネットワークセグメンテーション]
  - term: ネットワークセグメンテーション
    reading: ねっとわーくせぐめんてーしょん
    simple: ネットワークを区画に分け、区間ごとの通信を制限することです。
    definition: ネットワークを部署や用途などの区画（セグメント）に分割し、区間ごとに必要な通信だけを許可する設計。1つの区画が侵害されても、攻撃者の移動（横展開）を妨げて被害を局所化できる。細かく分ける考え方をマイクロセグメンテーションという。
    related: [ゼロトラスト]
  - term: 相関分析
    reading: そうかんぶんせき
    simple: 複数の記録をつなぎ合わせて、出来事の全体像を読み解く分析です。
    definition: 複数の装置やシステムのログを、時刻や IP アドレス、アカウントなどの手がかりで関連付け、単独では分からない攻撃の流れや異常を検出する分析手法。SIEM などのログ監視基盤の中核となる。
    related: [ログ管理]
  - term: DNSトンネリング
    reading: でぃーえぬえすとんねりんぐ
    simple: DNS の問合せにデータを隠し入れて、外部へ運び出す手口です。
    definition: DNS の問合せや応答の文字列にデータを埋め込み、外部のサーバとデータをやり取りする手法。DNS は多くの環境で通信が許可されるため、ファイアウォールの監視をすり抜ける隠れ経路として悪用される。異常に長い名前や TXT レコードの多用が痕跡になる。
    related: [DNS]
