category: マネジメント・ストラテジ補遺
terms:
  - term: 状態遷移図
    reading: じょうたいせんいず
    simple: システムがどんな状態をもち、どんなできごとで別の状態に移るかを図にしたものです。
    definition: システムやオブジェクトが取り得る状態と、イベント（事象）の発生によって起こる状態間の遷移、遷移時の動作を表した図。リアルタイムシステムや画面遷移など、状態によって振る舞いが変わる対象の分析・設計に用いる。
    related: [有限オートマトン, DFD, 構造化設計]
  - term: リスク登録簿
    reading: りすくとうろくぼ
    simple: プロジェクトで見つかったリスクを一覧にして記録・管理する文書です。
    definition: 特定したリスクについて、内容、原因、発生確率、影響、優先順位、対応策、責任者などを記録する文書。JIS Q 21500 では「リスクの特定」のアウトプットとして作成され、「リスクの評価」で優先順位付けされたリスクを得るためのインプットとなる。
    related: [プロジェクトのリスク対応戦略, リスク分析]
  - term: 品質保証（プロジェクト）
    reading: ひんしつほしょう
    aliases: [品質保証の遂行, 品質管理の遂行]
    simple: 決めた品質の計画どおりに作業が進められているかを確かめ、品質への信頼を与える活動です。
    definition: JIS Q 21500 の品質の対象群のプロセス。「品質の計画」で品質要求事項から品質計画を作成し、「品質保証の遂行」で品質計画に従ったプロセスが実施されているかを確認し、「品質管理の遂行」で成果物を検査して検査報告書を作成し、是正処置や予防処置を決める。
    related: [リスク登録簿]
  - term: ファシリテーション
    reading: ふぁしりてーしょん
    aliases: [ファシリテータ]
    simple: 会議や話合いで、参加者の意見を引き出し、合意に向けて進行を助けることです。
    definition: 会議やワークショップにおいて、中立的な立場の進行役（ファシリテータ）が、参加者の発言を促し、論点を整理し、合意形成や相互理解を支援すること。進行役は自らの意見で結論を誘導しない。要件定義で利害関係者の要件を調整・確認する場面などで用いられる。
    related: [ステークホルダ]
  - term: ITリテラシー
    reading: あいてぃーりてらしー
    aliases: [デジタルリテラシー]
    simple: コンピュータやネットワークなどの IT を理解し、目的に合わせて使いこなす能力です。
    definition: 情報技術を理解し、業務や生活の中で適切に活用する能力。デジタルリテラシーは、デジタル技術やデータを活用して課題を解決する能力全般を指し、IT リテラシー、メディアリテラシー、情報セキュリティへの意識などを含む。
    related: [メディアリテラシー]
  - term: メディアリテラシー
    reading: めでぃありてらしー
    simple: テレビや新聞、インターネットなどの情報をうのみにせず、正しく読み解いて活用する能力です。
    definition: メディアが伝える情報を主体的・批判的に読み解き、真偽や意図を判断して活用する能力。また、メディアを通じて適切に情報を発信する能力も含む。
    related: [ITリテラシー]
  - term: CX
    reading: シーエックス
    fullName: Customer Experience
    japanese: 顧客体験
    aliases: [CXデザイン, 顧客体験]
    words:
      - { en: Customer, ja: 顧客 }
      - { en: Experience, ja: 体験 }
    simple: 商品を知ってから買い、使い終わるまでに顧客が感じる体験全体のことです。
    definition: 顧客が企業や商品・サービスを認知し、比較・購入・利用し、サポートを受けるまでのすべての接点で得る体験の総体。CX デザインは、顧客接点全体を通じて心理的・感情的な価値を高めるよう体験を設計し、顧客ロイヤルティの向上やリテンション率の改善につなげることを目指す。
    related: [UXデザイン, カスタマージャーニーマップ, 顧客ロイヤルティ]
  - term: 顧客ロイヤルティ
    reading: こきゃくろいやるてぃ
    aliases: [ブランドロイヤルティ]
    simple: 顧客が特定の企業や商品を信頼し、愛着をもって使い続けようとする気持ちです。
    definition: 顧客が特定の企業・ブランド・商品に対して抱く信頼や愛着。ロイヤルティが高い顧客は継続購入や他者への推奨を行う傾向があり、NPS などの指標で測定される。
    related: [CX, リテンション率]
  - term: リテンション率
    reading: りてんしょんりつ
    aliases: [顧客維持率]
    simple: 一定期間の後も、サービスを使い続けている顧客の割合です。
    definition: ある時点の顧客のうち、一定期間後も継続して利用・購入している顧客の割合。新規顧客の獲得より既存顧客の維持の方がコストが低いとされ、サブスクリプション型ビジネスなどで重視される。継続しなかった割合は解約率（チャーンレート）という。
    related: [顧客ロイヤルティ, CVR]
  - term: パブリシティ
    reading: ぱぶりしてぃ
    simple: 企業の情報を報道機関に提供し、ニュースや記事として取り上げてもらう広報活動です。
    definition: 企業が新製品や活動などの情報を報道機関に提供し、記事やニュースとして報道してもらう活動。媒体の費用を支払わないため広告より費用が低く、第三者の報道として信頼されやすいが、報道されるかどうかや内容は企業が管理できない。
    related: [販売促進]
  - term: 販売促進
    reading: はんばいそくしん
    aliases: [セールスプロモーション, SP（販売促進）]
    simple: 値引きやクーポン、試供品などで、今すぐ買いたくなるように働きかける活動です。
    definition: プロモーション（マーケティングミックスの Promotion）の手段の一つで、クーポン、値引き、景品、サンプル配布、店頭展示などにより、消費者や流通業者の短期的な購買意欲を刺激する活動。プロモーションの手段には、ほかに広告、パブリシティ（広報）、人的販売がある。
    related: [パブリシティ, マーケティングミックス]
  - term: サービス受入れ基準
    reading: さーびすうけいれきじゅん
    simple: 新しいサービスや変更したサービスを運用に受け入れてよいかを判断するための基準です。
    definition: 新規サービス又はサービス変更について、提供開始（運用への受入れ）の可否を判断するための基準。JIS Q 20000-1 では、新規サービス又はサービス変更の計画で決定し、設計・移行の過程でサービスがこの基準を満たすことを確認する。
    related: [サービスの移行, 受入れテスト]
  - term: 予防保全
    reading: よぼうほぜん
    aliases: [事後保全, 予知保全]
    simple: 故障する前に、決まった時期や状態に応じて点検・部品交換などを行う保守の方法です。
    definition: 施設・設備の故障を未然に防ぐため、定期的又は劣化状態に応じて点検、清掃、部品交換などを行う保全。故障が起きてから修理する事後保全に対する考え方で、状態を監視して故障の兆候をとらえて行う予知保全（状態基準保全）も含まれる。
    related: [ファシリティマネジメント]
  - term: ビジネスモデル
    reading: びじねすもでる
    aliases: [業務モデル, 情報システムモデル]
    simple: 誰にどんな価値を提供し、どうやって利益を得るかという事業の仕組みです。
    definition: 企業が顧客に価値を提供し、収益を上げるための事業の仕組み。情報システム戦略では、ビジネスモデルを基に業務の流れや情報の関係を表す業務モデルを作成し、それを支える情報システムの構成や機能を表す情報システムモデルを作成する。
    related: [ビジネスモデルキャンバス, EA]
  - term: 調達リスク
    reading: ちょうたつりすく
    aliases: [調達リスク分析]
    simple: 物やサービスを外部から買うときに起こり得る、納期遅れや品質不良、供給停止などのリスクです。
    definition: 製品・サービスを外部から調達する際に生じるリスク。供給者の経営破綻、納期遅延、品質不良、価格変動、特定の供給者への依存、災害による供給停止などがある。調達リスク分析では、これらを特定・評価し、複数の供給者からの調達や契約条項の整備などの対策を検討する。
    related: [RFP, 提案書]
