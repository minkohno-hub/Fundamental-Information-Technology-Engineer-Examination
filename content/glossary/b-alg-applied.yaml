category: アルゴリズムとプログラミング
terms:
  - term: 上方移動
    reading: じょうほういどう
    simple: ヒープに値を出し入れした後、親子の大小関係が崩れた値を上（または下）へ交換していき、ヒープの形に戻す操作です。
    definition: 配列で表したヒープの末尾に値を追加したとき、その値を親と比較して条件を満たすまで交換し根の方向へ移す操作を上方移動という。根の値を取り出した後などに、根の値を子の大きい方（最小ヒープでは小さい方）と交換しながら葉の方向へ移す操作を下方移動という。いずれも木の高さに比例する O(log n) の手間で済む。
    related: [ヒープ, ヒープソート, 優先度付きキュー]
  - term: 優先度付きキュー
    reading: ゆうせんどつききゅー
    aliases: [優先度キュー]
    simple: 入れた順ではなく、優先度の高いものから取り出すキューです。
    definition: 各要素に優先度をもたせ、取出し操作では優先度が最も高い（又は低い）要素を返す抽象データ型。配列の線形探索でも実装できるが、ヒープを使うと追加・取出しを O(log n) で行える。ダイクストラ法やタスクのスケジューリングに使う。
    related: [キュー, ヒープ, ダイクストラ法]
  - term: 隣接行列
    reading: りんせつぎょうれつ
    simple: グラフの頂点どうしが辺でつながっているかを、表（行列）の 0 と 1 で表したものです。
    definition: n 個の頂点をもつグラフを n 行 n 列の行列で表し、頂点 i から頂点 j への辺があれば (i, j) 成分を 1（重み付きグラフでは重み）、なければ 0 とする表現。無向グラフでは対称行列になる。隣接行列 A の k 乗の (i, j) 成分は、i から j へ長さ k の経路の数を表す。
    related: [グラフ理論, 行列, 幅優先探索]
  - term: 行列の積
    reading: ぎょうれつのせき
    aliases: [行列積]
    simple: 1 つ目の行列の行と 2 つ目の行列の列の数を順に掛けて足し、新しい行列を作る計算です。
    definition: l 行 m 列の行列 A と m 行 n 列の行列 B の積 C は l 行 n 列で、C の (i, j) 成分は Σ(k＝1〜m) A(i, k) × B(k, j) である。A の列数と B の行数が等しいときだけ定義され、一般に A × B と B × A は等しくない。
    related: [行列, 内積]
  - term: 内積
    reading: ないせき
    simple: 2 つのベクトルの対応する成分どうしを掛けて、全部足した値です。
    definition: 同じ次元のベクトル a ＝ (a1, …, an)、b ＝ (b1, …, bn) に対して a1 × b1 ＋ … ＋ an × bn で定める値。行列の積の各成分、ニューラルネットワークの重み付き和、コサイン類似度などの計算の基本となる。
    related: [行列の積, ニューラルネットワーク]
  - term: 疎行列
    reading: そぎょうれつ
    simple: 成分のほとんどが 0 の行列です。0 でない成分だけを記録すると、記憶領域と計算を節約できます。
    definition: 大部分の成分が 0 である行列。0 でない成分の行番号・列番号・値の組だけを保持する形式（座標形式）などで表現し、0 の成分の格納や演算を省く。大規模なグラフの隣接行列や推薦システムの評価行列などに現れる。
    related: [行列, 隣接行列]
  - term: 線形走査法
    reading: せんけいそうさほう
    aliases: [リニアプロービング, 線形探査法]
    simple: ハッシュ表で格納位置が使用中だったとき、すぐ隣の位置を順に調べて空きを探す方法です。
    definition: オープンアドレス法で衝突が起きたとき、次の位置（末尾の次は先頭）を 1 つずつ調べて空きの位置に格納する方式。探索も同じ順に調べ、空きの位置に出会えば存在しないと判断する。このため削除時には空きと区別できる削除済みの印を置く。衝突した値が固まりやすい（クラスタ化）欠点がある。
    related: [ハッシュ表探索法]
  - term: ハノイの塔
    reading: はのいのとう
    simple: 大きさの違う円盤を、小さい円盤の上に大きい円盤を置かないルールで別の棒へ移すパズルで、再帰の代表例です。
    definition: 3 本の棒と n 枚の円盤を用い、1 回に 1 枚ずつ、小さい円盤の上に大きい円盤を載せないように全ての円盤を別の棒へ移すパズル。n － 1 枚を補助の棒へ移し、最大の円盤を移し、n － 1 枚を目的の棒へ移す再帰で解け、最小手数は 2^n － 1 回である。
    related: [再帰]
  - term: min-max正規化
    reading: みんまっくすせいきか
    aliases: [最小最大正規化]
    simple: データの最小値を 0、最大値を 1 にそろえるように値を変換することです。
    definition: 各値 x を (x － 最小値) ÷ (最大値 － 最小値) に変換し、0〜1 の範囲にそろえるデータの前処理。単位や大きさの異なる特徴量を機械学習で同等に扱うために用いる。外れ値があると他の値が狭い範囲に押し込まれる欠点があり、平均 0・標準偏差 1 にそろえる標準化と使い分ける。
    related: [機械学習]
  - term: 共分散
    reading: きょうぶんさん
    simple: 2 種類のデータが一緒に増えたり減ったりする傾向の強さを表す値です。
    definition: 2 つの変量 x、y について、x の偏差と y の偏差の積の平均。正なら一方が大きいと他方も大きい傾向、負なら逆の傾向がある。値の大きさは単位に依存するため、それぞれの標準偏差の積で割って相関係数として比較する。
    related: [分散, 相関係数, 最小二乗法]
  - term: 最小二乗法
    reading: さいしょうにじょうほう
    simple: データの点の近くを通る直線などを、ずれの 2 乗の合計が最も小さくなるように決める方法です。
    definition: 観測値とモデルの予測値との差（残差）の 2 乗和が最小になるようにモデルのパラメータを定める方法。直線 y ＝ ax ＋ b を当てはめる場合、傾き a は x と y の偏差の積の和を x の偏差の 2 乗の和で割って求め、b ＝ y の平均 － a × x の平均となる。
    related: [単回帰分析, 共分散]
  - term: k近傍法
    reading: けーきんぼうほう
    aliases: [k-NN法]
    simple: 分類したいデータに距離が近い k 個の学習データを探し、その多数決でクラスを決める機械学習の手法です。
    definition: 入力に最も近い k 個の学習データを距離（ユークリッド距離など）で求め、それらのクラスの多数決（回帰では平均）で予測する教師あり学習の手法。事前の学習処理はほぼ不要だが、予測のたびに全データとの距離を計算する。特徴量の尺度をそろえる正規化が重要である。
    related: [ユークリッド距離, 教師あり学習, 分類]
  - term: ユークリッド距離
    reading: ゆーくりっどきょり
    simple: 2 点を結ぶまっすぐな線の長さ、つまりふつうの意味での距離です。
    definition: 2 点 (x1, …, xn) と (y1, …, yn) の各座標の差の 2 乗の和の平方根。大小を比べるだけなら平方根をとらない 2 乗のままでも順序は変わらない。各座標の差の絶対値の和で定めるマンハッタン距離などと区別される。
    related: [k近傍法]
  - term: 単純パーセプトロン
    reading: たんじゅんぱーせぷとろん
    aliases: [パーセプトロン]
    simple: 入力に重みを掛けて足し、しきい値を超えたら 1、超えなければ 0 を出力する、最も基本的なニューロンのモデルです。
    definition: 入力の重み付き和にバイアスを加え、ステップ関数（正なら 1、そうでなければ 0）を適用して出力する 1 層のモデル。出力と教師データが異なるとき、重みに 学習率 × 誤差 × 入力 を加えて学習する。直線で分離できる問題（論理積・論理和）は学習できるが、排他的論理和は学習できず、中間層をもつ多層パーセプトロンが必要になる。
    related: [ニューラルネットワーク, 活性化関数, 教師あり学習]
  - term: 素因数分解
    reading: そいんすうぶんかい
    simple: 整数を素数だけの掛け算の形に分けることです。例えば 360 ＝ 2 × 2 × 2 × 3 × 3 × 5 です。
    definition: 2 以上の整数を素数の積として表すこと。その表し方は積の順序を除いて一意である。小さい数から順に割り切れる間割っていく試し割りでは、p × p が残りの値を超えた時点で残りが 1 より大きければそれ自身が素数である。大きな数の素因数分解が困難であることは RSA 暗号の安全性の根拠となっている。
    related: [エラトステネスのふるい]
  - term: 下方移動
    reading: かほういどう
    simple: ヒープの根から、親子の大小関係が正しくなるまで、要素を下の方へ移していく操作です。
    definition: ヒープで、根（または親）の要素を子と比較し、ヒープの条件を満たすまで下の階層へ交換しながら移動させる操作。最小値（最大値）を取り出した後の再構成などに使う。上方移動と対になる。
    related: [上方移動, ヒープ化, 優先度付きキュー]
  - term: ヒープ化
    reading: ひーぷか
    simple: 配列などのデータを、ヒープの条件を満たす構造に作り変えることです。
    definition: 任意の配列を、親が子より大きい（小さい）というヒープの条件を満たすように並べ替えて、ヒープを構築すること。上方移動や下方移動を繰り返して行う。
    related: [上方移動, 下方移動, ヒープソート]
  - term: ステップ関数
    reading: すてっぷかんすう
    simple: 入力が0以上なら1、そうでなければ0を出力する、段差のある関数です。
    definition: 入力がしきい値以上なら 1、未満なら 0 を出力する関数。単純パーセプトロンの活性化関数として使われる。
    related: [単純パーセプトロン, 活性化関数]
