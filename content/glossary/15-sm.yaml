category: サービスマネジメント
terms:
  - term: サービスマネジメントシステム
    reading: サービスマネジメントシステム
    aliases: [サービスマネジメント, SMS（サービスマネジメントシステム）, サービスライフサイクル]
    simple: IT サービスを計画・設計・移行・提供・改善して、顧客に価値を届け続けるための組織の仕組みです。
    definition: サービス提供者がサービスマネジメントを指揮・管理するためのマネジメントシステム。方針・目的・計画・プロセス・文書化した情報・資源などで構成され、JIS Q 20000-1 にその要求事項が定められている。サービスは計画立案、設計、移行、提供、改善のライフサイクルで管理する。
    related: [JIS Q 20000, ITIL, 継続的改善]
  - term: JIS Q 20000
    reading: ジスキューにまんにせん
    aliases: [ISO/IEC 20000, JIS Q 20000-1]
    simple: IT サービスマネジメントの仕組み（SMS）に求められることを定めた規格です。
    definition: サービスマネジメントシステムの規格群（ISO/IEC 20000 シリーズの JIS 版）。第1部（JIS Q 20000-1）は SMS の確立・実施・維持・継続的改善の要求事項を定め、第三者認証の基準となる。第2部は適用の手引。
    related: [サービスマネジメントシステム, ITIL]
  - term: ITIL
    reading: アイティル
    fullName: Information Technology Infrastructure Library
    japanese: IT 基盤ライブラリ
    words:
      - { en: Information Technology, ja: 情報技術 }
      - { en: Infrastructure, ja: 基盤 }
      - { en: Library, ja: 書籍群 }
    simple: IT サービスをうまく運営するための成功事例（ベストプラクティス）をまとめた手引書です。
    definition: IT サービスマネジメントのベストプラクティスを体系化したフレームワーク。英国政府機関（CCTA、後の OGC）が作成したものが始まりで、現在は ITIL 4 が公開されている。規格ではなくガイドラインである。
    related: [JIS Q 20000, サービスマネジメントシステム]
  - term: SLA
    reading: エスエルエー
    fullName: Service Level Agreement
    japanese: サービスレベル合意書
    aliases: [サービスレベル合意書]
    words:
      - { en: Service, ja: サービス }
      - { en: Level, ja: 水準 }
      - { en: Agreement, ja: 合意 }
    simple: サービスの内容と品質の目標（稼働率や応答時間など）を、提供者と顧客の間で取り決めた文書です。
    definition: サービス提供者と顧客との間で、サービスの範囲・内容、サービス時間、可用性、応答時間などのサービスレベル目標と、未達時の扱いなどを合意して文書化したもの。
    related: [SLO, SLI, OLA, サービスレベル管理]
  - term: SLO
    reading: エスエルオー
    fullName: Service Level Objective
    japanese: サービスレベル目標
    aliases: [サービスレベル目標]
    words:
      - { en: Service, ja: サービス }
      - { en: Level, ja: 水準 }
      - { en: Objective, ja: 目標 }
    simple: 「月間稼働率 99.9 % 以上」のように、サービスの品質について決めた目標値です。
    definition: SLI（サービスレベル指標）に対して設定する、達成すべきサービスレベルの目標値。顧客と合意した SLO は SLA に記載される。
    related: [SLA, SLI]
  - term: SLI
    reading: エスエルアイ
    fullName: Service Level Indicator
    japanese: サービスレベル指標
    aliases: [サービスレベル指標]
    words:
      - { en: Service, ja: サービス }
      - { en: Level, ja: 水準 }
      - { en: Indicator, ja: 指標 }
    simple: 稼働率や応答時間など、サービスの品質を測るための物差し（指標）です。
    definition: サービスレベルを定量的に測定するための指標とその測定値。可用性、応答時間、エラー率などがあり、SLO はこの指標に対する目標値として設定する。
    related: [SLO, SLA]
  - term: サービスレベル管理
    reading: サービスレベルかんり
    aliases: [SLM]
    simple: 顧客と約束したサービスの品質が守られているかを測り、報告し、改善していく活動です。
    definition: 顧客とサービスレベル目標を合意し（SLA）、その目標に対する実績を監視・測定・報告し、定期的なレビューによってサービスや合意の内容を改善するプロセス。
    related: [SLA, OLA, サービスカタログ]
  - term: OLA
    reading: オーエルエー
    fullName: Operational Level Agreement
    japanese: 運用レベル合意書
    words:
      - { en: Operational, ja: 運用の }
      - { en: Level, ja: 水準 }
      - { en: Agreement, ja: 合意 }
    simple: サービス提供者が、同じ組織の中の別の部門と取り決める、サービスを支える作業の約束です。
    definition: サービス提供者と組織内部の部門（内部供給者）との間で、サービスの提供を支える作業の内容や対応時間などを合意したもの。顧客との SLA を達成できるように SLA と整合させる。
    related: [SLA, 供給者管理]
  - term: 供給者管理
    reading: きょうきゅうしゃかんり
    aliases: [外部供給者, 内部供給者]
    simple: サービスの一部を担ってもらう社外の業者や社内の他部門を、契約や合意に基づいて管理する活動です。
    definition: サービスの一部を提供する供給者のパフォーマンスを管理するプロセス。組織外部の外部供給者とは契約を、より大きな組織の一部だが SMS の適用範囲外にある内部供給者とは文書化した合意を結ぶ。
    related: [OLA, サービスレベル管理]
  - term: サービスカタログ
    reading: サービスカタログ
    aliases: [サービスカタログ管理]
    simple: 提供中のサービスの内容や利用条件、申込み方法などを、利用者向けにまとめた一覧です。
    definition: 稼働中のサービスについて、サービスの説明、利用条件、サービス要求の方法、問合せ窓口などを顧客・利用者向けに文書化した情報。サービスカタログ管理でその内容を正確に維持する。
    related: [サービスポートフォリオ, SLA]
  - term: サービスポートフォリオ
    reading: サービスポートフォリオ
    aliases: [サービス・パイプライン]
    simple: 計画中から廃止済みまで、サービス提供者が扱うすべてのサービスをまとめて管理するものです。
    definition: サービス提供者が管理するサービス全体を、その状態とともに表したもの。計画中・開発中のサービス（サービス・パイプライン）、稼働中のサービス（サービスカタログ）、廃止したサービスを含む。
    related: [サービスカタログ]
  - term: 容量・能力管理
    reading: ようりょう・のうりょくかんり
    aliases: [キャパシティ管理, 容量・能力計画]
    simple: CPU やディスクなどの資源が足りなくならないように、使用状況を見張り、将来の増強を計画する活動です。
    definition: 現在と将来の需要に対して、サービスの提供に必要な資源（CPU、メモリ、ディスク、ネットワークなど）の容量・能力を確保するプロセス。使用率を監視してしきい値を超えたら警告し、需要予測に基づいて容量・能力計画を立てる。
    related: [需要管理, キャパシティプランニング]
  - term: 需要管理
    reading: じゅようかんり
    aliases: [需要予測]
    simple: サービスがこれからどれだけ使われるか（需要）を予測して把握する活動です。
    definition: サービスの現在の需要を把握し、将来の需要を予測して、計画的なサービスの提供や容量・能力の計画に役立てるプロセス。
    related: [容量・能力管理]
  - term: 事業関係管理
    reading: じぎょうかんけいかんり
    aliases: [顧客満足度]
    simple: 顧客と良い関係を保つため、満足度を測ったり、苦情に対応したりする活動です。
    definition: サービス提供者と顧客との関係を確立・維持するプロセス。顧客と定期的にサービスのパフォーマンスを話し合い、顧客満足度を測定し、サービスの苦情を記録・調査・対応して報告する。
    related: [サービスレベル管理]
  - term: サービス可用性管理
    reading: サービスかようせいかんり
    aliases: [可用性管理]
    simple: サービスを使いたいときに使える状態（可用性）を目標どおりに保つための活動です。
    definition: サービスの可用性の要求事項を定め、稼働率などを監視・記録し、目標を達成するための冗長化などを計画・実施するプロセス。信頼性（MTBF）、保守性（MTTR）、回復力などの観点で評価する。
    related: [稼働率, MTBF, MTTR, サービス継続管理]
  - term: サービス継続管理
    reading: サービスけいぞくかんり
    aliases: [サービス継続計画]
    simple: 災害や大きな障害が起きても、合意した時間内にサービスを再開できるように備える活動です。
    definition: 災害などの重大な事象の発生時にもサービスを継続又は合意した時間内に復旧できるよう、サービス継続計画を作成し、計画した間隔で試験して見直すプロセス。RTO・RPO・RLO などの復旧目標を定める。
    related: [BCP, RTO, RPO, サービス可用性管理]
  - term: RTO
    reading: アールティーオー
    fullName: Recovery Time Objective
    japanese: 目標復旧時間
    aliases: [目標復旧時間]
    words:
      - { en: Recovery, ja: 復旧 }
      - { en: Time, ja: 時間 }
      - { en: Objective, ja: 目標 }
    simple: 障害や災害で止まった業務やサービスを、どれくらいの時間で再開させるかという目標です。
    definition: 業務やサービスが中断してから、再開させるまでの目標時間。BCP やサービス継続計画で定める。
    related: [RPO, RLO, BCP]
  - term: RPO
    reading: アールピーオー
    fullName: Recovery Point Objective
    japanese: 目標復旧時点
    aliases: [目標復旧時点]
    words:
      - { en: Recovery, ja: 復旧 }
      - { en: Point, ja: 時点 }
      - { en: Objective, ja: 目標 }
    simple: 障害が起きたとき、どの時点のデータまで取り戻せればよいかという目標です。
    definition: 障害や災害の発生時に、どの時点までのデータを復旧させるかの目標。失ってもよいデータの範囲を表し、バックアップや複製の取得間隔を決める根拠となる。
    related: [RTO, RLO, バックアップ]
  - term: RLO
    reading: アールエルオー
    fullName: Recovery Level Objective
    japanese: 目標復旧レベル
    aliases: [目標復旧レベル]
    words:
      - { en: Recovery, ja: 復旧 }
      - { en: Level, ja: 水準 }
      - { en: Objective, ja: 目標 }
    simple: 止まった業務やサービスを、どの程度の水準まで回復させるかという目標です。
    definition: 業務やサービスの中断時に、どの水準（業務量やサービスの品質）まで復旧させるかの目標。
    related: [RTO, RPO]
  - term: ウォームスタンバイ
    reading: ウォームスタンバイ
    simple: 予備のシステムを途中まで準備した状態で待たせておく方式で、切替えの速さはホットとコールドの中間です。
    definition: 待機系の機器や OS は起動しておき、業務アプリケーションの起動やデータの反映などを障害発生時に行って切り替える冗長化の方式。ホットスタンバイより切替えに時間がかかり、コールドスタンバイより短い。
    related: [ホットスタンバイ, コールドスタンバイ]
  - term: インシデント管理
    reading: インシデントかんり
    aliases: [回避策, ワークアラウンド, 重大なインシデント, 解決目標時間]
    simple: サービスが止まったり遅くなったりしたとき、とにかく早く元どおりに使えるようにする活動です。
    definition: インシデント（サービスの計画外の中断、品質の低下、又はまだ影響していない事象）を記録・分類し、影響と緊急度から優先度を決め、回避策も使ってできるだけ速やかにサービスを回復させるプロセス。重大なインシデントは、定めた基準と手順に従って管理し、トップマネジメントに通知する。
    related: [問題管理, エスカレーション, サービスデスク]
  - term: エスカレーション
    reading: エスカレーション
    aliases: [機能的エスカレーション, 階層的エスカレーション]
    simple: 自分で解決できない問い合わせなどを、詳しい担当者や上司に引き継いだり報告したりすることです。
    definition: インシデントなどの対応を、より適切な担当者や管理者に引き継ぐこと。専門知識をもつ担当者（二次サポートなど）へ引き継ぐ機能的エスカレーションと、上位の管理者へ報告して判断や資源を求める階層的エスカレーションがある。
    related: [インシデント管理, サービスデスク]
  - term: 問題管理
    reading: もんだいかんり
    aliases: [根本原因, 既知の誤り, 問題（サービスマネジメント）]
    simple: 同じ障害が繰り返さないように、根本の原因を突き止めて取り除く活動です。
    definition: 一つ又は複数のインシデントの根本原因である問題を特定し、影響を最小限にして再発を防止するプロセス。根本原因が特定されたか回避策が見つかった問題を既知の誤りとして記録し、恒久的な解決策は変更管理を通じて実施する。
    related: [インシデント管理, 変更管理]
  - term: サービス要求管理
    reading: サービスようきゅうかんり
    aliases: [サービス要求]
    simple: パスワードの再設定や使い方の質問など、利用者からの決まった種類の依頼に対応する活動です。
    definition: 利用者からの情報提供、助言、アクセス権の付与、事前承認された定型的な作業などの要求（サービス要求）を記録し、優先度を付けて、定めた手順に従って実現するプロセス。
    related: [インシデント管理, 標準変更]
  - term: 変更管理
    reading: へんこうかんり
    aliases: [変更要求, RFC（変更要求）, 通常の変更, 変更実施後のレビュー, PIR]
    simple: システムやサービスの変更を勝手に行わせず、影響を評価して承認したものだけを計画的に行う活動です。
    definition: サービスやその構成要素に対する変更要求（RFC）を記録・分類し、影響・リスク・費用などを評価して承認の可否を判断し、承認した変更の実施を管理するプロセス。変更の実施後には、目的を達成したかを確認するレビュー（PIR）を行う。
    related: [標準変更, 緊急変更, CAB, リリース及び展開管理]
  - term: 標準変更
    reading: ひょうじゅんへんこう
    simple: リスクが低く手順が決まっているため、あらかじめ承認しておき、その都度の承認なしに行える変更です。
    definition: リスクが低く、手順が確立している定型的な変更で、事前に承認されているもの。PC の追加配備などが例で、サービス要求として実施されることも多い。
    related: [変更管理, 緊急変更]
  - term: 緊急変更
    reading: きんきゅうへんこう
    simple: 重大な障害を直すためなど、通常の手続を待たずに急いで行う必要がある変更です。
    definition: 重大なインシデントの解決やセキュリティ上の脅威への対応などのため、迅速に実施する必要がある変更。簡略化した手続で承認し、事後に記録とレビューを行う。
    related: [変更管理, 標準変更, 緊急リリース]
  - term: CAB
    reading: キャブ
    fullName: Change Advisory Board
    japanese: 変更諮問委員会
    aliases: [変更諮問委員会]
    words:
      - { en: Change, ja: 変更 }
      - { en: Advisory, ja: 助言の }
      - { en: Board, ja: 委員会 }
    simple: システムやサービスの変更を承認してよいか、いろいろな立場の人が集まって検討し、助言する会議です。
    definition: 変更要求の影響・リスク・優先順位を検討し、変更の承認者に助言するために、技術・業務・顧客などの関係者で構成される組織。
    related: [変更管理]
  - term: リリース及び展開管理
    reading: リリースおよびてんかいかんり
    aliases: [リリース管理, 展開管理, 緊急リリース, 切り戻し, 受入れ試験環境]
    simple: 承認された変更をまとめて準備・試験し、本番の環境へ確実に送り出す活動です。
    definition: 変更管理で承認された新規又は変更されたサービスや構成要素をリリースとして計画・構築・試験し、受入れ基準を満たしたものを稼働環境に展開するプロセス。展開に失敗したときに元に戻す（切り戻す）手順も計画する。緊急変更に伴う緊急リリースもある。
    related: [変更管理, 構成管理]
  - term: 構成管理
    reading: こうせいかんり
    aliases: [構成品目, CI（構成品目）, 構成情報]
    simple: サービスを支える機器やソフトウェア、文書などを一つ一つ登録し、その関係も含めて正確に管理する活動です。
    definition: サービスの提供のために管理が必要な要素を構成品目（CI）として識別し、その属性（種類、版、状態など）と CI 間の関係を CMDB などに記録して正確に維持するプロセス。構成情報は、インシデントの影響範囲の特定や変更の影響の評価に使われる。
    related: [CMDB, 変更管理, IT資産管理]
  - term: CMDB
    reading: シーエムディービー
    fullName: Configuration Management Database
    japanese: 構成管理データベース
    aliases: [構成管理データベース]
    words:
      - { en: Configuration, ja: 構成 }
      - { en: Management, ja: 管理 }
      - { en: Database, ja: データベース }
    simple: サービスを構成する機器やソフトウェアなどの情報と、そのつながりを記録したデータベースです。
    definition: 構成品目（CI）の識別情報、版、状態などの属性と、CI 間の関係を記録・管理するデータベース。構成管理の中心となる。
    related: [構成管理]
  - term: IT資産管理
    reading: アイティーしさんかんり
    aliases: [ITAM, ITアセットマネジメント, ソフトウェア資産管理, ソフトウェアアセットマネジメント, ライセンス管理, ライセンスマネジメント]
    simple: 会社の PC やソフトウェア、ライセンスなどの IT 資産を把握して、正しく無駄なく使うための管理です。
    definition: ハードウェア、ソフトウェア、ライセンスなどの IT 資産を、調達から廃棄まで把握・管理する活動（ITAM）。ソフトウェアとライセンスを対象とするものを SAM（ソフトウェア資産管理）といい、導入数と保有ライセンス数の照合などでライセンス違反や過剰購入を防ぐ。
    related: [SAM, 構成管理, TCO]
  - term: SAM
    reading: サム
    fullName: Software Asset Management
    japanese: ソフトウェア資産管理
    words:
      - { en: Software, ja: ソフトウェア }
      - { en: Asset, ja: 資産 }
      - { en: Management, ja: 管理 }
    simple: 会社で使っているソフトウェアとライセンスを正しく把握して管理することです。
    definition: 組織が保有・利用するソフトウェアとそのライセンスを把握し、ライセンス契約の遵守と費用の適正化を図る管理活動。
    related: [IT資産管理]
  - term: サービスの移行
    reading: サービスのいこう
    aliases: [移行リハーサル, 移行判断, 運用引継ぎ, サービスの設計及び移行]
    simple: 新しいサービスや変更したサービスを、計画に沿って本番の運用へ切り替えることです。
    definition: 新規又は変更したサービスを設計・構築し、稼働環境へ移行するプロセス。移行計画に基づき、移行リハーサルで手順と所要時間を確認し、移行判断を経て移行を実施する。移行後は運用部門へ運用引継ぎを行い、移行の結果を評価する。
    related: [リリース及び展開管理, 変更管理]
  - term: サービスデスク
    reading: サービスデスク
    aliases: [ヘルプデスク, 一次サポート, 一次解決率]
    simple: 利用者からの問い合わせや障害の連絡を、まとめて受け付ける窓口です。
    definition: 利用者とサービス提供者の間の単一の窓口（SPOC）として、問合せ、サービス要求、インシデントの連絡などを受け付けて記録し、一次解決できないものは適切な担当へエスカレーションする機能。組織の形態にはローカル、中央、バーチャル、フォロー・ザ・サンなどがある。
    related: [SPOC, エスカレーション, 知識ベース, インシデント管理]
  - term: SPOC
    reading: エスポック
    fullName: Single Point Of Contact
    japanese: 単一窓口
    words:
      - { en: Single, ja: 単一の }
      - { en: Point, ja: 地点 }
      - { en: Of, ja: 〜の }
      - { en: Contact, ja: 連絡 }
    simple: 問い合わせ先を一つにまとめて、利用者がどこに連絡すればよいか迷わないようにする考え方です。
    definition: 利用者からのすべての問合せや連絡を一つの窓口で受け付けるという考え方、又はその窓口。サービスデスクの基本的な役割である。
    related: [サービスデスク]
  - term: ローカルサービスデスク
    reading: ローカルサービスデスク
    simple: 利用者がいる拠点の近くに置くサービスデスクです。
    definition: 利用者の拠点ごとに、その近くに設置するサービスデスクの形態。現地の言語や事情に合わせた対応がしやすいが、拠点ごとに要員が必要になる。
    related: [中央サービスデスク, バーチャルサービスデスク]
  - term: 中央サービスデスク
    reading: ちゅうおうサービスデスク
    simple: サービスデスクの要員を 1 か所に集めて、すべての利用者に対応する形態です。
    definition: サービスデスクを1か所に集約して設置する形態。要員の効率的な配置や知識の共有がしやすい。
    related: [ローカルサービスデスク, バーチャルサービスデスク]
  - term: バーチャルサービスデスク
    reading: バーチャルサービスデスク
    simple: 離れた場所にいる要員を通信でつなぎ、利用者からは一つの窓口に見えるようにしたサービスデスクです。
    definition: 地理的に分散した複数の拠点の要員を通信技術で結び、利用者からは単一のサービスデスクとして見えるように運営する形態。
    related: [中央サービスデスク, フォロー・ザ・サン]
  - term: フォロー・ザ・サン
    reading: フォロー・ザ・サン
    simple: 時差のある国や地域の拠点で順番に対応を引き継ぎ、24 時間対応するサービスデスクの形態です。
    definition: 時差のある複数の地域にサービスデスクを置き、昼間の時間帯にある地域が順に対応を引き継ぐことで、24 時間のサービスを提供する形態。
    related: [バーチャルサービスデスク]
  - term: 知識ベース
    reading: ちしきベース
    aliases: [ナレッジベース, FAQ, チャットボット（サービスデスク）]
    simple: 過去の問い合わせとその解決方法などを集めておき、すぐに探して使えるようにしたものです。
    definition: 過去のインシデントや問合せ、既知の誤りと回避策、解決方法などを蓄積して検索できるようにした情報の集まり。サービスデスクの一次解決率の向上や、FAQ・チャットボットによる利用者の自己解決に活用される。
    related: [サービスデスク, 問題管理]
  - term: CTI
    reading: シーティーアイ
    fullName: Computer Telephony Integration
    japanese: コンピュータと電話の統合
    words:
      - { en: Computer, ja: コンピュータ }
      - { en: Telephony, ja: 電話 }
      - { en: Integration, ja: 統合 }
    simple: 電話とコンピュータを連携させて、かけてきた人の情報を画面に出したりする仕組みです。
    definition: 電話とコンピュータを統合する技術。着信時に発信者番号から顧客情報を検索して画面に表示したり、着信を適切な担当者へ自動的に振り分けたりして、コールセンターやサービスデスクの対応を効率化する。
    related: [サービスデスク]
  - term: AIOps
    reading: エーアイオプス
    fullName: Artificial Intelligence for IT Operations
    japanese: IT 運用のための AI
    words:
      - { en: Artificial Intelligence, ja: 人工知能 }
      - { en: for, ja: 〜のための }
      - { en: IT Operations, ja: IT 運用 }
    simple: AI を使って、システムの監視データやログから障害の予兆を見つけるなど、IT の運用を楽にする取組みです。
    definition: 監視データ、ログ、イベントなどの大量の運用データを AI で分析し、異常や障害の予兆の検知、アラートの集約、原因の推定、対応の自動化などを行って IT 運用を効率化・高度化する取組み。
    related: [ジョブ管理]
  - term: ファシリティマネジメント
    reading: ファシリティマネジメント
    aliases: [施設管理, 設備管理]
    simple: コンピュータを置く建物や電源・空調などの設備を、安全で効率よく使えるように管理することです。
    definition: 情報システムを支える建物や電気・空調・通信などの設備（ファシリティ）を、最適な状態で保有・運用・維持するための管理活動。免震装置、UPS、自家発電装置、空調設備などを対象とし、環境への配慮も含む。
    related: [UPS, 自家発電装置, 免震装置, グリーンIT]
  - term: 自家発電装置
    reading: じかはつでんそうち
    aliases: [自家発電設備, 非常用発電機]
    simple: 停電が長く続いても電気を使えるように、燃料を使って自分で発電する装置です。
    definition: 燃料を使って発電し、商用電源の停電時に長時間にわたって電力を供給する設備。起動して電力が安定するまでには時間がかかるため、その間を UPS でつなぐ。
    related: [UPS, ファシリティマネジメント]
  - term: 免震装置
    reading: めんしんそうち
    aliases: [免震構造, 制震構造, 耐震構造]
    simple: 地震の揺れが建物や機器に伝わりにくくする装置です。
    definition: 建物の基礎と上部構造の間や機器の下に設置し、地震の揺れが伝わりにくくして、建物や機器の損傷・転倒を防ぐ装置。建物自体を強くする耐震構造、揺れを吸収する制震構造と区別される。
    related: [ファシリティマネジメント]
  - term: サージ防護デバイス
    reading: サージぼうごデバイス
    aliases: [SPD, アレスタ, 避雷器]
    simple: 雷などで電線に急に流れ込む高い電圧から、機器を守る装置です。
    definition: 落雷などにより電源線や通信線に発生する過電圧（サージ）を大地へ逃がして、接続された機器を保護する装置（SPD：Surge Protective Device）。アレスタ（避雷器）とも呼ぶ。
    related: [UPS, ファシリティマネジメント]
  - term: コールドアイル
    reading: コールドアイル
    aliases: [ホットアイル]
    simple: サーバラックの吸気面を向かい合わせて作る、冷たい空気の通り道です。
    definition: サーバルームでラックの吸気面同士を向かい合わせた通路。排気面同士を向かい合わせた通路をホットアイルといい、冷気と暖気を分離して冷却効率を高める。
    related: [ファシリティマネジメント, PUE]
  - term: MDF
    reading: エムディーエフ
    fullName: Main Distribution Frame
    japanese: 主配線盤
    aliases: [IDF, 主配線盤, 中間配線盤]
    words:
      - { en: Main, ja: 主な }
      - { en: Distribution, ja: 分配 }
      - { en: Frame, ja: 枠（盤） }
    simple: 建物の外から入ってくる通信回線を、建物の中の配線につなぐための設備です。
    definition: 建物の外部から引き込んだ通信回線を構内の配線と接続する主配線盤。各フロアなどに置いて MDF からの配線を分配するものを IDF（中間配線盤）という。
    related: [ファシリティマネジメント]
  - term: グリーンIT
    reading: グリーンアイティー
    simple: IT 機器の省エネルギー化や、IT を使った環境への負荷の削減に取り組むことです。
    definition: IT 機器やデータセンターそのものの消費電力などの環境負荷を減らす取組みと、IT を活用して社会全体の環境負荷を減らす取組みの総称。
    related: [PUE, ファシリティマネジメント]
  - term: PUE
    reading: ピーユーイー
    fullName: Power Usage Effectiveness
    japanese: 電力使用効率
    words:
      - { en: Power, ja: 電力 }
      - { en: Usage, ja: 使用 }
      - { en: Effectiveness, ja: 有効性 }
    simple: データセンターの電気の使い方の効率を表す数値で、1 に近いほど無駄が少ないことを表します。
    definition: データセンター全体の消費電力を IT 機器の消費電力で割った値。空調や照明などの IT 機器以外の消費電力が少ないほど 1.0 に近づき、効率が良い。
    related: [グリーンIT, コールドアイル]
  - term: 継続的改善
    reading: けいぞくてきかいぜん
    aliases: [不適合, ギャップ分析]
    simple: サービスや仕組みの良くない点を見つけて直すことを、繰り返し続けていくことです。
    definition: マネジメントシステムやサービスの適切性・有効性を継続的に高める活動。要求事項を満たしていないこと（不適合）には、修正とともに原因を除去して再発を防ぐ処置をとる。あるべき姿と現状の差を明らかにするギャップ分析や、指標による測定を用いる。
    related: [サービスマネジメントシステム]
  - term: 情報セキュリティ管理
    reading: じょうほうセキュリティかんり
    simple: サービスで扱う情報を守るため、方針を決めてリスクを評価し、対策を実施・見直す活動です。
    definition: JIS Q 20000-1 の SMS のプロセスの一つ。情報セキュリティ方針を定め、サービスと SMS に関する情報セキュリティリスクを計画した間隔でアセスメントし、管理策を決定・実施する。情報セキュリティインシデントは文書化した手順に従って管理する。
    related: [リスクアセスメント, 情報セキュリティインシデント, ISMS]
