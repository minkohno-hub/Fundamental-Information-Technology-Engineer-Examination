category: 技術戦略マネジメント
terms:
  - term: MOT
    reading: エムオーティー
    fullName: Management of Technology
    japanese: 技術経営
    words:
      - { en: Management, ja: 経営 }
      - { en: Technology, ja: 技術 }
    aliases: [技術経営]
    simple: 技術を事業の価値に結び付けるための経営の考え方です。
    definition: 技術を経営の中核に据え、研究開発の成果を事業化して持続的に経済的価値を創出するための経営の考え方。
  - term: イノベーションのジレンマ
    reading: イノベーションのジレンマ
    aliases: [破壊的イノベーション, 持続的イノベーション]
    simple: 優良な大企業が、既存顧客を大切にするあまり新しい技術に負けてしまう現象です。
    definition: C.クリステンセンが提唱した、優良企業が持続的イノベーションを追求する結果、破壊的イノベーションを軽視して新興企業に市場を奪われる現象。
  - term: キャズム
    reading: キャズム
    simple: 新製品が一部の新しもの好きから多数派に広がるときの大きな溝です。
    definition: G.A.ムーアが提唱した、イノベータ・アーリーアダプタの初期市場とアーリーマジョリティ以降のメインストリーム市場との間にある普及の溝。
  - term: 魔の川
    reading: まのかわ
    simple: 研究の成果を製品開発の段階に進めるときの壁です。
    definition: 技術開発から事業化までの障壁の一つで、基礎研究から製品化を目指す開発段階へ移行する際の障壁。
    related: [死の谷, ダーウィンの海]
  - term: 死の谷
    reading: しのたに
    simple: 開発した技術を事業として製品化するときの、お金や人の不足による壁です。
    definition: 技術開発から事業化までの障壁の一つで、開発段階から事業化段階へ進む際に資金や人材の不足などで開発が進まなくなる障壁。
    related: [魔の川, ダーウィンの海]
  - term: ダーウィンの海
    reading: ダーウィンのうみ
    simple: 製品を売り出した後、市場の競争で生き残るまでの壁です。
    definition: 技術開発から事業化までの障壁の一つで、事業化した製品が市場で競合や顧客の評価にさらされ、事業として成功するまでの障壁。
    related: [魔の川, 死の谷]
  - term: ハイプサイクル
    reading: ハイプサイクル
    simple: 新しい技術への期待が、高まり・失望・回復とどう変わるかを示した曲線です。
    definition: ガートナーが提唱した、新技術への期待度の推移を黎明期・「過度な期待」のピーク期・幻滅期・啓発期・生産性の安定期の5段階で示したもの。
  - term: オープンイノベーション
    reading: オープンイノベーション
    simple: 社外の技術やアイデアも取り入れて、新しい価値を生み出す考え方です。
    definition: 自社内の研究開発に限らず、大学や他企業など外部の技術・アイデアを取り入れ、自社技術も外部に提供してイノベーションを創出する考え方。
  - term: リーンスタートアップ
    reading: リーンスタートアップ
    aliases: [MVP, ピボット]
    simple: 最小限の製品を素早く作って顧客の反応から学び、改良を繰り返す事業の進め方です。
    definition: MVP（実用最小限の製品）を短期間で作って顧客に提供し、構築・計測・学習のサイクルで改良や方向転換（ピボット）を繰り返す新規事業開発の手法。
  - term: VC
    reading: ブイシー
    fullName: Venture Capital
    japanese: ベンチャーキャピタル
    words:
      - { en: Venture, ja: 冒険的事業 }
      - { en: Capital, ja: 資本 }
    aliases: [ベンチャーキャピタル]
    simple: 成長しそうな未上場企業に出資する投資会社です。
    definition: 成長が見込まれる未上場企業に出資し、株式公開や売却によって利益を得る投資会社またはその資金。
    related: [CVC]
  - term: CVC
    reading: シーブイシー
    fullName: Corporate Venture Capital
    japanese: コーポレートベンチャーキャピタル
    words:
      - { en: Corporate, ja: 事業会社の }
      - { en: Venture Capital, ja: ベンチャーキャピタル }
    simple: 事業会社が自社の戦略のためにベンチャー企業へ投資する仕組みです。
    definition: 事業会社が自社の戦略目的に沿って社外のベンチャー企業に投資する組織や活動。
    related: [VC]
  - term: デザイン思考
    reading: デザインしこう
    simple: 利用者への共感から課題を見つけ、試作と検証を繰り返して解決策を作る考え方です。
    definition: 共感・問題定義・創造・プロトタイプ・テストの段階を繰り返し、利用者中心に課題の解決策を導く思考法。
    related: [ペルソナ]
  - term: PoC
    reading: ピーオーシー
    fullName: Proof of Concept
    japanese: 概念実証
    words:
      - { en: Proof, ja: 証明 }
      - { en: of, ja: の }
      - { en: Concept, ja: 概念 }
    aliases: [概念実証, PoV]
    simple: 新しいアイデアや技術が本当に実現できるかを、試作で確かめることです。
    definition: 新しい技術やアイデアの実現可能性や効果を、本格的な開発の前に試作や実証実験で検証すること。価値の検証は PoV（Proof of Value）という。
  - term: ハッカソン
    reading: ハッカソン
    aliases: [アイディアソン]
    simple: 短期間に集中してチームで開発し、成果を競うイベントです。
    definition: 開発者などが短期間に集中してチームで開発に取り組み、成果を競うイベント。アイデアを出し合うものはアイディアソンという。
  - term: コンカレントエンジニアリング
    reading: コンカレントエンジニアリング
    simple: 設計や生産準備などの工程を同時に進めて、開発期間を短くする方法です。
    definition: 製品の設計・生産準備などの工程を並行して進め、開発期間の短縮やコスト削減を図る手法。
  - term: 技術ロードマップ
    reading: ぎじゅつロードマップ
    aliases: [製品応用ロードマップ, 特許取得ロードマップ]
    simple: 将来どんな技術をいつまでに実現するかを、時間に沿って示した計画図です。
    definition: 市場ニーズや技術動向を踏まえ、研究開発の目標と実現の道筋を時間軸に沿って示したもの。
