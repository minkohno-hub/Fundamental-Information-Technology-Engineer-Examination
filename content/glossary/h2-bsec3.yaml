category: セキュリティ
terms:
  - term: ワンタイムトークン
    reading: ワンタイムトークン
    simple: 1回だけ、または短い間だけ使える、予測できない確認用の文字列のことです。
    definition: サーバが正規の画面やセッションに対して発行する、予測困難な使い捨ての値。リクエストに含めて送信させ、サーバ側で一致を検証することで、そのリクエストが正規の画面を経由したものであることを確認できる。CSRF 対策や、二要素認証の確認コードとして使われる。
    related: [CSRF]
  - term: 失効
    reading: しっこう
    simple: 証明書などが、有効期限の前に無効になることです。
    definition: デジタル証明書について、秘密鍵の漏洩や記載事項の変更などを理由に、認証局が有効期限より前にその効力を取り消すこと。失効した証明書は、ブラウザなどの検証で無効として扱われる。失効の状態は、CRL（証明書失効リスト）や OCSP で確認できる。
    related: [デジタル証明書, 認証局]
  - term: リストア
    reading: リストア
    simple: バックアップしておいたデータやシステムを、元の使える状態に戻すことです。
    definition: 取得したバックアップを用いて、データやシステムを復旧する操作。バックアップの取得が正常でも、媒体の不良や手順の不備でリストアできないことがあるため、定期的に実際に戻せるかを確認する訓練が重要とされる。
    related: [バックアップ]
  - term: 情報セキュリティポリシ
    reading: じょうほうセキュリティポリシ
    simple: 組織が情報セキュリティについて定めた、基本方針や行動の基準のことです。
    definition: 組織の情報セキュリティに関する基本方針と、対策の基準・実施手順を定めた文書体系。基本方針の下に、個別の対策基準（スタンダード）と実施手順が置かれることが多い。従業員が守るべき情報の扱いの範囲も、規程としてここに定める。
    related: [情報セキュリティ]
