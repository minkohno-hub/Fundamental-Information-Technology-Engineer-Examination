category: システム構成要素
terms:
  - term: ホットスペア
    reading: ほっとすぺあ
    simple: 故障したディスクなどと自動で交代するために、あらかじめ待機させておく予備の部品です。
    definition: 障害発生時に自動的に切り替えて組み込まれる待機用の予備ディスク（または部品）。RAID では、故障したディスクの代わりにホットスペアへデータの再構築（リビルド）が自動で始まる。平常時はデータを格納しないため、RAID 構成の実効容量には含めない。
    related: [RAID6, RAID]
  - term: リトルの法則
    reading: りとるのほうそく
    simple: 混雑の程度は、流れの速さと滞在時間の掛け算で決まるという法則です。
    definition: 安定した系において、系内に滞留する平均個数 L、平均到着率（スループット）λ、平均滞留時間 W の間に L＝λ×W が成り立つという待ち行列理論の基本法則。系の内部構造や分布の形によらず成り立つ。
    related: [スループット, レスポンスタイム, 待ち行列理論]
