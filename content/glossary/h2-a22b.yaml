category: 企業活動
terms:
  - term: 当座比率
    reading: とうざひりつ
    simple: すぐ現金にできる資産で、短期の借金を返せるかを見る割合です。
    definition: 当座資産（現金及び預金、売上債権など、短期間で現金化できる資産）を流動負債で割った流動性の指標。流動資産から換金の確実性が低い棚卸資産を除いて計算するため、流動比率より厳しい評価になる。
    related: [流動比率]
  - term: 売上原価
    reading: うりあげげんか
    simple: 売れた商品や製品を作ったり仕入れたりするのにかかった費用です。
    definition: 売上高に対応する原価で、商品販売業では期首商品棚卸高 ＋ 当期商品仕入高 − 期末商品棚卸高で求める。売上高から売上原価を差し引いたものが売上総利益であり、売れ残った在庫は売上原価に含まれない。
    related: [売上総利益]
  - term: 製造間接費
    reading: せいぞうかんせつひ
    simple: 特定の製品だけに結び付かない、工場共通の費用です。
    definition: 工場の設備の減価償却費や工場管理者の給料など、特定の製品に直接ひも付けられない製造費用。製品別の原価を求める際は、機械作業時間などの配賦基準を用いて、製品へ分けて割り当てる（配賦する）。
    related: [製造原価]
  - term: 製造原価
    reading: せいぞうげんか
    simple: 製品を作るのにかかった費用の合計です。
    definition: 製品の製造に要した費用の総額で、材料費・労務費・経費（直接費と間接費を含む）の合計。製造間接費は配賦基準で製品別に割り当てて加える。販売費及び一般管理費は含めず、売上原価の基礎になる。
    related: [製造間接費]
