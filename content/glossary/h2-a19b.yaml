category: 経営戦略
terms:
  - term: CPA
    reading: シーピーエー
    simple: 顧客や購入を 1 件獲得するのにかかった広告費のことです。
    definition: Cost Per Action の略で、広告費をコンバージョン（購入・申込みなどの成果）の件数で割った、成果 1 件当たりの獲得単価。クリック単価（CPC）とは分母が異なり、最終的な成果に対する費用を示す。
    related: [CPC, コンバージョン率]
  - term: CPC
    reading: シーピーシー
    simple: 広告が 1 回クリックされるごとにかかる費用のことです。
    definition: Cost Per Click の略で、広告費をクリック数で割った、クリック 1 件当たりの単価。リスティング広告などで用いられ、クリックから成果に至る割合（コンバージョン率）と合わせて、獲得単価（CPA）の計算の基礎になる。
    related: [CPA, コンバージョン率]
  - term: LTV
    reading: エルティーブイ
    simple: 1 人の顧客が、取引の続く期間全体でもたらす利益の合計のことです。
    definition: Life Time Value（顧客生涯価値）の略で、顧客が取引を始めてから終わるまでの期間に、その企業にもたらす利益の合計。単価・粗利率・継続期間などから見積もる。顧客獲得コスト（CAC）との比較で、獲得の投資が回収できるかを判断する。
    related: [CAC, チャーン率]
  - term: CAC
    reading: シーエーシー
    simple: 新しい顧客を 1 人獲得するためにかかった費用のことです。
    definition: Customer Acquisition Cost（顧客獲得コスト）の略で、広告費や営業費などの獲得にかかった費用を、新規顧客の数で割ったもの。顧客生涯価値（LTV）と比較され、LTV が CAC を十分に上回ることが、事業の健全性の目安になる。
    related: [LTV, CPA]
  - term: 粗利
    reading: あらり
    simple: 売上から、仕入れや製造などの原価を引いた利益のことです。
    definition: 売上高から売上原価を差し引いた利益（売上総利益）。販管費などを差し引く前の利益であり、顧客生涯価値（LTV）の見積もりでは、売上ではなくこの粗利を基礎に置くのが原則である。
    related: [LTV]
  - term: バリューイノベーション
    reading: バリューイノベーション
    simple: 要素の取捨選択を組み替えて、独自の価値と低コストを同時に実現することです。
    definition: ブルーオーシャン戦略の中核となる考え方（価値革新）で、業界の常識的な要素を減らす・やめることでコストを下げ、同時に新しい要素を加えることで買い手への価値を高め、差別化と低コストを両立させる。
    related: [ブルーオーシャン戦略, 差別化戦略]
  - term: ファイブフォース
    reading: ファイブフォース
    simple: 業界の競争の圧力を、5 つの力で分析する枠組みです。
    definition: ポーターが提唱した業界分析の枠組みで、業界内の競争、新規参入の脅威、代替品の脅威、買い手の交渉力、売り手の交渉力の5つの要因から、業界の収益性を決める力関係を分析する。
    related: [代替品]
  - term: 代替品
    reading: だいたいひん
    simple: 別の方法や素材で、同じ用事を果たしてしまう製品のことです。
    definition: 自社の製品とは異なる製品でありながら、顧客の同じニーズを満たし、需要を奪い合う関係にあるもの。ファイブフォース分析では「代替品の脅威」として、自社製品の価格や利益に上限を画する圧力になる。
    related: [ファイブフォース]
  - term: 垂直統合
    reading: すいちょくとうごう
    simple: 部品の供給元や販売先など、前後の段階の事業を取り込むことです。
    definition: バリューチェーンの前後の段階にある事業を、自社の事業として取り込むこと。供給側を取り込む川上への統合と、販売・流通側を取り込む川下への統合がある。供給の安定、品質の統制、顧客接点の確保などが狙いになる。
    related: [バリューチェーン]
  - term: チャーン率
    reading: チャーンりつ
    simple: 一定期間のうちに、解約していく顧客の割合のことです。
    definition: 定額制サービスなどで、期間の初めにいた顧客のうち、その期間に解約した顧客の割合（解約率）。一定のチャーン率の下では、平均継続期間はチャーン率の逆数で見積もることができ、顧客生涯価値（LTV）に直結する指標である。
    related: [解約率, LTV]
  - term: 解約率
    reading: かいやくりつ
    simple: 契約している顧客のうち、解約する人の割合のことです。
    definition: 一定期間に解約した顧客数を、その期間の初めの顧客数で割った割合。チャーン率ともいう。定額制サービスでは、解約率が平均継続期間と顧客生涯価値（LTV）を決める中心的な指標になる。
    related: [チャーン率, LTV]
