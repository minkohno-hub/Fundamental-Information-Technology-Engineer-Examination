category: ソフトウェア・ハードウェア
terms:
  - term: セキュアOS
    reading: セキュアオーエス
    aliases: [強制アクセス制御, MAC（強制アクセス制御）, SELinux]
    simple: 管理者でも決められた範囲を超える操作ができないようにして、安全性を高めた OS です。
    definition: 強制アクセス制御や最小特権の仕組みを備え、セキュリティポリシーに基づいて管理者を含むすべての主体の操作を制限する OS。
    related: [アクセス制御, カーネル]
  - term: カーネル
    reading: カーネル
    aliases: [マイクロカーネル, モノリシックカーネル, カーネルモード, ユーザーモード, 特権モード, システムコール]
    simple: OS の中心部分で、CPU やメモリなどの資源を管理し、ハードウェアを直接制御します。
    definition: OS の中核としてプロセス・メモリ・入出力などの資源を管理する部分。最小限の機能だけをもつマイクロカーネルと、主要機能をすべて含むモノリシックカーネルがある。カーネルは特権モード（カーネルモード）、アプリケーションはユーザーモードで動作し、システムコールでカーネルに処理を依頼する。
    related: [シェル, タスク管理]
  - term: ブートストラップ
    reading: ブートストラップ
    aliases: [ブート, ブートローダ, マルチブート, ネットワークブート]
    simple: 電源を入れたとき、小さなプログラムから順に読み込んで OS を起動する仕組みです。
    definition: ROM 内のファームウェアがブートローダを読み込み、ブートローダが OS を読み込むといった段階的な起動の仕組み。
    related: [カーネル]
  - term: ジョブ管理
    reading: ジョブかんり
    aliases: [ジョブスケジューラー, ジョブ]
    simple: 利用者から頼まれた仕事（ジョブ）を受け付けて、実行の順番や時刻を決めて管理する OS の機能です。
    definition: ジョブの受付、実行順序の決定（スケジューリング）、実行、結果の出力までを制御する OS の機能。
    related: [タスク管理, バッチ処理]
  - term: タスク管理
    reading: タスクかんり
    aliases: [プロセス, スレッド, 実行状態, 実行可能状態, 待ち状態, ディスパッチ, プリエンプティブ, ノンプリエンプティブ, タスク]
    simple: 同時に動くたくさんの処理（タスク）に、順番に CPU を割り当てて管理する OS の機能です。
    definition: タスク（プロセス）の生成・状態遷移・CPU 割当てを管理する OS の機能。状態は実行・実行可能・待ちの3つが基本。実行中のタスクから CPU を取り上げられる方式をプリエンプティブという。プロセスは資源の割当て単位、スレッドはプロセス内の実行単位でメモリ空間を共有する。
    related: [ラウンドロビン, ジョブ管理]
  - term: ラウンドロビン
    reading: ラウンドロビン
    aliases: [タイムスライス, タイムクウォンタム, 到着順方式, 優先順方式, 処理時間順方式]
    simple: 順番に少しずつ CPU を使わせる、公平なタスクの割当て方式です。
    definition: 実行可能なタスクに一定時間（タイムクウォンタム）ずつ順番に CPU を割り当て、使い切ったタスクを待ち行列の末尾に戻すスケジューリング方式。
    related: [タスク管理]
  - term: ファイルシステム
    reading: ファイルシステム
    aliases: [FAT, NTFS, ジャーナリング, データ管理]
    simple: ディスク上のデータを「ファイル」として整理し、名前で扱えるようにする仕組みです。
    definition: 記憶装置上のデータをファイルとディレクトリで管理する OS の仕組み。FAT は単純で互換性が高い。NTFS はアクセス権・暗号化・ジャーナリングなどの機能をもつ。
    related: [ディレクトリ]
  - term: スプーリング
    reading: スプーリング
    aliases: [スプール, バッファリング]
    simple: 印刷などの遅い装置への出力をいったんディスクにため、CPU をすぐ次の仕事に使えるようにする仕組みです。
    definition: 低速な入出力装置とのデータ転送を、高速な補助記憶装置を介して非同期に行う仕組み。CPU の待ち時間を減らしスループットを向上させる。
    related: [タスク管理]
  - term: 記憶管理
    reading: きおくかんり
    aliases: [コンパクション, ガベージコレクション, スワッピング, スワップアウト, スワップイン, ロールイン, ロールアウト, オーバーレイ, メモリリーク]
    simple: プログラムに主記憶の場所を割り当てたり、使い終わった場所を回収したりする OS の機能です。
    definition: 主記憶の割当て・解放を管理する OS の機能。断片化した空き領域をまとめるコンパクション、不要になった領域を自動回収するガベージコレクション、主記憶と補助記憶の間でプログラムを入れ替えるスワッピングなどがある。解放されずに残る領域が増える不具合をメモリリークという。
    related: [仮想記憶]
  - term: 仮想記憶
    reading: かそうきおく
    aliases: [ページング, ページ, ページイン, ページアウト, ページ置換え, 動的アドレス変換, セグメント方式]
    simple: ディスクの一部を使って、実際の主記憶より大きなメモリがあるように見せる仕組みです。
    definition: 補助記憶を利用して主記憶容量より大きな論理アドレス空間を提供する方式。固定長のページ単位で管理するページング方式では、主記憶にないページを参照するとページフォールトが発生し、ページの置換え（LRU、FIFO など）が行われる。
    related: [LRU, スラッシング, 記憶管理]
  - term: LRU
    reading: エルアールユー
    fullName: Least Recently Used
    japanese: 最も長く使われていないもの
    aliases: [FIFO（ページ置換え）, LFU]
    words:
      - { en: Least, ja: 最も少なく }
      - { en: Recently, ja: 最近に }
      - { en: Used, ja: 使われた }
    simple: 一番長い間使われていないものから追い出す方式です。
    definition: 最後に参照された時刻が最も古いページ（データ）を置換えの対象とするアルゴリズム。キャッシュや仮想記憶で用いる。FIFO は最も古く読み込んだものを、LFU は参照回数が最も少ないものを置き換える。
    related: [仮想記憶]
  - term: スラッシング
    reading: スラッシング
    simple: ページの入替えばかりが頻繁に起きて、肝心の処理がほとんど進まなくなる状態です。
    definition: 仮想記憶システムでページフォールトが多発し、ページング処理にシステムの時間の大半が費やされてスループットが極端に低下する現象。
    related: [仮想記憶]
  - term: TCP/IP
    reading: ティーシーピーアイピー
    fullName: Transmission Control Protocol / Internet Protocol
    japanese: 伝送制御プロトコル／インターネットプロトコル
    words:
      - { en: Transmission, ja: 伝送 }
      - { en: Control, ja: 制御 }
      - { en: Protocol, ja: プロトコル（通信規約） }
      - { en: Internet, ja: インターネット（ネットワーク間の網） }
    simple: インターネットで使われている通信のルールの集まりです。
    definition: インターネットの標準となっている通信プロトコル群。アプリケーション層・トランスポート層・インターネット層・ネットワークインタフェース層の4階層で構成される。
    related: [TCP, IPアドレス, OSI基本参照モデル]
  - term: アクセス権
    reading: アクセスけん
    aliases: [パーミッション, ファイルアクセス権, 最小権限の原則, root, Administrator, スーパーユーザー]
    simple: 誰がファイルなどを「読む・書く・実行する」ことを許されているかの設定です。
    definition: 利用者やグループごとに、資源に対して許可する操作（読取り・書込み・実行など）を定めたもの。UNIX 系 OS では所有者・グループ・その他の3区分に rwx で設定する。必要最小限の権限だけを与えることを最小権限の原則という。
    related: [アクセス制御, セキュアOS]
  - term: アクセス制御
    reading: アクセスせいぎょ
    aliases: [任意アクセス制御, ロールベースアクセス制御, RBAC]
    simple: 決められた人だけが、決められた情報や機能を使えるように制限することです。
    definition: 主体（利用者・プロセス）による客体（ファイル・機能など）へのアクセスを、認可された範囲に制限する仕組み。所有者が設定する任意アクセス制御、ポリシーで強制する強制アクセス制御、役割に基づくロールベースアクセス制御などがある。
    related: [アクセス権, セキュアOS]
  - term: LDAP
    reading: エルダップ
    fullName: Lightweight Directory Access Protocol
    japanese: 軽量ディレクトリアクセスプロトコル
    aliases: [ディレクトリサービス]
    words:
      - { en: Lightweight, ja: 軽量の }
      - { en: Directory, ja: ディレクトリ（名簿・台帳） }
      - { en: Access, ja: アクセス }
      - { en: Protocol, ja: プロトコル（通信規約） }
    simple: 利用者のアカウントなどを一か所で管理する「名簿」のような仕組み（ディレクトリサービス）にアクセスするための通信手順です。
    definition: ネットワーク上のディレクトリサービス（利用者・機器などの情報を一元管理するデータベース）にアクセスするためのプロトコル。統合的な認証やアカウント管理に使われる。
    related: [アクセス権]
  - term: アカウンタビリティ
    reading: アカウンタビリティ
    aliases: [責任追跡性]
    simple: 誰が何をしたのかを、後から確実にたどれることです。
    definition: 情報セキュリティの特性の一つで、ある活動を行った主体を一意に特定し追跡できること（責任追跡性）。操作ログの記録などで実現する。
    related: [ログ管理]
  - term: ログ管理
    reading: ログかんり
    aliases: [ログ, ロギング, 監査証跡, オーディット]
    simple: システムの操作や出来事の記録（ログ）を取って保管し、確認できるようにすることです。
    definition: 利用者の操作、システムのイベント、通信などの記録を取得・保管・分析する活動。不正の検知、障害の原因究明、責任追跡に用いる。ログの改ざん防止と時刻の同期も重要。
    related: [アカウンタビリティ]
  - term: ダンプ
    reading: ダンプ
    aliases: [メモリダンプ, スナップショットダンプ]
    simple: ある時点のメモリの中身などをそのまま書き出したものです。障害の原因調査に使います。
    definition: 主記憶やレジスタなどの内容を出力したもの。障害時点の内容を出力するメモリダンプ、実行途中の指定時点の内容を出力するスナップショットダンプなどがある。
    related: [デバッグ]
  - term: ミドルウェア
    reading: ミドルウェア
    aliases: [TPモニター, トランザクション処理モニター]
    simple: OS とアプリの間で、多くのアプリに共通する機能を提供するソフトウェアです。
    definition: OS とアプリケーションの中間に位置し、DBMS、TP モニター、通信管理、Web サーバなど共通機能を提供するソフトウェア。
    related: [DBMS, API]
  - term: DBMS
    reading: ディービーエムエス
    fullName: DataBase Management System
    japanese: データベース管理システム
    words:
      - { en: DataBase, ja: データベース }
      - { en: Management, ja: 管理 }
      - { en: System, ja: システム }
    simple: データベースのデータを安全・効率的に保存し、検索や更新をできるようにするソフトウェアです。
    definition: データベースの定義・操作・制御を行うソフトウェア。同時実行制御、障害回復、機密保護、データの独立性などの機能をもつ。
    related: [ミドルウェア, SQL]
  - term: シェル
    reading: シェル
    aliases: [コマンドインタプリタ, シェルスクリプト]
    simple: 利用者が入力したコマンドを読み取って、OS に実行を頼むプログラムです。
    definition: 利用者のコマンドを解釈してカーネルの機能やプログラムを呼び出すコマンドインタプリタ。コマンドを並べたシェルスクリプトで処理を自動化できる。
    related: [カーネル]
  - term: API
    reading: エーピーアイ
    fullName: Application Programming Interface
    japanese: アプリケーションプログラミングインタフェース
    aliases: [Web API]
    words:
      - { en: Application, ja: アプリケーション（応用ソフト） }
      - { en: Programming, ja: プログラミング }
      - { en: Interface, ja: 接点・取り決め }
    simple: ソフトウェアの機能を、別のプログラムから呼び出して使うための窓口（取り決め）です。
    definition: ソフトウェアやサービスの機能を外部のプログラムから利用するための関数・手続・データ形式などの仕様。Web 経由で提供されるものを Web API という。
    related: [ライブラリ, ミドルウェア]
  - term: ライブラリ
    reading: ライブラリ
    aliases: [DLL, 動的リンク, 静的リンク, クラスライブラリ]
    simple: よく使う処理をまとめて、他のプログラムから使えるようにした部品の集まりです。
    definition: 再利用可能なプログラム部品の集合。実行ファイル作成時に結合する静的リンクと、実行時に結合する動的リンク（DLL など）がある。動的リンクは複数のプログラムで共有でき実行ファイルを小さくできる。
    related: [API, リンカ]
  - term: コンポーネントウェア
    reading: コンポーネントウェア
    aliases: [コンポーネント, CORBA]
    simple: 再利用できるソフトウェアの部品を組み合わせてアプリを作る考え方です。
    definition: 定められたインタフェースをもつ再利用可能なソフトウェア部品（コンポーネント）を組み合わせてアプリケーションを構築する手法。分散オブジェクトの連携仕様に CORBA がある。
    related: [ライブラリ]
  - term: 開発フレームワーク
    reading: かいはつフレームワーク
    aliases: [フレームワーク]
    simple: アプリ開発でよく使う処理の「枠組み」をまとめたもので、その枠に沿って作れば効率よく開発できます。
    definition: アプリケーションの共通的な構造・処理を提供するソフトウェアの枠組み。開発者は枠組みに従って個別の処理を実装する。
    related: [ライブラリ]
  - term: ディレクトリ
    reading: ディレクトリ
    aliases: [フォルダ, 絶対パス, 相対パス, カレントディレクトリ, ルートディレクトリ, シンボリックリンク, パス]
    simple: ファイルを分類して入れておく入れ物（フォルダ）です。階層状に整理できます。
    definition: ファイルを階層的に管理するための仕組み。ルートディレクトリからの経路を絶対パス、カレントディレクトリからの経路を相対パスという（「..」は親ディレクトリ）。他のファイルのパスを記録した参照用のファイルをシンボリックリンクという。
    related: [ファイルシステム]
  - term: ファイル編成
    reading: ファイルへんせい
    aliases: [順編成, 直接編成, 索引順編成, あふれ域]
    simple: ファイルの中にデータ（レコード）をどう並べて記録するかの方式です。
    definition: レコードの格納・アクセス方式。順編成（順次アクセス）、直接編成（キーから算出したアドレスに格納）、索引順編成（基本データ域・索引域・あふれ域をもち、順次と直接の両方が可能）などがある。
    related: [ファイルシステム]
  - term: バックアップ
    reading: バックアップ
    aliases: [フルバックアップ, 差分バックアップ, 増分バックアップ, 3-2-1ルール]
    simple: データが失われたときに備えて、別の場所にコピーを取っておくことです。
    definition: データの複製を取得・保管すること。全データを保存するフルバックアップ、前回のフル以降の変更を保存する差分バックアップ、前回のバックアップ以降の変更を保存する増分バックアップがある。3つのコピーを2種類の媒体に保存し1つは遠隔地に置く 3-2-1 ルールが推奨される。
    related: [ランサムウェア]
  - term: ローコード開発
    reading: ローコードかいはつ
    aliases: [ノーコード開発, ローコードツール, ノーコードツール, EUD, EUC]
    simple: 画面の部品を並べたり設定したりして、プログラムをほとんど書かずにアプリを作る方法です。
    definition: GUI による部品の配置や設定でアプリケーションを構築し、手書きのコードを最小限にする開発手法。コードを書かないものをノーコード開発という。利用部門が自ら開発する EUD にも使われる。
    related: [開発フレームワーク]
  - term: ICE
    reading: アイス
    fullName: In-Circuit Emulator
    japanese: インサーキットエミュレーター
    aliases: [エミュレーター, シミュレーター（開発ツール）]
    words:
      - { en: In-Circuit, ja: 回路の中で（実機の基板に接続して） }
      - { en: Emulator, ja: エミュレーター（他の機器の動作をまねるもの） }
    simple: 組込み機器の基板につないで、マイコンの動きを観察・制御しながらプログラムの誤りを探す装置です。
    definition: 対象のマイクロプロセッサの代わりに回路に接続し、その動作を模倣してプログラムの実行制御や内部状態の観察を可能にするハードウェアデバッグツール。
    related: [デバッグ]
  - term: リンカ
    reading: リンカ
    aliases: [連係編集プログラム, ローダ, ロードモジュール, 目的プログラム, 原始プログラム, ソースプログラム, プリプロセッサ, 実行時コンパイラ, JITコンパイラ, クロスコンパイラ, インタプリタ, アセンブラ]
    simple: 別々に翻訳されたプログラムの部品を1つにつなぎ合わせて、実行できるファイルを作るツールです。
    definition: 複数の目的プログラムやライブラリを結合してロードモジュールを作成する言語処理ツール。ロードモジュールを主記憶に読み込むのはローダ。他に、前処理を行うプリプロセッサ、実行時に機械語へ変換する JIT コンパイラ、別アーキテクチャ向けのコードを作るクロスコンパイラなどがある。
    related: [コンパイラ, ライブラリ]
  - term: OSS
    reading: オーエスエス
    fullName: Open Source Software
    japanese: オープンソースソフトウェア
    aliases: [オープンソース, BSDライセンス, MITライセンス, Apacheライセンス, MPL, デュアルライセンス]
    words:
      - { en: Open, ja: 公開された }
      - { en: Source, ja: ソース（ソースコード） }
      - { en: Software, ja: ソフトウェア }
    simple: ソースコードが公開されていて、決められた条件のもとで誰でも利用・改変・再配布できるソフトウェアです。
    definition: ソースコードが公開され、ライセンスの条件の下で利用・改変・再頒布が認められるソフトウェア。コピーレフト型の GPL、制約の緩い BSD・MIT・Apache ライセンスなどがある。
    related: [GPL, Linux, SBOM]
  - term: GPL
    reading: ジーピーエル
    fullName: GNU General Public License
    japanese: GNU 一般公衆利用許諾書
    aliases: [コピーレフト]
    words:
      - { en: GNU, ja: グヌー（自由なソフトウェアを開発するプロジェクト名） }
      - { en: General, ja: 一般の }
      - { en: Public, ja: 公衆の }
      - { en: License, ja: 利用許諾 }
    simple: 改変して配布するときは、改変版のソースコードも同じ条件で公開しなければならない OSS のライセンスです。
    definition: 利用・改変・再頒布の自由を認め、派生物の頒布時には同一ライセンスでソースコードの公開を求めるコピーレフト型のライセンス。
    related: [OSS]
  - term: Linux
    reading: リナックス
    aliases: [ディストリビューション, UNIX, FreeBSD, Android]
    simple: 誰でも使えて改良できる、UNIX に似た OS です。サーバやスマートフォンの土台に使われています。
    definition: オープンソースで開発される UNIX 互換の OS カーネル。カーネルに各種ソフトウェアを組み合わせたディストリビューションとして配布される。Android のカーネルにも使われる。
    related: [OSS, カーネル]
  - term: SBOM
    reading: エスボム
    fullName: Software Bill of Materials
    japanese: ソフトウェア部品表
    words:
      - { en: Software, ja: ソフトウェア }
      - { en: Bill of Materials, ja: 部品表 }
    simple: ソフトウェアがどんな部品（ライブラリなど）でできているかを一覧にした表です。
    definition: ソフトウェアを構成するコンポーネント（OSS を含む）とその版・ライセンス・依存関係などを列挙した一覧。脆弱性の影響範囲の把握やライセンス管理に用いる。
    related: [OSS, 脆弱性]
  - term: デバッグ
    reading: デバッグ
    aliases: [デバッガ, ブレークポイント, トレーサー, インスペクター, アサーション]
    simple: プログラムの誤り（バグ）の原因を見つけて直す作業です。
    definition: プログラムの誤りを特定し修正する作業。実行を止めるブレークポイント、実行過程を記録するトレーサー、変数の内容を確認するインスペクター、成り立つべき条件を検査するアサーションなどを用いる。
    related: [ダンプ, ICE]
  - term: PWM制御
    reading: ピーダブリューエムせいぎょ
    fullName: Pulse Width Modulation
    japanese: パルス幅変調
    aliases: [デューティ比]
    words:
      - { en: Pulse, ja: パルス（短い信号） }
      - { en: Width, ja: 幅 }
      - { en: Modulation, ja: 変調 }
    simple: オンとオフを素早く繰り返し、オンの時間の割合を変えることで、モーターの速さや LED の明るさを調整する方法です。
    definition: 一定周期のパルスのデューティ比（オン時間÷周期）を変えて平均出力を制御する方式。
    related: [フィードバック制御]
  - term: FPGA
    reading: エフピージーエー
    fullName: Field Programmable Gate Array
    japanese: 現場でプログラム可能なゲートアレイ
    aliases: [ASIC]
    words:
      - { en: Field, ja: 現場（製造後の利用者の手元） }
      - { en: Programmable, ja: プログラムで設定できる }
      - { en: Gate Array, ja: 論理ゲートを並べたもの }
    simple: 買ったあとで、中の回路の構成を自分で書き換えられる半導体チップです。
    definition: 製造後に論理回路の構成を利用者がプログラムで設定・変更できる集積回路。特定用途向けに回路を固定した ASIC と対比される。
    related: [集積回路]
  - term: 集積回路
    reading: しゅうせきかいろ
    aliases: [IC, LSI, VLSI, トランジスタ, ダイオード, LED]
    simple: たくさんのトランジスタなどの部品を、小さなチップ1枚に詰め込んだ電子回路です。
    definition: トランジスタ・ダイオード・抵抗などの素子を1つの基板上に集積した回路。集積度により IC・LSI・VLSI などと呼ぶ。トランジスタは増幅・スイッチ、ダイオードは整流、LED は発光の働きをもつ。
    related: [FPGA]
  - term: 消費電力
    reading: しょうひでんりょく
    aliases: [DVFS, クロックゲーティング, パワーゲーティング]
    simple: 機器が動作するのに使う電力です。電圧や動作の速さを下げると減らせます。
    definition: CMOS 回路の動的消費電力はおおむね C×V²×f に比例する。電圧と周波数を負荷に応じて下げる DVFS、未使用回路へのクロックを止めるクロックゲーティング、電源を遮断するパワーゲーティングなどで削減する。
    related: [集積回路]
