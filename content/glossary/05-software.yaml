category: ソフトウェア・ハードウェア
terms:
  - term: セキュアOS
    reading: セキュアオーエス
    simple: 管理者でも決められた範囲を超える操作ができないようにして、安全性を高めた OS です。
    definition: 強制アクセス制御や最小特権の仕組みを備え、セキュリティポリシーに基づいて管理者を含むすべての主体の操作を制限する OS。
    related: [アクセス制御, カーネル]
  - term: カーネル
    reading: カーネル
    simple: OS の中心部分で、CPU やメモリなどの資源を管理し、ハードウェアを直接制御します。
    definition: OS の中核としてプロセス・メモリ・入出力などの資源を管理する部分。最小限の機能だけをもつマイクロカーネルと、主要機能をすべて含むモノリシックカーネルがある。カーネルは特権モード（カーネルモード）、アプリケーションはユーザーモードで動作し、システムコールでカーネルに処理を依頼する。
    related: [シェル, タスク管理]
  - term: ブートストラップ
    reading: ブートストラップ
    aliases: [ブート]
    simple: 電源を入れたとき、小さなプログラムから順に読み込んで OS を起動する仕組みです。
    definition: ROM 内のファームウェアがブートローダを読み込み、ブートローダが OS を読み込むといった段階的な起動の仕組み。
    related: [カーネル]
  - term: ジョブ管理
    reading: ジョブかんり
    simple: 利用者から頼まれた仕事（ジョブ）を受け付けて、実行の順番や時刻を決めて管理する OS の機能です。
    definition: ジョブの受付、実行順序の決定（スケジューリング）、実行、結果の出力までを制御する OS の機能。
    related: [タスク管理, バッチ処理]
  - term: タスク管理
    reading: タスクかんり
    simple: 同時に動くたくさんの処理（タスク）に、順番に CPU を割り当てて管理する OS の機能です。
    definition: タスク（プロセス）の生成・状態遷移・CPU 割当てを管理する OS の機能。状態は実行・実行可能・待ちの3つが基本。実行中のタスクから CPU を取り上げられる方式をプリエンプティブという。プロセスは資源の割当て単位、スレッドはプロセス内の実行単位でメモリ空間を共有する。
    related: [ラウンドロビン, ジョブ管理]
  - term: ラウンドロビン
    reading: ラウンドロビン
    simple: 順番に少しずつ CPU を使わせる、公平なタスクの割当て方式です。
    definition: 実行可能なタスクに一定時間（タイムクウォンタム）ずつ順番に CPU を割り当て、使い切ったタスクを待ち行列の末尾に戻すスケジューリング方式。
    related: [タスク管理]
  - term: ファイルシステム
    reading: ファイルシステム
    simple: ディスク上のデータを「ファイル」として整理し、名前で扱えるようにする仕組みです。
    definition: 記憶装置上のデータをファイルとディレクトリで管理する OS の仕組み。FAT は単純で互換性が高い。NTFS はアクセス権・暗号化・ジャーナリングなどの機能をもつ。
    related: [ディレクトリ]
  - term: スプーリング
    reading: スプーリング
    aliases: [スプール]
    simple: 印刷などの遅い装置への出力をいったんディスクにため、CPU をすぐ次の仕事に使えるようにする仕組みです。
    definition: 低速な入出力装置とのデータ転送を、高速な補助記憶装置を介して非同期に行う仕組み。CPU の待ち時間を減らしスループットを向上させる。
    related: [タスク管理]
  - term: 記憶管理
    reading: きおくかんり
    simple: プログラムに主記憶の場所を割り当てたり、使い終わった場所を回収したりする OS の機能です。
    definition: 主記憶の割当て・解放を管理する OS の機能。断片化した空き領域をまとめるコンパクション、不要になった領域を自動回収するガベージコレクション、主記憶と補助記憶の間でプログラムを入れ替えるスワッピングなどがある。解放されずに残る領域が増える不具合をメモリリークという。
    related: [仮想記憶]
  - term: 仮想記憶
    reading: かそうきおく
    simple: ディスクの一部を使って、実際の主記憶より大きなメモリがあるように見せる仕組みです。
    definition: 補助記憶を利用して主記憶容量より大きな論理アドレス空間を提供する方式。固定長のページ単位で管理するページング方式では、主記憶にないページを参照するとページフォールトが発生し、ページの置換え（LRU、FIFO など）が行われる。
    related: [LRU, スラッシング, 記憶管理]
  - term: LRU
    reading: エルアールユー
    fullName: Least Recently Used
    japanese: 最も長く使われていないもの
    words:
      - { en: Least, ja: 最も少なく }
      - { en: Recently, ja: 最近に }
      - { en: Used, ja: 使われた }
    simple: 一番長い間使われていないものから追い出す方式です。
    definition: 最後に参照された時刻が最も古いページ（データ）を置換えの対象とするアルゴリズム。キャッシュや仮想記憶で用いる。FIFO は最も古く読み込んだものを、LFU は参照回数が最も少ないものを置き換える。
    related: [仮想記憶]
  - term: スラッシング
    reading: スラッシング
    simple: ページの入替えばかりが頻繁に起きて、肝心の処理がほとんど進まなくなる状態です。
    definition: 仮想記憶システムでページフォールトが多発し、ページング処理にシステムの時間の大半が費やされてスループットが極端に低下する現象。
    related: [仮想記憶]
  - term: TCP/IP
    reading: ティーシーピーアイピー
    fullName: Transmission Control Protocol / Internet Protocol
    japanese: 伝送制御プロトコル／インターネットプロトコル
    words:
      - { en: Transmission, ja: 伝送 }
      - { en: Control, ja: 制御 }
      - { en: Protocol, ja: プロトコル（通信規約） }
      - { en: Internet, ja: インターネット（ネットワーク間の網） }
    simple: インターネットで使われている通信のルールの集まりです。
    definition: インターネットの標準となっている通信プロトコル群。アプリケーション層・トランスポート層・インターネット層・ネットワークインタフェース層の4階層で構成される。
    related: [TCP, IPアドレス, OSI基本参照モデル]
  - term: アクセス権
    reading: アクセスけん
    aliases: [パーミッション, ファイルアクセス権]
    simple: 誰がファイルなどを「読む・書く・実行する」ことを許されているかの設定です。
    definition: 利用者やグループごとに、資源に対して許可する操作（読取り・書込み・実行など）を定めたもの。UNIX 系 OS では所有者・グループ・その他の3区分に rwx で設定する。必要最小限の権限だけを与えることを最小権限の原則という。
    related: [アクセス制御, セキュアOS]
  - term: アクセス制御
    reading: アクセスせいぎょ
    simple: 決められた人だけが、決められた情報や機能を使えるように制限することです。
    definition: 主体（利用者・プロセス）による客体（ファイル・機能など）へのアクセスを、認可された範囲に制限する仕組み。所有者が設定する任意アクセス制御、ポリシーで強制する強制アクセス制御、役割に基づくロールベースアクセス制御などがある。
    related: [アクセス権, セキュアOS]
  - term: LDAP
    reading: エルダップ
    fullName: Lightweight Directory Access Protocol
    japanese: 軽量ディレクトリアクセスプロトコル
    words:
      - { en: Lightweight, ja: 軽量の }
      - { en: Directory, ja: ディレクトリ（名簿・台帳） }
      - { en: Access, ja: アクセス }
      - { en: Protocol, ja: プロトコル（通信規約） }
    simple: 利用者のアカウントなどを一か所で管理する「名簿」のような仕組み（ディレクトリサービス）にアクセスするための通信手順です。
    definition: ネットワーク上のディレクトリサービス（利用者・機器などの情報を一元管理するデータベース）にアクセスするためのプロトコル。統合的な認証やアカウント管理に使われる。
    related: [アクセス権]
  - term: アカウンタビリティ
    reading: アカウンタビリティ
    aliases: [責任追跡性]
    simple: 誰が何をしたのかを、後から確実にたどれることです。
    definition: 情報セキュリティの特性の一つで、ある活動を行った主体を一意に特定し追跡できること（責任追跡性）。操作ログの記録などで実現する。
    related: [ログ管理]
  - term: ログ管理
    reading: ログかんり
    aliases: [ロギング]
    simple: システムの操作や出来事の記録（ログ）を取って保管し、確認できるようにすることです。
    definition: 利用者の操作、システムのイベント、通信などの記録を取得・保管・分析する活動。不正の検知、障害の原因究明、責任追跡に用いる。ログの改ざん防止と時刻の同期も重要。
    related: [アカウンタビリティ]
  - term: ダンプ
    reading: ダンプ
    aliases: [メモリダンプ]
    simple: ある時点のメモリの中身などをそのまま書き出したものです。障害の原因調査に使います。
    definition: 主記憶やレジスタなどの内容を出力したもの。障害時点の内容を出力するメモリダンプ、実行途中の指定時点の内容を出力するスナップショットダンプなどがある。
    related: [デバッグ]
  - term: ミドルウェア
    reading: ミドルウェア
    simple: OS とアプリの間で、多くのアプリに共通する機能を提供するソフトウェアです。
    definition: OS とアプリケーションの中間に位置し、DBMS、TP モニター、通信管理、Web サーバなど共通機能を提供するソフトウェア。
    related: [DBMS, API]
  - term: DBMS
    reading: ディービーエムエス
    fullName: DataBase Management System
    japanese: データベース管理システム
    words:
      - { en: DataBase, ja: データベース }
      - { en: Management, ja: 管理 }
      - { en: System, ja: システム }
    simple: データベースのデータを安全・効率的に保存し、検索や更新をできるようにするソフトウェアです。
    definition: データベースの定義・操作・制御を行うソフトウェア。同時実行制御、障害回復、機密保護、データの独立性などの機能をもつ。
    related: [ミドルウェア, SQL]
  - term: シェル
    reading: シェル
    aliases: [コマンドインタプリタ]
    simple: 利用者が入力したコマンドを読み取って、OS に実行を頼むプログラムです。
    definition: 利用者のコマンドを解釈してカーネルの機能やプログラムを呼び出すコマンドインタプリタ。コマンドを並べたシェルスクリプトで処理を自動化できる。
    related: [カーネル]
  - term: API
    reading: エーピーアイ
    fullName: Application Programming Interface
    japanese: アプリケーションプログラミングインタフェース
    words:
      - { en: Application, ja: アプリケーション（応用ソフト） }
      - { en: Programming, ja: プログラミング }
      - { en: Interface, ja: 接点・取り決め }
    simple: ソフトウェアの機能を、別のプログラムから呼び出して使うための窓口（取り決め）です。
    definition: ソフトウェアやサービスの機能を外部のプログラムから利用するための関数・手続・データ形式などの仕様。Web 経由で提供されるものを Web API という。
    related: [ライブラリ, ミドルウェア]
  - term: ライブラリ
    reading: ライブラリ
    simple: よく使う処理をまとめて、他のプログラムから使えるようにした部品の集まりです。
    definition: 再利用可能なプログラム部品の集合。実行ファイル作成時に結合する静的リンクと、実行時に結合する動的リンク（DLL など）がある。動的リンクは複数のプログラムで共有でき実行ファイルを小さくできる。
    related: [API, リンカ]
  - term: コンポーネントウェア
    reading: コンポーネントウェア
    simple: 再利用できるソフトウェアの部品を組み合わせてアプリを作る考え方です。
    definition: 定められたインタフェースをもつ再利用可能なソフトウェア部品（コンポーネント）を組み合わせてアプリケーションを構築する手法。分散オブジェクトの連携仕様に CORBA がある。
    related: [ライブラリ]
  - term: 開発フレームワーク
    reading: かいはつフレームワーク
    aliases: [フレームワーク]
    simple: アプリ開発でよく使う処理の「枠組み」をまとめたもので、その枠に沿って作れば効率よく開発できます。
    definition: アプリケーションの共通的な構造・処理を提供するソフトウェアの枠組み。開発者は枠組みに従って個別の処理を実装する。
    related: [ライブラリ]
  - term: ディレクトリ
    reading: ディレクトリ
    aliases: [フォルダ]
    simple: ファイルを分類して入れておく入れ物（フォルダ）です。階層状に整理できます。
    definition: ファイルを階層的に管理するための仕組み。ルートディレクトリからの経路を絶対パス、カレントディレクトリからの経路を相対パスという（「..」は親ディレクトリ）。他のファイルのパスを記録した参照用のファイルをシンボリックリンクという。
    related: [ファイルシステム]
  - term: ファイル編成
    reading: ファイルへんせい
    simple: ファイルの中にデータ（レコード）をどう並べて記録するかの方式です。
    definition: レコードの格納・アクセス方式。順編成（順次アクセス）、直接編成（キーから算出したアドレスに格納）、索引順編成（基本データ域・索引域・あふれ域をもち、順次と直接の両方が可能）などがある。
    related: [ファイルシステム]
  - term: バックアップ
    reading: バックアップ
    simple: データが失われたときに備えて、別の場所にコピーを取っておくことです。
    definition: データの複製を取得・保管すること。全データを保存するフルバックアップ、前回のフル以降の変更を保存する差分バックアップ、前回のバックアップ以降の変更を保存する増分バックアップがある。3つのコピーを2種類の媒体に保存し1つは遠隔地に置く 3-2-1 ルールが推奨される。
    related: [ランサムウェア]
  - term: ローコード開発
    reading: ローコードかいはつ
    aliases: [ローコードツール]
    simple: 画面の部品を並べたり設定したりして、プログラムをほとんど書かずにアプリを作る方法です。
    definition: GUI による部品の配置や設定でアプリケーションを構築し、手書きのコードを最小限にする開発手法。コードを書かないものをノーコード開発という。利用部門が自ら開発する EUD にも使われる。
    related: [開発フレームワーク]
  - term: ICE
    reading: アイス
    fullName: In-Circuit Emulator
    japanese: インサーキットエミュレーター
    words:
      - { en: In-Circuit, ja: 回路の中で（実機の基板に接続して） }
      - { en: Emulator, ja: エミュレーター（他の機器の動作をまねるもの） }
    simple: 組込み機器の基板につないで、マイコンの動きを観察・制御しながらプログラムの誤りを探す装置です。
    definition: 対象のマイクロプロセッサの代わりに回路に接続し、その動作を模倣してプログラムの実行制御や内部状態の観察を可能にするハードウェアデバッグツール。
    related: [デバッグ]
  - term: リンカ
    reading: リンカ
    aliases: [連係編集プログラム]
    simple: 別々に翻訳されたプログラムの部品を1つにつなぎ合わせて、実行できるファイルを作るツールです。
    definition: 複数の目的プログラムやライブラリを結合してロードモジュールを作成する言語処理ツール。ロードモジュールを主記憶に読み込むのはローダ。他に、前処理を行うプリプロセッサ、実行時に機械語へ変換する JIT コンパイラ、別アーキテクチャ向けのコードを作るクロスコンパイラなどがある。
    related: [コンパイラ, ライブラリ]
  - term: OSS
    reading: オーエスエス
    fullName: Open Source Software
    japanese: オープンソースソフトウェア
    aliases: [オープンソース]
    words:
      - { en: Open, ja: 公開された }
      - { en: Source, ja: ソース（ソースコード） }
      - { en: Software, ja: ソフトウェア }
    simple: ソースコードが公開されていて、決められた条件のもとで誰でも利用・改変・再配布できるソフトウェアです。
    definition: ソースコードが公開され、ライセンスの条件の下で利用・改変・再頒布が認められるソフトウェア。コピーレフト型の GPL、制約の緩い BSD・MIT・Apache ライセンスなどがある。
    related: [GPL, Linux, SBOM]
  - term: GPL
    reading: ジーピーエル
    fullName: GNU General Public License
    japanese: GNU 一般公衆利用許諾書
    words:
      - { en: GNU, ja: グヌー（自由なソフトウェアを開発するプロジェクト名） }
      - { en: General, ja: 一般の }
      - { en: Public, ja: 公衆の }
      - { en: License, ja: 利用許諾 }
    simple: 改変して配布するときは、改変版のソースコードも同じ条件で公開しなければならない OSS のライセンスです。
    definition: 利用・改変・再頒布の自由を認め、派生物の頒布時には同一ライセンスでソースコードの公開を求めるコピーレフト型のライセンス。
    related: [OSS]
  - term: Linux
    reading: リナックス
    simple: 誰でも使えて改良できる、UNIX に似た OS です。サーバやスマートフォンの土台に使われています。
    definition: オープンソースで開発される UNIX 互換の OS カーネル。カーネルに各種ソフトウェアを組み合わせたディストリビューションとして配布される。Android のカーネルにも使われる。
    related: [OSS, カーネル]
  - term: SBOM
    reading: エスボム
    fullName: Software Bill of Materials
    japanese: ソフトウェア部品表
    words:
      - { en: Software, ja: ソフトウェア }
      - { en: Bill of Materials, ja: 部品表 }
    simple: ソフトウェアがどんな部品（ライブラリなど）でできているかを一覧にした表です。
    definition: ソフトウェアを構成するコンポーネント（OSS を含む）とその版・ライセンス・依存関係などを列挙した一覧。脆弱性の影響範囲の把握やライセンス管理に用いる。
    related: [OSS, 脆弱性]
  - term: デバッグ
    reading: デバッグ
    simple: プログラムの誤り（バグ）の原因を見つけて直す作業です。
    definition: プログラムの誤りを特定し修正する作業。実行を止めるブレークポイント、実行過程を記録するトレーサー、変数の内容を確認するインスペクター、成り立つべき条件を検査するアサーションなどを用いる。
    related: [ダンプ, ICE]
  - term: PWM制御
    reading: ピーダブリューエムせいぎょ
    fullName: Pulse Width Modulation
    japanese: パルス幅変調
    words:
      - { en: Pulse, ja: パルス（短い信号） }
      - { en: Width, ja: 幅 }
      - { en: Modulation, ja: 変調 }
    simple: オンとオフを素早く繰り返し、オンの時間の割合を変えることで、モーターの速さや LED の明るさを調整する方法です。
    definition: 一定周期のパルスのデューティ比（オン時間÷周期）を変えて平均出力を制御する方式。
    related: [フィードバック制御]
  - term: FPGA
    reading: エフピージーエー
    fullName: Field Programmable Gate Array
    japanese: 現場でプログラム可能なゲートアレイ
    words:
      - { en: Field, ja: 現場（製造後の利用者の手元） }
      - { en: Programmable, ja: プログラムで設定できる }
      - { en: Gate Array, ja: 論理ゲートを並べたもの }
    simple: 買ったあとで、中の回路の構成を自分で書き換えられる半導体チップです。
    definition: 製造後に論理回路の構成を利用者がプログラムで設定・変更できる集積回路。特定用途向けに回路を固定した ASIC と対比される。
    related: [集積回路]
  - term: 集積回路
    reading: しゅうせきかいろ
    aliases: [IC]
    simple: たくさんのトランジスタなどの部品を、小さなチップ1枚に詰め込んだ電子回路です。
    definition: トランジスタ・ダイオード・抵抗などの素子を1つの基板上に集積した回路。集積度により IC・LSI・VLSI などと呼ぶ。トランジスタは増幅・スイッチ、ダイオードは整流、LED は発光の働きをもつ。
    related: [FPGA]
  - term: 消費電力
    reading: しょうひでんりょく
    simple: 機器が動作するのに使う電力です。電圧や動作の速さを下げると減らせます。
    definition: CMOS 回路の動的消費電力はおおむね C×V²×f に比例する。電圧と周波数を負荷に応じて下げる DVFS、未使用回路へのクロックを止めるクロックゲーティング、電源を遮断するパワーゲーティングなどで削減する。
    related: [集積回路]
  - term: 強制アクセス制御
    reading: きょうせいあくせすせいぎょ
    aliases: [MAC（強制アクセス制御）]
    simple: 管理者が決めたルールで、利用者本人にも変更できないアクセス制限をかける方式です。
    definition: システム管理者が設定したセキュリティポリシーに基づき、情報とアクセス主体に付けたラベルを比較して、所有者であっても変更できない形でアクセスを制御する方式。任意アクセス制御と対比される。
    related: [セキュアOS, アクセス制御, 任意アクセス制御]
  - term: SELinux
    reading: えすいーりなっくす
    fullName: Security-Enhanced Linux
    japanese: セキュリティ強化Linux
    words:
      - { en: Security-Enhanced, ja: セキュリティを強化した }
      - { en: Linux, ja: Linux }
    simple: Linuxに強制アクセス制御の仕組みを加えた、セキュアOSの実装です。
    definition: Linux カーネルに強制アクセス制御（MAC）の機能を追加したセキュリティ機構。プロセスごとにアクセスできる資源を細かく制限し、侵入されても被害を限定する。
    related: [セキュアOS, 強制アクセス制御, Linux]
  - term: マイクロカーネル
    reading: まいくろかーねる
    simple: OSの核となる機能を最小限にし、他の機能は外に出す構成のカーネルです。
    definition: メモリ管理やプロセス間通信など最小限の機能のみをカーネルに残し、ファイルシステムやデバイスドライバなどをユーザー空間のサーバとして動かす構成。信頼性や移植性が高い。
    related: [カーネル, モノリシックカーネル]
  - term: モノリシックカーネル
    reading: ものりしっくかーねる
    simple: OSの主要な機能をすべて1つの大きなカーネルにまとめた構成です。
    definition: プロセス管理、メモリ管理、ファイルシステム、デバイスドライバなどの機能を一体のカーネルとして実装する構成。処理が高速だが、障害の影響が大きい。Linux が代表例。
    related: [カーネル, マイクロカーネル]
  - term: カーネルモード
    reading: かーねるもーど
    aliases: [特権モード]
    simple: OSの核がすべての命令やハードウェアを自由に操作できる、特権をもった動作状態です。
    definition: CPU の動作モードの一つで、特権命令を含むすべての命令を実行でき、ハードウェアや全メモリにアクセスできる。OS のカーネルがこのモードで動作する。
    related: [カーネル, ユーザーモード, システムコール]
  - term: ユーザーモード
    reading: ゆーざーもーど
    simple: アプリケーションが動く、実行できる命令が制限された動作状態です。
    definition: CPU の動作モードの一つで、特権命令の実行や他のプロセスのメモリへのアクセスが禁止された状態。アプリケーションはこのモードで動作する。
    related: [カーネル, カーネルモード]
  - term: システムコール
    reading: しすてむこーる
    simple: アプリケーションがOSの機能を使うために呼び出す仕組みです。
    definition: アプリケーションがファイル操作やプロセス生成などの OS の機能を利用するために、カーネルに処理を依頼する呼出し。実行時にユーザーモードからカーネルモードに切り替わる。
    related: [カーネル, カーネルモード, SVC]
  - term: ブートローダ
    reading: ぶーとろーだ
    simple: OSを探して主記憶に読み込み、起動させるプログラムです。
    definition: コンピュータの起動時に実行され、補助記憶から OS のカーネルを主記憶に読み込んで実行を開始させるプログラム。
    related: [ブートストラップ, マルチブート]
  - term: マルチブート
    reading: まるちぶーと
    simple: "1台のパソコンに複数のOSを入れ、起動時に選べるようにすることです。"
    definition: "1台のコンピュータに複数の OS をインストールし、起動時に選択して起動する方式。"
    related: [ブートストラップ, ブートローダ]
  - term: ネットワークブート
    reading: ねっとわーくぶーと
    simple: ネットワーク上のサーバからOSを読み込んで起動する方式です。
    definition: 手元のディスクではなく、ネットワーク経由でサーバから OS のイメージを取得して起動する方式。シンクライアントなどで用いる。
    related: [ブートストラップ]
  - term: ジョブスケジューラー
    reading: じょぶすけじゅーらー
    simple: 実行するジョブの順序や開始時刻を管理して、自動的に実行させる仕組みです。
    definition: ジョブの実行順序、実行時刻、依存関係などを管理し、バッチ処理を自動的に実行するソフトウェア。
    related: [ジョブ管理, ジョブ]
  - term: ジョブ
    reading: じょぶ
    simple: 利用者がコンピュータに実行させる、ひとまとまりの仕事の単位です。
    definition: 利用者の視点から見た、コンピュータに処理させる作業の単位。1つ以上のジョブステップ（プログラムの実行）から構成される。
    related: [ジョブ管理, ジョブスケジューラー]
  - term: プロセス
    reading: ぷろせす
    simple: 実行中のプログラムのことです。
    definition: OS が資源（メモリ空間など）を割り当てて管理する、実行中のプログラムの単位。複数のスレッドをもつことができる。
    related: [タスク管理, スレッド, タスク]
  - term: スレッド
    reading: すれっど
    simple: プロセスの中で並行して動く、処理の流れの単位です。
    definition: プロセス内の実行の流れの単位。同一プロセス内のスレッドは主記憶などの資源を共有するため、プロセスより生成や切替えのコストが小さい。
    related: [タスク管理, プロセス]
  - term: 実行状態
    reading: じっこうじょうたい
    aliases: [RUN状態]
    simple: タスクがCPUを使って、実際に処理を実行している状態です。
    definition: タスクの状態の一つで、CPU が割り当てられて命令が実行されている状態。同時に1つのCPUにつき1つのタスクだけがこの状態になる。
    related: [タスク管理, 実行可能状態, 待ち状態]
  - term: 実行可能状態
    reading: じっこうかのうじょうたい
    aliases: [レディ状態]
    simple: 実行する準備はできていて、CPUが割り当てられるのを待っている状態です。
    definition: CPU 以外の実行に必要な資源がそろい、CPU が割り当てられれば直ちに実行できる状態。ディスパッチにより実行状態に移る。
    related: [タスク管理, 実行状態, 待ち状態, ディスパッチ]
  - term: 待ち状態
    reading: まちじょうたい
    simple: 入出力の完了など、何かの出来事を待っていて、実行できない状態です。
    definition: 入出力の完了やほかのタスクからの通知など、事象の発生を待っている状態。事象が発生すると実行可能状態に移る。
    related: [タスク管理, 実行状態, 実行可能状態]
  - term: ディスパッチ
    reading: でぃすぱっち
    simple: 実行可能状態のタスクの中から1つを選んで、CPUを割り当てることです。
    definition: 実行可能状態のタスクの中から、スケジューリング方式に従って1つを選び、CPU を割り当てて実行状態にすること。
    related: [タスク管理, 実行可能状態, プリエンプティブ]
  - term: プリエンプティブ
    reading: ぷりえんぷてぃぶ
    simple: 実行中のタスクからCPUを強制的に取り上げて、別のタスクに切り替えられる方式です。
    definition: 実行中のタスクから OS が CPU を強制的に取り上げて他のタスクに割り当てられるスケジューリング方式。タイムスライスの経過や優先度の高いタスクの到着で切り替える。
    related: [タスク管理, ノンプリエンプティブ, ラウンドロビン]
  - term: ノンプリエンプティブ
    reading: のんぷりえんぷてぃぶ
    simple: タスクが自分から終了や待ちに入るまで、CPUを取り上げられない方式です。
    definition: 実行中のタスクが自ら終了するか待ち状態に入るまで、CPU を取り上げない方式。実装が単純だが、長いタスクが他のタスクを待たせる。
    related: [タスク管理, プリエンプティブ]
  - term: タスク
    reading: たすく
    simple: OSがCPUの割当ての対象として扱う、処理の単位です。
    definition: OS がCPU の割当てなどの管理を行う処理の単位。プロセスやスレッドとほぼ同義に使われる。
    related: [タスク管理, プロセス, スレッド]
  - term: タイムスライス
    reading: たいむすらいす
    aliases: [タイムクウォンタム]
    simple: ラウンドロビンで、各タスクに割り当てる一定のCPU使用時間です。
    definition: ラウンドロビン方式で各タスクに 1 回ごとに割り当てる CPU の使用時間。この時間が経過するとタスクは中断され、次のタスクに切り替わる。タイムクウォンタムともいう。
    related: [ラウンドロビン, プリエンプティブ]
  - term: 到着順方式
    reading: とうちゃくじゅんほうしき
    aliases: [FCFS]
    simple: 到着した順番にタスクを処理する、スケジューリング方式です。
    definition: タスクが到着した順にCPUを割り当てるスケジューリング方式（FCFS）。単純で公平だが、長いタスクが先にあると後続が待たされる。
    related: [ラウンドロビン, 優先順方式, 処理時間順方式]
  - term: 優先順方式
    reading: ゆうせんじゅんほうしき
    aliases: [優先度順方式]
    simple: 優先度の高いタスクから先にCPUを割り当てる方式です。
    definition: タスクに付けた優先度が高い順にCPUを割り当てるスケジューリング方式。優先度の低いタスクが長く待たされる可能性がある。
    related: [ラウンドロビン, 到着順方式, 処理時間順方式]
  - term: 処理時間順方式
    reading: しょりじかんじゅんほうしき
    aliases: [SJF]
    simple: 処理時間の短いタスクから先にCPUを割り当てる方式です。
    definition: 処理に要する時間が短いタスクから順にCPUを割り当てるスケジューリング方式（SJF）。平均待ち時間を最小にできるが、処理時間の長いタスクが待たされ続けることがある。
    related: [ラウンドロビン, 到着順方式, 優先順方式]
  - term: FAT
    reading: ふぁっと
    fullName: File Allocation Table
    japanese: ファイル配置表
    words:
      - { en: File, ja: ファイル }
      - { en: Allocation, ja: 割当て }
      - { en: Table, ja: 表 }
    simple: ファイルがディスクのどこに置かれているかを表で管理するファイルシステムです。
    definition: ファイル配置表でファイルのデータブロックの連鎖を管理するファイルシステム。USB メモリや SD カードで広く使われる。ジャーナリング機能はない。
    related: [ファイルシステム, NTFS]
  - term: NTFS
    reading: えぬてぃーえふえす
    fullName: NT File System
    japanese: NTファイルシステム
    words:
      - { en: NT, ja: Windows NT }
      - { en: File System, ja: ファイルシステム }
    simple: Windowsで使われる、アクセス権やジャーナリングに対応したファイルシステムです。
    definition: Windows NT 系の OS で用いられるファイルシステム。アクセス制御、暗号化、ジャーナリングなどの機能をもつ。
    related: [ファイルシステム, FAT, ジャーナリング]
  - term: ジャーナリング
    reading: じゃーなりんぐ
    simple: ファイルシステムへの更新内容を先に記録しておき、障害後に整合性を回復しやすくする仕組みです。
    definition: ファイルシステムの更新内容（メタデータなど）を先にジャーナル（ログ）に書き込んでから実際に反映する仕組み。障害後にジャーナルを使って短時間で整合性を回復できる。
    related: [ファイルシステム, NTFS]
  - term: データ管理
    reading: でーたかんり
    simple: OSがファイルなどのデータを格納し、読み書きや保護を行う機能です。
    definition: OS の機能の一つで、ファイルやデータの格納・検索・入出力・保護を管理するもの。ファイルシステムによって実現される。
    related: [ファイルシステム]
  - term: バッファリング
    reading: ばっふぁりんぐ
    simple: 速度の違う装置の間で、データを一時的にためて調整する仕組みです。
    definition: 速度差のある装置間のデータ転送で、データを主記憶上の領域（バッファ）に一時的にためて、速度差を吸収する方式。
    related: [スプーリング]
  - term: コンパクション
    reading: こんぱくしょん
    simple: 細かく散らばった空き領域を集めて、大きな連続した空き領域にまとめる処理です。
    definition: 主記憶上で断片化した空き領域を、使用中の領域を移動させることで 1 つの連続した領域にまとめる処理。メモリコンパクションともいう。
    related: [記憶管理, ガベージコレクション]
  - term: ガベージコレクション
    reading: がべーじこれくしょん
    aliases: [GC]
    simple: 使われなくなったメモリ領域を自動的に見つけて、再利用できるようにする仕組みです。
    definition: プログラムが確保したあと、不要になった領域を自動的に検出して回収し、再利用可能にする仕組み。Java などの言語処理系に備わっている。
    related: [記憶管理, メモリリーク, コンパクション]
  - term: スワッピング
    reading: すわっぴんぐ
    simple: 主記憶が足りないとき、プログラム全体を主記憶と補助記憶の間で入れ替える方式です。
    definition: 主記憶と補助記憶の間でプログラム（プロセス）全体を退避・復帰させる方式。主記憶から追い出すことをスワップアウト、読み込むことをスワップインという。ページング方式はページ単位で行う点で異なる。
    related: [記憶管理, スワップアウト, スワップイン, 仮想記憶]
  - term: スワップアウト
    reading: すわっぷあうと
    aliases: [ロールアウト]
    simple: 実行中のプログラムを、主記憶から補助記憶へ退避させることです。
    definition: スワッピングで、主記憶上のプログラムを補助記憶に書き出すこと。ロールアウトともいう。
    related: [スワッピング, スワップイン]
  - term: スワップイン
    reading: すわっぷいん
    aliases: [ロールイン]
    simple: 補助記憶に退避していたプログラムを、主記憶へ戻すことです。
    definition: スワッピングで、補助記憶に退避されたプログラムを主記憶に読み込むこと。ロールインともいう。
    related: [スワッピング, スワップアウト]
  - term: オーバーレイ
    reading: おーばーれい
    simple: 大きなプログラムを分割し、必要な部分だけを同じ領域に順次読み込んで実行する方式です。
    definition: 主記憶より大きなプログラムを複数のセグメントに分け、同時には使わないセグメントを同じ領域に重ねて読み込む方式。プログラマが構成を指定する必要がある。
    related: [記憶管理, 仮想記憶]
  - term: メモリリーク
    reading: めもりりーく
    simple: 確保したメモリを解放し忘れて、使えるメモリが徐々に減っていく不具合です。
    definition: プログラムが動的に確保したメモリ領域を解放しないまま使用し続け、使用可能なメモリが徐々に減少する不具合。長時間の稼働で性能低下や異常終了を招く。
    related: [記憶管理, ガベージコレクション]
  - term: ページング
    reading: ぺーじんぐ
    simple: 記憶領域を一定の大きさのページに分けて、必要なページだけを主記憶に置く方式です。
    definition: 仮想記憶を固定長のページに分割し、必要なページだけを主記憶に配置して管理する方式。ページ単位でページインやページアウトを行う。
    related: [仮想記憶, ページ, セグメント方式]
  - term: ページ
    reading: ぺーじ
    simple: 仮想記憶で、記憶領域を等しい大きさに区切った単位です。
    definition: ページング方式で仮想記憶や主記憶を分割した固定長の領域。主記憶側の領域はページフレームと呼ぶ。
    related: [仮想記憶, ページング]
  - term: ページイン
    reading: ぺーじいん
    simple: 補助記憶にあるページを主記憶へ読み込むことです。
    definition: 仮想記憶方式で、必要なページを補助記憶から主記憶に読み込むこと。
    related: [仮想記憶, ページアウト, ページフォールト]
  - term: ページアウト
    reading: ぺーじあうと
    simple: 主記憶にあるページを補助記憶へ書き出すことです。
    definition: 仮想記憶方式で、主記憶上のページを補助記憶に書き出して主記憶の領域を空けること。
    related: [仮想記憶, ページイン, ページ置換え]
  - term: ページ置換え
    reading: ぺーじおきかえ
    simple: 主記憶が満杯のとき、どのページを追い出すかを決めて入れ替えることです。
    definition: 主記憶に空きがないときに、主記憶上のどのページを補助記憶に追い出すかを決めて入れ替える処理。アルゴリズムに FIFO、LRU、LFU などがある。
    related: [仮想記憶, LRU, ページアウト]
  - term: 動的アドレス変換
    reading: どうてきあどれすへんかん
    aliases: [DAT]
    simple: プログラムが使う仮想アドレスを、実行時に主記憶の実アドレスへ変換することです。
    definition: 仮想記憶方式で、プログラムの実行時に仮想アドレスを主記憶上の実アドレスへ変換する仕組み。ページテーブルなどを用いる。
    related: [仮想記憶, ページング]
  - term: セグメント方式
    reading: せぐめんとほうしき
    simple: 仮想記憶をプログラムの意味のまとまり(可変長)で区切って管理する方式です。
    definition: 仮想記憶をプログラムの論理的なまとまり（セグメント）という可変長の単位で管理する方式。ページング方式は固定長で分割する。
    related: [仮想記憶, ページング]
  - term: FIFO（ページ置換え）
    reading: ふぃふぉぺーじおきかえ
    simple: ページ置換えで、最も古く主記憶に入ったページから追い出す方式です。
    definition: ページ置換えアルゴリズムの一つで、主記憶に最初に読み込まれたページから追い出す方式。使用頻度を考慮しないため、よく使うページも追い出す場合がある。
    related: [LRU, ページ置換え, FIFO]
  - term: LFU
    reading: えるえふゆー
    fullName: Least Frequently Used
    japanese: 最も使用頻度の低いもの
    words:
      - { en: Least, ja: 最も〜でない }
      - { en: Frequently, ja: 頻繁に }
      - { en: Used, ja: 使用された }
    simple: ページ置換えで、使われた回数が最も少ないページを追い出す方式です。
    definition: ページ置換えアルゴリズムの一つで、参照回数が最も少ないページを追い出す方式。LRU が最終参照時刻に着目するのに対し、LFU は参照回数に着目する。
    related: [LRU, ページ置換え]
  - term: 最小権限の原則
    reading: さいしょうけんげんのげんそく
    simple: 利用者やプログラムには、仕事に必要な最小限の権限だけを与えるという考え方です。
    definition: 利用者やプロセスに、業務や処理に必要な最小限の権限のみを与える原則。侵害されたときの被害の範囲を限定できる。
    related: [アクセス権, アクセス制御]
  - term: スーパーユーザー
    reading: すーぱーゆーざー
    aliases: [root, Administrator]
    simple: システム内のすべての操作ができる、最高権限をもつ利用者です。
    definition: OS のすべての資源に対する操作権限をもつ特権ユーザー。UNIX 系では root、Windows では Administrator が該当する。
    related: [アクセス権, 最小権限の原則]
  - term: 任意アクセス制御
    reading: にんいあくせすせいぎょ
    aliases: [DAC]
    simple: 情報の所有者が、誰にアクセスを許すかを自分で決める方式です。
    definition: 情報の所有者が自分の判断で他の利用者へのアクセス権を設定できるアクセス制御方式。一般的な OS のファイルのアクセス権が該当する。強制アクセス制御と対比される。
    related: [アクセス制御, 強制アクセス制御]
  - term: ロールベースアクセス制御
    reading: ろーるべーすあくせすせいぎょ
    fullName: Role-Based Access Control
    japanese: ロールに基づくアクセス制御
    aliases: [RBAC]
    words:
      - { en: Role, ja: 役割 }
      - { en: Based, ja: 〜に基づく }
      - { en: Access Control, ja: アクセス制御 }
    simple: 利用者個人ではなく、役割(ロール)ごとにアクセス権を与える方式です。
    definition: アクセス権を個人ではなく役割（ロール）に与え、利用者にはロールを割り当てることで制御する方式。人事異動などの際、ロールの割当てを変えるだけで済む。
    related: [アクセス制御, 任意アクセス制御]
  - term: ディレクトリサービス
    reading: でぃれくとりさーびす
    simple: ネットワーク上の利用者や機器などの情報を一元的に管理し、検索できるようにするサービスです。
    definition: ネットワーク上の利用者、グループ、機器、資源などの情報を階層構造で一元管理し、検索や認証に利用できるようにするサービス。LDAP はそのアクセスプロトコル、Active Directory は実装の一つ。
    related: [LDAP]
  - term: ログ
    reading: ろぐ
    simple: システムの動作や利用者の操作などの履歴の記録です。
    definition: システムの動作、利用者の操作、アクセス、エラーなどを時系列に記録した履歴。障害の調査や不正の追跡に用いる。
    related: [ログ管理, 監査証跡]
  - term: 監査証跡
    reading: かんさしょうせき
    simple: 監査や不正の追跡のために、システムの処理や操作を記録として残したものです。
    definition: 情報システムでの処理や利用者の行為を事後に検証できるよう記録した、証拠となる記録（ログ、取引記録など）。
    related: [ログ管理, ログ, オーディット]
  - term: オーディット
    reading: おーでぃっと
    simple: 手順や記録が決まりどおりかを、第三者が調べることです。
    definition: 基準に照らして、業務やシステムが適切に行われているかを独立した立場で検証すること（監査）。
    related: [ログ管理, 監査証跡]
  - term: スナップショットダンプ
    reading: すなっぷしょっとだんぷ
    simple: 指定した時点の、必要な部分だけのメモリの内容を出力するダンプです。
    definition: プログラムの実行中の特定の時点で、必要な部分に限って主記憶やレジスタの内容を出力するダンプ。異常終了時に全体を出力するメモリダンプと対比される。
    related: [ダンプ, メモリダンプ]
  - term: TPモニター
    reading: てぃーぴーもにたー
    aliases: [トランザクション処理モニター]
    simple: 大量のトランザクションを効率よく処理し、整合性を保つためのミドルウェアです。
    definition: トランザクションのスケジューリング、資源の管理、障害回復などを行い、多数のトランザクションを効率的かつ確実に処理するミドルウェア。Transaction Processing monitor の略。
    related: [ミドルウェア, トランザクション]
  - term: シェルスクリプト
    reading: しぇるすくりぷと
    simple: シェルのコマンドを並べて書いた、自動実行用のプログラムです。
    definition: シェルが解釈するコマンドや制御構造を記述したスクリプト。定型作業の自動化に用いる。
    related: [シェル, スクリプト言語]
  - term: Web API
    reading: うぇぶえーぴーあい
    simple: HTTPなどを使って、Web経由でほかのサービスの機能を呼び出すためのAPIです。
    definition: HTTP/HTTPS を用いて、ネットワーク越しにサービスの機能やデータを呼び出す API。REST 形式で JSON などを返すものが多い。
    related: [API, HTTP, JSON]
  - term: DLL
    reading: でぃーえるえる
    fullName: Dynamic Link Library
    japanese: 動的リンクライブラリ
    words:
      - { en: Dynamic, ja: 動的な }
      - { en: Link, ja: 結合・リンク }
      - { en: Library, ja: ライブラリ }
    simple: 実行時にプログラムとつなげて使う、共有用のライブラリです。
    definition: 実行時に必要に応じてプログラムにリンクされて使われるライブラリ。複数のプログラムで共有でき、主記憶を節約できる。Windows での名称。
    related: [ライブラリ, 動的リンク]
  - term: 動的リンク
    reading: どうてきりんく
    simple: プログラムの実行時に、必要なライブラリをつなげる方式です。
    definition: プログラムの実行時（または起動時）にライブラリを結合する方式。実行ファイルが小さくなり、ライブラリを複数のプログラムで共有できる。
    related: [ライブラリ, 静的リンク, DLL]
  - term: 静的リンク
    reading: せいてきりんく
    simple: プログラムの作成時に、必要なライブラリを実行ファイルに組み込んでしまう方式です。
    definition: リンカがコンパイル後にライブラリの必要部分を実行ファイルに組み込む方式。実行環境にライブラリがなくても動くが、実行ファイルが大きくなる。
    related: [ライブラリ, 動的リンク, リンカ]
  - term: クラスライブラリ
    reading: くらすらいぶらり
    simple: オブジェクト指向言語で、よく使う機能をクラスの形でまとめたライブラリです。
    definition: オブジェクト指向言語で、再利用しやすいようにクラスとして部品化した機能の集まり。
    related: [ライブラリ, オブジェクト指向, クラス]
  - term: コンポーネント
    reading: こんぽーねんと
    simple: 再利用できるよう独立して作られた、ソフトウェアの部品です。
    definition: 他のソフトウェアに組み込んで再利用できるよう、独立性が高く作られたソフトウェアの部品。
    related: [コンポーネントウェア]
  - term: CORBA
    reading: こるば
    fullName: Common Object Request Broker Architecture
    japanese: 共通オブジェクトリクエストブローカアーキテクチャ
    words:
      - { en: Common, ja: 共通の }
      - { en: Object Request Broker, ja: オブジェクト間の要求の仲介役 }
      - { en: Architecture, ja: 設計構造 }
    simple: 異なる言語や環境で作られた分散オブジェクトどうしが呼び出し合えるようにする規格です。
    definition: OMG が策定した、ネットワーク上の分散オブジェクトを言語や OS の違いを越えて呼び出せるようにする仕様。ORB が要求を仲介する。
    related: [コンポーネントウェア, RPC]
  - term: 絶対パス
    reading: ぜったいぱす
    simple: ルートディレクトリを起点にして、ファイルの場所を示す表し方です。
    definition: ルートディレクトリから目的のファイルやディレクトリまでの経路をすべて記述した表記。カレントディレクトリによらず同じ場所を指す。
    related: [ディレクトリ, 相対パス, パス]
  - term: 相対パス
    reading: そうたいぱす
    simple: カレントディレクトリを起点にして、ファイルの場所を示す表し方です。
    definition: カレントディレクトリを起点に、目的のファイルやディレクトリまでの経路を記述した表記。起点が変われば指す場所も変わる。
    related: [ディレクトリ, 絶対パス, カレントディレクトリ]
  - term: カレントディレクトリ
    reading: かれんとでぃれくとり
    simple: 今、作業の基準になっているディレクトリです。
    definition: 利用者やプログラムが現在作業の対象としている（基準になっている）ディレクトリ。相対パスの起点となる。
    related: [ディレクトリ, 相対パス]
  - term: ルートディレクトリ
    reading: るーとでぃれくとり
    simple: ディレクトリ階層の一番上にあるディレクトリです。
    definition: 階層構造をもつディレクトリの最上位のディレクトリ。絶対パスの起点となる。
    related: [ディレクトリ, 絶対パス]
  - term: シンボリックリンク
    reading: しんぼりっくりんく
    simple: 別のファイルやディレクトリの場所を指し示す、ショートカットのような特殊なファイルです。
    definition: 別のファイルやディレクトリのパスを内容とし、参照時にそのパス先へ解決される特殊なファイル。UNIX 系 OS で使われ、リンク先が削除されると無効になる。
    related: [ディレクトリ, 絶対パス]
  - term: パス
    reading: ぱす
    simple: ファイルやディレクトリの場所を、道筋で表したものです。
    definition: ファイルシステム上で、ファイルやディレクトリの場所を示す経路の表記。絶対パスと相対パスがある。
    related: [ディレクトリ, 絶対パス, 相対パス]
  - term: 順編成
    reading: じゅんへんせい
    simple: データを書き込んだ順に並べて格納するファイル編成です。
    definition: レコードを格納した順に並べるファイル編成。順次アクセスに適するが、特定のレコードの検索には先頭から読む必要がある。
    related: [ファイル編成, 直接編成, 索引順編成]
  - term: 直接編成
    reading: ちょくせつへんせい
    simple: キーから計算した位置に直接データを格納する、ランダムアクセスに強いファイル編成です。
    definition: キー値から計算した位置（アドレス）に直接レコードを格納するファイル編成。ランダムアクセスは高速だが、順次アクセスには向かない。ハッシュ法を使う。
    related: [ファイル編成, 順編成, 索引順編成]
  - term: 索引順編成
    reading: さくいんじゅんへんせい
    simple: 索引を使ってランダムアクセスでき、順次アクセスもできるファイル編成です。
    definition: キー順に並べたデータと、それを指す索引（インデックス）をもつファイル編成。順次アクセスとランダムアクセスの両方に適する。
    related: [ファイル編成, 順編成, 直接編成, あふれ域]
  - term: あふれ域
    reading: あふれいき
    aliases: [オーバーフロー領域]
    simple: 索引順編成で、追加されたレコードを格納しきれなくなったときの予備領域です。
    definition: 索引順編成ファイルで、レコードの追加によって元の領域に格納できなくなったレコードを格納する領域。
    related: [ファイル編成, 索引順編成]
  - term: フルバックアップ
    reading: ふるばっくあっぷ
    aliases: [全体バックアップ]
    simple: 対象のデータをすべてコピーするバックアップです。
    definition: 対象となるすべてのデータを毎回コピーするバックアップ。復元は簡単だが、時間と容量が最もかかる。
    related: [バックアップ, 差分バックアップ, 増分バックアップ]
  - term: 差分バックアップ
    reading: さぶんばっくあっぷ
    simple: 前回のフルバックアップ以降に変更されたデータをすべてコピーするバックアップです。
    definition: 直近のフルバックアップ以降に変更・追加されたデータをすべてコピーする方式。復元にはフルバックアップと最新の差分があればよい。
    related: [バックアップ, フルバックアップ, 増分バックアップ]
  - term: 増分バックアップ
    reading: ぞうぶんばっくあっぷ
    simple: 前回のバックアップ以降に変更されたデータだけをコピーするバックアップです。
    definition: 前回（フルまたは増分）のバックアップ以降に変更されたデータのみをコピーする方式。バックアップは速くて小さいが、復元にはフルと全増分が必要で時間がかかる。
    related: [バックアップ, フルバックアップ, 差分バックアップ]
  - term: "3-2-1ルール"
    reading: さんにいちるーる
    simple: データのコピーを3つ、2種類の媒体に、1つは遠隔地に保管するというバックアップの目安です。
    definition: バックアップを 3 つのコピーで、2 種類以上の異なる媒体に保存し、そのうち 1 つを別の場所（遠隔地やオフライン）に保管するという原則。
    related: [バックアップ]
  - term: ノーコード開発
    reading: のーこーどかいはつ
    aliases: [ノーコードツール]
    simple: プログラムを書かずに、画面操作だけでアプリを作る開発手法です。
    definition: ソースコードを記述せず、部品の配置や設定などのグラフィカルな操作だけでアプリケーションを開発する手法。ローコード開発は必要に応じて少量のコードを書く点が異なる。
    related: [ローコード開発, EUD]
  - term: EUD
    reading: いーゆーでぃー
    fullName: End User Development
    japanese: エンドユーザー開発
    words:
      - { en: End User, ja: 最終的な利用者 }
      - { en: Development, ja: 開発 }
    simple: 情報システム部門ではなく、現場の利用者自身がシステムやアプリを作ることです。
    definition: 業務を行う利用者（エンドユーザー）自身が、情報システム部門に頼らずアプリケーションを開発すること。
    related: [ローコード開発, EUC]
  - term: EUC
    reading: いーゆーしー
    fullName: End User Computing
    japanese: エンドユーザーコンピューティング
    words:
      - { en: End User, ja: 最終的な利用者 }
      - { en: Computing, ja: コンピュータ利用 }
    simple: 現場の利用者が、自分で情報システムを活用して業務に役立てることです。
    definition: 利用者自身がコンピュータやソフトウェアを使いこなし、データの処理や分析を自分で行う利用形態。
    related: [ローコード開発, EUD]
  - term: エミュレーター
    reading: えみゅれーたー
    simple: ある機器の動作を、ほかの機器上のソフトウェアで再現し、同じように動かすものです。
    definition: ある装置やシステムの動作を、別の装置上で本物と同様に再現するソフトウェアまたは装置。実機の代わりにプログラムを実行できる。ICE はハードウェアのエミュレーターである。
    related: [ICE, シミュレーター（開発ツール）]
  - term: シミュレーター（開発ツール）
    reading: しみゅれーたーかいはつつーる
    simple: 実機がなくても、動作を模擬してプログラムの動きを確かめるためのツールです。
    definition: 対象システムの動作を模擬して、プログラムの挙動を検証する開発ツール。実機のタイミング動作の再現よりも、論理的な動作の確認を目的とする。
    related: [ICE, エミュレーター]
  - term: ローダ
    reading: ろーだ
    simple: 実行できる形式のプログラムを、主記憶に読み込む(ロードする)プログラムです。
    definition: ロードモジュールを主記憶に読み込み、必要なアドレスを設定して実行できる状態にするプログラム。
    related: [リンカ, ロードモジュール]
  - term: ロードモジュール
    reading: ろーどもじゅーる
    simple: リンカが作り出す、主記憶に読み込んで実行できる形式のプログラムです。
    definition: 目的プログラムをリンカが結合して作成した、実行可能な形式のプログラム。ローダが主記憶に読み込んで実行する。
    related: [リンカ, ローダ, 目的プログラム]
  - term: 目的プログラム
    reading: もくてきぷろぐらむ
    aliases: [オブジェクトコード]
    simple: コンパイラが原始プログラムを翻訳して作り出す、機械語のプログラムです。
    definition: コンパイラやアセンブラが原始プログラムを翻訳して出力する機械語のプログラム。リンカで結合されてロードモジュールになる。
    related: [リンカ, 原始プログラム, コンパイラ]
  - term: 原始プログラム
    reading: げんしぷろぐらむ
    aliases: [ソースプログラム]
    simple: プログラマが書いた、翻訳前のプログラム(ソースコード)です。
    definition: プログラム言語で記述された、翻訳前のプログラム。コンパイラなどで目的プログラムに変換される。ソースプログラム、ソースコードともいう。
    related: [リンカ, 目的プログラム, コンパイラ]
  - term: プリプロセッサ
    reading: ぷりぷろせっさ
    simple: コンパイルの前に、ソースコードを前処理(マクロ展開など)するプログラムです。
    definition: コンパイラの前段で、マクロ展開やインクルード、条件付きコンパイルなどの前処理を行うプログラム。
    related: [リンカ, コンパイラ]
  - term: JITコンパイラ
    reading: じっとこんぱいらー
    fullName: Just-In-Time compiler
    japanese: 実行時コンパイラ
    aliases: [実行時コンパイラ]
    words:
      - { en: Just-In-Time, ja: ちょうど必要なときに }
      - { en: compiler, ja: コンパイラ }
    simple: プログラムの実行中に、必要な部分を機械語に翻訳しながら実行する方式です。
    definition: プログラムの実行時に、バイトコードなどを機械語に変換して実行するコンパイラ。インタプリタより高速に実行できる。Java の実行環境などで使われる。
    related: [リンカ, バイトコード, インタプリタ]
  - term: クロスコンパイラ
    reading: くろすこんぱいらー
    simple: 実行する環境とは別の環境で、実行用のプログラムを作るコンパイラです。
    definition: コンパイラを動かす環境とは異なる種類のコンピュータ（CPU）向けの目的プログラムを生成するコンパイラ。組込みシステムの開発などで使われる。
    related: [リンカ, コンパイラ]
  - term: インタプリタ
    reading: いんたぷりた
    simple: ソースコードを1行ずつ解釈しながら、直接実行するプログラムです。
    definition: 原始プログラムを 1 文ずつ解釈しながら逐次実行する言語処理プログラム。目的プログラムを生成しないため、修正してすぐ実行できるが、実行は遅い。
    related: [リンカ, コンパイラ, JITコンパイラ]
  - term: アセンブラ
    reading: あせんぶら
    simple: アセンブリ言語で書かれたプログラムを、機械語に翻訳するプログラムです。
    definition: アセンブリ言語で書かれた原始プログラムを機械語の目的プログラムに変換する言語処理プログラム。
    related: [リンカ, 目的プログラム]
  - term: BSDライセンス
    reading: びーえすでぃーらいせんす
    simple: 著作権表示などを守れば、自由に使える・改変できる、ゆるやかなオープンソースライセンスです。
    definition: 著作権表示と免責事項を残すことを条件に、改変・再配布・商用利用が自由に認められる寛容型のオープンソースライセンス。ソースコードの公開義務はない。
    related: [OSS, MITライセンス, GPL]
  - term: MITライセンス
    reading: えむあいてぃーらいせんす
    simple: 著作権表示などを守れば自由に使える、ゆるやかで短いオープンソースライセンスです。
    definition: 著作権表示と許諾表示を残すことを条件に、利用・改変・再配布が自由に認められる寛容型のオープンソースライセンス。
    related: [OSS, BSDライセンス, Apacheライセンス]
  - term: Apacheライセンス
    reading: あぱっちらいせんす
    simple: 特許の利用許諾を含む、ゆるやかなオープンソースライセンスです。
    definition: 著作権表示や変更箇所の明示などを条件に自由な利用・改変・再配布を認める寛容型のオープンソースライセンス。特許権の許諾条項を含む。
    related: [OSS, MITライセンス]
  - term: MPL
    reading: えむぴーえる
    fullName: Mozilla Public License
    japanese: モジラ・パブリック・ライセンス
    words:
      - { en: Mozilla, ja: Mozilla（団体名） }
      - { en: Public, ja: 公共の }
      - { en: License, ja: 使用許諾 }
    simple: 変更したファイルのソースだけ公開すればよい、中間的なオープンソースライセンスです。
    definition: 変更したファイルのソースコードは公開が必要だが、他のファイルと組み合わせた全体への公開義務は及ばない、ファイル単位のコピーレフト型ライセンス。
    related: [OSS, GPL]
  - term: デュアルライセンス
    reading: でゅありらいせんす
    simple: 同じソフトウェアを、2つの異なる条件(例:GPLと商用)のどちらかで使えるようにすることです。
    definition: 同一のソフトウェアを、オープンソースライセンスと商用ライセンスなど 2 種類のライセンスで提供する方式。利用者はどちらかを選択できる。
    related: [OSS, GPL]
  - term: コピーレフト
    reading: こぴーれふと
    simple: 改変したものも、同じ自由な条件で公開することを求める考え方です。
    definition: ソフトウェアの利用・改変・再配布の自由を保証するとともに、改変物や派生物にも同じ条件の適用を求める考え方。GPL が代表例。
    related: [GPL, OSS]
  - term: ディストリビューション
    reading: でぃすとりびゅーしょん
    simple: Linuxのカーネルに、ソフトウェア一式を加えて使いやすくまとめた配布形態です。
    definition: Linux カーネルに、シェル、ライブラリ、アプリケーション、インストーラなどを組み合わせてパッケージ化した配布形態。Debian、Red Hat 系などがある。
    related: [Linux, OSS]
  - term: UNIX
    reading: ゆにっくす
    simple: 古くからあるマルチユーザーのOSで、LinuxやmacOSなどの元となる考え方のOSです。
    definition: AT&T ベル研究所で開発されたマルチユーザー・マルチタスク OS。Linux は UNIX の設計思想を受け継いだ別の OS である。
    related: [Linux, FreeBSD]
  - term: FreeBSD
    reading: ふりーびーえすでぃー
    simple: UNIX系のOSの一つで、BSDライセンスで公開されています。
    definition: BSD UNIX から派生した UNIX 系のオープンソース OS。BSD ライセンスで提供される。
    related: [Linux, UNIX, BSDライセンス]
  - term: Android
    reading: あんどろいど
    simple: スマートフォンなどで広く使われる、Linuxカーネルをもとにしたモバイル向けOSです。
    definition: Google が中心となって開発する、Linux カーネルをベースにしたモバイル向けの OS。主にスマートフォンやタブレットで使われる。
    related: [Linux, OSS]
  - term: デバッガ
    reading: でばっが
    simple: プログラムを一時停止したり、変数を見たりして、バグを探すためのツールです。
    definition: プログラムの実行を制御し、ブレークポイントでの停止、ステップ実行、変数の参照や変更などを行ってバグを見つけるためのツール。
    related: [デバッグ, ブレークポイント]
  - term: ブレークポイント
    reading: ぶれーくぽいんと
    simple: デバッグ時に、プログラムの実行を一時停止させたい場所に付ける印です。
    definition: デバッガで、プログラムの実行を一時停止させる位置として設定する場所（命令や行）。
    related: [デバッグ, デバッガ]
  - term: トレーサー
    reading: とれーさー
    simple: プログラムが実行された経路や変数の値の変化を記録するツールです。
    definition: プログラムの実行経路、命令の実行順序、変数の値の変化などを実行時に記録して、動作を追跡するためのツール。
    related: [デバッグ, デバッガ]
  - term: インスペクター
    reading: いんすぺくたー
    simple: 実行中のオブジェクトや変数の中身を調べて確認するためのツールです。
    definition: 実行中のプログラムのオブジェクトや変数の内容、画面の要素などを調べて確認するデバッグ用のツール。
    related: [デバッグ, デバッガ]
  - term: アサーション
    reading: あさーしょん
    simple: プログラムの途中に条件を書いておき、成り立たなければエラーにする仕組みです。
    definition: プログラム中のある地点で成り立つべき条件を記述し、実行時に満たされなければエラーとして検出する仕組み。バグの早期発見に役立つ。
    related: [デバッグ]
  - term: デューティ比
    reading: でゅーてぃひ
    simple: 一定の周期のうち、信号がオンになっている時間の割合です。
    definition: パルス信号の 1 周期に占める、ON（High）の時間の割合。PWM 制御ではデューティ比を変えて出力の大きさを調整する。
    related: [PWM制御]
  - term: ASIC
    reading: えいしっく
    fullName: Application Specific Integrated Circuit
    japanese: 特定用途向け集積回路
    words:
      - { en: Application Specific, ja: 特定の用途向けの }
      - { en: Integrated Circuit, ja: 集積回路 }
    simple: 特定の用途のために設計・製造される専用のICです。
    definition: 特定の用途向けに設計・製造される集積回路。製造後に回路を書き換えられないが、大量生産では高性能・低コスト。回路を書き換えられる FPGA と対比される。
    related: [FPGA, 集積回路]
  - term: LSI
    reading: えるえすあい
    fullName: Large Scale Integration
    japanese: 大規模集積回路
    words:
      - { en: Large Scale, ja: 大規模 }
      - { en: Integration, ja: 集積 }
    simple: 数千から数十万個の素子を1つにまとめた、大規模な集積回路です。
    definition: "1 つのチップに多数（数千〜数十万個程度）の素子を集積した大規模集積回路。"
    related: [集積回路, VLSI]
  - term: VLSI
    reading: ぶいえるえすあい
    fullName: Very Large Scale Integration
    japanese: 超大規模集積回路
    words:
      - { en: Very Large Scale, ja: 超大規模 }
      - { en: Integration, ja: 集積 }
    simple: LSIよりさらに多くの素子を1つにまとめた、超大規模な集積回路です。
    definition: "1 つのチップに数十万個以上の素子を集積した超大規模集積回路。CPU などが該当する。"
    related: [集積回路, LSI]
  - term: トランジスタ
    reading: とらんじすた
    simple: 電気信号の増幅やオン・オフの切替えができる、コンピュータの基本的な素子です。
    definition: 電流や電圧を増幅したり、スイッチとして ON/OFF したりできる半導体素子。論理回路や集積回路を構成する基本の素子。
    related: [集積回路, ダイオード]
  - term: ダイオード
    reading: だいおーど
    simple: 電流を一方向にしか流さない半導体素子です。
    definition: 電流を一方向にのみ流す性質をもつ半導体素子。整流などに使われる。
    related: [集積回路, トランジスタ, LED]
  - term: LED
    reading: えるいーでぃー
    fullName: Light Emitting Diode
    japanese: 発光ダイオード
    words:
      - { en: Light, ja: 光 }
      - { en: Emitting, ja: 発する }
      - { en: Diode, ja: ダイオード }
    simple: 電気を流すと光る半導体素子で、表示灯や照明に使われます。
    definition: 順方向に電流を流すと発光するダイオード。省電力で長寿命のため、表示灯、照明、ディスプレイのバックライトなどに使われる。
    related: [ダイオード, 集積回路]
  - term: DVFS
    reading: でぃーぶいえふえす
    fullName: Dynamic Voltage and Frequency Scaling
    japanese: 動的電圧・周波数制御
    words:
      - { en: Dynamic, ja: 動的な }
      - { en: Voltage, ja: 電圧 }
      - { en: Frequency, ja: 周波数 }
      - { en: Scaling, ja: 調整 }
    simple: 処理の負荷に合わせて、プロセッサの電圧とクロック周波数を変えて電力を節約する技術です。
    definition: 負荷に応じてプロセッサの動作電圧とクロック周波数を動的に変更し、消費電力を抑える技術。負荷が低いときに電圧と周波数を下げる。
    related: [消費電力, クロックゲーティング, パワーゲーティング]
  - term: クロックゲーティング
    reading: くろっくげーてぃんぐ
    simple: 使っていない回路へのクロック信号を止めて、電力を節約する技術です。
    definition: 動作していない回路ブロックへのクロック供給を止め、スイッチングによる動的な消費電力を削減する技術。
    related: [消費電力, パワーゲーティング, DVFS]
  - term: パワーゲーティング
    reading: ぱわーげーてぃんぐ
    simple: 使っていない回路への電源そのものを遮断して、電力を節約する技術です。
    definition: 動作していない回路ブロックへの電源供給を遮断し、リーク電流による静的な消費電力も削減する技術。クロックゲーティングより削減効果が大きいが、復帰に時間がかかる。
    related: [消費電力, クロックゲーティング, DVFS]
