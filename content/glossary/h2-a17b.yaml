category: システム戦略
terms:
  - term: プログラムマネジメント
    reading: プログラムマネジメント
    simple: 関連する複数のプロジェクトを束ねて、大きな目標につなげる管理です。
    definition: 相互に関連する複数のプロジェクトをプログラムとしてまとめ、プロジェクト間の依存や資源配分を調整しながら、組織の戦略目標の達成を管理する考え方。個別プロジェクトの管理の上位に位置する。
    related: [情報システム戦略]
  - term: システム廃棄
    reading: システムはいき
    simple: 使い終わったシステムを、適切な手順で終わらせることです。
    definition: 情報システムを廃止する活動。必要なデータの新しいシステムへの移行と、媒体に残る情報の確実な消去（復元できない方法での消去と記録）を含む。
    related: [データ消去]
  - term: データ消去
    reading: データしょうきょ
    simple: 媒体に残った情報を、復元できないように消すことです。
    definition: 記憶媒体の廃棄や譲渡の際に、残存する情報を復元できない方法で消去すること。単なる初期化ではデータが復元されるおそれがあるため、専用の方法による上書き消去や、媒体の物理的な破壊が用いられる。
    related: [システム廃棄]
  - term: 普及啓発
    reading: ふきゅうけいはつ
    simple: 新しいシステムや考え方を、使う人に広めて理解してもらう活動です。
    definition: システムの活用促進の活動の一つで、研修や説明、支援の窓口の用意などにより、利用者の理解と利用を促す取組。使われない理由が理解や不安にある場合に有効である。
    related: [ヘルプデスク]
  - term: 投資計画
    reading: とうしけいかく
    simple: 限られた予算を、どの投資に振り向けるかの計画です。
    definition: 情報システムへの投資について、経営戦略との整合や期待される効果を評価し、優先順位を付けて配分を定める計画。部門の要望の順序ではなく、戦略への貢献で判断する。
    related: [情報システム戦略]
  - term: データ移行
    reading: でーたいこう
    simple: 古いシステムのデータを、新しいシステムで使える形にして移し替えることです。
    definition: システムの更改や切替えの際に、旧システムに蓄積されたデータを、新システムで利用できる形式に変換して引き継ぐ作業。計画では、データの利用状況と保存の必要性を確認し、移行するもの、保管するもの、廃棄するものを切り分ける。全データを無条件に移行すると、費用と期間が膨らむことがある。
    related: [システム廃棄]
