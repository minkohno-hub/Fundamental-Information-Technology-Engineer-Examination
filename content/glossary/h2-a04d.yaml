category: システム構成
terms:
  - term: パリティ
    reading: パリティ
    simple: データの誤りを検出・訂正するために付け加える、検査用の情報です。
    definition: データから計算される冗長な情報で、誤りの検出や、失われたデータの復元に使う。RAID5 では、データとパリティの組から、ディスク1本分のデータを復元できる。パリティに使われる容量は、RAID の方式によって決まる。
    related: [RAID5]
  - term: 冗長化
    reading: じょうちょうか
    simple: 故障に備えて、同じ役割のものを複数用意しておくことです。
    definition: 機器や経路などを複数用意し、一部が故障してもサービスを継続できるようにする設計。負荷を分け合うアクティブ・アクティブ構成では、故障時に残りの機器が全体の負荷を引き受けるため、通常時の負荷率に余裕を持たせる必要がある。
    related: [フェイルオーバ]
