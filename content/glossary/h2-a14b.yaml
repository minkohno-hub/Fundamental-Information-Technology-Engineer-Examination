category: マネジメント
terms:
  - term: 転嫁
    reading: てんか
    simple: リスクが起きたときの影響を、保険や契約で他の組織に移すことです。
    definition: リスク対応戦略の一つで、リスクが顕在化したときの財務的な影響を、保険会社や契約相手などの第三者に移す方法。影響を移すだけであり、リスクの発生確率そのものを下げるわけではない。脅威への対応 （回避・転嫁・軽減・受容）の一つである。
    related: [リスク対応]
  - term: 権力・関心グリッド
    reading: けんりょく・かんしんグリッド
    simple: 関係者を、影響力と関心の高さで4つに分けて、関わり方を決める図です。
    definition: ステークホルダーを、権力（影響力）の大きさと、プロジェクトへの関心の高さの2軸で分類する分析手法。両方が高い相手は重点的に管理し、権力が高く関心が低い相手は満足度を維持し、関心が高く権力が低い相手には情報提供を続ける、というように関わり方を変える。
    related: [ステークホルダー]
  - term: スコープ
    reading: スコープ
    simple: プロジェクトで作る成果物と、そのために行う作業の範囲のことです。
    definition: プロジェクトが提供する成果物と、それを実現するために必要な作業の範囲。スコープは WBS などで定義され、範囲の追加や変更は、影響を評価し承認を得る変更管理を通して行う。承認を経ない追加はスコープクリープを招く。
    related: [WBS, スコープクリープ]
  - term: 品質管理
    reading: ひんしつかんり
    simple: 成果物が決められた品質を満たすよう、測定と改善を続けることです。
    definition: 成果物やプロセスが品質の基準を満たしているかを測定し、ばらつきや異常を検出して改善する活動。管理図による工程の監視などが代表的な手法であり、異常の兆候を早期に捉えることが目的である。
    related: [管理図]
  - term: 調達
    reading: ちょうたつ
    simple: プロジェクトに必要な物や作業を、組織の外から入手することです。
    definition: プロジェクトに必要な製品、サービス、作業を外部の組織から取得すること。発注の方式や契約タイプの選択、納品の確認までを含む。契約タイプによって、コスト超過などのリスクを発注側と受注側のどちらが負うかが変わる。
    related: [契約]
  - term: 契約
    reading: けいやく
    simple: 当事者の間で、権利と義務を取り決める約束のことです。
    definition: 当事者間の合意によって、互いに権利と義務を発生させる取り決め。プロジェクトの調達では、定額請負、実費精算、単価などの契約タイプがあり、金額の決まり方とリスクの配分が異なる。
    related: [調達]
  - term: コミュニケーション
    reading: コミュニケーション
    simple: プロジェクトの関係者の間で、情報を伝え合うことです。
    definition: プロジェクトにおける情報の生成、収集、配布、保管などの活動全般。関係者の数が n 人の場合、情報伝達の経路の数は n (n － 1) ÷ 2 となり、人数に対して2次式で増えるため、体制が大きいほど計画的な情報共有の仕組みが重要になる。
    related: [ステークホルダー]
  - term: 責任分担マトリクス
    reading: せきにんぶんたんマトリクス
    simple: 作業ごとに、誰が実行し、誰が最終責任を負うかを表にしたものです。
    definition: 作業と関係者の対応を表にし、各作業について実行責任（R）、説明責任（A）、相談先（C）、報告先（I）を割り当てる方法。説明責任は作業ごとに 1 人だけに割り当て、責任の所在を明確にする。RACI チャートとも呼ばれる。
    related: [RACI]
