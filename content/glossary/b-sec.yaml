category: 情報セキュリティ（科目B）
terms:
  - term: 職務分離
    reading: しょくむぶんり
    aliases: [職務の分離]
    simple: 一つの業務を複数の人で分担し、一人だけで不正やミスを完結できないようにすることです。
    definition: 申請・承認・実行・記録などの相反する職務を別々の担当者に割り当て、相互にけん制させることで、不正や誤りを防止・発見しやすくする管理策。
    related: [最小権限の原則, アクセス権, 内部不正]
  - term: アカウントロックアウト
    reading: あかうんとろっくあうと
    aliases: [アカウントロック]
    simple: 決められた回数続けてログインに失敗したアカウントを、一時的に使えなくする仕組みです。
    definition: 同一アカウントへの認証の連続失敗回数がしきい値に達したとき、一定時間または管理者が解除するまでそのアカウントを利用不可にする機能。総当たり攻撃への対策になるが、IDを変えながら試すリバースブルートフォース攻撃には効きにくい。
    related: [総当たり攻撃, リバースブルートフォース攻撃]
  - term: オフラインバックアップ
    reading: おふらいんばっくあっぷ
    simple: ネットワークから切り離した媒体に保管するバックアップです。
    definition: 取得後にネットワークやシステムから切り離した媒体（テープ、外付けディスクなど）に保管するバックアップ。ランサムウェアなどによってバックアップまで暗号化・削除されることを防ぐ。
    related: [バックアップ, ランサムウェア, 世代管理]
  - term: 世代管理
    reading: せだいかんり
    aliases: [バックアップの世代管理]
    simple: バックアップを上書きせず、日付の異なる複数の版を残しておくことです。
    definition: 取得時点の異なる複数のバックアップ（世代）を保存し、古い世代から順に削除する管理方法。最新のデータが破損・暗号化されていても、それ以前の正常な時点に戻せる。
    related: [バックアップ, オフラインバックアップ]
  - term: EDR
    reading: いーでぃーあーる
    fullName: Endpoint Detection and Response
    japanese: エンドポイントでの検知と対応
    words:
      - { en: Endpoint, ja: 端末（PCやサーバ） }
      - { en: Detection, ja: 検知 }
      - { en: Response, ja: 対応 }
    simple: PCなどの端末の動きを記録・監視して、侵入や不審な動作を見つけ、隔離などの対応をする仕組みです。
    definition: 端末上のプロセスの起動、ファイル操作、通信などを継続的に記録・分析し、侵入後の不審な挙動を検知して、端末のネットワーク隔離などの対応や調査を支援する製品・仕組み。
    related: [マルウェア対策, デジタルフォレンジックス]
  - term: PPAP
    reading: ぴーぴーえーぴー
    simple: パスワード付きZIPファイルをメールで送り、パスワードを別のメールで送る方式の俗称です。
    definition: 暗号化したZIPファイルを添付したメールと、そのパスワードを記載したメールを同じ経路で続けて送る方式の俗称。宛先誤りや経路上の盗聴に対する保護にならず、暗号化された添付ファイルはマルウェア検査ができないなどの問題が指摘されている。
    related: [暗号化, メール誤送信]
  - term: メール誤送信
    reading: めーるごそうしん
    simple: 宛先や添付ファイルを間違えてメールを送ってしまうことです。
    definition: 宛先の誤り、To/CCとBCCの使い分けの誤り、添付ファイルの誤りなどによって、意図しない相手に情報を送信してしまう事故。送信前の確認、送信の一時保留、一斉配信の仕組みの利用などで防ぐ。
    related: [情報漏えい, PPAP]
  - term: 暗黙の拒否
    reading: あんもくのきょひ
    aliases: [暗黙のDeny]
    simple: ファイアウォールで、どのルールにも当てはまらない通信を最後にすべて拒否することです。
    definition: パケットフィルタリングなどのルール評価で、明示的に許可したもの以外を拒否する既定の動作。許可する通信だけを列挙する許可リスト方式の考え方に基づく。
    related: [ファイアウォール]
  - term: 共連れ
    reading: ともづれ
    aliases: [ピギーバック, テールゲーティング]
    simple: 入室の権限がある人の後ろについて、認証をせずに一緒に入ることです。
    definition: 入退室管理された区域に、権限のある者が解錠した際に続いて入り込む行為。アンチパスバックや一人ずつしか通れない回転ゲート（セキュリティゲート）、監視カメラなどで防止・抑止する。
    related: [アンチパスバック, 入退室管理]
  - term: アンチパスバック
    reading: あんちぱすばっく
    simple: 入室の記録がない人は退室できない（退室の記録がない人は再入室できない）ようにする入退室管理の仕組みです。
    definition: 入室時と退室時の両方で認証を行い、入室・退室の記録の整合がとれない認証を拒否する機能。共連れで入室した者は退室できなくなるため、共連れの防止と発見に役立つ。
    related: [共連れ, 入退室管理]
  - term: 委託先管理
    reading: いたくさきかんり
    simple: 業務を外部に任せるとき、相手が情報を安全に扱っているかを契約や点検で管理することです。
    definition: 委託先の選定、契約での安全管理措置・再委託条件・終了時のデータの返却や削除の規定、実施状況の定期的な確認などにより、委託した情報の安全を確保する管理。
    related: [秘密保持契約, サプライチェーンリスク]
  - term: IDの棚卸し
    reading: あいでぃーのたなおろし
    aliases: [アカウントの棚卸し]
    simple: 登録されているアカウントや権限が、今の在籍者と業務に合っているかを定期的に確かめることです。
    definition: 各システムに登録された利用者IDと付与された権限を、人事情報や業務上の必要性と定期的に照合し、退職者・異動者のIDや不要な権限を発見して削除・変更する作業。
    related: [アクセス制御, 最小権限の原則]
  - term: 特権ID
    reading: とっけんあいでぃー
    aliases: [特権アカウント]
    simple: システムの設定変更などができる、強い権限をもった管理者用のアカウントです。
    definition: OSやデータベース、アプリケーションの管理者権限をもつID。悪用された場合の影響が大きいため、利用者の限定、個人ごとの発行、利用の承認と操作ログの記録・確認などで厳格に管理する。
    related: [アクセス権, 責任追跡性]
  - term: CSPM
    reading: しーえすぴーえむ
    fullName: Cloud Security Posture Management
    japanese: クラウドセキュリティ態勢管理
    words:
      - { en: Cloud, ja: クラウド }
      - { en: Security, ja: セキュリティ }
      - { en: Posture, ja: 態勢・姿勢 }
      - { en: Management, ja: 管理 }
    simple: クラウドの設定を自動で点検して、公開設定のミスなどの危険な設定を見つける仕組みです。
    definition: クラウドサービスの設定を継続的に監視し、意図しない公開設定や過剰な権限などの設定ミスを検出して是正を支援する仕組み・製品。
    related: [クラウド, 責任共有モデル]
  - term: 持出し管理
    reading: もちだしかんり
    aliases: [媒体の持出し管理]
    simple: 情報や記録媒体を社外に持ち出すときのルールと記録の管理です。
    definition: 情報や記録媒体・PCの社外への持出しについて、許可される方法・媒体、事前承認、台帳への記録、返却とデータ消去の確認などを定めて運用する管理策。紛失・盗難による情報漏えいを防ぐ。
    related: [情報漏えい, 人的セキュリティ対策]
