category: セキュリティ
terms:
  - term: 誕生日攻撃
    reading: たんじょうびこうげき
    simple: 同じハッシュ値になるデータの組を、効率よく探す攻撃です。
    definition: ハッシュ関数の出力の衝突（同じ値になる入力の組）を探す攻撃。データの組の数がデータ数の2乗のオーダーで増えるため、衝突は出力のパターン数の平方根程度の試行で見つかる（誕生日パラドックス）。衝突耐性は、出力ビット数の半分程度の強さしかない。
    related: [ハッシュ関数, 衝突]
  - term: 証明書チェーン
    reading: しょうめいしょチェーン
    simple: 証明書どうしの署名が、信頼できる認証局までつながっている状態です。
    definition: サーバ証明書から、中間認証局の証明書を経て、ルート認証局まで、署名の連鎖がつながったもの。検証では、この連鎖をたどって証明書の正当性を確認する。中間証明書の送付漏れがあると、連鎖が切れて検証に失敗する。
    related: [中間認証局]
  - term: 中間認証局
    reading: ちゅうかんにんしょうきょく
    simple: ルート認証局と、証明書を発行する認証局の間に入る認証局です。
    definition: ルート認証局から権限を委譲され、サーバ証明書などの発行を行う認証局。証明書の検証では、サーバ証明書とルート認証局の間をつなぐ役割を持ち、その証明書がサーバから送られる必要がある。
    related: [証明書チェーン]
  - term: パスワード
    reading: パスワード
    simple: 本人だけが知っている、認証のための文字列です。
    definition: 利用者認証に使う秘密の文字列。強さは、文字種と長さで決まる組合せの総数と、攻撃者の試行速度から見積もることができる。使い回しや短い文字列は、漏えいや総当たりへの耐性を下げる。
    related: [総当たり攻撃]
  - term: ハッシュチェーン
    reading: ハッシュチェーン
    simple: 各データに、直前のデータのハッシュ値を含めてつないだ構造です。
    definition: データの連なりにおいて、各データに直前のデータのハッシュ値を含める構造。途中のデータを改ざんすると、そのデータのハッシュ値が変わり、後続のデータ全てで不一致が生じるため、改ざんを検知できる。ブロックチェーンの基礎になる。
    related: [ブロックチェーン, ハッシュ関数]
  - term: ブロックチェーン
    reading: ブロックチェーン
    simple: 取引の記録を、ハッシュ値でつないで改ざんしにくくした台帳の技術です。
    definition: 取引データをブロックという単位にまとめ、各ブロックに直前のブロックのハッシュ値を含めて連鎖させる分散台帳の技術。過去の記録の改ざんが、後続のブロック全ての不一致として現れるため、改ざんが困難である。
    related: [ハッシュチェーン]
  - term: 鍵長
    reading: かぎちょう
    simple: 暗号の鍵の長さで、ビット数で表します。
    definition: 暗号鍵のビット数。鍵の総数は 2 の鍵長乗であり、鍵長が 1 ビット増えると総当たりの困難さが 2 倍になる。計算能力の向上に合わせて、十分な鍵長への移行が必要になる。
    related: [総当たり攻撃]
  - term: セキュアブート
    reading: セキュアブート
    simple: 起動時に、ソフトウェアの署名を確認してから実行する仕組みです。
    definition: コンピュータの起動過程で、各段階が次のソフトウェアのデジタル署名を検証し、正当なものだけを実行する仕組み。改ざんされたブートローダや OS の実行を、起動の時点で防ぐ。
    related: [デジタル署名]
  - term: 暗号の危殆化
    reading: あんごうのきたいか
    simple: 暗号の安全性が、技術の進歩によって弱くなっていくことです。
    definition: 計算能力の向上や解読手法の進展によって、使用中の暗号アルゴリズムや鍵長の安全性が、実用上不十分な水準まで低下すること。対応として、利用箇所の棚卸しと、より安全な方式への計画的な移行が必要になる。
    related: [暗号アジリティ]
  - term: 暗号アジリティ
    reading: あんごうアジリティ
    simple: 暗号の方式を、必要に応じて切り替えやすくしておく設計の考え方です。
    definition: 使用する暗号アルゴリズムや鍵長を、システムの作り替えを最小限にしながら変更できるようにする設計上の性質・考え方。暗号の危殆化への対応を迅速に行うための備えになる。
    related: [暗号の危殆化]
