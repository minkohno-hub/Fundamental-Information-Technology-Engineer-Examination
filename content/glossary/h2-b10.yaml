category: 擬似言語・アルゴリズム
terms:
  - term: 副作用
    reading: ふくさよう
    aliases: [プログラムの副作用]
    simple: 関数や手続が、値を返す以外に呼び出し元の配列や大域変数を書き換えてしまうこと
    definition: 関数や手続の実行によって、戻り値以外に、引数として渡された配列、大域変数、ファイルなど呼出し元から見える状態が変化すること。配列を参照渡しする関数が引数の配列を書き換える場合などが該当し、意図しない副作用はバグの原因になる。
    related: [参照渡し, 大域変数]
  - term: 変数の有効範囲
    reading: へんすうのゆうこうはんい
    aliases: [スコープ（変数）, 変数のスコープ]
    simple: 変数の名前が使える範囲のこと
    definition: 宣言した変数の名前が参照できるプログラム上の範囲。関数内で宣言した局所変数はその関数の中だけで有効で、大域変数はプログラム全体で有効である。同じ名前の局所変数と大域変数があるときは、局所変数が優先される。
    related: [局所変数, 大域変数]
  - term: 最大値探索
    reading: さいだいちたんさく
    aliases: [最大値を求めるアルゴリズム]
    simple: 配列の要素を順に見て、これまでで最大の値（または添字）を覚えておく方法
    definition: 配列の先頭の要素を暫定の最大値とし、以降の要素を順に比較して、より大きい値が見つかるたびに暫定の最大値（またはその添字）を更新する探索。比較に等号を含めるかどうかで、同じ最大値が複数あるときに最初と最後のどちらの位置が残るかが決まる。
    related: [線形探索法]
  - term: ループ不変条件
    reading: るーぷふへんじょうけん
    aliases: [ループ不変式]
    simple: 繰返しの途中で毎回成り立っているべき条件
    definition: 繰返し処理の各回の開始時と終了時に常に成り立っている条件。二分探索で「答えは lo 以上 hi 以下（または未満）の範囲にある」と保つように初期値・繰返し条件・更新式を決めるなど、アルゴリズムの正しさを確かめる拠り所になる。
    related: [二分探索, 境界条件]
  - term: 境界条件
    reading: きょうかいじょうけん
    aliases: [境界のケース]
    simple: 配列の端や空の入力など、処理が切り替わるぎりぎりの条件
    definition: 配列の先頭や末尾、要素数が 0 や 1 の入力、繰返しの最初と最後の回、条件式の等号が成り立つ値など、処理の振る舞いが切り替わる境目の条件。オフバイワンエラーが起きやすいため、テストでは境界の前後の値を確かめる。
    related: [境界値分析, ループ不変条件]
