category: 企業と法務
terms:
  - term: 独占禁止法
    reading: どくせんきんしほう
    simple: 公正で自由な競争を守るための法律です。
    definition: 私的独占の禁止及び公正取引の確保に関する法律の通称。不当な取引制限（カルテル）、私的独占、不公正な取引方法などを禁止し、市場における公正で自由な競争を維持することを目的とする。違反には、排除措置命令や課徴金納付命令が課されることがある。
    related: [不当な取引制限]
  - term: 不当な取引制限
    reading: ふとうなとりひきせいげん
    simple: 競合する会社同士が、価格などを取り決めて競争をやめてしまうことです。
    definition: 独占禁止法が禁止する行為の一つで、事業者が共同して対価・数量・取引先などを取り決め、その実施を相互に拘束することで、競争を実質的に制限すること。カルテルがその典型であり、書面の契約がなく、意思の連絡（意見の一致）があれば成立しうる。
    related: [独占禁止法]
  - term: 派遣期間の制限
    reading: はけんきかんのせいげん
    simple: 派遣労働者を受け入れられる期間の上限のことです。
    definition: 労働者派遣法による受入れ期間の制限。事業所単位では、同一事業所での受入れは原則 3 年までで、労働組合等への意見聴取を経れば延長できる。個人単位では、同一の派遣労働者を同一の組織単位で受け入れられるのは通算 3 年までで、延長はできない。2つの制限は別々に働く。
    related: [労働者派遣法]
