category: '21'
terms:
  - term: 電子受発注
    reading: でんしじゅはっちゅう
    simple: 発注のデータを、企業どうしで電子的にやり取りすることです。
    definition: 企業どうしの受注と発注のデータを、ネットワークを通じて電子的にやり取りする仕組み。発注の手続を正確で速いものにする。ただし、納品の際に実物とデータを突き合わせる検収は、別途必要な手続である。
    related: [EDI, 検収]
  - term: 業務パッケージ
    reading: ぎょうむぱっけーじ
    simple: 業務で使えるように、あらかじめ作られたソフトウェアです。
    definition: 販売管理や会計などの業務の機能を、あらかじめ備えたソフトウェア。実績のある標準の機能を使うことで、開発と保守の負担を抑えられる。導入の際は、業務の進め方を標準の機能に合わせ、独自の作り込みは必要な範囲に限ることが基本になる。
    related: [カスタマイズ]
  - term: カスタマイズ
    reading: かすたまいず
    simple: 既製品のソフトウェアを、自社に合わせて作り変えることです。
    definition: パッケージソフトなどの既製品に、独自の機能の追加や変更を加えること。業務への適合は高まるが、導入の費用が増え、パッケージの版の更新に追随しにくくなるため、必要な範囲に限ることが望ましい。
    related: [業務パッケージ]
  - term: ソーシャルメディア
    reading: そーしゃるめでぃあ
    simple: 利用者どうしが情報を発信し合う、交流の場のサービスです。
    definition: 利用者が情報を発信し、相互に交流できるインターネット上のサービス。企業が公式アカウントで情報発信に使う場合は、発信前の確認の手順や、問題が起きた場合の対応をあらかじめ定めておくことが必要である。
    related: [公式アカウント]
  - term: 公式アカウント
    reading: こうしきあかうんと
    simple: 企業や団体が、公式の発信のために使うアカウントです。
    definition: 企業や団体が、ソーシャルメディアなどで公式の情報発信を行うためのアカウント。その発信は企業としての発言として受け取られるため、内容の確認の手順や、誤りがあった場合の訂正と謝罪の進め方を、あらかじめ定めて運用する。
    related: [ソーシャルメディア]
  - term: 民生機器
    reading: みんせいきき
    simple: 家庭などで使われる、一般向けの機器です。
    definition: 家庭や個人で使われる家電などの機器。ネットワークに接続する民生機器はソフトウェアで制御される情報機器でもあり、脆弱性の修正のための更新が提供される仕組みと、専門知識のない利用者でも更新を適用できる進め方が求められる。
    related: [脆弱性]
  - term: 操作部
    reading: そうさぶ
    simple: 制御の判断を受けて、対象を実際に動かす部分です。
    definition: 自動制御の構成要素の一つで、制御部からの信号を受けて、モータやバルブなどの形で対象に実際に働きかける部分。対象の状態を測る検出部、目標と比べて判断する制御部とで、制御の仕組みを構成する。
    related: [センサ]
