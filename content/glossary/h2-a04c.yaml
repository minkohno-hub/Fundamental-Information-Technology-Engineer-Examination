category: コンピュータシステム
terms:
  - term: 並列処理
    reading: へいれつしょり
    simple: 複数の処理装置で、仕事を分担して同時に進めることです。
    definition: 複数のプロセッサやコンピュータが、1つの処理を分担して同時に実行すること。並列化できる部分は台数に応じて速くなるが、逐次に実行せざるを得ない部分と、同期・通信のオーバヘッドが全体の高速化を制限する（アムダールの法則）。
    related: [アムダールの法則, オーバヘッド]
  - term: データ転送時間
    reading: データてんそうじかん
    simple: データを読み書きするために、媒体との間で転送にかかる時間のことです。
    definition: 記憶装置のアクセス時間を構成する要素の一つで、転送するデータ量を転送速度（バイト／秒）で割って求める。磁気ディスクでは、シーク時間と回転待ち時間と合わせてアクセス時間になる。
    related: [シーク時間, 回転待ち時間]
  - term: 故障率
    reading: こしょうりつ
    simple: 単位時間あたりに故障が発生する割合のことです。
    definition: 装置や部品が単位時間あたりに故障する割合（λ）。故障率が一定の期間では、MTBF は故障率の逆数になる。直列系では全体の故障率は各装置の故障率の和になり、並列冗長では故障しにくくなる。
    related: [MTBF, 稼働率]
  - term: ターンアラウンド時間
    reading: ターンアラウンドじかん
    simple: ジョブを投入してから、結果が得られて完了するまでの時間のことです。
    definition: バッチ処理の性能指標の一つで、ジョブの到着（投入）から処理が完了するまでの経過時間。処理装置での待ち時間と処理時間自身の合計に等しく、完了時刻から到着時刻を引いて求める。スループット（単位時間当たりの処理件数）とは別の指標である。
    related: [スループット]
  - term: オーバヘッド
    reading: オーバヘッド
    simple: 本来の処理そのものではなく、付随的に必要になる余分な時間や資源のことです。
    definition: 目的の処理に付随して発生する追加の時間や資源の消費。並列処理では、処理の分割・同期・通信にかかる時間がオーバヘッドになり、台数を増やしても実行時間が比例して短くならない原因になる。
    related: [並列処理]
  - term: フェイルオーバ
    reading: フェイルオーバ
    simple: 障害が起きたときに、待機している別のシステムへ自動で切り替えることです。
    definition: 主系に障害が発生したときに、待機系へ処理を自動的に切り替えてサービスを継続する仕組み。実効的な稼働率は、切替えが成功する確率にも依存し、待機系の稼働率だけでは決まらない。
    related: [稼働率, フォールトトレランス]
