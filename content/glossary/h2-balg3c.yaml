category: アルゴリズム
terms:
  - term: 関数
    reading: かんすう
    simple: 値を渡すと、決まった処理をして結果を返してくれる仕組みです。
    definition: 引数を受け取り、処理を行って戻り値を返す、手続やプログラムの部品。呼出しの入れ子（合成）では、内側の関数の戻り値が外側の引数になる。再帰呼出しや、大域変数を介した状態の保持など、呼出しの仕組みに関する論点の基礎になる。
    related: [再帰, 大域変数]
  - term: 累乗
    reading: るいじょう
    simple: 同じ数を何回も掛け合わせたものです。
    definition: 同じ数を繰り返し掛ける計算。n の e 乗は、n を e 回掛けた値であり、e が 0 の場合は 1 と定義される。再帰では、n の e 乗 ＝ n ×（n の e － 1 乗）と表して計算できる。
    related: [再帰]
