category: 経営戦略
terms:
  - term: 破壊的技術
    reading: はかいてきぎじゅつ
    simple: 最初は性能が劣っていても、別の市場で育って既存の製品を置き換えてしまう技術です。
    definition: 登場当初は既存製品より性能が劣り、主流の顧客には評価されないが、低価格や小型などの別の価値で新しい顧客層に広がり、性能向上とともに既存市場を侵食する技術。イノベーションのジレンマの中心的な要素である。
    related: [イノベーションのジレンマ]
  - term: フリーミアム
    reading: フリーミアム
    simple: 基本機能を無料で提供し、高度な機能を有料にする販売の方法です。
    definition: 無料の基本プランで多くの利用者を集め、その一部を有料プランへ転換させて収益を得るビジネスモデル。無料会員の規模と、有料への転換率と、単価の積が収益の土台になる。
    related: [転換率]
  - term: 転換率
    reading: てんかんりつ
    simple: 見込み客のうち、購入や申込みなどの成果に至った割合です。
    definition: ある段階の対象者のうち、次の段階（購入・申込み・有料化など）へ進んだ者の割合。コンバージョン率ともいう。分母を何にするか（無料会員か、訪問者か）で意味が変わるため、定義の確認が重要である。
    related: [フリーミアム]
  - term: 選択と集中
    reading: せんたくとしゅうちゅう
    simple: 事業を選んで絞り、資源を中核の事業に寄せることです。
    definition: 経営戦略の考え方で、相乗効果の薄い事業や不採算事業を切り離し、回収した資金や人材などの経営資源を、中核事業へ再配分すること。多角化とは逆方向の動きである。
    related: [コアコンピタンス]
  - term: クリック率
    reading: クリックりつ
    simple: 配信や表示の数のうち、クリックされた割合です。
    definition: クリック数を、配信数や表示回数で割った割合。メールマーケティングでは配信数が分母になる。開封数を分母にする割合（開封に対するクリックの割合）とは、別の指標である。
    related: [開封率]
  - term: 開封率
    reading: かいふうりつ
    simple: 配信したメールのうち、開封された割合です。
    definition: 開封数を配信数で割った割合で、メールマーケティングの基本指標の一つ。件名や配信先の適切さを測る目安になる。クリック率とは、分母は同じでも分子が異なる。
    related: [クリック率]
  - term: 指数平滑法
    reading: しすうへいかつほう
    simple: 前回の予測に、実際の値との差を少しだけ反映させて、新しい予測を作る方法です。
    definition: 需要予測の手法の一つ。今期の予測 ＝ 前期の予測 ＋ α ×（前期の実績 － 前期の予測）で更新する。α（平滑化定数、0〜1）が大きいほど直近の実績に敏感になり、小さいほど予測は滑らかになる。古いデータの影響が指数的に薄れながら残る。
    related: [需要予測, 移動平均法]
