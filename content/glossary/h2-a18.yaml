category: システム企画
terms:
  - term: 投資評価
    reading: とうしひょうか
    simple: 投資に見合う効果があるかを、確かめることです。
    definition: システム化への投資を判断するために、効果と費用を比べて評価すること。回収期間法（効果の累積が投資額に達するまでの期間）や、収益性の指標を用いる方法がある。
    related: [回収期間法]
  - term: 要求分析
    reading: ようきゅうぶんせき
    simple: 利用者が本当に必要としていることを、掘り下げて確かめる作業です。
    definition: 要件定義の前段で、利用者の要望の背後にある本来の要求（目的）を明らかにする活動。要望が手段の形で語られることが多いため、目的を確認し、実現方法の選択肢を検討する。
    related: [インタビュー]
  - term: インタビュー
    reading: インタビュー
    simple: 関係者に直接話を聞いて、情報を集める方法です。
    definition: 要求分析や要件定義で、利用者や利害関係者に対面で質問し、業務の実態や要求を聞き取る手法。質問の形により、構造化インタビュー、半構造化インタビューなどがある。
    related: [要求分析]
  - term: 情報提供依頼書
    reading: じょうほうていきょういらいしょ
    simple: 調達の初期に、製品や方法の情報を集めるために出す文書です。
    definition: RFI（Request for Information）。調達の検討の初期段階で、ベンダに対して製品やサービス、実現方法の情報の提供を求める文書。提案と見積りを求める提案依頼書（RFP）とは、段階と目的が異なる。
    related: [RFI, RFP]
  - term: 評価基準
    reading: ひょうかきじゅん
    simple: 提案などを比べるときに、あらかじめ決めておく物差しです。
    definition: 調達選定などで、提案を評価するために事前に定める項目と重み付け。価格のほか、技術的な内容、実績、サポート体制などを含め、公平な比較のために募集前に定める。
    related: [調達選定]
  - term: 全体最適
    reading: ぜんたいさいてき
    simple: 部門ごとではなく、会社全体で最も良くなるように考えることです。
    definition: 個別の部門の都合（部分最適）ではなく、組織全体の視点で、最も効果が大きくなるように判断する考え方。システム化構想では、情報の一元化や部門間の連携の方向性を定める際の視点となる。
    related: [システム化構想]
