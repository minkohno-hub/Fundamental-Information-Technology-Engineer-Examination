category: 技術戦略
terms:
  - term: アーリーアダプタ
    reading: アーリーアダプタ
    simple: 新しい製品を、早い段階で進んで使う人たちです。
    definition: 新製品の採用者層の一つで、新しさ自体に価値を感じ、初期の段階で採用する層。実用と実績を重視する初期多数採用者（アーリーマジョリティ）との間には、キャズムと呼ばれる溝がある。
    related: [キャズム]
  - term: 幻滅期
    reading: げんめつき
    simple: 膨らんだ期待が、現実を見て冷めていく時期です。
    definition: ハイプサイクルにおける段階の一つで、過熱期に膨らんだ期待が、技術の限界や問題に直面して冷めていく時期。その後、使い道の理解が進む啓蒙期を経て、安定期へ向かう。
    related: [ハイプサイクル]
