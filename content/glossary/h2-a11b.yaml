category: セキュリティ
terms:
  - term: CBCモード
    reading: シービーシーモード
    simple: 前のブロックの暗号文と混ぜながら暗号化する、ブロック暗号の使い方です。
    definition: ブロック暗号の利用モードの一つで、各平文ブロックを1つ前の暗号文ブロックと排他的論理和してから暗号化する。同じ平文ブロックでも異なる暗号文になり、最初のブロックには初期ベクトル（IV）を使う。暗号文の1ブロックに誤りが生じると、復号ではそのブロックと次のブロックに誤りが及ぶ。
    related: [ブロック暗号, 暗号利用モード]
  - term: 鍵ストリーム
    reading: かぎストリーム
    simple: ストリーム暗号で、平文と混ぜるために生成される鍵の列のことです。
    definition: ストリーム暗号において、鍵から生成されるビット列（キー・ストリーム）。平文と排他的論理和を取ることで暗号文を作る。同じ鍵ストリームを使い回すと、暗号文同士の排他的論理和から平文同士の排他的論理和が得られてしまうため、使い回しは厳禁である。
    related: [ストリーム暗号]
  - term: リプレイ攻撃
    reading: リプレイこうげき
    simple: 盗聴した通信のデータを、そのまま送り直して成り済ます攻撃です。
    definition: 正規の通信で送られた認証情報やデータを記録し、後でそのまま再送信することで、正規の利用者になりすます攻撃。応答が毎回変わるチャレンジレスポンス認証や、タイムスタンプ・一回限りの値（ノンス）の確認によって防ぐ。
    related: [チャレンジレスポンス認証]
  - term: 暗号鍵
    reading: あんごうかぎ
    simple: 暗号化や復号に使う、秘密の数値データのことです。
    definition: 暗号アルゴリズムで暗号化・復号を行うために使う値。鍵の生成、配布、保管、更新、廃棄までの一生（ライフサイクル）を安全に管理することが求められ、重要な鍵の操作には複数人での統制（デュアルコントロール）が用いられる。
    related: [鍵管理, 共通鍵暗号, 公開鍵暗号]
  - term: 量子コンピュータ
    reading: りょうしコンピュータ
    simple: 量子力学の性質を使って、特定の計算を非常に速く行うコンピュータです。
    definition: 重ね合わせや量子もつれといった量子力学の性質を利用する計算機。ショアのアルゴリズムで素因数分解や離散対数問題を高速に解けるため、RSA 暗号や楕円曲線暗号の危殆化が懸念され、耐量子計算暗号への移行が検討されている。共通鍵暗号へはグローバーのアルゴリズムによる実効強度の低下として影響する。
    related: [公開鍵暗号]
  - term: 公開鍵暗号
    reading: こうかいかぎあんごう
    simple: 暗号化に使う鍵を公開し、復号に使う鍵だけを秘密にする暗号方式です。
    definition: 暗号化と復号で異なる鍵（公開鍵と秘密鍵のペア）を使う暗号方式。公開鍵は誰にでも公開でき、秘密鍵は所有者だけが保持する。RSA 暗号や楕円曲線暗号があり、デジタル署名にも応用される。鍵の配送問題を解決できる一方、処理は共通鍵暗号より重い。
    related: [共通鍵暗号, デジタル署名]
  - term: 共通鍵暗号
    reading: きょうつうかぎあんごう
    simple: 暗号化と復号に、同じ鍵を使う暗号方式です。
    definition: 暗号化と復号に同一の鍵（共通鍵）を使う暗号方式。処理が高速で、大量のデータの暗号化に向くが、通信相手ごとに鍵を安全に共有する（鍵配送の）課題がある。AES が代表例である。
    related: [公開鍵暗号, ブロック暗号]
  - term: パスキー
    reading: パスキー
    simple: パスワードの代わりに、端末に保存した鍵でログインする仕組みです。
    definition: FIDO の仕組みに基づく認証方法で、サービスごとに鍵ペアを生成し、秘密鍵を利用者の端末に保持して、ログイン時はサーバのチャレンジへの署名で本人確認を行う。秘密鍵が端末の外に出ず、パスワードの入力自体が不要なため、フィッシングや漏洩への耐性が高い。
    related: [FIDO, チャレンジレスポンス認証]
