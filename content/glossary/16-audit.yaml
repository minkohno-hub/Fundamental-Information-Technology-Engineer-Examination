category: システム監査
terms:
  - term: システム監査
    reading: システムかんさ
    simple: 専門家が中立の立場で情報システムの使い方や管理を調べ、適切さを保証したり改善を助言したりすることです。
    definition: 専門性と客観性を備えた監査人が、一定の基準に基づいて IT システムの利活用に係る検証・評価を行い、ガバナンス・マネジメント・コントロールの適切性等に対する保証を与える、又は改善のための助言を行う監査。
    related: [システム監査基準, システム管理基準]
  - term: 内部監査
    reading: ないぶかんさ
    simple: 組織の中の監査部門が行う監査です。外部の独立した人が行うものは外部監査といいます。
    definition: 組織内部の監査部門などが経営者のために行う監査。外部の独立した者が行うものを外部監査という。法律で義務付けられた監査を法定監査（会社法・金融商品取引法に基づく会計監査など）、組織の判断で行うものを任意監査という。
    related: [システム監査]
  - term: 監査人の独立性
    reading: かんさにんのどくりつせい
    simple: 監査する人が、監査される側と利害関係をもたず、公正に判断できる立場にあることです。
    definition: 監査人が監査対象から独立していること。身分上・組織上の関係や利害関係がない外観上の独立性と、公正かつ客観的に判断する態度を保つ精神上の独立性がある。
    related: [システム監査基準]
  - term: システム監査基準
    reading: システムかんさきじゅん
    simple: システム監査をする人が守るべき行動のルールを定めた基準です。
    definition: 経済産業省が公表する、システム監査人の行為規範。監査人の倫理、独立性と客観性、監査計画、監査の実施、報告などを定める。
    related: [システム管理基準, 監査人の独立性]
  - term: システム管理基準
    reading: システムかんりきじゅん
    simple: 組織が情報システムをどう管理すべきかを示した基準で、監査の物差しとして使われます。
    definition: 経済産業省が公表する、組織体が IT ガバナンスや IT マネジメントを実践するための規範。システム監査において監査上の判断尺度として利用される。
    related: [システム監査基準, ITガバナンス]
  - term: システム監査計画
    reading: システムかんさけいかく
    simple: いつ、何を、どのように監査するかを前もって決めた計画です。
    definition: 監査を効果的・効率的に行うための計画。複数年度の方針を定める中長期計画、年度の対象・時期・要員・予算を定める年度計画、個々の監査の目的・手続・日程・担当者を定める個別監査計画がある。
    related: [リスクアプローチ]
  - term: リスクアプローチ
    reading: リスクアプローチ
    simple: リスクの大きいところを重点的に監査する考え方です。
    definition: リスクの評価に基づき、重大な不備につながるリスクが大きい領域に監査資源を重点的に配分して、監査を効果的・効率的に行う考え方。
    related: [システム監査計画]
  - term: 予備調査
    reading: よびちょうさ
    simple: 本格的な調査の前に、資料や聞き取りで監査対象の様子をつかむ調査です。
    definition: 本調査に先立ち、資料の閲覧や関係者へのヒアリングで監査対象の実態を把握し、監査の要点を明確にして監査手続を具体化する調査。本調査では監査手続を適用して監査証拠を入手する。
    related: [監査手続, 監査証拠]
  - term: 監査証拠
    reading: かんさしょうこ
    simple: 監査の結論の裏付けとなる証拠です。
    definition: 監査手続を実施して入手する、監査の結論を裏付ける情報。十分（量）かつ適切（質）でなければならない。
    related: [監査手続, 監査調書]
  - term: 監査手続
    reading: かんさてつづき
    simple: 監査証拠を集めるために監査人が実際に行う調査の方法です。
    definition: 監査証拠を入手するために監査人が実施する手続。文書の閲覧、インタビュー、観察、CAAT などのシステム監査技法を組み合わせて適用する。
    related: [監査証拠, システム監査技法]
  - term: 監査調書
    reading: かんさちょうしょ
    simple: 監査人が行った手続や集めた証拠を記録した書類です。
    definition: 監査人が実施した監査手続、入手した監査証拠、結論に至った過程などを記録した文書。監査の結論の根拠となるため、体系的に整理し適切に保管する。
    related: [監査証拠]
  - term: システム監査報告書
    reading: システムかんさほうこくしょ
    aliases: [監査報告書]
    simple: 監査の結果や見つかった問題、改善の提案をまとめて依頼者に出す報告書です。
    definition: 監査の結論、指摘事項、改善提案などを記載し、監査の依頼者に提出する報告書。保証を目的とする監査では保証意見を、助言を目的とする監査では改善提案を中心に記載する。
    related: [フォローアップ]
  - term: フォローアップ
    reading: フォローアップ
    simple: 監査で指摘した問題が、きちんと改善されているかを後から確認することです。
    definition: 指摘事項に対する改善計画の実施状況を監査人が確認・評価する活動。改善の実施は監査対象部門の責任であり、監査人自身は改善を行わない。
    related: [システム監査報告書]
  - term: システム監査技法
    reading: システムかんさぎほう
    simple: 監査で証拠を集めるための、質問書や書類の確認、聞き取りなどの具体的なやり方です。
    definition: 監査手続で用いる技法。質問書に回答を求めるチェックリスト法、文書を閲覧するドキュメントレビュー法、関係者に質問するインタビュー法、処理の流れを追跡するウォークスルー法、記録同士を突き合わせる突合・照合法、現場を観察する現地調査法、コンピュータを利用する CAAT などがある。
    related: [CAAT, 監査手続]
  - term: CAAT
    reading: キャット
    fullName: Computer Assisted Audit Techniques
    japanese: コンピュータ支援監査技法
    aliases: [コンピュータ支援監査技法]
    words:
      - { en: Computer, ja: コンピュータ }
      - { en: Assisted, ja: 支援された }
      - { en: Audit, ja: 監査 }
      - { en: Techniques, ja: 技法 }
    simple: 監査人がコンピュータを使って、大量のデータを調べたりする監査のやり方の総称です。
    definition: 監査人がコンピュータを利用して監査手続を実施する技法の総称。データの抽出・分析、テストデータ法、ITF 法、スナップショット法、並行シミュレーション法などを含む。
    related: [テストデータ法, ITF法, スナップショット法, 並行シミュレーション法]
  - term: テストデータ法
    reading: テストデータほう
    simple: 監査人が用意したデータをプログラムで処理させ、予想どおりの結果になるかを確かめる方法です。
    definition: 監査人が作成したテストデータを監査対象のプログラムで処理させ、あらかじめ想定した結果と比較して処理の正確性を検証する技法。
    related: [CAAT]
  - term: ITF法
    reading: アイティーエフほう
    fullName: Integrated Test Facility
    japanese: 統合テスト機能
    words:
      - { en: Integrated, ja: 統合された }
      - { en: Test, ja: テスト }
      - { en: Facility, ja: 機能 }
    simple: 本番のシステムに監査用の架空口座を作り、本番データと一緒に処理させて確かめる方法です。
    definition: 稼働中のシステムに監査用の架空口座などを設け、本番のデータと一緒に監査用のデータを処理させて、その結果を検証する技法。
    related: [CAAT, テストデータ法]
  - term: スナップショット法
    reading: スナップショットほう
    simple: プログラムの途中に監査用の仕掛けを入れ、処理途中のデータを記録して確かめる方法です。
    definition: プログラムの特定の箇所に監査用のモジュールを組み込み、処理途中のデータを抽出・記録して処理の正確性を検証する技法。
    related: [CAAT]
  - term: 並行シミュレーション法
    reading: へいこうシミュレーションほう
    simple: 監査人が同じ働きのプログラムを用意し、同じデータで動かして結果を比べる方法です。
    definition: 監査人が監査対象と同じ機能のプログラムを用意し、本番と同じデータを処理させて両者の結果を比較する技法。
    related: [CAAT]
  - term: 内部統制
    reading: ないぶとうせい
    simple: 会社の業務が正しく効率よく行われるよう、ルールやチェックの仕組みを社内に組み込むことです。
    definition: 業務の有効性及び効率性、報告の信頼性、事業活動に関わる法令等の遵守、資産の保全の4つの目的を達成するために、経営者が整備・運用する組織内のプロセス。日本の基準では6つの基本的要素で構成される。
    related: [COSO, 統制環境, 職務分掌, IT全般統制]
  - term: COSO
    reading: コソ
    fullName: Committee of Sponsoring Organizations of the Treadway Commission
    japanese: トレッドウェイ委員会支援組織委員会
    aliases: [COSOフレームワーク]
    words:
      - { en: Committee, ja: 委員会 }
      - { en: Sponsoring Organizations, ja: 支援組織 }
      - { en: Treadway Commission, ja: トレッドウェイ委員会 }
    simple: 内部統制の考え方の世界的な手本となる枠組みを作った米国の組織、又はその枠組みです。
    definition: 米国の組織で、内部統制の枠組み（COSO フレームワーク）を公表した。構成要素は統制環境、リスク評価、統制活動、情報と伝達、モニタリング活動の5つ。
    related: [内部統制, 統制環境]
  - term: 統制環境
    reading: とうせいかんきょう
    simple: 経営者の姿勢や組織の気風など、内部統制のほかの要素の土台となるものです。
    definition: 組織の気風を決定し、内部統制の他の要素の基礎となる要素。日本の基準の基本的要素は、統制環境、リスクの評価と対応、統制活動、情報と伝達、モニタリング、IT への対応の6つで、IT への対応は COSO にない日本独自の要素。
    related: [内部統制, COSO]
  - term: 職務分掌
    reading: しょくむぶんしょう
    simple: 一つの仕事の承認や実行、記録などを別々の人に分担させ、お互いにチェックさせることです。
    definition: 業務の担当と権限・責任を明確にし、承認・実行・記録・保管などの重要な部分を異なる担当者に分けて相互にけん制させる仕組み。
    related: [内部統制]
  - term: IT全般統制
    reading: アイティーぜんぱんとうせい
    aliases: [ITに係る全般統制]
    simple: システムの開発や運用、アクセス管理など、業務処理の統制がうまく働く土台を守る仕組みです。
    definition: 業務処理統制が有効に機能する環境を保証する統制。システムの開発・保守、運用管理、アクセス管理、外部委託の管理など。業務処理統制は入力チェック、エラーの修正と再処理、マスタデータの維持管理など、業務プロセスに組み込まれた統制。
    related: [内部統制]
  - term: ITガバナンス
    reading: アイティーガバナンス
    simple: 経営者が責任をもって、IT の使い方を方向付け、監督することです。
    definition: 経営陣がステークホルダのニーズに基づき、組織の価値を高めるために IT の利活用を統治すること。JIS Q 38500 は、統治機関が IT について評価・指示・モニタ（EDM）のタスクを行うことを示す。
    related: [システム管理基準]
  - term: 情報セキュリティ監査
    reading: じょうほうセキュリティかんさ
    simple: 組織の情報セキュリティ対策が適切かを、独立した立場から調べて評価する監査です。
    definition: 情報セキュリティに係るリスクのマネジメントが効果的に実施されているかを検証・評価する監査。監査人の行為規範として情報セキュリティ監査基準を、判断の尺度として情報セキュリティ管理基準を用いる。
    related: [システム監査, ISMS]
  - term: CSA
    reading: シーエスエー
    fullName: Control Self Assessment
    japanese: 統制自己評価
    aliases: [統制自己評価]
    words:
      - { en: Control, ja: 統制 }
      - { en: Self, ja: 自己 }
      - { en: Assessment, ja: 評価 }
    simple: 業務を担当する人たち自身が、自分の業務のリスクやチェックの仕組みを評価する方法です。
    definition: 業務を担当する部門の管理者や担当者が、ワークショップや質問書などで自らの業務のリスクと統制の有効性を評価する手法。
    related: [内部統制]
  - term: システム監査人
    reading: しすてむかんさにん
    simple: システム監査を行う人です。
    definition: システム監査を実施する者。被監査部門から独立し、客観的な立場で監査を行う必要がある。
    related: [システム監査, 監査人の独立性]
  - term: 外部監査
    reading: がいぶかんさ
    simple: 組織の外部の第三者が行う監査です。
    definition: 監査対象の組織に属さない外部の独立した第三者が実施する監査。内部監査と対比される。
    related: [内部監査, 法定監査]
  - term: 法定監査
    reading: ほうていかんさ
    simple: 法律で義務づけられている監査です。
    definition: 法律の規定により実施が義務づけられている監査。会社法や金融商品取引法に基づく監査など。
    related: [内部監査, 任意監査, 会計監査]
  - term: 任意監査
    reading: にんいかんさ
    simple: 法律で義務づけられておらず、組織が自主的に行う監査です。
    definition: 法律の義務ではなく、組織が自主的な判断で実施する監査。システム監査の多くはこれにあたる。
    related: [内部監査, 法定監査]
  - term: 会計監査
    reading: かいけいかんさ
    simple: 財務諸表が適正に作成されているかを、確認する監査です。
    definition: 財務諸表が、企業の財政状態や経営成績を適正に表示しているかを検証する監査。
    related: [内部監査, 業務監査]
  - term: 業務監査
    reading: ぎょうむかんさ
    simple: 業務の運営が、方針や規程に従って適切・効率的に行われているかを確認する監査です。
    definition: 業務の運営が、法令や社内規程に従って適切、有効、効率的に行われているかを検証する監査。
    related: [内部監査, 会計監査]
  - term: 外観上の独立性
    reading: がいかんじょうのどくりつせい
    simple: 第三者から見ても、監査人が独立していると見えることです。
    definition: 監査人が被監査部門から独立した立場にあることが、第三者から見ても明らかであること。システム監査基準（令和5年版）の基準4では「外観的独立性」と表記される。
    related: [監査人の独立性, 精神上の独立性]
  - term: 精神上の独立性
    reading: せいしんじょうのどくりつせい
    simple: 監査人が、公正な判断を保つ、心の上での独立性です。
    definition: 監査人が、外部の圧力や利害に影響されず、公正かつ客観的に判断する精神的な態度を保つこと。システム監査基準（令和5年版）の基準4では「精神的独立性」と表記される。
    related: [監査人の独立性, 外観上の独立性]
  - term: 中長期監査計画
    reading: ちゅうちょうきかんさけいかく
    simple: 数年にわたる、監査の方針や重点を示した計画です。
    definition: 数年間にわたる監査の基本方針、重点目標、監査対象の範囲を示した計画。
    related: [システム監査計画, 年度監査計画]
  - term: 年度監査計画
    reading: ねんどかんさけいかく
    simple: "1年間の、監査の対象、時期、体制などを定めた計画です。"
    definition: 中長期計画に基づき、1 年間の監査対象、実施時期、体制、予算などを定めた計画。
    related: [システム監査計画, 中長期監査計画, 個別監査計画]
  - term: 個別監査計画
    reading: こべつかんさけいかく
    simple: 個々の監査について、目的、範囲、手順、日程などを具体的に定めた計画です。
    definition: 個別の監査テーマごとに、監査の目的、対象、手続、実施時期、担当者などを具体的に定めた計画。
    related: [システム監査計画, 年度監査計画]
  - term: 本調査
    reading: ほんちょうさ
    simple: 予備調査の結果をもとに、証拠を集めて、監査対象の実態を詳しく調べる調査です。
    definition: 予備調査で得た情報をもとに、監査証拠を収集し、監査項目に対する実態を詳細に調べる監査手続。
    related: [予備調査, システム監査技法]
  - term: 指摘事項
    reading: してきじこう
    simple: 監査で見つかった問題点で、報告書に記載するものです。
    definition: 監査の結果、基準に照らして問題があると判断された事項。根拠となる監査証拠とともに報告書に記載する。
    related: [システム監査報告書, 改善提案]
  - term: 改善提案
    reading: かいぜんていあん
    simple: 指摘事項に対して、監査人が示す改善の案です。
    definition: 指摘事項に対して、監査人が改善の方向性として示す提案。
    related: [システム監査報告書, 指摘事項]
  - term: フォローアップ報告書
    reading: ふぉろーあっぷほうこくしょ
    simple: 改善の実施状況を確認した結果をまとめた報告書です。
    definition: 指摘事項に対する改善の実施状況を確認した結果を、まとめた報告書。
    related: [フォローアップ, システム監査報告書]
  - term: チェックリスト法
    reading: ちぇっくりすとほう
    simple: 確認項目を一覧にしたリストを使って、監査する方法です。
    definition: 監査項目をチェックリストにあらかじめまとめ、それに沿って確認していく監査技法。
    related: [システム監査技法, ドキュメントレビュー法]
  - term: ドキュメントレビュー法
    reading: どきゅめんとれびゅーほう
    simple: 文書や記録を調べて、監査する方法です。
    definition: 規程、設計書、運用記録などの文書を査閲して、監査項目への適合を確認する監査技法。
    related: [システム監査技法, チェックリスト法]
  - term: インタビュー法
    reading: いんたびゅーほう
    simple: 関係者に直接質問して、情報を得る監査の方法です。
    definition: 関係者に直接質問して回答を得ることで、事実や実態を確認する監査技法。
    related: [システム監査技法, 現地調査法]
  - term: ウォークスルー法
    reading: うぉーくするーほう
    simple: 処理の流れを、最初から最後まで順にたどって確認する監査の方法です。
    definition: 業務やシステムの処理の流れを、入力から出力まで順に追って、手順や統制が適切かを確認する監査技法。
    related: [システム監査技法, 突合・照合法]
  - term: 突合・照合法
    reading: とつごう・しょうごうほう
    simple: 関連する複数の資料やデータを突き合わせて、整合性を確認する監査の方法です。
    definition: 関連する帳票やデータどうしを突き合わせて、内容が一致しているかを確認する監査技法。
    related: [システム監査技法, ウォークスルー法]
  - term: 現地調査法
    reading: げんちちょうさほう
    simple: 現場に出向いて、実際の状況を確認する監査の方法です。
    definition: 監査人が現場に出向いて、設備、作業状況などを視察し、実態を確認する監査技法。
    related: [システム監査技法, インタビュー法]
  - term: ログ分析法
    reading: ろぐぶんせきほう
    simple: システムの記録(ログ)を分析して、不正や異常がないか確認する監査の方法です。
    definition: システムの稼働ログやアクセスログを分析して、不正や異常がないか、手順が守られているかを確認する監査技法。
    related: [システム監査技法, ログ管理]
  - term: 内部統制報告制度
    reading: ないぶとうせいほうこくせいど
    aliases: [J-SOX]
    simple: 上場企業が、財務報告に関する内部統制を評価し、報告する制度で、J-SOXとも呼ばれます。
    definition: 金融商品取引法に基づき、上場企業が財務報告に係る内部統制の有効性を評価して報告し、監査人の監査を受ける制度。J-SOX ともいう。
    related: [内部統制, COSO]
  - term: 内部統制の限界
    reading: ないぶとうせいのげんかい
    simple: 内部統制を整備しても、完全には防げない弱点があるということです。
    definition: 判断の誤り、不注意、共謀、経営者による無視などにより、内部統制が完全には機能しない可能性があること。
    related: [内部統制]
  - term: 内部統制の基本的要素
    reading: ないぶとうせいのきほんてきようそ
    simple: 内部統制が機能するための、6つの基本要素です。
    definition: 内部統制の目的を達成するために必要な 6 つの要素。統制環境、リスクの評価と対応、統制活動、情報と伝達、モニタリング、ITへの対応。
    related: [統制環境, 統制活動, モニタリング（内部統制）]
  - term: リスクの評価と対応
    reading: りすくのひょうかとたいおう
    simple: 目的の達成を妨げるリスクを識別・評価し、対応策を選ぶことです。
    definition: 組織の目標達成を妨げるリスクを識別し、分析、評価して、適切な対応を選択するプロセス。内部統制の基本的要素の一つ。
    related: [内部統制の基本的要素, 統制環境]
  - term: 統制活動
    reading: とうせいかつどう
    simple: 指示が確実に実行されるようにする、承認、職務分掌などの方針や手続です。
    definition: 経営者の命令や指示が適切に実行されることを確保するための方針および手続。権限の付与、職務の分掌、承認などがある。
    related: [内部統制の基本的要素, 統制環境]
  - term: 情報と伝達
    reading: じょうほうとでんたつ
    simple: 必要な情報が、正しく関係者に伝わるようにすることです。
    definition: 必要な情報が識別、把握、処理され、組織内外の関係者に適切に伝達されることを確保すること。内部統制の基本的要素の一つ。
    related: [内部統制の基本的要素, 統制環境]
  - term: モニタリング（内部統制）
    reading: もにたりんぐないぶとうせい
    simple: 内部統制が、うまく機能しているかを継続的に評価することです。
    definition: 内部統制の有効性を継続的に評価するプロセス。日常的モニタリングと独立的評価がある。
    related: [内部統制の基本的要素, 統制環境]
  - term: ITへの対応
    reading: あいてぃーへのたいおう
    simple: 業務でITを活用する組織で、ITに関する内部統制を整備することです。
    definition: 組織目標の達成のために、IT を適切に利用し、IT の利用に対する統制（全般統制と業務処理統制）を整備すること。
    related: [内部統制の基本的要素, IT全般統制]
  - term: 業務処理統制
    reading: ぎょうむしょりとうせい
    aliases: [ITに係る業務処理統制]
    simple: 個々の業務処理が、正確かつ完全に行われることを保証する統制です。
    definition: 業務を処理するアプリケーションにおいて、データの入力から処理、出力が正確、網羅的に行われることを確保するための統制。入力チェックや突合など。
    related: [IT全般統制, 統制活動]
  - term: JIS Q 38500
    reading: じすきゅーさんはちごーぜろぜろ
    simple: ITガバナンスの原則とモデルを定めた規格です。
    definition: 組織が IT を効果的に利用するための IT ガバナンスの原則とモデルを示した規格（ISO/IEC 38500）。経営陣が評価、指示、モニタするモデルを示す。
    related: [ITガバナンス]
  - term: 情報セキュリティ監査基準
    reading: じょうほうせきゅりてぃかんさきじゅん
    simple: 情報セキュリティ監査を行う側が守るべき、基準です。
    definition: 情報セキュリティ監査を実施する監査人の行動規範となる基準。監査人の独立性、客観性、品質管理などを定める。
    related: [情報セキュリティ監査, 情報セキュリティ管理基準]
  - term: 情報セキュリティ管理基準
    reading: じょうほうせきゅりてぃかんりきじゅん
    simple: 情報セキュリティ監査で、被監査側の管理状況を評価するときの基準です。
    definition: 組織が情報セキュリティマネジメントを構築、運用する際の、管理策の拠り所となる基準。情報セキュリティ監査では、判断の尺度となる。
    related: [情報セキュリティ監査, 情報セキュリティ監査基準]
