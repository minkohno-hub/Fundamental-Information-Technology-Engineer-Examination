category: 企業と法務
terms:
  - term: 労働分配率
    reading: ろうどうぶんぱいりつ
    simple: 企業が生み出した付加価値のうち、人件費に回った割合のことです。
    definition: 付加価値に対する人件費の割合（人件費 ÷ 付加価値）。付加価値は売上高から材料費などの外部購入価値を差し引いて求め、人件費には製造部門の労務費と販売・管理部門の人件費の両方を含む。企業の規模や業種によって適正水準は異なる。
    related: [付加価値]
  - term: 付加価値
    reading: ふかかち
    simple: 企業が自らの活動で新たに生み出した価値のことです。
    definition: 売上高から、材料費・外注費など外部から購入した価値（外部購入価値）を差し引いたもの。企業内部で生まれた価値であり、人件費・減価償却費・営業利益などの源泉になる。労働分配率などの経営指標の分母に使われる。
    related: [労働分配率]
  - term: インタレスト・カバレッジ・レシオ
    reading: インタレスト・カバレッジ・レシオ
    simple: 事業で得た利益が、支払う利息の何倍あるかを示す指標です。
    definition: インタレスト・カバレッジ・レシオは（営業利益 ＋ 受取利息・配当金）÷ 支払利息で計算し、企業の利息支払能力を測る。値が大きいほど、利益に対して利息の負担が小さく、財務の安全性が高いと判断される。
    related: [財務諸表]
  - term: 棚卸資産回転率
    reading: たなおろししさんかいてんりつ
    simple: 在庫が1年間に何回入れ替わるかを示す指標です。
    definition: 売上原価 ÷ 平均棚卸資産で計算する在庫の回転の速さの指標。365 日をこの回転率で割ると、在庫が平均何日分あるか（回転期間）が得られる。分子に売上高ではなく売上原価を使うのは、在庫が原価で評価されるためである。
    related: [在庫管理]
  - term: 在庫管理
    reading: ざいこかんり
    simple: 在庫が不足も過剰もないように、発注の量と時期を調整することです。
    definition: 需要に応じて在庫量を適正に保つ管理活動。発注点方式では、在庫が発注点（リードタイム中の平均使用量 ＋ 安全在庫）に達したら発注する。安全在庫は需要のばらつきに備える分で、標準偏差とリードタイムの平方根から求めることが多い。
    related: [発注点, 安全在庫, 棚卸資産回転率]
  - term: 貸倒引当金
    reading: かしだおれひきあてきん
    simple: 売掛金などが回収できなくなる場合に備えて、あらかじめ計上しておく見積りの金額です。
    definition: 期末の売掛金や受取手形などの債権について、将来回収できなくなる見込み額を、貸倒実績率などに基づいて見積り、資産の控除項目として計上する引当金。設定の方法には、要設定額と既存の残高の差額を繰り入れる差額補充法と、残高を取り崩して全額を入れ替える洗替法がある。
    related: [帳簿価額]
