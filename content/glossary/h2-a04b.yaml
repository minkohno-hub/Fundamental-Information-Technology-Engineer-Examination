category: システム構成要素
terms:
  - term: 負荷分散
    reading: ふかぶんさん
    simple: 仕事を複数のサーバに分け、1台に集中しないようにすることです。
    definition: 複数のサーバや回線に処理を振り分け、特定の資源への集中を避ける方式。処理能力の合計を高めるほか、1台の故障時に残りで処理を続ける冗長性の確保にもつながる。振り分けにはロードバランサなどを用いる。
    related: [スループット]
  - term: 並列システム
    reading: へいれつしすてむ
    simple: 部品を複数並べ、どれか1つが動けば全体が動く構成です。
    definition: 複数の要素を並列に接続し、いずれか1つが機能すればシステムとして機能する構成。稼働率は 1 − （1 − A）の n 乗（A は要素の稼働率、n は要素数）で求め、全てがそろわないと動かない直列システムと対比される。
    related: [稼働率]
  - term: 力率
    reading: りきりつ
    simple: 電力が実際に仕事に使われる割合を示す数値です。
    definition: 皮相電力（電圧 × 電流、単位 VA）に対する有効電力（実際に仕事をする電力、単位 W）の比。力率が低いと、同じ有効電力を得るのに大きな電流と電源容量が必要になる。電源容量は皮相電力 ＝ 有効電力 ÷ 力率 で見積もる。
    related: [UPS]
