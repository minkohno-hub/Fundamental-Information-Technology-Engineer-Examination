category: セキュリティ
terms:
  - term: 認証
    reading: にんしょう
    simple: 相手が本人であることを、確かめることです。
    definition: 利用者や機器が、主張する本人や正規のものであることを確認する仕組み。知識（パスワード）、所有（ICカードなど）、生体（指紋など）の要素が使われ、異なる種類の要素を組み合わせると多要素認証になる。アクセスを許可する範囲を決める認可とは区別される。
    related: [多要素認証]
  - term: 最小権限
    reading: さいしょうけんげん
    simple: 仕事に必要な範囲だけの権限を、与えるという考え方です。
    definition: 利用者やプログラムに対して、業務に必要な最小限の権限だけを与えるという、セキュリティの原則。特権IDの管理では、担当の異動や退職に合わせて、不要になった権限を取り消すことが求められる。
    related: [特権ID]
  - term: 再委託
    reading: さいいたく
    simple: 委託を受けた会社が、さらに別の会社に仕事を任せることです。
    definition: 業務の委託を受けた事業者が、その業務の一部を別の事業者に委託すること。情報の委託では、再委託先にも元の委託と同じセキュリティ要件が及ぶよう、契約で定める必要がある。
    related: [委託先管理]
  - term: 時刻同期
    reading: じこくどうき
    simple: 複数の機器の時計を、正確にそろえることです。
    definition: サーバやネットワーク機器の内部時計を、NTPなどを使って正確な時刻にそろえること。ログの時刻がそろっていることで、複数の機器の記録を突き合わせ、不正アクセスの流れを再構成できる。
    related: [ログ管理]
  - term: 振込詐欺
    reading: ふりこみさぎ
    simple: だまして、指定した口座にお金を振り込ませる詐欺です。
    definition: 犯人が、実在の人物や機関を装ったり、虚偽の事情を告げたりして、被害者に指定の口座へ送金させる詐欺。企業を狙い、取引先や経営者を装ったメールで振込先の変更などを指示する手口は、ビジネスメール詐欺と呼ばれる。
    related: [ビジネスメール詐欺]
  - term: 仮想パッチ
    reading: かそうぱっち
    simple: プログラム自体を直せない間、その弱点を狙う通信を手前で遮って守る方法です。
    definition: 脆弱性のあるプログラム自体を修正できない、または修正までの間、ファイアウォールやIPS、WAFなどの手前の装置で、その脆弱性を突く通信を遮断・無害化することで攻撃を防ぐ緩和策。脆弱性そのものは残るため、本来の修正プログラムの適用までの橋渡しとして位置付けられる。
    related: [脆弱性]
  - term: ログ監視
    reading: ろぐかんし
    simple: 記録（ログ）を自動で見張り、おかしな兆候があれば知らせる仕組みです。
    definition: システムのログを自動的に監視し、大量のログイン失敗などの異常なパターンを検知して、担当者へ通知する仕組みや運用。ログを集約・保管するだけでは攻撃への気づきが遅れるため、検知の条件と、通知を受けた後の確認・対応の手順まで含めて設計する。
    related: [ログ管理]
