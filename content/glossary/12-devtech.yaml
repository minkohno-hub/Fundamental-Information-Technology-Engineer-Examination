category: システム開発技術
terms:
  - term: 要件定義
    reading: ようけんていぎ
    aliases: [システム要件定義, ソフトウェア要件定義]
    simple: システムに何をさせ、どのくらいの品質で動かすかを決めて、関係者と合意する工程です。
    definition: システム化の目標と対象範囲を定め、機能要件・非機能要件を明確にし、利害関係者のレビューを経て合意・文書化する工程。
    related: [機能要件, 非機能要件, トレーサビリティ]
  - term: 機能要件
    reading: きのうようけん
    simple: システムが「何をするか」についての要件です。
    definition: システムが実現すべき業務機能・処理内容に関する要件。
    related: [非機能要件]
  - term: 非機能要件
    reading: ひきのうようけん
    simple: 速さや信頼性、安全性など、機能以外の品質や条件についての要件です。
    definition: 性能、信頼性、セキュリティ、運用性、保守性、移行性など、業務機能以外の品質や制約に関する要件。
    related: [機能要件, ISO/IEC 25010]
  - term: トレーサビリティ
    reading: トレーサビリティ
    aliases: [双方向の追跡可能性, 追跡可能性, トレーサビリティマトリクス]
    simple: 要件・設計・テストなどの対応関係を、上流からも下流からもたどれることです。
    definition: 成果物間の対応関係を双方向に追跡できる性質。要件と設計・テストケースの対応を表にしたものをトレーサビリティマトリクスといい、反映漏れやテスト漏れ、変更の影響範囲の確認に用いる。
    related: [要件定義]
  - term: ヒアリング
    reading: ヒアリング
    aliases: [ヒアリング計画, ヒアリング議事録]
    simple: 利用者や担当者から、要求や業務の問題点を聞き取ることです。
    definition: 業務分析・要件定義のために関係者から直接聞き取りを行う手法。事前に計画を立てて質問事項を伝え、終了後は議事録を作成して相手に確認してもらう。
    related: [要件定義]
  - term: ユースケース
    reading: ユースケース
    aliases: [アクター, ユースケース記述]
    simple: 利用者（アクター）がシステムを使って達成する一まとまりの機能のことです。
    definition: システムが外部のアクター（利用者や外部システムなどの役割）に提供する機能の単位。ユースケース図や、手順を文章で表すユースケース記述で表す。
    related: [ユースケース図, UML]
  - term: プロトタイピング
    reading: プロトタイピング
    aliases: [プロトタイプ, モックアップ]
    simple: 試作品を作って利用者に見てもらい、要求を確かめながら進める方法です。
    definition: 開発の早い段階で試作品（プロトタイプ）を作成し、利用者の評価を受けて要求の誤解や漏れを発見・修正する手法。画面の見た目だけの模型をモックアップという。
    related: [要件定義]
  - term: DFD
    reading: ディーエフディー
    fullName: Data Flow Diagram
    japanese: データフロー図
    aliases: [データフロー図, データストア, データフロー]
    words:
      - { en: Data, ja: データ }
      - { en: Flow, ja: 流れ }
      - { en: Diagram, ja: 図 }
    simple: データがどこから来て、どう処理され、どこへ行くかを表す図です。
    definition: データフロー、プロセス、データストア、外部実体の4要素でデータの流れを表す図。処理の順序や分岐などの制御の流れは表さない。
    related: [E-R図]
  - term: パッケージ図
    reading: パッケージず
    simple: クラスなどをグループにまとめ、グループ同士の依存関係を表す UML の図です。
    definition: モデル要素をパッケージにまとめ、パッケージ間の依存関係を表す UML の構造図。
    related: [UML]
  - term: ユーザーストーリー
    reading: ユーザーストーリー
    aliases: [エピック]
    simple: 「誰が・何のために・何をしたいか」を短い文で書いた、利用者目線の要求です。
    definition: アジャイル開発で用いる、利用者にとっての価値を簡潔に表した要求の記述。受入れ基準を伴い、プロダクトバックログで管理する。1回のイテレーションに収まらない大きな要求をエピックといい、複数のストーリーに分割する。
    related: [ストーリーポイント]
  - term: ストーリーポイント
    reading: ストーリーポイント
    aliases: [プランニングポーカー]
    simple: ユーザーストーリーの大きさを、ほかのストーリーと比べた相対的な点数で見積もったものです。
    definition: 作業量・複雑さ・不確実性を考慮したユーザーストーリーの相対的な見積り値。時間単位ではない。プランニングポーカーなどでチームで決める。
    related: [ユーザーストーリー]
  - term: 決定表
    reading: けっていひょう
    aliases: [デシジョンテーブル]
    simple: 条件の組合せごとに、どの動作をするかを表にまとめたものです。
    definition: 条件記述部・条件指定部（Y/N）・動作記述部・動作指定部（X）からなり、条件の組合せと実行する動作の対応を表形式で表したもの。
    related: [原因結果グラフ]
  - term: SysML
    reading: シスエムエル
    fullName: Systems Modeling Language
    japanese: システムズモデリング言語
    words:
      - { en: Systems, ja: システム }
      - { en: Modeling, ja: モデル化 }
      - { en: Language, ja: 言語 }
    simple: UML を広げて、ハードウェアを含むシステム全体を図で表せるようにした言語です。
    definition: OMG が UML を基に策定したシステムズエンジニアリング向けのモデリング言語。要求図やパラメトリック図などを加え、システム全体の要求・構造・振る舞いを表す。
    related: [UML]
  - term: マイクロサービスアーキテクチャ
    reading: マイクロサービスアーキテクチャ
    aliases: [マイクロサービス]
    simple: システムを小さな独立したサービスの集まりとして作り、API でつなぐ方式です。
    definition: 独立して開発・デプロイ・スケールできる小さなサービスを API で連携させてシステムを構成するアーキテクチャ。変更の影響を局所化できるが、通信や運用が複雑になる。
    related: [API]
  - term: 網型データベース
    reading: あみがたデータベース
    aliases: [NDB, ネットワーク型データベース]
    simple: レコード同士の親子関係を網の目のようにつないだデータベースです。
    definition: レコード間の関係を網構造で表し、子レコードが複数の親をもてるデータベース。CODASYL 型ともいう。
    related: [階層型データベース]
  - term: 階層型データベース
    reading: かいそうがたデータベース
    simple: データを親子の木構造で管理するデータベースです。
    definition: レコードを1対多の親子関係からなる木構造で管理するデータベース。
    related: [網型データベース]
  - term: オブジェクト指向データベース
    reading: オブジェクトしこうデータベース
    aliases: [OODB]
    simple: データと処理をひとまとめにしたオブジェクトをそのまま保存するデータベースです。
    definition: データと手続（メソッド）を一体化したオブジェクトを格納するデータベース。複雑な構造のデータの扱いに適する。
    related: [オブジェクト指向]
  - term: クリーンアーキテクチャ
    reading: クリーンアーキテクチャ
    simple: 業務ルールを中心に置き、UI やデータベースの変更に影響されないようにする設計の考え方です。
    definition: ソフトウェアを同心円状の層（エンティティ、ユースケース、インタフェースアダプター、フレームワークとドライバ）に分け、ソースコードの依存を内側へのみ向けるアーキテクチャ。
    related: [依存性逆転の原則]
  - term: ISO/IEC 25010
    reading: アイエスオーアイイーシーにまんごせんじゅう
    aliases: [JIS X 25010, 製品品質モデル, 利用時の品質モデル, 品質特性, 機能適合性, 性能効率性, 互換性, 移植性]
    simple: ソフトウェアの品質を、どんな観点で評価するかを定めた国際規格です。
    definition: システム・ソフトウェア製品の品質モデルを定めた規格（JIS X 25010:2013）。製品品質は機能適合性・性能効率性・互換性・使用性・信頼性・セキュリティ・保守性・移植性の8特性、利用時の品質は有効性・効率性・満足性・リスク回避性・利用状況網羅性の5特性。
    related: [非機能要件]
  - term: データ中心アプローチ
    reading: データちゅうしんアプローチ
    aliases: [DOA, データ中心設計]
    simple: 変わりにくいデータの構造を先に設計して、システムを作る考え方です。
    definition: 業務データは処理手順より安定しているという考えから、データ構造を先に分析・設計する手法。一事実一箇所を目指す。
    related: [プロセス中心アプローチ, E-R図]
  - term: プロセス中心アプローチ
    reading: プロセスちゅうしんアプローチ
    aliases: [POA, プロセス中心設計]
    simple: 業務の処理手順を中心に分析・設計する考え方です。
    definition: 業務の処理（プロセス）を中心に分析し、処理ごとに必要なデータを設計する手法。
    related: [データ中心アプローチ]
  - term: 構造化設計
    reading: こうぞうかせっけい
    aliases: [段階的詳細化, 構造化チャート]
    simple: 機能を上から下へ段階的に分解して設計する方法です。
    definition: システムの機能を階層的に分解し、段階的に詳細化して、順次・選択・繰返しの基本構造で表す設計手法。
    related: [モジュール分割]
  - term: NS図
    reading: エヌエスず
    fullName: Nassi-Shneiderman diagram
    japanese: ナッシ・シュナイダーマン図
    aliases: [ナッシシュナイダマン図]
    words:
      - { en: Nassi-Shneiderman, ja: 考案者の名前 }
      - { en: diagram, ja: 図 }
    simple: 順次・選択・繰返しを箱の入れ子で表す、処理手順の図です。
    definition: 構造化プログラミングの基本構造を長方形の箱の組合せで表す図。矢印を使わないため任意の分岐（goto）を表せない。
    related: [流れ図]
  - term: HIPO
    reading: ハイポ
    fullName: Hierarchy plus Input Process Output
    japanese: 階層と入力・処理・出力
    words:
      - { en: Hierarchy, ja: 階層 }
      - { en: Input, ja: 入力 }
      - { en: Process, ja: 処理 }
      - { en: Output, ja: 出力 }
    simple: 機能の階層図と、入力・処理・出力の図を組み合わせて機能を表す手法です。
    definition: 図式目次と、総括・詳細ダイアグラム（IPO 図）で機能を記述する設計・文書化手法。
    related: [構造化設計]
  - term: ジャクソン法
    reading: ジャクソンほう
    simple: 入力と出力のデータ構造の対応から、プログラムの構造を決める設計手法です。
    definition: 入出力データ構造を基本・連続・選択・繰返しで表し、その対応関係からプログラム構造を導くデータ構造中心の設計手法。
    related: [ワーニエ法]
  - term: ワーニエ法
    reading: ワーニエほう
    simple: 入力データの構造を集合の考え方で分析して、プログラムの構造を決める設計手法です。
    definition: 入力データの構造を基に、集合論の考え方で処理を「いつ」「何回」行うかを整理してプログラム構造を決める手法。
    related: [ジャクソン法]
  - term: SOLID
    reading: ソリッド
    fullName: Single responsibility, Open-closed, Liskov substitution, Interface segregation, Dependency inversion
    japanese: オブジェクト指向設計の5原則
    aliases: [SOLID原則, ソフトウェア設計原則]
    words:
      - { en: Single responsibility, ja: 単一責任 }
      - { en: Open-closed, ja: 開放閉鎖 }
      - { en: Liskov substitution, ja: リスコフの置換 }
      - { en: Interface segregation, ja: インタフェース分離 }
      - { en: Dependency inversion, ja: 依存性逆転 }
    simple: 変更に強いオブジェクト指向の設計をするための5つの原則の頭文字です。
    definition: 単一責任の原則、開放閉鎖原則、リスコフの置換原則、インタフェース分離の原則、依存性逆転の原則の総称。
    related: [オブジェクト指向]
  - term: 単一責任の原則
    reading: たんいつせきにんのげんそく
    simple: 1つのクラスには1つの責任だけをもたせる原則です。
    definition: クラスを変更する理由が1つだけになるように責任を分ける設計原則。
    related: [SOLID]
  - term: 開放閉鎖原則
    reading: かいほうへいさげんそく
    aliases: [オープン・クローズドの原則]
    simple: 既存のコードを書き換えずに、追加で機能を拡張できるようにする原則です。
    definition: ソフトウェアの構成要素は拡張に対して開き、修正に対して閉じているべきだとする設計原則。
    related: [SOLID]
  - term: リスコフの置換原則
    reading: リスコフのちかんげんそく
    simple: 子クラスは親クラスの代わりに使っても正しく動かなければならない、という原則です。
    definition: 派生型のインスタンスを基底型のインスタンスと置き換えてもプログラムが正しく動作しなければならないとする設計原則。
    related: [SOLID, 継承]
  - term: インタフェース分離の原則
    reading: インタフェースぶんりのげんそく
    simple: 使わない操作まで押し付ける大きなインタフェースを、小さく分ける原則です。
    definition: クライアントに、使用しない操作への依存を強制してはならないとする設計原則。
    related: [SOLID]
  - term: 依存性逆転の原則
    reading: いぞんせいぎゃくてんのげんそく
    simple: 上位も下位も、具体的な実装ではなく抽象（インタフェース）に依存させる原則です。
    definition: 上位モジュールは下位モジュールに依存せず、両者とも抽象に依存すべきだとする設計原則。
    related: [SOLID, クリーンアーキテクチャ]
  - term: 汎化
    reading: はんか
    aliases: [特化, is-a関係]
    simple: 複数のクラスの共通点をまとめて、上位のクラスを作ることです。
    definition: 複数のクラスに共通する性質を抽出して上位クラスを定義すること（is-a 関係）。逆に上位クラスから下位クラスを具体化することを特化という。
    related: [継承, 集約]
  - term: 集約
    reading: しゅうやく
    aliases: [part-of関係, コンポジション]
    simple: 「全体」と「部分」の関係のことです。
    definition: あるクラスのオブジェクトが他のクラスのオブジェクトを部分としてもつ関係（part-of 関係）。部分と全体の生存期間が一致する強い集約をコンポジションという。
    related: [汎化]
  - term: DDD
    reading: ディーディーディー
    fullName: Domain-Driven Design
    japanese: ドメイン駆動設計
    aliases: [ドメイン駆動設計, ドメインモデル, ドメインロジック]
    words:
      - { en: Domain, ja: 領域（対象業務） }
      - { en: Driven, ja: 駆動される }
      - { en: Design, ja: 設計 }
    simple: 対象業務の知識をモデルにして、それを中心にソフトウェアを設計する方法です。
    definition: 業務の専門家と開発者がユビキタス言語でドメインモデルを作り、業務ルールをモデルに集約して継続的に改善する設計手法。
    related: [ユビキタス言語]
  - term: ユビキタス言語
    reading: ユビキタスげんご
    simple: 業務の専門家と開発者が共通に使い、コードにも使う言葉のことです。
    definition: ドメイン駆動設計で、関係者が会話・文書・モデル・ソースコードに一貫して用いる共通の用語体系。
    related: [DDD]
  - term: 共通機能分割
    reading: きょうつうきのうぶんかつ
    simple: いくつものプログラムで使う共通の処理を、独立したモジュールにまとめる方法です。
    definition: 複数箇所で共通に使われる機能を独立したモジュール（サブルーチン）として分割する技法。
    related: [モジュール分割]
  - term: MVC
    reading: エムブイシー
    fullName: Model-View-Controller
    japanese: モデル・ビュー・コントローラ
    aliases: [MVCモデル]
    words:
      - { en: Model, ja: データと業務処理 }
      - { en: View, ja: 表示 }
      - { en: Controller, ja: 入力の受付と制御 }
    simple: アプリケーションを、データ・表示・入力制御の3つの役割に分ける設計パターンです。
    definition: 対話型アプリケーションを Model（データとビジネスロジック）、View（表示）、Controller（入力の受付と制御）に分けるアーキテクチャパターン。
    related: [デザインパターン]
  - term: デザインパターン
    reading: デザインパターン
    aliases: [GoF]
    simple: よくある設計上の問題に対する、再利用できる解決策の型です。
    definition: オブジェクト指向設計で繰り返し現れる問題と解決策を名前付きでまとめたもの。GoF の23パターンは生成・構造・振る舞いの3つに分類される。
    related: [オブジェクト指向]
  - term: Singletonパターン
    reading: シングルトンパターン
    aliases: [Singleton]
    simple: インスタンスが1つしか作られないようにするデザインパターンです。
    definition: クラスのインスタンスが唯一であることを保証する、生成に関するデザインパターン。
    related: [デザインパターン]
  - term: Observerパターン
    reading: オブザーバーパターン
    aliases: [Observer]
    simple: 状態が変わったことを、登録された相手にまとめて知らせるデザインパターンです。
    definition: オブジェクトの状態変化を依存する複数のオブジェクトに通知する、振る舞いに関するデザインパターン。
    related: [デザインパターン]
  - term: Adapterパターン
    reading: アダプターパターン
    aliases: [Adapter]
    simple: 合わないインタフェースを変換して、既存のクラスを使えるようにするデザインパターンです。
    definition: 既存クラスのインタフェースを利用者が期待するインタフェースに変換する、構造に関するデザインパターン。
    related: [デザインパターン]
  - term: Compositeパターン
    reading: コンポジットパターン
    aliases: [Composite]
    simple: 部分と全体を木構造にして、同じように扱えるようにするデザインパターンです。
    definition: オブジェクトを木構造に組み立て、個々のオブジェクトとその集まりを同一視して扱えるようにする、構造に関するデザインパターン。
    related: [デザインパターン]
  - term: Factory Methodパターン
    reading: ファクトリーメソッドパターン
    aliases: [Factory Method]
    simple: どのクラスのオブジェクトを作るかを、サブクラスに任せるデザインパターンです。
    definition: インスタンス生成をサブクラスに任せ、生成するクラスを利用側から切り離す、生成に関するデザインパターン。
    related: [デザインパターン]
  - term: インスペクション
    reading: インスペクション
    aliases: [モデレーター, コードインスペクション]
    simple: 進行役（モデレーター）のもとで、決まった手順で公式に行うレビューです。
    definition: モデレーターが主導し、役割・手順・チェックリストを定めて公式に行うレビュー。欠陥を記録し修正完了まで追跡する。
    related: [ウォークスルー, ピアレビュー]
  - term: ウォークスルー
    reading: ウォークスルー
    simple: 作成者が成果物を説明しながら、参加者に誤りを指摘してもらうレビューです。
    definition: 成果物の作成者が主催し、内容を順に説明して参加者から問題点の指摘を受けるレビュー手法。
    related: [インスペクション]
  - term: ピアレビュー
    reading: ピアレビュー
    aliases: [ピアコードレビュー]
    simple: 同じ立場の同僚どうしで成果物を確認し合うレビューです。
    definition: 作成者と同等の立場の担当者が成果物をレビューし、誤りや改善点を指摘する手法。
    related: [インスペクション]
  - term: コードオーディター
    reading: コードオーディター
    simple: ソースコードがコーディング規約どおりかを自動で調べるツールです。
    definition: ソースコードを解析して、コーディング規約違反を自動的に検出するツール。
    related: [コーディング標準]
  - term: コード補完
    reading: コードほかん
    aliases: [オートインデント, シンタックスハイライト]
    simple: 入力途中で変数名などの候補を出して、入力を助ける機能です。
    definition: 入力中の文字に続く変数名・関数名・予約語などの候補を示して入力を支援する機能。字下げを自動で行うオートインデント、予約語などを色分けするシンタックスハイライトとともに代表的なコーディング支援機能。
    related: [コーディング標準]
  - term: サイクロマティック複雑度
    reading: サイクロマティックふくざつど
    aliases: [循環的複雑度, McCabeの循環的複雑度]
    simple: プログラムの分岐の多さ（複雑さ）を数値で表したものです。
    definition: 制御フローグラフのエッジ数 E、ノード数 N、連結成分数 P から E − N + 2P で求める複雑さの尺度。構造化されたプログラムでは判定数 + 1 に等しい。
    related: [ホワイトボックステスト]
  - term: テストドライバ
    reading: テストドライバ
    aliases: [ドライバ（テスト）]
    simple: 未完成の上位モジュールの代わりに、テスト対象を呼び出すテスト用プログラムです。
    definition: テスト対象モジュールを呼び出してテストデータを渡し、結果を受け取るテスト用のプログラム。ボトムアップテストで用いる。
    related: [スタブ]
  - term: スタブ
    reading: スタブ
    simple: 未完成の下位モジュールの代わりに、呼び出されて仮の結果を返すテスト用プログラムです。
    definition: テスト対象モジュールから呼び出される下位モジュールの代わりをするテスト用のプログラム。トップダウンテストで用いる。
    related: [テストドライバ]
  - term: ホワイトボックステスト
    reading: ホワイトボックステスト
    simple: プログラムの中身（内部構造）を見て、命令や分岐を通るようにテストする方法です。
    definition: 内部の論理構造に基づいてテストケースを設計し、命令網羅・判定条件網羅などの網羅率で評価するテスト。
    related: [ブラックボックステスト, 命令網羅]
  - term: ブラックボックステスト
    reading: ブラックボックステスト
    simple: 中身を見ずに、仕様どおりの入力と出力になるかを確かめるテストです。
    definition: 内部構造を考慮せず外部仕様に基づいて入出力を確認するテスト。同値分割、限界値分析、原因結果グラフなどで設計する。
    related: [ホワイトボックステスト, 同値分割]
  - term: 命令網羅
    reading: めいれいもうら
    aliases: [ステートメントカバレッジ]
    simple: すべての命令を少なくとも1回は実行するようにテストすることです。
    definition: プログラム中のすべての命令を少なくとも1回実行するテストケースを設計する網羅基準。
    related: [判定条件網羅]
  - term: 判定条件網羅
    reading: はんていじょうけんもうら
    aliases: [分岐網羅, デシジョンカバレッジ]
    simple: すべての分岐で、真と偽の両方を通るようにテストすることです。
    definition: 各判定の結果が真と偽の両方になるようにテストケースを設計する網羅基準。
    related: [命令網羅, 条件網羅]
  - term: 条件網羅
    reading: じょうけんもうら
    aliases: [コンディションカバレッジ]
    simple: 判定の中の一つ一つの条件が、真と偽の両方をとるようにテストすることです。
    definition: 判定に含まれる個々の条件が真と偽の両方をとるようにする網羅基準。判定全体の真偽の網羅は保証しない。
    related: [判定条件網羅, 複数条件網羅]
  - term: 複数条件網羅
    reading: ふくすうじょうけんもうら
    simple: 条件の真偽のすべての組合せをテストすることです。
    definition: 判定に含まれる条件の真偽のすべての組合せを網羅する基準。条件が n 個なら 2^n 通り。
    related: [条件網羅]
  - term: 同値分割
    reading: どうちぶんかつ
    aliases: [同値分割法, 同値分析法, 同値クラス]
    simple: 同じ処理になる入力をグループに分け、各グループから代表値を選んでテストする方法です。
    definition: 入力を有効・無効の同値クラスに分け、各クラスの代表値をテストデータとするブラックボックステストの技法。
    related: [限界値分析]
  - term: 限界値分析
    reading: げんかいちぶんせき
    aliases: [限界値分析法, 境界値分析]
    simple: 範囲の境目とそのすぐ外側の値を使ってテストする方法です。
    definition: 誤りが起きやすい同値クラスの境界の値とその前後の値をテストデータとする技法。
    related: [同値分割]
  - term: 原因結果グラフ
    reading: げんいんけっかグラフ
    aliases: [原因結果グラフ法]
    simple: 入力条件と結果の論理関係をグラフにして、テストケースを作る方法です。
    definition: 入力条件（原因）と出力（結果）の論理関係をグラフで表し、決定表に変換してテストケースを導く技法。
    related: [決定表]
  - term: エラー埋込法
    reading: エラーうめこみほう
    aliases: [バグ埋込み法]
    simple: わざとエラーを埋め込み、見つかった割合から残っているエラーの数を推定する方法です。
    definition: 既知のエラーを埋め込んでテストし、埋込みエラーの発見率と固有エラーの発見率が等しいとして固有エラーの総数・残存数を推定する手法。
    related: [バグ曲線]
  - term: 実験計画法
    reading: じっけんけいかくほう
    aliases: [直交表]
    simple: 直交表を使って、少ないテストで多くの組合せを効率よく確かめる方法です。
    definition: 直交表を用い、任意の2因子間の水準の組合せが均等に現れるようにテストケースを選ぶ手法。
    related: [原因結果グラフ]
  - term: バグ曲線
    reading: バグきょくせん
    aliases: [信頼度成長曲線, ゴンペルツ曲線, バグ管理図]
    simple: テストの進み具合と見つかったバグの累計の関係を表すグラフです。
    definition: テスト時間や消化項目数に対する累積バグ発見数の曲線。一般に S 字形（ゴンペルツ曲線など）となり、飽和に近づけば品質が安定したと判断する目安になる。
    related: [エラー埋込法]
  - term: 単体テスト
    reading: たんたいテスト
    aliases: [ユニットテスト]
    simple: モジュールなどの小さな単位ごとに、仕様どおり動くかを確かめるテストです。
    definition: ソフトウェアユニット（モジュール）単位で仕様どおりに動作するかを確認するテスト。主にホワイトボックステストで行う。
    related: [統合テスト]
  - term: 統合テスト
    reading: とうごうテスト
    aliases: [結合テスト, ソフトウェア統合テスト, ビッグバンテスト, サンドイッチテスト]
    simple: モジュールをつなぎ合わせて、間のやり取りが正しく動くかを確かめるテストです。
    definition: モジュールを結合してインタフェースを確認するテスト。トップダウン、ボトムアップ、一度に結合するビッグバン、両方向から進めるサンドイッチなどの方式がある。
    related: [トップダウンテスト, ボトムアップテスト]
  - term: トップダウンテスト
    reading: トップダウンテスト
    simple: 上位のモジュールから順につないでテストする方法で、下位の代わりにスタブを使います。
    definition: 上位モジュールから順に結合する統合テストの方式。未完成の下位モジュールはスタブで代替する。
    related: [スタブ, ボトムアップテスト]
  - term: ボトムアップテスト
    reading: ボトムアップテスト
    simple: 下位のモジュールから順につないでテストする方法で、上位の代わりにドライバを使います。
    definition: 下位モジュールから順に結合する統合テストの方式。未完成の上位モジュールはドライバで代替する。
    related: [テストドライバ, トップダウンテスト]
  - term: システムテスト
    reading: システムテスト
    aliases: [総合テスト, システム検証テスト]
    simple: 完成したシステム全体が要件どおりかを、開発者側が確かめるテストです。
    definition: 統合したシステム全体が機能要件・非機能要件を含むシステム要件を満たすかを開発者側が確認するテスト。
    related: [受入れテスト]
  - term: 回帰テスト
    reading: かいきテスト
    aliases: [リグレッションテスト]
    simple: 修正したときに、ほかの部分が壊れていないかを確かめるテストです。
    definition: プログラムの修正・機能追加によって、既存の正常な部分に悪影響が出ていないことを確認するテスト。
    related: [リファクタリング]
  - term: 性能テスト
    reading: せいのうテスト
    simple: 応答時間や処理件数が要件どおりかを確かめるテストです。
    definition: 想定される処理量で、応答時間・スループットなどの性能要件を満たすかを確認するテスト。
    related: [負荷テスト]
  - term: 負荷テスト
    reading: ふかテスト
    aliases: [ストレステスト]
    simple: 想定を超える負荷をかけて、システムが耐えられるかや限界を確かめるテストです。
    definition: 大量のデータやアクセスなど高い負荷をかけ、処理を継続できるか、処理能力の限界はどこかを確認するテスト。
    related: [性能テスト]
  - term: 探索的テスト
    reading: たんさくてきテスト
    simple: 操作しながら学び、次に何を試すかを考えながら進めるテストです。
    definition: テスト担当者が学習・テスト設計・実行を同時に行い、結果に応じて次のテストを決めていく手法。
    related: [システムテスト]
  - term: 受入れテスト
    reading: うけいれテスト
    aliases: [受入れ基準]
    simple: 発注者が、納品されたシステムを業務で使えるかを確かめるテストです。
    definition: 発注者（利用者側）が主体となり、事前に合意した受入れ基準に基づいて、システムが要件を満たし業務で利用できるかを確認するテスト。
    related: [検収]
  - term: 検収
    reading: けんしゅう
    aliases: [検収基準]
    simple: 納品物を発注者が検査し、合格として受け取ることです。
    definition: 納入された成果物を検収基準に照らして検査し、合格として受け取ること。一般に代金支払の根拠となる。
    related: [受入れテスト]
  - term: 妥当性確認テスト
    reading: だとうせいかくにんテスト
    aliases: [妥当性確認]
    simple: システムが利用者の本当の目的に合っているかを、実際の利用環境で確かめるテストです。
    definition: システムやソフトウェアが、意図された利用環境で利用者の意図する用途・要求を満たすかを確認するテスト（バリデーション）。仕様どおりかを確かめる検証とは区別される。
    related: [受入れテスト]
  - term: 利用者マニュアル
    reading: りようしゃマニュアル
    aliases: [利用者用文書類, オンラインヘルプ, チュートリアル, ウィザード]
    simple: 利用者がシステムを使うための説明書や、操作を助ける仕組みです。
    definition: システム・ソフトウェアの利用方法を説明する文書類。画面から呼び出すオンラインヘルプ、例題で学ぶチュートリアル、対話形式で操作を進めるウィザードなどがある。
    related: [受入れテスト]
  - term: 是正保守
    reading: ぜせいほしゅ
    simple: 見つかった障害を直す保守です。
    definition: 引渡し後に発見された問題を訂正するために行うソフトウェアの修正。
    related: [予防保守]
  - term: 適応保守
    reading: てきおうほしゅ
    simple: OS の更新など、環境の変化に合わせてソフトウェアを直す保守です。
    definition: 変化した又は変化している環境でソフトウェアを使用できるように保つための修正。
    related: [完全化保守]
  - term: 完全化保守
    reading: かんぜんかほしゅ
    simple: 性能や保守性をよくするためにソフトウェアを改良する保守です。
    definition: 性能や保守性などソフトウェアの品質特性を改善するための修正。
    related: [適応保守]
  - term: 予防保守
    reading: よぼうほしゅ
    simple: 隠れた欠陥を、故障になる前に見つけて直す保守です。
    definition: 潜在的な欠陥が故障として現れる前に発見して訂正するための修正。
    related: [是正保守]
  - term: リファクタリング
    reading: リファクタリング
    simple: 動作を変えずに、プログラムの中身を読みやすく直しやすい形に整えることです。
    definition: 外部から見た振る舞いを変えずに、ソフトウェアの内部構造を改善すること。
    related: [回帰テスト]
  - term: リバースエンジニアリング
    reading: リバースエンジニアリング
    simple: 既存のプログラムを解析して、仕様や設計を割り出すことです。
    definition: 既存ソフトウェアのソースコードや実行形式、データ定義などを解析して仕様・設計情報を導き出す手法。
    related: [リファクタリング]
  - term: システム移行
    reading: システムいこう
    aliases: [一斉移行, 段階移行, 並行運用, 並行移行, パイロット移行]
    simple: 古いシステムから新しいシステムへ、業務やデータを切り替えることです。
    definition: 旧環境から新環境へ切り替える作業。一度に切り替える一斉移行、段階的に切り替える段階移行、新旧を並行稼働させる並行運用（並行移行）、一部で先行するパイロット移行などの方式がある。
    related: [回帰テスト]
