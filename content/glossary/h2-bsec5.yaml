category: 情報セキュリティ
terms:
  - term: 情報の格付け
    reading: じょうほうのかくづけ
    simple: 情報の重要さに応じて、段階を付けることです。
    definition: 情報を、その漏えいや改ざんが起きた場合の影響の大きさに応じて、段階的に分類すること。分類を表示し、分類ごとに保存・送信・廃棄の取扱いを定めることで、扱う人が重要さに応じた扱いを選べるようにする。情報の取扱いの仕組みの基礎になる。
    related: [機密情報]
  - term: 機密情報
    reading: きみつじょうほう
    simple: 外に漏れてはいけない、大切な情報です。
    definition: 漏えいすると組織や個人に大きな損害を与える情報。重要度に応じて格付けされ、保存・送信・廃棄の取扱いが定められる。顧客の個人情報や、未発表の事業の情報などが当たる。
    related: [情報の格付け]
  - term: アップデート
    reading: あっぷでーと
    simple: ソフトウェアを、新しい版に更新することです。
    definition: ソフトウェアを、機能の追加や不具合・脆弱性の修正を含む新しい版に置き換えること。更新は速やかに行うことが望ましいが、入手は公式の配布元や正規の更新の仕組みから行う。閲覧中の画面に出る案内など、出どころの不明な経路からの更新は、マルウェア感染の入り口になる。
    related: [マルウェア]
