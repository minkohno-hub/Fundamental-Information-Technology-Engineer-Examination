category: 補遺
terms:
  - term: プロモーション戦略
    reading: ぷろもーしょんせんりゃく
    simple: 商品やサービスの存在や良さを顧客に伝え，購買につなげるための方法の組合せを決めることです。
    definition: マーケティングミックス（4P）のうち，顧客への情報伝達と購買意欲の喚起に関する戦略。広告，販売促進（セールスプロモーション），パブリシティ，人的販売などの手段を目的や対象に合わせて組み合わせる。
    related: [パブリシティ]
  - term: 人間中心のAI社会原則
    reading: にんげんちゅうしんのえーあいしゃかいげんそく
    simple: AI を社会で安心して使うために，日本政府が示した基本的な考え方です。
    definition: 2019年に内閣府の統合イノベーション戦略推進会議が決定した AI 活用の基本原則。人間中心の原則，教育・リテラシーの原則，プライバシー確保の原則，セキュリティ確保の原則，公正競争確保の原則，公平性・説明責任及び透明性の原則，イノベーションの原則の七つを掲げる。
    related: [説明責任]
  - term: 説明責任
    reading: せつめいせきにん
    simple: 行ったことや判断の理由を，関係者が納得できるように説明する責任です。
    definition: 組織や個人が，自らの行動や意思決定の内容と根拠について，利害関係者に対して説明する責任。AI の利用では，意思決定の過程や結果を利用者が納得できるよう説明することが求められる。
    related: [人間中心のAI社会原則]
  - term: 特化型AI
    reading: とっかがたえーあい
    aliases: [特化型人工知能]
    simple: 囲碁や画像認識など，決まった分野の仕事だけを得意とする AI です。
    definition: 特定の領域やタスクに限定して高い性能を発揮するよう設計された AI。現在実用化されている AI の大半が該当する。あらゆる領域に対応できる汎用 AI と対比される。
    related: [汎用AI]
  - term: 汎用AI
    reading: はんようえーあい
    aliases: [汎用人工知能, AGI]
    simple: 人間のように，どんな分野の課題でも自分で学んで解ける AI のことです。
    definition: 特定の領域に限らず，人間と同様に多様な課題を理解・学習して解決できる AI（Artificial General Intelligence）。実現には，フレーム問題やシンボルグラウンディング問題など多くの課題があるとされる。
    related: [特化型AI]
  - term: エンジニアリングシステム
    reading: えんじにありんぐしすてむ
    simple: 製品の設計や製造など技術の仕事を，コンピュータで支援・効率化する仕組みです。
    definition: 製品の設計（CAD），製造（CAM），生産管理，製品情報の管理などの技術業務に情報技術を活用し，開発期間の短縮，品質の向上，コスト削減を図るシステムの総称。
    related: [CAD]
  - term: 電子入札
    reading: でんしにゅうさつ
    simple: 国や自治体の入札の手続を，インターネット上で行う仕組みです。
    definition: 入札公告，入札書の提出，開札，落札者の決定などの入札手続をネットワーク上で行う仕組み。事業者の負担軽減，事務の効率化，手続の透明性・公平性の向上が期待できる。電子証明書による本人確認を行う。
    related: [電子商取引]
  - term: XML-EDI
    reading: えっくすえむえるいーでぃーあい
    simple: 企業間のデータ交換に，XML という書式を使う方式です。
    definition: 企業間の電子データ交換（EDI）で，データ形式に XML を用いる方式。タグでデータの意味を表現するため，取引先ごとの個別の形式に依存せず，柔軟にデータを交換できる。
    related: [XBRL]
  - term: ユビキタスコンピューティング
    reading: ゆびきたすこんぴゅーてぃんぐ
    simple: コンピュータが身の回りに溶け込み，いつでもどこでも使える状態のことです。
    definition: コンピュータやネットワークが生活環境のあらゆる場所に組み込まれ，利用者が意識することなく，いつでもどこでも情報サービスを利用できる環境や考え方。
    related: [情報家電]
  - term: 情報家電
    reading: じょうほうかでん
    simple: ネットワークにつながり，情報機器のように使える家電です。
    definition: ネットワークに接続する機能や，コンピュータを組み込んで情報処理を行う機能をもつ家電機器の総称。スマートテレビ，ネットワーク対応の冷蔵庫やエアコンなど。
    related: [ユビキタスコンピューティング, HEMS]
  - term: HEMS
    reading: へむす
    fullName: Home Energy Management System
    japanese: 家庭内エネルギー管理システム
    words:
      - { en: Home, ja: 家庭 }
      - { en: Energy, ja: エネルギー }
      - { en: Management System, ja: 管理システム }
    simple: 家庭の電気の使用量を見える化し，家電を制御して省エネを助けるシステムです。
    definition: 家庭内の電力使用量などを計測して可視化し，家電や給湯器，太陽光発電，蓄電池などを制御することで，省エネルギーを支援するシステム。ビル向けは BEMS，工場向けは FEMS と呼ばれる。
    related: [ホームネットワーク]
  - term: ホームネットワーク
    reading: ほーむねっとわーく
    simple: 家の中の家電や情報機器をつなぐネットワークです。
    definition: 家庭内のパソコン，家電，AV 機器，センサなどを有線や無線で接続するネットワーク。機器の相互接続や遠隔操作，HEMS による省エネ制御の基盤になる。
    related: [HEMS]
  - term: 患者モニタリング装置
    reading: かんじゃもにたりんぐそうち
    aliases: [生体情報モニタ]
    simple: 患者の心拍や血圧などを測り続け，異常があれば知らせる装置です。
    definition: 心電図，心拍数，血圧，呼吸数，血中酸素飽和度（SpO2），体温などの生体情報を継続的に測定して表示し，異常を検知するとアラームで医療従事者に知らせる医療機器。
    related: [医療機器]
  - term: 医療機器
    reading: いりょうきき
    simple: 病気の診断や治療，患者の状態の監視などに使う機器です。
    definition: 人や動物の疾病の診断，治療，予防などに使われる機械器具の総称。情報技術を組み込んだものも多く，安全性や有効性について医薬品医療機器等法による規制を受ける。
    related: [患者モニタリング装置]
  - term: 株式会社
    reading: かぶしきがいしゃ
    simple: 株式を発行して出資を集め，出資者（株主）が出資額の範囲で責任を負う会社です。
    definition: 株式を発行して資金を集める会社形態。出資者である株主は出資額を限度とする有限責任を負い，所有（株主）と経営（取締役など）が分離している。株式を証券取引所に上場して公開する株式公開（IPO）も可能。
    related: [持分会社, 有限責任]
  - term: 持分会社
    reading: もちぶんがいしゃ
    simple: 合名会社，合資会社，合同会社の総称で，出資者自身が経営に関わることが多い会社です。
    definition: 合名会社，合資会社，合同会社の総称。出資者（社員）が原則として業務を執行する。合名会社は無限責任社員のみ，合資会社は無限責任社員と有限責任社員，合同会社は有限責任社員のみで構成される。
    related: [株式会社]
  - term: 有限責任
    reading: ゆうげんせきにん
    simple: 会社が借金を返せなくても，出資した金額を超えて責任を負わないことです。
    definition: 出資者が，会社の債務について出資額を限度として責任を負うこと。株式会社の株主や合同会社の社員が該当する。出資額を超えて責任を負う場合は無限責任という。
    related: [株式会社, 持分会社]
  - term: PDCA
    reading: ぴーでぃーしーえー
    fullName: Plan Do Check Act
    japanese: 計画・実行・評価・改善
    words:
      - { en: Plan, ja: 計画 }
      - { en: Do, ja: 実行 }
      - { en: Check, ja: 評価 }
      - { en: Act, ja: 改善 }
    simple: 計画，実行，評価，改善を繰り返して，仕事の質を高めていく管理の進め方です。
    definition: 計画（Plan），実行（Do），評価（Check），改善（Act）の四つの段階を繰り返し，業務や品質を継続的に改善する管理サイクル。ISO 9001 や ISO/IEC 27001 などのマネジメントシステムの基本的な考え方になっている。
    related: [経営目標]
  - term: 経営目標
    reading: けいえいもくひょう
    simple: 企業が達成しようとする，売上や利益，シェアなどの目標です。
    definition: 企業が経営理念や経営戦略に基づいて設定する達成目標。売上高，利益，市場占有率などの数値目標が多く，これを達成するために部門や個人の目標，行動計画，予算へと具体化し，PDCA で管理する。
    related: [PDCA]
  - term: SRI
    reading: えすあーるあい
    fullName: Socially Responsible Investment
    japanese: 社会的責任投資
    words:
      - { en: Socially, ja: 社会的に }
      - { en: Responsible, ja: 責任ある }
      - { en: Investment, ja: 投資 }
    simple: 利益だけでなく，環境や社会への取組みも見て投資先を選ぶ投資です。
    definition: 企業の財務面に加え，環境保全，人権，社会貢献，法令遵守などの社会的責任の遂行状況も評価して投資先を選ぶ手法。環境・社会・企業統治を重視する ESG 投資の前身にあたる考え方である。
    related: [CSR]
  - term: スケーリング則
    reading: すけーりんぐそく
    simple: AI モデルを大きくし，データと計算を増やすほど，性能が規則的に上がるという経験則です。
    definition: 大規模言語モデルの性能（損失）が，パラメタ数，学習データ量，学習に使う計算量の増加に対して，べき乗則に従って規則的に改善するという経験則。大規模な学習を始める前に，必要な資源と得られる性能を見積もる際に用いられる。
    related: [大規模言語モデル]
  - term: 大規模言語モデル
    reading: だいきぼげんごもでる
    simple: 大量の文章で学習し，文章の理解や生成ができる大きな AI モデルです。
    definition: 大量のテキストデータで事前学習した，多数のパラメタをもつ言語モデル（Large Language Model）。次に来る語を予測する学習を基礎とし，文章の生成，要約，翻訳，質問応答など幅広い処理を行える。
    related: [スケーリング則]
  - term: 1次データ
    reading: いちじでーた
    aliases: [一次データ, 1 次データ]
    simple: 自分の目的のために，調査や実験で新しく集めたデータです。
    definition: 分析の目的に合わせて，アンケート，インタビュー，実験，観察などによって自ら新たに収集したデータ。目的に合ったデータを得られるが，収集に時間と費用がかかる。
    related: [2次データ]
  - term: 2次データ
    reading: にじでーた
    aliases: [二次データ, 2 次データ]
    simple: 他の人がすでに集めて公表しているデータを，あとから使うものです。
    definition: 他の者が別の目的で既に収集・公表しているデータを再利用するもの。官公庁の統計や業界団体の調査報告などが該当する。低コストで入手できる反面，分析の目的に完全には合致しない場合がある。
    related: [1次データ]
  - term: 仕訳帳
    reading: しわけちょう
    simple: 取引を日付順に，借方と貸方に分けて記録する帳簿です。
    definition: 日々の取引を発生順に，借方（左）と貸方（右）の勘定科目と金額に分けて記録する帳簿。複式簿記における最初の記帳先で、ここから総勘定元帳へ転記する。
    related: [総勘定元帳]
  - term: 総勘定元帳
    reading: そうかんじょうもとちょう
    aliases: [元帳]
    simple: 仕訳を勘定科目ごとにまとめて記録する，会計の中心となる帳簿です。
    definition: 仕訳帳の記録を勘定科目ごとに転記して集計する帳簿。期末には各勘定の残高から試算表を作成し，決算を経て貸借対照表や損益計算書などの財務諸表を作成する。
    related: [仕訳帳]
  - term: キャッシュマネジメント
    reading: きゃっしゅまねじめんと
    aliases: [CMS]
    simple: 会社やグループの現金や預金を一括して管理し，無駄なく使うための仕組みです。
    definition: 現金や預金の動きを把握し，資金の過不足を調整して効率的に運用する管理手法。企業グループでは各社の資金を集中して管理し，余剰資金と不足資金を融通して外部借入を減らす。
    related: [資金計画]
  - term: 資金計画
    reading: しきんけいかく
    simple: いつ，いくらのお金が必要で，どう集めるかを前もって立てる計画です。
    definition: 事業活動や投資に必要な資金の額と時期を見積もり、その調達方法と返済を計画すること。収入と支出の予定を表す資金繰り表などを用いて、資金不足を防ぐ。
    related: [キャッシュマネジメント]
  - term: 商法
    reading: しょうほう
    simple: 商人の営業や商取引のルールを定めた，民法の特別法です。
    definition: 商人の営業，商行為，商号，商業帳簿などについて定める法律。一般法である民法に対する特別法にあたる。会社の設立や機関などは会社法が定める。
    related: [特定商取引法]
  - term: 特定商取引法
    reading: とくていしょうとりひきほう
    simple: 訪問販売や通信販売など，トラブルが起きやすい取引から消費者を守る法律です。
    definition: 訪問販売，通信販売，電話勧誘販売，連鎖販売取引などを対象に，事業者の行為規制（広告の表示，勧誘のルールなど）と消費者の保護（クーリング・オフなど）を定めた法律。通信販売にはクーリング・オフの制度はない。
    related: [クーリング・オフ]
  - term: クーリング・オフ
    reading: くーりんぐおふ
    simple: 契約したあとでも，一定の期間内なら理由を問わず契約を解除できる制度です。
    definition: 訪問販売など特定の取引で、法定書面を受け取った日から一定期間内であれば、消費者が理由を問わず書面で契約を解除できる制度。特定商取引法などが定める。
    related: [特定商取引法]
  - term: 守秘契約
    reading: しゅひけいやく
    simple: 取引で知った秘密を，目的以外に使ったり他人に漏らしたりしないと約束する契約です。
    definition: 取引や共同開発などで開示する秘密情報について，目的外使用の禁止，第三者への開示の禁止，管理方法，契約終了後の返還・廃棄、違反時の責任などを取り決める契約。秘密保持契約，NDA（Non-Disclosure Agreement）ともいう。
    related: [秘密情報]
  - term: 秘密情報
    reading: ひみつじょうほう
    simple: 契約で「秘密として扱う」と決めた，外に出してはいけない情報です。
    definition: 守秘契約で秘密として取り扱うと定めた情報。技術情報，顧客情報，価格情報などが対象で，公知の情報や、受領前から保有していた情報などは除外するのが一般的。
    related: [守秘契約]
  - term: 情報システム・モデル取引・契約書
    reading: じょうほうしすてむ・もでるとりひき・けいやくしょ
    simple: 経済産業省が，システム開発の取引を安全に進めるために作った契約書のひな型と解説です。
    definition: 経済産業省が公表している，情報システムの開発・保守に関する取引と契約書のモデル。要件が確定しにくい開発のリスクを減らすため、工程ごとに個別契約を結ぶ多段階契約を推奨している。
    related: [多段階契約]
  - term: 多段階契約
    reading: ただんかいけいやく
    simple: 開発を工程に分けて，工程ごとに契約を結ぶ方式です。
    definition: システム開発を要件定義，設計，開発・テストなどの工程に分け，基本契約のもとで工程ごとに個別契約を結ぶ方式。前の工程の成果を踏まえて、次の工程の範囲、金額、期間を確定できる。
    related: [情報システム・モデル取引・契約書]
  - term: 監査役
    reading: かんさやく
    simple: 取締役が正しく仕事をしているかを調べる，会社の機関です。
    definition: 株式会社において，取締役の職務の執行を監査する機関。業務監査と会計監査を行う。
    related: [取締役]
  - term: 取締役
    reading: とりしまりやく
    simple: 会社の業務の運営を決めたり実行したりする役員です。
    definition: 株式会社の業務執行を担い，取締役会の構成員として会社の業務執行の決定に参加する役員。株主総会で選任される。
    related: [監査役]
  - term: インボイス制度
    reading: いんぼいすせいど
    aliases: [適格請求書等保存方式]
    simple: 消費税の仕入税額控除を受けるのに，登録事業者が出す請求書の保存が必要になる制度です。
    definition: 消費税の仕入税額控除を受けるために，原則として、税務署長の登録を受けた適格請求書発行事業者が交付する適格請求書（インボイス）などの保存を必要とする制度。適格請求書には登録番号、適用税率、税率ごとの消費税額などを記載する。
    related: [消費税法]
  - term: 消費税法
    reading: しょうひぜいほう
    simple: 商品やサービスの取引にかかる消費税のルールを定めた法律です。
    definition: 商品の販売やサービスの提供などの取引に課される消費税の課税対象，税率、納税義務、仕入税額控除などを定めた法律。
    related: [インボイス制度]
  - term: 航空法
    reading: こうくうほう
    simple: 航空機の安全な運航のためのルールを定めた法律で，ドローンの飛行ルールも含みます。
    definition: 航空機の安全な運航と秩序を確保するための法律。無人航空機（ドローン）についても，飛行禁止空域，飛行の方法，機体登録などのルールを定めている。
    related: [小型無人機等飛行禁止法]
  - term: 小型無人機等飛行禁止法
    reading: こがたむじんきとうひこうきんしほう
    simple: 国会議事堂や原子力施設など重要な施設の周辺で，ドローンを飛ばすことを禁じる法律です。
    definition: 国会議事堂，首相官邸、原子力事業所などの重要施設とその周辺地域の上空で、小型無人機の飛行を禁止する法律。航空法とは別に適用される。
    related: [航空法]
  - term: 廃棄物処理法
    reading: はいきぶつしょりほう
    simple: ごみや産業廃棄物を正しく処理するためのルールを定めた法律です。
    definition: 廃棄物の排出の抑制と適正な分別、保管、収集、運搬、再生、処分などを定め、生活環境の保全と公衆衛生の向上を図る法律。産業廃棄物の処理責任は排出事業者にあり、委託する場合はマニフェストを交付して処理状況を確認する。
    related: [マニフェスト]
  - term: マニフェスト
    reading: まにふぇすと
    aliases: [産業廃棄物管理票]
    simple: 産業廃棄物が正しく処理されたかを確認するための伝票です。
    definition: 排出事業者が産業廃棄物の処理を委託するときに、委託先に交付する産業廃棄物管理票。収集運搬や処分の完了を伝票の返送で確認し，最終処分まで適正に処理されたことを確かめる。
    related: [廃棄物処理法]
  - term: 外為法
    reading: がいためほう
    aliases: [外国為替及び外国貿易法]
    simple: 外国との取引や，輸出入のルールを定めた法律で，安全保障のための輸出規制も含みます。
    definition: 外国との資金や物品、技術の取引を規制する法律。大量破壊兵器や通常兵器の開発などに転用され得る貨物の輸出と技術の提供について、経済産業大臣の許可を必要とする安全保障貿易管理を定める。
    related: [安全保障貿易管理]
  - term: 安全保障貿易管理
    reading: あんぜんほしょうぼうえきかんり
    simple: 兵器などに悪用されるおそれのある貨物や技術の輸出を，国が管理する仕組みです。
    definition: 国際的な平和と安全の維持のため、軍事転用され得る貨物の輸出や技術の提供を、外為法に基づき許可制などで管理する仕組み。技術の提供には、設計図やソフトウェアの電子的な送信も含まれ得る。
    related: [外為法]
  - term: OMG
    reading: おーえむじー
    fullName: Object Management Group
    japanese: オブジェクトマネジメントグループ
    words:
      - { en: Object, ja: オブジェクト }
      - { en: Management, ja: 管理 }
      - { en: Group, ja: グループ }
    simple: オブジェクト指向技術の標準を作る，国際的な業界団体です。
    definition: オブジェクト指向技術の標準化を行う非営利の国際的な団体。分散オブジェクト技術の CORBA や、モデリング言語の UML などの仕様を策定している。
    related: [CORBA]
  - term: 適合性評価
    reading: てきごうせいひょうか
    simple: 製品やサービスが，決められた規格や要求を満たしているかを確かめることです。
    definition: 製品，サービス，プロセス、マネジメントシステムなどが、規格や法規などの要求事項に適合しているかを評価する活動の総称。試験、検査，認証などがある。
    related: [認証機関, 認定機関]
  - term: 認定機関
    reading: にんていきかん
    simple: 認証機関などが正しく仕事をできる力があるかを，確認して認める機関です。
    definition: 認証機関や試験機関などの適合性評価機関について、業務を行う能力と公平性を備えているかを評価し、認定する機関。認定によって認証結果の信頼性が担保される。
    related: [適合性評価, 認証機関]
  - term: 認証機関
    reading: にんしょうきかん
    simple: 製品や組織が規格に合っているかを審査して，証明する機関です。
    definition: 製品、サービス、マネジメントシステムなどが規格に適合していることを審査し，認証する機関。認定機関から能力を認定されることで、その認証の信頼性が確保される。
    related: [認定機関, 適合性評価]
