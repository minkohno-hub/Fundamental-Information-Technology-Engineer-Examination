category: 補遺
terms:
  - term: プロモーション戦略
    reading: ぷろもーしょんせんりゃく
    simple: 商品やサービスの存在や良さを顧客に伝え，購買につなげるための方法の組合せを決めることです。
    definition: マーケティングミックス（4P）のうち，顧客への情報伝達と購買意欲の喚起に関する戦略。広告，販売促進（セールスプロモーション），パブリシティ，人的販売などの手段を目的や対象に合わせて組み合わせる。
    related: [パブリシティ]
  - term: 人間中心のAI社会原則
    reading: にんげんちゅうしんのえーあいしゃかいげんそく
    simple: AI を社会で安心して使うために，日本政府が示した基本的な考え方です。
    definition: 2019年に内閣府の統合イノベーション戦略推進会議が決定した AI 活用の基本原則。人間中心の原則，教育・リテラシーの原則，プライバシー確保の原則，セキュリティ確保の原則，公正競争確保の原則，公平性・説明責任及び透明性の原則，イノベーションの原則の七つを掲げる。
    related: [説明責任]
  - term: 説明責任
    reading: せつめいせきにん
    simple: 行ったことや判断の理由を，関係者が納得できるように説明する責任です。
    definition: 組織や個人が，自らの行動や意思決定の内容と根拠について，利害関係者に対して説明する責任。AI の利用では，意思決定の過程や結果を利用者が納得できるよう説明することが求められる。
    related: [人間中心のAI社会原則]
  - term: 特化型AI
    reading: とっかがたえーあい
    aliases: [特化型人工知能]
    simple: 囲碁や画像認識など，決まった分野の仕事だけを得意とする AI です。
    definition: 特定の領域やタスクに限定して高い性能を発揮するよう設計された AI。現在実用化されている AI の大半が該当する。あらゆる領域に対応できる汎用 AI と対比される。
    related: [汎用AI]
  - term: 汎用AI
    reading: はんようえーあい
    aliases: [汎用人工知能, AGI]
    simple: 人間のように，どんな分野の課題でも自分で学んで解ける AI のことです。
    definition: 特定の領域に限らず，人間と同様に多様な課題を理解・学習して解決できる AI（Artificial General Intelligence）。実現には，フレーム問題やシンボルグラウンディング問題など多くの課題があるとされる。
    related: [特化型AI]
  - term: エンジニアリングシステム
    reading: えんじにありんぐしすてむ
    simple: 製品の設計や製造など技術の仕事を，コンピュータで支援・効率化する仕組みです。
    definition: 製品の設計（CAD），製造（CAM），生産管理，製品情報の管理などの技術業務に情報技術を活用し，開発期間の短縮，品質の向上，コスト削減を図るシステムの総称。
    related: [CAD]
  - term: 電子入札
    reading: でんしにゅうさつ
    simple: 国や自治体の入札の手続を，インターネット上で行う仕組みです。
    definition: 入札公告，入札書の提出，開札，落札者の決定などの入札手続をネットワーク上で行う仕組み。事業者の負担軽減，事務の効率化，手続の透明性・公平性の向上が期待できる。電子証明書による本人確認を行う。
    related: [電子商取引]
  - term: XML-EDI
    reading: えっくすえむえるいーでぃーあい
    simple: 企業間のデータ交換に，XML という書式を使う方式です。
    definition: 企業間の電子データ交換（EDI）で，データ形式に XML を用いる方式。タグでデータの意味を表現するため，取引先ごとの個別の形式に依存せず，柔軟にデータを交換できる。
    related: [XBRL]
  - term: ユビキタスコンピューティング
    reading: ゆびきたすこんぴゅーてぃんぐ
    simple: コンピュータが身の回りに溶け込み，いつでもどこでも使える状態のことです。
    definition: コンピュータやネットワークが生活環境のあらゆる場所に組み込まれ，利用者が意識することなく，いつでもどこでも情報サービスを利用できる環境や考え方。
    related: [情報家電]
  - term: 情報家電
    reading: じょうほうかでん
    simple: ネットワークにつながり，情報機器のように使える家電です。
    definition: ネットワークに接続する機能や，コンピュータを組み込んで情報処理を行う機能をもつ家電機器の総称。スマートテレビ，ネットワーク対応の冷蔵庫やエアコンなど。
    related: [ユビキタスコンピューティング, HEMS]
  - term: HEMS
    reading: へむす
    fullName: Home Energy Management System
    japanese: 家庭内エネルギー管理システム
    words:
      - { en: Home, ja: 家庭 }
      - { en: Energy, ja: エネルギー }
      - { en: Management System, ja: 管理システム }
    simple: 家庭の電気の使用量を見える化し，家電を制御して省エネを助けるシステムです。
    definition: 家庭内の電力使用量などを計測して可視化し，家電や給湯器，太陽光発電，蓄電池などを制御することで，省エネルギーを支援するシステム。ビル向けは BEMS，工場向けは FEMS と呼ばれる。
    related: [ホームネットワーク]
  - term: ホームネットワーク
    reading: ほーむねっとわーく
    simple: 家の中の家電や情報機器をつなぐネットワークです。
    definition: 家庭内のパソコン，家電，AV 機器，センサなどを有線や無線で接続するネットワーク。機器の相互接続や遠隔操作，HEMS による省エネ制御の基盤になる。
    related: [HEMS]
  - term: 患者モニタリング装置
    reading: かんじゃもにたりんぐそうち
    aliases: [生体情報モニタ]
    simple: 患者の心拍や血圧などを測り続け，異常があれば知らせる装置です。
    definition: 心電図，心拍数，血圧，呼吸数，血中酸素飽和度（SpO2），体温などの生体情報を継続的に測定して表示し，異常を検知するとアラームで医療従事者に知らせる医療機器。
    related: [医療機器]
  - term: 医療機器
    reading: いりょうきき
    simple: 病気の診断や治療，患者の状態の監視などに使う機器です。
    definition: 人や動物の疾病の診断，治療，予防などに使われる機械器具の総称。情報技術を組み込んだものも多く，安全性や有効性について医薬品医療機器等法による規制を受ける。
    related: [患者モニタリング装置]
