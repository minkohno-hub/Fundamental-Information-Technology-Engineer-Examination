category: OS・ハードウェア・メディア・開発管理（H2）
terms:
  - term: 待ち時間
    reading: まちじかん
    aliases:
      - 平均待ち時間
    simple: プロセスが実行可能なのに CPU を待たされていた時間の合計です。
    definition: スケジューリング評価で，プロセスが到着してから終了するまでのうち CPU を使用していない時間。終了時刻−到着時刻−処理時間で求め，終了時刻−到着時刻のターンアラウンド時間とは区別する。
    related:
      - ラウンドロビン
      - ターンアラウンドタイム
  - term: プリエンプティブ方式
    reading: ぷりえんぷてぃぶほうしき
    aliases:
      - プリエンプション
      - 横取り方式
    simple: 実行中のタスクを途中で止めて，ほかのタスクに CPU を渡せる方式です。
    definition: OS が実行中のタスクから CPU を取り上げ，優先度の高いタスクや時間切れ後の次のタスクに割り当てられるスケジューリング方式。応答性が高い一方，切替えのオーバーヘッドが生じる。
    related:
      - ノンプリエンプティブ方式
      - ラウンドロビン
  - term: 最短残り時間優先
    reading: さいたんのこりじかんゆうせん
    aliases:
      - SRT
      - Shortest Remaining Time First
    simple: 残りの処理時間が最も短いプロセスを優先して実行する方式です。
    definition: 実行可能なプロセスのうち残り処理時間が最短のものに CPU を割り当て，新しいプロセスが到着したときに残り時間がより短ければ実行中のものを横取りするプリエンプティブな方式。平均待ち時間は最小になりやすいが，処理時間の長いプロセスが後回しになる。
    related:
      - プリエンプティブ方式
      - 待ち時間
  - term: ベレディの異常
    reading: べれでぃのいじょう
    aliases:
      - Beladyの異常
      - Belady's anomaly
    simple: FIFO で主記憶のページ枠を増やしたのに，かえってページフォールトが増える現象です。
    definition: ページ置換えアルゴリズムが FIFO のとき，割り当てるページ枠数を増やすとページフォールト回数が増えることがある現象。LRU や最適置換えにはスタック性があり起こらない。
    related:
      - FIFO
      - LRU
      - ページフォールト
  - term: 循環待ち
    reading: じゅんかんまち
    aliases:
      - 循環待ち条件
    simple: 複数のプロセスが輪のように互いの資源を待ち合っている状態です。
    definition: デッドロックの発生条件の一つで，プロセスが資源を待つ関係が環状につながっている状態。資源に順序を付けて，その順にだけ要求させると成立しなくなる。
    related:
      - デッドロック
      - 保持待ち
  - term: 保持待ち
    reading: ほじまち
    aliases:
      - 保持と待機
      - 占有しながら待機
    simple: 資源を持ったまま，さらに別の資源を待つ状態です。
    definition: デッドロックの発生条件の一つで，既に資源を確保したプロセスが，ほかの資源の割当てを待つ状態。必要な資源を最初に一括して確保させると成立しなくなる。
    related:
      - デッドロック
      - 循環待ち
  - term: セマフォ
    reading: せまふぉ
    aliases:
      - セマフォア
      - セマフォー
    simple: 資源の空き数を数える仕組みで，同時に使えるプロセスの数を制限します。
    definition: 共有資源の排他制御や同期に使う整数値の変数。P 操作で値を減らして資源を確保（0 なら待ち状態），V 操作で値を増やして（または待ちプロセスを起こして）資源を返す。初期値が 1 のものは二値セマフォといい，排他制御に使う。
    related:
      - P操作
      - V操作
      - 臨界領域
  - term: P操作
    reading: ぴーそうさ
    aliases:
      - P命令
      - wait操作
    simple: セマフォの値を減らして資源を確保する操作です。
    definition: セマフォの値が 1 以上なら 1 減らして処理を続け，0 なら待ち状態になってセマフォの待ち行列に並ぶ操作。
    related:
      - セマフォ
      - V操作
  - term: V操作
    reading: ぶいそうさ
    aliases:
      - V命令
      - signal操作
    simple: セマフォの値を増やして資源を返す操作です。
    definition: 待ちプロセスがあればその一つを起こして資源を渡し，なければセマフォの値を 1 増やす操作。
    related:
      - セマフォ
      - P操作
  - term: 臨界領域
    reading: りんかいりょういき
    aliases:
      - クリティカルセクション
      - クリティカルリージョン
    simple: 複数のプロセスが同時に実行してはいけない共有資源を触る部分です。
    definition: 共有変数やファイルなど，同時に複数のプロセスがアクセスすると矛盾が生じる処理区間。セマフォやミューテックスなどで排他制御して，同時に実行できるプロセスを制限する。
    related:
      - セマフォ
      - 排他制御
  - term: 内部断片化
    reading: ないぶだんぺんか
    aliases:
      - 内部フラグメンテーション
    simple: 割り当てた領域のうち，使われずに余る部分のことです。
    definition: 固定サイズの単位（クラスタ，ブロック，ページ）で領域を割り当てるとき，最後の単位に生じる未使用の領域。単位を大きくするほど増えやすい。
    related:
      - クラスタ
      - フラグメンテーション
