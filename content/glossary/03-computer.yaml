category: コンピュータ構成要素
terms:
  - term: シングルボードコンピュータ
    reading: シングルボードコンピュータ
    aliases: [SBC]
    simple: CPU やメモリなどを1枚の基板にまとめた小さなコンピュータです。Raspberry Pi が有名です。
    definition: コンピュータとして動作するのに必要な CPU・メモリ・入出力インタフェースなどを1枚のプリント基板に搭載したコンピュータ。教育、電子工作、IoT 機器の試作に使われる。
    related: [CPU]
  - term: GPU
    reading: ジーピーユー
    fullName: Graphics Processing Unit
    japanese: 画像処理装置
    words:
      - { en: Graphics, ja: 画像・図形 }
      - { en: Processing, ja: 処理 }
      - { en: Unit, ja: 装置 }
    simple: 画像の描画などの大量の単純な計算を、たくさんの演算器で同時に行うのが得意な処理装置です。
    definition: 多数の演算器による並列処理で3次元画像処理などを高速に行うプロセッサ。行列演算に強く、機械学習（ディープラーニング）の計算にも用いられる（GPGPU）。
    difference: CPU は少数の高性能なコアで汎用的な処理を逐次的に行う。
    related: [CPU, SIMD]
  - term: マイクロプログラム制御方式
    reading: マイクロプログラムせいぎょほうしき
    simple: CPU の命令の実行手順を、さらに細かいプログラム（マイクロプログラム）として持たせて制御する方式です。
    definition: 機械語命令の実行手順をマイクロ命令の列として制御記憶に格納し、それを読み出して制御する方式。命令の追加・変更が容易で CISC に多い。論理回路だけで制御するワイヤドロジック方式は高速で RISC に多い。
    related: [RISC]
  - term: RISC
    reading: リスク
    fullName: Reduced Instruction Set Computer
    japanese: 縮小命令セットコンピュータ
    words:
      - { en: Reduced, ja: 縮小された・減らした }
      - { en: Instruction Set, ja: 命令セット（命令の種類の集まり） }
      - { en: Computer, ja: コンピュータ }
    simple: 命令の種類を少なく単純にして、1つ1つを速く実行できるようにしたプロセッサの設計方式です。
    definition: 命令の種類を絞り、命令長を固定してワイヤドロジックで高速に実行し、パイプライン処理の効率を高める設計方式。対して CISC（Complex Instruction Set Computer）は複雑で多機能な命令をもつ。
    related: [パイプライン, マイクロプログラム制御方式]
  - term: レジスタ
    reading: レジスタ
    simple: CPU の中にある、最も速い小さな記憶場所です。計算中の値や命令などを一時的に入れておきます。
    definition: CPU 内部の高速な記憶回路。プログラムカウンター（次の命令のアドレス）、命令レジスタ（取り出した命令）、アキュムレーター（演算対象・結果）、インデックスレジスタ（指標アドレス指定用）、ベースレジスタ（基底アドレス）、スタックポインタ（スタックの先頭位置）などがある。
    related: [アドレス指定方式, CPU]
  - term: アドレス指定方式
    reading: アドレスしていほうしき
    aliases: [アドレッシング]
    simple: 命令の中のアドレス部から、実際に読み書きするデータの場所を求める方法です。
    definition: 命令のアドレス部から有効アドレスを求める方式。即値（アドレス部が値そのもの）、直接（アドレス部が有効アドレス）、間接（アドレス部が指す番地の内容が有効アドレス）、指標（アドレス部＋インデックスレジスタ）、基底（アドレス部＋ベースレジスタ）、相対（アドレス部＋プログラムカウンター）などがある。
    related: [レジスタ]
  - term: 加算器
    reading: かさんき
    simple: 2進数の足し算をする論理回路です。
    definition: 半加算器は2入力の和 S＝A XOR B と桁上がり C＝A AND B を出力する。全加算器は下位からの桁上がりも加算し、半加算器2つと OR で構成できる。
    related: [論理回路, 排他的論理和]
  - term: フリップフロップ
    reading: フリップフロップ
    simple: 1ビット（0 か 1）を記憶しておける回路です。
    definition: 2つの安定状態をもち1ビットを保持する順序回路。出力が過去の状態にも依存する回路を順序回路、現在の入力だけで決まる回路を組合せ回路という。SRAM やレジスタに用いる。
    related: [SRAM, 論理回路]
  - term: 論理回路
    reading: ろんりかいろ
    simple: 0 と 1 の信号を使って、AND・OR・NOT などの論理演算を行う電子回路です。
    definition: 論理演算を電子回路で実現したもの。NAND（論理積の否定）や NOR だけで任意の論理回路を構成できる。
    related: [加算器, ブール代数]
  - term: 割込み
    reading: わりこみ
    simple: 実行中の処理を一時中断して、急ぎの処理を先に行う仕組みです。
    definition: 処理の実行中に発生した事象に対応するため、実行中のプログラムを中断して割込み処理を行う仕組み。プログラムが原因の内部割込み（ゼロ除算、SVC、ページフォールト）と、外部要因の外部割込み（入出力完了、タイマー、電源異常）がある。
    related: [CPU, DMA]
  - term: MIPS
    reading: ミップス
    fullName: Million Instructions Per Second
    japanese: 1秒あたりの百万命令数
    words:
      - { en: Million, ja: 百万 }
      - { en: Instructions, ja: 命令 }
      - { en: Per Second, ja: 1秒あたり }
    simple: CPU が1秒間に何百万個の命令を実行できるかを表す性能の目安です。
    definition: 1秒間に実行できる命令数を百万単位で表した性能指標。MIPS＝クロック周波数÷CPI÷10⁶。
    related: [CPI, FLOPS, クロック周波数]
  - term: CPI
    reading: シーピーアイ
    fullName: Cycles Per Instruction
    japanese: 1命令あたりのクロック数
    words:
      - { en: Cycles, ja: サイクル（クロック） }
      - { en: Per, ja: 〜あたり }
      - { en: Instruction, ja: 命令 }
    simple: 1つの命令を実行するのに、平均で何クロックかかるかを表す値です。
    definition: 1命令の実行に要する平均クロックサイクル数。小さいほど効率がよい。
    related: [MIPS, 命令ミックス]
  - term: 命令ミックス
    reading: めいれいミックス
    simple: 命令の種類ごとの実行時間と使われる割合から、平均の命令実行時間を求める性能評価方法です。
    definition: 命令の種類ごとの実行時間（またはクロック数）に出現頻度を掛けて合計し、平均命令実行時間を求める評価方法。科学技術計算向けのギブソンミックスなどがある。
    related: [CPI, MIPS]
  - term: クロック周波数
    reading: クロックしゅうはすう
    aliases: [クロック]
    simple: CPU が動作のタイミングをとる信号の速さです。2GHz なら1秒間に20億回です。
    definition: 回路の動作の基準となるクロック信号の1秒間の振動数。逆数がクロックサイクルタイム（2GHz なら 0.5ns）。
    related: [MIPS, CPI]
  - term: FLOPS
    reading: フロップス
    fullName: FLoating-point Operations Per Second
    japanese: 1秒あたりの浮動小数点演算回数
    words:
      - { en: Floating-point, ja: 浮動小数点 }
      - { en: Operations, ja: 演算 }
      - { en: Per Second, ja: 1秒あたり }
    simple: 1秒間に小数を含む計算を何回できるかを表す性能の目安で、スーパーコンピュータの性能比較に使われます。
    definition: 1秒間に実行できる浮動小数点演算の回数を表す性能指標。
    related: [MIPS]
  - term: パイプライン
    reading: パイプライン
    aliases: [パイプライン処理]
    simple: 命令の処理を流れ作業のように段階に分け、複数の命令を少しずつずらして同時に進める高速化の方法です。
    definition: 命令の実行を複数のステージに分割し、異なる命令のステージを重ねて並行処理する方式。k 段で n 命令なら k＋n−1 サイクル。分岐やデータ依存でハザードが起こる。段数を増やすスーパーパイプライン、複数のパイプラインをもつスーパースカラ、長い命令に並列実行する命令をまとめる VLIW がある。
    related: [RISC, マルチコアプロセッサ]
  - term: SIMD
    reading: シムド
    fullName: Single Instruction, Multiple Data
    japanese: 単一命令・複数データ
    words:
      - { en: Single Instruction, ja: 1つの命令 }
      - { en: Multiple Data, ja: 複数のデータ }
    simple: 1つの命令で、たくさんのデータに同じ計算をまとめて行う方式です。
    definition: フリンの分類の一つで、1つの命令流で複数のデータ流を同時に処理する並列処理方式。画像処理、GPU、ベクトル演算に用いる。ほかに SISD、MISD、MIMD がある。
    related: [GPU]
  - term: アムダールの法則
    reading: アムダールのほうそく
    simple: 並列化できない部分があると、プロセッサを増やしても速くなる度合いに限界がある、という法則です。
    definition: 並列化可能な割合を p、プロセッサ数を n とすると、速度向上率は 1÷((1−p)＋p÷n)。n を無限大にしても 1÷(1−p) が上限となる。
    related: [マルチプロセッサシステム]
  - term: マルチプロセッサシステム
    reading: マルチプロセッサシステム
    simple: 複数のプロセッサを組み合わせて処理を分担するシステムです。
    definition: 複数のプロセッサで処理を行うシステム。主記憶を共有し1つの OS で制御する密結合と、各プロセッサが主記憶と OS をもちネットワーク等で結合する疎結合がある。
    related: [アムダールの法則, マルチコアプロセッサ]
  - term: SRAM
    reading: エスラム
    fullName: Static Random Access Memory
    japanese: スタティック RAM（静的 RAM）
    words:
      - { en: Static, ja: 静的な（そのままで保たれる） }
      - { en: Random Access, ja: 任意の順でアクセスできる }
      - { en: Memory, ja: 記憶装置 }
    simple: 高速でリフレッシュ不要なメモリで、キャッシュメモリに使われます。
    definition: フリップフロップで記憶するランダムアクセスメモリ。リフレッシュ不要で高速だが、集積度が低く高価。揮発性。
    related: [DRAM, キャッシュメモリ]
  - term: DRAM
    reading: ディーラム
    fullName: Dynamic Random Access Memory
    japanese: ダイナミック RAM（動的 RAM）
    words:
      - { en: Dynamic, ja: 動的な（書き直し続ける必要がある） }
      - { en: Random Access, ja: 任意の順でアクセスできる }
      - { en: Memory, ja: 記憶装置 }
    simple: 大容量で安いメモリで、パソコンの主記憶に使われます。記憶を保つために定期的な書き直しが必要です。
    definition: コンデンサに電荷を蓄えて記憶するランダムアクセスメモリ。電荷が漏れるため定期的なリフレッシュが必要。集積度が高く安価で主記憶に使われる。揮発性。
    related: [SRAM, 主記憶]
  - term: フラッシュメモリ
    reading: フラッシュメモリ
    simple: 電源を切っても内容が消えないメモリで、USB メモリや SSD、スマートフォンに使われます。
    definition: 電気的に一括（ブロック単位）消去・書換えができる不揮発性の半導体メモリ。書換え回数に上限がある。ROM（Read Only Memory）は読出し専用の不揮発性メモリの総称。
    related: [SSD, ウェアレベリング]
  - term: ウェアレベリング
    reading: ウェアレベリング
    simple: SSD などで、書込みを特定の場所に集中させず全体に散らして、寿命を延ばす技術です。
    definition: フラッシュメモリの書換え回数の上限による劣化を平準化するため、書込み先のブロックを分散させる制御。
    related: [フラッシュメモリ, SSD]
  - term: キャッシュメモリ
    reading: キャッシュメモリ
    simple: CPU と主記憶の間に置く高速なメモリで、よく使うデータを置いて処理を速くします。
    definition: 主記憶より高速な小容量のメモリ（主に SRAM）。実効アクセス時間＝キャッシュのアクセス時間×ヒット率＋主記憶のアクセス時間×(1−ヒット率)。書込み方式に、主記憶へ同時に書くライトスルーと、追出し時に書くライトバックがある。
    related: [記憶階層, SRAM]
  - term: 記憶階層
    reading: きおくかいそう
    simple: 速いが高価で小さい記憶装置から、遅いが安くて大きい記憶装置までを組み合わせて使う構成です。
    definition: レジスタ→キャッシュメモリ→主記憶→（ディスクキャッシュ）→補助記憶の順に、速度が遅く容量が大きくなる記憶装置の階層構造。
    related: [キャッシュメモリ, 主記憶]
  - term: メモリインタリーブ
    reading: メモリインタリーブ
    simple: 主記憶をいくつかのグループ（バンク）に分け、同時に読み書きして速くする方法です。
    definition: 主記憶を複数のバンクに分割し、連続アドレスを異なるバンクに割り当てて並行アクセスすることで実効アクセス速度を高める方式。
    related: [主記憶]
  - term: ビットとバイト
    reading: ビットとバイト
    simple: ビットは 0 か 1 の情報の最小単位、バイトは 8 ビットをまとめた単位です。
    definition: 1バイト＝8ビット。接頭語は k＝10³、M＝10⁶、G＝10⁹、T＝10¹²（2進接頭語では Ki＝2¹⁰、Mi＝2²⁰、Gi＝2³⁰）。
    related: [16進数]
  - term: 光ディスク
    reading: ひかりディスク
    simple: レーザー光でデータを読み書きする円盤型の記録媒体で、CD・DVD・ブルーレイがあります。
    definition: レーザー光で記録・再生する媒体。読出し専用型（-ROM）、追記型（-R）、書換型（-RW、DVD-RAM、BD-RE）がある。
    related: [ハードディスク]
  - term: バス
    reading: バス
    simple: CPU・メモリ・周辺装置の間でデータや信号をやり取りするための共通の通り道です。
    definition: 複数の装置で共有する信号伝送路。アドレスを伝えるアドレスバス（n 本で 2ⁿ 番地）、データを伝えるデータバス、制御信号を伝えるコントロールバスがある。転送速度＝バス幅（バイト）×クロック周波数×1クロックあたりの転送回数。
    related: [DMA, USB]
  - term: NFC
    reading: エヌエフシー
    fullName: Near Field Communication
    japanese: 近距離無線通信
    words:
      - { en: Near, ja: 近い }
      - { en: Field, ja: 場（電磁界） }
      - { en: Communication, ja: 通信 }
    simple: 10cm くらいまで近づけて通信する技術で、交通系 IC カードや電子決済に使われます。
    definition: 13.56MHz 帯を用いる、通信距離 10cm 程度の近距離無線通信規格。非接触 IC カード、スマートフォン決済に用いる。
    related: [Bluetooth]
  - term: Bluetooth
    reading: ブルートゥース
    simple: 数 m〜数十 m の範囲で機器どうしを無線でつなぐ規格で、イヤホンやマウスに使われます。
    definition: 2.4GHz 帯を用いる近距離無線通信規格。低消費電力版の BLE は IoT 機器やウェアラブル機器に使われる。ほかに低消費電力でメッシュ網を作る Zigbee、赤外線を使う IrDA がある。
    related: [NFC]
  - term: HDMI
    reading: エイチディーエムアイ
    fullName: High-Definition Multimedia Interface
    japanese: 高精細度マルチメディアインタフェース
    words:
      - { en: High-Definition, ja: 高精細度の }
      - { en: Multimedia, ja: マルチメディア（映像・音声など） }
      - { en: Interface, ja: 接続の仕様 }
    simple: 映像と音声を1本のケーブルでデジタルのまま送る接続規格です。
    definition: 映像・音声・制御信号を1本のケーブルでデジタル伝送するインタフェース規格。DisplayPort も同様のデジタル映像インタフェース。
    related: [USB]
  - term: USB
    reading: ユーエスビー
    fullName: Universal Serial Bus
    japanese: ユニバーサル・シリアル・バス（汎用シリアルバス）
    words:
      - { en: Universal, ja: 汎用の・万能の }
      - { en: Serial, ja: 直列の（1ビットずつ送る） }
      - { en: Bus, ja: バス（共通の伝送路） }
    simple: パソコンとさまざまな周辺機器をつなぐ、最も一般的な接続規格です。
    definition: ハブを使ったツリー型の接続で多数の機器を接続できるシリアルインタフェース。ホットプラグ、プラグアンドプレイ、バスパワーに対応する。
    related: [HDMI, バス]
  - term: DMA
    reading: ディーエムエー
    fullName: Direct Memory Access
    japanese: 直接記憶アクセス
    words:
      - { en: Direct, ja: 直接の }
      - { en: Memory, ja: 記憶装置（メモリ） }
      - { en: Access, ja: アクセス（読み書き） }
    simple: CPU を通さずに、周辺装置とメモリの間で直接データを転送する仕組みです。
    definition: DMA コントローラが CPU を介さずに入出力装置と主記憶の間でデータ転送を行う方式。転送中も CPU は他の処理を実行でき、完了は割込みで通知される。
    difference: プログラム制御方式は CPU が入出力命令で1語ずつ転送する。
    related: [割込み, バス]
  - term: デバイスドライバ
    reading: デバイスドライバ
    simple: プリンターなどの周辺機器を OS から使えるようにするための、機器ごとのソフトウェアです。
    definition: OS と周辺機器の間に位置し、機器固有の制御を行うソフトウェア。OS やアプリケーションに共通のインタフェースを提供する。
    related: [USB]
  - term: OCR
    reading: オーシーアール
    fullName: Optical Character Reader
    japanese: 光学式文字読取装置
    words:
      - { en: Optical, ja: 光学式の }
      - { en: Character, ja: 文字 }
      - { en: Reader, ja: 読取装置 }
    simple: 紙に印刷・手書きされた文字を読み取って、文字データに変える装置（または技術）です。
    definition: 光学的に読み取った画像から文字を認識してデータ化する装置・技術。マークシートの塗りつぶしを読み取る装置は OMR（Optical Mark Reader）。
    related: [解像度]
  - term: 有機ELディスプレイ
    reading: ゆうきイーエルディスプレイ
    simple: 画素そのものが光るディスプレイで、バックライトがいらず、薄くて黒がくっきり表示できます。
    definition: 電圧で発光する有機化合物を用いた自発光型ディスプレイ。液晶ディスプレイはバックライトの光を液晶で制御する。電子ペーパーは電力なしで表示を保持できる。
    related: [解像度]
  - term: 解像度
    reading: かいぞうど
    simple: 画像や印刷のきめの細かさで、1インチあたりの点（ドット）の数などで表します。
    definition: 表示・印刷の精細さ。プリンターやスキャナーでは dpi（1インチあたりのドット数）、ディスプレイでは画素数（例 1920×1080）や ppi で表す。
    related: [ビットとバイト]
  - term: ハードディスク
    reading: ハードディスク
    aliases: [HDD]
    simple: 回転する磁気ディスクにデータを記録する補助記憶装置です。
    definition: 磁性体を塗布した円盤を回転させ、磁気ヘッドで読み書きする補助記憶装置。平均アクセス時間＝平均シーク時間＋平均回転待ち時間（1回転の半分）＋データ転送時間。断片化したファイルを連続領域に再配置する処理をデフラグメンテーションという。
    related: [SSD, 磁気テープ]
  - term: SSD
    reading: エスエスディー
    fullName: Solid State Drive
    japanese: ソリッドステートドライブ（半導体ドライブ）
    words:
      - { en: Solid State, ja: 半導体素子による（可動部分のない） }
      - { en: Drive, ja: 記憶装置（ドライブ） }
    simple: フラッシュメモリを使った補助記憶装置で、ハードディスクより高速で衝撃に強いです。
    definition: フラッシュメモリを記憶媒体とする補助記憶装置。機械的な可動部がなく高速・低消費電力・耐衝撃性に優れる。書換え回数の上限があるためウェアレベリングを行う。
    related: [ハードディスク, フラッシュメモリ, ウェアレベリング]
  - term: 磁気テープ
    reading: じきテープ
    simple: 細長いテープにデータを磁気で記録する媒体で、大量データのバックアップに使われます。
    definition: 順次アクセス方式の大容量・低価格な記録媒体。バックアップやアーカイブに用いる。
    related: [ハードディスク]
  - term: MACアドレス
    reading: マックアドレス
    fullName: Media Access Control address
    japanese: 媒体アクセス制御アドレス
    words:
      - { en: Media, ja: 媒体（通信媒体） }
      - { en: Access, ja: アクセス }
      - { en: Control, ja: 制御 }
      - { en: address, ja: アドレス（住所・識別番号） }
    simple: ネットワーク機器に製造時から割り当てられている、世界で一意の番号です。
    definition: NIC などに割り当てられる 48 ビットの物理アドレス。上位 24 ビットが製造者識別子（OUI）。データリンク層で通信相手を識別する。
    related: [IPアドレス]
  - term: 主記憶
    reading: しゅきおく
    aliases: [主記憶装置, メインメモリ]
    simple: CPU が直接読み書きする、実行中のプログラムやデータを置くメモリです。
    definition: CPU が直接アクセスする記憶装置。記憶部・アドレス選択機構・読取り書込み機構から構成される。一般に DRAM が使われる。
    related: [DRAM, 記憶階層]
  - term: マルチコアプロセッサ
    reading: マルチコアプロセッサ
    aliases: [マルチコア]
    simple: 1つのチップの中に、計算を行う中心部分（コア）を複数入れたプロセッサです。
    definition: 1つのパッケージに複数のプロセッサコアを集積したプロセッサ。複数のスレッドを並列実行できる。
    related: [マルチプロセッサシステム, パイプライン]
  - term: CPU
    reading: シーピーユー
    fullName: Central Processing Unit
    japanese: 中央処理装置
    aliases: [プロセッサ]
    words:
      - { en: Central, ja: 中央の・中心の }
      - { en: Processing, ja: 処理 }
      - { en: Unit, ja: 装置・単位 }
    simple: コンピュータの「頭脳」にあたる部品で、プログラムの命令を読み出して計算や判断を行います。
    definition: 主記憶から命令を取り出して解読し、演算や制御を実行する装置。制御装置と演算装置から構成される。コンピュータの五大装置は制御・演算・記憶・入力・出力装置。
    example: パソコンの性能表に書かれている「4コア 3.0GHz」は CPU の仕様です。
    difference: GPU は画像処理など大量の単純な演算を並列に行うことに特化した処理装置で、汎用的な命令実行を担う CPU とは役割が異なります。
    related: [GPU, クロック周波数, レジスタ]
  - term: ワイヤドロジック制御方式
    reading: わいやどろじっくせいぎょほうしき
    aliases: [布線論理制御方式]
    simple: 命令の制御を、論理回路の配線そのもので実現する方式です。
    definition: 命令の解読と実行の制御を、論理回路の組合せ（配線）で直接実現する制御方式。高速だが、機能の変更や追加には回路の変更が必要。マイクロプログラム制御方式と対比される。
    related: [マイクロプログラム制御方式, RISC]
  - term: CISC
    reading: しすく
    fullName: Complex Instruction Set Computer
    japanese: 複合命令セットコンピュータ
    words:
      - { en: Complex, ja: 複雑な }
      - { en: Instruction Set, ja: 命令セット }
      - { en: Computer, ja: コンピュータ }
    simple: 多くの種類の複雑な命令をもつ、RISCと対になる方式のCPUです。
    definition: 多数の機能豊富で命令長も可変な命令をもつ命令セットアーキテクチャ。1命令で複雑な処理ができるが、命令の解読が複雑でパイプライン化しにくい。RISC と対比される。
    related: [RISC, マイクロプログラム制御方式]
  - term: プログラムカウンター
    reading: ぷろぐらむかうんたー
    aliases: [命令アドレスレジスタ]
    simple: 次に実行する命令が置かれている主記憶のアドレスを保持するレジスタです。
    definition: 次に実行する命令のアドレスを保持するレジスタ。命令を読み出すたびに値が増加し、分岐命令では分岐先アドレスに書き換えられる。命令アドレスレジスタともいう。
    related: [レジスタ, 命令レジスタ]
  - term: 命令レジスタ
    reading: めいれいれじすた
    simple: 主記憶から読み出した命令を一時的に保持するレジスタです。
    definition: 主記憶から取り出した命令を保持し、命令デコーダが解読する間その命令を記憶しておくレジスタ。
    related: [レジスタ, プログラムカウンター]
  - term: アキュムレーター
    reading: あきゅむれーたー
    simple: 演算の対象や結果を一時的に保持する、演算用のレジスタです。
    definition: 算術論理演算装置（ALU）での演算の対象データや演算結果を一時的に保持するレジスタ。累算器ともいう。
    related: [レジスタ, 汎用レジスタ]
  - term: 汎用レジスタ
    reading: はんようれじすた
    simple: データやアドレスなど、用途を限定せず自由に使えるレジスタです。
    definition: 演算対象のデータ、アドレス、演算結果など様々な用途に使えるレジスタ。
    related: [レジスタ, アキュムレーター]
  - term: インデックスレジスタ
    reading: いんでっくすれじすた
    aliases: [指標レジスタ]
    simple: 配列の要素を指すときなど、アドレスに足して実効アドレスを作るための値を保持するレジスタです。
    definition: 指標アドレス指定で、命令中のアドレス部に加算する値（指標、添字）を保持するレジスタ。配列要素の連続アクセスなどに使う。
    related: [レジスタ, ベースレジスタ, 指標アドレス指定]
  - term: ベースレジスタ
    reading: べーすれじすた
    aliases: [基底レジスタ]
    simple: プログラムが置かれた領域の先頭アドレス(基準)を保持するレジスタです。
    definition: 基底アドレス指定で、命令中のアドレス部に加算する基準となる先頭アドレスを保持するレジスタ。プログラムの再配置を容易にする。
    related: [レジスタ, インデックスレジスタ, 基底アドレス指定]
  - term: スタックポインタ
    reading: すたっくぽいんた
    simple: スタック領域の最上位(次に使う位置)のアドレスを示すレジスタです。
    definition: スタックの現在のトップのアドレスを保持するレジスタ。プッシュ・ポップや関数呼出し・復帰のたびに更新される。
    related: [レジスタ, スタック]
  - term: 直接アドレス指定
    reading: ちょくせつあどれすしてい
    simple: 命令のアドレス部が、そのままオペランドのアドレスになる方式です。
    definition: 命令中のアドレス部の値をそのまま実効アドレスとしてオペランドを参照する方式。
    related: [アドレス指定方式, 間接アドレス指定, 有効アドレス]
  - term: 間接アドレス指定
    reading: かんせつあどれすしてい
    simple: アドレス部が指す場所に、本来のデータのアドレスが入っている方式です。
    definition: 命令中のアドレス部が示す記憶場所に格納された値を、オペランドのアドレスとして用いる方式。
    related: [アドレス指定方式, 直接アドレス指定]
  - term: 指標アドレス指定
    reading: しひょうあどれすしてい
    simple: アドレス部にインデックスレジスタの値を足してアドレスを求める方式です。
    definition: 命令中のアドレス部にインデックスレジスタの内容を加えて実効アドレスとする方式。配列の要素の参照に適する。
    related: [アドレス指定方式, インデックスレジスタ, 基底アドレス指定]
  - term: 基底アドレス指定
    reading: きていあどれすしてい
    simple: アドレス部にベースレジスタの値を足してアドレスを求める方式です。
    definition: 命令中のアドレス部にベースレジスタの内容を加えて実効アドレスとする方式。プログラムをメモリ上の任意の位置に配置（再配置）しやすい。
    related: [アドレス指定方式, ベースレジスタ, 指標アドレス指定]
  - term: 相対アドレス指定
    reading: そうたいあどれすしてい
    simple: 現在の命令のアドレス(プログラムカウンタ)を基準にして、相対的な距離でアドレスを指定する方式です。
    definition: プログラムカウンタの値に命令中のアドレス部（変位）を加えて実効アドレスとする方式。分岐命令などで使われる。
    related: [アドレス指定方式, プログラムカウンター]
  - term: 即値アドレス指定
    reading: そくちあどれすしてい
    aliases: [即値指定]
    simple: 命令の中にデータそのものが入っていて、記憶装置を参照しない方式です。
    definition: 命令中のアドレス部がアドレスではなくオペランドの値そのものである方式。記憶装置へのアクセスが不要で高速。
    related: [アドレス指定方式, 直接アドレス指定]
  - term: 有効アドレス
    reading: ゆうこうあどれす
    aliases: [実効アドレス]
    simple: アドレス指定方式による計算の結果、最終的に決まるデータの主記憶上のアドレスです。
    definition: 指標・基底・相対などのアドレス指定による計算を経て得られる、実際に参照される主記憶上のアドレス。
    related: [アドレス指定方式]
  - term: 半加算器
    reading: はんかさんき
    simple: "1ビットどうしを足して、和と桁上げを出す回路です。下の桁からの桁上げは受け取れません。"
    definition: "2つの1ビットを加算して和（排他的論理和）と桁上げ（論理積）を出力する回路。下位からの桁上げ入力をもたない。"
    related: [加算器, 全加算器]
  - term: 全加算器
    reading: ぜんかさんき
    simple: 下の桁からの桁上げも含めて、3つの1ビットを足す回路です。
    definition: "2つの入力ビットと下位桁からの桁上げの3ビットを加算し、和と桁上げを出力する回路。半加算器2個と OR 回路で構成できる。"
    related: [加算器, 半加算器]
  - term: 順序回路
    reading: じゅんじょかいろ
    simple: 現在の入力だけでなく、過去の状態にも出力が左右される論理回路です。
    definition: 出力が現在の入力だけでなく内部に記憶された過去の状態にも依存する論理回路。フリップフロップなどの記憶素子を含む。
    related: [フリップフロップ, 組合せ回路]
  - term: 組合せ回路
    reading: くみあわせかいろ
    simple: 出力が現在の入力だけで決まる論理回路です。
    definition: 出力が現在の入力の値のみで決まり、記憶素子をもたない論理回路。加算器やデコーダなど。
    related: [フリップフロップ, 順序回路]
  - term: NAND回路
    reading: なんどかいろ
    simple: AND の結果を反転して出力する回路です。
    definition: 論理積（AND）の否定を出力する論理回路。すべての入力が1のときだけ0を出力する。NAND だけで他のすべての論理回路を構成できる。
    related: [論理回路, AND回路, NOR回路]
  - term: NOR回路
    reading: のあかいろ
    simple: OR の結果を反転して出力する回路です。
    definition: 論理和（OR）の否定を出力する論理回路。すべての入力が0のときだけ1を出力する。
    related: [論理回路, OR回路, NAND回路]
  - term: AND回路
    reading: あんどかいろ
    simple: すべての入力が1のときだけ1を出力する回路です。
    definition: 論理積を出力する論理回路。すべての入力が1のときだけ1を出力する。
    related: [論理回路, OR回路, 論理積]
  - term: OR回路
    reading: おあかいろ
    simple: 入力のどれか1つでも1なら1を出力する回路です。
    definition: 論理和を出力する論理回路。入力のいずれか1つでも1であれば1を出力する。
    related: [論理回路, AND回路]
  - term: NOT回路
    reading: のっとかいろ
    simple: 入力の0と1を反転して出力する回路です。
    definition: 入力を反転して出力する論理回路（否定）。インバータともいう。
    related: [論理回路]
  - term: XOR回路
    reading: えっくすおあかいろ
    simple: "2つの入力が異なるときだけ1を出力する回路です。"
    definition: 排他的論理和を出力する論理回路。2つの入力が異なるときに1を出力する。半加算器の和の出力に使われる。
    related: [論理回路, 排他的論理和, 半加算器]
  - term: 内部割込み
    reading: ないぶわりこみ
    simple: 実行中のプログラム自身が原因で起こる割込みです。
    definition: 実行中のプログラムの命令が原因で発生する割込み。ゼロ除算やオーバーフロー、不正命令などのプログラム割込み、SVC割込みがある。
    related: [割込み, 外部割込み, SVC]
  - term: 外部割込み
    reading: がいぶわりこみ
    simple: 入出力装置やタイマなど、プログラムの外側が原因で起こる割込みです。
    definition: 実行中のプログラムとは無関係な、入出力装置の完了通知、タイマ、機械の障害、オペレータの操作などが原因で発生する割込み。
    related: [割込み, 内部割込み]
  - term: SVC
    reading: えすぶいしー
    fullName: SuperVisor Call
    japanese: スーパバイザコール
    aliases: [スーパーバイザーコール]
    words:
      - { en: SuperVisor, ja: OSの管理プログラム }
      - { en: Call, ja: 呼出し }
    simple: プログラムがOSの機能を使うために、自分から起こす割込みです。
    definition: アプリケーションプログラムが OS の機能（入出力など）を要求するために発行する命令と、それにより発生する内部割込み。
    related: [割込み, 内部割込み, システムコール]
  - term: ページフォールト
    reading: ぺーじふぉーると
    aliases: [ページフォールト割込み]
    simple: 仮想記憶で、必要なページが主記憶にないときに起こる割込みです。
    definition: 仮想記憶方式で、参照したページが主記憶上に存在しないときに発生する割込み。OS が補助記憶からページを読み込む。
    related: [割込み, 仮想記憶, ページング]
  - term: サイクルタイム
    reading: さいくるたいむ
    simple: クロックの1周期にかかる時間です。
    definition: クロックの1周期の時間（クロック周波数の逆数）。主記憶では、読み書きを連続して行うときの最短の間隔を指すこともある。
    related: [クロック周波数]
  - term: スーパーパイプライン
    reading: すーぱーぱいぷらいん
    simple: パイプラインの段数を細かく増やして、クロックを高速にする方式です。
    definition: パイプラインの各ステージをさらに細分化して段数を増やし、クロック周波数を高めて性能を向上させる方式。
    related: [パイプライン, スーパースカラ]
  - term: スーパースカラ
    reading: すーぱーすからら
    simple: 複数のパイプラインを並べ、1クロックで複数の命令を同時に実行する方式です。
    definition: CPU 内に複数のパイプラインや演算器を持ち、1クロックで複数の命令を同時に実行する方式。命令の依存関係はハードウェアが判断する。
    related: [パイプライン, VLIW]
  - term: VLIW
    reading: ぶいえるあいだぶりゅー
    fullName: Very Long Instruction Word
    japanese: 超長命令語
    words:
      - { en: Very Long, ja: とても長い }
      - { en: Instruction Word, ja: 命令語 }
    simple: 同時に実行できる複数の命令を、コンパイラがあらかじめ1つの長い命令にまとめておく方式です。
    definition: 並列実行可能な複数の命令を、コンパイラが1つの長い命令語にまとめ、CPU がそれを同時に実行する方式。ハードウェアが単純になるが、コンパイラの負担が大きい。
    related: [パイプライン, スーパースカラ]
  - term: ハザード
    reading: はざーど
    aliases: [パイプラインハザード]
    simple: 前の命令の結果待ちや分岐などで、パイプラインの流れが乱れることです。
    definition: パイプライン処理で、データの依存関係（データハザード）、資源の競合（構造ハザード）、分岐命令（制御ハザード）により、次の命令を予定どおり実行できなくなる現象。
    related: [パイプライン]
  - term: SISD
    reading: しずど
    fullName: Single Instruction stream Single Data stream
    japanese: 単一命令流・単一データ流
    words:
      - { en: Single Instruction, ja: "1つの命令" }
      - { en: Single Data, ja: "1つのデータ" }
    simple: "1つの命令が1つのデータを処理する、従来型の逐次処理方式です。"
    definition: フリンの分類の一つで、単一の命令流が単一のデータ流を処理する方式。従来型の逐次処理コンピュータに相当する。
    related: [SIMD, MIMD, フリンの分類]
  - term: MIMD
    reading: みんど
    fullName: Multiple Instruction stream Multiple Data stream
    japanese: 複数命令流・複数データ流
    words:
      - { en: Multiple Instruction, ja: 複数の命令 }
      - { en: Multiple Data, ja: 複数のデータ }
    simple: 複数のプロセッサが、それぞれ別の命令で別のデータを同時に処理する方式です。
    definition: フリンの分類の一つで、複数の命令流が複数のデータ流を同時に処理する方式。マルチプロセッサやマルチコアが該当する。
    related: [SIMD, SISD, フリンの分類]
  - term: MISD
    reading: みすど
    fullName: Multiple Instruction stream Single Data stream
    japanese: 複数命令流・単一データ流
    words:
      - { en: Multiple Instruction, ja: 複数の命令 }
      - { en: Single Data, ja: "1つのデータ" }
    simple: 複数の命令で1つのデータ流を処理する分類で、実用例はほとんどありません。
    definition: フリンの分類の一つで、複数の命令流が単一のデータ流を処理する方式。実用的な例は少ない。
    related: [SIMD, SISD, フリンの分類]
  - term: フリンの分類
    reading: ふりんのぶんるい
    simple: コンピュータを、命令の流れ数とデータの流れ数で4つに分類する方法です。
    definition: マイケル・フリンが提案した並列コンピュータの分類。命令流とデータ流の数により SISD、SIMD、MISD、MIMD に分ける。
    related: [SIMD, SISD, MISD, MIMD]
  - term: 密結合マルチプロセッサ
    reading: みっけつごうまるちぷろせっさ
    aliases: [密結合]
    simple: 複数のプロセッサが主記憶を共有し、1つのOSで動くシステムです。
    definition: 複数のプロセッサが主記憶を共有し、単一の OS の下で動作するマルチプロセッサ。タスクを各プロセッサに動的に割り当てられるが、共有メモリへのアクセスが競合しやすい。
    related: [マルチプロセッサシステム, 疎結合マルチプロセッサ]
  - term: 疎結合マルチプロセッサ
    reading: そけつごうまるちぷろせっさ
    aliases: [疎結合]
    simple: 各プロセッサが独自の主記憶とOSをもち、通信で連携するシステムです。
    definition: 各プロセッサが独自の主記憶と OS をもち、通信回線や共有ディスクなどを介して連携するマルチプロセッサ。1台が故障しても他が稼働を続けやすい。
    related: [マルチプロセッサシステム, 密結合マルチプロセッサ]
  - term: RAM
    reading: らむ
    fullName: Random Access Memory
    japanese: 随時書込み読出しメモリ
    words:
      - { en: Random Access, ja: 任意の場所に直接アクセスできる }
      - { en: Memory, ja: 記憶装置 }
    simple: 自由に読み書きできるが、電源を切ると内容が消えるメモリの総称です。
    definition: 任意のアドレスのデータを読み書きできるメモリ。一般に電源を切ると内容が失われる揮発性で、DRAM と SRAM がある。
    related: [DRAM, ROM]
  - term: DIMM
    reading: でぃむ
    fullName: Dual Inline Memory Module
    japanese: デュアルインラインメモリモジュール
    words:
      - { en: Dual Inline, ja: 両面に端子が並んだ }
      - { en: Memory Module, ja: メモリ基板 }
    simple: DRAMチップを基板に載せた、パソコンの主記憶に使うメモリモジュールです。
    definition: 複数の DRAM チップを小さな基板に実装したメモリモジュールの規格。基板の両面に独立した端子をもつ。
    related: [DRAM, 主記憶]
  - term: ROM
    reading: ろむ
    fullName: Read Only Memory
    japanese: 読出し専用メモリ
    words:
      - { en: Read Only, ja: 読出し専用の }
      - { en: Memory, ja: 記憶装置 }
    simple: 基本的に読み出し専用で、電源を切っても内容が消えないメモリです。
    definition: 通常は読出しだけを行い、電源を切っても内容が保持される不揮発性メモリ。BIOS などのファームウェアの格納に使われる。
    related: [フラッシュメモリ, RAM, EEPROM]
  - term: EEPROM
    reading: いーいーぴーろむ
    fullName: Electrically Erasable Programmable Read Only Memory
    japanese: 電気的消去可能プログラマブルROM
    words:
      - { en: Electrically Erasable, ja: 電気的に消去できる }
      - { en: Programmable, ja: 書込み可能な }
      - { en: Read Only Memory, ja: 読出し専用メモリ }
    simple: 電気信号で内容を書き換えられる不揮発性のメモリです。
    definition: 電気的に内容を消去・書換えできる不揮発性メモリ。フラッシュメモリはその一種で、ブロック単位で消去する。
    related: [フラッシュメモリ, ROM]
  - term: USBメモリ
    reading: ゆーえすびーめもり
    simple: フラッシュメモリを使った、USB端子に差して使う持ち運び用の記憶装置です。
    definition: フラッシュメモリを内蔵し、USB インタフェースでパソコンに接続して使う可搬型の記憶装置。
    related: [フラッシュメモリ, USB, SDカード]
  - term: SDカード
    reading: えすでぃーかーど
    simple: フラッシュメモリを使った切手サイズの記録メディアで、カメラやスマホで使われます。
    definition: フラッシュメモリを使用したメモリカードの規格。デジタルカメラ、スマートフォンなどで広く使われる。
    related: [フラッシュメモリ, USBメモリ]
  - term: ヒット率
    reading: ひっとりつ
    simple: 必要なデータがキャッシュにあった割合です。
    definition: CPU が参照したデータがキャッシュメモリ上に存在した割合。実効アクセス時間 = ヒット率×キャッシュの時間 + (1−ヒット率)×主記憶の時間 で求める。
    related: [キャッシュメモリ, 実効アクセス時間]
  - term: ライトスルー
    reading: らいとするー
    simple: 書き込みのとき、キャッシュと主記憶の両方に同時に書く方式です。
    definition: 書込み時にキャッシュメモリと主記憶の両方へ同時に書き込む方式。主記憶との一貫性は保たれるが、書込みが主記憶の速度に制約される。
    related: [キャッシュメモリ, ライトバック]
  - term: ライトバック
    reading: らいとばっく
    simple: 書き込みのとき、まずキャッシュにだけ書き、あとでまとめて主記憶に戻す方式です。
    definition: 書込み時にキャッシュメモリだけを更新し、そのブロックがキャッシュから追い出されるときに主記憶へ書き戻す方式。書込みが速いが、一貫性の維持が複雑になる。
    related: [キャッシュメモリ, ライトスルー]
  - term: 実効アクセス時間
    reading: じっこうあくせすじかん
    simple: キャッシュのヒットと失敗の割合を考慮した、平均的なメモリアクセス時間です。
    definition: キャッシュメモリのアクセス時間と主記憶のアクセス時間を、ヒット率で加重平均した、平均的な記憶装置のアクセス時間。
    related: [キャッシュメモリ, ヒット率]
  - term: 補助記憶
    reading: ほじょきおく
    aliases: [補助記憶装置, 二次記憶]
    simple: 主記憶より大容量で低速な、ハードディスクやSSDなどの記憶装置です。
    definition: 主記憶を補う大容量で比較的低速・低価格な記憶装置。HDD、SSD、光ディスク、磁気テープなど。電源を切ってもデータが保持される。
    related: [記憶階層, 主記憶]
  - term: ディスクキャッシュ
    reading: でぃすくきゃっしゅ
    simple: 低速なディスクのデータを、高速な主記憶上に一時的に保持して読み書きを速くする仕組みです。
    definition: 磁気ディスクなどのデータの一部を主記憶や専用メモリ上に保持し、ディスクへのアクセス回数を減らして処理を高速化する仕組み。
    related: [記憶階層, キャッシュメモリ]
  - term: バンク
    reading: ばんく
    simple: メモリインタリーブで、並行してアクセスできるように分割された主記憶の単位です。
    definition: 主記憶を独立してアクセス可能な複数の部分に分けたときの、その1つひとつの単位。メモリインタリーブでは連続するアドレスを異なるバンクに割り当てる。
    related: [メモリインタリーブ]
  - term: ビット
    reading: びっと
    simple: "0か1を表す、情報量の最小の単位です。"
    definition: "2進数の1桁で、情報量の最小単位。0または1の2通りを表す。"
    related: [ビットとバイト, バイト]
  - term: バイト
    reading: ばいと
    simple: "8ビットをひとまとめにした情報量の単位です。"
    definition: "8ビットをひとまとまりとした情報量の単位。256通りの値を表せ、半角英数字1文字を表現できる。"
    related: [ビットとバイト, ビット]
  - term: キロバイト
    reading: きろばいと
    aliases: [KB]
    simple: "約1,000バイト(SI接頭語)を表す単位です。"
    definition: "1,000バイトを表す単位（SI 接頭語、kB）。2進数の接頭語では 1,024 バイトを KiB（キビバイト）とする。"
    related: [ビットとバイト, メガバイト]
  - term: メガバイト
    reading: めがばいと
    aliases: [MB]
    simple: 約100万バイトを表す単位です。
    definition: "10^6（1,000,000）バイトを表す単位。2進数の接頭語では 2^20 バイトを MiB（メビバイト）とする。"
    related: [ビットとバイト, キロバイト, ギガバイト]
  - term: ギガバイト
    reading: ぎがばいと
    aliases: [GB]
    simple: 約10億バイトを表す単位です。
    definition: "10^9（1,000,000,000）バイトを表す単位。2進数の接頭語では 2^30 バイトを GiB（ギビバイト）とする。"
    related: [ビットとバイト, メガバイト]
  - term: CD-ROM
    reading: しーでぃーろむ
    simple: 読み出し専用のCDで、音楽やソフトの配布に使われた光ディスクです。
    definition: 読出し専用の CD。工場で情報が書き込まれ、利用者は書換えできない。容量は約650〜700MB。
    related: [光ディスク, CD-R]
  - term: CD-R
    reading: しーでぃーあーる
    simple: 一度だけ書き込める、記録型のCDです。
    definition: 利用者が一度だけデータを書き込める記録型の CD。書き込んだ内容は消去・書換えできない。
    related: [光ディスク, CD-ROM, DVD-R]
  - term: DVD-R
    reading: でぃーぶいでぃーあーる
    simple: 一度だけ書き込める、記録型のDVDです。
    definition: 一度だけ書込みができる記録型の DVD。片面1層で約4.7GB。
    related: [光ディスク, CD-R, DVD-RAM]
  - term: DVD-RAM
    reading: でぃーぶいでぃーらむ
    simple: 何度でも書き換えられる、記録型のDVDです。
    definition: 繰返し書換えが可能な DVD。ランダムアクセスに適し、データ用途に使われる。
    related: [光ディスク, DVD-R]
  - term: ブルーレイディスク
    reading: ぶるーれいでぃすく
    aliases: [BD]
    simple: 青紫色レーザーを使い、DVDより大容量を記録できる光ディスクです。
    definition: 青紫色レーザーで読み書きする大容量の光ディスク。片面1層で25GBの容量をもち、高精細映像の記録に使われる。
    related: [光ディスク, DVD-R]
  - term: アドレスバス
    reading: あどれすばす
    simple: メモリなどの場所を指定するアドレスを伝える信号線です。
    definition: CPU が主記憶や入出力装置の場所（アドレス）を指定するための信号線。アドレスバスの幅で扱える記憶容量が決まる。
    related: [バス, データバス, コントロールバス]
  - term: データバス
    reading: でーたばす
    simple: データそのものを運ぶ信号線です。
    definition: CPU とメモリや入出力装置の間でデータを転送する信号線。データバスの幅（ビット数）が1回に転送できるデータ量を決める。
    related: [バス, アドレスバス, コントロールバス]
  - term: コントロールバス
    reading: こんとろーるばす
    simple: 読み出し・書き込みなどの制御信号を伝える信号線です。
    definition: 読出し／書込みの区別やタイミングなど、装置間の動作を制御する信号を伝える信号線。
    related: [バス, アドレスバス, データバス]
  - term: システムバス
    reading: しすてむばす
    simple: CPUと主記憶など、コンピュータの中心部をつなぐバスです。
    definition: CPU、主記憶、入出力インタフェースなどコンピュータの主要部分を結ぶバス。
    related: [バス, 入出力バス]
  - term: 入出力バス
    reading: にゅうしゅつりょくばす
    simple: 周辺機器をつなぐためのバスです。
    definition: CPU やメモリと周辺装置を接続し、入出力を行うためのバス。PCI Express などがある。
    related: [バス, システムバス]
  - term: シリアルバス
    reading: しりあるばす
    simple: データを1ビットずつ順番に送るバスです。
    definition: データを1本（または少数）の信号線で1ビットずつ順次伝送するバス。高速化しやすく、配線が少ない。USB、PCI Express、シリアルATAなど。
    related: [バス, パラレルバス]
  - term: パラレルバス
    reading: ぱられるばす
    simple: 複数のビットを並べた信号線で、同時に送るバスです。
    definition: 複数ビットを複数の信号線で同時に伝送するバス。クロック周波数を高くすると信号線間のずれ（スキュー）が問題になる。
    related: [バス, シリアルバス]
  - term: PCI Express
    reading: ぴーしーあいえくすぷれす
    aliases: [PCIe]
    simple: パソコン内部で拡張カードなどをつなぐ、高速なシリアル方式のバス規格です。
    definition: レーン単位の高速なシリアル伝送を用いる拡張バスの規格。グラフィックスカードや SSD などの接続に使われる。
    related: [バス, シリアルバス]
  - term: Zigbee
    reading: じぐびー
    simple: 低消費電力で、センサーなどの小型機器を無線でつなぐための規格です。
    definition: IEEE 802.15.4 に基づく、低消費電力・低速・近距離の無線通信規格。スマートホームやセンサーネットワークで使われる。
    related: [Bluetooth]
  - term: IrDA
    reading: あいあーるでぃーえー
    fullName: Infrared Data Association
    japanese: 赤外線通信協会
    words:
      - { en: Infrared, ja: 赤外線 }
      - { en: Data, ja: データ }
      - { en: Association, ja: 協会 }
    simple: 赤外線を使って近い距離で機器どうしがデータをやり取りする規格です。
    definition: 赤外線を用いた近距離のデータ通信規格。通信相手との間に障害物があると通信できず、向き合わせる必要がある。
    related: [Bluetooth]
  - term: DisplayPort
    reading: でぃすぷれいぽーと
    simple: パソコンとディスプレイをつなぐ映像・音声のデジタルインタフェース規格です。
    definition: VESA が策定した、映像と音声をデジタル伝送するインタフェース規格。主にパソコンとディスプレイの接続に使われる。
    related: [HDMI]
  - term: ホットプラグ
    reading: ほっとぷらぐ
    simple: 電源を入れたまま機器の抜き差しができることです。
    definition: コンピュータの電源を入れたまま周辺機器を接続・取り外しできる機能。
    related: [USB, プラグアンドプレイ]
  - term: バスパワー
    reading: ばすぱわー
    simple: 信号線と同じケーブルから電力を受け取って動作する方式です。
    definition: インタフェースのケーブルを通じて接続元から給電を受けて周辺機器が動作する方式。別電源を必要としない。
    related: [USB]
  - term: プラグアンドプレイ
    reading: ぷらぐあんどぷれい
    aliases: [PnP]
    simple: 機器をつなぐだけで、自動的に認識されて使えるようになる機能です。
    definition: 周辺機器を接続すると OS が自動的に認識し、ドライバの設定などを自動的に行って使えるようにする仕組み。
    related: [USB, ホットプラグ]
  - term: Thunderbolt
    reading: さんだーぼると
    simple: データ転送、映像出力、給電を1本のケーブルで行える高速なインタフェース規格です。
    definition: Intel などが開発した、PCI Express と DisplayPort の信号を伝送できる高速なインタフェース規格。USB Type-C コネクタを使うバージョンがある。
    related: [USB, PCI Express]
  - term: OMR
    reading: おーえむあーる
    fullName: Optical Mark Reader
    japanese: 光学式マーク読取装置
    aliases: [Optical Mark Reader, 光学式マーク読取装置]
    words:
      - { en: Optical, ja: 光学式の }
      - { en: Mark, ja: マーク（印） }
      - { en: Reader, ja: 読取装置 }
    simple: 鉛筆などで塗りつぶしたマークシートを光で読み取る装置です。
    definition: マークシートの塗りつぶされたマークの位置を光学的に読み取る装置。試験の答案やアンケートの集計に使われる。文字を認識する OCR とは異なる。
    related: [OCR]
  - term: 液晶ディスプレイ
    reading: えきしょうでぃすぷれい
    aliases: [TFT液晶]
    simple: 液晶に光を通したり遮ったりして映像を表示するディスプレイです。
    definition: 液晶分子の向きを電圧で制御し、バックライトの光の透過量を変えて表示するディスプレイ。TFT（薄膜トランジスタ）で画素を駆動する TFT 液晶が一般的。有機ELは自発光でバックライトが不要。
    related: [有機ELディスプレイ, 電子ペーパー]
  - term: 電子ペーパー
    reading: でんしぺーぱー
    simple: 紙のように見やすく、表示を保つだけなら電力をほとんど使わないディスプレイです。
    definition: 紙に近い見やすさをもち、表示内容の保持に電力をほとんど必要としない反射型のディスプレイ。電子書籍端末などに使われる。
    related: [有機ELディスプレイ, 液晶ディスプレイ]
  - term: dpi
    reading: でぃーぴーあい
    fullName: dots per inch
    japanese: "1インチ当たりのドット数"
    words:
      - { en: dots, ja: ドット（点） }
      - { en: per, ja: 〜あたり }
      - { en: inch, ja: インチ }
    simple: "1インチの長さにいくつ点が並ぶかを表す、プリンタやスキャナの解像度の単位です。"
    definition: "1インチ当たりのドット数。プリンタやスキャナの解像度を表す単位。"
    related: [解像度, ppi]
  - term: ppi
    reading: ぴーぴーあい
    fullName: pixels per inch
    japanese: "1インチ当たりの画素数"
    words:
      - { en: pixels, ja: 画素 }
      - { en: per, ja: 〜あたり }
      - { en: inch, ja: インチ }
    simple: "1インチの長さにいくつ画素が並ぶかを表す、ディスプレイなどの精細さの単位です。"
    definition: "1インチ当たりの画素数。ディスプレイやデジタル画像の精細さを表す。"
    related: [解像度, dpi, 画素]
  - term: 画素
    reading: がそ
    aliases: [ピクセル]
    simple: デジタル画像を構成する、色や明るさをもつ最小の点です。
    definition: デジタル画像やディスプレイを構成する最小単位の点（ピクセル）。画素数が多いほど細かい表現ができる。
    related: [解像度, ppi]
  - term: シーク時間
    reading: しーくじかん
    simple: ヘッドを目的のトラックまで動かすのにかかる時間です。
    definition: 磁気ディスクで、ヘッドを目的のトラック（シリンダ）まで移動させるのに要する時間。平均アクセス時間 = 平均シーク時間 + 平均回転待ち時間 + データ転送時間。
    related: [ハードディスク, 回転待ち時間]
  - term: 回転待ち時間
    reading: かいてんまちじかん
    aliases: [サーチ時間]
    simple: ヘッドが目的のトラックに着いてから、目的のデータが回ってくるまでの待ち時間です。
    definition: ヘッドが目的のトラックに到達した後、目的のセクターがヘッドの位置まで回転してくるのを待つ時間。平均では 1回転の時間の半分。
    related: [ハードディスク, シーク時間]
  - term: トラック
    reading: とらっく
    simple: ディスクの表面にある、同心円状のデータを記録する通り道です。
    definition: 磁気ディスクの記録面にある同心円状のデータ記録領域。トラックを分割したものがセクターである。
    related: [ハードディスク, シリンダ, セクター]
  - term: シリンダ
    reading: しりんだ
    simple: 複数の記録面の、同じ位置にあるトラックをまとめたものです。
    definition: 複数枚のディスク面で同じ位置にあるトラックの集合。ヘッドを動かさずにアクセスできる範囲。
    related: [ハードディスク, トラック, セクター]
  - term: セクター
    reading: せくたー
    simple: トラックを小さく区切った、ディスクの読み書きの基本単位です。
    definition: トラックを分割した、磁気ディスクの最小の読み書き単位。512バイトまたは4KBが一般的。
    related: [ハードディスク, トラック, シリンダ]
  - term: デフラグメンテーション
    reading: でふらぐめんてーしょん
    aliases: [デフラグ]
    simple: ばらばらに置かれたファイルを、連続した領域に並べ直す処理です。
    definition: ディスク上で断片化したファイルを連続した領域に再配置し、アクセス性能を改善する処理。SSD では一般に不要。
    related: [ハードディスク, フラグメンテーション]
  - term: フラグメンテーション
    reading: ふらぐめんてーしょん
    aliases: [断片化]
    simple: ファイルや空き領域が細かく分かれて、散らばってしまう状態です。
    definition: ファイルの書込みと削除を繰り返すうちに、ファイルが不連続な領域に分散したり空き領域が細切れになったりする現象。ファイルのアクセス速度が低下する。
    related: [ハードディスク, デフラグメンテーション]
  - term: ストリーマ
    reading: すとりーま
    simple: 磁気テープにデータを連続して書き込み、バックアップなどに使う装置です。
    definition: 磁気テープ装置の一種で、データを連続的に高速に読み書きする。バックアップ用途に使われる。
    related: [磁気テープ]
  - term: アドレス選択機構
    reading: あどれすせんたくきこう
    simple: 主記憶のなかから、指定されたアドレスの場所を選び出す仕組みです。
    definition: 主記憶装置で、アドレスバスから与えられたアドレスに対応する記憶セルを選択する回路。
    related: [主記憶, アドレスバス]
  - term: シングルコア
    reading: しんぐるこあ
    simple: "1つのプロセッサに、コアが1つだけのものです。"
    definition: "1つのプロセッサに演算処理を行うコアを1つだけ備えた構成。マルチコアと対比される。"
    related: [マルチコアプロセッサ, コア]
  - term: コア
    reading: こあ
    simple: プロセッサの中で、実際に命令を実行する演算処理の中心部分です。
    definition: プロセッサ内で命令の解読・実行を行う処理の中核部分。1つのプロセッサに複数のコアを搭載したものがマルチコアプロセッサ。
    related: [マルチコアプロセッサ, シングルコア]
  - term: 制御装置
    reading: せいぎょそうち
    simple: 命令を解読して、他の装置に動作を指示するコンピュータの装置です。
    definition: 命令を取り出して解読し、演算装置や記憶装置、入出力装置の動作を制御する装置。五大装置の一つ。
    related: [CPU, 演算装置, 五大装置]
  - term: 演算装置
    reading: えんざんそうち
    simple: 算術演算や論理演算を行うコンピュータの装置です。
    definition: 加減乗除などの算術演算や論理演算を行う装置（ALU）。五大装置の一つ。
    related: [CPU, 制御装置, 五大装置]
  - term: 五大装置
    reading: ごだいそうち
    simple: コンピュータを構成する、入力・出力・記憶・演算・制御の5つの装置です。
    definition: コンピュータを構成する基本的な5つの装置。入力装置、出力装置、記憶装置、演算装置、制御装置をいい、演算装置と制御装置をまとめたものが CPU。
    related: [CPU, 制御装置, 演算装置]
