category: ビジネスシステム
terms:
  - term: ライン生産
    reading: ラインせいさん
    simple: 工程を流れ作業でつなぎ、同じ製品を大量に作る方式です。
    definition: 製品の工程の順に設備と作業者を配置し、流れ作業で生産する方式。同一製品の大量生産で効率が高い一方、品種の切り替えには段取り替えの負担が大きい。少人数が全工程を担当するセル生産方式と対比される。
    related: [セル生産方式]
  - term: 後工程引き取り
    reading: こうこうていひきとり
    simple: 後の工程が、必要な分だけを前の工程から引き取る方式です。
    definition: かんばん方式の考え方で、後工程が必要なものを、必要なときに、必要な量だけ前工程から引き取り、前工程は引き取られた分だけを補充生産する方式。見込みで作る前工程主導の生産と対になる。
    related: [かんばん方式]
  - term: 電子データ交換
    reading: でんしデータこうかん
    simple: 企業間で、受発注などのデータを決まった形式でやり取りすることです。
    definition: EDIの日本語の呼称。企業間で取引データを、あらかじめ取り決めた標準の形式でコンピュータ間に交換する仕組み。手入力の削減と、ミスの防止が目的である。
    related: [EDI]
  - term: 学習データ
    reading: がくしゅうデータ
    simple: AI に学ばせるために使う、元のデータです。
    definition: 機械学習で、モデルの学習に使うデータ。その内容や偏りが、学習したAIの判断の傾向に直接影響するため、利活用では内容の確認が重要になる。
    related: [バイアス]
  - term: バイアス
    reading: バイアス
    simple: 判断や結果に生じる、偏りのことです。
    definition: データや判断に含まれる偏り。AI においては、学習データの偏りが判断の偏りとして現れることがあり、特定の属性に不利な結果を生む場合があるため、検証が必要とされる。
    related: [学習データ]
  - term: コード決済
    reading: コードけっさい
    simple: スマートフォンの画面のコードを使って支払う方法です。
    definition: QRコードなどのコードを読み取って行う電子決済。店舗側は専用の読み取り端末なしに始められる場合があり、初期の負担が比較的小さい。ICカード決済などと並ぶ、キャッシュレス決済の方式の一つ。
    related: [電子決済]
  - term: リアルタイム性
    reading: リアルタイムせい
    simple: 決められた時間内に、必ず処理を終える性質です。
    definition: 組込みシステムなどに求められる性質で、処理の平均的な速さではなく、定められた期限内に必ず処理を完了することが保証されること。安全に関わる制御では特に厳しく求められる。
    related: [組込みシステム]
