category: 基礎理論
terms:
  - term: 基数変換
    reading: きすうへんかん
    simple: 2進数・10進数・16進数など、数の表し方（何進数か）を別の表し方に変えることです。
    definition: n 進数で表された数を、値を変えずに別の基数の表現に変換すること。整数部は基数で割った余りを、小数部は基数を掛けた整数部を順に取り出して求める。
    example: 10進数の 13 を2で割り続けると余りが 1,0,1,1 となり、下から読んで 1101₂。
    related: [16進数, 2の補数]
  - term: 16進数
    reading: じゅうろくしんすう
    simple: 0〜9 と A〜F の16種類の記号で数を表す方法です。2進数4桁を1桁で書けるので、コンピュータのデータを短く表すのに便利です。
    definition: 基数を16とする記数法。A〜F はそれぞれ10進数の10〜15を表す。各桁の重みは 16 のべき乗。
    example: 2進数 1111 1111 は16進数で FF、10進数で 255。色の指定 #FF0000（赤）にも使われる。
    related: [基数変換]
  - term: 2の補数
    reading: にのほすう
    simple: コンピュータで負の数を表す代表的な方法です。全ビットを反転して1を足すと、符号が逆の数になります。
    definition: n ビットの数 x に対し、2ⁿ−x で負数を表す表現方法。最上位ビットが符号を兼ね、n ビットで −2ⁿ⁻¹〜2ⁿ⁻¹−1 を表せる。減算を加算回路で行える利点がある。
    example: 8ビットで ＋5＝00000101、−5＝11111011。
    difference: 1の補数はビット反転だけで、0 の表現が2通り（＋0, −0）ある。
    related: [基数変換, 算術シフト]
  - term: 浮動小数点数
    reading: ふどうしょうすうてんすう
    simple: 「仮数×基数の指数乗」の形で、とても大きな数や小さな数を表す方法です。
    definition: 数値を符号部・指数部・仮数部で表現する方式。IEEE 754 の単精度は32ビット（指数8・仮数23）、倍精度は64ビット（指数11・仮数52）。
    example: 0.000123 を 1.23×10⁻⁴ と表すのと同じ考え方を2進数で行う。
    difference: 固定小数点数は小数点の位置を固定するため、表せる範囲は狭いが計算は単純。
    related: [正規化（浮動小数点数）, 桁落ち, 情報落ち]
  - term: 正規化（浮動小数点数）
    reading: せいきか
    simple: 浮動小数点数の仮数部の先頭に 0 が来ないように調整して、精度（有効桁数）をできるだけ高くすることです。
    definition: 仮数部の最上位桁が 0 以外になるように仮数部をシフトし、指数部を調整する操作。有効桁数を最大に保つ。
    difference: データベース設計の「正規化」とは全く別の概念。
    related: [浮動小数点数]
  - term: パック10進数
    reading: ぱっくじゅっしんすう
    aliases: [パック10進]
    simple: 10進数の1桁を4ビットで表し、最後の4ビットに符号を入れる数の表し方です。
    definition: 10進数の各桁を4ビットの2進化10進コードで表し、最下位の4ビットに符号を置く形式。桁数 n の数に (n＋1)×4 ビットを使う（端数はバイト単位に切り上げ）。
    example: −123 → 0001 0010 0011 1101（2バイト）。
    difference: ゾーン10進数は1桁に1バイトを使う。
    related: [BCD]
  - term: BCD
    reading: ビーシーディー
    fullName: Binary Coded Decimal
    japanese: 2進化10進数
    words:
      - { en: Binary, ja: 2進の }
      - { en: Coded, ja: 符号化された }
      - { en: Decimal, ja: 10進数 }
    simple: 10進数の1桁ずつを4ビットの2進数で表す方法です。
    definition: 10進数の各桁（0〜9）をそれぞれ4ビットの2進数で表現する符号化方式。10進数を誤差なく扱える。
    example: 10進数 59 → 0101 1001。
    related: [パック10進数]
  - term: 算術シフト
    reading: さんじゅつシフト
    simple: 符号を保ったまま、数値を2倍や2分の1にするビットのずらし方です。
    definition: 符号ビットを除いてビット列をシフトする操作。右シフトでは空いたビットに符号ビットと同じ値を入れる。左へ n ビットで 2ⁿ 倍、右へ n ビットで 2ⁿ 分の1になる。
    difference: 論理シフトは符号を考慮せず、空いたビットに常に 0 を入れる。
    related: [論理シフト, 2の補数]
  - term: 論理シフト
    reading: ろんりシフト
    simple: ビット列を単なる0と1の並びとして左右にずらし、空いた所に0を入れる操作です。
    definition: 符号を考慮せず、全ビットを左右にシフトし、空いたビット位置に 0 を入れる操作。符号なし整数では左へ n ビットで 2ⁿ 倍、右へ n ビットで 2ⁿ で割った商になる。
    related: [算術シフト]
  - term: 桁落ち
    reading: けたおち
    simple: ほぼ同じ大きさの数同士を引き算したとき、有効な桁が大きく減ってしまう誤差です。
    definition: 値がほぼ等しい2数の減算で上位の桁が打ち消し合い、有効数字の桁数が減少する現象。
    example: 1.234−1.233＝0.001（有効数字4桁→1桁）。
    difference: 情報落ちは、絶対値の大きく異なる数の加減算で小さい方が失われる現象。
    related: [情報落ち, 誤差]
  - term: 情報落ち
    reading: じょうほうおち
    simple: 大きな数に非常に小さな数を足したとき、小さな数が結果に反映されずに失われる誤差です。
    definition: 絶対値の差が大きい2数の加減算で、小さい方の数の下位桁が有効桁数からはみ出して無視される現象。小さい数から順に加算すると軽減できる。
    related: [桁落ち, 誤差]
  - term: ベン図
    reading: ベンず
    simple: 集合を円で表し、重なり具合で集合どうしの関係を図にしたものです。
    definition: 全体集合を長方形、各集合を円で表し、和集合・積集合・補集合などの関係を視覚的に示す図。
    example: A∪B は2つの円の全体、A∩B は円の重なり部分。
    related: [命題論理]
  - term: 命題論理
    reading: めいだいろんり
    simple: 「真か偽かが決まる文（命題）」を、かつ・または・ならば などで組み合わせて考える論理です。
    definition: 真偽が定まる命題を論理演算子（否定・論理積・論理和・含意など）で結合し、その真偽を扱う論理体系。「p ならば q」は p が真で q が偽のときだけ偽。
    related: [述語論理, ブール代数]
  - term: 排他的論理和
    reading: はいたてきろんりわ
    aliases: [XOR, EOR]
    simple: 2つの入力が「異なる」ときに1、「同じ」ときに0になる論理演算です。
    definition: 入力 A, B に対し A⊕B＝A・¬B＋¬A・B となる論理演算。同じ値と2回演算すると元に戻る性質がある。
    example: ビットの反転、パリティの計算、簡易な暗号に使われる。
    related: [論理積, ブール代数]
  - term: ド・モルガンの法則
    reading: ド・モルガンのほうそく
    simple: 「AかつB」の否定は「AでないかBでない」、「AまたはB」の否定は「AでなくBでもない」という法則です。
    definition: ¬(A∧B)＝¬A∨¬B、¬(A∨B)＝¬A∧¬B が成り立つという論理演算・集合演算の法則。
    related: [ブール代数, 命題論理]
  - term: ブール代数
    reading: ブールだいすう
    simple: 0と1（偽と真）だけを扱う計算のルールで、論理回路や条件式を簡単にするのに使います。
    definition: 値が 0 と 1 の2値をとり、論理和・論理積・否定の演算と、分配則・吸収則・ド・モルガンの法則などの法則をもつ代数系。
    example: A・B＋A・¬B＝A・(B＋¬B)＝A。
    related: [ド・モルガンの法則, 論理積]
  - term: 論理積
    reading: ろんりせき
    aliases: [AND]
    simple: 2つの入力が両方とも1のときだけ1になる論理演算（AND）です。
    definition: A・B（A∧B）で表され、A と B がともに真のときだけ真となる論理演算。ビット演算ではマスクとして特定のビットを取り出すのに使う。
    related: [ビットマスク, 排他的論理和]
  - term: ビットマスク
    reading: ビットマスク
    aliases: [マスク]
    simple: ビット列のうち必要な部分だけを取り出したり、変更したりするために使う型紙のようなビット列です。
    definition: 特定のビットを取り出す・セットする・反転するために、論理積・論理和・排他的論理和の相手として用いるビットパターン。
    example: x AND 00001111 で下位4ビットを取り出す。
    related: [論理積, 排他的論理和]
  - term: 確率
    reading: かくりつ
    simple: ある出来事が起こる「確からしさ」を 0 から 1 の数で表したものです。
    definition: 試行の結果として事象が起こる度合い。同様に確からしい場合、（事象が起こる場合の数）÷（起こりうる全ての場合の数）で求める。
    related: [条件付き確率, 期待値]
  - term: 条件付き確率
    reading: じょうけんつきかくりつ
    simple: 「Bが起きた」と分かっているときに、Aが起きている確率です。
    definition: 事象 B が起きたという条件の下で事象 A が起こる確率 P(A｜B)＝P(A∩B)÷P(B)。
    related: [ベイズの定理, 確率]
  - term: ベイズの定理
    reading: ベイズのていり
    simple: 結果が分かったときに、その原因が何だったかの確率を計算する方法です。
    definition: P(A｜B)＝P(B｜A)P(A)÷P(B) で表される定理。事前確率と観測結果から事後確率を求める。
    example: 不良品が見つかったとき、それがどの工場で作られたかの確率を求める。迷惑メールフィルタにも使われる。
    related: [条件付き確率]
  - term: 順列と組合せ
    reading: じゅんれつとくみあわせ
    simple: 並べ方（順序を区別）の数が順列、選び方（順序を区別しない）の数が組合せです。
    definition: n 個から r 個を選んで並べる順列は ₙPᵣ＝n!/(n−r)!、選ぶだけの組合せは ₙCᵣ＝n!/(r!(n−r)!)。
    example: ₅P₃＝60、₅C₃＝10。
    related: [確率]
  - term: 正規分布
    reading: せいきぶんぷ
    simple: 平均を中心に左右対称な釣鐘型の分布で、身長や測定誤差など多くの現象がこれに近い形になります。
    definition: 平均 μ・標準偏差 σ で決まる連続確率分布。μ±σ に約68％、μ±2σ に約95％、μ±3σ に約99.7％が含まれる。
    related: [標準偏差, 二項分布]
  - term: 二項分布
    reading: にこうぶんぷ
    simple: 「成功か失敗か」の試行を何回も繰り返したとき、成功が何回起こるかの分布です。
    definition: 成功確率 p の独立な試行を n 回行ったときの成功回数の分布。期待値 np、分散 np(1−p)。1回の試行の分布はベルヌーイ分布。
    related: [期待値, 正規分布]
  - term: 期待値
    reading: きたいち
    simple: 何度も繰り返したときに平均してどのくらいの値になるかを表す値です。
    definition: 確率変数がとる各値とその確率の積の総和。長期的な平均値を表す。
    example: さいころの目の期待値は (1＋2＋…＋6)÷6＝3.5。
    related: [確率, 二項分布]
  - term: 代表値
    reading: だいひょうち
    simple: データ全体の特徴を一つの値で表したもので、平均値・中央値・最頻値があります。
    definition: 平均値（総和÷個数）、中央値（並べたときの中央の値。偶数個なら中央2つの平均）、最頻値（最も多く現れる値）の総称。中央値は外れ値の影響を受けにくい。
    related: [分散, 標準偏差]
  - term: 分散
    reading: ぶんさん
    simple: データが平均からどのくらい散らばっているかを表す値です。
    definition: 各データと平均値の差の2乗の平均（母分散）。標本から母集団を推定する場合は n−1 で割る（不偏分散）。
    related: [標準偏差, 代表値]
  - term: 標準偏差
    reading: ひょうじゅんへんさ
    simple: データのばらつきの大きさを、元のデータと同じ単位で表した値です。
    definition: 分散の正の平方根。値が大きいほどデータが平均値から離れて散らばっている。
    example: 2,4,4,4,5,5,7,9 の標準偏差は 2。
    related: [分散, 正規分布]
  - term: 相関係数
    reading: そうかんけいすう
    simple: 2つのデータの間に、どのくらい強い直線的な関係があるかを −1〜1 で表した値です。
    definition: 2変数の共分散をそれぞれの標準偏差の積で割った値。1 に近いほど強い正の相関、−1 に近いほど強い負の相関、0 に近いほど直線的な関係が弱い。
    difference: 相関があっても因果関係があるとは限らない（擬似相関）。
    related: [擬似相関, 回帰分析]
  - term: 擬似相関
    reading: ぎじそうかん
    aliases: [見せかけの相関]
    simple: 本当は直接の関係がないのに、別の共通の原因のせいで相関があるように見えることです。
    definition: 2変数の双方に影響する第3の変数（交絡因子）によって生じる、因果関係のない相関。
    example: アイスクリームの売上と水難事故件数（共通要因は気温）。
    related: [相関係数]
  - term: 尺度水準
    reading: しゃくどすいじゅん
    aliases: [尺度]
    simple: データがどんな性質の値かによる分類で、名義・順序・間隔・比例の4つがあります。
    definition: 名義尺度（区別のみ：血液型）、順序尺度（順序に意味：順位）、間隔尺度（差に意味：摂氏温度）、比例尺度（比率に意味、0 が無を表す：重さ・長さ）。
    related: [代表値]
  - term: 仮説検定
    reading: かせつけんてい
    simple: データを使って「差がない」という仮説を否定できるかどうかを判断する統計の手法です。
    definition: 帰無仮説を立て、標本から求めた p 値が有意水準より小さければ帰無仮説を棄却する手続。正しい帰無仮説を棄却する誤りを第1種の誤り、誤った帰無仮説を棄却しない誤りを第2種の誤りという。
    related: [正規分布]
  - term: 回帰分析
    reading: かいきぶんせき
    simple: ある値（目的変数）を、別の値（説明変数）を使った式で予測・説明する分析方法です。
    definition: 目的変数と説明変数の関係を式で表す手法。説明変数が1つなら単回帰分析、複数なら重回帰分析。目的変数が2値の場合はロジスティック回帰分析を用いる。
    related: [相関係数, 主成分分析]
  - term: 主成分分析
    reading: しゅせいぶんぶんせき
    simple: たくさんの項目を、情報をなるべく失わずに少ない数の指標にまとめる分析方法です。
    definition: 相関のある多変数を、分散が最大となる方向から順に互いに無相関な合成変数（主成分）へ変換し、少数の主成分でデータを要約する次元削減の手法。
    related: [回帰分析, 教師なし学習]
  - term: 行列
    reading: ぎょうれつ
    simple: 数を縦と横に長方形に並べたものです。画像処理や機械学習の計算に欠かせません。
    definition: m 行 n 列に数を並べたもの。積 AB の (i, j) 要素は A の i 行と B の j 列の積和。一般に AB≠BA。掛けても変わらない行列を単位行列、AX＝E となる X を A の逆行列という。
    related: [対数]
  - term: 対数
    reading: たいすう
    aliases: [log]
    simple: 「ある数を何乗するとその値になるか」を表す数です。log₂ 8 ＝ 3 は「2を3乗すると8」という意味です。
    definition: aˣ＝b のとき x＝logₐ b。logₐ(MN)＝logₐ M＋logₐ N などの性質をもつ。
    example: 2分探索の比較回数は約 log₂ n 回。
    related: [情報量, 計算量]
  - term: フィボナッチ数列
    reading: フィボナッチすうれつ
    simple: 1, 1, 2, 3, 5, 8 … のように、直前の2つの数を足して次の数を作る数列です。
    definition: F₁＝F₂＝1、Fₙ＝Fₙ₋₁＋Fₙ₋₂（n≧3）で定義される数列。再帰や動的計画法の例として用いられる。
    related: [再帰, 動的計画法]
  - term: 再帰
    reading: さいき
    aliases: [再帰呼出し, 再帰的]
    simple: 関数の中で自分自身を呼び出して、問題を小さくしながら解く方法です。
    definition: 手続や関数が、その処理の中で自分自身を呼び出すこと。終了条件（基底部）と、より小さな問題への呼出しで構成する。呼出しごとに局所変数などがスタックに積まれる。
    example: n! ＝ n×(n−1)!、0!＝1。
    related: [スタック, フィボナッチ数列]
  - term: ニュートン法
    reading: ニュートンほう
    simple: グラフの接線を使って、方程式の答えに少しずつ近づけていく計算方法です。
    definition: f(x)＝0 の解を求める反復法。xₙ₊₁＝xₙ−f(xₙ)/f′(xₙ) により近似値を更新する。解の近くでは高速に収束する。
    difference: 二分法は区間を半分にしていく方法で、遅いが確実に収束する。
    related: [誤差, 微分]
  - term: 誤差
    reading: ごさ
    simple: 計算や測定で得た値と、本当の値とのずれです。
    definition: 丸め誤差（端数処理による）、打切り誤差（無限の計算を有限で打ち切ることによる）、桁落ち・情報落ちなどがある。絶対誤差＝｜近似値−真値｜、相対誤差＝絶対誤差÷｜真値｜。
    related: [桁落ち, 情報落ち]
  - term: 微分
    reading: びぶん
    simple: グラフのある点での傾き（変化の速さ）を求める計算です。
    definition: 関数 f(x) の瞬間的な変化率 f′(x) を求める演算。xⁿ の導関数は n xⁿ⁻¹。数式処理では記号的に計算する。
    related: [ニュートン法]
  - term: グラフ理論
    reading: グラフりろん
    simple: 点（頂点）と線（辺）のつながり方を扱う数学で、路線図やネットワークの分析に使われます。
    definition: 頂点と辺からなるグラフの性質を扱う理論。辺に向きのないものを無向グラフ、向きのあるものを有向グラフという。n 頂点の完全グラフの辺数は n(n−1)/2。
    related: [ダイクストラ法]
  - term: 待ち行列理論
    reading: まちぎょうれつりろん
    aliases: [待ち行列]
    simple: 窓口に客が並ぶ様子を数式で表し、待ち時間などを予測する理論です。
    definition: 到着とサービスの確率的性質から、待ち時間や行列の長さを分析する理論。M/M/1 では利用率 ρ＝平均サービス時間÷平均到着間隔、平均待ち時間＝ρ/(1−ρ)×平均サービス時間。
    example: 平均到着間隔4分・平均サービス時間3分なら、ρ＝0.75、平均待ち時間は9分。
    related: [確率]
  - term: 動的計画法
    reading: どうてきけいかくほう
    simple: 小さな問題の答えをメモしておき、同じ計算を繰り返さずに大きな問題を解く方法です。
    definition: 問題を重複する部分問題に分割し、部分問題の解を表に記録して再利用することで最適解を効率よく求める手法。
    difference: 貪欲法はその時点の最善を選ぶだけで、最適解を保証しない。
    related: [再帰, フィボナッチ数列]
  - term: 情報量
    reading: じょうほうりょう
    simple: 珍しい出来事ほど、それが起きたと知ったときに得られる情報が多い、という考えで情報の多さを表した量です。
    definition: 確率 p の事象の情報量は −log₂ p ビット。各事象の情報量の期待値を平均情報量（エントロピー）という。
    example: 確率 1/8 の事象の情報量は3ビット。
    related: [ハフマン符号, 対数]
  - term: ハフマン符号
    reading: ハフマンふごう
    simple: よく出てくる記号には短い符号、めったに出ない記号には長い符号を割り当てて、データを圧縮する方法です。
    definition: 出現確率の小さい記号から順に2つずつまとめて木を作り、符号を割り当てる可変長の接頭符号。平均符号長を最小にする（情報源符号化）。
    related: [情報量, ハミング符号]
  - term: ハミング符号
    reading: ハミングふごう
    simple: データに検査用のビットを足して、1ビットの誤りなら自動で直せるようにした符号です。
    definition: データビットに複数の検査ビットを付加し、1ビット誤りの訂正と2ビット誤りの検出を可能にする誤り訂正符号。
    related: [パリティチェック, ECC, CRC]
  - term: Unicode
    reading: ユニコード
    simple: 世界中の文字を一つの体系で扱えるようにした文字コードの規格です。
    definition: 世界の文字に一意の番号（符号位置）を割り当てる文字集合の規格。符号化方式に UTF-8・UTF-16 などがある。ISO/IEC 10646（UCS）と対応する。
    related: [UTF-8, ASCII]
  - term: UTF-8
    reading: ユーティーエフエイト
    fullName: Unicode Transformation Format - 8-bit
    japanese: Unicode 変換形式（8ビット単位）
    words:
      - { en: Unicode, ja: ユニコード（世界共通の文字集合） }
      - { en: Transformation, ja: 変換 }
      - { en: Format, ja: 形式 }
      - { en: 8-bit, ja: 8ビット（1バイト）単位 }
    simple: Unicode の文字を1〜4バイトで表す方式で、Web で最も広く使われています。
    definition: Unicode の符号位置を8ビット単位の1〜4バイト可変長で表す符号化方式。ASCII の範囲は ASCII と同一の1バイトで表す。
    related: [Unicode, ASCII]
  - term: ASCII
    reading: アスキー
    fullName: American Standard Code for Information Interchange
    japanese: 情報交換用米国標準コード
    words:
      - { en: American, ja: 米国の }
      - { en: Standard, ja: 標準の }
      - { en: Code, ja: 符号・コード }
      - { en: Information, ja: 情報 }
      - { en: Interchange, ja: 交換 }
    simple: 英字・数字・記号などを7ビットで表す、最も基本的な文字コードです。
    definition: 英数字・記号・制御文字の128文字を7ビットで表す文字コード。日本語は表現できない。
    related: [Unicode, UTF-8]
  - term: 述語論理
    reading: じゅつごろんり
    simple: 「すべての〜について」「ある〜が存在する」といった表現も扱える論理です。
    definition: 命題論理に、変数を含む述語と、全称記号 ∀・存在記号 ∃ を加えた論理体系。¬∀x P(x) ≡ ∃x ¬P(x)。関係データベースの理論的基礎の一つ。
    related: [命題論理]
  - term: 逆ポーランド表記法
    reading: ぎゃくポーランドひょうきほう
    aliases: [後置記法, 逆ポーランド記法]
    simple: 「A＋B」を「AB＋」のように、演算子を後ろに書く式の書き方です。括弧がなくても計算順序が決まります。
    definition: 演算子をオペランドの後に置く表記法（後置記法）。スタックを用いて左から順に評価できる。
    example: (A＋B)×(C−D) → AB＋CD−×。
    related: [スタック, コンパイラ]
  - term: BNF
    reading: ビーエヌエフ
    fullName: Backus-Naur Form
    japanese: バッカス・ナウア記法
    words:
      - { en: Backus, ja: バッカス（考案者の名前） }
      - { en: Naur, ja: ナウア（考案者の名前） }
      - { en: Form, ja: 形式・記法 }
    simple: プログラム言語の文法を、記号を組み合わせた規則で書き表す方法です。
    definition: 「::=」（定義）と「|」（選択）を用いて構文規則を記述するメタ言語。規則の中で自分自身を用いる再帰的定義で繰返しを表す。
    related: [コンパイラ]
  - term: 有限オートマトン
    reading: ゆうげんオートマトン
    aliases: [オートマトン]
    simple: 決まった数の状態をもち、入力に応じて状態を切り替えていく仕組みのモデルです。
    definition: 有限個の状態・入力記号・状態遷移関数・初期状態・受理状態からなる計算モデル。入力列を読み終えたときに受理状態にあれば、その入力を受理する。
    related: [BNF]
  - term: 計算量
    reading: けいさんりょう
    aliases: [オーダ, O記法, 時間計算量]
    simple: データの量が増えたとき、処理時間などがどのくらい増えるかを表す目安です。
    definition: アルゴリズムの実行に要する時間や記憶領域を、入力の大きさ n の関数として表したもの。O(n²) は n の2乗に比例することを表す。
    example: 線形探索 O(n)、2分探索 O(log n)、バブルソート O(n²)、マージソート O(n log n)。
    related: [対数]
  - term: エキスパートシステム
    reading: エキスパートシステム
    simple: 専門家の知識をルールとして蓄え、専門家のように判断や助言をするシステムです。
    definition: 専門家の知識を知識ベースに蓄え、推論エンジンにより問題を解く AI システム。
    related: [機械学習]
  - term: 機械学習
    reading: きかいがくしゅう
    simple: コンピュータが大量のデータからルールやパターンを自動的に学ぶ技術です。
    definition: データから規則性を学習し、予測や分類を行う AI の手法。教師あり学習・教師なし学習・強化学習に大別される。
    related: [教師あり学習, 教師なし学習, 強化学習, 過学習]
  - term: 教師あり学習
    reading: きょうしありがくしゅう
    simple: 正解（ラベル）付きのデータで学習し、新しいデータの正解を予測する機械学習です。
    definition: 入力と正解の組からなる学習データを用いて、入力から出力を予測するモデルを作る学習。数値を予測する回帰と、カテゴリを予測する分類がある。
    related: [教師なし学習, 強化学習]
  - term: 教師なし学習
    reading: きょうしなしがくしゅう
    simple: 正解のないデータから、似たもの同士のグループやデータの特徴を見つけ出す機械学習です。
    definition: 正解ラベルのないデータから構造を見いだす学習。クラスタリング、次元削減（主成分分析など）がある。
    related: [教師あり学習, 主成分分析]
  - term: 強化学習
    reading: きょうかがくしゅう
    simple: 試行錯誤を繰り返し、報酬が最も多くもらえる行動を学ぶ機械学習です。
    definition: エージェントが環境の中で行動し、得られる報酬の合計を最大化する行動方針を学習する手法。
    example: ゲーム AI、ロボットの歩行制御。
    related: [教師あり学習]
  - term: 過学習
    reading: かがくしゅう
    aliases: [過剰適合, オーバーフィッティング]
    simple: 学習データに合わせすぎて、新しいデータではうまく予測できなくなる状態です。
    definition: モデルが学習データのノイズまで学習し、学習データでの精度は高いが未知データに対する精度（汎化性能）が低くなる現象。
    related: [交差検証]
  - term: 交差検証
    reading: こうさけんしょう
    aliases: [k分割交差検証]
    simple: データを分けて「学習用」と「確認用」を入れ替えながら何度も評価し、モデルの実力を公平に測る方法です。
    definition: データを k 個に分割し、1個を検証用・残りを学習用とする評価を k 回繰り返して平均する手法（k 分割交差検証）。一度だけ分けるのはホールドアウト検証。
    related: [過学習]
  - term: ニューラルネットワーク
    reading: ニューラルネットワーク
    simple: 脳の神経細胞のつながりをまねた計算モデルで、ディープラーニングの基礎です。
    definition: 入力層・隠れ層（中間層）・出力層のノードを重み付きの結合でつなぎ、活性化関数を通して出力を計算するモデル。隠れ層を多くしたものを用いる学習がディープラーニング。
    related: [バックプロパゲーション, 活性化関数, CNN]
  - term: バックプロパゲーション
    reading: バックプロパゲーション
    aliases: [誤差逆伝播法]
    simple: 予測の誤差を出力側から入力側へ逆にたどって伝え、重みを少しずつ直していく学習方法です。
    definition: ニューラルネットワークの出力誤差を出力層から入力層へ逆方向に伝播させ、勾配降下法で各重みを更新する学習アルゴリズム。
    related: [ニューラルネットワーク, 勾配消失問題]
  - term: 勾配消失問題
    reading: こうばいしょうしつもんだい
    simple: 層の深いニューラルネットワークで、入力に近い層ほど学習の手がかり（勾配）が小さくなり、学習が進まなくなる問題です。
    definition: 誤差逆伝播で勾配が層ごとに掛け合わされて指数的に小さくなり、入力層に近い層の重みが更新されなくなる問題。ReLU の採用などで緩和する。
    related: [活性化関数, バックプロパゲーション]
  - term: 活性化関数
    reading: かっせいかかんすう
    simple: ニューラルネットワークの各ノードで、入力の合計をどんな出力に変えるかを決める関数です。
    definition: ノードへの入力の重み付き和を出力値に変換する非線形関数。シグモイド関数、ReLU（0未満は0、それ以外はそのまま）などがある。
    related: [勾配消失問題, ニューラルネットワーク]
  - term: 転移学習
    reading: てんいがくしゅう
    simple: ある課題で学習済みのモデルを、別の関連する課題に流用して効率よく学習することです。
    definition: 事前学習済みモデルの知識を、別の課題のモデル構築に利用する手法。データが少ない課題でも精度を得やすい。
    related: [ファインチューニング]
  - term: ファインチューニング
    reading: ファインチューニング
    simple: 学習済みのモデルを、目的に合わせた少量のデータで追加学習して微調整することです。
    definition: 事前学習済みモデルのパラメータを初期値とし、目的の課題のデータで追加学習してパラメータを調整する手法。
    related: [転移学習, LLM]
  - term: CNN
    reading: シーエヌエヌ
    fullName: Convolutional Neural Network
    japanese: 畳み込みニューラルネットワーク
    words:
      - { en: Convolutional, ja: 畳み込みの }
      - { en: Neural, ja: 神経の }
      - { en: Network, ja: ネットワーク・網 }
    simple: 画像の特徴を取り出すのが得意なニューラルネットワークで、画像認識に広く使われます。
    definition: 畳み込み層で局所的な特徴を抽出し、プーリング層で情報を集約する構造をもつニューラルネットワーク。
    related: [RNN, GAN, ニューラルネットワーク]
  - term: RNN
    reading: アールエヌエヌ
    fullName: Recurrent Neural Network
    japanese: 再帰型ニューラルネットワーク（リカレントニューラルネットワーク）
    words:
      - { en: Recurrent, ja: 繰り返し現れる・回帰する }
      - { en: Neural, ja: 神経の }
      - { en: Network, ja: ネットワーク・網 }
    simple: 文章や音声のような順番のあるデータを扱うのが得意なニューラルネットワークです。
    definition: 前の時刻の内部状態を次の時刻の入力に用いる構造をもち、時系列データを処理するニューラルネットワーク。
    related: [CNN]
  - term: GAN
    reading: ガン
    fullName: Generative Adversarial Network
    japanese: 敵対的生成ネットワーク
    words:
      - { en: Generative, ja: 生成する }
      - { en: Adversarial, ja: 敵対的な }
      - { en: Network, ja: ネットワーク・網 }
    simple: 「偽物を作る役」と「見破る役」を競わせて、本物そっくりの画像などを作れるようにする仕組みです。
    definition: 生成器と識別器の2つのネットワークを敵対的に学習させ、本物に近いデータを生成する生成モデル。
    related: [拡散モデル, CNN]
  - term: 拡散モデル
    reading: かくさんモデル
    simple: 画像にノイズを加える過程を逆にたどって、ノイズから画像を作り出す生成 AI の仕組みです。
    definition: データに段階的にノイズを加える過程と、ノイズを除去する逆過程を学習し、ノイズから新しいデータを生成するモデル。画像生成 AI に広く使われる。
    related: [GAN]
  - term: LLM
    reading: エルエルエム
    fullName: Large Language Model
    japanese: 大規模言語モデル
    words:
      - { en: Large, ja: 大規模な }
      - { en: Language, ja: 言語 }
      - { en: Model, ja: モデル（模型・仕組み） }
    simple: 大量の文章を学習して、人間のような自然な文章を作ったり質問に答えたりする AI です。
    definition: 膨大なテキストで事前学習した、パラメータ数の非常に大きい言語モデル。入力に続く語を予測して文章を生成する。事実と異なる内容（ハルシネーション）を出力することがある。
    related: [プロンプトエンジニアリング, ファインチューニング]
  - term: プロンプトエンジニアリング
    reading: プロンプトエンジニアリング
    simple: 生成 AI から望む答えを引き出すために、指示文（プロンプト）の書き方を工夫することです。
    definition: 生成 AI への入力（指示・文脈・例示・出力形式など）を設計・改善して、目的に合った出力を得る技術。
    related: [LLM]
  - term: コンパイラ
    reading: コンパイラ
    simple: 人が書いたプログラムを、コンピュータが実行できる機械語にまとめて翻訳するソフトウェアです。
    definition: 原始プログラムを目的プログラムに翻訳する言語処理系。字句解析→構文解析→意味解析→最適化→コード生成の順に処理する。
    difference: インタプリタはプログラムを1文ずつ解釈しながら実行する。
    related: [BNF, 逆ポーランド表記法]
  - term: 関数型言語
    reading: かんすうがたげんご
    simple: 関数を組み合わせてプログラムを作る言語で、値を書き換えない書き方を基本とします。
    definition: 関数の適用と合成によって計算を記述するプログラム言語。副作用を避け、参照透過性を重視する（例：Haskell）。論理型言語（例：Prolog）は事実と規則から推論する。
    related: [コンパイラ]
  - term: 半二重通信
    reading: はんにじゅうつうしん
    simple: 双方向に通信できるが、同時には片方向しか送れない通信方式です。トランシーバーが代表例です。
    definition: 一つの伝送路で送信と受信を交互に切り替えて行う通信方式。
    related: [全二重通信]
  - term: 全二重通信
    reading: ぜんにじゅうつうしん
    simple: 送信と受信を同時に行える通信方式です。電話が代表例です。
    definition: 双方向の伝送を同時に行える通信方式。常に一方向のみの方式は単方向通信という。
    related: [半二重通信]
  - term: PCM
    reading: ピーシーエム
    fullName: Pulse Code Modulation
    japanese: パルス符号変調
    words:
      - { en: Pulse, ja: パルス（短い信号） }
      - { en: Code, ja: 符号 }
      - { en: Modulation, ja: 変調 }
    simple: 音声などのアナログ信号を、一定間隔で測って数値（0と1）に変える方式です。
    definition: アナログ信号を標本化・量子化・符号化してデジタル信号に変換する方式。
    example: 8kHz で標本化し8ビットで量子化すると 64kbit/s。
    related: [標本化定理, A/D変換]
  - term: 標本化定理
    reading: ひょうほんかていり
    aliases: [サンプリング定理]
    simple: 元の信号の一番高い周波数の2倍より細かく測れば、元の信号を復元できるという定理です。
    definition: 信号に含まれる最高周波数の2倍を超える周波数で標本化すれば、標本値から元の信号を完全に復元できるという定理。
    example: 可聴域（約20kHz）に対し、音楽 CD は 44.1kHz で標本化。
    related: [PCM, A/D変換]
  - term: A/D変換
    reading: エーディーへんかん
    fullName: Analog to Digital conversion
    japanese: アナログ・デジタル変換
    aliases: [AD変換]
    words:
      - { en: Analog, ja: アナログ（連続的な量） }
      - { en: Digital, ja: デジタル（離散的な数値） }
      - { en: conversion, ja: 変換 }
    simple: 音や温度のように連続的に変わる値を、コンピュータが扱える数値に変えることです。
    definition: アナログ信号を標本化・量子化・符号化してデジタル値に変換すること。逆の変換を D/A 変換という。
    related: [標本化定理, PCM]
  - term: TDM
    reading: ティーディーエム
    fullName: Time Division Multiplexing
    japanese: 時分割多重
    words:
      - { en: Time, ja: 時間 }
      - { en: Division, ja: 分割 }
      - { en: Multiplexing, ja: 多重化 }
    simple: 一本の回線を使う時間を細かく区切り、順番に複数の通信に割り当てる方式です。
    definition: 伝送路の使用時間をタイムスロットに分割し、各通信に順に割り当てて多重化する方式。
    related: [FDM]
  - term: FDM
    reading: エフディーエム
    fullName: Frequency Division Multiplexing
    japanese: 周波数分割多重
    words:
      - { en: Frequency, ja: 周波数 }
      - { en: Division, ja: 分割 }
      - { en: Multiplexing, ja: 多重化 }
    simple: 一本の回線の周波数の幅を分け、それぞれを別の通信に使う方式です。
    definition: 伝送路の周波数帯域を複数の帯域に分割し、各通信に割り当てて多重化する方式。
    related: [TDM]
  - term: パリティチェック
    reading: パリティチェック
    simple: データの1の個数が偶数（または奇数）になるように1ビットを足し、誤りを見つける方法です。
    definition: データに1ビットのパリティビットを付加し、1の個数の偶奇で誤りを検出する方式。1ビットの誤りを検出できるが訂正はできない。
    related: [ハミング符号, CRC]
  - term: CRC
    reading: シーアールシー
    fullName: Cyclic Redundancy Check
    japanese: 巡回冗長検査
    words:
      - { en: Cyclic, ja: 巡回的な }
      - { en: Redundancy, ja: 冗長性（余分な情報） }
      - { en: Check, ja: 検査 }
    simple: データを決まった式で割った余りを付けて送り、受信側で同じ計算をして誤りを見つける方法です。
    definition: データを生成多項式で除算した剰余を検査符号として付加する誤り検出方式。連続した複数ビットの誤り（バースト誤り）の検出に強い。
    related: [パリティチェック, ハミング符号]
  - term: ECC
    reading: イーシーシー
    fullName: Error Correcting Code
    japanese: 誤り訂正符号
    words:
      - { en: Error, ja: 誤り }
      - { en: Correcting, ja: 訂正する }
      - { en: Code, ja: 符号 }
    simple: 誤りを見つけるだけでなく、自動で直すこともできる符号です。サーバのメモリなどに使われます。
    definition: 誤りの検出に加えて訂正を可能にする符号の総称。メモリでは1ビット誤り訂正・2ビット誤り検出（ハミング符号の応用）が多い。
    related: [ハミング符号]
  - term: 調歩同期
    reading: ちょうほどうき
    simple: 1文字ごとに「始め」と「終わり」の印のビットを付けて、送受信のタイミングを合わせる方法です。
    definition: 各文字の前にスタートビット、後にストップビットを付加して文字単位で同期をとる非同期方式。
    related: [全二重通信]
  - term: フィードバック制御
    reading: フィードバックせいぎょ
    simple: 結果を測って目標との差を確かめ、差がなくなるように操作を調整する制御です。
    definition: 制御量を検出して目標値と比較し、偏差を減らすように操作量を修正する閉ループ制御。外乱を予測して事前に修正するのはフィードフォワード制御。
    example: エアコンの温度調節。
    related: [センサー, アクチュエーター]
  - term: センサー
    reading: センサー
    simple: 温度・光・動きなどの物理的な量を測って、電気信号に変える部品です。
    definition: 物理量や化学量を検出し、電気信号に変換する素子・装置。温度センサー、加速度センサー、ジャイロセンサー（角速度）、超音波センサーなどがある。
    related: [アクチュエーター, サーミスタ]
  - term: サーミスタ
    reading: サーミスタ
    simple: 温度によって電気の通しやすさ（抵抗）が大きく変わる部品で、温度計に使われます。
    definition: 温度変化に対して電気抵抗が大きく変化する半導体素子。温度センサーに用いる。
    related: [センサー]
  - term: アクチュエーター
    reading: アクチュエーター
    simple: 電気信号を受けて、モーターの回転などの「動き」に変える装置です。
    definition: 電気・油圧・空気圧などのエネルギーを機械的な動きに変換する駆動装置。モーター、油圧シリンダ、空気圧シリンダなど。
    related: [センサー, フィードバック制御]
  - term: スタック
    reading: スタック
    simple: 最後に入れたものを最初に取り出す（後入れ先出し）データの入れ物です。
    definition: データの追加（プッシュ）と取出し（ポップ）を同じ一端で行う LIFO（Last In First Out）のデータ構造。関数呼出しの管理や逆ポーランド記法の評価に使われる。
    difference: キューは先に入れたものを先に取り出す FIFO。
    related: [キュー, 再帰]
  - term: 再現率
    reading: さいげんりつ
    aliases: [Recall, 真陽性率]
    simple: 本当に陽性のもののうち、どれだけを陽性と見抜けたかの割合です。見逃しの少なさを表します。
    definition: 真陽性数 ÷（真陽性数＋偽陰性数）。
    related: [適合率]
  - term: 適合率
    reading: てきごうりつ
    aliases: [Precision]
    simple: 陽性と判定したもののうち、本当に陽性だったものの割合です。誤判定の少なさを表します。
    definition: 真陽性数 ÷（真陽性数＋偽陽性数）。再現率と適合率はトレードオフの関係になりやすい。
    related: [再現率]
  - term: 基数
    reading: きすう
    simple: 位取り記数法で、一桁上がるごとに重みが何倍になるかを表す数です（2進数なら2、10進数なら10）。
    definition: 位取り記数法において各桁の重みの底となる数。基数 r の n 桁目（小数点の左から0桁目と数える）の重みは r^n となる。2進数の基数は2、16進数の基数は16。
    related: [基数変換]
  - term: 順列
    reading: じゅんれつ
    simple: 異なるものからいくつかを選び、順番を付けて並べる方法の数です。
    definition: 異なる n 個から r 個を取り出して一列に並べる並べ方。総数は nPr = n!/(n−r)! で、並ぶ順序が異なれば別のものとして数える。
    related: [組合せ, 順列と組合せ]
  - term: 組合せ
    reading: くみあわせ
    simple: 異なるものからいくつかを、順番を考えずに選ぶ方法の数です。
    definition: 異なる n 個から順序を区別せずに r 個を選ぶ選び方。総数は nCr = n!/(r!(n−r)!) = nPr/r!。
    related: [順列, 順列と組合せ]
  - term: 中央値
    reading: ちゅうおうち
    aliases: [メジアン]
    simple: データを小さい順に並べたとき、ちょうど真ん中にくる値です。
    definition: データを大きさの順に並べたときに中央に位置する値。データ数が偶数のときは中央の2つの値の平均とする。外れ値の影響を受けにくい代表値。
    related: [代表値, 最頻値]
  - term: 最頻値
    reading: さいひんち
    aliases: [モード]
    simple: データの中で最も多く現れる値です。
    definition: データの中で出現度数が最も大きい値。度数分布表では度数が最大の階級の階級値をとる。代表値の一つ。
    related: [代表値, 中央値]
  - term: 相関と因果
    reading: そうかんといんが
    simple: 二つの数値が一緒に変化する（相関）ことと、片方がもう片方の原因になっている（因果）ことは別だという考え方です。
    definition: 相関関係は二変数が連動して変化する関係、因果関係は一方が他方の原因となる関係であり、相関があっても因果があるとは限らない。第三の変数（交絡因子）による擬似相関や逆の因果に注意する。
    related: [擬似相関]
  - term: 名義尺度
    reading: めいぎしゃくど
    simple: 区別のためだけに付けた値で、大小や順番に意味がない尺度です（例：性別、郵便番号）。
    definition: 分類・識別のためにのみ数値や記号を割り当てる尺度。等しいかどうかだけが意味を持ち、代表値として最頻値を使う。
    related: [尺度水準, 順序尺度]
  - term: 順序尺度
    reading: じゅんじょしゃくど
    simple: 順番には意味があるが、値の差には意味がない尺度です（例：順位、満足度の5段階評価）。
    definition: 大小・順序関係に意味があるが、値の間隔は等しいとは限らない尺度。中央値や最頻値は使えるが、平均値は本来適さない。
    related: [尺度水準, 名義尺度, 間隔尺度]
  - term: 間隔尺度
    reading: かんかくしゃくど
    simple: 値の差に意味があるが、0が「何もない」ことを表さない尺度です（例：摂氏温度、西暦）。
    definition: 値の間隔（差）が等しく意味を持つが、原点0が任意に定められている尺度。和差は意味を持つが比（何倍か）は意味を持たない。
    related: [尺度水準, 順序尺度, 比例尺度]
  - term: 比例尺度
    reading: ひれいしゃくど
    simple: "0が「何もない」ことを表し、何倍かを比べられる尺度です（例：長さ、重さ、金額）。"
    definition: 絶対的な原点0をもち、差だけでなく比にも意味がある尺度。比率尺度ともいう。四則演算すべてが意味を持つ。
    related: [尺度水準, 間隔尺度]
  - term: 第1種の誤り
    reading: だいいっしゅのあやまり
    simple: 本当は正しい帰無仮説を、間違って捨ててしまう誤りです（あわてんぼうの誤り）。
    definition: 帰無仮説が真であるにもかかわらず棄却してしまう誤り。その確率の上限が有意水準 α である。
    related: [仮説検定, 第2種の誤り, 有意水準]
  - term: 第2種の誤り
    reading: だいにしゅのあやまり
    simple: 本当は間違っている帰無仮説を、捨てずに受け入れてしまう誤りです（ぼんやりの誤り）。
    definition: 帰無仮説が偽であるにもかかわらず棄却しない誤り。その確率を β とすると、1−β を検出力という。
    related: [仮説検定, 第1種の誤り]
  - term: 有意水準
    reading: ゆういすいじゅん
    simple: 「偶然とは考えにくい」と判断する基準の確率で、5%や1%がよく使われます。
    definition: 仮説検定で帰無仮説を棄却する基準となる確率 α。p値が有意水準以下なら帰無仮説を棄却する。第1種の誤りを犯す確率の上限に当たる。
    related: [仮説検定, p値, 第1種の誤り]
  - term: p値
    reading: ぴーち
    simple: 帰無仮説が正しいとしたとき、観測された結果以上に極端な結果が偶然起こる確率です。
    definition: 帰無仮説のもとで、観測された検定統計量と同じかそれより極端な値が得られる確率。p値が有意水準以下であれば帰無仮説を棄却する。
    related: [仮説検定, 有意水準]
  - term: 説明変数
    reading: せつめいへんすう
    simple: 回帰分析で、結果を説明するために使う原因側の変数です。
    definition: 回帰分析などで目的変数の値を説明・予測するために用いる変数。独立変数ともいう。
    related: [回帰分析, 目的変数]
  - term: 目的変数
    reading: もくてきへんすう
    simple: 回帰分析で、予測したい結果側の変数です。
    definition: 回帰分析などで説明変数によって説明・予測される対象の変数。従属変数・被説明変数ともいう。
    related: [回帰分析, 説明変数]
  - term: ロジスティック回帰分析
    reading: ろじすてぃっくかいきぶんせき
    simple: 「買う／買わない」のような二択の結果が起こる確率を予測する回帰分析です。
    definition: 目的変数が2値（発生する・しない）の場合に、ロジスティック関数を用いて事象の発生確率を説明変数から推定する回帰分析の手法。
    related: [回帰分析, 重回帰分析]
  - term: 単回帰分析
    reading: たんかいきぶんせき
    simple: 一つの説明変数で目的変数を予測する回帰分析です。
    definition: 一つの説明変数 x と目的変数 y の関係を回帰直線 y = a + bx で表し、最小二乗法などで係数を推定する回帰分析。
    related: [回帰分析, 重回帰分析]
  - term: 重回帰分析
    reading: じゅうかいきぶんせき
    simple: 二つ以上の説明変数で目的変数を予測する回帰分析です。
    definition: 複数の説明変数を用いて目的変数を y = a + b1x1 + b2x2 + … の形の式で表す回帰分析。説明変数どうしの相関（多重共線性）に注意する。
    related: [回帰分析, 単回帰分析]
  - term: 逆行列
    reading: ぎゃくぎょうれつ
    simple: 元の行列と掛けると単位行列になる行列です。
    definition: 正方行列 A に対して AB = BA = E（単位行列）を満たす行列 B を A の逆行列といい A^−1 と書く。行列式が0でない正方行列だけが逆行列をもつ。
    related: [行列, 単位行列]
  - term: 単位行列
    reading: たんいぎょうれつ
    simple: 対角線上が1、それ以外が0の正方行列で、掛けても相手の行列を変えない行列です。
    definition: 対角成分がすべて1、それ以外の成分がすべて0である正方行列 E。任意の同じ次数の正方行列 A に対して AE = EA = A となる。
    related: [行列, 逆行列]
  - term: 転置行列
    reading: てんちぎょうれつ
    simple: 行列の行と列を入れ替えた行列です。
    definition: "m 行 n 列の行列 A の (i, j) 成分を (j, i) 成分とした n 行 m 列の行列 A^T。"
    related: [行列]
  - term: 丸め誤差
    reading: まるめごさ
    simple: 決められた桁数に収めるために、四捨五入や切捨てをしたことで生じる誤差です。
    definition: 数値を有限の桁数で表現するため、指定桁未満を四捨五入・切捨て・切上げすることによって生じる誤差。
    related: [誤差, 打切り誤差]
  - term: 打切り誤差
    reading: うちきりごさ
    simple: 無限に続く計算を途中で打ち切ったために生じる誤差です。
    definition: 無限級数の計算や反復計算などを有限の項・回数で打ち切ることによって生じる誤差。
    related: [誤差, 丸め誤差]
  - term: 絶対誤差
    reading: ぜったいごさ
    simple: 真の値と近似値の差の大きさそのものです。
    definition: 近似値と真の値との差の絶対値 |近似値 − 真の値|。
    related: [誤差, 相対誤差]
  - term: 相対誤差
    reading: そうたいごさ
    simple: 誤差の大きさが真の値に対してどれくらいの割合かを表したものです。
    definition: 絶対誤差を真の値の絶対値で割った値 |近似値 − 真の値| / |真の値|。大きさの異なる値の精度を比較するのに用いる。
    related: [誤差, 絶対誤差]
  - term: 無向グラフ
    reading: むこうぐらふ
    simple: 辺に向きがないグラフです。
    definition: 辺（エッジ）が方向をもたず、頂点 u と v を結ぶ辺が u→v、v→u の両方向の関係を表すグラフ。
    related: [グラフ理論, 有向グラフ]
  - term: 有向グラフ
    reading: ゆうこうぐらふ
    simple: 辺に矢印の向きがあるグラフです。
    definition: 各辺が始点から終点への向きをもつグラフ。状態遷移図やアローダイアグラムなどの表現に用いられる。
    related: [グラフ理論, 無向グラフ]
  - term: M/M/1
    reading: えむえむわん
    simple: 客がランダムに到着し、窓口が一つの待ち行列モデルです。
    definition: 到着がポアソン分布（到着間隔が指数分布）、サービス時間が指数分布、窓口数が1の待ち行列モデル。利用率 ρ のとき平均待ち時間は ρ/(1−ρ) × 平均サービス時間となる。
    related: [待ち行列理論]
  - term: 平均情報量
    reading: へいきんじょうほうりょう
    aliases: [エントロピー]
    simple: ある情報源から出てくる情報の量を平均したもので、予測しにくいほど大きくなります。
    definition: 情報源の各事象の情報量 −log2 p をその発生確率 p で重み付けして平均した値 H = −Σ p log2 p。エントロピーともいい、すべての事象が等確率のとき最大となる。
    related: [情報量]
  - term: 状態遷移
    reading: じょうたいせんい
    simple: 入力や出来事によって、ある状態から別の状態に移ることです。
    definition: システムが入力やイベントに応じて現在の状態から次の状態へ移ること。状態遷移図や状態遷移表で表現する。
    related: [有限オートマトン]
  - term: AI
    reading: えーあい
    fullName: Artificial Intelligence
    japanese: 人工知能
    words:
      - { en: Artificial, ja: 人工の }
      - { en: Intelligence, ja: 知能 }
    simple: 人間の知的な働き（学習・推論・判断など）をコンピュータで実現する技術です。
    definition: 学習、推論、認識、判断など人間の知的な振る舞いをコンピュータで実現する技術や研究分野。機械学習はAIを実現する手法の一つである。
    related: [機械学習]
  - term: 分類
    reading: ぶんるい
    simple: データがどのグループ（クラス）に属するかを予測する機械学習の課題です。
    definition: 教師あり学習の課題の一つで、入力データをあらかじめ定められたカテゴリ（クラス）のいずれかに割り当てるもの。迷惑メール判定などが例。
    related: [教師あり学習, 回帰]
  - term: 回帰
    reading: かいき
    simple: 売上や気温のような連続した数値を予測する機械学習の課題です。
    definition: 教師あり学習の課題の一つで、入力から連続値の出力を予測するもの。統計の回帰分析もこの考え方に基づく。
    related: [教師あり学習, 分類, 回帰分析]
  - term: クラスタリング
    reading: くらすたりんぐ
    simple: 正解ラベルなしで、似ているデータどうしをグループに分けることです。
    definition: 正解ラベルを与えずに、データ間の類似度や距離に基づいてデータを複数のクラスタ（グループ）に分割する手法。k-means法などがある。
    related: [教師なし学習, 分類]
  - term: 次元削減
    reading: じげんさくげん
    simple: たくさんの項目をもつデータを、情報をなるべく失わずに少ない項目で表すことです。
    definition: 多数の特徴量（次元）をもつデータを、もとの情報をできるだけ保ったまま低次元のデータに変換する手法。主成分分析などがある。
    related: [教師なし学習]
  - term: 汎化性能
    reading: はんかせいのう
    simple: 学習に使っていない新しいデータに対しても、正しく予測できる能力です。
    definition: 学習済みモデルが訓練データ以外の未知のデータに対して適切な予測を行える能力。過学習が起こると汎化性能は低下する。
    related: [過学習, 交差検証]
  - term: ホールドアウト検証
    reading: ほーるどあうとけんしょう
    simple: データを学習用とテスト用に一度だけ分けて、モデルの性能を確かめる方法です。
    definition: データを訓練用と検証（テスト）用に一回だけ分割し、訓練用で学習したモデルを検証用で評価する方法。分割を変えて繰り返す交差検証に比べて簡便だが、評価が分割の仕方に左右されやすい。
    related: [交差検証]
  - term: 多層パーセプトロン
    reading: たそうぱーせぷとろん
    simple: 入力層と出力層の間に隠れ層をもつ、層を重ねたニューラルネットワークです。
    definition: 入力層・1層以上の隠れ層・出力層から成る順伝播型のニューラルネットワーク。非線形の活性化関数を用いることで、単純パーセプトロンでは扱えない線形分離不可能な問題も扱える。
    related: [ニューラルネットワーク, 単純パーセプトロン]
  - term: ReLU
    reading: れる
    fullName: Rectified Linear Unit
    japanese: 正規化線形ユニット
    words:
      - { en: Rectified, ja: 整流された }
      - { en: Linear, ja: 線形の }
      - { en: Unit, ja: 単位・素子 }
    simple: 入力が0以下なら0、正ならそのまま出す活性化関数です。
    definition: "f(x) = max(0, x) で表される活性化関数。計算が簡単で、深いネットワークでも勾配消失が起こりにくい。"
    related: [活性化関数, シグモイド関数]
  - term: シグモイド関数
    reading: しぐもいどかんすう
    simple: どんな入力も0から1の間のなめらかな値に変換する関数です。
    definition: f(x) = 1/(1 + e^−x) で表されるS字型の関数。出力が0〜1になるため確率の表現などに使われるが、入力の絶対値が大きいと勾配が小さくなる。
    related: [活性化関数, ReLU]
  - term: 事前学習
    reading: じぜんがくしゅう
    simple: 大量のデータで、特定の用途に限らない汎用的な学習を先に済ませておくことです。
    definition: 大規模なデータを用いてモデルに汎用的な特徴や知識をあらかじめ学習させること。事前学習済みモデルを個別のタスクに合わせて追加学習するのがファインチューニングである。
    related: [ファインチューニング]
  - term: 生成モデル
    reading: せいせいもでる
    simple: 学習したデータに似た、新しいデータを作り出せる機械学習モデルです。
    definition: 学習データの確率分布を学習し、その分布に従う新しいデータを生成できるモデル。拡散モデル、GAN、VAE、大規模言語モデルなどがある。
    related: [拡散モデル, 生成AI]
  - term: 生成AI
    reading: せいせいえーあい
    simple: 文章、画像、音声などの新しいコンテンツを作り出すAIです。
    definition: 学習したデータをもとに、テキスト、画像、音声、プログラムなどのコンテンツを新たに生成するAI。大規模言語モデルや拡散モデルなどの生成モデルを用いる。
    related: [生成モデル, 拡散モデル]
  - term: 字句解析
    reading: じくかいせき
    simple: ソースコードの文字の並びを、単語（トークン）に区切る処理です。
    definition: コンパイルの最初の段階で、原始プログラムの文字列を予約語、識別子、定数、演算子などの字句（トークン）に分解する処理。
    related: [コンパイラ, 構文解析]
  - term: 構文解析
    reading: こうぶんかいせき
    simple: 字句の並びがプログラム言語の文法に合っているかを調べ、構造を組み立てる処理です。
    definition: 字句解析で得たトークン列を文法規則に従って解析し、構文木などの構造を作るとともに文法上の誤りを検出するコンパイルの段階。
    related: [コンパイラ, 字句解析, 意味解析]
  - term: 意味解析
    reading: いみかいせき
    simple: 文法は正しいプログラムについて、型の整合性など意味の上で正しいかを調べる処理です。
    definition: 構文解析の結果に対して、変数の宣言の有無や型の整合性など意味上の正しさを検査するコンパイルの段階。
    related: [コンパイラ, 構文解析]
  - term: 最適化
    reading: さいてきか
    simple: プログラムの意味を変えずに、より速く小さく動くように作り変える処理です。
    definition: コンパイラにおいて、プログラムの動作を変えずに実行速度の向上やコードサイズの削減を図るよう中間コードや目的コードを変換する処理。定数畳込み、ループ不変式の移動などがある。
    related: [コンパイラ, コード生成]
  - term: コード生成
    reading: こーどせいせい
    simple: 解析した結果から、コンピュータが実行できる機械語などを作り出す処理です。
    definition: コンパイルの最終段階で、中間コードなどから目的プログラム（機械語やアセンブリ言語のコード）を生成する処理。
    related: [コンパイラ, 最適化]
  - term: 論理型言語
    reading: ろんりがたげんご
    simple: 事実と規則を書いておき、そこから答えを推論させるプログラム言語です（例：Prolog）。
    definition: 述語論理に基づいて事実と推論規則を記述し、処理系が推論によって問合せに答えるプログラム言語。代表例は Prolog。
    related: [関数型言語]
  - term: 単方向通信
    reading: たんほうこうつうしん
    simple: データを一方向にしか送れない通信方式です（例：テレビ放送）。
    definition: 送信側と受信側が固定され、常に一方向にだけデータを伝送する通信方式。単信方式ともいう。
    related: [全二重通信]
  - term: 標本化
    reading: ひょうほんか
    aliases: [サンプリング]
    simple: 連続したアナログ信号の値を、一定の時間間隔で取り出すことです。
    definition: A/D変換の最初の段階で、時間的に連続したアナログ信号から一定間隔ごとに値（標本）を取り出す処理。その後、量子化・符号化を行う。
    related: [標本化定理, A/D変換]
  - term: D/A変換
    reading: でぃーえーへんかん
    aliases: [DA変換]
    simple: デジタルデータをアナログ信号に戻すことです。
    definition: ディジタル値をそれに対応する電圧などのアナログ信号に変換すること。スピーカーへの音声出力などで行われる。
    related: [A/D変換]
  - term: 偶数パリティ
    reading: ぐうすうぱりてぃ
    simple: "1のビットの個数が偶数になるようにパリティビットを付ける方式です。"
    definition: データビットとパリティビットを合わせた中の1の個数が偶数になるようにパリティビットの値を定める方式。
    related: [パリティチェック, 奇数パリティ, パリティビット]
  - term: 奇数パリティ
    reading: きすうぱりてぃ
    simple: "1のビットの個数が奇数になるようにパリティビットを付ける方式です。"
    definition: データビットとパリティビットを合わせた中の1の個数が奇数になるようにパリティビットの値を定める方式。
    related: [パリティチェック, 偶数パリティ, パリティビット]
  - term: パリティビット
    reading: ぱりてぃびっと
    simple: 誤りを見つけるために、データに付け加える1ビットです。
    definition: データ中の1の個数が偶数または奇数になるように付加する検査用の1ビット。1ビットの誤りは検出できるが、訂正はできず、偶数個のビット誤りは検出できない。
    related: [パリティチェック]
  - term: スタートビット
    reading: すたーとびっと
    simple: 調歩同期で、文字の送り始めを知らせるために先頭に付けるビットです。
    definition: 調歩同期方式で各文字（キャラクタ）の前に付加し、受信側にデータの開始を知らせるビット。
    related: [調歩同期, ストップビット]
  - term: ストップビット
    reading: すとっぷびっと
    simple: 調歩同期で、文字の送り終わりを知らせるために末尾に付けるビットです。
    definition: 調歩同期方式で各文字（キャラクタ）の後に付加し、データの終了を示すビット。
    related: [調歩同期, スタートビット]
  - term: フィードフォワード制御
    reading: ふぃーどふぉわーどせいぎょ
    simple: 外からの乱れを先に測って、結果に影響が出る前に操作を調整する制御です。
    definition: 外乱などの影響を事前に検出・予測し、制御結果に影響が現れる前に操作量を調整する制御方式。結果を測定して修正するフィードバック制御と組み合わせて使うことが多い。
    related: [フィードバック制御]
  - term: オープンループ制御
    reading: おーぷんるーぷせいぎょ
    simple: 結果を測って戻すことをせず、決めたとおりに操作だけを行う制御です。
    definition: 制御結果を測定して入力側へ戻す経路（フィードバック）をもたない制御方式。構成は単純だが、外乱による誤差は修正できない。
    related: [フィードバック制御, シーケンス制御]
  - term: シーケンス制御
    reading: しーけんすせいぎょ
    simple: あらかじめ決めた順序や条件に従って、各段階の動作を順番に進めていく制御です（例：全自動洗濯機）。
    definition: あらかじめ定められた順序や条件に従って制御の各段階を逐次進めていく制御方式。洗濯機、エレベーター、自動販売機などで用いられる。
    related: [フィードバック制御]
  - term: 加速度センサー
    reading: かそくどせんさー
    simple: 動きや傾き、振動による加速度を測るセンサーです。
    definition: 物体にかかる加速度（重力加速度を含む）を検出するセンサー。スマートフォンの画面の向きの判定、歩数計、落下検知などに使われる。
    related: [センサー, ジャイロセンサー]
  - term: ジャイロセンサー
    reading: じゃいろせんさー
    simple: 物体がどれくらいの速さで回転しているかを測るセンサーです。
    definition: 角速度（単位時間当たりの回転角度）を検出するセンサー。手ぶれ補正、ドローンの姿勢制御、カーナビゲーションなどに使われる。
    related: [センサー, 加速度センサー]
  - term: 赤外線センサー
    reading: せきがいせんせんさー
    simple: 赤外線を使って、人や物の存在や温度を検知するセンサーです。
    definition: 物体から放射される赤外線や、投光した赤外線の反射を検出するセンサー。人感センサー、非接触温度計、リモコンの受光部などに使われる。
    related: [センサー]
  - term: プッシュ
    reading: ぷっしゅ
    simple: スタックの一番上にデータを積むことです。
    definition: スタックの最上部（トップ）にデータを追加する操作。
    related: [スタック, ポップ]
  - term: ポップ
    reading: ぽっぷ
    simple: スタックの一番上からデータを取り出すことです。
    definition: スタックの最上部（トップ）からデータを取り出して削除する操作。最後にプッシュされたデータが最初に取り出される。
    related: [スタック, プッシュ]
  - term: ROC曲線
    reading: あーるおーしーきょくせん
    simple: 判定のしきい値を変えたときの、見逃しと誤検知のバランスを表すグラフです。
    definition: "2値分類で判定しきい値を変化させたときの、偽陽性率を横軸、真陽性率（再現率）を縦軸にとって描いた曲線。曲線下の面積（AUC）が1に近いほど分類性能が高い。"
    related: [再現率, 適合率]
  - term: LIFO
    reading: りふぉ
    fullName: Last In First Out
    japanese: 後入れ先出し
    words:
      - { en: Last In, ja: 最後に入ったものが }
      - { en: First Out, ja: 最初に出る }
    simple: 後から入れたデータを先に取り出す方式です。スタックがこの方式です。
    definition: 最後に格納されたデータが最初に取り出される方式。スタック（積み重ね）の動作原理で、キューの FIFO と対比される。
    related: [スタック, FIFO]
