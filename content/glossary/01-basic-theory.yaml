category: 基礎理論
terms:
  - term: 基数変換
    reading: きすうへんかん
    aliases: [基数]
    simple: 2進数・10進数・16進数など、数の表し方（何進数か）を別の表し方に変えることです。
    definition: n 進数で表された数を、値を変えずに別の基数の表現に変換すること。整数部は基数で割った余りを、小数部は基数を掛けた整数部を順に取り出して求める。
    example: 10進数の 13 を2で割り続けると余りが 1,0,1,1 となり、下から読んで 1101₂。
    related: [16進数, 2の補数]
  - term: 16進数
    reading: じゅうろくしんすう
    simple: 0〜9 と A〜F の16種類の記号で数を表す方法です。2進数4桁を1桁で書けるので、コンピュータのデータを短く表すのに便利です。
    definition: 基数を16とする記数法。A〜F はそれぞれ10進数の10〜15を表す。各桁の重みは 16 のべき乗。
    example: 2進数 1111 1111 は16進数で FF、10進数で 255。色の指定 #FF0000（赤）にも使われる。
    related: [基数変換]
  - term: 2の補数
    reading: にのほすう
    simple: コンピュータで負の数を表す代表的な方法です。全ビットを反転して1を足すと、符号が逆の数になります。
    definition: n ビットの数 x に対し、2ⁿ−x で負数を表す表現方法。最上位ビットが符号を兼ね、n ビットで −2ⁿ⁻¹〜2ⁿ⁻¹−1 を表せる。減算を加算回路で行える利点がある。
    example: 8ビットで ＋5＝00000101、−5＝11111011。
    difference: 1の補数はビット反転だけで、0 の表現が2通り（＋0, −0）ある。
    related: [基数変換, 算術シフト]
  - term: 浮動小数点数
    reading: ふどうしょうすうてんすう
    simple: 「仮数×基数の指数乗」の形で、とても大きな数や小さな数を表す方法です。
    definition: 数値を符号部・指数部・仮数部で表現する方式。IEEE 754 の単精度は32ビット（指数8・仮数23）、倍精度は64ビット（指数11・仮数52）。
    example: 0.000123 を 1.23×10⁻⁴ と表すのと同じ考え方を2進数で行う。
    difference: 固定小数点数は小数点の位置を固定するため、表せる範囲は狭いが計算は単純。
    related: [正規化（浮動小数点数）, 桁落ち, 情報落ち]
  - term: 正規化（浮動小数点数）
    reading: せいきか
    simple: 浮動小数点数の仮数部の先頭に 0 が来ないように調整して、精度（有効桁数）をできるだけ高くすることです。
    definition: 仮数部の最上位桁が 0 以外になるように仮数部をシフトし、指数部を調整する操作。有効桁数を最大に保つ。
    difference: データベース設計の「正規化」とは全く別の概念。
    related: [浮動小数点数]
  - term: パック10進数
    reading: ぱっくじゅっしんすう
    aliases: [パック10進]
    simple: 10進数の1桁を4ビットで表し、最後の4ビットに符号を入れる数の表し方です。
    definition: 10進数の各桁を4ビットの2進化10進コードで表し、最下位の4ビットに符号を置く形式。桁数 n の数に (n＋1)×4 ビットを使う（端数はバイト単位に切り上げ）。
    example: −123 → 0001 0010 0011 1101（2バイト）。
    difference: ゾーン10進数は1桁に1バイトを使う。
    related: [BCD]
  - term: BCD
    reading: ビーシーディー
    fullName: Binary Coded Decimal
    japanese: 2進化10進数
    words:
      - { en: Binary, ja: 2進の }
      - { en: Coded, ja: 符号化された }
      - { en: Decimal, ja: 10進数 }
    simple: 10進数の1桁ずつを4ビットの2進数で表す方法です。
    definition: 10進数の各桁（0〜9）をそれぞれ4ビットの2進数で表現する符号化方式。10進数を誤差なく扱える。
    example: 10進数 59 → 0101 1001。
    related: [パック10進数]
  - term: 算術シフト
    reading: さんじゅつシフト
    simple: 符号を保ったまま、数値を2倍や2分の1にするビットのずらし方です。
    definition: 符号ビットを除いてビット列をシフトする操作。右シフトでは空いたビットに符号ビットと同じ値を入れる。左へ n ビットで 2ⁿ 倍、右へ n ビットで 2ⁿ 分の1になる。
    difference: 論理シフトは符号を考慮せず、空いたビットに常に 0 を入れる。
    related: [論理シフト, 2の補数]
  - term: 論理シフト
    reading: ろんりシフト
    simple: ビット列を単なる0と1の並びとして左右にずらし、空いた所に0を入れる操作です。
    definition: 符号を考慮せず、全ビットを左右にシフトし、空いたビット位置に 0 を入れる操作。符号なし整数では左へ n ビットで 2ⁿ 倍、右へ n ビットで 2ⁿ で割った商になる。
    related: [算術シフト]
  - term: 桁落ち
    reading: けたおち
    simple: ほぼ同じ大きさの数同士を引き算したとき、有効な桁が大きく減ってしまう誤差です。
    definition: 値がほぼ等しい2数の減算で上位の桁が打ち消し合い、有効数字の桁数が減少する現象。
    example: 1.234−1.233＝0.001（有効数字4桁→1桁）。
    difference: 情報落ちは、絶対値の大きく異なる数の加減算で小さい方が失われる現象。
    related: [情報落ち, 誤差]
  - term: 情報落ち
    reading: じょうほうおち
    simple: 大きな数に非常に小さな数を足したとき、小さな数が結果に反映されずに失われる誤差です。
    definition: 絶対値の差が大きい2数の加減算で、小さい方の数の下位桁が有効桁数からはみ出して無視される現象。小さい数から順に加算すると軽減できる。
    related: [桁落ち, 誤差]
  - term: ベン図
    reading: ベンず
    simple: 集合を円で表し、重なり具合で集合どうしの関係を図にしたものです。
    definition: 全体集合を長方形、各集合を円で表し、和集合・積集合・補集合などの関係を視覚的に示す図。
    example: A∪B は2つの円の全体、A∩B は円の重なり部分。
    related: [命題論理]
  - term: 命題論理
    reading: めいだいろんり
    simple: 「真か偽かが決まる文（命題）」を、かつ・または・ならば などで組み合わせて考える論理です。
    definition: 真偽が定まる命題を論理演算子（否定・論理積・論理和・含意など）で結合し、その真偽を扱う論理体系。「p ならば q」は p が真で q が偽のときだけ偽。
    related: [述語論理, ブール代数]
  - term: 排他的論理和
    reading: はいたてきろんりわ
    aliases: [XOR, EOR]
    simple: 2つの入力が「異なる」ときに1、「同じ」ときに0になる論理演算です。
    definition: 入力 A, B に対し A⊕B＝A・¬B＋¬A・B となる論理演算。同じ値と2回演算すると元に戻る性質がある。
    example: ビットの反転、パリティの計算、簡易な暗号に使われる。
    related: [論理積, ブール代数]
  - term: ド・モルガンの法則
    reading: ド・モルガンのほうそく
    simple: 「AかつB」の否定は「AでないかBでない」、「AまたはB」の否定は「AでなくBでもない」という法則です。
    definition: ¬(A∧B)＝¬A∨¬B、¬(A∨B)＝¬A∧¬B が成り立つという論理演算・集合演算の法則。
    related: [ブール代数, 命題論理]
  - term: ブール代数
    reading: ブールだいすう
    simple: 0と1（偽と真）だけを扱う計算のルールで、論理回路や条件式を簡単にするのに使います。
    definition: 値が 0 と 1 の2値をとり、論理和・論理積・否定の演算と、分配則・吸収則・ド・モルガンの法則などの法則をもつ代数系。
    example: A・B＋A・¬B＝A・(B＋¬B)＝A。
    related: [ド・モルガンの法則, 論理積]
  - term: 論理積
    reading: ろんりせき
    aliases: [AND]
    simple: 2つの入力が両方とも1のときだけ1になる論理演算（AND）です。
    definition: A・B（A∧B）で表され、A と B がともに真のときだけ真となる論理演算。ビット演算ではマスクとして特定のビットを取り出すのに使う。
    related: [ビットマスク, 排他的論理和]
  - term: ビットマスク
    reading: ビットマスク
    aliases: [マスク]
    simple: ビット列のうち必要な部分だけを取り出したり、変更したりするために使う型紙のようなビット列です。
    definition: 特定のビットを取り出す・セットする・反転するために、論理積・論理和・排他的論理和の相手として用いるビットパターン。
    example: x AND 00001111 で下位4ビットを取り出す。
    related: [論理積, 排他的論理和]
  - term: 確率
    reading: かくりつ
    simple: ある出来事が起こる「確からしさ」を 0 から 1 の数で表したものです。
    definition: 試行の結果として事象が起こる度合い。同様に確からしい場合、（事象が起こる場合の数）÷（起こりうる全ての場合の数）で求める。
    related: [条件付き確率, 期待値]
  - term: 条件付き確率
    reading: じょうけんつきかくりつ
    simple: 「Bが起きた」と分かっているときに、Aが起きている確率です。
    definition: 事象 B が起きたという条件の下で事象 A が起こる確率 P(A｜B)＝P(A∩B)÷P(B)。
    related: [ベイズの定理, 確率]
  - term: ベイズの定理
    reading: ベイズのていり
    simple: 結果が分かったときに、その原因が何だったかの確率を計算する方法です。
    definition: P(A｜B)＝P(B｜A)P(A)÷P(B) で表される定理。事前確率と観測結果から事後確率を求める。
    example: 不良品が見つかったとき、それがどの工場で作られたかの確率を求める。迷惑メールフィルタにも使われる。
    related: [条件付き確率]
  - term: 順列と組合せ
    reading: じゅんれつとくみあわせ
    aliases: [順列, 組合せ]
    simple: 並べ方（順序を区別）の数が順列、選び方（順序を区別しない）の数が組合せです。
    definition: n 個から r 個を選んで並べる順列は ₙPᵣ＝n!/(n−r)!、選ぶだけの組合せは ₙCᵣ＝n!/(r!(n−r)!)。
    example: ₅P₃＝60、₅C₃＝10。
    related: [確率]
  - term: 正規分布
    reading: せいきぶんぷ
    simple: 平均を中心に左右対称な釣鐘型の分布で、身長や測定誤差など多くの現象がこれに近い形になります。
    definition: 平均 μ・標準偏差 σ で決まる連続確率分布。μ±σ に約68％、μ±2σ に約95％、μ±3σ に約99.7％が含まれる。
    related: [標準偏差, 二項分布]
  - term: 二項分布
    reading: にこうぶんぷ
    simple: 「成功か失敗か」の試行を何回も繰り返したとき、成功が何回起こるかの分布です。
    definition: 成功確率 p の独立な試行を n 回行ったときの成功回数の分布。期待値 np、分散 np(1−p)。1回の試行の分布はベルヌーイ分布。
    related: [期待値, 正規分布]
  - term: 期待値
    reading: きたいち
    simple: 何度も繰り返したときに平均してどのくらいの値になるかを表す値です。
    definition: 確率変数がとる各値とその確率の積の総和。長期的な平均値を表す。
    example: さいころの目の期待値は (1＋2＋…＋6)÷6＝3.5。
    related: [確率, 二項分布]
  - term: 代表値
    reading: だいひょうち
    aliases: [中央値, 最頻値, メジアン, モード]
    simple: データ全体の特徴を一つの値で表したもので、平均値・中央値・最頻値があります。
    definition: 平均値（総和÷個数）、中央値（並べたときの中央の値。偶数個なら中央2つの平均）、最頻値（最も多く現れる値）の総称。中央値は外れ値の影響を受けにくい。
    related: [分散, 標準偏差]
  - term: 分散
    reading: ぶんさん
    simple: データが平均からどのくらい散らばっているかを表す値です。
    definition: 各データと平均値の差の2乗の平均（母分散）。標本から母集団を推定する場合は n−1 で割る（不偏分散）。
    related: [標準偏差, 代表値]
  - term: 標準偏差
    reading: ひょうじゅんへんさ
    simple: データのばらつきの大きさを、元のデータと同じ単位で表した値です。
    definition: 分散の正の平方根。値が大きいほどデータが平均値から離れて散らばっている。
    example: 2,4,4,4,5,5,7,9 の標準偏差は 2。
    related: [分散, 正規分布]
  - term: 相関係数
    reading: そうかんけいすう
    simple: 2つのデータの間に、どのくらい強い直線的な関係があるかを −1〜1 で表した値です。
    definition: 2変数の共分散をそれぞれの標準偏差の積で割った値。1 に近いほど強い正の相関、−1 に近いほど強い負の相関、0 に近いほど直線的な関係が弱い。
    difference: 相関があっても因果関係があるとは限らない（擬似相関）。
    related: [擬似相関, 回帰分析]
  - term: 擬似相関
    reading: ぎじそうかん
    aliases: [見せかけの相関, 相関と因果]
    simple: 本当は直接の関係がないのに、別の共通の原因のせいで相関があるように見えることです。
    definition: 2変数の双方に影響する第3の変数（交絡因子）によって生じる、因果関係のない相関。
    example: アイスクリームの売上と水難事故件数（共通要因は気温）。
    related: [相関係数]
  - term: 尺度水準
    reading: しゃくどすいじゅん
    aliases: [名義尺度, 順序尺度, 間隔尺度, 比例尺度, 尺度]
    simple: データがどんな性質の値かによる分類で、名義・順序・間隔・比例の4つがあります。
    definition: 名義尺度（区別のみ：血液型）、順序尺度（順序に意味：順位）、間隔尺度（差に意味：摂氏温度）、比例尺度（比率に意味、0 が無を表す：重さ・長さ）。
    related: [代表値]
  - term: 仮説検定
    reading: かせつけんてい
    aliases: [第1種の誤り, 第2種の誤り, 有意水準, p値]
    simple: データを使って「差がない」という仮説を否定できるかどうかを判断する統計の手法です。
    definition: 帰無仮説を立て、標本から求めた p 値が有意水準より小さければ帰無仮説を棄却する手続。正しい帰無仮説を棄却する誤りを第1種の誤り、誤った帰無仮説を棄却しない誤りを第2種の誤りという。
    related: [正規分布]
  - term: 回帰分析
    reading: かいきぶんせき
    aliases: [説明変数, 目的変数, ロジスティック回帰分析, 単回帰分析, 重回帰分析]
    simple: ある値（目的変数）を、別の値（説明変数）を使った式で予測・説明する分析方法です。
    definition: 目的変数と説明変数の関係を式で表す手法。説明変数が1つなら単回帰分析、複数なら重回帰分析。目的変数が2値の場合はロジスティック回帰分析を用いる。
    related: [相関係数, 主成分分析]
  - term: 主成分分析
    reading: しゅせいぶんぶんせき
    simple: たくさんの項目を、情報をなるべく失わずに少ない数の指標にまとめる分析方法です。
    definition: 相関のある多変数を、分散が最大となる方向から順に互いに無相関な合成変数（主成分）へ変換し、少数の主成分でデータを要約する次元削減の手法。
    related: [回帰分析, 教師なし学習]
  - term: 行列
    reading: ぎょうれつ
    aliases: [逆行列, 単位行列, 転置行列]
    simple: 数を縦と横に長方形に並べたものです。画像処理や機械学習の計算に欠かせません。
    definition: m 行 n 列に数を並べたもの。積 AB の (i, j) 要素は A の i 行と B の j 列の積和。一般に AB≠BA。掛けても変わらない行列を単位行列、AX＝E となる X を A の逆行列という。
    related: [対数]
  - term: 対数
    reading: たいすう
    aliases: [log]
    simple: 「ある数を何乗するとその値になるか」を表す数です。log₂ 8 ＝ 3 は「2を3乗すると8」という意味です。
    definition: aˣ＝b のとき x＝logₐ b。logₐ(MN)＝logₐ M＋logₐ N などの性質をもつ。
    example: 2分探索の比較回数は約 log₂ n 回。
    related: [情報量, 計算量]
  - term: フィボナッチ数列
    reading: フィボナッチすうれつ
    simple: 1, 1, 2, 3, 5, 8 … のように、直前の2つの数を足して次の数を作る数列です。
    definition: F₁＝F₂＝1、Fₙ＝Fₙ₋₁＋Fₙ₋₂（n≧3）で定義される数列。再帰や動的計画法の例として用いられる。
    related: [再帰, 動的計画法]
  - term: 再帰
    reading: さいき
    aliases: [再帰呼出し, 再帰的]
    simple: 関数の中で自分自身を呼び出して、問題を小さくしながら解く方法です。
    definition: 手続や関数が、その処理の中で自分自身を呼び出すこと。終了条件（基底部）と、より小さな問題への呼出しで構成する。呼出しごとに局所変数などがスタックに積まれる。
    example: n! ＝ n×(n−1)!、0!＝1。
    related: [スタック, フィボナッチ数列]
  - term: ニュートン法
    reading: ニュートンほう
    simple: グラフの接線を使って、方程式の答えに少しずつ近づけていく計算方法です。
    definition: f(x)＝0 の解を求める反復法。xₙ₊₁＝xₙ−f(xₙ)/f′(xₙ) により近似値を更新する。解の近くでは高速に収束する。
    difference: 二分法は区間を半分にしていく方法で、遅いが確実に収束する。
    related: [誤差, 微分]
  - term: 誤差
    reading: ごさ
    aliases: [丸め誤差, 打切り誤差, 絶対誤差, 相対誤差]
    simple: 計算や測定で得た値と、本当の値とのずれです。
    definition: 丸め誤差（端数処理による）、打切り誤差（無限の計算を有限で打ち切ることによる）、桁落ち・情報落ちなどがある。絶対誤差＝｜近似値−真値｜、相対誤差＝絶対誤差÷｜真値｜。
    related: [桁落ち, 情報落ち]
  - term: 微分
    reading: びぶん
    simple: グラフのある点での傾き（変化の速さ）を求める計算です。
    definition: 関数 f(x) の瞬間的な変化率 f′(x) を求める演算。xⁿ の導関数は n xⁿ⁻¹。数式処理では記号的に計算する。
    related: [ニュートン法]
  - term: グラフ理論
    reading: グラフりろん
    aliases: [無向グラフ, 有向グラフ]
    simple: 点（頂点）と線（辺）のつながり方を扱う数学で、路線図やネットワークの分析に使われます。
    definition: 頂点と辺からなるグラフの性質を扱う理論。辺に向きのないものを無向グラフ、向きのあるものを有向グラフという。n 頂点の完全グラフの辺数は n(n−1)/2。
    related: [ダイクストラ法]
  - term: 待ち行列理論
    reading: まちぎょうれつりろん
    aliases: [M/M/1, 待ち行列]
    simple: 窓口に客が並ぶ様子を数式で表し、待ち時間などを予測する理論です。
    definition: 到着とサービスの確率的性質から、待ち時間や行列の長さを分析する理論。M/M/1 では利用率 ρ＝平均サービス時間÷平均到着間隔、平均待ち時間＝ρ/(1−ρ)×平均サービス時間。
    example: 平均到着間隔4分・平均サービス時間3分なら、ρ＝0.75、平均待ち時間は9分。
    related: [確率]
  - term: 動的計画法
    reading: どうてきけいかくほう
    simple: 小さな問題の答えをメモしておき、同じ計算を繰り返さずに大きな問題を解く方法です。
    definition: 問題を重複する部分問題に分割し、部分問題の解を表に記録して再利用することで最適解を効率よく求める手法。
    difference: 貪欲法はその時点の最善を選ぶだけで、最適解を保証しない。
    related: [再帰, フィボナッチ数列]
  - term: 情報量
    reading: じょうほうりょう
    aliases: [エントロピー, 平均情報量]
    simple: 珍しい出来事ほど、それが起きたと知ったときに得られる情報が多い、という考えで情報の多さを表した量です。
    definition: 確率 p の事象の情報量は −log₂ p ビット。各事象の情報量の期待値を平均情報量（エントロピー）という。
    example: 確率 1/8 の事象の情報量は3ビット。
    related: [ハフマン符号, 対数]
  - term: ハフマン符号
    reading: ハフマンふごう
    simple: よく出てくる記号には短い符号、めったに出ない記号には長い符号を割り当てて、データを圧縮する方法です。
    definition: 出現確率の小さい記号から順に2つずつまとめて木を作り、符号を割り当てる可変長の接頭符号。平均符号長を最小にする（情報源符号化）。
    related: [情報量, ハミング符号]
  - term: ハミング符号
    reading: ハミングふごう
    simple: データに検査用のビットを足して、1ビットの誤りなら自動で直せるようにした符号です。
    definition: データビットに複数の検査ビットを付加し、1ビット誤りの訂正と2ビット誤りの検出を可能にする誤り訂正符号。
    related: [パリティチェック, ECC, CRC]
  - term: Unicode
    reading: ユニコード
    simple: 世界中の文字を一つの体系で扱えるようにした文字コードの規格です。
    definition: 世界の文字に一意の番号（符号位置）を割り当てる文字集合の規格。符号化方式に UTF-8・UTF-16 などがある。ISO/IEC 10646（UCS）と対応する。
    related: [UTF-8, ASCII]
  - term: UTF-8
    reading: ユーティーエフエイト
    fullName: Unicode Transformation Format - 8-bit
    japanese: Unicode 変換形式（8ビット単位）
    words:
      - { en: Unicode, ja: ユニコード（世界共通の文字集合） }
      - { en: Transformation, ja: 変換 }
      - { en: Format, ja: 形式 }
      - { en: 8-bit, ja: 8ビット（1バイト）単位 }
    simple: Unicode の文字を1〜4バイトで表す方式で、Web で最も広く使われています。
    definition: Unicode の符号位置を8ビット単位の1〜4バイト可変長で表す符号化方式。ASCII の範囲は ASCII と同一の1バイトで表す。
    related: [Unicode, ASCII]
  - term: ASCII
    reading: アスキー
    fullName: American Standard Code for Information Interchange
    japanese: 情報交換用米国標準コード
    words:
      - { en: American, ja: 米国の }
      - { en: Standard, ja: 標準の }
      - { en: Code, ja: 符号・コード }
      - { en: Information, ja: 情報 }
      - { en: Interchange, ja: 交換 }
    simple: 英字・数字・記号などを7ビットで表す、最も基本的な文字コードです。
    definition: 英数字・記号・制御文字の128文字を7ビットで表す文字コード。日本語は表現できない。
    related: [Unicode, UTF-8]
  - term: 述語論理
    reading: じゅつごろんり
    simple: 「すべての〜について」「ある〜が存在する」といった表現も扱える論理です。
    definition: 命題論理に、変数を含む述語と、全称記号 ∀・存在記号 ∃ を加えた論理体系。¬∀x P(x) ≡ ∃x ¬P(x)。関係データベースの理論的基礎の一つ。
    related: [命題論理]
  - term: 逆ポーランド表記法
    reading: ぎゃくポーランドひょうきほう
    aliases: [後置記法, 逆ポーランド記法]
    simple: 「A＋B」を「AB＋」のように、演算子を後ろに書く式の書き方です。括弧がなくても計算順序が決まります。
    definition: 演算子をオペランドの後に置く表記法（後置記法）。スタックを用いて左から順に評価できる。
    example: (A＋B)×(C−D) → AB＋CD−×。
    related: [スタック, コンパイラ]
  - term: BNF
    reading: ビーエヌエフ
    fullName: Backus-Naur Form
    japanese: バッカス・ナウア記法
    words:
      - { en: Backus, ja: バッカス（考案者の名前） }
      - { en: Naur, ja: ナウア（考案者の名前） }
      - { en: Form, ja: 形式・記法 }
    simple: プログラム言語の文法を、記号を組み合わせた規則で書き表す方法です。
    definition: 「::=」（定義）と「|」（選択）を用いて構文規則を記述するメタ言語。規則の中で自分自身を用いる再帰的定義で繰返しを表す。
    related: [コンパイラ]
  - term: 有限オートマトン
    reading: ゆうげんオートマトン
    aliases: [オートマトン, 状態遷移]
    simple: 決まった数の状態をもち、入力に応じて状態を切り替えていく仕組みのモデルです。
    definition: 有限個の状態・入力記号・状態遷移関数・初期状態・受理状態からなる計算モデル。入力列を読み終えたときに受理状態にあれば、その入力を受理する。
    related: [BNF]
  - term: 計算量
    reading: けいさんりょう
    aliases: [オーダ, O記法, 時間計算量]
    simple: データの量が増えたとき、処理時間などがどのくらい増えるかを表す目安です。
    definition: アルゴリズムの実行に要する時間や記憶領域を、入力の大きさ n の関数として表したもの。O(n²) は n の2乗に比例することを表す。
    example: 線形探索 O(n)、2分探索 O(log n)、バブルソート O(n²)、マージソート O(n log n)。
    related: [対数]
  - term: エキスパートシステム
    reading: エキスパートシステム
    simple: 専門家の知識をルールとして蓄え、専門家のように判断や助言をするシステムです。
    definition: 専門家の知識を知識ベースに蓄え、推論エンジンにより問題を解く AI システム。
    related: [機械学習]
  - term: 機械学習
    reading: きかいがくしゅう
    aliases: [AI]
    simple: コンピュータが大量のデータからルールやパターンを自動的に学ぶ技術です。
    definition: データから規則性を学習し、予測や分類を行う AI の手法。教師あり学習・教師なし学習・強化学習に大別される。
    related: [教師あり学習, 教師なし学習, 強化学習, 過学習]
  - term: 教師あり学習
    reading: きょうしありがくしゅう
    aliases: [分類, 回帰]
    simple: 正解（ラベル）付きのデータで学習し、新しいデータの正解を予測する機械学習です。
    definition: 入力と正解の組からなる学習データを用いて、入力から出力を予測するモデルを作る学習。数値を予測する回帰と、カテゴリを予測する分類がある。
    related: [教師なし学習, 強化学習]
  - term: 教師なし学習
    reading: きょうしなしがくしゅう
    aliases: [クラスタリング, 次元削減]
    simple: 正解のないデータから、似たもの同士のグループやデータの特徴を見つけ出す機械学習です。
    definition: 正解ラベルのないデータから構造を見いだす学習。クラスタリング、次元削減（主成分分析など）がある。
    related: [教師あり学習, 主成分分析]
  - term: 強化学習
    reading: きょうかがくしゅう
    simple: 試行錯誤を繰り返し、報酬が最も多くもらえる行動を学ぶ機械学習です。
    definition: エージェントが環境の中で行動し、得られる報酬の合計を最大化する行動方針を学習する手法。
    example: ゲーム AI、ロボットの歩行制御。
    related: [教師あり学習]
  - term: 過学習
    reading: かがくしゅう
    aliases: [過剰適合, オーバーフィッティング, 汎化性能]
    simple: 学習データに合わせすぎて、新しいデータではうまく予測できなくなる状態です。
    definition: モデルが学習データのノイズまで学習し、学習データでの精度は高いが未知データに対する精度（汎化性能）が低くなる現象。
    related: [交差検証]
  - term: 交差検証
    reading: こうさけんしょう
    aliases: [k分割交差検証, ホールドアウト検証]
    simple: データを分けて「学習用」と「確認用」を入れ替えながら何度も評価し、モデルの実力を公平に測る方法です。
    definition: データを k 個に分割し、1個を検証用・残りを学習用とする評価を k 回繰り返して平均する手法（k 分割交差検証）。一度だけ分けるのはホールドアウト検証。
    related: [過学習]
  - term: ニューラルネットワーク
    reading: ニューラルネットワーク
    aliases: [多層パーセプトロン]
    simple: 脳の神経細胞のつながりをまねた計算モデルで、ディープラーニングの基礎です。
    definition: 入力層・隠れ層（中間層）・出力層のノードを重み付きの結合でつなぎ、活性化関数を通して出力を計算するモデル。隠れ層を多くしたものを用いる学習がディープラーニング。
    related: [バックプロパゲーション, 活性化関数, CNN]
  - term: バックプロパゲーション
    reading: バックプロパゲーション
    aliases: [誤差逆伝播法]
    simple: 予測の誤差を出力側から入力側へ逆にたどって伝え、重みを少しずつ直していく学習方法です。
    definition: ニューラルネットワークの出力誤差を出力層から入力層へ逆方向に伝播させ、勾配降下法で各重みを更新する学習アルゴリズム。
    related: [ニューラルネットワーク, 勾配消失問題]
  - term: 勾配消失問題
    reading: こうばいしょうしつもんだい
    simple: 層の深いニューラルネットワークで、入力に近い層ほど学習の手がかり（勾配）が小さくなり、学習が進まなくなる問題です。
    definition: 誤差逆伝播で勾配が層ごとに掛け合わされて指数的に小さくなり、入力層に近い層の重みが更新されなくなる問題。ReLU の採用などで緩和する。
    related: [活性化関数, バックプロパゲーション]
  - term: 活性化関数
    reading: かっせいかかんすう
    aliases: [ReLU, シグモイド関数]
    simple: ニューラルネットワークの各ノードで、入力の合計をどんな出力に変えるかを決める関数です。
    definition: ノードへの入力の重み付き和を出力値に変換する非線形関数。シグモイド関数、ReLU（0未満は0、それ以外はそのまま）などがある。
    related: [勾配消失問題, ニューラルネットワーク]
  - term: 転移学習
    reading: てんいがくしゅう
    simple: ある課題で学習済みのモデルを、別の関連する課題に流用して効率よく学習することです。
    definition: 事前学習済みモデルの知識を、別の課題のモデル構築に利用する手法。データが少ない課題でも精度を得やすい。
    related: [ファインチューニング]
  - term: ファインチューニング
    reading: ファインチューニング
    aliases: [事前学習]
    simple: 学習済みのモデルを、目的に合わせた少量のデータで追加学習して微調整することです。
    definition: 事前学習済みモデルのパラメータを初期値とし、目的の課題のデータで追加学習してパラメータを調整する手法。
    related: [転移学習, LLM]
  - term: CNN
    reading: シーエヌエヌ
    fullName: Convolutional Neural Network
    japanese: 畳み込みニューラルネットワーク
    words:
      - { en: Convolutional, ja: 畳み込みの }
      - { en: Neural, ja: 神経の }
      - { en: Network, ja: ネットワーク・網 }
    simple: 画像の特徴を取り出すのが得意なニューラルネットワークで、画像認識に広く使われます。
    definition: 畳み込み層で局所的な特徴を抽出し、プーリング層で情報を集約する構造をもつニューラルネットワーク。
    related: [RNN, GAN, ニューラルネットワーク]
  - term: RNN
    reading: アールエヌエヌ
    fullName: Recurrent Neural Network
    japanese: 再帰型ニューラルネットワーク（リカレントニューラルネットワーク）
    words:
      - { en: Recurrent, ja: 繰り返し現れる・回帰する }
      - { en: Neural, ja: 神経の }
      - { en: Network, ja: ネットワーク・網 }
    simple: 文章や音声のような順番のあるデータを扱うのが得意なニューラルネットワークです。
    definition: 前の時刻の内部状態を次の時刻の入力に用いる構造をもち、時系列データを処理するニューラルネットワーク。
    related: [CNN]
  - term: GAN
    reading: ガン
    fullName: Generative Adversarial Network
    japanese: 敵対的生成ネットワーク
    words:
      - { en: Generative, ja: 生成する }
      - { en: Adversarial, ja: 敵対的な }
      - { en: Network, ja: ネットワーク・網 }
    simple: 「偽物を作る役」と「見破る役」を競わせて、本物そっくりの画像などを作れるようにする仕組みです。
    definition: 生成器と識別器の2つのネットワークを敵対的に学習させ、本物に近いデータを生成する生成モデル。
    related: [拡散モデル, CNN]
  - term: 拡散モデル
    reading: かくさんモデル
    aliases: [生成モデル, 生成AI]
    simple: 画像にノイズを加える過程を逆にたどって、ノイズから画像を作り出す生成 AI の仕組みです。
    definition: データに段階的にノイズを加える過程と、ノイズを除去する逆過程を学習し、ノイズから新しいデータを生成するモデル。画像生成 AI に広く使われる。
    related: [GAN]
  - term: LLM
    reading: エルエルエム
    fullName: Large Language Model
    japanese: 大規模言語モデル
    words:
      - { en: Large, ja: 大規模な }
      - { en: Language, ja: 言語 }
      - { en: Model, ja: モデル（模型・仕組み） }
    simple: 大量の文章を学習して、人間のような自然な文章を作ったり質問に答えたりする AI です。
    definition: 膨大なテキストで事前学習した、パラメータ数の非常に大きい言語モデル。入力に続く語を予測して文章を生成する。事実と異なる内容（ハルシネーション）を出力することがある。
    related: [プロンプトエンジニアリング, ファインチューニング]
  - term: プロンプトエンジニアリング
    reading: プロンプトエンジニアリング
    simple: 生成 AI から望む答えを引き出すために、指示文（プロンプト）の書き方を工夫することです。
    definition: 生成 AI への入力（指示・文脈・例示・出力形式など）を設計・改善して、目的に合った出力を得る技術。
    related: [LLM]
  - term: コンパイラ
    reading: コンパイラ
    aliases: [字句解析, 構文解析, 意味解析, 最適化, コード生成]
    simple: 人が書いたプログラムを、コンピュータが実行できる機械語にまとめて翻訳するソフトウェアです。
    definition: 原始プログラムを目的プログラムに翻訳する言語処理系。字句解析→構文解析→意味解析→最適化→コード生成の順に処理する。
    difference: インタプリタはプログラムを1文ずつ解釈しながら実行する。
    related: [BNF, 逆ポーランド表記法]
  - term: 関数型言語
    reading: かんすうがたげんご
    aliases: [論理型言語, 手続型言語]
    simple: 関数を組み合わせてプログラムを作る言語で、値を書き換えない書き方を基本とします。
    definition: 関数の適用と合成によって計算を記述するプログラム言語。副作用を避け、参照透過性を重視する（例：Haskell）。論理型言語（例：Prolog）は事実と規則から推論する。
    related: [コンパイラ]
  - term: 半二重通信
    reading: はんにじゅうつうしん
    simple: 双方向に通信できるが、同時には片方向しか送れない通信方式です。トランシーバーが代表例です。
    definition: 一つの伝送路で送信と受信を交互に切り替えて行う通信方式。
    related: [全二重通信]
  - term: 全二重通信
    reading: ぜんにじゅうつうしん
    aliases: [単方向通信]
    simple: 送信と受信を同時に行える通信方式です。電話が代表例です。
    definition: 双方向の伝送を同時に行える通信方式。常に一方向のみの方式は単方向通信という。
    related: [半二重通信]
  - term: PCM
    reading: ピーシーエム
    fullName: Pulse Code Modulation
    japanese: パルス符号変調
    words:
      - { en: Pulse, ja: パルス（短い信号） }
      - { en: Code, ja: 符号 }
      - { en: Modulation, ja: 変調 }
    simple: 音声などのアナログ信号を、一定間隔で測って数値（0と1）に変える方式です。
    definition: アナログ信号を標本化・量子化・符号化してデジタル信号に変換する方式。
    example: 8kHz で標本化し8ビットで量子化すると 64kbit/s。
    related: [標本化定理, A/D変換]
  - term: 標本化定理
    reading: ひょうほんかていり
    aliases: [サンプリング定理, 標本化, サンプリング]
    simple: 元の信号の一番高い周波数の2倍より細かく測れば、元の信号を復元できるという定理です。
    definition: 信号に含まれる最高周波数の2倍を超える周波数で標本化すれば、標本値から元の信号を完全に復元できるという定理。
    example: 可聴域（約20kHz）に対し、音楽 CD は 44.1kHz で標本化。
    related: [PCM, A/D変換]
  - term: A/D変換
    reading: エーディーへんかん
    fullName: Analog to Digital conversion
    japanese: アナログ・デジタル変換
    aliases: [D/A変換, AD変換]
    words:
      - { en: Analog, ja: アナログ（連続的な量） }
      - { en: Digital, ja: デジタル（離散的な数値） }
      - { en: conversion, ja: 変換 }
    simple: 音や温度のように連続的に変わる値を、コンピュータが扱える数値に変えることです。
    definition: アナログ信号を標本化・量子化・符号化してデジタル値に変換すること。逆の変換を D/A 変換という。
    related: [標本化定理, PCM]
  - term: TDM
    reading: ティーディーエム
    fullName: Time Division Multiplexing
    japanese: 時分割多重
    words:
      - { en: Time, ja: 時間 }
      - { en: Division, ja: 分割 }
      - { en: Multiplexing, ja: 多重化 }
    simple: 一本の回線を使う時間を細かく区切り、順番に複数の通信に割り当てる方式です。
    definition: 伝送路の使用時間をタイムスロットに分割し、各通信に順に割り当てて多重化する方式。
    related: [FDM]
  - term: FDM
    reading: エフディーエム
    fullName: Frequency Division Multiplexing
    japanese: 周波数分割多重
    words:
      - { en: Frequency, ja: 周波数 }
      - { en: Division, ja: 分割 }
      - { en: Multiplexing, ja: 多重化 }
    simple: 一本の回線の周波数の幅を分け、それぞれを別の通信に使う方式です。
    definition: 伝送路の周波数帯域を複数の帯域に分割し、各通信に割り当てて多重化する方式。
    related: [TDM]
  - term: パリティチェック
    reading: パリティチェック
    aliases: [偶数パリティ, 奇数パリティ, パリティビット]
    simple: データの1の個数が偶数（または奇数）になるように1ビットを足し、誤りを見つける方法です。
    definition: データに1ビットのパリティビットを付加し、1の個数の偶奇で誤りを検出する方式。1ビットの誤りを検出できるが訂正はできない。
    related: [ハミング符号, CRC]
  - term: CRC
    reading: シーアールシー
    fullName: Cyclic Redundancy Check
    japanese: 巡回冗長検査
    words:
      - { en: Cyclic, ja: 巡回的な }
      - { en: Redundancy, ja: 冗長性（余分な情報） }
      - { en: Check, ja: 検査 }
    simple: データを決まった式で割った余りを付けて送り、受信側で同じ計算をして誤りを見つける方法です。
    definition: データを生成多項式で除算した剰余を検査符号として付加する誤り検出方式。連続した複数ビットの誤り（バースト誤り）の検出に強い。
    related: [パリティチェック, ハミング符号]
  - term: ECC
    reading: イーシーシー
    fullName: Error Correcting Code
    japanese: 誤り訂正符号
    words:
      - { en: Error, ja: 誤り }
      - { en: Correcting, ja: 訂正する }
      - { en: Code, ja: 符号 }
    simple: 誤りを見つけるだけでなく、自動で直すこともできる符号です。サーバのメモリなどに使われます。
    definition: 誤りの検出に加えて訂正を可能にする符号の総称。メモリでは1ビット誤り訂正・2ビット誤り検出（ハミング符号の応用）が多い。
    related: [ハミング符号]
  - term: 調歩同期
    reading: ちょうほどうき
    aliases: [スタートビット, ストップビット]
    simple: 1文字ごとに「始め」と「終わり」の印のビットを付けて、送受信のタイミングを合わせる方法です。
    definition: 各文字の前にスタートビット、後にストップビットを付加して文字単位で同期をとる非同期方式。
    related: [全二重通信]
  - term: フィードバック制御
    reading: フィードバックせいぎょ
    aliases: [フィードフォワード制御, オープンループ制御, シーケンス制御]
    simple: 結果を測って目標との差を確かめ、差がなくなるように操作を調整する制御です。
    definition: 制御量を検出して目標値と比較し、偏差を減らすように操作量を修正する閉ループ制御。外乱を予測して事前に修正するのはフィードフォワード制御。
    example: エアコンの温度調節。
    related: [センサー, アクチュエーター]
  - term: センサー
    reading: センサー
    aliases: [加速度センサー, ジャイロセンサー, 赤外線センサー]
    simple: 温度・光・動きなどの物理的な量を測って、電気信号に変える部品です。
    definition: 物理量や化学量を検出し、電気信号に変換する素子・装置。温度センサー、加速度センサー、ジャイロセンサー（角速度）、超音波センサーなどがある。
    related: [アクチュエーター, サーミスタ]
  - term: サーミスタ
    reading: サーミスタ
    simple: 温度によって電気の通しやすさ（抵抗）が大きく変わる部品で、温度計に使われます。
    definition: 温度変化に対して電気抵抗が大きく変化する半導体素子。温度センサーに用いる。
    related: [センサー]
  - term: アクチュエーター
    reading: アクチュエーター
    simple: 電気信号を受けて、モーターの回転などの「動き」に変える装置です。
    definition: 電気・油圧・空気圧などのエネルギーを機械的な動きに変換する駆動装置。モーター、油圧シリンダ、空気圧シリンダなど。
    related: [センサー, フィードバック制御]
  - term: スタック
    reading: スタック
    aliases: [LIFO, プッシュ, ポップ]
    simple: 最後に入れたものを最初に取り出す（後入れ先出し）データの入れ物です。
    definition: データの追加（プッシュ）と取出し（ポップ）を同じ一端で行う LIFO（Last In First Out）のデータ構造。関数呼出しの管理や逆ポーランド記法の評価に使われる。
    difference: キューは先に入れたものを先に取り出す FIFO。
    related: [キュー, 再帰]
  - term: 再現率
    reading: さいげんりつ
    aliases: [Recall, 真陽性率]
    simple: 本当に陽性のもののうち、どれだけを陽性と見抜けたかの割合です。見逃しの少なさを表します。
    definition: 真陽性数 ÷（真陽性数＋偽陰性数）。
    related: [適合率]
  - term: 適合率
    reading: てきごうりつ
    aliases: [Precision, ROC曲線]
    simple: 陽性と判定したもののうち、本当に陽性だったものの割合です。誤判定の少なさを表します。
    definition: 真陽性数 ÷（真陽性数＋偽陽性数）。再現率と適合率はトレードオフの関係になりやすい。
    related: [再現率]
