category: コンピュータ構成要素
terms:
  - term: ダイレクトマッピング方式
    reading: だいれくとまっぴんぐほうしき
    aliases: [直接マッピング方式, ダイレクトマップ方式]
    simple: 主記憶のブロックを入れられるキャッシュのラインが1か所に決まっている方式です。
    definition: 主記憶のブロック番号をキャッシュのライン数で割った余りで格納先のラインを一意に決める方式。比較回路が単純で高速だが、同じラインに対応するブロックを交互に参照すると追出しが繰り返され、ヒット率が下がる。
    related: [キャッシュメモリ, セットアソシアティブ方式, フルアソシアティブ方式]
  - term: セットアソシアティブ方式
    reading: せっとあそしあてぃぶほうしき
    aliases: [セットアソシアティブマッピング方式, Nウェイセットアソシアティブ方式]
    simple: キャッシュをいくつかのセットに分け、セットの中ならどのラインにも入れられる方式です。
    definition: キャッシュのラインをセットに分け、主記憶のブロックはブロック番号をセット数で割った余りで決まるセットの中の任意のライン（ウェイ）に格納できる方式。ダイレクトマッピング方式とフルアソシアティブ方式の中間にあたり、追出しの競合を減らせる。
    related: [キャッシュメモリ, ダイレクトマッピング方式, フルアソシアティブ方式]
  - term: フルアソシアティブ方式
    reading: ふるあそしあてぃぶほうしき
    aliases: [フルアソシアティブマッピング方式, 全連想方式]
    simple: 主記憶のブロックをキャッシュのどのラインにも入れられる方式です。
    definition: 主記憶のブロックをキャッシュの任意のラインに格納できる方式。競合による追出しは最も少ないが、検索のため全ラインのタグを同時に比較する回路が必要で、構成が複雑で高価になる。
    related: [キャッシュメモリ, ダイレクトマッピング方式, セットアソシアティブ方式]
  - term: キャッシュライン
    reading: きゃっしゅらいん
    aliases: [キャッシュブロック, ライン]
    simple: キャッシュと主記憶の間でデータをやり取りするときの、ひとまとまりの単位です。
    definition: キャッシュメモリと主記憶の間でまとめて転送・管理される固定長のデータ単位。各ラインには、どの主記憶ブロックの写しかを示すタグなどの管理情報が付く。
    related: [キャッシュメモリ, ダイレクトマッピング方式]
