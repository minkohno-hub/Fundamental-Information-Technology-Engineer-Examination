category: プロジェクトマネジメント
terms:
  - term: 3点見積もり
    reading: さんてんみつもり
    simple: 楽観・普通・悲観の3つの値から、所要時間などを見積もる方法です。
    definition: 楽観値、最可能値、悲観値の3つの見積もりから、期待値を求める方法（PERT で用いる）。期待値は （楽観値 ＋ 4 × 最可能値 ＋ 悲観値）÷ 6 で計算し、不確実性を織り込んだ見積もりになる。
    related: [PERT]
  - term: 品質コスト
    reading: ひんしつコスト
    simple: 品質を保つためにかかる費用を、3つの種類に分けたものです。
    definition: 品質に関する費用の総称で、不具合を防ぐ予防コスト、適合を確かめる評価コスト、不具合の処理にかかる失敗コストに分類される。予防への投資が失敗コストを下げるという関係で、配分を考える。
    related: [予防コスト]
  - term: 予防コスト
    reading: よぼうコスト
    simple: 不具合が起きないようにするための活動にかかる費用です。
    definition: 品質コストの一つで、設計レビューや教育訓練など、不具合の発生を未然に防ぐ活動の費用。増やすことで、評価コストや失敗コスト、特に外部失敗コストの低減が期待できる。
    related: [品質コスト]
