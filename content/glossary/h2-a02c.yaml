category: 基礎理論
terms:
  - term: グラフ
    reading: グラフ
    simple: 点（頂点）と、それらを結ぶ線（辺）の集まりで、つながりを表したものです。
    definition: 頂点（ノード）と辺（エッジ）からなるデータ構造で、対象同士の関係を表す。辺に向きがあるものを有向グラフ、ないものを無向グラフという。探索の方法には、幅優先探索と深さ優先探索がある。
    related: [幅優先探索, 深さ優先探索]
  - term: 二分探索木
    reading: にぶんたんさくぎ
    simple: 左側には小さい値、右側には大きい値が来るようにした二分木です。
    definition: 各節点について、左の部分木の値が全てその節点より小さく、右の部分木の値が全て大きいという性質を持つ二分木。探索や挿入は、値の大小を比べながら根からたどることで効率的に行える。木の形は挿入の順序によって決まり、偏ると探索が遅くなる。
    related: [二分木, 探索]
  - term: 探索
    reading: たんさく
    simple: 集まりの中から、目的のデータを探し出すことです。
    definition: データの集まりから、条件に合う要素を見つけ出す処理。代表的な方法に、線形探索、二分探索、ハッシュ法、木探索（幅優先・深さ優先）があり、データの並びや構造によって効率が異なる。
    related: [二分探索, ハッシュ法]
  - term: 完全二分木
    reading: かんぜんにぶんぎ
    simple: 最後の段以外はすき間なく埋まり、最後の段は左から詰まっている二分木です。
    definition: 最下層を除く全ての層が節点で埋まっており、最下層の節点が左から順に詰めて置かれている二分木。根から順に配列へ格納でき、要素 i の子は要素 2i と 2i ＋ 1、親は要素（i ÷ 2 の商）になる。ヒープの実装に使われる。
    related: [二分木, ヒープ]
  - term: 二次探査法
    reading: にじたんさほう
    simple: ハッシュ表で衝突したとき、1、4、9…と、だんだん大きく離れた位置を探す方法です。
    definition: ハッシュ表の衝突の解決方法の一つで、ハッシュ値の位置から、1 の 2 乗、2 の 2 乗、3 の 2 乗、…だけ先の位置を順に調べて、空いている位置に格納する方法。1 つずつ順に探す線形探査法で、衝突したキーが連続した区間に固まる問題を避けるために用いられる。
    related: [ハッシュ法, 線形探査法]
