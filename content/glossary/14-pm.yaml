category: プロジェクトマネジメント
terms:
  - term: プロジェクト
    reading: プロジェクト
    simple: 始まりと終わりが決まっていて、今までにない成果を作るための活動です。
    definition: 独自のプロダクト、サービス、所産を創造するために実施する有期性の活動。定常業務と区別される。
    related: [プロジェクト憲章]
  - term: テーラリング
    reading: テーラリング
    simple: 標準のやり方を、プロジェクトに合うように選んだり調整したりすることです。
    definition: 標準的なプロセス・手法・成果物を、プロジェクトの規模や特性に合わせて取捨選択し調整して適用すること。
    related: [PMBOK]
  - term: PMBOK
    reading: ピンボック
    fullName: Project Management Body of Knowledge
    japanese: プロジェクトマネジメント知識体系
    words:
      - { en: Project Management, ja: プロジェクトマネジメント }
      - { en: Body of Knowledge, ja: 知識体系 }
    simple: プロジェクトを上手に管理するための知識をまとめた、世界的な手引書です。
    definition: 米国 PMI がまとめたプロジェクトマネジメントの知識体系。第6版は10の知識エリアと49のプロセス、第7版は12の原理・原則と8つのパフォーマンス領域で構成される。
    related: [JIS Q 21500]
  - term: JIS Q 21500
    reading: ジスキューにまんいちせんごひゃく
    aliases: [ISO 21500, プロジェクトマネジメントの手引]
    simple: プロジェクトマネジメントの考え方や進め方を示した日本産業規格です。
    definition: ISO 21500 に対応するプロジェクトマネジメントの手引の規格。プロセスを5つのプロセス群と10の対象群に分類する。
    related: [プロジェクトマネジメントのプロセス群, プロジェクトマネジメントの対象群]
  - term: プロジェクトマネジメントのプロセス群
    reading: プロジェクトマネジメントのプロセスぐん
    simple: プロジェクトの仕事を、立上げ・計画・実行・管理・終結の5つの段階に分けたものです。
    definition: JIS Q 21500 におけるプロセスの分類で、立上げ、計画、実行、管理、終結の5つ。
    related: [JIS Q 21500]
  - term: プロジェクトマネジメントの対象群
    reading: プロジェクトマネジメントのたいしょうぐん
    aliases: [対象群]
    simple: 管理する対象を、統合・スコープ・時間・コストなど10の分野に分けたものです。
    definition: JIS Q 21500 におけるプロセスの分類で、統合、ステークホルダ、スコープ、資源、時間、コスト、リスク、品質、調達、コミュニケーションの10。
    related: [JIS Q 21500]
  - term: PMO
    reading: ピーエムオー
    fullName: Project Management Office
    japanese: プロジェクトマネジメントオフィス
    words:
      - { en: Project Management, ja: プロジェクトマネジメント }
      - { en: Office, ja: 事務局 }
    simple: 会社の中のいろいろなプロジェクトをまとめて支援する部門です。
    definition: 組織内の複数プロジェクトを横断的に支援し、マネジメントの標準化、教育、資源調整、監視などを行う部門。
    related: [プロジェクトスポンサー]
  - term: プロジェクトスポンサー
    reading: プロジェクトスポンサー
    simple: プロジェクトにお金などを出し、プロジェクトを認めて後押しする人や組織です。
    definition: プロジェクトに資金や資源を提供し、プロジェクトを承認・支援する個人又は組織。
    related: [プロジェクト憲章]
  - term: プロジェクト憲章
    reading: プロジェクトけんしょう
    simple: プロジェクトを正式に始めることを認め、プロジェクトマネージャに権限を与える文書です。
    definition: プロジェクトを正式に認可し、PM を任命して権限を与える文書。目的、概要、主要マイルストーン、予算概要などを記載する。立上げプロセス群で作成する。
    related: [プロジェクトスポンサー]
  - term: CCB
    reading: シーシービー
    fullName: Change Control Board
    japanese: 変更管理委員会
    aliases: [変更管理委員会]
    words:
      - { en: Change, ja: 変更 }
      - { en: Control, ja: 管理 }
      - { en: Board, ja: 委員会 }
    simple: プロジェクトの計画を変えてよいかどうかを判断して決める会議体です。
    definition: ベースラインに対する変更要求を審査し、承認・却下を決定する組織。
    related: [ベースライン]
  - term: ベースライン
    reading: ベースライン
    simple: 進み具合を比べるときの基準として、正式に承認された計画のことです。
    definition: 承認されたスコープ、スケジュール、コストなどの計画。実績との比較の基準となり、正式な変更管理を経てのみ変更する。
    related: [CCB]
  - term: 得た教訓
    reading: えたきょうくん
    aliases: [教訓文書]
    simple: プロジェクトでうまくいったことや失敗から学んだことをまとめ、次に活かすための記録です。
    definition: プロジェクトで得た成功・失敗の要因や改善策を文書化したもの。組織のプロセス資産として将来のプロジェクトに活用する。
    related: [プロジェクト憲章]
  - term: ステークホルダ
    reading: ステークホルダ
    simple: プロジェクトに関わったり、影響を受けたりするすべての人や組織です。
    definition: プロジェクトに影響を及ぼす、又は影響を受ける個人・組織。特定してステークホルダ登録簿に記録し、権力と関心度などで分析して対応を決める。
    related: [プロジェクト憲章]
  - term: WBS
    reading: ダブリュービーエス
    fullName: Work Breakdown Structure
    japanese: 作業分解構成図
    words:
      - { en: Work, ja: 作業 }
      - { en: Breakdown, ja: 分解 }
      - { en: Structure, ja: 構造 }
    simple: プロジェクトの成果物や作業を、細かく階層的に分けて整理した図です。
    definition: プロジェクトの成果物と作業を、管理可能な大きさまで階層的に分解したもの。最下位の要素をワークパッケージという。
    related: [ワークパッケージ, WBS辞書]
  - term: WBS辞書
    reading: ダブリュービーエスじしょ
    simple: WBS の各作業について、内容や担当、完了の基準などを詳しく書いた文書です。
    definition: WBS の各要素について作業内容、成果物、担当、マイルストーン、コスト、完了基準などの詳細を記述した文書。
    related: [WBS]
  - term: ワークパッケージ
    reading: ワークパッケージ
    simple: WBS の一番下の作業のまとまりで、見積りや担当決めの単位になります。
    definition: WBS の最下位要素。コストやスケジュールの見積り・管理、担当者の割当ての単位であり、さらにアクティビティに分解される。
    related: [WBS]
  - term: スコープクリープ
    reading: スコープクリープ
    aliases: [プロジェクトスコープのクリープ]
    simple: 正式な手続なしに、作業の範囲が少しずつ広がってしまうことです。
    definition: 変更管理を経ずに、スコープ（作業範囲・成果物）が管理されないまま徐々に拡大すること。
    related: [CCB, WBS]
  - term: 責任分担マトリックス
    reading: せきにんぶんたんマトリックス
    aliases: [RACIチャート, RACI]
    simple: 作業ごとに、誰がどんな責任をもつかを表にまとめたものです。
    definition: 作業と要員の対応を表で示し、各作業の責任を割り当てたもの（RAM）。RACI チャートでは R（実行責任）、A（説明責任）、C（相談先）、I（報告先）を割り当てる。
    related: [WBS]
  - term: 人月
    reading: にんげつ
    simple: 1人が1か月働く作業量を1とした、作業の量の単位です。
    definition: 1人が1か月に行う作業量を単位とした工数の表し方。工数 ÷ 要員数 で期間を、規模 ÷ 生産性 で工数を求める。
    related: [ファンクションポイント法]
  - term: アローダイアグラム
    reading: アローダイアグラム
    simple: 作業を矢印で、作業のつなぎ目を丸で表して、作業の順番と日数を示す図です。
    definition: 作業を矢線、作業の区切りを結合点で表し、作業の順序関係と所要期間を示す図。最早・最遅時刻や余裕日数、クリティカルパスを求めるのに使う。
    related: [クリティカルパス, PERT]
  - term: クリティカルパス
    reading: クリティカルパス
    simple: 開始から終了までで一番時間がかかる作業の道筋で、ここが遅れると全体が遅れます。
    definition: プロジェクトの開始から終了までの経路のうち所要期間が最も長い経路。経路上の作業は余裕日数が0で、遅れが全体の遅れとなる。
    related: [アローダイアグラム, クラッシング]
  - term: クラッシング
    reading: クラッシング
    simple: 人を増やすなど資源を追加して、作業の期間を短くすることです。費用は増えます。
    definition: クリティカルパス上の作業に資源を追加投入して所要期間を短縮するスケジュール短縮技法。コストが増加する。
    related: [ファストトラッキング, クリティカルパス]
  - term: ファストトラッキング
    reading: ファストトラッキング
    simple: 順番にやる予定だった作業を同時に進めて、期間を短くすることです。
    definition: 本来順次行う作業を並行して行うスケジュール短縮技法。手戻りのリスクが高まる。
    related: [クラッシング]
  - term: ガントチャート
    reading: ガントチャート
    simple: 横軸を時間にして、作業ごとの予定や実績を横棒で表した図です。
    definition: 縦軸に作業、横軸に時間をとり、作業の予定・実績期間を横棒で表した図。進捗は把握しやすいが、作業間の依存関係は表しにくい。
    related: [アローダイアグラム]
  - term: PDM
    reading: ピーディーエム
    fullName: Precedence Diagramming Method
    japanese: プレシデンスダイアグラム法
    aliases: [プレシデンスダイアグラム法]
    words:
      - { en: Precedence, ja: 先行 }
      - { en: Diagramming, ja: 図式化 }
      - { en: Method, ja: 手法 }
    simple: 作業を四角で、作業のつながりを矢印で表し、開始や終了の関係を細かく示せる図法です。
    definition: 作業をノードで表し、FS・SS・FF・SF の依存関係を矢印で示す図法。後続作業を遅らせる待ち時間をラグ、前倒しをリードという。
    related: [アローダイアグラム]
  - term: マイルストーン
    reading: マイルストーン
    simple: 工程の完了や承認など、プロジェクトの大事な節目となる時点です。
    definition: プロジェクトの重要な節目となる時点。所要期間をもたず、進捗確認の目印とする。
    related: [大日程計画]
  - term: 大日程計画
    reading: だいにっていけいかく
    aliases: [大日程計画表, マスタスケジュール]
    simple: プロジェクト全体の大まかな日程を示した計画で、細かさに応じて中日程・小日程計画があります。
    definition: プロジェクト全体の主要な工程とマイルストーンを示す計画（マスタスケジュール）。工程別の中日程計画、週間作業などの小日程計画へと詳細化する。
    related: [マイルストーン]
  - term: 三点見積り
    reading: さんてんみつもり
    simple: 一番うまくいった場合、普通の場合、一番悪い場合の3つの値から見積もる方法です。
    definition: 楽観値・最可能値・悲観値から見積もる手法。PERT では (楽観値 + 4 × 最可能値 + 悲観値) ÷ 6 で求める。
    related: [PERT]
  - term: PERT
    reading: パート
    fullName: Program Evaluation and Review Technique
    japanese: プログラム評価レビュー技法
    words:
      - { en: Program, ja: 計画 }
      - { en: Evaluation, ja: 評価 }
      - { en: Review, ja: 検討 }
      - { en: Technique, ja: 技法 }
    simple: アローダイアグラムを使って日程を計画・管理する手法です。
    definition: アローダイアグラムで作業の順序と所要期間を表し、日程を計画・管理する手法。所要期間の三点見積りを用いる。
    related: [アローダイアグラム, 三点見積り]
  - term: EVM
    reading: イーブイエム
    fullName: Earned Value Management
    japanese: アーンドバリューマネジメント
    aliases: [アーンドバリューマネジメント]
    words:
      - { en: Earned Value, ja: 獲得した価値（出来高） }
      - { en: Management, ja: 管理 }
    simple: 作業の進み具合をお金に換算して、予定どおりか・予算どおりかを同時に管理する方法です。
    definition: PV（計画価値）、EV（出来高）、AC（実コスト）を用いて進捗とコストを管理する手法。SV = EV − PV、CV = EV − AC、SPI = EV ÷ PV、CPI = EV ÷ AC、EAC = AC + (BAC − EV) ÷ CPI など。
    related: [ベースライン]
  - term: ファンクションポイント法
    reading: ファンクションポイントほう
    aliases: [FP法]
    simple: システムの機能の数と複雑さから、ソフトウェアの大きさを見積もる方法です。
    definition: 外部入力、外部出力、外部照会、内部論理ファイル、外部インタフェースファイルの数を複雑さで重み付けして合計し、調整して規模を求める見積り手法。
    related: [LOC法, COCOMO]
  - term: LOC法
    reading: エルオーシーほう
    fullName: Lines of Code
    japanese: ソースコードの行数
    aliases: [プログラムステップ法]
    words:
      - { en: Lines, ja: 行 }
      - { en: of Code, ja: コードの }
    simple: プログラムの行数を基に、ソフトウェアの規模を見積もる方法です。
    definition: ソースコードの行数（ステップ数）で規模を見積もり、生産性から工数を求める手法。
    related: [ファンクションポイント法]
  - term: COCOMO
    reading: ココモ
    fullName: Constructive Cost Model
    japanese: 構造的コストモデル
    words:
      - { en: Constructive, ja: 構造的な }
      - { en: Cost, ja: コスト }
      - { en: Model, ja: モデル }
    simple: プログラムの規模から計算式で工数を求め、条件に応じた係数で調整する見積り方法です。
    definition: ベームが提唱したパラメトリック見積り手法。規模から工数を算出し、補正係数で調整する。COCOMO II ではファンクションポイントも入力に使える。
    related: [パラメトリック見積り]
  - term: 類推見積り
    reading: るいすいみつもり
    simple: 過去の似たプロジェクトの実績を参考にして見積もる方法です。
    definition: 過去の類似プロジェクトの実績を基に見積もる手法。早期に少ない情報で見積もれるが精度は低め。
    related: [ボトムアップ見積り, パラメトリック見積り]
  - term: ボトムアップ見積り
    reading: ボトムアップみつもり
    simple: 作業を細かく分けて一つずつ見積もり、積み上げて全体を求める方法です。
    definition: WBS のワークパッケージなど細かな単位で見積もり、積み上げて全体を求める手法。精度は高いが手間がかかる。
    related: [類推見積り]
  - term: パラメトリック見積り
    reading: パラメトリックみつもり
    simple: 過去のデータから作った計算式や単価を使って見積もる方法です。
    definition: 過去のデータから得た統計的関係（単価 × 数量、規模と工数の関係式など）を用いて算出する見積り手法。
    related: [COCOMO]
  - term: プロジェクトのリスク対応戦略
    reading: プロジェクトのリスクたいおうせんりゃく
    simple: プロジェクトのリスクに、避ける・他に移す・小さくする・受け入れる などで備える考え方です。
    definition: PMBOK では、脅威に対して回避・転嫁・軽減・受容、好機に対して活用・共有・強化・受容の戦略をとる。
    related: [リスク対応, EMV]
  - term: EMV
    reading: イーエムブイ
    fullName: Expected Monetary Value
    japanese: 期待金額価値
    aliases: [期待金額価値]
    words:
      - { en: Expected, ja: 期待される }
      - { en: Monetary, ja: 金額の }
      - { en: Value, ja: 価値 }
    simple: リスクが起きる確率と金額を掛けて、平均してどのくらいの損得になるかを表した値です。
    definition: 発生確率 × 影響額 の合計として求めるリスクの金額的な期待値。リスクの定量的分析に用いる。
    related: [期待値, 定量的リスク分析]
  - term: 管理図
    reading: かんりず
    simple: データを時間順に点で打ち、上下の限界線と比べて工程が安定しているかを見る図です。
    definition: 時系列データに中心線と上方・下方管理限界線を引き、限界外の点や点の並びの癖から工程の異常を判断する図。
    related: [パレート図]
  - term: パレート図
    reading: パレートず
    aliases: [パレート分析]
    simple: 項目を多い順に棒グラフで並べ、累積の割合を折れ線で重ねた図です。
    definition: 項目を件数等の多い順に並べた棒グラフに累積比率の折れ線を重ねた図。重点的に対策すべき項目の把握や ABC 分析に用いる。
    related: [管理図]
  - term: コミュニケーションチャネル
    reading: コミュニケーションチャネル
    aliases: [伝達経路数]
    simple: メンバーどうしの1対1の連絡の道筋です。n 人なら n(n−1)÷2 本あります。
    definition: メンバー間の1対1の伝達経路。n 人の場合の数は n(n − 1) ÷ 2。
    related: [プッシュ型コミュニケーション]
  - term: プッシュ型コミュニケーション
    reading: プッシュがたコミュニケーション
    simple: メールなどで、特定の相手に情報を送り届ける伝え方です。
    definition: 電子メール、ボイスメール、文書送付など特定の受け手に情報を送る方法。会議など即時にやり取りする方法は双方向コミュニケーションという。
    related: [プル型コミュニケーション]
  - term: プル型コミュニケーション
    reading: プルがたコミュニケーション
    simple: 情報を共有サイトなどに置き、必要な人が自分で取りに行く伝え方です。
    definition: イントラネットや掲示板などに情報を置き、受け手が必要に応じて自らアクセスする方法。多数の受け手への大量の情報提供に向く。
    related: [プッシュ型コミュニケーション]
  - term: 労働者派遣契約
    reading: ろうどうしゃはけんけいやく
    aliases: [派遣契約]
    simple: 派遣会社の社員が派遣先で働き、派遣先が直接仕事の指示を出す契約です。
    definition: 派遣元が雇用する労働者を派遣先に派遣し、派遣先が指揮命令を行う契約。請負等で発注者が直接指揮命令すると偽装請負となる。
    related: [請負契約, 準委任契約]
  - term: 請負契約
    reading: うけおいけいやく
    simple: 仕事を完成させることを約束し、完成した結果に対して報酬を受け取る契約です。
    definition: 受注者が仕事の完成を約束し、発注者がその結果に報酬を支払う契約。受注者は契約不適合責任を負い、要員への指揮命令は受注者が行う。
    related: [準委任契約, 労働者派遣契約]
  - term: 準委任契約
    reading: じゅんいにんけいやく
    simple: 仕事の完成ではなく、決められた業務をきちんと行うことを約束する契約です。
    definition: 法律行為でない事務の処理を委託する契約。受注者は善良な管理者の注意義務を負うが、原則として仕事の完成義務は負わない。
    related: [請負契約]
  - term: RFI
    reading: アールエフアイ
    fullName: Request For Information
    japanese: 情報提供依頼
    words:
      - { en: Request, ja: 依頼 }
      - { en: For Information, ja: 情報を求める }
    simple: 調達の最初に、ベンダーに技術や製品の情報を出してもらうよう頼むことです。
    definition: システム調達の際、ベンダーに技術動向や製品・サービスの情報提供を依頼すること又はその文書。
    related: [RFP]
  - term: RFP
    reading: アールエフピー
    fullName: Request For Proposal
    japanese: 提案依頼書
    words:
      - { en: Request, ja: 依頼 }
      - { en: For Proposal, ja: 提案を求める }
    simple: システムの要件を示して、ベンダーに具体的な提案を出してもらうための文書です。
    definition: 発注者がシステムの要件や条件を示し、ベンダーに提案書の提出を依頼する文書。
    related: [RFI]
  - term: 定額契約
    reading: ていがくけいやく
    aliases: [固定価格契約]
    simple: 最初に決めた金額で支払う契約で、費用が増えても発注者の支払いは変わりません。
    definition: あらかじめ固定した金額を支払う契約タイプ。コスト超過のリスクは受注者が負う。実際のコストに報酬を加える実費償還契約、時間単価と材料費で支払うタイムアンドマテリアル契約と対比される。
    related: [請負契約]
  - term: 有期性
    reading: ゆうきせい
    simple: プロジェクトには、はじまりと終わりがあるという性質です。
    definition: プロジェクトに明確な開始と終了があるという性質。目標を達成するか、達成できないことが明確になったときに終了する。
    related: [プロジェクト, 独自性]
  - term: 独自性
    reading: どくじせい
    simple: プロジェクトは、毎回違う独自の成果を生み出すという性質です。
    definition: プロジェクトが生み出す成果物やサービスが、過去のものと同一ではなく独自のものであるという性質。
    related: [プロジェクト, 有期性]
  - term: 立上げプロセス群
    reading: たちあげぷろせすぐん
    simple: プロジェクトやフェーズを開始するためのプロセスの集まりです。
    definition: 新しいプロジェクトやフェーズを正式に開始する許可を得るためのプロセス群。
    related: [プロジェクトマネジメントのプロセス群, 計画プロセス群]
  - term: 計画プロセス群
    reading: けいかくぷろせすぐん
    simple: プロジェクトの目標と、それを達成する方法を計画するプロセスの集まりです。
    definition: プロジェクトの目標を定め、目標達成のための計画を作成するプロセス群。
    related: [プロジェクトマネジメントのプロセス群, 立上げプロセス群, 実行プロセス群]
  - term: 実行プロセス群
    reading: じっこうぷろせすぐん
    simple: 計画に従って、実際に作業を進めるプロセスの集まりです。
    definition: 計画に基づいて、プロジェクトの作業を実行し、成果物を作成するプロセス群。
    related: [プロジェクトマネジメントのプロセス群, 計画プロセス群, 管理プロセス群]
  - term: 管理プロセス群
    reading: かんりぷろせすぐん
    simple: 計画と実績を比べて、プロジェクトの進捗を監視し、必要な変更を管理するプロセスの集まりです。
    definition: プロジェクトの進捗や成果を測定・監視し、計画との差異を把握して、必要な是正や変更を行うプロセス群。
    related: [プロジェクトマネジメントのプロセス群, 実行プロセス群, 終結プロセス群]
  - term: 終結プロセス群
    reading: しゅうけつぷろせすぐん
    simple: プロジェクトやフェーズを正式に終わらせるためのプロセスの集まりです。
    definition: プロジェクトやフェーズを正式に完了させるためのプロセス群。成果物の受入れ、教訓の収集などを行う。
    related: [プロジェクトマネジメントのプロセス群, 管理プロセス群, 得た教訓]
  - term: 知識エリア
    reading: ちしきえりあ
    simple: PMBOKで、プロジェクトマネジメントの知識を、スコープ、スケジュール、コストなどの分野に分けたものです。
    definition: PMBOK ガイドで、プロジェクトマネジメントの知識をスコープ、スケジュール、コスト、品質、資源、コミュニケーション、リスク、調達、ステークホルダーなどの分野に分けたもの。JIS Q 21500 の対象群に対応する。
    related: [プロジェクトマネジメントの対象群, JIS Q 21500]
  - term: 変更要求
    reading: へんこうようきゅう
    simple: プロジェクトの計画や成果物などを変更したいという、正式な要求です。
    definition: プロジェクトの範囲、計画、成果物などの変更を求める、正式な要求。CCB が審査して承認または却下する。
    related: [CCB, 変更登録簿]
  - term: 変更登録簿
    reading: へんこうとうろくぼ
    simple: 変更要求とその審査結果などを、記録しておく台帳です。
    definition: 提出された変更要求と、その審査の結果、承認の状況などを記録する台帳。
    related: [CCB, 変更要求]
  - term: コストベースライン
    reading: こすとべーすらいん
    simple: プロジェクトの予算を、時間の経過に沿って配分した基準です。
    definition: 承認されたコスト見積りを時間軸に沿って配分した、コストの実績を測る基準。EVM では計画価値（PV）の累計に相当する。
    related: [ベースライン, EVM]
  - term: ステークホルダ登録簿
    reading: すてーくほるだとうろくぼ
    simple: ステークホルダの氏名、役割、期待、影響力などをまとめた一覧です。
    definition: プロジェクトのステークホルダの識別情報、評価情報、分類などを記録した文書。
    related: [ステークホルダ, ステークホルダ分析]
  - term: ステークホルダ分析
    reading: すてーくほるだぶんせき
    simple: ステークホルダの関心や影響力を調べて、対応の方針を考える作業です。
    definition: ステークホルダの関心、期待、影響力、権限などを分析し、適切な関与の方法を決めるための作業。
    related: [ステークホルダ, ステークホルダ登録簿]
  - term: アクティビティ
    reading: あくてぃびてぃ
    aliases: [アクティビティ（作業）]
    simple: ワークパッケージを実現するために行う、作業の単位です。
    definition: ワークパッケージを完成させるために実施する個々の作業。スケジュール作成の単位となる。
    related: [ワークパッケージ, 活動リスト]
  - term: 活動リスト
    reading: かつどうりすと
    simple: プロジェクトで必要なアクティビティを、一覧にしたものです。
    definition: プロジェクトで実施するすべてのアクティビティを、その属性とともに一覧にした文書。
    related: [ワークパッケージ, アクティビティ]
  - term: スコープ規定書
    reading: すこーぷきていしょ
    simple: プロジェクトの範囲と、その範囲に含まれる成果物を記述した文書です。
    definition: プロジェクトの範囲、成果物、除外事項、制約条件などを詳細に記述した文書。スコープの管理の基準となる。
    related: [スコープクリープ]
  - term: 人日
    reading: にんにち
    simple: "1人が1日で行う作業量を1とする、工数の単位です。"
    definition: "1 人が 1 日で行う作業量を表す工数の単位。"
    related: [人月]
  - term: ブルックスの法則
    reading: ぶるっくすのほうそく
    simple: 遅れているプロジェクトに人を追加しても、かえって遅れるという経験則です。
    definition: 遅れているソフトウェア開発プロジェクトに要員を追加すると、教育やコミュニケーションの負担が増えて、さらに遅れるという経験則。
    related: [人月, コミュニケーションチャネル]
  - term: 結合点
    reading: けつごうてん
    simple: アローダイアグラムで、作業の開始や終了を表す点(○)です。
    definition: アローダイアグラムで、作業と作業の結合部分を表す○印の点。イベントともいう。
    related: [アローダイアグラム, ダミー作業]
  - term: ダミー作業
    reading: だみーさぎょう
    simple: 作業の順序関係だけを表すために使う、所要時間0の点線の矢印です。
    definition: アローダイアグラムで、作業の先行関係を表すために使う、作業時間も資源も必要としない点線の矢印。
    related: [アローダイアグラム, 結合点]
  - term: 最早開始日
    reading: さいそうかいしび
    simple: ある作業が、最も早く開始できる日です。
    definition: 先行する作業がすべて最短で完了した場合に、その作業を開始できる最も早い日。
    related: [アローダイアグラム, 最遅開始日, 余裕日数]
  - term: 最遅開始日
    reading: さいちかいしび
    simple: 全体の遅れにならないように、ぎりぎりまで遅らせて開始できる日です。
    definition: プロジェクト全体の完了日に影響しない範囲で、その作業を開始できる最も遅い日。
    related: [アローダイアグラム, 最早開始日, 余裕日数]
  - term: 余裕日数
    reading: よゆうにっすう
    simple: 全体の完了日を遅らせずに、その作業を遅らせられる日数です。
    definition: プロジェクト全体の完了を遅らせずに、その作業を遅らせることのできる日数。クリティカルパス上の作業では 0 になる。
    related: [アローダイアグラム, 最早開始日, 最遅開始日, クリティカルパス]
  - term: 最早結合点時刻
    reading: さいそうけつごうてんじこく
    simple: 結合点に、最も早く到達できる時刻です。
    definition: 先行する作業をすべて最短で行った場合に、その結合点に到達できる最も早い時刻。
    related: [アローダイアグラム, 最遅結合点時刻, 結合点]
  - term: 最遅結合点時刻
    reading: さいちけつごうてんじこく
    simple: 全体の完了を遅らせないために、結合点に遅くとも到達しなければならない時刻です。
    definition: プロジェクト全体の完了時刻を遅らせないために、その結合点に遅くとも到達していなければならない時刻。
    related: [アローダイアグラム, 最早結合点時刻, 結合点]
  - term: クリティカルパス法
    reading: くりてぃかるぱすほう
    fullName: Critical Path Method
    japanese: クリティカルパス法
    aliases: [CPM]
    words:
      - { en: Critical Path, ja: 最も時間のかかる経路 }
      - { en: Method, ja: 手法 }
    simple: クリティカルパスを求め、その経路を重点的に管理してスケジュールを立てる手法です。
    definition: プロジェクトのアクティビティのネットワークからクリティカルパスを特定し、スケジュールの柔軟性を分析してスケジュールを作成・管理する手法。
    related: [クリティカルパス, アローダイアグラム]
  - term: 資源平準化
    reading: しげんへいじゅんか
    simple: 資源の使用量が偏らないように、作業の開始日などを調整することです。
    definition: 資源の需要と供給の制約に合わせて、作業の開始日や終了日を調整し、資源の使用量を平準化する手法。完了日が遅れることがある。
    related: [ファストトラッキング, クリティカルパス]
  - term: ラグ
    reading: らぐ
    simple: 先行作業が終わってから、後続作業が始まるまでの待ち時間(遅れ)です。
    definition: 先行するアクティビティと後続のアクティビティの間に設ける待ち時間。
    related: [PDM, リード]
  - term: リード
    reading: りーど
    simple: 後続の作業を、先行作業が終わる前に前倒しして始められる時間です。
    definition: 先行するアクティビティの完了前に、後続のアクティビティを開始できる、前倒しの時間。
    related: [PDM, ラグ]
  - term: 中日程計画表
    reading: ちゅうにっていけいかくひょう
    simple: 大日程計画をもとに、作業工程ごとなどの、もう少し詳しい日程を示した計画表です。
    definition: 大日程計画を詳細化し、工程ごとの日程や資源の配分を示した計画表。
    related: [大日程計画, 小日程計画表]
  - term: 小日程計画表
    reading: しょうにっていけいかくひょう
    simple: 担当者ごとや作業ごとの、日単位などで作業を示した最も詳細な日程計画表です。
    definition: 中日程計画表をさらに詳細化し、作業者別・設備別に日単位などで作業を割り当てた最も詳細な計画表。
    related: [大日程計画, 中日程計画表]
  - term: 楽観値
    reading: らっかんち
    simple: 最も順調に進んだときの見積り値です。
    definition: 三点見積りで、すべてが順調に進んだ場合の最も楽観的な見積り値（a）。
    related: [三点見積り, 最可能値, 悲観値]
  - term: 最可能値
    reading: さいかのうち
    simple: 最も起こりそうな状況での見積り値です。
    definition: 三点見積りで、最も実現する可能性が高い状況での見積り値（m）。
    related: [三点見積り, 楽観値, 悲観値]
  - term: 悲観値
    reading: ひかんち
    simple: 最も状況が悪かったときの見積り値です。
    definition: 三点見積りで、最悪の状況となった場合の見積り値（b）。
    related: [三点見積り, 楽観値, 最可能値]
  - term: アーンドバリュー
    reading: あーんどばりゅー
    aliases: [出来高, EV]
    simple: ある時点までに完了した作業を、予算の金額で評価した値です。
    definition: ある時点までに完了した作業に対して、計画上割り当てられていた予算額で評価した値（EV）。出来高ともいう。
    related: [EVM, 計画価値, 実コスト]
  - term: 計画価値
    reading: けいかくかち
    aliases: [PV]
    simple: ある時点までに終わっているはずの作業を、予算の金額で評価した値です。
    definition: ある時点までに完了している計画の作業に割り当てた予算額（PV）。
    related: [EVM, アーンドバリュー, 実コスト]
  - term: 実コスト
    reading: じっこすと
    aliases: [AC]
    simple: ある時点までに完了した作業に、実際にかかった費用です。
    definition: ある時点までに完了した作業に対して、実際にかかったコスト（AC）。
    related: [EVM, アーンドバリュー, コスト差異]
  - term: スケジュール差異
    reading: すけじゅーるさい
    aliases: [SV]
    simple: 進捗が計画に対して、進んでいるか遅れているかを金額で示す値です。
    definition: EV から PV を引いた値（SV = EV − PV）。負であれば計画より遅れている。
    related: [EVM, SPI, コスト差異]
  - term: コスト差異
    reading: こすとさい
    aliases: [CV]
    simple: かかった費用が、予算に対して多いか少ないかを示す値です。
    definition: EV から AC を引いた値（CV = EV − AC）。負であれば予算を超過している。
    related: [EVM, コスト効率指数, スケジュール差異]
  - term: SPI
    reading: えすぴーあい
    fullName: Schedule Performance Index
    japanese: スケジュール効率指数
    words:
      - { en: Schedule, ja: 日程 }
      - { en: Performance, ja: 実績 }
      - { en: Index, ja: 指数 }
    simple: 進捗が計画に対して、何倍の速さで進んでいるかを示す指数です。
    definition: EV を PV で割った値（SPI = EV / PV）。1 より小さければ計画より遅れている。
    related: [EVM, スケジュール差異, コスト効率指数]
  - term: コスト効率指数
    reading: こすとこうりつしすう
    simple: かけた費用に対して、どれだけの成果が出ているかを示す指数です。
    definition: EV を AC で割った値（CPI = EV / AC）。1 より小さければ予算を超過している。
    related: [EVM, SPI, コスト差異]
  - term: EAC
    reading: いーえーしー
    fullName: Estimate At Completion
    japanese: 完成時総コスト見積り
    aliases: [完成時総コスト見積り]
    words:
      - { en: Estimate, ja: 見積り }
      - { en: At Completion, ja: 完成時の }
    simple: プロジェクト完了までにかかる総費用の、現時点での予測です。
    definition: プロジェクトが完了した時点での総コストの予測値。一般に EAC = BAC / CPI（コスト効率指数、今後も現在の効率が続くと仮定）で求める。
    related: [EVM, BAC]
  - term: BAC
    reading: びーえーしー
    fullName: Budget At Completion
    japanese: 完成時総予算
    words:
      - { en: Budget, ja: 予算 }
      - { en: At Completion, ja: 完成時の }
    simple: プロジェクト全体の、当初に決めた予算の総額です。
    definition: プロジェクト完了時点までの計画された総予算額。
    related: [EVM, EAC]
  - term: ファンクションポイント
    reading: ふぁんくしょんぽいんと
    aliases: [FP]
    simple: ソフトウェアの規模を、機能の数や複雑さから点数にしたものです。
    definition: ソフトウェアが提供する機能の数と複雑さを点数化して、ソフトウェアの規模を表した値。
    related: [ファンクションポイント法]
  - term: COCOMO II
    reading: こことつー
    simple: COCOMOを改良した、より現代的な開発に対応するソフトウェア開発工数の見積りモデルです。
    definition: COCOMO を改良した見積りモデル。開発の初期から詳細まで、段階に応じた見積りができ、再利用や反復型開発などにも対応する。
    related: [COCOMO]
  - term: リスク転嫁
    reading: りすくてんか
    simple: 保険や外部委託などで、リスクによる影響を他者に移すマイナスのリスクへの戦略です。
    definition: 脅威への対応戦略の一つで、リスクの影響と対応の責任を第三者に移す。保険、契約、保証などを用いる。
    related: [プロジェクトのリスク対応戦略, リスク軽減]
  - term: リスク軽減
    reading: りすくけいげん
    simple: 脅威が起きる確率や影響を、小さくするための戦略です。
    definition: 脅威への対応戦略の一つで、リスクが発生する確率や影響を許容できる程度まで小さくする。
    related: [プロジェクトのリスク対応戦略, リスク転嫁]
  - term: リスクの活用
    reading: りすくのかつよう
    simple: 好機(プラスのリスク)を、確実に実現させる戦略です。
    definition: 好機への対応戦略の一つで、好ましい結果が確実に実現するよう、不確実性を取り除く。
    related: [プロジェクトのリスク対応戦略, リスクの強化]
  - term: リスクの強化
    reading: りすくのきょうか
    simple: 好機(プラスのリスク)が起きる確率や、その効果を大きくする戦略です。
    definition: 好機への対応戦略の一つで、好機の発生確率や影響を大きくするように働きかける。
    related: [プロジェクトのリスク対応戦略, リスクの活用]
  - term: デシジョンツリー分析
    reading: でしじょんつりーぶんせき
    simple: 選択肢ごとに起こりうる結果と確率を木の形で表し、最も良い選択を比べる分析です。
    definition: 意思決定の選択肢と、それぞれから起こり得る結果とその確率を樹形図で表し、期待金額価値を比較して最適な選択肢を判断する分析手法。
    related: [EMV, モンテカルロシミュレーション]
  - term: モンテカルロシミュレーション
    reading: もんてかるろしみゅれーしょん
    simple: 乱数を使って多数回の試行を繰り返し、結果の確率分布を求める方法です。
    definition: 不確実な要因を乱数で何度も発生させて試行を繰り返し、プロジェクトの完了日やコストなどの結果の確率分布を求める手法。
    related: [EMV, デシジョンツリー分析]
  - term: 管理限界線
    reading: かんりげんかいせん
    simple: 管理図で、工程が管理された状態かどうかを判断するための、上下の線です。
    definition: 管理図に引く上方管理限界（UCL）と下方管理限界（LCL）の線。データがこの範囲を超えると、工程に異常があると判断する。
    related: [管理図]
  - term: 双方向コミュニケーション
    reading: そうほうこうこみゅにけーしょん
    simple: 参加者どうしが、情報や意見を交換し合うコミュニケーションです。
    definition: "2 人以上の参加者が、情報や意見を相互にやり取りして理解を共有するコミュニケーション。会議や電話など。"
    related: [プッシュ型コミュニケーション]
  - term: 偽装請負
    reading: ぎそううけおい
    simple: 請負契約を装いながら、実態は発注者が直接指揮命令をしている違法な状態です。
    definition: 契約上は請負や準委任でありながら、実態として発注者が受託側の労働者に直接指揮命令を行っている状態。労働者派遣法に違反する。
    related: [労働者派遣契約, 請負契約]
  - term: 契約不適合責任
    reading: けいやくふてきごうせきにん
    simple: 納品物が契約の内容に合っていないとき、請負人が負う責任です。
    definition: 引き渡された成果物が種類、品質、数量に関して契約の内容に適合しないとき、請負人が負う責任。発注者は追完請求、報酬減額請求、損害賠償請求、解除ができる。
    related: [請負契約]
  - term: 善管注意義務
    reading: ぜんかんちゅういぎむ
    simple: 仕事をするときに、専門家として通常求められる注意をはらう義務です。
    definition: 受任者が、その職業や立場の人に通常期待される程度の注意をはらって業務を行う義務。準委任契約では成果の完成ではなく、この義務を果たすことが求められる。
    related: [準委任契約]
  - term: 実費償還契約
    reading: じっぴしょうかんけいやく
    aliases: [コストプラス契約]
    simple: かかった実費に、手数料や報酬を上乗せして支払う契約です。
    definition: 実際にかかった費用に、あらかじめ決めた報酬や手数料を上乗せして支払う契約形態。コストプラス契約ともいう。
    related: [定額契約, タイムアンドマテリアル契約]
  - term: タイムアンドマテリアル契約
    reading: たいむあんどまてりあるけいやく
    aliases: [T&M契約]
    simple: 作業時間と材料費に応じて支払う契約で、定額契約と実費償還契約の中間的な形態です。
    definition: 作業時間あたりの単価と実際の作業時間、使用した材料費に基づいて支払う契約形態。総額が確定しない点は実費償還契約に似るが、単価は固定である点で定額契約の性質ももつ。
    related: [定額契約, 実費償還契約]
