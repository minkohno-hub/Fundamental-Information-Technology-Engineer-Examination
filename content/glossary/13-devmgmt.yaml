category: ソフトウェア開発管理技術
terms:
  - term: ウォーターフォールモデル
    reading: ウォーターフォールモデル
    simple: 要件定義から設計・プログラミング・テストまで、工程を順番に進める開発モデルです。
    definition: 上流から下流へ工程を順に進め、各工程の成果物を確定させてから次工程に移る開発モデル。管理しやすいが、後工程で誤りが見つかると手戻りが大きい。
    related: [プロトタイピングモデル, スパイラルモデル]
  - term: プロトタイピングモデル
    reading: プロトタイピングモデル
    aliases: [プロトタイピング]
    simple: 試作品を早めに作って利用者に見てもらい、要求をはっきりさせながら進める開発モデルです。
    definition: 開発の初期に試作品（プロトタイプ）を作成して利用者の評価を受け、要求の誤解や漏れを早期に発見する開発モデル。
    related: [ウォーターフォールモデル]
  - term: スパイラルモデル
    reading: スパイラルモデル
    simple: 計画・リスク分析・開発・評価のサイクルを繰り返して、システムを少しずつ大きくする開発モデルです。
    definition: ベームが提唱した、目標設定・リスク分析・開発とテスト・次の計画のサイクルを螺旋状に繰り返す開発モデル。各サイクルでリスク分析を行う。
    related: [ウォーターフォールモデル, 進展的モデル]
  - term: 段階的モデル
    reading: だんかいてきモデル
    aliases: [インクリメンタルモデル]
    simple: 最初に要求を全部決めてから、機能を分けて順番に作り、リリースしていく開発モデルです。
    definition: 開発の最初にシステム全体の要求を確定させ、複数の部分に分割して段階的に開発・リリースするモデル。
    related: [進展的モデル]
  - term: 進展的モデル
    reading: しんてんてきモデル
    aliases: [エボリューショナルモデル, 進化的モデル]
    simple: 最初は要求が全部決まっていない前提で、開発を繰り返しながら要求を固めていく開発モデルです。
    definition: 要求が最初に確定していないことを前提に、開発と評価を繰り返して要求を洗練させ、システムを進化させる開発モデル。
    related: [段階的モデル]
  - term: ソフトウェアプロダクトライン
    reading: ソフトウェアプロダクトライン
    aliases: [コア資産]
    simple: 似た製品の共通部分を部品として整えておき、組み合わせて多くの製品を効率よく作る手法です。
    definition: 製品群の共通性と可変性を分析し、共通部分をコア資産として計画的に整備・再利用して個々の製品を開発する手法。
    related: [ソフトウェア再利用]
  - term: アジャイル
    reading: アジャイル
    aliases: [アジャイル開発, アジャイルソフトウェア開発宣言, アジャイルソフトウェアの12の原則]
    simple: 短い期間で動くソフトウェアを作っては見直すことを繰り返し、変化に素早く対応する開発の考え方です。
    definition: 2001年のアジャイルソフトウェア開発宣言に基づく開発の総称。個人と対話、動くソフトウェア、顧客との協調、変化への対応により価値をおき、12の原則を掲げる。XP やスクラムが代表的。
    related: [XP, スクラム]
  - term: XP
    reading: エックスピー
    fullName: eXtreme Programming
    japanese: エクストリームプログラミング
    aliases: [エクストリームプログラミング]
    words:
      - { en: eXtreme, ja: 極端な }
      - { en: Programming, ja: プログラミング }
    simple: テストを先に書く、2人でプログラムを書くなどの実践項目を決めたアジャイル開発の手法です。
    definition: テスト駆動開発、ペアプログラミング、リファクタリング、ソースコードの共同所有、継続的インテグレーションなどのプラクティスを定めたアジャイル開発手法。
    related: [アジャイル, テスト駆動開発, ペアプログラミング]
  - term: テスト駆動開発
    reading: テストくどうかいはつ
    aliases: [TDD]
    simple: 先にテストを書き、そのテストに合格するようにプログラムを作る開発の進め方です。
    definition: 失敗するテストを書く、合格する最小限のコードを書く、リファクタリングする、の短いサイクルを繰り返す開発手法（Test-Driven Development）。
    related: [リファクタリング, XP]
  - term: ペアプログラミング
    reading: ペアプログラミング
    simple: 2人で1台のコンピュータを使い、1人が書き、もう1人が確認しながらプログラムを作る方法です。
    definition: 2人の開発者が1台のコンピュータで共同してプログラムを作成する XP のプラクティス。役割を交代しながら行い、品質向上と知識共有を図る。
    related: [モブプログラミング, XP]
  - term: モブプログラミング
    reading: モブプログラミング
    aliases: [ドライバー, ナビゲーター]
    simple: チーム全員が1台のコンピュータの前に集まり、交代しながら一緒にプログラムを作る方法です。
    definition: 3人以上のチームが1台のコンピュータで同じ作業を行う手法。キーボードを操作するドライバーと指示・助言するナビゲーターの役割を一定時間ごとに交代する。
    related: [ペアプログラミング]
  - term: リファクタリング
    reading: リファクタリング
    simple: プログラムの動きは変えずに、中身を読みやすく直しやすい形に整理することです。
    definition: ソフトウェアの外部から見た振る舞いを変えずに、内部構造を改善すること。自動テストと組み合わせて行う。
    related: [テスト駆動開発]
  - term: ソースコードの共同所有
    reading: ソースコードのきょうどうしょゆう
    aliases: [共同所有]
    simple: プログラムをチーム全員のものとして、誰でもどこでも直せるようにする考え方です。
    definition: コードの所有権をチーム全体でもち、どの開発者でもシステムのどのコードでも改善できるようにする XP のプラクティス。
    related: [XP]
  - term: 継続的インテグレーション
    reading: けいぞくてきインテグレーション
    aliases: [CI（継続的インテグレーション）]
    simple: 作ったコードをこまめに統合して、自動でビルドとテストを行うことです。
    definition: 開発者の変更を頻繁に共有リポジトリに統合し、自動ビルド・自動テストを実行して問題を早期に発見する実践（Continuous Integration）。
    related: [継続的デリバリー, XP]
  - term: 継続的デリバリー
    reading: けいぞくてきデリバリー
    aliases: [CD（継続的デリバリー）]
    simple: いつでも本番にリリースできる状態を自動的に保ち、本番への反映は人が判断して行うことです。
    definition: 継続的インテグレーションに加えテスト環境等へのデプロイを自動化し、常に本番リリース可能な状態を保つ実践。本番への反映は承認を経て行う（Continuous Delivery）。
    related: [継続的インテグレーション, 継続的デプロイ]
  - term: 継続的デプロイ
    reading: けいぞくてきデプロイ
    aliases: [継続的デプロイメント]
    simple: テストに合格した変更を、本番環境まで自動で反映することです。
    definition: テストに合格した変更を人手を介さずに本番環境まで自動的にリリースする実践。
    related: [継続的デリバリー]
  - term: YAGNI
    reading: ヤグニ
    fullName: You Aren't Gonna Need It
    japanese: それはきっと必要にならない
    words:
      - { en: You, ja: あなたは }
      - { en: "Aren't Gonna", ja: ～しないだろう }
      - { en: Need It, ja: それを必要とする }
    simple: 「いつか使うかも」という機能は作らず、今必要なものだけを作ろうという考え方です。
    definition: 将来必要になるかもしれないという予測で機能を作り込まず、今必要な機能だけをシンプルに実装するという XP の原則。
    related: [XP]
  - term: スクラム
    reading: スクラム
    aliases: [スクラムチーム, スプリントプランニング, インクリメント]
    simple: 短い期間（スプリント）を繰り返し、チームで協力して少しずつ製品を作るアジャイル開発の枠組みです。
    definition: プロダクトオーナー、スクラムマスター、開発者からなるチームが、1か月以内の固定期間のスプリントを繰り返して開発するアジャイル開発のフレームワーク。
    related: [スプリント, プロダクトオーナー, スクラムマスター]
  - term: プロダクトオーナー
    reading: プロダクトオーナー
    simple: スクラムで、作るものの優先順位を決め、製品の価値を最大にする責任をもつ人です。
    definition: プロダクトの価値の最大化に責任をもち、プロダクトバックログの作成・説明・並べ替えを行うスクラムの役割。
    related: [スクラム, プロダクトバックログ]
  - term: スクラムマスター
    reading: スクラムマスター
    aliases: [サーバントリーダー]
    simple: スクラムがうまく実践できるようにチームを支え、邪魔になる問題を取り除く役の人です。
    definition: スクラムの理論と実践をチームと組織が理解できるよう支援し、障害の除去を促すスクラムの役割。チームに奉仕するリーダーとして振る舞う。
    related: [スクラム]
  - term: スプリント
    reading: スプリント
    aliases: [タイムボックス]
    simple: スクラムで繰り返す、1か月以内の決まった長さの開発期間です。
    definition: スクラムにおける1か月以内の固定期間の反復。スプリントプランニング、デイリースクラム、スプリントレビュー、スプリントレトロスペクティブを含む。
    related: [スクラム, デイリースクラム]
  - term: プロダクトバックログ
    reading: プロダクトバックログ
    aliases: [スプリントバックログ, ユーザーストーリー]
    simple: 製品に必要な機能や改善点を、優先順位を付けて並べた一覧です。
    definition: プロダクトの改善に必要なものを並べた一覧。プロダクトオーナーが管理する。スプリントで行う項目と計画をまとめたものをスプリントバックログという。
    related: [プロダクトオーナー]
  - term: デイリースクラム
    reading: デイリースクラム
    simple: 開発者が毎日15分以内で集まり、進み具合を確認して当日の計画を調整する場です。
    definition: 開発者が毎日同じ時間・場所で15分以内で行い、スプリントゴールへの進捗を検査して計画を調整するスクラムのイベント。
    related: [スプリント]
  - term: スプリントレビュー
    reading: スプリントレビュー
    simple: スプリントで作ったものを関係者に見せて、意見をもらう場です。
    definition: スプリントの成果を利害関係者に提示してフィードバックを得、プロダクトバックログを見直すスクラムのイベント。
    related: [スプリント, レトロスペクティブ]
  - term: レトロスペクティブ
    reading: レトロスペクティブ
    aliases: [スプリントレトロスペクティブ, ふりかえり]
    simple: チームのやり方を振り返り、次にどう改善するかを決める場です。
    definition: 人・プロセス・ツールの観点で直近の活動を振り返り、改善策を決める活動。スクラムではスプリントの最後に行う。
    related: [KPT, スプリントレビュー]
  - term: KPT
    reading: ケプト
    fullName: Keep Problem Try
    japanese: 続けること・問題点・次に試すこと
    words:
      - { en: Keep, ja: 続ける }
      - { en: Problem, ja: 問題 }
      - { en: Try, ja: 試す }
    simple: 良かったこと・問題点・次に試すことの3つに分けて振り返る方法です。
    definition: Keep（続けること）、Problem（問題点）、Try（次に試す改善策）に分けて意見を出し合うふりかえりのフレームワーク。
    related: [レトロスペクティブ]
  - term: DevOps
    reading: デブオプス
    fullName: Development and Operations
    japanese: 開発と運用の連携
    words:
      - { en: Development, ja: 開発 }
      - { en: Operations, ja: 運用 }
    simple: 開発する人と運用する人が協力し、自動化も使ってソフトウェアを素早く何度もリリースする取組みです。
    definition: 開発担当者と運用担当者が密接に連携し、CI/CD などの自動化を活用して、ソフトウェアを迅速かつ継続的にリリースする取組み。
    related: [MLOps, DevSecOps, 継続的インテグレーション]
  - term: MLOps
    reading: エムエルオプス
    fullName: Machine Learning Operations
    japanese: 機械学習の開発と運用の連携
    words:
      - { en: Machine Learning, ja: 機械学習 }
      - { en: Operations, ja: 運用 }
    simple: 機械学習のモデルを作る・動かす・見張る・作り直すを、継続的に回す取組みです。
    definition: DevOps の考え方を機械学習に適用し、モデルの学習・デプロイ・監視・再学習のサイクルを継続的かつ自動的に回す取組み。
    related: [DevOps]
  - term: SRE
    reading: エスアールイー
    fullName: Site Reliability Engineering
    japanese: サイト信頼性エンジニアリング
    aliases: [エラーバジェット, トイル]
    words:
      - { en: Site, ja: サイト }
      - { en: Reliability, ja: 信頼性 }
      - { en: Engineering, ja: エンジニアリング }
    simple: ソフトウェア技術で運用を自動化し、サービスの信頼性を高める取組みです。
    definition: Google が提唱した、運用にソフトウェアエンジニアリングを適用する取組み。信頼性の目標（SLO）とエラーバジェットで開発速度と信頼性を両立させ、手作業（トイル）を自動化で削減する。
    related: [DevOps]
  - term: カオスエンジニアリング
    reading: カオスエンジニアリング
    simple: わざと障害を起こして、システムがちゃんと耐えて回復できるかを確かめる手法です。
    definition: 本番環境などで意図的に障害を注入し、システムの回復力を実験的に検証して弱点を改善する手法。
    related: [SRE]
  - term: DevSecOps
    reading: デブセックオプス
    fullName: Development, Security and Operations
    japanese: セキュリティを組み込んだ開発と運用の連携
    aliases: [シフトレフト]
    words:
      - { en: Development, ja: 開発 }
      - { en: Security, ja: セキュリティ }
      - { en: Operations, ja: 運用 }
    simple: 開発から運用までのすべての段階に、セキュリティ対策を組み込む考え方です。
    definition: DevOps にセキュリティを統合し、設計初期から運用までの各工程で継続的・自動的にセキュリティ対策を行う考え方。
    related: [DevOps]
  - term: ソフトウェア再利用
    reading: ソフトウェアさいりよう
    aliases: [再利用, 部品化]
    simple: 一度作ったプログラムの部品を、別の開発でも使い回すことです。
    definition: 既存のソフトウェア部品を他の開発に流用して生産性と品質を高めること。モジュールの独立性を高め、インタフェースを標準化すると再利用しやすくなる。
    related: [ソフトウェアプロダクトライン, モジュール結合度]
  - term: リバースエンジニアリング
    reading: リバースエンジニアリング
    aliases: [フォワードエンジニアリング, コールグラフ]
    simple: できあがったプログラムを調べて、その仕様や設計を明らかにすることです。
    definition: 既存のソフトウェアのソースコードやオブジェクトコードを解析し、仕様や設計情報を導き出すこと。通常の開発の流れをフォワードエンジニアリングという。
    related: [リファクタリング]
  - term: マッシュアップ
    reading: マッシュアップ
    simple: いくつかの Web サービスの API を組み合わせて、新しいサービスを作ることです。
    definition: 複数の Web サービス等が公開する API を組み合わせて新しいサービスを作り出す開発手法。
    related: [API]
  - term: PWA
    reading: ピーダブリューエー
    fullName: Progressive Web Apps
    japanese: プログレッシブウェブアプリ
    words:
      - { en: Progressive, ja: 段階的に機能が向上する }
      - { en: Web Apps, ja: Web アプリケーション }
    simple: Web で作ったアプリなのに、ホーム画面に置けたりオフラインで動いたりするアプリです。
    definition: Web 技術で作成し、Service Worker などによりホーム画面への追加、オフライン動作、プッシュ通知などネイティブアプリに近い機能を提供する Web アプリケーション。
    related: [ネイティブアプリケーション, ハイブリッドアプリケーション]
  - term: ネイティブアプリケーション
    reading: ネイティブアプリケーション
    aliases: [ネイティブアプリ]
    simple: スマートフォンの OS ごとに専用の言語で作り、端末にインストールして使うアプリです。
    definition: OS ごとに提供される開発言語・開発キットで作成し、アプリストア等から配布するアプリケーション。端末の機能を直接利用でき、高速に動作する。
    related: [PWA]
  - term: ハイブリッドアプリケーション
    reading: ハイブリッドアプリケーション
    aliases: [ハイブリッドアプリ, WebView]
    simple: アプリの枠の中で Web の画面を表示する、ネイティブと Web の中間のアプリです。
    definition: ネイティブアプリの枠組みの中で WebView を使い、HTML・CSS・JavaScript で作成した画面を表示するアプリケーション。
    related: [ネイティブアプリケーション, PWA]
  - term: 形式手法
    reading: けいしきしゅほう
    aliases: [形式仕様記述言語, VDM, VDMTools]
    simple: 数学に基づく言葉で仕様を書き、正しいかを論理的に確かめる手法です。
    definition: 数学的基礎をもつ形式仕様記述言語（VDM、Z など）で仕様を厳密に記述し、証明やモデル検査で検証する手法。
    related: [共通フレーム]
  - term: 共通フレーム
    reading: きょうつうフレーム
    aliases: [SLCP-JCF, 共通フレーム2013]
    simple: システムの企画から廃棄までの作業と用語を決めて、発注者と受注者が同じ言葉で話せるようにした枠組みです。
    definition: JIS X 0160 などを基に、ソフトウェアライフサイクルの各プロセス・アクティビティ・タスクと用語を定義した枠組み。取得者と供給者の取引の共通の物差しとする。
    related: [JIS X 0160]
  - term: JIS X 0160
    reading: ジスエックスゼロイチロクゼロ
    aliases: [ISO/IEC 12207, ソフトウェアライフサイクルプロセス]
    simple: ソフトウェアの企画から廃棄までに行う作業（プロセス）を定めた日本産業規格です。
    definition: ソフトウェアライフサイクルプロセス（SLCP）を規定する日本産業規格。国際規格 ISO/IEC 12207 に対応する。
    related: [共通フレーム]
  - term: CMMI
    reading: シーエムエムアイ
    fullName: Capability Maturity Model Integration
    japanese: 能力成熟度モデル統合
    aliases: [成熟度レベル]
    words:
      - { en: Capability, ja: 能力 }
      - { en: Maturity, ja: 成熟度 }
      - { en: Model, ja: モデル }
      - { en: Integration, ja: 統合 }
    simple: 開発組織の仕事の進め方がどれだけ成熟しているかを5段階で表すモデルです。
    definition: 開発組織のプロセスの成熟度を評価し改善を導くモデル。段階表現では初期、管理された、定義された、定量的に管理された、最適化している の5レベルで表す。
    related: [共通フレーム]
  - term: 職務著作
    reading: しょくむちょさく
    aliases: [法人著作, プログラムの著作者]
    simple: 会社の仕事として社員が作ったプログラムなどは、決まりがなければ会社が著作者になるという制度です。
    definition: 法人等の発意に基づき業務従事者が職務上作成した著作物について、別段の定めがない限り法人等を著作者とする著作権法の規定。プログラムは法人名義での公表を要件としない。
    related: [ライセンサー]
  - term: 実施権
    reading: じっしけん
    aliases: [専用実施権, 通常実施権]
    simple: 特許をもつ人から許されて、その発明を使う権利です。独占できる専用実施権と、独占できない通常実施権があります。
    definition: 特許発明を実施する権利。専用実施権は設定範囲内で独占的に実施でき、特許権者も実施できなくなり、登録が効力要件。通常実施権は非独占的で複数者に許諾できる。
    related: [ライセンサー, ライセンシー]
  - term: ライセンサー
    reading: ライセンサー
    simple: 権利をもっていて、ほかの人に使うことを許す側です。
    definition: ライセンス契約で、著作権や特許権などの使用を許諾する権利者。
    related: [ライセンシー]
  - term: ライセンシー
    reading: ライセンシー
    simple: 権利者から許可をもらって、ソフトウェアや技術を使う側です。
    definition: ライセンス契約で、使用の許諾を受ける者。通常、ライセンサーに使用料を支払う。
    related: [ライセンサー]
  - term: DRM
    reading: ディーアールエム
    fullName: Digital Rights Management
    japanese: デジタル著作権管理
    words:
      - { en: Digital, ja: デジタル }
      - { en: Rights, ja: 権利 }
      - { en: Management, ja: 管理 }
    simple: 音楽や動画などのデジタルデータが勝手にコピーされないように守る技術の総称です。
    definition: デジタルコンテンツの利用や複製を暗号化などで制御し、著作権を保護する技術の総称。
    related: [CPRM, コピーガード]
  - term: CPRM
    reading: シーピーアールエム
    fullName: Content Protection for Recordable Media
    japanese: 記録メディア向けコンテンツ保護
    words:
      - { en: Content Protection, ja: コンテンツ保護 }
      - { en: Recordable Media, ja: 記録可能なメディア }
    simple: 録画用の DVD などで、「1回だけ録画できる」といったコピーの制限をかける技術です。
    definition: 記録型 DVD などの記録メディア向けの著作権保護技術。デジタル放送の録画でのコピー制御に用いられる。
    related: [DRM]
  - term: コピーガード
    reading: コピーガード
    simple: DVD などのデータを複製できないようにする技術です。
    definition: 媒体に記録されたコンテンツの複製を防止する技術の総称。
    related: [DRM]
  - term: アクティベーション
    reading: アクティベーション
    aliases: [ライセンス認証]
    simple: ソフトウェアを使う前にメーカーに登録・認証してもらい、不正な使用を防ぐ仕組みです。
    definition: インストール後にライセンス情報と機器情報をメーカーに送信して認証を受け、認証されるまで使用を制限する不正使用防止の仕組み。
    related: [DRM]
  - term: ステージング環境
    reading: ステージングかんきょう
    aliases: [本番環境, 開発環境, テスト環境]
    simple: 本番とほぼ同じ作りの環境で、リリース前に最後の確認をする場所です。
    definition: 本番環境とほぼ同じ構成で用意し、リリース前に本番に近い条件で最終確認を行う環境。
    related: [リリース管理（ソフトウェア）]
  - term: リポジトリ
    reading: リポジトリ
    aliases: [設計データ管理]
    simple: 設計書やソースコードなど、開発の情報をまとめてしまっておく保管庫です。
    definition: 設計書・ソースコードなど開発に関する情報を一元的に格納するデータベース。更新履歴管理、アクセス権管理、検索の機能をもつ。
    related: [バージョン管理]
  - term: バージョン管理
    reading: バージョンかんり
    aliases: [バージョン管理システム, Git, Subversion, ブランチ, マージ]
    simple: ファイルの変更の履歴を残し、いつでも前の版に戻したり比べたりできるようにすることです。
    definition: ファイルの版と変更履歴を管理すること。集中型（Subversion など）と、各自が完全なリポジトリの複製をもつ分散型（Git など）がある。
    related: [リポジトリ, 構成管理（ソフトウェア）]
  - term: ライセンス管理（開発環境）
    reading: ライセンスかんり
    aliases: [ソフトウェアライセンス, 棚卸]
    simple: 持っているライセンスの数と、実際にインストールされている数が合っているかを管理することです。
    definition: 保有ライセンスの数と契約条件、実際のインストール状況（数・バージョン）を台帳で管理し、定期的な棚卸で照合して不正コピーを防ぐこと。
    related: [SBOM]
  - term: 構成管理（ソフトウェア）
    reading: こうせいかんり
    aliases: [ソフトウェア構成管理, ソフトウェア構成品目, 構成管理計画, 構成状況の記録, 構成監査]
    simple: プログラムや文書のどの版を組み合わせたものかを、いつでも正しく分かるように管理することです。
    definition: ソフトウェア構成品目を識別し、ベースラインと変更を管理し、版と状態を記録・監査して構成品目の完全性（一貫性・正確性）を保つ活動。
    related: [変更管理（ソフトウェア）, バージョン管理, SBOM]
  - term: 変更管理（ソフトウェア）
    reading: へんこうかんり
    simple: 変更の依頼を記録し、影響を調べて承認されたものだけを変更する管理です。
    definition: 変更要求を記録し、影響を分析して承認された変更だけを実施し、変更後の構成品目の版と状況を記録する活動。
    related: [構成管理（ソフトウェア）]
  - term: リリース管理（ソフトウェア）
    reading: リリースかんり
    aliases: [保管期間]
    simple: 出荷するソフトウェアの版を記録し、あとで同じものを再現できるように保管する管理です。
    definition: リリースするソフトウェアと文書を版で識別・記録し、出荷した構成を定められた保管期間にわたり再現可能に保管する活動。
    related: [構成管理（ソフトウェア）, バージョン管理]
