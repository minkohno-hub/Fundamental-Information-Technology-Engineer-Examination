category: '13'
terms:
  - term: プロセス成熟度
    reading: ぷろせすせいじゅくど
    simple: 仕事の進め方が、どれだけ組織の仕組みとして定着しているかの度合いです。
    definition: 組織の開発などの進め方が、個人の力量に依存する状態から、標準の手順として定義され、定着し、さらに測定と改善が回る状態へと、どれだけ高まっているかを表す度合い。成熟度を高める取組では、手順の標準化と、その定着の確認が階段になる。
    related: [標準化]
  - term: 部品
    reading: ぶひん
    simple: 再利用できるようにまとめられた、プログラムのまとまりです。
    definition: 特定の機能を担い、他のプログラムから呼び出して使えるようにまとめられたプログラムの単位。検証済みの部品を再利用することで、開発の手間と不具合の混入を抑えられる。再利用の際は、機能とインタフェースが目的に合うことと、利用の権利の条件の確認が必要である。
    related: [ソフトウェア再利用]
  - term: 私的使用
    reading: してきしよう
    simple: 自分や家庭の中だけで楽しむために、著作物をコピーすることです。業務で使うコピーは含まれません。
    definition: 著作権法の定めにより、個人的に又は家庭内その他これに準ずる限られた範囲内で使用することを目的とする場合に、その使用する者が著作物を複製できること。業務での使用を目的とする複製は対象にならない。
    tags: [法務]
