category: 開発管理
terms:
  - term: ツール管理
    reading: ツールかんり
    simple: 開発で使う道具の種類や版を、そろえて管理することです。
    definition: 開発環境管理の対象の一つで、コンパイラやビルドツールなどの種類と版を定めて管理し、開発者間でそろえることで、ビルドの再現性を保つ管理。
    related: [開発環境]
  - term: Webアプリ
    reading: ウェブアプリ
    simple: ブラウザの中で動くアプリケーションです。
    definition: Web ブラウザ上で動作するアプリケーション。OS を問わずに配布・更新できる利点がある一方、端末の機能（通知、カメラなど）の利用には制限がある。端末にインストールして動作するネイティブアプリと対比される。
    related: [ネイティブアプリ]
