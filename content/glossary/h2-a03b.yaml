category: コンピュータ構成要素
terms:
  - term: ブロック化因数
    reading: ぶろっくかいんすう
    simple: 磁気テープなどで、論理レコードを何件まとめて1つのブロックにするかを表す数です。
    definition: 記憶媒体上で1ブロックにまとめる論理レコードの個数。大きくするとブロック間隔の割合が減り、収容量と読取り効率が上がる。
    related: [磁気テープ]
  - term: ポーリング
    reading: ぽーりんぐ
    simple: CPU が周辺装置の状態を一定間隔で自分から確認しにいく方式です。
    definition: プログラム制御方式の入出力で、CPU が周辺装置の状態を定期的に調べ、処理が必要なら入出力を行う方式。入力がなくても確認の負荷が一定にかかる。
    related: [割込み, プログラム制御方式]
  - term: サイクルスチール
    reading: さいくるすちーる
    simple: DMA が転送のためにバスを使う間、CPU のメモリアクセスが待たされることです。
    definition: DMA コントローラがバスの使用権を CPU から一時的に借りてデータ転送を行うこと。その間 CPU はメモリアクセスを待たされる。
    related: [DMA]
  - term: 割込み優先度
    reading: わりこみゆうせんど
    simple: 複数の割込みが重なったとき、どれを先に処理するかを決める順位です。
    definition: 割込み要因ごとに定められた処理の優先順位。高い優先度の割込みは低い割込み処理を中断して実行され、同等以下の要求は待たされる（多重割込み）。
    related: [割込み]
  - term: リフレッシュ
    reading: りふれっしゅ
    simple: DRAM が記憶を忘れないように、定期的に読み出して書き戻す動作です。
    definition: DRAM のメモリセル（コンデンサ）の電荷が放電で失われる前に、内容を読み出して再書込みする動作。SRAM では不要。
    related: [DRAM, SRAM]
  - term: シフトレジスタ
    reading: しふとれじすた
    simple: フリップフロップを並べて、クロックごとにビットを1つずつ隣へずらす回路です。
    definition: 複数のフリップフロップを縦続し、クロックごとに記憶内容を1ビットずつ移動させる順序回路。直並列変換などに使う。
    related: [フリップフロップ]
  - term: 入出力割込み
    reading: にゅうしゅつりょくわりこみ
    simple: 入出力装置が、処理が終わったことなどを CPU に知らせる割込みです。
    definition: 入出力装置や DMA コントローラによる転送の完了や異常を CPU に通知する割込み。CPU の外部要因による外部割込みに分類される。
    related: [外部割込み, DMA]
  - term: カウンタ
    reading: かうんた
    simple: 入力パルスの数を数えて、その値を2進数などで保持する回路です。
    definition: フリップフロップを縦続して構成し、入力パルスの個数を数える順序回路。T フリップフロップを n 段つなぐと 2 の n 乗個を数えて一巡する 2 進カウンタとなる。
    related: [フリップフロップ]
  - term: プログラム制御方式
    reading: ぷろぐらむせいぎょほうしき
    simple: CPU が入出力の転送をすべて自分で行う方式です。
    definition: 入出力装置とのデータ転送を CPU が命令を実行して行う方式。転送の間 CPU が占有され、状態確認にはポーリングを用いることが多い。
    related: [DMA, ポーリング]
  - term: バースト転送
    reading: ばーすととてんそう
    simple: アドレスを1回送って、連続するデータをまとめて転送する方式です。
    definition: 先頭アドレスだけを指定して連続した複数のデータを続けて転送するバスのアクセス方式。アドレス送出などのオーバヘッドの割合が減り実効転送速度が上がる。
    related: [バス]
