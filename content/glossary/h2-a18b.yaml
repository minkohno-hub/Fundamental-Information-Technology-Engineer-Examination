category: '18'
terms:
  - term: 部分最適
    reading: ぶぶんさいてき
    simple: 一部門だけにとっての都合の良さです。
    definition: 部門や部分の範囲の中だけで効率や利益を最大化しようとする考え方。部門ごとの部分最適だけを進めると、部門間の連携が取れず、全体としては非効率になる場合がある。全体最適の視点と対比される。
    related: [全体最適]
  - term: 費用対効果
    reading: ひようたいこうか
    simple: かけた費用に対して、どれだけの効果が得られるかです。
    definition: 投資や施策について、費用と、それによって得られる効果を比べて評価すること。システムの導入では、導入の費用と運用の費用の合計と、効率化などによる効果を、評価の期間全体で合計して比べる。投資の実施の判断材料になる。
    related: [システム化計画]
  - term: 一括発注
    reading: いっかつはっちゅう
    simple: 仕事全体を、まとめて 1 社に委託することです。
    definition: 開発などの仕事の全体を、分割せずに 1 社へ委託する方式。責任の所在が一か所に集まり、会社どうしの調整を受託側の内部で行える利点がある。一方、分割して委託する方式は、各分野の専門性を生かせる反面、境目の責任の切り分けと調整を委託者側が担う必要がある。
    related: [調達]
