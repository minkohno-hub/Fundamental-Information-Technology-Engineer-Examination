category: 情報セキュリティ
terms:
  - term: パスワードスプレー
    reading: ぱすわーどすぷれー
    aliases: [パスワードスプレー攻撃]
    simple: 多くの人のアカウントに、ありがちなパスワードを少しずつ試す攻撃です。
    definition: 多数のアカウントに対して、少数の推測しやすいパスワードを、アカウントごとに少ない回数ずつ試行する攻撃。アカウントごとの失敗回数が少なく、アカウントロックや単一アカウントへの集中を捉える検知をすり抜けやすい。多要素認証と推測しやすいパスワードの禁止が対策になる。
    related: [ブルートフォース攻撃, 多要素認証]
