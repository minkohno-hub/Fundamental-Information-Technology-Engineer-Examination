category: 法規・標準化
terms:
  - term: Apache License
    reading: あぱっちらいせんす
    simple: 商用利用もできる、ゆるやかな条件のオープンソースライセンスです。
    definition: Apache License 2.0 は、商用利用・改変・再頒布を認める寛容型のOSSライセンス。頒布時にはライセンス文と著作権表示、NOTICE ファイルの保持、改変したファイルへの変更の明示が必要だが、ソースコードの開示義務（コピーレフト）はない。特許権の許諾条項を含む。
    related: [著作権]
  - term: 景品表示法
    reading: けいひんひょうじほう
    simple: 消費者を誤解させる広告表示や、過大な景品を禁止する法律です。
    definition: 不当景品類及び不当表示防止法。商品の品質などを実際より著しく優れていると見せる優良誤認表示と、価格などの取引条件を実際より著しく有利であると見せる有利誤認表示を禁止し、あわせて過大な景品類の提供を制限する。
    related: [有利誤認]
  - term: 有利誤認
    reading: ゆうりごにん
    simple: 実際よりも安くて得であるかのように見せる表示のことです。
    definition: 景品表示法で禁止される不当表示の一つ。価格その他の取引条件について、実際のものや競争事業者のものよりも著しく有利であると消費者に誤認させる表示。販売実績の乏しい通常価格と比較する二重価格表示が典型例。
    related: [景品表示法]
