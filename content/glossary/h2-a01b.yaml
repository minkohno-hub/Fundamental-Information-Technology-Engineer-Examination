category: 基礎理論
terms:
  - term: 偏差値
    reading: へんさち
    simple: 平均を 50、標準偏差を 10 に換算した得点で、集団の中での位置を表す値です。
    definition: 偏差値＝50＋10×（得点−平均）／標準偏差。正規分布を仮定すると、偏差値 60 は平均＋1σ、70 は平均＋2σ の位置にあたる。
    related: [標準偏差, 正規分布]
  - term: ハミング距離
    reading: はみんぐきょり
    simple: 同じ長さの 2 つのビット列で、異なっているビットの個数です。
    definition: 同じ長さの符号語どうしで対応するビットが異なる位置の数。符号全体の最小ハミング距離 d により、d−1 ビットまでの誤りを検出でき、⌊(d−1)／2⌋ ビットまでの誤りを訂正できる。
    related: [ハミング符号, パリティチェック]
