category: セキュリティ
terms:
  - term: 機密性
    reading: きみつせい
    fullName: Confidentiality
    japanese: 機密性
    words:
      - { en: Confidentiality, ja: 秘密を守ること }
    simple: 許可された人だけが情報を見たり使ったりできることです。
    definition: 認可されていない個人・エンティティ・プロセスに対して、情報を使用させず、また開示しない特性（情報セキュリティの三要素の一つ）。暗号化やアクセス制御で確保する。
    related: [完全性, 可用性]
  - term: 完全性
    reading: かんぜんせい
    fullName: Integrity
    japanese: 完全性
    aliases: [真正性, 信頼性（セキュリティ）]
    words:
      - { en: Integrity, ja: 完全であること・誠実さ }
    simple: 情報が正確で、勝手に書き換えられていないことです。
    definition: 情報が正確で完全である特性（三要素の一つ）。改ざんの防止・検知（ハッシュ値、デジタル署名、アクセス制御など）で確保する。利用者や情報が主張どおりであることは真正性という。
    related: [機密性, 可用性, ハッシュ関数]
  - term: 可用性
    reading: かようせい
    fullName: Availability
    japanese: 可用性
    words:
      - { en: Availability, ja: 利用できること }
    simple: 使いたいときに、いつでも情報やシステムを使えることです。
    definition: 認可された者が要求したときに、アクセスおよび使用が可能である特性（三要素の一つ）。冗長化やバックアップ、DoS 対策で確保する。
    related: [機密性, 完全性, 稼働率]
  - term: 否認防止
    reading: ひにんぼうし
    fullName: Non-Repudiation
    japanese: 否認防止
    words:
      - { en: Non-, ja: 〜させない }
      - { en: Repudiation, ja: 否認（後から否定すること） }
    simple: 「やっていない」「送っていない」と後から言い逃れできないようにすることです。
    definition: 主張された事象または処置の発生、およびそれを引き起こしたエンティティを証明する能力。デジタル署名、ログ、タイムスタンプで実現する。
    related: [デジタル署名, アカウンタビリティ]
  - term: デジタル署名
    reading: デジタルしょめい
    aliases: [電子署名, 署名鍵, 検証鍵, XMLデジタル署名]
    simple: 電子文書に付ける「本人が作り、改ざんされていない」ことを証明するための仕組みです。
    definition: 送信者が自分の秘密鍵でメッセージ（のハッシュ値）に署名し、受信者が送信者の公開鍵で検証する仕組み。真正性・完全性・否認防止を確保するが、機密性は確保しない。
    related: [公開鍵暗号方式, ハッシュ関数, PKI]
  - term: 多層防御
    reading: たそうぼうぎょ
    aliases: [入口対策, 出口対策, 内部対策, セキュリティバイデザイン, プライバシーバイデザイン]
    simple: 性質の違う対策をいくつも重ねて、1つが破られても守れるようにする考え方です。
    definition: 入口対策・内部対策・出口対策など複数の防御層を組み合わせ、単一の対策の突破で被害が生じないようにする考え方。設計段階からセキュリティを組み込む考え方はセキュリティバイデザインという。
    related: [ファイアウォール]
  - term: 脆弱性
    reading: ぜいじゃくせい
    aliases: [セキュリティホール, バグ, 人的脆弱性, 脆弱性管理, セキュリティパッチ]
    simple: 攻撃などにつけ込まれてしまう弱点のことです。
    definition: 一つ以上の脅威によって付け込まれる可能性のある、資産または管理策の弱点。ソフトウェアの欠陥（セキュリティホール）、設定不備、規程の未整備、人的な不注意などがある。修正プログラムの適用などで管理する。
    related: [脅威, 情報資産, CVSS]
  - term: 脅威
    reading: きょうい
    aliases: [サイバー攻撃, 不正アクセス, 内部不正, 情報漏えい]
    simple: 情報資産に損害を与えるおそれのある出来事や原因のことです。
    definition: システムまたは組織に損害を与える可能性がある、望ましくないインシデントの潜在的な原因。意図的（不正アクセス、内部不正）、偶発的（誤操作、故障）、環境的（災害）なものがある。
    related: [脆弱性, 情報資産]
  - term: 情報資産
    reading: じょうほうしさん
    aliases: [情報資産台帳]
    simple: 組織にとって価値のある情報や、それを扱うシステム・機器・書類などのことです。
    definition: 組織にとって価値をもつ情報および情報を扱う資源（データ、ソフトウェア、ハードウェア、紙媒体、サービス、人など）。所在・管理者・重要度を情報資産台帳で管理する。
    related: [脅威, 脆弱性, リスクアセスメント]
  - term: ソーシャルエンジニアリング
    reading: ソーシャルエンジニアリング
    aliases: [ショルダーハッキング, スキャベンジング, なりすまし]
    simple: 技術ではなく、人の油断やうっかりにつけ込んでパスワードなどを盗む手口です。
    definition: 人間の心理的な隙や行動のミスを突いて機密情報を入手する手法。電話でのなりすまし、のぞき見（ショルダーハッキング）、ごみ箱あさり（スキャベンジング）など。
    related: [ビジネスメール詐欺, 標的型攻撃]
  - term: ビジネスメール詐欺
    reading: ビジネスメールさぎ
    fullName: Business Email Compromise
    japanese: ビジネスメール詐欺
    aliases: [BEC]
    words:
      - { en: Business, ja: 業務の }
      - { en: Email, ja: 電子メール }
      - { en: Compromise, ja: 侵害・乗っ取り }
    simple: 取引先や社長になりすましたメールで、偽の口座にお金を振り込ませる詐欺です。
    definition: 取引先や経営者などになりすました電子メールにより、偽口座への送金などをさせる詐欺。振込先変更などはメール以外の手段で確認することが対策となる。
    related: [ソーシャルエンジニアリング]
  - term: マルウェア
    reading: マルウェア
    aliases: [コンピュータウイルス, ウイルス, ワーム, トロイの木馬, スパイウェア, キーロガー, ルートキット, バックドア, マクロウイルス, ファイルレスマルウェア, RAT]
    simple: コンピュータに害を与える悪意のあるソフトウェアの総称です。
    definition: 悪意をもって作られたソフトウェアの総称。他のプログラムに寄生するウイルス、単独で自己増殖するワーム、有用なソフトを装うトロイの木馬、情報を盗むスパイウェアやキーロガー、侵入の痕跡を隠すルートキット、裏口を作るバックドア、ディスクにファイルを残さないファイルレスマルウェアなどがある。
    related: [ランサムウェア, ボット, マルウェア対策]
  - term: ランサムウェア
    reading: ランサムウェア
    aliases: [二重脅迫, ダブルエクストーション]
    simple: ファイルを暗号化して使えなくし、元に戻す代わりに身代金を要求するマルウェアです。
    definition: データの暗号化や画面ロックで使用不能にし、復旧と引換えに金銭を要求するマルウェア。窃取したデータの公開も脅す二重脅迫の手口もある。オフラインや書換え不能なバックアップが対策となる。
    related: [マルウェア, バックアップ]
  - term: ボット
    reading: ボット
    aliases: [ボットネット, C&Cサーバ]
    simple: 感染したパソコンを攻撃者が遠隔操作できるようにするマルウェアです。
    definition: 感染したコンピュータを外部から遠隔操作可能にするマルウェア。C&C サーバから指令を受けた多数の感染端末（ボットネット）が DDoS 攻撃やスパム送信などを行う。
    related: [マルウェア, DoS攻撃]
  - term: シャドーIT
    reading: シャドーアイティー
    simple: 会社の許可を取らずに、個人のクラウドサービスや私物の端末を仕事に使うことです。
    definition: 組織の情報システム部門が把握・管理していない IT 機器やクラウドサービスを従業員が業務で利用すること。情報漏えいなどのリスクとなる。
    related: [脆弱性]
  - term: 不正のトライアングル
    reading: ふせいのトライアングル
    aliases: [割れ窓理論, 状況的犯罪予防]
    simple: 不正は「機会」「動機」「正当化」の3つがそろったときに起きるという考え方です。
    definition: 機会・動機・正当化の3要素がそろうと不正行為が発生するという理論。内部不正対策では特に機会を減らすことが重要。
    related: [脅威]
  - term: サイバーキルチェーン
    reading: サイバーキルチェーン
    aliases: [ダークウェブ, サイバーテロリズム]
    simple: サイバー攻撃の流れを、偵察から目的達成までの段階に分けて整理したモデルです。
    definition: 標的型攻撃の過程を偵察・武器化・配送・攻撃・インストール・遠隔操作・目的の実行の段階でモデル化したもの。各段階で攻撃を断ち切る対策の検討に用いる。
    related: [標的型攻撃]
  - term: パスワード攻撃
    reading: パスワードこうげき
    aliases: [辞書攻撃, 総当たり攻撃, ブルートフォース攻撃, リバースブルートフォース攻撃, パスワードリスト攻撃, クレデンシャルスタッフィング]
    simple: 他人のパスワードを推測したり、流出したものを使ったりして不正にログインする攻撃です。
    definition: 辞書の単語を試す辞書攻撃、全組合せを試す総当たり攻撃、パスワードを固定し ID を変えるリバースブルートフォース攻撃、流出した ID・パスワードを他サービスで試すパスワードリスト攻撃などがある。
    related: [多要素認証, ソルト]
  - term: クロスサイトスクリプティング
    reading: クロスサイトスクリプティング
    aliases: [XSS, エスケープ処理]
    simple: Web サイトの弱点を突いて、見ている人のブラウザで悪いスクリプトを動かす攻撃です。
    definition: Web アプリケーションが入力値を無害化せずに出力する脆弱性を突き、閲覧者のブラウザで不正なスクリプトを実行させる攻撃。出力時のエスケープ処理が基本対策。
    related: [Webアプリケーションの脆弱性, cookie]
  - term: SQLインジェクション
    reading: エスキューエルインジェクション
    aliases: [プレースホルダ, バインド機構]
    simple: 入力欄に SQL の命令を紛れ込ませて、データベースを不正に操作する攻撃です。
    definition: 入力値に SQL 文の一部を含めて、意図しない SQL を実行させる攻撃。プレースホルダ（バインド機構）の使用が根本的な対策。
    related: [Webアプリケーションの脆弱性, SQL]
  - term: Webアプリケーションの脆弱性
    reading: ウェブアプリケーションのぜいじゃくせい
    aliases: [クロスサイトリクエストフォージェリ, CSRF, ディレクトリトラバーサル, OSコマンドインジェクション, バッファオーバーフロー, クリックジャッキング, セッションハイジャック, ドライブバイダウンロード, セキュアプログラミング]
    simple: Web アプリの作りの弱点で、これを突く攻撃がいろいろあります。
    definition: XSS、SQL インジェクション、CSRF（利用者の意図しない要求を送らせる）、ディレクトリトラバーサル（../ で非公開ファイルを読む）、OS コマンドインジェクション、バッファオーバーフロー、クリックジャッキング、セッションハイジャックなど。セキュアプログラミングと WAF などで対策する。
    related: [クロスサイトスクリプティング, SQLインジェクション, WAF]
  - term: DNSキャッシュポイズニング
    reading: ディーエヌエスキャッシュポイズニング
    simple: DNS サーバに偽の情報を覚えさせて、利用者を偽のサイトに誘導する攻撃です。
    definition: DNS サーバのキャッシュに偽の名前解決情報を注入し、利用者を不正なサーバに誘導する攻撃。DNSSEC が対策となる。
    related: [DNS]
  - term: 中間者攻撃
    reading: ちゅうかんしゃこうげき
    aliases: [Man-in-the-middle攻撃, MITM, MITB攻撃, Man-in-the-browser攻撃]
    simple: 通信する2人の間にこっそり割り込んで、通信を盗み見たり書き換えたりする攻撃です。
    definition: 通信経路の途中に攻撃者が介在し、通信を盗聴・改ざんする攻撃。ブラウザ内のマルウェアが通信を改ざんするものを MITB 攻撃という。
    related: [TLS]
  - term: 標的型攻撃
    reading: ひょうてきがたこうげき
    aliases: [APT, 水飲み場型攻撃, やり取り型攻撃, 標的型メール, SEOポイズニング, フィッシング, スミッシング]
    simple: 特定の組織や人を狙って、時間をかけて巧妙に行う攻撃です。
    definition: 特定の組織・個人を狙い、業務を装ったメールや、標的がよく閲覧するサイトの改ざん（水飲み場型攻撃）などで侵入する攻撃。長期間潜伏するものを APT という。偽サイトに誘導して情報を盗む手口はフィッシング（SMS を使うものはスミッシング）。
    related: [サイバーキルチェーン, ソーシャルエンジニアリング]
  - term: ゼロデイ攻撃
    reading: ゼロデイこうげき
    simple: 弱点の修正プログラムが出る前に、その弱点を突いてくる攻撃です。
    definition: 脆弱性の修正プログラムの提供（または脆弱性の公表）より前に、その脆弱性を悪用する攻撃。
    related: [脆弱性]
  - term: プロンプトインジェクション
    reading: プロンプトインジェクション
    aliases: [敵対的サンプル, Adversarial Examples, データポイズニング, AIに対する脅威, ディープフェイク]
    simple: 生成 AI に悪い指示を紛れ込ませて、本来しないはずの動作をさせる攻撃です。
    definition: 入力や外部データに悪意のある指示を埋め込み、AI に意図しない動作や情報出力をさせる攻撃。AI への脅威には、誤認識させる敵対的サンプル、学習データを汚染するデータポイズニングなどもある。
    related: [LLM]
  - term: DoS攻撃
    reading: ドスこうげき
    fullName: Denial of Service attack
    japanese: サービス妨害攻撃
    aliases: [DDoS攻撃, DDoS]
    words:
      - { en: Denial, ja: 拒否・妨げ }
      - { en: of Service, ja: サービスの }
      - { en: attack, ja: 攻撃 }
    simple: 大量の通信を送りつけて、サーバなどを使えなくする攻撃です。
    definition: 大量の要求や通信で対象を過負荷にし、サービスを提供できなくする攻撃。多数の送信元から行うものを DDoS（Distributed DoS）攻撃という。可用性を損なう。
    related: [ボット, 可用性]
  - term: ポートスキャン
    reading: ポートスキャン
    aliases: [フットプリンティング]
    simple: どのポート（入口）が開いているかを調べて、攻撃できる弱点を探す行為です。
    definition: 対象ホストの各ポートに接続を試み、稼働しているサービスを調べる行為。攻撃の事前調査（フットプリンティング）として行われる。
    related: [ポート番号]
  - term: 共通鍵暗号方式
    reading: きょうつうかぎあんごうほうしき
    aliases: [共通鍵, AES, ブロック暗号, ストリーム暗号, 秘密鍵暗号方式]
    simple: 暗号化と復号に同じ鍵を使う暗号方式です。速いけれど、鍵を安全に渡すのが難しいです。
    definition: 暗号化と復号に同一の鍵を用いる方式（AES など）。処理が高速だが、鍵の配送が課題で、n 人で相互通信するには n(n−1)/2 個の鍵が必要。
    related: [公開鍵暗号方式, ハイブリッド暗号]
  - term: 公開鍵暗号方式
    reading: こうかいかぎあんごうほうしき
    aliases: [公開鍵, 秘密鍵, RSA暗号, ハイブリッド暗号]
    simple: 誰にでも見せてよい「公開鍵」と、自分だけが持つ「秘密鍵」をペアで使う暗号方式です。
    definition: 対になる公開鍵と秘密鍵を用いる方式（RSA など）。受信者の公開鍵で暗号化し受信者の秘密鍵で復号する。n 人で 2n 個の鍵で済むが処理は遅い。共通鍵と組み合わせたハイブリッド暗号が広く使われる。
    related: [共通鍵暗号方式, デジタル署名, PKI]
  - term: ハッシュ関数
    reading: ハッシュかんすう
    aliases: [SHA-256, SHA-2, メッセージダイジェスト, ハッシュ値]
    simple: どんな長さのデータからも決まった長さの「指紋」のような値を作る関数で、元に戻せません。
    definition: 任意長のデータから固定長のハッシュ値を生成する関数。暗号学的ハッシュ関数は一方向性と衝突困難性をもち、改ざん検知やパスワードの保存、デジタル署名に用いる。
    related: [デジタル署名, ソルト]
  - term: 暗号技術
    reading: あんごうぎじゅつ
    aliases: [暗号化, 復号, 危殆化, CRYPTREC暗号リスト, 鍵管理, 暗号利用モード, ストレージ暗号化, データベース暗号化]
    simple: データを第三者に読めない形に変えて守る技術です。
    definition: 平文を鍵を用いて暗号文に変換（暗号化）し、元に戻す（復号）技術。計算能力の向上などで安全性が低下することを危殆化といい、CRYPTREC 暗号リストなどを参照して適切な方式を選ぶ。
    related: [共通鍵暗号方式, 公開鍵暗号方式]
  - term: タイムスタンプ
    reading: タイムスタンプ
    aliases: [時刻認証]
    simple: 電子文書が「その時刻に存在し、その後書き換えられていない」ことを証明する仕組みです。
    definition: 時刻認証局が文書のハッシュ値と時刻を結び付けて証明する仕組み。存在証明と完全性の証明に用いる。
    related: [デジタル署名]
  - term: 多要素認証
    reading: たようそにんしょう
    aliases: [二要素認証, 多段階認証, ワンタイムパスワード, PIN, パスワードレス認証, FIDO, リスクベース認証, チャレンジレスポンス認証, セキュリティトークン, EMV 3-Dセキュア]
    simple: 「知っていること」「持っているもの」「体の特徴」のうち、2種類以上を組み合わせて本人確認する方法です。
    definition: 記憶要素（パスワード等）・所持要素（スマートフォン、IC カード等）・生体要素（指紋等）のうち異なる2つ以上を組み合わせる認証。同じ要素を重ねるものは多段階認証。FIDO は端末内で本人確認し公開鍵暗号で認証するパスワードレス認証の規格。
    related: [生体認証, シングルサインオン]
  - term: シングルサインオン
    reading: シングルサインオン
    aliases: [SSO]
    simple: 1回ログインするだけで、つながっている複数のサービスを使えるようにする仕組みです。
    definition: 一度の認証で、連携する複数のシステムを個別のログインなしに利用できるようにする仕組み。
    related: [多要素認証, OAuth]
  - term: CAPTCHA
    reading: キャプチャ
    fullName: Completely Automated Public Turing test to tell Computers and Humans Apart
    japanese: コンピュータと人間を区別する完全自動化された公開チューリングテスト
    words:
      - { en: Completely Automated, ja: 完全に自動化された }
      - { en: Public Turing test, ja: 公開のチューリングテスト（機械か人かを判定する試験） }
      - { en: to tell Computers and Humans Apart, ja: コンピュータと人間を見分けるための }
    simple: ゆがんだ文字を読ませるなどして、操作しているのが人間かプログラムかを見分ける仕組みです。
    definition: 人間には容易だがプログラムには困難な課題を解かせて、操作者が人間かを判定する仕組み。自動化された不正登録やログイン試行を防ぐ。
    related: [パスワード攻撃]
  - term: 生体認証
    reading: せいたいにんしょう
    aliases: [バイオメトリクス認証, 本人拒否率, 他人受入率, FRR, FAR, 静脈パターン認証, 虹彩認証, 顔認証, 声紋認証]
    simple: 指紋や顔、静脈など、その人の体や行動の特徴を使って本人確認することです。
    definition: 身体的特徴（指紋、静脈、虹彩、顔）や行動的特徴（声紋、署名）による認証。他人受入率（FAR）と本人拒否率（FRR）はトレードオフの関係にある。
    related: [多要素認証]
  - term: PKI
    reading: ピーケーアイ
    fullName: Public Key Infrastructure
    japanese: 公開鍵基盤
    aliases: [認証局, CA, CRL, 証明書失効リスト, OCSP, ルート証明書, トラストアンカー, 中間CA証明書]
    words:
      - { en: Public Key, ja: 公開鍵 }
      - { en: Infrastructure, ja: 基盤 }
    simple: 公開鍵が本当にその人のものだと、信頼できる第三者（認証局）が証明する仕組みです。
    definition: 認証局（CA）がデジタル証明書を発行・失効させることで公開鍵と所有者の対応を保証する基盤。失効情報は CRL や OCSP で確認する。ルート証明書が信頼の起点（トラストアンカー）となる。
    related: [デジタル証明書, 公開鍵暗号方式]
  - term: デジタル証明書
    reading: デジタルしょうめいしょ
    aliases: [公開鍵証明書, サーバ証明書, クライアント証明書, 電子証明書]
    simple: 「この公開鍵はこの人（このサーバ）のものです」と認証局が保証した電子的な証明書です。
    definition: 公開鍵とその所有者の情報に認証局がデジタル署名した証明書。サーバの真正性を示すサーバ証明書、利用者を認証するクライアント証明書などがある。
    related: [PKI, TLS]
  - term: 責任共有モデル
    reading: せきにんきょうゆうモデル
    simple: クラウドのセキュリティを、クラウド事業者と利用者で分担して守るという考え方です。
    definition: クラウドサービスのセキュリティ責任を事業者と利用者で分担するモデル。IaaS・PaaS・SaaS で利用者の責任範囲が異なる。
    related: [クラウドコンピューティング]
  - term: 情報セキュリティインシデント
    reading: じょうほうセキュリティインシデント
    aliases: [インシデント, 情報セキュリティ事象]
    simple: 情報漏えいや不正アクセスなど、情報セキュリティを脅かす重大な出来事です。
    definition: 望まない（予期しない）情報セキュリティ事象のうち、事業運営を危うくする確率や情報セキュリティを脅かす確率が高いもの（JIS Q 27000）。
    related: [CSIRT]
  - term: リスクアセスメント
    reading: リスクアセスメント
    aliases: [リスク特定, リスク評価, リスク基準, リスクマトリックス, リスク所有者]
    simple: どんなリスクがあるかを洗い出し、その大きさを見積もって、対応の必要性を判断する一連の作業です。
    definition: リスク特定・リスク分析・リスク評価からなるプロセス（JIS Q 31000）。起こりやすさと影響からリスクレベルを求め、リスク基準と比較して対応の要否・優先度を決める。
    related: [リスク分析, リスク対応]
  - term: リスク分析
    reading: リスクぶんせき
    aliases: [年間予想損失額, ALE, 定量的リスク分析, 定性的リスク分析]
    simple: リスクが起こる可能性と、起きたときの影響の大きさを見積もることです。
    definition: リスクの起こりやすさと結果（影響）を分析し、リスクレベルを決定すること。定量的分析では年間予想損失額＝1回の損失額×年間発生頻度などで評価する。
    related: [リスクアセスメント]
  - term: リスク対応
    reading: リスクたいおう
    aliases: [リスク回避, リスク低減, リスク移転, リスク共有, リスク保有, リスク受容, 残留リスク, リスクファイナンシング]
    simple: 見つけたリスクに対して、避ける・減らす・他に移す・受け入れる のどれかで対処することです。
    definition: リスク回避（活動の中止）、リスク低減（管理策の実施）、リスク移転・共有（保険、外部委託）、リスク保有（受容）から選択する。対応後に残るリスクを残留リスクという。
    related: [リスクアセスメント]
  - term: コンティンジェンシー計画
    reading: コンティンジェンシーけいかく
    aliases: [緊急時対応計画, 災害復旧計画, DR]
    simple: 災害や大きな障害が起きたときに、どう対応して業務を立て直すかを前もって決めておく計画です。
    definition: 緊急事態の発生時の対応手順・代替手段・連絡体制・復旧手順などを事前に定めた計画。
    related: [BCP, バックアップサイト]
  - term: BCP
    reading: ビーシーピー
    fullName: Business Continuity Plan
    japanese: 事業継続計画
    aliases: [BCM, 事業継続管理]
    words:
      - { en: Business, ja: 事業 }
      - { en: Continuity, ja: 継続 }
      - { en: Plan, ja: 計画 }
    simple: 災害などが起きても、重要な事業を止めない（早く再開する）ための計画です。
    definition: 災害・事故・感染症などの緊急事態においても、重要な業務を継続または早期に復旧するための方針・体制・手順を定めた計画。目標復旧時間（RTO）などを設定する。
    related: [コンティンジェンシー計画]
  - term: 情報セキュリティポリシー
    reading: じょうほうセキュリティポリシー
    aliases: [基本方針, 対策基準, 実施手順, 情報セキュリティ方針]
    simple: 組織として情報をどう守るかの方針とルールをまとめたものです。
    definition: 経営者が定める基本方針、それを実現するための対策基準、具体的な実施手順などで構成される組織の情報セキュリティに関する規程群。定期的に見直す。
    related: [ISMS]
  - term: ISMS
    reading: アイエスエムエス
    fullName: Information Security Management System
    japanese: 情報セキュリティマネジメントシステム
    aliases: [JIS Q 27001, ISO/IEC 27001, JIS Q 27002, ISMS認証, 管理策]
    words:
      - { en: Information Security, ja: 情報セキュリティ }
      - { en: Management, ja: 管理 }
      - { en: System, ja: 仕組み }
    simple: 組織が情報セキュリティを計画・実行・点検・改善し続けるための仕組みです。
    definition: リスクアセスメントに基づき管理策を選択・運用し、PDCA サイクルで継続的に改善する仕組み。要求事項は JIS Q 27001、管理策の指針は JIS Q 27002（組織的・人的・物理的・技術的管理策）。
    related: [情報セキュリティポリシー, リスクアセスメント, PDCA]
  - term: CSIRT
    reading: シーサート
    fullName: Computer Security Incident Response Team
    japanese: コンピュータセキュリティインシデント対応チーム
    aliases: [SOC, JPCERT/CC, JVN, NISC]
    words:
      - { en: Computer Security, ja: コンピュータセキュリティ }
      - { en: Incident, ja: インシデント（事故・事件） }
      - { en: Response, ja: 対応 }
      - { en: Team, ja: チーム }
    simple: セキュリティ事故が起きたときに対応する専門チームです。
    definition: セキュリティインシデントの受付・分析・対応・外部連携を行う組織。ログ等を常時監視・分析する組織は SOC。国内の調整機関に JPCERT/CC、脆弱性情報の公開に JVN がある。
    related: [情報セキュリティインシデント, SIEM]
  - term: PCI DSS
    reading: ピーシーアイディーエスエス
    fullName: Payment Card Industry Data Security Standard
    japanese: ペイメントカード業界データセキュリティ基準
    aliases: [サイバーセキュリティ経営ガイドライン]
    words:
      - { en: Payment Card Industry, ja: 支払カード（クレジットカード）業界 }
      - { en: Data Security, ja: データセキュリティ }
      - { en: Standard, ja: 基準 }
    simple: クレジットカード情報を安全に扱うための国際的なセキュリティ基準です。
    definition: 国際カードブランドが策定した、カード会員データを保護するためのセキュリティ基準。
    related: [ISMS]
  - term: CVSS
    reading: シーブイエスエス
    fullName: Common Vulnerability Scoring System
    japanese: 共通脆弱性評価システム
    aliases: [JISEC, JCMVP, 脆弱性診断]
    words:
      - { en: Common, ja: 共通の }
      - { en: Vulnerability, ja: 脆弱性 }
      - { en: Scoring System, ja: 点数化の仕組み }
    simple: 脆弱性がどのくらい危険かを、共通の基準で 0〜10 の点数にする仕組みです。
    definition: 脆弱性の深刻度をベンダーに依存しない共通の基準で 0.0〜10.0 に数値化する評価手法。
    related: [脆弱性]
  - term: ペネトレーションテスト
    reading: ペネトレーションテスト
    aliases: [侵入テスト, 耐タンパ性]
    simple: 本物の攻撃者と同じ方法で実際に侵入を試みて、弱点を見つけるテストです。
    definition: 許可を得て、攻撃者の手法でシステムへの侵入を試み、脆弱性や対策の有効性を検証するテスト。
    related: [脆弱性, ファジング]
  - term: 情報セキュリティ対策
    reading: じょうほうセキュリティたいさく
    aliases: [人的セキュリティ対策, 技術的セキュリティ対策, 物理的セキュリティ対策, クリアデスク, クリアスクリーン, 入退室管理, 秘密保持契約, 標的型メール訓練, UPS, データマスキング, MDM]
    simple: 情報を守るための対策で、人・技術・物理の3つの面から行います。
    definition: 人的対策（教育・訓練、秘密保持契約）、技術的対策（アクセス制御、暗号化、マルウェア対策、ファイアウォール）、物理的対策（入退室管理、施錠、クリアデスク・クリアスクリーン、UPS）がある。
    related: [多層防御]
  - term: IDS
    reading: アイディーエス
    fullName: Intrusion Detection System
    japanese: 侵入検知システム
    aliases: [フォールスポジティブ, フォールスネガティブ]
    words:
      - { en: Intrusion, ja: 侵入 }
      - { en: Detection, ja: 検知 }
      - { en: System, ja: システム }
    simple: 不正な侵入の兆候を見つけて、管理者に知らせる仕組みです。
    definition: ネットワークやホストを監視して不正侵入を検知し通知するシステム。誤検知をフォールスポジティブ、見逃しをフォールスネガティブという。
    related: [IPS, SIEM]
  - term: IPS
    reading: アイピーエス
    fullName: Intrusion Prevention System
    japanese: 侵入防止システム
    words:
      - { en: Intrusion, ja: 侵入 }
      - { en: Prevention, ja: 防止 }
      - { en: System, ja: システム }
    simple: 不正な侵入を見つけるだけでなく、その通信を自動で止める仕組みです。
    definition: 不正な通信を検知し、自動的に遮断するシステム。
    related: [IDS, ファイアウォール]
  - term: WAF
    reading: ワフ
    fullName: Web Application Firewall
    japanese: Web アプリケーションファイアウォール
    words:
      - { en: Web Application, ja: Web アプリケーション }
      - { en: Firewall, ja: 防火壁（不正な通信を遮る仕組み） }
    simple: Web アプリへの攻撃（SQL インジェクションなど）を通信の中身から見つけて止める仕組みです。
    definition: HTTP 通信の内容を検査し、Web アプリケーションの脆弱性を突く攻撃を検知・遮断する装置・ソフトウェア。
    related: [Webアプリケーションの脆弱性, ファイアウォール]
  - term: ファイアウォール
    reading: ファイアウォール
    aliases: [パケットフィルタリング, UTM, 許可リスト, 拒否リスト]
    simple: ネットワークの境界で、許可された通信だけを通し、不正な通信を遮る仕組みです。
    definition: 内部と外部の間で通信を監視し、ルールに従って通過・遮断を制御する仕組み。IP アドレス・ポート番号・プロトコルで判断するパケットフィルタリング型などがある。複数の機能を統合したものを UTM という。
    related: [DMZ, WAF, IPS]
  - term: DMZ
    reading: ディーエムゼット
    fullName: DeMilitarized Zone
    japanese: 非武装地帯
    words:
      - { en: DeMilitarized, ja: 非武装化された }
      - { en: Zone, ja: 地帯 }
    simple: インターネットと社内ネットワークの間に作る、公開サーバを置くための区画です。
    definition: ファイアウォールで外部とも内部とも分離されたネットワーク区画。公開サーバを置き、侵害時の社内への影響を抑える。
    related: [ファイアウォール]
  - term: マルウェア対策
    reading: マルウェアたいさく
    aliases: [パターンマッチング法, ビヘイビア法, 振る舞い検知, ヒューリスティック法, マルウェア対策ソフト, サンドボックス]
    simple: マルウェアの感染を防いだり、見つけて取り除いたりするための対策です。
    definition: 既知の特徴と照合するパターンマッチング法、動作を監視するビヘイビア法、コードを解析するヒューリスティック法などで検出する。定義ファイルの更新や修正プログラムの適用も重要。
    related: [マルウェア]
  - term: SIEM
    reading: シーム
    fullName: Security Information and Event Management
    japanese: セキュリティ情報・イベント管理
    words:
      - { en: Security Information, ja: セキュリティ情報 }
      - { en: and Event, ja: とイベント（出来事） }
      - { en: Management, ja: 管理 }
    simple: いろいろな機器のログをまとめて分析し、攻撃の兆候を見つける仕組みです。
    definition: 複数の機器のログを集約・相関分析し、脅威を検知して通知する仕組み。
    related: [ログ管理, CSIRT]
  - term: 検疫ネットワーク
    reading: けんえきネットワーク
    simple: 社内ネットワークにつなぐ前に、パソコンが安全な状態かを検査する仕組みです。
    definition: 接続しようとする端末のセキュリティ状態を検査し、基準を満たす端末だけを業務ネットワークに接続させる仕組み。
    related: [マルウェア対策]
  - term: デジタルフォレンジックス
    reading: デジタルフォレンジックス
    aliases: [証拠保全]
    simple: 事件や事故のときに、コンピュータに残った記録を証拠として集めて分析することです。
    definition: 電子的な証拠を保全・収集・分析し、法的証拠能力を確保する技術・手続。
    related: [ログ管理]
  - term: TLS
    reading: ティーエルエス
    fullName: Transport Layer Security
    japanese: トランスポート層セキュリティ
    aliases: [SSL, SSL/TLS, SSH]
    words:
      - { en: Transport Layer, ja: トランスポート層（通信の層の一つ） }
      - { en: Security, ja: セキュリティ }
    simple: 通信を暗号化し、相手が本物かを確認する仕組みで、HTTPS などに使われます。
    definition: 証明書による認証、暗号化、改ざん検知を提供するプロトコル。SSL は前身。遠隔ログインを安全に行うプロトコルは SSH。
    related: [HTTPS, デジタル証明書]
  - term: IPsec
    reading: アイピーセック
    fullName: Security Architecture for Internet Protocol
    japanese: IP のセキュリティアーキテクチャ
    words:
      - { en: IP, ja: インターネットプロトコル }
      - { en: sec (Security), ja: セキュリティ }
    simple: IP のレベルで通信を暗号化・認証する仕組みで、拠点間 VPN などに使われます。
    definition: ネットワーク層で IP パケットの暗号化・認証を行うプロトコル群。インターネット VPN などに用いる。
    related: [VPN, TLS]
  - term: WPA3
    reading: ダブリューピーエースリー
    fullName: Wi-Fi Protected Access 3
    japanese: Wi-Fi 保護アクセス第3版
    aliases: [WPA2, WEP]
    words:
      - { en: Wi-Fi, ja: 無線 LAN }
      - { en: Protected Access, ja: 保護されたアクセス }
    simple: 無線 LAN の通信を守るための最新のセキュリティ規格です。
    definition: 無線 LAN のセキュリティ規格。WPA2 を強化し、パスワード推測に強い認証方式（SAE）などを採用。古い WEP は脆弱で使用すべきでない。
    related: [無線LAN]
  - term: 送信元ドメイン認証
    reading: そうしんもとドメインにんしょう
    aliases: [SPF, DKIM, DMARC, OP25B, SMTP-AUTH, S/MIME, PGP, ベイジアンフィルタリング, スパム対策]
    simple: メールが本当にそのドメインから送られたものかを確かめて、なりすましを防ぐ技術です。
    definition: SPF（正規の送信サーバの IP アドレスと照合）、DKIM（電子署名を DNS 上の公開鍵で検証）、DMARC（認証失敗時の扱いの宣言）など。メールの暗号化・署名には S/MIME や PGP を用いる。
    related: [電子メールのプロトコル]
  - term: OAuth
    reading: オーオース
    aliases: [RADIUS, アクセストークン, 認可]
    simple: パスワードを渡さずに、あるサービスに別のサービスのデータを使う許可を与える仕組みです。
    definition: 利用者の許可に基づき、パスワードを共有せずにアクセストークンでリソースへのアクセスを認可するプロトコル。
    related: [シングルサインオン]
  - term: ハニーポット
    reading: ハニーポット
    simple: わざと狙われやすく見せたおとりのシステムで、攻撃者の手口を観察するために使います。
    definition: 攻撃者を誘い込むためのおとりのシステム。攻撃の手口の観察・分析に用いる。
    related: [IDS]
  - term: ソルト
    reading: ソルト
    simple: パスワードを保存するときに付け足すランダムな値で、解読されにくくします。
    definition: パスワードのハッシュ化の前に付加する利用者ごとのランダム値。事前計算した表（レインボーテーブル）による解読を困難にする。
    related: [ハッシュ関数, パスワード攻撃]
  - term: ファジング
    reading: ファジング
    simple: 想定外のデータを大量に入力して、ソフトウェアの弱点や不具合を見つける検査方法です。
    definition: 異常なデータや予測不能なデータを大量に与え、ソフトウェアの挙動から脆弱性を発見する検査手法。
    related: [ペネトレーションテスト, 脆弱性]
  - term: サプライチェーンリスク
    reading: サプライチェーンリスク
    aliases: [オペレーショナルリスク, 地政学的リスク]
    simple: 取引先や委託先、ソフトウェアの提供元などを経由して、自社が被害を受けるリスクです。
    definition: 取引先、委託先、部品・ソフトウェアの供給元などを経由して生じるリスク。セキュリティの弱い取引先の踏み台化や、更新プログラムへの不正コード混入などがある。
    related: [SBOM, リスクアセスメント]
  - term: ストレッチング
    reading: ストレッチング
    simple: パスワードのハッシュ計算を何千回も繰り返して、総当たりで解読するのに時間がかかるようにする工夫です。
    definition: ハッシュ関数の計算を多数回繰り返してハッシュ値を求めることで、1回の試行にかかる計算時間を増やし、総当たり攻撃や辞書攻撃を困難にする手法。ソルトと併用する。
    related: [ソルト, ハッシュ関数]
  - term: レインボーテーブル
    reading: レインボーテーブル
    simple: パスワードとハッシュ値の対応をあらかじめ計算して効率よくまとめた表で、ハッシュ値から元のパスワードを探すのに使われます。
    definition: 平文とハッシュ値の対応を事前計算し、還元関数で連鎖させて記憶量を抑えた表。ソルトを付加したハッシュには事前計算が使えないため有効な対策となる。
    related: [ソルト, パスワード攻撃]
  - term: 静的解析
    reading: せいてきかいせき
    simple: プログラムを動かさずに、ソースコードを調べて誤りや危険な書き方を見つける方法です。
    definition: プログラムを実行せずにソースコードや実行形式を解析し、構文規約違反、未初期化変数、脆弱性につながる記述などを検出する手法。静的解析ツール（コードオーディタなど）を用いる。
    related: [動的検査]
  - term: 動的検査
    reading: どうてきけんさ
    aliases: [動的解析, 動的テスト]
    simple: プログラムを実際に動かして、その振る舞いから誤りや弱点を見つける方法です。
    definition: プログラムを実行し、入力に対する出力や実行時の挙動を観察して欠陥や脆弱性を検出する手法の総称。テスト実行、ファジング、実行時のメモリ検査などがある。
    related: [静的解析, ファジング]
