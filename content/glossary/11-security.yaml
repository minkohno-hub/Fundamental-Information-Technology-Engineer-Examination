category: セキュリティ
terms:
  - term: 機密性
    reading: きみつせい
    fullName: Confidentiality
    japanese: 機密性
    words:
      - { en: Confidentiality, ja: 秘密を守ること }
    simple: 許可された人だけが情報を見たり使ったりできることです。
    definition: 認可されていない個人・エンティティ・プロセスに対して、情報を使用させず、また開示しない特性（情報セキュリティの三要素の一つ）。暗号化やアクセス制御で確保する。
    related: [完全性, 可用性]
  - term: 完全性
    reading: かんぜんせい
    fullName: Integrity
    japanese: 完全性
    words:
      - { en: Integrity, ja: 完全であること・誠実さ }
    simple: 情報が正確で、勝手に書き換えられていないことです。
    definition: 情報が正確で完全である特性（三要素の一つ）。改ざんの防止・検知（ハッシュ値、デジタル署名、アクセス制御など）で確保する。利用者や情報が主張どおりであることは真正性という。
    related: [機密性, 可用性, ハッシュ関数]
  - term: 可用性
    reading: かようせい
    fullName: Availability
    japanese: 可用性
    words:
      - { en: Availability, ja: 利用できること }
    simple: 使いたいときに、いつでも情報やシステムを使えることです。
    definition: 認可された者が要求したときに、アクセスおよび使用が可能である特性（三要素の一つ）。冗長化やバックアップ、DoS 対策で確保する。
    related: [機密性, 完全性, 稼働率]
  - term: 否認防止
    reading: ひにんぼうし
    fullName: Non-Repudiation
    japanese: 否認防止
    words:
      - { en: Non-, ja: 〜させない }
      - { en: Repudiation, ja: 否認（後から否定すること） }
    simple: 「やっていない」「送っていない」と後から言い逃れできないようにすることです。
    definition: 主張された事象または処置の発生、およびそれを引き起こしたエンティティを証明する能力。デジタル署名、ログ、タイムスタンプで実現する。
    related: [デジタル署名, アカウンタビリティ]
  - term: デジタル署名
    reading: デジタルしょめい
    aliases: [電子署名]
    simple: 電子文書に付ける「本人が作り、改ざんされていない」ことを証明するための仕組みです。
    definition: 送信者が自分の秘密鍵でメッセージ（のハッシュ値）に署名し、受信者が送信者の公開鍵で検証する仕組み。真正性・完全性・否認防止を確保するが、機密性は確保しない。
    related: [公開鍵暗号方式, ハッシュ関数, PKI]
  - term: 多層防御
    reading: たそうぼうぎょ
    simple: 性質の違う対策をいくつも重ねて、1つが破られても守れるようにする考え方です。
    definition: 入口対策・内部対策・出口対策など複数の防御層を組み合わせ、単一の対策の突破で被害が生じないようにする考え方。設計段階からセキュリティを組み込む考え方はセキュリティバイデザインという。
    related: [ファイアウォール]
  - term: 脆弱性
    reading: ぜいじゃくせい
    aliases: [セキュリティホール]
    simple: 攻撃などにつけ込まれてしまう弱点のことです。
    definition: 一つ以上の脅威によって付け込まれる可能性のある、資産または管理策の弱点。ソフトウェアの欠陥（セキュリティホール）、設定不備、規程の未整備、人的な不注意などがある。修正プログラムの適用などで管理する。
    related: [脅威, 情報資産, CVSS]
  - term: 脅威
    reading: きょうい
    simple: 情報資産に損害を与えるおそれのある出来事や原因のことです。
    definition: システムまたは組織に損害を与える可能性がある、望ましくないインシデントの潜在的な原因。意図的（不正アクセス、内部不正）、偶発的（誤操作、故障）、環境的（災害）なものがある。
    related: [脆弱性, 情報資産]
  - term: 情報資産
    reading: じょうほうしさん
    simple: 組織にとって価値のある情報や、それを扱うシステム・機器・書類などのことです。
    definition: 組織にとって価値をもつ情報および情報を扱う資源（データ、ソフトウェア、ハードウェア、紙媒体、サービス、人など）。所在・管理者・重要度を情報資産台帳で管理する。
    related: [脅威, 脆弱性, リスクアセスメント]
  - term: ソーシャルエンジニアリング
    reading: ソーシャルエンジニアリング
    simple: 技術ではなく、人の油断やうっかりにつけ込んでパスワードなどを盗む手口です。
    definition: 人間の心理的な隙や行動のミスを突いて機密情報を入手する手法。電話でのなりすまし、のぞき見（ショルダーハッキング）、ごみ箱あさり（スキャベンジング）など。
    related: [ビジネスメール詐欺, 標的型攻撃]
  - term: ビジネスメール詐欺
    reading: ビジネスメールさぎ
    fullName: Business Email Compromise
    japanese: ビジネスメール詐欺
    aliases: [BEC]
    words:
      - { en: Business, ja: 業務の }
      - { en: Email, ja: 電子メール }
      - { en: Compromise, ja: 侵害・乗っ取り }
    simple: 取引先や社長になりすましたメールで、偽の口座にお金を振り込ませる詐欺です。
    definition: 取引先や経営者などになりすました電子メールにより、偽口座への送金などをさせる詐欺。振込先変更などはメール以外の手段で確認することが対策となる。
    related: [ソーシャルエンジニアリング]
  - term: マルウェア
    reading: マルウェア
    simple: コンピュータに害を与える悪意のあるソフトウェアの総称です。
    definition: 悪意をもって作られたソフトウェアの総称。他のプログラムに寄生するウイルス、単独で自己増殖するワーム、有用なソフトを装うトロイの木馬、情報を盗むスパイウェアやキーロガー、侵入の痕跡を隠すルートキット、裏口を作るバックドア、ディスクにファイルを残さないファイルレスマルウェアなどがある。
    related: [ランサムウェア, ボット, マルウェア対策]
  - term: ランサムウェア
    reading: ランサムウェア
    simple: ファイルを暗号化して使えなくし、元に戻す代わりに身代金を要求するマルウェアです。
    definition: データの暗号化や画面ロックで使用不能にし、復旧と引換えに金銭を要求するマルウェア。窃取したデータの公開も脅す二重脅迫の手口もある。オフラインや書換え不能なバックアップが対策となる。
    related: [マルウェア, バックアップ]
  - term: ボット
    reading: ボット
    simple: 感染したパソコンを攻撃者が遠隔操作できるようにするマルウェアです。
    definition: 感染したコンピュータを外部から遠隔操作可能にするマルウェア。C&C サーバから指令を受けた多数の感染端末（ボットネット）が DDoS 攻撃やスパム送信などを行う。
    related: [マルウェア, DoS攻撃]
  - term: シャドーIT
    reading: シャドーアイティー
    simple: 会社の許可を取らずに、個人のクラウドサービスや私物の端末を仕事に使うことです。
    definition: 組織の情報システム部門が把握・管理していない IT 機器やクラウドサービスを従業員が業務で利用すること。情報漏えいなどのリスクとなる。
    related: [脆弱性]
  - term: 不正のトライアングル
    reading: ふせいのトライアングル
    simple: 不正は「機会」「動機」「正当化」の3つがそろったときに起きるという考え方です。
    definition: 機会・動機・正当化の3要素がそろうと不正行為が発生するという理論。内部不正対策では特に機会を減らすことが重要。
    related: [脅威]
  - term: サイバーキルチェーン
    reading: サイバーキルチェーン
    simple: サイバー攻撃の流れを、偵察から目的達成までの段階に分けて整理したモデルです。
    definition: 標的型攻撃の過程を偵察・武器化・配送・攻撃・インストール・遠隔操作・目的の実行の段階でモデル化したもの。各段階で攻撃を断ち切る対策の検討に用いる。
    related: [標的型攻撃]
  - term: パスワード攻撃
    reading: パスワードこうげき
    simple: 他人のパスワードを推測したり、流出したものを使ったりして不正にログインする攻撃です。
    definition: 辞書の単語を試す辞書攻撃、全組合せを試す総当たり攻撃、パスワードを固定し ID を変えるリバースブルートフォース攻撃、流出した ID・パスワードを他サービスで試すパスワードリスト攻撃などがある。
    related: [多要素認証, ソルト]
  - term: クロスサイトスクリプティング
    reading: クロスサイトスクリプティング
    aliases: [XSS]
    simple: Web サイトの弱点を突いて、見ている人のブラウザで悪いスクリプトを動かす攻撃です。
    definition: Web アプリケーションが入力値を無害化せずに出力する脆弱性を突き、閲覧者のブラウザで不正なスクリプトを実行させる攻撃。出力時のエスケープ処理が基本対策。
    related: [Webアプリケーションの脆弱性, cookie]
  - term: SQLインジェクション
    reading: エスキューエルインジェクション
    simple: 入力欄に SQL の命令を紛れ込ませて、データベースを不正に操作する攻撃です。
    definition: 入力値に SQL 文の一部を含めて、意図しない SQL を実行させる攻撃。プレースホルダ（バインド機構）の使用が根本的な対策。
    related: [Webアプリケーションの脆弱性, SQL]
  - term: Webアプリケーションの脆弱性
    reading: ウェブアプリケーションのぜいじゃくせい
    simple: Web アプリの作りの弱点で、これを突く攻撃がいろいろあります。
    definition: XSS、SQL インジェクション、CSRF（利用者の意図しない要求を送らせる）、ディレクトリトラバーサル（../ で非公開ファイルを読む）、OS コマンドインジェクション、バッファオーバーフロー、クリックジャッキング、セッションハイジャックなど。セキュアプログラミングと WAF などで対策する。
    related: [クロスサイトスクリプティング, SQLインジェクション, WAF]
  - term: DNSキャッシュポイズニング
    reading: ディーエヌエスキャッシュポイズニング
    simple: DNS サーバに偽の情報を覚えさせて、利用者を偽のサイトに誘導する攻撃です。
    definition: DNS サーバのキャッシュに偽の名前解決情報を注入し、利用者を不正なサーバに誘導する攻撃。DNSSEC が対策となる。
    related: [DNS]
  - term: 中間者攻撃
    reading: ちゅうかんしゃこうげき
    aliases: [Man-in-the-middle攻撃, MITM]
    simple: 通信する2人の間にこっそり割り込んで、通信を盗み見たり書き換えたりする攻撃です。
    definition: 通信経路の途中に攻撃者が介在し、通信を盗聴・改ざんする攻撃。ブラウザ内のマルウェアが通信を改ざんするものを MITB 攻撃という。
    related: [TLS]
  - term: 標的型攻撃
    reading: ひょうてきがたこうげき
    aliases: [APT]
    simple: 特定の組織や人を狙って、時間をかけて巧妙に行う攻撃です。
    definition: 特定の組織・個人を狙い、業務を装ったメールや、標的がよく閲覧するサイトの改ざん（水飲み場型攻撃）などで侵入する攻撃。長期間潜伏するものを APT という。偽サイトに誘導して情報を盗む手口はフィッシング（SMS を使うものはスミッシング）。
    related: [サイバーキルチェーン, ソーシャルエンジニアリング]
  - term: ゼロデイ攻撃
    reading: ゼロデイこうげき
    simple: 弱点の修正プログラムが出る前に、その弱点を突いてくる攻撃です。
    definition: 脆弱性の修正プログラムの提供（または脆弱性の公表）より前に、その脆弱性を悪用する攻撃。
    related: [脆弱性]
  - term: プロンプトインジェクション
    reading: プロンプトインジェクション
    simple: 生成 AI に悪い指示を紛れ込ませて、本来しないはずの動作をさせる攻撃です。
    definition: 入力や外部データに悪意のある指示を埋め込み、AI に意図しない動作や情報出力をさせる攻撃。AI への脅威には、誤認識させる敵対的サンプル、学習データを汚染するデータポイズニングなどもある。
    related: [LLM]
  - term: DoS攻撃
    reading: ドスこうげき
    fullName: Denial of Service attack
    japanese: サービス妨害攻撃
    words:
      - { en: Denial, ja: 拒否・妨げ }
      - { en: of Service, ja: サービスの }
      - { en: attack, ja: 攻撃 }
    simple: 大量の通信を送りつけて、サーバなどを使えなくする攻撃です。
    definition: 大量の要求や通信で対象を過負荷にし、サービスを提供できなくする攻撃。多数の送信元から行うものを DDoS（Distributed DoS）攻撃という。可用性を損なう。
    related: [ボット, 可用性]
  - term: ポートスキャン
    reading: ポートスキャン
    simple: どのポート（入口）が開いているかを調べて、攻撃できる弱点を探す行為です。
    definition: 対象ホストの各ポートに接続を試み、稼働しているサービスを調べる行為。攻撃の事前調査（フットプリンティング）として行われる。
    related: [ポート番号]
  - term: 共通鍵暗号方式
    reading: きょうつうかぎあんごうほうしき
    aliases: [秘密鍵暗号方式]
    simple: 暗号化と復号に同じ鍵を使う暗号方式です。速いけれど、鍵を安全に渡すのが難しいです。
    definition: 暗号化と復号に同一の鍵を用いる方式（AES など）。処理が高速だが、鍵の配送が課題で、n 人で相互通信するには n(n−1)/2 個の鍵が必要。
    related: [公開鍵暗号方式, ハイブリッド暗号]
  - term: 公開鍵暗号方式
    reading: こうかいかぎあんごうほうしき
    simple: 誰にでも見せてよい「公開鍵」と、自分だけが持つ「秘密鍵」をペアで使う暗号方式です。
    definition: 対になる公開鍵と秘密鍵を用いる方式（RSA など）。受信者の公開鍵で暗号化し受信者の秘密鍵で復号する。n 人で 2n 個の鍵で済むが処理は遅い。共通鍵と組み合わせたハイブリッド暗号が広く使われる。
    related: [共通鍵暗号方式, デジタル署名, PKI]
  - term: ハッシュ関数
    reading: ハッシュかんすう
    simple: どんな長さのデータからも決まった長さの「指紋」のような値を作る関数で、元に戻せません。
    definition: 任意長のデータから固定長のハッシュ値を生成する関数。暗号学的ハッシュ関数は一方向性と衝突困難性をもち、改ざん検知やパスワードの保存、デジタル署名に用いる。
    related: [デジタル署名, ソルト]
  - term: 暗号技術
    reading: あんごうぎじゅつ
    simple: データを第三者に読めない形に変えて守る技術です。
    definition: 平文を鍵を用いて暗号文に変換（暗号化）し、元に戻す（復号）技術。計算能力の向上などで安全性が低下することを危殆化といい、CRYPTREC 暗号リストなどを参照して適切な方式を選ぶ。
    related: [共通鍵暗号方式, 公開鍵暗号方式]
  - term: タイムスタンプ
    reading: タイムスタンプ
    aliases: [時刻認証]
    simple: 電子文書が「その時刻に存在し、その後書き換えられていない」ことを証明する仕組みです。
    definition: 時刻認証局が文書のハッシュ値と時刻を結び付けて証明する仕組み。存在証明と完全性の証明に用いる。
    related: [デジタル署名]
  - term: 多要素認証
    reading: たようそにんしょう
    simple: 「知っていること」「持っているもの」「体の特徴」のうち、2種類以上を組み合わせて本人確認する方法です。
    definition: 記憶要素（パスワード等）・所持要素（スマートフォン、IC カード等）・生体要素（指紋等）のうち異なる2つ以上を組み合わせる認証。同じ要素を重ねるものは多段階認証。FIDO は端末内で本人確認し公開鍵暗号で認証するパスワードレス認証の規格。
    related: [生体認証, シングルサインオン]
  - term: シングルサインオン
    reading: シングルサインオン
    aliases: [SSO]
    simple: 1回ログインするだけで、つながっている複数のサービスを使えるようにする仕組みです。
    definition: 一度の認証で、連携する複数のシステムを個別のログインなしに利用できるようにする仕組み。
    related: [多要素認証, OAuth]
  - term: CAPTCHA
    reading: キャプチャ
    fullName: Completely Automated Public Turing test to tell Computers and Humans Apart
    japanese: コンピュータと人間を区別する完全自動化された公開チューリングテスト
    words:
      - { en: Completely Automated, ja: 完全に自動化された }
      - { en: Public Turing test, ja: 公開のチューリングテスト（機械か人かを判定する試験） }
      - { en: to tell Computers and Humans Apart, ja: コンピュータと人間を見分けるための }
    simple: ゆがんだ文字を読ませるなどして、操作しているのが人間かプログラムかを見分ける仕組みです。
    definition: 人間には容易だがプログラムには困難な課題を解かせて、操作者が人間かを判定する仕組み。自動化された不正登録やログイン試行を防ぐ。
    related: [パスワード攻撃]
  - term: 生体認証
    reading: せいたいにんしょう
    aliases: [バイオメトリクス認証]
    simple: 指紋や顔、静脈など、その人の体や行動の特徴を使って本人確認することです。
    definition: 身体的特徴（指紋、静脈、虹彩、顔）や行動的特徴（声紋、署名）による認証。他人受入率（FAR）と本人拒否率（FRR）はトレードオフの関係にある。
    related: [多要素認証]
  - term: PKI
    reading: ピーケーアイ
    fullName: Public Key Infrastructure
    japanese: 公開鍵基盤
    words:
      - { en: Public Key, ja: 公開鍵 }
      - { en: Infrastructure, ja: 基盤 }
    simple: 公開鍵が本当にその人のものだと、信頼できる第三者（認証局）が証明する仕組みです。
    definition: 認証局（CA）がデジタル証明書を発行・失効させることで公開鍵と所有者の対応を保証する基盤。失効情報は CRL や OCSP で確認する。ルート証明書が信頼の起点（トラストアンカー）となる。
    related: [デジタル証明書, 公開鍵暗号方式]
  - term: デジタル証明書
    reading: デジタルしょうめいしょ
    aliases: [公開鍵証明書, 電子証明書]
    simple: 「この公開鍵はこの人（このサーバ）のものです」と認証局が保証した電子的な証明書です。
    definition: 公開鍵とその所有者の情報に認証局がデジタル署名した証明書。サーバの真正性を示すサーバ証明書、利用者を認証するクライアント証明書などがある。
    related: [PKI, TLS]
  - term: 責任共有モデル
    reading: せきにんきょうゆうモデル
    simple: クラウドのセキュリティを、クラウド事業者と利用者で分担して守るという考え方です。
    definition: クラウドサービスのセキュリティ責任を事業者と利用者で分担するモデル。IaaS・PaaS・SaaS で利用者の責任範囲が異なる。
    related: [クラウドコンピューティング]
  - term: 情報セキュリティインシデント
    reading: じょうほうセキュリティインシデント
    aliases: [インシデント]
    simple: 情報漏えいや不正アクセスなど、情報セキュリティを脅かす重大な出来事です。
    definition: 望まない（予期しない）情報セキュリティ事象のうち、事業運営を危うくする確率や情報セキュリティを脅かす確率が高いもの（JIS Q 27000）。
    related: [CSIRT]
  - term: リスクアセスメント
    reading: リスクアセスメント
    simple: どんなリスクがあるかを洗い出し、その大きさを見積もって、対応の必要性を判断する一連の作業です。
    definition: リスク特定・リスク分析・リスク評価からなるプロセス（JIS Q 31000）。起こりやすさと影響からリスクレベルを求め、リスク基準と比較して対応の要否・優先度を決める。
    related: [リスク分析, リスク対応]
  - term: リスク分析
    reading: リスクぶんせき
    simple: リスクが起こる可能性と、起きたときの影響の大きさを見積もることです。
    definition: リスクの起こりやすさと結果（影響）を分析し、リスクレベルを決定すること。定量的分析では年間予想損失額＝1回の損失額×年間発生頻度などで評価する。
    related: [リスクアセスメント]
  - term: リスク対応
    reading: リスクたいおう
    simple: 見つけたリスクに対して、避ける・減らす・他に移す・受け入れる のどれかで対処することです。
    definition: リスク回避（活動の中止）、リスク低減（管理策の実施）、リスク移転・共有（保険、外部委託）、リスク保有（受容）から選択する。対応後に残るリスクを残留リスクという。
    related: [リスクアセスメント]
  - term: コンティンジェンシー計画
    reading: コンティンジェンシーけいかく
    aliases: [緊急時対応計画]
    simple: 災害や大きな障害が起きたときに、どう対応して業務を立て直すかを前もって決めておく計画です。
    definition: 緊急事態の発生時の対応手順・代替手段・連絡体制・復旧手順などを事前に定めた計画。
    related: [BCP, バックアップサイト]
  - term: BCP
    reading: ビーシーピー
    fullName: Business Continuity Plan
    japanese: 事業継続計画
    words:
      - { en: Business, ja: 事業 }
      - { en: Continuity, ja: 継続 }
      - { en: Plan, ja: 計画 }
    simple: 災害などが起きても、重要な事業を止めない（早く再開する）ための計画です。
    definition: 災害・事故・感染症などの緊急事態においても、重要な業務を継続または早期に復旧するための方針・体制・手順を定めた計画。目標復旧時間（RTO）などを設定する。
    related: [コンティンジェンシー計画]
  - term: 情報セキュリティポリシー
    reading: じょうほうセキュリティポリシー
    simple: 組織として情報をどう守るかの方針とルールをまとめたものです。
    definition: 経営者が定める基本方針、それを実現するための対策基準、具体的な実施手順などで構成される組織の情報セキュリティに関する規程群。定期的に見直す。
    related: [ISMS]
  - term: ISMS
    reading: アイエスエムエス
    fullName: Information Security Management System
    japanese: 情報セキュリティマネジメントシステム
    words:
      - { en: Information Security, ja: 情報セキュリティ }
      - { en: Management, ja: 管理 }
      - { en: System, ja: 仕組み }
    simple: 組織が情報セキュリティを計画・実行・点検・改善し続けるための仕組みです。
    definition: リスクアセスメントに基づき管理策を選択・運用し、PDCA の考え方で継続的に改善する仕組み。要求事項は JIS Q 27001、管理策の指針は JIS Q 27002（組織的・人的・物理的・技術的管理策）。
    related: [情報セキュリティポリシー, リスクアセスメント, PDCA]
  - term: CSIRT
    reading: シーサート
    fullName: Computer Security Incident Response Team
    japanese: コンピュータセキュリティインシデント対応チーム
    words:
      - { en: Computer Security, ja: コンピュータセキュリティ }
      - { en: Incident, ja: インシデント（事故・事件） }
      - { en: Response, ja: 対応 }
      - { en: Team, ja: チーム }
    simple: セキュリティ事故が起きたときに対応する専門チームです。
    definition: セキュリティインシデントの受付・分析・対応・外部連携を行う組織。ログ等を常時監視・分析する組織は SOC。国内の調整機関に JPCERT/CC、脆弱性情報の公開に JVN がある。
    related: [情報セキュリティインシデント, SIEM]
  - term: PCI DSS
    reading: ピーシーアイディーエスエス
    fullName: Payment Card Industry Data Security Standard
    japanese: ペイメントカード業界データセキュリティ基準
    words:
      - { en: Payment Card Industry, ja: 支払カード（クレジットカード）業界 }
      - { en: Data Security, ja: データセキュリティ }
      - { en: Standard, ja: 基準 }
    simple: クレジットカード情報を安全に扱うための国際的なセキュリティ基準です。
    definition: 国際カードブランドが策定した、カード会員データを保護するためのセキュリティ基準。
    related: [ISMS]
  - term: CVSS
    reading: シーブイエスエス
    fullName: Common Vulnerability Scoring System
    japanese: 共通脆弱性評価システム
    words:
      - { en: Common, ja: 共通の }
      - { en: Vulnerability, ja: 脆弱性 }
      - { en: Scoring System, ja: 点数化の仕組み }
    simple: 脆弱性がどのくらい危険かを、共通の基準で 0〜10 の点数にする仕組みです。
    definition: 脆弱性の深刻度をベンダーに依存しない共通の基準で 0.0〜10.0 に数値化する評価手法。
    related: [脆弱性]
  - term: ペネトレーションテスト
    reading: ペネトレーションテスト
    aliases: [侵入テスト]
    simple: 本物の攻撃者と同じ方法で実際に侵入を試みて、弱点を見つけるテストです。
    definition: 許可を得て、攻撃者の手法でシステムへの侵入を試み、脆弱性や対策の有効性を検証するテスト。
    related: [脆弱性, ファジング]
  - term: 情報セキュリティ対策
    reading: じょうほうセキュリティたいさく
    simple: 情報を守るための対策で、人・技術・物理の3つの面から行います。
    definition: 人的対策（教育・訓練、秘密保持契約）、技術的対策（アクセス制御、暗号化、マルウェア対策、ファイアウォール）、物理的対策（入退室管理、施錠、クリアデスク・クリアスクリーン、UPS）がある。
    related: [多層防御]
  - term: IDS
    reading: アイディーエス
    fullName: Intrusion Detection System
    japanese: 侵入検知システム
    words:
      - { en: Intrusion, ja: 侵入 }
      - { en: Detection, ja: 検知 }
      - { en: System, ja: システム }
    simple: 不正な侵入の兆候を見つけて、管理者に知らせる仕組みです。
    definition: ネットワークやホストを監視して不正侵入を検知し通知するシステム。誤検知をフォールスポジティブ、見逃しをフォールスネガティブという。
    related: [IPS, SIEM]
  - term: IPS
    reading: アイピーエス
    fullName: Intrusion Prevention System
    japanese: 侵入防止システム
    words:
      - { en: Intrusion, ja: 侵入 }
      - { en: Prevention, ja: 防止 }
      - { en: System, ja: システム }
    simple: 不正な侵入を見つけるだけでなく、その通信を自動で止める仕組みです。
    definition: 不正な通信を検知し、自動的に遮断するシステム。
    related: [IDS, ファイアウォール]
  - term: WAF
    reading: ワフ
    fullName: Web Application Firewall
    japanese: Web アプリケーションファイアウォール
    words:
      - { en: Web Application, ja: Web アプリケーション }
      - { en: Firewall, ja: 防火壁（不正な通信を遮る仕組み） }
    simple: Web アプリへの攻撃（SQL インジェクションなど）を通信の中身から見つけて止める仕組みです。
    definition: HTTP 通信の内容を検査し、Web アプリケーションの脆弱性を突く攻撃を検知・遮断する装置・ソフトウェア。
    related: [Webアプリケーションの脆弱性, ファイアウォール]
  - term: ファイアウォール
    reading: ファイアウォール
    simple: ネットワークの境界で、許可された通信だけを通し、不正な通信を遮る仕組みです。
    definition: 内部と外部の間で通信を監視し、ルールに従って通過・遮断を制御する仕組み。IP アドレス・ポート番号・プロトコルで判断するパケットフィルタリング型などがある。複数の機能を統合したものを UTM という。
    related: [DMZ, WAF, IPS]
  - term: DMZ
    reading: ディーエムゼット
    fullName: DeMilitarized Zone
    japanese: 非武装地帯
    words:
      - { en: DeMilitarized, ja: 非武装化された }
      - { en: Zone, ja: 地帯 }
    simple: インターネットと社内ネットワークの間に作る、公開サーバを置くための区画です。
    definition: ファイアウォールで外部とも内部とも分離されたネットワーク区画。公開サーバを置き、侵害時の社内への影響を抑える。
    related: [ファイアウォール]
  - term: マルウェア対策
    reading: マルウェアたいさく
    aliases: [マルウェア対策ソフト]
    simple: マルウェアの感染を防いだり、見つけて取り除いたりするための対策です。
    definition: 既知の特徴と照合するパターンマッチング法、動作を監視するビヘイビア法、コードを解析するヒューリスティック法などで検出する。定義ファイルの更新や修正プログラムの適用も重要。
    related: [マルウェア]
  - term: SIEM
    reading: シーム
    fullName: Security Information and Event Management
    japanese: セキュリティ情報・イベント管理
    words:
      - { en: Security Information, ja: セキュリティ情報 }
      - { en: and Event, ja: とイベント（出来事） }
      - { en: Management, ja: 管理 }
    simple: いろいろな機器のログをまとめて分析し、攻撃の兆候を見つける仕組みです。
    definition: 複数の機器のログを集約・相関分析し、脅威を検知して通知する仕組み。
    related: [ログ管理, CSIRT]
  - term: 検疫ネットワーク
    reading: けんえきネットワーク
    simple: 社内ネットワークにつなぐ前に、パソコンが安全な状態かを検査する仕組みです。
    definition: 接続しようとする端末のセキュリティ状態を検査し、基準を満たす端末だけを業務ネットワークに接続させる仕組み。
    related: [マルウェア対策]
  - term: デジタルフォレンジックス
    reading: デジタルフォレンジックス
    simple: 事件や事故のときに、コンピュータに残った記録を証拠として集めて分析することです。
    definition: 電子的な証拠を保全・収集・分析し、法的証拠能力を確保する技術・手続。
    related: [ログ管理]
  - term: TLS
    reading: ティーエルエス
    fullName: Transport Layer Security
    japanese: トランスポート層セキュリティ
    aliases: [SSL, SSL/TLS]
    words:
      - { en: Transport Layer, ja: トランスポート層（通信の層の一つ） }
      - { en: Security, ja: セキュリティ }
    simple: 通信を暗号化し、相手が本物かを確認する仕組みで、HTTPS などに使われます。
    definition: 証明書による認証、暗号化、改ざん検知を提供するプロトコル。SSL は前身。遠隔ログインを安全に行うプロトコルは SSH。
    related: [HTTPS, デジタル証明書]
  - term: IPsec
    reading: アイピーセック
    fullName: Security Architecture for Internet Protocol
    japanese: IP のセキュリティアーキテクチャ
    words:
      - { en: IP, ja: インターネットプロトコル }
      - { en: sec (Security), ja: セキュリティ }
    simple: IP のレベルで通信を暗号化・認証する仕組みで、拠点間 VPN などに使われます。
    definition: ネットワーク層で IP パケットの暗号化・認証を行うプロトコル群。インターネット VPN などに用いる。
    related: [VPN, TLS]
  - term: WPA3
    reading: ダブリューピーエースリー
    fullName: Wi-Fi Protected Access 3
    japanese: Wi-Fi 保護アクセス第3版
    words:
      - { en: Wi-Fi, ja: 無線 LAN }
      - { en: Protected Access, ja: 保護されたアクセス }
    simple: 無線 LAN の通信を守るための最新のセキュリティ規格です。
    definition: 無線 LAN のセキュリティ規格。WPA2 を強化し、パスワード推測に強い認証方式（SAE）などを採用。古い WEP は脆弱で使用すべきでない。
    related: [無線LAN]
  - term: 送信元ドメイン認証
    reading: そうしんもとドメインにんしょう
    simple: メールが本当にそのドメインから送られたものかを確かめて、なりすましを防ぐ技術です。
    definition: SPF（正規の送信サーバの IP アドレスと照合）、DKIM（電子署名を DNS 上の公開鍵で検証）、DMARC（認証失敗時の扱いの宣言）など。メールの暗号化・署名には S/MIME や PGP を用いる。
    related: [電子メールのプロトコル]
  - term: OAuth
    reading: オーオース
    simple: パスワードを渡さずに、あるサービスに別のサービスのデータを使う許可を与える仕組みです。
    definition: 利用者の許可に基づき、パスワードを共有せずにアクセストークンでリソースへのアクセスを認可するプロトコル。
    related: [シングルサインオン]
  - term: ハニーポット
    reading: ハニーポット
    simple: わざと狙われやすく見せたおとりのシステムで、攻撃者の手口を観察するために使います。
    definition: 攻撃者を誘い込むためのおとりのシステム。攻撃の手口の観察・分析に用いる。
    related: [IDS]
  - term: ソルト
    reading: ソルト
    simple: パスワードを保存するときに付け足すランダムな値で、解読されにくくします。
    definition: パスワードのハッシュ化の前に付加する利用者ごとのランダム値。事前計算した表（レインボーテーブル）による解読を困難にする。
    related: [ハッシュ関数, パスワード攻撃]
  - term: ファジング
    reading: ファジング
    simple: 想定外のデータを大量に入力して、ソフトウェアの弱点や不具合を見つける検査方法です。
    definition: 異常なデータや予測不能なデータを大量に与え、ソフトウェアの挙動から脆弱性を発見する検査手法。
    related: [ペネトレーションテスト, 脆弱性]
  - term: サプライチェーンリスク
    reading: サプライチェーンリスク
    simple: 取引先や委託先、ソフトウェアの提供元などを経由して、自社が被害を受けるリスクです。
    definition: 取引先、委託先、部品・ソフトウェアの供給元などを経由して生じるリスク。セキュリティの弱い取引先の踏み台化や、更新プログラムへの不正コード混入などがある。
    related: [SBOM, リスクアセスメント]
  - term: 真正性
    reading: しんせいせい
    simple: 利用者や情報が、主張どおり本物であることです。
    definition: エンティティ（利用者、情報、プロセスなど）が、主張どおりのものであることを保証する特性。認証などで確保する。完全性（改ざんされていないこと）とは区別される。
    related: [完全性, 機密性, 可用性]
  - term: 信頼性（セキュリティ）
    reading: しんらいせいせきゅりてぃ
    simple: 意図したとおりの動作や結果が、一貫して得られることです。
    definition: 意図した動作と結果が一貫して得られる特性。情報セキュリティの 7 つの特性の一つ。
    related: [完全性, 真正性]
  - term: 署名鍵
    reading: しょめいかぎ
    simple: デジタル署名を作成するときに使う鍵で、送信者の秘密鍵にあたります。
    definition: デジタル署名の生成に使う鍵。公開鍵暗号方式における署名者の秘密鍵。
    related: [デジタル署名, 検証鍵]
  - term: 検証鍵
    reading: けんしょうかぎ
    simple: デジタル署名が正しいかを確かめるときに使う鍵で、送信者の公開鍵にあたります。
    definition: デジタル署名の検証に使う鍵。署名者の公開鍵。
    related: [デジタル署名, 署名鍵]
  - term: XMLデジタル署名
    reading: えっくすえむえるでじたるしょめい
    simple: XML文書に対するデジタル署名を行うための標準規格です。
    definition: XML 文書の全体や一部に対してデジタル署名を行い、改ざん検知と署名者の確認を可能にする標準規格。
    related: [デジタル署名, XML]
  - term: 入口対策
    reading: いりぐちたいさく
    simple: 外部からの攻撃やマルウェアの侵入を、入口で防ぐ対策です。
    definition: ネットワークの境界で外部からの不正アクセスやマルウェアの侵入を防ぐ対策。ファイアウォール、IPS、メールフィルタなど。
    related: [多層防御, 出口対策, 内部対策]
  - term: 出口対策
    reading: でぐちたいさく
    simple: 内部から外部への不正な通信を検知・遮断して、被害の拡大を防ぐ対策です。
    definition: マルウェアに感染した端末から外部への不正な通信（情報の持ち出し、C&C サーバとの通信など）を検知・遮断する対策。
    related: [多層防御, 入口対策, 内部対策]
  - term: 内部対策
    reading: ないぶたいさく
    simple: 侵入された場合に備えて、内部でも被害の拡大を防ぐ対策です。
    definition: 内部への侵入を前提に、アクセス制御、ネットワークの分離、脆弱性対策、監視などにより、内部での被害の拡大を防ぐ対策。
    related: [多層防御, 入口対策, 出口対策]
  - term: セキュリティバイデザイン
    reading: せきゅりてぃばいでざいん
    simple: 企画・設計の段階から、セキュリティを組み込んでおく考え方です。
    definition: システムの企画・設計の初期段階からセキュリティを考慮して組み込み、後から対策を追加するよりもコストを抑えて安全性を高める考え方。
    related: [多層防御, プライバシーバイデザイン]
  - term: プライバシーバイデザイン
    reading: ぷらいばしーばいでざいん
    simple: 企画・設計の段階から、プライバシー保護を組み込んでおく考え方です。
    definition: システムやサービスの企画・設計の段階から、個人情報とプライバシーの保護を組み込む考え方。
    related: [セキュリティバイデザイン]
  - term: バグ
    reading: ばぐ
    simple: プログラムの誤りや不具合のことです。
    definition: プログラムの誤りや欠陥。すべてのバグが脆弱性になるわけではないが、セキュリティ上の欠陥となるバグが脆弱性である。
    related: [脆弱性]
  - term: 人的脆弱性
    reading: じんてきぜいじゃくせい
    simple: 人の不注意や知識不足など、人に起因する弱点です。
    definition: 利用者や管理者の知識不足、不注意、誤操作などの人に起因する弱点。
    related: [脆弱性, ソーシャルエンジニアリング]
  - term: 脆弱性管理
    reading: ぜいじゃくせいかんり
    simple: 脆弱性の情報を集めて、対策(パッチ適用など)を計画的に行う管理です。
    definition: 保有する資産の脆弱性を把握し、評価して、パッチ適用などの対策を計画的に実施する管理活動。
    related: [脆弱性, セキュリティパッチ, CVSS]
  - term: セキュリティパッチ
    reading: せきゅりてぃぱっち
    simple: ソフトウェアの脆弱性を修正するための更新プログラムです。
    definition: ソフトウェアの脆弱性を修正する更新プログラム。公開後は速やかに適用することが重要。
    related: [脆弱性, 脆弱性管理]
  - term: サイバー攻撃
    reading: さいばーこうげき
    simple: コンピュータやネットワークを狙った、悪意のある攻撃です。
    definition: ネットワークを通じて、コンピュータシステムの機密性、完全性、可用性を侵害しようとする悪意のある行為。
    related: [脅威, 不正アクセス]
  - term: 不正アクセス
    reading: ふせいあくせす
    simple: アクセス権のない人が、他人のIDなどを使ってシステムに侵入することです。
    definition: アクセス権限のない者が、他人の ID やパスワードの不正使用、脆弱性の悪用などによってシステムに侵入・利用する行為。不正アクセス禁止法で禁止される。
    related: [脅威, サイバー攻撃]
  - term: 内部不正
    reading: ないぶふせい
    simple: 組織の内部の人が、情報の持ち出しなどの不正を行うことです。
    definition: 従業員や委託先など内部の者による、情報の持ち出し、改ざん、不正な操作などの不正行為。
    related: [脅威, 不正のトライアングル]
  - term: 情報漏えい
    reading: じょうほうろうえい
    simple: 外部に漏れてはいけない情報が、外部に流出してしまうことです。
    definition: 機密情報や個人情報が、意図せずまたは不正に外部へ流出すること。
    related: [脅威, 機密性]
  - term: 情報資産台帳
    reading: じょうほうしさんだいちょう
    simple: 組織がもつ情報資産を、一覧にして管理するための台帳です。
    definition: 組織が保有する情報資産の名称、分類、管理者、重要度などを一覧にした台帳。リスクアセスメントの前提となる。
    related: [情報資産, リスクアセスメント]
  - term: ショルダーハッキング
    reading: しょるだーはっきんぐ
    simple: 肩越しにのぞき見て、パスワードなどを盗む手口です。
    definition: 利用者の背後から、入力中のパスワードや画面を盗み見る行為。
    related: [ソーシャルエンジニアリング, スキャベンジング]
  - term: スキャベンジング
    reading: すきゃべんじんぐ
    aliases: [トラッシング]
    simple: ごみ箱をあさって、捨てられた書類などから情報を盗む手口です。
    definition: ごみ箱に捨てられた書類や記録媒体から、機密情報を探し出して盗む行為。
    related: [ソーシャルエンジニアリング, ショルダーハッキング]
  - term: なりすまし
    reading: なりすまし
    simple: 他人のふりをして、システムを使ったり情報を得たりする行為です。
    definition: 他人の ID や氏名、立場を装って、システムに不正にアクセスしたり、情報を詐取したりする行為。
    related: [ソーシャルエンジニアリング, 真正性]
  - term: コンピュータウイルス
    reading: こんぴゅーたういるす
    aliases: [ウイルス]
    simple: 他のプログラムやファイルに寄生して増える、不正なプログラムです。
    definition: 他のプログラムやファイルに寄生して自己を複製し、感染を拡大する不正プログラム。経済産業省の基準では、自己伝染機能、潜伏機能、発病機能のいずれかをもつプログラム。
    related: [マルウェア, ワーム, トロイの木馬]
  - term: ワーム
    reading: わーむ
    simple: 他のプログラムに寄生せず、ネットワークを通じて自分自身で感染を広げる不正プログラムです。
    definition: 他のプログラムに寄生せず、単独で自己を複製し、ネットワークを介して自ら感染を拡大する不正プログラム。
    related: [マルウェア, コンピュータウイルス]
  - term: トロイの木馬
    reading: とろいのもくば
    simple: 有用なソフトを装ってインストールさせ、裏で不正な動作をする不正プログラムです。
    definition: 有用なソフトウェアを装ってユーザーに実行させ、裏で情報の窃取やバックドアの設置などを行う不正プログラム。自己複製はしない。
    related: [マルウェア, バックドア]
  - term: スパイウェア
    reading: すぱいうぇあ
    simple: 利用者に気付かれずに、情報を収集して外部に送信する不正プログラムです。
    definition: 利用者に気付かれないように個人情報や操作履歴などを収集し、外部に送信する不正プログラム。
    related: [マルウェア, キーロガー]
  - term: キーロガー
    reading: きーろがー
    simple: キーボードの入力を記録して、パスワードなどを盗む不正プログラム(または装置)です。
    definition: キーボードからの入力内容を記録し、パスワードなどを盗み取るプログラムまたは装置。
    related: [マルウェア, スパイウェア]
  - term: ルートキット
    reading: るーときっと
    simple: 侵入した痕跡を隠して、攻撃者が継続して不正に操作できるようにする道具です。
    definition: 侵入に成功した攻撃者が、自身の存在やマルウェアの活動を隠蔽し、システムに継続的にアクセスするために使う不正なツール群。
    related: [マルウェア, バックドア]
  - term: バックドア
    reading: ばっくどあ
    simple: 攻撃者が、正規の手続きを通さずに、あとから侵入できるようにしておく裏口です。
    definition: 認証などの正規の手続きを経ずに、システムに侵入・利用できるようにするために仕掛けられた裏口。
    related: [マルウェア, トロイの木馬, ルートキット]
  - term: マクロウイルス
    reading: まくろういるす
    simple: 文書や表計算ファイルのマクロ機能を悪用して感染するウイルスです。
    definition: Word や Excel などのファイルに組み込まれたマクロ機能を悪用して感染・動作するウイルス。
    related: [マルウェア, コンピュータウイルス]
  - term: ファイルレスマルウェア
    reading: ふぁいるれすまるうぇあ
    simple: ファイルとして保存せず、メモリ上だけで動作して検知を逃れるマルウェアです。
    definition: 実行ファイルをディスクに保存せず、メモリ上や OS 標準の機能（PowerShell など）を悪用して動作するマルウェア。ファイルを対象とした検知を逃れやすい。
    related: [マルウェア, マルウェア対策]
  - term: RAT
    reading: らっと
    fullName: Remote Access Trojan
    japanese: 遠隔操作型ウイルス
    words:
      - { en: Remote Access, ja: 遠隔からのアクセス }
      - { en: Trojan, ja: トロイの木馬 }
    simple: 感染した端末を、外部から遠隔操作できるようにするマルウェアです。
    definition: 感染した端末を遠隔から操作できるようにするマルウェア（遠隔操作型ウイルス）。IPA のシラバスでは Remote Access Trojan とされる。攻撃者に悪用されると、情報の窃取や追加のマルウェアの導入に使われる。正規の遠隔操作ツール（Remote Access Tool）が悪用されることもある。
    related: [マルウェア, バックドア]
  - term: 二重脅迫
    reading: にじゅうきょうはく
    aliases: [ダブルエクストーション]
    simple: データを暗号化して身代金を要求するだけでなく、盗んだデータの公開もちらつかせて脅す手口です。
    definition: ランサムウェアで、データの暗号化による身代金要求に加え、窃取したデータの公開をちらつかせて支払いを迫る手口。バックアップがあっても脅迫が成立する。
    related: [ランサムウェア]
  - term: ボットネット
    reading: ぼっとねっと
    simple: ボットに感染した多数のコンピュータで構成された、攻撃者に操られるネットワークです。
    definition: ボットに感染した多数のコンピュータが、攻撃者の指令で一斉に動くネットワーク。DDoS 攻撃やスパム送信に使われる。
    related: [ボット, C&Cサーバ, DoS攻撃]
  - term: C&Cサーバ
    reading: しーあんどしーさーば
    fullName: Command and Control server
    japanese: 指令サーバ
    words:
      - { en: Command, ja: 命令 }
      - { en: and, ja: と }
      - { en: Control, ja: 制御 }
      - { en: server, ja: サーバ }
    simple: ボットなどに指令を出して、遠隔から操る攻撃者のサーバです。
    definition: マルウェアに感染した端末に指令を出し、情報を受け取る攻撃者側のサーバ。
    related: [ボット, ボットネット]
  - term: 割れ窓理論
    reading: われまどりろん
    simple: 小さな乱れを放置すると、大きな犯罪につながるという考え方です。
    definition: 割れた窓を放置すると、管理されていない印象を与えて犯罪が増えるという理論。小さな不正を見逃さないことが重要だとされる。
    related: [不正のトライアングル, 状況的犯罪予防]
  - term: 状況的犯罪予防
    reading: じょうきょうてきはんざいよぼう
    simple: 犯罪を起こしにくい環境を作ることで、犯罪を防ぐ考え方です。
    definition: 犯罪者の性格ではなく、犯罪の機会を減らす環境を整えることで犯罪を予防するという考え方。
    related: [不正のトライアングル, 割れ窓理論]
  - term: ダークウェブ
    reading: だーくうぇぶ
    simple: 通常の検索では見つからず、特殊なソフトでしかアクセスできない、匿名性の高いWebの領域です。
    definition: 通常の検索エンジンではアクセスできず、Tor などの専用ソフトを使ってアクセスする匿名性の高い Web 領域。盗まれた情報や不正ツールの取引にも使われる。
    related: [サイバーキルチェーン]
  - term: サイバーテロリズム
    reading: さいばーてろりずむ
    simple: 重要な社会基盤などを、サイバー攻撃で破壊しようとするテロ行為です。
    definition: 電力、金融、交通などの重要な社会基盤のシステムを標的にした、サイバー攻撃によるテロ行為。
    related: [サイバーキルチェーン, サイバー攻撃]
  - term: 辞書攻撃
    reading: じしょこうげき
    simple: パスワードによく使われる単語の一覧を、片っ端から試す攻撃です。
    definition: 辞書に載っている単語や、よく使われるパスワードの一覧を順に試して、パスワードを破る攻撃。
    related: [パスワード攻撃, 総当たり攻撃]
  - term: 総当たり攻撃
    reading: そうあたりこうげき
    aliases: [ブルートフォース攻撃]
    simple: 考えられるすべての文字の組合せを、順番にすべて試す攻撃です。
    definition: 文字の可能なすべての組合せを、順に試すことでパスワードや暗号鍵を破る攻撃。ブルートフォース攻撃ともいう。
    related: [パスワード攻撃, 辞書攻撃, リバースブルートフォース攻撃]
  - term: リバースブルートフォース攻撃
    reading: りばーすぶるーとふぉーすこうげき
    simple: パスワードを固定して、IDのほうを次々に変えて試す攻撃です。
    definition: よく使われるパスワードを固定し、ID を次々に変えて試す攻撃。アカウントロックを回避しやすい。
    related: [パスワード攻撃, 総当たり攻撃]
  - term: パスワードリスト攻撃
    reading: ぱすわーどりすとこうげき
    aliases: [クレデンシャルスタッフィング]
    simple: 他のサイトから流出したIDとパスワードの組を使って、ログインを試みる攻撃です。
    definition: 他のサービスから流出した ID とパスワードの組を用いてログインを試みる攻撃。パスワードの使い回しを悪用する。
    related: [パスワード攻撃, 多要素認証]
  - term: エスケープ処理
    reading: えすけーぷしょり
    simple: 特別な意味をもつ文字を、無害な表記に置き換える処理です。
    definition: HTML や SQL などで特別な意味をもつ文字（< や ' など）を、別の表記に置き換えて、文字として扱わせる処理。XSS などの対策になる。
    related: [クロスサイトスクリプティング, SQLインジェクション]
  - term: プレースホルダ
    reading: ぷれーすほるだ
    aliases: [バインド機構]
    simple: SQL文の中に値を入れる場所を用意しておき、後から値を安全に埋め込む仕組みです。
    definition: SQL 文の中のパラメータ部分を記号で表しておき、後から値を割り当てる（バインドする）仕組み。値が SQL 文の構文として解釈されないため、SQL インジェクションの根本的な対策となる。
    related: [SQLインジェクション, エスケープ処理]
  - term: クロスサイトリクエストフォージェリ
    reading: くろすさいとりくえすとふぉーじぇり
    aliases: [CSRF]
    simple: ログイン中の利用者に、意図しない操作(購入や送信など)を勝手に行わせる攻撃です。
    definition: Web サイトにログインしている利用者のブラウザを悪用し、利用者の意図しない処理を実行させる攻撃。トークンの確認や再認証で対策する。
    related: [Webアプリケーションの脆弱性, セッションハイジャック]
  - term: ディレクトリトラバーサル
    reading: でぃれくとりとらばーさる
    simple: 「../」などを使って、公開されていないディレクトリのファイルにアクセスする攻撃です。
    definition: ファイル名を指定する入力値に「../」などを含めて、本来アクセスできないディレクトリのファイルを読み書きする攻撃。
    related: [Webアプリケーションの脆弱性, 相対パス]
  - term: OSコマンドインジェクション
    reading: おーえすこまんどいんじぇくしょん
    simple: 入力値に不正なコマンドを混ぜて、サーバのOS上で勝手に実行させる攻撃です。
    definition: 外部から与えられた入力値を OS コマンドの引数として使うアプリケーションで、不正なコマンドを混入して実行させる攻撃。
    related: [Webアプリケーションの脆弱性, SQLインジェクション]
  - term: バッファオーバーフロー
    reading: ばっふぁおーばーふろー
    simple: 用意したメモリ領域より多くのデータを書き込ませて、プログラムを乗っ取る攻撃です。
    definition: バッファとして確保した領域を超えるデータを書き込み、隣接する領域を上書きして、任意のコードを実行させるなどの攻撃。
    related: [Webアプリケーションの脆弱性, セキュアプログラミング]
  - term: クリックジャッキング
    reading: くりっくじゃっきんぐ
    simple: 透明なページを重ねて、利用者に意図しない場所をクリックさせる攻撃です。
    definition: 正規のページの上に透明な不正ページを重ねて表示し、利用者に気付かれないように意図しない操作をクリックさせる攻撃。
    related: [Webアプリケーションの脆弱性]
  - term: セッションハイジャック
    reading: せっしょんはいじゃっく
    simple: 利用者のセッションIDを盗んで、その利用者になりすます攻撃です。
    definition: 利用者のセッション ID を盗み出したり推測したりして、その利用者になりすます攻撃。
    related: [Webアプリケーションの脆弱性, セッションID]
  - term: ドライブバイダウンロード
    reading: どらいぶばいだうんろーど
    simple: Webサイトを見ただけで、利用者の気付かないうちにマルウェアをダウンロードさせる攻撃です。
    definition: 改ざんされた Web サイトなどを閲覧しただけで、ブラウザの脆弱性を悪用して、利用者に気付かれずにマルウェアをダウンロード・感染させる攻撃。
    related: [Webアプリケーションの脆弱性, マルウェア]
  - term: セキュアプログラミング
    reading: せきゅあぷろぐらみんぐ
    simple: 脆弱性を作り込まないように注意して、プログラムを書くことです。
    definition: 脆弱性を作り込まないよう、入力値の検証、エスケープ処理、メモリ操作の安全化などの原則に沿ってプログラミングすること。
    related: [Webアプリケーションの脆弱性, バッファオーバーフロー]
  - term: MITB攻撃
    reading: えむあいてぃーびーこうげき
    aliases: [Man-in-the-browser攻撃]
    simple: 利用者のブラウザ内にマルウェアを潜ませて、通信の内容を書き換える攻撃です。
    definition: ブラウザに感染したマルウェアが、利用者と Web サイトの間の通信内容（振込先など）を書き換える攻撃。通信が暗号化されていても成立する。
    related: [中間者攻撃, マルウェア]
  - term: 水飲み場型攻撃
    reading: みずのみばがたこうげき
    simple: 標的がよく見るWebサイトを改ざんして待ち構え、マルウェアに感染させる攻撃です。
    definition: 標的組織の関係者がよく閲覧する Web サイトをあらかじめ改ざんし、閲覧した際にマルウェアに感染させる攻撃。
    related: [標的型攻撃, ドライブバイダウンロード]
  - term: やり取り型攻撃
    reading: やりとりがたこうげき
    simple: 無害なメールのやり取りで信用させてから、マルウェア付きのメールを送る攻撃です。
    definition: 標的と複数回メールをやり取りして信頼させた後に、マルウェアを添付したメールなどを送って感染させる標的型攻撃。
    related: [標的型攻撃, 標的型メール]
  - term: 標的型メール
    reading: ひょうてきがためーる
    simple: 特定の組織や人を狙って、業務に関係あるように装って送る不正なメールです。
    definition: 特定の組織や人を狙って、業務連絡などを装って送られる不正なメール。マルウェア付きの添付ファイルや不正サイトへのリンクを含む。
    related: [標的型攻撃, 標的型メール訓練]
  - term: SEOポイズニング
    reading: えすいーおーぽいずにんぐ
    simple: 検索結果の上位に、不正なサイトが表示されるように細工する攻撃です。
    definition: 検索エンジンの検索結果の上位に不正なサイトを表示させ、利用者を誘導する攻撃。
    related: [標的型攻撃, SEO]
  - term: フィッシング
    reading: ふぃっしんぐ
    simple: 本物そっくりの偽サイトに誘導して、IDやパスワード、カード番号などを盗む詐欺です。
    definition: 金融機関などを装ったメールで偽の Web サイトに誘導し、ID、パスワード、クレジットカード番号などの情報を入力させて盗む詐欺。
    related: [標的型攻撃, スミッシング]
  - term: スミッシング
    reading: すみっしんぐ
    simple: SMS(ショートメッセージ)を使って、偽サイトに誘導する詐欺です。
    definition: SMS（ショートメッセージ）で偽の URL を送り、偽サイトに誘導して情報を盗んだり、マルウェアをインストールさせたりする詐欺。
    related: [フィッシング, 標的型攻撃]
  - term: 敵対的サンプル
    reading: てきたいてきさんぷる
    aliases: [Adversarial Examples]
    simple: 人間には気付かれない程度の細工をして、AIに間違った判断をさせるデータです。
    definition: 人間には判別できないほどのわずかな変更を加えて、機械学習モデルに誤った判断をさせるように作られた入力データ。
    related: [プロンプトインジェクション, データポイズニング]
  - term: データポイズニング
    reading: でーたぽいずにんぐ
    simple: AIの学習データに不正なデータを混ぜて、モデルの動作をゆがめる攻撃です。
    definition: 機械学習の学習データに不正なデータを混入させ、モデルの精度を下げたり、特定の入力で誤動作するようにしたりする攻撃。
    related: [プロンプトインジェクション, 敵対的サンプル]
  - term: AIに対する脅威
    reading: えーあいにたいするきょうい
    simple: AIが悪用されたり、攻撃されたりすることで生じる脅威の総称です。
    definition: AI システムに対する攻撃（プロンプトインジェクション、データポイズニング、敵対的サンプルなど）や、AI を悪用した脅威（ディープフェイクなど）の総称。
    related: [プロンプトインジェクション, ディープフェイク]
  - term: ディープフェイク
    reading: でぃーぷふぇいく
    simple: AIで作った、本物そっくりの偽の映像や音声です。
    definition: 深層学習を用いて生成された、本物と見分けがつかない偽の画像、動画、音声。なりすましや偽情報の拡散に悪用される。
    related: [プロンプトインジェクション, AIに対する脅威]
  - term: DDoS攻撃
    reading: でぃーでぃーおーえすこうげき
    aliases: [DDoS]
    simple: 多数のコンピュータから一斉にアクセスを送りつけて、サービスを使えなくする攻撃です。
    definition: 多数の端末（ボットネットなど）から同時に大量のリクエストを送り、サービスを停止させる分散型の DoS 攻撃。送信元が多数に分散するため、遮断が難しい。
    related: [DoS攻撃, ボットネット]
  - term: フットプリンティング
    reading: ふっとぷりんてぃんぐ
    simple: 攻撃の前に、標的の情報(ドメイン、公開サーバなど)を調べて集める行為です。
    definition: 攻撃の準備として、標的のシステムの構成、公開されている情報、ネットワーク範囲などを調査して情報を収集する行為。
    related: [ポートスキャン]
  - term: 共通鍵
    reading: きょうつうかぎ
    simple: 暗号化にも復号にも同じ鍵を使う、共通鍵暗号方式で使う鍵です。
    definition: 共通鍵暗号方式で、送信者と受信者が共有し、暗号化と復号の両方に使う鍵。
    related: [共通鍵暗号方式, 公開鍵]
  - term: AES
    reading: えーいーえす
    fullName: Advanced Encryption Standard
    japanese: 高度暗号化標準
    words:
      - { en: Advanced, ja: 高度な }
      - { en: Encryption, ja: 暗号化 }
      - { en: Standard, ja: 標準 }
    simple: 現在最も広く使われている、共通鍵暗号方式の標準的な暗号アルゴリズムです。
    definition: 米国政府標準の共通鍵ブロック暗号。ブロック長は 128 ビット、鍵長は 128、192、256 ビットから選ぶ。
    related: [共通鍵暗号方式, ブロック暗号]
  - term: ブロック暗号
    reading: ぶろっくあんごう
    simple: データを一定の長さのブロックに区切って、ブロックごとに暗号化する方式です。
    definition: 平文を一定長のブロックに分割し、ブロック単位で暗号化する共通鍵暗号方式。AES などがある。
    related: [共通鍵暗号方式, ストリーム暗号, AES]
  - term: ストリーム暗号
    reading: すとりーむあんごう
    simple: データを1ビット(または1バイト)ずつ、連続して暗号化する方式です。
    definition: 平文を 1 ビットまたは 1 バイト単位で、鍵から生成した乱数列と順次演算して暗号化する共通鍵暗号方式。
    related: [共通鍵暗号方式, ブロック暗号]
  - term: 公開鍵
    reading: こうかいかぎ
    simple: 誰にでも公開してよい、公開鍵暗号方式の片方の鍵です。
    definition: 公開鍵暗号方式で、一般に公開する鍵。暗号化や署名の検証に使う。
    related: [公開鍵暗号方式, 秘密鍵]
  - term: 秘密鍵
    reading: ひみつかぎ
    simple: 自分だけが持って、他人に知られないようにする、公開鍵暗号方式の片方の鍵です。
    definition: 公開鍵暗号方式で、所有者だけが保管し、他人に知られないようにする鍵。復号や署名の作成に使う。
    related: [公開鍵暗号方式, 公開鍵]
  - term: RSA暗号
    reading: あーるえすえーあんごう
    fullName: Rivest-Shamir-Adleman
    japanese: リベスト・シャミア・エーデルマン暗号
    words:
      - { en: Rivest, ja: リベスト（考案者） }
      - { en: Shamir, ja: シャミア（考案者） }
      - { en: Adleman, ja: エーデルマン（考案者） }
    simple: 大きな数の素因数分解の難しさを利用した、代表的な公開鍵暗号です。
    definition: 大きな整数の素因数分解の困難さを安全性の根拠とする公開鍵暗号方式。暗号化とデジタル署名の両方に使える。
    related: [公開鍵暗号方式, 公開鍵]
  - term: ハイブリッド暗号
    reading: はいぶりっどあんごう
    simple: 公開鍵暗号で共通鍵を安全に渡し、共通鍵暗号でデータを高速に暗号化する方式です。
    definition: 公開鍵暗号方式で共通鍵（セッション鍵）を安全に共有し、実際のデータは高速な共通鍵暗号方式で暗号化する方式。TLS などで使われる。
    related: [公開鍵暗号方式, 共通鍵暗号方式, TLS]
  - term: SHA-2
    reading: しゃーつー
    simple: SHA-256などを含む、安全性が高いとされるハッシュ関数のグループです。
    definition: SHA-224、SHA-256、SHA-384、SHA-512 などから成る、米国標準のハッシュ関数ファミリー。
    related: [ハッシュ関数, SHA-256]
  - term: SHA-256
    reading: しゃーにごろく
    simple: "256ビットのハッシュ値を出力する、SHA-2に含まれるハッシュ関数です。"
    definition: "256 ビットのハッシュ値を出力する SHA-2 ファミリーのハッシュ関数。デジタル署名や改ざん検知などに広く使われる。"
    related: [ハッシュ関数, SHA-2]
  - term: ハッシュ値
    reading: はっしゅち
    aliases: [メッセージダイジェスト]
    simple: ハッシュ関数が、元のデータから計算して出力する固定長の値です。
    definition: ハッシュ関数がデータから算出する固定長の値。メッセージダイジェストともいう。元のデータが少しでも異なると別の値になるため、改ざんの検知に使われる。
    related: [ハッシュ関数, デジタル署名]
  - term: 暗号化
    reading: あんごうか
    simple: 第三者に読まれないように、データを元の形が分からない形式に変換することです。
    definition: 平文を鍵とアルゴリズムを使って、第三者には意味が分からない暗号文に変換すること。
    related: [暗号技術, 復号]
  - term: 復号
    reading: ふくごう
    simple: 暗号化されたデータを、元のデータに戻すことです。
    definition: 暗号文を鍵とアルゴリズムを使って、元の平文に戻すこと。
    related: [暗号技術, 暗号化]
  - term: 危殆化
    reading: きたいか
    simple: 計算機の進歩や解読法の発見によって、暗号が安全でなくなってしまうことです。
    definition: 計算機性能の向上や暗号解読技術の進歩により、暗号アルゴリズムの安全性が低下し、実質的に安全でなくなること。
    related: [暗号技術, CRYPTREC暗号リスト]
  - term: CRYPTREC暗号リスト
    reading: くりぷとれっくあんごうりすと
    simple: 日本の政府機関が使うことを推奨する、安全性が確認された暗号の一覧です。
    definition: 電子政府で利用を推奨する暗号技術として、CRYPTREC が安全性や実装性を評価して選定した暗号のリスト。推奨暗号リスト、運用監視暗号リスト、候補暗号リストがある。
    related: [暗号技術, 危殆化]
  - term: 鍵管理
    reading: かぎかんり
    simple: 暗号鍵の生成、配布、保管、廃棄などを安全に行うことです。
    definition: 暗号鍵の生成、配布、保管、更新、廃棄までのライフサイクル全体を安全に管理すること。暗号の安全性は鍵の管理に大きく依存する。
    related: [暗号技術]
  - term: 暗号利用モード
    reading: あんごうりようもーど
    simple: ブロック暗号で、長いデータを暗号化するときの方法(ECBやCBCなど)です。
    definition: ブロック暗号を用いて長いデータを暗号化するための方式。ECB、CBC、CTR、GCM などがある。
    related: [暗号技術, ブロック暗号]
  - term: ストレージ暗号化
    reading: すとれーじあんごうか
    simple: ディスクやSSDなどの記憶装置に保存するデータを、暗号化することです。
    definition: ディスクや SSD などの記憶装置上のデータを暗号化し、機器の紛失や盗難による情報漏えいを防ぐ対策。
    related: [暗号技術, データベース暗号化]
  - term: データベース暗号化
    reading: でーたべーすあんごうか
    simple: データベース内のデータを、暗号化して保存することです。
    definition: データベースに格納するデータ（列や表領域など）を暗号化し、不正な参照を防ぐ対策。
    related: [暗号技術, ストレージ暗号化]
  - term: 二要素認証
    reading: にようそにんしょう
    simple: 知識・所持・生体のうち、異なる種類の2つを組み合わせて認証する方式です。
    definition: 知識情報（パスワード）、所持情報（トークン、スマートフォン）、生体情報（指紋）のうち、異なる 2 種類の要素を組み合わせて認証する方式。多要素認証の一種。
    related: [多要素認証, 多段階認証]
  - term: 多段階認証
    reading: ただんかいにんしょう
    simple: 認証を2回以上に分けて行う方式で、同じ種類の要素を重ねるものも含みます。
    definition: 認証を複数の段階に分けて行う方式。各段階で同じ種類の要素（例：パスワードと秘密の質問）を使う場合もあり、必ずしも多要素認証にはならない。
    related: [多要素認証, 二要素認証]
  - term: ワンタイムパスワード
    reading: わんたいむぱすわーど
    aliases: [OTP]
    simple: 一度使うと無効になる、使い捨てのパスワードです。
    definition: 一度使うと無効になる、使い捨てのパスワード。トークンやアプリで一定時間ごとに生成され、盗聴されても再利用できない。
    related: [多要素認証, セキュリティトークン]
  - term: PIN
    reading: ぴん
    fullName: Personal Identification Number
    japanese: 暗証番号
    words:
      - { en: Personal, ja: 個人の }
      - { en: Identification, ja: 識別 }
      - { en: Number, ja: 番号 }
    simple: 本人であることを確認するための、短い数字の暗証番号です。
    definition: 本人確認に使う数字の暗証番号。機器に紐付いて使い、短くても試行回数の制限で安全性を確保する。
    related: [多要素認証, 生体認証]
  - term: パスワードレス認証
    reading: ぱすわーどれすにんしょう
    simple: パスワードを使わずに、生体認証やセキュリティキーなどで本人確認する方式です。
    definition: パスワードを使用せず、生体認証、セキュリティキー、デバイス認証などで本人確認を行う認証方式。FIDO が代表的。
    related: [多要素認証, FIDO]
  - term: FIDO
    reading: ふぃど
    fullName: Fast IDentity Online
    japanese: 高速なオンライン認証
    words:
      - { en: Fast, ja: 素早い }
      - { en: IDentity, ja: 本人性 }
      - { en: Online, ja: オンライン }
    simple: パスワードに頼らず、生体認証などで安全にログインするための国際標準の仕組みです。
    definition: パスワードを使わずに、端末内の生体認証などで本人確認し、公開鍵暗号を用いてサーバに認証結果を示す仕組みの標準。フィッシングに強い。
    related: [多要素認証, パスワードレス認証]
  - term: リスクベース認証
    reading: りすくべーすにんしょう
    simple: ログインの状況から危険度を判断し、危険なときだけ追加の認証を求める方式です。
    definition: 利用者の端末、場所、時間帯などからログインの危険度を評価し、リスクが高い場合にだけ追加の認証を要求する方式。
    related: [多要素認証]
  - term: チャレンジレスポンス認証
    reading: ちゃれんじれすぽんすにんしょう
    simple: サーバが送る毎回違うデータ(チャレンジ)に応答することで、パスワードを送らずに認証する方式です。
    definition: サーバが毎回異なる乱数（チャレンジ）を送り、クライアントがパスワードなどと組み合わせて計算した値（レスポンス）を返すことで、パスワードそのものをネットワークに流さずに認証する方式。
    related: [多要素認証, ワンタイムパスワード]
  - term: セキュリティトークン
    reading: せきゅりてぃとーくん
    simple: ワンタイムパスワードなどを表示する、認証のための小型の装置やアプリです。
    definition: ワンタイムパスワードの生成や電子証明書の保管などを行う認証用の装置（またはアプリ）。所持情報による認証に使われる。
    related: [多要素認証, ワンタイムパスワード]
  - term: EMV 3-Dセキュア
    reading: いーえむぶいすりーでぃーせきゅあ
    simple: ネットショッピングでカードを使うとき、本人確認を追加で行う仕組みです。
    definition: オンラインでのクレジットカード決済で、カード会社が追加の本人認証（ワンタイムパスワードや生体認証など）を行う仕組み。カードの不正利用を防止する。
    related: [多要素認証, PCI DSS]
  - term: 本人拒否率
    reading: ほんにんきょひりつ
    fullName: False Rejection Rate
    japanese: 本人拒否率
    aliases: [FRR]
    words:
      - { en: "false", ja: 誤った }
      - { en: Rejection, ja: 拒否 }
      - { en: Rate, ja: 率 }
    simple: 本人なのに、誤って拒否されてしまう割合です。
    definition: 正規の利用者を誤って拒否してしまう確率。FRR ともいい、小さいほど利便性が高い。他人受入率とトレードオフの関係にある。
    related: [生体認証, 他人受入率]
  - term: 他人受入率
    reading: たにんうけいれりつ
    fullName: False Acceptance Rate
    japanese: 他人受入率
    aliases: [FAR]
    words:
      - { en: "false", ja: 誤った }
      - { en: Acceptance, ja: 受入れ }
      - { en: Rate, ja: 率 }
    simple: 他人なのに、誤って本人として受け入れてしまう割合です。
    definition: 他人を誤って本人と判定してしまう確率。FAR ともいい、小さいほど安全性が高い。本人拒否率とトレードオフの関係にある。
    related: [生体認証, 本人拒否率]
  - term: 静脈パターン認証
    reading: じょうみゃくぱたーんにんしょう
    simple: 手のひらや指の静脈の形で、本人かどうかを確認する認証です。
    definition: 手のひらや指の静脈の血管パターンで本人を認証する方式。体内の情報のため偽造が難しい。
    related: [生体認証, 虹彩認証]
  - term: 虹彩認証
    reading: こうさいにんしょう
    simple: 目の虹彩の模様で、本人かどうかを確認する認証です。
    definition: 瞳孔のまわりにある虹彩の模様で本人を認証する方式。精度が高い。
    related: [生体認証, 静脈パターン認証]
  - term: 顔認証
    reading: かおにんしょう
    simple: 顔の特徴で、本人かどうかを確認する認証です。
    definition: 顔の形や目鼻の位置などの特徴で本人を認証する方式。非接触で利用しやすい。
    related: [生体認証, 声紋認証]
  - term: 声紋認証
    reading: せいもんにんしょう
    simple: 声の特徴で、本人かどうかを確認する認証です。
    definition: 声の周波数成分などの特徴で本人を認証する方式。録音による偽造に注意が必要。
    related: [生体認証, 顔認証]
  - term: 認証局
    reading: にんしょうきょく
    fullName: Certification Authority
    japanese: 認証局
    aliases: [CA]
    words:
      - { en: Certification, ja: 証明 }
      - { en: Authority, ja: 機関 }
    simple: デジタル証明書を発行して、公開鍵の持ち主が本物であることを保証する機関です。
    definition: 公開鍵と所有者の関係を証明するデジタル証明書を発行し、失効の管理も行う機関。CA ともいう。
    related: [PKI, デジタル証明書, CRL]
  - term: CRL
    reading: しーあーるえる
    fullName: Certificate Revocation List
    japanese: 証明書失効リスト
    aliases: [証明書失効リスト]
    words:
      - { en: Certificate, ja: 証明書 }
      - { en: Revocation, ja: 失効 }
      - { en: List, ja: 一覧 }
    simple: 有効期限内でも使えなくなった(失効した)証明書の一覧です。
    definition: 認証局が公開する、有効期限内に失効したデジタル証明書のシリアル番号の一覧。証明書の検証時に失効していないかを確認するために使う。
    related: [PKI, OCSP, 認証局]
  - term: OCSP
    reading: おーしーえすぴー
    fullName: Online Certificate Status Protocol
    japanese: オンライン証明書状態プロトコル
    words:
      - { en: Online, ja: オンラインで }
      - { en: Certificate Status, ja: 証明書の状態 }
      - { en: Protocol, ja: 通信規約 }
    simple: 証明書が失効していないかを、認証局にその場で問い合わせるためのプロトコルです。
    definition: デジタル証明書の失効状態を、認証局（OCSP レスポンダ）にオンラインで問い合わせるプロトコル。CRL のダウンロードより即時性が高い。
    related: [PKI, CRL]
  - term: ルート証明書
    reading: るーとしょうめいしょ
    simple: 証明書の信頼の出発点となる、ルート認証局が自分自身に対して発行した証明書です。
    definition: ルート認証局が自身に対して発行した（自己署名の）証明書。証明書チェーンの最上位として、利用者が信頼して事前に登録する。
    related: [PKI, トラストアンカー, 中間CA証明書]
  - term: トラストアンカー
    reading: とらすとあんかー
    simple: 証明書を検証するとき、無条件に信頼する出発点とする認証局や証明書のことです。
    definition: 証明書チェーンの検証で、信頼の出発点として無条件に信頼する認証局またはその証明書。一般にはルート証明書。
    related: [PKI, ルート証明書]
  - term: 中間CA証明書
    reading: ちゅうかんしーえーしょうめいしょ
    simple: ルート認証局と、利用者の証明書をつなぐ、中間の認証局の証明書です。
    definition: ルート認証局と末端の証明書の間に位置する中間認証局の証明書。ルート認証局の秘密鍵の使用を減らすため、中間認証局が実際の証明書を発行する。
    related: [PKI, ルート証明書]
  - term: サーバ証明書
    reading: さーばしょうめいしょ
    simple: Webサイトなどのサーバが本物であることを証明する、デジタル証明書です。
    definition: サーバの正当性を証明し、通信の暗号化に使う公開鍵を保証するデジタル証明書。TLS で用いる。
    related: [デジタル証明書, クライアント証明書, TLS]
  - term: クライアント証明書
    reading: くらいあんとしょうめいしょ
    simple: 利用者の端末(クライアント)が本物であることを証明する、デジタル証明書です。
    definition: 利用者や端末の正当性を証明するデジタル証明書。クライアント認証に使われる。
    related: [デジタル証明書, サーバ証明書]
  - term: 情報セキュリティ事象
    reading: じょうほうせきゅりてぃじしょう
    simple: セキュリティ上の問題がありそうな状態の発生を示す、事象です。
    definition: 情報セキュリティ方針の違反や管理策の不具合の可能性を示す事象。事象のうち、事業運営を脅かす可能性が高いものが情報セキュリティインシデントになる。
    related: [情報セキュリティインシデント]
  - term: リスク特定
    reading: りすくとくてい
    simple: どのようなリスクがあるかを、洗い出すことです。
    definition: リスクを発見し、認識し、記述するプロセス。リスクアセスメントの最初の段階。
    related: [リスクアセスメント, リスク分析, リスク評価]
  - term: リスク評価
    reading: りすくひょうか
    simple: 分析したリスクの大きさを、基準と比べて対応が必要かを判断することです。
    definition: リスク分析の結果をリスク基準と比較して、リスクの大きさが受容可能かどうかを判断するプロセス。
    related: [リスクアセスメント, リスク特定, リスク基準]
  - term: リスク基準
    reading: りすくきじゅん
    simple: リスクを評価するときの、判断のものさしとなる基準です。
    definition: リスクの重大さを評価するための判断の基準となるもの。リスク受容基準などを含む。
    related: [リスクアセスメント, リスク評価]
  - term: リスクマトリックス
    reading: りすくまとりっくす
    simple: 発生可能性と影響の大きさを軸にした表で、リスクの大きさを示すものです。
    definition: 発生可能性と影響度を縦横の軸にした表で、リスクの大きさを段階的に表したもの。
    related: [リスクアセスメント, リスク評価]
  - term: リスク所有者
    reading: りすくしょゆうしゃ
    simple: リスクを管理する責任と権限をもつ人です。
    definition: リスクを運用管理する責任と権限をもつ人または主体。
    related: [リスクアセスメント, リスク対応]
  - term: 年間予想損失額
    reading: ねんかんよそうそんしつがく
    fullName: Annualized Loss Expectancy
    japanese: 年間予想損失額
    aliases: [ALE]
    words:
      - { en: Annualized, ja: 年間あたり }
      - { en: Loss, ja: 損失 }
      - { en: Expectancy, ja: 期待値 }
    simple: リスクによって、1年間に生じると予想される損失額です。
    definition: "1 回の損失額に年間の発生頻度を乗じて求める、リスクによる 1 年間あたりの予想損失額。ALE ともいい、定量的リスク分析で使う。"
    related: [リスク分析, 定量的リスク分析]
  - term: 定量的リスク分析
    reading: ていりょうてきりすくぶんせき
    simple: 損失額や発生確率を数値で表して、リスクを分析する方法です。
    definition: リスクの大きさを、損失額や発生確率などの数値で評価する分析手法。年間予想損失額を用いる。
    related: [リスク分析, 定性的リスク分析, 年間予想損失額]
  - term: 定性的リスク分析
    reading: ていせいてきりすくぶんせき
    simple: 「大・中・小」のような段階で、リスクを分析する方法です。
    definition: リスクの大きさを、高・中・低などの段階的な尺度で評価する分析手法。数値化が難しい場合に使う。
    related: [リスク分析, 定量的リスク分析]
  - term: リスク回避
    reading: りすくかいひ
    simple: リスクの原因となる活動そのものをやめることで、リスクをなくす対応です。
    definition: リスクの原因となる事業、システム、活動をやめることでリスクを取り除く対応。
    related: [リスク対応, リスク低減, リスク移転]
  - term: リスク低減
    reading: りすくていげん
    simple: 対策を実施して、リスクの発生可能性や影響を小さくする対応です。
    definition: セキュリティ対策を実施して、リスクの発生可能性や影響を小さくする対応。リスク最適化ともいう。
    related: [リスク対応, リスク回避, 残留リスク]
  - term: リスク移転
    reading: りすくいてん
    aliases: [リスク共有]
    simple: 保険や外部委託を使って、リスクによる損失を他者に負担してもらう対応です。
    definition: 保険への加入や外部への委託などにより、リスクによる損失の負担を他者に移す、または分担する対応。リスク共有ともいう。
    related: [リスク対応, リスクファイナンシング]
  - term: リスク保有
    reading: りすくほゆう
    aliases: [リスク受容]
    simple: 対策をとらずに、リスクをそのまま受け入れる対応です。
    definition: リスクの大きさが受容できる水準であるとして、対策をとらずにそのまま受け入れる対応。リスク受容ともいう。
    related: [リスク対応, 残留リスク]
  - term: 残留リスク
    reading: ざんりゅうりすく
    simple: リスク対応を行った後に、なお残るリスクです。
    definition: リスク対応を実施した後に残るリスク。受容できるか確認し、リスク所有者の承認を得る。
    related: [リスク対応, リスク低減, リスク保有]
  - term: リスクファイナンシング
    reading: りすくふぁいなんしんぐ
    simple: リスクが現実になって損失が出たときの資金面の備えです(保険、準備金など)。
    definition: リスクが顕在化して損失が生じたときに備えて、資金面の手当てをしておく対応。保険の加入や準備金の積立てなど。
    related: [リスク対応, リスク移転]
  - term: 災害復旧計画
    reading: さいがいふっきゅうけいかく
    aliases: [DR]
    simple: 災害で被害を受けたシステムを、元の状態に復旧するための計画です。
    definition: 災害などでシステムが被害を受けたときに、情報システムを復旧するための計画。DR（Disaster Recovery）計画ともいう。事業継続計画のうち、IT の復旧にあたる部分。
    related: [コンティンジェンシー計画, BCP]
  - term: BCM
    reading: びーしーえむ
    fullName: Business Continuity Management
    japanese: 事業継続管理
    aliases: [事業継続管理]
    words:
      - { en: Business Continuity, ja: 事業継続 }
      - { en: Management, ja: 管理 }
    simple: 事業継続計画(BCP)を作るだけでなく、訓練や見直しを含めて継続的に管理する活動です。
    definition: BCP の策定だけでなく、導入、訓練、点検、見直しまでを含めて、事業継続のための取組みを継続的に管理するマネジメント活動。
    related: [BCP, コンティンジェンシー計画]
  - term: 基本方針
    reading: きほんほうしん
    aliases: [情報セキュリティ方針]
    simple: 組織の、情報セキュリティに対する基本的な考え方や姿勢を示す文書です。
    definition: 情報セキュリティに対する組織の基本的な考え方、目的、取組みの方針を示す、情報セキュリティポリシーの最上位の文書。
    related: [情報セキュリティポリシー, 対策基準, 実施手順]
  - term: 対策基準
    reading: たいさくきじゅん
    simple: 基本方針を実現するために、守るべき基準を具体的に示したものです。
    definition: 基本方針を実現するために、遵守すべき行為や判断の基準を示したもの。
    related: [情報セキュリティポリシー, 基本方針, 実施手順]
  - term: 実施手順
    reading: じっししゅじゅん
    simple: 対策基準に基づいて、実際の作業手順を具体的に示したものです。
    definition: 対策基準に従って、業務や作業の具体的な手順を記したもの。
    related: [情報セキュリティポリシー, 対策基準]
  - term: JIS Q 27001
    reading: じすきゅーにーななぜろぜろいち
    aliases: [ISO/IEC 27001]
    simple: ISMS(情報セキュリティマネジメントシステム)の要求事項を定めた規格です。
    definition: 情報セキュリティマネジメントシステム（ISMS）を確立、実施、維持、改善するための要求事項を定めた規格。ISO/IEC 27001 と整合した JIS。認証の基準となる。
    related: [ISMS, JIS Q 27002, ISMS認証]
  - term: JIS Q 27002
    reading: じすきゅーにーななぜろぜろに
    aliases: [ISO/IEC 27002]
    simple: ISMSで実施する、情報セキュリティの管理策の実践規範を示した規格です。
    definition: 情報セキュリティ管理策の選択と実施の手引を示した実践規範。ISO/IEC 27002 と整合した JIS。認証の基準ではなく、手引である。
    related: [ISMS, JIS Q 27001, 管理策]
  - term: ISMS認証
    reading: あいえすえむえすにんしょう
    simple: 組織のISMSが規格に適合していることを、第三者が認証する制度です。
    definition: 組織の ISMS が JIS Q 27001 に適合していることを、第三者の認証機関が審査し認証する制度。
    related: [ISMS, JIS Q 27001]
  - term: 管理策
    reading: かんりさく
    simple: リスクを低減するために実施する、具体的な対策のことです。
    definition: リスクを修正（低減）するための手段。方針、手順、組織構造、技術的な仕組みなどを含む。
    related: [ISMS, JIS Q 27002]
  - term: SOC
    reading: そっく
    fullName: Security Operation Center
    japanese: セキュリティオペレーションセンター
    words:
      - { en: Security, ja: セキュリティ }
      - { en: Operation, ja: 運用 }
      - { en: Center, ja: センター }
    simple: セキュリティ機器やシステムを24時間体制で監視し、攻撃の検知や分析を行う組織です。
    definition: ネットワークやシステムを常時監視し、セキュリティ上の脅威の検知と分析を行う組織または拠点。インシデント対応を行う CSIRT と連携する。
    related: [CSIRT]
  - term: JPCERT/CC
    reading: じぇいぴーさーとしーしー
    simple: 日本のコンピュータセキュリティインシデントの調整や情報提供を行う、民間の組織です。
    definition: 国内外の関係機関と連携して、インシデントの報告受付、調整、脆弱性情報の取扱いなどを行う日本の組織（JPCERT コーディネーションセンター）。
    related: [CSIRT, JVN]
  - term: JVN
    reading: じぇいぶいえぬ
    fullName: Japan Vulnerability Notes
    japanese: 脆弱性対策情報ポータルサイト
    words:
      - { en: Japan, ja: 日本 }
      - { en: Vulnerability, ja: 脆弱性 }
      - { en: Notes, ja: 情報 }
    simple: 日本で使われるソフトウェアの脆弱性情報と対策情報を公開しているサイトです。
    definition: JPCERT/CC と IPA が運営する、日本国内で使用されているソフトウェアの脆弱性情報と対策情報を公開するポータルサイト。
    related: [CSIRT, JPCERT/CC, 脆弱性]
  - term: NISC
    reading: えぬあいえすしー
    fullName: National center of Incident readiness and Strategy for Cybersecurity
    japanese: 内閣サイバーセキュリティセンター
    words:
      - { en: National center, ja: 国のセンター }
      - { en: Incident readiness, ja: 事故への備え }
      - { en: Strategy for Cybersecurity, ja: サイバーセキュリティ戦略 }
    simple: 日本政府のサイバーセキュリティ政策の企画・調整を行う、内閣官房の組織です。
    definition: 日本政府のサイバーセキュリティに関する政策の企画・立案と、政府機関の対策の調整を行う内閣官房の組織。
    related: [CSIRT]
  - term: サイバーセキュリティ経営ガイドライン
    reading: さいばーせきゅりてぃけいえいがいどらいん
    simple: 経営者が認識すべき3原則と、実施すべき重要10項目を示した、経済産業省とIPAのガイドラインです。
    definition: 経済産業省と IPA が策定した、経営者がサイバー攻撃から企業を守るために認識すべき 3 原則と、CISO などに指示すべき重要 10 項目を示したガイドライン。
    related: [PCI DSS, 情報セキュリティポリシー]
  - term: JISEC
    reading: じすいーしー
    fullName: Japan Information Technology Security Evaluation and Certification Scheme
    japanese: ITセキュリティ評価及び認証制度
    words:
      - { en: Japan, ja: 日本 }
      - { en: Information Technology Security, ja: ITのセキュリティ }
      - { en: Evaluation and Certification Scheme, ja: 評価及び認証制度 }
    simple: IT製品のセキュリティ機能を、ISO/IEC 15408に基づいて評価・認証する日本の制度です。
    definition: IT 関連製品のセキュリティ機能が、ISO/IEC 15408（コモンクライテリア）に基づいて適切に設計・実装されているかを評価し、認証する日本の制度。
    related: [CVSS, JCMVP]
  - term: JCMVP
    reading: じぇいしーえむぶいぴー
    fullName: Japan Cryptographic Module Validation Program
    japanese: 暗号モジュール試験及び認証制度
    words:
      - { en: Japan, ja: 日本 }
      - { en: Cryptographic Module, ja: 暗号モジュール }
      - { en: Validation Program, ja: 試験及び認証制度 }
    simple: 暗号モジュールが正しく実装されているかを、試験して認証する日本の制度です。
    definition: IT 製品に組み込まれる暗号モジュールの安全性を、ISO/IEC 19790 に基づいて試験し認証する日本の制度。
    related: [CVSS, JISEC]
  - term: 脆弱性診断
    reading: ぜいじゃくせいしんだん
    simple: システムの弱点がないかを、ツールなどで検査することです。
    definition: システムやアプリケーションに脆弱性がないかを、ツールや手作業で検査し、結果を評価すること。
    related: [CVSS, ペネトレーションテスト, 脆弱性]
  - term: 耐タンパ性
    reading: たいたんぱせい
    simple: 機器の内部を不正に解析されたり、改ざんされたりしにくい性質です。
    definition: 機器やソフトウェアの内部構造やデータを、不正に解析、読出し、改ざんされることに対する耐性。IC カードなどに求められる。
    related: [ペネトレーションテスト]
  - term: 人的セキュリティ対策
    reading: じんてきせきゅりてぃたいさく
    simple: 教育や契約など、人に対するセキュリティ対策です。
    definition: 従業員への教育・訓練、誓約書、委託先との契約など、人に起因するリスクへの対策。
    related: [情報セキュリティ対策, 技術的セキュリティ対策, 物理的セキュリティ対策]
  - term: 技術的セキュリティ対策
    reading: ぎじゅつてきせきゅりてぃたいさく
    simple: 認証、暗号化、ファイアウォールなど、技術を使ったセキュリティ対策です。
    definition: アクセス制御、認証、暗号化、ファイアウォール、マルウェア対策など、情報システムの技術的な機能による対策。
    related: [情報セキュリティ対策, 人的セキュリティ対策, 物理的セキュリティ対策]
  - term: 物理的セキュリティ対策
    reading: ぶつりてきせきゅりてぃたいさく
    simple: 入退室管理、施錠など、建物や設備に対するセキュリティ対策です。
    definition: 入退室管理、施錠、監視カメラ、災害対策など、建物や設備などの物理的な環境に対する対策。
    related: [情報セキュリティ対策, 人的セキュリティ対策, 技術的セキュリティ対策]
  - term: クリアデスク
    reading: くりあですく
    simple: 席を離れるときに、机の上に書類や媒体を放置しないというルールです。
    definition: 離席時に、重要な書類や記録媒体を机の上に放置せず、施錠できる場所にしまうルール。
    related: [情報セキュリティ対策, クリアスクリーン]
  - term: クリアスクリーン
    reading: くりあすくりーん
    simple: 席を離れるときに、画面をロックしたり閉じたりするというルールです。
    definition: 離席時に、画面をロックするなどして、他人に画面を見られたり操作されたりしないようにするルール。
    related: [情報セキュリティ対策, クリアデスク]
  - term: 入退室管理
    reading: にゅうたいしつかんり
    simple: 重要な部屋に出入りできる人を制限・記録する管理です。
    definition: 重要な区画に入退室できる人を制限し、入退室の記録を残す管理。IC カードや生体認証などで行う。
    related: [情報セキュリティ対策, 物理的セキュリティ対策]
  - term: 秘密保持契約
    reading: ひみつほじけいやく
    aliases: [NDA]
    simple: 業務で知った秘密情報を、他に漏らさないことを約束する契約です。
    definition: 業務上知り得た秘密情報を第三者に開示しない、目的外に使用しないことを約束する契約。NDA（Non-Disclosure Agreement）ともいう。
    related: [情報セキュリティ対策, 人的セキュリティ対策]
  - term: 標的型メール訓練
    reading: ひょうてきがためーるくんれん
    simple: 模擬の標的型メールを従業員に送って、対応力を高める訓練です。
    definition: 標的型メールを模した訓練用のメールを従業員に送信し、開封や報告などの対応を訓練して意識を高める取組み。
    related: [情報セキュリティ対策, 標的型メール]
  - term: UPS
    reading: ゆーぴーえす
    fullName: Uninterruptible Power Supply
    japanese: 無停電電源装置
    words:
      - { en: Uninterruptible, ja: 中断されない }
      - { en: Power Supply, ja: 電源装置 }
    simple: 停電のときもバッテリーで電力を供給し続ける、無停電電源装置です。
    definition: 停電や電圧の変動時に、内蔵バッテリーから一定時間電力を供給して、機器の停止やデータ損失を防ぐ装置。
    related: [情報セキュリティ対策, 自家発電装置]
  - term: データマスキング
    reading: でーたますきんぐ
    simple: 個人情報などの一部を、別の文字や値に置き換えて、元が分からなくする処理です。
    definition: 個人情報などの機密性の高いデータを、別の値や記号に置き換えて内容を保護する処理。テスト用データの作成などで使われる。
    related: [情報セキュリティ対策]
  - term: MDM
    reading: えむでぃーえむ
    fullName: Mobile Device Management
    japanese: モバイルデバイス管理
    words:
      - { en: Mobile Device, ja: モバイル端末 }
      - { en: Management, ja: 管理 }
    simple: スマートフォンなどの業務用端末を、一括して管理・制御する仕組みです。
    definition: スマートフォンやタブレットなどのモバイル端末を一元的に管理し、設定の配布、アプリの制御、紛失時の遠隔ロックやデータ消去などを行う仕組み。
    related: [情報セキュリティ対策]
  - term: フォールスポジティブ
    reading: ふぉーるすぽじてぃぶ
    aliases: [誤検知]
    simple: 正常な通信なのに、攻撃だと誤って判定してしまうことです。
    definition: 実際には攻撃でない正常な通信などを、誤って攻撃と判定すること。誤検知ともいう。
    related: [IDS, フォールスネガティブ]
  - term: フォールスネガティブ
    reading: ふぉーるすねがてぃぶ
    aliases: [見逃し]
    simple: 実際に攻撃があるのに、攻撃ではないと誤って判定してしまうことです。
    definition: 実際に攻撃が行われているのに、検知できずに見逃すこと。
    related: [IDS, フォールスポジティブ]
  - term: パケットフィルタリング
    reading: ぱけっとふぃるたりんぐ
    simple: パケットのIPアドレスやポート番号を見て、通すか遮断するかを決める方式です。
    definition: パケットの送信元・宛先 IP アドレス、ポート番号、プロトコルなどに基づいて、通過の可否を判定する方式。
    related: [ファイアウォール, UTM]
  - term: UTM
    reading: ゆーてぃーえむ
    fullName: Unified Threat Management
    japanese: 統合脅威管理
    words:
      - { en: Unified, ja: 統合された }
      - { en: Threat, ja: 脅威 }
      - { en: Management, ja: 管理 }
    simple: ファイアウォール、ウイルス対策、不正侵入防止などを1台にまとめた機器です。
    definition: ファイアウォール、IDS/IPS、アンチウイルス、URL フィルタリングなど複数のセキュリティ機能を 1 台に統合した機器、またはその管理手法。
    related: [ファイアウォール, パケットフィルタリング]
  - term: 許可リスト
    reading: きょかりすと
    aliases: [ホワイトリスト]
    simple: 許可するものを登録しておき、それ以外はすべて拒否する方式のリストです。
    definition: 通信や実行を許可する対象をあらかじめ登録し、登録されていないものはすべて拒否する方式のリスト。安全性が高い。ホワイトリストともいう。
    related: [ファイアウォール, 拒否リスト]
  - term: 拒否リスト
    reading: きょひりすと
    aliases: [ブラックリスト]
    simple: 拒否するものを登録しておき、それ以外は許可する方式のリストです。
    definition: 通信や実行を拒否する対象を登録し、登録されていないものは許可する方式のリスト。未知の脅威は防げない。ブラックリストともいう。
    related: [ファイアウォール, 許可リスト]
  - term: パターンマッチング法
    reading: ぱたーんまっちんぐほう
    simple: 既知のマルウェアの特徴(パターン)と照合して、検出する方法です。
    definition: 既知のマルウェアのパターン（シグネチャ）が登録された定義ファイルと照合して検出する方法。既知のマルウェアには確実だが、未知のものは検出できない。
    related: [マルウェア対策, ビヘイビア法, ヒューリスティック法]
  - term: ビヘイビア法
    reading: びへいびあほう
    aliases: [振る舞い検知]
    simple: プログラムの実行時の振る舞いを監視して、不審な動作を検出する方法です。
    definition: プログラムを実行させてその挙動（ファイルの書込み、通信など）を監視し、不審な動作からマルウェアを検出する方法。未知のマルウェアも検出できる可能性がある。
    related: [マルウェア対策, パターンマッチング法, サンドボックス]
  - term: ヒューリスティック法
    reading: ひゅーりすてぃっくほう
    simple: プログラムの構造や命令の並びが、マルウェアに似ていないかを調べて検出する方法です。
    definition: プログラムのコードの特徴や命令の並びを分析して、マルウェアに似た特徴をもつものを推定して検出する方法。
    related: [マルウェア対策, パターンマッチング法, ビヘイビア法]
  - term: サンドボックス
    reading: さんどぼっくす
    simple: 外部から隔離した安全な環境で、プログラムを実行して動作を調べる仕組みです。
    definition: 外部から隔離された環境でプログラムを実行して、システムへの影響を防ぎながら挙動を観察・検査する仕組み。
    related: [マルウェア対策, ビヘイビア法]
  - term: 証拠保全
    reading: しょうこほぜん
    simple: 調査の証拠となるデータを、改ざんや消失がないように保存することです。
    definition: 調査や訴訟に備えて、証拠となるデータを改ざんや消失がないように、そのままの状態で保存すること。ハッシュ値を用いてコピーの同一性を確認する。
    related: [デジタルフォレンジックス, ハッシュ値]
  - term: SSH
    reading: えすえすえいち
    fullName: Secure Shell
    japanese: セキュアシェル
    words:
      - { en: Secure, ja: 安全な }
      - { en: Shell, ja: シェル（遠隔操作の窓口） }
    simple: ネットワーク越しに、暗号化して安全に遠隔操作するためのプロトコルです。
    definition: ネットワーク越しのコンピュータを、暗号化と認証によって安全に遠隔操作するためのプロトコル。ポート転送やファイル転送（SFTP）にも使える。
    related: [TLS, SFTP]
  - term: WPA2
    reading: だぶりゅぴーえーつー
    fullName: Wi-Fi Protected Access 2
    japanese: Wi-Fi保護アクセス2
    words:
      - { en: Wi-Fi, ja: 無線LAN }
      - { en: Protected Access, ja: 保護されたアクセス }
      - { en: "2", ja: 第2版 }
    simple: WPA3の前の世代の、無線LANの暗号化方式で、AESを使います。
    definition: 無線 LAN の暗号化方式。AES による暗号化（CCMP）を使う。WPA3 の前の世代で、現在も広く使われている。
    related: [WPA3, WEP]
  - term: WEP
    reading: うぇっぷ
    fullName: Wired Equivalent Privacy
    japanese: 有線同等のプライバシー
    words:
      - { en: Wired Equivalent, ja: 有線と同等の }
      - { en: Privacy, ja: 秘匿性 }
    simple: 古い無線LANの暗号化方式で、脆弱性が見つかっており、使うべきではありません。
    definition: 初期の無線 LAN の暗号化方式。鍵の脆弱性により短時間で解読できるため、使用すべきではない。
    related: [WPA3, WPA2]
  - term: SPF
    reading: えすぴーえふ
    fullName: Sender Policy Framework
    japanese: 送信者ポリシーフレームワーク
    words:
      - { en: Sender, ja: 送信者 }
      - { en: Policy, ja: 方針 }
      - { en: Framework, ja: 枠組み }
    simple: メールの送信元のサーバが、正規のものかを、IPアドレスで確認する仕組みです。
    definition: 送信元ドメインの DNS に登録された正規の送信サーバの IP アドレスと、実際の送信元を照合して、なりすましを検知する送信ドメイン認証方式。
    related: [送信元ドメイン認証, DKIM, DMARC]
  - term: DKIM
    reading: でぃーきむ
    fullName: DomainKeys Identified Mail
    japanese: ドメインキー識別メール
    words:
      - { en: DomainKeys, ja: ドメインの鍵 }
      - { en: Identified, ja: 識別された }
      - { en: Mail, ja: メール }
    simple: メールにデジタル署名を付けて、送信元の正しさと改ざんがないことを確認する仕組みです。
    definition: 送信側がメールにデジタル署名を付与し、受信側が DNS で公開された公開鍵で検証することで、送信ドメインの正当性とメールの改ざんがないことを確認する方式。
    related: [送信元ドメイン認証, SPF, DMARC]
  - term: DMARC
    reading: でぃーまーく
    fullName: "Domain-based Message Authentication, Reporting and Conformance"
    japanese: ドメインベースのメッセージ認証・報告・適合
    words:
      - { en: Domain-based, ja: ドメインに基づく }
      - { en: Message Authentication, ja: メッセージ認証 }
      - { en: Reporting and Conformance, ja: 報告と適合 }
    simple: SPFやDKIMの認証に失敗したメールの扱い(拒否や隔離など)を、送信側が指定できる仕組みです。
    definition: SPF や DKIM による認証の結果を踏まえ、認証に失敗したメールの扱い（何もしない、隔離、拒否）を送信側ドメインが指定し、結果の報告を受け取れるようにする仕組み。
    related: [送信元ドメイン認証, SPF, DKIM]
  - term: OP25B
    reading: おーぴーにじゅうごびー
    fullName: Outbound Port 25 Blocking
    japanese: 送信ポート25番の遮断
    words:
      - { en: Outbound, ja: 外向きの }
      - { en: Port 25, ja: "25番ポート" }
      - { en: Blocking, ja: 遮断 }
    simple: 内部から外部への25番ポートでの直接のメール送信を遮断して、迷惑メールの送信を防ぐ対策です。
    definition: ISP が自社網から外部の SMTP サーバへの 25 番ポートの通信を遮断し、迷惑メールの送信を防止する対策。
    related: [送信元ドメイン認証, SMTP-AUTH]
  - term: SMTP-AUTH
    reading: えすえむてぃーぴーおーす
    fullName: SMTP Authentication
    japanese: SMTP認証
    words:
      - { en: SMTP, ja: メール送信プロトコル }
      - { en: Authentication, ja: 認証 }
    simple: メールを送信するときに、利用者のIDとパスワードで認証する仕組みです。
    definition: SMTP でメールを送信する際に、利用者の ID とパスワードで認証する仕組み。認証された利用者だけがメールを送信できる。
    related: [OP25B, SMTP]
  - term: S/MIME
    reading: えすまいむ
    fullName: Secure/Multipurpose Internet Mail Extensions
    japanese: セキュアMIME
    words:
      - { en: Secure, ja: 安全な }
      - { en: Multipurpose Internet Mail Extensions, ja: 多目的インターネットメール拡張 }
    simple: 電子証明書を使って、メールの暗号化とデジタル署名を行う規格です。
    definition: 公開鍵暗号方式とデジタル証明書を使って、電子メールの暗号化とデジタル署名を行う規格。MIME を拡張している。
    related: [MIME, PGP, デジタル署名]
  - term: PGP
    reading: ぴーじーぴー
    fullName: Pretty Good Privacy
    japanese: プリティ・グッド・プライバシー
    words:
      - { en: Pretty Good, ja: かなり良い }
      - { en: Privacy, ja: 秘匿性 }
    simple: 公開鍵暗号を使い、メールの暗号化とデジタル署名を行う仕組みで、信頼の輪で公開鍵を確認します。
    definition: 公開鍵暗号方式を使ってメールやファイルの暗号化と署名を行うソフトウェア。公開鍵の正当性を、利用者どうしの相互署名（信頼の輪）で保証する。
    related: [S/MIME, 公開鍵暗号方式]
  - term: ベイジアンフィルタリング
    reading: べいじあんふぃるたりんぐ
    simple: ベイズの定理を使って、単語の出現傾向から迷惑メールかどうかを確率で判定する方法です。
    definition: 迷惑メールと正常なメールそれぞれの単語の出現確率を学習し、ベイズの定理を使って新しいメールが迷惑メールである確率を求めて判定するフィルタリング方式。
    related: [スパム対策]
  - term: スパム対策
    reading: すぱむたいさく
    simple: 迷惑メール(スパム)を受け取らない、または送らないようにする対策の総称です。
    definition: 迷惑メール（スパム）の受信を防いだり、送信を抑止したりするための対策。送信ドメイン認証、OP25B、ベイジアンフィルタリングなど。
    related: [ベイジアンフィルタリング, SPF, OP25B]
  - term: RADIUS
    reading: らじうす
    fullName: Remote Authentication Dial In User Service
    japanese: 遠隔認証ダイヤルインユーザーサービス
    words:
      - { en: Remote Authentication, ja: 遠隔認証 }
      - { en: Dial In User Service, ja: ダイヤルイン利用者サービス }
    simple: ネットワークへの接続時に、利用者の認証や認可を一元的に行うプロトコルです。
    definition: ネットワークに接続する利用者の認証、認可、利用記録（AAA）を、認証サーバで一元的に行うプロトコル。無線 LAN や VPN 接続の認証などで使われる。
    related: [OAuth, アクセス制御]
  - term: アクセストークン
    reading: あくせすとーくん
    simple: 認可された範囲で、APIなどの資源にアクセスするために渡される許可証のような文字列です。
    definition: OAuth で、クライアントが認可された範囲のリソースにアクセスするために発行される、権限を表す文字列。
    related: [OAuth, 認可]
  - term: 認可
    reading: にんか
    simple: 認証された利用者に、どの資源へのアクセスを許すかを決めることです。
    definition: 認証された利用者や主体に対して、資源へのアクセス権を与えること。認証が「誰か」を確認するのに対し、認可は「何をしてよいか」を決める。
    related: [OAuth, アクセス制御, アクセストークン]
  - term: ストレッチング
    reading: すとれっちんぐ
    simple: ハッシュ計算を何千回も繰り返して、パスワードを解読するのに時間がかかるようにする方法です。
    definition: パスワードのハッシュ化を何千回も繰り返し、1 回の計算に時間がかかるようにして、総当たり攻撃や辞書攻撃を困難にする手法。
    related: [ソルト, ハッシュ関数, パスワード攻撃]
  - term: レインボーテーブル
    reading: れいんぼーてーぶる
    simple: ハッシュ値から元のパスワードを素早く調べるために、あらかじめ作っておく変換表です。
    definition: ハッシュ値から元のパスワードを高速に逆引きするために、事前に計算しておく表。ソルトを加えると無効化できる。
    related: [ソルト, ハッシュ値]
  - term: 静的解析
    reading: せいてきかいせき
    simple: プログラムを実行せずに、ソースコードなどを調べて問題を見つける方法です。
    definition: プログラムを実行せずに、ソースコードやバイナリを解析して、脆弱性やバグを検出する手法。
    related: [ファジング, 動的検査]
  - term: 動的検査
    reading: どうてきけんさ
    aliases: [動的解析]
    simple: プログラムを実際に動かして、動作を観察しながら問題を見つける方法です。
    definition: プログラムを実際に実行して、動作や応答を観察しながら脆弱性を検出する手法。Web アプリケーションに対する疑似攻撃による検査などがある。
    related: [ファジング, 静的解析]
  - term: オペレーショナルリスク
    reading: おぺれーしょなるりすく
    aliases: [オペリスク]
    simple: 業務の不備や人為的ミス、システム障害などで損失が出るリスクです。
    definition: 内部の業務プロセス、人、システムの不備や外部の事象によって損失が生じるリスク。
    related: [サプライチェーンリスク, 地政学的リスク]
  - term: 地政学的リスク
    reading: ちせいがくてきりすく
    simple: 特定の地域の政治的・軍事的な緊張が、経済や事業に与えるリスクです。
    definition: 国家間の対立、紛争、制裁など地政学的な要因により、サプライチェーンや事業に悪影響が及ぶリスク。
    related: [サプライチェーンリスク]
