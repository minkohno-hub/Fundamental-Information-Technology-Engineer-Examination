category: ネットワーク
terms:
  - term: リース
    reading: リース
    simple: アドレスなどを、決められた期間だけ貸し出すことです。
    definition: DHCP などで、IP アドレスを一定期間に限って貸し出すこと、またはその期間。クライアントは期間の半分が過ぎた時点で更新を要求し、更新できないまま期限を迎えるとアドレスは使用できなくなる。
    related: [DHCP]
  - term: TTL
    reading: ティーティーエル
    simple: 情報が有効な残り時間のことです。
    definition: Time To Live の略で、データが有効である期間を示す値。DNS では、応答に含まれる TTL の間、キャッシュがその情報を保持するため、レコードの変更は最大で TTL の期間だけ反映が遅れる。IP パケットにも、経由できるルータ数の上限としての TTL がある。
    related: [DNS, キャッシュ]
  - term: キャッシュ
    reading: キャッシュ
    simple: よく使うデータのコピーを手近に置いて、取り出しを速くすることです。
    definition: 頻繁に使われるデータの写しを、速く取り出せる場所に一時的に保持する仕組み。ネットワークではキャッシュサーバが応答を保持し、同じリクエストには送信元へ問い合わせずに答えることで、転送量と遅延を減らす。保持の有効期間は TTL などで決まる。
    related: [TTL, ヒット率]
  - term: 輻輳制御
    reading: ふくそうせいぎょ
    simple: ネットワークの混雑に合わせて、送信する量を調整することです。
    definition: TCP などで、ネットワークの混雑（輻輳）の度合いに応じて送信量（輻輳ウィンドウ）を調整する仕組み。確認応答の様子から混雑を推測し、パケットの損失を避ける。接続開始直後はスロースタートで送出量を徐々に増やす。
    related: [TCP, スロースタート]
  - term: スロースタート
    reading: スロースタート
    simple: 送信の始めは少量から始めて、様子を見ながら倍々に増やすことです。
    definition: TCP の輻輳制御の開始方式で、輻輳ウィンドウを小さい値から始め、確認応答が順調に届く間、ラウンドトリップ時間ごとに約 2 倍に増やしていく。ネットワークの状態が分からない接続の初期に、大量に送り込んで輻輳を招くことを防ぐ。
    related: [輻輳制御, TCP]
  - term: フレーム
    reading: フレーム
    simple: イーサネットでデータを送る単位のことです。
    definition: データリンク層で送受信されるデータの単位（PDU)。イーサネットのフレームには、宛先と送信元の MAC アドレス、データ、誤り検出のための FCS が含まれる。CSMA/CD では衝突検知のため、最小フレーム長が定められている。
    related: [イーサネット, CSMA/CD]
  - term: タグVLAN
    reading: タグブイラン
    simple: フレームに VLAN の番号札（タグ）を付けて運ぶ仕組みです。
    definition: IEEE 802.1Q で標準化された仕組みで、イーサネットフレームに VLAN ID を含むタグを付加し、スイッチ間の 1 本のリンクで複数の VLAN のフレームを区別して運べるようにする。このようなリンクをトランクと呼ぶ。
    related: [VLAN, スイッチ]
  - term: スイッチ
    reading: スイッチ
    simple: フレームを、宛先の機器がつながるポートへだけ送る装置です。
    definition: データリンク層で動作するネットワーク機器で、MAC アドレスに基づいてフレームの転送先のポートを決める。スイッチングハブとも呼ばれる。VLAN に対応する製品では、ポートやタグで論理的にネットワークを分割できる。
    related: [VLAN, タグVLAN]
  - term: チャネル
    reading: チャネル
    simple: 無線 LAN で使う周波数の区分のことです。
    definition: 無線通信で使用する周波数帯を分けた区分。無線 LAN では各チャネルが幅を持ち、番号の近いチャネルは周波数が重なって干渉する。2.4 GHz 帯では 1、6、11 のチャネルが互いに重ならず、近くのアクセスポイントへの割当ての基本になる。
    related: [無線LAN]
