category: システム構成要素
terms:
  - term: バッチ処理
    reading: バッチしょり
    aliases: [一括処理]
    simple: データをためておいて、まとめて一度に処理する方式です。
    definition: 一定期間・一定量のデータを蓄積して一括処理する処理形態。発生の都度すぐに処理するリアルタイム処理、利用者と対話しながら進める対話型処理と対比される。
    related: [分散処理]
  - term: 分散処理
    reading: ぶんさんしょり
    simple: 処理を複数のコンピュータで分担して行う方式です。
    definition: ネットワークで結ばれた複数のコンピュータで処理を分担する方式。一部の故障の影響が限定され拡張しやすいが、管理が複雑になる。1台に集める集中処理は管理が容易だが単一障害点となる。
    related: [クラスタ, ピアツーピア]
  - term: デュアルシステム
    reading: デュアルシステム
    simple: 2組のシステムで同じ処理を同時に行い、結果を照らし合わせる、とても信頼性の高い構成です。
    definition: 2系統のシステムが同一の処理を並行して実行し、結果を照合する構成。一方の故障時も他方で処理を継続できる。
    related: [デュプレックスシステム]
  - term: デュプレックスシステム
    reading: デュプレックスシステム
    aliases: [アクティブ-スタンバイ構成]
    simple: 普段は片方（主系）だけで処理し、故障したらもう片方（待機系）に切り替える構成です。
    definition: 主系（現用系）で処理を行い、待機系が障害時に処理を引き継ぐ構成。待機系を起動しておくホットスタンバイと、障害時に起動するコールドスタンバイがある。全系で同時に処理するのはアクティブ-アクティブ構成。
    related: [デュアルシステム, クラスタ]
  - term: バックアップサイト
    reading: バックアップサイト
    simple: 災害などで本番のシステムが使えなくなったときに備えて、別の場所に用意しておく代わりの拠点です。
    definition: 被災時に業務を継続するための代替拠点。常時稼働・同期するホットサイト、機器を用意し障害時に立ち上げるウォームサイト、場所や設備だけを用意するコールドサイトがある（復旧の速さと費用は前者ほど高い）。
    related: [デュプレックスシステム]
  - term: クラウドコンピューティング
    reading: クラウドコンピューティング
    aliases: [クラウド]
    simple: インターネット経由で、サーバやソフトウェアなどを必要な分だけ利用する形態です。
    definition: ネットワーク経由で共有の計算資源（サーバ、ストレージ、アプリケーション等）をオンデマンドに利用し、利用量に応じて対価を支払う形態。提供範囲により SaaS・PaaS・IaaS などに分類される。
    related: [SaaS, PaaS, IaaS, サーバレス]
  - term: SaaS
    reading: サース
    fullName: Software as a Service
    japanese: サービスとしてのソフトウェア
    words:
      - { en: Software, ja: ソフトウェア }
      - { en: as a Service, ja: サービスとして（所有せず利用する） }
    simple: メールや表計算などのアプリケーションを、インターネット経由で利用するサービスです。
    definition: アプリケーションソフトウェアの機能をネットワーク経由で提供するクラウドサービス。利用者はアプリケーションを利用するだけで、基盤の管理は事業者が行う。
    related: [PaaS, IaaS, クラウドコンピューティング]
  - term: PaaS
    reading: パース
    fullName: Platform as a Service
    japanese: サービスとしてのプラットフォーム
    words:
      - { en: Platform, ja: プラットフォーム（土台となる環境） }
      - { en: as a Service, ja: サービスとして }
    simple: アプリを作って動かすための土台（OS やデータベースなど）を借りるクラウドサービスです。
    definition: アプリケーションの開発・実行に必要な OS・ミドルウェア・実行環境などのプラットフォームを提供するクラウドサービス。
    related: [SaaS, IaaS]
  - term: IaaS
    reading: イアース
    fullName: Infrastructure as a Service
    japanese: サービスとしてのインフラ
    words:
      - { en: Infrastructure, ja: インフラ（基盤設備） }
      - { en: as a Service, ja: サービスとして }
    simple: 仮想サーバやストレージなどのインフラを借りるクラウドサービスで、OS から上は利用者が管理します。
    definition: 仮想マシン、ストレージ、ネットワークなどのインフラ資源を提供するクラウドサービス。OS 以上の層は利用者が管理する。
    related: [SaaS, PaaS, 仮想化]
  - term: 仮想化
    reading: かそうか
    simple: 1台の物理的なコンピュータの上で、複数のコンピュータがあるかのように動かす技術です。
    definition: 物理資源を抽象化し、論理的な資源として分割・統合して利用する技術。サーバ仮想化には、ハードウェア上で直接動くハイパーバイザー型、ホスト OS 上で動くホスト型、カーネルを共有するコンテナ型がある。稼働中の仮想マシンを別の物理サーバへ移すことをライブマイグレーションという。
    related: [コンテナ, VDI, IaaS]
  - term: コンテナ
    reading: コンテナ
    aliases: [コンテナ型仮想化]
    simple: アプリと動作に必要なものをひとまとめにして、軽く素早く動かせるようにする仮想化の方式です。
    definition: ホスト OS のカーネルを共有し、プロセスやファイルシステムを分離した実行環境（コンテナ）でアプリケーションを動かす仮想化方式。ゲスト OS が不要で軽量・高速に起動するが、ホストと異なる種類の OS は動かせない。
    related: [仮想化]
  - term: VDI
    reading: ブイディーアイ
    fullName: Virtual Desktop Infrastructure
    japanese: デスクトップ仮想化（仮想デスクトップ基盤）
    words:
      - { en: Virtual, ja: 仮想の }
      - { en: Desktop, ja: デスクトップ（PC の作業環境） }
      - { en: Infrastructure, ja: 基盤 }
    simple: パソコンの作業環境をサーバ上で動かし、手元の端末からは画面だけを操作する仕組みです。
    definition: 利用者ごとのデスクトップ環境をサーバ上の仮想マシンで実行し、端末へ画面を転送して操作させる仕組み。データが端末に残らず、管理を一元化できる。
    related: [シンクライアント, 仮想化]
  - term: シンクライアント
    reading: シンクライアント
    simple: 手元の端末には最小限の機能しか持たせず、処理やデータの保存をサーバで行う方式です。
    definition: 端末に表示・入力など最小限の機能だけをもたせ、アプリケーションの実行とデータの管理をサーバ側で行うシステム。情報漏えい対策や管理の一元化に有効。
    related: [VDI]
  - term: IaC
    reading: アイエーシー
    fullName: Infrastructure as Code
    japanese: コードとしてのインフラ
    words:
      - { en: Infrastructure, ja: インフラ（基盤設備） }
      - { en: as Code, ja: コード（プログラム）として }
    simple: サーバなどのインフラの構成をプログラムのように書いて、自動で作れるようにする方法です。
    definition: インフラの構成を設定ファイル等のコードで記述し、ツールにより自動で構築・変更する手法。再現性の確保、変更履歴の管理、作業ミスの削減に役立つ。
    related: [クラウドコンピューティング]
  - term: エッジコンピューティング
    reading: エッジコンピューティング
    simple: データが生まれる場所の近くでデータを処理して、応答を速くし通信量を減らす考え方です。
    definition: IoT 機器や利用者の近く（ネットワークの端）に配置したサーバでデータを処理する分散処理の形態。低遅延化と通信量削減に有効。
    related: [クラウドコンピューティング]
  - term: サーバレス
    reading: サーバレス
    aliases: [Function as a Service]
    simple: サーバの管理を気にせず、処理（関数）を置いておくだけで必要なときに実行されるクラウドの使い方です。
    definition: 利用者がサーバの構築・運用を意識せず、イベント駆動で関数を実行させるクラウドの利用形態（FaaS）。実行した分だけ課金され、負荷に応じて自動で拡張される。
    related: [クラウドコンピューティング]
  - term: ピアツーピア
    reading: ピアツーピア
    aliases: [P2P]
    simple: サーバを通さずに、コンピュータ同士が対等な立場で直接やり取りする方式です。
    definition: ネットワーク上のノードが対等な関係で直接通信する方式。多数のコンピュータの遊休資源を束ねて大規模計算を行う方式はグリッドコンピューティングという。
    related: [分散処理]
  - term: HPC
    reading: エイチピーシー
    fullName: High Performance Computing
    japanese: 高性能計算
    words:
      - { en: High Performance, ja: 高性能の }
      - { en: Computing, ja: 計算・コンピューティング }
    simple: スーパーコンピュータなどで、大規模な計算をとても速く行う技術です。
    definition: 多数のプロセッサを用いた大規模並列処理により、科学技術計算などを高速に行う技術。
    related: [クラスタ]
  - term: 3層クライアントサーバシステム
    reading: さんそうクライアントサーバシステム
    simple: システムを「画面」「業務処理」「データ管理」の3つの層に分けて作る方式です。
    definition: プレゼンテーション層（利用者インタフェース）、ファンクション層（業務処理）、データベースアクセス層（データ操作）に分割したクライアントサーバシステム。層ごとの変更・拡張が容易になる。クライアントからサーバの手続を呼ぶ仕組みに RPC（遠隔手続呼出し）がある。
    related: [Webサーバ]
  - term: Webサーバ
    reading: ウェブサーバ
    simple: ブラウザからの要求を受けて、Web ページなどを送り返すサーバです。
    definition: HTTP の要求を受けて HTML などのコンテンツを返すサーバ。一般的な Web システムは、Web サーバ・アプリケーションサーバ・データベースサーバの階層で構成される。
    related: [3層クライアントサーバシステム, HTTP]
  - term: RAID
    reading: レイド
    fullName: Redundant Arrays of Inexpensive Disks
    japanese: 安価なディスクの冗長配列
    words:
      - { en: Redundant, ja: 冗長な（予備をもつ） }
      - { en: Arrays, ja: 配列・並び }
      - { en: Inexpensive, ja: 安価な（Independent＝独立した とする説明もある） }
      - { en: Disks, ja: ディスク }
    simple: 複数のハードディスクを組み合わせて、速く・壊れにくくする技術です。
    definition: 複数のディスクを1台のように扱う技術。RAID0（ストライピング、冗長性なし）、RAID1（ミラーリング、容量半分）、RAID5（パリティ分散、1台故障に耐え実効容量は n−1 台分）、RAID6（2種のパリティ、2台故障に耐え n−2 台分）、RAID10（ミラーリング＋ストライピング）。
    related: [NAS, SAN]
  - term: NAS
    reading: ナス
    fullName: Network Attached Storage
    japanese: ネットワーク接続ストレージ
    words:
      - { en: Network, ja: ネットワーク }
      - { en: Attached, ja: 接続された }
      - { en: Storage, ja: ストレージ（記憶装置） }
    simple: LAN につないで、みんなでファイルを共有できる記憶装置です。
    definition: LAN に直接接続し、ファイル共有プロトコルでファイル単位のアクセスを提供する記憶装置。
    related: [SAN, RAID]
  - term: SAN
    reading: サン
    fullName: Storage Area Network
    japanese: ストレージエリアネットワーク
    words:
      - { en: Storage, ja: ストレージ（記憶装置） }
      - { en: Area, ja: 領域 }
      - { en: Network, ja: ネットワーク }
    simple: サーバと記憶装置だけをつなぐ専用の高速ネットワークです。
    definition: サーバとストレージを Fibre Channel や iSCSI などの専用ネットワークで接続し、ブロック単位でアクセスさせる仕組み。
    related: [NAS]
  - term: フェールセーフ
    reading: フェールセーフ
    simple: 故障したときに、安全な側（例えば停止）に倒れるように作っておく考え方です。
    definition: 障害発生時にシステムを安全な状態に移行させる設計思想。障害が起きても機能を維持するのはフォールトトレランス、障害の発生自体を防ぐのはフォールトアボイダンス。
    related: [フェールソフト, フールプルーフ]
  - term: フェールソフト
    reading: フェールソフト
    aliases: [縮退運転]
    simple: 故障した部分を切り離し、機能や性能を落としてでも動き続けるようにする考え方です。
    definition: 障害時に障害部分を切り離して、機能を縮小した状態で運転を継続する設計思想（縮退運転）。
    related: [フェールセーフ]
  - term: フールプルーフ
    reading: フールプルーフ
    simple: 人がうっかり間違った操作をしても、事故や誤動作が起きないようにする工夫です。
    definition: 利用者の誤操作によって危険な状態や誤動作が生じないようにする設計思想。入力チェック、確認画面、物理的な誤挿入防止など。
    related: [フェールセーフ]
  - term: スループット
    reading: スループット
    simple: 一定時間にどれだけたくさんの仕事を処理できるかを表す指標です。
    definition: 単位時間あたりに処理される仕事量。トランザクション数/秒、ビット/秒などで表す。
    related: [レスポンスタイム]
  - term: レスポンスタイム
    reading: レスポンスタイム
    aliases: [応答時間]
    simple: 要求を出してから、最初の応答が返ってくるまでの時間です。
    definition: 利用者が要求の入力を終えてから最初の応答が得られるまでの時間。ジョブの投入から結果がすべて得られるまでの時間はターンアラウンドタイム。
    related: [スループット]
  - term: ベンチマーク
    reading: ベンチマーク
    simple: 決まったテスト用プログラムを実際に動かして、コンピュータの性能を比べる方法です。
    definition: 標準化された評価用プログラムを実行して性能を測定・比較する方法。TPC（トランザクション処理）、SPECint・SPECfp（CPU の整数・浮動小数点演算）などがある。
    related: [スループット]
  - term: スケールアウト
    reading: スケールアウト
    simple: サーバの台数を増やして処理能力を上げることです。
    definition: サーバを追加して処理を分散し、システム全体の処理能力を高めること。個々のサーバの性能を上げるのはスケールアップ。
    related: [キャパシティプランニング]
  - term: キャパシティプランニング
    reading: キャパシティプランニング
    aliases: [サイジング]
    simple: 将来の利用量を予測して、必要なサーバの性能や台数を前もって計画することです。
    definition: 資源の使用状況の測定と業務量の予測に基づき、必要な処理能力・容量を見積もってシステム構成や増強を計画する活動。
    related: [スケールアウト]
  - term: RASIS
    reading: レイシス
    fullName: Reliability, Availability, Serviceability, Integrity, Security
    japanese: 信頼性・可用性・保守性・完全性・安全性
    words:
      - { en: Reliability, ja: 信頼性（故障しにくさ） }
      - { en: Availability, ja: 可用性（使いたいときに使えること） }
      - { en: Serviceability, ja: 保守性（直しやすさ） }
      - { en: Integrity, ja: 完全性（データに矛盾がないこと） }
      - { en: Security, ja: 安全性（守られていること） }
    simple: システムの信頼性を評価する5つの観点の頭文字をとった言葉です。
    definition: 信頼性（MTBF）、可用性（稼働率）、保守性（MTTR）、完全性、安全性の5つの評価項目。
    related: [MTBF, MTTR, 稼働率]
  - term: MTBF
    reading: エムティービーエフ
    fullName: Mean Time Between Failures
    japanese: 平均故障間隔
    words:
      - { en: Mean, ja: 平均の }
      - { en: Time, ja: 時間 }
      - { en: Between, ja: 〜の間の }
      - { en: Failures, ja: 故障 }
    simple: 故障してから次に故障するまでの、平均の稼働時間です。長いほど故障しにくいことを表します。
    definition: 修理可能なシステムで、故障から次の故障までに正常稼働している時間の平均。故障率は 1/MTBF。
    related: [MTTR, 稼働率]
  - term: MTTR
    reading: エムティーティーアール
    fullName: Mean Time To Repair
    japanese: 平均修復時間
    words:
      - { en: Mean, ja: 平均の }
      - { en: Time, ja: 時間 }
      - { en: To Repair, ja: 修理するまでの }
    simple: 故障を直すのにかかる平均の時間です。短いほど直しやすいことを表します。
    definition: 故障発生から修復完了までに要する時間の平均。保守性の指標。
    related: [MTBF, 稼働率]
  - term: 稼働率
    reading: かどうりつ
    simple: システムが使える状態にある時間の割合です。
    definition: MTBF÷(MTBF＋MTTR)。直列接続の稼働率は各稼働率の積、並列接続（いずれかが稼働すればよい）は 1−Π(1−各稼働率)。
    example: 稼働率 0.9 の装置2台を並列にすると 1−0.1²＝0.99。
    related: [MTBF, MTTR, RASIS]
  - term: バスタブ曲線
    reading: バスタブきょくせん
    simple: 機械の故障率が「使い始め」「安定期」「劣化期」で変わる様子を表した、浴槽のような形のグラフです。
    definition: 故障率の時間変化を表す曲線。初期故障期（減少）、偶発故障期（一定）、摩耗故障期（増加）からなる。
    related: [MTBF]
  - term: TCO
    reading: ティーシーオー
    fullName: Total Cost of Ownership
    japanese: 総所有コスト
    words:
      - { en: Total, ja: 総計の }
      - { en: Cost, ja: 費用 }
      - { en: of Ownership, ja: 所有することの }
    simple: システムを買ってから使い終わるまでにかかる、すべての費用の合計です。
    definition: 導入費用（初期費用）に運用・保守・教育・管理などの費用を加えた、システムのライフサイクル全体の総費用。
    related: [ROI]
  - term: クラスタ
    reading: クラスタ
    simple: 複数のコンピュータをまとめて、1台のコンピュータのように動かす仕組みです。
    definition: 複数のコンピュータを結合して全体を1つのシステムとして運用する構成。可用性を高める HA クラスタ、性能を高める負荷分散クラスタなどがある。
    related: [分散処理, HPC]
  - term: リアルタイム処理
    reading: りあるたいむしょり
    simple: 要求を受けたらすぐに、決められた時間内に処理して結果を返す方式です。
    definition: データの発生や要求に対して、定められた時間制約の中で即時に処理して応答する処理形態。制御システムや座席予約などで用いられる。
    related: [バッチ処理, 対話型処理]
  - term: 対話型処理
    reading: たいわがたしょり
    aliases: [会話型処理]
    simple: 利用者が入力するたびに、システムが応答を返すやり取りをしながら進める処理です。
    definition: 利用者とシステムが対話的に入力と応答を繰り返しながら進める処理形態。バッチ処理と対比される。
    related: [バッチ処理, リアルタイム処理]
  - term: オンライントランザクション処理
    reading: おんらいんとらんざくしょんしょり
    aliases: [OLTP]
    simple: 端末からの取引要求を、その都度すぐに処理する方式です(銀行ATMなど)。
    definition: 端末からの更新・照会などのトランザクションをその場で処理し、結果を即座に返す処理形態。ATM や座席予約システムなどが例で、ACID 特性の保証が重要。
    related: [バッチ処理, トランザクション, データウェアハウス]
  - term: 集中処理
    reading: しゅうちゅうしょり
    simple: "1台の大型コンピュータに処理を集めて行う方式です。"
    definition: 処理やデータを1か所（1台）のコンピュータに集中させて行う処理形態。管理は容易だが、障害時の影響が大きく、負荷が集中しやすい。
    related: [分散処理]
  - term: 垂直分散
    reading: すいちょくぶんさん
    simple: 処理を上位・下位の階層に分けて、役割分担させる分散のしかたです。
    definition: 本社と支社など、階層的な関係をもつコンピュータ間で処理を役割分担する分散処理の形態。
    related: [分散処理, 水平分散]
  - term: 水平分散
    reading: すいへいぶんさん
    simple: 同じ役割のコンピュータを並べて、処理を分担させる分散のしかたです。
    definition: 対等な関係にある複数のコンピュータが同じ種類の処理を分担して行う分散処理の形態。
    related: [分散処理, 垂直分散]
  - term: ホットスタンバイ
    reading: ほっとすたんばい
    simple: 待機系も常に稼働状態にしておき、障害時にすぐ切り替える方式です。
    definition: 待機系のシステムを主系と同じ状態で常に起動しておき、主系の障害時に直ちに切り替える方式。切替えが速い。
    related: [デュプレックスシステム, コールドスタンバイ]
  - term: コールドスタンバイ
    reading: こーるどすたんばい
    simple: 待機系を止めておき、障害が起きてから起動して切り替える方式です。
    definition: 待機系を停止しておき、主系の障害時に待機系を起動し、プログラムの起動などを行って切り替える方式。切替えに時間がかかる。
    related: [デュプレックスシステム, ホットスタンバイ]
  - term: アクティブ-アクティブ構成
    reading: あくてぃぶあくてぃぶこうせい
    simple: 複数のシステムが両方とも稼働して処理を分担し、一方が止まっても続けられる構成です。
    definition: 複数のシステムがすべて稼働状態で処理を分担し、障害時には残りのシステムが処理を引き継ぐ構成。資源を有効に使えるが、デュアルシステム（互いに結果を照合）とは別の考え方である。
    related: [デュプレックスシステム, クラスタ]
  - term: 主系
    reading: しゅけい
    simple: 通常時に実際の処理を担当するシステムです。
    definition: デュプレックスシステムで通常時にオンライン処理などを担当する系統。障害時には待機系が処理を引き継ぐ。
    related: [デュプレックスシステム, 待機系]
  - term: 待機系
    reading: たいきけい
    simple: 主系が故障したときに備えて待機しているシステムです。
    definition: デュプレックスシステムで主系の障害に備えて待機している系統。ホットスタンバイやコールドスタンバイなど待機の方法がある。
    related: [デュプレックスシステム, 主系]
  - term: ホットサイト
    reading: ほっとさいと
    simple: 本番と同じ設備を常に動かし、すぐに引き継げる代替拠点です。
    definition: 本番システムと同等の設備を常時稼働させ、データも同期しておく代替拠点。切替えがほぼ即時だが、費用が最も高い。
    related: [バックアップサイト, ウォームサイト, コールドサイト]
  - term: ウォームサイト
    reading: うぉーむさいと
    simple: 設備は用意してあるが、データの同期や起動に時間がかかる、中間的な代替拠点です。
    definition: 設備は用意しているが、業務の再開にはデータの復元や設定などの作業が必要な代替拠点。ホットサイトとコールドサイトの中間の費用と復旧時間。
    related: [バックアップサイト, ホットサイト, コールドサイト]
  - term: コールドサイト
    reading: こーるどさいと
    simple: 場所と最低限の設備だけを用意しておく、復旧に最も時間がかかる代替拠点です。
    definition: 建物や電源など最低限の環境のみを確保し、災害時に機器の調達・設置から行う代替拠点。費用は安いが復旧に時間がかかる。
    related: [バックアップサイト, ホットサイト, ウォームサイト]
  - term: パブリッククラウド
    reading: ぱぶりっくくらうど
    simple: 不特定多数の利用者が、事業者のクラウドを共同で使う形態です。
    definition: クラウド事業者が提供する設備を、複数の利用者が共有して利用する形態。初期投資が不要で拡張しやすいが、自社専用ではない。
    related: [クラウドコンピューティング, プライベートクラウド]
  - term: プライベートクラウド
    reading: ぷらいベーとくらうど
    simple: 特定の組織だけが専用に使う、クラウド環境です。
    definition: 特定の組織が自社専用に構築または占有して利用するクラウド環境。統制しやすく、セキュリティ要件への対応に適する。
    related: [クラウドコンピューティング, パブリッククラウド]
  - term: 仮想マシン
    reading: かそうましん
    aliases: [VM]
    simple: 物理的なコンピュータの上に、ソフトウェアで作り出した仮想のコンピュータです。
    definition: ハイパーバイザなどの仮想化技術により、1台の物理コンピュータ上に作られた仮想的なコンピュータ。それぞれが独自の OS をもって独立に動作する。VM ともいう。
    related: [仮想化, ハイパーバイザー]
  - term: ハイパーバイザー
    reading: はいぱーばいざー
    simple: 仮想マシンを作って動かすための、仮想化の基盤となるソフトウェアです。
    definition: 物理コンピュータ上で仮想マシンを作成・管理・実行する仮想化ソフトウェア。ハイパーバイザー型とホスト型がある。
    related: [仮想化, 仮想マシン, ハイパーバイザー型, ホスト型]
  - term: ハイパーバイザー型
    reading: はいぱーばいざーがた
    simple: OSを介さず、ハードウェアの上に直接ハイパーバイザーを載せる仮想化方式です。
    definition: ホスト OS を介さず、ハードウェア上で直接ハイパーバイザーを動作させる仮想化方式。オーバーヘッドが小さく、サーバ用途に適する。
    related: [ハイパーバイザー, ホスト型]
  - term: ホスト型
    reading: ほすとがた
    simple: 通常のOSの上に仮想化ソフトを載せ、その上で仮想マシンを動かす方式です。
    definition: ホスト OS の上で仮想化ソフトウェアを動作させ、その上に仮想マシンを作る仮想化方式。導入が容易だが、ホスト OS 分のオーバーヘッドがある。
    related: [ハイパーバイザー, ハイパーバイザー型]
  - term: ライブマイグレーション
    reading: らいぶまいぐれーしょん
    simple: 仮想マシンを止めずに、別の物理サーバへ移動させる技術です。
    definition: 稼働中の仮想マシンを停止させずに、別の物理サーバへ移動する仮想化技術。メンテナンスや負荷分散のために使う。
    related: [仮想化, 仮想マシン]
  - term: FaaS
    reading: ふぁーす
    fullName: Function as a Service
    japanese: サービスとしての関数
    words:
      - { en: Function, ja: 関数（小さな処理） }
      - { en: as a Service, ja: サービスとして提供 }
    simple: 関数単位のプログラムを登録しておくと、呼ばれたときだけ実行されるクラウドサービスです。
    definition: 利用者が関数単位のコードを登録し、イベントを契機にクラウド上で実行されるサービス。実行した分だけ課金される。サーバレスの代表的な実現形態。
    related: [サーバレス, クラウドコンピューティング]
  - term: グリッドコンピューティング
    reading: ぐりっどこんぴゅーてぃんぐ
    simple: ネットワーク上の多数のコンピュータを束ねて、1つの大きな計算機のように使う技術です。
    definition: ネットワークで接続された多数のコンピュータの計算資源を統合し、仮想的な高性能コンピュータとして大規模な計算を行う技術。
    related: [ピアツーピア, 分散処理]
  - term: クライアントサーバシステム
    reading: くらいあんとさーばしすてむ
    simple: 要求を出すクライアントと、処理して応えるサーバに役割を分けたシステムです。
    definition: サービスを要求するクライアントと、要求を受けて処理・応答するサーバとに機能を分担する分散システムの形態。2層と3層などがある。
    related: ["3層クライアントサーバシステム", Webサーバ]
  - term: プレゼンテーション層
    reading: ぷれぜんてーしょんそう
    simple: 画面表示や入力など、利用者とやり取りする層です。
    definition: "3層クライアントサーバシステムで、利用者への表示と入力の受付を担当する層。クライアント側にある。"
    related: ["3層クライアントサーバシステム", ファンクション層, データベースアクセス層]
  - term: ファンクション層
    reading: ふぁんくしょんそう
    simple: 業務のルールや計算など、アプリケーションの処理を行う層です。
    definition: "3層クライアントサーバシステムで、業務ロジック（アプリケーションの処理）を担当する層。アプリケーションサーバが担う。"
    related: ["3層クライアントサーバシステム", プレゼンテーション層, データベースアクセス層]
  - term: データベースアクセス層
    reading: でーたべーすあくせすそう
    simple: データベースの読み書きを担当する層です。
    definition: "3層クライアントサーバシステムで、データベースへのアクセス（検索・更新）を担当する層。データベースサーバが担う。"
    related: ["3層クライアントサーバシステム", ファンクション層]
  - term: RPC
    reading: あーるぴーしー
    fullName: Remote Procedure Call
    japanese: 遠隔手続呼出し
    words:
      - { en: Remote, ja: 遠隔の }
      - { en: Procedure, ja: 手続（関数） }
      - { en: Call, ja: 呼出し }
    simple: ネットワークの向こうにあるプログラムの関数を、手元の関数のように呼び出す仕組みです。
    definition: ネットワーク上の別のコンピュータにあるプログラムの手続を、ローカルな手続と同様に呼び出す仕組み。クライアントサーバシステムの通信で使われる。
    related: ["3層クライアントサーバシステム", ミドルウェア]
  - term: アプリケーションサーバ
    reading: あぷりけーしょんさーば
    simple: 業務処理など、アプリケーションのプログラムを実行するサーバです。
    definition: 業務ロジックなどのアプリケーションプログラムを実行するサーバ。Web サーバからの要求を受けて処理し、必要に応じてデータベースサーバにアクセスする。
    related: [Webサーバ, データベースサーバ]
  - term: データベースサーバ
    reading: でーたべーすさーば
    simple: データベースを管理し、検索や更新の要求に応えるサーバです。
    definition: データベース管理システムを動かし、データの検索・更新要求を処理するサーバ。
    related: [Webサーバ, アプリケーションサーバ]
  - term: Webシステム
    reading: うぇぶしすてむ
    simple: Webブラウザから使う、Web技術で作られたシステムです。
    definition: Web ブラウザをクライアントとし、Web サーバ、アプリケーションサーバ、データベースサーバなどで構成されるシステム。
    related: [Webサーバ, アプリケーションサーバ]
  - term: RAID0
    reading: れいどぜろ
    aliases: [ストライピング]
    simple: データを複数のディスクに分けて書き込み、高速化する方式です。冗長性はありません。
    definition: データを複数のディスクに分割して並列に読み書きする方式（ストライピング）。高速になるが冗長性がなく、1台故障すると全データを失う。
    related: [RAID, RAID1]
  - term: RAID1
    reading: れいどわん
    aliases: [ミラーリング]
    simple: 同じデータを2台以上のディスクに同時に書き込む方式です。
    definition: 同じデータを複数のディスクに同時に書き込む方式（ミラーリング）。1台が故障しても読み出せるが、使える容量は半分以下になる。
    related: [RAID, RAID0]
  - term: RAID5
    reading: れいどふぁいぶ
    simple: データとパリティを複数のディスクに分散して書き込む方式で、1台の故障まで耐えられます。
    definition: データとパリティ（誤り訂正符号）を3台以上のディスクに分散して記録する方式。1台の故障に耐えられ、実効容量は n−1 台分となる。
    related: [RAID, RAID6]
  - term: RAID6
    reading: れいどしっくす
    simple: パリティを2種類保存し、2台同時の故障まで耐えられる方式です。
    definition: "2種類のパリティを分散して記録する方式。2台のディスクが同時に故障してもデータを復元できる。実効容量は n−2 台分。"
    related: [RAID, RAID5]
  - term: RAID10
    reading: れいどてん
    aliases: [RAID1+0]
    simple: ミラーリングしたディスクの組をさらにストライピングする方式です。
    definition: ミラーリング（RAID1）したディスクの組を、さらにストライピング（RAID0）で束ねる方式。高速で冗長性もあるが、実効容量は半分になる。
    related: [RAID, RAID0, RAID1]
  - term: フォールトトレランス
    reading: ふぉーるととれらんす
    aliases: [フォールトトレラントシステム]
    simple: 部品が故障しても、システム全体としては機能を維持し続けるという考え方です。
    definition: 構成要素の一部に障害が発生しても、冗長構成などによって機能を継続できるようにする設計の考え方。そのように作られたシステムをフォールトトレラントシステムという。
    related: [フェールセーフ, フェールソフト, フォールトマスキング]
  - term: フォールトアボイダンス
    reading: ふぉーるとあぼいだんす
    simple: 高品質の部品を使うなど、故障そのものが起きにくくする考え方です。
    definition: 構成要素の品質向上や厳格な設計・検査によって、障害の発生そのものを避ける方針。
    related: [フェールセーフ, フォールトトレランス]
  - term: フォールトマスキング
    reading: ふぉーるとますきんぐ
    simple: 冗長な構成で、部品の故障が外から見えないように隠す方式です。
    definition: 多数決回路など冗長な構成によって、構成要素の障害が出力に現れないよう隠蔽する方式。
    related: [フォールトトレランス]
  - term: ターンアラウンドタイム
    reading: たーんあらうんどたいむ
    simple: 処理を依頼してから、結果がすべて返ってくるまでの時間です。
    definition: ジョブやプログラムを投入してから、結果の出力がすべて完了するまでの経過時間。主にバッチ処理の評価に用いる。入力完了から応答開始までを表すレスポンスタイムとは区別される。
    related: [レスポンスタイム, スループット]
  - term: TPC
    reading: てぃーぴーしー
    fullName: Transaction Processing Performance Council
    japanese: トランザクション処理性能評議会
    words:
      - { en: Transaction Processing, ja: トランザクション処理 }
      - { en: Performance, ja: 性能 }
      - { en: Council, ja: 評議会 }
    simple: データベースやトランザクション処理システムの性能を測る基準を決めている団体、およびその指標です。
    definition: トランザクション処理やデータベースの性能評価基準（TPC-C、TPC-H など）を策定する非営利団体。またその評価基準。
    related: [ベンチマーク, SPEC]
  - term: SPEC
    reading: すぺっく
    fullName: Standard Performance Evaluation Corporation
    japanese: 標準性能評価法人
    words:
      - { en: Standard, ja: 標準の }
      - { en: Performance Evaluation, ja: 性能評価 }
      - { en: Corporation, ja: 法人 }
    simple: CPUやサーバの性能を測る標準的なテストを決めている団体です。
    definition: コンピュータの性能評価基準（SPECint、SPECfp など）を策定する非営利団体。またその評価基準。
    related: [ベンチマーク, SPECint, SPECfp, TPC]
  - term: SPECint
    reading: すぺっくいんと
    simple: 整数演算の性能を測る、SPECのベンチマークです。
    definition: SPEC が策定した、整数演算を中心とした CPU 性能の評価基準。
    related: [SPEC, SPECfp]
  - term: SPECfp
    reading: すぺっくえふぴー
    simple: 浮動小数点演算の性能を測る、SPECのベンチマークです。
    definition: SPEC が策定した、浮動小数点演算を中心とした CPU 性能の評価基準。科学技術計算向けの性能を見る。
    related: [SPEC, SPECint]
  - term: モニタリング
    reading: もにたりんぐ
    simple: システムの稼働状況や性能を継続的に監視し、記録することです。
    definition: CPU 使用率、メモリ使用量、応答時間などを継続的に計測・監視して、システムの稼働状況や性能を把握すること。ベンチマークテストは標準的な負荷でのテストである点で異なる。
    related: [ベンチマーク, キャパシティプランニング]
  - term: スケールアップ
    reading: すけーるあっぷ
    simple: "1台のコンピュータの性能を高めて、処理能力を増やす方法です。"
    definition: CPU やメモリの増強・交換により、1台のサーバの処理能力を向上させる方法。スケールアウトと対比される。
    related: [スケールアウト, スケールダウン]
  - term: スケールイン
    reading: すけーるいん
    simple: サーバの台数を減らして、処理能力を縮小することです。
    definition: 負荷の低下に応じてサーバの台数を減らし、全体の処理能力を縮小すること。スケールアウトの逆。
    related: [スケールアウト, スケールダウン]
  - term: スケールダウン
    reading: すけーるだうん
    simple: "1台のコンピュータの性能を下げて、処理能力を縮小することです。"
    definition: "1台のサーバの CPU やメモリを減らす・小さい機種に替えるなどして処理能力を縮小すること。スケールアップの逆。"
    related: [スケールアップ, スケールイン]
  - term: プロビジョニング
    reading: ぷろびじょにんぐ
    simple: 必要な資源(サーバやネットワークなど)を事前に用意して、使える状態にすることです。
    definition: システムの利用に必要なサーバ、ストレージ、ネットワークなどの資源を準備し、利用可能な状態にすること。クラウドでは自動で払い出される。
    related: [キャパシティプランニング, クラウドコンピューティング]
  - term: 保守性（RASIS）
    reading: ほしゅせいらしす
    simple: 故障したときの修理や点検のしやすさを表す、RASISの要素です。
    definition: RASIS の S（Serviceability）。障害時の原因調査・修復・保守作業のしやすさを表す指標で、MTTR（平均修復時間）が短いほど高い。
    related: [RASIS, 稼働率]
  - term: 初期故障
    reading: しょきこしょう
    simple: 使い始めの時期に、設計や製造の不具合が原因で起こる故障です。
    definition: 稼働の初期に、設計・製造上の欠陥などによって発生する故障。時間とともに故障率が減少する。バスタブ曲線の左側にあたる。
    related: [バスタブ曲線, 偶発故障, 摩耗故障]
  - term: 偶発故障
    reading: ぐうはつこしょう
    simple: 安定した時期に、偶然に起こる故障です。
    definition: 初期故障期を過ぎた後、偶発的に発生する故障。故障率がほぼ一定の期間で、バスタブ曲線の平坦な部分にあたる。
    related: [バスタブ曲線, 初期故障, 摩耗故障]
  - term: 摩耗故障
    reading: まもうこしょう
    simple: 部品の劣化や寿命が原因で、使用末期に増える故障です。
    definition: 部品の摩耗・劣化・寿命により、使用期間の終わり頃に増加する故障。バスタブ曲線の右側の上昇部分にあたる。
    related: [バスタブ曲線, 初期故障, 偶発故障]
  - term: HAクラスタ
    reading: えいちえーくらすた
    fullName: High Availability cluster
    japanese: 高可用性クラスタ
    words:
      - { en: High Availability, ja: 高可用性 }
      - { en: cluster, ja: 複数のコンピュータの集まり }
    simple: 障害時にほかのサーバが処理を引き継いで、止まりにくくするクラスタです。
    definition: 複数のサーバを連携させ、一台が障害を起こしても他のサーバに処理を引き継ぐ（フェイルオーバー）ことで可用性を高めるクラスタ構成。
    related: [クラスタ, 負荷分散クラスタ]
  - term: 負荷分散クラスタ
    reading: ふかぶんさんくらすた
    aliases: [ロードシェアリング]
    simple: 複数のサーバに処理を振り分けて、負荷を分散するクラスタです。
    definition: 複数のサーバに処理要求を振り分けて負荷を分散し、全体の処理能力と可用性を高めるクラスタ構成。ロードバランシングともいう。
    related: [クラスタ, HAクラスタ]
