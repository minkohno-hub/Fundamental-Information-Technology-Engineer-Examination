category: 基礎理論
terms:
  - term: オーバーフロー
    reading: おーばーふろー
    aliases: [桁あふれ, 算術オーバーフロー]
    simple: 計算結果が、そのビット数で表せる範囲を超えてしまい、正しい値にならなくなることです。
    definition: 演算結果が、レジスタや変数のビット数で表現できる範囲を超えること。2の補数表現では、同符号の数の加算で結果の符号が反転したときに生じる。
    example: 8ビットの2の補数で 80＋48＝128 は表現範囲（−128〜127）を超え、10000000（−128）になってしまう。
    difference: 桁上げ（キャリー）が出ることと、符号付き整数のオーバーフローが起きることは別である。
    related: [2の補数, 算術シフト]
  - term: 固定小数点数
    reading: こていしょうすうてんすう
    simple: 小数点の位置をビット列のどこかに固定して、小数を整数と同じ仕組みで扱う表現です。
    definition: 全体のビット数のうち、整数部と小数部のビット数をあらかじめ決めておき、小数点の位置を固定して実数を表す数値表現。表せる値の間隔は一定（最下位ビットの重み）である。
    example: 16ビットで上位8ビットを整数部、下位8ビットを小数部とすると、最小の刻みは 2⁻⁸＝1/256。
    difference: 浮動小数点数は指数部で小数点位置が変わり、値の大きさに応じて刻みが変わる。
    related: [浮動小数点数, 丸め誤差]
  - term: 符号拡張
    reading: ふごうかくちょう
    simple: 2の補数のビット数を増やすとき、元の符号ビットと同じ値を上位に詰めて、値を変えずに桁数を増やすことです。
    definition: 2の補数で表した整数のビット幅を広げるとき、新しい上位ビットすべてに元の最上位ビット（符号ビット）をコピーして、数値を保つ操作。
    example: 8ビットの 10110100（−76）を16ビットに符号拡張すると 1111111110110100。
    difference: 0 を詰める拡張（ゼロ拡張）は符号なし整数向けで、負数に使うと値が変わる。
    related: [2の補数]
  - term: 恒真式
    reading: こうしんしき
    aliases: [トートロジー]
    simple: 含まれる命題の真偽がどうであっても、いつも真になる論理式のことです。
    definition: 論理式のうち、変数への真偽の割当てすべてについて真となるもの。真理値表の結果の列がすべて真になる。
    example: p ∨ ¬p、および ((p→q)∧p)→q は恒真式である。
    difference: 逆（q→p）や裏（¬p→¬q）は元の命題と真偽が一致するとは限らないが、対偶は必ず一致する。
    related: [命題論理, ド・モルガンの法則]
  - term: 部分集合
    reading: ぶぶんしゅうごう
    simple: ある集合の要素の一部（または全部、または何も含まない）を取り出してできる集合です。
    definition: 集合 A のすべての要素が集合 B にも属するとき、A は B の部分集合であるという。n 個の要素をもつ集合の部分集合は、空集合と自分自身を含めて 2ⁿ 個ある。
    example: '{a, b, c} の部分集合は、{}、{a}、{b}、{c}、{a,b}、{a,c}、{b,c}、{a,b,c} の 8 個。'
    difference: 真部分集合は自分自身を含まない部分集合で、要素数 n の集合では 2ⁿ−1 個。
    related: [ベン図]
