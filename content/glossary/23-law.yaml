category: 法務
terms:
  - term: 著作権
    reading: ちょさくけん
    simple: 文章・音楽・プログラムなどの作品を、作った人が勝手に使われないように守る権利です。
    definition: 著作物を創作した者に与えられる権利。創作と同時に手続なしで発生する（無方式主義）。複製権、公衆送信権、譲渡権、貸与権などの財産権からなり、譲渡できる。
    related: [著作物, 著作者人格権]
  - term: 著作物
    reading: ちょさくぶつ
    simple: 考えや気持ちを、文章・絵・音楽・プログラムなどの形で創作的に表したものです。
    definition: 思想又は感情を創作的に表現したもので、文芸・学術・美術・音楽の範囲に属するもの。プログラムも含まれるが、プログラム言語・規約・解法（アルゴリズム）は保護されない。
    related: [著作権]
  - term: 著作者人格権
    reading: ちょさくしゃじんかくけん
    simple: 作品を作った人の気持ちや名誉を守る権利で、他人に譲ることはできません。
    definition: 著作者の人格的利益を保護する権利。公表権、氏名表示権、同一性保持権からなり、譲渡できない。
    related: [著作権]
  - term: 引用
    reading: いんよう
    simple: 決まりを守れば、他人の作品の一部を許可なく自分の作品の中で使えることです。
    definition: 公表された著作物を、公正な慣行に合致し正当な範囲内で利用すること。主従関係、明瞭区別、出所の明示などが求められる。
    related: [著作権]
  - term: 産業財産権
    reading: さんぎょうざいさんけん
    aliases: [工業所有権]
    simple: 発明やデザイン、商品のマークなどを守る権利で、特許庁に登録して得られます。
    definition: 知的財産権のうち、特許権・実用新案権・意匠権・商標権の4つ。特許庁への出願・登録によって発生する。
    related: [特許権, 実用新案権, 意匠権, 商標権]
  - term: 特許権
    reading: とっきょけん
    aliases: [特許]
    simple: 新しい技術のアイデア（発明）を、一定期間独占して使えるようにする権利です。
    definition: 自然法則を利用した技術的思想の創作のうち高度なもの（発明）を保護する権利。存続期間は原則として出願から 20 年。
    related: [産業財産権, ビジネスモデル特許]
  - term: 実用新案権
    reading: じつようしんあんけん
    simple: 物の形や構造についての、ちょっとした工夫（考案）を守る権利です。
    definition: 物品の形状・構造・組合せに係る考案を保護する権利。実体審査を行わずに登録される。
    related: [産業財産権]
  - term: 意匠権
    reading: いしょうけん
    simple: 製品の形や模様、色などのデザインを守る権利です。
    definition: 物品などの形状・模様・色彩など、視覚を通じて美感を起こさせるデザイン（意匠）を保護する権利。
    related: [産業財産権]
  - term: 商標権
    reading: しょうひょうけん
    simple: 商品やサービスの名前・ロゴマークを守る権利で、更新すればずっと続けられます。
    definition: 商品やサービスに使用する文字・図形・記号などの商標を保護する権利。存続期間は登録から 10 年で、更新により延長できる。
    related: [産業財産権]
  - term: ビジネスモデル特許
    reading: ビジネスモデルとっきょ
    aliases: [ビジネス方法の特許]
    simple: IT を使って新しいビジネスのやり方を実現する仕組みについて取る特許です。
    definition: ビジネスの方法を ICT を利用して実現する仕組みに関する特許。ビジネスの方法そのもの（人為的取決め）は発明に該当しない。
    related: [特許権]
  - term: 営業秘密
    reading: えいぎょうひみつ
    simple: 会社が秘密として管理している、役に立つ、外に知られていない情報です。
    definition: 秘密として管理され（秘密管理性）、事業活動に有用な技術上又は営業上の情報で（有用性）、公然と知られていないもの（非公知性）。不正競争防止法で保護される。
    related: [不正競争防止法]
  - term: 不正競争防止法
    reading: ふせいきょうそうぼうしほう
    simple: 営業秘密を盗むことや、他社の有名な名前をまねることなど、ずるい競争を禁じる法律です。
    definition: 営業秘密の不正取得・使用、周知・著名な商品等表示の冒用、ドメイン名の不正取得、技術的制限手段の回避装置の提供などを不正競争として規制する法律。
    related: [営業秘密]
  - term: 不正アクセス禁止法
    reading: ふせいアクセスきんしほう
    simple: 他人の ID やパスワードを勝手に使ってコンピュータに入ることなどを禁止する法律です。
    definition: ネットワークを通じてアクセス制御されたコンピュータに他人の識別符号を無断で入力するなどの不正アクセス行為、その助長行為、識別符号の不正取得・保管、入力の不正要求（フィッシング）などを禁止する法律。
  - term: ウイルス作成罪
    reading: ウイルスさくせいざい
    aliases: [不正指令電磁的記録に関する罪, 不正指令電磁的記録作成罪]
    simple: 正当な理由なく、他人のパソコンで動かす目的でコンピュータウイルスを作ることなどを罰する刑法の罪です。
    definition: 刑法の不正指令電磁的記録に関する罪の通称。正当な理由なく、他人のコンピュータで実行させる目的でウイルスなどを作成・提供・供用・取得・保管する行為を処罰する。
    related: [コンピュータウイルス]
  - term: 電子計算機使用詐欺罪
    reading: でんしけいさんきしようさぎざい
    simple: コンピュータに嘘のデータを入れて、不正にお金などの利益を得る犯罪です。
    definition: 人の事務処理に使用するコンピュータに虚偽の情報や不正な指令を与えて不実の電磁的記録を作るなどし、財産上不法の利益を得る行為を処罰する刑法の罪。
  - term: 電子計算機損壊等業務妨害罪
    reading: でんしけいさんきそんかいとうぎょうむぼうがいざい
    simple: コンピュータやデータを壊したりして、業務を邪魔する犯罪です。
    definition: コンピュータや電磁的記録を損壊したり、虚偽の情報を与えたりして、コンピュータの動作を妨げ業務を妨害する行為を処罰する刑法の罪。
  - term: サイバーセキュリティ基本法
    reading: サイバーセキュリティきほんほう
    simple: 国全体でサイバーセキュリティに取り組むための基本的な考え方や、国などの役割を定めた法律です。
    definition: サイバーセキュリティに関する施策の基本理念を定め、国・地方公共団体などの責務を明らかにし、サイバーセキュリティ戦略の策定などを定めた法律。
  - term: 個人情報保護法
    reading: こじんじょうほうほごほう
    simple: 個人の情報を扱う会社などが守るべきルールを定めた法律です。
    definition: 個人情報の適正な取扱いのルールを定め、個人の権利利益を保護する法律。利用目的の特定、安全管理措置、第三者提供の制限などを定める。
    related: [個人情報, 個人情報保護委員会]
  - term: 個人情報
    reading: こじんじょうほう
    simple: 生きている人について、その人が誰か分かる情報です。
    definition: 生存する個人に関する情報で、特定の個人を識別できるもの（他の情報と容易に照合して識別できるものを含む）、又は個人識別符号が含まれるもの。
    related: [個人識別符号, 個人情報保護法]
  - term: 個人識別符号
    reading: こじんしきべつふごう
    simple: 指紋データやマイナンバー、運転免許証の番号など、それだけで誰か分かる符号です。
    definition: 身体の特徴をデータ化したもの（指紋、顔認証データなど）や、公的に割り当てられる番号（マイナンバー、旅券番号、運転免許証の番号など）として政令などで定めるもの。
    related: [個人情報]
  - term: マイナンバー法
    reading: マイナンバーほう
    simple: 国民一人一人に番号（マイナンバー）を付けて、行政手続で使うことを定めた法律です。
    definition: 行政手続における特定の個人を識別するための番号の利用等に関する法律。マイナンバーを含む個人情報を特定個人情報といい、厳格な取扱いを求める。
  - term: 要配慮個人情報
    reading: ようはいりょこじんじょうほう
    simple: 病歴や犯罪歴など、差別や偏見につながるおそれがあり、特に注意して扱う個人情報です。
    definition: 人種、信条、社会的身分、病歴、犯罪の経歴、犯罪被害の事実、障害、健康診断の結果など、取扱いに特に配慮を要する個人情報。取得には原則本人の同意が必要で、オプトアウトによる第三者提供はできない。
    related: [個人情報]
  - term: 仮名加工情報
    reading: かめいかこうじょうほう
    simple: ほかの情報と照らし合わせない限り誰か分からないように加工した、主に社内の分析用の情報です。
    definition: 他の情報と照合しない限り特定の個人を識別できないように個人情報を加工した情報。主に事業者内部での分析に用い、原則として第三者提供は禁止される。
    related: [匿名加工情報]
  - term: 匿名加工情報
    reading: とくめいかこうじょうほう
    simple: 誰か分からず、元にも戻せないように加工した情報で、ルールを守れば他社に提供できます。
    definition: 特定の個人を識別できず、元の個人情報を復元できないように加工した情報。作成時の公表などのルールの下で、本人の同意なく第三者に提供できる。
    related: [仮名加工情報]
  - term: オプトアウト
    reading: オプトアウト
    simple: 本人が「やめて」と言うまでは、同意なしで行ってよいとする方式です。
    definition: 本人の求めがあれば停止することを前提に、事前の同意なく個人データの第三者提供やメールの送信などを行う方式。個人データの第三者提供では、通知と個人情報保護委員会への届出が必要。
    related: [オプトイン, 第三者提供]
  - term: オプトイン
    reading: オプトイン
    simple: 本人が前もって「いいよ」と同意した場合だけ行ってよいとする方式です。
    definition: 事前に本人の同意を得た場合に限って、個人データの提供や広告メールの送信などを行う方式。
    related: [オプトアウト]
  - term: 第三者提供
    reading: だいさんしゃていきょう
    simple: 集めた個人データを、本人とその会社以外の人や会社に渡すことです。
    definition: 個人データを本人及び取り扱う事業者以外の者に提供すること。原則として本人の同意が必要。委託、事業承継、共同利用に伴う提供は第三者提供に該当しない。
    related: [オプトアウト]
  - term: 個人情報保護委員会
    reading: こじんじょうほうほごいいんかい
    simple: 個人情報が正しく扱われるよう、監督や指導を行う国の機関です。
    definition: 個人情報保護法やマイナンバー法に基づき、個人情報の適正な取扱いの確保を図るため監視・監督などを行う行政機関。
  - term: プライバシーマーク
    reading: プライバシーマーク
    aliases: [プライバシーマーク制度]
    simple: 個人情報をきちんと扱う体制がある会社に与えられるマークです。
    definition: JIS Q 15001 に基づいて個人情報を適切に取り扱う体制を整備している事業者を評価・認定し、マークの使用を認める制度。JIPDEC が運営する。
    related: [JIS Q 15001]
  - term: JIS Q 15001
    reading: ジスキューいちまんごせんいち
    simple: 会社が個人情報を守るための仕組み（マネジメントシステム）について定めた日本の規格です。
    definition: 個人情報保護マネジメントシステムの要求事項を定めた日本産業規格。プライバシーマーク制度の審査基準となる。
    related: [プライバシーマーク]
  - term: GDPR
    reading: ジーディーピーアール
    fullName: General Data Protection Regulation
    japanese: 一般データ保護規則
    words:
      - { en: General, ja: 一般の }
      - { en: Data Protection, ja: データ保護 }
      - { en: Regulation, ja: 規則 }
    simple: EU の個人データを守るための規則で、EU の外の会社にも適用されることがあります。
    definition: EU 域内の個人データ保護を目的とした規則。域外の事業者でも EU 域内の個人に商品やサービスを提供する場合などに適用され、域外への個人データの移転を制限する。
  - term: 電子署名法
    reading: でんししょめいほう
    aliases: [電子署名及び認証業務に関する法律]
    simple: 電子署名が、手書きのサインや押印と同じように認められるようにする法律です。
    definition: 本人による一定の電子署名が行われた電磁的記録は真正に成立したものと推定されることや、認証業務の認定制度などを定めた法律。
    related: [電子署名]
  - term: 情報公開法
    reading: じょうほうこうかいほう
    simple: 国の行政機関がもつ文書を、誰でも見せるよう請求できることを定めた法律です。
    definition: 行政機関の保有する情報の公開に関する法律。何人も行政文書の開示を請求でき、不開示情報を除いて開示される。
  - term: e-文書法
    reading: イーぶんしょほう
    simple: 法律で保存が決められた紙の書類を、電子データで保存してよいとする法律です。
    definition: 法令で民間事業者などに保存が義務付けられた書面について、電磁的記録による保存などを横断的に認める法律。
    related: [電子帳簿保存法]
  - term: 電子帳簿保存法
    reading: でんしちょうぼほぞんほう
    simple: 税金に関係する帳簿や書類を電子データで保存するためのルールを定めた法律です。
    definition: 国税関係の帳簿書類の電磁的記録による保存を認め、電子取引の取引情報の電磁的記録による保存などについて定めた法律。
    related: [e-文書法]
  - term: 情報流通プラットフォーム対処法
    reading: じょうほうりゅうつうプラットフォームたいしょほう
    aliases: [プロバイダ責任制限法]
    simple: ネットで権利を侵害する書込みがあったときの、プロバイダの責任や投稿者の情報開示などを定めた法律です。
    definition: 権利侵害情報の流通に関するプロバイダ等の損害賠償責任の制限、発信者情報の開示請求、大規模プラットフォーム事業者の削除対応の迅速化・透明化などを定めた法律。旧称はプロバイダ責任制限法。
  - term: 特定電子メール法
    reading: とくていでんしメールほう
    simple: 迷惑な広告メールを規制するための法律です。
    definition: 特定電子メールの送信の適正化等に関する法律。広告宣伝メールについて、原則オプトイン方式とし、送信者情報や受信拒否の連絡先の表示を義務付ける。
    related: [オプトイン]
  - term: 電子消費者契約法
    reading: でんししょうひしゃけいやくほう
    simple: ネットでの買物で、消費者が操作を間違えて契約してしまったときに守るための法律です。
    definition: 電子消費者契約において、事業者が確認措置を講じていない場合の消費者の操作ミスによる意思表示の取扱いなどを定めた法律。
  - term: 労働者派遣法
    reading: ろうどうしゃはけんほう
    simple: 派遣会社が雇う人を、別の会社で働かせる「派遣」のルールを定めた法律です。
    definition: 労働者派遣事業の適正な運営と派遣労働者の保護を定めた法律。派遣労働者は派遣元と雇用契約を結び、派遣先の指揮命令を受けて働く。
    related: [指揮命令, 二重派遣]
  - term: 指揮命令
    reading: しきめいれい
    aliases: [指揮命令関係]
    simple: 働く人に、仕事のやり方や時間などを指示することです。
    definition: 労働者に対して業務の遂行方法や時間などを指示すること。派遣では派遣先が、請負では受注者が自らの労働者に対して行う。
    related: [労働者派遣法, 偽装請負]
  - term: 雇用契約
    reading: こようけいやく
    simple: 働く人が会社の指示で働き、会社が給料を払うことを約束する契約です。
    definition: 労働者が使用者の指揮命令の下で労働に従事し、使用者がその対価として賃金を支払うことを約する契約。
  - term: 二重派遣
    reading: にじゅうはけん
    simple: 派遣で受け入れた人を、さらに別の会社に派遣することで、禁止されています。
    definition: 派遣先が受け入れた派遣労働者を、さらに別の企業に派遣してその指揮命令の下で働かせること。禁止されている。
    related: [労働者派遣法]
  - term: 労働基準法
    reading: ろうどうきじゅんほう
    simple: 労働時間や休日、賃金など、働く条件の最低限の基準を定めた法律です。
    definition: 労働条件の最低基準を定めた法律。法定労働時間（原則 1 日 8 時間・週 40 時間）、休日、賃金、年次有給休暇などを規定する。
    related: [36協定]
  - term: 36協定
    reading: サブロクきょうてい
    aliases: [サブロク協定]
    simple: 法律で決められた時間を超えて残業や休日出勤をさせるために、会社と労働者が結ぶ約束です。
    definition: 時間外労働や休日労働をさせる場合に、使用者が労働者の過半数代表などと書面で締結し、労働基準監督署に届け出る協定。労働基準法第 36 条に基づく。
    related: [労働基準法]
  - term: 裁量労働制
    reading: さいりょうろうどうせい
    aliases: [みなし労働時間制]
    simple: 仕事の進め方を本人に任せ、実際の時間に関係なく決めた時間働いたとみなす制度です。
    definition: 業務の遂行方法を労働者の裁量に大幅に委ね、実際の労働時間にかかわらず労使で定めた時間を労働したものとみなす制度。
    related: [フレックスタイム制]
  - term: フレックスタイム制
    reading: フレックスタイムせい
    simple: 決められた期間の総労働時間の範囲で、出社・退社の時刻を自分で決められる制度です。
    definition: 一定期間の総労働時間を定め、日々の始業・終業時刻を労働者が自ら決定できる制度。
    related: [裁量労働制]
  - term: ワークシェアリング
    reading: ワークシェアリング
    simple: 一人一人の労働時間を短くして仕事を分け合い、雇用を守ることです。
    definition: 労働時間を短縮して仕事を複数の労働者で分かち合い、雇用の維持や創出を図ること。
  - term: テレワーク
    reading: テレワーク
    simple: 自宅などの会社以外の場所で、IT を使って働くことです。
    definition: 情報通信技術を活用して、自宅やサテライトオフィスなど会社以外の場所で働く勤務形態。
  - term: 中小受託取引適正化法
    reading: ちゅうしょうじゅたくとりひきてきせいかほう
    aliases: [取適法, 下請法]
    simple: 発注する会社が、仕事を受ける中小企業に不当なことをしないよう定めた法律です（旧下請法）。
    definition: 下請法が改正・改称された法律。委託事業者に発注内容の明示や、受領日から 60 日以内のできる限り短い期間内での支払期日の設定などを義務付け、受領拒否・支払遅延・代金減額・不当な返品などを禁止する。
    related: [情報成果物]
  - term: 情報成果物
    reading: じょうほうせいかぶつ
    simple: プログラムやデザイン、映像などの、情報としての成果物です。
    definition: プログラム、映像、デザインなどの情報を内容とする成果物。その作成の委託は中小受託取引適正化法（旧下請法）の対象となる。
    related: [中小受託取引適正化法]
  - term: PL法
    reading: ピーエルほう
    fullName: Product Liability law
    japanese: 製造物責任法
    aliases: [製造物責任法]
    words:
      - { en: Product, ja: 製造物 }
      - { en: Liability, ja: 責任 }
      - { en: law, ja: 法 }
    simple: 製品の欠陥でけがなどをしたとき、メーカーの過失を証明しなくても賠償を求められる法律です。
    definition: 製造物の欠陥により生命・身体・財産に損害が生じた場合に、製造業者などが過失の有無にかかわらず損害賠償責任を負うことを定めた法律。ソフトウェア単体は製造物に含まれない。
  - term: 官民データ活用推進基本法
    reading: かんみんデータかつようすいしんきほんほう
    aliases: [官民データ]
    simple: 国や自治体、企業がもつデータを活用し、行政手続のオンライン化などを進めるための法律です。
    definition: 官民データの適正かつ効果的な活用を推進するための基本理念や、行政手続のオンライン利用の原則化などを定めた法律。
  - term: デジタル社会形成基本法
    reading: デジタルしゃかいけいせいきほんほう
    simple: デジタル社会を作るための基本的な考え方を定め、デジタル庁の設置などを決めた法律です。
    definition: デジタル社会の形成に関する基本理念、施策の基本方針、デジタル庁の設置、重点計画の作成などを定めた法律。
  - term: ソフトウェア使用許諾契約
    reading: ソフトウェアしようきょだくけいやく
    aliases: [ライセンス契約, 使用許諾契約]
    simple: ソフトウェアをどんな条件で使ってよいかを、権利者と利用者の間で決める契約です。
    definition: ソフトウェアの権利者が利用者に対し、使用の範囲や条件を定めて使用を許諾する契約。
    related: [シュリンクラップ契約]
  - term: シュリンクラップ契約
    reading: シュリンクラップけいやく
    simple: ソフトウェアの包装を開けたら、使用の条件に同意したとみなす契約です。
    definition: ソフトウェアのパッケージの包装を開封した時点で使用許諾契約に同意したとみなす契約形態。
    related: [ソフトウェア使用許諾契約]
  - term: サイトライセンス契約
    reading: サイトライセンスけいやく
    simple: 決められた事業所などの中であれば、台数を気にせずソフトを使えるようにする契約です。
    definition: 特定の企業や事業所などの範囲内で、ソフトウェアを台数の制限なく使用することを認める契約。
  - term: ボリュームライセンス契約
    reading: ボリュームライセンスけいやく
    simple: たくさんのライセンスをまとめて買うと、割引などが受けられる契約です。
    definition: 多数のライセンスを一括して購入する際に、割引などの条件で使用を許諾する契約。
  - term: CAL
    reading: キャル
    fullName: Client Access License
    japanese: クライアントアクセスライセンス
    words:
      - { en: Client, ja: クライアント }
      - { en: Access, ja: アクセス }
      - { en: License, ja: 使用許諾 }
    simple: サーバにつなぐパソコンや利用者の数に応じて買う必要があるライセンスです。
    definition: サーバ製品の機能を利用するクライアント（端末や利用者）の数に応じて必要となるライセンス。
  - term: 公益通報者保護法
    reading: こうえきつうほうしゃほごほう
    simple: 会社の法律違反を通報した社員などが、解雇などの不利な扱いを受けないように守る法律です。
    definition: 労働者などが事業者の法令違反行為を一定の要件の下で通報した場合に、解雇の無効や不利益な取扱いの禁止を定めて通報者を保護する法律。
    related: [内部告発]
  - term: 内部告発
    reading: ないぶこくはつ
    aliases: [内部通報]
    simple: 組織の中の人が、組織の不正を内部の窓口や外部に知らせることです。
    definition: 組織の構成員が、組織内の不正や法令違反を組織内の窓口や行政機関・報道機関などに通報すること。
    related: [公益通報者保護法]
  - term: コンプライアンス
    reading: コンプライアンス
    aliases: [法令遵守]
    simple: 法律だけでなく、社内のルールや社会の常識も守って行動することです。
    definition: 法令遵守。企業においては法令に加え、社内規程、企業倫理、社会規範などを守って公正に行動することを指す。
    related: [企業倫理]
  - term: 企業倫理
    reading: きぎょうりんり
    simple: 会社として正しく行動するための、道徳的な考え方や基準です。
    definition: 企業が社会の一員として守るべき道徳的な規範や価値基準。
    related: [コンプライアンス]
  - term: レピュテーションリスク
    reading: レピュテーションリスク
    simple: 悪い評判が広まって、会社の信用やブランドが傷つくリスクです。
    definition: 企業に対する否定的な評判が広まることで、信用やブランド価値が低下し、損失を被るリスク。
  - term: フィルターバブル
    reading: フィルターバブル
    simple: ネットで自分の好みの情報ばかり表示されて、違う意見に触れにくくなる状態です。
    definition: アルゴリズムが利用者の好みに合う情報を優先して表示することで、利用者が自分の見たい情報に囲まれ、異なる情報から隔離される状態。
    related: [エコーチェンバー]
  - term: エコーチェンバー
    reading: エコーチェンバー
    simple: 似た考えの人どうしで意見が響き合い、その考えが正しいと思い込みを強める現象です。
    definition: 価値観の似た者どうしが SNS などで交流し、同じ意見が反響し合うことで、特定の意見や思想が増幅される現象。
    related: [フィルターバブル]
  - term: デジタルタトゥー
    reading: デジタルタトゥー
    simple: 一度ネットに出た情報が、消せずにずっと残り続けることです。
    definition: インターネット上に公開された情報や画像が拡散・複製され、完全には削除できずに残り続けること。
  - term: ファクトチェック
    reading: ファクトチェック
    simple: ニュースや情報が本当かどうかを調べて確かめることです。
    definition: 社会に流通する情報や言説の事実関係を調査し、正確性を検証して結果を公表する活動。
  - term: 金融商品取引法
    reading: きんゆうしょうひんとりひきほう
    simple: 株などの取引を公正にし、投資家を守るための法律です。
    definition: 有価証券の発行・取引を公正にし、投資者を保護するための法律。上場企業などに有価証券報告書や内部統制報告書の提出を義務付ける。
    related: [内部統制報告書]
  - term: 内部統制報告書
    reading: ないぶとうせいほうこくしょ
    simple: 決算の報告が正しく作られる仕組みが有効かを、経営者が評価してまとめた報告書です。
    definition: 金融商品取引法に基づき、経営者が財務報告に係る内部統制の有効性を評価した結果を記載した報告書。公認会計士などの監査を受ける。
    related: [金融商品取引法, 内部統制]
  - term: IEEE
    reading: アイトリプルイー
    fullName: Institute of Electrical and Electronics Engineers
    japanese: 電気電子学会
    words:
      - { en: Institute, ja: 学会・協会 }
      - { en: of Electrical, ja: 電気の }
      - { en: and Electronics, ja: 電子の }
      - { en: Engineers, ja: 技術者 }
    simple: 電気・電子の分野の学会で、LAN の規格（IEEE 802 シリーズ）などを決めています。
    definition: 米国に本部を置く電気・電子分野の学会。LAN の IEEE 802 シリーズなどの標準化を行う。
  - term: W3C
    reading: ダブリュースリーシー
    fullName: World Wide Web Consortium
    japanese: ワールドワイドウェブコンソーシアム
    words:
      - { en: World Wide Web, ja: ワールドワイドウェブ }
      - { en: Consortium, ja: 共同事業体 }
    simple: HTML や CSS など、Web の技術の標準を決める団体です。
    definition: HTML、CSS、XML などの Web 技術の標準化を行う団体。
  - term: IETF
    reading: アイイーティーエフ
    fullName: Internet Engineering Task Force
    japanese: インターネット技術タスクフォース
    words:
      - { en: Internet, ja: インターネット }
      - { en: Engineering, ja: 技術 }
      - { en: Task Force, ja: 特別作業班 }
    simple: インターネットの技術の標準を決めて、RFC という文書で公開する団体です。
    definition: TCP/IP などインターネット技術の標準化を行う団体。仕様は RFC として公開される。
  - term: ITU
    reading: アイティーユー
    fullName: International Telecommunication Union
    japanese: 国際電気通信連合
    words:
      - { en: International, ja: 国際 }
      - { en: Telecommunication, ja: 電気通信 }
      - { en: Union, ja: 連合 }
    simple: 電気通信の分野の国際的な標準などを決める国連の機関です。
    definition: 電気通信分野の国際標準化や周波数の調整などを行う国連の専門機関。電気・電子技術分野の国際規格は IEC（国際電気標準会議）が策定する。
  - term: IEC
    reading: アイイーシー
    fullName: International Electrotechnical Commission
    japanese: 国際電気標準会議
    words:
      - { en: International, ja: 国際 }
      - { en: Electrotechnical, ja: 電気技術の }
      - { en: Commission, ja: 委員会・会議 }
    simple: 電気・電子の分野の国際規格を作る国際機関です。
    definition: 電気・電子技術分野の国際規格を策定する国際的な標準化機関。情報技術の分野では ISO と共同で ISO/IEC 規格（ISO/IEC 27001 など）を作成する。
    related: [ISO, ITU]
  - term: ISO
    reading: アイエスオー
    fullName: International Organization for Standardization
    japanese: 国際標準化機構
    words:
      - { en: International, ja: 国際 }
      - { en: Organization, ja: 機構 }
      - { en: for Standardization, ja: 標準化のための }
    simple: いろいろな分野の国際規格を作る国際機関です。
    definition: 工業製品やマネジメントシステムなど、幅広い分野の国際規格（IS）を策定する国際的な標準化機関。
    related: [JIS]
  - term: JIS
    reading: ジス
    fullName: Japanese Industrial Standards
    japanese: 日本産業規格
    aliases: [日本産業規格]
    words:
      - { en: Japanese, ja: 日本の }
      - { en: Industrial, ja: 産業の }
      - { en: Standards, ja: 規格 }
    simple: 日本の国家規格です。情報処理は JIS X、管理システムは JIS Q に分類されます。
    definition: 産業標準化法に基づく我が国の国家規格。情報処理は X 部門、管理システムは Q 部門。日本産業標準調査会（JISC）が審議する。
    related: [ISO]
  - term: ANSI
    reading: アンシ
    fullName: American National Standards Institute
    japanese: 米国規格協会
    words:
      - { en: American, ja: 米国の }
      - { en: National Standards, ja: 国家規格 }
      - { en: Institute, ja: 協会 }
    simple: アメリカの国家規格を決める団体です。
    definition: 米国の国家規格の策定・承認を行う標準化団体。
  - term: デファクトスタンダード
    reading: デファクトスタンダード
    aliases: [事実上の標準]
    simple: 市場で多くの人に使われた結果、事実上の標準になったものです。
    definition: 公的な標準化の手続によらず、市場競争の結果として広く普及し、事実上の標準となったもの。
    related: [デジュレスタンダード, フォーラム標準]
  - term: デジュレスタンダード
    reading: デジュレスタンダード
    aliases: [公的標準]
    simple: ISO や JIS など、公的な機関が決めた標準です。
    definition: ISO、IEC、JIS などの公的な標準化機関が定めた標準。
    related: [デファクトスタンダード]
  - term: フォーラム標準
    reading: フォーラムひょうじゅん
    simple: 関心のある複数の企業が集まって話し合い、決めた標準です。
    definition: 複数の企業や団体がフォーラム（コンソーシアム）を結成し、合意により策定する標準。
    related: [デファクトスタンダード]
  - term: QRコード
    reading: キューアールコード
    aliases: [2次元コード, 二次元コード]
    simple: 縦と横の両方向に情報を記録した、四角い模様のコードです。
    definition: 縦横 2 方向に情報を記録する 2 次元コード。3 隅の切り出しシンボルにより全方向から読み取れ、誤り訂正機能をもつ。
    related: [JANコード]
  - term: ISBNコード
    reading: アイエスビーエヌコード
    aliases: [ISBN]
    simple: 本を識別するために、世界共通で付けられる番号です。
    definition: 書籍を識別するために国際的に割り当てられる番号（International Standard Book Number）。
  - term: ISO/IEC 15408
    reading: アイエスオーアイイーシーいちまんごせんよんひゃくはち
    aliases: [コモンクライテリア, JIS X 5070]
    simple: IT 製品のセキュリティ機能を評価するための国際規格です。
    definition: IT 製品やシステムのセキュリティ機能や保証の要件を評価するための国際規格（コモンクライテリア）。JIS X 5070 シリーズとして規格化されている。
    related: [JISEC]
  - term: ISO 14001
    reading: アイエスオーいちまんよんせんいち
    aliases: [JIS Q 14001]
    simple: 会社が環境に配慮した活動を続けるための仕組みについての国際規格です。
    definition: 環境マネジメントシステムの要求事項を定めた国際規格。日本では JIS Q 14001。
  - term: ISO 9001
    reading: アイエスオーきゅうせんいち
    aliases: [JIS Q 9001]
    simple: 製品やサービスの品質を管理する仕組みについての国際規格です。
    definition: 品質マネジメントシステムの要求事項を定めた国際規格。日本では JIS Q 9001。
  - term: 共同利用
    reading: きょうどうりよう
    simple: 集めた個人データを、グループ会社など決めた相手と一緒に使うことです。
    definition: 個人データを特定の者との間で共同して利用すること。利用する個人データの項目、共同利用者の範囲、利用目的、管理責任者をあらかじめ本人に通知または公表すれば、個人情報保護法上は第三者提供に該当しないものとして扱われる。
    related: [第三者提供, 個人情報保護法]
  - term: 個人データ
    reading: こじんでーた
    simple: データベースなどに整理されて入っている、特定の個人に関する情報です。
    definition: 個人情報データベース等を構成する個人情報（個人情報保護法の用語）。個人データのうち、開示・利用停止等の対象となるものを保有個人データという。
    related: [個人情報保護法, 個人情報取扱事業者]
  - term: 個人情報取扱事業者
    reading: こじんじょうほうとりあつかいじぎょうしゃ
    simple: 会社の業務で個人情報のデータベースなどを使う事業者のことです。
    definition: 事業の用に供する個人情報データベース等を取り扱う者（個人情報保護法の用語）。個人データの安全管理措置や、本人への開示請求への対応などの義務を負う。
    related: [個人情報保護法, 個人データ]
  - term: 秘密管理性
    reading: ひみつかんりせい
    simple: その情報が、秘密としてきちんと管理されていることです。
    definition: 営業秘密の3要件の一つ。その情報が秘密として管理されていること。アクセス制限やマル秘表示などの管理実態が必要とされる。他の要件は有用性と非公知性。
    related: [営業秘密]
  - term: 識別符号
    reading: しきべつふごう
    simple: IDとパスワードなど、利用する権利があることを確認するための記号や番号です。
    definition: コンピュータへのアクセスなどに際し、アクセス管理者から利用権者などに割り当てられ、利用権者などを識別するために用いられる符号（不正アクセス禁止法の用語）。ID とパスワードの組合せなどが該当する。
    related: [不正アクセス禁止法]
  - term: 労働者派遣
    reading: ろうどうしゃはけん
    simple: 派遣会社と契約した人が、別の会社の指揮を受けて働くことです。
    definition: 自己の雇用する労働者を、当該雇用関係の下に、かつ、他人の指揮命令を受けて、当該他人のために労働に従事させること（労働者派遣法の定義）。派遣元が雇用し、派遣先が指揮命令を行う。
    related: [労働者派遣法]
  - term: 発信者情報開示請求
    reading: はっしんしゃじょうほうかいじせいきゅう
    simple: ネットで権利を侵害された人が、投稿した人の情報を出すよう求める手続きです。
    definition: インターネット上の投稿などで権利を侵害された者が、プロバイダ等に対して、発信者（投稿者）の氏名・住所などの情報の開示を求める請求。情報流通プラットフォーム対処法（旧プロバイダ責任制限法）に定められる。
    related: [情報流通プラットフォーム対処法]
  - term: 氏名表示権
    reading: しめいひょうじけん
    simple: 自分の作品に、自分の名前を出すかどうかを決められる権利です。
    definition: 著作者人格権の一つ。公衆への提供・提示に際し、著作者名を表示するか、表示する場合は実名か変名かを決定できる権利（著作権法19条）。
    related: [著作者人格権]
  - term: 同一性保持権
    reading: どういつせいほじけん
    simple: 自分の作品を、意に反して変えられない権利です。
    definition: 著作者人格権の一つ。著作物とその題号の同一性を保持し、意に反して変更・切除などを加えられない権利（著作権法20条）。
    related: [著作者人格権]
