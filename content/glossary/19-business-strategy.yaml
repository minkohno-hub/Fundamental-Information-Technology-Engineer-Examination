category: 経営戦略マネジメント
terms:
  - term: SWOT分析
    reading: スウォットぶんせき
    simple: 自社の強み・弱みと、外部の機会・脅威を整理する分析手法です。
    definition: 内部環境を強み（Strength）・弱み（Weakness）、外部環境を機会（Opportunity）・脅威（Threat）に分けて整理し、戦略立案に役立てる手法。
    related: [3C分析]
  - term: PPM
    reading: ピーピーエム
    fullName: Product Portfolio Management
    japanese: プロダクトポートフォリオマネジメント
    words:
      - { en: Product, ja: 製品 }
      - { en: Portfolio, ja: 組合せ }
      - { en: Management, ja: 管理 }
    simple: 市場成長率と市場シェアで事業を4つに分け、お金の配分を考える手法です。
    definition: 市場成長率と市場占有率を軸に事業を花形・金のなる木・問題児・負け犬に分類し、経営資源の配分を検討する手法。
  - term: ファイブフォース分析
    reading: ファイブフォースぶんせき
    aliases: [5フォース分析]
    simple: 業界の競争の激しさを5つの力から分析する手法です。
    definition: M.E.ポーターが提唱した、既存企業間の競争、新規参入者の脅威、代替品の脅威、買い手の交渉力、売り手の交渉力の5要因から業界の競争状態を分析する手法。
  - term: バリューチェーン
    reading: バリューチェーン
    aliases: [バリューチェーン分析, 価値連鎖]
    simple: 会社の活動を分けて、どこで価値が生まれているかを分析する考え方です。
    definition: 企業活動を主活動（購買物流・製造・出荷物流・販売とマーケティング・サービス）と支援活動に分け、各活動の価値とコストを分析する考え方。
  - term: 3C分析
    reading: スリーシーぶんせき
    simple: 顧客・競合・自社の3つの視点から事業環境を分析する手法です。
    definition: Customer（市場・顧客）、Competitor（競合）、Company（自社）の3つの観点から事業環境を分析する手法。
  - term: VRIO分析
    reading: ブリオぶんせき
    simple: 自社の経営資源が競争優位につながるかを4つの観点で評価する手法です。
    definition: 経営資源を経済的価値（Value）、希少性（Rarity）、模倣困難性（Imitability）、組織（Organization）の観点から評価する手法。
  - term: 成長マトリクス
    reading: せいちょうマトリクス
    aliases: [アンゾフの成長マトリクス]
    simple: 製品と市場を「既存・新規」に分けて、成長の方向を考える表です。
    definition: H.I.アンゾフが提唱した、製品と市場を既存・新規に分け、市場浸透・市場開拓・製品開発・多角化の4つの成長戦略を示すマトリクス。
  - term: コアコンピタンス
    reading: コアコンピタンス
    simple: 他社がまねできない、自社ならではの中核的な強みです。
    definition: 顧客に価値を提供する源泉となり、競合他社が容易に模倣できない自社の中核的な能力。
  - term: アライアンス
    reading: アライアンス
    aliases: [戦略的提携]
    simple: 会社どうしが独立したまま、開発や販売などで協力することです。
    definition: 複数の企業が独立性を保ちながら、技術開発・生産・販売などで協力関係を結ぶ戦略的提携。
    related: [M&A]
  - term: M&A
    reading: エムアンドエー
    fullName: Mergers and Acquisitions
    japanese: 合併・買収
    words:
      - { en: Mergers, ja: 合併 }
      - { en: Acquisitions, ja: 買収 }
    simple: 他の会社と合併したり、他の会社を買ったりすることです。
    definition: 企業の合併や買収によって、他社の経営資源を取り込む手法。
    related: [アライアンス]
  - term: ベンチマーキング
    reading: ベンチマーキング
    simple: 優れた他社のやり方と比べて、自社の業務を改善する手法です。
    definition: 優れた業績を上げている他社や他部門の手法（ベストプラクティス）を指標として自社と比較し、改善を図る手法。
  - term: 規模の経済
    reading: きぼのけいざい
    simple: たくさん作るほど、1個当たりのコストが下がることです。
    definition: 生産規模の拡大に伴い固定費が分散され、製品1単位当たりのコストが低下する効果。
    related: [範囲の経済, 経験曲線]
  - term: 範囲の経済
    reading: はんいのけいざい
    simple: 複数の事業で設備や技術を共有することで、コストが下がることです。
    definition: 複数の事業を同時に営み経営資源を共有することで、別々に営むよりも総コストが低くなる効果。
    related: [規模の経済]
  - term: 経験曲線
    reading: けいけんきょくせん
    aliases: [経験効果]
    simple: 作った累計の量が増えるほど、慣れや工夫でコストが下がっていく関係です。
    definition: 累積生産量の増加に伴い、習熟や改善によって単位当たりコストが一定の割合で低下する関係。
  - term: シェアードサービス
    reading: シェアードサービス
    simple: グループ会社の経理や人事などの業務を一か所にまとめて行うことです。
    definition: グループ企業の経理・人事などの間接業務を一つの組織に集約し、グループ全体にサービスとして提供する形態。
  - term: クラウドファンディング
    reading: クラウドファンディング
    simple: インターネットで多くの人から少しずつ資金を集める方法です。
    definition: インターネットを通じて不特定多数の人から事業やプロジェクトの資金を調達する方法。
  - term: 競争の基本戦略
    reading: きょうそうのきほんせんりゃく
    simple: ポーターが示した、低コスト・差別化・集中の3つの競争の戦い方です。
    definition: M.E.ポーターが提唱した、コストリーダーシップ戦略、差別化戦略、集中戦略の3つの競争戦略。
  - term: 同質化戦略
    reading: どうしつかせんりゃく
    simple: 業界トップの会社が、下位の会社の工夫をまねして効果を打ち消す戦略です。
    definition: 市場のリーダ企業が、下位企業の差別化策と同様の製品や施策を投入してその効果を打ち消す戦略。
  - term: ブルーオーシャン戦略
    reading: ブルーオーシャンせんりゃく
    simple: 競争の激しい市場を避け、競争のない新しい市場を作り出す戦略です。
    definition: 競争の激しい既存市場（レッドオーシャン）ではなく、新たな価値を提供して競争のない市場空間（ブルーオーシャン）を創造する戦略。
  - term: マーケティングミックス
    reading: マーケティングミックス
    aliases: ["4P"]
    simple: 製品・価格・流通・販売促進などの施策を組み合わせることです。
    definition: 売り手視点の 4P（Product, Price, Place, Promotion）などの施策を組み合わせること。買い手視点では 4C（Customer Value, Cost, Convenience, Communication）で考える。
  - term: STP分析
    reading: エスティーピーぶんせき
    simple: 市場を分け、狙う市場を選び、自社の立ち位置を決める手法です。
    definition: Segmentation（市場細分化）、Targeting（標的市場の選定）、Positioning（自社の位置付けの明確化）の順に行うマーケティング手法。
  - term: プロダクトライフサイクル
    reading: プロダクトライフサイクル
    simple: 製品が売り出されてから消えるまでを、4つの段階で表したものです。
    definition: 製品の市場投入から撤退までを導入期・成長期・成熟期・衰退期の4段階で表したもの。
  - term: ペネトレーションプライシング
    reading: ペネトレーションプライシング
    aliases: [浸透価格戦略]
    simple: 最初から安い価格にして、一気にシェアを取る価格戦略です。
    definition: 新製品の発売当初に低価格を設定し、短期間で市場に浸透させてシェアを獲得する価格戦略。
    related: [スキミングプライシング]
  - term: スキミングプライシング
    reading: スキミングプライシング
    aliases: [上澄み吸収価格戦略]
    simple: 最初は高い価格にして、早めに開発費を回収する価格戦略です。
    definition: 新製品の発売当初に高価格を設定し、価格に敏感でない初期購入者から早期に投資を回収する価格戦略。
    related: [ペネトレーションプライシング]
  - term: ダイナミックプライシング
    reading: ダイナミックプライシング
    simple: 需要や時期に合わせて価格をこまめに変える方法です。
    definition: 需要と供給の状況、時期、在庫などに応じて価格を変動させる価格設定の方法。
  - term: コストプラス法
    reading: コストプラスほう
    simple: 原価に一定の利益を上乗せして価格を決める方法です。
    definition: 製品の原価に一定の利益（マージン）を加えて販売価格を決める価格設定の方法。
  - term: カニバリゼーション
    reading: カニバリゼーション
    simple: 自社の新製品が、自社の既存製品の売上を奪ってしまうことです。
    definition: 自社の新製品や新しい販売チャネルが、自社の既存製品や既存チャネルの顧客・売上を奪う現象。
  - term: コモディティ化
    reading: コモディティか
    simple: 製品の違いがなくなり、価格だけで選ばれるようになることです。
    definition: 製品の機能や品質の差がなくなり、価格以外で差別化できなくなって価格競争に陥ること。
  - term: CVR
    reading: シーブイアール
    fullName: Conversion Rate
    japanese: 顧客転換率
    words:
      - { en: Conversion, ja: 転換 }
      - { en: Rate, ja: 率 }
    aliases: [コンバージョン率]
    simple: サイトに来た人のうち、購入などの成果につながった人の割合です。
    definition: Web サイトの訪問者のうち、購入や会員登録などの成果に至った割合。改善手法に LPO（ランディングページ最適化）などがある。
  - term: リスティング広告
    reading: リスティングこうこく
    aliases: [検索連動型広告]
    simple: 検索したキーワードに合わせて、検索結果のページに出る広告です。
    definition: 検索エンジンで入力されたキーワードに連動して検索結果ページに表示される広告。
  - term: アフィリエイト
    reading: アフィリエイト
    aliases: [成功報酬型広告]
    simple: 紹介したサイト経由で商品が売れると、紹介者に報酬が支払われる広告です。
    definition: 提携先の Web サイトに掲載した広告を経由して購入などの成果が発生した場合に、提携先に報酬が支払われる広告手法。
  - term: プッシュ戦略
    reading: プッシュせんりゃく
    simple: 販売店に働きかけて商品を押し込むのがプッシュ戦略、消費者に直接働きかけるのがプル戦略です。
    definition: 販売奨励金や営業活動で流通業者に働きかけて販売を推し進める戦略。広告などで消費者の需要を喚起して指名購買を促すプル戦略と対比される。
  - term: ワントゥワンマーケティング
    reading: ワントゥワンマーケティング
    simple: 顧客一人一人に合わせて、個別に商品やサービスを提案する手法です。
    definition: 顧客一人一人の購買履歴や嗜好に応じて、個別に異なるアプローチを行うマーケティング手法。
  - term: オムニチャネル
    reading: オムニチャネル
    simple: 店舗・EC サイト・アプリなどすべての販売経路をつないで、同じように買えるようにすることです。
    definition: 実店舗、EC サイト、アプリ、SNS などのあらゆる顧客接点を統合し、どのチャネルからでも一貫した購買体験を提供する流通戦略。
  - term: フランチャイズチェーン
    reading: フランチャイズチェーン
    simple: 本部が加盟店に看板やノウハウを提供し、使用料を受け取る仕組みです。
    definition: 本部が加盟店に商標・経営ノウハウなどを提供し、その対価として加盟店からロイヤルティを受け取る事業形態。
  - term: カスタマージャーニーマップ
    reading: カスタマージャーニーマップ
    simple: 顧客が商品を知ってから使うまでの行動や気持ちの変化を、時間の流れで描いた図です。
    definition: 顧客が製品やサービスを認知してから購入・利用に至るまでの行動、接点、感情の変化を時系列で可視化したもの。
    related: [ペルソナ]
  - term: ペルソナ
    reading: ペルソナ
    aliases: [ペルソナ法]
    simple: 製品を使う典型的な人物像を、具体的な架空の人として描いたものです。
    definition: 製品やサービスの典型的な利用者像を、年齢・職業・価値観などを具体的に設定した架空の人物として表したもの。
  - term: サービスブループリント
    reading: サービスブループリント
    simple: サービスの流れを、顧客から見える部分と裏側の部分に分けて描いた図です。
    definition: サービスの提供過程を、顧客の行動、顧客から見える活動、裏側の活動、支援プロセスに分けて図示したもの。
  - term: コンジョイント分析
    reading: コンジョイントぶんせき
    simple: 製品の特徴の組合せを変えた案を評価してもらい、何が購買に効くかを調べる手法です。
    definition: 製品の属性の組合せを変えた複数の案を顧客に評価させ、各属性が購買の意思決定に与える影響度を分析する手法。
  - term: BSC
    reading: ビーエスシー
    fullName: Balanced Scorecard
    japanese: バランススコアカード
    words:
      - { en: Balanced, ja: バランスのとれた }
      - { en: Scorecard, ja: 評価表 }
    aliases: [バランススコアカード]
    simple: 財務・顧客・業務プロセス・学習と成長の4つの視点で業績を評価する手法です。
    definition: 財務、顧客、業務プロセス、学習と成長の4つの視点から戦略目標と指標を設定し、戦略の実行を管理する業績評価手法。
  - term: CSF
    reading: シーエスエフ
    fullName: Critical Success Factor
    japanese: 重要成功要因
    words:
      - { en: Critical, ja: 決定的に重要な }
      - { en: Success, ja: 成功 }
      - { en: Factor, ja: 要因 }
    simple: 目標を達成するために、特に重要な成功のカギとなる要因です。
    definition: 目標を達成するために決定的に重要な要因。CSF に基づいて KPI を設定する。
    related: [KGI, KPI]
  - term: MVV
    reading: エムブイブイ
    fullName: Mission, Vision, Value
    japanese: ミッション・ビジョン・バリュー
    words:
      - { en: Mission, ja: 使命 }
      - { en: Vision, ja: 将来像 }
      - { en: Value, ja: 価値観 }
    simple: 会社の使命、目指す姿、大切にする価値観をまとめたものです。
    definition: 企業の使命（ミッション）、目指す将来像（ビジョン）、行動の基準となる価値観（バリュー）を示したもの。
  - term: ビジネスモデルキャンバス
    reading: ビジネスモデルキャンバス
    simple: ビジネスの仕組みを9つの要素で1枚の図にまとめる手法です。
    definition: 顧客セグメント、価値提案、チャネル、顧客との関係、収益の流れ、主要リソース、主要活動、キーパートナー、コスト構造の9ブロックでビジネスモデルを可視化する手法。
  - term: バリューエンジニアリング
    reading: バリューエンジニアリング
    aliases: [VE]
    simple: 価値を「機能÷コスト」と考え、必要な機能を最も安く実現する改善手法です。
    definition: 価値を機能とコストの比でとらえ、必要な機能を最低のコストで実現するよう製品やサービスを改善する手法。
  - term: シックスシグマ
    reading: シックスシグマ
    simple: 統計的手法で品質のばらつきを減らし、欠陥を極めて少なくする手法です。
    definition: 統計的手法を用いてプロセスのばらつきを抑え、欠陥の発生率を100万回当たり3.4回以下にすることを目指す品質管理手法。
  - term: TQM
    reading: ティーキューエム
    fullName: Total Quality Management
    japanese: 総合的品質管理
    words:
      - { en: Total, ja: 総合的な }
      - { en: Quality, ja: 品質 }
      - { en: Management, ja: 管理 }
    simple: 経営者から現場まで全員で、品質を継続的に改善する考え方です。
    definition: 経営者から従業員まで組織全体が参加し、製品・サービスや業務の品質を継続的に改善する管理手法。
  - term: ナレッジマネジメント
    reading: ナレッジマネジメント
    aliases: [KM]
    simple: 社員の知識やノウハウを共有して、組織全体で活用することです。
    definition: 個人がもつ知識やノウハウを組織で共有・活用し、組織全体の問題解決力や競争力を高める経営手法。
  - term: 花形
    reading: はながた
    simple: 市場の成長率も市場占有率も高い、PPMで投資が必要な事業です。
    definition: PPM で、市場成長率が高く相対的市場占有率も高い事業。成長のために多額の投資が必要だが、将来の金のなる木になる可能性が高い。
    related: [PPM, 金のなる木, 問題児, 負け犬]
  - term: 金のなる木
    reading: かねのなるき
    simple: 市場の成長率は低いが占有率が高く、資金を生み出してくれる事業です。
    definition: PPM で、市場成長率が低く相対的市場占有率が高い事業。投資が少なくて済み、資金を生み出すため、他の事業の投資に回せる。
    related: [PPM, 花形, 問題児, 負け犬]
  - term: 問題児
    reading: もんだいじ
    simple: 市場は成長しているが占有率が低い事業で、育てるか撤退かを判断します。
    definition: PPM で、市場成長率が高いが相対的市場占有率が低い事業。投資して花形に育てるか、撤退するかを判断する。
    related: [PPM, 花形, 金のなる木, 負け犬]
  - term: 負け犬
    reading: まけいぬ
    simple: 市場の成長率も占有率も低い事業で、撤退を検討します。
    definition: PPM で、市場成長率も相対的市場占有率も低い事業。原則として撤退や縮小を検討する。
    related: [PPM, 花形, 金のなる木, 問題児]
  - term: シナジー効果
    reading: しなじーこうか
    simple: 複数の事業や資源を組み合わせることで、個別に行うよりも大きな効果が生まれることです。
    definition: 複数の事業、資源、組織を組み合わせることで、単独で行うよりも大きな成果が得られる効果。範囲の経済は、シナジー効果の一種といえる。
    related: [範囲の経済, アライアンス]
  - term: 市場浸透戦略
    reading: しじょうしんとうせんりゃく
    simple: 既存の製品を、既存の市場でさらに売る戦略です。
    definition: アンゾフの成長マトリクスで、既存の製品を既存の市場でさらに拡大する戦略。
    related: [成長マトリクス, 市場開拓戦略, 製品開発戦略, 多角化戦略]
  - term: 市場開拓戦略
    reading: しじょうかいたくせんりゃく
    simple: 既存の製品を、新しい市場に展開する戦略です。
    definition: アンゾフの成長マトリクスで、既存の製品を新しい市場に投入して成長を図る戦略。
    related: [成長マトリクス, 市場浸透戦略, 製品開発戦略, 多角化戦略]
  - term: 製品開発戦略
    reading: せいひんかいはつせんりゃく
    simple: 新しい製品を、既存の市場に投入する戦略です。
    definition: アンゾフの成長マトリクスで、新しい製品を既存の市場に投入して成長を図る戦略。
    related: [成長マトリクス, 市場浸透戦略, 市場開拓戦略, 多角化戦略]
  - term: 多角化戦略
    reading: たかくかせんりゃく
    simple: 新しい製品を、新しい市場に投入する戦略で、最もリスクが高い戦略です。
    definition: アンゾフの成長マトリクスで、新しい製品を新しい市場に投入する戦略。経験が活かしにくく、リスクが最も大きい。
    related: [成長マトリクス, 市場浸透戦略, 市場開拓戦略, 製品開発戦略]
  - term: コストリーダーシップ戦略
    reading: こすとりーだーしっぷせんりゃく
    simple: 業界で最も低いコストを実現して、競争優位を築く戦略です。
    definition: ポーターの競争の基本戦略の一つで、規模の経済や経験効果などにより業界で最も低いコストを実現し、競争優位を築く戦略。
    related: [競争の基本戦略, 差別化戦略, 集中戦略]
  - term: 差別化戦略
    reading: さべつかせんりゃく
    simple: 製品やサービスに独自の特徴をもたせて、競争優位を築く戦略です。
    definition: ポーターの競争の基本戦略の一つで、製品やサービスに他社と異なる独自の価値をもたせ、競争優位を築く戦略。
    related: [競争の基本戦略, コストリーダーシップ戦略, 集中戦略]
  - term: 集中戦略
    reading: しゅうちゅうせんりゃく
    simple: 特定の市場や顧客に経営資源を集中して、競争優位を築く戦略です。
    definition: ポーターの競争の基本戦略の一つで、特定の市場セグメントや顧客層に経営資源を集中して、コスト面や差別化面で優位を築く戦略。
    related: [競争の基本戦略, コストリーダーシップ戦略, 差別化戦略]
  - term: レッドオーシャン
    reading: れっどおーしゃん
    simple: 競争相手が多く、激しい競争が行われている既存の市場です。
    definition: すでに存在する競争の激しい既存市場。血で血を洗う競争のイメージから赤い海に例えられ、ブルーオーシャンと対比される。
    related: [ブルーオーシャン戦略]
  - term: "4C"
    reading: よんしー
    fullName: "Customer value, Cost, Convenience, Communication"
    japanese: 顧客価値、顧客コスト、利便性、コミュニケーション
    words:
      - { en: Customer value, ja: 顧客にとっての価値 }
      - { en: Cost, ja: 顧客が負担する費用 }
      - { en: Convenience, ja: 入手しやすさ }
      - { en: Communication, ja: 対話 }
    simple: マーケティングミックスを、売り手ではなく買い手の視点で見直した4つの要素です。
    definition: 売り手の視点の 4P（製品、価格、流通、販促）を、買い手の視点に置き換えた枠組み。顧客価値、顧客コスト、利便性、コミュニケーションの 4 つ。
    related: [マーケティングミックス]
  - term: セグメンテーション
    reading: せぐめんてーしょん
    simple: 市場を、似たニーズをもつグループに分けることです。
    definition: 市場を、年齢、地域、価値観などの基準で、似たニーズをもつ顧客のグループ（セグメント）に分けること。STP 分析の最初の段階。
    related: [STP分析, ターゲティング, ポジショニング]
  - term: ターゲティング
    reading: たーげてぃんぐ
    simple: 分けた市場のうち、狙う対象のグループを選ぶことです。
    definition: セグメンテーションで分けた市場から、自社の強みを活かせる狙うべきセグメントを選ぶこと。
    related: [STP分析, セグメンテーション, ポジショニング]
  - term: ポジショニング
    reading: ぽじしょにんぐ
    simple: 狙った顧客に対して、競合と比べた自社の立ち位置を明確にすることです。
    definition: ターゲットとした顧客の心の中で、競合他社の製品と比べて自社の製品が独自の位置を占めるようにすること。
    related: [STP分析, セグメンテーション, ターゲティング]
  - term: 導入期
    reading: どうにゅうき
    simple: 製品を市場に投入した初期の段階で、認知度が低く、売上が小さい時期です。
    definition: プロダクトライフサイクルの最初の段階。製品の認知度が低く売上が小さい一方、広告費などがかかるため、利益は出にくい。
    related: [プロダクトライフサイクル, 成長期, 成熟期, 衰退期]
  - term: 成長期
    reading: せいちょうき
    simple: 売上が急に伸びる時期で、競合も増えてきます。
    definition: プロダクトライフサイクルで、認知度が高まり売上と利益が急速に伸びる段階。競合の参入も増える。
    related: [プロダクトライフサイクル, 導入期, 成熟期, 衰退期]
  - term: 成熟期
    reading: せいじゅくき
    simple: 売上の伸びが鈍り、市場が飽和して、競争が最も激しくなる時期です。
    definition: プロダクトライフサイクルで、市場が飽和して売上の伸びが鈍り、競争が最も激しくなる段階。利益は最大になるが、その後減少に向かう。
    related: [プロダクトライフサイクル, 成長期, 衰退期, ライフサイクルエクステンション]
  - term: 衰退期
    reading: すいたいき
    simple: 売上と利益が減っていく時期で、撤退を検討します。
    definition: プロダクトライフサイクルで、需要の減少により売上と利益が下降する段階。撤退や再活性化を検討する。
    related: [プロダクトライフサイクル, 成熟期]
  - term: ライフサイクルエクステンション
    reading: らいふさいくるえくすてんしょん
    simple: 新しい用途や機能の追加などで、製品の寿命を延ばす取組みです。
    definition: 新しい用途の提案、機能の改良、新市場の開拓などによって、成熟期にある製品の寿命を延ばす取組み。
    related: [プロダクトライフサイクル, 成熟期]
  - term: LPO
    reading: えるぴーおー
    fullName: Landing Page Optimization
    japanese: ランディングページ最適化
    words:
      - { en: Landing Page, ja: 最初に訪問者が到達するページ }
      - { en: Optimization, ja: 最適化 }
    simple: 広告などから最初に訪れるページを改善して、成果(購入や申込みなど)につながる割合を高めることです。
    definition: 検索結果や広告から訪問者が最初に到達するページ（ランディングページ）を改善し、コンバージョン率を高める取組み。
    related: [CVR]
  - term: プル戦略
    reading: ぷるせんりゃく
    simple: 広告などで消費者に直接働きかけて、消費者の側から商品を求めるように仕向ける戦略です。
    definition: 広告、広報などで消費者に直接働きかけ、消費者の購買意欲を高めて、小売店に商品を求めさせることで販売を促す戦略。プッシュ戦略と対比される。
    related: [プッシュ戦略, マーケティングミックス]
  - term: KMS
    reading: けーえむえす
    fullName: Knowledge Management System
    japanese: 知識管理システム
    words:
      - { en: Knowledge, ja: 知識 }
      - { en: Management, ja: 管理 }
      - { en: System, ja: システム }
    simple: 組織の知識を、蓄積、共有、活用するためのシステムです。
    definition: 組織内の知識やノウハウを蓄積、検索、共有するための情報システム。ナレッジマネジメントを支える。
    related: [ナレッジマネジメント, EIP]
  - term: EIP
    reading: いーあいぴー
    fullName: Enterprise Information Portal
    japanese: 企業内情報ポータル
    aliases: [企業内情報ポータル]
    words:
      - { en: Enterprise, ja: 企業 }
      - { en: Information, ja: 情報 }
      - { en: Portal, ja: 入口 }
    simple: 社内の情報やシステムの入口を、一つのWebページにまとめたものです。
    definition: 社内のさまざまな情報やアプリケーションに、1 つの Web 画面から利用者ごとにアクセスできるようにしたポータル。
    related: [ナレッジマネジメント, KMS]
