category: アルゴリズム
terms:
  - term: 線形探索
    reading: せんけいたんさく
    simple: 先頭から順に1つずつ調べていく、最も単純な探し方です。
    definition: 配列などの要素を先頭から順に調べ、目的の値と一致する要素を探す方法。整列されていないデータにも使えるが、要素数に比例する時間がかかる。挿入位置の探索など、走査しながら条件を判定する処理の基礎になる。
    related: [配列]
  - term: 累積
    reading: るいせき
    simple: 少しずつ足したり掛けたりして、値を積み上げていくことです。
    definition: 繰返しの中で、変数に現在の結果を持ち続け、新しい要素を足す・掛けるなどして更新していく処理の形。合計、積、個数の数え上げなどに使われ、初期値の置き方（和なら 0、積なら 1）が結果を左右する。
    related: [配列]
  - term: 2次元配列
    reading: にじげんはいれつ
    simple: 行と列の表の形にデータを並べたものです。
    definition: 添字を2つ使って要素を指定する配列で、行列や表の形のデータを表すのに使う。走査は行と列の二重ループが基本形であり、要素の総数は行数と列数の積になる。
    related: [配列]
