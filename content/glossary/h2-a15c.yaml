category: '15'
terms:
  - term: 展開
    reading: てんかい
    simple: 新しいシステムや変更を、実際に使う現場へ広げていくことです。
    definition: リリースしたサービスや変更を、利用する拠点や利用者の環境へ導入していくこと。全てを一度に切り替える方式と、拠点や対象を限って段階的に広げる方式があり、段階的な展開では、先行して導入した範囲で問題を洗い出し、得られた知見を残りの展開に反映できる。
    related: [リリース管理]
  - term: 配賦
    reading: はいふ
    simple: 共通の費用を、使う割合に応じて各部門に分け当てることです。
    definition: 共通のサービスにかかる費用を、利用量などの基準の比率に応じて、利用する部門ごとに割り振ること。費用の配賦によって、各部門がサービスの費用を把握でき、サービスの会計業務の基礎になる。
    related: [SLA]
  - term: 資産管理
    reading: しさんかんり
    simple: サービスで使う物やソフトウェアを、記録して管理することです。
    definition: ハードウェア、ソフトウェア、ライセンスなどの資産について、保有状況と利用状況を記録し、実態と照合して管理すること。特にソフトウェアでは、導入数とライセンスの保有数の不一致を是正し、契約に反する利用を防ぐことが重要な役割になる。
    related: [構成管理, CMDB]
  - term: ライセンス
    reading: らいせんす
    simple: ソフトウェアを使う権利と、その条件のことです。
    definition: ソフトウェアの著作権者から与えられる使用の許諾とその条件。導入できる台数や利用できる人数などの範囲が定められており、その範囲を超えた利用は契約違反になる。保有数と導入数の管理は、ソフトウェア資産管理の中心である。
    related: [資産管理]
  - term: サービス報告
    reading: さーびすほうこく
    simple: サービスの実績や改善の様子を、顧客に伝える報告です。
    definition: 提供したサービスの実績を顧客に報告すること。合意したサービスレベルの達成状況、障害の傾向、実施した改善と今後の改善計画などを含め、顧客がサービスの状態と見通しを判断できるようにする。サービスの報告は、継続的改善の対話の基礎になる。
    related: [SLA, サービスレベル管理]
