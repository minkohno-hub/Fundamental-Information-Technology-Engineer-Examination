category: アルゴリズムとプログラミング
terms:
  - term: ユークリッドの互除法
    reading: ゆーくりっどのごじょほう
    aliases: [互除法]
    simple: 割り算の余りを繰り返し求めて、2つの数の最大公約数を素早く求める方法です。
    definition: 整数 m を n で割った余りを r とすると gcd(m, n) ＝ gcd(n, r) が成り立つことを利用し、余りが 0 になるまで (m, n) を (n, r) に置き換えて最大公約数を求めるアルゴリズム。
    example: gcd(48, 18) → gcd(18, 12) → gcd(12, 6) → gcd(6, 0) ＝ 6。
    related: [最大公約数]
  - term: 最大公約数
    reading: さいだいこうやくすう
    simple: 2つ以上の整数のどれも割り切れる数のうち、最も大きい数です。
    definition: 複数の整数に共通する約数のうち最大のもの。ユークリッドの互除法で効率よく求められる。
    related: [ユークリッドの互除法, 最小公倍数]
  - term: 最小公倍数
    reading: さいしょうこうばいすう
    simple: 2つ以上の整数のどれでも割り切れる数のうち、最も小さい正の数です。
    definition: 複数の整数に共通する正の倍数のうち最小のもの。2数 m, n では m × n ÷ gcd(m, n) で求められる。
    related: [最大公約数]
  - term: 素数
    reading: そすう
    aliases: [素数判定, 試し割り]
    simple: 1 とその数自身でしか割り切れない、2 以上の整数です。
    definition: 1 と自分自身以外に正の約数をもたない 2 以上の整数。n が素数かどうかは、2 以上 √n 以下の整数で割り切れないことを調べて判定できる（試し割り）。
    related: [エラトステネスのふるい]
  - term: エラトステネスのふるい
    reading: えらとすてねすのふるい
    aliases: [エラトステネスの篩]
    simple: 小さい素数の倍数を順に消していき、残った数を素数とする方法です。
    definition: 2 から n までの数を並べ、残っている最小の数 p を素数として p × p 以降の p の倍数を消す操作を p × p ≦ n の間繰り返し、n 以下の素数を全て求めるアルゴリズム。計算量は O(n log log n)。
    related: [素数]
  - term: 階乗
    reading: かいじょう
    simple: 1 からその数までの整数を全て掛け合わせた値です。
    definition: 0 以上の整数 n に対して n! ＝ n × (n－1) × … × 1（0! ＝ 1）。再帰的に n! ＝ n × (n－1)! と定義でき、再帰の典型例として用いられる。
    related: [再帰]
  - term: ビット演算
    reading: びっとえんざん
    aliases: [シフト演算, ビットごとの論理演算]
    simple: データを 0 と 1 の並びとして扱い、各ビットごとに論理積・論理和などを計算したり、左右にずらしたりする演算です。
    definition: ビット列の対応するビットごとに論理積（∧）、論理和（∨）、排他的論理和（▽）などを行う演算と、ビット列を左右に移動するシフト演算（≪、≫）の総称。マスクとの論理積による特定ビットの取出しなどに用いる。
    related: [論理積, 排他的論理和, 論理シフト, ビットマスク]
  - term: 回文
    reading: かいぶん
    simple: 前から読んでも後ろから読んでも同じになる文字の並びです。
    definition: 文字列を逆順にしたものが元の文字列と一致するもの。先頭から i 番目と末尾から i 番目の文字を前半について比較して判定できる。
    example: racecar、しんぶんし。
  - term: 部分文字列
    reading: ぶぶんもじれつ
    aliases: [部分文字列探索]
    simple: 文字列の中の連続した一部分です。
    definition: 文字列のある位置から連続して取り出した文字の並び。ある文字列が別の文字列の部分文字列として現れる位置を求める処理を部分文字列探索（文字列照合）という。
    related: [文字列照合]
  - term: 累積和
    reading: るいせきわ
    aliases: [累積和配列]
    simple: 先頭から順に足していった途中までの合計を並べたものです。区間の合計を引き算1回で求められます。
    definition: 数列の先頭から各位置までの和を格納したもの。s[i＋1] ＝ s[i] ＋ data[i] で O(n) で求め、区間 l〜r の和を s[r＋1] － s[l] として O(1) で求められる。
    related: [配列]
  - term: 度数分布
    reading: どすうぶんぷ
    aliases: [度数分布表, ヒストグラム]
    simple: データをいくつかの区間（階級）に分け、それぞれに入るデータの個数を数えたものです。
    definition: データの値の範囲を階級に区切り、各階級に属するデータの個数（度数）をまとめたもの。これを棒グラフで表したものをヒストグラムという。
  - term: 多重ループ
    reading: たじゅうるーぷ
    aliases: [二重ループ, 入れ子のループ]
    simple: 繰返しの中にさらに繰返しが入っている構造です。
    definition: 繰返し処理の本体に別の繰返し処理を含む制御構造。外側 n 回、内側 m 回なら内側の本体は n × m 回実行される。整列や行列の計算でよく用いる。
    related: [繰返し処理]
  - term: マージ
    reading: まーじ
    aliases: [併合]
    simple: 並べ替え済みの2つのデータ列を、順序を保ったまま1つにまとめることです。
    definition: 整列済みの2つの列の先頭同士を比較し、小さい方を順に取り出して1つの整列済みの列を作る処理。マージソートの基本操作。
    related: [マージソート]
  - term: 剰余
    reading: じょうよ
    aliases: [剰余演算, 余り]
    simple: 割り算をしたときの余りです。擬似言語では mod で表します。
    definition: 整数 a を b で割ったときの余り。a mod b と書く。偶奇判定、桁の取出し、配列の循環利用などに用いる。
  - term: 整数除算
    reading: せいすうじょざん
    aliases: [切捨て除算]
    simple: 割り算の答えの小数点以下を切り捨てて、整数の商だけを求める計算です。
    definition: 整数同士の除算で商の小数点以下を切り捨てた整数を求める演算。n ÷ 10 で 10 進数の1の位を取り除くなど、剰余と組み合わせて桁の処理に使う。
    related: [剰余]
  - term: ピボット
    reading: ぴぼっと
    simple: クイックソートで、データを「小さいグループ」と「大きいグループ」に分ける基準にする値です。
    definition: クイックソートの分割処理で基準とする値。基準値より小さい要素と大きい要素に分け、基準値を両者の間に置く。選び方によって性能が変わる。
    related: [クイックソート]
  - term: 短絡評価
    reading: たんらくひょうか
    aliases: [ショートサーキット評価]
    simple: and や or で、左側だけで結果が決まるときに右側を計算しないことです。
    definition: 論理演算 A and B で A が偽のとき、A or B で A が真のときに B を評価しない評価方式。範囲外参照を防ぐため、範囲の確認を左側に書く。
  - term: リングバッファ
    reading: りんぐばっふぁ
    aliases: [循環バッファ]
    simple: 配列の最後の次を最初につなげて、輪のように使う入れ物です。
    definition: 固定長の配列の末尾の次を先頭とみなして循環的に使うデータ構造。先頭と末尾の位置を mod で進め、キューの実装に用いる。
    related: [キュー]
