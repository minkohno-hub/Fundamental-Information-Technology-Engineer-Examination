id: ref-business-strategy
title: 経営・技術戦略・ビジネスインダストリ
categories: ['19', '20', '21']
sections:
  - title: 経営戦略の分析手法
    body: |
      **SWOT 分析**：内部環境の強み（Strengths）・弱み（Weaknesses）と、外部環境の機会（Opportunities）・脅威（Threats）を分析します。

      **PPM（プロダクトポートフォリオマネジメント）**は市場成長率と市場占有率で事業を分類します。
      | 分類 | 市場成長率 | 占有率 | 方針 |
      |---|---|---|---|
      | 花形 | 高 | 高 | 投資して維持 |
      | 金のなる木 | 低 | 高 | 資金源とする |
      | 問題児 | 高 | 低 | 投資して育成するか判断 |
      | 負け犬 | 低 | 低 | 撤退を検討 |

      **その他**：3C 分析（顧客・競合・自社）、ファイブフォース分析（業界の競争要因）、バリューチェーン分析（価値を生む活動の分析）。

      **試験でのポイント**：PPM の4象限と軸の組合せが頻出です。
  - title: マーケティング
    body: |
      **4P**（売り手視点）：製品（Product）、価格（Price）、流通（Place）、販売促進（Promotion）。**4C** は買い手視点で、顧客価値、顧客コスト、利便性、コミュニケーションです。

      **STP**：セグメンテーション（市場の細分化）→ ターゲティング（狙う市場の決定）→ ポジショニング（自社の立ち位置の決定）。

      **製品ライフサイクル**：導入期 → 成長期 → 成熟期 → 衰退期。

      **価格戦略**：
      - スキミング価格戦略：初めに高価格で投入し、早期に利益を回収する
      - ペネトレーション価格戦略：低価格で投入し、市場シェアを素早く獲得する

      **試験でのポイント**：オピニオンリーダやアーリーアダプタなど、新製品の採用者の分類も問われます。
  - title: 経営管理と目標管理
    body: |
      **バランススコアカード（BSC）**は、財務、顧客、業務プロセス、学習と成長の4つの視点で業績を評価します。

      **KGI と KPI**：KGI（重要目標達成指標）は最終目標、KPI（重要業績評価指標）はその達成に向けた中間的な指標です。CSF（重要成功要因）は目標達成に決定的な影響を与える要因です。

      **コアコンピタンス**は、他社にまねできない自社の中核的な強みです。

      **アライアンス**：M&A（合併・買収）、ジョイントベンチャー、OEM（相手先ブランドでの生産）など。

      **試験でのポイント**：BSC の4視点の名前を正確に覚えておきます。
  - title: 技術戦略
    body: |
      **技術開発の障壁**：
      - 魔の川：研究から製品開発に進む際の障壁
      - 死の谷：製品開発から事業化に進む際の障壁
      - ダーウィンの海：事業化後、市場で生き残る際の障壁

      **イノベーション**：
      - プロダクトイノベーション：新しい製品を生み出す
      - プロセスイノベーション：製造工程などを革新する
      - オープンイノベーション：社外の知識や技術を積極的に取り入れる

      **イノベーションのジレンマ**は、優良企業が既存顧客を重視するあまり、破壊的イノベーションに対応できなくなる現象です。

      **技術ロードマップ**は、技術の将来の発展を時間軸で示した図です。

      **試験でのポイント**：3つの障壁の順序（魔の川 → 死の谷 → ダーウィンの海）を押さえます。
  - title: ビジネスインダストリ
    body: |
      **電子商取引**：B to B（企業間）、B to C（企業と消費者）、C to C（消費者間）。

      **IoT と製造**：
      - CAD：コンピュータを使った設計
      - CAM：設計データを用いた生産
      - FMS：多品種少量生産に柔軟に対応できる生産システム
      - JIT（ジャストインタイム）：必要なものを必要なときに必要な量だけ生産する
      - MRP：生産計画から必要な部品の量と時期を算出する

      **ロングテール**は、インターネット販売で売れ筋以外の多数の商品の売上合計が大きな割合を占める現象です。

      **その他**：POS（販売時点情報管理）、RFID（電波による非接触の識別）、フィンテック、シェアリングエコノミー。

      **試験でのポイント**：エスクローサービスは、取引の仲介者が代金を一時的に預かり、商品の受取り確認後に支払う仕組みです。
