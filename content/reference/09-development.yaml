id: ref-development
title: システム開発
categories: ['12', '13']
sections:
  - title: 開発プロセスと要件定義
    body: |
      システム開発の主な工程は「要件定義 → システム設計 → ソフトウェア設計 → 実装 → テスト → 導入・受入れ」です。共通フレーム（SLCP）は、開発や取引で用いる作業内容や用語を標準化した枠組みです。

      **要件の種類**：
      - 機能要件：システムが提供すべき機能
      - 非機能要件：性能、信頼性、セキュリティ、保守性など機能以外の要件

      **設計の考え方**：外部設計は利用者から見える部分（画面・帳票・インタフェース）を、内部設計は開発者から見た内部構造を設計します。

      **試験でのポイント**：「応答時間は3秒以内」は非機能要件の例です。
  - title: モジュール設計とオブジェクト指向
    body: |
      モジュールは**結合度を弱く、強度（凝集度）を強く**するのが望ましいとされます。

      - 結合度（弱い順）：データ結合 ＜ スタンプ結合 ＜ 制御結合 ＜ 外部結合 ＜ 共通結合 ＜ 内容結合
      - 強度（強い順）：機能的強度 ＞ 情報的強度 ＞ 連絡的強度 ＞ 手順的強度 ＞ 時間的強度 ＞ 論理的強度 ＞ 暗合的強度

      **オブジェクト指向**：
      | 概念 | 意味 |
      |---|---|
      | カプセル化 | データと手続きを一体化し、内部を隠蔽する |
      | 継承（汎化） | 上位クラスの性質を下位クラスが引き継ぐ |
      | 多相性（ポリモーフィズム） | 同じメッセージでもクラスに応じて異なる振る舞いをする |

      **UML** の主な図：クラス図、ユースケース図、シーケンス図、アクティビティ図、ステートマシン図。

      **試験でのポイント**：「is-a 関係」は汎化、「part-of 関係」は集約です。
  - title: テスト技法
    body: |
      **ブラックボックステスト**（仕様に基づく）：
      - 同値分割：入力を有効・無効の同値クラスに分け、各クラスの代表値でテストする
      - 限界値分析：同値クラスの境界の値とその前後をテストする

      **ホワイトボックステスト**（内部構造に基づく）：
      | 網羅基準 | 条件 |
      |---|---|
      | 命令網羅 | すべての命令を1回以上実行する |
      | 判定条件網羅（分岐網羅） | すべての分岐の真と偽を1回以上実行する |
      | 条件網羅 | 判定中の各条件の真と偽を1回以上実行する |
      | 複数条件網羅 | 各条件の真偽の全組合せを実行する |

      **テストの段階**：単体テスト → 結合テスト → システムテスト → 運用テスト（受入れテスト）。**回帰テスト（リグレッションテスト）**は、修正により他の部分に影響が出ていないかを確認します。

      **試験でのポイント**：結合テストのトップダウン方式ではスタブ、ボトムアップ方式ではドライバを使います。
  - title: レビューと品質
    body: |
      **レビュー技法**：
      - ウォークスルー：作成者が説明し、参加者が問題点を指摘する
      - インスペクション：モデレータが主導し、チェックリストなどで公式に検査する
      - ラウンドロビン：参加者が持ち回りでレビュー責任者を務める

      **ソフトウェア品質特性**（JIS X 25010 の製品品質モデル）：機能適合性、性能効率性、互換性、使用性、信頼性、セキュリティ、保守性、移植性。

      **バグ管理曲線（信頼度成長曲線）**：テストの経過とともに累積バグ数は増え、収束に近づくとS字曲線の傾きが小さくなります。

      **試験でのポイント**：ソフトウェアの規模見積りの手法として、ファンクションポイント法（外部入出力・ファイルなどの機能の数と複雑さから規模を見積もる）が出題されます。
  - title: 開発手法
    body: |
      | 手法 | 特徴 |
      |---|---|
      | ウォーターフォールモデル | 工程を順番に進め、原則として後戻りしない |
      | プロトタイピングモデル | 試作品を作って利用者に確認しながら進める |
      | スパイラルモデル | 設計・開発・評価を繰り返し、徐々に拡大する |
      | アジャイル開発 | 短い期間（イテレーション）で動くソフトウェアを繰り返しリリースする |

      **アジャイル**の代表的手法：
      - スクラム：プロダクトオーナー、スクラムマスター、開発者で構成し、スプリントという期間を繰り返す
      - XP（エクストリームプログラミング）：ペアプログラミング、テスト駆動開発、リファクタリング、継続的インテグレーションなどのプラクティスを持つ

      **DevOps** は開発と運用が協力し、迅速で継続的なリリースを目指す考え方です。

      **試験でのポイント**：リファクタリングは外部から見た動作を変えずに内部構造を改善することです。
  - title: 保守と知的財産の扱い
    body: |
      **リバースエンジニアリング**は既存のプログラムを解析して仕様や設計を明らかにすることです。**リエンジニアリング**はそれを基に再構築することです。

      **保守の種類**：是正保守（不具合の修正）、予防保守（潜在的な不具合を事前に修正）、適応保守（環境変化への対応）、完全化保守（性能や保守性の改善）。

      **構成管理**：成果物のバージョンや変更履歴を管理します。Git などのバージョン管理システムが使われます。

      **試験でのポイント**：プログラムの著作権は、契約で特段の定めがなければ、原則として実際に作成した側（請負なら受託者）に帰属します。
