id: ref-subject-b
title: 科目B対策
categories: ['B-ALG', 'B-SEC']
sections:
  - title: 擬似言語の読み方
    body: |
      科目B で使われる擬似言語の主な記法です。

      ```
      ○整数型: f(整数型: n)   // 手続・関数の宣言
        整数型: i, sum ← 0      // 変数の宣言と初期化
        for (i を 1 から n まで 1 ずつ増やす)
          sum ← sum + i
        endfor
        return sum
      ```

      - `←` は代入、`=` と `≠` は比較
      - `if ... elseif ... else ... endif` で条件分岐
      - `while (条件) ... endwhile`、`do ... while (条件)` で繰返し
      - `and`、`or`、`not` は論理演算
      - `mod` は剰余、`÷` は除算
      - 配列の要素番号は、問題に特に記述がなければ1から始まる
      - `{1, 2, 3}` は配列の初期化を表す

      **試験でのポイント**：問題冒頭の注記（配列の添字の開始、未定義の値など）を必ず確認します。
  - title: トレースの技法
    body: |
      **トレース表**を作り、変数の値の変化を1行ずつ記録するのが基本です。

      | 行 | i | sum | 条件 |
      |---|---|---|---|
      | 初期化 | − | 0 | |
      | 1回目 | 1 | 1 | i ≤ 3 真 |
      | 2回目 | 2 | 3 | i ≤ 3 真 |
      | 3回目 | 3 | 6 | i ≤ 3 真 |

      **コツ**：
      - 繰返しの「境界」（最初の1回と最後の1回）を重点的に確認する
      - 小さな入力値（n＝1、2 など）で試し、規則性をつかむ
      - 選択肢を空欄に当てはめ、具体例で結果が正しくなるかを検証する
      - 再帰呼出しは呼出しの深さごとに引数と戻り値を書き分ける

      **試験でのポイント**：時間配分のため、全体を読む前に「何を求めるプログラムか」を問題文から把握します。
  - title: 頻出アルゴリズム（探索・整列）
    body: |
      **2分探索**：
      ```
      low ← 1, high ← n
      while (low ≤ high)
        mid ← (low + high) ÷ 2 の商
        if (data[mid] = target) return mid
        elseif (data[mid] < target) low ← mid + 1
        else high ← mid − 1
        endif
      endwhile
      return −1
      ```

      **整列**：バブルソート（隣同士の交換を繰り返し、1パスごとに最大値が末尾に確定する）、選択ソート、挿入ソート、クイックソートの交換手順がよく出ます。

      **その他の頻出テーマ**：
      - 最大値・最小値の探索
      - 素数判定（2 から √n までで割り切れるか）
      - 最大公約数（ユークリッドの互除法）
      - 文字列の照合、配列の並べ替え
      - スタック・キュー・連結リストの操作
      - 2分木の走査、グラフの探索

      **試験でのポイント**：ループの終了条件の `<` と `≤` の違いで結果が変わるため、境界値を必ず確認します。
  - title: 頻出アルゴリズム（データ構造の操作）
    body: |
      **連結リストへの挿入**：新しい要素の次ポインタを挿入位置の次の要素に向けてから、前の要素の次ポインタを新しい要素に向けます。順序を逆にすると後ろのリストを見失います。

      **連結リストからの削除**：前の要素の次ポインタを、削除する要素の次の要素に付け替えます。

      **スタックを使う処理**：括弧の対応チェック、逆ポーランド記法の評価（数値は push、演算子は2つ pop して計算結果を push）。

      **キューを使う処理**：幅優先探索（始点から近い順に訪問する）。

      **ハッシュ表**：要素番号＝キーのハッシュ値（例：キー mod 表の大きさ ＋1）で格納位置を決め、衝突したら次の位置を調べるなどの処理を追います。

      **試験でのポイント**：ポインタ操作の問題は、図を描いて矢印を付け替えながら確認すると確実です。
  - title: セキュリティ事例問題の解き方
    body: |
      科目B の情報セキュリティ分野は、企業などの状況説明を読み、適切な対策や原因を選ぶ事例形式の問題です。

      **解き方の手順**：
      - 設問を先に読み、何を問われているか（原因、対策、リスク）を確認する
      - 本文から事実（何が起きたか、どんな対策が既にあるか）を抜き出す
      - 選択肢のうち、問題の原因に直接対応するものを選ぶ

      **頻出テーマと対策の対応**：
      | 事象 | 主な対策 |
      |---|---|
      | 標的型メール・マルウェア感染 | 不審な添付ファイルを開かない教育、端末のネットワークからの切り離し、OS やソフトの更新 |
      | パスワードの使い回し | 多要素認証、サイトごとに異なるパスワード |
      | 内部不正 | アクセス権の最小化、ログの取得と監視、職務の分離 |
      | 持出し PC の紛失 | ディスク暗号化、リモートワイプ |
      | Web アプリの脆弱性 | 入力値チェック、プレースホルダ、エスケープ処理 |

      **試験でのポイント**：一般論として正しくても、本文の状況に合わない選択肢は誤りです。本文に根拠がある選択肢を選びます。
