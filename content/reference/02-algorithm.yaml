id: ref-algorithm
title: アルゴリズムとプログラミング
categories: ['2']
sections:
  - title: 基本データ構造
    body: |
      | 構造 | 特徴 |
      |---|---|
      | 配列 | 添字で直接アクセス可能。途中への挿入・削除は要素の移動が必要 |
      | 連結リスト | ポインタでつなぐ。挿入・削除はポインタの付け替えだけで済むが、先頭からたどる必要がある |
      | スタック | 後入れ先出し（LIFO）。push／pop |
      | キュー | 先入れ先出し（FIFO）。enqueue／dequeue |

      スタックは関数呼出しの戻り先管理や逆ポーランド記法の評価に、キューは待ち行列や幅優先探索に使われます。

      **試験でのポイント**：push・pop の操作列を与えられたら、スタックの中身を1手ずつ書き出して追跡します。
  - title: 木構造
    body: |
      **2分木**は各節点が最大2つの子を持つ木です。**2分探索木**は「左の子孫＜節点＜右の子孫」が成り立つ木で、平衡していれば探索は O(log n) です。

      **ヒープ**は親の値が子の値以上（または以下）という条件を満たす完全2分木で、配列で表現できます。配列の添字を1から始めると、節点 i の子は 2i と 2i＋1、親は i÷2（切捨て）です。

      **走査順**：
      - 先行順（前順）：節点 → 左 → 右
      - 中間順（間順）：左 → 節点 → 右（2分探索木では昇順になる）
      - 後行順（後順）：左 → 右 → 節点

      **試験でのポイント**：2分探索木を中間順でたどると整列済みの列が得られることは頻出です。
  - title: 探索アルゴリズム
    body: |
      | 方法 | 前提 | 平均比較回数 | 計算量 |
      |---|---|---|---|
      | 線形探索 | なし | 約 n/2 | O(n) |
      | 2分探索 | 整列済み | 約 log₂n | O(log n) |
      | ハッシュ探索 | ハッシュ表 | 衝突がなければ1回 | O(1) |

      **番兵法**：線形探索で配列末尾に探索値を置くと、終了判定（範囲チェック）を省けます。

      **ハッシュ法**では異なるキーが同じハッシュ値になる**衝突（シノニム）**が起こります。対策としてオープンアドレス法やチェイン法があります。

      **試験でのポイント**：2分探索は中央の要素と比較して探索範囲を半分に絞ります。要素数が2倍になっても最大比較回数は1回しか増えません。
  - title: 整列アルゴリズム
    body: |
      | 方法 | 考え方 | 平均計算量 | 最悪計算量 |
      |---|---|---|---|
      | バブルソート | 隣同士を比較・交換 | O(n²) | O(n²) |
      | 選択ソート | 最小値を選んで先頭と交換 | O(n²) | O(n²) |
      | 挿入ソート | 整列済み部分に挿入 | O(n²) | O(n²) |
      | クイックソート | 基準値で分割し再帰 | O(n log n) | O(n²) |
      | マージソート | 分割して併合 | O(n log n) | O(n log n) |
      | ヒープソート | ヒープから最大値を取り出す | O(n log n) | O(n log n) |

      挿入ソートはほぼ整列済みのデータに対して高速です。マージソートは安定ですが、作業領域が必要です。

      **試験でのポイント**：各手法の1パス後の配列状態を問う問題が多いので、手でトレースできるようにします。
  - title: 再帰とプログラム構造
    body: |
      **再帰**は関数が自分自身を呼び出す手法です。必ず終了条件（基底）が必要です。階乗は `fact(n) = n × fact(n−1)`、`fact(0) = 1` と定義できます。

      プログラムの性質：
      - **再入可能（リエントラント）**：複数のタスクから同時に呼ばれても正しく動作する
      - **再使用可能**：一度実行した後、再ロードせずに再度実行できる
      - **再帰的**：実行中に自分自身を呼び出せる
      - **再配置可能**：主記憶上のどこに配置しても実行できる

      **引数の渡し方**：値呼出しは値のコピーを渡すため呼出し元の変数は変わりません。参照呼出しはアドレスを渡すため、呼出し先での変更が呼出し元に反映されます。

      **試験でのポイント**：再帰呼出しは、呼出しの深さごとに引数の値を表に書き出してトレースします。
  - title: 計算量とプログラム言語
    body: |
      **計算量（オーダ）**はデータ量 n に対する処理時間の増え方を表します。小さい順に O(1) ＜ O(log n) ＜ O(n) ＜ O(n log n) ＜ O(n²) ＜ O(2ⁿ) です。

      **言語処理系**：
      | 方式 | 特徴 |
      |---|---|
      | コンパイラ | ソース全体を目的プログラムに翻訳してから実行 |
      | インタプリタ | 1命令ずつ解釈しながら実行 |

      **マークアップ言語**：HTML は Web ページの構造記述、XML はタグを利用者が定義できる汎用データ記述言語です。データ交換には JSON もよく使われます。

      **試験でのポイント**：二重ループは O(n²)、探索範囲を毎回半分にする処理は O(log n) と判断できるようにします。
