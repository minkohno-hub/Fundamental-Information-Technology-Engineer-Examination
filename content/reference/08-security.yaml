id: ref-security
title: セキュリティ
categories: ['11']
sections:
  - title: 情報セキュリティの要素とリスク
    body: |
      **情報セキュリティの3要素（CIA）**：
      | 要素 | 意味 |
      |---|---|
      | 機密性 | 許可された者だけがアクセスできる |
      | 完全性 | 情報が正確で改ざんされていない |
      | 可用性 | 必要なときに利用できる |

      これに真正性、責任追跡性、否認防止、信頼性を加えることもあります。

      **リスクマネジメント**：リスクの特定 → 分析 → 評価 → 対応。リスク対応には次の4つがあります。
      - 回避：リスクの原因となる活動をやめる
      - 低減：対策を講じて発生確率や影響を減らす
      - 移転（共有）：保険や外部委託で他者に移す
      - 保有（受容）：対策をとらずに受け入れる

      **試験でのポイント**：「保険に加入する」は移転、「その業務をやめる」は回避です。
  - title: 主な攻撃手法
    body: |
      | 攻撃 | 内容 |
      |---|---|
      | SQL インジェクション | 入力欄に SQL 文を埋め込み、データベースを不正操作する |
      | クロスサイトスクリプティング | Web ページに悪意あるスクリプトを埋め込み、閲覧者のブラウザで実行させる |
      | CSRF | 利用者に意図しないリクエストを送信させる |
      | ブルートフォース攻撃 | パスワードを総当たりで試す |
      | パスワードリスト攻撃 | 他サイトから流出した ID とパスワードを使う |
      | DoS／DDoS 攻撃 | 大量の通信でサービスを妨害する |
      | 標的型攻撃 | 特定の組織を狙い、業務を装ったメールなどを送る |
      | ソーシャルエンジニアリング | 人の心理的な隙を突いて情報を盗む |

      **マルウェア**：ランサムウェア（データを暗号化して身代金を要求）、ワーム（自己増殖）、トロイの木馬（有用なソフトを装う）、ボット（外部から遠隔操作される）など。

      **試験でのポイント**：SQL インジェクションの対策はプレースホルダ（バインド機構）、XSS の対策は出力時のエスケープ処理です。
  - title: 暗号技術
    body: |
      | 方式 | 鍵 | 代表例 | 特徴 |
      |---|---|---|---|
      | 共通鍵暗号 | 暗号化と復号に同じ鍵 | AES | 高速。鍵の配送が課題 |
      | 公開鍵暗号 | 公開鍵と秘密鍵のペア | RSA、楕円曲線暗号 | 鍵配送が容易だが低速 |

      公開鍵暗号で機密性を確保するときは、**受信者の公開鍵**で暗号化し、受信者が自分の**秘密鍵**で復号します。

      共通鍵暗号で n 人が相互に通信するには n(n−1)/2 個の鍵が必要です。公開鍵暗号なら各人1組（計 2n 個）で済みます。

      **ハイブリッド暗号**は、データを共通鍵で暗号化し、その共通鍵を公開鍵暗号で送る方式で、TLS などで使われます。

      **試験でのポイント**：「誰の」「どちらの鍵」で暗号化・復号するかを正確に押さえます。
  - title: 認証技術
    body: |
      **ハッシュ関数**は任意長のデータから固定長の値（ハッシュ値）を生成します。同じハッシュ値を持つ別のデータを見つけることが困難なため、改ざん検知に使います。代表例は SHA-256 です。

      **デジタル署名**：送信者は、メッセージのハッシュ値を**自分の秘密鍵**で暗号化して署名を作ります。受信者は**送信者の公開鍵**で検証し、改ざんがないことと送信者本人であることを確認できます。

      **PKI**：認証局（CA）が公開鍵の持ち主を証明するデジタル証明書を発行します。失効した証明書は CRL（証明書失効リスト）で確認します。

      **利用者認証**：知識（パスワード）、所有物（IC カード、スマートフォン）、生体（指紋、顔）の3要素のうち2つ以上を組み合わせるのが**多要素認証**です。

      **試験でのポイント**：署名は送信者の秘密鍵、検証は送信者の公開鍵です。
  - title: セキュリティ対策と管理
    body: |
      **技術的対策**：
      - ファイアウォール：パケットの通過を IP アドレスやポート番号で制御する
      - WAF：Web アプリケーションへの攻撃を検知・遮断する
      - IDS／IPS：不正侵入を検知する（IDS）／検知して遮断する（IPS）
      - DMZ：外部と内部の間に設ける緩衝領域。公開サーバを置く
      - VPN：公衆網上に暗号化した仮想の専用線を作る

      **管理**：ISMS（情報セキュリティマネジメントシステム）は JIS Q 27001 で要求事項が規定され、PDCA サイクルで継続的に改善します。情報セキュリティ方針は組織の基本方針として経営者が定めます。

      **組織**：CSIRT はセキュリティインシデントに対応する組織です。

      **試験でのポイント**：Web サーバやメールサーバなど外部に公開するサーバは DMZ に置きます。
