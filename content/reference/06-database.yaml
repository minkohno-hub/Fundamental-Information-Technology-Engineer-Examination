id: ref-database
title: データベース
categories: ['9']
sections:
  - title: データベースの基本とキー
    body: |
      **3層スキーマ**：外部スキーマ（利用者から見た見え方）、概念スキーマ（論理構造）、内部スキーマ（物理的な格納方法）。

      **関係データベース**は表（関係）でデータを表し、行を**タプル**、列を**属性**と呼びます。

      **キー**：
      - 候補キー：行を一意に識別できる最小の属性の組
      - 主キー：候補キーから選んだ1つ。NULL 不可・重複不可
      - 外部キー：他の表の主キーを参照する属性。参照整合性を保つ

      **E-R 図**は実体（エンティティ）と関連（リレーションシップ）でデータ構造を表し、1対1、1対多、多対多の関係を示します。多対多の関係は、関係データベースでは連関エンティティ（中間の表）を設けて1対多に分解します。

      **試験でのポイント**：参照されている行を削除すると参照整合性制約に反する場合がある点が問われます。
  - title: 正規化
    body: |
      **正規化**はデータの重複をなくし、更新時の矛盾（更新時異状）を防ぐために表を分割することです。

      | 段階 | 条件 |
      |---|---|
      | 第1正規形 | 繰返し項目がない（すべての属性が単一値） |
      | 第2正規形 | 第1正規形で、主キーの一部に関数従属する属性（部分関数従属）がない |
      | 第3正規形 | 第2正規形で、主キー以外の属性に関数従属する属性（推移的関数従属）がない |

      **関数従属**：属性 A の値が決まると属性 B の値が一意に決まるとき、B は A に関数従属するといい、A→B と書きます。

      **試験でのポイント**：複合主キーの表で、キーの一部だけで決まる属性があれば第2正規形ではありません。正規化を進めると表の数は増え、検索時には結合が必要になります。
  - title: 関係演算と SQL の基本
    body: |
      **関係演算**：選択（条件に合う行を取り出す）、射影（指定した列を取り出す）、結合（共通の属性で表をつなぐ）。

      **SQL の基本形**：
      ```
      SELECT 列名 FROM 表名 WHERE 条件
        GROUP BY 列名 HAVING グループ条件
        ORDER BY 列名 DESC
      ```

      - WHERE は行を絞り込み、HAVING はグループ化後の結果を絞り込む
      - 集約関数：COUNT、SUM、AVG、MAX、MIN
      - DISTINCT：重複行を除く
      - LIKE：パターン一致。`%` は任意の0文字以上、`_` は任意の1文字
      - IN、BETWEEN、IS NULL も条件に使える

      **試験でのポイント**：NULL は `= NULL` ではなく `IS NULL` で判定します。COUNT(*) は NULL を含む行も数えますが、COUNT(列名) は NULL を数えません。
  - title: SQL の応用
    body: |
      **結合**：内部結合（INNER JOIN）は両方の表に一致する行のみ、左外部結合（LEFT OUTER JOIN）は左の表の全行を残し、一致しない部分は NULL になります。

      **副問合せ**：`WHERE 列 IN (SELECT ...)` のように問合せの中に問合せを書きます。外側の行ごとに内側を評価するものを相関副問合せといい、EXISTS とよく組み合わせます。

      **データ操作**：INSERT（追加）、UPDATE（更新）、DELETE（削除）。

      **データ定義**：CREATE TABLE で表を定義し、PRIMARY KEY、FOREIGN KEY、NOT NULL、UNIQUE、CHECK などの制約を指定します。CREATE VIEW でビュー（仮想表）を作成します。

      **権限**：GRANT で権限を付与し、REVOKE で取り消します。

      **試験でのポイント**：SQL の結果を問う問題は、表を手で書き、WHERE → GROUP BY → HAVING → SELECT → ORDER BY の順に処理すると確実です。
  - title: トランザクションと障害回復
    body: |
      **ACID 特性**：
      | 特性 | 意味 |
      |---|---|
      | 原子性（Atomicity） | すべて実行されるか、まったく実行されないか |
      | 一貫性（Consistency） | データの整合性が保たれる |
      | 独立性（Isolation） | 同時実行しても互いに影響しない |
      | 耐久性（Durability） | 確定した結果は障害後も失われない |

      **排他制御**：共有ロック（読取り用、他者の読取りは可）と専有ロック（更新用、他者は読み書き不可）。ロックの単位（粒度）が大きいと同時実行性が下がります。

      **障害回復**：
      - ロールバック：更新前ログでトランザクション開始前の状態に戻す（トランザクション障害）
      - ロールフォワード：バックアップに更新後ログを適用して復旧する（媒体障害）

      **試験でのポイント**：チェックポイント以降にコミット済みのトランザクションはロールフォワード、未コミットはロールバックの対象です。
  - title: データベースの応用
    body: |
      **データウェアハウス**は、業務システムのデータを時系列で蓄積し、分析に使うためのデータベースです。

      **データマイニング**は、大量のデータから統計的手法などで有用な規則性や傾向を発見することです。

      **ビッグデータ**の処理には、表形式にとらわれない **NoSQL**（キーバリュー型、ドキュメント型、グラフ型など）が使われます。

      **分散データベース**では、2相コミットによって複数サイトの更新の整合性を保ちます。第1相で全サイトにコミット可能かを問い合わせ、全サイトが可能と応答したら第2相でコミットを指示します。

      **試験でのポイント**：インデックスは検索を高速化しますが、更新時には索引の更新が必要になり処理負荷が増えます。
