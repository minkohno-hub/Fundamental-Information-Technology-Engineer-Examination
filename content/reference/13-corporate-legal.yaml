id: ref-corporate-legal
title: 企業活動・法務
categories: ['22', '23']
sections:
  - title: 企業活動と組織
    body: |
      **組織形態**：
      | 形態 | 特徴 |
      |---|---|
      | 職能別組織 | 営業・製造など機能ごとに編成。専門性が高まる |
      | 事業部制組織 | 製品や地域ごとに事業部を設け、独立採算で運営 |
      | マトリックス組織 | 職能と事業など2つの軸で編成。命令系統が2つになる |
      | プロジェクト組織 | 特定の目的のために一時的に編成する |

      **CSR（企業の社会的責任）**、**コーポレートガバナンス**（企業統治）、**コンプライアンス**（法令遵守）は企業経営の基本です。

      **人材育成**：OJT（職場で実務を通じて教育）と Off-JT（職場外での研修）。

      **試験でのポイント**：ステークホルダには株主、顧客、従業員、取引先、地域社会などが含まれます。
  - title: 業務分析とデータ活用
    body: |
      **QC 七つ道具**：
      - パレート図：項目を多い順に並べた棒グラフと累積比率の折れ線。重点項目を見つける（ABC 分析）
      - 特性要因図（フィッシュボーン）：結果と原因の関係を整理する
      - 散布図：2つの変数の相関を見る
      - ヒストグラム：データの分布を見る
      - 管理図：工程が安定しているかを管理限界線で判断する
      - チェックシート、層別

      **新 QC 七つ道具**には、親和図法、連関図法、系統図法、マトリックス図法、アローダイアグラム法、PDPC 法、マトリックスデータ解析法があります。

      **意思決定**：デシジョンツリー（期待値で比較）、線形計画法、ゲーム理論（マキシミン原理など）。

      **試験でのポイント**：「原因の洗い出し」は特性要因図、「重点の絞り込み」はパレート図です。
  - title: 会計・財務
    body: |
      **損益分岐点**：売上高と総費用が等しくなる売上高です。

      - 変動費率＝変動費÷売上高
      - 損益分岐点売上高＝固定費÷(1−変動費率)

      例：固定費 400万円、変動費率 0.6 なら損益分岐点売上高は 400÷0.4＝1,000万円です。

      **財務諸表**：
      | 諸表 | 内容 |
      |---|---|
      | 貸借対照表（B/S） | 一時点の資産・負債・純資産。資産＝負債＋純資産 |
      | 損益計算書（P/L） | 一定期間の収益・費用・利益 |
      | キャッシュフロー計算書 | 一定期間の現金の流れ |

      **利益の段階**：売上総利益 → 営業利益 → 経常利益 → 税引前当期純利益 → 当期純利益。

      **試験でのポイント**：在庫評価の先入先出法・移動平均法、減価償却の定額法・定率法の計算もよく出ます。
  - title: 知的財産権
    body: |
      | 権利 | 保護対象 | 権利の発生 |
      |---|---|---|
      | 著作権 | 思想・感情の創作的な表現 | 創作した時点（登録不要） |
      | 特許権 | 発明 | 出願・審査を経た登録 |
      | 実用新案権 | 物品の形状などの考案 | 登録 |
      | 意匠権 | 物品などのデザイン | 登録 |
      | 商標権 | 商品・サービスのマーク | 登録 |

      **著作権法とプログラム**：プログラムは著作物として保護されますが、プログラム言語、規約（プロトコル）、解法（アルゴリズム）は保護の対象外です。

      **不正競争防止法**は営業秘密を保護します。営業秘密の要件は、秘密管理性、有用性、非公知性の3つです。

      **試験でのポイント**：著作権は登録不要で発生、産業財産権（特許・実用新案・意匠・商標）は登録が必要です。
  - title: セキュリティ・労働関連の法規
    body: |
      **不正アクセス禁止法**：他人の ID・パスワードを無断で使用する行為、アクセス制御を回避する行為、他人の ID・パスワードを不正に提供する行為などを禁止します。

      **個人情報保護法**：個人情報取扱事業者に対し、利用目的の特定、本人の同意のない第三者提供の原則禁止、安全管理措置などを義務付けています。個人情報とは生存する個人に関する情報で、特定の個人を識別できるものです。

      **刑法**：ウイルス作成罪（不正指令電磁的記録に関する罪）、電子計算機使用詐欺罪などがあります。

      **労働関連**：労働基準法、労働者派遣法。

      **その他**：下請法（親事業者の禁止行為を規定）、PL法（製造物責任法）、電子帳簿保存法。

      **試験でのポイント**：不正アクセス禁止法は、アクセス制御機能を持つコンピュータへの、ネットワークを通じた不正な行為を対象としています。
  - title: 標準化
    body: |
      **標準化団体**：
      | 団体 | 内容 |
      |---|---|
      | ISO | 国際標準化機構 |
      | IEC | 国際電気標準会議（電気・電子分野） |
      | IEEE | 米国の電気・電子技術の学会。LAN 規格（802 シリーズ）など |
      | W3C | Web 技術の標準化 |
      | IETF | インターネット技術の標準化（RFC） |
      | JIS | 日本産業規格 |

      **主なマネジメントシステム規格**：ISO 9001（品質）、ISO 14001（環境）、ISO/IEC 27001（情報セキュリティ）。

      **コード**：JAN コード（商品識別のバーコード）、QR コード（2次元コード）。

      **試験でのポイント**：デファクトスタンダードは、公的機関ではなく市場で広く普及して事実上の標準になったものです。
