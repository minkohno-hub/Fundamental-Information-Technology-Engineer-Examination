id: ref-ui-media
title: ユーザーインタフェース・情報メディア
categories: ['7', '8']
sections:
  - title: ユーザーインタフェース設計
    body: |
      **GUI の部品**：
      | 部品 | 用途 |
      |---|---|
      | ラジオボタン | 複数の選択肢から1つだけ選ぶ |
      | チェックボックス | 複数を同時に選べる |
      | プルダウンメニュー | 選択肢を一覧から選ぶ（画面を節約できる） |
      | テキストボックス | 自由な文字列を入力する |

      **ユーザビリティ**は、特定の利用者が特定の状況で、有効さ・効率・満足度をもって目標を達成できる度合いです。

      **アクセシビリティ**は、高齢者や障害者を含め、誰もが情報やサービスを利用できることです。**ユニバーサルデザイン**は、はじめから多様な人が使えるように設計する考え方です。

      **試験でのポイント**：入力画面では、入力ミスを防ぐために選択式を用いる、初期値を設定する、エラー箇所を明示するといった工夫が問われます。
  - title: 帳票・画面設計と UX
    body: |
      画面設計の原則：
      - 操作方法や配置をシステム全体で統一する
      - 利用者の熟練度に合わせ、ショートカットキーなどを用意する
      - 処理に時間がかかるときは進捗を表示する
      - 誤操作を取り消せるようにする

      **UX（ユーザーエクスペリエンス）**は、製品やサービスを利用したときに得られる体験全体を指します。

      **人間中心設計**では、利用状況の把握 → 要求事項の明確化 → 設計案の作成 → 評価、を繰り返して改善します。

      **評価手法**：
      - ヒューリスティック評価：専門家が経験則に基づいて問題点を洗い出す
      - 思考発話法：利用者に考えていることを話しながら操作してもらう
      - アンケート：多数の利用者の満足度を集める

      **試験でのポイント**：コード設計では、桁数を短く、意味を持たせ、将来の追加に備えた余裕を持たせます。
  - title: マルチメディアと画像
    body: |
      **画像データ量**＝横の画素数×縦の画素数×1画素あたりのビット数。フルカラー（24ビット）なら1画素3バイトです。

      **色の表現**：
      - RGB（光の三原色）：ディスプレイ。すべて混ぜると白（加法混色）
      - CMY（色の三原色）：印刷。すべて混ぜると黒に近くなる（減法混色）。実際の印刷では黒（K）を加えて CMYK を使う

      **主なファイル形式**：
      | 形式 | 特徴 |
      |---|---|
      | JPEG | 静止画。非可逆圧縮。写真向き |
      | PNG | 静止画。可逆圧縮 |
      | GIF | 静止画。256色まで。アニメーション可 |
      | MPEG | 動画の圧縮規格 |
      | MP3 | 音声の非可逆圧縮 |

      **試験でのポイント**：解像度（dpi）とサイズからデータ量を求める計算が出ます。1インチ＝約2.54cm です。
  - title: 情報メディアの応用
    body: |
      **CG の技法**：
      - レンダリング：3次元データから画像を生成する
      - レイトレーシング：光線の経路を追跡して反射・屈折を表現する
      - アンチエイリアシング：斜線のギザギザ（ジャギー）を目立たなくする
      - テクスチャマッピング：物体の表面に模様や画像を貼り付ける

      **VR と AR**：VR（仮想現実）はコンピュータが作る仮想空間に入り込む技術、AR（拡張現実）は現実の映像に情報を重ねて表示する技術です。

      **ストリーミング**は、データを受信しながら再生する方式で、全体のダウンロード完了を待たずに視聴できます。

      **試験でのポイント**：可逆圧縮は元に完全に戻せる、非可逆圧縮は戻せないがデータ量を大きく減らせる、という区別が問われます。
  - title: 文字コード
    body: |
      | 文字コード | 特徴 |
      |---|---|
      | ASCII | 7ビットで英数字・記号を表す |
      | Shift_JIS | 日本語。英数字1バイト、漢字2バイト |
      | EUC-JP | 日本語。UNIX 系で使われた |
      | Unicode | 世界の文字を1つの体系で扱う |
      | UTF-8 | Unicode の符号化方式。ASCII 部分は1バイト、日本語の多くは3バイト |

      文字コードの解釈を誤ると、文字化けが発生します。

      **試験でのポイント**：UTF-8 は ASCII と互換性がある可変長の符号化方式です。
