id: ref-management
title: プロジェクト・サービスマネジメント・監査
categories: ['14', '15', '16']
sections:
  - title: プロジェクトマネジメントの基本
    body: |
      プロジェクトは、独自の成果を生み出すための**有期性**のある業務です。PMBOK はプロジェクトマネジメントの知識体系をまとめたガイドです。

      **WBS（Work Breakdown Structure）**は、プロジェクトの作業を階層的に細かく分解したもので、最下位の作業単位をワークパッケージといいます。

      **ステークホルダ**は、プロジェクトに関わる、または影響を受ける個人や組織です。

      **責任分担**：RACI チャートは作業ごとに、実行責任者（R）、説明責任者（A）、相談先（C）、報告先（I）を割り当てた表です。

      **試験でのポイント**：WBS はスコープ（作業範囲）を明確にするために作成します。
  - title: スケジュール管理
    body: |
      **アローダイアグラム（PERT 図）**で作業の順序関係と所要日数を表します。

      - 最早開始日：前の作業がすべて終わり、最も早く開始できる日。前から順に最大値をとって求める
      - 最遅開始日：全体の期間を延ばさずに、最も遅く開始できる日。後ろから順に最小値をとって求める
      - **クリティカルパス**：余裕（最遅−最早）が0の作業をつないだ経路。この経路の作業が遅れると全体が遅れる

      **期間短縮**：
      - クラッシング：資源を追加投入して期間を短縮する（コスト増）
      - ファストトラッキング：本来順番に行う作業を並行して行う（リスク増）

      **試験でのポイント**：クリティカルパスは最も所要日数の長い経路です。ダミー作業（点線）は所要日数0の順序関係を表します。
  - title: コスト管理と EVM
    body: |
      **EVM（アーンドバリューマネジメント）**は進捗とコストを金額で統一的に管理する手法です。

      | 指標 | 意味 |
      |---|---|
      | PV（計画価値） | 計画上、その時点までに完了すべき作業の予算 |
      | EV（出来高） | 実際に完了した作業の予算上の価値 |
      | AC（実コスト） | 実際に完了した作業にかかったコスト |

      - SV（スケジュール差異）＝EV−PV（負なら遅れ）
      - CV（コスト差異）＝EV−AC（負なら超過）
      - SPI＝EV÷PV（1未満なら遅れ）
      - CPI＝EV÷AC（1未満なら超過）

      **試験でのポイント**：EV を基準にして、PV と比べるとスケジュール、AC と比べるとコストの状況がわかります。
  - title: サービスマネジメント
    body: |
      **ITIL** は IT サービスマネジメントのベストプラクティス集です。**SLA（サービスレベル合意書）**はサービスの提供者と利用者の間で、サービスの内容と品質の目標値を合意した文書です。

      **主なプロセス**：
      | プロセス | 目的 |
      |---|---|
      | インシデント管理 | サービスをできるだけ早く通常の状態に回復する |
      | 問題管理 | インシデントの根本原因を突き止め、再発を防止する |
      | 変更管理 | 変更を管理された方法で評価・承認・実施する |
      | リリース管理及び展開管理 | 承認された変更を稼働環境に展開する |
      | 構成管理 | 構成品目（CI）の情報を正確に維持する |

      **サービスデスク**は利用者からの問合せの単一窓口（SPOC）です。

      **試験でのポイント**：インシデント管理は「回復の速さ」、問題管理は「根本原因の除去」が目的という区別が頻出です。
  - title: ファシリティマネジメントと事業継続
    body: |
      **ファシリティマネジメント**は、建物や設備などの施設を最適に保つ活動です。

      - UPS（無停電電源装置）：停電時に一時的に電力を供給する
      - 自家発電装置：長時間の停電に備える
      - サージ防護：落雷などによる過電圧から機器を保護する

      **BCP（事業継続計画）**は、災害などの緊急事態でも重要業務を継続または早期復旧するための計画です。

      - RTO（目標復旧時間）：どれだけの時間で復旧させるか
      - RPO（目標復旧時点）：どの時点のデータまで復旧させるか

      **試験でのポイント**：RPO を短くするにはバックアップの頻度を上げる必要があります。
  - title: システム監査
    body: |
      **システム監査**は、独立かつ専門的な立場のシステム監査人が、情報システムのガバナンス、マネジメント、コントロールを点検・評価し、助言や勧告を行うものです。

      **監査の流れ**：監査計画 → 予備調査 → 本調査 → 評価・結論 → 監査報告 → フォローアップ。

      - 監査人は監査対象から**独立**していなければならない
      - 結論は十分かつ適切な**監査証拠**に基づく
      - 改善の実施は監査人ではなく被監査部門が行う

      **内部統制**の基本的要素には、統制環境、リスクの評価と対応、統制活動、情報と伝達、モニタリング、IT への対応があります。

      **試験でのポイント**：監査証跡は、処理の過程を追跡できる記録（ログなど）です。職務の分離（開発者と運用者を分けるなど）は代表的な統制活動です。
