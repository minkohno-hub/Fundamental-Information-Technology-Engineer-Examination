id: ref-system-strategy
title: システム戦略・企画
categories: ['17', '18']
sections:
  - title: 情報システム戦略とEA
    body: |
      **情報システム戦略**は経営戦略に基づいて策定します。経営目標の達成に IT をどう活用するかを明確にし、全体最適化を図ります。

      **EA（エンタープライズアーキテクチャ）**は、組織全体の業務とシステムを統一的な手法でモデル化し、全体最適化を図る手法です。次の4つの体系で整理します。
      - ビジネスアーキテクチャ（業務）
      - データアーキテクチャ（データ）
      - アプリケーションアーキテクチャ（システム機能）
      - テクノロジアーキテクチャ（技術基盤）

      **IT ガバナンス**は、経営者が IT 活用の方針を示し、適切に統制する仕組みです。

      **試験でのポイント**：現状（As-Is）と理想（To-Be）を描き、その差を埋める計画を立てるのが EA の考え方です。
  - title: 業務プロセスの改善
    body: |
      **BPR（ビジネスプロセスリエンジニアリング）**は、業務プロセスを根本から見直し、抜本的に再設計することです。

      **BPM（ビジネスプロセスマネジメント）**は、業務プロセスを継続的に分析・改善する管理手法です。

      **業務のモデル化手法**：
      | 手法 | 内容 |
      |---|---|
      | DFD | データの流れと処理を表す |
      | E-R 図 | データの構造と関連を表す |
      | BPMN | 業務プロセスを図で表記する標準 |
      | UML アクティビティ図 | 処理の流れを表す |

      **RPA** は、PC 上の定型的な操作をソフトウェアロボットで自動化する技術です。

      **試験でのポイント**：BPR は「抜本的な再設計」、BPM は「継続的な改善」の違いを押さえます。
  - title: ソリューションビジネスとクラウド
    body: |
      **クラウドサービスの分類**：
      | 種類 | 提供範囲 |
      |---|---|
      | SaaS | アプリケーションまで提供 |
      | PaaS | アプリケーションの実行環境（OS・ミドルウェア）まで提供 |
      | IaaS | サーバやストレージなどの基盤を提供 |

      **その他のサービス形態**：
      - ASP：アプリケーションをネットワーク経由で提供する事業者
      - ハウジング：利用者のサーバを事業者の施設に設置する
      - ホスティング：事業者のサーバを貸し出す
      - アウトソーシング：業務の一部または全部を外部に委託する

      **システム活用**：SFA（営業支援）、CRM（顧客関係管理）、SCM（供給連鎖管理）、ERP（統合基幹業務システム）。

      **試験でのポイント**：IaaS → PaaS → SaaS の順に、利用者が管理する範囲は狭くなります。
  - title: システム企画と要件定義
    body: |
      **システム化構想・計画**：経営課題を踏まえてシステム化の目的や範囲、投資効果を明確にします。

      **投資評価**：
      - ROI（投資利益率）＝利益÷投資額×100（％）
      - 回収期間法：投資額を何年で回収できるか

      **要件定義**では、利用者の要求を整理し、業務要件・機能要件・非機能要件を明確にして、利害関係者の合意を得ます。

      **調達**：
      - RFI（情報提供依頼書）：ベンダに技術や製品の情報提供を依頼する
      - RFP（提案依頼書）：システムの要件を示してベンダに提案を依頼する
      - 提案書を評価基準に従って比較し、ベンダを選定する

      **試験でのポイント**：RFI は情報収集、RFP は提案依頼という順序（RFI → RFP → 提案書 → 選定 → 契約）を押さえます。
  - title: 契約形態
    body: |
      | 契約 | 完成責任 | 指揮命令 |
      |---|---|---|
      | 請負契約 | 受託者が成果物の完成責任を負う | 受託者 |
      | 準委任契約 | 完成責任はなく、業務の遂行に善管注意義務を負う | 受託者 |
      | 労働者派遣契約 | 完成責任なし | 派遣先 |

      請負契約で発注者が受託者の作業者に直接指揮命令を行うと、偽装請負とみなされるおそれがあります。

      **試験でのポイント**：派遣労働者に指揮命令するのは派遣先、雇用関係があるのは派遣元です。
