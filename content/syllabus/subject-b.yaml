# 科目Bの出題範囲（出典：IPA 試験要綱 Ver.5.6「科目Bの出題範囲（基本情報技術者試験）」2026年7月6日掲載）
# 分野別出題数（同要綱 注7）：アルゴリズムとプログラミング分野 16問、情報セキュリティ分野 4問（評価は20問中19問）
items:
  - id: B1
    area: ALG
    name: プログラミング全般
    desc: 要求仕様（入出力・処理・データ構造・アルゴリズム）の把握、擬似言語の仕様に基づく実装、既存プログラムの解読及び変更、処理の流れや変数の変化の想定、テスト、デバッグ及び修正方法の検討
  - id: B2
    area: ALG
    name: プログラムの処理の基本要素
    desc: 型、変数、配列、代入、算術演算、比較演算、論理演算、選択処理、繰返し処理、手続・関数の呼出し
  - id: B3
    area: ALG
    name: データ構造及びアルゴリズム
    desc: 再帰、スタック、キュー、木構造、グラフ、連結リスト、整列、文字列処理
  - id: B4
    area: ALG
    name: プログラミングの諸分野への適用
    desc: 数理・データサイエンス・AI などの分野を題材としたプログラム
  - id: B5
    area: SEC
    name: 情報セキュリティの確保
    desc: 情報セキュリティ要求事項の提示（物理的・技術的・組織的管理策）、マルウェアからの保護、バックアップ、ログ取得及び監視、情報の転送における情報セキュリティの維持、脆弱性管理、利用者アクセスの管理、運用状況の点検
